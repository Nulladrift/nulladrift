        {
          "name": "get_faq",
          "title": "eVoost AI frequently asked questions",
          "description": "Returns the official answers published on evoost.ai to frequently asked questions (data ownership, CRM integration, sales team role, markets, data protection), each with the page that shows it. Pass an optional query to filter by topic; page with limit and the returned nextCursor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Opaque cursor from the previous page's nextCursor; omit it for the first page.",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum number of answers to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional topic to filter questions, e.g. \"CRM\" or \"data\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "matched": {
                "description": "False when nothing matched the query and every answer is returned.",
                "type": "boolean"
              },
              "nextCursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Pass as cursor to get the next page; null on the last page."
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["items", "matched", "nextCursor", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "eVoost AI frequently asked questions"
