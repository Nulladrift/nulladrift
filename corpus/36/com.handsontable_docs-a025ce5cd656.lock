{
  "lockfileVersion": 2,
  "subjects": {
    "com.handsontable/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docs-assistant.handsontable.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "handsontable-docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Semantic search over the official Handsontable and HyperFormula documentation knowledge base — docs guides, code recipes, release notes, blog posts and GitHub issues, always for the latest release of each product. Results are ranked page-level snippets. `url` is null when a snippet has no public page (recipes, release notes, issues) — never fabricate a link for those. Scores are rank-only; do not apply absolute thresholds. Handsontable guides repeat once per framework (javascript/react/angular/vue), so request more results and dedupe on url/title when you need distinct documents.",
      "tools": [
        {
          "name": "search_docs",
          "title": "Search Handsontable/HyperFormula docs",
          "description": "Semantic (meaning-based) search over the Handsontable + HyperFormula documentation knowledge base — docs guides, code recipes, blog posts, release notes and GitHub issues. Returns ranked page-level snippets with title, content, relevance score, url and provenance (framework, kind, htVersion/hfVersion). `url` is null when no public page exists (recipes, releases, issues) — never fabricate a link. Scores are rank-only. Guides repeat once per framework (javascript/react/angular/vue) — dedupe on url/title when you need distinct documents. Pass ht_version/hf_version (your installed releases) to get an explicit coverage note when the KB documents a different version.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hf_version": {
                "description": "Your installed HyperFormula version (e.g. \"3.4.0\") — same coverage-note semantics.",
                "maxLength": 32,
                "type": "string"
              },
              "ht_version": {
                "description": "Your installed Handsontable version (e.g. \"18.1.0\") — adds an explicit coverage note when the KB documents a different minor.",
                "maxLength": 32,
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 8, max 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search terms or a natural-language question.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ce8d373d91b25dcee7a8d37fe303bee2e0dbd7f0a87d1fac3677599aed8c6b96"
        }
      ],
      "digest": "sha256:1b506da9be058ea51f1791f3c40d2787e5d78fa11f6bc33962c252a7a048664b"
    }
  }
}
