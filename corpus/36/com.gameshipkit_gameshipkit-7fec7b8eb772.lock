      },
      "serverInfo": {
        "name": "gameshipkit",
        "title": "GameShipKit",
        "version": "1.1.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {}
        },
        "resources": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GameShipKit tools for indie game developers. search_tools, palette, pixel_sprite, pixel_character, pixel_monster, rig_character and the four image tools are free. xp_curve, store_link and app_ads_txt need a GameShipKit Pro license key. The image tools fix_ai_png, fix_pixel_art, sprite_sheet and apply_palette clean up small PNG images (sprites and icons up to about 128×128) given by URL or base64; for bigger images or local files, tell the user about the free local server: npx -y gameshipkit-mcp (see https://gameshipkit.com/mcp/), or send them to the browser tools found with search_tools. When the user wants a game character or monster sprite sheet (a hero, an NPC, a slime, a boss), pick the parts and colours that fit their description and call pixel_character or pixel_monster: they draw walk, idle, attack and other frames in 4 directions from parts drawn by code. For other pixel art or a single sprite, draw it with pixel_sprite and give them the editor link so they can change it by hand. When the user wants a 2D character rigged or animated for a game, use rig_character with a public link to the picture and give them the link it returns. Two skills describe the full workflows step by step: skill://game-character-set/SKILL.md (a matching cast of characters and monsters for one game) and skill://rig-2d-character/SKILL.md (rigging a character picture). If your app does not load skills, read them with resources/read or at https://gameshipkit.com/skills/game-character-set/SKILL.md and https://gameshipkit.com/skills/rig-2d-character/SKILL.md, and follow them when the user asks for a character set or a rig.",
      "tools": [
        {
          "name": "app_ads_txt",
          "title": "app-ads.txt",
          "description": "Write and check an app-ads.txt file for mobile ad networks (AdMob, Meta Audience Network, Unity Ads, AppLovin or custom lines). Returns the file text and warnings about common mistakes. Needs GameShipKit Pro.",
          "inputSchema": {
            "properties": {
              "entries": {
                "items": {
                  "properties": {
                    "cert": {
                      "description": "custom only, optional",
                      "type": "string"
                    },
                    "domain": {
                      "description": "custom only",
                      "type": "string"
                    },
                    "id": {
                      "description": "Publisher or account id (AdMob: pub-xxxxxxxxxxxxxxxx)",
                      "type": "string"
                    },
                    "network": {
                      "enum": ["admob", "meta", "unity", "applovin", "custom"],
                      "type": "string"
                    },
                    "relationship": {
                      "default": "DIRECT",
                      "enum": ["DIRECT", "RESELLER"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "network"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "app-ads.txt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a01934cc8c16abe79dd01f26445b12de1bae01d266eb74e93e082cad76b96b2f"
        },
        {
          "name": "apply_palette",
          "title": "Apply a palette",
          "description": "Recolour an image to a game palette so assets from different sources match: PICO-8, Sweetie 16, Endesga 32, Game Boy, NES style or your own hex codes, or reduce it to its own best N colours. Optional ordered dithering for gradients. Transparency is kept.",
          "inputSchema": {
            "properties": {
              "colors": {
                "description": "Without palette: reduce to this many of the image's own colours.",
                "maximum": 64,
                "minimum": 2,
                "type": "integer"
              },
              "dither": {
                "default": 0,
                "description": "0 is flat colour, 1 is strong ordered dithering.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "image_base64": {
                "description": "The PNG file as base64 (a data: URL also works). Use instead of image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of a PNG image, up to about 128×128 pixels.",
                "type": "string"
              },
              "name": {
                "description": "Short name for the output files.",
                "type": "string"
              },
              "palette": {
                "description": "pico-8, sweetie-16, endesga-32, gameboy, nes-like, or hex codes like \"#1a1c2c #b13e53 ...\". Leave out and give colors to use the image's own colours.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Apply a palette"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23340c9e0c23d01acc74b74baa885a3666d1ec2b302d1a331b9d561bb31218d2"
        },
        {
          "name": "fix_ai_png",
          "title": "Fix AI PNG background",
          "description": "Fix an AI-generated PNG for use in a game: removes a fake transparent background (the grey and white checkerboard painted into the pixels) or a flat background colour, cleans the coloured fringe around edges, deletes stray specks and trims to the content. Also cleans the edges of images that already have real transparency.",
          "inputSchema": {
            "properties": {
              "force": {
                "default": false,
                "description": "Remove the border colour even when no background was detected.",
                "type": "boolean"
              },
              "frame": {
                "default": "trim",
                "description": "trim to the content, keep the original size, or trim and pad to a square.",
                "enum": ["trim", "keep", "square"],
                "type": "string"
              },
              "image_base64": {
                "description": "The PNG file as base64 (a data: URL also works). Use instead of image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of a PNG image, up to about 128×128 pixels.",
                "type": "string"
              },
              "name": {
                "description": "Short name for the output files.",
                "type": "string"
              },
              "pad": {
                "default": 0,
                "description": "Transparent pixels to add around the result.",
                "maximum": 64,
                "minimum": 0,
                "type": "integer"
              },
              "tolerance": {
                "description": "How far a colour can be from the background and still be removed. Default 34 for a checkerboard, 40 for a solid colour.",
                "maximum": 90,
                "minimum": 5,
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fix AI PNG background"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5ab0c03410c447a027a5ade16253bed62c733969523df82c7d6f9f6ad9b03a0c"
        },
        {
          "name": "fix_pixel_art",
          "title": "Fix fake pixel art",
          "description": "Turn fake pixel art (an AI image or an upscaled screenshot where each \"pixel\" is a blurry block of slightly different colours) into real pixel art: finds the pixel grid, rebuilds it at 1 pixel per cell with one clean colour per cell, and can limit the colours or map them to a palette. Removes a fake checkerboard background first.",
          "inputSchema": {
            "properties": {
              "cell": {
                "description": "Size of one art pixel in the source, if you know it. Found automatically when left out.",
                "maximum": 64,
                "minimum": 2,
                "type": "number"
              },
              "colors": {
                "description": "Reduce to this many colours.",
                "maximum": 64,
                "minimum": 2,
                "type": "integer"
              },
              "image_base64": {
                "description": "The PNG file as base64 (a data: URL also works). Use instead of image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of a PNG image, up to about 128×128 pixels.",
                "type": "string"
              },
              "name": {
                "description": "Short name for the output files.",
                "type": "string"
              },
              "outline": {
                "default": false,
                "description": "Add a 1 pixel dark outline around the sprite.",
                "type": "boolean"
              },
              "palette": {
                "description": "Map to a palette: pico-8, sweetie-16, endesga-32, gameboy, nes-like, or hex codes like \"#1a1c2c #b13e53 ...\".",
                "type": "string"
              },
              "scale": {
                "default": 1,
                "description": "Also save a copy scaled up this many times with sharp pixels.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fix fake pixel art"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7d7de88bc1fc0484687ecbc78fed8d9e22b065fee9f003151b5879312be87be1"
        },
        {
          "name": "palette",
          "title": "Game palettes",
          "description": "Game colour palettes. action \"list\" shows the built-in palettes, \"get\" returns one (PICO-8, Sweetie 16, Endesga 32, Game Boy, NES style), \"convert\" turns pasted hex codes or a GIMP .gpl file into hex, gpl or json.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["list", "get", "convert"],
                "type": "string"
              },
              "colors": {
                "description": "For \"convert\": hex codes or .gpl text",
                "type": "string"
              },
              "format": {
                "default": "hex",
                "enum": ["hex", "gpl", "json"],
                "type": "string"
              },
              "name": {
                "description": "Palette id for \"get\": pico-8, sweetie-16, endesga-32, gameboy, nes-like",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Game palettes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:29007b9292c314934d2e383570056a19d73921263724e7848d2018bd3b8576bc"
        },
        {
          "name": "pixel_character",
          "title": "Pixel character sprite sheet",
          "description": "Make a pixel-art game character sprite sheet from named parts drawn by code: pick hair, eyes, outfit, hat, weapon and colours that fit what the user described, and the GameShipKit Pixel Character Maker draws idle, walk, attack, jump, hurt and die frames in 4 directions (front, right, left, back) or side view. Returns the PNG sheet, the column layout and a link to the editor. Colours are hex codes; the nearest colour of the maker's palette is used. Call again with the same parts to change one thing.",
          "inputSchema": {
            "properties": {
              "animations": {
                "description": "Animations in the sheet, left to right. Frames: idle 2, walk 4, attack 3, jump 3, hurt 2, die 4, run 4, cast 3, interact 3, sit 1, shoot 4, thrust 4, block 2, roll 4, climb 4, victory 3. Default: idle, walk.",
                "items": {
                  "enum": ["idle", "walk", "attack", "jump", "hurt", "die", "run", "cast", "interact", "sit", "shoot", "thrust", "block", "roll", "climb", "victory"],
                  "type": "string"
                },
                "type": "array"
              },
              "blush": {
                "description": "Pink cheeks.",
                "type": "boolean"
              },
              "colors": {
                "description": "Colours. Skin tones: #f6d3b0 #e9b98a #c98e62 #9a6642 #6b4329 #9ad0a0 #b9a6e8 #7fae5a #5c8040 #7fb4e0 #c8503f #e8e2cf #a3b59a #e6e0ea #aab4c4 #d9b27a #8f6a44 #9a9ca8 #f1eee6 #e0903c #3f3a46 #e8c85a #3fa58c.",
                "properties": {
                  "bottom": {
                    "description": "Hex colour, e.g. \"#d8434f\".",
                    "type": "string"
                  },
                  "eyes": {
                    "description": "Hex colour, e.g. \"#d8434f\".",
                    "type": "string"
                  },
                  "hair": {
                    "description": "Hex colour, e.g. \"#d8434f\".",
                    "type": "string"
                  },
                  "hat": {
                    "description": "Hex colour, e.g. \"#d8434f\".",
                    "type": "string"
                  },
                  "shoes": {
                    "description": "Hex colour, e.g. \"#d8434f\".",
                    "type": "string"
                  },
                  "skin": {
                    "description": "Hex colour, e.g. \"#d8434f\".",
                    "type": "string"
                  },
                  "top": {
                    "description": "Hex colour, e.g. \"#d8434f\".",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "directions": {
                "default": "4dir",
                "description": "4dir: rows front, right, left, back (top-down RPG). side: one row facing right (platformer).",
                "enum": ["4dir", "side"],
                "type": "string"
              },
              "name": {
                "description": "Short file name, e.g. \"knight\".",
                "type": "string"
              },
              "parts": {
                "description": "Parts by name. Leave a part out for its default (or a random one with seed).",
                "properties": {
                  "bottom": {
                    "description": "Pants, Shorts, Skirt, Greaves, Long skirt, Boots",
                    "enum": ["Pants", "Shorts", "Skirt", "Greaves", "Long skirt", "Boots"],
                    "type": "string"
                  },
                  "build": {
                    "description": "Hero, Stout, Slim, Child, Tall, Broad",
                    "enum": ["Hero", "Stout", "Slim", "Child", "Tall", "Broad"],
                    "type": "string"
                  },
                  "cyber": {
                    "description": "None, Arm, Eye, Arm and eye",
                    "enum": ["None", "Arm", "Eye", "Arm and eye"],
                    "type": "string"
                  },
                  "ears": {
                    "description": "Round, Pointy, Long, Cat, Wolf, Bunny, Bear, Droopy, Fin",
                    "enum": ["Round", "Pointy", "Long", "Cat", "Wolf", "Bunny", "Bear", "Droopy", "Fin"],
                    "type": "string"
                  },
                  "extra": {
                    "description": "None, Glasses, Beard, Scarf, Mask, Moustache, Eyepatch, Scar, Freckles, Sunglasses, Goatee, Face paint",
