        {
          "name": "pixel_monster",
          "title": "Pixel monster sprite sheet",
          "description": "Make a pixel-art monster sprite sheet from named parts drawn by code: pick a body (slime, bat, ghost, golem, dragonling and more), eyes, mouth, horns, wings, tail, arms, pattern and colours that fit what the user described, and the GameShipKit Pixel Monster Maker draws idle, move, attack, hurt and die frames in 4 directions or side view. mood fills the parts you leave out (cute, scary or boss). Returns the PNG sheet, the column layout and a link to the editor.",
          "inputSchema": {
            "properties": {
              "animations": {
                "description": "Animations in the sheet, left to right. Frames: idle 2, move 4, attack 3, hurt 2, die 3, jump 3, charge 3, ranged 3, spawn 3. Default: idle, move.",
                "items": {
                  "enum": ["idle", "move", "attack", "hurt", "die", "jump", "charge", "ranged", "spawn"],
                  "type": "string"
                },
                "type": "array"
              },
              "blush": {
                "description": "Pink cheeks.",
                "type": "boolean"
              },
              "colors": {
                "properties": {
                  "glow": {
                    "description": "Eyes and aura glow colour, hex.",
                    "type": "string"
                  },
                  "main": {
                    "description": "Body colour, hex.",
                    "type": "string"
                  },
                  "second": {
                    "description": "Belly, horns and pattern colour, hex.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "directions": {
                "default": "4dir",
                "description": "4dir: rows front, right, left, back (top-down RPG). side: one row facing right (platformer).",
                "enum": ["4dir", "side"],
                "type": "string"
              },
              "mood": {
                "description": "Fill the parts and colours you did not set with ones that fit this mood.",
                "enum": ["cute", "scary", "boss"],
                "type": "string"
              },
              "name": {
                "description": "Short file name, e.g. \"knight\".",
                "type": "string"
              },
              "parts": {
                "description": "Parts by name. Leave a part out for its default, or set mood or seed to fill it at random.",
                "properties": {
                  "arms": {
                    "description": "None, Stubby arms, Claws, Tentacles",
                    "enum": ["None", "Stubby arms", "Claws", "Tentacles"],
                    "type": "string"
                  },
                  "body": {
                    "description": "Slime, Bat, Ghost, Eyeball, Mushroom, Spider, Golem, Plant, Skull, Dragonling, Wisp, Beast, Boar, Snake, Beetle, Bird, Fish, Crab, Mimic, Crystal, Cloud, Treant, Octopus, Imp, Cactus",
                    "enum": ["Slime", "Bat", "Ghost", "Eyeball", "Mushroom", "Spider", "Golem", "Plant", "Skull", "Dragonling", "Wisp", "Beast", "Boar", "Snake", "Beetle", "Bird", "Fish", "Crab", "Mimic", "Crystal", "Cloud", "Treant", "Octopus", "Imp", "Cactus"],
                    "type": "string"
                  },
                  "element": {
                    "description": "None, Fire, Ice, Poison, Lightning, Shadow",
                    "enum": ["None", "Fire", "Ice", "Poison", "Lightning", "Shadow"],
                    "type": "string"
                  },
                  "eyes": {
                    "description": "Round, Cute, Angry, Glowing, Cyclops, Three eyes, Sleepy, Many eyes, Cross",
                    "enum": ["Round", "Cute", "Angry", "Glowing", "Cyclops", "Three eyes", "Sleepy", "Many eyes", "Cross"],
                    "type": "string"
                  },
                  "mouth": {
                    "description": "None, Smile, Fangs, Big bite, Zigzag, Tiny, Tongue",
                    "enum": ["None", "Smile", "Fangs", "Big bite", "Zigzag", "Tiny", "Tongue"],
                    "type": "string"
                  },
                  "outline": {
                    "description": "Coloured, Black, None",
                    "enum": ["Coloured", "Black", "None"],
                    "type": "string"
                  },
                  "pattern": {
                    "description": "None, Spots, Stripes, Belly, Dark bottom, Scales",
                    "enum": ["None", "Spots", "Stripes", "Belly", "Dark bottom", "Scales"],
                    "type": "string"
                  },
                  "size": {
                    "description": "Small, Normal, Boss",
                    "enum": ["Small", "Normal", "Boss"],
                    "type": "string"
