        {
          "name": "sprite_sheet",
          "title": "Clean sprite sheet",
          "description": "Clean up an AI-made sprite sheet or a set of animation frames: removes the background, finds each frame, makes the character the same height in every frame, lines up the feet and the body, and packs everything into an even grid. Returns the sheet PNG and frame data (cell size, columns, rows, and a TexturePacker-style JSON).",
          "inputSchema": {
            "properties": {
              "anchor": {
                "default": "feet",
                "enum": ["feet", "center"],
                "type": "string"
              },
              "cell": {
                "description": "Square cell size in pixels. Default: fits the biggest frame.",
                "maximum": 1024,
                "minimum": 8,
                "type": "integer"
              },
              "columns": {
                "description": "Columns in the output sheet. Default: all frames in one row.",
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              },
              "grid": {
                "description": "If the frames sit in a regular grid, give it as \"COLSxROWS\", e.g. \"4x2\". Otherwise each frame is found on its own.",
                "type": "string"
              },
              "image_base64": {
                "description": "The PNG file as base64 (a data: URL also works). Use instead of image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of a PNG image, up to about 128×128 pixels.",
                "type": "string"
              },
              "match_colors": {
                "default": false,
                "description": "Pull the colours of every frame toward the first one.",
                "type": "boolean"
              },
              "name": {
                "description": "Short name for the output files.",
                "type": "string"
              },
              "pad": {
                "default": 2,
                "maximum": 32,
                "minimum": 0,
                "type": "integer"
              },
              "pixel_art": {
                "default": false,
                "description": "Scale with sharp pixels instead of smooth.",
                "type": "boolean"
              },
              "same_height": {
                "default": true,
                "description": "Scale frames so the body is the same height in each.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
