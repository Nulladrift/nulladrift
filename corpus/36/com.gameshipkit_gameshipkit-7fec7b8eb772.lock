{
  "lockfileVersion": 2,
  "subjects": {
    "com.gameshipkit/gameshipkit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gameshipkit.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "gameshipkit",
        "title": "GameShipKit",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GameShipKit tools for indie game developers. search_tools, palette, pixel_sprite, rig_character and the four image tools are free. xp_curve, store_link and app_ads_txt need a GameShipKit Pro license key. The image tools fix_ai_png, fix_pixel_art, sprite_sheet and apply_palette clean up small PNG images (sprites and icons up to about 128×128) given by URL or base64; for bigger images or local files, tell the user about the free local server: npx -y gameshipkit-mcp (see https://gameshipkit.com/mcp/), or send them to the browser tools found with search_tools. When the user asks for pixel art or a sprite, draw it with pixel_sprite and give them the editor link so they can change it by hand. When the user wants a 2D character rigged or animated for a game, use rig_character with a public link to the picture and give them the link it returns.",
      "tools": [
        {
          "name": "app_ads_txt",
          "title": "app-ads.txt",
          "description": "Write and check an app-ads.txt file for mobile ad networks (AdMob, Meta Audience Network, Unity Ads, AppLovin or custom lines). Returns the file text and warnings about common mistakes. Needs GameShipKit Pro.",
          "inputSchema": {
            "properties": {
              "entries": {
                "items": {
                  "properties": {
                    "cert": {
                      "description": "custom only, optional",
                      "type": "string"
                    },
                    "domain": {
                      "description": "custom only",
                      "type": "string"
                    },
                    "id": {
                      "description": "Publisher or account id (AdMob: pub-xxxxxxxxxxxxxxxx)",
                      "type": "string"
                    },
                    "network": {
                      "enum": ["admob", "meta", "unity", "applovin", "custom"],
                      "type": "string"
                    },
                    "relationship": {
                      "default": "DIRECT",
                      "enum": ["DIRECT", "RESELLER"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "network"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "app-ads.txt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a01934cc8c16abe79dd01f26445b12de1bae01d266eb74e93e082cad76b96b2f"
        },
        {
          "name": "apply_palette",
          "title": "Apply a palette",
          "description": "Recolour an image to a game palette so assets from different sources match: PICO-8, Sweetie 16, Endesga 32, Game Boy, NES style or your own hex codes, or reduce it to its own best N colours. Optional ordered dithering for gradients. Transparency is kept.",
          "inputSchema": {
            "properties": {
              "colors": {
                "description": "Without palette: reduce to this many of the image's own colours.",
                "maximum": 64,
                "minimum": 2,
                "type": "integer"
              },
              "dither": {
                "default": 0,
                "description": "0 is flat colour, 1 is strong ordered dithering.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "image_base64": {
                "description": "The PNG file as base64 (a data: URL also works). Use instead of image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of a PNG image, up to about 128×128 pixels.",
                "type": "string"
              },
              "name": {
                "description": "Short name for the output files.",
                "type": "string"
              },
              "palette": {
                "description": "pico-8, sweetie-16, endesga-32, gameboy, nes-like, or hex codes like \"#1a1c2c #b13e53 ...\". Leave out and give colors to use the image's own colours.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Apply a palette"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23340c9e0c23d01acc74b74baa885a3666d1ec2b302d1a331b9d561bb31218d2"
        },
        {
          "name": "fix_ai_png",
          "title": "Fix AI PNG background",
          "description": "Fix an AI-generated PNG for use in a game: removes a fake transparent background (the grey and white checkerboard painted into the pixels) or a flat background colour, cleans the coloured fringe around edges, deletes stray specks and trims to the content. Also cleans the edges of images that already have real transparency.",
          "inputSchema": {
            "properties": {
              "force": {
                "default": false,
                "description": "Remove the border colour even when no background was detected.",
                "type": "boolean"
              },
              "frame": {
                "default": "trim",
                "description": "trim to the content, keep the original size, or trim and pad to a square.",
                "enum": ["trim", "keep", "square"],
                "type": "string"
              },
              "image_base64": {
                "description": "The PNG file as base64 (a data: URL also works). Use instead of image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of a PNG image, up to about 128×128 pixels.",
                "type": "string"
              },
              "name": {
                "description": "Short name for the output files.",
                "type": "string"
              },
              "pad": {
                "default": 0,
                "description": "Transparent pixels to add around the result.",
                "maximum": 64,
                "minimum": 0,
                "type": "integer"
              },
              "tolerance": {
                "description": "How far a colour can be from the background and still be removed. Default 34 for a checkerboard, 40 for a solid colour.",
                "maximum": 90,
                "minimum": 5,
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fix AI PNG background"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5ab0c03410c447a027a5ade16253bed62c733969523df82c7d6f9f6ad9b03a0c"
        },
        {
          "name": "fix_pixel_art",
          "title": "Fix fake pixel art",
          "description": "Turn fake pixel art (an AI image or an upscaled screenshot where each \"pixel\" is a blurry block of slightly different colours) into real pixel art: finds the pixel grid, rebuilds it at 1 pixel per cell with one clean colour per cell, and can limit the colours or map them to a palette. Removes a fake checkerboard background first.",
          "inputSchema": {
            "properties": {
              "cell": {
                "description": "Size of one art pixel in the source, if you know it. Found automatically when left out.",
                "maximum": 64,
                "minimum": 2,
                "type": "number"
              },
              "colors": {
                "description": "Reduce to this many colours.",
                "maximum": 64,
                "minimum": 2,
                "type": "integer"
              },
              "image_base64": {
                "description": "The PNG file as base64 (a data: URL also works). Use instead of image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of a PNG image, up to about 128×128 pixels.",
                "type": "string"
              },
              "name": {
                "description": "Short name for the output files.",
                "type": "string"
              },
              "outline": {
                "default": false,
                "description": "Add a 1 pixel dark outline around the sprite.",
                "type": "boolean"
              },
              "palette": {
                "description": "Map to a palette: pico-8, sweetie-16, endesga-32, gameboy, nes-like, or hex codes like \"#1a1c2c #b13e53 ...\".",
                "type": "string"
              },
              "scale": {
                "default": 1,
                "description": "Also save a copy scaled up this many times with sharp pixels.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fix fake pixel art"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7d7de88bc1fc0484687ecbc78fed8d9e22b065fee9f003151b5879312be87be1"
        },
        {
          "name": "palette",
          "title": "Game palettes",
          "description": "Game colour palettes. action \"list\" shows the built-in palettes, \"get\" returns one (PICO-8, Sweetie 16, Endesga 32, Game Boy, NES style), \"convert\" turns pasted hex codes or a GIMP .gpl file into hex, gpl or json.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["list", "get", "convert"],
                "type": "string"
              },
              "colors": {
                "description": "For \"convert\": hex codes or .gpl text",
                "type": "string"
              },
              "format": {
                "default": "hex",
                "enum": ["hex", "gpl", "json"],
                "type": "string"
              },
              "name": {
                "description": "Palette id for \"get\": pico-8, sweetie-16, endesga-32, gameboy, nes-like",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Game palettes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:29007b9292c314934d2e383570056a19d73921263724e7848d2018bd3b8576bc"
        },
        {
          "name": "pixel_sprite",
          "title": "Pixel sprite to PNG and editor link",
          "description": "Turn pixel art written as text into a PNG, plus a link that opens it in the GameShipKit Pixel Art Editor so the user can keep editing it by hand. Each string in rows is one line of pixels, each character is one pixel and \".\" is transparent. colors maps each character to a hex colour. Use frames instead of rows for a short animation. Up to 64×64 pixels, 62 colours and 16 frames. Keep an outline and 3 to 16 colours for clean pixel art.",
          "inputSchema": {
            "properties": {
              "colors": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Character to colour, e.g. {\"k\": \"#1a1c2c\", \"r\": \"#b13e53\"}. \".\" is always transparent.",
                "type": "object"
              },
              "fps": {
                "default": 8,
                "description": "Playback speed for frames.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "frames": {
                "description": "For an animation: one rows list per frame, all the same size. Use instead of rows.",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "name": {
                "description": "Short file name, e.g. \"sword\".",
                "type": "string"
              },
              "rows": {
                "description": "One string per line of pixels, top to bottom, all the same length, e.g. [\"..kk..\", \".krrk.\", \"krrrrk\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "scale": {
                "default": 8,
                "description": "How many screen pixels per art pixel in the PNG.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["colors"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Pixel sprite to PNG and editor link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:601b2e711f4f0d508cbbc704c3bd4154e43222b6fcad7d69d181766f45a35d29"
        },
        {
          "name": "rig_character",
          "title": "Rig a 2D character",
          "description": "Rig and animate a 2D game character from one picture. Give a public link to the image (PNG, JPG or WebP, a full-body character, best on a plain or transparent background). Returns a link that opens the GameShipKit 2D Character Rigging tool with the character already loaded: it finds the joints, cuts a humanoid into parts, adds bones and plays the moves you ask for. From there the user can tweak joints and export. Free: the full preview and idle and walk sprite sheets. Pro: every other move, all moves at once, and Godot 4, Unity 2D Animation and Spine rigs.",
          "inputSchema": {
            "properties": {
              "animations": {
                "description": "Moves to play in the preview, in order. Default: idle, walk, attack, jump.",
                "items": {
                  "enum": ["idle", "walk", "run", "attack", "hit", "jump", "die", "cast", "shoot", "block", "dash", "crouch", "victory", "fly"],
                  "type": "string"
                },
                "type": "array"
              },
              "cut_parts": {
                "default": true,
                "description": "For humanoids: cut the picture into head, body, arms and legs so limbs bend at the joints.",
                "type": "boolean"
              },
              "facing": {
                "default": "right",
                "description": "Which way the character in the picture faces.",
                "enum": ["right", "left", "front"],
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) link to the character image.",
                "type": "string"
              },
              "name": {
                "description": "Short name for the exported files.",
                "type": "string"
              },
              "pixel_art": {
                "default": false,
                "description": "Keep sharp pixels for pixel art characters.",
                "type": "boolean"
              },
              "template": {
                "description": "Skeleton: humanoid (people, robots), quad (four legs), wing (birds, dragons, bats), snake (snakes, fish, worms), simple (slimes, plants, items). Found automatically when left out.",
                "enum": ["humanoid", "quad", "wing", "snake", "simple"],
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Rig a 2D character"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9fee61a614a93a4dd85232b59efc76f05375e93f042048637631f66505aff161"
        },
        {
          "name": "search_tools",
          "title": "Search GameShipKit tools",
          "description": "Search the GameShipKit catalogue of browser tools for game developers (sprites, AI art cleanup, audio, store assets, economy, dialogue, rigging and more). Returns names, short descriptions and links. Use it to point the user to the right tool for a task.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What the user wants to do, e.g. \"remove checkerboard background\" or \"seamless texture\". Leave empty to list everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search GameShipKit tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:11b93962cbe6218de1bd250bdc25e8f498319a642e04d165d069d0acfe7427d0"
        },
        {
          "name": "sprite_sheet",
          "title": "Clean sprite sheet",
          "description": "Clean up an AI-made sprite sheet or a set of animation frames: removes the background, finds each frame, makes the character the same height in every frame, lines up the feet and the body, and packs everything into an even grid. Returns the sheet PNG and frame data (cell size, columns, rows, and a TexturePacker-style JSON).",
          "inputSchema": {
            "properties": {
              "anchor": {
                "default": "feet",
                "enum": ["feet", "center"],
                "type": "string"
              },
              "cell": {
                "description": "Square cell size in pixels. Default: fits the biggest frame.",
                "maximum": 1024,
                "minimum": 8,
                "type": "integer"
              },
              "columns": {
                "description": "Columns in the output sheet. Default: all frames in one row.",
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              },
              "grid": {
                "description": "If the frames sit in a regular grid, give it as \"COLSxROWS\", e.g. \"4x2\". Otherwise each frame is found on its own.",
                "type": "string"
              },
              "image_base64": {
                "description": "The PNG file as base64 (a data: URL also works). Use instead of image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of a PNG image, up to about 128×128 pixels.",
                "type": "string"
              },
              "match_colors": {
                "default": false,
                "description": "Pull the colours of every frame toward the first one.",
                "type": "boolean"
              },
              "name": {
                "description": "Short name for the output files.",
                "type": "string"
              },
              "pad": {
                "default": 2,
                "maximum": 32,
                "minimum": 0,
                "type": "integer"
              },
              "pixel_art": {
                "default": false,
                "description": "Scale with sharp pixels instead of smooth.",
                "type": "boolean"
              },
              "same_height": {
                "default": true,
                "description": "Scale frames so the body is the same height in each.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Clean sprite sheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eab3e605b49e7412a1e884373093c09fce5f007d3b8327ac39edce73e61e38b8"
        },
        {
          "name": "store_link",
          "title": "Tracked store links",
          "description": "Build tracked store links for a game launch: Google Play (UTM inside the referrer parameter), App Store (campaign token ct and provider token pt), Steam or any web page. One link per traffic source. Needs GameShipKit Pro.",
          "inputSchema": {
            "properties": {
              "campaign": {
                "default": "launch",
                "type": "string"
              },
              "content": {
                "type": "string"
              },
              "provider_token": {
                "description": "App Store only: your pt value from App Store Connect",
                "type": "string"
              },
              "sources": {
                "description": "Traffic sources such as youtube, tiktok, reddit, discord, newsletter",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "store": {
                "enum": ["google_play", "app_store", "steam", "web"],
                "type": "string"
              },
              "target": {
                "description": "Package name or Play URL, App Store id or URL, Steam app id or URL, or a web URL",
                "type": "string"
              }
            },
            "required": ["sources", "store", "target"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Tracked store links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0df636abc7a488fde65a7114bdf9ee79a9d13149478ac4a130d7e7816296b771"
        },
        {
          "name": "xp_curve",
          "title": "XP curve",
          "description": "Make a level-up XP table for an RPG or idle game. Returns XP needed per level and in total, as a table or as ready-to-paste GDScript, C# or JSON. Needs GameShipKit Pro.",
          "inputSchema": {
            "properties": {
              "first_level_xp": {
                "default": 100,
                "description": "XP needed to go from level 1 to 2",
                "minimum": 1,
                "type": "number"
              },
              "format": {
                "default": "table",
                "enum": ["table", "gdscript", "csharp", "json"],
                "type": "string"
              },
              "growth": {
                "default": 1.15,
                "description": "Exponential: multiplier per level (1.1 to 1.25 is common). Polynomial: exponent (1.5 to 2.5 is common).",
                "maximum": 3,
                "minimum": 1,
                "type": "number"
              },
              "levels": {
                "default": 30,
                "maximum": 200,
                "minimum": 2,
                "type": "integer"
              },
              "round_to": {
                "default": 5,
                "minimum": 1,
                "type": "integer"
              },
              "style": {
                "default": "exponential",
                "enum": ["exponential", "polynomial", "linear"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "XP curve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3ec880caa7d1131d6980bf5f5b3a8f250b299d7fe005b4ac2ffe419a56c26f6c"
        }
      ],
      "digest": "sha256:187d96360ff9b5e6999f1d509171a9acff664869d44c250a42701d17a3ffaebe"
    }
  }
}
