{
  "lockfileVersion": 2,
  "subjects": {
    "com.gameshipkit/gameshipkit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gameshipkit.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "gameshipkit",
        "title": "GameShipKit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GameShipKit tools for indie game developers. search_tools, palette and pixel_sprite are free. xp_curve, store_link and app_ads_txt need a GameShipKit Pro license key. For image work (AI PNG cleanup, pixel art fixing, seamless textures, sprite sheet cutting, character customizers) send the user to the browser tools found with search_tools. When the user asks for pixel art or a sprite, draw it with pixel_sprite and give them the editor link so they can change it by hand.",
      "tools": [
        {
          "name": "app_ads_txt",
          "title": "app-ads.txt",
          "description": "Write and check an app-ads.txt file for mobile ad networks (AdMob, Meta Audience Network, Unity Ads, AppLovin or custom lines). Returns the file text and warnings about common mistakes. Needs GameShipKit Pro.",
          "inputSchema": {
            "properties": {
              "entries": {
                "items": {
                  "properties": {
                    "cert": {
                      "description": "custom only, optional",
                      "type": "string"
                    },
                    "domain": {
                      "description": "custom only",
                      "type": "string"
                    },
                    "id": {
                      "description": "Publisher or account id (AdMob: pub-xxxxxxxxxxxxxxxx)",
                      "type": "string"
                    },
                    "network": {
                      "enum": ["admob", "meta", "unity", "applovin", "custom"],
                      "type": "string"
                    },
                    "relationship": {
                      "default": "DIRECT",
                      "enum": ["DIRECT", "RESELLER"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "network"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "app-ads.txt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a01934cc8c16abe79dd01f26445b12de1bae01d266eb74e93e082cad76b96b2f"
        },
        {
          "name": "palette",
          "title": "Game palettes",
          "description": "Game colour palettes. action \"list\" shows the built-in palettes, \"get\" returns one (PICO-8, Sweetie 16, Endesga 32, Game Boy, NES style), \"convert\" turns pasted hex codes or a GIMP .gpl file into hex, gpl or json.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["list", "get", "convert"],
                "type": "string"
              },
              "colors": {
                "description": "For \"convert\": hex codes or .gpl text",
                "type": "string"
              },
              "format": {
                "default": "hex",
                "enum": ["hex", "gpl", "json"],
                "type": "string"
              },
              "name": {
                "description": "Palette id for \"get\": pico-8, sweetie-16, endesga-32, gameboy, nes-like",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Game palettes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:29007b9292c314934d2e383570056a19d73921263724e7848d2018bd3b8576bc"
        },
        {
          "name": "pixel_sprite",
          "title": "Pixel sprite to PNG and editor link",
          "description": "Turn pixel art written as text into a PNG, plus a link that opens it in the GameShipKit Pixel Art Editor so the user can keep editing it by hand. Each string in rows is one line of pixels, each character is one pixel and \".\" is transparent. colors maps each character to a hex colour. Use frames instead of rows for a short animation. Up to 64×64 pixels, 62 colours and 16 frames. Keep an outline and 3 to 16 colours for clean pixel art.",
          "inputSchema": {
            "properties": {
              "colors": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Character to colour, e.g. {\"k\": \"#1a1c2c\", \"r\": \"#b13e53\"}. \".\" is always transparent.",
                "type": "object"
              },
              "fps": {
                "default": 8,
                "description": "Playback speed for frames.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "frames": {
                "description": "For an animation: one rows list per frame, all the same size. Use instead of rows.",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "name": {
                "description": "Short file name, e.g. \"sword\".",
                "type": "string"
              },
              "rows": {
                "description": "One string per line of pixels, top to bottom, all the same length, e.g. [\"..kk..\", \".krrk.\", \"krrrrk\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "scale": {
                "default": 8,
                "description": "How many screen pixels per art pixel in the PNG.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["colors"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Pixel sprite to PNG and editor link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:601b2e711f4f0d508cbbc704c3bd4154e43222b6fcad7d69d181766f45a35d29"
        },
        {
          "name": "search_tools",
          "title": "Search GameShipKit tools",
          "description": "Search the GameShipKit catalogue of browser tools for game developers (sprites, AI art cleanup, audio, store assets, economy, dialogue, rigging and more). Returns names, short descriptions and links. Use it to point the user to the right tool for a task.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What the user wants to do, e.g. \"remove checkerboard background\" or \"seamless texture\". Leave empty to list everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search GameShipKit tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:11b93962cbe6218de1bd250bdc25e8f498319a642e04d165d069d0acfe7427d0"
        },
        {
          "name": "store_link",
          "title": "Tracked store links",
          "description": "Build tracked store links for a game launch: Google Play (UTM inside the referrer parameter), App Store (campaign token ct and provider token pt), Steam or any web page. One link per traffic source. Needs GameShipKit Pro.",
          "inputSchema": {
            "properties": {
              "campaign": {
                "default": "launch",
                "type": "string"
              },
              "content": {
                "type": "string"
              },
              "provider_token": {
                "description": "App Store only: your pt value from App Store Connect",
                "type": "string"
              },
              "sources": {
                "description": "Traffic sources such as youtube, tiktok, reddit, discord, newsletter",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "store": {
                "enum": ["google_play", "app_store", "steam", "web"],
                "type": "string"
              },
              "target": {
                "description": "Package name or Play URL, App Store id or URL, Steam app id or URL, or a web URL",
                "type": "string"
              }
            },
            "required": ["sources", "store", "target"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Tracked store links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0df636abc7a488fde65a7114bdf9ee79a9d13149478ac4a130d7e7816296b771"
        },
        {
          "name": "xp_curve",
          "title": "XP curve",
          "description": "Make a level-up XP table for an RPG or idle game. Returns XP needed per level and in total, as a table or as ready-to-paste GDScript, C# or JSON. Needs GameShipKit Pro.",
          "inputSchema": {
            "properties": {
              "first_level_xp": {
                "default": 100,
                "description": "XP needed to go from level 1 to 2",
                "minimum": 1,
                "type": "number"
              },
              "format": {
                "default": "table",
                "enum": ["table", "gdscript", "csharp", "json"],
                "type": "string"
              },
              "growth": {
                "default": 1.15,
                "description": "Exponential: multiplier per level (1.1 to 1.25 is common). Polynomial: exponent (1.5 to 2.5 is common).",
                "maximum": 3,
                "minimum": 1,
                "type": "number"
              },
              "levels": {
                "default": 30,
                "maximum": 200,
                "minimum": 2,
                "type": "integer"
              },
              "round_to": {
                "default": 5,
                "minimum": 1,
                "type": "integer"
              },
              "style": {
                "default": "exponential",
                "enum": ["exponential", "polynomial", "linear"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "XP curve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3ec880caa7d1131d6980bf5f5b3a8f250b299d7fe005b4ac2ffe419a56c26f6c"
        }
      ],
      "digest": "sha256:cc8e75dec2e9a4e37acebfcc6aef7d5d55edc2eb7c0fcdca1bb8e2e6df61bcb9"
    }
  }
}
