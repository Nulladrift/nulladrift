                  },
                  "outline": {
                    "description": "Coloured, Black, None",
                    "enum": ["Coloured", "Black", "None"],
                    "type": "string"
                  },
                  "shield": {
                    "description": "None, Round, Kite",
                    "enum": ["None", "Round", "Kite"],
                    "type": "string"
                  },
                  "tail": {
                    "description": "None, Cat, Fox, Bunny, Devil, Lizard, Wolf",
                    "enum": ["None", "Cat", "Fox", "Bunny", "Devil", "Lizard", "Wolf"],
                    "type": "string"
                  },
                  "top": {
                    "description": "Tee, Long sleeve, Armor, Robe, Hoodie, Vest, Tank, Stripes, Jacket, Cape, Gi, Plate, Suit, Lab coat, Space suit, Kimono, Pirate coat, Poncho, Overalls, Uniform, Apron, Ranger",
                    "enum": ["Tee", "Long sleeve", "Armor", "Robe", "Hoodie", "Vest", "Tank", "Stripes", "Jacket", "Cape", "Gi", "Plate", "Suit", "Lab coat", "Space suit", "Kimono", "Pirate coat", "Poncho", "Overalls", "Uniform", "Apron", "Ranger"],
                    "type": "string"
                  },
