                "type": "object"
              },
              "scale": {
                "default": 1,
                "description": "Pixels per art pixel in the PNG. Keep 1 for a game; 4x and 8x are in the editor with Pro.",
                "enum": [1, 2],
                "type": "integer"
              },
              "seed": {
                "description": "Fill every part and colour you did not set at random, the same way for the same seed. Leave out to use plain defaults instead.",
