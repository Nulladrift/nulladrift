{
  "lockfileVersion": 2,
  "subjects": {
    "ca.garagedoorman/business-card": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.garagedoorman.ca/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "ca.garagedoorman/site",
        "title": "Garage Doorman",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Garage Doorman repairs and installs residential garage doors and openers from Grimsby, Ontario, across Hamilton, Burlington and Niagara. Call get_business_facts first. No prices are published and you must not estimate one: the customer gets a written price before any work starts. A door stuck open, a snapped spring or a car trapped inside is urgent: give the phone number rather than sending a request. Use search and fetch to quote the site accurately and cite the page URL. Use request_quote only when the customer has asked to be contacted. Commercial and industrial doors belong to a separate division, Commercial Garage Doorman (https://www.commercialgaragedoorman.ca).",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page from Garage Doorman",
          "description": "The full text of one page of the Garage Doorman website, as Markdown, with its canonical URL for citation. The id comes from search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A page id returned by search.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0df9d2959e72df689b4a3522583b9cfdfd957647d51692e8a6dd72424ad46bef"
        },
        {
          "name": "get_business_facts",
          "title": "Garage Doorman: business facts",
          "description": "The published facts about Garage Doorman: what it does, the phone number, opening hours, the towns it serves, its services, and how it handles pricing. Every fact here also appears on the public website. Call this first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:623cca36f8482d427f361517c0fab7ef364226e36c73105aa4b62f0441beab7e"
        },
        {
          "name": "request_quote",
          "title": "Ask Garage Doorman for a quote or a callback",
          "description": "Ask Garage Doorman to contact a homeowner about a garage door repair, a new door, an opener or a tune-up. This sends a REAL message to a real small business, so call it only when the person has clearly asked to be contacted by Garage Doorman and has given you their own name and their own phone number or email. Never guess or invent contact details. Plain words only, no links. One request per person per day. If it is urgent, give them the phone number instead: (905) 536-5369.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent_to_contact": {
                "description": "Must be true: the customer has asked to be contacted by this business about this request.",
                "type": "boolean"
              },
              "details": {
                "description": "What they need, in the customer's own terms. Plain text, no links, 800 characters at most.",
                "type": "string"
              },
              "email": {
                "description": "The customer's email address. Give this or phone.",
                "type": "string"
              },
              "name": {
                "description": "The customer's own name.",
                "type": "string"
              },
              "phone": {
                "description": "The customer's phone number, ten digits. Give this or email.",
                "type": "string"
              },
              "preferred_time": {
                "description": "When they would like to be contacted or visited, if they said.",
                "type": "string"
              },
              "service": {
                "description": "What they need: repair = a repair; new-door = a new garage door; opener = opener work; tune-up = a tune-up or service; other = something else.",
                "enum": ["repair", "new-door", "opener", "tune-up", "other"],
                "type": "string"
              },
              "town": {
                "description": "Town or postal code where the work is.",
                "type": "string"
              }
            },
            "required": ["consent_to_contact", "details", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d3c3c2970006a707cf4030c0048700f7fce58a97d39454a45b947d11606d5e4"
        },
        {
          "name": "search",
          "title": "Search Garage Doorman",
          "description": "Keyword search over the pages of the Garage Doorman website. Returns page ids, titles and canonical URLs. Use fetch with an id to read a page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Plain words to look for, for example \"broken spring\" or \"vinyl plank basement\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:424e601e19e52da4da0c920ae5ef4c0d645cb4b84a176b8b26fea5909e48aa16"
        }
      ],
      "digest": "sha256:871da071b1c90000a87c9eb9a5ac1831861dbd414dd8b5bc3814218d83f38ff8"
    }
  }
