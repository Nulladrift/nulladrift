      "tools": [
        {
          "name": "cbam_cost",
          "description": "Answers questions like: what will CBAM cost me, how much are CBAM certificates, what does it cost to import steel or aluminium or cement into the EU, how much will CBAM cost in 2027 or 2030, do I have to pay CBAM on this shipment. Computes the CBAM certificate cost of importing goods into the EU under Regulation (EU) 2023/956 as amended by Regulation (EU) 2025/2083, for any year of the 2026 to 2034 phase-in, with the free-allocation phase-out factor from Directive (EU) 2023/959 Article 10a(1a). Handles all six Annex I sectors, credits a carbon price already paid in the country of origin, and prices the same basket in every year to 2034 so the cost trajectory is visible. Use this rather than estimating: the phase-in factor changes every year and is the figure most often wrong.",
          "inputSchema": {
            "properties": {
              "certificate_price_eur": {
                "description": "CBAM certificate price, which tracks the EU ETS auction price. Required: this server will not invent a market price.",
                "type": "number"
              },
              "lines": {
                "description": "The import lines.",
                "items": {
                  "properties": {
                    "cn_code": {
                      "type": "string"
                    },
                    "embedded_tco2e_per_tonne": {
                      "type": "number"
                    },
                    "origin": {
                      "type": "string"
                    },
                    "origin_carbon_price_eur_per_tonne": {
                      "type": "number"
                    },
                    "sector": {
                      "description": "One of: Cement | Fertilisers | Iron and steel | Aluminium | Hydrogen | Electricity",
                      "type": "string"
                    },
                    "tonnes": {
                      "type": "number"
                    }
                  },
                  "required": ["embedded_tco2e_per_tonne", "sector", "tonnes"],
                  "type": "object"
                },
                "type": "array"
              },
              "year": {
                "description": "2026 to 2034. Default 2026.",
                "type": "integer"
              }
            },
            "required": ["certificate_price_eur", "lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CBAM certificate cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98f75ebe525657ec2fe5b38cb6726c1ea2a5a272eec8e4b0a2fb71b5428713ca"
        },
        {
          "name": "csrd_scope",
          "description": "Answers questions like: does CSRD apply to my company, do we have to report under CSRD, when is our first CSRD report due, did the Omnibus postponement take us out of scope, does CSRD apply to a non-EU parent with EU subsidiaries, are we a large undertaking, which ESRS standard and what assurance level applies. Returns the verdict per financial year under Directive (EU) 2022/2464 as amended by the Stop-the-clock Directive (EU) 2025/794 and Omnibus I Directive (EU) 2026/470, with the size test and the third-country test shown separately.",
          "inputSchema": {
            "properties": {
              "balance_sheet_total_eur": {
                "description": "Balance sheet total in EUR.",
                "type": "number"
              },
              "employees": {
                "description": "Average employees during the financial year.",
                "type": "integer"
              },
              "established_in_eu": {
                "description": "Is the undertaking established in the EU? Default true. Set false to run the third-country test instead.",
                "type": "boolean"
              },
              "eu_subsidiary_turnover_eur": {
                "description": "Third-country test only: turnover of the EU subsidiary or branch.",
                "type": "number"
              },
              "group_eu_turnover_eur": {
                "description": "Third-country test only: group turnover generated in the EU, current year.",
                "type": "number"
              },
              "group_eu_turnover_prior_year_eur": {
                "description": "Third-country test only: the same figure for the prior year.",
                "type": "number"
              },
              "member_state_used_the_postponement_option": {
                "description": "Has the Member State used the Omnibus I option for financial years beginning 1 Jan 2025 to 31 Dec 2026? Default false.",
                "type": "boolean"
              },
              "net_turnover_eur": {
                "description": "Net turnover in EUR.",
                "type": "number"
              },
              "securities_listed_on_an_eu_regulated_market": {
                "description": "Listed on an EU regulated market. Default false.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CSRD scope and first reporting year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8609288db4c344b64d506748d3bd35ee28988e99b17036e35d2f3d429f3563fa"
        },
        {
          "name": "eu_ai_act_classify",
          "description": "Answers questions like: is my AI system high risk, does the EU AI Act apply to my chatbot or hiring tool, what are my obligations and when do they start, what is the fine if I get this wrong, is this banned under the AI Act. Classifies an AI system under Regulation (EU) 2024/1689 and returns the risk class, the obligation set with article numbers, the date the obligations apply, and the maximum fine. Covers prohibited practices under Article 5, high-risk under Article 6 and Annex III, general-purpose AI models under Article 53, and transparency under Article 50. Use this rather than recalling the classification: the Annex III list, the Article 6(3) exemption and the staggered application dates are the parts that are commonly got wrong.",
          "inputSchema": {
            "properties": {
              "annex_iii_use_case": {
                "description": "One of: None | 1(a) Remote biometric identification | 1(b) Biometric categorisation by sensitive attributes | 1(c) Emotion recognition | 2 Critical infrastructure safety component | 3(a) Education access or admission | 3(b) Evaluating learning outcomes | 3(c) Level of education | 3(d) Test monitoring | 4(a) Recruitment and selection | 4(b) Employment decisions and monitoring | 5(a) Public benefits eligibility | 5(b) Creditworthiness or credit scoring | 5(c) Life and health insurance pricing | 5(d) Emergency call triage | 6(a) to 6(e) Law enforcement | 7(a) to 7(d) Migration and border | 8(a) Justice | 8(b) Elections. Default None.",
                "type": "string"
              },
              "does_profiling": {
                "type": "boolean"
              },
              "exempt_under_article_6_3": {
                "description": "Falls in Annex III but does not pose significant risk.",
                "type": "boolean"
              },
              "general_purpose_model": {
                "type": "boolean"
              },
              "placed_on_market_before_cutoff": {
                "type": "boolean"
              },
              "prohibited_practice": {
                "description": "One of: None | 5(1)(a) Manipulative or deceptive techniques | 5(1)(b) Exploiting vulnerabilities | 5(1)(c) Social scoring | 5(1)(d) Predictive policing on profiling alone | 5(1)(e) Untargeted facial scraping | 5(1)(f) Workplace or school emotion inference | 5(1)(g) Sensitive biometric categorisation | 5(1)(h) Real-time remote biometric ID for law enforcement. Default None.",
                "type": "string"
              },
              "role": {
                "description": "Provider, Deployer, Importer or Distributor. Default Provider.",
                "type": "string"
              },
              "safety_component_article_6_1": {
                "description": "A safety component of a product covered by Union harmonisation legislation.",
                "type": "boolean"
              },
              "transparency_obligation_article_50": {
                "description": "Interacts with people, or generates synthetic content, deep fakes or emotion recognition.",
                "type": "boolean"
              },
              "worldwide_annual_turnover_eur": {
                "description": "Sets the fine ceiling, which is the greater of the fixed amount and a percentage of turnover.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "EU AI Act risk classification"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce862fe7444570a3d40741f13fc2c5f7f6c975278d716f9ae8621e6a97915bbf"
        },
        {
          "name": "uae_corporate_tax",
          "description": "Answers questions like: how much corporate tax will my Dubai or UAE company pay, do I qualify for Small Business Relief and is it worth electing, what is the UAE corporate tax rate on my profit, am I a Qualifying Free Zone Person, how much tax on AED 600,000 of profit, is my free zone income really 0 per cent. Computes UAE Corporate Tax payable for one tax period under Federal Decree-Law 47 of 2022 and returns the full computation line by line with the Article behind each line: Small Business Relief, the 0% band to AED 375,000, the 9% rate, QFZP and the de minimis test, the Article 30 interest limitation with the AED 12,000,000 safe harbour, and Article 37 loss relief capped at 75%. Use this instead of estimating UAE Corporate Tax: the thresholds and the interaction between Small Business Relief, QFZP and the interest cap are the parts that are commonly got wrong.",
          "inputSchema": {
            "properties": {
              "accounting_income": {
                "description": "Accounting income for the period, AED.",
                "type": "number"
              },
              "depreciation_and_amortisation": {
                "type": "number"
              },
              "elect_small_business_relief": {
                "description": "Whether the election under Article 21 is made. Default false, so you see the tax with and without it.",
                "type": "boolean"
              },
              "entertainment_expenditure": {
                "description": "50% is non-deductible, Article 32(1).",
                "type": "number"
              },
              "exempt_dividends": {
                "type": "number"
              },
              "fines_and_penalties": {
                "type": "number"
              },
              "foreign_tax_credit": {
                "type": "number"
              },
              "free_zone_person": {
                "type": "boolean"
              },
              "interest_carried_forward": {
                "type": "number"
              },
              "interest_expenditure": {
                "type": "number"
              },
              "interest_income": {
                "type": "number"
              },
              "is_bank_or_insurance": {
                "description": "Exempt from the Article 30 interest limitation.",
                "type": "boolean"
              },
              "meets_qualifying_income_conditions": {
                "type": "boolean"
              },
              "member_of_a_multinational_group": {
                "type": "boolean"
              },
              "non_qualifying_donations": {
                "type": "number"
              },
              "non_qualifying_revenue": {
                "description": "For the Free Zone de minimis test, AED.",
                "type": "number"
              },
              "other_exempt_income": {
                "type": "number"
              },
              "participation_exemption_income": {
                "type": "number"
              },
              "qualifying_income": {
                "description": "QFZP qualifying income, AED.",
                "type": "number"
              },
              "revenue": {
                "description": "Revenue for the period, AED. Small Business Relief needs this at or below 3,000,000.",
                "type": "number"
              },
              "revenue_exceeded_in_a_previous_period": {
                "type": "boolean"
              },
              "tax_losses_brought_forward": {
                "type": "number"
              },
              "tax_resident": {
                "description": "Resident Person. Default true.",
                "type": "boolean"
              }
            },
            "required": ["accounting_income"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "UAE Corporate Tax computation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da7308b574efe3663a03646f02ef81463c50cc74279348113c05adf74f8d17cf"
        }
      ],
