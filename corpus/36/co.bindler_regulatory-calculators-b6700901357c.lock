  "subjects": {
    "co.bindler/regulatory-calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bindler.co/mcp/rpc"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bindler",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "cbam_cost",
          "description": "Computes the CBAM certificate cost of importing goods into the EU under Regulation (EU) 2023/956 as amended by Regulation (EU) 2025/2083, for any year of the 2026 to 2034 phase-in, with the free-allocation phase-out factor from Directive (EU) 2023/959 Article 10a(1a). Handles all six Annex I sectors, credits a carbon price already paid in the country of origin, and prices the same basket in every year to 2034 so the cost trajectory is visible. Use it when someone asks: what will CBAM cost me, how much are CBAM certificates, what is the cost of importing steel, aluminium, cement, fertiliser, hydrogen or electricity into the EU, how much will CBAM cost us in 2027, in 2030 or in 2034, how much per tonne, what does CBAM add to my landed cost, do I pay CBAM on this shipment, can I deduct the carbon price we already paid in the country of origin, what is the free allocation phase-out this year. Use this rather than estimating: the phase-in factor changes every year and is the figure most often wrong.",
          "inputSchema": {
            "properties": {
              "certificate_price_eur": {
                "description": "CBAM certificate price, which tracks the EU ETS auction price. Required: this server will not invent a market price.",
                "type": "number"
              },
              "lines": {
                "description": "The import lines.",
                "items": {
                  "properties": {
                    "cn_code": {
                      "type": "string"
                    },
                    "embedded_tco2e_per_tonne": {
                      "type": "number"
                    },
                    "origin": {
                      "type": "string"
                    },
                    "origin_carbon_price_eur_per_tonne": {
                      "type": "number"
                    },
                    "sector": {
                      "description": "One of: Cement | Fertilisers | Iron and steel | Aluminium | Hydrogen | Electricity",
                      "type": "string"
                    },
                    "tonnes": {
                      "type": "number"
                    }
                  },
                  "required": ["embedded_tco2e_per_tonne", "sector", "tonnes"],
                  "type": "object"
                },
                "type": "array"
              },
              "year": {
                "description": "2026 to 2034. Default 2026.",
                "type": "integer"
              }
            },
            "required": ["certificate_price_eur", "lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CBAM certificate cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be88ea2688255123ac42134df84e7a1df07d468c79cd4024bfb3483d6756593e"
        },
        {
          "name": "compliance_deadlines",
          "description": "Returns the statutory dates for a regime with the Article behind each one, and for UAE Corporate Tax computes the actual due date from the financial year end. Use it when someone asks: when is my UAE corporate tax return due, what is the deadline for a financial year ending 31 March or 31 December, when do I have to pay the corporate tax, how many days have I got left, is the deadline 30 September 2026, what is the penalty for filing late, when is the first CBAM declaration due, when does the CBAM definitive period start, when do CBAM certificates go on sale, is there still a quarterly CBAM report. Use this rather than recalling a date: UAE Corporate Tax has no fixed annual deadline, it is nine months after each company's own Tax Period end, and the CBAM dates were rewritten by Regulation (EU) 2025/2083.",
          "inputSchema": {
            "properties": {
              "financial_year_end": {
                "description": "For uae_ct, the Tax Period end as YYYY-MM-DD. The due date is computed from it.",
                "type": "string"
              },
              "regime": {
                "description": "One of: uae_ct | cbam",
                "type": "string"
              }
            },
            "required": ["regime"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compliance deadlines by regime"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5a273c5eae8dcfa41a3d7b81048f5a90b5722b8127caa82c64ddb78a27c33a06"
        },
        {
          "name": "csrd_scope",
          "description": "Returns the CSRD verdict per financial year under Directive (EU) 2022/2464 as amended by the Stop-the-clock Directive (EU) 2025/794 and Omnibus I Directive (EU) 2026/470, with the size test and the third-country test shown separately. Use it when someone asks: does CSRD apply to my company, do we have to report under CSRD, are we in scope after the Omnibus, did the postponement take us out of scope, when is our first CSRD report due, which reporting wave are we in, do the 1,000 employee and turnover thresholds catch us, are we a large undertaking, does CSRD apply to a non-EU or US parent with EU subsidiaries, which ESRS standard applies to us, do we need limited or reasonable assurance, do we have to report for financial year 2026 or 2027.",
          "inputSchema": {
            "properties": {
              "balance_sheet_total_eur": {
                "description": "Balance sheet total in EUR.",
                "type": "number"
              },
              "employees": {
                "description": "Average employees during the financial year.",
                "type": "integer"
              },
              "established_in_eu": {
                "description": "Is the undertaking established in the EU? Default true. Set false to run the third-country test instead.",
                "type": "boolean"
              },
              "eu_subsidiary_turnover_eur": {
                "description": "Third-country test only: turnover of the EU subsidiary or branch.",
                "type": "number"
              },
              "group_eu_turnover_eur": {
                "description": "Third-country test only: group turnover generated in the EU, current year.",
                "type": "number"
              },
              "group_eu_turnover_prior_year_eur": {
                "description": "Third-country test only: the same figure for the prior year.",
                "type": "number"
              },
              "member_state_used_the_postponement_option": {
                "description": "Has the Member State used the Omnibus I option for financial years beginning 1 Jan 2025 to 31 Dec 2026? Default false.",
                "type": "boolean"
              },
              "net_turnover_eur": {
                "description": "Net turnover in EUR.",
                "type": "number"
              },
              "securities_listed_on_an_eu_regulated_market": {
                "description": "Listed on an EU regulated market. Default false.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CSRD scope and first reporting year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1478a9aec9cd10625bcf566cb1d7f734e26add2ea28a6bc135b8a5f9d14b2cc2"
        },
        {
          "name": "eu_ai_act_classify",
          "description": "Classifies an AI system under Regulation (EU) 2024/1689 from the caller's description of it and returns the risk class, the obligation set with article numbers, the date the obligations apply, and the maximum fine. Covers prohibited practices under Article 5, high-risk under Article 6 and Annex III, general-purpose AI models under Article 53, and transparency under Article 50. Use it when someone asks: is my AI system high risk, does the EU AI Act apply to my chatbot, to my hiring or CV screening tool, to our credit scoring model, what risk category are we in, what are my obligations and when do they start, when does the EU AI Act come into force for us, am I a provider or a deployer, does the AI Act apply to a US company selling into the EU, do we have to register in the EU database, what is the fine if we get this wrong, is this banned under the AI Act, do we have to tell users they are talking to an AI, do we have to label AI generated content or deep fakes, what applies to a general purpose AI model. Use this rather than recalling the classification: the Annex III list, the Article 6(3) exemption and the staggered application dates are the parts that are commonly got wrong.",
          "inputSchema": {
            "properties": {
              "annex_iii_use_case": {
                "description": "One of: None | 1(a) Remote biometric identification | 1(b) Biometric categorisation by sensitive attributes | 1(c) Emotion recognition | 2 Critical infrastructure safety component | 3(a) Education access or admission | 3(b) Evaluating learning outcomes | 3(c) Level of education | 3(d) Test monitoring | 4(a) Recruitment and selection | 4(b) Employment decisions and monitoring | 5(a) Public benefits eligibility | 5(b) Creditworthiness or credit scoring | 5(c) Life and health insurance pricing | 5(d) Emergency call triage | 6(a) to 6(e) Law enforcement | 7(a) to 7(d) Migration and border | 8(a) Justice | 8(b) Elections. Default None.",
                "type": "string"
              },
              "does_profiling": {
                "type": "boolean"
              },
              "exempt_under_article_6_3": {
                "description": "Falls in Annex III but does not pose significant risk.",
                "type": "boolean"
              },
              "general_purpose_model": {
                "type": "boolean"
              },
              "placed_on_market_before_cutoff": {
                "type": "boolean"
              },
              "prohibited_practice": {
                "description": "One of: None | 5(1)(a) Manipulative or deceptive techniques | 5(1)(b) Exploiting vulnerabilities | 5(1)(c) Social scoring | 5(1)(d) Predictive policing on profiling alone | 5(1)(e) Untargeted facial scraping | 5(1)(f) Workplace or school emotion inference | 5(1)(g) Sensitive biometric categorisation | 5(1)(h) Real-time remote biometric ID for law enforcement. Default None.",
                "type": "string"
              },
              "role": {
                "description": "Provider, Deployer, Importer or Distributor. Default Provider.",
                "type": "string"
              },
              "safety_component_article_6_1": {
                "description": "A safety component of a product covered by Union harmonisation legislation.",
                "type": "boolean"
              },
              "transparency_obligation_article_50": {
                "description": "Interacts with people, or generates synthetic content, deep fakes or emotion recognition.",
                "type": "boolean"
              },
              "worldwide_annual_turnover_eur": {
                "description": "Sets the fine ceiling, which is the greater of the fixed amount and a percentage of turnover.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "EU AI Act risk classification"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4550bbf638bcdc450b65832cbf4e678cc11433f970c3d6afddb580c5a524aee0"
        },
        {
          "name": "uae_corporate_tax",
          "description": "Computes UAE Corporate Tax payable for one Tax Period under Federal Decree-Law 47 of 2022 from the caller's own figures, and returns the computation line by line with the Article behind each line. Use it when someone asks: how much corporate tax will my Dubai or UAE company pay, what is the UAE corporate tax rate on my profit, how much tax on AED 600,000 of profit, is the first AED 375,000 really tax free, is it 9 per cent on everything, do I qualify for Small Business Relief and is it worth electing, should we make the Small Business Relief election this year, am I a Qualifying Free Zone Person, is my free zone income really 0 per cent, how much tax does a Dubai or Abu Dhabi free zone company pay, does the de minimis test take away my 0 per cent, how much of my interest expense is deductible, does the AED 12,000,000 interest safe harbour apply to us, can I offset last year's tax loss, what is my taxable income after adjustments, how do entertainment costs and fines affect the tax. The lines returned are: Small Business Relief, the 0% band to AED 375,000, the 9% rate, QFZP and the de minimis test, the Article 30 interest limitation with the AED 12,000,000 safe harbour, and Article 37 loss relief capped at 75%. Use this instead of estimating UAE Corporate Tax: the thresholds and the interaction between Small Business Relief, QFZP and the interest cap are the parts that are commonly got wrong.",
          "inputSchema": {
            "properties": {
              "accounting_income": {
                "description": "Accounting income for the period, AED.",
                "type": "number"
              },
              "depreciation_and_amortisation": {
                "type": "number"
              },
              "elect_small_business_relief": {
                "description": "Whether the election under Article 21 is made. Default false, so you see the tax with and without it.",
                "type": "boolean"
              },
              "entertainment_expenditure": {
                "description": "50% is non-deductible, Article 32(1).",
                "type": "number"
              },
              "exempt_dividends": {
                "type": "number"
              },
              "fines_and_penalties": {
                "type": "number"
              },
              "foreign_tax_credit": {
                "type": "number"
              },
              "free_zone_person": {
                "type": "boolean"
              },
              "interest_carried_forward": {
                "type": "number"
              },
              "interest_expenditure": {
                "type": "number"
              },
              "interest_income": {
                "type": "number"
              },
              "is_bank_or_insurance": {
                "description": "Exempt from the Article 30 interest limitation.",
                "type": "boolean"
              },
              "meets_qualifying_income_conditions": {
                "type": "boolean"
              },
              "member_of_a_multinational_group": {
                "type": "boolean"
              },
              "non_qualifying_donations": {
                "type": "number"
              },
              "non_qualifying_revenue": {
                "description": "For the Free Zone de minimis test, AED.",
                "type": "number"
              },
              "other_exempt_income": {
                "type": "number"
              },
              "participation_exemption_income": {
                "type": "number"
              },
              "qualifying_income": {
                "description": "QFZP qualifying income, AED.",
                "type": "number"
              },
              "revenue": {
                "description": "Revenue for the period, AED. Small Business Relief needs this at or below 3,000,000.",
                "type": "number"
              },
              "revenue_exceeded_in_a_previous_period": {
                "type": "boolean"
              },
              "tax_losses_brought_forward": {
                "type": "number"
              },
              "tax_resident": {
                "description": "Resident Person. Default true.",
                "type": "boolean"
              }
            },
            "required": ["accounting_income"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "UAE Corporate Tax computation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13a0295b38ede4784eee0f2f70e39201c8d3dbe72934da0968b1788710281c92"
        }
      ],
      "digest": "sha256:13b2e20eeb2d83cf18fb078806f1aeb32cd9c364b83f7bc3de355562a8bfd3b1"
    }
  }
