{
  "lockfileVersion": 2,
  "subjects": {
    "com.entityfeed/companies": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://entityfeed.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "entityfeed",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_company",
          "title": "Get one company by ID",
          "description": "Fetch one company from the official register of the given country by its ID. Returns the unified record with status, address, legal form, activities, `source` and `retrieved_at`. Slovak legal persons come from a copy of the register that is updated every day: then `source.snapshot_date` is set and `retrieved_at` is the date of the newest batch applied. Other Slovak entries are fetched live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "SK = Slovakia (RPO), CZ = Czechia (ARES).",
                "enum": ["SK", "CZ"],
                "type": "string"
              },
              "id": {
                "description": "Company ID in the register of the given country.",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d98dce76c2d22077c3fc3cb28966534b3bc77a97130b0f8b4799c14bb75ccd6d"
        },
        {
          "name": "search_company",
          "title": "Search companies by name or ID",
          "description": "Search official company registers by name, or by company ID. Returns up to 10 matches in one unified schema, each with `source` and `retrieved_at`. Slovak legal persons come from a copy of the register that is updated every day: those records have `source.snapshot_date`, and `retrieved_at` is the date of the newest batch applied. Use get_company for the detail of a single company.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "SK = Slovakia (RPO), CZ = Czechia (ARES).",
                "enum": ["SK", "CZ"],
                "type": "string"
              },
              "include_inactive": {
                "default": false,
                "description": "SK only: also return terminated entities.",
                "type": "boolean"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of results.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Company name (or part of it) or an ID.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9cb5c7b4578d222fe1f12a4b6d48350cd6537e8ffbb42cbc887b6c9c2edb0f24"
        }
      ],
      "digest": "sha256:efc412366da7bfeded3d9450f84cade8c4a4a34ed6088b8996ad446dd19d8fc1"
    }
  }
}
