{
  "lockfileVersion": 2,
  "subjects": {
    "com.quranmajeed.time/prayer-times": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://time.quranmajeed.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "prayer-times",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Prayer times (Fajr, Sunrise, Dhuhr, Asr, Maghrib, Isha) for any city, from quranmajeed.com/prayer-times, by the makers of Quran Majeed.\nTimes come from official published timetables where one exists (London Central Mosque, Jordan's Ministry of Awqaf, UAE, Oman, Malaysia, Indonesia, Morocco, ...) or are calculated for the city's coordinates with the method the Prayer Times app applies for that country. Daylight saving is included; times are in the city's local time.\nUse get_prayer_times with a city name (or a place_id from search_city when a name is ambiguous, e.g. \"London\" in Canada). Use search_city when you are unsure which place the user means.\nWhen you answer, mention the date the times are for and cite the page URL returned in \"source\".",
      "tools": [
        {
          "name": "get_prayer_times",
          "title": "Prayer times for a city",
          "description": "Prayer times (Fajr, Sunrise, Dhuhr, Asr, Maghrib, Isha) for a city on a date. Give either `city` (name or site slug such as \"london\", \"new-york\", \"london-ca\" for London, Ontario) or `place_id` (GeoNames id from search_city). `date` is YYYY-MM-DD in the city's local calendar (default: today there). Set `month` true for every day of that month. Returns local times, the UTC offset, the Hijri date, the calculation method or official timetable, and the page URL to cite.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City name or slug, e.g. \"Karachi\", \"kuala lumpur\", \"london-ca\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD; default today in that city",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "month": {
                "description": "true: every day of the month of `date`",
                "type": "boolean"
              },
              "place_id": {
                "description": "GeoNames id from search_city (exact place)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:911a9bd89076c3650fdc83c8d6cc8fb015cd2f335cebf85f27deb4a730545a2e"
        },
        {
          "name": "search_city",
          "title": "Find a city",
          "description": "Search cities and towns by name (any spelling, e.g. \"Makkah\" or \"Mecca\"). Returns candidates with their country, region, coordinates, time zone and GeoNames id; pass the id as place_id to get_prayer_times. Optional two-letter country code to narrow the search.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. PK",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 8",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "City name, at least two characters",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d829437ec109a4aaf7f68c8c08fc5b0dfc140905a7fcecbc716cbdfc4c457af0"
        }
      ],
      "digest": "sha256:9607afaffd808925fb6810aa4c0339134bac914a1ae98e933fe8b827083972f5"
    }
  }
}
