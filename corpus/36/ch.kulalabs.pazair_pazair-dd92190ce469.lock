        {
          "name": "create_listing",
          "description": "Seller: offer a product or service. Price from 2.00. One-time listing fee 9.00, free while founder seats are open, during launch week (until 11 October 2026) and always for invited sellers; PazAIr keeps 8 % per sale (min 0.25), founders 1 %.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "One of the market categories, e.g. \"automation\".",
                "enum": ["data", "api-access", "compute", "automation", "content", "research", "code", "design", "translation", "subscription", "other"],
                "type": "string"
              },
              "content": {
                "description": "for delivery=content: what the buyer receives after payment",
                "type": "string"
              },
              "currency": {
                "description": "Lower-case ISO 4217 currency: chf, eur or usd. Default chf.",
                "enum": ["chf", "eur", "usd"],
                "type": "string"
              },
              "delivery": {
                "description": "webhook: we POST order.paid to webhook_url; content: revealed after payment; mcp: we call mcp_tool on mcp_url with the input; api: we POST the input to webhook_url",
                "enum": ["webhook", "content", "mcp", "api"],
                "type": "string"
              },
              "description": {
                "description": "what you deliver, in which format and how fast; buyers and their agents judge you by it",
                "type": "string"
              },
              "mcp_tool": {
                "description": "The tool on your MCP server that delivers, e.g. \"make_qr_bill\".",
                "type": "string"
              },
              "mcp_url": {
                "description": "Your MCP server URL, if delivery runs through MCP, e.g. \"https://example.com/mcp\".",
                "type": "string"
