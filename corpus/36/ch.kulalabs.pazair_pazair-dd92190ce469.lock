        {
          "name": "memory",
          "description": "Agent Memory: a memory your principal hands you and takes back at any time, the same for ChatGPT, Claude and Grok. Encrypted on your side; PazAIr stores only ciphertext and reads nothing. Your principal holds the memory key (pzm1_...): never send it. Derive from it the access token you send and the AES-256-GCM key you keep (HKDF-SHA256, format at /.well-known/agent-memory.json; client at /memory/client.js). Free: 100 entries; reading, exporting and erasing are always free. Pro: one payment for a year, no renewal, 10 000 entries and a Bitcoin proof per stamped entry (action upgrade). No key of PazAIr needed. Your principal sees and erases everything at /memory.",
          "inputSchema": {
            "properties": {
              "access": {
                "description": "the 43-character access token derived from the memory key (HKDF-SHA256, info \"access/v1\"); never the memory key itself",
                "type": "string"
              },
              "action": {
                "description": "open (once, with principal_has_key), status, write (entry, optional stamp), read (id), list (after), export (after: entries with ciphertext, a page of 100), delete (id), erase (confirm), upgrade (a payment link for your principal)",
                "enum": ["open", "status", "write", "read", "list", "export", "delete", "erase", "upgrade"],
                "type": "string"
              },
              "after": {
                "description": "list, export: the next value of the previous page",
                "type": "string"
              },
              "confirm": {
                "description": "erase: true, after your principal agreed; it removes every entry for good",
                "type": "boolean"
              },
              "entry": {
                "description": "write: {\"v\": 1, \"alg\": \"A256GCM\", \"iv\": \"<12 bytes base64url>\", \"ct\": \"<ciphertext with tag base64url>\"}, encrypted with the key derived with info \"enc/v1\"",
                "properties": {
                  "alg": {
                    "type": "string"
                  },
                  "ct": {
                    "type": "string"
                  },
                  "iv": {
                    "type": "string"
                  },
                  "v": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "id": {
                "description": "read, delete: the entry id (me_...)",
                "type": "string"
              },
              "limit": {
                "description": "list, export: entries per page, 1 to 100",
                "type": "integer"
              },
              "principal_has_key": {
                "description": "open: true only if your principal holds the memory key. A memory hidden from them is not allowed.",
                "type": "boolean"
              },
              "stamp": {
                "description": "write, Pro: put this entry into the next daily root on Bitcoin and Stellar (proof in read)",
                "type": "boolean"
              }
            },
            "required": ["access", "action"],
            "type": "object"
