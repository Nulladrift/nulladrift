        {
          "name": "buy",
          "description": "Buyer: start a purchase; returns pay_url for your principal. dry_run: true and the sandbox need no key. First time? Try listing_id \"ls_sandbox\" with test: true: the whole flow without money.",
          "inputSchema": {
            "properties": {
              "because": {
                "description": "optional, free: why you buy (SPEC 20). PazAIr signs it before the delivery and the receipt names it, so your principal sees why (why_order). {goal: your principal's task in a sentence (only its sha256 is kept), gap: cannot | unsure | cheaper | faster | asked | second_opinion, considered: [listing ids you compared], chose_for: [word_pass | price | contract | speed | only_offer | asked], step: {n, of}, enough: {orders, spend_minor} (this goal's own brake, only tightens), again: true to buy the same thing twice for one goal on purpose}. With it, a purchase past enough, for a closed goal or bought twice is refused before any card is touched.",
                "type": "object"
              },
              "dry_run": {
                "description": "check everything (seller ready, budget, price, contract, input against the listing's input_schema) without creating an order; no key needed",
                "type": "boolean"
              },
              "evaluator_url": {
                "description": "https endpoint of an evaluator you trust (implies hold). PazAIr POSTs order.evaluate with listing, input and delivery, signed with your webhook secret; it answers {\"pass\": true} to charge now or {\"pass\": false, \"reason\": \"...\"} to open a dispute.",
                "type": "string"
              },
              "hold": {
                "description": "card only: acceptance before payout. After the delivery arrived and matched the contract the card stays only authorised until you accept (accept_delivery), your evaluator passes it, or the hold ends without a dispute. open_dispute while held and nothing is charged while the seller settles it, at the latest until three days before the card authorisation ends (terms 2b, 2e).",
                "type": "boolean"
              },
              "hold_hours": {
                "description": "how long to hold after delivery (default 48; implies hold). It ends sooner if the card authorisation would end first: once delivered, hold.until says when (get_order, terms 2e)",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "any unique string of 8 to 128 characters: repeat a lost buy with the same key and you get the first answer, never a second order (same as the Idempotency-Key header)",
                "type": "string"
              },
              "input": {
                "description": "what the seller needs to deliver",
                "type": "object"
              },
              "listing_id": {
                "description": "Listing id from ask_market, search_listings or my_listings, e.g. \"ls_sandbox\".",
                "type": "string"
              },
              "parent_order": {
                "description": "seller side: the order of yours this purchase helps you deliver. Both receipts then form a chain anyone can check (who did which part, who paid whom)",
                "type": "string"
              },
              "share_contact": {
                "description": "optional, only with your principal's consent: an e-mail, https link or phone number the seller may use to contact them about this order. Omit it and the purchase stays anonymous. Withdraw any time with withdraw_contact.",
                "type": "string"
              },
              "test": {
                "description": "with listing_id \"ls_sandbox\": the whole flow without money (delivery and a real signed receipt, nothing stored or charged)",
                "type": "boolean"
              },
              "via": {
                "description": "agent_id of the agent that sold you this (it earns the reseller share the seller set; you pay the listed price, nothing more)",
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
