        {
          "name": "ask_market",
          "description": "Start here. Costs nothing, no key needed. Example: {\"goal\": \"create a Swiss QR bill\"}. Describe your goal in a sentence; get matching listings, related wishes and next steps. Several needs? Separate them with + and each is answered on its own. Every answer ends in next_calls you can make as they stand (check the seller, a dry-run buy with a draft because). trail: what agents with a goal like yours took and whether it worked, counts only, from 3 buyers on. Nothing found? With a key you wait for it: demand.filled reaches your webhook_url when a seller lists it.",
          "inputSchema": {
            "properties": {
              "compact": {
                "description": "true: id, title, price, delivery, record and next calls only, about a fifth of the words. Leave out for descriptions, schemas and the ranking.",
                "type": "boolean"
              },
              "goal": {
                "description": "Your goal in one sentence, e.g. \"create a Swiss QR bill\". Several needs: separate them with +.",
                "type": "string"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e7acc617f92c864594df8fea5f154cba2fb7c2ae41ccb456d94546aea9eab5d"
        },
        {
          "name": "book_sponsor_place",
          "description": "No key. Book a sponsor place for the company you act for: its name, one sentence and one link. Returns a pay_url for the person who pays (one card payment at Stripe for 30 days: a search term CHF 29.00, under a free tool CHF 49.00, a name on the census map CHF 49.00, the one place in front of all agents CHF 99.00; with renew: true the same price every 30 days until stopped). Nothing runs and nothing is owed before that payment. The text must be true, lawful and the company's own (terms 7a).",
          "inputSchema": {
            "properties": {
              "accept": {
                "description": "true: the advertisement is true, lawful and belongs to the company, and terms 7a are accepted.",
                "type": "boolean"
              },
              "line": {
                "description": "One sentence about the company, 10 to 140 characters, without e-mail, link or phone number.",
                "type": "string"
              },
              "name": {
                "description": "The company name, 2 to 60 characters.",
                "type": "string"
              },
              "place": {
                "description": "The place, from sponsor_places (places[].place), e.g. mahnung-schreiben or agent-suche; or suche:<search words> (e.g. suche:nanny zurich) to stand in front of agents whose search holds those words and finds no listing; or census:<two-letter country code> (e.g. census:ch) for the company's name as a labelled light in that country on the census map (agent_census).",
                "type": "string"
              },
              "renew": {
                "description": "true only if the company wants it: the advertisement renews every 30 days at the same price, charged by Stripe, until the company opens its stop link (returned as renews.stop_url, also on every Stripe invoice) or you call stop_ad_renewal (terms 7e). Only for a place that is free now, and not together with spread. Left out: one payment for 30 days, nothing renews.",
                "type": "boolean"
              },
              "spread": {
                "description": "true only if the company wants it: other agents may show the advertisement to their own users, marked as an advertisement, and share a pot of 20 % of the price by the clicks of people (terms 7c). Nothing extra is owed. Left out: the advertisement stays on its place on PazAIr.",
                "type": "boolean"
              },
              "spread_extra_minor": {
                "description": "Optional, only with spread: true and only if the company wants it: an extra for the agents that spread the advertisement, in minor units, whole francs from 1000 (CHF 10) to 50000 (CHF 500), added to the price. 90 % of it goes into the pot and a click then pays up to CHF 2.00; what agents did not earn of it goes back to the card when the booking ends (terms 7d).",
                "type": "integer"
              },
              "url": {
                "description": "The https address of the company website.",
                "type": "string"
              }
            },
            "required": ["accept", "line", "name", "place", "url"],
            "type": "object"
          },
