        {
          "name": "get_broadband_by_location",
          "description": "Get broadband providers and availability at a specific lat/lon location.\n\n    Returns a list of broadband providers serving the location with their\n    advertised download/upload speeds and technology types. Includes BEAD\n    classification (unserved/underserved/served) based on max available speeds.\n\n    NOTE: The FCC Broadband Map API has bot protection and may reject requests.\n    If you get an error, the API endpoint may have changed. The FCC updates\n    this API frequently without notice.\n\n    Args:\n        latitude: Location latitude (e.g. 38.8977 for Washington DC).\n        longitude: Location longitude (e.g. -77.0365 for Washington DC).\n        technology_code: Filter by technology (0=All, 10=Copper, 40=Cable,\n                        50=Fiber, 60=Satellite, 70=Fixed Wireless).\n        speed_download: Minimum download speed in Mbps (default 25).\n        speed_upload: Minimum upload speed in Mbps (default 3).\n        as_of_date: BDC filing date in YYYY-MM-DD format (default 2024-06-30).\n    ",
          "inputSchema": {
            "properties": {
              "as_of_date": {
                "default": "2024-06-30",
                "title": "As Of Date",
                "type": "string"
              },
              "latitude": {
                "title": "Latitude",
                "type": "number"
              },
              "longitude": {
                "title": "Longitude",
                "type": "number"
              },
              "speed_download": {
                "default": 25,
                "title": "Speed Download",
                "type": "integer"
              },
              "speed_upload": {
                "default": 3,
                "title": "Speed Upload",
                "type": "integer"
              },
              "technology_code": {
                "default": 0,
                "title": "Technology Code",
                "type": "integer"
              }
            },
            "required": ["latitude", "longitude"],
            "title": "get_broadband_by_locationArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_broadband_by_locationOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:133c1c343f7509b0b7f70c522613783c3072a2d4f9c0ff2d66533e1852a5aa8c"
        },
        {
          "name": "get_broadband_summary_by_county",
          "description": "Get broadband availability statistics for a county.\n\n    Returns aggregated broadband data including provider counts, technology\n    availability, and BEAD-relevant metrics (unserved/underserved/served\n    location percentages).\n\n    NOTE: County-level summary endpoints may not be directly available in all\n    API versions. This tool attempts multiple endpoint patterns.\n\n    Args:\n        county_fips: 5-digit county FIPS code (e.g. '11001' for Washington DC,\n                     '53033' for King County WA). Always a string, never an integer.\n        speed_download: Minimum download speed threshold in Mbps (default 25).\n        speed_upload: Minimum upload speed threshold in Mbps (default 3).\n        as_of_date: BDC filing date in YYYY-MM-DD format (default 2024-06-30).\n    ",
          "inputSchema": {
            "properties": {
              "as_of_date": {
                "default": "2024-06-30",
                "title": "As Of Date",
                "type": "string"
              },
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "speed_download": {
                "default": 25,
                "title": "Speed Download",
                "type": "integer"
              },
              "speed_upload": {
                "default": 3,
                "title": "Speed Upload",
                "type": "integer"
              }
            },
            "required": ["county_fips"],
            "title": "get_broadband_summary_by_countyArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_broadband_summary_by_countyOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef92599e46e2657ab6725b6ec62c344bb93ecb3c048b34cd3f20a33df6642a55"
        },
        {
          "name": "get_broadband_summary_by_state",
          "description": "Get state-level broadband availability summary.\n\n    Returns aggregated broadband statistics for the state including provider\n    counts and technology deployment. Useful for BEAD program analysis to\n    identify states with significant unserved/underserved populations.\n\n    Args:\n        state_fips: 2-digit state FIPS code (e.g. '53' for Washington, '11' for DC).\n                    Always a string, never an integer.\n        speed_download: Minimum download speed threshold in Mbps (default 25).\n        speed_upload: Minimum upload speed threshold in Mbps (default 3).\n        as_of_date: BDC filing date in YYYY-MM-DD format (default 2024-06-30).\n    ",
