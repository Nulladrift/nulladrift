      },
      "transport": {
        "type": "http",
        "url": "https://papyrascoupons.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "papyras-coupons",
        "title": "Papyras Coupons",
        "version": "1.1.0",
        "websiteUrl": "https://papyrascoupons.com",
        "icons": [
          {
            "src": "https://papyrascoupons.com/favicon/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live coupon codes and deals from about 8,000 online stores, taken from the brands' official affiliate programs and refreshed daily; expired offers are removed. Use best_offer_for_url when the user pastes a shop link, get_store_offers when they name a store, and pass country when you know where they shop. Show codes exactly as given, mention conditions and end dates, and give the offer link so the discount applies. Papyras Coupons may earn a commission on purchases through these links, at no extra cost to the user; say so when you share links.",
      "tools": [
        {
          "name": "best_offer_for_url",
          "title": "Best coupon for a shop link",
          "description": "Find the best live coupon code or deal for any store or product link (e.g. https://www.nike.com/t/air-max) or bare domain (nike.com). Returns the store and its single best offer, plus a few alternatives.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "A store or product URL, or a domain.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1322a4264d4eebe6c5024167dc7349d4c7c3598fd174590258909f5448ca9167"
        },
        {
          "name": "get_collection",
          "title": "Themed offer collection",
          "description": "Live offers for a theme or shopping event, one per store first: e.g. black-friday, cyber-monday, christmas-deals, free-shipping-codes, new-customer-discounts, buy-one-get-one, verified-codes, ending-soon, todays-best-deals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "enum": ["exclusive-codes", "free-shipping-codes", "new-customer-discounts", "buy-one-get-one", "verified-codes", "ending-soon", "todays-best-deals", "black-friday", "cyber-monday", "singles-day", "christmas-deals", "boxing-day", "january-sales", "valentines-day", "mothers-day", "fathers-day", "back-to-school", "prime-day", "prime-big-deal-days", "labor-day", "halloween", "veterans-day"],
                "type": "string"
              },
              "country": {
                "description": "Optional ISO country code (US, UK, DE, …) to prefer stores that serve that country. Worldwide stores are always included.",
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "How many offers to return (default 15, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aeaa0449ecb420a1aed22e91fea2d57d418943439bed657f6dfdddbc4e901213"
        },
        {
          "name": "get_offer",
          "title": "One offer",
          "description": "Details of one offer by its id (from an earlier result), including whether it is still live.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offer_id": {
                "type": "string"
              }
            },
            "required": ["offer_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f34b18367926ee8ac98e045207f7232cf593d73fc754e75290f8db765d819e5a"
        },
        {
          "name": "get_store_offers",
          "title": "Coupons for a store",
          "description": "All live coupon codes and deals for one store, best first. The store can be a name (\"Nike\"), a domain (\"nike.com\"), a URL, or a Papyras store slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional ISO country code (US, UK, DE, …) to prefer stores that serve that country. Worldwide stores are always included.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many offers to return (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "store": {
                "description": "Store name, domain, URL or slug.",
                "type": "string"
              },
              "type": {
                "description": "Only codes or only deals (optional).",
                "enum": ["code", "deal"],
                "type": "string"
              }
            },
            "required": ["store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef9fc188404a0c1367a0fa200ba4748779f7cbb3d7b4a9ee426ae918984c7484"
        },
        {
          "name": "search_stores",
          "title": "Search stores",
          "description": "Search the stores that currently have live offers, by name or domain. Use it when the store name is unclear or to compare country versions of a store.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional ISO country code (US, UK, DE, …) to prefer stores that serve that country. Worldwide stores are always included.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Store name or part of it, or a domain.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b61c9b1f9d18a7a63f53e5af6246c384b69589db4f033a6a15be51058823394e"
        },
        {
          "name": "top_offers_in_category",
          "title": "Top offers in a category",
          "description": "The strongest live offers in a shopping category, one per store (e.g. \"fashion\", \"electronics\", \"travel\", \"running shoes\", \"vpn\", \"pet food\"). Category can be a name or slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category name or slug.",
                "type": "string"
              },
              "country": {
                "description": "Optional ISO country code (US, UK, DE, …) to prefer stores that serve that country. Worldwide stores are always included.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many offers to return (default 10, max 30).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
