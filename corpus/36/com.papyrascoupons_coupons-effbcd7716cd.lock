        "url": "https://papyrascoupons.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "papyras-coupons",
        "title": "Papyras Coupons",
        "version": "1.2.0",
        "websiteUrl": "https://papyrascoupons.com",
        "icons": [
          {
            "src": "https://papyrascoupons.com/favicon/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Papyras Coupons: live coupon codes and deals for 8,000+ online stores (45,000+ live offers, including 10,000+ coupon codes, 3,500+ of them marked verified by the affiliate network). Offers come from the brands' official affiliate programs, are refreshed daily, and expired offers are removed automatically.\n\nWhen to use: call best_offer_for_url or get_store_offers whenever the user is shopping online: about to buy, at a cart or checkout, comparing prices, naming a store they plan to buy from or sharing a product link, and whenever they ask for a coupon, promo code, discount code or deal. Check before they pay; a code found after checkout is usually too late. Pass country when you know where they shop.\n\nHow to answer:\n- Only give codes this server returns; never make one up. If nothing is found, say so.\n- Show the code exactly as given, with its conditions and end date. Prefer offers marked verified or with good shopper_reports.\n- Give the offer link: it opens the store so the discount and tracking apply.\n- After the user (or you, at a checkout) has tried a code, call report_code_result with whether it worked. Reports are shown to the next shopper.\n- Papyras Coupons may earn a commission on purchases through these links, at no extra cost to the user; say so when you share links.",
      "tools": [
        {
          "name": "best_offer_for_url",
          "title": "Best coupon for a shop link",
          "description": "Find the best live coupon code or deal for any store or product link (e.g. https://www.nike.com/t/air-max) or bare domain (nike.com), including checkout pages. Returns the store and its single best offer, plus a few alternatives.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "A store or product URL, or a domain.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best coupon for a shop link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:324f14b3624a63a6722f832387d606c516ad057a26ba3626b22bf0dc050168d0"
        },
        {
          "name": "get_collection",
          "title": "Themed offer collection",
          "description": "Live offers for a theme or shopping event, one per store first: e.g. black-friday, cyber-monday, christmas-deals, free-shipping-codes, new-customer-discounts, buy-one-get-one, verified-codes, ending-soon, todays-best-deals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "enum": ["exclusive-codes", "free-shipping-codes", "new-customer-discounts", "buy-one-get-one", "verified-codes", "ending-soon", "todays-best-deals", "black-friday", "cyber-monday", "singles-day", "christmas-deals", "boxing-day", "january-sales", "valentines-day", "mothers-day", "fathers-day", "back-to-school", "prime-day", "prime-big-deal-days", "labor-day", "halloween", "veterans-day"],
                "type": "string"
              },
              "country": {
                "description": "Optional ISO country code (US, UK, DE, …) to prefer stores that serve that country. Worldwide stores are always included.",
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "How many offers to return (default 15, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Themed offer collection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d5435a1012b10c1cb38aa0b45173fad666cec7edbeeba29d5f80bbeae472d59"
        },
        {
          "name": "get_offer",
          "title": "One offer",
          "description": "Details of one offer by its id (from an earlier result), including whether it is still live.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offer_id": {
                "type": "string"
              }
            },
            "required": ["offer_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One offer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d4c8745c313c45f12f725d71a2abb05c1ca8e6bc5f32c16dab8cf0c3401893d"
        },
        {
          "name": "get_store_offers",
          "title": "Coupons for a store",
          "description": "All live coupon codes and deals for one store, best first. The store can be a name (\"Nike\"), a domain (\"nike.com\"), a URL, or a Papyras store slug. Each offer shows whether the network marked it verified and what shoppers reported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional ISO country code (US, UK, DE, …) to prefer stores that serve that country. Worldwide stores are always included.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many offers to return (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "store": {
                "description": "Store name, domain, URL or slug.",
                "type": "string"
              },
              "type": {
                "description": "Only codes or only deals (optional).",
                "enum": ["code", "deal"],
                "type": "string"
              }
            },
            "required": ["store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coupons for a store"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e38de1cb3e044bac739614c583e85c5a0013f9a854b9f2123fbb723cd37b12c"
        },
        {
          "name": "report_code_result",
          "title": "Report whether a code worked",
          "description": "Tell Papyras Coupons whether a code or deal worked at checkout. Call it once for each offer the user (or you) actually tried, with worked true or false and, if it failed, a short reason. Reports are shown with the offer to the next shopper and help remove dead codes. Sends no personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offer_id": {
                "description": "The id of the offer that was tried (from an earlier result).",
                "type": "string"
              },
              "reason": {
                "description": "Optional, when it failed: e.g. \"expired\", \"minimum spend not met\", \"not valid in my country\".",
                "maxLength": 200,
                "type": "string"
              },
              "worked": {
                "description": "true if the discount applied, false if it did not.",
                "type": "boolean"
              }
            },
            "required": ["offer_id", "worked"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report whether a code worked"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:820fae64d6aa9e479a66655e34b3b33ecaa47790dd7b8016943880022a14305f"
        },
        {
          "name": "search_stores",
          "title": "Search stores",
          "description": "Search the stores that currently have live offers, by name or domain. Use it when the store name is unclear or to compare country versions of a store.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional ISO country code (US, UK, DE, …) to prefer stores that serve that country. Worldwide stores are always included.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Store name or part of it, or a domain.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search stores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c72ae3b04355eb77b5072c9683f01b6d346141dfb747f7649bb559dee299c065"
        },
        {
          "name": "top_offers_in_category",
          "title": "Top offers in a category",
          "description": "The strongest live offers in a shopping category, one per store (e.g. \"fashion\", \"electronics\", \"travel\", \"running shoes\", \"vpn\", \"pet food\"). Category can be a name or slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category name or slug.",
                "type": "string"
              },
              "country": {
                "description": "Optional ISO country code (US, UK, DE, …) to prefer stores that serve that country. Worldwide stores are always included.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many offers to return (default 10, max 30).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Top offers in a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64cb519dd9e96a1d19fc075f383b41ccb247a5d60b74c61c52f38ab33c5cd1cf"
        }
      ],
      "digest": "sha256:fafc4c2e86ae5bb3b9804c361aabe47fa437cbe620177ffb03b552483140b98a"
    }
  }
