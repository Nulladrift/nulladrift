          },
          "digest": "sha256:002d4be091610e2023fa7c3dcab3b50b7c2688e730fba8814a2fb068b37ac6a5"
        },
        {
          "name": "list_models",
          "title": "List models",
          "description": "The AI models (chat, images or audio) available through SingIt, with their prices. Chat models can be called with chat or through SingIt's OpenAI-compatible API at https://app.singitai.app/v1. Search the returned list by id for models and prices. Paid calls stay inside owner-set key/allowance limits; check get_allowance before spending. Free, no key needed.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Defaults to chat.",
                "enum": ["chat", "images", "audio"],
                "type": "string"
