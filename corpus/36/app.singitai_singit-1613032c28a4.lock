{
  "lockfileVersion": 2,
  "subjects": {
    "app.singitai/singit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.singitai.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "singit",
        "title": "SingIt x402",
        "version": "0.1.6"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Look up prices, models, web pages and market data. get_price, list_price_symbols and list_models are free and work without a key; chat_free also answers without a key. chat is paid from your key. Paid tools need a SingIt API key and are charged per call to that key's SingIt limits, in USDC on Base or Solana. web_search and read_page need the key's \"search\" scope; the market data tools need its \"tools\" scope and a Base account for now. Keys made before paid data tools existed need a new key for those.",
      "tools": [
        {
          "name": "chat",
          "title": "Chat",
          "description": "Paid per call from your key's SingIt balance and owner-set limits in USDC. The server enforces per-request and daily caps; a call over a cap is refused before anything is charged. Use list_models for model ids and prices, get_allowance (or get_limits) for what remains and which cap would refuse a call, and get_receipts for the charge. Pass max_tokens high enough for reasoning models: thinking uses the same budget.",
          "inputSchema": {
            "properties": {
              "max_tokens": {
                "default": 1024,
                "description": "Longest answer, in tokens (1 to 8192, default 1024). Reasoning models think inside this budget, so leave room.",
                "maximum": 8192,
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "A whole conversation instead of prompt: text messages, oldest first.",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "model": {
                "description": "A SingIt model id from list_models, without a free/ prefix. Omit it for SingIt's default model.",
                "type": "string"
              },
              "prompt": {
                "description": "The question, as one user message. Send exactly one of prompt or messages.",
                "maxLength": 24000,
                "minLength": 1,
                "type": "string"
              },
              "system": {
                "description": "An optional system message; only together with prompt.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Chat"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2b67db7b71475af6e80476833c2122359b999ec6dda05b4b7625840ad44ea0e1"
        },
        {
          "name": "chat_free",
          "title": "Chat (free)",
          "description": "Free model answers, no key needed. Answers are short (400 tokens), with a small daily allowance shared per network and a shared daily budget that can run out. To pay for a model answer with your key use chat with the same model without the free/ prefix.",
          "inputSchema": {
            "properties": {
              "max_tokens": {
                "default": 400,
                "description": "Longest answer, in tokens (1 to 400, default 400).",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "A whole conversation instead of prompt: text messages, oldest first.",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "model": {
                "description": "A free model id such as deepseek-v4.1-flash; the free/ prefix is added if missing. Defaults to free/deepseek-v4.1-flash.",
                "type": "string"
              },
              "prompt": {
                "description": "The question, as one user message. Send exactly one of prompt or messages.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Chat (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c6bd5a9587139748243995b9a4724aa26fdce81e0cfeb773d0b403a94eb602a4"
        },
        {
          "name": "get_allowance",
          "title": "Get allowance",
          "description": "How much you can still spend right now, before you pay: your API key's remaining today and per-request cap, and your wallet allowance's remaining today, per-purchase cap and approval on Base or Solana, each with spendableNowUsd and bindingLimit (the limit that would refuse a larger call). Owner can pause (Emergency stop) or Revoke the allowance: Base AgentAllowance is on-chain; Solana daily and per-purchase limits are server-checked. Read-only: it cannot change a limit. Free, but needs your API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get allowance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f7505c6dc8d8890fb9661d37c0c4ffb73d69e40491f2102ac825df52fc10b59e"
        },
        {
          "name": "get_balance",
          "title": "Get balance",
          "description": "Your SingIt API balance: available and held USDC, auto top-up and pending top-ups. Use to check funds before paid calls. Free, but needs your API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
