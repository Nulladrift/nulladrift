          },
          "digest": "sha256:c4b113a147149963c5cf5f145e8c88f975c4601b429827747893783e41015323"
        },
        {
          "name": "get_price",
          "title": "Get price",
          "description": "Current price of a major cryptocurrency, gold or silver (Chainlink on Base), or an exchange rate between two currencies. Use for quick quotes of well-known assets; call list_price_symbols when unsure a symbol is covered. Free, no key needed.",
          "inputSchema": {
            "properties": {
              "base": {
                "description": "Base currency for fx, e.g. USD.",
                "type": "string"
              },
              "kind": {
                "description": "What kind of price to look up.",
                "enum": ["crypto", "metal", "fx"],
                "type": "string"
              },
              "quote": {
                "description": "Quote currency for fx, e.g. EUR.",
                "type": "string"
              },
              "symbol": {
                "description": "Ticker for crypto or metal, e.g. BTC, XAU.",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f63b73b3a1d464158a7fe7a58ecf96f1785c292a09457c1f1f61e827aeac5151"
        },
        {
          "name": "get_receipts",
          "title": "Get receipts",
          "description": "Your recent receipts, newest first: for each, its id, time, model, USDC charged, tokens and the upstream reference (kind charge, this key only), or the account's top-ups and refunds with their transaction and network. Read-only; page back with `before`. Free, but needs your API key.",
          "inputSchema": {
            "properties": {
              "before": {
                "description": "Only entries older than this receipt id: pass the last id of the previous page.",
                "minimum": 1,
                "type": "integer"
              },
              "kind": {
                "description": "charge (default): what this key spent; topup: money added to the account; refund.",
                "enum": ["charge", "topup", "refund"],
                "type": "string"
              },
              "limit": {
                "description": "How many, newest first. Defaults to 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get receipts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c25e93b171f3c8e0848403344a87bd2a5e254ab702802e20e1d336c789250c43"
        },
        {
          "name": "get_token_price",
          "title": "Get token price",
          "description": "USD price of a major token by symbol from a paid x402 price API. get_price is free and covers the same majors, so prefer it; use this as a second source. Paid per call from your key's SingIt limits in USDC; Base accounts only for now.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Token ticker, e.g. ETH, BTC, SOL.",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get token price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
