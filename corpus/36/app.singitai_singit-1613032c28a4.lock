        {
          "name": "web_search",
          "title": "Web search",
          "description": "Searches the web through Exa and returns titles, URLs and snippets of matching pages. Use for current or niche information, then read_page for a full page. Paid per call from your key's SingIt limits in USDC on Base or Solana; needs the key's \"search\" scope.",
          "inputSchema": {
            "properties": {
              "numResults": {
                "description": "Defaults to a few.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search the web for.",
                "type": "string"
              },
              "type": {
                "enum": ["auto", "fast", "neural", "keyword"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
