          },
          "digest": "sha256:975a9625c1572d814baa5e47684b07866275aeb2a1d7c45866126474fa64a803"
        },
        {
          "name": "get_x_profile",
          "title": "Get X profile",
          "description": "Public profile data for an X (Twitter) account by username, from twit.sh's x402 API. Use to check who is behind a handle. Paid per call from your key's SingIt limits in USDC; Base accounts only for now.",
          "inputSchema": {
            "properties": {
              "username": {
                "description": "Twitter/X screen name without @.",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
