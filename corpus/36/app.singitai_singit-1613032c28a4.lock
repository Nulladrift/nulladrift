        {
          "name": "read_page",
          "title": "Read page",
          "description": "The readable text of one web page (up to 8000 characters), through Exa. Use after web_search, or when you already have a URL. Paid per call from your key's SingIt limits in USDC on Base or Solana; needs the key's \"search\" scope.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The http(s) page to read.",
