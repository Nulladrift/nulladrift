        {
          "name": "resolve_ens",
          "title": "Resolve ENS name",
          "description": "Turns an ENS name (e.g. vitalik.eth) into its address, or an address into its primary ENS name. Paid per call from your key's SingIt limits in USDC; Base accounts only for now.",
          "inputSchema": {
            "properties": {
              "input": {
                "description": ".eth name or Ethereum address.",
                "type": "string"
              },
              "network": {
                "description": "Ethereum network, defaults to ethereum.",
