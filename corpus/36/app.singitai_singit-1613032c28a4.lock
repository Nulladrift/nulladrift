        },
        {
          "name": "get_funding_rates",
          "title": "Get funding rates",
          "description": "Funding rates for one symbol across exchanges, with open interest, long/short ratio, large positions and liquidations, from Otto AI. Use to compare venues or gauge positioning. Paid per call from your key's SingIt limits in USDC; Base accounts only for now.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Market ticker, e.g. BTC, ETH, SOL.",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
