        },
        {
          "name": "get_crypto_news",
          "title": "Get crypto news",
          "description": "Latest crypto market headlines with sentiment, from Otto AI. Use to see what is moving the market today; takes no input. Paid per call from your key's SingIt limits in USDC; Base accounts only for now.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
