        },
        {
          "name": "get_limits",
          "title": "Get limits",
          "description": "What your API key may still spend: its daily and per-request caps, spent and remaining today, scopes and expiry, plus your account's balance and your allowance limits on Base or Solana (caps, left today, approved from your wallet, paused = emergency stop, expired). Read-only: it cannot change a limit. Use before a paid call to see whether it fits. Free, but needs your API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
