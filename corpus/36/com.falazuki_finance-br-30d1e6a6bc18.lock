      "tools": [
        {
          "name": "advise_investment",
          "description": "Recomenda tipo de investimento com base no perfil, prazo, valor e objetivo. Retorna opções rankeadas com prós e contras.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Valor disponível para investir em R$",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "goal": {
                "default": "growth",
                "description": "Objetivo",
                "enum": ["emergency_fund", "short_term", "aposentadoria", "passive_income", "growth"],
                "type": "string"
              },
              "months": {
                "description": "Prazo em meses",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "needs_liquidity": {
                "default": true,
                "description": "Precisa de liquidez diária?",
                "type": "boolean"
              },
              "profile": {
                "description": "Perfil de risco",
                "enum": ["conservative", "moderate", "aggressive"],
                "type": "string"
              }
            },
            "required": ["amount", "months", "profile"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:74d963106e68dd7b802f2348b0d316ed85b7e6aa094544a088e580d87808da3d"
        },
