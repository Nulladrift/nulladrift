          "description": "Calcula que preço de carro cabe numa renda, considerando o custo TOTAL de ter o carro (prestação, IPVA, seguro, manutenção e combustível) dentro de um teto de percentual da renda. Devolve o preço do carro e a prestação que sobra. Parâmetros obrigatórios: monthly_income. Opcionais: monthly_km, fuel_price, km_per_liter, down_payment, months, monthly_rate, income_ratio. Use exatamente estes nomes, em inglês.",
