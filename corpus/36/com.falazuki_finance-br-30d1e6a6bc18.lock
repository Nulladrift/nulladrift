        {
          "name": "after_dismissal",
          "description": "Fui demitido, e agora? Encadeia, a partir das datas do contrato e do tipo de saída (sem justa causa, acordo do art. 484-A ou justa causa): a rescisão líquida verba por verba, o seguro-desemprego quando há direito, o FGTS para sacar (saldo liberado mais a multa), o saldo mês a mês contra os gastos fixos com o seguro entrando a cada parcela, e, se houver dívida, os juros evitados ao quitar contra o rendimento líquido a 100% do CDI em 12 meses. O dinheiro sai decomposto por origem; o que não se aplica ao caso sai como pulado, com o motivo.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "admission_date": {
                "description": "Data de entrada na empresa, aaaa-mm-dd",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "cdi_annual": {
                "description": "CDI ao ano, em %, para a comparação com a dívida. Sem ele, o rendimento aplicado não é calculado",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "debt_amount": {
                "description": "Dívida que cobra juros, em R$ (opcional)",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "debt_monthly_rate": {
                "description": "Juros da dívida ao mês, em % (8 = 8% ao mês)",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "dependents": {
                "default": 0,
                "description": "Dependentes para o IRRF",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "exit_date": {
                "description": "Data de saída, aaaa-mm-dd. Com aviso trabalhado, o último dia do aviso",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "exit_type": {
                "description": "Como foi a saída: without_cause (dispensa sem justa causa), mutual_agreement (acordo do art. 484-A da CLT) ou with_cause (dispensa por justa causa)",
                "enum": ["without_cause", "mutual_agreement", "with_cause"],
                "type": "string"
              },
              "fgts_balance": {
                "description": "Total depositado no FGTS neste contrato, em R$. Sem ele, estimado em 8% do salário por mês de casa com 3% ao ano",
                "minimum": 0,
                "type": "number"
              },
              "monthly_expenses": {
                "description": "Gastos fixos por mês, em R$",
                "exclusiveMinimum": 0,
                "maximum": 500000,
                "type": "number"
              },
              "notice_mode": {
                "default": "indemnified",
                "description": "Aviso prévio: indemnified (pago sem trabalhar, projeta nos avos) ou worked (cumprido trabalhando). Ignorado na justa causa",
                "enum": ["indemnified", "worked"],
                "type": "string"
              },
              "overdue_vacations": {
                "default": 0,
                "description": "Períodos de férias completos e não gozados",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "salary": {
                "description": "Salário bruto mensal, em R$",
                "exclusiveMinimum": 0,
                "maximum": 500000,
                "type": "number"
              },
              "times_requested": {
                "default": 1,
                "description": "Qual pedido de seguro-desemprego seria este: 1, 2 ou 3 (3 vale para o terceiro em diante)",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["admission_date", "exit_date", "exit_type", "monthly_expenses", "salary"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8719779f067e3c869dd9291ab32eb81a3db3ba410f62cd8eb0b59f7817aca540"
        },
        {
          "name": "calculate_acordo_divida",
          "description": "Avalia uma proposta de acordo de dívida (Serasa Limpa Nome e afins): o desconto real do à vista e do parcelado sobre o valor cobrado, e o juro EMBUTIDO em escolher o parcelado em vez do à vista, calculado por TIR. É a régua pra decidir se vale juntar o dinheiro, parcelar ou buscar crédito mais barato. Parâmetros obrigatórios: original_debt, cash_offer, installments, installment_value. Use exatamente estes nomes, em inglês.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cash_offer": {
                "description": "A oferta pra quitar à vista, em R$",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "installment_value": {
                "description": "Valor de cada parcela do acordo, em R$",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "installments": {
                "description": "Número de parcelas do acordo parcelado",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "original_debt": {
                "description": "O valor COBRADO da dívida (o número da carta/plataforma)",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              }
            },
            "required": ["cash_offer", "installment_value", "installments", "original_debt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07f0424e5ed05f0c306af2a56997f7280187352f67a09387be072adf2cac866e"
        },
        {
          "name": "calculate_adicional_noturno",
          "description": "Calcula o adicional noturno urbano (22h às 5h): os 20% sobre a hora diurna MAIS o efeito da hora noturna reduzida de 52min30s, que transforma cada hora de relógio em 1,14 hora paga. Parâmetros obrigatórios: salary, night_clock_hours. Opcionais: monthly_hours. Use exatamente estes nomes, em inglês.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "monthly_hours": {
                "default": 220,
                "description": "Jornada mensal em horas (220 pra 44h semanais)",
                "maximum": 744,
                "minimum": 1,
                "type": "number"
              },
              "night_clock_hours": {
                "description": "Horas trabalhadas entre 22h e 5h no mês, NO RELÓGIO",
                "maximum": 400,
                "minimum": 0,
                "type": "number"
              },
              "salary": {
                "description": "Salário mensal em R$",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              }
            },
            "required": ["night_clock_hours", "salary"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:237f88c11f6661af8760f62832d1f32ab18f13bf04966eca49471e89e2a1fb3b"
        },
        {
          "name": "calculate_annual_salary",
          "description": "Calcula quanto um salário mensal rende no ano. Para CLT, soma o décimo terceiro e o terço constitucional de férias, que fazem o ano valer 13,33 salários e não 12. Serve para comparar proposta CLT com proposta PJ. Parâmetros obrigatórios: monthly_salary. Opcionais: months_worked, clt. Use exatamente estes nomes, em inglês.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clt": {
                "default": true,
                "description": "Verdadeiro para CLT (tem 13º e terço); falso para PJ",
                "type": "boolean"
              },
              "monthly_salary": {
                "description": "Salário mensal bruto, em R$",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "months_worked": {
                "default": 12,
                "description": "Meses trabalhados no ano",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["monthly_salary"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a63840e38ebea736b97f863a842e2df728fd73a7d7060df139292b334087f902"
        },
        {
          "name": "calculate_antecipacao_fgts",
          "description": "Revela a taxa de juros EMBUTIDA numa oferta de antecipação do saque-aniversário do FGTS: o valor recebido hoje contra os saques anuais entregues ao banco, por TIR. É a conta pra comparar a antecipação com um crédito comum antes de assinar. Parâmetros obrigatórios: amount_received, years, yearly_parcel. Use exatamente estes nomes, em inglês.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount_received": {
                "description": "O valor que o banco deposita HOJE, em R$",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "yearly_parcel": {
                "description": "O valor do saque anual entregue ao banco, por ano, em R$",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "years": {
                "description": "Quantos aniversários futuros a oferta antecipa",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["amount_received", "yearly_parcel", "years"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c2a124928c1acacb5aa7f747fcdb98e54ee6a0263fe7f0d81d7f32f6add47d2"
        },
        {
          "name": "calculate_average_price",
          "description": "Calcula o novo preço médio de ações ou FIIs depois de uma compra: posição atual (quantidade + preço médio) mais a compra nova (quantidade + preço + custos). Pra várias compras, encadeie chamadas usando o resultado como posição seguinte. Venda não altera o preço médio. Parâmetros obrigatórios: buy_quantity, buy_price. Opcionais: current_quantity, current_average_price, fees. Use exatamente estes nomes, em inglês.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buy_price": {
                "description": "Preço pago por unidade em R$",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "buy_quantity": {
                "description": "Quantidade comprada agora",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "current_average_price": {
                "default": 0,
                "description": "Preço médio atual em R$ (0 se é a primeira compra)",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "current_quantity": {
                "default": 0,
                "description": "Quantidade que já possui (0 se é a primeira compra)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "fees": {
                "default": 0,
                "description": "Corretagem e emolumentos da compra em R$ (entram no médio)",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["buy_price", "buy_quantity"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13f051a1fc63a91c058cae44dfd5a2011e4b464e887ee12342c18905132b4b19"
