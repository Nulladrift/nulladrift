        {
          "name": "calculate_aviso_previo",
          "description": "Calcula o aviso prévio proporcional: 30 dias + 3 por ano completo de casa (máximo 90), o valor indenizado na demissão sem justa causa e o que o empregado desconta se sair sem cumprir. Parâmetros obrigatórios: salary, full_years_worked. Use exatamente estes nomes, em inglês.",
