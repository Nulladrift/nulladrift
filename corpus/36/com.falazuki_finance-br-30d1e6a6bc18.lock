          "description": "Confere um holerite de empregado CLT contra as tabelas vigentes NA COMPETÊNCIA (INSS desde ago/2006, IRRF desde jan/2007), item a item, com veredito global em três estados (conferido completamente, parcialmente, não foi possível concluir). Regras: o documento manda na base (informe inss_base/irrf_base impressas no holerite quando existirem; o salário bruto é contexto e insumo do redutor da Lei 15.270); com irrf_base declarada, pensão alimentícia deixa de bloquear a conferência do IRRF; o IRRF é conferido contra a base efetivamente usada (INSS informado como dedução) e um INSS divergente gera a segunda análise exposta, nunca falso positivo em cascata. Verbas declaradas em declared_items que o motor não audita viram 'informado, não conferido' e impedem conclusão sobre o total. Com total_earnings e net_received (e todos os descontos declarados com valor), roda a reconciliação aritmética como afirmação SEPARADA: fechar na soma não promove verba a correta. Parâmetros obrigatórios: gross_salary, informed_inss, informed_irrf, reference_date. Opcionais: inss_base, irrf_base, dependents, total_earnings, net_received, declared_items. Use exatamente estes nomes, em inglês.",
