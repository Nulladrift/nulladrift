                "required": ["ai_generated", "context", "fallback", "partial", "products", "scope_note"],
                "type": "object"
              },
              "late": {
                "description": "Since api 2.7.0. Null unless the recall is late: it began more than 184 days before listed_at, or it ended on or before the date its listed_at_basis names.",
