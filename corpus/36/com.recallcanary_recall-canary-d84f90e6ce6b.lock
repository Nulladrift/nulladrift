        {
          "name": "search_recalls",
          "title": "Search U.S. federal product recalls",
          "description": "Search the Recall Canary index of U.S. federal product recalls (FDA, FSIS, CPSC, NHTSA) by keyword, agency, severity, category, distribution state, hazard, firm, lifecycle (open or ended), or date window. Returns up to 50 matching records per page with abbreviated content (title, firm, severity, date, and the canonical URL of each); call get_recall to fetch the full record. With a keyword, the best matches come first unless `sort` says otherwise. Unknown agency, severity, category, state, status and date values are rejected with an error message describing the allowed values. An unknown `hazard` or `firm` is also an error. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "Issuing agencies; matches any. Case-insensitive; values are uppercase.",
                "items": {
                  "enum": ["FDA", "FSIS", "CPSC", "NHTSA"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "category": {
                "description": "Single-select product category. Case-insensitive; values are uppercase.",
                "enum": ["FOOD", "DRUG", "BIOLOGIC", "DEVICE", "COSMETIC", "CONSUMER_PRODUCT", "VEHICLE", "AUTO_EQUIPMENT"],
                "type": "string"
              },
              "date": {
                "description": "Relative window, resolved against the request clock. Ignored when `from` or `to` is set.",
                "enum": ["7d", "30d", "90d", "year"],
                "type": "string"
              },
              "firm": {
                "description": "Firm slug: the firm of one recall, as the `firm.slug` value of a get_recall record, or the last part of a /firm/ page URL (for example \"acme-foods\"). Matches that firm's recalls and press releases. An unknown or malformed slug is an error, not a dropped filter: no search is returned.",
                "maxLength": 100,
                "type": "string"
              },
              "from": {
                "description": "Inclusive lower bound, YYYY-MM-DD at 00:00:00 UTC.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "hazard": {
                "description": "Single-select hazard tag, lowercase and hyphenated, the same filter as the website hazard pages: matches records whose hazard_tags include it, press releases included. Anything else is an error.",
                "enum": ["undeclared-allergen", "undeclared-milk", "undeclared-egg", "undeclared-peanut", "undeclared-tree-nut", "undeclared-wheat", "undeclared-soy", "undeclared-sesame", "undeclared-fish", "undeclared-shellfish", "undeclared-additive", "salmonella", "listeria", "e-coli", "botulism", "contamination", "chemical-contamination", "foreign-material", "sterility", "labeling", "misbranding", "potency", "hidden-drug", "unapproved-product", "manufacturing-deviation", "dissolution", "impurity", "specification-failure", "packaging-defect", "process-deviation", "nutrient-deficiency", "quality-defect", "software-defect", "device-defect", "donor-eligibility", "import-violation", "no-inspection", "fire", "burn", "explosion", "carbon-monoxide", "electric-shock", "laceration", "impalement", "fall", "tip-over", "choking", "ingestion", "poisoning", "lead-or-chemical", "suffocation", "strangulation", "entrapment", "drowning", "crush", "impact", "crash", "injury", "do-not-drive", "fire-risk-parked", "vehicle-electrical", "vehicle-equipment", "vehicle-mobility-equipment", "vehicle-structure", "vehicle-power-train", "vehicle-backup-camera", "vehicle-lighting", "vehicle-seat-belts", "vehicle-suspension", "vehicle-visibility", "vehicle-air-bags", "vehicle-seats", "vehicle-brakes", "vehicle-steering", "vehicle-fuel-system", "vehicle-engine", "vehicle-tires", "vehicle-wheels", "vehicle-trailer-hitch", "vehicle-latches", "vehicle-child-seat", "vehicle-driver-assistance"],
                "type": "string"
              },
              "page": {
                "description": "1-based page number, 50 records per page, at most 200: a larger page is refused with a tool error, not clamped; reach deeper archive by narrowing the date window instead. Pass the next page number in this parameter to navigate paginated results.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free-text query over one index of canonical recalls and preliminary press releases: titles, firm, product name/brand/description, agency reason text, AI summary, hazard tags, and identifiers (UPC, NDC, lot codes, recall and campaign numbers; codes match as printed or as bare digits, including typed in spaced or dashed groups). Every word must match, in any order; words of 3+ characters also match as prefixes (a 2-letter word matches itself and its plural), a plural also matches its singular, and a double-quoted run is an exact phrase. The one operator is an uppercase OR between two words, binding tighter than the implicit AND (`salmonella OR listeria cheese` = (salmonella OR listeria) AND cheese); NOT and NEAR are ordinary words. If no record matches every word, the results fall back to records matching SOME of them and the response says `relaxed: true` (with a notice): those are not confirmed matches. A `q` with more than 10 distinct words or codes is refused with a tool error, not searched in part. Results are ranked by relevance by default. A `q` with no searchable word (only symbols, punctuation or the operators OR / AND) is refused with a tool error, not browsed: omit `q` to browse by filters. Zero results is never evidence a product is unaffected: agencies print codes inconsistently, so also search the brand or product name and compare codes on the record.",
                "maxLength": 200,
                "type": "string"
              },
              "severity": {
                "description": "Matches any. The issuing agency's own level (FDA/FSIS class, NHTSA do-not-drive or park-outside warning) on one scale by a fixed rule; null when the agency gave none. A record reporting null can still match MODERATE here. CPSC records are reachable only via UNKNOWN. Preliminary press releases count as UNKNOWN: a filter without UNKNOWN excludes them. Case-insensitive; values are uppercase.",
                "items": {
                  "enum": ["CRITICAL", "MODERATE", "LOW", "UNKNOWN"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "sort": {
                "description": "`relevance` (the default when `q` is set) puts the best matches first. `recent` orders by listing date descending (the default without `q`). `severity` puts CRITICAL then MODERATE first, date descending within each band.",
                "enum": ["recent", "severity", "relevance"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter USPS code for a U.S. state or DC. Matches records distributed there or flagged nationwide. Territories are not filterable. Note the round trip: this takes a bare code such as \"TX\", while `distribution.geos` in the response emits ISO 3166-2 (\"US-TX\").",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "status": {
                "description": "Lifecycle, the same filter as `/data/recalls?status=` (api 2.8.0): `open` excludes ended recalls and FSIS public health alerts and keeps preliminary press releases; `ended` lists ended recalls only. Case-insensitive; values are lowercase. Anything else is an error.",
                "enum": ["open", "ended"],
                "type": "string"
              },
              "to": {
                "description": "Inclusive upper bound, YYYY-MM-DD at 23:59:59 UTC.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "A page of search or browse results. `relaxed` true means the results match only SOME of the query words, and `notices` says so.",
            "properties": {
              "api_version": {
                "type": "string"
              },
              "canonical": {
                "description": "Absolute URL of this representation.",
                "type": "string"
              },
              "filters": {
                "description": "The filters as applied, after normalization. An unapplied filter is echoed as null or [].",
                "properties": {
                  "agency": {
                    "items": {
                      "enum": ["FDA", "FDA_IRES", "FSIS", "CPSC", "NHTSA", "ADMIN"]
                    },
                    "type": "array"
                  },
                  "category": {
                    "enum": ["FOOD", "DRUG", "BIOLOGIC", "DEVICE", "COSMETIC", "CONSUMER_PRODUCT", "VEHICLE", "AUTO_EQUIPMENT", null]
                  },
                  "date": {
                    "type": ["string", "null"]
                  },
                  "firm": {
                    "properties": {
                      "name": {
                        "type": ["string", "null"]
                      },
                      "slug": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["name", "slug"],
                    "type": ["object", "null"]
                  },
                  "from": {
                    "type": ["string", "null"]
                  },
                  "hazard": {
                    "type": ["string", "null"]
                  },
                  "q": {
                    "type": ["string", "null"]
                  },
                  "severity": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "sort": {
                    "enum": ["recent", "severity", "relevance"]
                  },
                  "state": {
                    "type": ["string", "null"]
                  },
                  "status": {
                    "description": "The lifecycle filter applied (`status`), or null.",
                    "enum": ["open", "ended", null]
                  },
                  "to": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["agency", "category", "date", "firm", "from", "hazard", "q", "severity", "sort", "state", "to"],
                "type": "object"
              },
              "html_url": {
                "description": "Absolute URL of the human-readable page.",
                "type": "string"
              },
              "license": {
                "description": "Attribution and terms (DATA-LICENSE).",
                "properties": {
                  "attribution": {
                    "type": "string"
                  },
                  "publisher": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["attribution", "publisher", "url"],
                "type": "object"
              },
              "notes": {
                "description": "The caveat that absence of a match is not a clearance.",
                "type": "string"
              },
              "notices": {
                "description": "Rules that narrowed or widened the results, stated in band. Empty when none apply.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pagination": {
                "properties": {
                  "has_more": {
                    "type": "boolean"
                  },
                  "next": {
                    "type": ["string", "null"]
                  },
                  "page": {
                    "type": "integer"
                  },
                  "per_page": {
                    "type": "integer"
                  },
                  "prev": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["has_more", "next", "page", "per_page", "prev"],
                "type": "object"
              },
              "relaxed": {
                "type": "boolean"
              },
              "results": {
                "items": {
                  "description": "One compacted listing row. Null-valued keys are omitted, so only record_type, id, agency, url, product_count and hazard_tags are guaranteed, and every row carries `display_title` or `title`. `reason` is not in this projection; call get_recall for the full record.",
                  "properties": {
                    "agency": {
                      "description": "Known values: FDA, FDA_IRES, FSIS, CPSC, NHTSA, ADMIN.",
                      "type": "string"
                    },
                    "ai_generated": {
                      "description": "Provenance for the fields this row carries. Absent when the row carries none.",
                      "properties": {
                        "category": {
                          "description": "True only for a press release's model-classified category.",
                          "type": "boolean"
                        },
                        "display_summary_short": {
                          "type": "boolean"
                        },
                        "display_title": {
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "category": {
                      "description": "Known values: FOOD, DRUG, BIOLOGIC, DEVICE, COSMETIC, CONSUMER_PRODUCT, VEHICLE, AUTO_EQUIPMENT.",
                      "type": "string"
                    },
                    "dates": {
                      "description": "Since api 2.7.0. Present when the recall's start or FDA's posted date is known.",
                      "properties": {
                        "began_at": {
                          "type": ["string", "null"]
                        },
                        "fda_posted_at": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["began_at", "fda_posted_at"],
                      "type": "object"
                    },
                    "display_summary_short": {
                      "type": "string"
                    },
                    "display_title": {
                      "type": "string"
                    },
                    "firm_name": {
                      "type": "string"
                    },
                    "hazard_tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "late": {
                      "description": "Since api 2.7.0. Present only when the recall is late (see get_recall `late`).",
                      "properties": {
                        "began_at": {
                          "type": ["string", "null"]
                        },
                        "ended_relation": {
                          "enum": ["same_day", "before", null]
                        },
                        "retroactive": {
                          "description": "The agency's own text says the recall was reported retroactively.",
                          "type": "boolean"
                        }
                      },
                      "required": ["began_at", "ended_relation", "retroactive"],
                      "type": "object"
                    },
                    "listed_at": {
                      "description": "ISO-8601 UTC listing date.",
                      "type": "string"
                    },
                    "product_count": {
                      "type": "integer"
                    },
                    "record_type": {
                      "description": "`preliminary` is an agency press release with no canonical record yet: no severity, status or products.",
                      "enum": ["recall", "preliminary"]
                    },
                    "risk": {
                      "description": "The agency rating as the page shows it (for example \"High risk\" for an FDA Class I recall). Null where the page shows no risk line.",
                      "properties": {
                        "basis": {
                          "type": "string"
                        },
                        "explained_at": {
                          "description": "Absolute URL of the page that explains the rating.",
                          "type": "string"
                        },
                        "word": {
                          "type": "string"
                        }
                      },
                      "required": ["basis", "explained_at", "word"],
                      "type": "object"
                    },
                    "severity": {
                      "description": "Issuing agency level. Absent when the agency gave none. Known values: CRITICAL, MODERATE, LOW.",
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "source_recall_id": {
                      "description": "Agency key; a CPSC one can be stale.",
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "title": {
                      "description": "Only when `display_title` is absent (a record not yet enriched): the title recallcanary.com shows for it, from the agency record's product names and title; never the agency headline. Not model-written.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Absolute canonical URL of the human page.",
                      "type": "string"
                    }
                  },
                  "required": ["agency", "hazard_tags", "id", "product_count", "record_type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "snapshot_at": {
                "description": "ISO-8601 UTC response-generation time, second precision. First key on purpose.",
                "type": "string"
              }
            },
            "required": ["api_version", "canonical", "filters", "html_url", "license", "notes", "notices", "pagination", "relaxed", "results", "snapshot_at"],
            "type": "object"
          },
