{
  "lockfileVersion": 2,
  "subjects": {
    "com.recallcanary/recall-canary": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://recallcanary.com/data/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "recall-canary",
        "title": "Recall Canary",
        "version": "1.5.0",
        "description": "U.S. federal product recalls from FDA, FSIS, CPSC, and NHTSA, in one schema.",
        "websiteUrl": "https://recallcanary.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Recall Canary indexes U.S. product recalls from FDA (openFDA, iRES, press releases), FSIS, CPSC, and NHTSA. Start with search_recalls, then get_recall for the full record. Records marked `record_type: \"preliminary\"` are agency press releases: they carry no severity and no product list. In search results none has a canonical record linked yet. Once linked, the URL usually returns the recall (another id), else get_recall lists it in `linked_recalls`; key on record_type and id. Fields named in each record's `ai_generated` object were written by a language model from agency text; treat the agency page at `source_url` as authoritative and cite it. Never present absence of a match as confirmation that a product is safe.",
      "tools": [
        {
          "name": "get_recall",
          "title": "Get one recall by agency and slug",
          "description": "Fetch the full Recall Canary record for a single U.S. federal recall, given the agency and slug returned by search_recalls. Includes the hazard description, the affected product list with lot codes and UPCs, the recommended consumer action, distribution, the agency source link, and the firm slug (`firm.slug`, with `firm.page_url` when the firm has a page) for search_recalls' `firm` filter. Also resolves preliminary agency press releases: an orphan, or a linked one that kept its own URL (its recalls in `linked_recalls`). Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "Lowercase agency segment from the record URL. Part of the lookup key, not decoration: a correct slug under the wrong agency is a miss.",
                "enum": ["fda", "fsis", "cpsc", "nhtsa", "admin"],
                "type": "string"
              },
              "slug": {
                "description": "The record slug from its URL, e.g. \"acme-foods-peanut-butter\". The 26-character ULID id is also accepted and resolves to what its URL shows (for a matched press release, often its recall).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["agency", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "description": "One record. `record_type` says which kind: a canonical `recall` (products, timeline, dates, related) or a `preliminary` agency press release (linked_recalls, company and agency dates).",
            "properties": {
              "advisory_url": {
                "type": ["string", "null"]
              },
              "agency": {
                "description": "Known values: FDA, FDA_IRES, FSIS, CPSC, NHTSA, ADMIN.",
                "type": "string"
              },
              "agency_published_at": {
                "type": ["string", "null"]
              },
              "ai_generated": {
                "description": "Provenance: true where the field holds model-written text. Over-attributes on purpose.",
                "properties": {
                  "category": {
                    "description": "True only for a press release's model-classified category.",
                    "type": "boolean"
                  },
                  "consumer_action": {
                    "type": "boolean"
                  },
                  "display_summary": {
                    "type": "boolean"
                  },
                  "display_summary_short": {
                    "type": "boolean"
                  },
                  "display_title": {
                    "type": "boolean"
                  }
                },
                "required": ["category", "consumer_action", "display_summary", "display_summary_short", "display_title"],
                "type": "object"
              },
              "api_version": {
                "type": "string"
              },
              "canonical": {
                "description": "Absolute URL of this representation.",
                "type": "string"
              },
              "category": {
                "description": "Known values: FOOD, DRUG, BIOLOGIC, DEVICE, COSMETIC, CONSUMER_PRODUCT, VEHICLE, AUTO_EQUIPMENT.",
                "type": ["string", "null"]
              },
              "company_announced_at": {
                "type": ["string", "null"]
              },
              "company_product_list": {
                "description": "The company's own list of the affected products, when the agency notice points to it instead of naming them. A product missing from `identification` may still be recalled: check this list.",
                "properties": {
                  "host": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["host", "label", "url"],
                "type": ["object", "null"]
              },
              "consumer_action": {
                "description": "The \"What to do\" text. Null on a withdrawn alert.",
                "type": ["string", "null"]
              },
              "content_changed_at": {
                "description": "When the published content last changed.",
                "type": ["string", "null"]
              },
              "critical_flags": {
                "description": "NHTSA-only in practice. An absent key means the agency did not state the flag. null for a withdrawn (RETRACTED) record.",
                "properties": {
                  "do_not_drive": {
                    "type": "boolean"
                  },
                  "equipment_only": {
                    "type": "boolean"
                  },
                  "international": {
                    "type": "boolean"
                  },
                  "ota_fixable": {
                    "type": "boolean"
                  },
                  "park_outside": {
                    "type": "boolean"
                  },
                  "undeclared_drug": {
                    "type": "boolean"
                  }
                },
                "type": ["object", "null"]
              },
              "dates": {
                "properties": {
                  "announced_at": {
                    "description": "Deprecated since api 2.7.0: for FDA the firm's start of the recall (began_at), never a public announcement.",
                    "type": ["string", "null"]
                  },
                  "began_at": {
                    "description": "Since api 2.7.0. The recall's own start: FDA's Date Initiated by Firm; null for FSIS, CPSC and NHTSA.",
                    "type": ["string", "null"]
                  },
                  "ended_at": {
                    "type": ["string", "null"]
                  },
                  "fda_posted_at": {
                    "description": "Since api 2.7.0. FDA only: when FDA first posted the recall to its Enforcement Report.",
                    "type": ["string", "null"]
                  },
                  "listed_at": {
                    "type": ["string", "null"]
                  },
                  "listed_at_basis": {
                    "description": "What listed_at is: company_announced, fda_posted, fda_classified, listed, unconfirmed, none, agency_announced or nhtsa_reported.",
                    "type": "string"
                  }
                },
                "required": ["announced_at", "began_at", "ended_at", "fda_posted_at", "listed_at", "listed_at_basis"],
                "type": "object"
              },
              "description": {
                "description": "Full agency description. FSIS: sanitized HTML; others: plain text. Sanitize or escape before display.",
                "type": ["string", "null"]
              },
              "display_summary": {
                "type": ["string", "null"]
              },
              "display_summary_short": {
                "type": ["string", "null"]
              },
              "display_title": {
                "type": ["string", "null"]
              },
              "distribution": {
                "properties": {
                  "geos": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "nationwide": {
                    "type": "boolean"
                  },
                  "raw": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["geos", "nationwide", "raw"],
                "type": ["object", "null"]
              },
              "firm": {
                "properties": {
                  "city": {
                    "type": ["string", "null"]
                  },
                  "countries_all": {
                    "description": "The agency's structured manufacturing-country list (CPSC only), each country once; [] for FDA, FSIS and NHTSA.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "country": {
                    "description": "CPSC: the first manufacturing country it lists. FDA: the firm's address country.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": ["string", "null"]
                  },
                  "page_url": {
                    "description": "/firm/<slug> page, only when that page is indexable.",
                    "type": ["string", "null"]
                  },
                  "slug": {
                    "description": "The firm filter value (`firm=` on search_recalls).",
                    "type": ["string", "null"]
                  },
                  "state": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["city", "countries_all", "country", "name", "page_url", "slug", "state"],
                "type": "object"
              },
              "firm_name": {
                "type": ["string", "null"]
              },
              "hazard_tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "html_url": {
                "description": "Absolute URL of the human-readable page.",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "identification": {
                "description": "Page-derived identification: the products and codes the record names. Not a completeness guarantee; `partial` says when the list is incomplete, including when this response cut `products` to 25 (`mcp_truncated.identification_products`).",
                "properties": {
                  "ai_generated": {
                    "description": "True when the product list came from a model-written identifier line.",
                    "type": "boolean"
                  },
                  "context": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "fallback": {
                    "type": ["string", "null"]
                  },
                  "partial": {
                    "type": "boolean"
                  },
                  "products": {
                    "items": {
                      "properties": {
                        "fields": {
                          "items": {
                            "properties": {
                              "hidden": {
                                "description": "Values the stored cell left out (a capped list).",
                                "type": "integer"
                              },
                              "kind": {
                                "enum": ["code", "date", "text"]
                              },
                              "label": {
                                "type": "string"
                              },
                              "notes": {
                                "additionalProperties": {
                                  "type": "string"
                                },
                                "description": "Plain text keyed by one of `values`: a serial or lot decoded from an HIBC label code, with its expiry and the stored code.",
                                "type": "object"
                              },
                              "role": {
                                "type": "string"
                              },
                              "values": {
                                "items": {
                                  "type": "string"
                                },
                                "type": "array"
                              }
                            },
                            "required": ["kind", "label", "role", "values"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "name": {
                          "type": "string"
                        },
                        "unlisted_since": {
                          "description": "Present only on a row from a product the agency no longer lists (api 2.11.0).",
                          "type": "string"
                        }
                      },
                      "required": ["fields", "name"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "scope_note": {
                    "type": ["string", "null"]
                  }
