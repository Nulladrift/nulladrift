                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["agency", "ai_generated", "firm_name", "id", "listed_at", "product_count", "reason", "severity", "title", "url"],
                  "type": "object"
                },
