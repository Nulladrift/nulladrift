        "type": "http",
        "url": "https://slotmaps.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "slotmaps",
        "title": "SlotMaps",
        "version": "1.0.0",
        "websiteUrl": "https://slotmaps.com/connect"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SlotMaps: advantage-play guides for 360+ casino-floor slot machines — what to look for on the machine and when it's worth playing. Search first, read the free overview, then get_full_guide (five are free: rich-little-piggies, 5-coin-frenzy, icy-wilds-deluxe, cash-falls, wu-jin-pen-fuyu-phoenix-or-panda; the rest cost $1.99 each, paid through Stripe machine payments). read_machine_photo reads a photo of a machine and says whether it's worth playing ($1.99). To get every guide, the person can sign in through https://slotmaps.com/mcp/account and buy membership from the assistant ($1 for the first 30 days).",
      "tools": [
        {
          "name": "get_full_guide",
          "title": "Full guide for a machine",
          "description": "The complete SlotMaps guide: what to look for on the machine, the exact numbers to sit down at, risk and bankroll, plus the advantage-state photo when there is one. Free for 5 machines (list_free_guides); $1.99 per guide otherwise, paid through Stripe machine payments (MPP).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Slug from search_machines",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a14f15b23bbf5a8e7fcb78dd42d4039a9753ad06afe42f88939d87f3393f8a7b"
        },
        {
          "name": "get_machine_overview",
          "title": "Free overview of a machine",
          "description": "How the advantage works on this machine: the free part of the SlotMaps guide. No exact thresholds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Slug from search_machines",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:68c0e1c56a621248b00b00723e2b625be812c5e4353e9e722c63aef66f895095"
        },
        {
          "name": "list_free_guides",
          "title": "Free full guides",
          "description": "The five SlotMaps machine guides any agent can read in full for free, with photos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f864ab54fe1b57ac6dc2293664dee013a9040974db3b7a6171e108d15cc0c52"
        },
        {
          "name": "read_machine_photo",
          "title": "Read a photo of a slot machine",
          "description": "Send a photo of a slot machine on a casino floor (a public https image URL, or base64). SlotMaps identifies the machine, reads its visible state (meters, coins, pigs, counters) and says whether it's worth playing right now and why. $1.99 per photo, paid through Stripe machine payments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "image_base64": {
                "description": "The photo as base64, if there's no URL",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of the photo",
                "format": "uri",
                "type": "string"
              },
              "mime_type": {
                "description": "image/jpeg or image/png when sending base64",
                "type": "string"
              },
              "question": {
                "description": "Anything specific the person asked",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:35a09364f7afa6c516f66a4cb262659493a605a361e2e5318fc94b6e8785b79a"
        },
        {
          "name": "search_machines",
          "title": "Search slot machines",
          "description": "Find SlotMaps guides by slot machine name (e.g. 'buffalo', 'phoenix link', 'piggies'). Returns machine names and slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Machine name or part of it",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
