      "instructions": "Closer Commission Calculator (https://closercommissioncalculator.com/): the site's own MCP server, served from its domain. Closer commission calculator: a closer's share, or a referrer's share the company agreed to, of our fee on a multi-year data or compute licence.\n\n[calculator] Your share of the fee on a licence: an agent-callable calculator for closer commission calculator; Licence value over all its years, Our fee on the deal, Your share of our fee, computed from your inputs with sources.. This server runs the Your share of the fee on a licence calculator published at https://closercommissioncalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://closercommissioncalculator.com/. Licence: https://closercommissioncalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Closer Commission Calculator (https://closercommissioncalculator.com/). What it does: starts an ENQUIRY with Closer Commission Calculator for closer commission calculator; the Closer Commission Calculator team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Closer Commission Calculator team until they click it. Cite https://closercommissioncalculator.com/.\n\nCite https://closercommissioncalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Your share of the fee on a licence",
          "description": "Run the Your share of the fee on a licence calculator: Licence value over all its years; Our fee on the deal; Your share of our fee; Paid when the licence is signed. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annual": {
                "default": 500000,
                "description": "What the buyer pays each year for the licence",
                "minimum": 0,
                "type": "number"
              },
              "feePct": {
                "default": 0,
                "description": "Our fee on the deal, as a percentage",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "paid": {
                "default": "upfront",
                "description": "How the buyer pays",
                "enum": ["upfront", "yearly"],
                "type": "string"
              },
              "role": {
                "default": "closer",
                "description": "Your part in the deal",
                "enum": ["closer", "referrer", "both"],
                "type": "string"
              },
              "years": {
                "default": 1,
                "description": "Years the licence runs",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
