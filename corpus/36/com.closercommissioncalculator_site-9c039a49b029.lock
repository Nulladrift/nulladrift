                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: I agree that the team behind this site may contact me about closing or referring deals.",
                "type": "boolean"
              }
            },
            "required": ["answers", "consent"],
