  "subjects": {
    "com.cresclab.catalog/ai-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://catalog.cresclab.com/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ai-catalog",
        "title": "AI Catalog by Crescendo Lab",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI Catalog checks whether a product feed is ready for AI shopping assistants (ChatGPT, Gemini, AI Mode, Perplexity). Use scan_product_feed when a user shares a product feed URL (Google Merchant XML, Facebook catalog XML, CSV/TSV, or a Shopify store URL) and wants to know if AI can understand, answer questions about, or recommend their products. Use get_feed_fix_guide to explain how to fix a gap, and list_ai_shopping_platforms to explain where product data can be submitted. Scores never guarantee AI recommendations. Fixing gaps with sourced, merchant-approved changes and publishing to Google Merchant Center is done in the AI Catalog app at https://catalog.cresclab.com/ (no credit card required).",
      "tools": [
        {
          "name": "get_feed_fix_guide",
          "title": "How to fix an AI-readiness gap",
          "description": "Explain what a gap from scan_product_feed means, why AI shopping assistants need that data, and how to fix it with evidence the merchant already owns. Call with no argument to get the full checklist.",
          "inputSchema": {
            "properties": {
              "issue_key": {
                "description": "Issue key from scan_product_feed, e.g. no_specs, thin_desc, llm_unanswerable. Omit for all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d039271c79ab441dd5cc2b30ed7039118123f52b24740626531c0138b1388dec"
        },
        {
          "name": "list_ai_shopping_platforms",
          "title": "Where product data reaches AI shopping",
          "description": "List the main AI shopping surfaces and how product data reaches each one (e.g. Google Merchant Center for Gemini / AI Mode / Shopping; ChatGPT merchant program). Overview only, not a list of live integrations.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e405a2a8f7f2b03993c0f995e5663e53838e10cf328bb69c88a2beb747e4daf6"
        },
        {
          "name": "scan_product_feed",
          "title": "Scan a product feed for AI shopping readiness",
          "description": "Fetch a public product feed once and score how well AI shopping assistants can understand it (0-100). Returns the biggest gaps (share of products affected), sample shopper questions AI could not answer from the feed, the thinnest products, and a link to fix the gaps. Accepts Google Merchant / Facebook catalog XML, CSV, TSV, or a Shopify store URL. Takes 20-60 seconds. Only summary results are stored.",
          "inputSchema": {
            "properties": {
              "feed_url": {
                "description": "Public URL of the product feed or Shopify store, e.g. https://example.com/feed.xml or https://shop.example.com",
                "type": "string"
              },
              "locale": {
                "description": "Language for shopper questions and labels (default en).",
                "enum": ["en", "zh-TW"],
                "type": "string"
              }
            },
            "required": ["feed_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:96a165a768fb7960d95a7005ff30016cfd5c5668b02ab3f9696b515f78648888"
        }
      ],
      "digest": "sha256:6e1a67d461dfd3ae6a5347ad1d1c8a6bc687de3cd90a13211467bc5043c8dc46"
    }
  }
}
