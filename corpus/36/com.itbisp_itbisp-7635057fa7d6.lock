                    "type": "number"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "preco_max": {
                "description": "Preço máximo em reais: 1,5 milhão = 1500000.",
                "type": "number"
              },
              "preco_min": {
                "description": "Preço mínimo em reais.",
                "type": "number"
              },
              "q": {
                "description": "Pedido em português: '3 quartos perto do metrô em Pinheiros até 1,8 mi com varanda'. Veja termos_entendidos na resposta.",
                "type": "string"
              },
              "quartos_min": {
                "description": "Quartos (dormitórios), no mínimo.",
                "minimum": 0,
                "type": "integer"
              },
              "raio_m": {
