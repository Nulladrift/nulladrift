                "description": "Raio em metros em torno de lat/lon.",
                "maximum": 10000,
                "minimum": 100,
                "type": "integer"
              },
              "reformado": {
                "description": "Só imóveis reformados, pela foto ou pelo texto do anúncio.",
                "type": "boolean"
              },
              "rua": {
                "description": "Nome da rua, com ou sem 'Rua'/'Av.': \"Rua dos Pinheiros\".",
                "type": "string"
              },
              "so_preco_bom": {
