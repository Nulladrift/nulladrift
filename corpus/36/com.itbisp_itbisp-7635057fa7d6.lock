                  "enum": ["apartamento", "cobertura", "studio", "casa", "casa_condominio"],
                  "type": "string"
                },
                "type": "array"
              },
              "suites_min": {
                "description": "Suítes, no mínimo.",
                "minimum": 0,
                "type": "integer"
              },
              "tipo": {
                "description": "Tipos aceitos. Studio/flat/kitnet/cobertura são 'apartamento'; sobrado é 'casa'.",
                "items": {
                  "enum": ["apartamento", "casa", "comercial", "terreno", "outro"],
                  "type": "string"
                },
                "type": "array"
              },
              "um_por_predio": {
                "description": "Mostra no máximo um imóvel por prédio (o melhor de cada); cada resultado diz quantos outros estão à venda no prédio.",
                "type": "boolean"
              },
              "vagas_min": {
                "description": "Vagas de garagem, no mínimo.",
                "minimum": 0,
                "type": "integer"
              },
              "visao": {
