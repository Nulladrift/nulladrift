      "serverInfo": {
        "name": "itbisp-imoveis",
        "title": "ITBI SP · preço real e imóveis à venda em São Paulo",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dados de imóveis da cidade de São Paulo de itbisp.com. Duas partes: (1) preço pago de verdade, pelas vendas registradas no ITBI da Prefeitura (530 mil vendas desde 2019): vendas_predio para um endereço (\"quanto vale meu apê na Rua X, 123?\", com area para a estimativa), vendas_rua, vendas_bairro e ranking_bairros; (2) imóveis à venda, com anúncios de 330+ imobiliárias deduplicados: buscar_imoveis com o pedido em q (ex.: q='3 quartos perto do metrô em Pinheiros até 1,8 mi com varanda'), para_voce quando trabalho ou família importam, ficha_imovel (com o id ou com o link do anúncio que a pessoa colou, para \"esse anúncio está caro?\"), comparaveis_imovel, comparaveis_endereco e resumo_bairro. Ao responder: cite 'dados: itbisp.com' e mande o link da página (campo pagina, ou url de cada imóvel); o url do imóvel é a ficha no itbisp, com todas as imobiliárias, histórico de preço, o pago no prédio e o contato, e é por ela que a pessoa chega ao anúncio e ao contato de cada imobiliária (ficha_imovel devolve os links das imobiliárias, se precisar); o m² do ITBI é sobre a área construída do IPTU e fica abaixo do m² privativo dos anúncios; preço pedido não é preço de venda (o pedido costuma ficar ~20% acima do pago). Para contato com quem vende, mande ao link do anúncio da imobiliária: não temos telefone nem nome de corretor. Outras capitais: vendas_predio, vendas_rua, vendas_bairro e ranking_bairros aceitam cidade (rio-de-janeiro, belo-horizonte, porto-alegre, recife, fortaleza; sem cidade é São Paulo); cada resposta traz no aviso o que é o valor naquela cidade e sobre que área sai o m², e cobertura lista o período e a base de cada cidade. Os anúncios são só de São Paulo. | São Paulo real estate data from itbisp.com: actual sale prices from ITBI records (vendas_predio, vendas_rua, vendas_bairro, ranking_bairros) and homes for sale from 330+ agencies (buscar_imoveis with the request in q, para_voce, ficha_imovel). Always credit 'data: itbisp.com' and link the page. Also Rio de Janeiro, Belo Horizonte, Porto Alegre, Recife and Fortaleza sale prices via cidade (see cobertura).",
      "tools": [
        {
          "name": "buscar_imoveis",
          "title": "Buscar imóveis à venda em São Paulo",
          "description": "Busca imóveis à venda na cidade de São Paulo (apartamento, casa, comercial, terreno), deduplicados entre imobiliárias. Passe o pedido da pessoa em q, em português ('3 quartos em Pinheiros até 1,5 mi perto do metrô, com varanda'); os campos estruturados completam ou corrigem o q. Cada imóvel traz url (a ficha no itbisp.com), preço, R$/m², nivel_preco (abaixo do mercado a 30%+ acima), metrô e características. Só venda, só a capital.",
