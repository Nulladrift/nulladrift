            "additionalProperties": false,
            "properties": {
              "area_max": {
                "description": "Área máxima em m².",
                "type": "number"
              },
              "area_min": {
                "description": "Área mínima em m² (privativa/útil do anúncio).",
                "type": "number"
              },
              "bairro": {
                "description": "Um ou mais bairros, como as pessoas escrevem: [\"Pinheiros\", \"Vila Madalena\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bbox": {
                "description": "Caixa [oeste, sul, leste, norte] em graus.",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "caracteristicas": {
                "description": "Características exigidas (todas valem), lidas dos anúncios.",
                "items": {
                  "enum": ["vista", "varanda", "varanda_gourmet", "churrasqueira", "piscina", "academia", "aceita_pet", "playground", "brinquedoteca", "salao_festas", "quadra", "sauna", "espaco_gourmet", "portaria_24h", "condominio_fechado", "closet", "lareira", "mobiliado", "ar_condicionado", "escritorio", "armarios_planejados", "elevador", "lavabo", "novo_texto", "reformado_texto", "deposito", "gerador"],
                  "type": "string"
                },
                "type": "array"
              },
              "estacao": {
                "description": "Estação de metrô/trem/monotrilho mais próxima do imóvel: \"Fradique Coutinho\", \"Faria Lima\".",
                "type": "string"
              },
              "faixa_avaliacao": {
                "description": "Corta pelo selo de preço: so_abaixo (só abaixo do mercado), ate_mercado (tira os acima do mercado), sem_muito_caros (tira só os 30%+ acima).",
                "enum": ["so_abaixo", "ate_mercado", "sem_muito_caros"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude do ponto de referência (use com lon e raio_m).",
