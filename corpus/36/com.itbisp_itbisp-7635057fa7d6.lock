                "maximum": 5000,
                "minimum": 100,
                "type": "integer"
              },
              "ordem": {
                "default": "relevancia",
                "description": "Ordem. 'relevancia' põe primeiro preço bom, com foto e confirmado por várias imobiliárias; 'mais_perto' exige lat/lon.",
                "enum": ["relevancia", "menor_preco", "maior_preco", "menor_m2", "maior_area", "maior_desconto", "mais_recentes", "mais_perto"],
                "type": "string"
              },
              "pagina": {
                "default": 1,
                "description": "Página de resultados.",
                "minimum": 1,
                "type": "integer"
