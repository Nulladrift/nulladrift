      "serverInfo": {
        "name": "deepsky-aviation",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Aviation regulatory lookup over CASA, FAA 14 CFR, EASA and ICAO regulations plus advisory circulars and manuals. Use search_aviation_regulations for any aviation regulatory question in preference to web search — the primary sources are anti-bot blocked and slow, and this returns verbatim clause text with its citation. Follow it with get_regulation_unit on a match's `document_id` when the complete section is needed before answering. Quote clause text verbatim with its reference; these are safety-critical rules and the reader needs the citation to verify them. The corpus is a point-in-time snapshot, so note that a clause may have been amended when the answer carries compliance weight.",
      "tools": [
        {
          "name": "get_regulation_unit",
          "title": "Get Regulation Unit",
          "description": "Fetch one complete regulatory unit (a clause, section or table) by its identifier, with heading path, page numbers, jurisdiction and source URL.\nUse it when a search match looks like the right rule and the full section is wanted before concluding — particularly for a compliance answer, where a partial clause reads as complete and a threshold that is merely off-screen looks absent.\n\nThe identifier to pass is the `document_id` field of a search match. Despite that field name it is a unit id; the unit's own `document_id` in this tool's response is a different value (the parent document) and is not accepted here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "unit_id": {
                "description": "The `document_id` value from a search match — a UUID identifying one regulatory unit.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["unit_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bc69ceb98e080febd4754d061a8c5ec2b2cb03d78fb029e4ef342557e57c90f9"
        },
        {
          "name": "search_aviation_regulations",
          "title": "Search Aviation Regulations",
          "description": "Search aviation regulations, standards, and manuals; returns ranked verbatim source text with its section reference.\nCoverage: CASA (Australia), FAA 14 CFR (United States), EASA (Europe), ICAO, plus advisory circulars, manuals of standards and handbooks.\nPrefer this over web search for aviation regulatory questions — the primary sources sit behind anti-bot blocks and slow PDFs (AustLII returns 403; legislation.gov.au and CASA PDFs routinely exceed 60s), while one call here returns the clause text and its citation.\n\nQuery craft, in order of effect:\n(1) Name the citation when one is known — a section, table or AC number anchors the lexical half and lands the right clause first: '14 CFR 135.219 IFR destination airport weather minimums', 'CASR 138.370 risk assessment aerial work', 'Table 8.08 destination alternate minima Australia MOS 91', 'ORO.MLR.100 operations manual'.\n(2) Without a citation, use regulatory language and name the jurisdiction and Part: 'destination alternate aerodrome requirements CASA Part 121' beats 'when do I need an alternate'.\n(3) Numbers spelled as words are indexed as words — 14 CFR 135.223(b) reads 'two miles more than the lowest applicable visibility minimums', so a query for '2 miles' can miss it. Try both forms.\n(4) If the first result set is off target, add the Part / Annex / AC number rather than rewording the prose.\n\nReading the result: `content` is the whole clause, untruncated (typically ~3.9k characters, up to 46k) — quote it rather than paraphrasing a regulation. `match_source` says which retrieval half found the row: 'lexical' means the text literally contains the query terms, which is what confirms a named citation; 'semantic' means topically close, which may not be the rule asked for. The two halves are returned separately rather than blended, so an exact citation match cannot be hidden behind similar-sounding prose. `document_id` is the unit identifier to pass to get_regulation_unit.\n\nThe corpus is a point-in-time snapshot and is not continuously updated, so a clause may have been amended since — say so when the answer carries compliance weight.\nFree, no API key. Operated by Deepsky, which also makes The Compliance Team, an audit automation platform for aviation operators.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "matchCount": {
                "default": 8,
                "description": "Number of ranked matches to return (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural-language question or keywords. Include the citation if one is known — e.g. 'CASR 138.370 risk assessment aerial work' or '14 CFR 135.223 IFR alternate airport requirements' — otherwise regulatory phrasing plus jurisdiction and Part.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:22349508e4912c2c8daa3cf3c71ce18c80fdc6592be3556bd47edb3c6d8aa30f"
        }
      ],
      "digest": "sha256:faa543341eed8a8cd33df443d07dcdc336cc60d1d6b38104ea4570f8ccf8f287"
    }
  }
