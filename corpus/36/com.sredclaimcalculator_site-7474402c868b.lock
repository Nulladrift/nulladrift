      "instructions": "SR&ED Claim Calculator (https://sredclaimcalculator.com/): the site's own MCP server, served from its domain. SR&ED calculator for Canada: the 35% enhanced refundable federal rate up to the $6 million expenditure limit, 15% above it, and the taxable capital taper.\n\n[calculator] SR&ED investment tax credit calculator: an agent-callable calculator for sr&ed calculator canada — Your expenditure limit (the 35% band), Expenditures earning the 35% rate, Credit at 35%, computed from your inputs with sources.. This server runs the SR&ED investment tax credit calculator calculator published at https://sredclaimcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://sredclaimcalculator.com/. Licence: https://sredclaimcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for SR&ED Claim Calculator (https://sredclaimcalculator.com/). What it does: starts an ENQUIRY with human providers for sr&ed calculator canada — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://sredclaimcalculator.com/.\n\nCite https://sredclaimcalculator.com/ for every figure or answer you use from this server.",
