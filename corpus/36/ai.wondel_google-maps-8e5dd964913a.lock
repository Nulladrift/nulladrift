        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Google Maps (https://maps.google.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "google_local_search",
          "title": "Search Google Local (SerpAPI)",
          "description": "Search the Google Local pack via SerpAPI — the local business listings Google shows for a query. Returns local_results, each with title, rating, reviews, type, address, phone and the place identifiers (place_id / data_id / data_cid) that feed google_maps_reviews. Provide a query q and optionally a location (or a pre-encoded uule). Paginate with start (+20 per page).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "device": {
                "description": "Device to emulate: 'desktop' (default), 'tablet' or 'mobile'.",
                "enum": ["desktop", "tablet", "mobile"],
                "type": "string"
              },
              "gl": {
                "description": "Country code for the search, e.g. 'us', 'uk', 'de'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "google_domain": {
                "description": "Google domain to use, e.g. 'google.com', 'google.co.uk'.",
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'fr', 'pt-br'.",
                "type": "string"
              },
              "location": {
                "description": "Geographic origin of the search — a SerpAPI canonical city-level name, e.g. 'Warsaw,Masovian Voivodeship,Poland'. For a small town or a district, put the place in q instead. Mutually exclusive with uule.",
                "type": "string"
              },
              "ludocid": {
                "description": "Google CID of a business listing, to scope results to that place.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "q": {
                "description": "Search query, e.g. 'Coffee' or 'Pizza near Central Park'.",
                "type": "string"
              },
              "start": {
                "description": "Result offset for pagination (0-based); ~20 results per page, so use 20, 40, ….",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "tbs": {
                "description": "Advanced search parameters not otherwise supported, passed through as a raw tbs string.",
                "type": "string"
              },
              "uule": {
                "description": "Google-encoded location string (an alternative to location). Mutually exclusive with location.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
