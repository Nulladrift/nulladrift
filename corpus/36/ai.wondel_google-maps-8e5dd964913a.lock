        {
          "name": "google_maps_directions",
          "title": "Get Google Maps Directions (SerpAPI)",
          "description": "Get directions between two points via SerpAPI. Provide a start point (one of start_addr, start_coords 'lat,lon', or start_data_id) and an end point (one of end_addr, end_coords, or end_data_id) — the data_ids come from google_maps_search results. Returns the route(s) with distance, duration and step-by-step legs. Shape the route with travel_mode (driving/transit/walking/…), avoid, and time. Result shape: { source, fetchedAt, query, search_metadata, search_parameters, places_info: [{ address, data_id, gps_coordinates }], durations: [{ travel_mode, duration, formatted_duration }], directions: [...] } — the list key is `directions`. Each direction: { travel_mode, via, distance (meters), duration (seconds), formatted_distance, formatted_duration, typical_duration_range, extensions, trips: [{ travel_mode, title, distance, duration, formatted_distance, formatted_duration, details: [{ title, action, distance, duration }] }] } plus, for transit, start_time, end_time, arrive_around, cost, currency; a Flight entry has only { travel_mode, icon, flight }.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "avoid": {
                "description": "Comma-separated route features to avoid: 'highways', 'tolls', 'ferries'.",
                "type": "string"
              },
              "distance_unit": {
                "anyOf": [
                  {
                    "const": 0,
                    "type": "number"
                  },
                  {
                    "const": 1,
                    "type": "number"
                  }
                ],
                "description": "Distance unit: 0=km, 1=miles."
              },
              "end_addr": {
                "description": "Ending address, e.g. 'Dallas, TX'. Provide one of end_addr/end_coords/end_data_id.",
                "type": "string"
              },
              "end_coords": {
                "description": "Ending GPS coordinates as 'lat,lon'.",
                "type": "string"
              },
              "end_data_id": {
                "description": "Place data id of the ending point (from a google_maps_search result).",
                "type": "string"
              },
              "gl": {
                "description": "Country code, e.g. 'us', 'uk', 'de'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'fr'.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "prefer": {
                "description": "Comma-separated transit preferences (travel_mode=3 only): 'bus', 'subway', 'train', 'tram_light_rail'.",
                "type": "string"
              },
              "route": {
                "anyOf": [
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  }
                ],
                "description": "Transit route option (travel_mode=3 only): 2=Fewer transfers, 3=Less walking, 4=Wheelchair accessible."
              },
              "start_addr": {
                "description": "Starting address, e.g. 'Austin, TX'. Provide one of start_addr/start_coords/start_data_id.",
                "type": "string"
              },
              "start_coords": {
                "description": "Starting GPS coordinates as 'lat,lon', e.g. '30.1974,-97.6663'.",
                "type": "string"
              },
              "start_data_id": {
                "description": "Place data id of the starting point (from a google_maps_search result).",
                "type": "string"
              },
              "time": {
                "description": "Departure/arrival time: 'depart_at:<unix>', 'arrive_by:<unix>', or 'last_available' (transit only).",
                "type": "string"
              },
              "travel_mode": {
                "anyOf": [
                  {
                    "const": 0,
                    "type": "number"
                  },
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  },
                  {
                    "const": 6,
                    "type": "number"
                  },
                  {
                    "const": 9,
                    "type": "number"
                  }
                ],
                "description": "Travel mode: 6=Best (default), 0=Driving, 1=Cycling, 2=Walking, 3=Transit, 4=Flight, 9=Two-wheeler."
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
