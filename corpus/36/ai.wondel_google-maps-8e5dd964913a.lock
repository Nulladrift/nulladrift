        {
          "name": "google_maps_reviews",
          "title": "Get Google Maps Reviews (SerpAPI)",
          "description": "Fetch the reviews of a Google Maps place via SerpAPI. Provide exactly one of place_id, data_id or data_cid — all come from google_maps_search or google_local_search results. A digit-only id (the `place_id` that google_local_search returns is a Google CID) is accepted in any of the three fields and resolved to the Maps data_id automatically via one place lookup. Returns reviews (author, rating, text, date) plus the topics you can filter by. Paginate with next_page_token from the previous response.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "data_cid": {
                "description": "Google CID of the place — the digit-only `place_id` google_local_search returns. Resolved to the Maps data_id via one place lookup. Provide exactly one of place_id, data_id or data_cid.",
                "type": "string"
              },
              "data_id": {
                "description": "Google Maps data_id of the place ('0x…:0x…' from google_maps_search). Provide exactly one of place_id, data_id or data_cid.",
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'fr', 'pt-br'.",
                "type": "string"
              },
              "next_page_token": {
                "description": "Pagination token from the previous response, to fetch the next page of reviews.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "num": {
                "description": "Number of reviews per page, 1-20 — only honoured together with next_page_token, topic_id or query; the initial page always returns 8 and the parameter is dropped there.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "place_id": {
                "description": "Google Maps place_id of the place ('ChIJ…' from google_maps_search). A digit-only value is treated as a Google CID and resolved automatically. Provide exactly one of place_id, data_id or data_cid.",
                "type": "string"
              },
              "query": {
                "description": "Filter/search reviews by free text. Mutually exclusive with topic_id.",
                "type": "string"
              },
              "sort_by": {
                "description": "Review sort order: 'qualityScore' (most relevant, default), 'newestFirst', 'ratingHigh', 'ratingLow'.",
                "enum": ["qualityScore", "newestFirst", "ratingHigh", "ratingLow"],
                "type": "string"
              },
              "topic_id": {
                "description": "Filter reviews by a topic id (from a prior response). Mutually exclusive with query.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aff21773ef1daf233d764207b0772c91d56488a1fa57ce4ac76f2d7541eab1d8"
        },
        {
          "name": "google_maps_search",
          "title": "Search Google Maps (SerpAPI)",
          "description": "Search Google Maps via SerpAPI. type=search (default) returns a list of places for a query q — paginate with start (+20 per page). type=place returns the full details of a single place identified by place_id or data_cid (both obtainable from a prior search result). Center the map with ll ('@lat,lon,zoomz') or lat/lon/z. The place_id / data_cid in results feed google_maps_reviews.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "data_cid": {
                "description": "Google Maps CID (data_cid) of a specific place (from a prior search result). Use with type=place; also feeds google_maps_reviews.",
                "type": "string"
              },
              "gl": {
                "description": "Country code for the search, e.g. 'us', 'uk', 'de'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "google_domain": {
                "description": "Google domain to use, e.g. 'google.com'.",
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'fr', 'pt-br'.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the map center (used with lon; alternative to ll).",
                "type": "number"
              },
              "ll": {
                "description": "Map center as '@lat,lon,zoomz' (latitude, longitude, zoom), e.g. '@40.7455096,-74.0083012,14z'. Zoom recommended 3z-15z.",
                "type": "string"
              },
              "location": {
                "description": "Geographic origin of the search — a SerpAPI canonical city-level name, e.g. 'Warsaw,Masovian Voivodeship,Poland'. For a small town or a district, put the place in q instead. SerpAPI requires z or m alongside it — z defaults to 14 when neither is given.",
                "type": "string"
              },
              "lon": {
                "description": "Longitude of the map center (used with lat; alternative to ll).",
                "type": "number"
              },
              "m": {
                "description": "Alternative map scale parameter, 1-15028132 (an alternative to the zoom level).",
                "maximum": 15028132,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price-level filter for places.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_price": {
                "description": "Minimum price-level filter for places.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_rating": {
                "description": "Minimum star-rating filter. Must be a string like '4.0' (a number such as 4.0 stringifies to '4' and breaks the filter).",
                "enum": ["2.0", "2.5", "3.0", "3.5", "4.0", "4.5"],
                "type": "string"
              },
              "nearby": {
                "description": "Search nearby the given coordinates. Default false.",
                "type": "boolean"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "open_at_hour": {
                "description": "Filter to places open at a given hour, 0-23. Use with open_on_day. Mutually exclusive with open_state.",
                "maximum": 23,
                "minimum": 0,
                "type": "integer"
              },
              "open_on_day": {
                "description": "Filter to places open on a given day (mon-sun). Combine with open_at_hour. Mutually exclusive with open_state.",
                "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                "type": "string"
              },
              "open_state": {
                "description": "Open-state filter: 'now' = open now, '24h' = open 24 hours. Mutually exclusive with open_on_day/open_at_hour.",
                "enum": ["now", "24h"],
                "type": "string"
              },
              "place_id": {
                "description": "Google Maps place_id of a specific place — an opaque string like 'ChIJ…' from a google_maps_search result. A digit-only id is a Google CID (what google_local_search calls place_id) and is sent as data_cid automatically. Use with type=place; also feeds google_maps_reviews.",
                "type": "string"
              },
              "q": {
                "description": "Search query, e.g. 'Coffee' or 'Restaurants'. Required for a search (type=search) unless place_id/data_cid is given.",
                "type": "string"
              },
              "start": {
                "description": "Result offset for pagination (0-based); 20 results per page, so use 20, 40, ….",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "type": {
                "description": "'search' (default) returns a list of places for q; 'place' returns details for a single place (requires place_id or data_cid).",
                "enum": ["search", "place"],
                "type": "string"
              },
              "z": {
                "description": "Map zoom level, 3-30 (higher = more zoomed in). Used with lat/lon or location; defaults to 14 when either is given without z or m.",
                "maximum": 30,
                "minimum": 3,
                "type": "integer"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5c9f408c8e4da827e5b14f5a1a99a0e1a62db8807424be9cf605396363ab461e"
        }
