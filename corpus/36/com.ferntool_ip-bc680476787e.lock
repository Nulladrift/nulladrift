{
  "lockfileVersion": 2,
  "subjects": {
    "com.ferntool/ip": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ferntool.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ferntool",
        "version": "0.14.15"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Network tools from ferntool.com: IP geolocation with VPN/Tor/datacenter flags, batch IP lookup, RDAP WHOIS, DNS, reverse DNS, DNS propagation checks, email security (SPF/DKIM/DMARC) checks, website up/down checks, link redirect tracing, subnet calculator, static QR codes, exact word/character counts, the current time, timestamp conversion, exact date maths, time zone conversion, fair random numbers and random picks from a list.",
      "tools": [
        {
          "name": "ai_service_status",
          "description": "Live status of AI services (ChatGPT/OpenAI, Claude, Gemini API, GitHub Copilot, Perplexity, Cohere) read from their official status pages, cached ~60s. level is up, degraded, down or unknown.",
          "inputSchema": {
            "properties": {
              "service": {
                "enum": ["chatgpt", "claude", "gemini", "copilot", "perplexity", "cohere"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c99d4a58c52e70021ed6e8e3d29e8fb51b281be4a29a291862497485d19f6408"
        },
        {
          "name": "analyze_email_headers",
          "description": "Is this email real or fake? Paste the raw headers of an email (Gmail Show original, Outlook View message details). Returns who really sent it (From, Reply-To, Return-Path), the SPF/DKIM/DMARC results recorded by the receiving provider, look-alike or fake sender names (banks, SARS, couriers, free-mail accounts posing as companies), every Received hop with delays, the sending server IP with country/network, and a verdict: verified, unverified or suspicious. Nothing is stored.",
          "inputSchema": {
            "properties": {
              "headers": {
                "description": "Raw email header text",
                "type": "string"
              }
            },
            "required": ["headers"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3304a6793301ce48e0701fb7e020f9d543e07deef90d481cdcf38eae6dbd3691"
        },
        {
          "name": "batch_lookup_ip",
          "description": "Look up 1-100 IPv4/IPv6 addresses at once. Each result has version, scope, country, timezone, ASN, network owner and flags (is_tor, is_datacenter, provider).",
          "inputSchema": {
            "properties": {
              "ips": {
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ips"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b2591cbcae26b21918d19ebfcb048e5dc3dc878b2fa65c3e81f1818ee699e458"
        },
        {
          "name": "check_dns_propagation",
          "description": "Check whether a DNS change has spread: asks the domain's own authoritative name server (when reachable) and 8 big public resolvers (Cloudflare, Google, OpenDNS, AdGuard, NextDNS, Control D, CleanBrowsing, AliDNS) over DoH, marks which are up to date, and gives the remaining cache time (TTL) of stale answers.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              },
              "type": {
                "description": "default A",
                "enum": ["A", "AAAA", "CNAME", "MX", "TXT", "NS"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:99969f624aa4f5020a64b48c95eed76f12f414831cd89887b9e4483eec3d2c8f"
        },
        {
          "name": "check_email_security",
          "description": "Can someone fake (spoof) email from a domain? Reads SPF (counts the 10 DNS-lookup limit, follows includes), DMARC (policy, pct, reports, inherited from the parent domain) and DKIM keys (common selectors, or the one given), detects the email provider from MX, and returns a plain verdict (protected / partial / unprotected) plus the exact TXT records to add.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain or email address, e.g. example.com or you@example.com",
                "type": "string"
              },
              "selector": {
                "description": "Optional DKIM selector, e.g. google or selector1",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd17959e1621c01b01838e1848a015482a66c7051bf09f4d26905011d36fa68a"
        },
        {
          "name": "check_website_legit",
          "description": "Is this website legit or a scam? Follows the URL (redirects included) and returns plain-language warning signs: domain age from RDAP (scam shops are usually days or weeks old), look-alike brand names (banks, SARS, couriers, Takealot, PayPal, Apple…), risky domain endings and scam words, look-alike letters, HTTPS, whether the domain receives email and has DMARC. verdict: no_signs, mostly_ok, caution or likely_scam. Warning signs only; not a malware scan.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Website or link, e.g. example-shop.co.za or https://bit.ly/abc",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3d800c9ee06fa282a203af90f78571421763b5dee15d71eefdfcf34167f37f2"
        },
        {
          "name": "check_website_status",
          "description": "Is a website down? Resolves its DNS and loads the URL once (10 s timeout) from FernTool's Cloudflare edge, then returns verdict (up/down), reason (ok, blocked_bot, page_not_found, server_error, timeout, tls, dns_nxdomain...), HTTP status, response time, final URL after redirects and server country/network. One vantage point only; results cached 30 s.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Website address, e.g. example.com or https://example.com/page",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d95f3c9286621369a32a2e6811dc70088ce0eb8b83abda1a5d293636483f4228"
        },
        {
          "name": "convert_timestamp",
          "description": "Convert a Unix timestamp (seconds, milliseconds, microseconds or nanoseconds, auto-detected) to a readable date, or a date/time string (e.g. 2026-12-25 09:00, read in the given time zone unless it has its own offset) to a Unix timestamp. Also returns weekday, ISO week and how long ago or until.",
          "inputSchema": {
            "properties": {
              "timezone": {
                "description": "IANA time zone for display and for dates without an offset (default UTC)",
                "type": "string"
              },
              "value": {
                "description": "Timestamp like 1760000000 or a date like 2026-12-25T09:00",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:627fdcc2820117eacb334acad33fe2e30361770768ab25338af3f67d0dff5b1b"
        },
        {
          "name": "convert_timezone",
          "description": "Convert a time between time zones with daylight saving applied (you cannot do this reliably yourself). from/to accept IANA zones (Africa/Johannesburg), common abbreviations (SAST, EST, PST, GMT, CET, IST=India, CST=US Central) or big cities. Omit time for now. Returns each local date, time, UTC offset, abbreviation, hour difference and whether it is the next/previous day.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Source zone (default UTC)",
                "type": "string"
              },
              "time": {
                "description": "e.g. 2026-12-25 09:00, 14:30 or 2:30pm (today in from); omit for now",
                "type": "string"
              },
              "to": {
                "description": "Target zones",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69c67a9f97fae507e527c1d6caffadf5efadde60f5e5e89262e796117664e162"
        },
        {
          "name": "count_words",
          "description": "Exactly count words, characters (with and without spaces), sentences and paragraphs in a text, with reading/speaking time and the most repeated words. Use this instead of estimating counts yourself.",
          "inputSchema": {
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63ebfcae7bae52ea045088362e590463ffe2a533870d359f92c39a72eda483e4"
        },
        {
          "name": "date_calc",
          "description": "Exact calendar maths. With end: days between two dates (plus weeks, months+days, weekdays Mon-Fri, weekend days). With add_days/add_weeks/add_months/add_years (negative to subtract): the resulting date and weekday; business_days=true skips weekends. Use this instead of counting days yourself.",
          "inputSchema": {
            "properties": {
              "add_days": {
                "type": "integer"
              },
              "add_months": {
                "type": "integer"
              },
              "add_weeks": {
                "type": "integer"
              },
              "add_years": {
                "type": "integer"
              },
              "business_days": {
                "description": "add_days counts Monday-Friday only",
                "type": "boolean"
              },
              "end": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "include_end": {
                "description": "Count the end date too (default false)",
                "type": "boolean"
              },
              "start": {
                "description": "YYYY-MM-DD (default: today in timezone)",
                "type": "string"
              },
              "timezone": {
                "description": "IANA zone used for today when start is omitted (default UTC)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0887ab5c2cfcb423cb732fae404f1faca6e189830de806aaf8811da89c127ad"
        },
        {
          "name": "dns_lookup",
          "description": "Resolve DNS records for a domain via Cloudflare 1.1.1.1 DNS-over-HTTPS. Types: A, AAAA, MX, TXT, NS, CNAME, SOA (default: all).",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
