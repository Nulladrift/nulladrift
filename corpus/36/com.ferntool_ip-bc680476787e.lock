        {
          "name": "whois_lookup",
          "description": "WHOIS via RDAP for a domain (registrar, created/expiry dates, status, nameservers, DNSSEC), an IP address (network name, range, owner org, country, abuse contact) or an ASN like AS13335.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Domain, IPv4/IPv6 address, or ASN (e.g. AS13335)",
                "type": "string"
