          },
          "digest": "sha256:f793a6ac91e9fa52566926298d06b8e17884d28d02045507d841d5b58f948f09"
        },
        {
          "name": "estimate_ai_cost",
          "description": "Estimate token count and USD API cost of a text across major AI models (OpenAI GPT, Anthropic Claude, Google Gemini), and whether it fits each context window. Token counts are approximate. Pass text, or tokens directly.",
          "inputSchema": {
            "properties": {
              "output_tokens": {
                "description": "Expected reply length in tokens (default: same as input)",
                "minimum": 0,
                "type": "integer"
              },
              "text": {
                "type": "string"
              },
              "tokens": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c57c9b14f7bb3c17f2ef590e7086c498462790d7667b5e19bc491bcfda4d78a7"
        },
        {
          "name": "generate_spf_record",
          "description": "Build one valid SPF TXT record for a domain from the services that send its email (e.g. microsoft365, google, mailchimp, sendgrid, website). Optionally reads the domain's current SPF record and MX first (keeps unknown entries, warns about services it would drop), adds extra IPs/includes, and counts DNS lookups live against the 10-lookup limit. Returns the record, DNS name, lookup count, notes and a starter DMARC record. Service ids: microsoft365, google, zoho, proton, fastmail, icloud, mimecast_za, mimecast, website, mx, shopify, mailchimp, mandrill, brevo, mailerlite, constantcontact, campaignmonitor, mailjet, sendpulse, sendgrid, mailgun, amazonses, postmark, zendesk, freshdesk, helpscout, salesforce.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional domain to read the current record from",
                "type": "string"
              },
              "includes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ips": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "services": {
                "description": "Service ids",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "strict": {
                "description": "true = -all, default ~all",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90a3d1ff3f263e0c45a1dcd89965287ff535246ea59e2f0f7b5471de2751d92f"
        },
        {
          "name": "get_current_time",
          "description": "Get the exact current date and time (you cannot know it otherwise). Returns Unix seconds and milliseconds, ISO 8601 in UTC and in the requested IANA time zone, weekday, ISO week and day of year.",
          "inputSchema": {
            "properties": {
              "timezone": {
                "description": "IANA time zone, e.g. Africa/Johannesburg or America/New_York (default UTC)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
