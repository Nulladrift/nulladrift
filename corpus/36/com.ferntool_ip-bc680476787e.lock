        },
        {
          "name": "pick_random",
          "description": "Fairly pick random winners from a list, shuffle a list, or split people into random even teams, using a cryptographically secure generator (you cannot choose fairly at random yourself). Use for giveaways, raffles, \"who goes first\", random order or team splits. An item listed twice has twice the chance unless dedupe=true.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many winners for mode=pick (default 1, never repeats an entry)",
                "minimum": 1,
                "type": "integer"
              },
              "dedupe": {
                "description": "Remove duplicate entries first (case-insensitive)",
                "type": "boolean"
              },
              "items": {
                "description": "The names or items",
                "items": {
                  "type": "string"
                },
                "maxItems": 10000,
                "minItems": 1,
                "type": "array"
              },
              "mode": {
                "description": "default pick",
                "enum": ["pick", "shuffle", "teams"],
                "type": "string"
              },
              "teams": {
                "description": "Number of teams for mode=teams (default 2)",
                "minimum": 2,
                "type": "integer"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
