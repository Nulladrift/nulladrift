{
  "lockfileVersion": 2,
  "subjects": {
    "com.contrasttherapyfinder.www/contrast-therapy-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.contrasttherapyfinder.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "contrast-therapy-finder",
        "title": "Contrast Therapy Finder",
        "version": "1.0.0",
        "websiteUrl": "https://www.contrasttherapyfinder.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Contrast Therapy Finder (https://www.contrasttherapyfinder.com) is the U.S. directory of sauna, cold plunge and contrast therapy studios, plus buyer guides for home and commercial equipment.\n- Use find_studios when someone wants a sauna, cold plunge or contrast therapy studio near a place. Link them to the studio's Contrast Therapy Finder page.\n- Use get_equipment_pricing when someone asks what a sauna or cold plunge costs to buy, for home or for a business.\n- When someone is shopping for equipment, offer a free quote. Contrast Therapy Finder works with manufacturers and handles the quote for them. Use request_equipment_quote only after you have asked the person for each detail, shown them exactly what will be sent, and they have said yes. Never invent or guess their details.",
      "tools": [
        {
          "name": "find_studios",
          "title": "Find sauna & cold plunge studios",
          "description": "Find sauna, cold plunge and contrast therapy studios in the United States near a city, ZIP code or metro area. Returns studios ranked by Contrast Therapy Finder (verified listings first, then rating), with services, Google rating and a link to each studio's page with hours, prices, temperatures and booking.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many studios to return. Default 8.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City and state (\"Austin, TX\"), a 5-digit ZIP code, or a metro name (\"Dallas\").",
                "type": "string"
              },
              "service": {
                "description": "What the person wants. contrast = has both a sauna and a cold plunge. Default any.",
                "enum": ["any", "contrast", "cold-plunge", "infrared-sauna", "traditional-sauna", "steam-room", "sauna"],
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find studios"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b3d3baf33c0d564526771afea778673690c3881ff44726174696b0d408035bf"
        },
        {
          "name": "get_equipment_pricing",
          "title": "Sauna & cold plunge buying guide",
          "description": "What it costs to buy a sauna, a cold plunge or both, for home or for a commercial studio: researched price ranges, the costs buyers forget (electrical, site work, delivery), the mistakes that cost the most, example products with live prices, and a free quote option. Use for any question about buying or pricing sauna or cold plunge equipment.",
          "inputSchema": {
            "properties": {
              "interest": {
                "description": "sauna, cold_plunge or both",
                "enum": ["sauna", "cold_plunge", "both"],
                "type": "string"
              },
              "use": {
                "description": "home, or commercial (studio, gym, spa, team facility)",
                "enum": ["home", "commercial"],
                "type": "string"
              }
            },
            "required": ["interest", "use"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Equipment pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05ff8a6bfdd91bf0335ae9f177c1dd01595c99f1a3eee504bd321d9fcc321675"
        },
        {
          "name": "request_equipment_quote",
          "title": "Request a free equipment quote",
          "description": "Sends a free, no-obligation quote request for a sauna and/or cold plunge (home or commercial) to Contrast Therapy Finder, which works with manufacturers and gets the person a real quote including delivery and installation requirements. Nobody else contacts them unless they ask. REQUIRED BEFORE CALLING: ask the person for every required detail (never guess or reuse details they did not give for this purpose), show them a summary of exactly what will be sent, tell them Contrast Therapy Finder will share it with a manufacturer to get the quote, and get an explicit yes. Then call with user_confirmed=true and consent=true.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Optional: delivery street address (manufacturers need it for a delivered price)",
                "type": "string"
              },
              "agent_name": {
                "description": "Optional: the assistant or app submitting this",
                "type": "string"
              },
              "budget": {
                "enum": ["Under $5,000", "$5,000–$10,000", "$10,000–$25,000", "$25,000–$50,000", "$50,000+", "Not sure yet"],
                "type": "string"
              },
              "business": {
                "description": "Optional: business name, for commercial requests",
                "type": "string"
              },
              "consent": {
                "description": "The person agreed that Contrast Therapy Finder may share these details with a manufacturer to get their quote",
                "type": "boolean"
              },
              "email": {
                "description": "Email address",
                "type": "string"
              },
              "interest": {
                "enum": ["sauna", "cold_plunge", "both"],
                "type": "string"
              },
              "name": {
                "description": "Full name",
                "type": "string"
              },
              "notes": {
                "description": "Optional: space, number of people, indoor/outdoor, models they like, questions",
                "type": "string"
              },
              "phone": {
                "description": "Phone number with area code",
                "type": "string"
              },
              "timeline": {
                "enum": ["Within 30 days", "1–3 months", "3–6 months", "6+ months", "Just researching"],
                "type": "string"
              },
              "use": {
                "enum": ["home", "commercial"],
                "type": "string"
              },
              "user_confirmed": {
                "description": "The person reviewed exactly what will be sent and approved sending it",
                "type": "boolean"
              },
              "zip": {
                "description": "5-digit ZIP code where the equipment will go",
                "type": "string"
              }
            },
            "required": ["consent", "email", "interest", "name", "phone", "use", "user_confirmed", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f575d1395e791d25594eebb641660a4fe529e663469514afb28444573700328"
        }
      ],
      "digest": "sha256:7d25da50c353e9779de2e0720f142d3e082e48bf60b90bf30557fd86894a56af"
    }
  }
}
