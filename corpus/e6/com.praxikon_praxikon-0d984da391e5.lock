      "instructions": "Read only access to the published Praxikon implementation graph of the EU AI Act, the case check under the GDPR and the AI Act, and the published answers on both. Nothing here is generated: every field comes from a published object or from a deterministic computation over one, and every result carries its sources. To assess one system, call classify_system with a coded profile; send a version 2 profile to have the wider set of duties assessed, including Article 26 for a deployer. Use explain_applicability for the legal path behind one obligation and get_source_provenance before you quote a statement, which also reads a GDPR obligation by its praxikon:eu:gdpr identifier; both take an identifier from earlier tool output, and without one answer_question or check_case is the route. get_national_enforcement names the supervisor per member state. When the user describes a concrete use of AI or of personal data and asks whether a DPIA, a FRIA or GDPR and AI Act duties apply, call check_case with the coded answers only, never with the case text or personal data; export_dpia_intake turns the same answers into the DPIA intake as a Word file. For a short general question, call answer_question with the question rewritten in general terms, without names or other personal data. If the user asks that Praxikon does not keep their question, pass store_for_improvement false. The prompts dpia-scan, fria-voorbereiding, leverancierscheck-ai and ai-act-classificatie set out fixed workflows. Answers are compact by default; pass detail full only when the user needs the complete objects. Call request_expert_review only when the user asks to talk to a person. This is not legal advice and not a supervisory authority.",
      "tools": [
        {
          "name": "answer_question",
          "title": "Answer a short general question about the AI Act or the GDPR",
          "description": "Use this for a short, general question about the EU AI Act or the GDPR (AVG), such as whether a customer service chatbot has to say that it is AI or when a DPIA is required. It looks the question up in the published Praxikon answers: deterministic, no language model, and with the articles and sources. Before you call it, rewrite the question in general terms in at most 200 characters: no names of people or organisations, no contact details, no numbers that identify a person or a case. A question that looks like it contains personal data is refused. The question never goes into a URL, a server log or an analytics service. Praxikon may keep it, after a filter for personal data, to improve its answers, unless store_for_improvement is false (privacy statement, section 2.7). An unrecognised question returns no answer rather than a constructed one, and so does a question about law outside the EU: Praxikon covers only the EU AI Act and the GDPR. For one concrete system or case, the coded assessment tools give a fuller answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "nl",
                "description": "Language of the answer. Dutch is the default.",
                "enum": ["nl", "en"],
                "type": "string"
              },
              "question": {
                "description": "The question in general terms, without names, contact details or identifying numbers.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "store_for_improvement": {
                "default": true,
                "description": "Optional. Set to false when the user asks that Praxikon does not keep this request to improve its answers; only the anonymous daily count remains. See https://www.praxikon.com/nl/legal/privacy, section 2.7.",
                "type": "boolean"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "type": "object"
              },
              "answer": {
                "description": "The compact answer, as the published answer endpoint returns it, without the question.",
                "type": ["object", "null"]
              },
              "answered": {
                "type": "boolean"
              },
              "lang": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "mode": {
                "description": "scenario, semantic, gdpr, koppeling, out_of_scope (law outside the EU) or none.",
                "type": "string"
              },
              "provenance": {
                "required": ["retrieved"],
                "type": "object"
              },
              "stored": {
                "type": "boolean"
              },
              "view": {
                "type": "string"
              }
            },
            "required": ["answered", "lang", "provenance", "view"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Answer a short general question about the AI Act or the GDPR"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d98f81540101c17b3f9e39134a97f21d99d6751e8401b2bb1002313bbcb67dcb"
