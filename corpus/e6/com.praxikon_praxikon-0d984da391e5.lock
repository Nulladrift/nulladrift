        {
          "name": "check_case",
          "title": "Case check: GDPR and EU AI Act",
          "description": "Use this when the user describes a concrete, intended use of AI or of personal data (a system, a project, a supplier) and wants to know whether a DPIA, a FRIA or duties under the GDPR (AVG) and the EU AI Act come into play. It runs the Praxikon case check: fixed rules over fixed answers, the same rules as the case check on the site. It returns per law (GDPR, AI Act, and where the two meet) each test with its outcome, the article and a source link, the DPIA and FRIA signal, the next steps and the facts that are still open. Fill in the answers yourself from what the user said, and ask the user for a fact that decides a test rather than guessing it. Leave out what is not known: it counts as unknown, never as no. Send only these coded answers and never the case text, names or other personal data; there is no field for them. Show the notice with the result. It does not build the implementation graph or the obligation list of one AI system.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aiSystem": {
                "default": "unknown",
                "description": "Is it an AI system: does it infer the outcome from data itself (machine learning, language model), rather than only applying fixed rules written by a human? Fixed rules drawn up by people, such as a calculation rule or a written-out decision tree, are not. A model trained on examples is, even if it stops learning once in use. An expert system that draws its own conclusions from encoded knowledge can be too.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "apCategories": {
                "description": "Categories of the Dutch Data Protection Authority list of processing that requires a DPIA (Stcrt. 2019, 64418) that the facts confirm; leave out any the facts do not show.",
                "items": {
                  "enum": ["covert_investigation", "blacklists", "fraud_prevention", "credit_scores", "financial_situation", "genetic_data", "health_data", "partnerships", "camera_surveillance", "body_cameras", "employee_monitoring", "location_data", "communication_data", "internet_of_things", "profiling", "behaviour_influence", "biometric_data"],
                  "type": "string"
                },
                "maxItems": 17,
                "type": "array",
                "uniqueItems": true
              },
              "automated": {
                "default": "unknown",
                "description": "Is the decision about a person taken without a human assessing the case on its merits? Also yes if a human only sees part of it, such as the top ten, and the rest get a decision, such as a rejection, without human review. Merely not being selected for closer checks is no decision.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "criminal": {
                "default": "unknown",
                "description": "Does it involve personal data relating to criminal convictions or offences, including a suspicion? Art. 10 GDPR: for example a criminal record, a criminal case, or a suspicion or report of an offence.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "domain": {
                "default": "unknown",
                "description": "What is the system used for? Areas of Annex III or Annex I of the AI Act. For other insurance than life or health, or for fraud detection, choose none. Values: public_benefits = Granting, reducing or recovering benefits, allowances or other public services; credit = Creditworthiness or credit score of natural persons; life_health_insurance = Risk assessment and pricing in life or health insurance only; emergency = Classifying emergency calls or emergency healthcare; employment = Recruitment, selection, evaluation or task allocation of staff; education = Admission, evaluation or monitoring of tests in education; biometrics = Biometric identification or categorisation of people; law_enforcement = Police and criminal investigation; migration = Migration, asylum or border control; justice = Administration of justice or elections; critical_infra = Safety component of critical infrastructure (energy, water, traffic); product = Part of a product with CE marking, such as a medical device; none = None of these.",
                "enum": ["public_benefits", "credit", "life_health_insurance", "emergency", "employment", "education", "biometrics", "law_enforcement", "migration", "justice", "critical_infra", "product", "none", "unknown"],
                "type": "string"
              },
              "effect": {
                "default": "unknown",
                "description": "Does the outcome have legal effects or affect people significantly (benefit, job, loan, investigation, exam)?",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "frequency": {
                "default": "unknown",
                "description": "For how long and how often is the system used? Values: continuous = Continuously, with no end date: for every application or case, or every day; periodic = Periodically, with no end date: in fixed rounds, for example monthly or yearly; limited = For a limited period, such as a pilot or a one-off project.",
                "enum": ["continuous", "periodic", "limited", "unknown"],
                "type": "string"
              },
              "inService": {
                "default": "unknown",
                "description": "Was the system put into service or placed on the market before 2 December 2027? Also yes if it is in use now or goes into use before that date, or if the same type and model was on the EU market or in use before then (Recital 39 of Regulation (EU) 2026/1744). A significant change in its design or intended purpose afterwards makes it count as new. For a product under Annex I the date is 2 August 2028.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "interaction": {
                "description": "Does the system do one or more of these things? Values: chatbot = People talk or chat with it directly; generated = It creates text, images, audio or video; deepfake = It creates images, audio or video that look real (deepfake); emotion = It recognises the emotions or mood of people.",
                "items": {
                  "enum": ["chatbot", "generated", "deepfake", "emotion"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array",
                "uniqueItems": true
              },
              "interactionKnown": {
                "description": "Whether interaction is settled, so that an empty list means none of these. Defaults to true when interaction is sent, false when left out; never false when interaction lists items.",
                "type": "boolean"
              },
              "lang": {
                "default": "nl",
                "description": "Language of the result. Dutch is the default.",
                "enum": ["nl", "en"],
                "type": "string"
              },
              "org": {
                "default": "unknown",
                "description": "What kind of organisation uses the system? Values: public = Government or public-law legal person (municipality, implementing agency, GGD, public university, public-authority school); public_service = Private organisation providing a public service (e.g. privately run school or college, care foundation, housing association); company = Company or other private organisation.",
                "enum": ["public", "public_service", "company", "unknown"],
                "type": "string"
              },
              "personalData": {
                "default": "unknown",
                "description": "Are personal data processed (data about identifiable people)?",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "profiling": {
                "default": "unknown",
                "description": "Does the system produce a score, ranking or prediction about persons (profiling)? Scoring businesses (establishments, declarants, licence holders): yes only if sole traders or other natural persons are among them; only legal persons: no.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "role": {
                "default": "unknown",
                "description": "What is the role of that organisation with regard to the AI system? Values: deployer = Uses a system from a supplier (deployer); provider = Develops it itself and places it on the market under its own name (provider); both = Develops it itself and also uses it itself (provider and deployer); gpai = Makes a general-purpose AI model, such as a language model, for others.",
                "enum": ["deployer", "provider", "both", "gpai", "unknown"],
                "type": "string"
              },
              "scale": {
                "default": "unknown",
                "description": "Does it involve many people, or are people systematically monitored or observed? For example thousands of data subjects, all residents or customers, or continuous monitoring with cameras, location or software.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "special": {
                "default": "unknown",
                "description": "Does it involve special categories of personal data (health, genetic, biometric, racial or ethnic origin, religion or belief, political opinion, trade union membership, sex life or sexual orientation)?",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "store_for_improvement": {
                "default": true,
                "description": "Optional. Set to false when the user asks that Praxikon does not keep this request to improve its answers; only the anonymous daily count remains. See https://www.praxikon.com/nl/legal/privacy, section 2.7.",
                "type": "boolean"
              },
              "transfer": {
                "default": "unknown",
                "description": "Do the data go to a country outside the European Economic Area, including via the supplier or a cloud?",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answers_used": {
                "type": "object"
              },
              "dpia": {
                "type": ["string", "null"]
              },
              "fria": {
                "type": ["string", "null"]
              },
              "full_check_url": {
                "type": "string"
              },
              "headline": {
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "law_date": {
                "type": "string"
              },
              "laws": {
                "required": ["ai_act", "avg", "koppeling"],
                "type": "object"
              },
              "left_out": {
                "type": "object"
              },
              "notice": {
                "type": "string"
              },
              "open_questions": {
                "type": "array"
              },
              "outcome_labels": {
                "type": "object"
              },
              "outcome_note": {
                "type": "string"
              },
              "provenance": {
                "required": ["retrieved"],
                "type": "object"
              },
              "recommendations": {
                "type": "array"
              },
              "sources": {
                "type": "array"
              },
              "transition_note": {
                "type": "object"
              },
              "view": {
                "type": "string"
              }
            },
            "required": ["dpia", "fria", "full_check_url", "headline", "laws", "notice", "open_questions", "provenance", "view"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Case check: GDPR and EU AI Act"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3daf1e71e7c8744eee864cc711fad771850fb10c0f137d967001a033385463a1"
