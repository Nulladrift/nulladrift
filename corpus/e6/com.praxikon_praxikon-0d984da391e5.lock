        {
          "name": "classify_system",
          "title": "Classify one AI system against the routes of the Regulation",
          "description": "Use this as the first step when you hold a concrete AI system and need to know which routes of the EU AI Act come into view: prohibited practice screening, Annex III high risk, transparency, FRIA and the general purpose model route, and with a version 2 profile the wider set of duties, such as Article 26 for a deployer. It runs the deterministic decision engine over coded answers and returns one applicability status per assessed obligation, with the timing and what is still open. It is not meant for a general question about the law. An obligation the engine did not assess is listed in assessment_scope.not_assessed with the reason; it was not found inapplicable. It does not return a single coded classification label.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": "brief",
                "description": "brief keeps the outcome, dates, reasons, open questions and the source with its locator; full adds the complete objects, statement texts and hashes, for re-computation or archiving.",
                "enum": ["brief", "full"],
                "type": "string"
              },
              "lang": {
                "default": "nl",
                "description": "Language of the labels and explanations. Dutch is the default.",
                "enum": ["nl", "en"],
                "type": "string"
              },
              "profile": {
                "additionalProperties": false,
                "description": "The coded answers about one system. The fifteen version 1 fields are required. A field that does not bear on this case takes not_relevant, and unsure is a real answer that leads to insufficient_context rather than to a guess. A version 1 profile has five obligations assessed. To have the wider set assessed, including Article 26 for a deployer of a high risk system, also send profile_version 2.0.0, chain_roles (consistent with actor_role) and the twelve other version 2 scope facts: ai_system_scope, jurisdiction_established_in_eu, jurisdiction_market_in_eu, jurisdiction_output_in_eu, scope_exclusion, annex_i_product, annex_i_third_party_conformity, article_25_role_change, provider_outside_eu, sandbox_participation, real_world_testing and adverse_significant_decision. The remaining version 2 facts are optional: an unanswered fact is unknown and leads to insufficient_context, never to a silent no. The backend rejects a profile whose answers contradict each other.",
                "properties": {
                  "actor_role": {
                    "description": "The role the assessed organisation occupies for this system.",
                    "enum": ["provider", "deployer", "provider_and_deployer", "gpai_model_provider", "importer_or_distributor", "unsure"],
                    "type": "string"
                  },
                  "adverse_significant_decision": {
                    "description": "Does the deployer take a decision on the basis of the output from the high-risk AI system listed in Annex III (other than point 2) which produces legal effects for the affected person, or similarly significantly affects that person in a way that they consider to have an adverse impact on their health, safety or fundamental rights (Article 86(1))?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "ai_system_scope": {
                    "description": "Is the assessed thing an AI system in the sense of Article 3(1)?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "annex_i_product": {
                    "description": "Is the system a product, or a safety component of a product, under the Union legislation in Annex I?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "annex_i_third_party_conformity": {
                    "description": "Does that product need a third party conformity assessment? not_relevant without an Annex I product.",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "annex_iii_domain": {
                    "description": "The Annex III domain of the intended purpose.",
                    "enum": ["biometrics", "critical_infrastructure", "education", "employment", "essential_services", "law_enforcement", "migration_border", "justice_democracy", "none", "unsure"],
                    "type": "string"
                  },
                  "annex_iii_use_case": {
                    "description": "The coded Annex III use case. Its prefix must match the domain: employment takes emp-, education takes edu-, and so on. none with domain none, unsure with domain unsure.",
                    "enum": ["bio-1a", "bio-1b", "bio-1c", "ci-2", "edu-3a", "edu-3b", "edu-3c", "edu-3d", "emp-4a", "emp-4b", "es-5a", "es-5b", "es-5c", "es-5d", "le-6a", "le-6b", "le-6c", "le-6d", "le-6e", "mig-7a", "mig-7b", "mig-7c", "mig-7d", "jd-8a", "jd-8b", "none", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "article_25_already_high_risk": {
                    "description": "With a role change, is the system concerned already high risk? not_relevant without a role change.",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "article_25_role_change": {
                    "description": "A role change under Article 25(1), or none.",
                    "enum": ["none", "own_name_or_trademark", "substantial_modification", "changed_purpose_high_risk", "unsure"],
                    "type": "string"
                  },
                  "article_50_market_date": {
                    "description": "Required for a provider with the synthetic_content scenario, not_relevant otherwise.",
                    "enum": ["before_2026_08_02", "on_or_after_2026_08_02", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "article_50_scenarios": {
                    "description": "The transparency scenarios of Article 50 that occur. none and unsure are exclusive: neither combines with another value.",
                    "items": {
                      "enum": ["direct_interaction", "synthetic_content", "emotion_or_biometric", "deepfake", "public_interest_text", "none", "unsure"],
                      "type": "string"
                    },
                    "maxItems": 5,
                    "minItems": 1,
                    "type": "array",
                    "uniqueItems": true
                  },
                  "article_5_signal": {
                    "description": "Screening signal for the prohibited practices of Article 5.",
                    "enum": ["none_known", "manipulation_exploitation_or_social_scoring", "biometric_or_remote_identification", "emotion_at_work_or_school", "predictive_policing", "non_consensual_intimate_or_csam", "unsure"],
                    "type": "string"
                  },
                  "article_6_3_documented": {
                    "description": "Is the Article 6(3) assessment documented?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "article_6_3_exception": {
                    "description": "Which condition of Article 6(3) is invoked, if any.",
                    "enum": ["none", "narrow_procedural", "improves_completed_activity", "detects_patterns", "preparatory", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "article_6_3_no_significant_risk": {
                    "description": "Is there no significant risk of harm in the sense of Article 6(3)?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "article_6_3_profiling": {
                    "description": "Does the system perform profiling of natural persons?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "chain_roles": {
                    "description": "The roles in the value chain, kept apart. Must agree with actor_role, for example [deployer] with actor_role deployer.",
                    "items": {
                      "enum": ["provider", "deployer", "importer", "distributor", "authorised_representative", "gpai_model_provider"],
                      "type": "string"
                    },
                    "maxItems": 6,
                    "minItems": 1,
                    "type": "array",
                    "uniqueItems": true
                  },
                  "complaint_to_authority": {
                    "description": "Has a complaint been lodged with a market surveillance authority?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "controlled_input_data": {
                    "description": "Does the deployer exercise control over the input data (Article 26(4))?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "decision_influence": {
                    "description": "Required when an exact Annex III use case is named, not_relevant otherwise.",
                    "enum": ["profiles_people", "materially_influences", "narrow_or_preparatory", "no_material_influence", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "decisions_about_people": {
                    "description": "Does the system make or assist decisions about natural persons (Article 26(11))?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "direct_interaction_obvious": {
                    "description": "Required with the direct_interaction scenario, not_relevant otherwise.",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "eu_nexus": {
                    "description": "The connection to the Union market. none leads to out of scope.",
                    "enum": ["offered_or_used_in_eu", "output_used_in_eu", "none", "unsure"],
                    "type": "string"
                  },
                  "fria_context": {
                    "description": "Required for a deployer with an exact Annex III use case other than ci-2, not_relevant otherwise.",
                    "enum": ["public_body", "private_public_service", "creditworthiness", "life_or_health_insurance", "none", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "gpai_commission_designated": {
                    "description": "Has the Commission designated the model as having systemic risk?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "gpai_compute_above_threshold": {
                    "description": "Is the training compute above the threshold of Article 51(2)?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "gpai_high_impact_capabilities": {
                    "description": "Does the model have high impact capabilities under Article 51(1)(a)?",
                    "enum": ["yes", "no", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "gpai_market_date": {
                    "description": "Required when the model is placed on the Union market, not_relevant otherwise.",
                    "enum": ["before_2025_08_02", "on_or_after_2025_08_02", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "gpai_open_source_status": {
                    "description": "Required when the model is placed on the Union market, not_relevant otherwise.",
                    "enum": ["qualifying_without_systemic_risk", "not_qualifying_or_systemic_risk", "unsure", "not_relevant"],
                    "type": "string"
                  },
                  "gpai_systemic_notification": {
