        {
          "name": "sweep_simulations",
          "description": "Grid-search up to your tier's budget (96 configs at Contender,\n24 below) of portfolio constructions in one call.\n\nIMPORTANT: choose candidates on in-sample numbers (`is_stats`),\nprefer settings whose neighbors also perform, and read out-of-sample\nnumbers (`oos_stats`) only after choosing: picking on the\nout-of-sample period makes it in-sample.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "challenge_slug": {
                "default": "hyperliquid-ranking",
                "description": "Challenge slug, such as hyperliquid-ranking. list_all_challenges gives the slugs.",
                "type": "string"
              },
              "config": {
                "additionalProperties": true,
                "description": "Base configuration; swept knobs override it.",
                "type": "object"
              },
              "oos_days": {
                "default": 90,
