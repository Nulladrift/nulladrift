{
  "lockfileVersion": 2,
  "subjects": {
    "com.fieldtranscript/transcriber": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fieldtranscript.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "FieldTranscript",
        "version": ""
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Verbatim transcription of videos and audio for LLM use. Submit a public video/audio URL, poll until done, then fetch the transcript. Jobs take roughly 1-10 minutes depending on length. Media is deleted from the server the moment the text is ready; only the text is kept.",
      "tools": [
        {
          "name": "delete_job",
          "description": "Permanently delete a finished (done or errored) transcription job and its stored text. Refused while the job is queued or running. This cannot be undone.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "delete_jobArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:224524083aae8c5e3ed1c7c79585875a21a0d156b197582cf3d8a6e58f4b6931"
        },
        {
          "name": "get_job",
          "description": "Check a transcription job. Returns status (queued / working / done / error) and metadata. Set include_transcript=true only once status is 'done' and you actually need the full text in context - transcripts of long videos are large.",
          "inputSchema": {
            "properties": {
              "include_transcript": {
                "default": false,
                "title": "Include Transcript",
                "type": "boolean"
              },
              "job_id": {
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "get_jobArguments",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:861d853f5ef75299dd9e1f8201147a554beb14203798e63ae2795c05a3631223"
        },
        {
          "name": "list_jobs",
          "description": "List all transcription jobs on your account, newest first.",
          "inputSchema": {
            "properties": {},
            "title": "list_jobsArguments",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9324d6c461a2656f8aa9cb943873b13436e6c89dfb76d10253769528b73c15ec"
        },
        {
          "name": "submit_transcription",
          "description": "Submit a public video or audio URL (YouTube etc.) for verbatim transcription. Returns a job_id immediately. Transcription takes ~1-10 minutes: poll get_job with the job_id every 30-60 seconds until status is 'done', then call get_job with include_transcript=true. Not for private/internal URLs.",
          "inputSchema": {
            "properties": {
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "submit_transcriptionArguments",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51fe984c80bb1a6a5528eb429e5b02cfc03480462014ad9ce7e4d559ba331fc4"
        }
      ],
      "digest": "sha256:5e7448a3484c4b531588e62768ef4f98f686786c559bf986042f10fd84b7e8ff"
    }
  }
}
