{
  "lockfileVersion": 2,
  "subjects": {
    "com.nomadorix-holdings/growth-desk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.nomadorix-holdings.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nomadorix-growth-desk",
        "title": "Nomadorix Growth Desk",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Nomadorix Growth Desk provides read-only funnel, revenue KPI and business assumption calculations. Inputs are processed without storage or external API calls. Results are reference information.",
      "tools": [
        {
          "name": "check_business_plan_assumptions",
          "title": "事業計画の前提チェック / Business plan assumption check",
          "description": "Review unit economics using acquisition cost, monthly customer revenue, gross margin and churn; optionally include growth and cash runway pairs. Returns lifetime gross profit, acquisition-cost multiple, payback months, optional projections and general reference cautions. 計画の前提を見直すために獲得単価・月売上・粗利率・月解約率と任意の成長・資金を入力し、粗利・倍率・回収月数・注意点を返します。 Set language to 'en' for English output.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cash_on_hand": {
                "description": "Available cash, 0–1 trillion; same currency unit as all other monetary inputs. Specify together with monthly_burn. / 手元資金。0〜1兆。金額はすべて同じ通貨単位。monthly_burnと対で指定。",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "customer_acquisition_cost": {
                "description": "Acquisition cost per customer, 0–1 trillion; all monetary inputs use the same currency unit. / 顧客獲得単価。0〜1兆。金額はすべて同じ通貨単位。",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "gross_margin_percent": {
                "description": "Gross margin percentage, 0–100; 10 means 10%. / 粗利率。0〜100の百分率。10は10%。",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "growth_months": {
                "description": "Growth duration, 1–60 months; specify together with monthly_growth_percent. / 成長の月数（1〜60）。monthly_growth_percentと対で指定。",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "default": "ja",
                "description": "Output language: ja (default) or en. / 出力言語。既定は日本語（ja）、英語はen。",
                "enum": ["ja", "en"],
                "type": "string"
              },
              "monthly_burn": {
                "description": "Monthly net cash outflow, 0–1 trillion; same currency unit as all other monetary inputs. Specify together with cash_on_hand. / 月の純資金流出。0〜1兆。金額はすべて同じ通貨単位。cash_on_handと対で指定。",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "monthly_churn_percent": {
                "description": "Monthly churn percentage, greater than 0 and at most 100; 10 means 10%. / 月解約率。0より大きく100以下の百分率。10は10%。",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "monthly_growth_percent": {
                "description": "Relative monthly growth percentage, -100–1000; 10 means 10%. Specify together with growth_months. / 月の相対成長率。−100〜1000の百分率。10は10%。growth_monthsと対で指定。",
                "maximum": 1000,
                "minimum": -100,
                "type": "number"
              },
              "monthly_revenue_per_customer": {
                "description": "Monthly revenue per customer, 0–1 trillion; all monetary inputs use the same currency unit. / 顧客1人の月売上。0〜1兆。金額はすべて同じ通貨単位。",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["customer_acquisition_cost", "gross_margin_percent", "monthly_churn_percent", "monthly_revenue_per_customer"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "acquisition_cost_multiple": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Lifetime gross profit divided by acquisition cost, or null. / 生涯粗利を獲得単価で割った倍率。算出不可はnull。"
              },
              "cash_runway_months": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Cash divided by monthly net cash outflow, or null. / 手元資金を月の純資金流出で割った月数。算出不可はnull。"
              },
              "growth_multiplier": {
                "description": "Compound growth multiplier over the specified duration. / 指定月数の複利成長倍率。",
                "minimum": 0,
                "type": "number"
              },
              "lifetime_gross_profit": {
                "description": "Lifetime gross profit per customer, in the input currency unit. / 入力と同じ通貨単位での顧客生涯の粗利。",
                "minimum": 0,
                "type": "number"
              },
              "monthly_gross_profit": {
                "description": "Monthly gross profit per customer, in the input currency unit. / 入力と同じ通貨単位での顧客1人の月粗利。",
                "minimum": 0,
                "type": "number"
              },
              "payback_months": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Acquisition cost divided by monthly gross profit, or null. / 獲得単価を月粗利で割った回収月数。算出不可はnull。"
              },
              "summary": {
                "description": "Calculation assumptions and interpretation. / 計算の前提と結果の説明。",
                "type": "string"
              },
              "warnings": {
                "description": "Data cautions and general reference thresholds. / データの注意点と一般的な目安。",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["acquisition_cost_multiple", "lifetime_gross_profit", "monthly_gross_profit", "payback_months", "summary", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "事業計画の前提チェック / Business plan assumption check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27a00c5777f3d0604182294abe78d1d28b31bdbb268d88f6c6f718a6fbb4c624"
        },
        {
          "name": "diagnose_funnel_bottleneck",
          "title": "集客ファネルの詰まり診断 / Funnel bottleneck diagnosis",
          "description": "Diagnose conversion bottlenecks using 2–10 named stage counts and an optional relative improvement percentage. Returns conversion rates, the lowest-rate transition, ranked final-stage gains and data cautions. 集客の改善候補を選ぶために段の名前・人数と改善率を入力し、通過率・最低の段・最後の人数の増分・注意点を返します。 Set language to 'en' for English output.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "improvement_percent": {
                "default": 10,
                "description": "Relative improvement percentage, 1–100; 10 means a 10% relative increase. / 相対改善率（1〜100）。10は現在の率を相対で10%改善。",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "language": {
                "default": "ja",
                "description": "Output language: ja (default) or en. / 出力言語。既定は日本語（ja）、英語はen。",
                "enum": ["ja", "en"],
                "type": "string"
              },
              "stages": {
                "description": "Ordered funnel stages. / 上流から順に並べた段。",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "description": "Stage population, an integer from 0 to 1,000,000,000. / 段の人数。0〜10億の整数。",
                      "maximum": 1000000000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "name": {
                      "description": "Stage name: 1–40 Unicode characters, not whitespace-only; no Cc, Cf, Zl or Zp characters. / 段名は1〜40文字。空白のみ、制御・書式・行区切り・段落区切り文字は不可。",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["count", "name"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["stages"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "bottleneck": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "from": {
                        "description": "Previous stage name. / 前の段名。",
                        "type": "string"
                      },
                      "rate_percent": {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Conversion percentage; 10 means 10%. Can exceed 100 when a stage has more people than the previous one. Null means unavailable. / 通過率の百分率。10は10%。前の段より人数が多い時は100を超えます。算出不可はnull。"
                      },
                      "to": {
                        "description": "Next stage name. / 次の段名。",
                        "type": "string"
                      }
                    },
                    "required": ["from", "rate_percent", "to"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Lowest-rate transition; earliest on ties, null if unavailable. / 最低通過率の段。同率は先の段。算出不可はnull。"
              },
              "improvement_percent": {
                "description": "Relative improvement percentage used. / 試算に使った相対改善率。",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "improvements": {
                "description": "Independent improvement scenarios ranked by gain or reduction. / 増分または減少数の大きい順の独立した改善試算。",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "additional_final_count": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Expected additional final-stage count, or null. / 最後の人数の増分の期待値。算出不可はnull。"
                    },
                    "from": {
                      "description": "Previous stage name. / 前の段名。",
                      "type": "string"
                    },
                    "improved_rate_percent": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Improved percentage, 0–100; 10 means 10%. Null means unavailable. / 改善後の0〜100の百分率。10は10%。算出不可はnull。"
                    },
                    "projected_final_count": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Expected final-stage count after improvement, or null. / 改善後の最後の人数の期待値。算出不可はnull。"
                    },
                    "to": {
                      "description": "Next stage name. / 次の段名。",
                      "type": "string"
                    }
                  },
                  "required": ["additional_final_count", "from", "improved_rate_percent", "projected_final_count", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "Calculation assumptions and interpretation. / 計算の前提と結果の説明。",
                "type": "string"
              },
              "transitions": {
                "description": "Conversion rates between adjacent stages. / 隣接する段の通過率。",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from": {
                      "description": "Previous stage name. / 前の段名。",
                      "type": "string"
                    },
                    "rate_percent": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Conversion percentage; 10 means 10%. Can exceed 100 when a stage has more people than the previous one. Null means unavailable. / 通過率の百分率。10は10%。前の段より人数が多い時は100を超えます。算出不可はnull。"
                    },
                    "to": {
                      "description": "Next stage name. / 次の段名。",
                      "type": "string"
                    }
                  },
                  "required": ["from", "rate_percent", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "warnings": {
                "description": "Data cautions and general reference thresholds. / データの注意点と一般的な目安。",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["bottleneck", "improvement_percent", "improvements", "summary", "transitions", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "集客ファネルの詰まり診断 / Funnel bottleneck diagnosis"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a50a5925077df5daa4fa249aaa5b5df83fe295f20effc3d11919b3999d9fb257"
        },
        {
          "name": "reverse_kpi_from_revenue_target",
          "title": "売上目標からの逆算 / Revenue target KPI planning",
          "description": "Plan required volumes from a positive revenue target, unit price, 1–36 months and 1–8 ordered conversion rates. The target is for the whole period, not monthly. Returns rounded-up stage requirements, monthly averages and upstream reductions when each rate improves by 10% relatively. 売上目標の達成に必要な人数を整理するために目標・単価・期間・上流からの率を入力し、段ごとの必要数と改善時の減少数を返します。 Set language to 'en' for English output.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "ja",
                "description": "Output language: ja (default) or en. / 出力言語。既定は日本語（ja）、英語はen。",
                "enum": ["ja", "en"],
                "type": "string"
              },
              "period_months": {
                "default": 1,
                "description": "Whole-period duration in months, 1–36. / 対象期間の月数（1〜36）。",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "rates": {
                "description": "Ordered, connected stage conversion rates; no repeated stages. / 上流から連続する段の通過率。同じ段の繰り返しは不可。",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from": {
                      "description": "Previous stage name, 1–40 characters; no whitespace-only or Cc/Cf/Zl/Zp characters. / 前の段名。1〜40文字。空白のみ・制御・書式・行区切り・段落区切りは不可。",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "rate_percent": {
                      "description": "Percentage greater than 0 and at most 100; 10 means 10%. / 0より大きく100以下の百分率。10は10%。",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "to": {
                      "description": "Next stage name, 1–40 characters; no whitespace-only or Cc/Cf/Zl/Zp characters. / 次の段名。1〜40文字。空白のみ・制御・書式・行区切り・段落区切りは不可。",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["from", "rate_percent", "to"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "target_revenue": {
                "description": "Revenue target for the whole period, not monthly; greater than 0 and at most 1 trillion. All monetary inputs use the same currency unit. / 期間全体の売上目標（月額ではない）。0より大きく1兆以下。金額はすべて同じ通貨単位。",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "unit_price": {
                "description": "Revenue per sale, greater than 0 and at most 1 trillion; all monetary inputs use the same currency unit. / 成約単価。0より大きく1兆以下。金額はすべて同じ通貨単位。",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["rates", "target_revenue", "unit_price"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "improvements": {
                "description": "Independent improvement scenarios ranked by gain or reduction. / 増分または減少数の大きい順の独立した改善試算。",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from": {
                      "description": "Previous stage name. / 前の段名。",
                      "type": "string"
                    },
                    "improved_rate_percent": {
                      "description": "Improved percentage, 0–100; 10 means 10%. Null means unavailable. / 改善後の0〜100の百分率。10は10%。算出不可はnull。",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "reduction": {
                      "description": "Reduction in required first-stage count. / 最上流の必要人数の減少数。",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "to": {
                      "description": "Next stage name. / 次の段名。",
                      "type": "string"
                    },
                    "top_stage_required": {
                      "description": "Required count at the first stage. / 最上流の必要人数。",
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["from", "improved_rate_percent", "reduction", "to", "top_stage_required"],
                  "type": "object"
                },
                "type": "array"
              },
              "period_months": {
                "description": "Whole-period duration in months. / 対象期間の月数。",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "required_sales": {
                "description": "Sales required for the whole period, rounded up. / 期間全体に必要な成約数（切り上げ）。",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "stages": {
                "description": "Required counts by stage. / 段ごとの必要人数。",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "monthly_average": {
                      "description": "Required count divided by period months. / 必要人数を期間の月数で割った平均。",
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "description": "Stage name. / 段名。",
                      "type": "string"
                    },
                    "required_count": {
                      "description": "Required stage count, rounded up. / 段ごとの必要人数（切り上げ）。",
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["monthly_average", "name", "required_count"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "Calculation assumptions and interpretation. / 計算の前提と結果の説明。",
                "type": "string"
              }
            },
            "required": ["improvements", "period_months", "required_sales", "stages", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "売上目標からの逆算 / Revenue target KPI planning"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fddc0e63094d4ff8946154e3d72a7ee0f4e5f0a86fa4880b9f138f98a37fa260"
        }
      ],
      "digest": "sha256:770b1da089e501df4db8f0512e922ed53bbe022ff64f6c4363eef80e87224264"
    }
  }
