        {
          "name": "audit_ios_privacy",
          "description": "Audit an iOS or React Native/Expo app's privacy posture for App Review and user trust. Reads a native Info.plist XML OR an Expo app.json (managed Expo apps have no Info.plist) — plus optional PRIVACY.md, entitlements, and source. Flags: NS*UsageDescription strings that are vague/missing or contradict the code (e.g. a HealthKit write claim the code never fulfills), entitlements/permissions and Android permissions the app doesn't use, ATS cleartext exceptions and non-HTTPS endpoints, secrets/keys shipped in the bundle or app.json, and default data-egress paths not disclosed at the point of choice (a pre-selected 'Recommended' option that silently sends personal data to a server). Same return shape as audit_page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "app_json": {
                "description": "Expo app.json / app.config JSON (managed RN). Its expo.ios.infoPlist, expo.android.permissions, plugins, and extra are audited.",
                "type": "string"
              },
              "entitlements": {
                "description": "Optional .entitlements XML",
                "type": "string"
              },
              "info_plist": {
                "description": "Raw Info.plist XML (native iOS / bare RN). Provide this OR app_json.",
                "type": "string"
              },
              "privacy_md": {
                "description": "Optional PRIVACY.md / privacy policy text to cross-reference against declared permissions and default behavior",
                "type": "string"
              },
              "source": {
                "description": "Optional concatenated source (Swift or JS/TS) — enables code-vs-declaration contradiction checks and default-egress detection",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
