        {
          "name": "audit_content",
          "description": "Evaluate an array of content items (headings, prose, CTAs, labels, captions, metrics, outcomes) against UX-writing principles and deterministic heuristics. Returns a per-item verdict (pass/warn/fail) with matched principle ids, concrete issues grounded in principle text, a before→after rewrite suggestion, and an aggregate summary. Heuristics: metric items must carry a number+unit; cta/label must be action-led and ≤4 words; prose flags passive voice, jargon, and hedging; headings flag filler openers and buzzwords; captions flag duplication of any heading in the batch. Pure offline — no network or browser. Use this instead of evaluate_design when you need per-item content verdicts rather than the principle library.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "goals": {
                "description": "Optional content goals (e.g. ['clarity','conversion']); recorded for traceability.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "items": {
                "description": "Array of content items to audit.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Optional stable id; auto-generated (item_N) if omitted.",
                      "type": "string"
                    },
                    "text": {
                      "description": "The raw content string to evaluate.",
                      "type": "string"
                    },
                    "type": {
                      "description": "Content type — selects which heuristics apply.",
                      "enum": ["prose", "caption", "heading", "outcome", "metric", "cta", "label"],
                      "type": "string"
                    }
                  },
                  "required": ["text", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "system": {
                "description": "Optional content-system id (e.g. 'ux-writing'); recorded for traceability.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
