                  "required": ["bgColor", "color", "selector"],
                  "type": "object"
                },
                "type": "array"
              },
              "screenshot": {
                "description": "Optional base64 PNG for caller reference; ratios are computed from the DOM, not pixels",
                "type": "string"
              },
              "url": {
                "description": "URL to render and measure (http/https or file://)",
                "type": "string"
              }
            },
            "type": "object"
          },
