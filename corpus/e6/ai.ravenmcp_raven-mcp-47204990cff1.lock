        {
          "name": "audit_video_playback",
          "description": "Render a page in headless Chromium and observe whether each <video> actually advances (samples currentTime before/after a play attempt), classifying every clip into playing|paused|stalled|empty|error with a reason. Catches black/non-playing videos that static audits miss — the most common real-world defect on marketing sites with video backgrounds. Pass url to render + observe, or dom_snapshot to classify pre-collected observations without a browser.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dom_snapshot": {
                "description": "Pre-collected video observations to classify without rendering (deterministic path)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "autoplayBlocked": {
                      "description": "True if play() was rejected with NotAllowedError",
                      "type": "boolean"
                    },
                    "currentTimeEnd": {
                      "description": "currentTime recorded after the observe window",
                      "type": "number"
                    },
                    "currentTimeStart": {
                      "description": "currentTime recorded before the play attempt",
                      "type": "number"
                    },
                    "errorCode": {
                      "description": "MediaError.code (0=none, 1=aborted, 2=network, 3=decode, 4=src-not-supported)",
                      "type": "number"
                    },
                    "hasSource": {
                      "description": "True if currentSrc is non-empty OR the element has a src attribute or <source> child",
                      "type": "boolean"
                    },
                    "networkState": {
                      "description": "HTMLMediaElement.networkState (0..3; 3=NETWORK_NO_SOURCE)",
                      "type": "number"
                    },
                    "paused": {
                      "description": "True if the element is paused",
                      "type": "boolean"
                    },
                    "readyState": {
                      "description": "HTMLMediaElement.readyState (0..4)",
                      "type": "number"
                    },
                    "selector": {
                      "description": "CSS selector identifying the video element",
                      "type": "string"
                    }
                  },
                  "required": ["autoplayBlocked", "currentTimeEnd", "currentTimeStart", "errorCode", "hasSource", "networkState", "paused", "readyState", "selector"],
                  "type": "object"
                },
                "type": "array"
              },
              "observeMs": {
                "description": "Milliseconds to wait between currentTime samples after play() attempt. Default: 1000",
                "type": "number"
              },
              "url": {
                "description": "URL to render and observe (http/https or file://). Requires headless chromium.",
                "type": "string"
              }
            },
            "type": "object"
          },
