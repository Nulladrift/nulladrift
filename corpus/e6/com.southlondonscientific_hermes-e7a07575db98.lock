        {
          "name": "get_historical_aq",
          "description": "Get historical air quality data for a site or location, with health context.\n\nReturns a 'narrative' with plain-English interpretation, WHO 24-hour\nguideline exceedance days, and guideline comparisons. Present the\nnarrative to users first. Also returns 'data' and a per-site 'summary'\n(statistics are per monitor, never pooled across monitors).\n\nAnnual guidelines are compared only for windows of a year or more\nwith at least 75% data capture. Daily and monthly rows carry\n'n_hours' and 'partial'; partial days (under 18 hours) are excluded\nfrom exceedance counts. Times and days are UTC.\n\nArgs:\n    start_date: Start date (ISO format, e.g. \"2025-01-01\").\n    end_date: End date (ISO format). A date includes that whole day,\n        so a window ending today includes this morning's readings.\n    location: Postcode, place name, or \"lat,lon\". Provide this or site_code.\n    site_code: Direct site code. Provide this or location.\n    pollutants: Optional filter, e.g. [\"NO2\", \"PM2.5\"].\n    frequency: \"hourly\", \"daily\", or \"monthly\" (default \"daily\").\n",
