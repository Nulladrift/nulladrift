      "instructions": "Hermes is an air quality information server for London, built by South London Scientific. It provides ambient monitoring data with detailed coverage of Southwark and London-wide capability.\n\n## Tool catalogue\n\n**Start here** — comprehensive single-call assessment:\n- `assess_location_aq` — one-call AQ assessment: current readings, trends, and monitor context\n\n**Live data tools** — use these for specific queries or follow-up:\n- `get_current_aq` — most recent readings near a location, with DAQI and health advice\n- `get_aqi_summary` — AQI assessment with WHO compliance check\n- `compare_locations` — side-by-side AQ comparison across multiple locations\n\n**Historical & trend tools** — use these for analysis over time:\n- `get_historical_aq` — historical data for a date range, with summary statistics\n- `trend_analysis` — long-term trend with statistical significance (Theil-Sen + Mann-Kendall)\n- `regulatory_stats` — LAQM-style annual statistics (means, percentiles, exceedances)\n- `time_patterns` — diurnal, day-of-week, and monthly pollution profiles\n\n**Visualisation:**\n- `chart_aq_trend` — time series chart as inline PNG image\n\n**Monitor discovery:**\n- `list_monitors` — find monitoring sites near a location with operational status\n\n**Knowledge base** — curated, evidence-based reference documents:\n- `kb_get_guidelines` — DAQI bands, WHO guidelines, UK legal limits\n- `kb_get_health_effects` — pollutant-specific health evidence by population group\n- `kb_get_local_context` — area-specific AQ context (Southwark, London boroughs)\n- `kb_get_practical_advice` — generic protective actions (e.g. \"should anyone exercise on a high-pollution day?\"). For *personalised* advice keyed to the user's own context (asthma, pregnancy, gas cooker, tube commute), call Clara's `contextual_advice` instead.\n- `kb_get_monitoring_explainer` — how monitors work, data interpretation\n\n## Scope\n- **Can do:** Ambient air quality data for London and UK regulatory monitoring networks. Historical trends, regulatory compliance, temporal patterns, health context.\n- **Cannot do:** Personalised health advice and personal exposure assessment (use the Clara MCP server), forecasting, indoor air quality.\n\n## Composition with Clara (personal-health questions)\nWhen the user asks a question that ties air quality to their own situation — e.g. \"I have asthma, is it safe to run outside?\", \"should I cycle today with my kid?\", \"my child has a cough, is the air bad?\" — Hermes alone is the wrong shape. The right pattern is:\n\n1. Call Hermes `get_current_aq` (or `assess_location_aq`) for the user's location to get live pm25 and no2 numbers.\n2. Pass those numbers + the user's context (audience, setting, indoor sources) to Clara's `contextual_advice` tool.\n3. Present Clara's advice, attributing the live data to Hermes and the personalised context to Clara.\n\nHermes' own `kb_get_practical_advice` is a **fallback** for when Clara is unavailable or the user wants only generic guidance, not a substitute for the composition above.\n\n## Key principle\nA monitor reading is NOT personal exposure. Always contextualise with distance, monitor type, and the difference between ambient monitoring and what people actually breathe.\n\n## Response structure\nAll tools return structured JSON with a `summary` or `narrative` field containing plain-English interpretation. Present this to users first, then use the raw data fields for detail. Error responses use `{\"error\": {\"type\": \"...\", \"message\": \"...\"}}`.\n\n## Attribution\nBuilt by South London Scientific (southlondonscientific.com). Data from UK regulatory networks (AURN, AQE, LMAM, SAQN) and Breathe London via Aeolus.",
