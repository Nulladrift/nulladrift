{
  "lockfileVersion": 2,
  "subjects": {
    "com.keenielts/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://keenielts.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "KeenIELTS",
        "version": "1.12.4"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free IELTS preparation platform: real student Writing model answers with AI examiner band scores, and interactive Listening/Reading drills that can be taken and graded in-conversation. Use search_model_answers to find band-scored essays, get_drill + check_drill_answers to run a practice drill with the user (never reveal answers before grading), and list_practice_tests for the full-length test catalog on keenielts.com.",
      "tools": [
        {
          "name": "check_drill_answers",
          "description": "Grade a user's drill answers server-side (same grader the website\n    uses — case/whitespace tolerant, accepts standard IELTS answer variants).\n\n    Args:\n        skill: 'listening' or 'reading'.\n        slug: the drill slug from get_drill.\n        answers: question number -> the user's answer,\n            e.g. {\"1\": \"true\", \"2\": \"B\", \"3\": \"24 April\"}.\n\n    Returns per-question results with the accepted answers and explanations\n    (safe to share with the user now that they have answered), plus a score.\n    ",
          "inputSchema": {
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "title": "Answers",
                "type": "object"
              },
              "skill": {
                "title": "Skill",
                "type": "string"
              },
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["answers", "skill", "slug"],
            "title": "check_drill_answersArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86b31d33ed979533ea91daf27d5511b25ee987bf3321353810ffee22092ab7a6"
        },
        {
          "name": "compare_question",
          "description": "List every public band-scored answer to ONE IELTS Writing question —\n    the same prompt answered by different students at different band scores,\n    useful for showing what separates a Band 6 from a Band 8 on identical\n    input. Fetch individual answers with get_model_answer.\n    ",
          "inputSchema": {
            "properties": {
              "section_id": {
                "title": "Section Id",
                "type": "integer"
              }
            },
            "required": ["section_id"],
            "title": "compare_questionArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b2683a392f5c14000d3eb7f7c6b8f5fe787d13bcec36fc71b2364ef1ba84b12"
        },
        {
          "name": "fetch",
          "description": "Fetch the full content of a KeenIELTS search result by id: a model\n    answer with examiner feedback, a practice drill, a question compared\n    across band scores, or a site page.\n    ",
          "inputSchema": {
            "properties": {
              "id": {
                "title": "Id",
                "type": "string"
              }
            },
            "required": ["id"],
            "title": "fetchArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c14c35170e66f448da10e51952a97a6bf9f76c0af381e1cff73f174dae4fea79"
        },
        {
          "name": "get_drill",
          "description": "Get one drill's content so the user can attempt it in conversation.\n\n    The questions are markdown; `{{3}}` marks a gap the user fills for\n    question 3, and `{{3:A/B/C}}` means question 3 is a choice between the\n    slash-separated options. For listening drills, give the user the audio\n    link to play before answering. Collect the user's answers, then call\n    check_drill_answers to grade them — do NOT guess at or reveal correct\n    answers yourself; they are only returned by check_drill_answers.\n    ",
          "inputSchema": {
            "properties": {
              "skill": {
                "title": "Skill",
                "type": "string"
              },
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["skill", "slug"],
            "title": "get_drillArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cb91f49946e4c57cd07d1e4d75698b29a7573515586ef368648cbc642d6f9be7"
        },
        {
          "name": "get_model_answer",
          "description": "Get one student IELTS Writing answer in full: the question, the essay,\n    and the AI examiner's band scores + feedback on all four official IELTS\n    marking criteria (Task Achievement, Coherence & Cohesion, Lexical\n    Resource, Grammatical Range & Accuracy).\n\n    Get section_id/attempt_id pairs from search_model_answers or\n    compare_question.\n    ",
          "inputSchema": {
            "properties": {
              "attempt_id": {
                "title": "Attempt Id",
                "type": "integer"
              },
              "section_id": {
                "title": "Section Id",
                "type": "integer"
              }
            },
            "required": ["attempt_id", "section_id"],
            "title": "get_model_answerArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe202f04379ea7996af25faeade92ada614b5bbbc1cec4d9f6ba2f5f306112b0"
        },
        {
          "name": "list_drills",
          "description": "List short, targeted IELTS practice drills that can be taken right here\n    in the conversation (fetch with get_drill, grade with check_drill_answers).\n\n    Args:\n        skill: 'listening' or 'reading'.\n        category: optional IELTS question-type filter. Listening: completion,\n            multiple-choice, matching, labelling. Reading: true-false-not-given,\n            completion, matching-headings, matching-information,\n            multiple-choice-short-answer.\n    ",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Category"
              },
              "skill": {
                "title": "Skill",
                "type": "string"
              }
            },
            "required": ["skill"],
            "title": "list_drillsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:89269831d36c08e934a05f46980f1516086dd334a64811a185ff6cdd23577fd6"
        },
        {
          "name": "list_practice_tests",
          "description": "Catalog of full-length IELTS practice tests on keenielts.com — books,\n    difficulty, and test counts for all four skills (Listening, Reading,\n    Writing, Speaking). Full tests are taken on the website (timed, with audio\n    players and AI band scoring), not in this conversation — point the user at\n    the URLs. Taking tests and getting AI band scores is free.\n    ",
          "inputSchema": {
            "properties": {},
            "title": "list_practice_testsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4a6dd2d745fc8ad59af889606ace9c9029db972db957424a339f83be51f2d4a5"
        },
        {
          "name": "search",
          "description": "Search KeenIELTS: real student IELTS Writing model answers with band\n    scores, Listening/Reading practice drills, and IELTS practice resources.\n    Returns result ids for use with fetch.\n    ",
          "inputSchema": {
            "properties": {
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "searchArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:807533116666f2df9dcc3b6157b08d4a687dd61ba4930242d5266fff89bf7fc2"
        },
        {
          "name": "search_model_answers",
          "description": "Search real student IELTS Writing answers scored by AI examiner.\n\n    Args:\n        task: IELTS Writing task number — 1 (reports/letters) or 2 (essays).\n        band: whole band to filter on; matches half-bands too (8 -> 8.0-8.5).\n        query: free-text match against the question/prompt.\n        limit: max results (1-50).\n\n    Each result links to a full page with the question, the student's answer,\n    and criterion-by-criterion examiner feedback. Use get_model_answer for the\n    full content, or compare_question to see the same prompt at other bands.\n    ",
          "inputSchema": {
            "properties": {
              "band": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Band"
              },
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query"
              },
              "task": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Task"
              }
            },
            "title": "search_model_answersArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7ce0b8b0eed6658ba2eefda831f0b002c31b35d087dde13b3ce10745b95f133"
        }
      ],
      "digest": "sha256:25e11410b7877aa63ecfd50cf4f225ddd65cc2a846383ffaa9a2e53ed7e7cdbe"
    }
  }
}
