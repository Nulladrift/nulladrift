        {
          "name": "domain_age",
          "title": "WHOIS lookup: how old is a website",
          "description": "A WHOIS / RDAP lookup for any domain: registration date and age, registrar, expiry, status (including expired and being deleted, with an estimated drop date), name servers and who hosts it, read live from the registry's own record (RDAP, else WHOIS). Plus its Ahrefs Domain Rating. Never owner details. Free, no sign-in. Use it for \"whois heya.page\", \"how old is this site\", \"who is it registered with\", \"when does it expire\", \"is this domain expiring\", \"who hosts it\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A domain or a link, e.g. \"heya.page\".",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The registry record.",
            "properties": {
              "ageDays": {
                "description": "Days since registration.",
                "type": ["number", "null"]
              },
              "domain": {
                "description": "The registrable domain.",
                "type": "string"
              },
              "dr": {
                "description": "Ahrefs Domain Rating.",
                "type": ["number", "null"]
              },
              "drCredit": {
                "description": "Domain Rating by Ahrefs (ahrefs.com).",
                "type": "string"
