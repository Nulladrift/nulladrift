      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aipozi",
        "title": "aipozi",
        "version": "1.0.0",
        "description": "Your AI visibility, every morning, in your AI: whether ChatGPT, Claude, Gemini and Perplexity name your sites, who they recommend instead, and what to change.",
        "websiteUrl": "https://aipozi.com/mcp"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "aipozi shows whether ChatGPT, Claude, Gemini and Perplexity name the person's own websites, from checks it runs every morning at 05:00 GMT (this server reads them; it never runs a check). For \"how am I doing\" or a morning briefing, start with briefing. For questions and results use questions; for an AI's exact words, ai_answer (quote them as that AI's words); for competitors, rivals and rival_detail; over time, trend. To improve: action_plan, then build_prompt to implement a move in the coding session, then mark_move_done once it has shipped. For domain availability always use check_domain; never guess from DNS or memory. domain_age, domain_rating and ai_crawler_access work for any site without signing in. Ask one short question when the site is unclear. Only the person's own sites are reported; adding sites, editing questions and billing are in app.aipozi.com.",
      "tools": [
        {
          "name": "action_plan",
          "title": "What to improve",
          "description": "One site's plan from its latest check: why each AI does or doesn't name it (in plain words, from the real answers) and the moves, ranked by how many questions and AIs each can win, with the rivals each move beats and the pages the AIs read instead. Use it for \"what should I improve first on biotree.bio?\". To hand a move to a coding session, use build_prompt; when it has shipped, mark_move_done.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "site": {
                "description": "Which of your sites: its domain (\"biotree.bio\"), its id from list_my_sites (\"biotree-bio\") or its name. Leave it out when the person has one site.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The plan.",
            "properties": {
              "date": {
                "description": "The check the plan comes from.",
                "type": "string"
              },
              "domain": {
                "description": "The site.",
                "type": "string"
              },
              "locked": {
                "description": "True on a free site: move 1 in full, the rest locked.",
                "type": "boolean"
              },
              "message": {
                "description": "When view is \"none\": what to tell the person.",
                "type": "string"
              },
              "moves": {
                "description": "{ id, rank, kind, title, locked, detail, impact, targets, rival, evidence, hasBuildPrompt, done }.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "view": {
                "description": "What this answer is; \"none\" for a question back, a plain no, or nothing there yet (see message).",
                "enum": ["plan", "none"],
                "type": "string"
              },
              "why": {
                "description": "{ ai, label, why }.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["view"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What to improve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Plan ready",
            "openai/toolInvocation/invoking": "Reading your plan…",
            "securitySchemes": [
              {
                "scopes": ["sites:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0419ea22db6afdaccfe447beaa4ea294fac7a8cde761109b0bf27c448a19fb8d"
        },
        {
          "name": "ai_answer",
          "title": "What the AI said",
          "description": "One question and one AI: that AI's answer word for word, exactly as stored, with the pages it cited, from the latest check or a given date. Quote it as that AI's words. Use it for \"show me exactly what ChatGPT said\" or \"who did Perplexity recommend for the Comrades question?\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai": {
                "description": "The AI: chatgpt, claude, gemini or perplexity.",
                "enum": ["chatgpt", "claude", "gemini", "perplexity"],
                "type": "string"
              },
              "date": {
                "description": "A check day, YYYY-MM-DD. Leave it out for the latest check.",
                "type": "string"
              },
              "question": {
                "description": "The question: its id (\"p03\"), its number in the list (\"3\"), or words from it (\"Comrades\").",
                "type": "string"
              },
              "site": {
                "description": "Which of your sites: its domain (\"biotree.bio\"), its id from list_my_sites (\"biotree-bio\") or its name. Leave it out when the person has one site.",
                "type": "string"
              }
            },
            "required": ["ai", "question"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "One stored answer.",
            "properties": {
              "aiLabel": {
                "description": "ChatGPT, Claude, Gemini or Perplexity.",
                "type": "string"
              },
              "answerText": {
                "description": "The answer, word for word.",
                "type": "string"
              },
              "citations": {
                "description": "{ url, title, domain }.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "date": {
                "description": "The check day.",
                "type": "string"
              },
              "domain": {
                "description": "The site.",
                "type": "string"
              },
              "message": {
                "description": "When view is \"none\": what to tell the person.",
                "type": "string"
              },
              "question": {
                "description": "The question as asked.",
                "type": "string"
              },
              "result": {
                "description": "named, with your address | named | your address given, not named | not named.",
                "type": "string"
              },
              "view": {
                "description": "What this answer is; \"none\" for a question back, a plain no, or nothing there yet (see message).",
                "enum": ["answer", "none"],
                "type": "string"
              }
            },
            "required": ["view"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
