        {
          "name": "check_domain",
          "title": "Check domain availability",
          "description": "Is a domain name free? Use it whenever someone names an app, product or company, asks \"find me a name with a free domain\", \"is there a .com for…\", or \"is X taken\". Asks each registry for its own record, live (RDAP, else the registry's WHOIS). One name: across .com, .ai, .io, .app, .dev and more, or the extensions given. Brainstorming: pass up to 10 candidates in names and get them on .com, .ai, .io, .app and .dev, free ones first. Each result: available or not registered (with a registrar link), taken (with its registration date and age), or couldn't check. Free, no sign-in. Always use this for availability; never guess from DNS or memory. aipozi doesn't register names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "extensions": {
                "description": "Extensions to check, e.g. [\"ai\", \"io\", \"co.za\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "name": {
                "description": "One name (\"livedot\") or a domain (\"livedot.ai\"). With an extension, only that one is checked unless extensions are given.",
                "type": "string"
              },
              "names": {
                "description": "Up to 10 candidate names to compare when naming something, e.g. [\"livedot\", \"dotlive\", \"followdot\"]. Checked on .com, .ai, .io, .app and .dev unless extensions are given (up to 6).",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Availability per extension.",
            "properties": {
              "label": {
                "description": "The name searched.",
                "type": "string"
              },
              "message": {
                "description": "When view is \"none\": what to tell the person.",
                "type": "string"
              },
              "results": {
                "description": "{ domain, tld, status: available|premium|unregistered|unavailable|taken|unknown, price, registeredAt, ageDays, registerUrl, checkedAt }.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "view": {
                "description": "What this answer is; \"none\" for a question back, a plain no, or nothing there yet (see message).",
                "enum": ["domains", "none"],
                "type": "string"
              }
            },
            "required": ["view"],
            "type": "object"
          },
          "annotations": {
