                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "description": "The site.",
                "type": "string"
              },
              "finding": {
                "description": "What is blocked, in plain words.",
                "type": ["string", "null"]
              },
              "fix": {
                "description": "The robots.txt lines to add.",
                "type": ["string", "null"]
              },
              "message": {
                "description": "When view is \"none\": what to tell the person.",
                "type": "string"
              },
              "robotsFound": {
                "description": "A robots.txt exists.",
                "type": "boolean"
              },
              "view": {
                "description": "What this answer is; \"none\" for a question back, a plain no, or nothing there yet (see message).",
                "enum": ["crawlers", "none"],
                "type": "string"
              }
