            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A domain or a link, e.g. \"biotree.bio\".",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The robots.txt audit.",
