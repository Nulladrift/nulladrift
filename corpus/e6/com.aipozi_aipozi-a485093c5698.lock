        {
          "name": "ai_crawler_access",
          "title": "Can AI read this site",
          "description": "Whether each AI's crawlers (OpenAI, Anthropic, Perplexity, Google, Microsoft; search, user and training bots) are allowed by a site's robots.txt, read live, and the exact lines to add when a search crawler is blocked. Free, no sign-in.",
