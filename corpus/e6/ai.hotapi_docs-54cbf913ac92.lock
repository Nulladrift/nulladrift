{
  "lockfileVersion": 2,
  "subjects": {
    "ai.hotapi/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hotapi.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "hotapi-docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only HotAPI documentation server: no API key is required and nothing here spends credits. Start with search_docs for integration guidance and model documentation (endpoints, pricing, async task lifecycle, webhooks, uploads). Use get_openapi_operation for the exact request schema of one endpoint; the OpenAPI contract is authoritative whenever prose and schema disagree. Model endpoints follow POST /v1/<model-slug>; image, video, and audio generation returns a task to poll via GET /v1/tasks/{id}, while chat runs through the OpenAI-compatible POST /v1/chat/completions and is synchronous.",
      "tools": [
        {
          "name": "get_openapi_operation",
          "title": "Get an OpenAPI operation",
          "description": "Return one exact HotAPI operation and the schemas it references.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "method": {
                "enum": ["GET", "POST", "DELETE"],
                "type": "string"
              },
              "path": {
                "maxLength": 200,
                "pattern": "^\\/v1\\/.*",
                "type": "string"
              }
            },
            "required": ["method", "path"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f995796f2a65bae68b22ada57f75500ae5327faed602f5b399059098fd3bf5b9"
        },
        {
          "name": "search_docs",
          "title": "Search HotAPI docs",
          "description": "Search HotAPI integration and model documentation. Read-only; no API key required.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa42734010263a7574710457e4aa89c5995543b1da68ef81820473d9095e7c8a"
        }
      ],
      "resources": [
        {
          "uri": "hotapi://openapi",
          "name": "HotAPI OpenAPI contract",
          "description": "Authoritative HotAPI OpenAPI 3.1 contract.",
          "mimeType": "application/json",
          "digest": "sha256:7facbe4c3c14628367b541fadb5f218facac407f771c42072d715e826ab51aff"
        },
        {
          "uri": "hotapi://docs/llms-full",
          "name": "HotAPI developer documentation",
          "description": "Current HotAPI integration guidance.",
          "mimeType": "text/markdown",
          "digest": "sha256:6f887adbc7d7505747798f4c3c2c9b7de6b28b5dd1d8f954f8397d42f6b99e28"
        }
      ],
      "digest": "sha256:08ca2189a84c4e248c8426ad9a06796951cff9986bfea29908e54f464d717541"
    }
  }
}
