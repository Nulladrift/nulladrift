                      "description": "The date the value applies from. effective_from_basis says what the date means.",
                      "type": ["string", "null"]
                    },
                    "effective_from_basis": {
                      "description": "value: the day this value started. provision: the day the current rule started; the number itself is older. as_at: a day the official source shows the value in force; the day it started is not recorded.",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "page": {
                      "type": "string"
