            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "as_at": {
                "description": "A date, as YYYY-MM-DD. Leave it out for today's date in Sydney.",
                "type": "string"
              },
              "id": {
                "description": "The figure id, such as concessional_cap. search_figures returns ids.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "include_history": {
                "default": false,
                "description": "Also return the earlier recorded values, newest first. Default false.",
