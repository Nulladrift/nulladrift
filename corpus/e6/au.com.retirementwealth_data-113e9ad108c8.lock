        {
          "name": "search_figures",
          "title": "Search figures",
          "description": "Start here, before get_figure, to find selected figures in Australian retirement rules: rates, amounts, caps, thresholds, ages, periods and dates for the Age Pension and its means tests, superannuation and the Division 293 and 296 taxes, deeming, the Commonwealth Seniors Health Card, aged care and the Home Equity Access Scheme. Searches by keyword, category or both, and returns each match's id and current value. Each current value has an official source, the date it applies from and the date it was last checked; get_figure returns them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category id from list_categories, such as aged_care.",
                "enum": ["age_pension", "pension_income_test", "concession_cards", "deeming", "super", "super_caps", "super_access", "gov_contributions", "div293", "div296", "downsizer", "fhss", "aged_care", "home_equity"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "The most results to return. Default 10, maximum 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, such as \"concessional cap\" or \"deeming rate\". Up to 100 characters.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
