  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/invoice-purchase-order-matcher": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp-factory.bowling-anthony.workers.dev/invoice-purchase-order-matcher/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.mcpscores/invoice-purchase-order-matcher",
        "title": "Invoice Purchase Order Matcher",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Mechanically reconcile supplied purchase-order lines, invoice lines and goods receipts under explicit decimal and tolerance rules. The report identifies discrepancies and is not an approval to pay. Tool calls cost 0.05 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Exact mechanical matching only; no OCR, fuzzy identity resolution, accounting opinion or payment authorization. Currency must have three uppercase letters but is not checked against an ISO registry. Negative amounts, credits, discounts, taxes, shipping and unsupported decimal precision are rejected. Bounded at 128 KiB serialized input, 500 purchase-order lines, 500 invoice lines and 1000 receipt lines. Quantities/prices are decimal strings and use fixed-point arithmetic with documented half-up line-total rounding. Result artifacts are retained for 24 hours and bounded at 96 KiB.",
      "tools": [
        {
          "name": "match_invoice_purchase_order",
          "description": "Mechanically reconcile supplied purchase-order lines, invoice lines and goods receipts under explicit decimal and tolerance rules. The report identifies discrepancies and is not an approval to pay. Price: 0.05 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "invoice": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "line_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "po_line_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "type": "string"
                    },
                    "sku": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "unit_price": {
                      "type": "string"
                    }
                  },
                  "required": ["line_id", "po_line_id", "quantity", "sku", "unit_price"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "minor_unit_digits": {
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "purchase_order": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "line_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "type": "string"
                    },
                    "sku": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "unit_price": {
                      "type": "string"
                    }
                  },
                  "required": ["line_id", "quantity", "sku", "unit_price"],
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              },
              "receipts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "po_line_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "type": "string"
                    }
                  },
                  "required": ["po_line_id", "quantity"],
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "tolerance_minor": {
                "type": "string"
              }
            },
            "required": ["currency", "invoice", "minor_unit_digits", "purchase_order", "receipts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55aa68c094c38079f49c561ab3241bfcbccc841589432a0c6a4fabc3dd9e9ff5"
        }
      ],
      "digest": "sha256:f1f9feec7c58185a87e5c99c755df3c0ccc357b5d4fe834d363c4bf6dca55a50"
    }
  }
}
