        {
          "name": "get_brand_email_frequency",
          "title": "Brand email frequency",
          "description": "How many marketing emails a brand sent in a calendar period, and when, as observed by StackEnhance Signal (ecommerce brands, mostly in Sweden, Norway, Denmark, Finland and Germany). Use for questions like \"How many emails did Newport send in August 2026?\", \"What did Newport send last week?\" or \"What has X sent recently?\". Without a market, a brand tracked in several countries gets one result per market. To compare several brands over the same period, use compare_brands with from and to. Resolve relative dates yourself to YYYY-MM-DD: \"last week\" is the previous Monday–Sunday, \"last month\" the previous calendar month, \"recently\" the last 14 days. Dates are the brand's local calendar dates. The period must start within the last six months (older history is in a Signal account) and may span up to two years. Returns the count; for periods of up to 31 days also the date of each send; and at most two subject lines, only ones already shown on the brand's public StackEnhance page and sent in the period. Every listed send was captured in full; a send without a quoted subject is listed in sends_with_subject_in_signal because its subject is withheld by that limit, not missing. Counts are de-duplicated marketing sends (welcome, birthday and transactional emails excluded). There is no open, click or revenue data. Full campaigns, other subject lines, offers, products and creative analysis are not available through this tool. Cite each result's details_url as the source and as where the full campaigns are.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name as the user wrote it, e.g. \"Newport\" or \"IKEA\". A domain such as newport.se also works.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "from": {
                "description": "First day of the period, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "market": {
                "description": "Country of one storefront as a two-letter code (SE, NO, DK, FI, DE) or its name (\"Sweden\"). Omit it to get every market the brand is tracked in.",
                "maxLength": 32,
                "type": "string"
              },
              "to": {
                "description": "Last day of the period, inclusive, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["brand", "from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "average_per_week": {
                      "type": ["number", "null"]
                    },
                    "brand": {
                      "type": "string"
                    },
                    "details_url": {
                      "type": "string"
                    },
                    "emails_sent": {
                      "type": "integer"
                    },
                    "market": {
                      "type": ["string", "null"]
                    },
                    "note": {
                      "type": "string"
                    },
                    "period": {
                      "type": "string"
                    },
                    "public_subjects": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "type": "string"
                          },
                          "subject": {
                            "type": "string"
                          }
                        },
                        "required": ["date", "subject"],
                        "type": "object"
                      },
                      "maxItems": 2,
                      "type": "array"
                    },
                    "send_dates": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "sends_with_subject_in_signal": {
                      "additionalProperties": false,
                      "properties": {
                        "count": {
                          "type": "integer"
                        },
                        "dates": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "note": {
                          "type": "string"
                        }
                      },
                      "required": ["count", "dates", "note"],
                      "type": "object"
                    },
                    "tracked_since": {
                      "type": "string"
                    }
                  },
                  "required": ["average_per_week", "brand", "details_url", "emails_sent", "market", "period", "tracked_since"],
                  "type": "object"
                },
                "type": "array"
              },
              "unavailable": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "market": {
                      "type": ["string", "null"]
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "market", "reason"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Brand email frequency"
          },
          "behavior": {
