        {
          "name": "find_brands",
          "title": "Find brands by email frequency",
          "description": "Ecommerce brands StackEnhance Signal tracks in one market, ranked by current email frequency (average marketing emails per week over the last 90 days), optionally within a category such as \"Fashion & Apparel\" or \"Home & Interior\". Use for questions like \"Which brands email most frequently in Swedish ecommerce?\" or to find a brand when the user names a kind of brand (\"a Swedish fashion brand\"). Rankings are available for SE, NO, DK, FI and DE only; `market` is a country, never a topic. Brands with too little observed data are left out of rankings. To then compare some of the brands (or brands the user named), call compare_brands with their names. Returns brand names, categories and emails per week only. Each brand has a details_url to cite.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category, e.g. \"Fashion & Apparel\", \"Home & Interior\", \"Beauty & Cosmetics\", \"Sports & Outdoor\".",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "How many brands to return (1-10, default 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Country as a two-letter code (SE, NO, DK, FI or DE) or its name (\"Sweden\"). Not a topic or category: put that in `category`.",
                "maxLength": 32,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brands": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "details_url": {
                      "type": "string"
                    },
                    "emails_per_week": {
                      "type": "number"
                    }
                  },
                  "required": ["brand", "category", "details_url", "emails_per_week"],
                  "type": "object"
                },
                "type": "array"
              },
              "brands_tracked": {
                "type": "integer"
              },
              "category": {
                "type": ["string", "null"]
              },
              "market": {
                "type": "string"
              },
              "window_days": {
                "type": "integer"
              }
            },
            "required": ["brands", "brands_tracked", "category", "market", "window_days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find brands by email frequency"
