      "instructions": "Signal by StackEnhance answers questions about how often ecommerce brands send marketing email. Data: marketing emails observed by StackEnhance Signal for ecommerce brands, mostly in Sweden (SE), Norway (NO), Denmark (DK), Finland (FI) and Germany (DE). Counts are de-duplicated marketing sends; welcome, birthday and transactional emails are excluded. There is no open, click or revenue data. Tools: get_brand_email_frequency (sends in a date range, with dates for short periods), get_brand_summary (tracked since, emails in the last 6 months, current frequency, rank in its market), find_brands (brands in a market ranked by frequency), compare_brands (2-5 named brands side by side in one call). Every result includes details_url, the brand's public page on stackenhance.com — cite it as the source. At most two subject lines are quoted per answer, and only ones already shown on the brand's public page. Full campaigns, offers, products and creative analysis are not available through this server.",
      "tools": [
        {
          "name": "compare_brands",
          "title": "Compare brands by email frequency",
          "description": "Compare 2 to 5 ecommerce brands side by side in ONE call, as observed by StackEnhance Signal: current frequency (average marketing emails per week, last 90 days), emails observed in the last 6 months, the date Signal first observed each brand, the latest campaign date, and each brand's rank in its market when it has one, ordered by frequency. Use this instead of calling get_brand_summary repeatedly when the user names a set of brands: \"Compare Mio, IKEA and Westwing\", \"Who emails more, Boozt or Zalando?\", \"How does Newport compare with its competitors?\". Pass the brand names as the user wrote them. Give `market` (SE, NO, DK, FI, DE or a country name) when the brands are in one country, which is the usual case; a brand tracked in several countries without a market is listed as unavailable with the markets to choose from, never guessed. Optionally give `from` and `to` (YYYY-MM-DD, starting within the last six months) to also count each brand's sends in that period. More than 5 brands: call again with the rest. To discover competitors first, use find_brands. Returns aggregates only: no campaign list, subject lines, offers or creative analysis. There is no open, click or revenue data. Cite each brand's details_url as the source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brands": {
                "description": "2 to 5 brand names as the user wrote them, e.g. [\"Mio\", \"IKEA\", \"Westwing\"].",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "from": {
                "description": "Optional first day of a period to also count, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "market": {
                "description": "Country the brands are in, as a two-letter code (SE, NO, DK, FI, DE) or its name (\"Sweden\"). Not a topic or category.",
                "maxLength": 32,
                "type": "string"
              },
              "to": {
                "description": "Optional last day of that period, inclusive, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["brands"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "details_url": {
                      "type": "string"
                    },
                    "emails_per_week": {
                      "type": "number"
                    },
                    "latest_campaign_date": {
                      "type": ["string", "null"]
                    },
                    "market": {
                      "type": ["string", "null"]
                    },
                    "market_rank": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "market": {
                              "type": "string"
                            },
                            "of": {
                              "type": "integer"
                            },
                            "rank": {
                              "type": "integer"
                            }
                          },
                          "required": ["market", "of", "rank"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "observed_last_6_months": {
                      "type": "integer"
                    },
                    "period": {
                      "additionalProperties": false,
                      "properties": {
                        "average_per_week": {
                          "type": ["number", "null"]
                        },
                        "emails_sent": {
                          "anyOf": [
                            {
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "label": {
                          "type": "string"
                        },
                        "unavailable": {
                          "type": "string"
                        }
                      },
                      "required": ["average_per_week", "emails_sent", "label"],
                      "type": "object"
                    },
                    "rate_basis": {
                      "type": "string"
                    },
                    "tracked_since": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["brand", "category", "details_url", "emails_per_week", "latest_campaign_date", "market", "market_rank", "observed_last_6_months", "rate_basis", "tracked_since"],
                  "type": "object"
                },
                "type": "array"
              },
              "unavailable": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "market": {
                      "type": ["string", "null"]
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "market", "reason"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare brands by email frequency"
