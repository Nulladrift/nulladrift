        {
          "name": "get_brand_summary",
          "title": "Brand email summary",
          "description": "A brand's email-marketing profile as observed by StackEnhance Signal: market, category, the date Signal first observed it, marketing emails observed in the last 6 months, current frequency (average emails per week over the last 90 days), the date of the latest observed campaign and, for brands Signal has followed 28+ days in SE, NO, DK, FI or DE, its rank in that market by frequency. Use for questions like \"How often does Newport email customers?\" or \"Is IKEA still sending newsletters?\". Without a market, a brand tracked in several countries gets one summary per market. For two or more named brands use compare_brands instead of calling this once per brand. Returns aggregates only — no campaign list, subject lines, offers or creative analysis. Cite each result's details_url as the source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
