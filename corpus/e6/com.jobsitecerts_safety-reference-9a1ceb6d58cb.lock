      "instructions": "Jobsite is construction safety, training-compliance and operations software. This is its free, no-login tier: reference tools that read no company's records and need no account, plus one tool that starts a sample workspace for a person.\n\nTools: search_law_corpus returns verbatim regulation text — 29 CFR plus the California, Washington and Oregon heat and wildfire-smoke rules, OSHA interpretations and NIOSH/CDC/EPA guidance — each match labeled with its authority tier (T1 binding law; T2 agency interpretation; T3 technical guidance). Quote T2/T3 as what the agency says or recommends, never as a requirement. An empty result means \"not in Jobsite's corpus\", never \"no such rule\". osha_recordability_check applies the OSHA 29 CFR 1904 decision tree to the facts of an injury and cites the rule text; unknown facts come back as questions. get_toolbox_talk returns a ready-to-deliver toolbox talk (English or Spanish) by topic, hazard or standard number. training_required_for lists the training Jobsite's requirements inventory assigns a trade (and roles) in a US state, each row with its citation, the rule quoted verbatim and its kind (mandate, condition or policy, which differ: keep the distinction); a not-found answer means \"not in Jobsite's inventory\", never \"no training required\". search_regulatory_news searches recent Federal Register and OSHA news. lookup_jobsite_docs explains how Jobsite itself works; search_articles finds Jobsite's published articles and comparisons. verify_certificate checks a certificate or wallet a worker shared as a Jobsite link (/w/…) and reports each record's basis as given; it works only with a link the worker made, never by name, and is a record check, not a statement that a requirement is met. start_jobsite_workspace creates a new Jobsite workspace holding only sample data and returns a one-time claim link for the person to open; it takes no personal details, the link expires in 7 days, and adding real workers needs a plan. Use it only when the person wants to try Jobsite, and give them the link.\n\nWhat needs an account: anything about a specific company's workers, training records, certifications, jobs, incidents or bills. Those tools are on the signed-in connector at https://jobsitecerts.com/api/mcp (OAuth; https://jobsitecerts.com/mcp explains it). A tool name this tier doesn't list returns a refusal saying so.\n\nLimits: requests are rate-limited per network address; a refusal says how long to wait. Results carry citations or links; quote them as given.",
      "tools": [
        {
          "name": "get_toolbox_talk",
          "title": "Get a toolbox talk",
          "description": "A ready-to-deliver construction toolbox talk from Jobsite's library of nearly 300 talks, in English or Spanish: title, talking points, a discussion question, duration, and the OSHA standards it is built on. Find one by topic or hazard in plain words (\"trenching\", \"heat\", \"ladder setup\") or by standard number (\"1926.501\"), or fetch one by talk_number. Returns the best match plus up to five other matching titles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "en (default) or es (Spanish).",
                "enum": ["en", "es"],
                "type": "string"
              },
              "talk_number": {
                "description": "Or one talk by its number (from other_matches).",
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "The hazard, task or standard, e.g. \"trench cave-ins\", \"silica\", \"1926.1053\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a toolbox talk"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1058d5136436bc5c3ebce2eaec24eb06ef21ae853b7db392f5e34b29c44f49bb"
        },
        {
          "name": "lookup_jobsite_docs",
          "title": "Search the Jobsite product guide",
          "description": "Look up how Jobsite (this product) works — features, UI navigation, terminology, account / billing, worker-side experience, what counts as a 'group' vs 'crew', etc. Use this for any 'how do I…' / 'where do I find…' / 'what does X mean in Jobsite' question. Returns matching sections from the curated product guide. NOT for OSHA / regulatory questions (use search_law_corpus) and NOT for a company's own records (its workers, certificates, jobs). If a returned section is flagged todo:true, the topic is in scope but not yet documented — say so rather than inventing an answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max sections to return. Defaults to 4, cap 8.",
                "type": "number"
              },
              "query": {
                "description": "Natural-language query, e.g. 'how do I add a worker', 'difference between groups and crews', 'where do I see expiring certs'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Jobsite product guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0364c7237e73e9c4886dff993c4ca83948afd60544b08aa4a9c8aa5b4e193179"
        },
        {
          "name": "osha_recordability_check",
          "title": "OSHA recordability check",
          "description": "Runs Jobsite's deterministic OSHA 29 CFR 1904 decision tree on the facts of an injury or illness: returns the proposed 300-log classification (or the questions still needed), the rationale with verbatim 1904 quotes, and any report-to-OSHA deadline (8 or 24 hours). Map the story to the answers; leave out anything not known — unknowns come back as questions, never guesses. Reads and writes no records.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amputation_or_eye_loss": {
                "description": "Amputation (incl. a fingertip) or loss of an eye.",
                "type": "boolean"
              },
              "days_away": {
                "description": "≥1 calendar day away after the day of injury (taken or recommended).",
                "type": "boolean"
              },
              "death": {
                "type": "boolean"
              },
              "exception": {
                "description": "A 1904.5(b)(2) work-relatedness exception, or none.",
                "enum": ["none", "general_public", "symptoms_only_surfaced_at_work", "voluntary_wellness", "personal_food", "personal_tasks_off_hours", "grooming_self_medication_self_inflicted", "commuting_accident", "cold_or_flu", "mental_illness_no_opinion"],
                "type": "string"
              },
              "inpatient_hospitalization": {
                "description": "Formal in-patient admission for care (not observation only).",
                "type": "boolean"
              },
              "loss_of_consciousness": {
                "type": "boolean"
              },
              "new_case": {
                "description": "A new case, not a recurrence of one already recorded.",
                "type": "boolean"
              },
              "restricted_or_transferred": {
                "description": "Restricted work or job transfer beyond the day of injury.",
                "type": "boolean"
              },
              "significant_diagnosis": {
                "description": "Cancer, chronic irreversible disease, fractured/cracked bone or punctured eardrum, diagnosed by a clinician.",
                "type": "boolean"
              },
              "treatments": {
                "description": "Every care given ([] = none). First-aid items are the closed 1904.7(b)(5)(ii) list; anything else is medical treatment.",
                "items": {
                  "enum": ["otc_at_otc_strength", "tetanus_shot", "wound_cleaning", "simple_wound_covering", "hot_cold_therapy", "non_rigid_support", "transport_immobilization", "nail_drain_blister", "eye_patch", "eye_irrigation_swab", "splinter_removal", "finger_guard", "massage", "heat_stress_fluids", "rx_medication", "otc_at_rx_strength", "non_tetanus_immunization", "sutures_staples_glue", "rigid_immobilization", "physical_therapy_chiro", "other_medical_treatment", "observation_only", "diagnostic_only"],
                  "type": "string"
                },
                "type": "array"
              },
              "work_environment_event": {
                "description": "An event or exposure at work caused or contributed.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "OSHA recordability check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7264cadc1d4477fc63e6761f2d152819027e61cdf49049ad93fdc0bf48754a0c"
        },
        {
          "name": "search_articles",
          "title": "Search Jobsite articles",
          "description": "Search Jobsite's published marketing content — blog articles, head-to-head COMPETITOR COMPARISON pages (e.g. 'Jobsite vs Procore', 'Jobsite vs SiteDocs', 'Jobsite vs SafetyCulture'), and pillar guides. Use this whenever the user asks how Jobsite compares to a competitor ('how are you better than Procore', 'Jobsite vs SafetyCulture', 'why pick you over X'), or asks for a published article on a construction-safety topic. Returns matching articles with a relevant excerpt and a link to the full page. This is DISTINCT from lookup_jobsite_docs (product how-to) and search_law_corpus (OSHA regulatory text). If nothing matches, say you don't have an article on it rather than inventing a comparison.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max articles to return. Defaults to 4, cap 6.",
                "type": "number"
              },
              "query": {
                "description": "Natural-language query, e.g. 'how is Jobsite better than Procore', 'Jobsite vs SiteDocs', 'confined space article'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Jobsite articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b692a11a11928d08fd5e55c1bd427061d94865e2e78b2894533402509d43cc8"
        },
        {
          "name": "search_law_corpus",
          "title": "Search the regulation corpus",
          "description": "Search the VERBATIM authority corpus behind Jobsite's training: 29 CFR regulation text (per-section, with citations), the CA/WA/OR state rules for heat illness and wildfire smoke, plus OSHA interpretations and NIOSH/CDC/EPA technical guidance the training cites. Use this when the user asks what an authority ACTUALLY SAYS — exact rule language, a specific citation ('what does 1926.501 require'), trigger heights, employer duties — and quote the returned text with its citation heading and jurisdiction. EVERY match carries an `authority` field: T1 is binding law, T2 is an agency interpretation and T3 is technical guidance. READ IT BEFORE YOU CHARACTERISE THE MATCH — quote a T2/T3 match as what that agency recommends or says, NEVER as what a regulation requires, and never call it a rule. It returns the source text itself, not a paraphrase of it — prefer it whenever the user wants what the rule says. The corpus spans the topics Jobsite trains on plus the authorities they cite, NOT all of 29 CFR: an empty result means 'not in the corpus', never 'no such rule exists'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "description": "Optional filter. Omit to search all jurisdictions (federal is most of the corpus).",
                "enum": ["federal", "california", "washington", "oregon"],
                "type": "string"
              },
              "limit": {
                "description": "Max sections to return. Defaults to 4, cap 8.",
                "type": "number"
              },
              "query": {
                "description": "Plain-words regulatory question or a citation number — 'fall protection trigger height', '1926.501', 'silica exposure control plan'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the regulation corpus"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53a37654526c1b7c7d2a2b184a55f7ec00395c96148858acbb74298980e64939"
        },
        {
          "name": "search_regulatory_news",
          "title": "Search regulatory news",
          "description": "Search recent regulatory / safety news from the Federal Register (filtered to OSHA) and the OSHA news RSS feed. Use for questions about recent rule changes, enforcement memos, or news that might affect a training course's content (e.g. 'any silica updates this year', 'recent fall protection rulemaking'). Returns titles, agencies, dates, URLs, and short summaries — pure pass-through, nothing is persisted. Prefer specific multi-word queries built around an OSHA topic or standard ('respirable silica §1926.1153', 'lockout tagout enforcement', 'fall protection 1926.501'). NOT for tenant-data questions; NOT for general OSHA reference (use search_law_corpus for established standards).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results to return per source. Defaults to 6, cap 12.",
                "type": "number"
              },
              "query": {
                "description": "Natural-language search terms. Best with topical keywords plus standard numbers when known.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search regulatory news"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d2376335a8bb96e9368e90a131de28eea91c4a28c8c164a6d80d7e0f6790ee58"
        },
        {
          "name": "start_jobsite_workspace",
          "title": "Start a sample Jobsite workspace",
          "description": "Create a new Jobsite workspace that holds only sample data (a sample crew, jobs and safety records; nothing real) for the person you are helping, so they can try Jobsite without setting anything up. Returns a one-time claim link to give them: opening it lets them create their login (or sign in) and own the workspace. The link expires in 7 days, and an unclaimed workspace is then deleted. Exploring the sample data is free; adding real workers needs a Jobsite plan. Takes no personal details. Limited to 3 workspaces a day per network address. Optional: company_name, focus (safety or home services) and the company's trade.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "The company name for the workspace (default \"Sample Company\"). The person can change it later.",
                "maxLength": 80,
                "type": "string"
              },
              "focus": {
                "description": "safety (default): the Safety Suite. home_services: the Home Services Suite (service calls, estimates).",
                "enum": ["safety", "home_services"],
                "type": "string"
              },
              "trade": {
                "description": "The company's trade in a few words, e.g. \"roofing\" or \"HVAC\"; it sets the workspace's industry when it matches one Jobsite lists.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a sample Jobsite workspace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "anthropic/requiresUserInteraction": true
          },
          "digest": "sha256:8e41575fff9df0b54b21d382791e13fbb0037065b58f3b38baaf16176451bb4a"
        },
        {
          "name": "training_required_for",
          "title": "Training a trade needs, from Jobsite's inventory",
          "description": "What training Jobsite's requirements inventory assigns a construction trade in a US state, optionally for roles the worker also holds (supervisor, competent person, forklift operator, scaffold erector and others). Every obligation comes from Jobsite's inventory, never from general knowledge, and carries its citation and the regulation text quoted verbatim: quote it as given. Each row's kind matters and must be kept: a mandate is an unconditional legal training duty; a condition applies only when the condition it names exists on the job; a policy is training Jobsite assigns without a legal mandate there, with its basis stated. A not-found answer means \"not in Jobsite's requirements inventory\", never \"no training required\". The inventory holds federal OSHA rows plus California, Washington, Oregon and Nevada rows. search_law_corpus returns the full text of any cited rule.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max obligations to return (default 40, up to 80).",
                "maximum": 80,
                "minimum": 1,
                "type": "integer"
              },
              "roles": {
                "description": "Roles or designations the worker also holds. A competent person is designated per topic, so pair it with topic to narrow.",
                "items": {
                  "enum": ["supervisor", "office_staff", "program_administrator", "competent_person", "qualified_person", "authorized_worker", "first_aid_responder", "confined_space_entrant", "confined_space_attendant", "fire_watch", "forklift_operator", "scaffold_erector", "respirator_user", "qualified_rigger", "mewp_operator", "signal_person", "crane_operator"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "state": {
                "description": "The US state the work is in: a two-letter code or name, e.g. \"CA\".",
                "maxLength": 40,
                "type": "string"
              },
              "topic": {
                "description": "Narrow to one training topic.",
                "enum": ["active_shooter", "bloodborne_pathogens", "confined_space", "crane_operations", "electrical_safety", "fall_protection", "fire_extinguisher", "first_aid", "forklift", "hazcom", "hearing_conservation", "heat_illness", "hoisting_rigging", "hot_work_welding", "ladder_safety", "lead", "lockout_tagout", "materials_handling", "mewp", "ppe", "respiratory_protection", "scaffolding", "security_awareness", "silica", "slips_trips_falls", "trenching_excavation", "wildfire_smoke", "work_zone_flagger", "workplace_violence"],
                "type": "string"
              },
              "trade": {
                "description": "The worker's trade in plain words, e.g. \"roofer\", \"electrician\", \"sheet metal\". An unknown trade returns the trades Jobsite knows.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Training a trade needs, from Jobsite's inventory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf1a1b32f54384a85d7d7dde0c4271430ae133daadd116b3902868fd4165c94a"
        },
        {
          "name": "verify_certificate",
