      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools for Postal Code Lookup. Served by Invokera on behalf of api.zippopotam.us.",
      "tools": [
        {
          "name": "lookup_postal_code",
          "description": "Look up a postal code. Returns the places (city, state/region, latitude/longitude) matching the given postal code in the given country. Returns: Matching places with coordinates for the postal code..",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter lowercase country code, e.g. us, de, fr.",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "postalCode": {
                "description": "Postal / ZIP code to look up, e.g. 90210.",
                "type": "string"
              }
            },
            "required": ["country", "postalCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
