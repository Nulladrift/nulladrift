  "subjects": {
    "com.schengencounter/schengen-counter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.schengencounter.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "schengen-counter",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use the Schengen tools for date arithmetic and the ETIAS tool for a basic country classification. These are planning aids, not legal advice. Visit https://schengencounter.com for the interactive calculators and verify current rules with official authorities.",
      "tools": [
        {
          "name": "etias_check",
          "description": "Check the project’s current country classification: ETIAS-required, EU/EEA/Swiss free movement, or Schengen short-stay visa required. This country classification is informational and may change; verify current entry rules with official authorities.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Passport nationality as a two-letter ISO code or listed country name.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72e18a223b64f5d9ce0f3d05d3b179c5a66364a4d01c6a9a7367725006246491"
        },
        {
          "name": "schengen_check_days",
          "description": "Calculate used and remaining Schengen short-stay days under the rolling 90/180-day rule from trips explicitly provided in this request. Trip dates are processed in memory and not stored. For planning only, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "referenceDate": {
                "description": "Date to evaluate, YYYY-MM-DD. Defaults to today.",
                "type": "string"
              },
              "trips": {
                "description": "Schengen trips. Entry and exit are YYYY-MM-DD; exit is inclusive. Omit exit for a single day.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "entry": {
                      "type": "string"
                    },
                    "exit": {
                      "type": "string"
                    }
                  },
                  "required": ["entry"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["trips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1af59c8a1111e972b891b51a0bb29d7eb966e7c148d5bb9a6328d2c9cf2c0764"
        },
        {
          "name": "schengen_earliest_reentry",
          "description": "Find the earliest date a traveler can legally re-enter Schengen and the longest consecutive stay possible, from trips explicitly provided in this request. Trip dates are processed in memory and not stored. For planning only, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "referenceDate": {
                "description": "Date to evaluate, YYYY-MM-DD. Defaults to today.",
                "type": "string"
              },
              "trips": {
                "description": "Schengen trips. Entry and exit are YYYY-MM-DD; exit is inclusive. Omit exit for a single day.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "entry": {
                      "type": "string"
                    },
                    "exit": {
                      "type": "string"
                    }
                  },
                  "required": ["entry"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["trips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cdad22e5f5f9c980cbe7a94c5b52a1ad77d5c8da3cd268fae62fe43aa27aba07"
        }
      ],
      "digest": "sha256:47e343b35d2ae88c58811fab1aa105b2c365269dd180d2dbb82863946fb41e85"
    }
  }
}
