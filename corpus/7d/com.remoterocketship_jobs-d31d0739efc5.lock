{
  "lockfileVersion": 2,
  "subjects": {
    "com.remoterocketship/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.remoterocketship.com/api/openclaw/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.remoterocketship/jobs",
        "title": "Remote Rocketship jobs",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "search_remote_jobs",
          "description": "Search remote jobs by title, country, seniority, salary, and technology. Requires the subscriber API key in the HTTP Authorization: Bearer header. Consumes the same daily quota as the REST API. Returns jobs and pagination. Does not apply to jobs.",
          "inputSchema": {
            "properties": {
              "filters": {
                "description": "Optional filters. Omitted fields use the defaults. Unrecognized values are ignored or normalized.",
                "properties": {
                  "companyIdFilter": {
                    "description": "Company identifier to restrict results to.",
                    "type": ["string", "null"]
                  },
                  "companySizeFilters": {
                    "description": "Employee ranges: 1,10; 11,50; 51,200; 201,500; 501,1000; 1001,5000; 5001,10000; 10001,.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "degreeRequiredFilter": {
                    "description": "String true or false for whether a degree is required.",
                    "enum": ["true", "false", null],
                    "type": ["string", "null"]
                  },
                  "employmentTypeFilters": {
                    "description": "Allowed values: full-time, part-time, contract, internship.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "excludeIndustriesFilters": {
                    "description": "Company industries to exclude.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "excludeRequiredLanguagesFilters": {
                    "description": "Required spoken-language codes to exclude.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "excludedKeywordFilters": {
                    "description": "Keywords to exclude.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "hideGhostJobsFilter": {
                    "description": "true hides ghost jobs; only selects them. Null disables this filter.",
                    "enum": ["true", "only", null],
                    "type": ["string", "null"]
                  },
                  "industriesFilters": {
                    "description": "Company industries to include.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "isOnLinkedInFilter": {
                    "description": "String true or false for whether the role is listed on LinkedIn.",
                    "enum": ["true", "false", null],
                    "type": ["string", "null"]
                  },
                  "itemsPerPage": {
                    "default": 20,
                    "description": "Results requested per page, clamped to 1 through 50 and the remaining job quota.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "number"
                  },
                  "jobTitleFilters": {
                    "description": "Job titles such as Software Engineer. Recognized aliases normalize to canonical titles regardless of casing or language. Unresolved ambiguous aliases remain custom search text.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "keywordFilters": {
                    "description": "Required keywords. Terms are combined with AND.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "language": {
                    "default": "en",
                    "description": "Search language context. Defaults to English. Job-title aliases are shared across languages.",
                    "enum": ["en", "br", "de", "fr", "ca", "gb", "us"],
                    "type": "string"
                  },
                  "locationCityFilters": {
                    "description": "City names to include.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "locationFilters": {
                    "description": "Eligible countries, regions, or US state names. US and UK synonyms are accepted.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "minSalaryFilter": {
                    "description": "Minimum annual salary in USD.",
                    "type": ["number", "null"]
                  },
                  "page": {
                    "default": 1,
                    "description": "Page number, starting at 1.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "requiredLanguagesFilters": {
                    "description": "Required spoken-language codes to include, such as en or fr.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "seniorityFilters": {
                    "description": "Allowed levels: entry-level, junior, mid, senior, expert.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "showHybridJobs": {
                    "default": false,
                    "description": "Include hybrid roles.",
                    "type": "boolean"
                  },
                  "showJobsWithoutSalaryWithMinSalaryFilter": {
                    "default": true,
                    "description": "Include roles with undisclosed pay when a salary minimum is set.",
                    "type": "boolean"
                  },
                  "showOnsiteJobs": {
                    "default": false,
                    "description": "Include onsite roles.",
                    "type": "boolean"
                  },
                  "showRemoteJobs": {
                    "default": true,
                    "description": "Include remote roles.",
                    "type": "boolean"
                  },
                  "sortBy": {
                    "default": "DateAdded",
                    "description": "DateAdded sorts newest first; Salary sorts highest salary first.",
                    "enum": ["DateAdded", "Salary"],
                    "type": "string"
                  },
                  "techStackFilters": {
                    "description": "Technologies used in the role, such as React or TypeScript.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "visaFilter": {
                    "description": "Visa sponsorship filter: h1b or uk-skilled-worker.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "includeJobDescription": {
                "default": false,
                "description": "Include the full role description and requirements.",
                "type": "boolean"
              }
            },
            "required": ["filters"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e888d769bc045a2d0cf34f501a0c72e1deb7440d53dd8b6f5fc908457f1abf85"
        }
      ],
      "digest": "sha256:331b6c59f5e079efc0ee17793f95e2e9f572010202f3c6c47288198df17f3783"
    }
  }
}
