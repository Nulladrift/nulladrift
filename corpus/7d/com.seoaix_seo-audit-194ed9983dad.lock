      "tools": [
        {
          "name": "ai_search_diagnostic",
          "description": "Audit ANY URL for AI-search readiness only (AEO/GEO/LLMO) — how likely ChatGPT, Claude, Perplexity & Google AI are to cite it. Checks ~7 AI-citation signals (FAQ/structured-data/entity schema, citable stats, llms.txt, author/E-E-A-T, OG). Returns a weighted 0–100 AI-readiness score + top fixes. Takes a `url`. Use full_seo_audit for the broader SEO picture, or get_my_store_audit for the user's own connected store. Returns a summary of the top issues; the complete written report is available via email_seo_report.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The website URL to audit, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a13c11588bd57d035c9bc643a0727ec0457e475126ca7cea0a3fec683c8d1a8b"
        },
        {
          "name": "decide_recommendation",
          "description": "Approve or reject ONE pending SeoAiX recommendation for the user's own store (ids from list_pending_approvals). Approving can change the live store. Takes TWO calls. Call it first WITHOUT confirmToken: nothing changes, and you get a preview plus a confirmToken (valid 10 minutes, single use). Show the preview to the user and ask them. Only if they clearly say yes, call again with the same arguments plus that confirmToken. Never confirm on your own judgement, and never loop over many items. Needs a key with the \"approve\" permission.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Store-bound SeoAiX API key (inxy_sk_…). Optional if already sent as an Authorization: Bearer header.",
                "type": "string"
              },
              "confirmToken": {
                "description": "Only on the second call, from the preview",
                "type": "string"
              },
              "decision": {
                "enum": ["approve", "reject"],
                "type": "string"
              },
              "id": {
                "description": "Recommendation id from list_pending_approvals",
                "type": "string"
              }
            },
            "required": ["decision", "id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1306ae736cb4998e959135d876b84bd1322196b160742d40a6aca16e4a1fe02"
        },
        {
          "name": "email_seo_report",
          "description": "ALWAYS OFFER THIS after running an audit: the audit tools return a summary of the top issues, while this sends the complete written report — every check, its evidence, and the fix in priority order. Ask the user which email address to send it to; never guess or reuse an address they did not give in this conversation. Email the full written SEO/AEO report for an audit this session already ran. Takes the audit_id returned by ai_search_diagnostic or full_seo_audit, plus the user's email. ONLY use an email address the user explicitly gave you - never guess or invent one. Offer this after presenting audit results.",
          "inputSchema": {
            "properties": {
              "audit_id": {
                "description": "The audit_id from a previous audit result in this conversation",
                "type": "string"
              },
              "email": {
                "description": "The email address the user asked the report to be sent to",
                "type": "string"
              },
              "weekly": {
                "description": "true ONLY if the user asked for weekly updates: re-audits the site every week and emails the score change. One-click unsubscribe in every email.",
                "type": "boolean"
              }
            },
            "required": ["audit_id", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eba9ced55c7d2607f3989d7ee38ee54b2a52806c9248de164189e29e95bffaf3"
        },
        {
          "name": "full_seo_audit",
          "description": "Crawl-audit ANY URL across the WHOLE SEO surface (no login needed): the AI-search signals PLUS on-page SEO (title/meta/headings/content), technical SEO (HTTPS, robots.txt, XML sitemap, canonical, mobile), and — for Shopify stores — product/offer/review/breadcrumb schema and image-alt coverage. Returns a weighted 0–100 score + top issues. Takes a `url`. This audits an arbitrary website by crawling it — for the user's OWN connected store with real analytics, use get_my_store_audit. Returns a summary of the top issues; the complete written report is available via email_seo_report.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The website URL to audit, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:036608a6ec7667ba98bcb493451fd53506188413a2f506e9d8e4e6ff1aad0a9a"
        },
        {
          "name": "generate_llms_txt",
          "description": "Generate an llms.txt file (llmstxt.org format) for ANY website, no login needed. Reads the home page, robots.txt, the XML sitemap and a sample of key pages (pricing, about, docs, products…), then returns a ready-to-publish llms.txt: `# Site name`, a one-line summary, and `## Section` link lists with page descriptions. Also reports whether the site already serves a real /llms.txt. Takes a `url`. Built from the site's own titles and meta descriptions (no AI rewriting) — review before publishing at the site root as /llms.txt.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The website to generate an llms.txt for, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41961c68e88a627498f194d8bb30d213e6408d80e52de1a5c81a4417dd3fca12"
        },
        {
          "name": "get_my_store_audit",
          "description": "Get the user's OWN connected Shopify store audit — the deep 12-category report SeoAiX runs INSIDE the app using the store's real catalog, performance and analytics (technical, performance, on-page, schema, AEO, analytics, e-commerce, etc.) — far beyond what crawling a URL can see. Takes no url. Needs an SeoAiX API key (free at seoaix.com → Settings) + a connected store: pass the key either as `Authorization: Bearer inxy_sk_…` or as the `api_key` argument.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Your SeoAiX API key (inxy_sk_…). Optional if already sent as an Authorization: Bearer header.",
                "type": "string"
