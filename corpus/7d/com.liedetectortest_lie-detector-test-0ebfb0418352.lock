{
  "lockfileVersion": 2,
  "subjects": {
    "com.liedetectortest/lie-detector-test": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://liedetectortest.com/wp-json/ldt-mcp/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "liedetectortest",
        "version": "1.5.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for LieDetectorTest.com: find polygraph (lie detector) test offices, see who the examiner is and the price, and learn how booking works. There is no booking fee and nothing is paid online: the person books directly with their examiner (via the booking_url, or start_booking when they ask you to send the request) and pays the examiner directly. Always check your examiner: https://liedetectortest.com/check-your-examiner",
      "tools": [
        {
          "name": "find_offices",
          "description": "Find lie detector (polygraph) test offices near a place. Search by city, state/region, or country (United States, Canada, or United Kingdom). Returns each matching office with its address, all-inclusive prices, and a booking link.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum offices to return (1-50, default 15).",
                "type": "integer"
              },
              "query": {
                "description": "A city, state/region, or country, e.g. \"Miami\", \"Florida\", \"London\", \"Ontario\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find test offices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b98b90b789f8564a8cda3bad50ffa603919ae4055808ed3b94ed8de1d75c866"
        },
        {
          "name": "get_booking_status",
          "description": "Check the status of an existing booking or appointment request by its reference (e.g. LDT-2026072062783). Returns the status and location. Status \"request\" means the request has been sent to the examiner, who will contact the person directly.",
          "inputSchema": {
            "properties": {
              "booking_reference": {
                "description": "The booking reference, e.g. \"LDT-2026072062783\".",
                "type": "string"
              }
            },
            "required": ["booking_reference"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check booking status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4faac1fca15801dc360ceff3e104853e43ddc9485c1a1671d704ed8cad0dcb49"
        },
        {
          "name": "get_pricing",
          "description": "Get polygraph examination pricing for a location. Returns the all-inclusive price tiers (single person, couple/two-person total, and group per-examinee) and how payment works: there is no booking fee and nothing is paid online or to LieDetectorTest.com — the client pays the examiner directly once the examiner accepts the case.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A city, state/region, or country, e.g. \"Miami\", \"Texas\", \"United Kingdom\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:382c174ea39f513ff9b4e1ae8f0ce9d7b76c6d4eeda26210dc6fc946f187e859"
        },
        {
          "name": "get_service_info",
          "description": "Get general information about the lie detector test service: what is offered, how booking works, how payment works, the service area, and what happens after booking. Takes no arguments.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Service information"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbf4e4d4e07ee6ad360a9cb939fa9308919d5452b2c7907a80adaa6f4b8be049"
        },
        {
          "name": "start_booking",
          "description": "Send a free, no-obligation lie detector test appointment request for a person, directly to the examiner who covers the chosen location. Nothing is paid online and there is no booking fee: the examiner contacts the person, agrees the date, payment and cancellation terms with them, and the person pays the examiner directly. Only use this when the person has asked you to send the request with these details. Returns a booking reference, the office and a page link where the person can see their examiner (and optionally complete a confidential pre-examination questionnaire). Do not put the person's contact details in any URL.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Contact email address.",
                "type": "string"
              },
              "location": {
                "description": "City, state/region or country for the test, e.g. \"Miami\", \"Florida\", \"London\".",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person to be tested (or the person booking).",
                "type": "string"
              },
              "phone": {
                "description": "Contact phone number (optional but recommended).",
                "type": "string"
              },
              "preferred_dates": {
                "description": "Preferred date(s)/time(s), free text, e.g. \"Aug 5 afternoon or Aug 8 morning\" (optional).",
                "type": "string"
              },
              "reason": {
                "description": "Short reason/type of test, e.g. \"infidelity\", \"employment\", \"legal\" (optional).",
                "type": "string"
              },
              "service_type": {
                "description": "One of: single (one person), couple (two people), or group (three or more).",
                "type": "string"
              }
            },
            "required": ["email", "location", "name", "service_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:960e7f98de6a2124ab68a2be43c882e88c7305cfbd0b8c34ebc67e42b8ba87ed"
        }
      ],
      "digest": "sha256:c0d388a874447af0d1476cd3715b39d532eeffd090597e9b8eb27353f4d3a9c2"
    }
  }
}
