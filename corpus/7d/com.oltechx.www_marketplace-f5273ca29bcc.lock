{
  "lockfileVersion": 2,
  "subjects": {
    "com.oltechx.www/marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.oltechx.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "oltechx",
        "title": "OLTechX",
        "version": "1.0.0",
        "websiteUrl": "https://www.oltechx.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OLTechX (https://www.oltechx.com) is a Bulgarian marketplace only for tech: PC parts, computers, laptops, phones, tablets, consoles, audio. Prices are in EUR. Listing text is mostly in Bulgarian; answer the user in their language.\n\nHow to help a shopper:\n1. search_listings with what they want (model name works best, e.g. \"RTX 3060\", \"iPhone 13\"). Show the best matches with price, condition, city and the listing url.\n2. For \"is this a good price?\" or \"how much is X worth?\" use get_model_prices (used and new range from real listings and sales).\n3. If nothing matches, show the alternatives the result gives (similar models with open listings, or results without filters), and offer the alert: the user creates a free account through alert.signup_url and gets an email and push notification when a matching listing appears. Do the same when results exist but none fits.\n4. For gaming questions use estimate_fps; for \"will these parts work together?\" use check_build.\n5. If the user wants to sell something, give sell_url.\nAlways link to the returned urls: photos, seller contact and the chat are on the site (contacts need sign-in). Never invent listings or prices.",
      "tools": [
        {
          "name": "check_build",
          "title": "Check PC build compatibility",
          "description": "Check whether PC parts fit together (socket, chipset, RAM type, case and cooler clearance, power) and get the recommended PSU wattage. CPU and GPU can be catalog model names or slugs; any part can be a listing id from search_listings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "case": {
                "description": "Listing id",
                "maxLength": 80,
                "type": "string"
              },
              "cooler": {
                "description": "Listing id",
                "maxLength": 80,
                "type": "string"
              },
              "cpu": {
                "maxLength": 80,
                "type": "string"
              },
              "gpu": {
                "maxLength": 80,
                "type": "string"
              },
              "motherboard": {
                "description": "Listing id",
                "maxLength": 80,
                "type": "string"
              },
              "psu": {
                "description": "Listing id",
                "maxLength": 80,
                "type": "string"
              },
              "ram": {
                "description": "Listing id",
                "maxLength": 80,
                "type": "string"
              },
              "storage": {
                "description": "Listing id",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7519853336991a8278c79a0dd3a86e7de85abf84edd564de39fd6749dc7d8b82"
        },
        {
          "name": "create_search_alert",
          "title": "Get notified about new listings",
          "description": "Get a link that lets the user follow a search on OLTechX: after a free signup (or sign-in) the search is saved and they receive an email and push notification for every new matching listing. Use when nothing fits now, or the user wants to wait for a better price. Does not save anything by itself.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "maxLength": 40,
                "type": "string"
              },
              "city": {
                "maxLength": 60,
                "type": "string"
              },
              "condition": {
                "enum": ["new", "used"],
                "type": "string"
              },
              "max_price_eur": {
                "minimum": 0,
                "type": "number"
              },
              "min_price_eur": {
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "What to watch for, e.g. 'RTX 4070'",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:45f9d0440f9495cbc356fb0b0ccc42370d4789d3574d33583e767ea8dc704d62"
        },
        {
          "name": "estimate_fps",
          "title": "Estimate FPS",
          "description": "Average FPS of a graphics card (optionally with a specific CPU) at 1080p, 1440p and 4K in games measured by published benchmarks (ComputerBase, HWBen) or estimated from official requirements. Also says whether the CPU or GPU limits performance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cpu": {
                "description": "Processor slug or name; defaults to a Ryzen 7 9800X3D reference",
                "maxLength": 80,
                "type": "string"
              },
              "game": {
                "description": "Game slug or name from list_games; omit for all measured games",
                "maxLength": 80,
                "type": "string"
              },
              "gpu": {
                "description": "Graphics card slug or name, e.g. 'RTX 4060'",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "resolution": {
                "enum": ["1080p", "1440p", "4K"],
                "type": "string"
              }
            },
            "required": ["gpu"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:966bfd7bae999d74307c6a917a76a0694a3e4a4ebfec373337cd42e43fd622e1"
        },
        {
          "name": "find_models",
          "title": "Find models",
          "description": "Find catalog models (CPUs, graphics cards, phones, consoles) by name. Returns slugs to use with get_model_prices, estimate_fps and check_build.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "enum": ["cpu", "gpu", "phone", "console"],
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "e.g. 'RTX 3060', 'Ryzen 7 5800X3D', 'iPhone 13'",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a12cc12c509ba420680db0c8843287704043de257ae19c95abaf3985734d706"
        },
        {
          "name": "get_listing",
          "title": "Get listing",
          "description": "Full public details of one listing by id: description, price, condition, specs, delivery, seller type, photos and URL. Phone numbers and emails stay hidden (they are shown on the site after sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Listing id from search_listings",
                "pattern": "^[0-9a-f-]{36}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40c0fbea670f71e099ae325d391acdd3dc4cca31fd5cdba0d06c24211112607e"
        },
        {
          "name": "get_model_prices",
          "title": "Model prices and specs",
          "description": "What a model really costs in Bulgaria: used and new price range and median from open listings and real sales in the last 180 days, plus official specs, gaming score and the cheapest open listings. Accepts a slug or a name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "enum": ["cpu", "gpu", "phone", "console"],
                "type": "string"
              },
              "model": {
                "description": "Slug or name, e.g. 'rtx-3060' or 'GeForce RTX 3060'",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7332c58b9dcc8b20e245aa72b5ca9488f8e138a6314bf16ba1f1f28f8ab09cf"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "All categories with slugs and current listing counts. Use the slug in search_listings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0549d5fc5b280ce703ff279c0b9b62400d483a13c1df27b58656ab9b7344317c"
        },
        {
          "name": "list_games",
          "title": "List games",
          "description": "Games with FPS data: measured in published tests or estimated from the publisher's official requirements.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af90fb970c600fd9b6618c1be53a85e09386fc90b7c77ecc49ada2fc301951f5"
        },
        {
          "name": "search_listings",
          "title": "Search listings",
          "description": "Search open listings (offers) on OLTechX, the Bulgarian tech marketplace. Free-text query in Bulgarian or English (e.g. 'RTX 3060', 'iPhone 13 128GB', 'PS5'), with optional category, condition, city and EUR price range. Returns up to 24 results per page with price, condition, city and URL. When nothing matches it returns similar models that have listings, and always an alert link so the user can be notified about new matches.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category slug from list_categories, e.g. 'videokarti', 'procesori', 'telefoni'",
                "maxLength": 40,
                "type": "string"
              },
              "city": {
                "description": "Bulgarian city name in Cyrillic, e.g. 'София', 'Пловдив', 'Варна'",
                "maxLength": 60,
                "type": "string"
              },
              "condition": {
                "enum": ["new", "used"],
                "type": "string"
              },
              "max_price_eur": {
                "minimum": 0,
                "type": "number"
              },
              "min_price_eur": {
                "minimum": 0,
                "type": "number"
              },
              "page": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text, e.g. 'RTX 4070', 'Ryzen 5 5600', 'MacBook Air M1'",
                "maxLength": 120,
                "type": "string"
              },
              "sort": {
                "description": "'deal' = best price compared to the usual price for the model",
                "enum": ["new", "cheap", "expensive", "deal", "popular"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:443a4c6af2e294916f9860e50bbb4adb117a8d8673ce2f727ebee03670eecce2"
        }
      ],
      "digest": "sha256:0fe0a5e8d5be53f6e85e7c4dcb5abe4c42339c14001716cd38f9092bb7871dd8"
    }
  }
