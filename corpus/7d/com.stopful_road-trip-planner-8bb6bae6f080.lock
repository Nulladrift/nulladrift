{
  "lockfileVersion": 2,
  "subjects": {
    "com.stopful/road-trip-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stopful.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stopful",
        "title": "Stopful map",
        "version": "2.49.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "Stopful renders a planned multi-stop driving route as an interactive map. It provides one tool, plot_trip, which takes the stops in driving order — each a real place name, its number of nights, and its decimal lat/lon where known — and returns a link to the map, plus an inline map in clients that support one. Stops sent without coordinates are geocoded from their names, and coordinates that land far from where the name resolves are reported in the result. The map shows per-leg drive times and distances, and an estimate of what the trip will cost before anything is booked, and can be edited by the traveller: dragging a pin moves a stop, dragging the route adds one, and those changes are saved to the trip. Each result carries the trip's `id`; a later call that includes that `id` applies to the same trip, keeping its link and the traveller's map edits, while a call without one creates a separate trip. There is no planning or text generation on this server — it renders the itinerary it is given.",
      "tools": [
        {
          "name": "plot_trip",
          "description": "Creates a road trip on Stopful, or updates one plotted earlier, and returns an interactive map of it — adding, removing, reordering or renaming stops, changing nights, dates or party size, and redrawing the route. Renders a multi-stop driving route as an interactive map and returns a link to it, plus an inline map in clients that support one. Takes a list of stops in driving order, each with a place name, optional decimal lat/lon and number of nights; a stop without coordinates is geocoded from its name, and coordinates that fall far from where the name resolves are reported back in the result. Accepts an optional trip name, start date, party size, and a day-by-day itinerary that becomes a day view over the map. The map shows per-leg drive times and distances and an estimate of what the trip will cost before anything is booked, and is editable: the traveller can drag a pin to move a stop or drag the route to add one, and their changes are saved to the trip. Covers road trips and other multi-stop routes; a single destination or a route with no stops to draw has nothing to render. The result contains the map link, the trip as structured data, and the trip's `id` (see the `id` parameter for updating an existing trip).",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "The day-by-day itinerary: one entry per calendar day of the trip, in order, each with a title and the day's activities. It renders as a tappable day view over the map, and selecting a day highlights that day's driving; the activities also become the trip's itinerary in the full Stopful planner, where the traveller can edit them. Send it when planning a trip, or when rewriting the itinerary — the day titles replace the saved ones wholesale, there are no partial day updates, while the activities under them are reconciled with what is saved rather than overwritten (see `id`). On a call that only changes the route of an existing trip, leaving `days` out keeps the saved itinerary untouched, which is usually what is wanted; the result echoes whatever is saved either way.",
                "items": {
                  "properties": {
                    "items": {
                      "description": "The day's plan, in order.",
                      "items": {
                        "properties": {
                          "lat": {
                            "description": "Optional decimal latitude of the activity. Supplying lat and lon puts a numbered pin on the map for it; without them the activity is still listed under its day, just not placed. Send them for a real place, and leave them out for something that isn't one ('Pack a picnic', 'Drive south').",
                            "type": "number"
                          },
                          "lon": {
                            "description": "Optional decimal longitude of the activity.",
                            "type": "number"
                          },
                          "note": {
                            "description": "Optional one-line detail.",
                            "type": "string"
                          },
                          "time": {
                            "description": "Optional time or part of day, e.g. '9:00 AM' or 'Morning'.",
                            "type": "string"
                          },
                          "title": {
                            "description": "The place or activity, e.g. 'Altstadt Salzburg'. Every outing from a base belongs here — this is the only place it should appear, never also in `stops`.",
                            "type": "string"
                          }
                        },
                        "required": ["title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "summary": {
                      "description": "Optional one-line what-to-expect for the day.",
                      "type": "string"
                    },
                    "title": {
                      "description": "Short day title, e.g. 'Over the Alps to Innsbruck'.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "focusDay": {
                "description": "Optional. Open the map on this day of the itinerary, 1 = the first day. The map shows ONE DAY at a time: the chosen day's stops, activities and driving, with the rest of the route greyed. Use it WITH `id` to answer 'show me day 3' about a trip already plotted — that gives the traveller one map they can page through instead of a new map per day. Omitted, the map opens on the day the trip is actually on (day 1 before it starts), and the traveller can switch day or ask for the whole route from the map itself.",
                "type": "integer"
              },
              "guests": {
                "description": "Optional party size.",
                "properties": {
                  "adults": {
                    "description": "Number of adults (default 2).",
                    "type": "integer"
                  },
                  "children": {
                    "description": "How many children, for when their ages aren't known. Ignored when `childrenAges` is given.",
                    "type": "integer"
                  },
                  "childrenAges": {
                    "description": "Age of each child, e.g. [7, 11]. Preferred over `children`, because hotel and ticket pricing depends on the ages.",
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "id": {
                "description": "Id of a trip returned by an earlier call. SEND IT whenever this call is about a trip already plotted in this conversation — showing one of its days, fixing a stop, changing the route. WITHOUT `id` a separate new trip is created and the traveller is left with a pile of near-duplicate maps instead of one they can follow. With it the map link stays the same and their own edits survive. To change an existing trip, send its `id` together with the COMPLETE new `stops` and `days`; there are no partial updates. The map link then stays the same, and edits the traveller made on the map survive. Stops: a re-sent stop keeps the position they dragged it to, stops or waypoints they added on the map but absent from `stops` are kept, and a stop that was there before and is now omitted is removed. Activities: a re-sent one keeps its identity and the place, price and booking it carries on the map, which this tool does not report and so cannot be sent back; an activity the traveller added themselves is kept whether or not it appears here; one this tool showed earlier and now omitted is removed. Without an `id` a separate new trip is created and none of that carries over. Sending `id` with no `stops` is also accepted and changes nothing — it returns the trip exactly as saved.",
                "type": "string"
              },
              "name": {
                "description": "Optional trip name (e.g. 'Lisbon → Pyrenees'). Defaults to first → last stop.",
                "type": "string"
              },
              "startDate": {
                "description": "Optional trip start as ISO yyyy-mm-dd.",
                "type": "string"
              },
              "stops": {
                "description": "The route in driving order, 1 to 40 entries (the first is the origin). Required for a normal call — the only call that omits it is `id` on its own, which re-reads a saved trip unchanged. Each entry needs `name`; every other field is optional. A stop is a place the traveller sleeps, or a place on the road between two such places. An outing made from a base — a waterpark, a market, a cave, a viewpoint visited from the hotel and returned from the same day — is NOT a stop: put it under `days` as that day's activity, and do not repeat the base between outings. Outings sent as stops are moved under their day.",
                "items": {
                  "properties": {
                    "arriveBy": {
                      "description": "Optional. How the traveller reaches this stop from the previous one. Defaults to a road leg (drive) when absent; 'flight' marks a real flight leg between two stops.",
                      "enum": ["drive", "flight", "train", "bus"],
                      "type": "string"
                    },
                    "id": {
                      "description": "Optional. The id this stop was given in an earlier result. Echoing it back identifies that exact stop even if you rename it, so the traveller's placement and edits follow the right stop. Leave it out for a stop you are adding.",
                      "type": "string"
                    },
                    "lat": {
                      "description": "Optional decimal latitude. On a NEW stop, supplying it is faster and more exact than geocoding the name. On a stop that already exists (one you are sending an `id` for), leave lat/lon out unless you mean to move it — the stop keeps wherever it currently sits, including anywhere the traveller has dragged it. Coordinates sent for an existing stop are an instruction to move it there.",
                      "type": "number"
                    },
                    "lon": {
                      "description": "Optional decimal longitude. Same as lat: give it for a new stop, and leave it out for an existing one unless the point of the call is to move that stop.",
                      "type": "number"
                    },
                    "name": {
                      "description": "Real, searchable place name — a town, city or famous landmark (e.g. 'Sirmione', 'Colosseum'). A vague or descriptive phrase may fail to geocode.",
                      "type": "string"
                    },
                    "nights": {
                      "description": "Optional. Nights at this stop: 0 = a pass-through on the drive (somewhere the route goes through without staying), 1 or more = overnight. Defaults to 1 when absent. A place visited from a base and returned from is an activity under `days`, not a 0-night stop.",
                      "type": "integer"
                    },
                    "sub": {
                      "description": "Optional short qualifier for disambiguation (e.g. region or country).",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["stops"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumed": {
                "description": "Stops placed from their name alone because no coordinates were given — approximate pins.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "description": "The day-by-day itinerary. Activities may include ones the traveller added in the planner rather than through this tool.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "focusDay": {
                "description": "Set when the call asked for one day: the map opens on that day of the itinerary, 1 = the first day.",
                "type": "integer"
              },
              "id": {
                "description": "The trip's id. Pass it back as the `id` argument to apply a later change to this same trip.",
                "type": "string"
              },
              "keptByTraveller": {
                "description": "Stops left where the traveller placed them on the map, so the coordinates supplied in this call were not applied.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notFound": {
                "description": "Stops that were requested but could not be placed, so they are absent from the map and the route.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "trip": {
                "description": "The trip as rendered, after geocoding and (on a continuation) merging the traveller's own map edits.",
                "properties": {
                  "guests": {
                    "properties": {
                      "adults": {
                        "type": "integer"
                      },
                      "childrenAges": {
                        "items": {
                          "type": "integer"
                        },
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "id": {
                    "description": "The trip's id — the same value as the top-level `id`.",
                    "type": "string"
                  },
                  "items": {
                    "description": "The trip's activities, each tied to a stop and a day, including ones the traveller added in the planner.",
                    "items": {
                      "properties": {
                        "cat": {
                          "description": "Kind of activity, e.g. activity or sight.",
                          "type": "string"
                        },
                        "day": {
                          "description": "Day offset within that stop's stay, 0 = the arrival day.",
                          "type": "integer"
                        },
                        "geo": {
                          "description": "How the pin was placed: agent (as sent, then checked), auto (looked up from the name), ticket (from a matched ticket), fixed (corrected).",
                          "type": "string"
                        },
                        "id": {
                          "type": "string"
                        },
                        "lat": {
                          "type": "number"
                        },
                        "lon": {
                          "type": "number"
                        },
                        "name": {
                          "type": "string"
                        },
                        "note": {
                          "type": "string"
                        },
                        "stopId": {
                          "description": "Id of the stop the activity belongs to.",
                          "type": "string"
                        },
                        "time": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "maxKmPerDay": {
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "startDate": {
                    "description": "ISO yyyy-mm-dd, when one was given.",
                    "type": "string"
                  },
                  "stops": {
                    "description": "Final stops in driving order, each with resolved coordinates.",
                    "items": {
                      "properties": {
                        "arriveBy": {
                          "type": "string"
                        },
                        "id": {
                          "description": "Stable id for this stop. Send it back as the stop's `id` when updating the trip, so this stop is recognised even under a different name.",
                          "type": "string"
                        },
                        "lat": {
                          "type": "number"
                        },
                        "lon": {
                          "type": "number"
                        },
                        "name": {
                          "type": "string"
                        },
                        "nights": {
                          "type": "integer"
                        },
                        "sub": {
                          "type": "string"
                        },
                        "waypoint": {
                          "description": "True for a shaping point the traveller dragged out of the route line, not a destination.",
                          "type": "boolean"
                        }
                      },
                      "required": ["lat", "lon", "name"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["name", "stops"],
                "type": "object"
              },
              "unchanged": {
                "description": "True when the call only read the saved trip and changed nothing — an `id` sent with no `stops`.",
                "type": "boolean"
              },
              "url": {
                "description": "Link that opens this trip on the map at stopful.com.",
                "type": "string"
              },
              "warnings": {
                "description": "Stops whose supplied coordinates are far from where their name resolves, with the distance and the resolved position.",
                "items": {
                  "properties": {
                    "km": {
                      "type": "number"
                    },
                    "lat": {
                      "type": "number"
                    },
                    "lon": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["trip", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Plot a road trip on a map"
