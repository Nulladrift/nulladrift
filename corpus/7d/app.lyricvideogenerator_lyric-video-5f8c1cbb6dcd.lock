        {
          "name": "create_lyric_video",
          "title": "Create lyric video",
          "description": "Turns a song the user attached (MP3/WAV) into a word-synced lyric video and proposes three visual styles. Pass the lyrics if the user gave them; otherwise they are transcribed from the audio. Takes about 10–40 seconds. Creates a new project each call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audio": {
                "description": "The song file the user attached",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "lyrics": {
                "description": "Full song lyrics, one line per sung line, if provided by the user",
                "maxLength": 20000,
                "type": "string"
              },
              "title": {
                "description": "Song title, if known",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["audio"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["audio"],
            "openai/outputTemplate": "ui://lyricvideogenerator/studio-v1.html",
            "openai/toolInvocation/invoked": "Lyric video ready",
            "openai/toolInvocation/invoking": "Syncing lyrics…",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ],
