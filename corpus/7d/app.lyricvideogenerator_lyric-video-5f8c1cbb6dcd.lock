        {
          "name": "export_hd_video",
          "title": "Export HD video",
          "description": "Renders the lyric video in 1080p without a watermark, as 16:9 (landscape) or 9:16 (vertical). Requires the user's LyricVideoGenerator account: it uses 1 credit from their plan (or is free if this song was already unlocked on the website). Credits are refunded if the render fails. Returns an exportId; the widget shows progress and the download link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aspect": {
                "default": "16:9",
                "description": "16:9 for YouTube, 9:16 for TikTok / Reels / Shorts",
                "enum": ["16:9", "9:16"],
                "type": "string"
              },
              "projectId": {
                "description": "projectId returned by create_lyric_video",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
