        {
          "name": "update_style",
          "title": "Update style",
          "description": "Changes the look of the current lyric video style: layout, word animation, colors, font, text size, background, and chorus emphasis. Send only the fields to change. Colors are #RRGGBB. Unreadable color combinations and unknown fonts are corrected or rejected with a reason.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "changes": {
                "additionalProperties": false,
                "properties": {
                  "align": {
                    "enum": ["left", "center"],
                    "type": "string"
                  },
                  "animation": {
                    "description": "Word motion: word-highlight, karaoke (left-to-right fill), line-fade, word-pop, typewriter, word-kinetic (each word pops in on its beat), line-stack (lines push up)",
                    "enum": ["word-highlight", "karaoke", "line-fade", "word-pop", "typewriter", "word-kinetic", "line-stack"],
                    "type": "string"
                  },
                  "background": {
                    "description": "solid = palette.bg; gradient = from→to; cover-blur = blurred song cover (only when the song has a cover)",
                    "properties": {
                      "angle": {
                        "maximum": 360,
                        "minimum": 0,
                        "type": "number"
                      },
                      "from": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "kind": {
                        "enum": ["solid", "gradient", "cover-blur"],
                        "type": "string"
                      },
                      "to": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      }
                    },
                    "required": ["kind"],
                    "type": "object"
                  },
                  "chorus": {
                    "description": "Overrides applied only during choruses",
                    "properties": {
                      "accent": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "animation": {
                        "enum": ["word-highlight", "karaoke", "line-fade", "word-pop", "typewriter", "word-kinetic", "line-stack"],
                        "type": "string"
                      },
                      "scale": {
                        "maximum": 2.5,
                        "minimum": 0.5,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "font": {
                    "description": "Any Google Fonts family name, e.g. \"Bebas Neue\"",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "fontScale": {
                    "description": "Text size multiplier, 1 = template default",
                    "maximum": 2.5,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  "fontWeight": {
                    "anyOf": [
                      {
                        "const": 400,
                        "type": "number"
                      },
                      {
                        "const": 500,
                        "type": "number"
                      },
                      {
                        "const": 600,
                        "type": "number"
                      },
                      {
                        "const": 700,
                        "type": "number"
                      },
                      {
                        "const": 800,
                        "type": "number"
                      },
                      {
                        "const": 900,
                        "type": "number"
                      }
                    ]
                  },
                  "name": {
                    "description": "Rename the style",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "palette": {
                    "properties": {
                      "accent": {
                        "description": "Current word / emphasis color",
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "bg": {
                        "description": "Background color",
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "fg": {
                        "description": "Lyric text color",
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "muted": {
                        "description": "Inactive lines color",
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "showCoverBadge": {
                    "type": "boolean"
                  },
                  "template": {
                    "description": "Layout: focus = one big centered line; scroll = lyrics scroll with the current line highlighted; caption = subtitle-style lower-left; poster = giant left-aligned words filling the frame",
                    "enum": ["focus", "scroll", "caption", "poster"],
                    "type": "string"
                  },
                  "uppercase": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "projectId": {
                "description": "projectId returned by create_lyric_video",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["changes", "projectId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://lyricvideogenerator/studio-v1.html",
            "securitySchemes": [
