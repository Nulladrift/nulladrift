      "serverInfo": {
        "name": "kindoflost-balanced-group-maker",
        "title": "Kind of Lost — Balanced Group Maker",
        "version": "1.0.0",
        "websiteUrl": "https://group-maker.kindoflost.com/mcp-server"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Splits a list of people into balanced groups or teams with a real mixed-integer solver, not a shuffle: each group mirrors the overall mix of every field you give (categories such as gender, role or language are spread proportionally; numbers such as a skill or test score get equal group averages). Priorities decide which field wins a trade-off (1 = most important). People can carry 'together' codes (same code = same group) and 'apart' codes (same code = different groups); those are hard rules and are never broken. Group sizes differ by at most 1 when you give a number of groups; with only a min and/or max size the server tries every group count that fits and picks the best. Typical flow: get_group_example -> edit it to the user's people -> make_groups -> if it returns status 'running', call get_group_result with the job_id. Limits: 300 people, 60 groups, 15 fields. If unsure the tool fits, call check_request first. Send ONE make_groups call at a time, never several in parallel: the solver runs one problem at a time and parallel calls just queue or get 'busy'. It balances; it does not draw at random or lay out seats. Free, no sign-up; web version at https://group-maker.kindoflost.com",
      "tools": [
        {
          "name": "check_request",
          "title": "Check whether a request fits",
          "description": "Describe what the user wants in plain words and get back whether this server can do it, which limits it would hit, and the closest thing it CAN do. Instant, no solve. Use it when unsure the tool fits (seating charts, tournament brackets, round-robin schedules, random draws, repeated rotations, very large lists).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "The user's request in their own words, e.g. 'split 30 students into 6 groups, mixed by reading level, keep two friends apart'.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether a request fits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c0656d1b5aefffff24ffe98a5ec3df7c800ab08b442f9a96a456395eafe6388"
        },
        {
          "name": "get_group_example",
          "title": "Get an example group-maker input",
          "description": "Return the full input JSON of one example, in exactly the shape make_groups accepts: 'classroom' = 30 students, 6 groups, together and apart codes, categorical and numeric fields, blanks; 'teams' = 20 colleagues in 4 teams balanced on a numeric skill and a role. Edit it (people, fields, priorities, number of groups) to match the user's situation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["classroom", "teams"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an example group-maker input"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1aeed47ef76337a72a870e81dd19b89e0d5edbf4b40959d8aef50bb676c1ff34"
        },
        {
          "name": "get_group_result",
          "title": "Get a group-maker result",
          "description": "Fetch the result of a make_groups job that returned status 'running'. Waits up to wait_seconds; call again while status is 'running'. Jobs expire 15 minutes after they finish.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "type": "string"
              },
              "wait_seconds": {
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a group-maker result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f31a3cd87b0eacb3ecfd16a864baaaf0b377e35190c09058c99c6f8ed89c5482"
        },
        {
          "name": "make_groups",
          "title": "Make balanced groups",
          "description": "Split people into balanced groups with a MILP solver and return each group's members, a per-group summary of every field, the overall mix, a balance score per field (100 = perfectly balanced), notes and warnings. Give `groups` (a number of groups; sizes then differ by at most 1) OR `min_size` and/or `max_size` (the server tries every group count that fits and picks the best); with both, `groups` decides and the sizes only validate it. `priorities` maps a field to 1 (most important), 2, 3...; a field left out counts least; equal numbers tie. Solves take up to about 20 s. If the result has status 'running', call get_group_result with its job_id. If it has status 'busy', wait the retry_after_seconds it gives and call again -- one call at a time, never in parallel. If it has status 'error' or 'infeasible', the message says in plain words what to change. Defaults applied (e.g. a field with no priority) are listed in `assumptions`; tell the user about them. Call get_group_example for a complete, realistic input.",
          "inputSchema": {
            "properties": {
              "goal": {
                "description": "One sentence, in the user's own words, of what they are trying to do (e.g. 'six mixed-ability reading groups for my class'). Optional; helps improve the tool. Do not put names in it.",
                "maxLength": 300,
                "type": "string"
              },
              "groups": {
                "description": "Number of groups (max 60).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "max_size": {
                "description": "Largest allowed group size.",
                "minimum": 1,
                "type": "integer"
              },
              "min_size": {
                "description": "Smallest allowed group size.",
                "minimum": 1,
                "type": "integer"
              },
              "people": {
                "description": "The people to group (2-300).",
                "items": {
                  "properties": {
                    "apart": {
                      "description": "Codes. People who share a code are put in DIFFERENT groups (hard rule). e.g. [\"A\"] for two people who must be separated. A code can't contain a comma.",
                      "items": {
                        "type": ["string", "integer"]
                      },
                      "type": "array"
                    },
                    "fields": {
                      "additionalProperties": {
                        "type": ["string", "number", "boolean", "null"]
                      },
                      "description": "What to balance for this person, e.g. {\"gender\": \"female\", \"skill\": 7}. Text values are categories (spread proportionally); a field whose values are all numbers is numeric (equal group averages). Leave a key out when unknown.",
                      "type": "object"
                    },
                    "name": {
                      "description": "Unique name of the person.",
                      "type": "string"
                    },
                    "together": {
                      "description": "Codes. People who share a code are kept in the SAME group (hard rule). e.g. [\"1\"] for siblings or a pair that must stay together. A person may hold several.",
                      "items": {
                        "type": ["string", "integer"]
                      },
                      "type": "array"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 300,
                "minItems": 2,
                "type": "array"
              },
              "priorities": {
                "additionalProperties": {
                  "minimum": 1,
                  "type": "integer"
                },
                "description": "Field name -> priority number (1 = most important). Each step is worth 4x the next; a field with no priority counts least.",
                "type": "object"
              },
              "wait_seconds": {
                "description": "How long to wait for the solve inside this call (default 25).",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make balanced groups"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
