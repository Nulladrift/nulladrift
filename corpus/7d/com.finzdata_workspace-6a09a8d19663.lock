{
  "lockfileVersion": 2,
  "subjects": {
    "com.finzdata/workspace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://workspace.finzdata.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "finzdata-workspace",
        "version": "1.3.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FinzData Workspace: a persistent workspace with FinzData built in. Pull data with finzdata_get, keep files in /workspace, and run JavaScript next to your data with workspace_run. Start with strategy_list and strategy_run: every listed FinzData strategy re-runs free on its full history and lands in /workspace/strategies/<slug>/ for analysis.",
      "tools": [
        {
          "name": "finzdata_get",
          "title": "Get FinzData API data",
          "description": "Read-only GET request to the FinzData REST API (docs: https://finzdata.com/docs) with your key (for example /v1/prices/daily, /v1/futures/daily, /v1/gex/daily, /v1/cot, /v1/pulse/{name}, /v1/model/latest). Optionally save the result into your workspace with save_to.",
          "inputSchema": {
            "properties": {
              "params": {
                "type": "object"
              },
              "path": {
                "type": "string"
              },
              "save_to": {
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get FinzData API data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2bc0df0ae75f37f1f09de14971eaf37650bdb098df0bd6b47b62ff363581b34b"
        },
        {
          "name": "strategy_list",
          "title": "List FinzData strategies",
          "description": "List public FinzData Hub strategies (momentum, trend, mean reversion, value, factor, AI Tournament). sort: robust (deflated Sharpe), forward, new, forks. Every listed strategy is free to re-run on its full history with strategy_run.",
          "inputSchema": {
            "properties": {
              "family": {
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "sort": {
                "enum": ["robust", "forward", "new", "forks"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List FinzData strategies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd0bd3d066875907881250b338e79f9575b5d4c08febd8d4884b2892a900b942"
        },
        {
          "name": "strategy_run",
          "title": "Re-run a FinzData strategy",
          "description": "Re-run a listed FinzData strategy exactly as published, on its full point-in-time history through end (default today), on the FinzData servers. Free on every plan. Saves spec.json and result.json to /workspace/strategies/<slug>/ so you can analyse them with workspace_run. Changing the strategy or testing your own idea over full history needs a FinzData purchase; the free window still applies there.",
          "inputSchema": {
            "properties": {
              "end": {
                "type": "string"
              },
              "save": {
                "description": "Default true.",
                "type": "boolean"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Re-run a FinzData strategy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:79bf7d9bacd13cc192eaca96dc2d574182f7865f02e0549eb642a3a2ade30272"
        },
        {
          "name": "workspace_delete",
          "title": "Delete a workspace file",
          "description": "Delete a file or directory in your FinzData Workspace (a per-key file store on Cloudflare; docs: https://finzdata.com/workspace).",
          "inputSchema": {
            "properties": {
              "path": {
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete a workspace file"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cd744febaaef9288ffd783518c53436069f30074ab49ea6f63af48688802638b"
        },
        {
          "name": "workspace_list",
          "title": "List workspace files",
          "description": "List a directory in your FinzData Workspace (default /workspace; docs: https://finzdata.com/workspace).",
          "inputSchema": {
            "properties": {
              "path": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List workspace files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e89ce9f7622e1eac62753773ecf21710f3cbf0930677cc77999bb1aee82ea31c"
        },
        {
          "name": "workspace_read",
          "title": "Read a workspace file",
          "description": "Read a text file from your FinzData Workspace (docs: https://finzdata.com/workspace).",
          "inputSchema": {
            "properties": {
              "path": {
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a workspace file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57f1bc219c312716cd5b1ac2f2b93b37328fe0057e0769fa076ddef557494e96"
        },
        {
          "name": "workspace_run",
          "title": "Run code in the workspace",
          "description": "Run a JavaScript (ES module) program inside your workspace. It must `export default async function (input) { ... }` and return JSON. Use `import { get } from \"codemode:finzdata\"` for data and `import fs from \"node:fs/promises\"` for files under /workspace. No other network access.",
          "inputSchema": {
            "properties": {
              "code": {
                "type": "string"
              },
              "input": {
                "description": "JSON value passed to your default export.",
                "type": "object"
              },
              "timeout_ms": {
                "type": "number"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Run code in the workspace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9c5180b6336d67126496b010524ea4c8edbb0c0dc8978ba091508c1c564c2405"
        },
        {
          "name": "workspace_write",
          "title": "Write a workspace file",
          "description": "Write a text file in your FinzData Workspace (paths live under /workspace and persist between sessions; docs: https://finzdata.com/workspace).",
          "inputSchema": {
            "properties": {
              "content": {
                "type": "string"
              },
              "path": {
                "type": "string"
              }
            },
            "required": ["content", "path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Write a workspace file"
          },
          "behavior": {
            "destructive": false,
