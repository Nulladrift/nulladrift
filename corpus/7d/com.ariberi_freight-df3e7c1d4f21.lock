{
  "lockfileVersion": 2,
  "subjects": {
    "com.ariberi/freight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ariberi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ariberi",
        "title": "Ariberi — free freight exchange",
        "version": "1.0.0",
        "websiteUrl": "https://ariberi.com/app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ariberi is a free freight exchange (load board) for Kazakhstan, Uzbekistan, Kyrgyzstan, Tajikistan, China, Russia and the Caucasus. Loads are collected from logistics chats (Telegram, WhatsApp). Use search_loads to find active truck loads by route and body type, list_routes to see which routes have loads. City names may be given in Russian or English. Contacts of the shipper are not returned: give the user the load's url — the contact opens on ariberi.com after signing in with a phone number. Free, no commission.",
      "tools": [
        {
          "name": "list_routes",
          "title": "Routes with loads",
          "description": "List routes that currently have active loads on Ariberi, busiest first, with the number of loads and a url of the route page. Optionally filter by from_city or to_city.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_city": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "to_city": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Routes with loads"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4db9c02efc40393f6c61c418f52ad3783e34b9d971a26020fde52b67041b0ebe"
        },
        {
          "name": "search_loads",
          "title": "Search truck loads",
          "description": "Search active freight loads (cargo looking for a truck) on Ariberi. Give from_city, to_city or both. Returns route, cargo, body type, weight, price if stated, road distance, loading date, posting time and a url of the load on ariberi.com (the shipper's phone opens there after sign-in). Newest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Truck body type: tent (curtainsider), reefer, tandem (drawbar combination), flatbed, lowbed (low-loader), car carrier. Russian names also accepted.",
                "type": "string"
              },
              "from_city": {
                "description": "Loading city, e.g. Khorgos / Хоргос, Almaty, Alashankou",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "to_city": {
                "description": "Unloading city, e.g. Tashkent / Ташкент, Moscow",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search truck loads"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1cd34b764e6f2156e38d728d3639b3c167a02dea0bfe17b32b10384afae116f0"
        }
      ],
      "digest": "sha256:6b1b0b84b1874aad83d9b7fdbd6298da7f5c76b9e85167a4d81ef22be9401ab5"
    }
  }
