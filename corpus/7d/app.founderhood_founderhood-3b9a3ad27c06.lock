{
  "lockfileVersion": 2,
  "subjects": {
    "app.founderhood/founderhood": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://founderhood.app/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Founderhood",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Founderhood is a directory of online businesses and indie founders by location. search_founders and get_founder return approved listings only, including open_to_cofounder and cofounder_note. heard_from is admin-only and is never returned. Use submit_listing only with the founder's consent.",
      "tools": [
        {
          "name": "get_founder",
          "title": "Get founder listing",
          "description": "Fetch one approved listing by its URL slug, including open_to_cofounder and cofounder_note. heard_from is not returned.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Business slug from the listing URL",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03794330bd7c654306531cbce2ad20d0d9acd36b73d5473363da0b1508dad452"
        },
        {
          "name": "list_cities",
          "title": "List cities",
          "description": "List cities with approved founder listings and counts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f80889ab179ddff9df3e81f3fb7f937f9b1dd0564cbd809a6658f5bbfca9df3"
        },
        {
          "name": "search_founders",
          "title": "Search founders",
          "description": "Search approved Founderhood listings by city, country, category, keyword, or cofounder opt-in. Each result includes open_to_cofounder and cofounder_note. heard_from is not returned.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["saas", "ecommerce", "agency", "marketplace", "dev-tools", "ai", "content", "education", "fintech", "mobile-apps", "community", "other"],
                "type": "string"
              },
              "city": {
                "description": "Full city name, case-insensitive",
                "type": "string"
              },
              "country": {
                "description": "Full country name, case-insensitive",
                "type": "string"
              },
              "open_to_cofounder": {
                "description": "When set, only approved listings with this cofounder opt-in value",
                "type": "boolean"
              },
              "query": {
                "description": "Keyword search across name, description, location",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea800330f8f351ab01e133eec2bf148a24d96124c7617235c4d57524d6a541b3"
        },
        {
          "name": "submit_listing",
          "title": "Submit listing",
          "description": "Submit a new business for human review. Same validation and rate limits as POST /api/submit. Accepts open_to_cofounder, cofounder_note, and optional heard_from (stored as mcp when omitted). heard_from is stored for admin review only. Requires founder consent. A website host that is already listed or under review is rejected; the error includes slug only when that listing is approved. Only submit businesses that meet the listing criteria: A business you run with a real website: a product, SaaS, app, service or local business people can use or buy today, built to last. One-trick trend generators (one photo into this week's viral clip) are not listed; A real website with substance: what it does, who is behind it and how to reach you. No placeholder or \"coming soon\" pages; One listing per business, no duplicates. Running several projects is fine: submit each one that has its own site; Its own product, not a borrowed name: building on someone else's AI model is fine, but a site named after the model (Sora, Nano Banana, Seedance…) is not listed; Plays by the rules of the platforms it builds on: nothing that breaks the terms of X, Google, Reddit or others (scraping, reply bots, fake engagement); Submitted to be found, not for a backlink: no SEO-only content sites, other directories, link-building services or mass directory submissions; No MLM, get-rich-quick schemes, trading bots or signals, gambling, or adult content; Accurate city and country for where the founder is based.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_name": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "category": {
                "enum": ["saas", "ecommerce", "agency", "marketplace", "dev-tools", "ai", "content", "education", "fintech", "mobile-apps", "community", "other"],
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "cofounder_note": {
                "description": "Short note for cofounder search (if open)",
                "maxLength": 300,
                "type": "string"
              },
              "country": {
                "minLength": 2,
                "type": "string"
              },
              "description": {
                "maxLength": 500,
                "minLength": 20,
                "type": "string"
              },
              "email": {
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "founder_name": {
                "maxLength": 100,
                "type": "string"
              },
              "heard_from": {
                "description": "Optional. How the founder heard about Founderhood. If omitted, stored as \"mcp\". Preferred values: x, directory_list:<short text> (bare directory_list is still accepted), google, ai_assistant, friend, reddit, newsletter, or other:<short text>. Admin-only; never returned by search_founders or get_founder.",
                "maxLength": 200,
                "type": "string"
              },
              "linkedin": {
                "format": "uri",
                "type": "string"
              },
              "open_to_cofounder": {
                "description": "Mark founder as open to finding a cofounder",
                "type": "boolean"
              },
              "twitter": {
                "type": "string"
              },
              "website": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["business_name", "category", "country", "description", "website"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e600b4468bb6a6e7a72d1396881a6784ce8af4c39f59fa114451ea621b381305"
        }
      ],
      "digest": "sha256:ef2451850982b6e5ad99748f619a279e1b292f23cc01bd29f283ba0cd0a97a61"
    }
  }
}
