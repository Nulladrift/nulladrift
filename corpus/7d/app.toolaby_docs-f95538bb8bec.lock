{
  "lockfileVersion": 2,
  "subjects": {
    "app.toolaby/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://toolaby.app/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "toolaby",
        "title": "Toolaby docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Toolaby's documentation: accounts, licences, subscriptions, trials and the paywall for browser extensions that sell. One tool searches it; the other reads a page, or lists every page with what it covers.",
      "tools": [
        {
          "name": "toolaby_docs",
          "title": "Read the docs",
          "description": "Toolaby's docs as Markdown. Without a page: the index, every page with what it covers. With a page (like \"gating\", \"pricing\", \"reference/client\"): that page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c47e84e49d2338cdd34b36aaf6314932d4cb81ee019cc5db008842872e191913"
        },
        {
          "name": "toolaby_search_docs",
          "title": "Search the docs",
          "description": "Searches Toolaby's docs: the pages and passages that match, each page with its name and its Markdown address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c34bdd0b94789f842b096462042d9bbd6d74fd0875682f642eaa445878fa4c5"
        }
      ],
      "digest": "sha256:d756fed450ad4ab92a3a1b4363112c991a928aa651aacf7061ec33e1ba53db7b"
    }
  }
}
