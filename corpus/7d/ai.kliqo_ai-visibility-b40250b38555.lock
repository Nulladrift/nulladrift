        {
          "name": "generate_ai_robots_rules",
          "title": "Write robots.txt rules for AI crawlers",
          "description": "Write robots.txt groups for every AI crawler from a simple policy: allow or block search crawlers, crawlers that fetch pages when a user asks, and training crawlers, keeping private paths private. Use this when someone wants to allow AI search but block AI training (or any other mix), or asks for an AI-ready robots.txt. Returns the text to paste plus notes on crawlers that may ignore robots.txt.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allow_search": {
                "default": true,
                "description": "Allow crawlers that build AI search indexes (OAI-SearchBot, Claude-SearchBot, PerplexityBot…)",
                "type": "boolean"
              },
              "allow_training": {
                "default": true,
                "description": "Allow crawlers that collect pages for model training (GPTBot, ClaudeBot, CCBot…)",
                "type": "boolean"
              },
              "allow_user_requests": {
                "default": true,
                "description": "Allow crawlers that fetch a page because a user asked (ChatGPT-User, Claude-User, Perplexity-User…)",
                "type": "boolean"
              },
              "private_paths": {
                "default": [],
                "description": "Paths no crawler should read, for example /admin or /checkout",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "sitemap_url": {
                "description": "The sitemap URL to list",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              }
