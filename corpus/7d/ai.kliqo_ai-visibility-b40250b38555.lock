                "description": "The brand's website, for example acme.com",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "question": {
                "description": "The buyer question, in the buyer's words; don't name the brand in it",
                "maxLength": 300,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["domain", "question"],
            "type": "object"
          },
          "outputSchema": {
