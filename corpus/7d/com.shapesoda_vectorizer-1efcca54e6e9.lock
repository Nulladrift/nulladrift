        {
          "name": "revectorize",
          "title": "Re-vectorize with other settings",
          "description": "Re-vectorizes a stored result (result_id and token from vectorize) with other settings, free for 24 hours after the first vectorization. Used by the Shapesoda window.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "colors": {
                "anyOf": [
                  {
                    "enum": ["auto", "unlimited"],
                    "type": "string"
                  },
                  {
                    "maximum": 32,
                    "minimum": 2,
                    "type": "integer"
                  }
                ],
                "description": "Number of colors: 'auto', 'unlimited', or an integer 2–32 (max_colors goes up to 256). Default auto."
              },
              "corners": {
                "description": "Keep corners sharp or round them.",
                "enum": ["sharp", "smooth"],
                "type": "string"
              },
              "image_type": {
                "description": "Kind of image: artwork with smooth (anti-aliased) edges, artwork with hard pixel edges, or photo. Default auto.",
                "enum": ["auto", "artwork", "artwork_sharp", "photo"],
                "type": "string"
              },
              "min_area": {
                "description": "Smallest shape kept, in px²; smaller specks are dropped. Overrides the preset.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "palette": {
                "anyOf": [
                  {
                    "items": {
                      "pattern": "^#[0-9a-fA-F]{6}$",
                      "type": "string"
                    },
                    "maxItems": 256,
                    "minItems": 2,
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Fixed colors #rrggbb (2–256), as a list or a comma-separated string. Not combined with colors or max_colors."
              },
              "quality": {
                "description": "Input quality: low for blurry/noisy/JPEG-heavy images. Default auto.",
                "enum": ["auto", "high", "medium", "low"],
                "type": "string"
              },
              "result_id": {
                "description": "result_id from vectorize or revectorize.",
                "type": "string"
              },
              "smoothness": {
                "description": "Contour smoothing 1–10 (higher: smoother, fewer nodes).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "token": {
                "description": "Result token (the token parameter of the result links).",
                "type": "string"
              },
              "transparency": {
                "description": "Transparent areas: keep (stay transparent), white, or a background color #rrggbb.",
                "pattern": "^(keep|white|#[0-9a-fA-F]{6})$",
                "type": "string"
              }
            },
            "required": ["result_id", "token"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits_charged": {
                "type": "integer"
              },
              "credits_remaining": {
                "type": "integer"
              },
              "download_url": {
                "description": "Link to the first requested format.",
                "type": "string"
              },
