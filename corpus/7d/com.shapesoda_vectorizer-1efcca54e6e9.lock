        {
          "name": "vectorize",
          "title": "Vectorize image",
          "description": "Use this when the user wants to convert a raster image (logo, icon, illustration, scan, screenshot; PNG, JPEG, WebP, BMP, GIF, TIFF) into a vector: SVG, PDF, EPS, DXF or a re-rendered PNG. Pass the image in exactly one way: image (a file attached to the chat message, ChatGPT), upload_id (from create_upload) or image_base64 (≤2 MB, only exact file bytes you already have as text). If none of these is available, for example an image attached in Claude.ai, call open_editor instead. Returns a download link per format, valid 24 hours (or retention_days), and the SVG inline when small. Uses 1 credit for all formats; mode=test is free and watermarked; mode=preview is a free PNG up to 1 MP whose link buys the vectors later (format=svg, 1 credit). Do not use for generating new images, editing photos or upscaling.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adobe_compat": {
                "description": "true: SVG friendly to Adobe Illustrator (size always set, stroke widths in drawing coordinates).",
                "type": "boolean"
              },
              "align_x": {
                "description": "Horizontal placement on the sheet, 0 left … 1 right (default 0.5). Needs width and height; not with aspect=stretch.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "align_y": {
                "description": "Vertical placement on the sheet, 0 top … 1 bottom (default 0.5). Needs width and height; not with aspect=stretch.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "aspect": {
                "description": "With both width and height: fit (default, whole drawing inside), fill (covers the sheet, excess cropped), stretch (exact size, distorted).",
                "enum": ["fit", "fill", "stretch"],
                "type": "string"
              },
              "colors": {
                "anyOf": [
                  {
                    "enum": ["auto", "unlimited"],
                    "type": "string"
                  },
                  {
                    "maximum": 32,
                    "minimum": 2,
                    "type": "integer"
                  }
                ],
                "description": "Number of colors: 'auto', 'unlimited', or an integer 2–32 (max_colors goes up to 256). Default auto."
              },
              "corners": {
                "description": "Keep corners sharp or round them.",
                "enum": ["sharp", "smooth"],
                "type": "string"
              },
              "curve_tolerance": {
                "description": "Curve fitting tolerance in source pixels (default ≈0.5): lower keeps more nodes. Also sets smoothness unless given.",
                "maximum": 10,
                "minimum": 0.01,
                "type": "number"
              },
              "curves": {
                "description": "all: curves and lines; lines: straight segments only; lines_arcs: DXF lines and arcs, other formats as lines.",
                "enum": ["all", "lines", "lines_arcs"],
                "type": "string"
              },
              "denoise": {
                "description": "Noise reduction before tracing: 0 off … 3 strongest.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "detail": {
                "description": "Output detail for photos. Default auto.",
                "enum": ["auto", "low", "medium", "high"],
                "type": "string"
              },
              "dpi": {
                "description": "Pixels per inch of PNG output; needs a size in pt, mm, cm or in. Default 300.",
                "maximum": 2400,
                "minimum": 1,
                "type": "integer"
              },
              "draw": {
                "description": "fill: filled shapes; stroke: outline of every shape; stroke_edges: only the borders between shapes, each once (no double cuts). Default from the preset.",
                "enum": ["fill", "stroke", "stroke_edges"],
                "type": "string"
              },
              "dxf_curves": {
                "description": "DXF curves as lines (polylines, default), arcs or splines. curves=lines/lines_arcs wins.",
                "enum": ["lines", "arcs", "splines"],
                "type": "string"
              },
              "format": {
                "description": "Output formats; several formats cost 1 credit together. Default: the preset's format (svg for web).",
                "items": {
                  "enum": ["svg", "pdf", "eps", "dxf", "png"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "gap_filler": {
                "description": "on: an underlay in the shape colors hides light gaps between shapes. Needs draw=fill. Default off.",
                "enum": ["on", "off"],
                "type": "string"
              },
              "gap_filler_width": {
                "description": "Gap filler width in source pixels (default 1). Needs gap_filler=on.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "group_by": {
                "description": "Groups in the output: color (one per color) or layer (by nesting depth). SVG <g>, PDF layers, EPS blocks, DXF layers. Default: by color only for layers=cutouts_grouped (DXF always by color).",
                "enum": ["none", "color", "layer"],
                "type": "string"
              },
              "height": {
                "description": "Physical output height in unit (width follows the aspect ratio unless width is set too).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "image": {
                "description": "Image file attached to the user's message in the chat (ChatGPT).",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "image_base64": {
                "description": "Exact PNG/JPEG/WebP/BMP/GIF/TIFF file bytes in base64 (≤2 MB), only when you already have them as text (e.g. from reading the file in a terminal). Never transcribe an image you only see in the conversation; call open_editor instead. Use create_upload for larger files.",
                "type": "string"
              },
              "image_type": {
                "description": "Kind of image: artwork with smooth (anti-aliased) edges, artwork with hard pixel edges, or photo. Default auto.",
                "enum": ["auto", "artwork", "artwork_sharp", "photo"],
                "type": "string"
              },
              "layers": {
                "description": "Shapes stacked on top of each other, cut out of each other, or cut out and grouped by color. Default from the preset.",
                "enum": ["stacked", "cutouts", "cutouts_grouped"],
                "type": "string"
              },
              "max_colors": {
                "description": "Maximum number of colors (2–256). Not combined with colors or palette.",
                "maximum": 256,
                "minimum": 2,
                "type": "integer"
              },
              "max_pixels": {
                "description": "Downscale the input to at most this many pixels before tracing (faster, fewer nodes).",
                "maximum": 4200000,
                "minimum": 10000,
                "type": "integer"
              },
              "min_area": {
                "description": "Smallest shape kept, in px²; smaller specks are dropped. Overrides the preset.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "description": "test: free, watermarked result for building an integration. preview: free PNG up to 1 MP without watermark, no vectors; fetch its link with format=svg to buy the vectors for 1 credit. Neither is available for vectorize_url. Default live.",
                "enum": ["live", "test", "preview"],
                "type": "string"
              },
              "palette": {
                "anyOf": [
                  {
                    "items": {
                      "pattern": "^#[0-9a-fA-F]{6}$",
                      "type": "string"
                    },
                    "maxItems": 256,
                    "minItems": 2,
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Fixed colors #rrggbb (2–256), as a list or a comma-separated string. Not combined with colors or max_colors."
              },
              "palette_tolerance": {
                "description": "With palette: how far (CIE76 ΔE) an image color may be from a palette color to snap to it; farther colors keep their own value.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "png_antialias": {
                "description": "Anti-aliasing in PNG output. Default on.",
                "enum": ["on", "off"],
                "type": "string"
              },
              "preset": {
                "description": "Settings for the job: web (default), print (PDF, shapes cut out), cut (vinyl/stickers, 8 colors), laser (2-color outlines), embroidery (12 colors, no tiny shapes).",
                "enum": ["web", "print", "cut", "laser", "embroidery"],
                "type": "string"
              },
              "quality": {
                "description": "Input quality: low for blurry/noisy/JPEG-heavy images. Default auto.",
                "enum": ["auto", "high", "medium", "low"],
                "type": "string"
              },
              "retention_days": {
                "description": "Keep the result downloadable for this many days (default 24 hours). Live mode only.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "scale": {
                "description": "Output size as a multiple of the source size. Not with width/height.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "smoothness": {
                "description": "Contour smoothing 1–10 (higher: smoother, fewer nodes).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "stroke_color": {
                "description": "Stroke color #rrggbb instead of the shape color; needs draw=stroke or stroke_edges.",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "stroke_scaling": {
                "description": "fixed (default): width stays in output units when resized; scale: width in source pixels scales with the drawing.",
                "enum": ["fixed", "scale"],
                "type": "string"
              },
              "stroke_width": {
                "description": "Stroke width; needs draw=stroke or stroke_edges. Output units, or source pixels with stroke_scaling=scale. Default: hairline.",
                "maximum": 100,
                "minimum": 0.01,
                "type": "number"
              },
              "svg_fixed_size": {
                "description": "true (default): width/height on the root <svg>; false: only a viewBox (responsive).",
                "type": "boolean"
              },
              "svg_version": {
                "description": "SVG flavor: 1.1 (default), 1.0, or tiny1.2 (no opacity or gradient transforms).",
                "enum": ["1.1", "1.0", "tiny1.2"],
                "type": "string"
              },
              "transparency": {
                "description": "Transparent areas: keep (stay transparent), white, or a background color #rrggbb.",
                "pattern": "^(keep|white|#[0-9a-fA-F]{6})$",
                "type": "string"
              },
              "unit": {
                "description": "Unit for width/height: px (default), pt, mm, cm, in.",
                "enum": ["px", "pt", "mm", "cm", "in"],
                "type": "string"
              },
              "upload_id": {
                "description": "ID returned by create_upload after the file was uploaded.",
                "type": "string"
              },
              "width": {
                "description": "Physical output width in unit. With width only, the height follows the aspect ratio; with height too, a sheet of that size (see aspect). Up to 10 m.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credits_charged": {
                "type": "integer"
              },
              "credits_remaining": {
                "type": "integer"
              },
              "download_url": {
