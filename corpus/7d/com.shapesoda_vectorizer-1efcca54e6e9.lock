                "type": "string"
              },
              "files": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Download link per format.",
                "type": "object"
              },
              "free_remaining_today": {
                "description": "Free MCP vectorizations left this calendar month, UTC (used before credits). The name is kept for compatibility.",
                "type": "integer"
              },
              "height": {
                "type": "integer"
              },
              "mode": {
                "type": "string"
              },
              "result_id": {
                "type": "string"
              },
              "svg_bytes": {
                "type": "integer"
              },
              "width": {
                "type": "integer"
              }
            },
