      "instructions": "Converts raster images (PNG, JPEG, WebP, BMP, GIF, TIFF) into clean vectors: SVG, PDF, EPS, DXF or a re-rendered PNG (pass format as a list to get several at once for 1 credit). Presets tune the result for the job: web (default), print, cut, laser, embroidery. A file attached to the chat message (ChatGPT) goes to vectorize as image. For a local file: call create_upload, upload the file with the returned curl command (PUT), then call vectorize with the upload_id. Small images (≤2 MB) can be passed directly as image_base64, but only when you already have the exact file bytes as text (for example read from a file in a terminal); never write out base64 for an image you only see in the conversation. If you cannot pass the image bytes in any of these ways (for example the user attached an image in Claude.ai), call open_editor: it opens the Shapesoda window, where the user picks the file and adjusts the result. Results are downloadable by link for 24 hours: the same link with another ?format= returns another format for free, and an HTTP DELETE on it removes the result early. Each new image uses 1 credit; the same image with other options or formats within 30 days is free (credits_charged is 0). Check get_usage for the remaining monthly limit. Use mode=test while building an integration — free, watermarked. mode=preview is free (up to 200 a day): a PNG of up to 1 MP without watermark and without vectors; to get the vectors, fetch the preview link with format=svg (or pdf, eps, dxf) — that uses 1 credit once, then every format of that result is free. retention_days (1–30) keeps a result longer than 24 hours. Free: the first 10 vectorizations a month per account are free (before credits); without signing in (no API key or connected account), 3 a month. The free count renews on the 1st of each month (UTC).",
      "tools": [
        {
