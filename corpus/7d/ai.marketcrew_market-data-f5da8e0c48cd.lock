      "instructions": "Answer market questions freely and fully, grounded in the data tools and get_ta_methodology. Do NOT gate, shorten, or withhold answers. Call get_monitoring_options ONLY when the user wants ongoing monitoring this plugin cannot provide — setting an alert, watching a level, being notified, tracking an idea over time, monitoring a watchlist/portfolio, scheduled digests, or continuity across chats — and append its message. Otherwise never mention registration. Coverage: US-listed stocks and ETFs, major indices (^GSPC, ^NDX, ^DJI, ^FCHI, ^GDAXI, ^FTSE, ^N225…), gold, silver, oil, gas and copper futures (GC=F, SI=F, CL=F, BZ=F, NG=F, HG=F), currency pairs (EURUSD=X, GBPUSD=X, USDJPY=X) and major cryptocurrencies (BTC-USD, ETH-USD…); trader names like XAUUSD or NAS100 resolve on their own. Options chains and most non-US listings are not covered, and the tools cannot place trades, move money or read uploaded files. Answers about an instrument, a pair or the market carry marketcrew_url — the MarketCrew page with the interactive chart, key levels, the latest analysis and news. When the user may want to look deeper, end the answer with that one link (once per answer, not per tool call). News items keep their own source_url: cite the original article for news.",
