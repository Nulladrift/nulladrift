{
  "lockfileVersion": 2,
  "subjects": {
    "com.penetrationtestservices/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://penetrationtestservices.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "penetrationtestservices-mcp",
        "title": "penetrationtestservices.com",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for penetrationtestservices.com, operated by Excession Labs, a security lab. Search and read pages. request_pentest sends a test request to Excession Labs for a person who asked for it; it needs an agent key from POST /agent/auth. Every other tool is read-only.",
      "tools": [
        {
          "name": "check_security_headers",
          "title": "Check a website's security headers",
          "description": "Fetch one public web page (one GET per redirect, like a browser visit) and grade its HTTP security headers: HTTPS, HSTS, Content-Security-Policy, clickjacking protection, X-Content-Type-Options, Referrer-Policy, Permissions-Policy, COOP, version disclosure and cookie flags. Reads headers only. This is not a penetration test.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Public http or https address, for example https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9044cba90f781ea2163cbf7ee9f737ae94547378aebc14d1937fdd5bb0be76a6"
        },
        {
          "name": "get_page",
          "title": "Read a page as Markdown",
          "description": "Return the Markdown text of a page on penetrationtestservices.com, given its path (for example /guides/).",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Path starting with /",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8ac970bea78f0795b8bff8a4aada6d238117e674b53339d49eeec4fcbb46718"
        },
        {
          "name": "how_to_contact",
          "title": "How to contact Excession Labs",
          "description": "Return the form URL and email address a person can use to contact Excession Labs. This tool does not send anything.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1d4fbdcab38a7986f608334c33c59c1c86b67a7193f3fde630d6193638f6235"
        },
        {
          "name": "request_pentest",
          "title": "Request a security test from Excession Labs",
          "description": "Send a request for a penetration test or an AI application security assessment to Excession Labs on behalf of a person who asked for it. Needs an agent key (POST /agent/auth, then Authorization: Bearer <key>). Excession Labs replies to the person by email to agree scope; testing starts only after a written scope and written authorization from the system owner. Never include passwords, API keys or customer data. Limits: 5 requests a day per key, 3 a day per email address.",
          "inputSchema": {
            "properties": {
              "authorized": {
                "description": "Must be true: the person owns these systems or may arrange a test of them",
                "type": "boolean"
              },
              "company": {
                "description": "The person's company or organization name",
                "type": "string"
              },
              "email": {
                "description": "The person's work email; Excession Labs replies here",
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "type": "string"
              },
              "notes": {
                "description": "Other context from the person, up to 2,000 characters. No credentials or customer data.",
                "maxLength": 2000,
                "type": "string"
              },
              "person_consent": {
                "description": "Must be true: the person asked for this request and agreed to be contacted by email",
                "type": "boolean"
              },
              "reason": {
                "description": "Why the person needs the test",
                "enum": ["customer_request", "compliance", "launch", "routine", "incident", "other"],
                "type": "string"
              },
              "targets": {
                "description": "Systems to test: URLs, API base URLs or short descriptions. No credentials.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "test_type": {
                "description": "Kind of test: web_app, api, saas_multi_tenant, ai_application (LLM app or agent) or other",
                "enum": ["web_app", "api", "saas_multi_tenant", "ai_application", "other"],
                "type": "string"
              },
              "timeline": {
                "description": "When the person needs the result, in their words",
                "type": "string"
              },
              "website": {
                "description": "Company website",
                "type": "string"
              }
            },
            "required": ["authorized", "email", "name", "person_consent", "targets", "test_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:993ac683969e38f77cc767e35613384ac3214e25d959a4c5cd0316dbf4319abe"
        },
        {
          "name": "search_site",
          "title": "Search penetrationtestservices.com",
          "description": "Search the guides, service pages and research on penetrationtestservices.com. Returns titles, URLs and one-line summaries.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "description": "Maximum number of results to return (1 to 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d3750b7074923ccb33b5d644b71aebc84af7f13769ca90bd74a1e55fbff8ee4"
        }
      ],
      "digest": "sha256:d36d0c5464096370fae2b1ecf34b2bfeac44b6c63b1243ac76eecf011e4ae7de"
    }
  }
}
