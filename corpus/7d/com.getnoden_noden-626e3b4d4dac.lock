      "tools": [
        {
          "name": "check_order_status",
          "description": "Poll an order's status: pending, completed or failed. Once completed, the output and verification result are included. If failed, the result is not returned and a retry_token (one free call, 24 hours) is included.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "order_id": {
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:82e862e3e97964036b1a6954b46675568c3942f9d82604e49c5bb6dd0a82cc86"
        },
        {
          "name": "create_operator",
          "description": "Self-register for an operator API key with no human required — no signup form, no login. Use this if you don't already have an api_key from a human operator. Returns a key with a small, fixed daily spend cap (default 1000 sats, max 5000 sats) that cannot be raised later. This key has no free call — purchases are paid over Lightning. The free first call belongs to a verified human account (email confirmed). For a higher cap and ongoing human review/monitoring, a human should sign up their own account at https://shop.getnoden.com/signup instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "spend_cap_sats": {
                "description": "Requested daily spend cap in sats. Defaults to 1000, capped at 5000.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:eeb388984066045f6e0a3168324f33c248d587395ee2605e393123cb43233ae6"
        },
        {
          "name": "get_skill",
          "description": "Get full detail on one skill listing, including the exact input JSON Schema needed to purchase it. The output schema is reduced to field names — the exact output format is delivered after purchase.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "skill_id": {
                "type": "string"
              }
            },
            "required": ["skill_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e988bda8597650c9554414aebb07eaef249ccc1ec156a286d7aac2435122487e"
        },
        {
          "name": "purchase_skill",
          "description": "Purchase a skill. Validates input against the listing's schema and the caller's spend cap/allowlist, then, unless the account has enough prepaid credits (see below), returns a Lightning invoice for the exact price of one call; once the invoice is paid the skill runs and the result is checked against the listing's output schema. If the account has enough prepaid credits for the call, they are used automatically: the response has paid_with_credits true, credits_charged and credits_remaining, and no invoice — just poll check_order_status. If the check fails the result is not returned and no sats are sent back: the order status gives a single-use retry_token, and passing it here (same skill, same api_key, within 24 hours) runs one free call. A verified human account gets one free call on a listing priced at or below the trial cap: the response then has free_trial true and no invoice — just poll check_order_status. Every other purchase returns a Lightning invoice. Free skills (price_sats 0) need no payment: the response has free_skill true and no invoice, just poll check_order_status. 'input' (the skill's required input, matching its input schema) is required, and so is a key: pass 'api_key' (your operator API key), or set it once as an 'Authorization: Bearer <key>' header on this MCP connection. Spend-cap enforcement needs to know which operator is calling. If 'agent_wallet_connection' is given (a nostr+walletconnect:// URI), Noden also asks that wallet to pay the invoice directly via NWC — this is best-effort and fire-and-forget: check wallet_payment_requested/wallet_payment_error in the response, and pay the returned invoice yourself if it's not true. The skill runs only once Noden itself detects the payment on the invoice, never because the wallet-push call succeeded.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_wallet_connection": {
                "description": "Optional nostr+walletconnect:// URI — if given, Noden asks this wallet to pay the invoice",
                "type": "string"
              },
              "api_key": {
                "description": "Your operator API key. Optional if the connection sends it as an Authorization: Bearer header",
                "type": "string"
              },
              "input": {
                "additionalProperties": {},
                "description": "Input matching the skill's input JSON Schema",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "retry_token": {
                "description": "A retry_token from a failed order of this same skill: runs one free call instead of returning an invoice",
                "type": "string"
              },
              "skill_id": {
                "type": "string"
              }
            },
            "required": ["input", "skill_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f5a061b6fd8a4a9e01865ba59d961108a2501bda43c908dfe0067b30dfa184c9"
        },
        {
          "name": "search_skills",
          "description": "Search the Noden skill catalog by capability. Hybrid keyword/category match (semantic search when configured). 'tags' is folded into the same keyword search as 'query' — the catalog does not yet have a dedicated tags field.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "type": "string"
              },
              "max_price_sats": {
                "type": "number"
              },
              "query": {
                "description": "Free-text capability description, e.g. 'reviews contracts'",
                "type": "string"
              },
              "tags": {
                "description": "Extra keywords, matched the same way as query",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8fa1b2df26129294d459e0f2602750ab1f25ca30de3b5ca0695c5b8762b311cf"
        },
        {
          "name": "submit_skill",
          "description": "Submit a new skill listing for sale. NOT YET AVAILABLE — the seller-listing flow isn't live on Noden yet. Calling this returns a structured 'not available' response and writes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "description": {
                "type": "string"
              },
              "input_schema": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "output_schema": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "price_sats": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:29bc604ed6f4ca53a35b2d58414ecb035dce073b1221d3ff226f8aa145d9f095"
        }
