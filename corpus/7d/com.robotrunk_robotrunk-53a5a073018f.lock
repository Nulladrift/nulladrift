        {
          "name": "watch_back_in_stock",
          "title": "Watch a sold-out listing for restock",
          "description": "Starts a poll-only watch on one listing the store itself currently shows as sold out, and returns a bearer token to poll or stop it. Refused not_sold_out on any listing that is not shown as sold out right now (unknown or not-published stock counts as available, never sold out), and listing_not_found for a store, product or variant RoboTrunk does not hold. Nothing is emailed or called back; poll get_back_in_stock_watch to learn when it flips. Use when a shopper wants to know when a sold-out listing comes back in stock. Keep the watch_token; stop with stop_back_in_stock_watch. Error recovery: invalid_request names the field to fix; listing_not_found means call search_catalog; not_sold_out means no watch is needed; rate_limited means wait a minute; watch_failed (or any other unexpected error): retry once, then call submit_feedback. Next: get_back_in_stock_watch to poll for the restock. Full guide: get_tool_guide or /agent/tools.json#watch_back_in_stock Example call: {\"merchant\":\"anbbaby-com\",\"product_id\":\"gid://shopify/Product/1234567890\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "merchant": {
                "description": "The store slug from the earlier search_catalog result.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "product_id": {
                "description": "The product_id from search_catalog or get_product, or its bare numeric Shopify id. Example: \"gid://shopify/Product/1234567890\" or \"1234567890\", never a page link.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "shopping_session_id": {
                "description": "Optional server-issued shopping session correlation ID. It is not purchase authority.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              },
              "variant_id": {
                "description": "One sold-out variant to watch, or null/omitted to watch the whole product, which alerts as soon as any variant is available again.",
                "maxLength": 200,
                "type": ["string", "null"]
              }
            },
            "required": ["merchant", "product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Watch a sold-out listing for restock"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "com.robotrunk/tool": {
              "guide": {
                "caveats": "The watch_token is shown once, here, and never again; keep it to poll or stop the watch. A watch lapses on its own after about 90 days if nothing changes. This is a poll-only watch: nothing is emailed, called back or pushed; call get_back_in_stock_watch to check it.",
                "do_not_use": "Do not use this on a listing that is in stock, or whose stock the store does not publish; both are refused not_sold_out. Do not use this to find products; use search_catalog first.",
                "error_recovery": "invalid_request names the field to fix. listing_not_found means the store, product or variant is not available through RoboTrunk right now (paused, or a wrong id), not that it is missing; call search_catalog. not_sold_out means that listing is not shown as sold out right now, so no watch is needed. rate_limited means wait a minute.",
                "examples": [
                  {
                    "input": {
                      "merchant": "anbbaby-com",
                      "product_id": "gid://shopify/Product/1234567890",
                      "variant_id": null
                    },
                    "title": "Watch a sold-out listing"
                  }
                ],
                "outputs": "status is ok or error. On ok, resource.watch_id, resource.watch_token, resource.listing and resource.state (\"sold_out\") confirm the watch; resource.started_at and resource.ends_at bound it.",
                "parameters": "`merchant` is the store slug from the earlier search_catalog result. `product_id` is that result's product_id, or its bare numeric Shopify id. `variant_id` is optional: name one sold-out variant, or omit it to watch the whole product, which alerts as soon as any variant is available again (not once every variant returns).",
                "summary": "Starts a back-in-stock watch on a listing the store shows as sold out right now, for up to 90 days, and returns the one-time watch_token needed to poll or stop it.",
                "use_when": "Use when a shopper wants to know when a specific sold-out listing (or one sold-out variant of it) comes back in stock."
              },
              "kind": "operational",
              "status": "operational",
              "untrustedContentHint": false
            }
          },
          "digest": "sha256:3e7b8292eb9a8803abfbff70c9fbd4d6dc055c12facd7cbe100742749eb6554f"
        },
        {
          "name": "watch_recalls",
          "title": "Watch a purchase's products for a recall",
          "description": "Starts a post-purchase recall watch on every product in a checkout that has been handed to the store to pay, once the person (or an agent authorised to accept on their behalf) has agreed to the current consent statement. RoboTrunk re-checks each watched product whenever a regulator publishes a new notice naming its brand; a match only ever flags with the regulator's own citation and never changes, cancels or delays the purchase. An item not matched to a listed product is watched by its checkout name, not refused; each product says watched_by \"product\" or \"name\". The full consent statement, version recall-watch-consent-v1: \"RoboTrunk will watch the products in this purchase for a recall. What is watched: each product bought through this checkout hand-off, re-checked whenever a regulator publishes a new notice naming its brand. What is stored: the product and its title, the channel chosen to be told (poll, an agent callback URL, or a person's email address), and, only for a channel that is switched on, that URL or address; never a name, a postal address or payment details. Channels: an agent can always poll get_recall_watch for the result; a callback URL is used only when RoboTrunk has switched callbacks on; a person's email is used only when RoboTrunk has switched email on, the person consents under the Australian Spam Act, and the address holder confirms it by a link sent to that address. Frequency cap: at most three messages a day on one channel, and at most one email a day to one address, several alerts combined into one. How to stop: call stop_recall_watch at any time, or use the one-click stop link in an email; stopping is instant and permanent, and removes the stored channel data. This watch never changes, cancels, blocks or delays the purchase it watches; a recall only ever flags with its regulator citation.\" channels is optional: leave it out for the poll-only watch every purchase gets, and a channels value that cannot be read is left out the same way, with the answer saying poll was used. One watch per checkout: a second call returns the existing watch unchanged, and a stopped watch cannot be restarted. Use it after complete_checkout; keep the watch_token it returns (shown once) for get_recall_watch and stop_recall_watch. Error recovery: consent_required means show the person the statement above and call again with it; invalid_request names the field to fix; channel_not_available means retry with channels left out (poll only); checkout_not_handed_off means call complete_checkout first; checkout_ended means there is nothing to watch; watch_stopped means this checkout's watch was stopped and cannot restart; product_not_resolved means no item could be matched or named; use check_product; checkout_too_large means more than 50 different products; forbidden, not_found or checkout_not_found means that checkout cannot be read here, so send checkout_id exactly as an earlier answer returned it; continuation_not_found means that reference is unknown or expired, so call create_checkout again; rate_limited means wait and retry; service_unavailable means try again later; watch_failed (or any other unexpected error): retry once, then call submit_feedback. Next: get_recall_watch to poll for alerts. Full guide: get_tool_guide or /agent/tools.json#watch_recalls Example call: {\"checkout_id\":\"mcp1_c_examplereferencevaluehere0000000000000\",\"consent\":{\"given_by\":\"person\",\"statement_version\":\"recall-watch-consent-v1\"},\"channels\":[{\"kind\":\"poll\"}]}",
          "inputSchema": {
