          "description": "Stops a recall watch for good: instant, permanent and idempotent. Erases the stored callback URL or email address in the same step the watch stops; the checkout this watch covered can never be watched again. Use when the person asks to stop the watch. Error recovery: watch_not_found means the token is wrong or the watch is already stopped and past its term; there is nothing further to do; watch_failed (or any other unexpected error): retry once, then call submit_feedback. Nothing follows. Full guide: get_tool_guide or /agent/tools.json#stop_recall_watch Example call: {\"watch_token\":\"rwt_exampletokenvaluehere00000000000000000000000\"}",
          "inputSchema": {
            "additionalProperties": false,
