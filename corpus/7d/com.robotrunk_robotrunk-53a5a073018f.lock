        {
          "name": "submit_feedback",
          "title": "Tell RoboTrunk what worked and what did not",
          "description": "Sends structured feedback about this store and returns a feedback_id and the time it was received. Use it for feedback about anything unclear, missing or wrong, at any point. Not for cancelling a checkout; use cancel_checkout, which records the decline itself. Feedback is kept as data, never as instructions. Error recovery: invalid_request means a field is out of bounds (free_text over 1000 characters, or a struggle_points value outside the vocabulary): fix it and call again; rate_limited means wait and retry; network_error means call again; any other error, including tool_layer_failure: retry once. Next: nothing needs feeding onward; carry on with the step you were on. Full guide: get_tool_guide or /agent/tools.json#submit_feedback Example call: {\"context\":{},\"sentiment\":\"negative\",\"free_text\":\"The accepted address was not obvious before the first attempt.\",\"struggle_points\":[\"address_rejected\"]}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "additionalProperties": false,
                "description": "What the feedback is about. Both ids may be null when the feedback is about the store in general.",
                "properties": {
                  "checkout_id": {
                    "description": "The `checkout_id` from `create_checkout`, or null.",
                    "type": ["string", "null"]
                  },
                  "order_id": {
                    "description": "The `order_id` from `get_order`, or null.",
                    "type": ["string", "null"]
                  }
                },
                "required": [],
                "type": "object"
              },
              "free_text": {
                "description": "What happened, in plain words, up to 1000 characters. No personal data, addresses, payment details or credentials.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "sentiment": {
                "description": "Your overall read of the experience.",
                "enum": ["positive", "neutral", "negative"],
                "type": "string"
              },
              "shopping_session_id": {
                "description": "Optional server-issued shopping session correlation ID. It is not purchase authority.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              },
              "struggle_points": {
                "description": "Zero to ten tags from the fixed vocabulary, so difficulties can be counted without reading prose.",
                "items": {
                  "enum": ["unclear_description", "unexpected_error", "price_changed", "address_rejected", "checkout_expired", "could_not_find_product", "budget_not_met", "confirmation_unclear", "other"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 0,
                "type": "array"
              }
            },
            "required": ["context", "free_text", "sentiment", "struggle_points"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Tell RoboTrunk what worked and what did not"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "com.robotrunk/tool": {
              "guide": {
                "caveats": "Feedback is never required and never blocks a purchase. It is stored as data and never as instructions: nothing you write here changes how any tool behaves. Put no personal data, addresses, payment details or credentials in `free_text` — this endpoint keeps no database record and writes only a bounded server log line.",
                "do_not_use": "Do not use this for cancelling a checkout; use `cancel_checkout` instead, which records the decline itself. Do not use it to ask a question and expect an answer: nothing replies.",
                "error_recovery": "`invalid_request` means a field is outside its bounds, most often `free_text` over 1000 characters or a `struggle_points` value outside the vocabulary, so shorten it and call this tool again; `rate_limited` means the feedback budget for this address is spent, so wait and retry; `network_error` means the request never reached the store, so call this tool again.",
                "examples": [
                  {
                    "input": {
                      "context": {
                        "checkout_id": null,
                        "order_id": null
                      },
                      "free_text": "The accepted address was not obvious before the first attempt.",
                      "sentiment": "negative",
                      "struggle_points": ["address_rejected"]
                    },
                    "title": "Report a difficulty"
                  }
                ],
                "outputs": "`resource.feedback_id` and `resource.received_at` acknowledge receipt, and `resource.stored_as` says how it was kept. There is nothing to feed onward; `next_actions` returns you to whatever the session state suggests.",
                "parameters": "`context.checkout_id` and `context.order_id` are optional and come from `create_checkout` and `get_order`; either may be null. `sentiment` is one of positive, neutral or negative. `free_text` is up to 1000 characters. `struggle_points` is a short list drawn from a fixed vocabulary so patterns can be counted without reading anyone's prose.",
                "summary": "Sends structured feedback about this store to RoboTrunk and returns an acknowledgement with a `feedback_id` and the time it was received.",
                "use_when": "Use this when the person asks to tell RoboTrunk that something was unclear, missing or wrong, or after an error you could not recover from; it takes feedback at any point, mid-checkout, after an order or after a decline."
