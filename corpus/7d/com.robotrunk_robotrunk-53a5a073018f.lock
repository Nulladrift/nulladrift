          "meta": {
            "com.robotrunk/tool": {
              "guide": {
                "caveats": "Callback and email are refused channel_not_available until RoboTrunk switches them on; today only poll is available, so keep polling get_recall_watch. A watch also starts on a checkout that has already completed. An item RoboTrunk cannot match to a product it lists is watched by the name its store's checkout line states: its entry in resource.products has watched_by \"name\", product_id null and a watch_basis sentence, and a notice is matched to a name by RoboTrunk's model, which can be less sure than for a listed product; tell the person which items are watched by name. A finished checkout no longer holds its lines' names, so an unmatched line there cannot be watched: resource.not_watched counts those lines and the items_not_watched message says so; tell the person and use check_product on those items. resource.purchase_state is \"handed_off\" or \"completed\": RoboTrunk only learns a purchase completed from a later checkout read, so \"handed_off\" does not mean the purchase failed or was never made. A recall only ever flags with its citation; it never blocks, cancels, delays or otherwise changes this or any purchase, whether or not a watch exists.",
                "do_not_use": "Do not use this to check a product for a recall before buying; call check_product. Do not call it on a checkout that has not been handed off (ready_for_complete) or that ended (canceled, expired, failed); both are refused rather than started.",
                "error_recovery": "consent_required means no consent, or the wrong statement_version, was sent; show the person the statement in this guide and call again. channel_not_available means the requested channel is switched off, or an email channel's given_by or spam_act_consent was missing; retry with channels left out (poll only). checkout_not_handed_off means the checkout has not reached hand-off yet; call complete_checkout first. checkout_ended means the checkout was canceled, expired or failed, so there is nothing to watch. watch_stopped means this checkout's watch was already stopped and cannot be restarted. product_not_resolved means nothing in the checkout could be matched to a product RoboTrunk holds or named from the store's line, so there is nothing to watch and nothing was stored; use check_product for each item by name. checkout_too_large means the checkout has more than 50 different products, more than one watch covers. service_unavailable means the watch or its recall check is not reachable right now; nothing was stored, so try again later.",
                "examples": [
                  {
                    "input": {
                      "channels": [
                        {
                          "kind": "poll"
                        }
                      ],
                      "checkout_id": "mcp1_c_examplereferencevaluehere0000000000000",
                      "consent": {
                        "given_by": "person",
                        "statement_version": "recall-watch-consent-v1"
                      }
                    },
                    "title": "Watch a just-handed-off purchase, polling only"
                  }
                ],
                "outputs": "status \"started\" on a new watch (resource.watch_token, shown once, is the authority to call get_recall_watch or stop_recall_watch; keep it), or \"watch_exists\" when this checkout already has one. resource.products[] lists each watched product's watched_by (\"product\" or \"name\"), current recall_status and any match already known at start; resource.alerts is empty at start, so poll get_recall_watch for later ones. An error status carries no resource beyond a type and null.",
                "parameters": "`checkout_id` is the reference get_checkout accepts for this purchase. `consent.given_by` is \"person\" when the person themself agreed, or \"agent_with_authority\" when you are authorised to accept such offers on their behalf. `consent.statement_version` must be exactly \"recall-watch-consent-v1\", the version of this statement: \"RoboTrunk will watch the products in this purchase for a recall. What is watched: each product bought through this checkout hand-off, re-checked whenever a regulator publishes a new notice naming its brand. What is stored: the product and its title, the channel chosen to be told (poll, an agent callback URL, or a person's email address), and, only for a channel that is switched on, that URL or address; never a name, a postal address or payment details. Channels: an agent can always poll get_recall_watch for the result; a callback URL is used only when RoboTrunk has switched callbacks on; a person's email is used only when RoboTrunk has switched email on, the person consents under the Australian Spam Act, and the address holder confirms it by a link sent to that address. Frequency cap: at most three messages a day on one channel, and at most one email a day to one address, several alerts combined into one. How to stop: call stop_recall_watch at any time, or use the one-click stop link in an email; stopping is instant and permanent, and removes the stored channel data. This watch never changes, cancels, blocks or delays the purchase it watches; a recall only ever flags with its regulator citation.\" `channels` is optional: leave it out, or send [{\"kind\":\"poll\"}], for a poll-only watch (poll is always on); a value that cannot be read as the list below is left out the same way, and the answer says poll was used. When you send it, it is one or more of: {\"kind\":\"poll\"} (always accepted), {\"kind\":\"callback\",\"url\":\"https://...\"} (accepted only when callbacks are switched on), or {\"kind\":\"email\",\"address\":\"...\",\"spam_act_consent\":true} (accepted only when email is switched on and given_by is \"person\").",
                "summary": "Starts watching every product in a handed-off or completed checkout for a recall (an item it cannot match to a listed product is watched by the name on its checkout line), with poll always on and callback/email accepted only when switched on and consented to.",
                "use_when": "Use once a checkout has reached complete_checkout's hand-off (local status handoff_issued, completed_pending_order or completed) and the person has agreed to be watched. Call it right after telling the person their purchase will be watched, never before the hand-off."
              },
              "kind": "operational",
              "status": "operational",
              "untrustedContentHint": true
            }
          },
          "digest": "sha256:a723616b6413dd3092a44e986a941abcb31bfc8c02f28dd339466caf4cf8b70e"
        }
