        "url": "https://flingflyers.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "flingflyers",
        "title": "flingflyers",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Publishes an HTML document at a short public URL that expires on its own. Use it when the user wants to open a page you made in a browser, send it to someone, or read it on another device. Links are public to anyone holding them and are never private — confirm before publishing anything the user has not asked you to share. When the user asks for a change to a page you already published, call update_flyer rather than publishing again: it keeps the URL they may have already shared, which republishing would not.",
      "tools": [
        {
          "name": "publish_flyer",
          "title": "Publish a flyer",
          "description": "Publish an HTML document at a short public URL and return the link. Use this when the user wants to view a page you made in a real browser, send it to someone, or open it on another device — anywhere handing back raw markup is not good enough.\n\nThe link works for anyone who has it, with no account and no sign-in, and expires on its own (7 days by default). It is public: anyone with the URL can read the page, so do not publish anything the user would not post openly, and confirm first unless they have asked you to share it.\n\nPlain (unencrypted) only. The document reaches the server as text, so this cannot produce an encrypted flyer — for that the user runs `npx flingflyers <file> -e --persist` on their own machine, where the key is generated locally and never sent. Say so rather than implying this is private.\n\nSingle self-contained document: inline the CSS, JS and images, or use data URIs. External file references will not resolve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "html": {
                "description": "The complete HTML document, including <!doctype html>. Must be self-contained.",
                "type": "string"
              },
              "ttl_hours": {
                "description": "How long the link should live, in hours. Default 168 (7 days), maximum 720 (30 days).",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish a flyer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:edab24c7dd1fdea67110f31972841ad2165632f7c1cc3249b1c5fa3995b80e22"
        },
        {
          "name": "revoke_flyer",
          "title": "Take down a flyer",
          "description": "Take down a flyer immediately: the link starts returning \"gone\" and the stored document is deleted. Needs the id and owner_token returned when it was published — there are no accounts, so that token is the only proof of ownership and it is not recoverable if lost.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The flyer id, e.g. x7Kp2mQ.",
                "type": "string"
              },
              "owner_token": {
                "description": "The owner_token returned by publish_flyer.",
                "type": "string"
              }
            },
            "required": ["id", "owner_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Take down a flyer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:714606882ef59f96c7e487a5ec2d3e152af1ac55898cb9b41d30293ad581e5d7"
        },
        {
          "name": "update_flyer",
          "title": "Update a published flyer",
          "description": "Replace the contents of a flyer you already published, keeping the same URL. Use this for every revision to a page that is already live — a fix, a new section, a chart the user asked you to add — so the link they may have already sent to someone keeps working and shows the new version.\n\nPrefer this over publishing again. A second publish_flyer call mints a different URL and leaves the old page live and out of date, which is almost never what the user meant by \"update it\".\n\nNeeds the id and owner_token returned when it was published; there are no accounts, so that token is the only proof of ownership. Send the complete replacement document, not a patch or a fragment — the old contents are overwritten and cannot be recovered.\n\nThe expiry is left alone unless you pass ttl_hours, so editing a page does not quietly extend how long its link stays alive.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "html": {
                "description": "The complete replacement HTML document, including <!doctype html>. Must be self-contained.",
                "type": "string"
              },
              "id": {
                "description": "The flyer id, e.g. x7Kp2mQ.",
                "type": "string"
              },
              "owner_token": {
                "description": "The owner_token returned by publish_flyer.",
                "type": "string"
              },
              "ttl_hours": {
                "description": "Optional. Reset the expiry to this many hours from now, maximum 720 (30 days). Omit to keep the flyer's existing expiry.",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["html", "id", "owner_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Update a published flyer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e44df5e3322e0f177b9d806f6b01b66d6b712823f0298beaacebe8d0ed39464"
        }
      ],
      "digest": "sha256:b9f09f39b521653b6cd123d7097eafa250153619a6d033e485ca2b395a365c4f"
    }
  }
}
