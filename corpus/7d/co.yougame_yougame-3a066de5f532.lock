        {
          "name": "orca_listing_create",
          "description": "Needs sign-in (connect this server with OAuth, or pass an API key as the Authorization: Bearer header). Creates a community YG Dolphin listing (no web build) for a catalog base game, owned by the creator on this connection. YG Dolphin packs: a listing (orca_listing_create) holds no files; its versions are flat packs (mod.json format 2 and at most 7 files it names). For each file: pack_file start {name, bytes, sha256} answers have:true when the listing already stores it, else an upload with part URLs: PUT each part's exact bytes to its URL (Content-Length as given), then pack_file complete. Then pack_publish_version with mod.json's text and the files. YouGame checks security only (format, sizes, disc images, retail files by hash) and signs it within a minute; pack_set stable makes it the one players get. Players play on their own disc in the desktop app, jailed. Never upload a game's disc or its retail files.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base_game": {
                "description": "The catalog base game as GET /api/base/search and /api/base/dumps give it (players need their own disc of it), without runtime.",
                "type": "object"
              },
              "description": {
                "type": "string"
              },
              "genres": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mature": {
                "type": "boolean"
              },
              "profile": {
                "description": "The game's six-character disc ID (A-Z 0-9), or PPLUS32 for Project+ 3.2.",
                "pattern": "^(?:[A-Z0-9]{6}|PPLUS32)$",
                "type": "string"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "thumbnail_url": {
                "description": "Existing site art: /base-art/covers/<game>.webp. A preview video in uploadId is recommended.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "uploadId": {
                "description": "An owned staged upload with a thumbnail uploaded through /api/agent/media (required for public agent listings unless thumbnail_url supplies existing base art).",
                "type": "string"
              },
              "visibility": {
                "description": "Default private.",
                "enum": ["private", "public"],
                "type": "string"
              }
            },
            "required": ["base_game", "profile", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
