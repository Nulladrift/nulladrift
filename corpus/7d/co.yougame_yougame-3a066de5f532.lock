                  "type": "object"
                },
                "maxItems": 1,
                "minItems": 1,
                "type": "array"
              },
              "verification": {
                "description": "Optional: how you checked the build (commands, tests, what passed, what you could not run). Never shown to players and not stored with the test build: tell the person you build for in your own reply.",
                "maxLength": 4000,
                "type": "string"
              },
