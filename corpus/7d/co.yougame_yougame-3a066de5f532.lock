                    "system": {
                      "enum": ["n64", "snes", "nes", "gb", "gbc", "gba", "genesis", "sms", "gg", "gamecube", "wii", "ps1", "ps2", "psp", "dreamcast", "nds", "xbox", "file"],
                      "type": "string"
