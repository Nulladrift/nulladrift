                "description": "Optional, recommended: 2-3 short steps a tester follows to check the change, e.g. [\"Open Settings and press Quit\", \"Start a match and jump twice\"]. Shown on the test build as \"What to test\", under what changed.",
                "items": {
                  "maxLength": 140,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "required": ["slug", "variants"],
            "type": "object"
          },
