              "leaderboard": {
                "description": "The everyone leaderboard: every player ranked together, and the top score on the game's card. Default true with a points or time board. false with friends_board true is a friends-only board, the right pick for a game meant to be played among friends. score_kind \"none\" turns both switches off whatever is sent.",
                "type": "boolean"
