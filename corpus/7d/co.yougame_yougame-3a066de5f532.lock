                        "files": {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "description": "Changed or new text files keyed by path, at most MAX_SUBMIT_BYTES UTF-8 bytes in total. No binaries; keep owner-only manifest fields unchanged.",
                          "maxProperties": 64,
                          "type": "object"
                        }
                      },
                      "required": ["base", "deleted", "files"],
                      "type": "object"
                    },
                    "key": {
                      "description": "Optional one-letter key (a, b, c ...); given in order otherwise.",
                      "type": "string"
                    },
                    "kind": {
                      "description": "native-source: a native source patch. pack-changeset: editable pack text against pack.base. Neither uses an upload.",
                      "enum": ["native-source", "pack-changeset"],
                      "type": "string"
                    },
                    "label": {
                      "description": "Up to 60 characters: what sets this build apart (choice), e.g. \"Big cards\". Optional for a fix.",
                      "type": "string"
                    },
                    "patch": {
                      "description": "With kind \"native-source\": the change as a plain git diff (git diff --no-renames) against the pinned source, at most 320 KiB; C/C++ sources, headers, assembly and docs only.",
                      "type": "string"
