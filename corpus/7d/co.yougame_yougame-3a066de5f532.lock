              "title": {
                "description": "Without job: 3-120 characters, for players: what a player will notice changed, in plain words, under about 60 characters, e.g. \"Jump is easier to time\" or \"Quit button on the first settings page\". Never a commit hash, branch name, version, \"main @ ...\", \"PR 12\" or \"built automatically\". A job takes its title from the player’s change.",
                "type": "string"
              },
              "uploadId": {
                "description": "The staged upload (32 hex characters) for a web test build. Same as variants: [{ uploadId }]; send one or the other.",
