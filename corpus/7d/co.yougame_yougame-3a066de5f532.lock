          "name": "make_yougame_ready",
          "description": "Turn the game in the current project into a build that runs on YouGame with the features the creator picked (by default only the SDK's leaderboard, where one fits the game; online multiplayer and phones on request), verify it with check_build, and zip it for upload.",
          "arguments": [
            {
              "name": "leaderboard",
              "description": "\"yes\" or \"no\" (default yes): a leaderboard where one fits the game (a points board for runs that end with a score, or a time board, fastest first, for a game against the clock; a versus game gets the ranked ladder from online multiplayer instead, and its listing takes score_kind \"none\"). \"no\" is a normal answer, not a gap: the game simply has no board.",
              "required": false
            },
            {
              "name": "board",
              "description": "With leaderboard \"yes\": \"points\" (runs end with a score), \"time\" (against the clock, fastest first) or \"percent\" (a score out of 100%, sent as hundredths: 6610 is 66.1%). Leave it out to pick from the game.",
              "required": false
            },
            {
              "name": "multiplayer",
              "description": "\"yes\" or \"no\" (default no): an online mode people play from different computers.",
              "required": false
            },
            {
              "name": "players",
              "description": "With multiplayer \"yes\": seats per match, 2 to 10 on the relay (default 2; larger rooms mostly fill through friend invites), 2 to 200 with netcode \"server\".",
              "required": false
            },
            {
              "name": "netcode",
              "description": "With multiplayer \"yes\": \"host\" (one client runs the simulation, room.hostSync: racers, shooters, co-op action among friends), \"turns\" (turn-based shared state: board, card, word games), \"lockstep\" (every client runs the same deterministic simulation with equal input delay, room.lockstep/rollback over direct links: fighters, grid games on a tick), or \"server\" (the rules run on YouGame as a Server Lite module in server/index.js, up to 200 players, nothing a client can lie about: shooters and battle royale between strangers, MMO zones, co-op campaigns). Leave it out to pick from the game.",
              "required": false
            },
            {
              "name": "world",
              "description": "With worlds \"yes\": \"shared\" (default: shared state the site keeps and relays, 32 players, every client trusted) or \"server\" (a Server Lite world: rules, storage and per-player profiles on the server, up to 200 players, time passes while nobody is connected: economies, farms, idle games).",
              "required": false
            },
            {
              "name": "proximity",
              "description": "\"yes\" or \"no\" (default no): with multiplayer, shape the match's voice chat by distance in the game world (YouGame.voice.proximity).",
              "required": false
            },
            {
              "name": "races",
              "description": "\"yes\" or \"no\" (default no): races and ghost challenges (YouGame.speedruns and YouGame.replay: categories in yougame.json, recorded runs to race against, challenge links) and, with multiplayer, a same-seed race mode inside the rooms. Not an architecture: it goes beside any netcode.",
              "required": false
            },
            {
              "name": "saves",
              "description": "\"yes\" or \"no\" (default no): let players resume where they left off (YouGame.save/load).",
              "required": false
            },
            {
              "name": "worlds",
              "description": "\"yes\" or \"no\" (default no): a persistent world every player logs into, its state kept between visits. With world \"shared\" (the default) it is shared state the site keeps and relays, not a game server, so every client is trusted and only co-op and creative games fit; with world \"server\" the rules and storage run on YouGame (Server Lite), which is the answer for economies, progression and time passing while empty.",
              "required": false
            },
            {
              "name": "phones",
              "description": "\"yes\" or \"no\" (default no): touch controls and phone sizing, for the \"Works on phones\" listing.",
              "required": false
            }
