              "what_to_test": {
                "description": "Optional: new steps for \"What to test\" when this revision changes what a tester should check (replaces the old steps). Optional, recommended: 2-3 short steps a tester follows to check the change, e.g. [\"Open Settings and press Quit\", \"Start a match and jump twice\"]. Shown on the test build as \"What to test\", under what changed.",
                "items": {
                  "maxLength": 140,
