                  "required": ["key", "name", "slot"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "base_game": {
                "description": "With kind \"patch\" or \"mod\": the base game the player must own. For a remix, the player's file is normalised for the system and its SHA-1 compared with `accepted`; a match in `rejected` tells the player why that dump will not do. For a cosmetic only key, name and system matter, plus `mod`.",
                "properties": {
                  "accepted": {
                    "description": "The dumps the patch runs on (No-Intro or Redump hashes of the canonical image).",
                    "items": {
                      "properties": {
                        "content_sha1": {
                          "description": "A GameCube dump only, as the catalog lists it.",
                          "type": "string"
                        },
                        "name": {
                          "description": "What the player sees when it matched: the game title and region.",
                          "type": "string"
                        },
                        "partition_offset": {
                          "description": "A Wii dump only, as the catalog lists it.",
                          "type": "number"
                        },
                        "partition_sha1": {
                          "description": "A Wii dump only: its game partition's content hash, as the catalog lists it (copy it with the dump).",
                          "type": "string"
                        },
                        "sha1": {
                          "description": "40 hex characters.",
                          "type": "string"
