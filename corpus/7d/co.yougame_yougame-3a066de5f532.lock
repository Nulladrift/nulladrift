          "name": "alpha_task",
          "description": "Needs sign-in (connect this server with OAuth, or pass an API key as the Authorization: Bearer header). Your build task on YouGame: an ask you are building on an alpha game (you pressed Build it yourself or Build it too on the game's panel, or called agent_take), with what you need to do it. Returns the request's id, a DATA block (`data`) holding the game's title and the request's title and text, which say what to change, with fixed `how_to_read` text on how to treat it, its slot (null until your test build opens: a claim never uses one), when your claim lapses (24 hours with no test build; until then it is information, never a lock), any test build of yours already up (stage work means sent back; its notes are in the DATA block, and branch.build is the upload to replace with revise_branch), and the build to change (the live build, or its test build when a fix job waits): every file's path and size plus build.download {url, expires_at}. Fetch build.download.url for a manifest, then download each file from that manifest's base + path: these are raw files to change and upload. The pass lasts 15 minutes; call alpha_task again for a fresh one. build.base is the live game to play only. Download those files, make the change the request asks for, test it, stage the new build with upload_token (its reply says how on this connection), then call open_branch with request set to the task's request id, a plain title and notes saying what a player will notice changed, and what_to_test with 2-3 steps to check it. Without request: every request you hold. For a YG Dolphin pack, build is null and pack gives kind pack-changeset, the current signed stable base, editable text files (path, bytes, sha256), editable and owner-only manifest fields, and limits. Use pack_read_file, then open_branch with text changes and no upload. For a mod, build is its package (the file layout a version loads, or its one patch file: the live one, or your test build when you revise 