              "licence": {
                "description": "Creator-owned listing licence: all-rights-reserved, MIT, Apache-2.0, CC-BY-4.0 (art and sound), or custom. Omit or use null for not stated. Custom needs an https link in licence_url. Community open-source listings keep YouGame's AGPL licence. Unreal Engine games can't use GPL-family or CC BY-SA licences.",
                "enum": [null, "all-rights-reserved", "MIT", "Apache-2.0", "CC-BY-4.0", "custom"],
                "type": ["string", "null"]
              },
              "licence_url": {
                "description": "An https link to the creator's licence text; required for custom, optional for other licences. No whitespace or control characters. Omit to keep it on updates; null clears it.",
                "maxLength": 500,
                "type": ["string", "null"]
              },
              "match_replays": {
                "description": "Creator opt-in for automatic browser match recordings, live watching and player account copies. Default false. Requires YouGame.replay.matches in the game.",
                "type": "boolean"
              },
              "mature": {
                "description": "True when the game is for adults only (blood and gore, realistic violence against people such as real-looking people hurt or killed or a realistic war setting, strong language, mature themes, casino-style gambling such as poker, slots or roulette even with play money). Cartoon, fantasy and stylized combat is not mature. Ask the creator if the game's content leaves it unclear.",
                "type": "boolean"
              },
              "max_score": {
                "description": "Optional: the highest score the game can produce (a points board), or the fastest run it can possibly produce in milliseconds (a time board). Scores past it are refused. Work it out from the game, or leave it out.",
                "type": "number"
              },
              "mobile": {
                "description": "True only when you played the whole game with touch: every menu and action by tap or through YouGame.input, the layout right after fullscreen and rotation at 390×844 and 1024×768 (an iPad), no page scroll or zoom. Phones and iPads list only games with this on and Play there is the whole experience, so a wrong true puts an unplayable game in front of everyone it is shown to. The check report says what input the source handles; a keyboard-only or mouse-only build is false. Not sure, or could not run it on a touch screen or emulator: false, and say why in notes. A ROM mod (kind \"patch\" with base_game.rom_patch) is the exception: it runs in the site's emulator, which has its own on-screen controls, so pass true unless the mod cannot be played that way.",
                "type": "boolean"
              },
              "platform": {
                "description": "web (default): plays in the browser. desktop_app: native build only; upload from Manage → Desktop builds. Forces mobile false. Never ship a web page telling players to download the app.",
                "enum": ["web", "desktop_app"],
                "type": "string"
              },
              "play_mode": {
                "description": "single (solo only), multiplayer (online only), or both. Default: multiplayer when the build calls YouGame.multiplayer.joinLobby, else single.",
                "enum": ["single", "multiplayer", "both"],
                "type": "string"
              },
              "remix": {
                "additionalProperties": false,
                "description": "Whether other people may remix this game (copy its build, change it, and publish the result as their own game) and on what terms. The creator decides; leaving it out means no remixes. A version of another game (base_game) is never monetized, so its remixes are always free. A mod cannot be remixed. A remix made under given terms keeps them even if the creator changes them later.",
                "properties": {
                  "allowed": {
                    "description": "May anyone remix the game at all. Default false.",
                    "type": "boolean"
                  },
                  "merge": {
                    "description": "Whether a remixer may propose their build as the original's next version: \"free\" (default: yes) or \"no\".",
                    "enum": ["free", "no"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "save": {
                "description": "Put the game in the creator's Saved games. Default true; pass false only when the creator asked not to.",
                "type": "boolean"
              },
              "score_kind": {
                "description": "The leaderboard this game gets, if any. \"points\" (default): the game calls YouGame.gameOver(score) with whatever it counts, higher is better. \"percent\": a score out of 100% (accuracy, completion); the game calls YouGame.gameOver(score) with hundredths of a percent, 0 to 10000 (6610 shows as 66.1%), higher is better. \"time\": a game against the clock (a speedrun, a level or puzzle to finish fast) calls YouGame.gameOver(elapsedMs) with the run in milliseconds; the board ranks fastest first and shows runs as times (1:23.45). Pick \"time\" whenever the build posts a time. \"none\": no leaderboard at all, which is the right answer for a head-to-head game (a fighter, a chess clone, anything only ever played one against one) that has no solo run worth ranking; the game page shows its ranked ladder instead. Never invent points so a game can have a board. Who sees a points or time board is the creator's call, carried by leaderboard and friends_board below; the ranked ladder by ladder.",
                "enum": ["points", "time", "percent", "none"],
                "type": "string"
              },
              "screenshots": {
                "description": "Optional: up to 8 image paths inside the build.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "thumbnail": {
                "description": "The path, inside the build, of a 16:9 PNG/JPG/WebP/GIF under 8 MB for the game's card. Not needed again once one was sent with PUT /api/agent/media.",
                "type": "string"
              },
              "title": {
                "description": "1–80 characters.",
                "type": "string"
              },
              "uploadId": {
                "description": "From the upload reply (32 hex characters).",
                "type": "string"
              },
              "visibility": {
                "description": "\"public\" (default) lists the game everywhere at once. \"private\" is a private launch: the game is published but nothing on YouGame lists it, and only the creator and people who open one of its invite links can see or play it (an alpha or beta for testers before the public launch). Publishing makes the first invite link; the creator makes more, sees who joined, and launches publicly from the game's Manage page. Pick it when the creator says the build is for testers, a private group, or not ready for everyone.",
                "enum": ["public", "private"],
                "type": "string"
              },
              "voice_everyone": {
                "description": "Voice chat with everyone in a match, not just friends. Default false: players hear only their friends (and everyone in a friends lobby), which is right for almost every game. true only when the creator asked for it, for a game built around talking to other players (proximity chat as a core mechanic, social deduction): then every signed-in player seated in a match can hear every other one, matched by the queue or not. Needs no game code; blocked players stay muted and nobody is on the mic until they join. Covers match rooms (the first ten players seated in each), not worlds.",
                "type": "boolean"
              },
              "whole_game_lobby": {
                "description": "true when online play is a single lobby that starts the whole game together; false when players pick among several lobby or mode types inside the game (no Play together button on its page). Omit if unsure; null clears the setting.",
                "type": ["boolean", "null"]
              }
            },
            "required": ["creator_approved", "uploadId"],
            "type": "object"
          },
