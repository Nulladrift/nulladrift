          "description": "Needs sign-in (connect this server with OAuth, or pass an API key as the Authorization: Bearer header). With job from change_wait: create a private draft from your own private test upload; title and notes come from the player’s DATA. With no job: posts your test build next to the live alpha game, without changing what the game page runs. When request is omitted, its title becomes its votable ask; it takes one of the same four build spots. An explicit request keeps the existing pick-up rules. Stage the build with upload_token, as its reply says for this connection (on a full one: Stage a local build folder with Node 22+: download https://yougame.co/upload-build.mjs, then run node upload-build.mjs <build-folder> with YOUGAME_URL=https://yougame.co and YOUGAME_UPLOAD_TOKEN (from upload_token) or YOUGAME_API_KEY set; on an \"Ideas and test builds only\" one: upload-build.mjs with the build folder or its zip), then call this with its uploadId and request = the request's id. For a web or native test build on an owner-governed game (owner or maintainers mode), the owner or an approver puts any open, playable test build in from the game page, including while it is being tested; tester counts inform their decision. Community-governed games merge by vote: players confirm it works, then vote, one player one vote; at two-thirds yes with enough votes it merges for every player within a minute or two, and the creator (an admin on an ownerless game) can undo it for an hour after. It is released as the game's next version and credited to you. To replace your web test build, stage a revised upload and call revise_branch; alpha_task gives its current branch.build and any send-back notes. On a game whose test builds are source patches (alpha_task says so in `native`), send no upload: variants is [{ kind: \"native-source\", patch: <a plain git diff against the pinned source> }]; YouGame keeps it privately, builds it on its build machine and offers the build offline in the desktop app to the game's testers. For a YG Dolphin pack, use one variant {kind: 'pack-changeset', changeset: {base: pack.base, files: {path: text}, deleted: []}} from alpha_task or alpha_board. Read the editable text with pack_read_file. Submitting shares your title and idea on the game's board. Only the owner, testers and you can play it. Who puts it in follows the game's governance: the owner or an approver on owner-governed games; by vote on community-governed games. No upload or binary changes; only the manifest's editable_fields may change. At most 64 touched files (MAX_SUBMIT_FILES) and 2097152 UTF-8 bytes (MAX_SUBMIT_BYTES). A stale base (409) means re-read alpha_task or alpha_board, reapply and retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Optional: the PR or compare link for this build's changes, so testers can see the code (\"See the code changes\"). An https link on github.com, gitlab.com, codeberg.org, bitbucket.org or YouGame, e.g. https://github.com/<owner>/<repo>/pull/12 or .../compare/<from>...<to>. Without one, testers see the test build's PR if it has one, or YouGame's own diff against the build it was made from. On revise_branch pass it again: a revision without one drops the old link.",
                "maxLength": 500,
                "type": "string"
              },
              "job": {
                "description": "Your change_wait job id: opens a private draft, or finishes its tweak. No claim or slot is needed. Only the player proposes it.",
                "type": "string"
              },
              "kind": {
                "enum": ["fix"],
                "type": "string"
              },
              "note": {
                "description": "Optional, up to 120 characters: a line pinned under the test build's title for players, e.g. \"Jump works, the new level is not in yet\". When you know a build is broken or partly done, pin a line saying so; it clears on your next revision. build_note changes or clears it later.",
                "maxLength": 120,
                "type": "string"
              },
              "notes": {
                "description": "Shown to every player under \"What changed\" on the test build. Write what a player will see or feel changed, in plain words: one line (at most three sentences), e.g. \"Shows the round number in big yellow letters above the ring.\" Never only a commit hash, branch name, version, link or \"built automatically\": a player has to know what changed without opening anything. No tools, file names, commands, test results, environment notes or apologies: those go in verification. Put the 2-3 steps to check it in what_to_test (or end these notes with a line \"What to test:\" and the steps under it). Up to 2000 characters.",
                "type": "string"
              },
              "request": {
                "description": "Optional without job: the request you picked up (alpha_board lists the claims). Omit it to make an ask from the build's title.",
