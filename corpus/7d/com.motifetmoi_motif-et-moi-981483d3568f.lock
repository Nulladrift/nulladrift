      },
      "instructions": "Motif & Moi imprime des vêtements personnalisés à Rennes (DTF, dès une pièce, livraison en France).\n1. list_products pour les vêtements, couleurs, tailles et faces imprimables.\n2. get_quote pour le prix TTC et la date de livraison (demandez le code postal).\n3. create_design pour préparer le vêtement : renvoie un lien vers le configurateur prérempli.\n4. Pour un club, une classe ou une association : create_group_order (un lien à partager aux membres, un lien privé pour le responsable), puis get_group_status pour suivre les inscriptions.\nRègles : vous ne passez jamais commande. Donnez le lien au client : il vérifie le visuel (bon à tirer), les tailles et l’orthographe, puis commande et paie lui-même. Prix toujours TTC. Les remises de list_products sont des maximums : annoncez uniquement le taux et le montant renvoyés par get_quote. Une commande de groupe dont cart_prepared vaut true n’est pas payée tant que payment_status ne vaut pas paid. Pour un prénom ou un numéro par personne, utilisez per_piece et la liste pieces (ou une commande de groupe si les membres saisissent eux-mêmes). Ne partagez jamais owner_url ni owner_key avec les membres. N’annoncez pas une date de livraison sans get_quote.",
      "tools": [
        {
          "name": "create_design",
          "title": "Préparer le vêtement et son lien de commande",
          "description": "Enregistre la personnalisation (logo par URL https publique ou en base64, textes, prénoms et numéros par pièce, quantités) et renvoie un lien vers le configurateur prérempli, un aperçu et le devis. Rien n’est commandé : le client ouvre le lien, vérifie le visuel (bon à tirer), puis commande et paie lui-même. Le lien reste valable 90 jours.",
          "inputSchema": {
            "properties": {
