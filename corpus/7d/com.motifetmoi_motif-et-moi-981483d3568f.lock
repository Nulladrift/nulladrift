        {
          "name": "create_group_order",
          "title": "Lancer une commande de groupe",
          "description": "Pour un club, une classe, une association : crée le modèle et deux liens. Le lien membres est à partager (WhatsApp, e-mail) : chacun y choisit sa taille, saisit son prénom et son numéro si le modèle en a (texte per_piece), et paie sa part en ligne si pay_mode vaut members. Le lien responsable est privé : il suit les inscriptions et passe la commande pour tous à la date limite (il vérifie alors le visuel et paie le solde). Plus le groupe est nombreux, moins c’est cher : la remise porte sur tout le groupe et le trop-perçu des premiers inscrits leur est remboursé.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Catégorie (identifiant de list_products), ex. t-shirt, sweat, hoodie, polo, tote-bag.",
                "type": "string"
              },
              "club_margin_pct": {
                "description": "Avec pay_mode members : marge en % ajoutée au prix de chaque membre pour la caisse du club, reversée au club par virement après la commande (IBAN à saisir sur owner_url).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "color": {
                "description": "Couleur du vêtement (nom de list_products, ex. Noir).",
                "type": "string"
              },
              "deadline": {
                "description": "Date limite des inscriptions (AAAA-MM-JJ), à venir.",
                "type": "string"
              },
              "front_format": {
                "description": "Devant : petit logo sur le cœur (compris dans le prix) ou grand format (supplément).",
                "enum": ["coeur", "grand"],
                "type": "string"
              },
