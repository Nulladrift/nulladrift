      },
      "transport": {
        "type": "http",
        "url": "https://company-signals.lastminutedealshq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "company-signals",
        "title": "Company Signals: open jobs and hiring changes per company",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Hiring data for software companies, updated daily from their public careers boards and compiled by an AI. Use it when asked: how many open jobs does a company have, is a company hiring more or less than last week, which companies changed their hiring today. Start with lookup_company_free (no key, 10 calls a day). For the full daily history and daily changes, call request_api_key with the user's email address (free, 300 calls a day), then set the key they receive as the x-api-key header (or Authorization: Bearer) of this connection. The series started 2026-10-09, so changes over longer spans appear as days accumulate. Contract: https://company-signals.lastminutedeals.workers.dev/openapi.json",
      "tools": [
        {
          "name": "coverage",
          "description": "How many companies and careers boards are tracked and how many days have been captured. No key needed.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25aa8394079994c4c0becbb016ec17918de165678a13f7b9ae62413b9a40f94b"
        },
        {
          "name": "get_company_open_roles",
          "description": "Daily history of open jobs for one company: open-role count per day and per department, and the careers board it comes from. Needs a free API key (300 calls a day). Compiled by an AI from public careers boards, not human-reviewed; removal on request.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "the company's website domain (no www), for example example-co.test",
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6a6159bff8ac68edc1744a46a1a2f48dd8b521f3fb75d81f56d11e397f188d9"
        },
        {
          "name": "get_hiring_changes",
          "description": "Which companies changed their number of open jobs on a given day (hiring more or cutting roles), largest change first. Needs a free API key (300 calls a day). Compiled by an AI from public careers boards, not human-reviewed; removal on request.",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "the day, YYYY-MM-DD, UTC; the series starts 2026-10-09",
                "type": "string"
              },
              "min_delta": {
                "description": "smallest change in open jobs to include, default 1",
                "type": "integer"
              }
            },
            "required": ["day"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0cb625f2a16c20f136b7fcca23027d639658426f683f5707213714cd1f06b772"
        },
        {
          "name": "lookup_company_free",
          "description": "How many open jobs does this company have today, and is it hiring more or less than last week? Free sample, no API key, 10 calls a day per caller: says whether the company is tracked, today's open-role count and, once the series is long enough, the 7-day change. Compiled by an AI from public careers boards, not human-reviewed; removal on request.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "the company's website domain (no www), for example example-co.test",
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1b8abaa7ed8d5c6c4264400b8a2b92466b7be0572a983854f528a1aaa9e275f"
        },
        {
          "name": "request_api_key",
          "description": "Email a free API key link (300 calls a day) to the user's address. Ask the user for their email first; they open the link once to see the key, then set it as the x-api-key header of this connection.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "the user's email address",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e208408fe7ec73be975c65ac8c2590259afadeadc01d215a3897a26414116bc"
        }
      ],
      "digest": "sha256:599f942244982f79d5bbb3700b60acc00b6fbc0792fa591beafae787d949feb0"
    }
  }
