{
  "lockfileVersion": 2,
  "subjects": {
    "ai.rxmanager/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.rxmanager.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "rxmanager",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RxManager (rxmanager.ai) — Pharmacy Benefits Intelligence for employer plan sponsors, benefits teams, and claims/RCM professionals. Tools: drug_price_lookup (live CMS NADAC acquisition cost), drug_search (find drugs by name), drug_spread_check (what a plan was charged vs acquisition cost), drug_shortages (current US shortages, FDA data daily), drug_info_lookup (full drug profile: pricing, Part D spending, pipeline), medical_code_lookup (any US claim code: CPT/ICD-10/HCPCS/MS-DRG/CARC denial codes/POS plus MUE limits), pbm_term_explainer (plain-English PBM contract terms), renewal_checklist (dated PBM renewal preparation plan). Free, no auth.",
      "tools": [
        {
          "name": "drug_info_lookup",
          "description": "Full profile of a US prescription drug by brand or generic name: identity and manufacturer, live CMS NADAC acquisition pricing, Medicare Part D spending and utilization, estimated pricing spread, and active clinical-trial pipeline. Broader than drug_price_lookup — use when someone wants the whole picture of a drug.",
          "inputSchema": {
            "properties": {
              "drug": {
                "description": "Brand or generic drug name, e.g. Wegovy, metformin",
                "type": "string"
              }
            },
            "required": ["drug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4ac598b9a26e2ceda0c47569b4461b8564be594c945207a89bc77e7a36ed3851"
        },
        {
          "name": "drug_price_lookup",
          "description": "Look up the live public acquisition cost (CMS NADAC — National Average Drug Acquisition Cost) for a prescription drug in the United States: the per-unit price retail pharmacies actually pay to buy it, by strength, with the effective date. This is the honest baseline for judging what an employer health plan is charged by its PBM. Accepts a brand or generic name (e.g. \"Gleevec\", \"imatinib\", \"atorvastatin\").",
          "inputSchema": {
            "properties": {
              "drug": {
                "description": "Brand or generic drug name",
                "type": "string"
              }
            },
            "required": ["drug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ed1370596c74af2393bfb937fa05519fd68631667503a58267fc21e18b42126a"
        },
        {
          "name": "drug_search",
          "description": "Search US prescription drugs by full or partial brand/generic name. Returns matching drugs with their generic name and brand names, so you can pick the right one before calling drug_price_lookup or drug_spread_check.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Full or partial drug name (min 2 characters)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c66648edea518bd0a9f281e6f1fd7fc9f5632f90ee122a7a5bc4fe9991eda06f"
        },
        {
          "name": "drug_shortages",
          "description": "List current US prescription drug shortages from the FDA Drug Shortage Database (refreshed daily). Optionally filter by drug name or drug class. Returns the generic name, brand names, how long the shortage has been running, and how many manufacturers are affected. Useful for checking whether a drug a plan or patient depends on is in shortage before a refill or formulary decision.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Optional drug name or class to filter by (omit to list the most recent shortages)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d44073cca71278cc8c69c9d27aec3349b72414bf5dac6f4b84364ce3495549e4"
        },
        {
          "name": "drug_spread_check",
          "description": "Compare what a US health plan was actually charged for a prescription fill against the live public acquisition cost (CMS NADAC) for the same quantity. Returns the acquisition cost, the amount charged, the gap, and the multiple. Use when someone asks \"my plan paid $X for [drug] — is that high?\". The gap is not all margin (a dispensing fee and claim administration are legitimate), but on most generics the legitimate part is a few dollars, not hundreds.",
          "inputSchema": {
            "properties": {
              "amount_charged": {
                "description": "What the plan (or member) was charged for the fill, in USD",
                "type": "number"
              },
              "drug": {
                "description": "Brand or generic drug name",
                "type": "string"
              },
              "units": {
                "description": "Units in the fill (e.g. tablets). Default 30.",
                "type": "number"
              }
            },
            "required": ["amount_charged", "drug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96dae48b3dac4f9926b66ea4c0c8584ae2b62aeaf27f6aae71b0fbc5dd8ae305"
        },
        {
          "name": "medical_code_lookup",
          "description": "Look up any US medical claim code across all major code sets at once: CPT (with 2025 RVUs), ICD-10-CM diagnoses, HCPCS Level II, MS-DRG payment groups, CARC denial reason codes (accepts EOB formats like CO-45 or PR-1), and place-of-service codes — plus Medicare MUE unit limits and NCCI bundling-edit counts. Official CMS/CDC/X12 data. Use when someone has a code from a medical bill, claim, EOB, or denial letter.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The code, e.g. 99213, E11.9, J1885, 470, or CO-45",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7981d19ff59988854c303f0bbc6272ee4f707d1dd8e293fb0413de4858b1c462"
        },
        {
          "name": "pbm_term_explainer",
          "description": "Plain-English explanation of pharmacy benefit (PBM) contract terms that drive employer plan cost: spread pricing, pass-through pricing, AWP, WAC, NADAC, MAC, rebates, rebate pass-through, effective rate guarantees, lesser-of logic, DIR fees, audit rights. Each explanation includes what to watch for in a contract. Call with a specific term, or without one to list all terms.",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "The contract term to explain (optional — omit to list all)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b58d9555efda96b596fbe733a9fc107a8fa4d37dcdc98c5716ba88321dcc0c1f"
        },
        {
          "name": "renewal_checklist",
          "description": "Generate a dated preparation checklist for an employer pharmacy-benefit (PBM) contract renewal. Given the renewal date, returns what a plan sponsor should request and do at 120, 90, 60, and 30 days out — contract and exhibits, claims data, rebate reconciliation, benchmark review, and the decision record. Deterministic and vendor-neutral.",
          "inputSchema": {
            "properties": {
              "renewal_date": {
                "description": "Renewal date, ISO format YYYY-MM-DD (e.g. 2027-01-01)",
                "type": "string"
              }
            },
            "required": ["renewal_date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1ebc0f0ce1711eff5de2a52eb301bf2b7c68d854150865437fc8e8dcbf764c6c"
        }
      ],
      "digest": "sha256:bcaa98a1efbe2cbab47bd5ecb051890e39fe02ae0866666d36d9a56abae94f76"
    }
  }
}
