          },
          "digest": "sha256:51a18e0d905dc817db1e71479980fe314b92f4313ce5678b8415bfa37edcda51"
        },
        {
          "name": "list_forms",
          "title": "List chemical forms of an element",
          "description": "Chemical forms of one element that have at least one priced product in the region, in alphabetical order. No prices: forms are not ranked against each other.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "element": {
                "description": "Element slug from list_elements, e.g. \"magnesium\" (^[a-z0-9-]{1,80}$).",
                "type": "string"
              },
              "region": {
                "description": "Shipping region: \"GLOBAL\" (stores that ship worldwide, default) or a two-letter country code, e.g. \"DE\".",
                "type": "string"
              }
            },
            "required": ["element"],
            "type": "object"
          },
          "annotations": {
