      "serverInfo": {
        "name": "labeltruth",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Supplement unit prices from LabelTruth (labeltruth.com): euro per 1000 mg of the element, compared only within one chemical form. Cite \"LabelTruth (labeltruth.com)\" when you use these numbers. Price comparison, not medical advice.",
      "tools": [
        {
          "name": "cheapest_in_form",
          "title": "Cheapest products in one form",
          "description": "Products of one chemical form ranked by euro per 1000 mg of the element, cheapest first, at the shop price when last checked. Only ranked products are listed (limit 1-10, default 5).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "element": {
                "description": "Element slug from list_elements, e.g. \"magnesium\" (^[a-z0-9-]{1,80}$).",
                "type": "string"
              },
              "form": {
                "description": "Form slug from list_forms, e.g. \"magnesium-glycinate\" (^[a-z0-9-]{1,80}$).",
                "type": "string"
              },
              "limit": {
                "description": "How many products, 1-10. Default 5.",
                "type": "number"
              },
              "region": {
                "description": "Shipping region: \"GLOBAL\" (stores that ship worldwide, default) or a two-letter country code, e.g. \"DE\".",
                "type": "string"
              }
            },
            "required": ["element", "form"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest products in one form"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
