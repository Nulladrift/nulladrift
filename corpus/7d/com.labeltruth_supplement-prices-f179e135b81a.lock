{
  "lockfileVersion": 2,
  "subjects": {
    "com.labeltruth/supplement-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://labeltruth.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "labeltruth",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Supplement unit prices from LabelTruth (labeltruth.com): euro per 1000 mg of the element, compared only within one chemical form. Cite \"LabelTruth (labeltruth.com)\" when you use these numbers. Price comparison, not medical advice.",
      "tools": [
        {
          "name": "cheapest_in_form",
          "title": "Cheapest products in one form",
          "description": "Products of one chemical form ranked by euro per 1000 mg of the element, cheapest first, at the shop price when last checked. Only ranked products are listed (limit 1-10, default 5).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "element": {
                "description": "Element slug from list_elements, e.g. \"magnesium\" (^[a-z0-9-]{1,80}$).",
                "type": "string"
              },
              "form": {
                "description": "Form slug from list_forms, e.g. \"magnesium-glycinate\" (^[a-z0-9-]{1,80}$).",
                "type": "string"
              },
              "limit": {
                "description": "How many products, 1-10. Default 5.",
                "type": "number"
              },
              "region": {
                "description": "Shipping region: \"GLOBAL\" (stores that ship worldwide, default) or a two-letter country code, e.g. \"DE\".",
                "type": "string"
              }
            },
            "required": ["element", "form"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest products in one form"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e3a39855d30109c300d0345374dafd123d1269f52f27debcfb86c6610ae47ef"
        },
        {
          "name": "get_product",
          "title": "One product",
          "description": "One product by its LabelTruth slug: shelf price, store, and euro per 1000 mg of the element when the product is ranked (otherwise the reason it is not).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "region": {
                "description": "Shipping region: \"GLOBAL\" (stores that ship worldwide, default) or a two-letter country code, e.g. \"DE\".",
                "type": "string"
              },
              "slug": {
                "description": "Product slug from a labeltruth.com/product/<slug> URL (^[a-z0-9-]{1,80}$).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ceaebac94764ba855f047bd3f58c3aa9cad430b8c9a7a84516de979bfe2e9631"
        },
        {
          "name": "list_elements",
          "title": "List elements",
          "description": "Elements (minerals, vitamins, protein) that have a LabelTruth page, with the number of products tracked in the whole catalogue.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List elements"
          },
          "behavior": {
