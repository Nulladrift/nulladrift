        },
        {
          "name": "get_product",
          "title": "One product",
          "description": "One product by its LabelTruth slug: shelf price, store, and euro per 1000 mg of the element when the product is ranked (otherwise the reason it is not).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "region": {
                "description": "Shipping region: \"GLOBAL\" (stores that ship worldwide, default) or a two-letter country code, e.g. \"DE\".",
                "type": "string"
              },
              "slug": {
                "description": "Product slug from a labeltruth.com/product/<slug> URL (^[a-z0-9-]{1,80}$).",
