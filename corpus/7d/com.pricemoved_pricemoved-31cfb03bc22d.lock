{
  "lockfileVersion": 2,
  "subjects": {
    "com.pricemoved/pricemoved": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pricemoved.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "pricemoved",
        "title": "PriceMoved",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PriceMoved is a competitor pricing-page monitor that is currently waitlist-only: monitoring, sign-in and checkout are not live yet, and this server never fetches or diffs pages. Tools: product_info returns the planned plans and early prices (USD, subject to change), what is available now, and links (waitlist, privacy, terms). robots_check fetches one site's robots.txt (capped size, 5 s timeout) and reports whether PriceMovedBot may fetch the given URL; it is limited to about 10 checks per minute and 30 per hour per network, and results are cached for 10 minutes. No key is needed. To join the waitlist, a person must use the form on the homepage.",
      "tools": [
        {
          "name": "product_info",
          "title": "PriceMoved product info and early pricing",
          "description": "Facts about PriceMoved, a pricing-page change monitor that is waitlist-only today: what is available now, the planned Free/Starter/Pro plans (pages, check intervals, Slack, history) with early USD prices that are subject to change, the crawler user agent, and links to the waitlist, privacy policy and terms. No network calls. Same data as GET /api/product.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available_now": {
                "type": "string"
              },
              "contact": {
                "type": "string"
              },
              "crawler": {
                "properties": {
                  "info_url": {
                    "type": "string"
                  },
                  "respects_robots_txt": {
                    "type": "boolean"
                  },
                  "robots_token": {
                    "type": "string"
                  },
                  "user_agent": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "links": {
                "properties": {
                  "homepage": {
                    "type": "string"
                  },
                  "privacy": {
                    "type": "string"
                  },
                  "terms": {
                    "type": "string"
                  },
                  "waitlist": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "pricing": {
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "early_pricing_subject_to_change": {
                    "type": "boolean"
                  },
                  "heading": {
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "plans": {
                    "items": {
                      "properties": {
                        "email_alerts": {
                          "type": "boolean"
                        },
                        "history_days": {
                          "type": "number"
                        },
                        "id": {
                          "type": "string"
                        },
                        "intervals": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "name": {
                          "type": "string"
                        },
                        "pages": {
                          "type": "number"
                        },
                        "price_usd_per_month": {
                          "type": "number"
                        },
                        "slack_webhook": {
                          "type": "boolean"
                        }
                      },
                      "required": ["history_days", "id", "intervals", "name", "pages", "price_usd_per_month", "slack_webhook"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "status": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "version": {
                "type": "string"
              }
            },
            "required": ["available_now", "links", "name", "pricing", "status", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a23e7a8da4de2b4bfb698c940bd614d0244a32ebd6061277c2443deacbab6a46"
        },
        {
          "name": "robots_check",
          "title": "Check whether a site's robots.txt allows PriceMovedBot",
          "description": "Fetch the robots.txt of the given public http(s) URL's site (at most 500 KiB, 5 s timeout, redirects followed) and report whether PriceMovedBot is allowed to fetch that URL under RFC 9309 rules: verdict allowed, disallowed, or skipped (robots.txt unreachable, 5xx/429, or too complex: PriceMoved would not fetch). Does not fetch the page itself. Domain names only (no IP addresses or ports). About 10 checks per minute and 30 per hour per network; results cached 10 minutes. Same engine as GET /api/robots-check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL of the page, e.g. https://example.com/pricing",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "allowed": {
                "type": "boolean"
              },
              "cached": {
                "type": "boolean"
              },
              "checked_at": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "robots_url": {
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "user_agent": {
                "type": "string"
              },
              "verdict": {
                "enum": ["allowed", "disallowed", "skipped"],
                "type": "string"
              },
              "version": {
                "type": "string"
              }
            },
            "required": ["allowed", "cached", "checked_at", "note", "robots_url", "url", "verdict", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "robots.txt check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:70c39dd435fca5a4cff495f61fa5ccdb38de2e1fa609cd2356bb589453177ce1"
        }
      ],
      "digest": "sha256:635b8fb040874074e004a1d947adb1469b145251d8383aee2dc37188621169d6"
    }
  }
}
