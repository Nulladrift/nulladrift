{
  "lockfileVersion": 2,
  "subjects": {
    "com.canalnav/canal-nav": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.canalnav.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "canal-nav",
        "title": "Canal Nav",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Canal Nav plans real boat journeys on the inland waterways of Great Britain (canals and navigable rivers). Routes follow the water itself, not roads, with lock-aware timing, live closure and stoppage data from every GB navigation authority, boat-dimension fit warnings and tidal safety warnings. Use plan_route for A to B journeys, plan_round_trip for return-to-start cruises, get_closures for stoppage lookups, will_my_boat_fit for dimension checks, find_place to disambiguate place names, and search_directory for waterside businesses. Places can be given by name or as \"lat,lon\" coordinates. The live map is at https://maps.canalnav.com/.",
      "tools": [
        {
          "name": "find_place",
          "title": "Find a place on the waterways",
          "description": "Look up a place name on the British inland waterway network and return matching locations with coordinates (marinas, moorings, water points and other waterside facilities). Use it to disambiguate a place before calling plan_route or plan_round_trip, or to get coordinates for a known spot. Results are waterway locations only; it is not a general geocoder.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Place or facility name to search for, e.g. \"Braunston\" or \"Aston Marina\".",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f5653198f50faed80727cd62a7a40e070bc33441c622c579bd6252f7830454b"
        },
        {
          "name": "get_closures",
          "title": "Get closures and stoppages",
          "description": "Live closure, stoppage and restriction notices for the inland waterways of Great Britain, covering every GB navigation authority: Canal & River Trust, Environment Agency, Scottish Canals, Broads Authority, Bridgewater, Middle Level, River Wey, Basingstoke and more, not just CRT. Search near a place (name or \"lat,lon\", with an optional radius) or by waterway name (e.g. \"Oxford Canal\"). Returns active and upcoming notices with dates, the responsible authority, whether each one blocks navigation, and links for detail. Data refreshes from the authorities' published notices, so reopen dates reflect the latest updates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "place": {
                "description": "A place name or \"lat,lon\" coordinates to search around. Give this or waterway.",
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius around the place in km. Default 25.",
                "maximum": 150,
                "minimum": 1,
                "type": "number"
              },
              "waterway": {
                "description": "A waterway name to match notices against (e.g. \"Grand Union Canal\"). Give this or place.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1566a8bea6cabbb778b2bdf38019fb5a747c7fb873ff66088064756ddfc735c9"
        },
        {
          "name": "plan_round_trip",
          "title": "Plan a round trip",
          "description": "Plan return-to-start cruises from a point on the inland waterways of Great Britain, sized to fit a number of days. Returns several options: circular loops where the canal network offers one (canal \"rings\"), plus out-and-back and fewest-locks alternatives, each with distance, lock count, day-by-day plan and suggested overnight moorings. Timing is lock-aware and closures from every GB navigation authority are flagged on each option. Give boat dimensions to get fit warnings, and routes touching tidal water carry a tidal safety warning. The start can be a place name or \"lat,lon\" coordinates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "boat_air_draught": {
                "description": "Boat air draught (height above the waterline, for bridges and tunnels). Metres or feet/inches.",
                "type": ["number", "string"]
              },
              "boat_beam": {
                "description": "Boat beam (width). Metres by default (e.g. 2.08), or feet/inches (e.g. \"6'10\\\"\").",
                "type": ["number", "string"]
              },
              "boat_draught": {
                "description": "Boat draught (depth below the waterline). Metres or feet/inches.",
                "type": ["number", "string"]
              },
              "boat_length": {
                "description": "Boat length. Metres by default (e.g. 17.4), or a feet/inches string (e.g. \"57ft\").",
                "type": ["number", "string"]
              },
              "cruising_hours_per_day": {
                "description": "Cruising hours per day. Default 6.",
                "maximum": 16,
                "minimum": 1,
                "type": "number"
              },
              "date": {
                "description": "Start date (YYYY-MM-DD) for closure checking. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "description": "Number of days the round trip should fit in.",
                "maximum": 28,
                "minimum": 1,
                "type": "integer"
              },
              "lock_minutes": {
                "description": "Minutes to work through one lock. Default 15.",
                "maximum": 90,
                "minimum": 1,
                "type": "number"
              },
              "start": {
                "description": "Start (and finish) point: a place name on the waterways or \"lat,lon\" coordinates.",
                "type": "string"
              }
            },
            "required": ["days", "start"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1a556beef1ccfa44ed60e2d5e477e2b9ea3f3c819f124ff67820ce8bb49b970"
        },
        {
          "name": "plan_route",
          "title": "Plan a canal route",
          "description": "Plan a boat journey between two points on the inland waterways of Great Britain (canals and navigable rivers). The route follows the water itself, not roads. It counts every lock and estimates cruising time from realistic boat speed plus time per lock. Live closures and stoppages from every GB navigation authority (Canal & River Trust, Environment Agency, Scottish Canals, Broads Authority and others) are routed around automatically, and when a dated closure blocks the natural line the result compares waiting for it to reopen against taking the detour. Give boat dimensions to get per-waterway fit warnings (too long, too wide, too deep, too tall for a waterway on the route). Routes that cross tidal water carry a tidal safety warning. Places can be names (resolved on the waterway network) or \"lat,lon\" coordinates. If a name matches several distinct locations the tool returns the candidates instead of guessing; call again with the chosen one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "boat_air_draught": {
                "description": "Boat air draught (height above the waterline, for bridges and tunnels). Metres or feet/inches.",
                "type": ["number", "string"]
              },
              "boat_beam": {
                "description": "Boat beam (width). Metres by default (e.g. 2.08), or feet/inches (e.g. \"6'10\\\"\").",
                "type": ["number", "string"]
              },
              "boat_draught": {
                "description": "Boat draught (depth below the waterline). Metres or feet/inches.",
                "type": ["number", "string"]
              },
              "boat_length": {
                "description": "Boat length. Metres by default (e.g. 17.4), or a feet/inches string (e.g. \"57ft\").",
                "type": ["number", "string"]
              },
              "cruising_hours_per_day": {
                "description": "Cruising hours per day, used to split the journey into days with suggested overnight moorings. Default 6.",
                "maximum": 16,
                "minimum": 1,
                "type": "number"
              },
              "date": {
                "description": "Departure date (YYYY-MM-DD) for closure checking. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "Start point: a place name on the waterways (e.g. \"Braunston Marina\") or \"lat,lon\" coordinates.",
                "type": "string"
              },
              "lock_minutes": {
                "description": "Minutes to work through one lock. Default 15. Experienced crews may use 10, single-handers 20 or more.",
                "maximum": 90,
                "minimum": 1,
                "type": "number"
              },
              "to": {
                "description": "Destination: a place name or \"lat,lon\" coordinates.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86748a07bbab53ba5068b05cd05981fd332abb16f7c5a2fbed105eef154ed612"
        },
        {
          "name": "search_directory",
          "title": "Search the waterways business directory",
          "description": "Search Canal Nav's directory of waterside businesses on the British inland waterways: marinas, chandleries, boat hire, boatyards, pump-out and services, fuel, moorings, surveyors, brokerage, and canalside food and pubs. Filter by free text, category, or proximity to a place. Listings marked unclaimed can be claimed for free by the business owner at https://canalnav.com/.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Directory category to filter by.",
                "enum": ["marina", "chandlery", "hire", "boatyard", "services", "fuel", "moorings", "surveyor", "brokerage", "food", "trade", "other"],
                "type": "string"
              },
              "near": {
                "description": "A place name or \"lat,lon\" to search around (approx. 15 km).",
                "type": "string"
              },
              "query": {
                "description": "Free-text search over business names and descriptions.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:30470df9a022cfcf91ed3737e99b444affe799d091b362ff8afc5f7f22ccc018"
        },
        {
          "name": "will_my_boat_fit",
          "title": "Will my boat fit a waterway",
          "description": "Check boat dimensions against the published maximum craft dimensions for a named British waterway (length, beam, draught and air draught, from Canal & River Trust published figures covering the full CRT network). Returns a per-dimension verdict quoting the limit. Draught and headroom vary with water level and silting, so treat the answer as advisory. For a whole journey, use plan_route with boat dimensions instead: it checks every waterway along the route.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "boat_air_draught": {
                "description": "Boat air draught (height above the waterline, for bridges and tunnels). Metres or feet/inches.",
                "type": ["number", "string"]
              },
              "boat_beam": {
                "description": "Boat beam (width). Metres by default (e.g. 2.08), or feet/inches (e.g. \"6'10\\\"\").",
                "type": ["number", "string"]
              },
              "boat_draught": {
                "description": "Boat draught (depth below the waterline). Metres or feet/inches.",
                "type": ["number", "string"]
              },
              "boat_length": {
                "description": "Boat length. Metres by default (e.g. 17.4), or a feet/inches string (e.g. \"57ft\").",
                "type": ["number", "string"]
              },
              "waterway": {
                "description": "Waterway name, e.g. \"Ashby Canal\" or \"Llangollen Canal\".",
                "type": "string"
              }
            },
            "required": ["waterway"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:84cfc2f2d504b3b219ec866fee1c9e71afef3c2df162bcefbf56aaf104f679f4"
        }
      ],
      "digest": "sha256:c043be34476b0a5025cf4b0400b08be804ecd987cffc518abd56ac1030ee72b1"
    }
  }
}
