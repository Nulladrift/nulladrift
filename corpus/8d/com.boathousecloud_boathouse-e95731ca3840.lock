{
  "lockfileVersion": 2,
  "subjects": {
    "com.boathousecloud/boathouse": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.boathousecloud.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "boathouse",
        "version": "0.3"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Boathouse is a small cloud: a workspace deploys folder-with-a-Dockerfile tools that become login-protected URLs (https://<tool>.<workspace domain>), shares them by email at three tiers (viewer, editor, admin), keeps their source, secrets, logs and releases, and buys domains. Every tool below acts as the workspace whose project key you send: set the header Authorization: Bearer <project key> on this MCP connection (minted on the workspace's account page, or with `bh keys create`). The server is stateless: no session id, no server-to-client stream. Anything that spends money (domain_buy, topup) quotes first and only acts with confirm true.",
      "tools": [
        {
          "name": "access_requests",
          "description": "Everyone waiting to be let into one of this workspace's tools: request id, email, tier asked for, and their message. Owners and tool admins.",
          "inputSchema": {
            "properties": {
              "workspace": {
                "description": "Workspace slug to act in. Use this when you belong to several workspaces; whoami lists them.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:deb931fca54e0b94cc1432a0e3126f33188e70b2261d3c53156e7dbb4761aa6f"
        },
        {
          "name": "allow_request",
          "description": "Let a waiting person in at the tier they asked for. Their tool grant is made and they get an email saying what to do next. Owners and tool admins.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The request id from access_requests.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug to act in. Use this when you belong to several workspaces; whoami lists them.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
