        {
          "name": "deploy",
          "description": "Deploy a folder as a tool and make it live at https://<tool>.<workspace domain>. Send the whole folder in `files`, which MUST include a top-level Dockerfile whose process listens on $PORT (8080). Creates the tool on the first deploy; afterwards it replaces the running container. If you got these files from `pull`, pass the release number you pulled as `base` so a deploy someone else made in the meantime is not silently overwritten.",
          "inputSchema": {
            "properties": {
              "base": {
                "description": "The release number these files were pulled from. The deploy is refused with STALE_BASE if a newer release is live.",
                "type": "integer"
              },
              "base64": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Optional binary files: relative path -> base64 of the bytes.",
                "type": "object"
              },
              "files": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "The folder: relative path -> the file's text content, e.g. {\"Dockerfile\": \"FROM python:3.12-slim\\n...\", \"app.py\": \"...\"}. No leading slash and no '..' in paths.",
                "type": "object"
              },
              "name": {
                "description": "Human name for the tool, used when it is created (e.g. 'CRCS Finance').",
                "type": "string"
              },
              "note": {
                "description": "Why this release exists; shown in the release list.",
                "type": "string"
              },
              "tool": {
                "description": "The tool's short name, for example 'finance', or 'acme/finance' to select its workspace.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug to act in. Use this when you belong to several workspaces; whoami lists them.",
                "type": "string"
              }
            },
            "required": ["files", "tool"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c9c9e7267b227b52a86ec5f699b2ad986828c8e0c4af9bc0fc27e955e795f38b"
        },
