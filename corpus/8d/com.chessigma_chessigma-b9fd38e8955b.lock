      },
      "transport": {
        "type": "http",
        "url": "https://www.chessigma.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "chessigma-mcp",
        "title": "Chessigma",
        "version": "2.0.0",
        "websiteUrl": "https://www.chessigma.com/developers/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "analyze_game",
          "title": "Analyze Game",
          "description": "Summarize a chess game given as a PGN or as plain SAN movetext: players, result, number of plies, the opening and how long it followed theory, how the game ended (checkmate, stalemate, draw by rule, or unfinished or resigned) and the final position. Returns a link that opens the whole game on the chessigma.com analysis board, where the Stockfish engine runs in the user's browser, and, when the PGN's Link or Site tag is a Chess.com live game or a Lichess game, a link to that game's move-by-move review. It never evaluates moves itself and stores nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "pgn": {
                "description": "The game as PGN, or SAN movetext such as \"1. e4 e5 2. Nf3\".",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pgn"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "analysisUrl": {
                "type": ["string", "null"]
              },
              "black": {
                "type": ["string", "null"]
              },
              "ending": {
                "enum": ["checkmate", "stalemate", "draw_by_rule", "unfinished_or_resigned"],
                "type": "string"
              },
              "finalFen": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "opening": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "bookPlies": {
                        "type": "integer"
                      },
                      "eco": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": ["bookPlies", "eco", "name"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "plies": {
                "type": "integer"
              },
              "result": {
                "type": "string"
              },
              "reviewUrl": {
                "type": ["string", "null"]
              },
              "white": {
                "type": ["string", "null"]
              }
            },
            "required": ["analysisUrl", "black", "ending", "finalFen", "note", "opening", "plies", "result", "reviewUrl", "white"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze Game"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a151f1b7ef14d162572074dfe61c8bb6280fd796afc332fc8cfbb11c790f7570"
        },
        {
          "name": "analyze_position",
          "title": "Analyze Position",
          "description": "Read a chess position from a FEN and return facts computed by the rules alone: side to move, status (normal, check, checkmate, stalemate or insufficient material), every legal move in SAN, the material count (pawn 1, knight 3, bishop 3, rook 5, queen 9) and the opening name when the position is a catalogued opening. This tool does not evaluate the position and does not choose a best move: the Stockfish engine runs in the user's browser at the returned analysisUrl (full analysis board) and bestMoveUrl (best move finder) on chessigma.com.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "fen": {
                "description": "The position in FEN. The two move counters may be omitted.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["fen"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "analysisUrl": {
                "type": "string"
              },
              "bestMoveUrl": {
                "type": "string"
              },
              "fen": {
                "type": "string"
              },
              "legalMoves": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "material": {
                "additionalProperties": false,
                "properties": {
                  "balance": {
                    "type": "number"
                  },
                  "black": {
                    "type": "number"
                  },
                  "white": {
                    "type": "number"
                  }
                },
                "required": ["balance", "black", "white"],
                "type": "object"
              },
              "opening": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "eco": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": ["eco", "name"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sideToMove": {
                "enum": ["white", "black"],
                "type": "string"
              },
              "status": {
                "enum": ["normal", "check", "checkmate", "stalemate", "insufficient_material"],
                "type": "string"
              }
            },
            "required": ["analysisUrl", "bestMoveUrl", "fen", "legalMoves", "material", "opening", "sideToMove", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze Position"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d551849285174d6243ac0af4ca6d11d95f2db077b211d7fad958b9f40ebf693"
        },
        {
          "name": "calculate_elo",
          "title": "Calculate Elo",
          "description": "Estimate a player's new Elo rating after a single game with the Elo formula. Pure arithmetic, no chess engine. The system field picks a K-factor default for FIDE, Chess.com or Lichess, but the result is an Elo estimate: Chess.com and Lichess use Glicko ratings, so their real rating changes differ.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kFactor": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "opponentRating": {
                "maximum": 4000,
                "minimum": 100,
                "type": "integer"
              },
              "result": {
                "enum": ["win", "draw", "loss"],
                "type": "string"
              },
              "system": {
                "default": "fide",
                "enum": ["fide", "chesscom", "lichess"],
                "type": "string"
              },
              "yourRating": {
                "maximum": 4000,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["opponentRating", "result", "yourRating"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calculatorUrl": {
                "type": "string"
              },
              "change": {
                "type": "number"
              },
              "expectedScore": {
                "type": "number"
              },
              "kFactor": {
                "type": "number"
              },
              "newRating": {
                "type": "number"
              },
              "opponentRating": {
                "type": "number"
              },
              "result": {
                "enum": ["win", "draw", "loss"],
                "type": "string"
              },
              "system": {
                "enum": ["fide", "chesscom", "lichess"],
                "type": "string"
              },
              "yourRating": {
                "type": "number"
              }
            },
            "required": ["calculatorUrl", "change", "expectedScore", "kFactor", "newRating", "opponentRating", "result", "system", "yourRating"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate Elo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f24c469d9b19243ea46b1cb16a3d77c831bb6cda2b111cfdb8ad304bd9208f41"
        },
        {
          "name": "get_daily_puzzle",
          "title": "Get Daily Puzzle",
          "description": "Get Chessigma's daily chess puzzle: today's by default, or a past day's via date (YYYY-MM-DD, from 2024-01-01 to today in UTC). The position (fen) is given with the solver to move, after the opponent's last move. The solution is in SAN, with the solver's moves at even indexes and the opponent's replies at odd ones. Do not reveal the solution unless the user asks for it. If today's puzzle is not out yet, the latest one is returned: check date. playUrl opens the puzzle on chessigma.com.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "A day from 2024-01-01 to today (UTC). Omit for today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "type": "string"
              },
              "fen": {
                "type": "string"
              },
              "opponentLastMove": {
                "type": "string"
              },
              "playUrl": {
                "type": "string"
              },
              "puzzleId": {
                "type": "string"
              },
              "rating": {
                "type": "number"
              },
              "sideToMove": {
                "enum": ["white", "black"],
                "type": "string"
              },
              "solution": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "themes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["date", "fen", "opponentLastMove", "playUrl", "puzzleId", "rating", "sideToMove", "solution", "themes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Daily Puzzle"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:652348626d04b8f0b988cdf15f4088c5feeb2b3e0e0ea090fe3c6a54888873f8"
        },
        {
          "name": "get_opening_guide",
          "title": "Opening Guide",
          "description": "Look up a chess opening by name or slug (for example \"London System\", \"Caro-Kann\" or \"sicilian-defense\") and return Chessigma's guide to it: the main line in SAN, a short summary, up to four key variations with the idea behind each, the strategy for each side, strengths and weaknesses. Full guides exist for 18 popular openings; any of about 3,700 catalogued opening names returns its name, ECO code and moves. When nothing matches, found is false and suggestions lists close names. Links open the opening's trainer and the analysis board on chessigma.com.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "opening": {
                "description": "Opening name or slug, e.g. \"London System\", \"caro-kann\", \"Sicilian Najdorf\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["opening"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "analysisUrl": {
                "type": ["string", "null"]
              },
              "eco": {
                "type": ["string", "null"]
              },
              "found": {
                "type": "boolean"
              },
              "ideas": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "black": {
                        "type": "string"
                      },
                      "white": {
                        "type": "string"
                      }
                    },
                    "required": ["black", "white"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "mainLine": {
                "type": ["string", "null"]
              },
              "name": {
                "type": ["string", "null"]
              },
              "strengths": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "suggestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "type": ["string", "null"]
              },
              "trainerUrl": {
                "type": ["string", "null"]
              },
              "variations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "idea": {
                      "type": "string"
                    },
                    "moves": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["idea", "moves", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "weaknesses": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["analysisUrl", "eco", "found", "ideas", "mainLine", "name", "strengths", "suggestions", "summary", "trainerUrl", "variations", "weaknesses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Opening Guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5eec0a5b88fba816cde13c971e33c85aaa931e95dc9cba8a73294646b19d0477"
        },
        {
          "name": "identify_opening",
          "title": "Identify Opening",
          "description": "Identify the chess opening of a move sequence, given as SAN movetext (\"1. e4 c5 2. Nf3 d6\") or a full PGN. Returns the ECO code and name from a catalogue of about 3,700 named lines, how many half-moves (plies) followed known theory from move one, the first move that left it, a link to Chessigma's trainer when the opening has one, and a link that opens the moves on the chessigma.com analysis board.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "moves": {
                "description": "SAN movetext or a PGN; tags are optional.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["moves"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "analysisUrl": {
                "type": ["string", "null"]
              },
              "bookPlies": {
                "type": "integer"
              },
              "eco": {
                "type": ["string", "null"]
              },
              "found": {
                "type": "boolean"
              },
              "leftBookAt": {
                "type": ["string", "null"]
              },
              "name": {
                "type": ["string", "null"]
              },
              "trainerUrl": {
                "type": ["string", "null"]
              }
            },
            "required": ["analysisUrl", "bookPlies", "eco", "found", "leftBookAt", "name", "trainerUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Identify Opening"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cd7f933c6daadbf72c5a2ed01bc77bbd124432582bc31acefde5fa7f0c93dd5"
        },
        {
          "name": "review_online_game",
          "title": "Review Online Game",
          "description": "Turn the link of a public Chess.com live game or a Lichess game into a chessigma.com link that imports the game and opens a move-by-move review, computed by Stockfish in the user's browser. Nothing is fetched when this tool runs: the game is read from Chess.com or Lichess only when the user opens the link. Chess.com daily (correspondence) games are not supported; ask for the PGN instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "A Chess.com live game link or a Lichess game link.",
                "maxLength": 300,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "note": {
                "type": "string"
              },
              "platform": {
                "enum": ["chesscom", "lichess"],
                "type": "string"
              },
              "reviewUrl": {
                "type": "string"
              }
            },
            "required": ["note", "platform", "reviewUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Review Online Game"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:30820315a533f310159093a69f7a330c471e7f7b7dcaeb7402759e7abc520c24"
        }
      ],
