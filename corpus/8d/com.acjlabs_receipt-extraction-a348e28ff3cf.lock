{
  "lockfileVersion": 2,
  "subjects": {
    "com.acjlabs/receipt-extraction": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://receipt-extraction.acjlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "receipt-extraction",
        "version": "0.1.6",
        "description": "AU GST/ABN-aware receipt & invoice extraction — applies documented AU entertainment/ITC tax-code rules per line item, returning a tax_code, a confidence and a rationale for each, not just OCR text. You supply the document; get validated structured JSON: vendor, line items, tax, totals.",
        "websiteUrl": "https://github.com/acjlabs/receipt-extraction"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "extract_receipt",
          "title": "Extract Receipt",
          "description": "Extracts a structured Receipt (vendor, ABN-checked, GST-aware line items and totals) from a base64-encoded receipt or invoice image/PDF.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "document_base64": {
                "maxLength": 10000000,
                "type": "string"
              },
              "mime_type": {
                "type": "string"
              }
            },
            "required": ["document_base64", "mime_type"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "type": "string"
              },
              "line_items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "confidence": {
                      "type": "number"
                    },
                    "description": {
                      "type": "string"
                    },
                    "gst": {
                      "type": "number"
                    },
                    "qty": {
                      "type": "number"
                    },
                    "rationale": {
                      "type": "string"
                    },
                    "tax_code": {
                      "enum": ["taxable", "gst_free", "entertainment_denied"],
                      "type": "string"
                    },
                    "unit_price": {
                      "type": "number"
                    }
                  },
                  "required": ["confidence", "description", "gst", "qty", "rationale", "tax_code", "unit_price"],
                  "type": "object"
                },
                "type": "array"
              },
              "schema_version": {
                "const": "1.0",
                "type": "string"
              },
              "totals": {
                "additionalProperties": false,
                "properties": {
                  "gst": {
                    "type": "number"
                  },
                  "subtotal": {
                    "type": "number"
                  },
                  "total": {
                    "type": "number"
                  }
                },
                "required": ["gst", "subtotal", "total"],
                "type": "object"
              },
              "vendor": {
                "additionalProperties": false,
                "properties": {
                  "abn": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "abn_valid": {
                    "type": "boolean"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["abn", "abn_valid", "name"],
                "type": "object"
              }
            },
            "required": ["date", "line_items", "schema_version", "totals", "vendor"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:12cf5d54ba8319663dd3ed0d4d64e860f3bc0581fec09eac829ca14de17cd82b"
        }
      ],
      "digest": "sha256:55cedc7b3fe738db98f61ab72d853d7178a2dbb7b68ae46da63748609ee3832f"
    }
  }
}
