{
  "lockfileVersion": 2,
  "subjects": {
    "be.realbam/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://realbam.be/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bam-catalog",
        "title": "BAM Kaarsen catalog",
        "version": "0.2.25"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only access to the BAM Kaarsen (realbam.be) candle catalog. Start with browse_catalog for the facet tree or search_products for keyword/EAN search; get_product returns full details. All tools accept lang: en, nl or fr.",
      "tools": [
        {
          "name": "browse_catalog",
          "title": "Browse catalog facets",
          "description": "The catalog navigation tree: scents, product types and collections with their ids, for use with list_products.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language for names and descriptions (default en)",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa148d8b9e91ef382dab305d336482e0b601ed5dad3e1df767c3e7572cfe2aeb"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Full details for one product: description, price (EUR, incl. VAT), EAN, live stock, categories, page URL and all image URLs.",
          "inputSchema": {
            "properties": {
              "bam_id": {
                "description": "Product id from search or listing results",
                "type": "integer"
              },
              "lang": {
                "description": "Language for names and descriptions (default en)",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              }
            },
            "required": ["bam_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b604c70a27ebca099efcb4947ea8d06c0a18977293e91a747976b075552cf116"
        },
        {
          "name": "list_products",
          "title": "List products",
          "description": "List catalog products, optionally filtered by exactly one facet id from browse_catalog. Without a filter, returns the whole visible catalog.",
          "inputSchema": {
            "properties": {
              "collection_id": {
                "type": "integer"
              },
              "lang": {
                "description": "Language for names and descriptions (default en)",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              },
              "product_type_id": {
                "type": "integer"
              },
              "scent_id": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53644301e98cc7d5c4a1045e053990cf2a50ba669ad5915d72203bd6a6abdb85"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Fuzzy keyword search over the candle catalog. Matches product names, descriptions and EAN barcodes; multiple words must all match.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language for names and descriptions (default en)",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              },
              "query": {
                "description": "Keywords or an EAN barcode",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1970735a7444f2ca986bb150cdbc5f3f74bd5b85a9af9f414b2c0d7961a81c1b"
        }
      ],
      "digest": "sha256:a4fed6ddf56e528028d43e0867eb79c6598b7a2d4b2493124ea74447765a0378"
    }
  }
}
