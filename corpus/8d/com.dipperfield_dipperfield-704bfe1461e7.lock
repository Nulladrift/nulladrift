                            "type": "string"
                          },
                          "type": "array"
                        },
                        "value": {
                          "type": "number"
                        }
                      },
                      "required": ["formula", "label", "tables", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "tables": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "table": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        },
                        "year": {
                          "type": "number"
                        }
                      },
                      "required": ["table", "title", "url", "year"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["steps", "tables"],
                "type": "object"
