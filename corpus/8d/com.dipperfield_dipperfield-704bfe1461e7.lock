        {
          "name": "plan_this_year",
          "title": "Plan this year’s retirement withdrawals",
          "description": "Answers \"which account should I withdraw from first\" and \"how much should I take from my IRA, brokerage, cash and Roth this year\" for a US retiree household. From income, spending and balances it computes this tax year’s withdrawal mix: RMDs first, then traditional or taxable draws up to the lines the user wants to stay under (ACA subsidy line, an IRMAA tier, the top of a federal bracket, the 0% capital gains ceiling), then cash and Roth, with an optional Roth conversion. For each traditional account at RMD age, ask for the preceding December 31 statement balance; never substitute the current balance. Do not ask before RMD age. Returns the amount from each account in order, federal and covered state tax, AGI and MAGI, room under each line, the tables used, and a link that opens the plan on dipperfield.com. One tax year; read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "acaHouseholdSize": {
                "description": "Household size for the aca line. Defaults to 2 when filing jointly, 1 otherwise.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "birthYear": {
                "description": "Your birth year.",
                "maximum": 2010,
                "minimum": 1900,
                "type": "integer"
              },
              "cash": {
                "description": "Cash available to spend, US dollars.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "convertAmount": {
                "description": "Also convert this fixed amount to Roth, US dollars.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "convertUpTo": {
                "description": "Also convert to Roth up to this line; it must be one of `lines`.",
                "enum": ["bracket-10", "bracket-12", "bracket-22", "bracket-24", "bracket-32", "bracket-35", "ltcg-zero", "irmaa-1", "irmaa-2", "irmaa-3", "irmaa-4", "irmaa-5", "aca"],
                "type": "string"
              },
              "filingStatus": {
                "description": "Federal filing status: single, or mfj (married filing jointly).",
                "enum": ["single", "mfj"],
                "type": "string"
              },
              "fillOrder": {
                "description": "Which taxable source to draw first. Default traditional-first.",
                "enum": ["traditional-first", "taxable-first"],
                "type": "string"
              },
              "harvestUpTo": {
                "description": "After the conversion, realize long-term gain in the taxable account (sell and buy back) up to this line; it must be one of `lines`, usually ltcg-zero.",
                "enum": ["bracket-10", "bracket-12", "bracket-22", "bracket-24", "bracket-32", "bracket-35", "ltcg-zero", "irmaa-1", "irmaa-2", "irmaa-3", "irmaa-4", "irmaa-5", "aca"],
                "type": "string"
              },
              "lineMargin": {
                "description": "Dollars to stay under every line, room for dividends or interest that land late in the year. Default 0.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "lines": {
                "description": "Lines to stay under, highest priority first, e.g. [\"aca\", \"bracket-12\"]. Taxable withdrawals stop at the tightest line; cash and Roth cover the rest.",
                "items": {
                  "description": "A line to stay under: bracket-N = top of the N% federal bracket; ltcg-zero = 0% long-term capital gains ceiling; irmaa-N = below Medicare IRMAA tier N (estimate); aca = ACA premium tax credit line at 400% of the poverty guideline.",
                  "enum": ["bracket-10", "bracket-12", "bracket-22", "bracket-24", "bracket-32", "bracket-35", "ltcg-zero", "irmaa-1", "irmaa-2", "irmaa-3", "irmaa-4", "irmaa-5", "aca"],
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "nonQualifiedDividends": {
                "description": "Non-qualified dividends, US dollars a year. Default 0.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "otherOrdinary": {
                "description": "Other ordinary income, US dollars a year. Default 0.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
