        {
          "name": "irmaa_check",
          "title": "Check the IRMAA tier for an income",
          "description": "Answers \"will my income trigger IRMAA\" and \"how far am I from the next IRMAA bracket\": the Medicare Part B and Part D income-related surcharge tier for a MAGI and filing status, the monthly and yearly surcharge, and the room before the next tier. The tax year’s MAGI sets premiums two years later, so the latest published CMS tiers stand in as an estimate. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filingStatus": {
                "description": "Federal filing status: single, or mfj (married filing jointly).",
                "enum": ["single", "mfj"],
                "type": "string"
              },
              "magi": {
                "description": "Modified adjusted gross income for IRMAA (AGI plus tax-exempt interest) of the tax year, US dollars a year.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "people": {
                "description": "People on Medicare in the household: 1 or 2 (2 only when filing jointly). Defaults to 2 for mfj, 1 for single.",
                "maximum": 2,
                "minimum": 1,
                "type": "integer"
              },
              "year": {
                "description": "Tax year of the MAGI; premiums are set two years later. 2025, 2026 accepted; defaults to 2026.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["filingStatus", "magi"],
            "type": "object"
          },
          "outputSchema": {
