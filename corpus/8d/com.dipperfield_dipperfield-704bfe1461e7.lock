{
  "lockfileVersion": 2,
  "subjects": {
    "com.dipperfield/dipperfield": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.dipperfield.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "dipperfield",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Dipperfield computes US retirement-withdrawal tax figures from published IRS, SSA, CMS and HHS tables. Every number in a result comes from that computation; each result names the tables and years it used. Results are estimates, not tax, legal or investment advice. plan_this_year, roth_conversion, irmaa_check, aca_subsidy_line and rmd work without an account. account_status, roth_conversion_path, year_end_check, save_plan, email_reminder_subscribe and email_reminder_unsubscribe use the user’s Dipperfield account and ask the user to sign in first. roth_conversion_path, year_end_check and save_plan are available to Dipperfield subscribers. save_plan saves a plan to the user’s Dipperfield account, encrypted so only the user’s browser can open it. Nothing else sent to these tools is stored, and nothing sent to them is logged.",
      "tools": [
        {
          "name": "aca_subsidy_line",
          "title": "Room under the ACA subsidy line",
          "description": "Answers \"how much can I convert without losing the ACA subsidy\" and \"how close am I to the ACA subsidy cliff\": the 400%-of-poverty line for a household size and coverage year, the room under it, the expected contribution, and with a benchmark silver premium the premium tax credit and what filling the room costs. Also \"do I get cost-sharing reductions\" and \"how low does my income need to be for a better silver plan\": the CSR tier (94%, 87% or 73% silver up to 250% of poverty) with its out-of-pocket maximum and room to the tier line; with a state, whether Medicaid or a Basic Health Program covers that income instead, and the Alaska or Hawaii guideline. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "benchmarkMonthly": {
                "description": "Second-lowest-cost silver plan premium a month for the household, if known; adds the credit in dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "coverageYear": {
                "description": "Marketplace coverage year (2026 or 2027). Defaults to 2026.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "householdSize": {
                "description": "People in the tax household.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "magi": {
                "description": "Household MAGI for the premium tax credit (AGI plus tax-exempt interest and non-taxable Social Security) before any Roth conversion, US dollars a year.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "description": "Two-letter state code, if known. Sets Medicaid (expansion states up to 138% FPL), Basic Health Programs (MN, NY, OR, DC up to 200% FPL) and the Alaska and Hawaii poverty guidelines.",
                "enum": ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "DC", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY"],
                "type": "string"
              }
            },
            "required": ["householdSize", "magi"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "applicablePercentage": {
                "type": ["number", "null"]
              },
              "contributionAtLine": {
                "description": "Expected contribution a year with MAGI exactly at the line.",
                "type": ["number", "null"]
              },
              "costSharingLines": {
                "description": "The 150%, 200% and 250% FPL lines in MAGI for this household.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "actuarialValue": {
                      "type": "number"
                    },
                    "amount": {
                      "type": "number"
                    },
                    "percent": {
                      "type": "number"
                    }
                  },
                  "required": ["actuarialValue", "amount", "percent"],
                  "type": "object"
                },
                "type": "array"
              },
              "costSharingReduction": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "actuarialValue": {
                        "description": "Silver plan variant: 94, 87 or 73.",
                        "type": "number"
                      },
                      "maxOutOfPocketFamily": {
                        "type": "number"
                      },
                      "maxOutOfPocketSelf": {
                        "type": "number"
                      },
                      "roomToTierTop": {
                        "type": "number"
                      },
                      "tierTopLine": {
                        "description": "MAGI at the top of this tier (150%, 200% or 250% FPL).",
                        "type": "number"
                      }
                    },
                    "required": ["actuarialValue", "maxOutOfPocketFamily", "maxOutOfPocketSelf", "roomToTierTop", "tierTopLine"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Cost-sharing reduction on a silver plan; null when none applies."
              },
              "coverageYear": {
                "type": "number"
              },
              "credit": {
                "description": "A year; null without a benchmark premium.",
                "type": ["number", "null"]
              },
              "creditLostAtLine": {
                "description": "Credit given up by filling the whole room: the drop in credit, or without a benchmark the rise in expected contribution.",
                "type": ["number", "null"]
              },
              "disclaimer": {
                "const": "Not tax, legal or investment advice.",
                "type": "string"
              },
              "expectedContribution": {
                "description": "A year.",
                "type": ["number", "null"]
              },
              "fplPercent": {
                "type": "number"
              },
              "householdSize": {
                "type": "number"
              },
              "howComputed": {
                "additionalProperties": false,
                "properties": {
                  "steps": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "formula": {
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "tables": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "value": {
                          "type": "number"
                        }
                      },
                      "required": ["formula", "label", "tables", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "tables": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "table": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        },
                        "year": {
                          "type": "number"
                        }
                      },
                      "required": ["table", "title", "url", "year"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["steps", "tables"],
                "type": "object"
              },
              "line": {
                "description": "400% of the poverty guideline.",
                "type": "number"
              },
              "magi": {
                "type": "number"
              },
              "medicaidLine": {
                "description": "MAGI at 138% FPL, the Medicaid expansion line; null in a non-expansion state.",
                "type": ["number", "null"]
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "plannerLink": {
                "description": "Opens the Dipperfield planner with these inputs filled in; the inputs travel in the link fragment, which browsers never send to a server.",
                "type": "string"
              },
              "povertyGuideline": {
                "type": "number"
              },
              "program": {
                "description": "Where this income lands: the marketplace credit, Medicaid, the state Basic Health Program, the coverage gap (non-expansion state below 100% FPL), below 100% with no state given, or over the 400% line.",
                "enum": ["marketplace", "medicaid", "basic-health-program", "coverage-gap", "below-fpl", "over-cliff"],
                "type": "string"
              },
              "programName": {
                "type": ["string", "null"]
              },
              "roomUnderLine": {
                "description": "Most a Roth conversion or other income can add and keep MAGI at the line; negative when already over.",
                "type": "number"
              },
              "status": {
                "enum": ["under-line", "over-line", "below-100-percent"],
                "type": "string"
              }
            },
            "required": ["applicablePercentage", "contributionAtLine", "costSharingLines", "costSharingReduction", "coverageYear", "credit", "creditLostAtLine", "disclaimer", "expectedContribution", "fplPercent", "householdSize", "howComputed", "line", "magi", "medicaidLine", "notes", "plannerLink", "povertyGuideline", "program", "programName", "roomUnderLine", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Room under the ACA subsidy line"
          },
          "behavior": {
