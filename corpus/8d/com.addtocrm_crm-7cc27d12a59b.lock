                    "type": "integer"
                  },
                  "status": {
                    "description": "pending, processing, completed, failed or cancelled",
                    "type": "string"
                  },
                  "total": {
                    "type": "integer"
                  }
                },
                "type": ["null", "object"]
              },
              "status": {
                "description": "queued or pending",
                "type": "string"
              }
            },
            "type": "object"
          },
