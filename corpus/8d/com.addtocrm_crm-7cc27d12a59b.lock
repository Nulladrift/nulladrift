        {
          "name": "confirm_possible_match",
          "title": "Confirm a possible match",
          "description": "Record the customer's answer about a possible match from find_person_in_crm: that the CRM record is the same person, or a different one. The answer must name the person the search was about (their name, company, e-mail or profile link), or it is refused. Confirming also saves the person's profile link on the record when it has none, provided a search or lookup here returned that link for this person at the company the search named.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "the person's company",
                "type": "string"
              },
              "decision": {
                "description": "same_person if the customer says the record is this person, different_person if they say it is someone else",
                "type": "string"
              },
              "email": {
                "description": "an e-mail address the person is known by",
                "type": "string"
              },
              "entity_type": {
                "description": "contact or lead, as returned with the record",
                "type": "string"
              },
              "name": {
                "description": "the person's full name",
                "type": "string"
              },
              "profile_url": {
                "description": "link to the person's public profile page; the profile link or an e-mail is needed to remember the answer",
                "type": "string"
              },
              "record_id": {
                "description": "the id of the possible match, from find_person_in_crm or add_person_to_crm",
                "type": "string"
              }
            },
            "required": ["decision", "record_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "crm": {
                "type": "string"
              },
              "profile_link": {
                "description": "for a confirmation: written (saved on the CRM record), already_present, or not saved with the reason",
                "type": "string"
              },
              "status": {
                "description": "confirmed, rejected or pending",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Confirm a possible match"
          },
          "behavior": {
