        {
          "name": "add_people_to_crm",
          "title": "Add several people to the CRM",
          "description": "Add up to 100 people to the customer's connected CRM in the background. Each person is given by the profile_url that search_prospects or find_contact_details returned; anyone else is refused (add_person_to_crm adds one person from any profile link). People already in the CRM are skipped. Returns a job id for get_bulk_add_status. Uses one lookup credit for each person an e-mail address is found for.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_phone": {
                "description": "also look for mobile numbers; this uses extra credits for every person, so set it only when the customer wants phone numbers saved",
                "type": "boolean"
              },
              "only_with_email": {
                "description": "add only the people an e-mail address is found for",
                "type": "boolean"
              },
              "people": {
                "description": "the people to add, up to 100, each with the profile_url that search_prospects or find_contact_details returned in this conversation",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "company": {
                      "description": "the person's company, for the customer's reference; the stored record is used",
                      "type": "string"
                    },
                    "name": {
                      "description": "the person's full name, for the customer's reference; the stored record is used",
                      "type": "string"
                    },
                    "profile_url": {
                      "description": "link to the person's public profile page, exactly as search_prospects or find_contact_details returned it",
                      "type": "string"
                    },
                    "title": {
                      "description": "the person's job title, for the customer's reference; the stored record is used",
                      "type": "string"
                    }
                  },
                  "required": ["profile_url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "tags": {
                "description": "tags to put on every record, in addition to the customer's default tags",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["people"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "job": {
                "additionalProperties": false,
                "properties": {
                  "added": {
                    "type": "integer"
                  },
                  "already_in_crm": {
                    "description": "people who were already in the CRM and were left alone",
                    "type": "integer"
                  },
                  "credits_used": {
                    "type": "integer"
                  },
                  "crm": {
                    "type": "string"
                  },
                  "done": {
                    "type": "integer"
