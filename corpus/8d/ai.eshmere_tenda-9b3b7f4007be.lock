        {
          "name": "choose_alerts",
          "title": "Choose where Winquill's alerts go",
          "description": "Use this when the user wants to change which Slack and Teams channels get Winquill's alerts, or asks where they go: \"stop the morning summary in Slack\". Change only what the user asked for; with neither send nor stop it changes nothing and says where alerts go now. Owners and admins can change alerts. Needs a Winquill account and workspace. Not for connecting a channel (Winquill dashboard, Settings, Connections) or for email alerts (use watch_tenders). Example: {\"app\":\"slack\",\"stop\":[\"morning_summary\"]}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "app": {
                "description": "\"slack\" or \"teams\" for that app's channels. Leave out app and channel for every channel.",
                "enum": ["slack", "teams"],
                "type": "string"
              },
              "channel": {
                "description": "One channel, by its name: e.g. \"bids\" or \"#bids\" in Slack, or \"General\" in Teams.",
                "maxLength": 200,
                "type": "string"
              },
              "only": {
                "description": "true when what's sent here should go only here: every other channel stops getting it. An app or channel the user didn't mention otherwise keeps its alerts.",
                "type": "boolean"
              },
              "send": {
                "description": "Alerts to turn on in those channels: \"new_tenders\" (new tenders that fit the company), \"changes\" (changes to tenders in the pipeline), \"morning_summary\" (the weekday morning summary), \"bid_work\" (bid work nobody has yet), or \"all\".",
                "items": {
                  "enum": ["new_tenders", "changes", "morning_summary", "bid_work", "all"],
                  "type": "string"
                },
                "type": "array"
              },
              "stop": {
                "description": "Alerts to turn off in those channels: \"new_tenders\" (new tenders that fit the company), \"changes\" (changes to tenders in the pipeline), \"morning_summary\" (the weekday morning summary), \"bid_work\" (bid work nobody has yet), or \"all\". A channel with no alerts stays connected, so the team can still ask Winquill there.",
                "items": {
                  "enum": ["new_tenders", "changes", "morning_summary", "bid_work", "all"],
                  "type": "string"
                },
                "type": "array"
              },
              "workspace": {
                "description": "The Winquill workspace to use, by name, when the user is in more than one, e.g. \"Northbridge Services\".",
                "type": "string"
              }
            },
            "type": "object"
          },
