                "type": "boolean"
              },
              "notify": {
                "description": "Where Winquill says when the draft is ready, e.g. [\"slack\"]: the first of these apps where it has somewhere to say it, the conversation this call came from or else the workspace's first connected channel there. An empty list for nowhere.",
                "items": {
                  "enum": ["slack", "teams"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
