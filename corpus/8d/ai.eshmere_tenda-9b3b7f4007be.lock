        {
          "name": "assign_task",
          "title": "Give out bid work",
          "description": "Use this when the user gives work on a team bid to someone, or takes it on: \"give the Bristol bid call to Sam\". The work is the bid call while a tender waits in Watching or Qualifying, or a sprint step, the next one unless named. Says who has it and whether they heard in Slack. When the person's role can't do it, the answer says who can: ask the user before choosing one. Needs a Winquill account and workspace. Not for ticking off a step (use update_bid_sprint) or the call itself (use record_bid_call). Example: {\"tender_reference\":\"012345-2026\",\"person\":\"Sam\",\"task\":\"review\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "person": {
                "description": "Who gets it: their name as the team knows them, e.g. \"Sam\" or \"Sam Okafor\", their email, or \"me\" for the user. Owners, admins and bid leads give out work; anyone can take work their role can do. Someone not in the workspace yet is invited from Today in the Winquill dashboard.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "task": {
                "description": "The work: \"call\" (the bid or no-bid call), or a sprint step: \"decode\", \"assign\", \"draft\", \"review\", \"checks\" or \"submit\". Leave it out for the tender's next piece of work.",
                "enum": ["call", "decode", "assign", "draft", "review", "checks", "submit"],
                "type": "string"
              },
              "tender_reference": {
                "description": "The notice ID, procurement identifier, solicitation number or the buyer's own reference, e.g. \"012345-2026\" on Find a Tender, \"WS4851234567\" on CanadaBuys or \"140D0427Q0879\" on SAM.gov.",
                "minLength": 3,
                "type": "string"
              },
              "workspace": {
                "description": "The Winquill workspace to use, by name, when the user is in more than one, e.g. \"Northbridge Services\".",
                "type": "string"
              }
            },
            "required": ["person", "tender_reference"],
            "type": "object"
          },
