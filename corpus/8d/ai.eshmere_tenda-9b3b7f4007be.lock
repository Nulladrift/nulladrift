        {
          "name": "record_bid_call",
          "title": "Record the bid call",
          "description": "Use this when the user's team has decided whether to bid: records the bid or no-bid call, the team's answers to Winquill's five questions and the reason. A bid moves the tender to Bidding and plans a six-step sprint back from the deadline; a tender not in the pipeline is added first. Confirm the decision with the user before calling. Needs a Winquill account and a role that makes bid calls. Not for judging fit before the call (use assess_tender_fit). Example: {\"tender_reference\":\"012345-2026\",\"decision\":\"bid\",\"answers\":{\"fit\":\"yes\"}}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answers": {
                "description": "The team's answers to Winquill's five questions, each \"yes\", \"unsure\" or \"no\": fit (is this work we do well), eligibility (do we meet every must-have), capacity (can we deliver it and write the bid in time), competition (can we beat the other bidders) and value (is it worth winning). Leave out questions the user didn't answer.",
                "properties": {
                  "capacity": {
                    "enum": ["yes", "unsure", "no"],
                    "type": "string"
                  },
                  "competition": {
                    "enum": ["yes", "unsure", "no"],
                    "type": "string"
                  },
                  "eligibility": {
                    "enum": ["yes", "unsure", "no"],
                    "type": "string"
                  },
                  "fit": {
                    "enum": ["yes", "unsure", "no"],
                    "type": "string"
                  },
                  "value": {
                    "enum": ["yes", "unsure", "no"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "decision": {
                "description": "\"bid\" when the team will bid, \"no_bid\" when it will not.",
                "enum": ["bid", "no_bid"],
                "type": "string"
              },
              "reason": {
                "description": "Why, in the user's words, for the team to read later.",
                "maxLength": 2000,
                "type": "string"
