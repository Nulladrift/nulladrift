        {
          "name": "watch_tenders",
          "title": "Watch for tenders",
          "description": "Use this when the user wants alerts for new tenders or upcoming notices that match a search, or for changes to one tender they follow (clarifications, new deadlines, the award). Saves a watch and gives its watchId: matches show in get_tender_updates and, with notify, in the workspace's Slack or Teams channels that get changes. Needs a Winquill account. Not for seeing the user's watches (use list_watches) or stopping one (use stop_watch). Example: {\"query\":\"office cleaning\",\"include_upcoming\":true}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyer_type": {
                "description": "Kind of public buyer, e.g. \"local_authority\" for councils, \"nhs\" for NHS trusts and ICBs, \"education\" for schools, academy trusts and universities.",
                "enum": ["central_government", "local_authority", "nhs", "education", "housing", "emergency_services", "devolved_government", "defence", "utilities", "any"],
                "type": "string"
              },
              "country": {
                "description": "The country to look in, when the user names one, e.g. \"Canada\", \"UK\" or \"Spain\" (an EU member state searches the rest of the EU there). Omit to use the user's own countries (the UK when they aren't signed in). Winquill covers the UK, Canada, the United States, Germany, France and the rest of the EU.",
                "type": "string"
              },
              "include_upcoming": {
                "description": "Also alert on pipeline and preliminary market engagement notices, to hear about work before it is tendered.",
                "type": "boolean"
              },
              "notify": {
                "description": "Also post what the watch finds to the user's workspace's Slack or Teams channels, where they get changes. Only when the user asks for it there.",
                "items": {
                  "enum": ["slack", "teams"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "query": {
                "description": "What to watch for, e.g. \"office cleaning\".",
                "type": "string"
              },
              "region": {
                "description": "Where the work or delivery happens: a UK nation or English region, e.g. \"North West\" for Manchester or Liverpool; a Canadian province or territory, e.g. \"Ontario\" for Toronto; a US state, e.g. \"Virginia\"; a German Land by its German name, e.g. \"Bayern\" for Munich; a French region, e.g. \"Île-de-France\" for Paris; or another EU member state, e.g. \"Poland\". Omit for nationwide contracts or when the user names no place.",
                "enum": ["North East", "North West", "Yorkshire and the Humber", "East Midlands", "West Midlands", "East of England", "London", "South East", "South West", "Scotland", "Wales", "Northern Ireland", "British Columbia", "Alberta", "Saskatchewan", "Manitoba", "Ontario", "Quebec", "New Brunswick", "Nova Scotia", "Prince Edward Island", "Newfoundland and Labrador", "Yukon", "Northwest Territories", "Nunavut", "Alabama", "Alaska", "Arizona", "Arkansas", "California", "Colorado", "Connecticut", "Delaware", "District of Columbia", "Florida", "Georgia", "Hawaii", "Idaho", "Illinois", "Indiana", "Iowa", "Kansas", "Kentucky", "Louisiana", "Maine", "Maryland", "Massachusetts", "Michigan", "Minnesota", "Mississippi", "Missouri", "Montana", "Nebraska", "Nevada", "New Hampshire", "New Jersey", "New Mexico", "New York", "North Carolina", "North Dakota", "Ohio", "Oklahoma", "Oregon", "Pennsylvania", "Rhode Island", "South Carolina", "South Dakota", "Tennessee", "Texas", "Utah", "Vermont", "Virginia", "Washington", "West Virginia", "Wisconsin", "Wyoming", "Puerto Rico", "Guam", "U.S. Virgin Islands", "American Samoa", "Northern Mariana Islands", "Baden-Württemberg", "Bayern", "Berlin", "Brandenburg", "Bremen", "Hamburg", "Hessen", "Mecklenburg-Vorpommern", "Niedersachsen", "Nordrhein-Westfalen", "Rheinland-Pfalz", "Saarland", "Sachsen", "Sachsen-Anhalt", "Schleswig-Holstein", "Thüringen", "Auvergne-Rhône-Alpes", "Bourgogne-Franche-Comté", "Bretagne", "Centre-Val de Loire", "Corse", "Grand Est", "Hauts-de-France", "Île-de-France", "Normandie", "Nouvelle-Aquitaine", "Occitanie", "Pays de la Loire", "Provence-Alpes-Côte d'Azur", "Guadeloupe", "Martinique", "Guyane", "La Réunion", "Mayotte", "Austria", "Belgium", "Bulgaria", "Croatia", "Cyprus", "Czechia", "Denmark", "Estonia", "Finland", "Greece", "Hungary", "Ireland", "Italy", "Latvia", "Lithuania", "Luxembourg", "Malta", "Netherlands", "Poland", "Portugal", "Romania", "Slovakia", "Slovenia", "Spain", "Sweden"],
