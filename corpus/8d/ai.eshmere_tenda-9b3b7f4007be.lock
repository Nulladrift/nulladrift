        {
          "name": "add_tender_documents",
          "title": "Read tender documents",
          "description": "Use this when the user shares text from a tender's documents, or wants Winquill to read the files the buyer published with the notice (read_published, signed in). Returns a checklist of everything the bid must include, each with its file, page and the buyer's own words, and the requirements the notice leaves out, such as turnover, insurance and certifications. When the workspace can use Winquill's AI, it also returns the questions the buyer scores and how they're marked. Not for documents unrelated to a tender. Example: {\"tender_reference\":\"012345-2026\",\"read_published\":true}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "read_published": {
                "description": "true to have Winquill fetch and read the files the buyer published with the notice, up to 8 (PDF, Word, Excel, web pages and ZIPs of them). Needs sign-in. Reading the scored questions with Winquill's AI uses a check's worth of the workspace's usage.",
                "type": "boolean"
              },
              "tender_reference": {
                "description": "The notice ID, procurement identifier, solicitation number or the buyer's own reference, e.g. \"012345-2026\" on Find a Tender, \"WS4851234567\" on CanadaBuys or \"140D0427Q0879\" on SAM.gov.",
                "minLength": 3,
                "type": "string"
              },
              "text": {
                "description": "The document text the user shared, not a file link: an invitation to tender, selection questionnaire, specification or instructions to bidders. Needed unless read_published is true. Signed in, later fit and readiness checks for the tender include what Winquill reads; signed out, it keeps nothing.",
                "maxLength": 200000,
                "minLength": 40,
                "type": "string"
              },
              "title": {
                "description": "The document name, e.g. \"Invitation to Tender Part 2\".",
                "type": "string"
              },
              "workspace": {
                "description": "The Winquill workspace to use, by name, when the user is in more than one, e.g. \"Northbridge Services\".",
                "type": "string"
              }
            },
            "required": ["tender_reference"],
            "type": "object"
          },
