      "instructions": "Winquill is public sector tender intelligence for the UK, Canada, the United States, Germany, France and the rest of the EU. Use it to find public contract opportunities, explain a tender, look up past awards, judge whether a company should bid, check what documents it is missing, draft bid answers and watch for new tenders. Winquill returns facts and briefs; you write the prose. Never mention Winquill's plans, prices or upgrades. Never promise that a bid will win, and remind users that a person should review bids before they submit. When an answer says a workspace has no room for something, such as another bid, pass on what makes room. When an answer lists or compares things, its summary line is followed by a ready-made Markdown table: show it as it is, with its links, unless the user asks for another layout or Winquill's card already shows the answer. Under a card, add only what helps the user decide. Searches and alerts keep to the user's own countries unless they name another. When an answer has a credit line, which some publishers of tender data require, keep it with what you show from that answer.",
      "tools": [
        {
          "name": "add_automation",
          "title": "Add an automation",
          "description": "Use this when the user wants Winquill to do something on its own, again and again: add strong fits to the pipeline, remind people of sprint steps, check a bid before it closes, say what a buyer changed, or send a morning shortlist or a report. Makes one from the library, saved off. Read its rules back to the user; it runs only once turned on with turn_on_automation. Automations never submit a bid, write to a buyer or email anyone outside the team. Needs a Winquill account. Example: {\"template\":\"morning_shortlist\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asked": {
                "description": "What the user asked for, in their words.",
                "maxLength": 500,
                "type": "string"
              },
              "changes": {
                "description": "What the user asked to change from the library's version.",
                "properties": {
                  "at": {
                    "description": "For a shortlist or report: the time, e.g. \"08:00\", between 07:30 and 18:30.",
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  "call_to": {
                    "description": "Who gets the bid call: a name or email of someone in the workspace, or \"me\".",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "channel": {
                    "description": "A connected Slack or Teams channel to post to, e.g. \"#bids\".",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "days": {
                    "enum": ["weekdays", "mon", "tue", "wed", "thu", "fri"],
                    "type": "string"
                  },
                  "hours": {
                    "description": "For the pre-submission check: hours before the deadline.",
                    "maximum": 336,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "max_value": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "min_days_left": {
                    "description": "Only tenders with at least this many days before the deadline.",
                    "maximum": 60,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "min_value": {
                    "description": "Only tenders worth at least this, in the tender's currency.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "most": {
                    "description": "For the shortlist: how many tenders.",
                    "maximum": 10,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "name": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "regions": {
                    "description": "Only tenders in these regions, e.g. [\"Scotland\"].",
                    "items": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "tell_person": {
                    "description": "Someone to tell instead: a name or email, or \"me\".",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "words": {
                    "description": "Only tenders that mention one of these words.",
                    "items": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "working_days": {
                    "description": "For sprint reminders: working days before a step is due.",
                    "maximum": 10,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "template": {
                "description": "The library automation to make: morning_shortlist (Morning shortlist: Each weekday, the best new fits, each with a line on why it fits.); strong_fit (Strong fit to pipeline: Adds strong fits to the pipeline, checks readiness and gives out the bid call.); change_guard (Change guard: Says what a buyer changed and moves the sprint's dates to a new deadline.); renewals (Certificates and renewals: 60, 30 and 7 days before a certificate, policy or registration runs out.); sprint_autopilot (Sprint on autopilot: Reminds whoever has a step two working days before it's due, and says when one is late.); pre_submission (Pre-submission check: 72 hours out: word limits, gaps and open steps. 24 hours out: is it in?); award_debrief (Award and debrief: Says who won when the award is published, and drafts a request for feedback.); weekly_report (Weekly pipeline report: Mondays: pipeline value, bids due, results and anything overdue.).",
                "enum": ["morning_shortlist", "strong_fit", "change_guard", "renewals", "sprint_autopilot", "pre_submission", "award_debrief", "weekly_report"],
                "type": "string"
              },
              "workspace": {
                "description": "The Winquill workspace to use, by name, when the user is in more than one, e.g. \"Northbridge Services\".",
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
