                "description": "One answer to read in full, by the buyer's number, e.g. \"Q3\".",
                "type": "string"
              },
              "tender_reference": {
                "description": "The notice ID, procurement identifier, solicitation number or the buyer's own reference, e.g. \"012345-2026\" on Find a Tender, \"WS4851234567\" on CanadaBuys or \"140D0427Q0879\" on SAM.gov.",
                "minLength": 3,
                "type": "string"
              },
              "workspace": {
                "description": "The Winquill workspace to use, by name, when the user is in more than one, e.g. \"Northbridge Services\".",
                "type": "string"
