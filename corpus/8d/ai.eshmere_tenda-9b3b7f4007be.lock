        {
          "name": "start_bid_draft",
          "title": "Have Winquill draft the bid",
          "description": "Use this when the user wants Winquill to write a whole bid for their team: it asks a few questions, drafts every answer from the company's evidence, then marks and revises them. Relay Winquill's questions as they are. A whole bid uses one of the month's full bids, so first call it without confirmed, tell the user how many are left and offer to write it here with draft_bid_response, which uses none; call again with confirmed only if they choose Winquill. notify says where to hear when it's ready. Needs a Winquill account and workspace. Example: {\"tender_reference\":\"012345-2026\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
