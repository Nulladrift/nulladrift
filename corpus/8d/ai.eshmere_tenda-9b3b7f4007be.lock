        {
          "name": "add_to_pipeline",
          "title": "Add to pipeline",
          "description": "Use this when the user wants to save a tender to their team's pipeline to consider bidding, e.g. \"add this to our pipeline\" or \"let's track the Falkirk cleaning framework\". Adds it in Watching, ready for the bid or no-bid call, and says which e-tendering portal the tender is run on. Until the team has said whether it has an account on that portal, the answer asks; pass the question on, and record the reply with record_portal_account. Needs a Winquill account and workspace. Do not use for alerts about new tenders (use watch_tenders) or to record a decision to bid (use record_bid_call).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "more_references": {
                "description": "More tenders to add at the same time, by the same kind of reference, when the user asks for several, e.g. \"add the two best fits\". Up to 4.",
