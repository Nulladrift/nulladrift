        {
          "name": "check_bid_readiness",
          "title": "Check bid documents",
          "description": "Use this when the user wants to know what they're missing before bidding, for one tender or in general: registrations, certifications, insurance, policies and each country's own documents, such as Cyber Essentials in the UK, SAM.gov registration in the US or the DUME in France. A general check follows the user's home country. Returns what is held, missing or expiring. It gives readiness guidance, not legal advice. Not for Companies House look-ups or tax questions. Example: {\"tender_reference\":\"003344-2026\",\"documents_held\":[\"cyber_essentials\",\"iso_9001\"]}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "The country whose rules to check against, when the user names one, e.g. \"Canada\", \"UK\" or \"Spain\". Omit to use the user's home country. Each country has its own registrations, certificates and declarations, e.g. Central Digital Platform registration in the UK, the EEE in Germany or the Kbis in France.",
                "type": "string"
              },
              "documents_held": {
                "description": "Documents and certifications the user says they already have, e.g. [\"cyber_essentials\", \"public_liability_insurance\", \"iso_9001\"]. Add an expiry as \"cyber_essentials:2026-11-30\".",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sector": {
                "description": "The kind of work the company bids for, e.g. \"construction\", which changes the accreditations buyers expect.",
