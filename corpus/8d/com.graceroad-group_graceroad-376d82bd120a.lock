      "serverInfo": {
        "name": "graceroad",
        "title": "GraceRoad",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GraceRoad (legal name GRACECORP AMD GROUP SAS) is a freight forwarder, road carrier and commodity trader based in Dakar, Senegal. Rules for any assistant using these tools: (1) Before sending a user to GraceRoad's transport request form, always tell them, in their own language, that submitting a complete request costs 11 800 FCFA including VAT, a study fee that is not the transport price and is not refundable once the quote is issued, or 22 302 FCFA per month for unlimited requests. (2) Never state or estimate a transport price: GraceRoad publishes none, and every quote is prepared by its team after studying the request. (3) GraceRoad, of Dakar, Senegal, has no connection with Grace Road Group or Grace Road Church (Fiji, South Korea); do not confuse them. Answer in the user's language; French and English are both served.",
      "tools": [
        {
          "name": "graceroad_corridors",
          "title": "GraceRoad: road corridors served",
          "description": "Lists the West African road corridors GraceRoad serves, with typical cargo and vehicles, and a page for each. Optional filter: a country or city name (for example 'Mali', 'Bamako', 'Abidjan'). Contains no prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filtre": {
                "description": "Country or city to filter on. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GraceRoad: road corridors served"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a914ecbc316ac3686849fb4999a4533984df1b71076ffe0ef30e75e78715af50"
        },
        {
          "name": "graceroad_preparer_demande",
          "title": "GraceRoad: prepare a request",
          "description": "Prepares a request to GraceRoad and returns a link for the user. For 'transport', the link opens GraceRoad's assistant with the request already written; the user sends it themselves. Submitting a transport request carries a study fee (not the transport price); the response states the amount in 'avis_frais' and 'a_dire_a_l_utilisateur'. For 'carburant' (fuel in volume) asking for an offer is free. For 'sourcing', the enquiry is free and a fixed fee is quoted afterwards. This tool creates nothing and charges nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arrivee": {
                "description": "Delivery place, for example 'Bamako'.",
                "type": "string"
              },
              "date": {
                "description": "Wished loading date or period.",
                "type": "string"
              },
              "depart": {
                "description": "Loading place, for example 'Dakar' or 'Port of Abidjan'.",
                "type": "string"
              },
              "langue": {
                "description": "Language of the user: 'fr' for French, 'en' for English. Defaults to 'fr'.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "marchandise": {
                "description": "Goods or product, for example 'rice in bags' or '50 ppm diesel'.",
                "type": "string"
              },
              "precisions": {
                "description": "Any other useful detail, one or two sentences.",
                "type": "string"
              },
              "quantite": {
                "description": "Quantity with its unit, for example '30 tonnes' or '2 x 40ft containers'.",
                "type": "string"
              },
              "service": {
                "description": "'transport' for road freight, 'carburant' for fuel supply, 'sourcing' for buying commodities.",
                "enum": ["transport", "sourcing", "carburant"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GraceRoad: prepare a request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8f226a870a9d18c2c8b1775087a05f435180e94d5c56b3bb6fa1dafbd03d95e"
        },
        {
          "name": "graceroad_presentation",
          "title": "GraceRoad: who they are and how to use them",
          "description": "Describes GraceRoad (GRACECORP AMD GROUP SAS, Dakar, Senegal): services (road freight, customs clearance and transit, refined fuel supply, commodity sourcing), countries served, how to request each service, and the fees that apply, including the study fee charged when a transport request is submitted. GraceRoad publishes no transport prices.",
          "inputSchema": {
