{
  "lockfileVersion": 2,
  "subjects": {
    "app.me3/me3": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.me3.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "me3",
        "title": "ME3",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ME3 is a network of people and small businesses who each run their own site: hairdressers, coaches, therapists, makers. Use search_people to find someone by what they do and where, get_profile for what one person offers and charges, check_availability for their free times, and start_booking for the link where the person books or buys. These tools never book, pay or send anything: always give the person the link from start_booking to finish themselves. Some offers are taken by enquiry (takeUp: enquire): the seller has no online booking or payment for them yet, so start_booking returns their enquiry form; say so plainly rather than promising a booking. Only people who chose to be listed appear. Times are in each seller's own timezone.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check free times",
          "description": "List the free start times for one of a person's bookable services, day by day, in their own timezone. Covers up to 7 days; without dates it covers the next 7 days, and without an offering it uses their lowest-priced service.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "First day to check (YYYY-MM-DD). Today by default.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "offering_id": {
                "description": "A service id from get_profile or search_people, such as service:cut.",
                "type": "string"
              },
              "site": {
                "description": "The person's ME3 handle or site address, as returned in `site` or `url` by search_people.",
                "type": "string"
              },
              "to": {
                "description": "Last day to check, at most 7 days after from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check free times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cb46caa32f9aedadf5a2b3aceca3f310910a026efed352b8b41f33e4be8ddfc4"
        },
        {
          "name": "get_profile",
          "title": "Get a person's profile and offers",
          "description": "Read one listed ME3 person's public profile: who they are, where they are, and every service and product with its price and duration. Use the offering ids it returns with check_availability and start_booking.",
          "inputSchema": {
            "properties": {
              "site": {
                "description": "The person's ME3 handle or site address, as returned in `site` or `url` by search_people.",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a person's profile and offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6b90f7f1d59534d3994dc2503db22b3475a9bdd021eeaf288b85bf260754805b"
        },
        {
          "name": "search_people",
          "title": "Search ME3 people",
          "description": "Find people and small businesses on ME3 by what they do and where, for example a hairdresser in Galway. Returns each match with their trade, town, starting price, next free time, what they offer and their site. Give from and to dates to return only people free in that window.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code, such as IE.",
                "type": "string"
              },
              "from": {
                "description": "First day they must be free (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "How many results, 5 by default.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "Town, region or country to look in.",
                "type": "string"
              },
              "query": {
                "description": "What the person is looking for, such as a trade, service or product.",
                "type": "string"
              },
              "to": {
                "description": "Last day of the window, at most 7 days after from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "type": {
                "description": "Only people with services, or only with products.",
                "enum": ["service", "product"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search ME3 people"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2b9171af7013cf26d16afc3320a1ab2c94c638f0af9ece36f82c6de027e6da69"
        },
        {
          "name": "start_booking",
          "title": "Get the link to book or buy",
          "description": "Get the link where the person books a service or buys a product on the seller's own site. Give date and time from check_availability and the booking form opens with that slot chosen. If the seller takes enquiries for this offer instead (kind enquiry), the link opens their enquiry form. Nothing is booked, held, charged or sent by this tool: give the person the link to finish there.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "The day the person chose, from check_availability (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "offering_id": {
                "description": "The service or product id from get_profile or search_people.",
                "type": "string"
              },
              "site": {
                "description": "The person's ME3 handle or site address, as returned in `site` or `url` by search_people.",
                "type": "string"
              },
              "starts_at": {
                "description": "Older form of date and time; prefer date and time.",
                "type": "string"
              },
              "time": {
                "description": "The start time the person chose, from check_availability (HH:MM, the seller's local time).",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              }
            },
            "required": ["offering_id", "site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the link to book or buy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3b4e3c2e4353a75d2b39e358e207ad8d385f99afae19d804f794549a7939ac0f"
        }
      ],
      "digest": "sha256:956b8ccfff7cd24d228c9f092fade72fe7ecea4673bd04d871ed1454bee0ccdc"
    }
  }
}
