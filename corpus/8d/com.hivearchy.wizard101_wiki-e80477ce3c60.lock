{
  "lockfileVersion": 2,
  "subjects": {
    "com.hivearchy.wizard101/wiki": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://wizard101.hivearchy.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "wizard101-wiki",
        "title": "Wizard101 Wiki",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "A read-only Wizard101 wiki built from the game's own files and community pages. Start with search, then get_page. Facts carry a tier: client (game files) or community (soft). A missing value is null. The data is free under CC BY-SA 4.0: link back to the page you used (https://wizard101.hivearchy.com/...).",
      "tools": [
        {
          "name": "get_page",
          "description": "One page's full record: a creature (stats, resists, typed boss cheats, spells), a spell (pips, accuracy, effects, every card of that name), a quest (giver, goals, rewards, what it leads to and needs, where it fits in its tree) or a zone. Each fact has a tier: client is from the game files, community is soft.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["creature", "spell", "quest", "zone", "npc", "school", "world"],
                "type": "string"
              },
              "slug": {
                "description": "as in the page address, e.g. fire-cat",
                "pattern": "^[a-z0-9-]{1,120}$",
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d9dd730c528b48976901e221e94c1dc3ab5728856b901035488d1cea2d09192"
        },
        {
          "name": "list_gaps",
          "description": "What the wiki does not know yet (bosses without cheats, creatures without a known deck, drops, quests without steps). If your user's own game data fills one, ask them first; contributions go through the wiki's API (see its /openapi.json) and are reviewed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["cheat_rule", "deck", "drop", "quest_step"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "world": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:68637b2c08fde5271a37d3d8571c6c5c7334dc8ee8651898b3f53de880f6dcb9"
        },
        {
          "name": "quest_categories",
          "description": "The quest categories with counts and starting quests: each world's main story, the school quest lines, side quests by world, instances, events, and quests not sorted yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc8f9abfef2f8d837512b78e9d4df603be7cc8cf908b46df940017dc51c329b7"
        },
        {
          "name": "quest_tree",
          "description": "Walk one quest category as a tree from its start: main quests in order with the side quests that branch off them, by-school stages, what each quest needs, and where the next quest is not known yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "an id from quest_categories, e.g. main/wizard-city or school/fire",
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:194ea66ba865a30565820bd1362d3ef7c709b22180406631b5b437b89a10e880"
        },
        {
          "name": "search",
          "description": "Find Wizard101 creatures, spells, quests and zones by name or by facts (school, world, boss, rank, pips). Typos are forgiven. Returns names with their page address, for get_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["creature", "spell", "quest", "zone", "npc", "school", "world"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "for example: fire cat, headless horseman, krokotopia boss",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b32d19e39eb86e690a756acafcbc57c764c09c4eeff2a89956a34fd6fef3af9c"
        }
      ],
      "digest": "sha256:01bcf03a681e44e3761b3a52e74707045f13fdf7262b0824a1f685603d17e549"
    }
  }
}
