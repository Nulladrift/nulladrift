      "serverInfo": {
        "name": "performance-atlas",
        "title": "Performance Atlas",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Acting direction for AI video and voice, built from a character's state rather than an emotion label. For any shot with a person in it: (1) call atlas_kit with the character's state, the shot size and the target model; (2) write the acting paragraph as prose from the kit's behaviour - never name the emotion; (3) call atlas_lint on that paragraph with the same target and shot, and revise until ok is true; (4) generate. Emotions are an index, never output: what goes in the prompt is behaviour. atlas_draft returns a mechanical scaffold paragraph - rewrite it as prose. Use atlas_targets for target ids and prompt caps, atlas_search to look up behaviour.",
      "tools": [
        {
          "name": "atlas_buy_pack",
          "title": "Buy a 20-call pack",
          "description": "Buy 20 paid calls for $1.00 in one x402 payment (USDC on Base). Returns an API key: send it as an `Authorization: Bearer <key>` header (or in params._meta[\"creatinginai/pack\"]) on atlas_kit or atlas_draft instead of paying per call. Each successful call uses one credit; failed calls are free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46c5958f8f0dff661276266ab5e5e164cc241a783dff0c68c23dc606a383b163"
        },
        {
          "name": "atlas_draft",
          "title": "Scaffold paragraph",
          "description": "A first-draft acting paragraph assembled from the kit and fitted to the target's character cap, already linted. It reads mechanically: rewrite it as prose. A voice target gets the delivery line instead. Paid: $0.10 per call via x402 (USDC on Base), or prepaid credits with an API key (`Authorization: Bearer <key>`): 20 for $1.00 with atlas_buy_pack, or by card at https://creatinginai.com/agents#credits.",
          "inputSchema": {
            "properties": {
              "beats": {
                "description": "Beats in the kit. Default 3.",
                "maximum": 4,
                "minimum": 2,
                "type": "integer"
              },
              "element": {
                "description": "Element handle for Elements mode, e.g. @char_noah.",
                "type": "string"
              },
              "eyeline": {
                "description": "e.g. 'Mum is off frame LEFT; his eyes go LEFT to her'",
                "type": "string"
              },
              "modifiers": {
                "description": "Modifier ids such as exhausted or child (atlas_search with table modifiers).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Character name as it should appear in the prompt.",
                "type": "string"
              },
              "pronoun": {
                "description": "Default they.",
                "enum": ["he", "she", "they"],
                "type": "string"
              },
              "shot": {
                "description": "Shot size, tightest to widest. Default MCU.",
                "enum": ["ECU", "CU", "MCU", "MS", "WS"],
                "type": "string"
              },
              "state": {
                "description": "The character's state for one beat. Only feels is required.",
                "properties": {
                  "alone": {
                    "description": "the private beat after the listener leaves",
                    "type": "string"
                  },
                  "control": {
                    "description": "Capacity to hold it right now. Default 3.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "direction": {
                    "enum": ["opening", "holding", "closing", "breaking"],
                    "type": "string"
                  },
                  "event": {
                    "description": "what just happened",
                    "type": "string"
                  },
                  "feels": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "items": {
                          "properties": {
                            "emotion": {
                              "type": "string"
                            },
                            "intensity": {
                              "maximum": 5,
                              "minimum": 1,
                              "type": "integer"
                            }
                          },
                          "required": ["emotion"],
                          "type": "object"
                        },
                        "type": "array"
                      }
                    ],
                    "description": "What they feel inside, each with intensity 1-5: a string such as 'fear 4, guilt 3', or a list of {emotion, intensity}."
                  },
                  "journey": {
                    "description": "arc stage and what they carry in",
                    "type": "string"
                  },
                  "reveals": {
                    "description": "Who is present, and what is shown or hidden from them.",
                    "items": {
                      "properties": {
                        "because": {
                          "description": "why they hide it, from this person, now",
                          "type": "string"
                        },
                        "cracks_if": {
                          "description": "what would crack the mask",
                          "type": "string"
                        },
                        "to": {
                          "description": "the person present",
                          "type": "string"
                        },
                        "will": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            }
                          ],
                          "description": "feelings they are willing to show that person"
                        },
                        "wont": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            }
                          ],
                          "description": "feelings they won't reveal to that person"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "shows": {
                    "description": "What they show instead: open | deamplify | neutralize | mask-with | amplify | qualify. For mask-with, write 'mask-with:<emotion>' or set with. Default open.",
                    "type": "string"
                  },
                  "tell": {
                    "description": "Size of the tell: 1 trace, 2 flicker, 3 slip, 4 crack, 5 break. Default: suggested from intensity and control.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "with": {
                    "description": "For mask-with: the emotion shown instead.",
                    "type": "string"
                  }
                },
                "required": ["feels"],
                "type": "object"
              },
              "target": {
                "description": "Target model id, e.g. kling-omni-single, seedance-2, generic-video, qwen-tts, elevenlabs-v3. See atlas_targets.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
