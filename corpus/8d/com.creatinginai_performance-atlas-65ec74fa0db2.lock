        {
          "name": "atlas_journey",
          "title": "Check a journey",
          "description": "A character's arc beat by beat, with continuity flags: reset (intensity drops with no event), breach (a hidden feeling shown to the person it's hidden from), overshoot (a tell bigger than the feeling) and flat (beats that never change). Fields a beat leaves out carry over from the beat before. Free.",
          "inputSchema": {
            "properties": {
              "character": {
                "description": "Only this character.",
                "type": "string"
              },
              "characters": {
                "additionalProperties": {
                  "items": {
                    "type": "object"
                  },
                  "type": "array"
                },
                "description": "Character id -> list of beats. Each beat is a state (feels, shows, control, tell, reveals...) plus at (beat id) and event.",
                "type": "object"
              },
              "project": {
                "description": "Local only: a production folder holding journey.yaml.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
