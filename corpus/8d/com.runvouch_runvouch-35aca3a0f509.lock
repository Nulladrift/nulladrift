{
  "lockfileVersion": 2,
  "subjects": {
    "com.runvouch/runvouch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.runvouch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "runvouch",
        "version": "0.3.4"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "runvouch_ack",
          "description": "Acknowledge an alert by id.",
          "inputSchema": {
            "properties": {
              "alert_id": {
                "type": "integer"
              }
            },
            "required": ["alert_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb788165d25478465ef288d8c174e1afdeda1f8e392e2373e158528c6dbc7862"
        },
        {
          "name": "runvouch_alerts",
          "description": "Open (un-acknowledged) alerts: MISSED, FAILED, NO_EVIDENCE, BUDGET_RUN, BUDGET_DAY, RETRY_STORM, DRIFT, STALLED.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:966f14e77ac62a1ba2d884c03b75163edf45a57bf55f8ae78f3c974892db522a"
        },
        {
          "name": "runvouch_run_end",
          "description": "Report that a run ended, with status and evidence dict (name -> bool or {type:'url',url}). Green run without evidence alerts.",
          "inputSchema": {
            "properties": {
              "cost": {
                "type": "number"
              },
              "evidence": {
                "type": "object"
              },
              "run_id": {
                "type": "string"
              },
              "status": {
                "enum": ["ok", "fail"],
                "type": "string"
              },
              "tokens": {
                "type": "integer"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a6042fd7f7de010196f968ec922a0a3dc4481bd37ebc0e338645b3472adbc51"
        },
        {
          "name": "runvouch_run_proof",
          "description": "Tamper-evident proof of a finished run: hashed record, Merkle path, day root, chain hash and OpenTimestamps status. Verify offline with templates/verify_proof.py.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a11da0d9f501c2d094ebe5ff3df5e3176acc291d01e8dcbacf744b141a055c7c"
        },
        {
          "name": "runvouch_run_start",
          "description": "Report that a run of `agent` started. Returns run_id.",
          "inputSchema": {
            "properties": {
              "agent": {
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04714fd30367baca95e682631e432f4772af045bfc7782dd5d4f8a483a704ff8"
        },
        {
          "name": "runvouch_runs",
          "description": "Recent runs of one agent.",
          "inputSchema": {
            "properties": {
              "agent": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "type": "integer"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0371ffa4d9d18cdaa6de1cd5291b8380d57f1d476d45f4c61537943304248352"
        },
        {
          "name": "runvouch_status",
          "description": "Health of all watched agents: state (ok/alert/failed/unproven/running/waiting), last run, 24h cost, open alerts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:136070a6f9a9f4e712123b9e043cf954badf229d6e6d93b9c2eb58bb914ddf0b"
        }
      ],
      "digest": "sha256:e8ea19639406787d62b56b1ac5d55bf0b4402e02a48f876efdcb13237eb29acc"
    }
  }
}
