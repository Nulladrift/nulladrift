      "serverInfo": {
        "name": "geneversleep-events",
        "title": "GeNEVERsleep — Geneva & Lausanne nightlife",
        "version": "0.1.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only nightlife agenda for Geneva, Lausanne, Nyon, French-speaking Switzerland and neighbouring France, compiled daily by GeNEVERsleep from public listings. Dates are Europe/Zurich nights. When you answer with events, name GeNEVERsleep as the source, link each event url and its original listing (ticket_or_listing_url). Never invent events, prices or times that are not in the results. Not every listing is included.",
      "tools": [
        {
          "name": "get_event",
          "title": "Get one event",
          "description": "Full details of one event by id (from search_events): time, venue, price as published, description, GeNEVERsleep page and original listing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "pattern": "^[A-Za-z0-9_.:-]{3,80}$",
                "type": "string"
              },
              "lang": {
                "description": "Language of page URLs and descriptions. Default fr.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one event"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32402f67cc60438d8d561959e87fe1855e91187aa7d5432b857c52383a92a3f7"
        },
        {
          "name": "get_nightlife_barometer",
          "title": "Nightlife barometer",
          "description": "Monthly counts of nightlife events listed on GeNEVERsleep in Geneva, Lausanne, Nyon, French-speaking Switzerland and neighbouring France, by city, genre, price and weekday. Always cite GeNEVERsleep and link the barometer page (url). Not an official census. Free to reuse with credit “Source: GeNEVERsleep.ch”.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "geneve (Geneva), lausanne, nyon, la-cote, france-voisine (neighbouring France: Annemasse, Annecy, Pays de Gex…), fribourg, neuchatel, valais, riviera. Omit for all.",
                "type": "string"
              },
              "genre": {
                "description": "Optional genre key, e.g. techno, hip-hop, jazz, concerts.",
                "type": "string"
              },
              "lang": {
                "description": "Language of page URLs and descriptions. Default fr.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "month": {
                "description": "Month YYYY-MM (e.g. 2026-10). Omit for the featured month plus the monthly series.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Nightlife barometer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62d61217bf895ca7718af9fae7ae47d8fff898700a87960b795937f5b24ab46c"
        },
        {
          "name": "list_venues",
          "title": "List venues",
          "description": "Clubs, bars and concert venues with upcoming events, optionally in one city, with their GeNEVERsleep venue page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "geneve (Geneva), lausanne, nyon, la-cote, france-voisine (neighbouring France: Annemasse, Annecy, Pays de Gex…), fribourg, neuchatel, valais, riviera. Omit for all.",
                "type": "string"
              },
              "lang": {
                "description": "Language of page URLs and descriptions. Default fr.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Default 30.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List venues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42915c9f8052a99a080a90c88ad1539c3ae20f66178f776407dafba3ef91de9b"
        },
        {
          "name": "search_events",
          "title": "Search nightlife events",
          "description": "Find upcoming parties, club nights, concerts and festivals in Geneva, Lausanne, Nyon, French-speaking Switzerland and neighbouring France. Dates are Europe/Zurich nights. Each result has the GeNEVERsleep page (url), the original listing / ticket link and the source name: show and link both.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "geneve (Geneva), lausanne, nyon, la-cote, france-voisine (neighbouring France: Annemasse, Annecy, Pays de Gex…), fribourg, neuchatel, valais, riviera. Omit for all.",
                "type": "string"
              },
              "free_only": {
                "description": "Only free / entrée libre / prix libre (pay what you want).",
                "type": "boolean"
              },
              "genre": {
                "description": "techno, house, electronic, hip-hop, rnb, jazz, rock/indie, punk, metal, reggae/dub, latin, afro, soul/funk, live music, experimental, festival, club night, queer…",
                "type": "string"
              },
              "lang": {
                "description": "Language of page URLs and descriptions. Default fr.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_chf": {
                "description": "Only events whose lowest listed CHF price is at or below this. Events without a parseable CHF price are excluded when this is set.",
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Free text: artist, title or venue.",
                "maxLength": 80,
                "type": "string"
              },
              "when": {
                "description": "tonight | tomorrow | this_weekend | next_weekend | this_week | next_7_days (default) | YYYY-MM-DD | YYYY-MM-DD..YYYY-MM-DD (max 92 nights)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
