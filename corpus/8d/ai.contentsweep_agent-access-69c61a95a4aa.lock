      "serverInfo": {
        "name": "Content Sweep",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Enroll through enroll_agent or REST for sandbox credentials. Authenticate private calls with Bearer. Create a quote before each paid task. Poll get_operation; never treat submission as removal. Integration guide: /developers/agents.",
      "tools": [
        {
          "name": "capture_evidence",
          "description": "Capture a new immutable metadata observation for an existing case. First create_quote(action='evidence', input={rights_holder_id, work_id, delegation_id, case_id}). Results include evidence_id, SHA-256 hash and timestamped metadata; use get_evidence to export it. Captures no screenshots, images, audio or video. Authenticate with the matching action scope. Reserves the quoted maximum from prepaid credits and returns operation_id; poll get_operation for results. Sandbox execution is simulated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Caller-generated key, 8–128 letters, digits, underscores, dots, colons or hyphens. Reuse for retries of the same purchase or operation. Different input with the same organization-bound key returns a conflict.",
                "pattern": "^[A-Za-z0-9_.:-]{8,128}$",
                "type": "string"
              },
              "quote_id": {
                "description": "Unexpired quote ID returned by create_quote for action=\"evidence\" in this organization; all task input is stored in the quote.",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["idempotency_key", "quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8cdee3bcfc3f7c5346754bc74444ab9efb19dc7bb2ad0eee0d288734a8a4dbc7"
        },
        {
          "name": "check_status",
          "description": "Fetch a fresh content observation for an existing case. First create_quote(action='status', input={rights_holder_id, work_id, delegation_id, case_id}). Results include observed status, evidence_id, checked_at and HTTP status. Blocked retrieval or a timeout cannot prove removal. This is paid network work; use free get_operation to poll queued work and get_case to read stored observations. Authenticate with the matching action scope. Reserves the quoted maximum from prepaid credits and returns operation_id; poll get_operation for results. Sandbox execution is simulated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Caller-generated key, 8–128 letters, digits, underscores, dots, colons or hyphens. Reuse for retries of the same purchase or operation. Different input with the same organization-bound key returns a conflict.",
                "pattern": "^[A-Za-z0-9_.:-]{8,128}$",
                "type": "string"
              },
              "quote_id": {
                "description": "Unexpired quote ID returned by create_quote for action=\"status\" in this organization; all task input is stored in the quote.",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["idempotency_key", "quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:740e53863cd603bbe2109caf27517bc515fa1571a10ae0680633480fa68b4efc"
        },
        {
          "name": "create_quote",
          "description": "Create a free quote binding one action, complete input, rate version and maximum USD-cent price for 15 minutes. Does not reserve or spend credits and does not grant rights. Returns a quote ID for the matching task tool: search/find_copies, investigate/investigate_url, evidence/capture_evidence, prepare/prepare_takedown, submit/submit_takedown, status/check_status or monitor/monitor_case. Authenticate and include the exact rights-holder, work and delegation scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Billable action whose input and maximum price are bound into this quote.",
                "enum": ["search", "investigate", "evidence", "prepare", "submit", "status", "monitor"],
                "type": "string"
              },
              "input": {
                "additionalProperties": false,
                "description": "Complete input bound into the quote. Every action needs rights_holder_id, work_id and delegation_id. search: main_handle; investigate: url; evidence/status: case_id; prepare: case_id, evidence_id, good_faith, accurate_and_authorized, infringement_explanation; submit: case_id, packet_id; monitor: target_action, expires_at, per_run_limit_cents, total_limit_cents plus main_handle (search) or case_id (status).",
                "properties": {
                  "accurate_and_authorized": {
                    "description": "For prepare: true attests the claim is accurate and the signer is authorized.",
                    "type": "boolean"
                  },
                  "cadence_hours": {
                    "default": 24,
                    "description": "For monitor: hours between runs; daily by default.",
                    "maximum": 168,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "case_id": {
                    "description": "Case ID returned by investigate_url, required for evidence, prepare, submit, status and status monitoring.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  "delegation_id": {
                    "description": "Unrevoked, unexpired delegation ID covering this work and action; submission requires appointment permission.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  "destination": {
                    "description": "Optional prepare destination from the case's supported enforcement routes; arbitrary recipients are not supported.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  "evidence_id": {
                    "description": "For prepare: evidence ID for this case with a current observation that the URL is live.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  "expires_at": {
                    "description": "For monitor: future ISO 8601 expiry, at most 366 days away.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "good_faith": {
                    "description": "For prepare: true attests a good-faith belief the use is unauthorized.",
                    "type": "boolean"
                  },
                  "infringement_explanation": {
                    "description": "For prepare: rights holder's factual explanation of the suspected infringement; stored as a customer assertion.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  "main_handle": {
                    "description": "For search, or monitor targeting search: creator identity/handle used for existing text and identity queries.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  "packet_id": {
                    "description": "For submit: ready packet ID returned by prepare_takedown for this case and delegation.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  "per_run_limit_cents": {
                    "description": "For monitor: maximum USD cents reserved for one recurring run.",
                    "maximum": 100000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "rights_holder_id": {
                    "description": "Rights-holder ID returned by create_rights_holder in this organization.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  "scenario": {
                    "description": "Sandbox status fixture only: simulate a missing page. Repeated timestamped observations are still required to conclude removal.",
                    "enum": ["removed"]
                  },
                  "target_action": {
                    "description": "For monitor: recurring discovery (search) or fresh observations of an existing case (status).",
                    "enum": ["search", "status"]
                  },
                  "total_limit_cents": {
                    "description": "For monitor: lifetime recurring-run budget in USD cents, at least the per-run limit.",
                    "maximum": 100000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "url": {
                    "description": "For investigate: suspected-copy public HTTP(S) URL. Private network targets are refused.",
                    "format": "uri",
                    "type": "string"
                  },
                  "work_id": {
                    "description": "Work ID returned by create_work for this rights holder.",
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["delegation_id", "rights_holder_id", "work_id"],
                "type": "object"
              }
            },
            "required": ["action", "input"],
            "type": "object"
          },
