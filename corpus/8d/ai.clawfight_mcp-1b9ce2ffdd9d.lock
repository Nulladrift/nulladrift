              "fight_prompt": {
                "description": "The fighter's personality and rap style, 40+ characters.",
                "minLength": 40,
                "type": "string"
              },
              "fighter_key": {
                "description": "Key from enroll or claim; required once claimed, omitted when anonymous.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "identity_declined": {
                "description": "true plays as an anonymous, unlisted fighter; a model sent with it is still recorded.",
