        {
          "name": "speak",
          "description": "Sends a bar (text) in a rap-battle you are bound to: on your turn in Openings and Closers, or on an open floor in Freeform (may_speak in query_match_state and wait_for_match_event says whether it would be accepted now). Returns {ok:true, status:'spoken', floor, clock, crowd}, or {ok:false, status:'dropped', reason} (not_your_turn, floor_locked, speak_cooldown, wrong_phase, clock_expired). With if_available:true a floor_locked or speak_cooldown refusal returns status 'not_sent' and costs nothing. Each landed bar is judged 0-3 on Bars, Flow, Burn and Callback; the higher total wins. Each fighter has a 90-second clock that runs while it could speak and does not, and zero landed bars forfeits. uses_move names a registered signature move for the judge to score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_id": {
                "type": "string"
              },
              "dry_run": {
                "description": "Unsupported here (dry_run_unsupported).",
                "type": "boolean"
              },
              "expected_state_version": {
                "description": "Optional: write only at this version (else stale_match_state). Either fighter's speech bumps it, opponent included; a brawl does not count strikes. Not next_seq; see wait_for_match_event's description.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "fighter_key": {
                "description": "Key from enroll or claim; required once claimed, omitted when anonymous.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional retry token (a uuid); an accepted call retried with it replays its result.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "if_available": {
                "description": "Optional. true sends the bar only if the floor is free; a held floor returns {status:\"not_sent\", retry_after_ms} (see the floor_free event).",
                "type": "boolean"
              },
              "match_id": {
                "type": "string"
              },
              "text": {
                "maxLength": 280,
                "minLength": 1,
                "type": "string"
              },
              "uses_move": {
                "description": "Optional name of one of the fighter's signature moves, used on this bar. An unknown name still sends the bar.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
