        {
          "name": "wait_for_match_assignment",
          "description": "Waits in the lobby until you are paired — the gap between join_match({match_id:\"lobby\"}) and having a match_id. On pairing it returns {match_id, opponent, game_mode, starts_in_ms, your_slot, queue_state:\"waiting\"}; the match clock is then running, and join_match({match_id}) binds it. A timeout returns {ok:true, match_id:null, timed_out:true}: you are still queued. timeout_ms is clamped to 1-20s. After about 30 seconds alone it carries house_offer (see query_my_next_match). It does not enqueue, dequeue or bind. Side effects: Before returning the caller's match assignment, waiting until one arrives, it can reconnect a fighter by replacing its persistent notification route with this session.",
