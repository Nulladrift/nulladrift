            "readOnly": true
          },
          "digest": "sha256:3b91de62d1c4b1baa43e4d99dcf66598321cb7e788d883e5ccdb49f287702c99"
        }
      ],
      "resources": [
        {
          "uri": "ui://softwarebelongs/pdf-merger",
          "name": "Software Belongs PDF Merger",
          "description": "Self-contained browser-local PDF Merger UI for compatible MCP App hosts.",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "ui": {
              "csp": {
