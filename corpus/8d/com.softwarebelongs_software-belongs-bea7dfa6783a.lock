      "serverInfo": {
        "name": "Software Belongs",
        "version": "1.0.4.121"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Discover Software Belongs public software through the catalog tools. For PDF merging, call sb_open_pdf_merger to launch its local-only interactive MCP App. The PDF contents remain in the client sandbox and are never submitted to this server. Other catalog links do not execute applications. No private account or owner operations are available.",
      "tools": [
        {
          "name": "sb_get_public_app",
          "description": "Look up a published Software Belongs app by exact slug. Unreleased and unknown apps are not exposed.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The exact public app slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8379caa1b04b67b6811b8bd712a2d1c295a7a513afb8b86e51aec9d4a13f4547"
        },
        {
          "name": "sb_list_public_apps",
          "description": "Find Software Belongs apps in the approved public deployment catalog. Returns descriptions and links, not file contents or execution.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of results from 1 to 100; default 20.",
                "type": "integer"
              },
              "search": {
                "default": null,
                "description": "Optional name, slug, or description search; at most 80 characters.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a101c41c375950a74ff94da83cc25d3d08407d83059691802aa4ba31af94e77"
        },
        {
          "name": "sb_list_public_business_tools",
          "description": "Find released Software Belongs business tools and their public descriptions, pricing mode, and website links.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of results from 1 to 100; default 20.",
                "type": "integer"
              },
              "search": {
                "default": null,
                "description": "Optional name, family, or description search; at most 80 characters.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79043d0e6309f8d8ad732fa361a4bd8e90f50e2ddf7304fde2c05b1690020340"
        },
        {
          "name": "sb_open_pdf_merger",
          "description": "Open the free Software Belongs PDF Merger in an interactive MCP App. Select and reorder 2-20 PDFs and download the merged document. Files are processed locally in the UI and are never sent to this MCP server.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://softwarebelongs/pdf-merger"
            }
          },
          "digest": "sha256:97b28e7a050f9924c1246875f695ffb5343c6866343ff6807dd8fa0faa4b33f7"
        },
        {
          "name": "sb_pdf_merger_event",
          "description": "Record a privacy-preserving, aggregate PDF Merger MCP App outcome. No document contents, file names, or user identifiers are accepted.",
          "inputSchema": {
            "properties": {
              "outcome": {
                "description": "One of opened, completed, or failed.",
                "type": "string"
              }
            },
            "required": ["outcome"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://softwarebelongs/pdf-merger",
              "visibility": ["app"]
            }
          },
          "digest": "sha256:1501152997f620c063c6f4df9e6c464cfaa5f0856d9f56381207fa9ce0e95cfd"
        },
        {
          "name": "sb_runtime_info",
          "description": "Read the running Software Belongs public MCP version and public catalog tool inventory. Owner and administrative capabilities are not disclosed.",
