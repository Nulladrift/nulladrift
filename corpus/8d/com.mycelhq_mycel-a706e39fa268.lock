          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Optional JSON body.",
                "type": "object"
              },
              "method": {
                "enum": ["GET", "POST", "PATCH", "DELETE"],
                "type": "string"
              },
              "path": {
                "description": "A path starting with /v1/.",
