          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deliverable_id": {
                "description": "The deliverable's id.",
                "type": "string"
              }
            },
            "required": ["deliverable_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
