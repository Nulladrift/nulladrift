      "instructions": "Mycel runs a service firm's recurring client work. Start with what_needs_me. You act with the owner's key: approve_and_send and send_invoice reach clients, so confirm with the owner first.",
      "tools": [
        {
          "name": "add_client",
          "description": "Add a client. Adding one can open their engagement if the firm has a live service; nothing is sent to them without the owner's OK.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Their email address, optional.",
                "type": "string"
              },
              "name": {
                "description": "The client's name (a person or a company).",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
