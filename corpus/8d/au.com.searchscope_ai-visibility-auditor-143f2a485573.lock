        {
          "name": "generate_geo_query_universe",
          "title": "Generate GEO query universe",
          "description": "Generate a commercially useful set of AI-search prompts to monitor for a website, grouped by intent: informational, problem-aware, commercial, recommendation, comparison, alternatives, brand, category, local and trust/validation. Each prompt includes intent, buyer stage, the ideal page type to answer it and a commercial priority (high / medium / low). The brand, services and location are detected from a small crawl of the site; pass service and/or location to override or narrow them (for example one service line, or a city the site does not mention yet). Use it when a user wants a monitoring list for ChatGPT, Claude, Perplexity, Gemini or Google AI Mode, a GEO keyword universe, or prompt ideas per funnel stage. It does NOT return search volumes, does not check which prompts the brand currently appears for, and avoids meaningless long-tail permutations in favour of prompts a real buyer would ask an assistant. Parameters: url (required), service (optional override), location (optional override), count (optional, default 40, max 100).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "Number of prompts to return. Default 40, max 100.",
                "maximum": 100,
                "minimum": 10,
                "type": "integer"
              },
              "location": {
                "description": "Optional location override, e.g. 'Perth' or 'Gold Coast'. Replaces the location detected from the site; pass 'none' to force non-local prompts.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "service": {
                "description": "Optional service or category override, e.g. 'emergency plumbing' or 'family law'. Replaces the services detected from the site.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "url": {
                "description": "Public website URL to audit, e.g. https://example.com.au. Bare domains are accepted (https is assumed). Private, loopback, internal and IP-literal hosts are rejected.",
                "maxLength": 2048,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "brand": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "count": {
                "type": "number"
              },
