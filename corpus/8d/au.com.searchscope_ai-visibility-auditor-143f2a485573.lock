      "serverInfo": {
        "name": "Search Scope AI Visibility Auditor",
        "title": "Search Scope AI Visibility Auditor",
        "version": "1.0.0",
        "description": "Audits any public website for AI search visibility: entity clarity, AI retrievability, trust signals, internal linking and structured data, with ranked fixes and AI search prompts to monitor. Free and read-only, from Search Scope, an SEO consultancy in Perth, Western Australia.",
        "websiteUrl": "https://searchscope.com.au/",
        "icons": [
          {
            "src": "https://mcp.searchscope.com.au/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://mcp.searchscope.com.au/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
