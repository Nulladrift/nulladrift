        {
          "name": "extract_site_entities",
          "title": "Extract site entity map",
          "description": "Build a practical entity map for a public website from a small sample of its pages: the primary entity (brand or organisation), related entities grouped into people, organisation/brand, products, services, locations and topics, explicit relationships (Brand -> offers -> Service, Brand -> located in -> City, Person -> founder of -> Brand), ambiguities, missing entity support, schema.org types found and schema types worth adding. Use it when a user asks what entities a site establishes, whether the brand, people, services and locations are stated clearly enough for search engines and AI assistants, or which schema types fit the business. It does NOT query Google's Knowledge Graph, Wikidata or any external entity database, and it does not hallucinate: every entity carries a confidence level and the source it was detected from. Low-confidence items are pattern matches on visible copy that a human should verify. Parameters: url (required), maxPages (optional, default 8, max 15). Faster and narrower than audit_ai_visibility; use the audit when you need recommendations beyond entities.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "maxPages": {
                "description": "Maximum pages to sample, including the homepage. Default 8, hard maximum 15. Pages are prioritised: homepage, about, services/products, pricing, locations, key informational pages.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "Public website URL to audit, e.g. https://example.com.au. Bare domains are accepted (https is assumed). Private, loopback, internal and IP-literal hosts are rejected.",
                "maxLength": 2048,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
