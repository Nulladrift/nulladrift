      "serverInfo": {
        "name": "letagentsin",
        "title": "Let Agents In",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Two tools. scan_domain takes a bare domain and scores it. find_providers takes a problem in plain words and returns the vendors we have measured in that category, split by where an unattended run stops. Every check is one HTTP request with a published rule, documented at /methodology, so anything this returns can be reproduced and argued with.",
      "tools": [
        {
          "name": "find_providers",
          "title": "Find providers an unattended agent can actually finish with",
          "description": "Describe the problem in your own words, for example \"let users upload images\" or \"send transactional email\". Returns the vendors we have measured in that category, split by whether an unattended run clears every barrier we test, stops at one, or was never measurable, each with the date and a link to the evidence. This is not a recommendation: it does not know whether a vendor suits your job, only where an agent stops. Routing a sentence to a category is by far the weakest thing here, and the numbers below are the ones to plan around. Measured on 40 questions written by an agent with no access to this repository and no sight of the category list, labelled before the first run, and built to be hard: fourteen of them ask about the caller own code in commercial words (a billing module, a payments table, a notifications worker), and six ask for something real that a catalogue this size does not hold. It got 29 of the 40 right, said nothing on 8 it should have answered, sent 0 to the wrong category and answered 3 that it should have refused. Put another way: it gave an answer to 14 of the 40, and 3 of those answers were wrong, while refusing 18 of the 21 it should have refused. It is deliberately quiet. One vocabulary word inside a long question decides nothing, and a question shaped like a request for code rather than for a vendor is refused outright. Silence means we could not read the question, not that the category is empty. The tool reads English. Name the category yourself when you know it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job": {
                "description": "The problem to solve, in your own words.",
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6a099b81637b3993d9364ae8c031e93076a77aaa32619bfbbb47e977884c487"
        },
        {
          "name": "scan_domain",
          "title": "Scan a domain for agent readiness",
          "description": "Scores a domain across 5 funnel stages using 16 deterministic HTTP checks. 18 points exist on paper; the score is out of the points that both applied to the domain and could be evaluated. Returns a per-check breakdown with the reason for each result and a permanent link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Bare domain, for example example.com",
                "type": "string"
              },
              "format": {
                "default": "summary",
                "description": "summary is the readable breakdown. agent returns markdown instructions you can act on directly, each task carrying the measurement behind it. sarif returns SARIF 2.1.0 for a code-scanning pipeline.",
                "enum": ["summary", "agent", "sarif"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83e86d9776200280a1556e072024618b7ca84eb2d422a846c5186b107ab1ecea"
        }
      ],
      "digest": "sha256:3f2d68aa4f4e6cdafc60a87c246c7721bf2c920b941f44fd68b70bddc5784590"
    }
  }
