        },
        {
          "name": "get_law_link",
          "description": "Resolve one legal act id to its official links and title, with status (in_force | repealed | unknown), consolidated_url, checked_at and status_source. Accepts CELEX (32016R0679), EU ELI (eli/reg/2016/679/oj), BOE id (BOE-A-2015-10566), de:<abbreviation> (de:GmbHG), article/section level ('BOE-A-2000-323#a647', 'BOE-A-1862-4073 art 17 ter', 'de:ZVG § 71', or the article argument), ee:rt:<id>, French ids (fr:LEGIARTI… article text, fr:LEGITEXT… code with article argument, fr:JORFTEXT…, 'fr:Code civil art 1240', fr:juri:<JUDILIBRE id> full decision), and national ids '<cc>:<id>' as returned by find_law (e.g. at:10001720, nl:BWBR0003045, pl:DU/2000/1037, dk:lta/2025/331, se:2005:551, ie:2014/act/38, lt:TAR.8A39C83848CB). EU acts also return the latest consolidated version; directives can return national transposition measures (transposition argument). Free, read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "article": {
                "description": "Optional article or section: ES '647', '17 ter' (anchor read from the BOE page's table of contents); DE '§ 71', 'Art. 1'; FR '1240', 'L225-1' (with fr:LEGITEXT… or a code name; returns the article text in force today). Returned under article/section with a verified deep link.",
                "type": "string"
              },
              "id": {
                "description": "CELEX, ELI, BOE id (optionally with article: 'BOE-A-2000-323#a647', 'BOE-A-1862-4073 art 17 ter'), de:<abbreviation> (optionally with section: 'de:ZVG § 71'), ee:rt:<Riigi Teataja id>, French ids (fr:LEGIARTI…, fr:LEGITEXT… with article, 'fr:Code civil art 1240', fr:juri:<JUDILIBRE id>), or a national id '<cc>:<id>' from find_law.",
                "type": "string"
              },
              "lang": {
                "description": "EU only: two-letter language, default en.",
                "type": "string"
              },
              "transposition": {
                "description": "EU directives only: true lists national transposition measures (NIM) for all Member States; a country code (e.g. 'EE') lists one country's measures. Consolidated versions are always returned for EU acts.",
                "type": ["boolean", "string"]
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
