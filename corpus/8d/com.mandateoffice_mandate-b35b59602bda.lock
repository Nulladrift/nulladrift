  "subjects": {
    "com.mandateoffice/mandate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mandateoffice.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mandate-office",
        "title": "Mandate Office",
        "version": "0.3.17"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The EU legal toolbox for AI agents. One call gets official links: find_law, get_law_link, list_sources (EU + all 27 Member States), get_company (all 27 EU states: live registers EE, FR, CZ, FI, PL, LV, IE, HR, DK, NL (KVK number only), plus LT, SE, SI from official snapshots; VIES VAT check and GLEIF LEI everywhere), get_formation_guide, get_post_formation, list_actions, quote_action. Operations (ready document packages from standard templates): list_operations, order_operation (es_auction_poa, de_gmbh_formation, it_srls_formation, fr_eurl_formation, apostille_translation for all 27 EU states). Free, read-only, no API key during beta. Every item has source_url and retrieved_at. Mandate Office gives no legal advice and never holds client funds. It never files documents on anyone's behalf; it only prepares data packages and guides, and reads public register data.",
      "tools": [
        {
          "name": "fill_template",
          "description": "Fill a standard template. Default output on MCP: content[0] = the bilingual document text, content[1] = short summary; structuredContent = metadata (status, warnings, 1-hour DOCX/PDF download links with a random id; the fill data is kept encrypted on the server for 1 hour, never in the URL); request formats docx/pdf for base64. Optional auction_id (SUB-... or BOE-B-...) prefills empty fields from public BOE data (read only, nothing is submitted); it must match fields.auction_id / fields.boe_announcement_id if those are given (else error auction_id_conflict). Incomplete fills come back with status draft_incomplete and a DRAFT / DO NOT SIGN watermark. No case assessment, no legal advice; the notary drafts the final deed. Partner-only templates need the partner key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "auction_id": {
                "description": "Optional SUB-... or BOE-B-... to prefill from public data.",
                "type": "string"
              },
              "fields": {
                "description": "Field values; principals is an array of {name, kind natural|legal, id_type, id_number, nationality (ISO alpha-2, natural persons), country (ISO alpha-2, country of incorporation) and registry (companies), address, share_percent, signatory, signatory_basis}.",
                "type": "object"
              },
              "formats": {
                "description": "MCP default [text, links]. docx/pdf add base64 files. REST default [text, docx, pdf, links].",
                "items": {
                  "enum": ["text", "links", "docx", "pdf"],
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "description": "Second language next to the base language: en (default), de, it, fr (as listed in the template).",
                "type": "string"
              },
              "lot": {
                "description": "Optional lot number for prefill.",
                "type": "string"
              },
              "template_id": {
                "description": "Template id from list_templates or quote_action, e.g. es_auction_poa_v2.",
                "type": "string"
              }
            },
            "required": ["template_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01502b45ebbdba9a2d7750e3054015fb024e0d181091a89c63402d328c0ece3e"
        },
        {
          "name": "find_law",
          "description": "Find EU or national legislation by title words, abbreviation or number in one call. Returns compact items with stable id, official links (EUR-Lex/ELI/CELEX or the national official portal), title, date, source, source_url and retrieved_at. Every item has status (in_force | repealed | unknown; in_force only when the official source says so), consolidated_url (current consolidated text, or null when the source has none), checked_at (date the status was read) and status_source. Search: EU (CELLAR, 24 languages via lang) and DE, EE, ES, AT, NL, PL, DK, LU, SE, IE, IT, LT, FI, CZ, HR, LV, SI, FR. France (Légifrance): codes and consolidated laws by title or number (e.g. '78-17'), article text by '<code> article <n>' (e.g. 'Code civil article 1240'), and French case law (JUDILIBRE, Cour de cassation) with a 'juri:' prefix (e.g. 'juri:clause de non-concurrence'). Other EU Member States: returns the official portal, its search link and ELI pattern (link_only). Free, read-only, no API key during beta. No legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "EU (default) or an EU Member State ISO code. Search: EU, DE, EE, ES, AT, NL, PL, DK, LU, SE, IE, IT, LT, FI, CZ, HR, LV, SI, FR; all 27 Member States return at least official portal links.",
                "type": "string"
              },
              "in_force_only": {
                "description": "Default true (EU, ES). EE results are always the acts in force today.",
                "type": "boolean"
              },
              "lang": {
                "description": "EU only: two-letter language of the title and EUR-Lex link, default en.",
                "type": "string"
              },
              "limit": {
                "description": "1-25, default 10.",
                "type": "integer"
              },
              "query": {
                "description": "Title words, abbreviation or number, e.g. 'general data protection', '2016/679', 'GmbHG', 'Äriseadustik', 'sociedades de capital'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:146e23c2c309d02f40b0e84fb5942a0e7632039800b12312a029f07efad96fbd"
        },
        {
          "name": "get_company",
          "description": "Look up a company in an official public EU business register in one call, any of the 27 EU states. Live open registers by ID or name: EE (with board members), FR (with directors), CZ, FI, PL (KRS number or NIP), LV, IE, HR (Sudski registar: OIB, MBS or full/partial name; no officers in the public API); DK (CVR via Datafordeler: CVR number or full registered name; no persons); AT (Firmenbuch via JustizOnline: FN such as 93363 z or a name; officers with representation rules, no birth dates); NL (KVK open dataset, free: basic data of BV and NV by KVK number only, no names or persons; names return the kvk.nl search link plus GLEIF LEI holders); LT, SE and SI from nightly snapshots of the official open bulk files (data_as_of in the answer). Other states return the official register lookup URL plus matching LEI holders from GLEIF. Any EU VAT number is checked live in VIES (id_type=vat or a prefixed number like DE123456789); LEIs via id_type=lei or country=EU. Every answer has source_url, licence and retrieved_at. Free, read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "EU member state code (EE, FR, DE, ...; EL or GR for Greece), or EU for an LEI search.",
                "type": "string"
              },
              "id_type": {
                "description": "Optional. vat = VIES check, lei = GLEIF. Default: detected from the query.",
                "enum": ["registry", "vat", "lei"],
                "type": "string"
              },
              "query": {
                "description": "Registry code (EE 8 digits, FR SIREN, CZ IČO, FI Y-tunnus, PL KRS or NIP, LV 11 digits, LT 9 digits, SE organisationsnummer 10 digits, SI matična številka 7 or 10 digits, IE company number, HR OIB 11 digits or MBS, DK CVR 8 digits, NL KVK number 8 digits, AT Firmenbuchnummer e.g. FN 93363 z), VAT number, LEI or company name.",
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a0a0c1e7b0907e0e077ecc64f9b226e72c174f3933e9623f32aaaddf86cfcac1"
        },
        {
          "name": "get_formation_guide",
          "description": "How to form a limited company in any of the 27 EU states, in one call: main forms (GmbH, SARL/SAS, SRL, BV, sp. z o.o., OÜ ...), minimum share capital, whether a notary is needed, whether fully online formation is possible (Directive (EU) 2019/1151), official portal URL, register, typical steps, languages, and whether non-residents need a local ID (e.g. NIE, codice fiscale). Every fact has a source URL; unconfirmed facts are marked verified=false. Information only: Mandate never files or signs for anyone. Free, read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "EU member state code, e.g. DE, FR, EE (GR or EL for Greece). Omit for an overview of all 27.",
                "type": "string"
              },
              "legal_form": {
                "description": "Optional filter, e.g. GmbH, SAS, SRL, BV, 'sp. z o.o.', OÜ.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
