      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Podgist is a searchable, askable library of podcast transcripts: 236,000+ episodes from about 8,000 shows, with speaker labels and timestamps that link back to the audio. Answers come from what people actually said on those shows, cited to the episode and minute, not from a model's training data. Most of the catalogue is not transcribed yet: get_podcast and list_episodes show what is, and the price to transcribe what is not, which an agent can order (quote_episode or quote_index, then order) and pay from its account's API balance. list_services, find_podcasts, get_podcast, the first page of list_episodes, analyze_feed, list_credit_tiers, get_topics, find_topics and get_news are free and need no key. The other tools need a Podgist API key sent as \"Authorization: Bearer pgk_...\"; search_transcripts, ask_question, get_transcript and later list_episodes pages are billed per call at the prices list_services shows (a transcript the account bought is free), orders cost their quoted price, and everything else is free. Tools that spend or change something say so. Keys and plans: https://www.podgist.com/api-docs. Transcript text is for reading and citing, not for bulk export, republication or model training.",
      "tools": [
        {
          "name": "analyze_feed",
          "title": "Analyze a podcast feed for indexing",
          "description": "Reads a public RSS feed (or Apple/Spotify link) and lists its episodes with which are already on Podgist and the price to transcribe the rest. Free; no key needed; at most 10 a minute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:526b2850092aafcb2f8575d3e4ef2512cbd4daca877217d1164d66552db85ce7"
        },
