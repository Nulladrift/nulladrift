            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aae9940e54fa4565b1f3fb9c38d9e4835d6effda1eec76bb129e2871e56b1bde"
        },
        {
          "name": "consultar_tienda",
          "title": "Check an online shop before paying (Spanish field names)",
          "description": "Checks an online shop by its domain using public sources and returns dated facts, each with its source. Use it before paying at a shop you or your user do not know. Free, no key needed. It reports: whether the shop publishes a signed Merchant Verification File (MVF standard) and who it belongs to; which company the website says it is and whether that company exists in the official register (VIES for EU VAT numbers, Companies House for the UK); when the domain was registered; the first archived copy of the site; its TLS certificate; the return window the shop states, with a quote; whether the domain appears in open phishing lists; and whether the shop's robots.txt lets AI agents in (\"acceso_agentes\": abierto, parcial or cerrado, with the agents it blocks). How to read it: \"identidad_verificada\" is true only when \"decision\" is \"verificada\": the shop proved it controls the domain and its company, and Fidem signed it. Any other decision (dominio_probado when the shop proved the domain on the free plan, without a signature or proof of representation; demostracion for Fidem's fictitious example, revocada, caducada, archivo_no_valido, en_revision, sin_verificar, sin_dato) means the identity is not verified. \"nivel\" is \"verificada_por_la_tienda\" only when the shop proved it controls the domain and Fidem signed it; otherwise \"consulta_publica\". Each check has a \"codigo\": confirmado / en_registro / en_certificado mean confirmed; sin_dato or sin_comprobar mean Fidem could not check (not a bad sign); no_publicado means Fidem did not find that fact on the pages it read (see \"nota\"), not that the shop hides it; no_en_vies means the VAT number is well formed but not in VIES, which does not prove the company does not exist; en_lista means the domain is on a phishing list. Field names are in Spanish. It gives no score and no buying advice, and says nothing about product quality or delivery. The same lookup with English field names is the tool check_shop.",
          "inputSchema": {
            "properties": {
              "dominio": {
                "description": "Shop domain or URL, for example shop.com",
                "type": "string"
              }
            },
            "required": ["dominio"],
            "type": "object"
          },
          "outputSchema": {
