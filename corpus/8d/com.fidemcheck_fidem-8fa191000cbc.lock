      },
      "transport": {
        "type": "http",
        "url": "https://fidemcheck.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fidem",
        "title": "Fidem",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Call consultar_tienda with a domain before paying at an unfamiliar online shop. Report the facts and their sources to the user; do not turn them into a score.",
      "tools": [
        {
          "name": "consultar_tienda",
          "title": "Check an online shop before paying",
          "description": "Checks an online shop by its domain using public sources and returns dated facts, each with its source. Use it before paying at a shop you or your user do not know. Free, no key needed. It reports: whether the shop publishes a signed Merchant Verification File (MVF standard) and who it belongs to; which company the website says it is and whether that company exists in the official register (VIES for EU VAT numbers, Companies House for the UK); when the domain was registered; the first archived copy of the site; its TLS certificate; the return window the shop states, with a quote; and whether the domain appears in open phishing lists. How to read it: \"nivel\" is \"verificada_por_la_tienda\" only when the shop proved it controls the domain and Fidem signed it; otherwise \"consulta_publica\". Each check has a \"codigo\": confirmado / en_registro / en_certificado mean confirmed; sin_dato or sin_comprobar mean Fidem could not check (not a bad sign); no_publicado means the shop does not publish that fact; no_en_vies means the VAT number is well formed but not in VIES, which does not prove the company does not exist; en_lista means the domain is on a phishing list. Field names are in Spanish. It gives no score and no buying advice, and says nothing about product quality or delivery.",
          "inputSchema": {
            "properties": {
              "dominio": {
                "description": "Shop domain or URL, for example shop.com",
                "type": "string"
              }
            },
            "required": ["dominio"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "archivo_mvf": {
                "type": "object"
              },
              "aviso": {
                "type": "string"
              },
              "certificados": {
                "type": "object"
              },
              "comprobado": {
                "type": "string"
              },
              "dominio": {
                "type": "string"
              },
              "dominio_registrado": {
                "type": "object"
              },
              "empresa": {
                "type": "object"
              },
              "error": {
                "type": "string"
              },
              "esquema": {
                "type": "string"
              },
              "listas_webs_peligrosas": {
                "type": "object"
              },
              "nivel": {
                "enum": ["verificada_por_la_tienda", "consulta_publica"],
                "type": "string"
              },
              "no_dice": {
                "type": "string"
              },
              "plazo_devolucion": {
                "type": "object"
              },
              "primera_copia_archivada": {
                "type": "object"
              },
              "tipo_titular": {
                "type": ["string", "null"]
              }
            },
            "required": ["esquema"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c60fd420ab5ec1b12a1dd40a882a76ce0d4fdebb0de06436b166b016ef844b0f"
        }
