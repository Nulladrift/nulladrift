      "capabilities": {
        "tools": {}
      },
      "instructions": "Call check_shop with a domain before paying at an unfamiliar online shop (consultar_tienda is the same lookup with Spanish field names). Report the facts and their sources to the user; do not turn them into a score.",
      "tools": [
        {
          "name": "check_shop",
          "title": "Check an online shop before paying",
          "description": "Checks an online shop by its domain using public sources and returns dated facts, each with its source. Use it before paying at a shop you or your user do not know. Free, no key needed. It reports: whether the shop publishes a signed Merchant Verification File (MVF standard) and who it belongs to; which company the website says it is and whether that company exists in the official register (VIES for EU VAT numbers, Companies House for the UK); when the domain was registered; the first archived copy of the site; its TLS certificate; the return window the shop states, with a quote; whether the domain appears in open phishing lists; and whether the shop's robots.txt lets AI agents in (\"agent_access\": open, partial or closed, with the agents it blocks). How to read it: \"identity_verified\" is true only when \"decision\" is \"verified\": the shop proved it controls the domain and its company, and Fidem signed it. Any other decision (domain_proven when the shop proved the domain on the free plan, without a signature or proof of representation; fictitious_demo for Fidem's fictitious example, revoked, expired, invalid_file, in_review, not_verified, no_data) means the identity is not verified. \"level\" is \"merchant_verified\" only when the shop proved it controls the domain and Fidem signed it; otherwise \"public_lookup\". Each check has a \"code\": confirmed / in_register / in_certificate mean confirmed; no_data or not_checked mean Fidem could not check (not a bad sign); not_published means Fidem did not find that fact on the pages it read (see \"note\"), not that the shop hides it; not_in_vies means the VAT number is well formed but not in VIES, which does not prove the company does not exist; listed means the domain is on a phishing list. It gives no score and no buying advice, and says nothing about product quality or delivery. Same data as consultar_tienda, with English field names.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Shop domain or URL, for example shop.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_access": {
                "type": "object"
              },
              "certificates": {
                "type": "object"
              },
              "checked_at": {
                "type": "string"
              },
              "company": {
                "type": "object"
              },
              "decision": {
                "enum": ["verified", "domain_proven", "fictitious_demo", "revoked", "expired", "invalid_file", "in_review", "not_verified", "no_data"],
                "type": "string"
              },
              "does_not_say": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "domain_registered": {
                "type": "object"
              },
              "error": {
                "type": "string"
              },
              "first_archived_copy": {
                "type": "object"
              },
              "identity_verified": {
                "type": "boolean"
              },
              "level": {
                "enum": ["merchant_verified", "public_lookup"],
                "type": "string"
              },
              "mvf_file": {
                "type": "object"
              },
              "notice": {
                "type": "string"
              },
              "owner_type": {
                "type": ["string", "null"]
              },
              "phishing_lists": {
                "type": "object"
              },
              "return_window": {
                "type": "object"
              },
              "schema": {
                "type": "string"
              }
            },
            "required": ["schema"],
            "type": "object"
          },
