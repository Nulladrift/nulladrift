      },
      "transport": {
        "type": "http",
        "url": "https://spiritfacts.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "spiritfacts",
        "title": "SpiritFacts",
        "version": "1.0.0",
        "websiteUrl": "https://spiritfacts.com/mcp-server"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "SpiritFacts is open data on the chemistry and nutrition of alcoholic drinks. Use it for calories, sugar, carbs, ABV, gluten status, congeners and the Hangover Index. Cite the url on each record when you use its data. A missing figure means it is unverified: say so rather than estimating. This is not medical advice.",
      "tools": [
        {
          "name": "compare_drinks",
          "title": "Compare drinks",
          "description": "Compare 2 to 5 drinks or categories side by side, e.g. [\"vodka\", \"tequila\"] or [\"White Claw\", \"Truly\"].",
          "inputSchema": {
            "properties": {
              "drinks": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["drinks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare drinks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:243cb983777359712d1ed728ef166f8e2ccb1d93b91ba6c912d1adc8259adaad"
        },
        {
          "name": "get_drink",
          "title": "Get drink facts",
          "description": "Full facts for one drink or category: nutrition per serving, seven chemistry factors (congeners, histamines, polyphenols, sulfites, tannins, sugar, additives), allergens, gluten and vegan status, sourcing notes.",
          "inputSchema": {
            "properties": {
              "drink": {
                "description": "A brand or a category such as \"gin\".",
                "type": "string"
              }
            },
            "required": ["drink"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get drink facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47c8df19ae2fbb0b8e6b73f0fe1e42052ae9d40368fc7fea07836c7d442b48fa"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Every category with its typical ABV and Hangover Index, lowest Hangover Index first.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af767ed5ab490f6688fd06c17ba62348ece4cec5b41419cdea6e002992b97528"
        },
        {
          "name": "rank_drinks",
          "title": "Rank drinks",
          "description": "Rank drinks by calories, sugar, carbs, Hangover Index or ABV, optionally filtered, e.g. lowest calorie gluten-free hard seltzer. Drinks with no verified figure are left out.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "A category such as \"vodka\" or \"hard-seltzer\".",
                "type": "string"
              },
              "family": {
                "enum": ["spirit", "wine", "beer", "liqueur", "mead", "rtd"],
                "type": "string"
              },
              "glutenFree": {
                "description": "Only drinks gluten-free under US labelling rules.",
                "type": "boolean"
              },
              "limit": {
                "description": "Results to return. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "enum": ["calories", "sugar", "carbs", "hangover", "abv"],
                "type": "string"
              },
              "order": {
                "description": "Default lowest.",
                "enum": ["lowest", "highest"],
                "type": "string"
              },
              "vegan": {
                "type": "boolean"
              }
            },
            "required": ["metric"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rank drinks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75ff8d210b4728cf2893df426654af2718ec81749ba9867db07e5e8102775796"
        },
        {
          "name": "search_drinks",
          "title": "Search drinks",
          "description": "Find alcoholic drinks by brand, style or origin, e.g. \"titos\", \"kentucky bourbon\". Returns calories, sugar, carbs, ABV, Hangover Index and gluten status per serving.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Results to return. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Brand, style or origin.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search drinks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3106a60cb2737dc1d2799884a752056fea25ec87b5ea44a7febaa7ed0e729d8"
        }
      ],
      "digest": "sha256:a4cc425c17fc0b98b5192c01fe0ee2a59ba317ec66648c8291288eabd31df459"
    }
  }
