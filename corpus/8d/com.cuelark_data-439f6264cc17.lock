          "name": "earthquake_detail",
          "title": "Earthquake details",
          "description": "One earthquake by USGS event id (e.g. us7000abcd): magnitude, depth, felt reports, intensity, PAGER alert, tsunami flag and a plain-English summary.",
          "inputSchema": {
            "properties": {
              "id": {
