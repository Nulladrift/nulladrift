          "name": "city_time",
          "title": "Local time in a city",
          "description": "Current local time, time zone, UTC offset, daylight saving changes and today's sunrise/sunset for a city (any place with 15,000+ people, GeoNames). Accepts a name like 'Pune' or a slug like 'pune-in'.",
