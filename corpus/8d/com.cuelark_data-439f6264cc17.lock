        },
        {
          "name": "earthquakes_recent",
          "title": "Recent earthquakes",
          "description": "Latest earthquakes worldwide from the USGS feed (updated every minute). Filter by minimum magnitude and time window; sorted newest first or by magnitude.",
          "inputSchema": {
            "properties": {
              "level": {
                "description": "USGS feed: significant, 4.5, 2.5 (default), 1.0 or all",
                "enum": ["significant", "4.5", "2.5", "1.0", "all"],
                "type": "string"
              },
              "limit": {
                "description": "Default 20",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_magnitude": {
                "type": "number"
              },
              "period": {
                "description": "hour, day (default), week or month (month only for significant/4.5/2.5)",
                "enum": ["hour", "day", "week", "month"],
                "type": "string"
              },
              "sort": {
                "enum": ["time", "mag"],
                "type": "string"
              }
            },
            "type": "object"
