            "readOnly": true
          },
          "digest": "sha256:b534103b9c01ce072501a2039315264576bb31ba27eb6d6535dbcc3a28462a6a"
        },
        {
          "name": "airports_nearest",
          "title": "Nearest airports",
          "description": "Airports with an IATA code or scheduled service nearest a latitude/longitude, with distance and direction.",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "type": "number"
              },
              "radius_km": {
                "type": "number"
              },
              "scheduled_only": {
                "type": "boolean"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
