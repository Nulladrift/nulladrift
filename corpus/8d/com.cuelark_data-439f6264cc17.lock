        {
          "name": "earthquakes_near",
          "title": "Earthquakes near a place",
          "description": "Earthquakes within a radius of a latitude/longitude, from the USGS feed, nearest first data includes distance_km.",
          "inputSchema": {
            "properties": {
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "level": {
                "description": "Default 2.5",
                "enum": ["significant", "4.5", "2.5", "1.0", "all"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "period": {
                "description": "Default week",
                "enum": ["hour", "day", "week", "month"],
                "type": "string"
              },
              "radius_km": {
                "description": "Default 500",
                "maximum": 20000,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Earthquakes near a place"
