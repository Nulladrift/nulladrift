      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cuelark-data",
        "title": "Cuelark Data",
        "version": "0.1.0",
        "websiteUrl": "https://data.cuelark.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live earthquakes from USGS (public domain), airport reference data from OurAirports (public domain), city, time zone, sun and country data (GeoNames, CC BY 4.0: credit GeoNames), US aircraft from the FAA registry (public domain; individual owners are never named) and US ZIP codes from the Census Bureau (public domain) with GeoNames place names. Answers are computed from the source data; quote the source and the time fields. Not for navigation or emergency decisions.",
      "tools": [
        {
          "name": "aircraft_lookup",
          "title": "US aircraft by N-number or Mode S hex",
          "description": "Look up a US-registered aircraft on the FAA registry by N-number (e.g. N12345) or 6-character Mode S hex code (e.g. A0B1C2): make, model, year, engine, seats, registration status and dates, airworthiness class and transponder code. Owner name is given for organisations only; individuals are never named.",
          "inputSchema": {
            "properties": {
              "hex": {
                "type": "string"
              },
              "n_number": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "US aircraft by N-number or Mode S hex"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e16fd9f3ea8dcc461aa2709defa2bad6c083ce46f38ffc6da8823f33173c274"
        },
        {
          "name": "airport_lookup",
          "title": "Airport details",
          "description": "Full record for one airport by IATA (DEL), ICAO (VIDP) or local code: name, location, elevation, time zone, runways, radio frequencies, nearby airports and cities. Source: OurAirports (public domain). Not for navigation.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "IATA, ICAO, GPS or local code",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Airport details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2250dedda47e25c6764cdbe64ceed2d0d9a34bd167e61180aafef564e7f3f437"
        },
        {
          "name": "airport_search",
          "title": "Search airports",
          "description": "Find airports with an IATA or ICAO code by name, city or code, optionally within one country (ISO 3166-1 alpha-2). Largest airports first.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "2-letter country code",
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search airports"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
