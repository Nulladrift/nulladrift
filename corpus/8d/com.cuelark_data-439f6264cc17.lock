          "title": "US ZIP code details",
          "description": "Details for a US ZIP code: city, state, county, coordinates, time zone, land area, and Census ACS 5-year figures (population, median age, median household income, home value, rent, education, poverty) with state comparisons, plus nearby ZIPs and airports.",
