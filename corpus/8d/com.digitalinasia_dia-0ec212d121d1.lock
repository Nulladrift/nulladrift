            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c0fed0124bf07c3139cd89a0610c6bb141fd3f85c5676be24a410e451f45ae0"
        },
        {
          "name": "get_latest_articles",
          "title": "Latest DIA articles",
          "description": "The most recent Digital in Asia articles, optionally filtered by a phrase.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional filter, e.g. \"gaming\"",
                "type": "string"
              }
