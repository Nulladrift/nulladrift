          "title": "Search Digital in Asia",
          "description": "Semantic search across Digital in Asia articles, trackers, reports and glossary on Asia's digital economy (AI, gaming, ecommerce, payments, super apps, policy). Understands natural-language questions. Returns titles, URLs, dates and the most relevant passages.",
