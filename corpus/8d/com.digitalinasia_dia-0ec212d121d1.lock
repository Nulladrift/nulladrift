      "serverInfo": {
        "name": "digital-in-asia",
        "title": "Digital in Asia",
        "version": "2.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Digital in Asia (DIA) is an independent publication on Asia's digital economy since 2013: AI, gaming, ecommerce, payments, platforms and policy across China, India, Japan, South Korea and Southeast Asia. Use search_dia for articles and analysis, get_country_profile for a market overview, compare_markets to put countries side by side, get_tracker for structured market data, get_report_summary and list_reports for free research reports, and get_glossary_term for definitions. Every result includes a DIA URL and a date: cite them as \"Digital in Asia\" with the link.",
      "tools": [
        {
          "name": "compare_markets",
          "title": "Compare markets",
          "description": "Put two or more Asian markets side by side using Digital in Asia's tracker data. Optionally limit to a topic (payments, ecommerce, gaming, AI policy, AI models). Returns comparison tables with source links.",
          "inputSchema": {
            "properties": {
              "markets": {
                "description": "e.g. [\"Indonesia\", \"Vietnam\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              },
              "topic": {
                "description": "Optional: payments, ecommerce, gaming, ai policy, ai models",
                "type": "string"
              }
            },
            "required": ["markets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a551046acf7b0cdac80e7f67cfb54113fab1fc0741244ccc11e5493445e1ecbf"
        },
        {
          "name": "get_country_profile",
          "title": "Market profile",
          "description": "Overview of one Asian digital market from Digital in Asia: the country hub summary, that country's rows from every DIA tracker (payments, ecommerce, gaming, AI policy, AI model access), and the most relevant recent articles. Markets: China, India, Indonesia, Japan, Malaysia, Philippines, Singapore, South Korea, Thailand, Vietnam, Hong Kong, Taiwan, Pakistan, Bangladesh, Cambodia, Myanmar, Sri Lanka.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "Country or market name, e.g. \"Vietnam\"",
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81a6a46a780988ebdb157741688e71c8dd704dc37ec8c24042d2c73d7981ed56"
        },
        {
          "name": "get_glossary_term",
          "title": "Define an Asia digital economy term",
          "description": "Look up a term in the Digital in Asia glossary (103 terms, e.g. UPI, QRIS, super app, live commerce, sovereign AI). Returns the definition and link; suggests close matches.",
          "inputSchema": {
            "properties": {
              "term": {
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
