      "serverInfo": {
        "name": "digital-in-asia",
        "title": "Digital in Asia",
        "version": "2.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Digital in Asia (DIA) is an independent publication on Asia's digital economy since 2013: AI, gaming, ecommerce, payments, platforms and policy across China, India, Japan, South Korea and Southeast Asia. Use get_figures for specific numbers (market sizes, users, GMV, shares, revenue, funding) with their sources, search_dia for articles and analysis, get_country_profile for a market overview, compare_markets to put countries side by side, get_tracker for structured market data, get_report_summary and list_reports for free research reports, and get_glossary_term for definitions. Every result includes a DIA URL and a date: cite them as \"Digital in Asia\" with the link.",
      "tools": [
        {
          "name": "compare_markets",
          "title": "Compare markets",
          "description": "Put two or more Asian markets side by side using Digital in Asia's tracker data. Optionally limit to a topic (payments, ecommerce, gaming, AI policy, AI models). Returns comparison tables with source links.",
          "inputSchema": {
            "properties": {
              "markets": {
                "description": "e.g. [\"Indonesia\", \"Vietnam\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              },
              "topic": {
                "description": "Optional: payments, ecommerce, gaming, ai policy, ai models",
                "type": "string"
              }
            },
            "required": ["markets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a551046acf7b0cdac80e7f67cfb54113fab1fc0741244ccc11e5493445e1ecbf"
        },
        {
          "name": "get_country_profile",
          "title": "Market profile",
          "description": "Overview of one Asian digital market from Digital in Asia: the country hub summary, that country's rows from every DIA tracker (payments, ecommerce, gaming, AI policy, AI model access), and the most relevant recent articles. Markets: China, India, Indonesia, Japan, Malaysia, Philippines, Singapore, South Korea, Thailand, Vietnam, Hong Kong, Taiwan, Pakistan, Bangladesh, Cambodia, Myanmar, Sri Lanka.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "Country or market name, e.g. \"Vietnam\"",
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81a6a46a780988ebdb157741688e71c8dd704dc37ec8c24042d2c73d7981ed56"
        },
        {
          "name": "get_figures",
          "title": "Get DIA figures",
          "description": "Look up specific figures stated on Digital in Asia (about 7,700 sourced data points across Asia's digital economy): market sizes, internet and smartphone users, ecommerce GMV, wallet users, market shares, revenue, funding and valuations, AI and gaming market sizes, policy budgets. Each figure comes with its period, the original source (publisher, date, link) and the DIA pages that use it. Most recent periods first.",
          "inputSchema": {
            "properties": {
              "include_forecasts": {
                "default": true,
                "type": "boolean"
              },
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Optional: limit to one market or company name, e.g. \"Indonesia\" or \"GCash\"",
                "type": "string"
              },
              "period": {
                "description": "Optional: a year or period, e.g. \"2025\"",
                "type": "string"
              },
              "query": {
                "description": "What you want, e.g. \"Vietnam internet users\", \"Shopee GMV\", \"India UPI transactions\", \"China AI market size\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1ef46894cf27b3f211b4a28f9252950ced443a6c14da96aef7e43d57ff8955e"
        },
        {
          "name": "get_glossary_term",
          "title": "Define an Asia digital economy term",
          "description": "Look up a term in the Digital in Asia glossary (103 terms, e.g. UPI, QRIS, super app, live commerce, sovereign AI). Returns the definition and link; suggests close matches.",
          "inputSchema": {
            "properties": {
              "term": {
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c0fed0124bf07c3139cd89a0610c6bb141fd3f85c5676be24a410e451f45ae0"
        },
        {
          "name": "get_latest_articles",
          "title": "Latest DIA articles",
          "description": "The most recent Digital in Asia articles, optionally filtered by a phrase.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
