        },
        {
          "name": "get_report_summary",
          "title": "Get a DIA report summary",
          "description": "Key findings and section headings of a Digital in Asia research report (fintech and digital payments, AI in Asia, Southeast Asia ecommerce, Vietnam gaming), plus the link to the free PDF.",
          "inputSchema": {
            "properties": {
              "report": {
                "description": "Report slug or a few words of its title, e.g. \"fintech\"",
                "type": "string"
              }
            },
            "required": ["report"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
