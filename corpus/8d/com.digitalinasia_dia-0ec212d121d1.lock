        },
        {
          "name": "get_tracker",
          "title": "Get a DIA tracker",
          "description": "Get structured data tables from a Digital in Asia market tracker (payment rails, LLM availability and benchmarks, gaming, ecommerce marketplaces, AI policy, AI market size). Call with no arguments to list trackers.",
          "inputSchema": {
