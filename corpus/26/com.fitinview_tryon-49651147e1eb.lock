{
  "lockfileVersion": 2,
  "subjects": {
    "com.fitinview/tryon": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fitinview.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fitinview",
        "title": "FitInView virtual try-on",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FitInView virtual try-on: shows a person wearing 1 to 3 garments, from a person photo and garment product images (HTTPS URLs). Needs a FitInView API key, sent as the HTTP header `Authorization: Bearer fiv_live_...` when the connector is added. A free test key (fiv_test_..., returns a stock image, no charge) and paid keys come from https://fitinview.com/developers. Flow: get_account (credits) -> create_tryon -> if it returns status queued or running, call get_tryon with the job_id until succeeded or failed. result_url is a PNG link valid for 24 hours. Cost per try-on: 1K 8 credits, 2K 12, 4K 20. Only use photos of people who agreed to it.",
      "tools": [
        {
          "name": "create_tryon",
          "title": "Try garments on a person",
          "description": "Generate an image of the person wearing the garments. person_url: HTTPS link to a photo of one person (full body or upper body, facing the camera). garment_urls: 1 to 3 HTTPS links to product images of the clothes. Charges credits (1K 8, 2K 12, 4K 20) unless the key is a test key. Waits up to about 50 seconds; if the result is not ready, returns the job_id to pass to get_tryon.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "garment_urls": {
                "description": "1 to 3 HTTPS URLs of garment images",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "output_size": {
                "default": "1K",
                "description": "Result resolution and cost: 1K 8 credits, 2K 12, 4K 20",
                "enum": ["1K", "2K", "4K"],
                "type": "string"
              },
              "person_url": {
                "description": "HTTPS URL of the person photo",
                "type": "string"
              },
              "prompt": {
                "description": "Optional extra direction, e.g. 'tuck the shirt in'",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["garment_urls", "person_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:21365a47e0acc0cc653a98e2a47dfd8df7be6093a11c0ad8abe22dc11e383936"
        },
        {
          "name": "get_account",
          "title": "Credits and limits",
          "description": "Credits left on this API key, its rate limit and the cost per output size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0fb3081bbf583c9cf447ac23925db320dedd29cfaee0c6e595249e98e2c82a5c"
        },
        {
          "name": "get_tryon",
          "title": "Get a try-on result",
          "description": "Status of a try-on job and, once succeeded, a fresh result_url (PNG, valid 24 hours).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "job_...",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4076cf51199a20e8fa66294a4534e2f87ef74305f66fe4d0c572113cbdeaae0d"
        },
        {
          "name": "list_tryons",
          "title": "List recent try-ons",
          "description": "Recent try-on jobs made with this API key, newest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "enum": ["queued", "running", "succeeded", "failed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
