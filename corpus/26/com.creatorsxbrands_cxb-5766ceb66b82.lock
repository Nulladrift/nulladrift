        {
          "name": "request_outreach",
          "title": "Order videos from creators",
          "description": "Order videos: give the brief (what the videos should say or show), who the creators should be, a timeline and a budget. CxB finds creators who look like the brand's customers, gets their yes and delivers the finished videos. Optionally pass a job_id from find_creators and the creator handles to start with. Needs the user's CxB account; the quote goes to its email. A person replies with a quote within a day; nothing is sent to creators until the quote is accepted. Returns a request_id.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "The brand or product name.",
                "type": "string"
              },
              "brief": {
                "description": "What the videos should say or show, e.g. \"a nurse shows how she swaps a night shift in the app in under a minute\".",
                "type": "string"
              },
              "budget": {
                "description": "e.g. \"$1,500 for 5 videos\".",
                "type": "string"
              },
              "country": {
                "description": "Only if the user named a country. A preference: creators there rank first, but it isn't required. To require it, add it to must (e.g. \"lives in the US\").",
                "type": "string"
              },
              "creator_handles": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "deliverables": {
                "description": "e.g. \"one 30-second TikTok each, whitelisting for 60 days\".",
                "type": "string"
              },
              "followers": {
                "description": "Follower range. Default 1,000 to 150,000.",
                "properties": {
                  "max": {
                    "type": "integer"
                  },
                  "min": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "job_id": {
                "description": "A find_creators job to draw creators from.",
                "type": "string"
              },
              "must": {
                "description": "Requirements every match must show, e.g. [\"works nights\"]. Default: everything in `who`.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "nice": {
                "description": "Preferences that rank a creator higher but aren't required, e.g. [\"B2B software\"]. Moving a requirement here can multiply the matches.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "type": "string"
              },
              "platforms": {
                "description": "Where to search: any of \"tiktok\", \"instagram\" (Reels), \"youtube\", \"linkedin\", or \"all\". Default [\"tiktok\"]. With several, the matches are shared out across them.",
                "items": {
                  "enum": ["tiktok", "instagram", "youtube", "linkedin", "all"],
                  "type": "string"
                },
                "type": "array"
              },
              "product_url": {
                "description": "The product's website, if the user gave one.",
                "type": "string"
              },
              "timeline": {
                "description": "e.g. \"videos live by Dec 1\".",
                "type": "string"
              },
              "who": {
                "description": "Who the creators should be, in plain words: \"ER nurses who work nights\", \"account executives at SaaS companies\", \"parents of kids with food allergies\".",
                "type": "string"
              }
            },
            "required": ["budget", "timeline", "who"],
            "type": "object"
          },
