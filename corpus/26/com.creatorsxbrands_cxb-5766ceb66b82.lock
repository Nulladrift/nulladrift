      "serverInfo": {
        "name": "cxb",
        "title": "Creators x Brands (creatorsxbrands.com): videos from creators who look like your customers",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Creators x Brands (creatorsxbrands.com) gets brands videos from real UGC creators who look like their customers (an ER nurse for a nurse app, an account executive for a sales tool), checked from their own bio and posts. When the user wants videos, call request_outreach with the brief, who the creators should be, a timeline and a budget (ask only for what's missing): CxB finds the creators, gets their yes and delivers the finished videos; a person emails a quote within a day and nothing is charged until the user accepts. When the user only wants to see creators, call find_creators right away with who the creators should be, then get_job: it waits for the graded results, which usually take 1-2 minutes. Searches run on the user's CxB account: 3 free searches, no card; results are emailed to the account's address. If a tool answers sign_in_needed, show the creators it did return, give the user the signup link, and stop there; never ask for their email yourself. get_account shows the plan and what is left. Solo and Pro are unlimited searches under fair use, paid through the link the tools return. Searches cover TikTok, Instagram (Reels), YouTube and LinkedIn: pass platforms when the user names one (TikTok is the default), or [\"all\"] for a mix.",
      "tools": [
        {
          "name": "find_creators",
          "title": "Find creators who look like the customer",
          "description": "Starts a search for real creators who look like the brand's customers, on TikTok, Instagram (Reels), YouTube or LinkedIn (TikTok unless `platforms` names others), judged from their own bio and posts, active in the last 30 days, with posts that get watched (typical views at least 0.3x followers on TikTok; each platform has its own bar). Only exact fits are returned, each with the quoted evidence for every must-have. Returns at once with a job_id and instant matches: creators CxB already checked that look like the brief. A fresh search graded against the exact must-haves follows, usually within 2 minutes: call get_job right away, it waits for the result. Runs on the user's CxB account (the link this AI was connected with): 3 free searches, up to 5 creators each; Solo ($27/month) and Pro ($97/month) are unlimited searches under a fair-use window (3 and 10 fresh searches every 5 hours). Without an account it returns only the creators already checked and a signup link to give the user. Out of free searches, or asking for a paid plan the account isn't on, it returns a Stripe payment link tied to the account; the plan turns on within a minute of paying. Use it when the brief is about who the creator is, not just a topic or follower count. The full list with each creator's contact is emailed to the account's address.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "The brand or product name.",
                "type": "string"
              },
              "country": {
                "description": "Only if the user named a country. A preference: creators there rank first, but it isn't required. To require it, add it to must (e.g. \"lives in the US\").",
                "type": "string"
              },
              "followers": {
                "description": "Follower range. Default 1,000 to 150,000.",
                "properties": {
                  "max": {
                    "type": "integer"
                  },
                  "min": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "max_matches": {
                "description": "At most this many exact fits. Capped by the plan.",
                "type": "integer"
              },
              "must": {
                "description": "Requirements every match must show, e.g. [\"works nights\"]. Default: everything in `who`.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "nice": {
                "description": "Preferences that rank a creator higher but aren't required, e.g. [\"B2B software\"]. Moving a requirement here can multiply the matches.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "type": "string"
              },
              "plan": {
                "description": "free (default): 3 searches per account, up to 5 creators each. solo ($27/month) and pro ($97/month): unlimited searches, fair use 3 or 10 fresh searches every 5 hours. A subscriber's searches run on their plan by themselves; pick a paid plan only when the user asked for it, and it returns the payment link for their account.",
                "enum": ["free", "solo", "pro"],
                "type": "string"
              },
              "platforms": {
                "description": "Where to search: any of \"tiktok\", \"instagram\" (Reels), \"youtube\", \"linkedin\", or \"all\". Default [\"tiktok\"]. With several, the matches are shared out across them.",
                "items": {
                  "enum": ["tiktok", "instagram", "youtube", "linkedin", "all"],
                  "type": "string"
                },
                "type": "array"
              },
              "product_url": {
                "description": "The product's website, if the user gave one.",
                "type": "string"
              },
              "who": {
                "description": "Who the creators should be, in plain words: \"ER nurses who work nights\", \"account executives at SaaS companies\", \"parents of kids with food allergies\".",
                "type": "string"
              }
            },
            "required": ["who"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Find creators who look like the customer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:54c58bdcf24862bbefbdbccd381744090a4eab984c41d7422549a109ea323f04"
        },
        {
          "name": "get_account",
          "title": "Check the CxB account",
          "description": "Free. Whether this AI is connected to a CxB account, and for which email: the plan, free searches left, the paid fair-use window and when it reopens, and the links to upgrade. Call it to confirm a new connection works, or before telling the user what they have left.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
