        {
          "name": "get_table_data",
          "description": "Retrieves the data (values) of an Idescat table in JSON-stat format for a territorial division. You can retrieve the ENTIRE table (without filters) or only a SUBSET by passing the OPTIONAL parameters 'filters' (specific categories per dimension) and/or 'last' (number of last time periods); filtering returns smaller responses and allows querying tables that as a whole would exceed the limit. The filters use the dimension identifiers and category codes (category.index) returned by get_table_metadata (with the same 'geo'). IMPORTANT: the 20,000 cell limit is checked AFTER applying the filters; if it exceeds it, it returns a 'Dataset too large' error and you must add more filters (filters, last). You can call get_table_metadata beforehand to know the dimensions, periods, and category codes. The result contains: 'id' (dimension names in order), 'size' (number of categories per dimension), 'value' (flat array of values), 'dimension' (details per dimension: codes in category.index, labels in category.label, units in category.unit), 'role' (which dimensions are time, geo, or metric), 'status' (marks special values). HOW TO READ 'value' (row-major order): the array is FLAT; the LAST dimension of 'id' varies fastest and the first slowest. To get the value of a combination of categories (one per dimension) follow these 4 steps: (1) for each dimension, look for the POSITION (0-based) of the chosen category in dimension.{nom}.category.index — this 'index' can be a code→position object or a list of codes (the position is the index within the list); ALWAYS use this index, DO NOT assume alphabetical order or by label; (2) the stride of each dimension = product of the 'size' of the SUBSEQUENT dimensions (the last dimension has stride 1); (3) offset = sum of (position × stride) of all dimensions; (4) the searched value is value[offset]. Use the order of the 'id' array in all steps (NOT the order of keys in 'dimension'). EXAMPLE: id=['territory','sex'], size=[3,2], territory.index={BCN:0,GIR:1,LLE:2}, sex.index={M:0,F:1} → strides=[2,1]; for Girona+Woman: offset = 1×2 + 1×1 = 3, i.e., value[3]. Canonical ordering sample: https://json-stat.org/samples/order.json. WARNINGS: 1) null values (data not available) OCCUPY their position within the order: they DO NOT shift the index. 2) 'Base 2024', 'Base 2024=100' or '2024 Statistical Revision' in the title DO NOT indicate estimates; they are only the year of methodological reference and the data are real and definitive unless 'status' indicates otherwise. CALCULATIONS: never add, subtract or compute percentages yourself from the returned values; use filters ranges, sum and derive and report the server's result, checking that extension.derived (codes used, warnings) matches the question.",
          "inputSchema": {
            "properties": {
              "derive": {
                "additionalProperties": false,
                "description": "OPTIONAL. Derived metrics computed by the server. Results carry their own unit/decimals; cells that cannot be computed are null with status d.",
                "properties": {
                  "difference": {
                    "description": "\"previous\" or a period code: adds <METRIC>_DIFF versus the previous period or the given base period.",
                    "type": "string"
                  },
                  "percent_change": {
                    "description": "\"previous\" or a period code: adds <METRIC>_PCT = 100 × (value − base) / base.",
                    "type": "string"
                  },
                  "share": {
                    "description": "Dimension id: adds <METRIC>_SHARE = 100 × value / value(TOTAL of that dimension).",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "filters": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "OPTIONAL filter by dimension: the keys are dimension identifiers (for example, 'SEX', 'COM', 'YEAR') and the values are category codes separated by commas (for example, {\"SEX\": \"F\", \"COM\": \"01,TOTAL\"}). The codes are obtained from category.index of get_table_metadata. Without filters, the entire table is retrieved. Values can also be AGE RANGE EXPRESSIONS for dimensions coded Y000/Y005_009/Y_GE100: \">=65\", \">65\", \"<16\", \"<=15\", \"16-64\" (resolved by the server to the exact list of codes, returned in extension.derived.ranges; an error is returned if the published groups cannot represent the bound exactly).",
                "type": "object"
              },
              "geo": {
                "description": "Territorial division code (optional, defaults to 'cat' = Catalonia as a whole). Other values: 'prov', 'at', 'com', 'mun', 'dis', 'sec'. It must match the 'geo' checked in get_table_metadata. Divisions other than 'cat' usually exceed the 20,000 cell limit; in this case add filters (filters, last) to reduce the selection.",
                "type": "string"
              },
              "last": {
                "description": "OPTIONAL. Number of last time periods to retrieve (for example, 2 = the two most recent years). Do not combine it with an explicit filter on the time dimension",
                "type": "integer"
              },
              "stat": {
                "description": "Statistic acronym in lowercase (for example, 'censph', 'piba')",
                "type": "string"
              },
              "sum": {
                "description": "OPTIONAL. Dimensions to collapse by adding up their categories (e.g. [\"AGE\"]). Only for additive metrics (listed in the metric dimension's extension \"%\"); TOTAL is excluded automatically; time, metric and territorial dimensions cannot be summed. The result is a single category with code SUM; the codes summed are listed in extension.derived.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "table": {
                "description": "Numerical identifier of the table, obtained from get_idescat_stat_tables (for example, '21654', '8607')",
                "type": "string"
              }
            },
            "required": ["stat", "table"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:94d1b434cba4fdbf7bb7d85854d9866adf39661f56b1da463deea900a98c2ccb"
        },
