      "instructions": "# Idescat MCP — Usage guidance\r\n\r\nTools to query the official statistics of Catalonia (Idescat): list of statistics, tables and data in JSON-stat format.\r\n\r\n---\r\n\r\n## 1. Choosing a statistic\r\n\r\nAlways start with `get_idescat_stats` to locate the statistic. For each one, check two key fields before choosing:\r\n- `datasets` (boolean): if `true` the statistic is normalized and you can use the rest of the tools (`get_idescat_stat_tables`, `get_table_metadata`, `get_table_data`, `get_table_geo`, `render_table`). If `false`, ONLY `get_idescat_stats` and `get_idescat_stat` are available.\r\n- `geo` (array): available territorial breakdown levels (`cat`=Catalonia, `prov`=provinces, `at`=territorial plan areas, `com`=comarques and Aran, `mun`=municipalities, `dis`=districts, `sec`=census tracts). ALWAYS check `geo` before choosing a statistic for a territorial query: if comarca-level data is requested, pick a statistic whose `geo` includes `com`.\r\n\r\n### Population figures\r\n\r\nWhen population data is requested there are several sources: the main and richest one is **CENSPH** (population and housing census, annual); for half-yearly estimates there is **EP** (population estimates, half-yearly); and there is also **PMH** (municipal population register, annual). By default use CENSPH (or EP for half-yearly data). NEVER use the PMH statistic for population data unless the user explicitly asks for it.\r\n\r\n---\r\n\r\n## 2. Data-retrieval flow\r\n\r\n1. When the user asks for specific data from a table, call `get_table_metadata` first. If the question is about a specific territory (comarca, municipality, province, area), pass the proper `geo` parameter (e.g. `geo='com'`, `geo='mun'`, `geo='prov'`); if you don't know the codes, call `get_table_geo`.\r\n2. Check the metadata `size` field: multiply all array elements. If the product exceeds 20,000, do not fetch the whole table: reduce the selection with `filters` and/or `last` (the limit applies after filtering). Only if no reasonable selection fits, tell the user and offer the HTML link to the table.\r\n3. To fetch data always use `get_table_data` (or `render_table`), which accepts optional filters:\r\n   - For a SINGLE territory or a subset (e.g. GDP of one comarca), call `get_table_data` with the proper `geo` and a filter on the territorial dimension (e.g. `geo='com'` and `filters={\"COM\":\"21\"}`), and/or `last` to limit the periods. Remember that without `geo` the call returns the Catalonia total (`geo='cat'`) by default, which does NOT include comarques, municipalities or provinces.\r\n   - When you need the full dataset (≤ 20,000 cells), call `get_table_data` without filters.\r\n\r\n---\r\n\r\n## 3. Interpreting JSON-stat\r\n\r\nNote: within a JSON-stat dataset, `id` refers to the ORDERED list of dimension names (see below) — this is unrelated to a statistic's acronym (`stat` parameter, section 6) or a table's numeric identifier (section 7).\r\n\r\nDataset structure:\r\n- `id`: ORDERED list of dimension names. This is the order that governs position calculations (NOT the key order of `dimension`).\r\n- `size`: number of categories per dimension (same order as `id`).\r\n- `dimension.{name}.category.index`: 0-based position of each category code within the dimension. It comes in one of two forms: an object `{code: position}` or a list `[code0, code1, ...]` (the position is the list index). ALWAYS use this index; do not assume alphabetical or label order.\r\n- `dimension.{name}.category.label`: code → human-readable label.\r\n- `value`: FLAT array with all values, in row-major order ([link](https://en.wikipedia.org/wiki/Row-major_order)): the LAST `id` dimension varies fastest and the first varies slowest.\r\n- `status`: flags special values (e.g. provisional or confidential data).\r\n\r\nTo READ the value of a specific combination of categories (one per dimension):\r\n1. For each dimension, take the position `p` of the chosen category from `category.index`.\r\n2. Compute each dimension's stride = product of the `size` of ALL later dimensions; the last dimension has stride = 1.\r\n3. `offset` = sum of (`p` × stride) over all dimensions.\r\n4. The value is `value[offset]`.\r\n\r\nExample: `id=['territory','sex']`, `size=[3,2]`; `territory.index={BCN:0,GIR:1,LLE:2}`, `sex.index={M:0,F:1}` → strides `[2,1]`. For Girona+Female: `offset = 1×2 + 1×1 = 3` → `value[3]`. Canonical sample: https://json-stat.org/samples/order.json\r\n\r\nNotes:\r\n- `null` (data not available) OCCUPIES its slot in the order: it does NOT shift the index.\r\n- \"Base 2024\", \"Base 2024=100\" or \"2024 Statistical Revision\" in the title do NOT mean estimates; they only indicate the methodological reference year (data is real unless `status` says otherwise).\r\n\r\n---\r\n\r\n## 4. Calculations (MANDATORY)\r\n\r\nNEVER add, subtract or compute percentages yourself from table values: models make arithmetic and selection mistakes. When the answer requires an aggregate (e.g. population aged 65 and over), a share of a total, a difference or a growth rate, ask the server to compute it with `get_table_data` or `render_table`:\r\n\r\n- **Age ranges** in `filters`, for dimensions whose codes look like `Y000`, `Y005_009`, `Y_GE100`: `{\"AGE\": \">=65\"}`, `\">65\"`, `\"<16\"`, `\"<=15\"`, `\"16-64\"`. \"65 and over\" is `>=65`; \"more than 65\" is `>65` (66 and over). If the user's wording is ambiguous, ask. The server resolves the expression to the exact list of codes; if the published groups cannot represent the bound (e.g. `>65` on five-year groups), it returns `range_not_representable` with the nearest representable bounds: switch to a year-by-year table or ask the user, never estimate or prorate.\r\n- **`sum`**: dimensions to collapse by adding their categories, e.g. `\"sum\": [\"AGE\"]`. Only metrics listed in the metric dimension's `extension[\"%\"]` are additive (counts such as population); rates, means and indices are refused with `metric_not_additive`. `TOTAL` is excluded automatically. Time, metric and territorial dimensions cannot be summed: for a comarca, province or area use the corresponding `geo` division, which already publishes the official aggregate.\r\n- **`derive`**: `{\"share\": \"AGE\"}` adds `<METRIC>_SHARE` (% over the `TOTAL` of that dimension; works together with `sum` on the same dimension); `{\"percent_change\": \"previous\"}` or `{\"percent_change\": \"2021\"}` adds `<METRIC>_PCT`; `{\"difference\": \"previous\" | \"<period>\"}` adds `<METRIC>_DIFF`. Cells that cannot be computed are `null` with status `d`.\r\n\r\nBefore answering, check that the server's selection matches the question: in `get_table_data` read `extension.derived` (`ranges` → codes used, `sum` → codes summed, `derive` → formulas, `warnings`); in `render_table` read the \"Calculations\" notes under the table. Report the server's value as returned (do not re-round), mention relevant warnings (e.g. \"age not recorded in some cases\", provisional data, territorial changes), present derived figures as an elaboration from Idescat data, and cite the source link. If the server returns a calculation error (`incomplete_data`, `metric_not_additive`, `geo_not_summable`, `total_not_available`, …), explain the limitation and do not improvise a figure.\r\n\r\n---\r\n\r\n## 5. Data truthfulness and source (MANDATORY)\r\n\r\n- NEVER use your internal knowledge or training data to give figures, dates, amounts, percentages, rankings or any statistical value. Every reported value must come LITERALLY from a tool call made in this same conversation: either a published value or a value derived by the server (section 4). Mental arithmetic is not a valid source.\r\n- If you haven't called a tool, the tool returned an error, or the dataset is too large, do NOT invent or infer data. Clearly state you couldn't obtain it and offer the table link.\r\n- Whenever you cite data it is MANDATORY to include the Markdown link to the source table. Data tools return a `source` field with this link: use it. If you don't have it, build it as `https://www.idescat.cat/pub/?id={stat}&n={table}`. NEVER present data without this source link.\r\n- If in doubt about the origin of a figure, do not give it.\r\n\r\n---\r\n\r\n## 6. Statistic acronyms: presentation and arguments\r\n\r\nWhen mentioning a statistic's acronym in your responses, always write it in UPPERCASE (for example, EPA, AFI, CENSPH, PIBA). In contrast, when passing the acronym as a tool argument (the `stat` parameter), always write it in lowercase (e.g. `epa`, `afi`, `censph`, `piba`), as the parameters require.\r\n\r\n---\r\n\r\n## 7. Table naming\r\n\r\nWhen presenting lists of tables, each table has a numeric identifier. Always refer to it as \"identifier\" or \"table [number]\", never as \"node_id\", \"node\" or any other internal technical denomination.\r\n\r\n---\r\n\r\n## 8. MCP resources\r\n\r\nBesides the tools, the server exposes \"resources\" (context-attachable content, no action executed): `idescat://instructions` (this guide), `idescat://glossary/geo` (territorial codes), `idescat://catalog/stats` (statistics catalog) and templates like `idescat://stat/{stat}`, `idescat://stat/{stat}/tables`, `idescat://table/{stat}/{table}` and `idescat://table/{stat}/{table}/data`. These URIs are stable, citable references, but do NOT replace the mandatory Markdown link to the Idescat web table (section 5) when reporting data.",
      "tools": [
        {
          "name": "get_idescat_stat",
          "description": "Obtains information about an Idescat (Statistical Institute of Catalonia) statistic given its acronym. Use it when the user asks about a specific statistic identified by its acronym (for example, CENSPH, EPA, PIBC, AFI, etc.). The 'datasets' field is a key boolean: if true, the statistic is normalized and therefore available in get_idescat_stat_tables and the rest of the table-level tools (metadata, data, divisions, etc.); if false, the statistic is NOT normalized and get_idescat_stat_tables will not recognize it (it would return an identifier error), so the only information available is what this same tool returns ('url', 'time_ref', 'update_date', 'update_title', 'update_text'). To know if a statistic has queryable tables, this tool is enough, without calling get_idescat_stat_tables. The 'url' field is a relative address to https://www.idescat.cat. The 'geo' field is an array with the available geographical disaggregation levels (e.g., 'cat', 'prov', 'at', 'com', 'mun', 'dis', 'sec'). POPULATION FIGURES: when population data is requested, the main and richest source is CENSPH (population and housing census, annual); for semi-annual estimates there is EP (population estimates, semi-annual); and there is also PMH (municipal register of inhabitants, annual). By default, choose CENSPH (or EP if semi-annual data is requested) and NEVER use PMH for population data unless the user explicitly asks for it.",
