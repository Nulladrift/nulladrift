        {
          "name": "render_table",
          "description": "Returns a Markdown table already built with the filtered data from an Idescat table, ready to be shown to the user without having to interpret the JSON-stat. It includes the title, units, the table with category labels, status notes (e.g., provisional data), and ALWAYS a final link to the table on the Idescat website that must be kept in the response to the user. By default, it puts the time dimension in rows and the first dimension with more than one category in columns; this can be changed with the 'rows' and 'cols' parameters. All other dimensions with more than one category must be reduced to a single category with 'filters'. IMPORTANT (error self-correction): if the tool returns the error with 'pending_dimensions', DO NOT change tools: call render_table again adding the 'filters' parameter with a single category for each pending dimension (you can start from the 'suggested_filters' field that comes in the same error response, but choose the appropriate category for the user's question according to 'categories'). If it then returns the size error (maximum 40 rows × 15 columns), follow the 'how_to_fix' field: if the time dimension has too many columns, add the 'last' parameter (e.g., last: 12), and if the rows dimension is too large, filter it with 'filters' or swap 'rows'/'cols'. You can chain 'filters' and 'last' in the same call. The values '..' indicate data not available. CALCULATIONS: never add, subtract or compute percentages yourself from the returned values; use filters ranges, sum and derive and report the server's result, checking that the Calculations notes under the table (codes used, warnings) match the question.",
          "inputSchema": {
            "properties": {
              "cols": {
                "description": "Identifier of the dimension that should go in the columns (for example, 'SEX'). Default: the first dimension with more than one category that is not the row one",
                "type": "string"
              },
              "derive": {
                "additionalProperties": false,
                "description": "OPTIONAL. Derived metrics computed by the server. Results carry their own unit/decimals; cells that cannot be computed are null with status d.",
                "properties": {
                  "difference": {
                    "description": "\"previous\" or a period code: adds <METRIC>_DIFF versus the previous period or the given base period.",
                    "type": "string"
                  },
                  "percent_change": {
                    "description": "\"previous\" or a period code: adds <METRIC>_PCT = 100 × (value − base) / base.",
                    "type": "string"
                  },
                  "share": {
                    "description": "Dimension id: adds <METRIC>_SHARE = 100 × value / value(TOTAL of that dimension).",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "filters": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Filters by dimension: the keys are dimension identifiers (for example, 'SEX', 'COM', 'YEAR') and the values are category codes separated by commas (for example, {\"SEX\": \"F\", \"COM\": \"01,TOTAL\"}). The codes are obtained from category.index of get_table_metadata. Values can also be AGE RANGE EXPRESSIONS for dimensions coded Y000/Y005_009/Y_GE100: \">=65\", \">65\", \"<16\", \"<=15\", \"16-64\" (resolved by the server to the exact list of codes, returned in extension.derived.ranges; an error is returned if the published groups cannot represent the bound exactly).",
                "type": "object"
              },
              "geo": {
                "description": "Territorial division code, obtained from get_table_geo or from 'link.related' (per example, 'cat', 'com', 'mun', 'prov'). Default: 'cat' (Catalonia as a whole)",
                "type": "string"
              },
              "last": {
                "description": "Number of last time periods to retrieve (for example, 2 = the two most recent years). Do not combine it with an explicit filter on the time dimension",
                "type": "integer"
              },
              "rows": {
                "description": "Identifier of the dimension that should go in the rows (for example, 'YEAR'). Default: the time dimension (more periods fit in the rows than in the columns)",
                "type": "string"
              },
              "stat": {
                "description": "Statistic acronym in lowercase (for example, 'censph', 'piba')",
                "type": "string"
              },
              "sum": {
                "description": "OPTIONAL. Dimensions to collapse by adding up their categories (e.g. [\"AGE\"]). Only for additive metrics (listed in the metric dimension's extension \"%\"); TOTAL is excluded automatically; time, metric and territorial dimensions cannot be summed. The result is a single category with code SUM; the codes summed are listed in extension.derived.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "table": {
                "description": "Numerical identifier of the table, obtained from get_idescat_stat_tables (for example, '21654', '8607')",
                "type": "string"
              }
            },
