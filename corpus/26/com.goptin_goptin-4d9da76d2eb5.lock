{
  "lockfileVersion": 2,
  "subjects": {
    "com.goptin/goptin": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.goptin.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "goptin",
        "title": "Goptin",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Goptin is the user's unified work inbox: chats and tickets from all their connected accounts (Slack, Teams, Google Chat, Jira, ClickUp, Telegram, Zalo, Messenger, Instagram…), often several accounts per channel. Call list_accounts first when the user names a workspace/account, and pass `account` to scope other tools. For \"what's new / what should I do today\", start with get_digest, then list_tasks. When the user names a person (\"Lena\", \"anh Quân\"), call find_person first — it handles diacritics, nicknames and word order and returns their DMs. send_message, comment_ticket, update_ticket and create_ticket are visible to other people: show the user the exact change and get their go-ahead before calling them. create_task and complete_task only touch the user's own to-do list.",
      "tools": [
        {
          "name": "comment_ticket",
          "description": "Post a comment on a Jira/ClickUp ticket as the user. The team sees it — show the exact text to the user and confirm first.",
          "inputSchema": {
            "properties": {
              "account_id": {
                "description": "The board's account_id from list_tickets (use with ticket_id)",
                "type": "string"
              },
              "conversation_id": {
                "description": "The ticket's conversation_id from list_tickets (when it has one)",
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "ticket_id": {
                "description": "ticket_id (ClickUp) or key (Jira) from list_tickets",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d02e4a0fcbab0105760cc6e1386d9a726169a2aeaa6bbf0c801317b1c343ea5d"
        },
        {
          "name": "complete_task",
          "description": "Mark a Goptin task done (or reopen it with done=false). ClickUp-linked tasks are updated in ClickUp too.",
          "inputSchema": {
            "properties": {
              "done": {
                "description": "false reopens the task (default true)",
                "type": "boolean"
              },
              "task_id": {
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4362fcba9d3acb0e8533218a27c81ddd5abcb77f6b7632ee64c50fc65e2e104f"
        },
        {
          "name": "create_task",
          "description": "Add a task to the user's Goptin to-do list (private to the user, nothing is sent to anyone).",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "Link the task to the conversation it came from",
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "title": {
                "description": "Short imperative, e.g. \"Send the quote to Minh\"",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:90a169cdced9b11c803284080abf852d2ed88ae6cc456ec02debb32482471cbd"
        },
        {
          "name": "create_ticket",
          "description": "Create a ClickUp ticket as the user: a subtask under parent_ticket_id (it goes into the parent's list), or a new ticket in a list. Returns ticket_id and url. The team sees it — show the user the title, description and assignees and confirm first. Jira is not supported yet.",
          "inputSchema": {
            "properties": {
              "account_id": {
                "description": "The ClickUp account_id (from list_accounts or list_tickets)",
                "type": "string"
              },
              "assignees": {
                "description": "ClickUp user ids or names, matched against the list's members",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "description": {
                "description": "Markdown",
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "list": {
                "description": "List id or name fragment (e.g. \"Sprint 102\"); optional when parent_ticket_id is given",
                "type": "string"
              },
              "parent_ticket_id": {
                "description": "Make it a subtask of this ClickUp ticket_id (inherits the parent's list)",
                "type": "string"
              },
              "status": {
                "description": "Initial status name (must exist in the list)",
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["account_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fbae9744068edbd93ba3c933e3eab122f33237df1d17b145d9ae1c8017a3bbaf"
        },
        {
          "name": "find_person",
          "description": "Find a person by name, nickname or email across all accounts — ignores diacritics and word order (\"Lena\" finds \"Le Na Nguyen\" and \"Nguyen Le Na\"). Returns their identities per app, grouped when the names match, and the conversations they're in (DMs first).",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Name, part of a name, username or email",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3d78192979183b613f0d2f360551c79f5adef3d5943f0271d9f5e8fb0209cb00"
        },
        {
          "name": "get_attachment",
          "description": "Open a file attached to a message (images are returned so you can see them). Pass message_id from read_conversation or search_messages and the attachment index (default 0). Messages whose text is only \"[image: …]\" carry their content in the attachment — open it before answering.",
          "inputSchema": {
            "properties": {
              "index": {
                "description": "Attachment index from the message's attachments list (default 0)",
                "type": "number"
              },
              "message_id": {
                "type": "string"
              }
            },
            "required": ["message_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:405d6c6c5560d910a6a87f8e763e801002c9eff3169546008b7f7baa8a256f0f"
        },
        {
          "name": "get_digest",
          "description": "Read the user's latest daily digest (one per workspace): a summary of the last 24h across all accounts, tasks due today/overdue, high-priority tickets, and conversations waiting for the user's reply. Start the day here.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a8c165c46b0ca085b1121f9e45e5b96450acad9d7f52258b5485c31084ba0904"
        },
        {
          "name": "get_ticket",
          "description": "Get one ticket live: full description, status, assignees, tags, parent, subtasks, linked tickets, attachments (with URLs), plus comments. Pass ticket_id (and account_id when you have several boards) from list_tickets, or a conversation_id. Synced tickets return the inbox thread including status/assignee/due-date change events.",
          "inputSchema": {
            "properties": {
              "account_id": {
                "description": "account_id of the Jira/ClickUp board (from list_tickets)",
                "type": "string"
              },
              "comment_limit": {
                "description": "Default 20, max 100",
                "type": "number"
              },
              "conversation_id": {
                "description": "The ticket's conversation_id, when list_tickets returned one",
                "type": "string"
              },
              "max_description": {
                "description": "Truncate the description to this many characters (default: full)",
                "type": "number"
              },
              "ticket_id": {
                "description": "ticket_id (ClickUp) or key (Jira, e.g. SCRUM-3)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7c739bad713b1aa4b31ddaa72da17f4b4dee9204cb1fd8d56b1a066ce19903b1"
        },
        {
          "name": "list_accounts",
          "description": "List every account the user has connected to Goptin (several per channel is normal). Call this first to pick the right account.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fe9e207569682866fb7da317b48ab3a84d897cea3ac0f08ae6b269df7b45d581"
        },
        {
          "name": "list_conversations",
          "description": "List recent inbox conversations (DMs, groups, channels, ticket threads), newest first, across all or one account.",
          "inputSchema": {
            "properties": {
              "account": {
                "description": "Which connected account to use: an account_id from list_accounts, or part of its name (e.g. \"EverydAI\", \"Zalo shop\"). Omit to search all accounts.",
                "type": "string"
              },
              "before": {
                "description": "ISO date: page back to conversations active before this time",
                "type": "string"
              },
              "channel": {
                "description": "Restrict to one channel: slack, msteams, googlechat, jira, clickup, telegram, zalo, gmail, facebook, instagram, whatsapp.",
                "type": "string"
              },
              "include_hidden": {
                "description": "Also include conversations the user hid",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 20, max 50)",
                "type": "number"
              },
              "query": {
                "description": "Filter by title or last-message text",
                "type": "string"
              },
              "unread_only": {
                "description": "Only conversations with unread messages or unread @mentions",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:12f0332dbcd313e7538d5d679b681407ea1e4ae9c341a561e0014f1d4ff71437"
        },
        {
          "name": "list_tasks",
          "description": "List the user's Goptin to-do list (manual, AI-extracted and ClickUp-synced tasks). Open tasks by default.",
          "inputSchema": {
            "properties": {
              "include_done": {
                "description": "Also include completed tasks",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 50, max 200",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5b02689cd3b881d615eb36fd62979705f31b861fe32dbc2d41ad3d90c46accc"
        },
        {
          "name": "list_tickets",
          "description": "List tickets live from Jira / ClickUp with status, assignees, tags, list/sprint, parent, custom fields and linked tickets. Default: open tickets assigned to the user in their current sprint/list. ClickUp: pass list (e.g. \"Sprint 102\") and scope=\"anyone\" for every ticket in a sprint, include_done for closed statuses.",
          "inputSchema": {
            "properties": {
              "account": {
                "description": "Which connected account to use: an account_id from list_accounts, or part of its name (e.g. \"EverydAI\", \"Zalo shop\"). Omit to search all accounts.",
                "type": "string"
              },
              "assignee": {
                "description": "Only tickets with an assignee matching this name (diacritics-insensitive)",
                "type": "string"
              },
              "channel": {
                "enum": ["jira", "clickup"],
                "type": "string"
              },
              "include_description": {
                "description": "Return each ticket's full description (useful to find MR/branch links)",
                "type": "boolean"
              },
              "include_done": {
                "description": "Include completed statuses",
                "type": "boolean"
              },
              "list": {
                "description": "Sprint / list name fragment or list id (e.g. \"Sprint 102\"). ClickUp: loads that whole list",
                "type": "string"
              },
              "scope": {
                "description": "\"me\" (default): tickets assigned to the user; \"anyone\": every ticket in the list (ClickUp)",
                "enum": ["me", "anyone"],
                "type": "string"
              },
              "status": {
                "description": "Only statuses whose name contains this text",
                "type": "string"
              },
              "tag": {
                "description": "Only tickets with a tag containing this text",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ec36b1b5885a11da2e65aad9e607e4eafa6c208566db6fdac328268368b698bb"
        },
        {
          "name": "read_conversation",
          "description": "Read the messages of one conversation, oldest first. Use `before` with the earliest sent_at to page back.",
          "inputSchema": {
            "properties": {
              "before": {
                "description": "ISO date: only messages sent before this time",
                "type": "string"
              },
              "conversation_id": {
                "type": "string"
              },
              "limit": {
                "description": "Default 30, max 100",
                "type": "number"
              }
            },
            "required": ["conversation_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:93ef968774c5982702a96cc6be3af7b23765eedcc1be683d0708b5a3246d4783"
        },
        {
          "name": "search_messages",
          "description": "Full-text search over stored messages across all or one account.",
          "inputSchema": {
            "properties": {
              "account": {
                "description": "Which connected account to use: an account_id from list_accounts, or part of its name (e.g. \"EverydAI\", \"Zalo shop\"). Omit to search all accounts.",
                "type": "string"
              },
              "channel": {
                "description": "Restrict to one channel: slack, msteams, googlechat, jira, clickup, telegram, zalo, gmail, facebook, instagram, whatsapp.",
                "type": "string"
              },
              "limit": {
                "description": "Default 20, max 50",
                "type": "number"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1af783ce8c4ea7a625a02b70243f34e05277fe3ddefd16c49a0fa9ef591c37e3"
        },
        {
          "name": "send_message",
          "description": "Send a message as the user into an existing conversation, through the account that conversation belongs to. This really delivers to the other person — confirm the text with the user first.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "thread_id": {
                "description": "Reply inside a thread (thread_id from read_conversation)",
                "type": "string"
              }
            },
            "required": ["conversation_id", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c15554741b520010fcc7d0b9be4c199d7daac0183aed9076a7343b26ee0dadd5"
        },
        {
          "name": "update_ticket",
          "description": "Change a Jira/ClickUp ticket: move it to another status (use a status name shown by list_tickets), set the due date, or replace the description. Changes are visible to the user's team — confirm with the user first.",
          "inputSchema": {
            "properties": {
              "account_id": {
                "description": "The board's account_id from list_tickets (use with ticket_id)",
                "type": "string"
              },
              "assignee": {
                "description": "Add an assignee. ClickUp: user id or name (matched against the list's members); Jira: accountId",
                "type": "string"
              },
              "conversation_id": {
                "description": "The ticket's conversation_id from list_tickets (when it has one)",
                "type": "string"
              },
              "description": {
                "description": "Replaces the whole description",
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "status": {
                "description": "Target status name, e.g. \"qa approved\" or \"In Review\"",
                "type": "string"
              },
              "ticket_id": {
                "description": "ticket_id (ClickUp) or key (Jira) from list_tickets",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d0b0f21531746b2b8077e1549f9748818b6f9dd684ca87330eeb15ae48528dce"
        }
      ],
      "digest": "sha256:47e86a9f0e217931ed9f7d1072373ced4f1fc9268a6bdfa998642a3d8fb2df03"
    }
  }
}
