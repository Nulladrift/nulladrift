{
  "lockfileVersion": 2,
  "subjects": {
    "ai.radixia/blog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.radixia.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Radixia Blog",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "about_radixia",
          "description": "Who is Radixia? Company profile: the four capabilities, leadership, Labs, ecosystem and contacts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df6068deb98a4ee544828092ff374d5d9863cc441f4f4115e9efb4dc1f263591"
        },
        {
          "name": "get_conference_agenda",
          "description": "The program of the conference sessions currently indexed: session blocks with times, halls, types and speakers, plus the recorded research-paper talks. Optionally filter by day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "Conference day to filter",
                "enum": ["Tuesday", "Wednesday", "Thursday"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1905cdb3b8ed2481fb0df66921947a404a95bf06babd8c773a718940ab5c52c"
        },
        {
          "name": "get_conference_session",
          "description": "Read the full auto-generated transcript of one conference session by (part of) its title. Use search_conference_transcripts or get_conference_agenda first to find session titles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "title": {
                "description": "Session title or a distinctive part of it, e.g. 'Opening Keynote' or 'TOP500'",
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ff8bf339d16bbf560a20499689f6f2c787366b72a114474155380ef78faf2dc"
        },
        {
          "name": "get_post",
          "description": "Read the full text of a Radixia blog post by its slug (get the slug from list_posts or search_posts).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Post slug, e.g. 'there-is-no-magic-in-ai'",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58116bffe963c47c6a713a29e2172a4f0196e569cc201fac64ee53b9d492beb6"
        },
        {
          "name": "list_posts",
          "description": "List the most recent posts on the Radixia blog (AI, serverless, open source, cloud). Returns title, slug, date, tags and excerpt for each.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 15,
                "description": "How many posts to return",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "tag": {
                "description": "Filter by tag slug, e.g. 'ai', 'serverless', 'e-commerce'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5702f46ee861c4494bbec7527a9efa438ebc50ad36bc904f3998e7982fd31fd7"
        },
        {
          "name": "list_tags",
          "description": "List the topic tags used on the Radixia blog, with post counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdd7d9f96d987d7a3f9b1768a9abe1636f3b841bbe467605b16ecf1e98dfa86f"
        },
        {
          "name": "search_conference_transcripts",
          "description": "Full-text search across 147 auto-generated session transcripts from the technical conferences Radixia attends: keynotes, panels, vendor talks, research papers. Returns matching passages with session title, day/time/hall and recording timestamp. Quoted phrases must match exactly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "Max passages to return",
                "maximum": 25,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search terms; wrap exact phrases in double quotes",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f6874c8960d6f5d90edb5f1506883682cac7f2e1d72eac60c43db243324cb44"
        },
        {
          "name": "search_posts",
          "description": "Full-text search across all Radixia blog posts (title, excerpt and body). Use this to find what Radixia has written about a topic, e.g. 'MCP', 'Bedrock', 'event driven'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Max results",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search terms",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f0bffbdaa6fc06bd77d672a0684425f70562c4b6792107ef01ab1a05b404ced"
        }
      ],
      "digest": "sha256:1ddbd7daf67724775e1bee4b695eb9adb91bbb186e1effa8430c384f3f119ec1"
    }
  }
}
