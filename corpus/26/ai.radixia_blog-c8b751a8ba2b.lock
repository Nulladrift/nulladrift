        },
        {
          "name": "get_post",
          "description": "Read the full text of a Radixia blog post by its slug (get the slug from list_posts or search_posts).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Post slug, e.g. 'there-is-no-magic-in-ai'",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
