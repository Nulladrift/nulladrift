                "description": "Array of account IDs to add to the collection",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "collection_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["account_ids", "collection_id"],
            "type": "object"
          },
