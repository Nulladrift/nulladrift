      "instructions": "Shortimize tracks short-form video accounts and videos (TikTok, Instagram and YouTube) for an organisation and reports their views, likes, comments, shares, bookmarks, growth and outlier_multiplier. These tools wrap the Shortimize REST API.\n\nData model: accounts (profiles) own videos; collections group accounts and videos. Accounts and videos are identified by an id or by their URL; collections by collection_id.\n\nAuthentication: send the API key as Authorization: Bearer <key> (or ?apiKey=<key> on the /mcp URL). Listing tools needs no key; calling one does. Start with authenticate to confirm the key works.\n\nRecommended first calls: total_accounts and total_videos for the size of the workspace, get_all_accounts or get_all_videos to find ids, then get_account / get_video for details and get_account_history / get_video_history / get_organisation_history for trends over time.\n\nWrites: track_* and bulk_track_* start tracking by link; stop_tracking_* and bulk_stop_tracking_* stop collecting new data (history stays); collection tools create, edit, delete and fill collections. delete_collection removes the collection and its associations, so confirm with the user first.\n\nPlan limits: Limited and Basic keys receive 1 result with masked metrics on read tools; Premium keys receive full data. Requests are rate limited per minute, so prefer the bulk and paginated tools over many single calls.",
      "tools": [
        {
          "name": "add_accounts_to_collection",
          "title": "Add Accounts To Collection",
          "description": "Add one or more accounts (account_ids) to the collection identified by collection_id. Use get_collection_accounts to check membership; remove_accounts_from_collection reverses it.",
