              },
              "username": {
                "description": "Filter videos by specific username. Exact match — Facebook usernames may carry a '~' disambiguation suffix ('handle~<platform_creator_id>') when two distinct profiles share a handle; pass the full suffixed string as returned by the API.",
                "type": "string"
              }
            },
            "type": "object"
