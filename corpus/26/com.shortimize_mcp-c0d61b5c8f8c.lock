        {
          "name": "bulk_track_accounts",
          "title": "Bulk Track Accounts",
          "description": "Start tracking up to 500 accounts in one request. Each link is handled on its own, so one bad link does not stop the rest - the response returns one entry per link with a status of tracked, already_tracked, or failed, and failed entries say whether retrying will help. Send 50 links or fewer if the data needs to start arriving immediately; larger batches are still tracked but are collected by the scheduled update.",
          "inputSchema": {
            "properties": {
              "label_ids": {
                "description": "Optional label IDs to apply to all tracked accounts",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "type": "array"
              },
              "links": {
                "description": "Array of account URLs to track",
                "items": {
                  "description": "The URL of the account to track",
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "tracking_type": {
                "description": "Optional tracking type. Defaults to organisation setting.",
                "enum": ["latest_10", "latest_30", "latest_60", "latest_100", "latest_200", "latest_500", "all_videos"],
                "type": "string"
              }
            },
            "required": ["links"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
