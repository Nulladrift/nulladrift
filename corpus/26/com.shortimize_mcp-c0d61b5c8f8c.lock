          "inputSchema": {
            "properties": {
              "collection_id": {
                "description": "The unique identifier of the collection",
                "format": "uuid",
                "type": "string"
              },
              "include_counts": {
                "default": false,
                "description": "Include video and account counts",
                "type": "boolean"
              }
