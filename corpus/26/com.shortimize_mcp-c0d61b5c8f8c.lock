        {
          "name": "bulk_stop_tracking_accounts",
          "title": "Bulk Stop Tracking Accounts",
          "description": "Stop tracking up to 500 accounts in one request. Each entry in ids can be an account id or the link you originally tracked. Historical data stays available; this only stops new data being collected. If a link cannot be matched the whole request fails with 404 before anything is removed; a request of ids can partly succeed.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Array of account IDs (UUIDs) or URLs to stop tracking",
                "items": {
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "leave_videos": {
                "default": false,
                "description": "If true, videos linked to these accounts will not be removed",
                "type": "boolean"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
