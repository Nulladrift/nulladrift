        {
          "name": "get_account",
          "title": "Get Account",
          "description": "Get one tracked account by account_id (an account UUID or its URL, URL-encoded), with platform, username, bio, follower and following counts, view/like/comment/share totals, median and mean views, percent_outperform_10x/25x and total_videos_tracked. Use it for the current stats of a single account; use get_account_history for its daily trend, get_videos_linked_to_account for its videos and get_all_accounts to find account ids. Returns one account object. Tier limits: Limited/Basic keys get 1 result with masked metrics; Premium gets full access.",
          "inputSchema": {
            "properties": {
              "account_id": {
                "description": "Account identifier - can be a UUID or account URL (URL-encoded)",
                "type": "string"
              }
            },
            "required": ["account_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9de51d562ba30b1e5110af81f210171681ab65da997ff6de560da3a05be0f5a"
        },
        {
          "name": "get_account_history",
          "title": "Get Account History",
          "description": "Get daily aggregated metrics (views, likes, comments, shares, bookmarks, engagements, ads_upload_count, total_ads) for one tracked account, identified by account_id. Defaults to the last 30 days; use start_date and end_date (YYYY-MM-DD) to change the range, within the last 90 days (2 years for Premium). Use it to see an account's trend over time; use get_account for its current stats, or get_organisation_history for the whole organisation. Returns an array with one entry per date. Tier limits: Limited/Basic keys get 1 result with masked metrics; Premium gets full access.",
          "inputSchema": {
            "properties": {
              "account_id": {
                "description": "Account identifier - can be a UUID or account URL (URL-encoded)",
                "type": "string"
              },
              "end_date": {
                "description": "End date (inclusive) in YYYY-MM-DD format",
                "format": "date",
                "type": "string"
              },
              "start_date": {
                "description": "Start date (inclusive) in YYYY-MM-DD format. Defaults to 30 days ago if not provided. Cannot be older than 90 days (730 days for premium users).",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["account_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc7c47e5e6fffb112b7a93d980723af4e9dc64d03040233a03a379d158cb1ef7"
        },
        {
          "name": "get_all_accounts",
          "title": "List Tracked Accounts",
          "description": "List every account your organisation tracks (TikTok, Instagram or YouTube profiles), one row per account with username, platform, follower count, view/like/comment/share/bookmark totals, median and mean views, percent_outperform_10x/25x and total_videos_tracked. Use it to find account ids or compare accounts; use get_account for one account, get_account_history for its daily trend, get_collection_accounts for one collection's accounts. The collections filter matches collection names. Returns a plain array, or { data, pagination } when paginated=true. Tier limits: Limited/Basic keys get 1 result with masked metrics; Premium gets full access.",
          "inputSchema": {
            "properties": {
              "collections": {
                "description": "Optional comma-separated list of collection NAMES to filter accounts (e.g. collection1,collection2,collection3). This filter matches on name only — to select a collection by its stable id, use GET /collections/{collection_id}/accounts instead.\n\nMake sure to URL encode them before sending.",
                "type": "string"
              },
              "limit": {
                "default": 5000,
                "description": "Number of items to return per page",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "order_by": {
                "default": "checked_at",
                "description": "Field to order results by",
                "type": "string"
              },
              "order_direction": {
                "default": "desc",
                "description": "Direction of ordering (ascending or descending)",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number for pagination (requires paginated=true)",
                "minimum": 1,
                "type": "integer"
              },
              "paginated": {
                "default": false,
                "description": "Set to true to receive paginated response with {data, pagination} format instead of raw array",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
