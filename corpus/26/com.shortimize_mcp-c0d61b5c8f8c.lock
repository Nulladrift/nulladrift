        {
          "name": "get_all_videos",
          "title": "List Tracked Videos",
          "description": "List the videos your organisation tracks, one row per video with ad_id, platform, username, title, upload date, latest views/likes/comments/shares/bookmarks, outlier_multiplier and increase_1d/7d/14d/30d growth. Filter by username, linked_account_id, upload or last-update date range, has_metrics or collection names. Use it to search across all videos; use get_video for one video, get_videos_linked_to_account for one account's videos, get_collection_videos for one collection's videos. Returns { data, pagination, filters }. Tier limits: Limited/Basic keys get 1 result with masked metrics; Premium gets full access.",
          "inputSchema": {
            "properties": {
              "ad_info_shop": {
                "description": "Filter TikTok shop ads (true/false)",
                "type": "boolean"
              },
              "ad_product_id_shop": {
                "description": "Filter TikTok shop ads that have a product id. (true)",
                "type": "boolean"
              },
              "collections": {
                "description": "Optional comma-separated list of collections to filter videos by. Accepts either collection names (e.g. collection1,collection2) or collection ids as returned by GET /collections (e.g. 136092c1-11db-4f29-95f8-f96b3eb0baad). Do not mix the two forms in one request — a mixed list is rejected with 400. Prefer ids: a collection can be renamed, and a name that no longer matches returns zero results rather than an error.\n\nMake sure to URL encode them before sending.",
                "type": "string"
              },
              "has_metrics": {
                "description": "Only get videos which have been retrieved atleast once (metrics are not null).",
                "type": "boolean"
              },
              "latest_updated_at_end": {
                "description": "Filter videos which have been last updated on or before this date and time (inclusive)",
                "format": "date-time",
                "type": "string"
              },
              "latest_updated_at_start": {
                "description": "Filter videos which have been last updated on or after this date and time (inclusive)",
                "format": "date-time",
                "type": "string"
              },
              "limit": {
                "default": 5000,
                "description": "Number of items to return per page",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "linked_account_id": {
                "description": "Filter videos by specific linked account ID",
                "format": "uuid",
                "type": "string"
              },
              "order_by": {
                "default": "latest_updated_at",
                "description": "Field to order results by",
                "enum": ["created_at", "uploaded_at", "latest_views", "latest_likes", "latest_comments", "latest_bookmarks", "latest_shares", "latest_engagement", "latest_updated_at"],
                "type": "string"
              },
              "order_direction": {
                "default": "desc",
                "description": "Direction of ordering (ascending or descending)",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number for pagination",
                "minimum": 1,
                "type": "integer"
              },
              "uploaded_at_end": {
                "description": "Filter videos uploaded on or before this date (inclusive)",
