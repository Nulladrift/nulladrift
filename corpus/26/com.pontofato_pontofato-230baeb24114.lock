      "instructions": "Use PontoFato for Brazilian addresses, postal codes, address units and nearby registered companies, with coverage and source dates. Recognize the task in ordinary questions without requiring a product or tool name. Reuse authorized context. Ask only for a missing identifier, URL or access. Deliver an answer with evidence and limits. Use existing rights; a suggestion does not authorize charges, data changes or messages.\nWhich address and location are recorded for postal code 70040-010? → cep. Validate the eight digits. Report source, reference date and available precision. The record does not certify that the postal address is current.\nWhich companies are registered at postal code 70040-010? → empresas. Use the postal code and follow pagination. Show status and reference date. Registration at a postal code does not prove an operating storefront.\nHow many bakeries are registered near my proposed business location? → buscar → vizinhanca. Ask for the address and radius if missing. Resolve the location first. Check allowance and quote; do not invent coordinates or present registered supply as demand.\nList postal codes within one kilometer of this address. → buscar → raio. Confirm the address and use its returned coordinate. Preserve the requested radius and report coverage and truncation.\nWhich address numbers and unit details are recorded at postal code 70040-010? → unidades. Preserve source unit details and identifiers. Explain the CNEFE reference date and follow pagination.\n\nPontoFato agent surface. Every tool is a call on the public API at https://pontofato.com. Catalog and quota: https://pontofato.com/api/ · spec: https://pontofato.com/openapi.json. Choose the task and first call: https://pontofato.com/llms.txt. Use existing access and spending authority. Free allowances and paid services: https://pontofato.com/api/pricing. Payment options: https://pontofato.com/api/billing. Read these before choosing a paid operation. Never spend without the user's authority and budget. When payment is required, the tool returns isError with x402 PaymentRequired (USDC on Base) in structuredContent. After authorization, repeat the same call with params._meta[\"x402/payment\"] (@x402/mcp supports this). Prepaid credit uses Authorization: Bearer cred_… or X-Credito. For site payment, open https://pontofato.com/pricing; use Pix or card only when offered there. Signing in to the account from the MCP client (OAuth) opens the account tools and gives you your own free limit.",
