        {
          "name": "contact",
          "title": "Contact",
          "description": "Write to the people behind the product: a question, or a sponsorship/partnership/advertising proposal. Free, no captcha and no payment; one message every 10 s per network (one that arrives sooner waits its turn). One route for a question and for a sponsorship, partnership or ad proposal (`tipo`, with the placements of `GET /api/partners`). No captcha, no account, no payment. One message every 10 seconds per network: one that arrives sooner waits its turn and then goes out — no error. The message reaches the team by e-mail, with `email` as the reply address. For voice, send multipart/form-data: `dados` is this JSON (up to 32 KiB), and `audio` is one WebM, Ogg or M4A audio file (up to 2 MB). Audio can replace message. The browser records up to two minutes. Audio is attached to the owner's e-mail.",
          "inputSchema": {
            "properties": {
              "duracao": {
                "description": "Exposure in days: `30`, `90` or `365`.",
                "enum": ["30", "90", "365"],
                "type": "string"
              },
              "email": {
                "description": "Where to reply.",
                "type": "string"
              },
              "empresa": {
                "description": "Who is proposing, when it is a company.",
                "type": "string"
              },
              "espaco": {
                "description": "Placement ids from `GET /api/partners`, up to 6.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "formato": {
                "description": "Consulting: `projeto` (per scope), `mensal` (monthly) or `assessoria` (advisory).",
                "enum": ["projeto", "mensal", "assessoria"],
                "type": "string"
              },
              "fuso": {
                "description": "Consulting: the IANA time zone, such as `America/New_York`.",
                "type": "string"
              },
              "horarios": {
                "description": "Consulting: up to 3 times for the call, `YYYY-MM-DDTHH:MM` in that time zone.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "description": "What you want to say.",
                "type": "string"
              },
              "name": {
                "description": "What to call the person writing.",
                "type": "string"
              },
              "orcamento": {
                "description": "Advertising: `ate_100`, `100_500`, `500_2000`, `2000_mais` or `a_combinar`. Consulting, in US dollars: `ate_2000`, `2000_5000`, `5000_10000`, `10000_mais` or `nao_sei`.",
                "enum": ["ate_100", "100_500", "500_2000", "2000_mais", "a_combinar", "ate_2000", "2000_5000", "5000_10000", "10000_mais", "nao_sei"],
                "type": "string"
              },
              "pagamento": {
                "description": "`usdc`, `deposito` or `a_combinar`.",
                "enum": ["usdc", "deposito", "a_combinar"],
                "type": "string"
              },
              "pais": {
                "description": "Consulting: the country of the person asking.",
                "type": "string"
              },
              "prazo": {
                "description": "Consulting: when to start (`agora`, `1_mes`, `1_3_meses` or `explorando`).",
                "enum": ["agora", "1_mes", "1_3_meses", "explorando"],
                "type": "string"
              },
              "prefer_whatsapp": {
                "description": "Request a WhatsApp reply. Requires whatsapp.",
                "type": "boolean"
              },
              "projeto": {
                "description": "Consulting: the kind of project (`llm_privado`, `voz`, `dados_sensiveis`, `gpu`, `integracao` or `outro`).",
                "enum": ["llm_privado", "voz", "dados_sensiveis", "gpu", "integracao", "outro"],
                "type": "string"
              },
              "site": {
                "description": "Website of who is proposing.",
                "type": "string"
              },
              "tipo": {
                "description": "Proposal: `patrocinio`, `parceria`, `anuncio` or `consultoria`. Turns on the fields below.",
                "enum": ["patrocinio", "parceria", "anuncio", "consultoria"],
                "type": "string"
              },
              "whatsapp": {
                "description": "Optional reply number with country code, such as +5561999999999.",
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
