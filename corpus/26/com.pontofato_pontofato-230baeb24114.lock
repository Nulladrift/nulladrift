        {
          "name": "get_api_x402_cnpj_by_cnpj",
          "title": "Get API X402 CNPJ by CNPJ",
          "description": "CNPJ lookup paid per call, without an account: the Federal Revenue record, the sanctions, the tax standing and the address on the map.\nThe same record as `GET /api/consulta/cnpj/:cnpj`, for agents: no account, no allowance and no pack. A request without payment gets the 402; a paid one gets the record in the same response, with the payment in `uso`. A lookup that fails or does not find the company is not charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cnia_atual": {
                "default": false,
                "description": "true requires a CNIA source check during this request. Source failure returns 503 without charging or using a previous record. Default false. Include sancoes when selecting topics.",
                "type": "boolean"
              },
              "cnpj": {
                "description": "CNPJ with or without punctuation (14 characters).",
                "type": "string"
              },
              "temas": {
                "description": "Comma-separated topics (up to 240 characters): dados, contagens, socios, sancoes, fiscal, divida, obras, trabalho, ibama, contratos, pep, vendas, campanhas, prefeituras, sicaf, aeronaves, fundos, rntrc, bndes, registros; todos. Omit for the full record. Basic company data always stays; partners require socios. contagens adds a contagens object with only the record counts: socios, pep, sancoes, fiscal, socioambiental, governo and registros. Unrequested fields are omitted; null means an unchecked source. SICAF, aircraft and RNTRC select registry agencies; registros includes all agencies. Prices, limits and personal data masking do not change.",
                "type": "string"
              }
            },
            "required": ["cnpj"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Get API X402 CNPJ by CNPJ"
