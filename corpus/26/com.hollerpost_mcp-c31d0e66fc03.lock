        {
          "name": "brand_get",
          "title": "Get brand",
          "description": "Returns the brand settings: workspace and from name, reply-to, logo, colors, the theme (background, surface, text, button_style, button_shape), the default info_bar, the footer (address, link buttons, disclaimer, social_icons), social profile links, the saved writing voice and the sending domain status. Free and read only. Read this before writing any campaign copy and follow the voice exactly. Requires API key scope: read.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
