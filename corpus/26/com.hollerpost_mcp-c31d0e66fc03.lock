        },
        {
          "name": "account_update",
          "title": "Update account details",
          "description": "Updates the workspace name, from name, reply-to address or the physical footer address (required by law in marketing email). Uses no quota. Reversible by setting the old value again. Billing can never be changed here. Confirm the new values with the person first. Requires API key scope: account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "footer_address": {
                "description": "Physical mailing address printed in every campaign footer.",
                "maxLength": 300,
                "minLength": 5,
                "type": "string"
              },
              "from_name": {
                "description": "Name recipients see in the From field.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "reply_to": {
                "description": "Where replies go.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "workspace_name": {
                "description": "Workspace or business name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
