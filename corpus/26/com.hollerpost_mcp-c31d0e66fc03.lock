        },
        {
          "name": "brand_set_theme",
          "title": "Save email look",
          "description": "Saves the default look of every email: theme colors (background, surface, text), buttons (button_style solid or outline, button_shape pill or rounded) and the info bar, a dark band across the top (for example free shipping). A single campaign can override any of these with blocks.theme and blocks.info_bar. Fields you leave out stay as they are; info_bar: null removes the bar; a color \"\" goes back to the default. Text needs 4.5:1 contrast with the surface; campaign_preview warns when it does not. Uses no quota and sends nothing. Only save what the person approved. Example: {\"theme\": {\"surface\": \"#ffffff\", \"text\": \"#27272a\", \"button_style\": \"outline\", \"button_shape\": \"pill\"}, \"info_bar\": {\"text\": \"Free shipping on orders over $99\", \"url\": \"https://shop.example/shipping\"}} Requires API key scope: draft.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "info_bar": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "text": {
                        "description": "Short line, for example \"Free shipping on orders over $99\".",
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      },
                      "url": {
                        "description": "Where a click on the bar goes.",
                        "maxLength": 2000,
                        "pattern": "^https:\\/\\/",
                        "type": "string"
                      }
                    },
                    "required": ["text"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Default info bar for every email, or null to remove it."
              },
              "theme": {
                "additionalProperties": false,
                "properties": {
                  "background": {
                    "anyOf": [
                      {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      {
                        "const": "",
                        "type": "string"
                      }
                    ],
                    "description": "Page color around the email."
                  },
                  "button_shape": {
                    "anyOf": [
                      {
                        "enum": ["pill", "rounded"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "pill or rounded; null goes back to the brand radius."
                  },
                  "button_style": {
                    "anyOf": [
                      {
                        "enum": ["solid", "outline"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "solid or outline; null goes back to solid."
                  },
                  "surface": {
                    "anyOf": [
                      {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      {
                        "const": "",
                        "type": "string"
                      }
                    ],
                    "description": "Email card color."
                  },
                  "text": {
                    "anyOf": [
                      {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      {
                        "const": "",
                        "type": "string"
                      }
                    ],
                    "description": "Body text color."
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save email look"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5eeaffc19e15a8d7f06bc15610517f6688c6dff4c6ddea989b84761861e895bf"
        },
        {
          "name": "brand_set_voice",
          "title": "Save brand voice",
          "description": "Saves the brand voice notes (how this business writes: tone, words to use or avoid). Replaces the previous voice text entirely, so read brand_get first and include anything worth keeping. Uses no quota and sends nothing. Reversible by saving the old text again. Only save what the person dictated or approved. Requires API key scope: draft.",
