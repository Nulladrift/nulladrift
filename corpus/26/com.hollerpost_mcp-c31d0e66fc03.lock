        {
          "name": "campaign_schedule",
          "title": "Schedule campaign",
          "description": "Schedules a drafted campaign to send to its audience. This is not reversible once sending starts, and it uses one email of quota per recipient. Call campaign_preview first, tell the person the audience count and the quota it uses, and only call this after they say yes. Pass the audience count you showed them as expected_audience_count; if the list changed meaningfully the call is refused. A workspace's first campaign is held for a one-time human review instead of sending (review_pending); say so plainly and do not retry. Before send_at, campaign_cancel can still stop it. Requires API key scope: send.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "const": true,
                "description": "Must be true, and only after the person explicitly approved this send and its audience count.",
                "type": "boolean"
              },
              "expected_audience_count": {
                "description": "The audience count you showed the person from campaign_preview.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "id": {
                "description": "Campaign id (a UUID), as returned by campaign_draft or campaigns_list.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "send_at": {
                "anyOf": [
                  {
                    "const": "now",
                    "type": "string"
                  },
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  }
                ],
                "description": "\"now\", or an ISO 8601 time with timezone such as 2026-10-05T09:00:00-07:00."
              }
            },
            "required": ["confirm", "expected_audience_count", "id", "send_at"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Schedule campaign"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
