        {
          "name": "campaign_cancel",
          "title": "Cancel scheduled campaign",
          "description": "Cancels a scheduled campaign before it starts sending. Only works while the status is scheduled; once sending has started it cannot be stopped. Uses no quota. Confirm with the person which campaign they mean (campaigns_list with status scheduled) before calling. Requires API key scope: send.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Campaign id (a UUID), as returned by campaign_draft or campaigns_list.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel scheduled campaign"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c91ce657d9daef8c435b19027018502d54cb9ad088290bfa6e8893e9910d3585"
        },
        {
          "name": "campaign_draft",
          "title": "Draft campaign",
          "description": "Creates a campaign as a DRAFT. Nothing is sent and no quota is used. Before calling: read brand_get for the voice, pick a template from templates_list, and pick the audience from segments_list. You fill the content blocks; Hollerpost renders the email with the brand header, footer and unsubscribe link. Optionally ask one survey question (survey) that readers answer with one click. Returns the id, audience_count and a preview_url to share with the person. Next step: campaign_preview, then campaign_send_test. Retail promo in one call (template promo): {\"info_bar\": {\"text\": \"Free shipping over $99\", \"url\": \"https://shop.example/shipping\"}, \"image_url\": \"https://images.hollerpost.com/...\", \"image_alt\": \"...\", \"image_link\": \"https://shop.example/sale\", \"heading\": \"Up to 30% off\", \"body_md\": \"...\", \"cta_text\": \"Shop the sale\", \"cta_url\": \"https://shop.example/sale\", \"cta_repeat\": \"bottom\", \"layout\": \"grid-2\", \"sections\": [{\"heading\": \"Maple cue\", \"price\": \"$129\", \"image_url\": \"https://images.hollerpost.com/...\", \"image_alt\": \"Maple cue\", \"cta_text\": \"Shop now\", \"cta_url\": \"https://shop.example/p/1\"}], \"fine_print\": \"Ends Sunday. Not valid with other offers.\", \"theme\": {\"button_style\": \"outline\", \"button_shape\": \"pill\"}}. The footer link buttons, Follow us icons and disclaimer come from the brand (brand_set_footer), not the blocks. Every send also gets a View in browser link, the mailing address and an unsubscribe link automatically. Requires API key scope: draft.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "signup_form_id": {
                        "description": "Form UUID from segments_list audiences or page_get. Only confirmed, active, unsuppressed email subscribers from this form, resolved when sending.",
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                        "type": "string"
                      }
                    },
                    "required": ["signup_form_id"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "tags": {
                        "description": "Send to subscribed contacts that have ANY of these tags (one tag is the usual case). Get tags from segments_list.",
                        "items": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["tags"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "all": {
                        "const": true,
                        "description": "Send to every subscribed contact in the workspace.",
                        "type": "boolean"
                      }
                    },
                    "required": ["all"],
                    "type": "object"
                  }
                ],
                "description": "Who gets it: {\"tags\": [\"vip\"]} for tagged contacts, or {\"all\": true} for every subscribed contact, or {\"signup_form_id\": \"<UUID>\"} for a waitlist."
              },
              "blocks": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Content blocks for the template. Check templates_list for the blocks_schema of the template you pick. Never send raw HTML: Hollerpost renders the blocks with the brand header, footer, unsubscribe link and address. The plain template takes no images.",
                "properties": {
                  "body_md": {
                    "description": "Body copy in Markdown: blank line between paragraphs, \"- \" lists, **bold**, *italic*, [text](https://...). To add a picture, put it on a line by itself: ![What it shows](https://...) or, clickable, [![What it shows](https://...)](https://link). Images inside a sentence are refused.",
                    "type": "string"
                  },
                  "cta_repeat": {
                    "const": "bottom",
                    "description": "\"bottom\": show the main button right after body_md AND again after the sections (retail promo style). Needs cta_text, cta_url and sections.",
                    "type": "string"
                  },
                  "cta_text": {
                    "description": "Button label, for example \"Book a visit\".",
                    "type": "string"
                  },
                  "cta_url": {
                    "description": "Button link (https URL).",
                    "type": "string"
                  },
                  "fine_print": {
                    "description": "Offer terms in small print at the very end, for example \"Ends Sunday 11:59pm. Not valid with other offers.\" Plain text with **bold**, *italic* and [links](https://...).",
                    "maxLength": 1500,
                    "type": "string"
                  },
                  "heading": {
                    "description": "Main heading of the email.",
                    "type": "string"
                  },
                  "image_alt": {
                    "description": "Alt text for the hero image. Required whenever image_url is set.",
                    "type": "string"
                  },
                  "image_link": {
                    "description": "Where a click on the hero image goes (https URL). Defaults to cta_url.",
                    "maxLength": 2000,
                    "pattern": "^https:\\/\\/",
                    "type": "string"
                  },
                  "image_url": {
                    "description": "Optional hero image at the top (https URL). For more pictures use image lines in body_md or sections.",
                    "type": "string"
                  },
                  "info_bar": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "text": {
                            "description": "Short line, for example \"Free shipping on orders over $99\".",
                            "maxLength": 120,
                            "minLength": 1,
                            "type": "string"
                          },
                          "url": {
                            "description": "Where a click on the bar goes (https URL).",
                            "maxLength": 2000,
                            "pattern": "^https:\\/\\/",
                            "type": "string"
                          }
                        },
                        "required": ["text"],
                        "type": "object"
                      },
                      {
                        "const": "off",
                        "type": "string"
                      }
                    ],
                    "description": "Dark band across the top of the email. An object sets it for this email (replacing the brand default); \"off\" hides the brand default for this email."
                  },
                  "layout": {
                    "description": "How sections show. stack (default): one per row. grid-2: product cards two across (image, heading, price, short copy, button), stacked on phones.",
                    "enum": ["stack", "grid-2"],
                    "type": "string"
                  },
                  "sections": {
                    "description": "Optional: up to 8 sections after body_md, each with its own sub-heading, image, copy and button, divided by a line. Use for a promotion with several products or a newsletter with several stories. Each needs at least a heading, body_md or image_url. Up to 20 images per email in total.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "body_md": {
                          "description": "Copy for this section. Same Markdown as body_md, image lines allowed.",
                          "maxLength": 3000,
                          "type": "string"
                        },
                        "cta_text": {
                          "description": "Button label for this section.",
                          "maxLength": 40,
                          "type": "string"
                        },
                        "cta_url": {
                          "description": "Button link for this section.",
                          "maxLength": 2000,
                          "pattern": "^https:\\/\\/",
                          "type": "string"
                        },
                        "heading": {
                          "description": "Sub-heading for this section.",
                          "maxLength": 140,
                          "type": "string"
                        },
                        "image_alt": {
                          "description": "What the image shows. Required when image_url is set.",
                          "maxLength": 140,
                          "type": "string"
                        },
                        "image_link": {
