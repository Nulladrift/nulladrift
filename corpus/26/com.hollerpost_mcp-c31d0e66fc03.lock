        {
          "name": "survey_create",
          "title": "Create survey",
          "description": "Creates a survey as a DRAFT: its page is not public and no email can ask its questions until it is opened with survey_update. Give it a name and 1 to 30 questions. Returns the survey with each question id; one_click questions (rating, nps, single) can go in an email with campaign_draft. Sends nothing and uses no quota. Requires API key scope: draft.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "intro": {
                "description": "Short intro under the heading.",
                "maxLength": 1000,
                "type": "string"
              },
              "name": {
                "description": "Survey name, also used as the page title unless title is set.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "questions": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "Keep a question’s existing id when editing so earlier answers stay matched. Leave out for new questions.",
                      "pattern": "^[A-Za-z0-9_-]{1,40}$",
                      "type": "string"
                    },
                    "options": {
                      "description": "Choices for single and multi questions (2 to 20).",
                      "items": {
                        "properties": {
                          "key": {
                            "description": "Short stable key, for example \"yes\". Made up when left out.",
                            "pattern": "^[a-z0-9_-]{1,40}$",
                            "type": "string"
                          },
                          "label": {
                            "description": "What the reader sees.",
                            "maxLength": 120,
                            "minLength": 1,
                            "type": "string"
                          },
                          "tags": {
                            "description": "Tags added to a contact who picks this option.",
                            "items": {
                              "maxLength": 60,
                              "minLength": 1,
                              "type": "string"
                            },
                            "maxItems": 5,
                            "type": "array"
                          }
                        },
                        "required": ["label"],
                        "type": "object"
                      },
                      "maxItems": 20,
                      "minItems": 2,
                      "type": "array"
                    },
                    "prompt": {
                      "description": "The question as the reader sees it.",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "required": {
                      "description": "Defaults to true.",
                      "type": "boolean"
                    },
                    "scale": {
                      "properties": {
                        "labels": {
                          "description": "Up to two end labels, for example [\"Poor\", \"Great\"].",
                          "items": {
                            "maxLength": 40,
                            "type": "string"
                          },
                          "maxItems": 2,
                          "type": "array"
                        },
                        "max": {
                          "description": "Top of a rating scale (default 5). Ignored for nps.",
                          "maximum": 10,
                          "minimum": 3,
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "type": {
                      "description": "rating (1 to 5 stars, or up to 10), nps (0 to 10 recommend score), single (pick one), multi (pick any), text (one line), long_text (paragraph). Only rating, nps and single can be answered from inside an email.",
                      "enum": ["rating", "nps", "single", "multi", "text", "long_text"],
                      "type": "string"
                    }
                  },
                  "required": ["prompt", "type"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "thank_you_message": {
                "description": "Shown after someone answers.",
                "maxLength": 1000,
                "type": "string"
              },
              "title": {
                "description": "Heading on the survey page.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["name", "questions"],
            "type": "object"
          },
