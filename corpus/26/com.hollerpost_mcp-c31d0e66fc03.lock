        },
        {
          "name": "brand_set_footer",
          "title": "Save email footer",
          "description": "Saves the footer every email carries, above the mailing address and unsubscribe link (those two are always added and cannot be changed here): up to 5 full-width link buttons (links, for example Shop men’s, Find your store), the \"Follow us\" social icon row (social handles plus social_icons: true), and a small disclaimer (pricing or legal note). Fields you leave out stay as they are; links: [] removes the buttons, disclaimer: \"\" removes the note. Applies to every email sent after saving, including scheduled ones that have not gone out yet. Uses no quota and sends nothing. Read brand_get first and only save what the person approved. Example: {\"links\": [{\"label\": \"Shop men’s\", \"url\": \"https://shop.example/men\"}, {\"label\": \"Find your store\", \"url\": \"https://shop.example/stores\"}], \"social\": {\"instagram\": \"shopexample\", \"youtube\": \"shopexample\"}, \"social_icons\": true, \"disclaimer\": \"Prices may differ in stores.\"} Requires API key scope: draft.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "disclaimer": {
                "description": "Small print above the address, for example pricing, shipping or legal notes. **bold**, *italic* and [links](https://...) work. \"\" removes it.",
                "maxLength": 1500,
                "type": "string"
              },
              "links": {
                "description": "Footer link buttons, top to bottom. Replaces the current list.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "description": "Button text, for example \"Shop men’s\" or \"Find your store\". Shown in capitals.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "url": {
                      "description": "Button link (https URL).",
                      "maxLength": 2000,
                      "pattern": "^https:\\/\\/",
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "social": {
                "additionalProperties": false,
                "description": "Social profiles: a handle (\"shopexample\", \"@shopexample\") or the profile link. \"\" removes one. These are the same profiles as Settings > Brand.",
                "properties": {
                  "facebook": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "instagram": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "linkedin": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "pinterest": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "threads": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "tiktok": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "x": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "youtube": {
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "social_icons": {
                "description": "true: show the profiles as a \"Follow us\" row of icons. false: plain text links (the older look).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save email footer"
