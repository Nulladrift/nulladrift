                    "maxLength": 500,
                    "type": "string"
                  },
                  "confirm_opt_in": {
                    "description": "The person confirmed everyone they text agreed to it.",
                    "type": "boolean"
                  },
                  "confirm_website": {
                    "description": "The person confirmed the website is theirs and public.",
                    "type": "boolean"
                  },
                  "contact_email": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "contact_first_name": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "contact_last_name": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "contact_phone": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "dba": {
                    "description": "Brand name customers see, if different.",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "entity_type": {
                    "enum": ["PRIVATE_PROFIT", "SOLE_PROPRIETOR", "NON_PROFIT", "PUBLIC_PROFIT", "GOVERNMENT"],
                    "type": "string"
                  },
                  "legal_name": {
                    "description": "Exactly as on the official registration.",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "monthly_volume": {
                    "maxLength": 500,
                    "type": "string"
