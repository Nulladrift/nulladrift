      },
      "instructions": "Website-Check by Rexity Labs: checks one publicly reachable website in six areas (speed & technology, findability, readiness for enquiries, trust & legal, website security settings, e-mail domain protection) and returns scores from 0 to 100. The tool website_check fits when a user asks how well a public website works for visitors and enquiries. It returns the overall score, the six area scores with one verdict line each, how many checks per area ended in which state, and a short verdict. It states what was measured and gives no recommendations. The full result with every single check and its measured value is free on https://www.rexity.ai/website-check. Terms of use: https://www.rexity.ai/website-check/nutzung. The two security-related areas are built only from settings visible from outside (response headers, one TLS handshake, public DNS): not a security audit and no warranty. A check can take up to about a minute.",
      "tools": [
        {
          "name": "website_check",
          "title": "Website-Check (Rexity Labs)",
          "description": "Checks one public website and returns a short result as Markdown: an overall score (0–100) with a band (good / medium / weak), the scores of six areas (speed & technology, findability, readiness for enquiries, trust & legal, website security settings, e-mail domain protection), one verdict line per area, how many checks per area were met, partly met, open, notes or not checkable, a short verdict, the address and time of the check, and the source line. The single checks with their measured values are not part of this result: the full result is free on https://www.rexity.ai/website-check. Use it when a user asks how a specific public website performs for visitors, search engines and enquiries. It states what was measured and gives no advice. The areas on security settings and e-mail domain protection use only what is visible from outside (response headers, one TLS handshake, public DNS, security.txt): not a security audit, no warranty. Only public http/https websites on standard ports; IP addresses, internal hosts and sites whose owners opted out are refused with a message that says why. A fresh check takes up to about a minute; results are cached for 24 hours. Quotas for fresh checks, currently: 5 per IP address and day, 200 per hour and 1000 per day for all callers together; calls that arrive from the shared addresses of an assistant platform count together, 300 per day for the platform; when a quota is reached the result says when it is restored. Terms of use: https://www.rexity.ai/website-check/nutzung. The checker identifies itself as RexityWebsiteCheck/1.0 (+https://www.rexity.ai/website-check/bot).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the result: de (German, default) or en (English).",
                "enum": ["de", "en"],
                "type": "string"
              },
              "url": {
                "description": "The address of the website to check, for example www.example.de or https://www.example.de/. Public websites only.",
                "type": "string"
              }
            },
