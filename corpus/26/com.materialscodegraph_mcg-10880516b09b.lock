                "type": "string"
              },
              "spec": {
                "description": "The spec object; params drive the eventual price.",
                "type": "object"
              },
              "study": {
                "description": "The study (project) this simulation joins: the id of a study you own (std_ plus 20 hex), or an exact name, created if absent. A value shaped like a study id never creates a study: one that is not yours is refused.",
                "type": "string"
              }
            },
            "required": ["inputs", "kind", "name", "spec"],
            "type": "object"
          },
          "behavior": {
