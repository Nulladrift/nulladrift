        {
          "name": "mcg_run",
          "description": "Launch the quoted simulation. SPENDS TOKENS: provisions hardware and bills the account. Requires the quote_id and quote_hash from mcg_quote (a stale hash or an expired quote REJECTS: re-quote and retry) and a client-generated idempotency_key (replaying it returns the existing run instead of launching twice). Optional max_tokens is a hard ceiling: a quote above it REJECTS the launch, never clamps. Returns run_id.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Client-generated key; retrying a launch with the same key must not double-charge.",
                "type": "string"
              },
              "max_tokens": {
                "description": "Hard token ceiling: the launch is REJECTED if the quote exceeds it.",
                "minimum": 1,
                "type": "integer"
              },
              "quote_hash": {
                "description": "The quote_hash mcg_quote returned: proves the launch prices the exact quote the client saw.",
                "type": "string"
              },
              "quote_id": {
                "description": "The quote_id returned by mcg_quote.",
                "type": "string"
              }
            },
            "required": ["idempotency_key", "quote_hash", "quote_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4feabdcb8595ba06570ff939ce05000a884b031414d181aa9f005c87322fa6b2"
        },
        {
          "name": "mcg_stage",
          "description": "Create a DRAFT simulation whose input files are uploaded before pricing. FREE. Takes the same kind, spec, study, material and conditions as mcg_quote plus inputs: one entry per file the run needs, each with a name and, for small text files, the text inline (staged immediately). Entries without text come back in uploads as presigned PUT URLs (valid 15 minutes, 4 GiB per file): upload each with a plain HTTP PUT of the file bytes, no key or header. Then call mcg_quote with draft_id to price; it REJECTS with inputs_missing until every declared input has arrived.",
          "inputSchema": {
            "properties": {
              "conditions": {
                "description": "Physical conditions: numbers, strings or lists of up to 16 of them (on an adapter engine, any value its conditions schema allows). On a traced run whose engine fixes its own conditions, a key or value its record does not hold is refused; the error names what to send or omit.",
                "type": "object"
