        {
          "name": "mcg_cancel_run",
          "description": "Cancel a run from any non-terminal state before collecting (a collecting run's outputs are delivered and charged: 409). The cancel request is recorded immediately and returns run_id and cancel_requested true (and a note, for a running campaign); the platform kills the machine and terminalizes the run as state killed on its next orchestration tick (about 60 s). A running campaign's cancel takes several ticks (a tick is about 60 s), 3 or more while children are open: the parent winds down, its open children are cancelled (a collecting child finishes and counts), then settlement charges the done children's measured tokens and releases the rest of the hold. Poll mcg_get_run to observe the terminal state.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "description": "The run id to cancel.",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
