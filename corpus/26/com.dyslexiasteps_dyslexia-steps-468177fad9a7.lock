      "tools": [
        {
          "name": "find_words",
          "title": "Find words by pattern",
          "description": "Searches all lists for words matching a letter pattern, for example starts_with 'sh', ends_with 'ck' or contains 'ight'. Patterns are plain case-insensitive substrings (no wildcards) and all given patterns and filters must match (AND). Returns { totalMatches, returned, matches }, each match a word with its language and every list it appears in (id, grade range, page URL), in dataset order and cut at limit (no paging). Use this to search by spelling pattern; use get_words_for_grade for a whole grade's words, or get_word_list for one known list. Calling it with none of contains, starts_with or ends_with returns an error.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contains": {
                "description": "Word contains this substring anywhere, e.g. ai or ight. 1 to 12 characters.",
                "maxLength": 12,
                "minLength": 1,
                "type": "string"
              },
              "ends_with": {
                "description": "Word ends with this substring, e.g. ck. 1 to 12 characters.",
                "maxLength": 12,
                "minLength": 1,
                "type": "string"
              },
              "grade": {
                "description": "Only English lists whose grade range includes this grade; other languages have no grade, so combining it with a non-en language returns no matches.",
                "enum": ["pre-k", "kindergarten", "grade-1", "grade-2", "grade-3"],
                "type": "string"
              },
              "language": {
                "description": "Only lists in this language: en, de, es, fr, nl or pt-br. Omit to search every language.",
                "enum": ["en", "de", "es", "fr", "nl", "pt-br"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum matches to return, 1 to 500. Default 60; totalMatches gives the full count.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "starts_with": {
                "description": "Word begins with this substring, e.g. sh. 1 to 12 characters.",
                "maxLength": 12,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3526353c5c91e41c936a90eb6dd77443f8214328c6372f7c6a73045c4b54c31e"
        },
        {
          "name": "get_citation",
          "title": "How to cite and reuse the word lists",
          "description": "Returns how to cite and reuse the dataset: license (name, URL, note; CC BY 4.0 for the compilation, the Dolch words are public domain), citeAs text, the source page, the data's updated date and the fixed CSV and JSON download URLs on dyslexiasteps.com that hold every list. Use this when someone reuses, prints or redistributes the lists; use get_placement_basis instead to explain how grades were assigned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d84ffd2b9faa9e1b22ec5b16ba4e02a8b2e66950f4239c17fb27ca8720df18df"
        },
        {
          "name": "get_placement_basis",
          "title": "How grades were assigned",
          "description": "Returns the full table of grade-placement sources, document-level and not per word: bases (each with kind, code, summary and source URL), the grade ids with labels and typical ages, the limits note and the methodology page. Sources are Dolch's own grade levels (1936, public domain), the Common Core Foundational Skills item that names the skill, or a typical sequence when no standard names it. Placement is per list: match a list's placementBasis code (from list_word_lists or get_word_list) to a code here. Use this to explain why a list sits at a grade; use get_citation instead for license and reuse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:da9e41bbd92fc98f6b6d1e65dc5f9422dd66e5ad6cab3803c9a1cf8fd1b2b0e7"
        },
        {
          "name": "get_word_list",
          "title": "Get one word list",
          "description": "Returns one word list in full: the list summary plus every word, its groups (for example -at, -an, -ap families), placementBasisDetail (null for lists in other languages), license and citation text. Use this when you know the list id from list_word_lists; use get_words_for_grade for words merged across a grade's lists, or find_words to search by letter pattern. An unknown id returns an error that points to list_word_lists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Exact list id as returned by list_word_lists (case-sensitive), e.g. short-a, kindergarten, vowel-teams; other-language ids carry a language prefix, e.g. es:palabras-con-m.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cd3474746ad603aa33dc9fc9fb6fc13cdf6961beefc62a437c9b641d5dfa2390"
        },
        {
          "name": "get_words_for_grade",
          "title": "Words for a grade",
          "description": "Returns every different English word from all lists whose grade range includes a grade, deduplicated, each with the ids of the lists it comes from, plus totalDifferentWords and returned. Words come in dataset list order and are cut at limit (no offset or paging). Use this for a grade-wide pool; use get_word_list for one specific list, or find_words to search by letter pattern. A grade is a typical guide, not a rule: programs and standards differ, and it is not an assessment of any child. English lists are placed by grade; lists in other languages follow each language's own curriculum and have no grade.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "grade": {
                "description": "Required grade: pre-k, kindergarten, grade-1, grade-2 or grade-3.",
                "enum": ["pre-k", "kindergarten", "grade-1", "grade-2", "grade-3"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum words to return, 1 to 1500. Default 300; compare returned with totalDifferentWords to see if the result was cut.",
                "maximum": 1500,
                "minimum": 1,
                "type": "integer"
              },
              "section": {
                "description": "Only lists in this section, e.g. sight or cvc. wordlist (other languages) gives no words here. Omit for all sections.",
                "enum": ["cvc", "families", "sight", "digraphs", "patterns", "wordlist"],
                "type": "string"
              }
            },
            "required": ["grade"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c8c4aee5c740601da41ceae968a2f0d2bcfb6fab2a6523d01e6253f94dd9d469"
        },
        {
          "name": "list_word_lists",
          "title": "List word lists",
          "description": "Lists word lists as summaries (id, title, language, section, grade range, placement basis code, word count, page URL) without their words; returns { count, note, lists } in dataset order, all matches, no paging. Use this to discover ids, then get_word_list for one list's words; use get_words_for_grade or find_words instead when you want words directly. Filters combine with AND. A grade is a typical guide, not a rule: programs and standards differ, and it is not an assessment of any child. English lists are placed by grade; lists in other languages follow each language's own curriculum and have no grade.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "grade": {
                "description": "Keep only English lists whose grade range includes this grade; other-language lists have no grade and are excluded. Omit for all grades.",
                "enum": ["pre-k", "kindergarten", "grade-1", "grade-2", "grade-3"],
                "type": "string"
              },
              "language": {
                "description": "Language code: en, de, es, fr, nl or pt-br. Omit for all languages.",
                "enum": ["en", "de", "es", "fr", "nl", "pt-br"],
                "type": "string"
              },
              "section": {
                "description": "cvc, families, sight, digraphs or patterns (English), or wordlist (every other-language list). Omit for all sections.",
                "enum": ["cvc", "families", "sight", "digraphs", "patterns", "wordlist"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
