            }
          },
          "digest": "sha256:c0e9f0389f05f2ccf25ecade52adf8304afb1c3cc1ac9fb5d70c739518681da7"
        },
        {
          "name": "submit_enquiry",
          "title": "Send an enquiry to Growth Business Finance",
          "description": "Use this only when the user asks to send an enquiry to Growth Business Finance, a UK commercial finance broker. It sends the user's business, funding need and contact details to GBF, where a human broker reviews it, and returns a reference and the next steps. Before calling: show the user a summary of everything that will be sent and get their explicit confirmation, and get their explicit agreement to be contacted by GBF and to GBF's privacy notice (https://growthbusinessfinance.com/privacy-policy/). Set the two consent fields to true only if the user has agreed. If the reply lists several companies, ask the user which is theirs and call again with its company_number. Repeating a call with the same details does not create a second enquiry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount_gbp": {
                "description": "The amount of funding wanted, in pounds.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "assets": {
                "default": [],
                "description": "Assets the business holds that could support lending. Use ['none'] if none.",
                "items": {
                  "enum": ["trade_debtors", "stock", "plant_machinery", "commercial_property", "residential_property", "land", "none"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "business_description": {
                "description": "What the business does, in a sentence or two.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "company_name": {
                "description": "The business's registered company name.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "company_number": {
                "description": "Companies House number, if known.",
                "pattern": "^[A-Za-z0-9]{1,10}$",
                "type": "string"
              },
              "consent_contact": {
                "description": "True only if the user has explicitly agreed to be contacted by Growth Business Finance about this enquiry.",
                "type": "boolean"
              },
              "consent_privacy": {
                "description": "True only if the user has explicitly agreed to GBF's privacy notice at https://growthbusinessfinance.com/privacy-policy/.",
                "type": "boolean"
              },
              "email": {
                "description": "The user's email address.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "full_name": {
                "description": "The user's full name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "The user's phone number.",
                "pattern": "^[0-9 +()-]{7,40}$",
                "type": "string"
              },
              "profitable": {
                "description": "Whether the business is currently profitable.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "purpose": {
                "description": "What the funding is for.",
                "enum": ["working_capital", "growth", "acquisition_mbo", "refinance", "asset_purchase", "property_purchase", "property_development", "bridge", "other"],
                "type": "string"
              },
              "purpose_detail": {
                "default": "",
                "description": "Anything else the user wants GBF to know about the funding need.",
                "maxLength": 2000,
                "type": "string"
              },
              "role": {
                "description": "The user's role in the business, for example Finance Director.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sector": {
                "default": "",
                "description": "The business's sector, for example manufacturing or recruitment.",
                "maxLength": 120,
                "type": "string"
              },
              "timescale": {
                "description": "When the funding is needed.",
                "enum": ["asap", "1_3_months", "3_6_months", "exploring"],
                "type": "string"
              },
              "trading_years": {
                "anyOf": [
                  {
                    "maximum": 500,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Years the business has been trading, or null if unknown."
              },
              "turnover_band": {
                "description": "Annual turnover band.",
                "enum": ["under_1m", "1m_5m", "5m_25m", "25m_100m", "over_100m", "unknown"],
                "type": "string"
              },
              "uk_based": {
                "description": "True if the business is based in the UK.",
                "type": "boolean"
              }
            },
            "required": ["amount_gbp", "business_description", "company_name", "consent_contact", "consent_privacy", "email", "full_name", "phone", "profitable", "purpose", "role", "timescale", "trading_years", "turnover_band", "uk_based"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send an enquiry to Growth Business Finance"
