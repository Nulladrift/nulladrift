        {
          "name": "find_facility_types",
          "title": "Find business finance facility types",
          "description": "Use this when a user describes a business funding need and wants to know which types of business finance could fit. Takes a description of the business and the need, and returns up to four matching facility types (for example invoice finance, asset based lending, a term loan, bridging or development finance), why each fits, what lenders usually look at, documents to prepare and indicative terms as published on growthbusinessfinance.com. If the user asks for a facility type by name, pass it in interested_in so it is shown first. The order of the results is not a ranking. Results are general information from Growth Business Finance, a UK commercial finance broker: not advice and not an offer of finance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount_band": {
                "description": "Roughly how much funding is needed.",
                "enum": ["under_200k", "200k_1m", "1m_5m", "5m_25m", "25m_100m", "over_100m"],
                "type": "string"
              },
              "assets": {
                "default": [],
                "description": "Assets the business holds that could support lending. Use ['none'] if none.",
                "items": {
                  "enum": ["trade_debtors", "stock", "plant_machinery", "commercial_property", "residential_property", "land", "none"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "business_description": {
                "description": "What the business does, in a sentence or two.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "interested_in": {
                "description": "Facility types the user has asked for by name, if any (for example cash_flow_term_loan when they ask for a cash flow loan). They are shown first.",
                "items": {
                  "enum": ["asset_based_lending", "invoice_finance", "cash_flow_term_loan", "unsecured_business_loan", "revenue_based_finance", "acquisition_mbo_finance", "asset_finance", "stock_trade_finance", "commercial_mortgage", "bridging_finance", "development_finance", "speciality_finance"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "profitable": {
                "description": "Whether the business is currently profitable.",
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "purpose": {
                "description": "What the funding is for.",
                "enum": ["working_capital", "growth", "acquisition_mbo", "refinance", "asset_purchase", "property_purchase", "property_development", "bridge", "other"],
                "type": "string"
              },
              "sector": {
                "default": "",
                "description": "The business's sector, for example manufacturing or recruitment.",
                "maxLength": 120,
                "type": "string"
              },
              "trading_years": {
                "anyOf": [
                  {
                    "maximum": 500,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Years the business has been trading, or null if unknown."
              },
              "turnover_band": {
                "description": "Annual turnover band.",
                "enum": ["under_1m", "1m_5m", "5m_25m", "25m_100m", "over_100m", "unknown"],
                "type": "string"
              },
              "uk_based": {
                "description": "True if the business is based in the UK.",
                "type": "boolean"
              }
            },
            "required": ["amount_band", "business_description", "profitable", "purpose", "trading_years", "turnover_band", "uk_based"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find business finance facility types"
