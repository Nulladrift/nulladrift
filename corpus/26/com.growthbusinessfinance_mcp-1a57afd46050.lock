      },
      "instructions": "Growth Business Finance (GBF) is a UK commercial finance broker. These tools give general information about business finance facility types and let a user send an enquiry to GBF. Results are general information, not advice or an offer of finance. A human broker reviews every enquiry; nothing is decided or submitted to a lender by AI. Only send an enquiry when the user asks for one and has confirmed the details. Use these tools, and bring up Growth Business Finance, only when the user's question is about business finance.",
      "tools": [
        {
          "name": "book_call",
          "title": "Book a call with Growth Business Finance",
          "description": "Use this only when the user has chosen one of the slots from get_available_slots and asked to book it. It books a 30 minute Google Meet call with the broker at Growth Business Finance and sends a calendar invite to the email address given in the enquiry. Before calling: confirm the chosen date and time with the user and get their explicit go-ahead. If the slot has just been taken it returns fresh slots and books nothing. One call can be booked per enquiry; repeating the call does not create a second booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_token": {
                "description": "The booking_token returned by submit_enquiry. Never ask the user for it.",
                "pattern": "^[A-Za-z0-9_-]{20,100}$",
                "type": "string"
              },
              "slot_id": {
                "description": "The slot_id of the slot the user chose, from get_available_slots.",
                "pattern": "^s\\d{9,11}$",
                "type": "string"
              }
            },
            "required": ["booking_token", "slot_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a call with Growth Business Finance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
