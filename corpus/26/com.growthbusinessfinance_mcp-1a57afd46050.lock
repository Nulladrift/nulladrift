          "digest": "sha256:ab067add8217883881e6f818aa00f4922b3947c3b47ad067db34064da53309e9"
        },
        {
          "name": "estimate_size",
          "title": "Estimate an indicative facility size",
          "description": "Use this when a user wants a rough idea of how much a facility type could raise against a figure they know, such as their debtor book, stock value, asset cost, property value or EBITDA. Applies only the advance rates and loan-to-value figures published on growthbusinessfinance.com and returns an indicative amount with its source page. Always indicative and subject to lender assessment; if the website publishes no figure for that facility type, it says so instead of estimating.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annual_ebitda": {
                "description": "Annual EBITDA, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "annual_recurring_revenue": {
                "description": "Annual recurring revenue, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "asset_cost": {
                "description": "The cost of the asset being bought, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "debtor_book": {
                "description": "The value of the debtor book (unpaid customer invoices), in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "facility_type": {
                "description": "The facility type to estimate.",
                "enum": ["asset_based_lending", "invoice_finance", "cash_flow_term_loan", "unsecured_business_loan", "revenue_based_finance", "acquisition_mbo_finance", "asset_finance", "stock_trade_finance", "commercial_mortgage", "bridging_finance", "development_finance", "speciality_finance"],
                "type": "string"
              },
              "gross_development_value": {
                "description": "The gross development value of the scheme, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "plant_machinery_value": {
                "description": "The value of plant and machinery, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "property_value": {
                "description": "The value of the property, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "stock_value": {
                "description": "The value of stock, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "supplier_cost": {
                "description": "The cost of the goods being bought from suppliers, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              },
              "total_development_cost": {
                "description": "The total cost of the development, in pounds, if it applies to this facility type.",
                "exclusiveMinimum": 0,
                "maximum": 999999999,
                "type": "number"
              }
            },
            "required": ["facility_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate an indicative facility size"
          },
          "behavior": {
