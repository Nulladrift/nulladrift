        {
          "name": "example_deals",
          "title": "Example deals",
          "description": "Use this when a user asks for examples of business finance deals. Returns up to three anonymous, published stories of completed deals that Growth Business Finance arranged, optionally filtered by facility type or sector. They are a selection, with no client or lender names.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "facility_type": {
                "description": "Only show deals involving this facility type.",
                "enum": ["asset_based_lending", "invoice_finance", "cash_flow_term_loan", "unsecured_business_loan", "revenue_based_finance", "acquisition_mbo_finance", "asset_finance", "stock_trade_finance", "commercial_mortgage", "bridging_finance", "development_finance", "speciality_finance"],
                "type": "string"
              },
              "sector": {
                "description": "Only show deals in this sector.",
                "maxLength": 120,
                "type": "string"
