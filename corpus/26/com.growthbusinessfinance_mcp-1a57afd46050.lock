        {
          "name": "get_available_slots",
          "title": "Show free call slots",
          "description": "Use this after submit_enquiry returns a booking_token and the user wants to book a call with Growth Business Finance. Returns up to six free 30 minute slots from the broker's calendar over the next two weeks, in the user's time zone and in UK time. It only reads availability and books nothing. Without a valid booking_token it says the broker will email to arrange a time instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_token": {
                "description": "The booking_token returned by submit_enquiry. Never ask the user for it.",
                "pattern": "^[A-Za-z0-9_-]{20,100}$",
                "type": "string"
              },
              "preferred_days": {
                "description": "Weekdays the user prefers, if they said.",
                "items": {
                  "enum": ["monday", "tuesday", "wednesday", "thursday", "friday"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "timezone": {
                "description": "The user's IANA time zone, for example Europe/London. Defaults to UK time.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["booking_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Show free call slots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://growth-business-finance/slots.html",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
