        {
          "name": "explain_facility",
          "title": "Explain a facility type",
          "description": "Use this when a user asks how one type of business finance works. Returns a summary, how it works, typical uses, who it suits, what lenders usually look at and indicative terms for the chosen facility type, taken from growthbusinessfinance.com. General information, not advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "facility_type": {
                "description": "The facility type to explain.",
                "enum": ["asset_based_lending", "invoice_finance", "cash_flow_term_loan", "unsecured_business_loan", "revenue_based_finance", "acquisition_mbo_finance", "asset_finance", "stock_trade_finance", "commercial_mortgage", "bridging_finance", "development_finance", "speciality_finance"],
                "type": "string"
              }
            },
