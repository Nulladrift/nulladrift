            "readOnly": true
          },
          "digest": "sha256:414adedd65502693a11c03931dcc4d2aa031a3ddaa588610602f6966a2ad1517"
        }
      ],
      "digest": "sha256:e205e99187677573a064228f2cc88245a2a72f48cdbbb404cbac31c853558dfb"
    }
  }
