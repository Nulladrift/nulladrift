        {
          "name": "recommend_model",
          "title": "Recommend a model for a task",
          "description": "Recommend which AI model to use for a task given a priority: 'accuracy', 'cost' or 'balanced'. Never recommends models RealRun flagged as not recommended.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "include_subscription": {
                "default": true,
                "description": "Include Claude models (tested on a subscription, no metered cost).",
                "type": "boolean"
              },
              "priority": {
                "default": "balanced",
                "description": "What matters most.",
                "enum": ["accuracy", "cost", "balanced"],
                "type": "string"
