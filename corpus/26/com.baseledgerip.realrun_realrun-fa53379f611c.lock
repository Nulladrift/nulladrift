      "tools": [
        {
          "name": "get_scores",
          "title": "Get model scores for a task",
          "description": "Headline scores for every model RealRun tested on a task, best first, with cost tier and the metric definition.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "task": {
                "description": "Task id, e.g. 'receipts'. See list_tasks.",
                "enum": ["inbox-triage", "meeting-scheduling", "receipts", "finance", "support-replies"],
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1681972e1ea179a1419eef66ad5d378cbc51a46e3b44de925dea5b9474f7b0f1"
        },
        {
          "name": "get_warnings",
          "title": "Get safety warnings for a task",
          "description": "Models RealRun flagged as not recommended or needing caution on a task (scam failures, invented data, inconsistency).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "task": {
                "description": "Task id, e.g. 'receipts'. See list_tasks.",
                "enum": ["inbox-triage", "meeting-scheduling", "receipts", "finance", "support-replies"],
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd127fe67115a5a1be063a45c1dd78b9f0229c5cd93ae992057c924db91c929f"
        },
        {
          "name": "list_tasks",
          "title": "List tested tasks",
          "description": "List the everyday tasks RealRun has tested AI models on, with item counts, test dates, results pages and playbook prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb1923eff29905ad54b6e29168674b2b65b3047d358eea834f6acb642d2ca56e"
        },
        {
          "name": "recommend_model",
          "title": "Recommend a model for a task",
          "description": "Recommend which AI model to use for a task given a priority: 'accuracy', 'cost' or 'balanced'. Never recommends models RealRun flagged as not recommended.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "include_subscription": {
                "default": true,
                "description": "Include Claude models (tested on a subscription, no metered cost).",
                "type": "boolean"
              },
              "priority": {
                "default": "balanced",
                "description": "What matters most.",
                "enum": ["accuracy", "cost", "balanced"],
                "type": "string"
              },
              "task": {
                "description": "Task id, e.g. 'receipts'. See list_tasks.",
                "enum": ["inbox-triage", "meeting-scheduling", "receipts", "finance", "support-replies"],
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
