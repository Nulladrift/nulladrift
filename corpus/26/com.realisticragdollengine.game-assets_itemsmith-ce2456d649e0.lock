  "subjects": {
    "com.realisticragdollengine.game-assets/itemsmith": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://game-assets.realisticragdollengine.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "itemsmith",
        "title": "Itemsmith game assets",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Generate matching 2D game asset sets (items, icons, characters, seamless tiles, UI kits). After a generation, run the returned command to cut the sheet into transparent PNGs, a sprite sheet and a JSON atlas inside the project.",
      "tools": [
        {
          "name": "generate_game_assets",
          "description": "Draw a matching set of 2D game assets from one description: 8 items, 8 icons, 4 character designs, 4 seamless tiles or an 8-piece UI kit. Returns a download link to the raw sheet (on a flat green or magenta key color) and the exact command that cuts it into transparent PNGs, a sprite sheet and a JSON atlas in the project. Takes 30-90 seconds. Free tier: 3 sets per day per IP address.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "What the set contains, e.g. \"healing potions and elixirs in glass bottles\". Your own designs only: no other studios' characters, no real people.",
                "type": "string"
              },
              "kind": {
                "description": "What to make.",
                "enum": ["items", "icons", "characters", "tiles", "ui"],
                "type": "string"
              },
              "style": {
                "default": "pixel",
                "enum": ["pixel", "cartoon", "painted", "flat"],
                "type": "string"
              },
              "style_reference_url": {
                "description": "Optional https URL of a PNG/JPG/WebP from the game (under 4 MB). The set is drawn in that art style.",
                "type": "string"
              }
            },
            "required": ["description", "kind"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c755eadd9c906a7d76aace4bf5de848eb345ae783a87cc84e0883a4a9dc45487"
        },
        {
          "name": "get_free_quota",
          "description": "How many free generations this IP address has left today.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
