        {
          "name": "open_goatcade",
          "title": "Open Goatcade",
          "description": "Show the Goatcade arcade in the chat: real, free browser games (Rad Rush, atomic-age horde survival; Last Siren, atomic-age survival city builder; Scrap Fury, wasteland combat racer; Nuke Deck, atomic-age roguelike deckbuilder; Solitaire, klondike, spider and freecell; Word Tiles, crossword tile word game vs the computer; Mahjong, mahjong solitaire, every deal winnable; Poker, texas hold'em vs the computer; Bubble Reef, underwater bubble shooter; Brick Blitz, neon brick breaker with bosses; Star Goat, cartoon space shooter with big bosses; Goat Crossing, endless 3d road and river hopper; Geo Quest, learn countries, flags and capitals; Quiz Night, trivia game show, 1,800+ questions; Brain Gym, daily brain workout, 10 mini-games) with a Play button for each. Use this whenever the user wants to play a game, is bored, or asks for Goatcade. Pass `game` to put one game up front; leave it out to show the whole arcade.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Optional game to feature first.",
                "enum": ["rad-rush", "last-siren", "scrap-fury", "nuke-deck", "solitaire", "word-tiles", "mahjong", "poker", "bubble-reef", "brick-blitz", "star-goat", "goat-crossing", "geo-quest", "quiz-night", "brain-gym"],
