            "openai/toolInvocation/invoked": "Inquiry processed",
            "openai/toolInvocation/invoking": "Sending the inquiry to MERA Robotics…",
            "openai/widgetAccessible": true,
            "ui": {
              "visibility": ["model", "app"]
            }
