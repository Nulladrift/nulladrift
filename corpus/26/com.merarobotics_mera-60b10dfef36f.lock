                "description": "City or venue of the event, e.g. \"Lyon\", \"Tallinn\" or \"Messe München\".",
                "maxLength": 160,
                "type": "string"
              },
              "country": {
                "description": "Country of the event: ISO 3166-1 code (FR, DE, PT, EE or FRA, DEU) or its name in any European language (France, Frankreich, Francja, Saksamaa).",
                "maxLength": 80,
                "type": "string"
              },
              "event_date": {
                "description": "First day of the event (YYYY-MM-DD), if known. It is not a reservation.",
                "format": "date",
                "type": "string"
              },
              "event_type": {
                "description": "Kind of event: trade_fair (stand or exhibition), conference (also panels and summits), gala (stage show, awards), corporate (company event, team event, employer branding), opening (store or showroom opening, product launch), city_event (city festival, fair, municipal event), school (school or university), sports, other.",
                "enum": ["trade_fair", "conference", "gala", "corporate", "opening", "city_event", "school", "sports", "other"],
                "type": "string"
