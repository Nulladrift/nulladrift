        {
          "name": "start_booking",
          "title": "MERA RENT: book a robot",
          "description": "Use this when the person wants to book or reserve a robot from MERA RENT (with a MERA operator, for an event in Europe) for a date, including robot hire as an event attraction or corporate event entertainment (company party, Christmas party, trade fair stand). Returns a deep link that opens the MERA RENT app with the robot and date chosen, a short share link with a preview card, the booking steps and the list of robots. Where the host shows apps, a booking widget lets the person choose the robot, see free days in a month calendar and the MERA RENT list price for the chosen date (net, from get_rental_quote; Edward Warchocki and on-request models get an inquiry button instead of a price), and open MERA RENT, where the booking and payment happen. It books nothing by itself: the person completes the booking in the app (account, form; the date is held for at least 48 hours and MERA confirms within one working day). For a general inquiry without a chosen date use open_inquiry_form.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City or venue town, e.g. \"Lisbon\".",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Country of the event: ISO 3166 code (\"PT\") or name in any language.",
