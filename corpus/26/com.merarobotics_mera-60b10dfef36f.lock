        {
          "name": "request_quote",
          "title": "Send an inquiry to MERA Robotics",
          "description": "Sends an inquiry to the company MERA Robotics: the details go to the MERA team, who reply by e-mail to the given address within one working day. This is an outbound message to MERA and cannot be recalled. Use this only after the person has seen exactly what will be sent and agreed to share their name and e-mail with MERA Robotics for this inquiry (contact_consent=true). When the host can show it, prefer open_inquiry_form, where the person sends the form themselves. It does not book a date or confirm a price; for Unitree G1, H2 and Go2 the price for a date comes from get_rental_quote. The same inquiry repeated within 24 hours is not sent twice.",
