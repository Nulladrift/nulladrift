      "serverInfo": {
        "name": "com.merarobotics/mera",
        "title": "MERA Robotics",
        "version": "1.6.0",
        "websiteUrl": "https://merarobotics.com/en/agents",
        "icons": [
          {
            "src": "https://merarobotics.com/media/blog/mera-logo.png",
