                "description": "Language the person writes in: any ISO 639 code, optionally with a region, e.g. \"pt\", \"pt-PT\", \"et\", \"tr\", \"mt\". MERA EVENTS pages, the inquiry form and replies exist in 54 languages (pl, en, de, fr, it, es, nl, pt, sv, da, no, fi, et, lv, lt, uk, cs, sk, hu, ro, bg, hr, sl, el, ca, eu, gl, cy, ga, mt, lb, is, tr, sq, sr, bs, mk, ka, hy, az, ru, ar, he, zh, ja, ko, hi, id, ms, th, vi, en-us, es-la, pt-br; \"no\" = Norwegian, \"el\" = Greek, \"uk\" = Ukrainian); for any other language they are in English.",
