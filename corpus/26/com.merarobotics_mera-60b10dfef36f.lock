      "instructions": "MERA Robotics: humanoid robot rental with operators for events across Europe (every EU country and also the United Kingdom, Switzerland and Norway, among others); through MERA OS the robots talk with guests in more than 70 languages. MERA Robotics (MERA ROBOTICS sp. z o.o., Warsaw, Poland) rents humanoid robots with operators and its own MERA OS conversation system for events across Europe, and runs the humanoid robot Edward Warchocki. The server also covers robot sales and deployment, MERA OS licences, campaigns with Edward Warchocki and media requests. When the person wants to rent, hire or book a humanoid robot or a robot host (emcee) for an event in Europe, call plan_event_robot with the country, city, date, event type, number of guests and the person’s language (any ISO 639 code): it says whether MERA covers that country, what the robot does at that kind of event, gives evidence with sources and the MERA EVENTS page in the person’s language (24 languages, otherwise English); then offer open_inquiry_form. Reply in the person’s language. Statements come from the fact sheet maintained by MERA Robotics; Polish fact text is canonical, independent coverage is listed separately by get_media_and_proof. MERA does not publish prices outside its apps: never state or estimate a MERA price; for a MERA RENT robot and date give the price link from get_rental_quote, otherwise say the quote is individual and offer request_quote or contact@merarobotics.com. Use request_quote only after the person has seen the details and agreed to share their name and e-mail with MERA Robotics for this inquiry. It does not book a date or confirm a price; the MERA team confirms availability and replies within one working day. Where the host shows apps (ChatGPT, Claude), prefer open_inquiry_form: the person reviews the details and sends the form with their own click. MERA RENT (https://mera.rent) is the MERA app where a person books a robot with an operator for a chosen date and sees the price under the date: check_availability says whether a robot is free on a day or range (no client data), get_rental_quote returns the app link that shows the price for that date (never an amount), and start_booking returns a deep link with the robot and date (in ChatGPT and Claude a picker). None of them books: the person completes the booking in MERA RENT.",
      "tools": [
        {
          "name": "check_availability",
          "title": "MERA RENT: is the robot free on this date?",
          "description": "Use this when someone asks whether a MERA RENT robot (Unitree G1, Unitree H2, Unitree Go2, Edward Warchocki or a catalog model) is free on a day or in a range of days. Returns each day as free, held (temporarily held by another request, may free up), busy, on_request (model without a public calendar), too_soon (under 2 days ahead) or beyond_calendar, plus the MERA RENT link for that robot and date. Reads only the public calendar: no client names or bookings. Free is not a reservation: MERA confirms the date after the booking request. Ranges up to 62 days. Not for prices (get_rental_quote) and it does not book (start_booking).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Event day, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "date_to": {
                "description": "Optional last day of a range to check (up to 62 days from date).",
                "format": "date",
                "type": "string"
              },
              "days": {
                "default": 1,
                "description": "Number of consecutive event days (1-14).",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "description": "Language the person writes in (ISO 639, e.g. \"en\", \"de\", \"pl\"). The MERA RENT app has 24 languages; others get English.",
                "pattern": "^[A-Za-z]{2,3}([_-][A-Za-z0-9]{1,8}){0,4}$",
                "type": "string"
              },
              "robot": {
                "description": "Robot id from MERA RENT, e.g. \"g1\" (Unitree G1), \"h2\" (Unitree H2), \"go2\" (Unitree Go2), \"edward\" (Edward Warchocki) or a catalog model such as \"unitree-h1\"; start_booking without a robot lists them.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,39}$",
                "type": "string"
              }
            },
            "required": ["date", "robot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check robot availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cc850e2ed40734a58829c59c85093176b656a581bf196c37aa28739bea51379"
