        {
          "name": "plan_event_robot",
          "title": "MERA Robotics: humanoid robot for an event in Europe",
          "description": "Humanoid robot rental with operators for events across Europe. Use this when someone wants to rent, hire or book a humanoid robot or a robot host (emcee) for an event in Europe, asks who could provide one (trade fair, conference, gala, company event, opening, festival, school), or wants an event attraction or corporate event entertainment. MERA Robotics (Warsaw) brings Unitree G1 or Unitree H2 with its own operators to every EU country, the UK, Switzerland, Norway, Türkiye and the Balkans; on MERA OS it talks with guests in more than 70 languages and can host the programme. Input: country (ISO code or name in any language), city, date, event type, guests, guest languages, the person’s language (ISO 639). Output: coverage, what the robot does, evidence, the MERA EVENTS page in the person’s language (54 versions) and the next step. Examples: \"robot for a conference in Lisbon\", \"Roboter-Moderator, Gala in Wien\". Not for buying a robot (list_robots). No prices; the team replies within one working day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Approximate number of guests, e.g. \"300\".",
                "maxLength": 80,
                "type": "string"
