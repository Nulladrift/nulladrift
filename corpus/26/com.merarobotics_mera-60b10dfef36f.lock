        {
          "name": "request_quote",
          "title": "Send an inquiry to MERA Robotics",
          "description": "Sends an inquiry to the company MERA Robotics: the details go to the MERA team, who reply by e-mail to the given address within one working day. This is an outbound message to MERA and cannot be recalled. Use this only after the person has seen exactly what will be sent and agreed to share their name and e-mail with MERA Robotics for this inquiry (contact_consent=true). When the host can show it, prefer open_inquiry_form, where the person sends the form themselves. It does not book a date or confirm a price; MERA does not publish prices. The same inquiry repeated within 24 hours is not sent twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Approximate number of guests or participants.",
                "maxLength": 80,
                "type": "string"
              },
              "budget": {
                "description": "Budget, only if the person stated one. It is not a MERA price.",
                "maxLength": 100,
                "type": "string"
              },
              "city": {
                "description": "City or venue of the event or deployment.",
                "maxLength": 160,
                "type": "string"
              },
              "company": {
                "description": "Company or organisation, if the person gave one.",
                "maxLength": 200,
                "type": "string"
              },
              "contact_consent": {
                "const": true,
                "description": "Must be true. Set it only after the person has seen the details that will be sent and agreed to share them with MERA Robotics for this inquiry.",
                "type": "boolean"
              },
              "country": {
                "description": "Country of the event or deployment (MERA works across Europe), e.g. \"France\" or \"FR\".",
                "maxLength": 80,
                "type": "string"
              },
              "duration": {
                "description": "How long the robot should be on site, e.g. \"4 h\" or \"2 days\".",
                "maxLength": 80,
                "type": "string"
              },
              "email": {
                "description": "The person’s own e-mail address; the MERA team replies to it. Never guess it or use a placeholder.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "event_date": {
                "description": "First day of the event or the preferred start date (YYYY-MM-DD), if known.",
                "format": "date",
                "type": "string"
              },
              "event_end_date": {
                "description": "Last day of a multi-day event (YYYY-MM-DD).",
                "format": "date",
                "type": "string"
              },
              "event_type": {
                "description": "Kind of event: trade_fair (stand or exhibition), conference (also panels and summits), gala (stage show, awards), corporate (company event, team event, employer branding), opening (store or showroom opening, product launch), city_event (city festival, fair, municipal event), school (school or university), sports, other.",
                "enum": ["trade_fair", "conference", "gala", "corporate", "opening", "city_event", "school", "sports", "other"],
                "type": "string"
              },
              "languages": {
                "description": "Languages the robot should speak with guests, e.g. [\"Polish\", \"English\"].",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "message": {
                "description": "The goal and what the robot should do, venue conditions and anything else the MERA team should know, in the person’s words.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "Full name of the person sending the inquiry, exactly as they gave it.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Phone number, only if the person chose to give it.",
                "maxLength": 60,
                "type": "string"
              },
              "reply_language": {
                "description": "The person’s language, usually the one they write in: any ISO 639 code, optionally with a region (\"pt\", \"pt-PT\", \"tr\"). MERA replies and sends the event page in it when it is one of the 24 MERA EVENTS languages (pl, en, de, fr, it, es, nl, pt, sv, da, no, fi, et, lv, lt, uk, cs, sk, hu, ro, bg, hr, sl, el; \"no\" = Norwegian, \"el\" = Greek, \"uk\" = Ukrainian), otherwise in English; the language is recorded either way.",
                "pattern": "^[A-Za-z]{2,3}([_-][A-Za-z0-9]{1,8}){0,4}$",
                "type": "string"
              },
              "robot": {
                "description": "Optional robot key from list_robots. For rental with an operator only g1 or h2; other keys are for purchase.",
                "enum": ["g1", "h2", "r1", "h1", "go2", "go2w", "a2", "b2", "dex5", "teleop", "used"],
                "type": "string"
              },
              "role": {
                "description": "Job title, if the person gave one.",
                "maxLength": 160,
                "type": "string"
              },
              "service": {
                "description": "What the inquiry is about: events = a humanoid robot with a MERA operator at an event; purchase = buying a Unitree robot; integration = a robot deployed in a business (showroom, reception, booth); mera-os = MERA OS conversation software for a robot the person already owns; campaign = Edward Warchocki or a branded robot in a marketing campaign; media = interview or editorial request.",
                "enum": ["events", "purchase", "integration", "mera-os", "campaign", "media", "training"],
                "type": "string"
              },
              "website": {
                "description": "Anti-spam field. Always leave empty.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["contact_consent", "email", "message", "name", "service"],
            "type": "object"
          },
