        {
          "name": "start_booking",
          "title": "MERA RENT: book a robot",
          "description": "Use this when the person wants to book or reserve a robot from MERA RENT (with a MERA operator, for an event in Europe) for a date. Returns a deep link that opens the MERA RENT app with the robot and date chosen, a short share link with a preview card, the booking steps and the list of robots. Where the host shows apps, a picker lets the person choose the robot, date, hours and city, check the date and open MERA RENT. It books nothing by itself: the person completes the booking in the app (account, form; the date is held for at least 48 hours and MERA confirms within one working day). For a general inquiry without a chosen date use open_inquiry_form.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City or venue town, e.g. \"Lisbon\".",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Country of the event: ISO 3166 code (\"PT\") or name in any language.",
                "maxLength": 60,
                "type": "string"
              },
              "date": {
                "description": "Event day, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "days": {
                "default": 1,
                "description": "Number of consecutive event days (1-14).",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "hours": {
                "default": 2,
                "description": "Robot time on site per day: up to 2, 4 or 8 hours (the app prices these packages).",
                "enum": [2, 4, 8],
                "type": "integer"
              },
              "lang": {
                "description": "Language the person writes in (ISO 639, e.g. \"en\", \"de\", \"pl\"). The MERA RENT app has 24 languages; others get English.",
                "pattern": "^[A-Za-z]{2,3}([_-][A-Za-z0-9]{1,8}){0,4}$",
                "type": "string"
              },
              "robot": {
                "description": "Robot id from MERA RENT, e.g. \"g1\" (Unitree G1), \"h2\" (Unitree H2), \"go2\" (Unitree Go2), \"edward\" (Edward Warchocki) or a catalog model such as \"unitree-h1\"; start_booking without a robot lists them.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,39}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Book in MERA RENT"
          },
          "behavior": {
