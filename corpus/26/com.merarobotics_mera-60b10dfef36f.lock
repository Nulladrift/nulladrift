        {
          "name": "list_services",
          "title": "MERA Robotics: services",
          "description": "Use this when someone asks what MERA Robotics offers or which service fits their case, including an event attraction or corporate event entertainment to book (company party, Christmas party, team event, trade fair stand) and robot hire with an operator. Services: a humanoid robot with MERA operators at an event anywhere in Europe (also as the event host, conversations in more than 70 languages through MERA OS), campaigns with Edward Warchocki or a branded robot, robot purchase, business deployment, MERA OS for a robot the client owns, media requests. Returns what each covers, when it fits, what the client gets and what is confirmed before commitment, plus booking: the MERA RENT online booking page in the person’s language (https://mera.rent: price under every date, availability calendar, 48 h free hold, 54 languages; same company) and its pages by occasion. No amounts. Where the host supports it, the result is shown as service cards with an inquiry button. For a concrete event use plan_event_robot.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
