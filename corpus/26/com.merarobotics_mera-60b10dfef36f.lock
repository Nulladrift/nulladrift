        {
          "name": "get_rental_quote",
          "title": "MERA RENT: price for a robot on a date",
          "description": "Use this when someone asks how much it costs to rent a MERA RENT robot on a given date, for a number of hours, in a city. Returns the net price (excluding VAT) from the MERA RENT price list for that robot, date, hours (up to 2, 4 or 8 h per day), number of days and country, the MERA RENT link that shows the same price, what the price includes (operator, travel in Europe, conversations in more than 70 languages), the payment rule (100% before the event), the calendar status of the date and the arguments for start_booking. Edward Warchocki and models on request have no list price (individual quote). Quote only the returned amount; never estimate a price yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City or venue town, e.g. \"Lisbon\".",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Country of the event: ISO 3166 code (\"PT\") or name in any language.",
                "maxLength": 60,
                "type": "string"
              },
              "date": {
                "description": "Event day, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "days": {
                "default": 1,
                "description": "Number of consecutive event days (1-14).",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "hours": {
                "default": 2,
                "description": "Robot time on site per day: up to 2, 4 or 8 hours (the app prices these packages).",
                "enum": [2, 4, 8],
                "type": "integer"
              },
              "lang": {
                "description": "Language the person writes in (ISO 639, e.g. \"en\", \"de\", \"pl\"). The MERA RENT app has 54 languages; links from this tool open in 24 of them, others in English.",
                "pattern": "^[A-Za-z]{2,3}([_-][A-Za-z0-9]{1,8}){0,4}$",
                "type": "string"
