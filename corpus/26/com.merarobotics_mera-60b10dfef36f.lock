        {
          "name": "open_inquiry_form",
          "title": "MERA Robotics: inquiry form",
          "description": "Use this when the person wants to ask MERA Robotics about a date for a robot at an event anywhere in Europe, or about a rental, purchase or deployment. Shows an inquiry form in the chat in the person’s language (24 languages, otherwise English), prefilled with details they already gave (service, event type, robot, date, city, country, guests, languages, goal, name, e-mail). It sends nothing by itself: the person checks the details, ticks consent and clicks \"Send inquiry\" in the form. If the host cannot show the form, collect the details in the chat and use request_quote after the person agrees.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Optional prefill. Approximate number of guests or participants.",
                "maxLength": 80,
                "type": "string"
              },
              "city": {
                "description": "Optional prefill. City or venue of the event or deployment.",
                "maxLength": 160,
                "type": "string"
              },
              "company": {
                "description": "Optional prefill. Company or organisation, if the person gave one.",
                "maxLength": 200,
                "type": "string"
              },
              "country": {
                "description": "Optional prefill. Country of the event or deployment (MERA works across Europe), e.g. \"France\" or \"FR\".",
                "maxLength": 80,
                "type": "string"
              },
              "duration": {
                "description": "Optional prefill. How long the robot should be on site, e.g. \"4 h\" or \"2 days\".",
                "maxLength": 80,
                "type": "string"
              },
              "email": {
                "description": "Optional prefill. The person’s own e-mail address; the MERA team replies to it. Never guess it or use a placeholder.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "event_date": {
                "description": "Optional prefill. First day of the event or the preferred start date (YYYY-MM-DD), if known.",
                "format": "date",
                "type": "string"
              },
              "event_type": {
                "description": "Optional prefill. Kind of event: trade_fair (stand or exhibition), conference (also panels and summits), gala (stage show, awards), corporate (company event, team event, employer branding), opening (store or showroom opening, product launch), city_event (city festival, fair, municipal event), school (school or university), sports, other.",
                "enum": ["trade_fair", "conference", "gala", "corporate", "opening", "city_event", "school", "sports", "other"],
                "type": "string"
              },
              "lang": {
                "description": "Language the person writes in: any ISO 639 code, optionally with a region, e.g. \"pt\", \"pt-PT\", \"et\", \"tr\", \"mt\". MERA EVENTS pages, the inquiry form and replies exist in 24 languages (pl, en, de, fr, it, es, nl, pt, sv, da, no, fi, et, lv, lt, uk, cs, sk, hu, ro, bg, hr, sl, el; \"no\" = Norwegian, \"el\" = Greek, \"uk\" = Ukrainian); for any other language they are in English.",
                "pattern": "^[A-Za-z]{2,3}([_-][A-Za-z0-9]{1,8}){0,4}$",
                "type": "string"
              },
              "languages": {
                "description": "Optional prefill. Languages the robot should speak with guests, e.g. [\"Polish\", \"English\"].",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "message": {
                "description": "Optional prefill. The goal and what the robot should do, venue conditions and anything else the MERA team should know, in the person’s words.",
                "maxLength": 4000,
                "type": "string"
              },
              "name": {
                "description": "Optional prefill. Full name of the person sending the inquiry, exactly as they gave it.",
                "maxLength": 120,
                "type": "string"
              },
              "reply_language": {
                "description": "Optional prefill. The person’s language, usually the one they write in: any ISO 639 code, optionally with a region (\"pt\", \"pt-PT\", \"tr\"). MERA replies and sends the event page in it when it is one of the 24 MERA EVENTS languages (pl, en, de, fr, it, es, nl, pt, sv, da, no, fi, et, lv, lt, uk, cs, sk, hu, ro, bg, hr, sl, el; \"no\" = Norwegian, \"el\" = Greek, \"uk\" = Ukrainian), otherwise in English; the language is recorded either way.",
                "pattern": "^[A-Za-z]{2,3}([_-][A-Za-z0-9]{1,8}){0,4}$",
                "type": "string"
              },
              "robot": {
                "description": "Optional prefill. Optional robot key from list_robots. For rental with an operator only g1 or h2; other keys are for purchase.",
                "enum": ["g1", "h2", "r1", "h1", "go2", "go2w", "a2", "b2", "dex5", "teleop", "used"],
                "type": "string"
              },
              "service": {
                "description": "Optional prefill. What the inquiry is about: events = a humanoid robot with a MERA operator at an event; purchase = buying a Unitree robot; integration = a robot deployed in a business (showroom, reception, booth); mera-os = MERA OS conversation software for a robot the person already owns; campaign = Edward Warchocki or a branded robot in a marketing campaign; media = interview or editorial request.",
                "enum": ["events", "purchase", "integration", "mera-os", "campaign", "media", "training"],
                "type": "string"
              }
            },
            "type": "object"
          },
