        {
          "name": "get_company_profile",
          "title": "MERA Robotics: company profile",
          "description": "Use this when someone asks about MERA Robotics itself: who it is, where it works, its rental fleet, languages, contact or registry data. MERA Robotics (MERA ROBOTICS sp. z o.o., Warsaw, Poland) rents humanoid robots (Unitree G1, Unitree H2) with its own operators and its MERA OS conversation system for events across Europe (every EU country and also the United Kingdom, Switzerland, Norway, Iceland, Türkiye and the Western Balkans, among others) and runs the robot Edward Warchocki. Returns a one-sentence definition, evidence (brands, places, reach, MERA OS), event rental pages in 54 languages, registry data, rental fleet, languages, pricing policy (prices for Unitree G1, H2 and Go2 in MERA RENT for a chosen date, country and working time, from get_rental_quote; Edward Warchocki quoted individually), contact and related entities (MERA OS, Edward Warchocki, the merarobots.com shop). For a concrete event use plan_event_robot.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of labels and descriptions: \"pl\" when the person writes in Polish, otherwise \"en\". Fact texts stay in their canonical Polish wording.",
                "enum": ["en", "pl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Company profile"
