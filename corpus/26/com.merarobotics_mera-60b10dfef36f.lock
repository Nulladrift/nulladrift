        {
          "name": "list_robots",
          "title": "MERA Robotics: robots for rent and sale",
          "description": "Use this when someone asks which robots MERA Robotics rents or sells, or about a model’s size, purpose or specifications. For rental with its own operators at events across Europe: Unitree G1 and Unitree H2. For sale: Unitree humanoids, quadrupeds, an industrial robot, a robotic hand, a VR teleoperation kit and inspected used G1 EDU, with type, purpose, key specifications and shop links. No prices here: rental prices for Unitree G1, H2 and Go2 come from get_rental_quote, prices of robots for sale from the shop or an inquiry. Where the host supports it, the result is shown as robot cards with an inquiry button.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "availability": {
                "default": "all",
