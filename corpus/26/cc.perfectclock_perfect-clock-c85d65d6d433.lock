{
  "lockfileVersion": 2,
  "subjects": {
    "cc.perfectclock/perfect-clock": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://perfectclock.cc/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "perfect-clock",
        "title": "Perfect Clock",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Perfect Clock plans meetings between people in different time zones.\nUse these tools when the user asks to plan, schedule or find a time for a meeting, call or recurring event with people or places in different time zones.\nConvert the user's wording into the structured input: IANA time zones for every participant (from the cities or countries they name), the meeting time in the zone it is anchored to, and a recurrence rule.\nUse find_meeting_windows when the time is not decided yet, plan_meeting_schedule once it is.\nThe results already account for working hours, public holidays and daylight saving time: show each participant's local time from the result, and mention the notes (DST shifts, days off, outside working hours).\nBoth tools' results end with an \"Open in Perfect Clock\" link (for the windows, the suggested start on those days) - give it to the user as it is. Do not make up other links to Perfect Clock or to calendars.",
      "tools": [
        {
          "name": "find_meeting_windows",
          "title": "Find meeting windows",
          "description": "Finds when people in other time zones can meet, when the time is not decided yet: the windows on each day when all participants are within their working hours, accounting for weekends, public holidays and daylight-saving changes, and one suggested start time that fits the most days. Saves that suggested time on those days for 30 days and returns a private perfectclock.cc/s/... link that opens it in Perfect Clock; each call saves a new schedule with its own link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 5,
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "durationMinutes": {
                "default": 60,
                "maximum": 480,
                "minimum": 15,
                "type": "integer"
              },
              "from": {
                "description": "First day in `tz`; default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "participants": {
                "description": "People or places the meeting must suit, each with their own time zone.",
                "items": {
                  "properties": {
                    "label": {
                      "description": "How the participant or place is called in the conversation, e.g. \"Anna\" or \"Tokyo office\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "tz": {
                      "description": "IANA time zone of this participant, e.g. Asia/Tbilisi.",
                      "type": "string"
                    },
                    "workHours": {
                      "description": "Local working hours [start, end]; default [\"09:00\",\"17:00\"].",
                      "items": {
                        "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                        "type": "string"
                      },
                      "maxItems": 2,
                      "minItems": 2,
                      "type": "array"
                    }
                  },
                  "required": ["label", "tz"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "description": "Meeting title, if the user gave one.",
                "maxLength": 120,
                "type": "string"
              },
              "tz": {
                "description": "Time zone whose calendar days are scanned (usually the organizer's).",
                "type": "string"
              }
            },
            "required": ["participants", "tz"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Find meeting windows"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://perfect-clock/windows-v1.html",
            "openai/toolInvocation/invoked": "Found the meeting windows",
            "openai/toolInvocation/invoking": "Finding a time for everyone…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://perfect-clock/windows-v1.html"
            }
          },
          "digest": "sha256:8a94d599f6a5b3d56aba23ff2a14e423aa6b417a7615aac4110bae74c957f31f"
        },
        {
          "name": "plan_meeting_schedule",
          "title": "Plan a meeting schedule",
          "description": "Plans a one-off or recurring meeting with people in other time zones when its time is known (e.g. \"every other Tuesday at 10:00 Berlin time with Anna in Tbilisi\"). Expands it into concrete dates and shows each one in every participant's local time, with working-hours checks, public holidays and daylight-saving shifts. Saves the schedule for 30 days and returns a private perfectclock.cc/s/... link that opens it in Perfect Clock; each call saves a new schedule with its own link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "durationMinutes": {
                "default": 60,
                "maximum": 720,
                "minimum": 5,
                "type": "integer"
              },
              "maxOccurrences": {
                "default": 8,
                "description": "How many upcoming meetings to list.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "participants": {
                "description": "People or places the meeting must suit, each with their own time zone.",
                "items": {
                  "properties": {
                    "label": {
                      "description": "How the participant or place is called in the conversation, e.g. \"Anna\" or \"Tokyo office\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "tz": {
                      "description": "IANA time zone of this participant, e.g. Asia/Tbilisi.",
                      "type": "string"
                    },
                    "workHours": {
                      "description": "Local working hours [start, end]; default [\"09:00\",\"17:00\"].",
                      "items": {
                        "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                        "type": "string"
                      },
                      "maxItems": 2,
                      "minItems": 2,
                      "type": "array"
                    }
                  },
                  "required": ["label", "tz"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "rule": {
                "description": "Recurrence of the meeting.",
                "properties": {
                  "byDay": {
                    "description": "Weekdays for weekly rules; for monthly with setPos, the weekday.",
                    "items": {
                      "enum": ["MO", "TU", "WE", "TH", "FR", "SA", "SU"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "count": {
                    "maximum": 500,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "freq": {
                    "enum": ["once", "daily", "weekly", "monthly"],
                    "type": "string"
                  },
                  "interval": {
                    "description": "Every N days/weeks/months; default 1.",
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "setPos": {
                    "description": "Monthly \"Nth weekday\": 1-4, or -1 for the last.",
                    "maximum": 4,
                    "minimum": -1,
                    "type": "integer"
                  },
                  "start": {
                    "description": "First possible date in `tz`; default today.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "until": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["freq"],
                "type": "object"
              },
              "time": {
                "description": "Local start time in `tz`.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "title": {
                "description": "Meeting title.",
                "maxLength": 120,
                "type": "string"
              },
              "tz": {
                "description": "Time zone the meeting time is fixed in (usually the organizer's).",
                "type": "string"
              }
            },
            "required": ["participants", "rule", "time", "title", "tz"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Plan a meeting schedule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://perfect-clock/schedule-v4.html",
            "openai/toolInvocation/invoked": "Meetings planned",
            "openai/toolInvocation/invoking": "Planning the meetings…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://perfect-clock/schedule-v4.html"
            }
          },
          "digest": "sha256:bb7f430afdb964c7d6b0624a6c650ef6cbc9247bd25703c781ee3d3b5050d8d4"
        }
      ],
      "resources": [
