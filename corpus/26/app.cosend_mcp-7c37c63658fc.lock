        {
          "name": "update_accurate_warehouse_arrival",
          "title": "Change “Warehouse arrival message” settings",
          "description": "Changes the settings of an automation set up from Cosend’s “Warehouse arrival message” recipe, named by id, as its settings page in Cosend does: the settings given replace their values, the rest keep theirs, and the result is saved as a new version. If the automation is switched on, the new settings go live with the save, or the save is refused in words and it keeps running what it ran; if it is off, they wait for it to be switched on. An automation from another recipe, or one written by hand, is refused. Each call needs confirming: without confirmation_token it changes nothing and returns a preview with the settings as Cosend filled them in and its check of them, and a token for a person to approve; called again with that token, it saves. Returns the new version.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "id": {
                "description": "The automation set up from the “Warehouse arrival message” recipe whose settings change.",
                "type": "string"
              },
              "settings": {
                "additionalProperties": false,
                "description": "The settings to change, as the recipe’s settings form asks them. A setting left out keeps the value it has.",
                "properties": {
                  "fallback_language": {
                    "description": "Sent when the customer’s own language isn’t one of the message’s approved languages. Left empty, the message’s first approved language.",
                    "pattern": "^([a-z]{2,3}(_[A-Z]{2})?)?$",
                    "picker": "language",
                    "templates": ["template_arrival"],
                    "title": "Fallback language",
                    "type": "string"
                  },
                  "more_blanks": {
                    "description": "One line for each further blank, in order. In any blank you can use: {recipient_name}, {code}, {sender_name}, {ref_number}, {status_name}, {price}, {pieces_count}, {description}, {openable}, {recipient_address}, {recipient_zone}, {recipient_subzone}, {delivery_date}, {service_name}, {service_days}.",
                    "entries": "sentences",
                    "items": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 13,
                    "title": "More blanks of the message",
                    "type": "array"
                  },
                  "name_when_missing": {
                    "description": "Used for {recipient_name} when the shipment has no receiver name. Left empty, a message that needs the name is not sent.",
                    "maxLength": 100,
                    "minLength": 0,
                    "title": "Name when Accurate has none",
                    "type": "string"
                  },
                  "openable_no": {
                    "description": "Written for {openable} when the receiver cannot open the shipment before paying. Left empty, {openable} shows Accurate’s code: N.",
                    "maxLength": 100,
                    "minLength": 0,
                    "title": "Text when it stays closed",
                    "type": "string"
                  },
                  "openable_yes": {
                    "description": "Written for {openable} when the receiver can open the shipment before paying. Left empty, {openable} shows Accurate’s code: Y.",
                    "maxLength": 100,
                    "minLength": 0,
                    "title": "Text when it can be opened",
                    "type": "string"
                  },
                  "template_arrival": {
                    "category": "utility",
                    "description": "A message approved by WhatsApp. Its blanks are set below. It goes to the receiver’s mobile number in Accurate when the shipment reaches the warehouse.",
                    "pattern": "^[a-z0-9_]{0,512}$",
                    "picker": "template",
                    "ready_made": {
                      "template": {
                        "category": "utility",
                        "components": [
                          {
                            "text": "Hello {{1}}, your shipment {{2}} from {{3}} has reached our warehouse.\nQuestions? Just reply to this message.",
                            "type": "BODY"
                          }
                        ],
                        "display_name": "Warehouse arrival",
                        "example_values": {
                          "body": {
                            "1": "Mona",
                            "2": "DBZ-1042",
                            "3": "Nile Crafts"
                          }
                        },
                        "language": "en"
                      }
                    },
                    "title": "Warehouse arrival message",
                    "type": "string"
                  },
                  "value_when_missing": {
                    "description": "Written for any shipment detail Accurate leaves empty, except {recipient_name}. Left empty, the message is sent only when those details have a value.",
                    "maxLength": 100,
                    "minLength": 0,
                    "title": "Text when Accurate has no value",
                    "type": "string"
                  },
                  "variable_1": {
                    "description": "What the message’s first blank says: your text, with shipment details in braces. Unchanged, the receiver’s name.",
                    "maxLength": 500,
                    "minLength": 1,
                    "title": "First blank of the message",
                    "type": "string"
                  },
                  "variable_2": {
                    "description": "What the message’s second blank says: your text, with shipment details in braces. Unchanged, the shipment’s code.",
                    "maxLength": 500,
                    "minLength": 1,
                    "title": "Second blank of the message",
                    "type": "string"
                  },
                  "variable_3": {
                    "description": "What the message’s third blank says: your text, with shipment details in braces. Unchanged, the store: the sender’s name.",
                    "maxLength": 500,
                    "minLength": 1,
                    "title": "Third blank of the message",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["id", "settings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change “Warehouse arrival message” settings"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
