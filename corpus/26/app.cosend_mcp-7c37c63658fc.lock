                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "question": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "connection_id": {
                "description": "The number the product belongs to. Optional with an API key made for one number, which already names it.",
                "type": "string"
              },
              "currency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "ISO 4217. Null uses the workspace’s currency (PATCH /v1/organizations/{id})."
              },
              "delivery_note": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "details": {
                "anyOf": [
                  {
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "description": "The product to change, by its prd_ id. Left out, a new product is added.",
