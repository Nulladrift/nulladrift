          "description": "Switches an automation on or off. state \"disable\" is the emergency stop: it takes effect at once and needs no confirmation. state \"enable\" switches it on, and from then on it acts on its own, so enabling needs a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve; called again with that token, it enables. version_id (enable only) picks the version to run; the default is the newest one, which has to have been checked and deployed first.",
