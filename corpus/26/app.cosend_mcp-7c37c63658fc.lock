        {
          "name": "update_automation_details",
          "title": "Rename an automation",
          "description": "Changes an existing automation’s name or description, and nothing else: what it does and its settings stay as they are. connection_id puts an automation made before numbers, which runs on every number, on one WhatsApp number, once; one that has a number keeps it. Its refunds setting (whether its refund steps wait for a person, run on their own or are off, shown with its details) is changed by a person in the Cosend dashboard, and a call that sends it is refused. Returns the automation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "connection_id": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The WhatsApp number for an automation that has none and runs on every number. Accepted once; an automation that has a number keeps it, and another one (or null) is refused. The value it already has, null included, changes nothing."
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "description": "The automation id.",
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "refunds": {
                "description": "This automation’s own rule for its refund steps (a step whose action a person approves: WooCommerce’s Refund the order, or a payment service’s Refund a payment). ask_first: each refund waits for a person under Approvals (the automation waits for it first). on_its_own: it refunds with no person checking it. off: it does not refund, and saving a version with a refund step is refused. ask_first until set. An owner or an admin changes it.",
                "enum": ["off", "ask_first", "on_its_own"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
