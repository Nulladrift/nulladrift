        {
          "name": "set_up_appointment_reminder",
          "title": "Set up “Appointment reminder”",
          "description": "Sets up Cosend’s “Appointment reminder” automation on one WhatsApp number: Customers get a reminder before each booking, and you choose what Confirm, Reschedule and a typed reply do. Its settings are this recipe’s own, as its set-up form in Cosend asks them; a setting left out takes its default. It is set up switched off, and acts only once it is switched on. The same recipe is set up once on each number, or once per source when it asks for one. The preview refuses a second one as the save would, and gives no token. It needs google_calendar or microsoft_calendar or calendly or cal_com or bokun connected to the workspace first (by integration key). Each call needs confirming: without confirmation_token it changes nothing and returns a preview with the settings as Cosend filled them in and its check of them, and a token for a person to approve; called again with that token, it saves. Returns the automation, switched off.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "connection_id": {
                "description": "The WhatsApp number (connection id) this automation belongs to: its triggers come from it, its messages go from it, and its templates are read on it. Required, and it cannot be moved afterwards. The same recipe (slug) can be set up once on each number, or once per source on it when the recipe has `multiple`.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Its name in Cosend. Left out, it takes the recipe’s name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "settings": {
                "additionalProperties": false,
                "description": "The recipe’s settings, as its set-up form asks them. A setting left out takes its default; a setting with no default is needed.",
                "properties": {
                  "calendar": {
                    "connectors": ["google_calendar", "microsoft_calendar", "calendly", "cal_com", "bokun"],
                    "default": "",
                    "description": "The calendar whose bookings get these reminders. When none is chosen, every calendar on this number does. Put the customer's WhatsApp number in the event, in the title, the description, the location or as a guest, e.g. +41 79 123 45 67. Events without one get no reminder.",
                    "maxLength": 64,
                    "picker": "account",
                    "title": "Calendar",
                    "type": "string"
                  },
                  "confirm_message": {
                    "default": "Thank you, see you then.",
                    "description": "Leave it empty to send nothing.",
                    "maxLength": 1024,
                    "minLength": 0,
                    "title": "When they tap Confirm, reply",
                    "type": "string"
                  },
                  "confirm_tag": {
                    "default": "appointment-confirmed",
                    "description": "Leave it empty for no tag.",
                    "maxLength": 48,
                    "minLength": 0,
                    "title": "When they tap Confirm, tag them",
                    "type": "string"
                  },
                  "confirm_to_person": {
                    "default": false,
                    "title": "When they tap Confirm, pass the chat to you",
                    "type": "boolean"
                  },
                  "fallback_language": {
                    "default": "",
                    "description": "Sent when the customer’s own language isn’t one of the message’s approved languages. Left empty, the message’s first approved language.",
                    "pattern": "^([a-z]{2,3}(_[A-Z]{2})?)?$",
                    "picker": "language",
                    "templates": ["template"],
                    "title": "Fallback language",
                    "type": "string"
                  },
                  "quiet_from": {
                    "default": "21:00",
                    "format": "time",
                    "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                    "title": "Night starts at",
                    "type": "string"
                  },
                  "quiet_hours": {
                    "default": false,
                    "description": "A reminder due at night waits until the night ends. A reminder that would then go after the appointment has started is not sent.",
                    "title": "Not at night",
                    "type": "boolean"
                  },
                  "quiet_until": {
                    "default": "08:00",
                    "format": "time",
                    "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                    "title": "Night ends at",
                    "type": "string"
                  },
                  "remind_day_before": {
                    "default": true,
                    "title": "24 hours before",
                    "type": "boolean"
                  },
                  "remind_two_hours_before": {
                    "default": true,
                    "title": "2 hours before",
                    "type": "boolean"
                  },
                  "reply_message": {
                    "default": "",
                    "description": "Leave it empty to send nothing.",
                    "maxLength": 1024,
                    "minLength": 0,
                    "title": "When they type a reply, reply",
                    "type": "string"
                  },
                  "reply_tag": {
                    "default": "",
                    "description": "Leave it empty for no tag.",
                    "maxLength": 48,
                    "minLength": 0,
                    "title": "When they type a reply, tag them",
                    "type": "string"
                  },
                  "reply_to_person": {
                    "default": true,
                    "title": "When they type a reply, pass the chat to you",
                    "type": "boolean"
                  },
                  "reschedule_message": {
                    "default": "",
                    "description": "Leave it empty to send nothing.",
                    "maxLength": 1024,
                    "minLength": 0,
                    "title": "When they tap Reschedule, reply",
                    "type": "string"
                  },
                  "reschedule_tag": {
