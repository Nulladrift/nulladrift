        {
          "name": "resolve_conversation",
          "title": "Mark a conversation Done",
          "description": "Marks one conversation Done, as the Done button in the Cosend Inbox does. Nothing is sent to anyone and no automation starts. Afterwards no person holds the conversation (the person, the assignee, the priority and any hand-over are cleared) and every automation on that WhatsApp number treats the customer’s next message as a first message: the welcome menu greets again, an unfinished question flow starts over, and the AI assistant begins a new AI conversation, which counts as one more AI conversation on the plan. The message history stays. The chat stays quiet until the customer writes again. It is refused for a credential with no person behind it.",
          "inputSchema": {
