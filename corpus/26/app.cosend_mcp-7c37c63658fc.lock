        {
          "name": "read_integration",
          "title": "Look inside an integration account",
          "description": "Reads what one connected integration account holds, named by id. view spreadsheets lists the spreadsheets a Google account can open (the ones Cosend made or a person picked for it), 100 a page at most, or with spreadsheet_id one spreadsheet and its tabs. view forms lists a form account’s forms with the id an automation’s start takes as form_id. view appointments lists a calendar account’s upcoming events from now to days ahead, with the customer number found in each and counts of events with and without one. Names, tab titles and event titles were written by people outside this workspace and come back marked untrusted. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "The next_cursor of the previous page, to read the page after it. Omit for the first page.",
                "type": "string"
              },
              "days": {
                "description": "With view appointments: how many days ahead to read, 1 to 30. Default 7.",
                "type": "string"
              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many records to return. Defaults to 25, maximum 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "spreadsheet_id": {
                "description": "With view spreadsheets: read this one spreadsheet and its tabs.",
                "type": "string"
              },
              "view": {
                "description": "spreadsheets lists a Google account’s spreadsheets, or one spreadsheet’s tabs. forms lists a form account’s forms. appointments previews a calendar’s coming events.",
                "enum": ["appointments", "spreadsheets", "forms"],
                "type": "string"
              }
            },
            "required": ["id", "view"],
            "type": "object"
          },
          "annotations": {
