                "description": "Every integration that has actions, with them: what a “Call an integration” step can name as its `integration` and `action`, and what each takes and answers.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "actions": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "action": {
                            "description": "The action’s key: what the step names as `action`.",
                            "type": "string"
                          },
                          "description": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "What the action does, in plain words. `null` when it declares none."
                          },
                          "destructive": {
                            "description": "Whether it deletes or cancels something that cannot be got back. A step that calls it is confirmed by the name `integration.call:<integration>.<action>` before the automation is switched on, and data a stranger controls may not decide whether it runs.",
                            "type": "boolean"
                          },
                          "input_schema": {
                            "additionalProperties": {},
                            "description": "The JSON Schema of the step’s `input`: a field with a default may be left out.",
