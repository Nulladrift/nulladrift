          "description": "Reads the settings of one AI receptionist, named by id (an automation of this workspace that has an AI step). What it may do for customers: bookings (book, move and cancel in a connected calendar or booking tool), the CRM (save what the customer said, log the chat) and payments (send a customer a link to pay a price the business set). Each has its switch, the integration account it works through, and its rules: for bookings the services with their length, the time kept free after each, the hours, breaks, holidays, how far ahead and with how much notice customers book, the most bookings a customer makes in a day, and whether the customer confirms a booking with a tap; for the CRM what it writes beside the contact and when the chat is logged; for payments the payment account it uses (such as Stripe or PayPal, connected on this number), the most one link may ask for, and how long a link stays open. Everything is off until switched on. permissions: what it may do on its own, per action type, each off (it does not, and a customer who asks goes to a person), ask_first (an owner or an admin approves each one under Approvals) or on_its_own (after the customer’s own Confirm tap): destructive (cancel or move a booking, cancel an order or change its address), payments (send a payment link) and refunds (a refund through a payment service or on an order). And the business location it can send customers as a map pin, with its name, address and the Google Maps link it was read from, or null when none is set. Read-only.",
