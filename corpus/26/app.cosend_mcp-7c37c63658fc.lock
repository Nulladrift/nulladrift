        },
        {
          "name": "change_knowledge",
          "title": "Change what the AI assistant knows",
          "description": "Changes one AI assistant’s knowledge, named by id. action add takes a kind: file (media_id of a file uploaded on the assistant’s number), text (text, with an optional title), url (a website) or place (a Google Maps link); it answers at once with the source, and the assistant reads it in the background (a website is read again every month). action remove (sourceId) forgets a source and everything read from it, on a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve. action refresh (sourceId) reads a source again now. action review_suggestion (suggestionId, accepted true or false, optional question and answer edits) turns a suggested answer into knowledge or drops it. action answer (question, as the assistant’s unanswered questions list it, and answer) adds the answer to the assistant’s knowledge: once it is read, the same question is answered from it and no longer listed. Owners and admins.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accepted": {
                "type": "boolean"
              },
              "action": {
                "description": "add gives the assistant something to read. remove forgets one source. refresh reads one source again. review_suggestion accepts (with edits) or rejects a suggested answer. answer answers a question the assistant could not.",
                "enum": ["add", "remove", "refresh", "review_suggestion", "answer"],
                "type": "string"
              },
              "answer": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "kind": {
                "enum": ["file", "text", "url", "place"],
                "type": "string"
              },
              "media_id": {
                "description": "A file uploaded on this automation’s number with POST /v1/media. A file uploaded on another number is refused with media_other_number.",
                "pattern": "^med_.*",
                "type": "string"
              },
              "question": {
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              },
              "sourceId": {
                "description": "The sourceId in the resource path.",
                "type": "string"
              },
              "suggestionId": {
                "description": "The suggestionId in the resource path.",
                "type": "string"
              },
              "text": {
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["action", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Change what the AI assistant knows"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9e907d717b0ae8583db050dc0f9a3941d532688d97fd5ec93a4716ab609e016"
        },
        {
          "name": "change_template",
          "title": "Edit, copy or delete a template",
          "description": "Changes an existing message template at Meta. action edit replaces all of its components and returns it to review (an approved template can be edited once in 24 hours); copy creates it on another WhatsApp account of the same business, where Meta reviews it again; delete removes it at Meta and from Cosend once Meta confirms. Each change needs a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve; called again with that token, it acts. Ten changes a day per workspace. It sends no message to anyone. Meta’s reason for a refusal is in Meta’s words.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "edit replaces the template’s components and sends it back to Meta’s review; copy makes a copy of it on another WhatsApp account of the business; delete removes it at Meta.",
                "enum": ["edit", "copy", "delete"],
                "type": "string"
              },
              "authentication": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "add_security_recommendation": {
                        "description": "Whether Meta adds \"For your security, do not share this code.\" to the body.",
                        "type": "boolean"
                      },
                      "button": {
                        "deprecated": true,
                        "description": "Refused. WhatsApp writes the button label in each language; there is no text to set. Give delivery instead: {\"type\": \"copy_code\"}."
                      },
                      "code_expiration_minutes": {
                        "anyOf": [
                          {
                            "maximum": 90,
                            "minimum": 1,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Minutes the code stays valid, 1 to 90: Meta's footer \"This code expires in N minutes.\" Left out or null, there is no footer."
                      },
                      "delivery": {
                        "description": "How the code reaches the person: {\"type\": \"copy_code\"}, or {\"type\": \"one_tap\" | \"zero_tap\", \"apps\": [{\"package_name\": \"com.example.app\", \"signature_hash\": \"K8a/AINcGX7\"}]} (1 to 5 apps); zero-tap also takes \"zero_tap_terms_accepted\": true.",
                        "oneOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "type": {
                                "const": "copy_code",
                                "type": "string"
                              }
                            },
                            "required": ["type"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "apps": {
                                "description": "The Android apps the code is handed to: 1 to 5, Meta's supported_apps.",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "package_name": {
                                      "maxLength": 224,
                                      "pattern": "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$",
                                      "type": "string"
                                    },
                                    "signature_hash": {
                                      "pattern": "^[A-Za-z0-9+/=]{11}$",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["package_name", "signature_hash"],
                                  "type": "object"
                                },
                                "maxItems": 5,
                                "minItems": 1,
                                "type": "array"
                              },
                              "type": {
