        },
        {
          "name": "submit_template",
          "title": "Submit a template for WhatsApp review",
          "description": "Creates a new WhatsApp message template and sends it to Meta for review. This leaves Cosend: Meta reviews every template (a decision can take up to 24 hours), and a rejection counts against the WhatsApp account’s quality history. Each submission needs a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve; called again with that token, it submits. Ten a day per workspace. The categories: marketing makes people aware of the business, its offers and sales; utility follows up on something the customer did or asked for (an order, a booking) and may not promote anything, so an order update with a discount in it is marketing; authentication is a one-time code. A wrong category is moved or rejected by Meta. Meta’s answer shows in the template’s review status. It sends no message to anyone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "authentication": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "add_security_recommendation": {
                        "description": "Whether Meta adds \"For your security, do not share this code.\" to the body.",
                        "type": "boolean"
                      },
                      "button": {
                        "deprecated": true,
                        "description": "Refused. WhatsApp writes the button label in each language; there is no text to set. Give delivery instead: {\"type\": \"copy_code\"}."
                      },
                      "code_expiration_minutes": {
                        "anyOf": [
                          {
                            "maximum": 90,
                            "minimum": 1,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Minutes the code stays valid, 1 to 90: Meta's footer \"This code expires in N minutes.\" Left out or null, there is no footer."
                      },
                      "delivery": {
                        "description": "How the code reaches the person: {\"type\": \"copy_code\"}, or {\"type\": \"one_tap\" | \"zero_tap\", \"apps\": [{\"package_name\": \"com.example.app\", \"signature_hash\": \"K8a/AINcGX7\"}]} (1 to 5 apps); zero-tap also takes \"zero_tap_terms_accepted\": true.",
                        "oneOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "type": {
                                "const": "copy_code",
                                "type": "string"
                              }
                            },
                            "required": ["type"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "apps": {
                                "description": "The Android apps the code is handed to: 1 to 5, Meta's supported_apps.",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "package_name": {
                                      "maxLength": 224,
                                      "pattern": "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$",
                                      "type": "string"
                                    },
                                    "signature_hash": {
                                      "pattern": "^[A-Za-z0-9+/=]{11}$",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["package_name", "signature_hash"],
                                  "type": "object"
                                },
                                "maxItems": 5,
                                "minItems": 1,
                                "type": "array"
                              },
                              "type": {
                                "const": "one_tap",
                                "type": "string"
                              }
                            },
                            "required": ["apps", "type"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "apps": {
