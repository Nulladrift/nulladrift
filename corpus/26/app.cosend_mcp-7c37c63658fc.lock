        {
          "name": "request_approval",
          "title": "Hold an action for a person’s decision",
          "description": "Holds an action for a human decision: action (a type from the approval action types), preview (exactly what the person is shown, up to 4096 characters), arguments, and optionally risk (it can only raise the type’s default) and run_id. The approval is pending, expires 24 hours after it is made (an expiry is a rejection), and appears in the Cosend approvals queue for a person to approve or reject. The workspace’s setting for that action type can also approve or reject it at once, and the answer says which. It only files the request for a person to decide. A retry with the same arguments returns the same approval.",
          "inputSchema": {
