                  },
                  "recipient_name": {
                    "anyOf": [
                      {
                        "maxLength": 120,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "tracking_number": {
                    "anyOf": [
                      {
                        "maxLength": 120,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The courier’s tracking number. Set at any time, like the arrival day."
                  }
                },
                "type": "object"
              },
              "id": {
                "description": "The order, by its ord_ id.",
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "description": "A custom item’s name. A product’s is the list’s.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "product_id": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "A product of the chat’s number. Left out or null: a custom item."
                    },
                    "quantity": {
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "unit_price": {
                      "anyOf": [
                        {
                          "pattern": "^\\d{1,12}(\\.\\d{1,3})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "A custom item’s price, typed by the seller. A product of the list is priced by the list."
                    },
                    "variant": {
                      "anyOf": [
                        {
                          "maxLength": 60,
                          "type": "string"
                        },
