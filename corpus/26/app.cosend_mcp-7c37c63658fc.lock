                "type": "string"
              },
              "status": {
                "description": "awaiting_customer sends the order to the customer for their Confirm tap (Starter and up). The other statuses are recorded as they are set.",
                "enum": ["draft", "awaiting_customer", "confirmed", "out_for_delivery", "delivered", "cancelled", "returned", "problem"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
