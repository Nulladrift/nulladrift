          "description": "Manages one connected integration account, named by id; the account returns no credential. action update takes name and config (the account’s non-secret settings). action test makes one safe read at the provider and returns whether the credential works; a failed test is an answer with ok false. action add_number (connection_id) uses the account on another WhatsApp number of the workspace, the same sign-in and not a copy. action remove_number (connection_id) stops using the account on one number, provided the account stays on at least one other number and no switched-on automation there needs it, on a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve. Signing in, and typing or replacing a key, happen on a set-up link the person opens; deleting an account or its saved login is done by a person in the Cosend dashboard. Owners and admins.",
