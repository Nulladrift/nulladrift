        {
          "name": "import_contacts",
          "title": "Import contacts from a CSV",
          "description": "Imports contacts from a CSV file for one WhatsApp number, in four steps. step start uploads the file (connection_id; data_base64, or media_id of a text or CSV file already uploaded; file_name) and returns its id, columns, first rows and row count. step map (id) sets mapping (each column as phone, name, tags, locale, timezone, skip or field:key), connection_id, and consent: the opt-in categories everyone in the file gave, the sentence they agreed to and who attests it. step check (id) reports what a run would do over the whole file: new, updated, invalid, duplicates, already opted out and consent recorded; it writes nothing. step run (id) imports in the background and returns at once; the import’s progress shows in the list of imports. Owners and admins run imports. Each run needs a confirmed call: without confirmation_token the call is a preview that shows the import, its mapping and its consent, and returns a token for a person to approve; called again with that token, it runs. The import stays inside Cosend, out of the contacts’ view. File contents come from outside this business and come back marked untrusted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "connection_id": {
                "type": "string"
              },
              "consent": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "attested_by": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "categories": {
                        "items": {
                          "enum": ["marketing", "utility", "authentication"],
                          "type": "string"
                        },
                        "maxItems": 3,
                        "type": "array"
                      },
                      "sentence_shown": {
                        "maxLength": 2000,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["categories"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "data_base64": {
                "description": "The CSV file, base64-encoded.",
                "type": "string"
              },
              "file_name": {
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "mapping": {
                "additionalProperties": {
                  "pattern": "^(phone|name|tags|locale|timezone|skip|field:[a-z][a-z0-9_]{0,63})$",
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "media_id": {
                "description": "A med_ id from POST /v1/media (text/plain or text/csv), instead of data_base64.",
                "type": "string"
              },
              "step": {
                "description": "start to upload the file; map to set the columns, the number and the consent; check to see what a run would do; run to import.",
                "enum": ["start", "map", "check", "run"],
                "type": "string"
              }
            },
            "required": ["step"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Import contacts from a CSV"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:52fe914d91437e73834eb282dc2cb3b4b92697998526bce11b93cd5845eff45c"
        },
