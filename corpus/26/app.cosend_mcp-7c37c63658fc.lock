                                    "maxLength": 25,
                                    "type": "string"
                                  },
                                  "type": {
                                    "const": "PHONE_NUMBER",
                                    "type": "string"
                                  }
                                },
                                "required": ["phone_number", "text", "type"],
                                "type": "object"
                              },
                              {
                                "additionalProperties": {},
                                "properties": {
                                  "type": {
                                    "type": "string"
                                  }
                                },
                                "required": ["type"],
                                "type": "object"
                              }
                            ]
                          },
                          "maxItems": 10,
                          "minItems": 1,
                          "type": "array"
                        },
                        "type": {
                          "const": "BUTTONS",
                          "type": "string"
                        }
                      },
                      "required": ["buttons", "type"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    }
                  ]
                },
                "minItems": 1,
                "type": "array"
              },
              "example_values": {
                "additionalProperties": false,
                "description": "A sample value for every variable in the TEXT header and the body, keyed per component by the name between the braces: {\"body\": {\"1\": \"Pablo\", \"2\": \"860198-230332\"}} or {\"body\": {\"first_name\": \"Pablo\"}}. Required for each such variable, because Meta rejects a template without samples; a missing one is refused with invalid_request, param example_values. Sent to Meta as each component's example. A component that already carries Meta's own example and has no entry here is sent as it is.",
                "properties": {
