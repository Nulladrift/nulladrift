                "minLength": 1,
                "type": "string"
              },
              "connectors": {
                "description": "The integrations the person signs in to, by key from GET /v1/connectors. The link completes when every one of them has an account.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "enum": ["connect_number", "reconnect_number", "connect_integrations", "pick_google_file", "upgrade", "payment_method"],
                "type": "string"
              },
              "plan": {
                "description": "The plan to buy, by code from GET /v1/billing/plans. Only for a workspace with no paid subscription, and only to a higher plan.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
