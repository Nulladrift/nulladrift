                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "description": {
                            "type": "string"
                          },
                          "type": {
                            "enum": ["first_message", "own_button_tap", "while_closed", "contains_words", "not_asked_for_review", "new_ad_chat", "new_contacts_only"],
                            "type": "string"
                          }
                        },
                        "required": ["description", "type"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["answers", "available", "dedupe_keys", "description", "filters", "inputs", "name", "params_schema", "produced_by"],
