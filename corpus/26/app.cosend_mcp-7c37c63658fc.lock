                "type": "string"
              },
              "connection_id": {
                "description": "The WhatsApp number (connection id) this automation belongs to: its triggers come from it, its messages go from it, and its templates are read on it. Required, and it cannot be moved afterwards. The same recipe (slug) can be set up once on each number, or once per source on it when the recipe has `multiple`.",
