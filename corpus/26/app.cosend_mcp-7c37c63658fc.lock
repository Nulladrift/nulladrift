        },
        {
          "name": "cancel_setup_link",
          "title": "Cancel a set-up link",
          "description": "Cancels an open set-up link so its page stops working, for example when the person changed their mind or the link asks for the wrong thing. A link already completed, expired or cancelled is refused, and nothing a link set up is undone. Only the person who asked for it can cancel it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel a set-up link"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:225414c1e2f72c0d9997c041cad54427b13cd6a2687542ba1c5d43d899f7c5c0"
        },
        {
          "name": "change_knowledge",
          "title": "Change what the AI assistant knows",
          "description": "Changes one AI assistant’s knowledge, named by id. action add takes a kind: file (media_id of a file uploaded on the assistant’s number), text (text, with an optional title), url (a website) or place (a Google Maps link); it answers at once with the source, and the assistant reads it in the background (a website is read again every month). action remove (sourceId) forgets a source and everything read from it, on a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve. action refresh (sourceId) reads a source again now. action review_suggestion (suggestionId, accepted true or false, optional question and answer edits) turns a suggested answer into knowledge or drops it. Owners and admins.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accepted": {
                "type": "boolean"
              },
              "action": {
                "description": "add gives the assistant something to read. remove forgets one source. refresh reads one source again. review_suggestion accepts (with edits) or rejects a suggested answer.",
                "enum": ["add", "remove", "refresh", "review_suggestion"],
                "type": "string"
              },
              "answer": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "kind": {
                "enum": ["file", "text", "url", "place"],
                "type": "string"
              },
              "media_id": {
                "description": "A file uploaded on this automation’s number with POST /v1/media. A file uploaded on another number is refused with media_other_number.",
                "pattern": "^med_.*",
                "type": "string"
              },
              "question": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "sourceId": {
                "description": "The sourceId in the resource path.",
                "type": "string"
              },
              "suggestionId": {
                "description": "The suggestionId in the resource path.",
                "type": "string"
              },
              "text": {
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["action", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Change what the AI assistant knows"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b5d9d021495fd1b67621416be7bc0644e489f9bc1e0d881d6905b5fab63c6d3"
        },
        {
          "name": "change_template",
          "title": "Edit, copy or delete a template",
          "description": "Changes an existing message template at Meta. action edit replaces all of its components and returns it to review (an approved template can be edited once in 24 hours); copy creates it on another WhatsApp account of the same business, where Meta reviews it again; delete removes it at Meta and from Cosend once Meta confirms. Each change needs a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve; called again with that token, it acts. Ten changes a day per workspace. It sends no message to anyone. Meta’s reason for a refusal is in Meta’s words.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "edit replaces the template’s components and sends it back to Meta’s review; copy makes a copy of it on another WhatsApp account of the business; delete removes it at Meta.",
                "enum": ["edit", "copy", "delete"],
                "type": "string"
              },
              "authentication": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "add_security_recommendation": {
                        "description": "Whether Meta adds \"For your security, do not share this code.\" to the body.",
                        "type": "boolean"
                      },
                      "button": {
                        "deprecated": true,
                        "description": "Refused. WhatsApp writes the button label in each language; there is no text to set. Give delivery instead: {\"type\": \"copy_code\"}."
                      },
                      "code_expiration_minutes": {
                        "anyOf": [
                          {
                            "maximum": 90,
                            "minimum": 1,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Minutes the code stays valid, 1 to 90: Meta's footer \"This code expires in N minutes.\" Left out or null, there is no footer."
                      },
                      "delivery": {
                        "description": "How the code reaches the person: {\"type\": \"copy_code\"}, or {\"type\": \"one_tap\" | \"zero_tap\", \"apps\": [{\"package_name\": \"com.example.app\", \"signature_hash\": \"K8a/AINcGX7\"}]} (1 to 5 apps); zero-tap also takes \"zero_tap_terms_accepted\": true.",
                        "oneOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "type": {
                                "const": "copy_code",
                                "type": "string"
                              }
                            },
                            "required": ["type"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "apps": {
                                "description": "The Android apps the code is handed to: 1 to 5, Meta's supported_apps.",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "package_name": {
                                      "maxLength": 224,
                                      "pattern": "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$",
                                      "type": "string"
                                    },
                                    "signature_hash": {
                                      "pattern": "^[A-Za-z0-9+/=]{11}$",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["package_name", "signature_hash"],
                                  "type": "object"
                                },
                                "maxItems": 5,
                                "minItems": 1,
                                "type": "array"
                              },
                              "type": {
                                "const": "one_tap",
                                "type": "string"
                              }
                            },
                            "required": ["apps", "type"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "apps": {
                                "description": "The Android apps the code is handed to: 1 to 5, Meta's supported_apps.",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "package_name": {
                                      "maxLength": 224,
                                      "pattern": "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$",
                                      "type": "string"
                                    },
                                    "signature_hash": {
                                      "pattern": "^[A-Za-z0-9+/=]{11}$",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["package_name", "signature_hash"],
                                  "type": "object"
                                },
                                "maxItems": 5,
                                "minItems": 1,
                                "type": "array"
                              },
                              "type": {
                                "const": "zero_tap",
                                "type": "string"
                              },
                              "zero_tap_terms_accepted": {
                                "const": true,
                                "description": "Meta's zero_tap_terms_accepted: \"Set to true to indicate that you understand that your use of zero-tap authentication is subject to the WhatsApp Business Terms of Service.\" Sent to Meta and recorded in the audit log.",
                                "type": "boolean"
                              }
                            },
                            "required": ["apps", "type", "zero_tap_terms_accepted"],
                            "type": "object"
                          }
                        ]
                      },
                      "languages": {
                        "description": "The language versions to create, e.g. [\"fr\", \"en_US\"]: one template per language, each written by WhatsApp in its language. On an edit, left out or exactly the template's own language.",
                        "items": {
                          "maxLength": 32,
                          "minLength": 2,
                          "type": "string"
                        },
                        "minItems": 1,
                        "type": "array"
                      },
                      "message_send_ttl_seconds": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "How long WhatsApp keeps trying to deliver the message: 30 to 900 seconds, or -1 for 30 days. Left out or null, WhatsApp's default for authentication, 10 minutes."
                      }
                    },
                    "required": ["add_security_recommendation", "delivery"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "An authentication template's choices, as create takes them. An edit is one language version: languages is left out, or exactly the template's own language."
              },
              "category": {
                "description": "A new category, sent to Meta when it differs. Meta refuses a change on an approved template, so that is refused here first.",
                "enum": ["marketing", "utility", "authentication"],
                "type": "string"
              },
              "components": {
                "description": "Meta's components, all of them; required on every category but authentication, which takes authentication instead.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "buttons": {
                          "items": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "properties": {
                                  "text": {
                                    "maxLength": 25,
                                    "type": "string"
                                  },
                                  "type": {
                                    "const": "QUICK_REPLY",
                                    "type": "string"
                                  }
                                },
                                "required": ["text", "type"],
                                "type": "object"
                              },
                              {
                                "additionalProperties": false,
                                "properties": {
                                  "example": {
                                    "items": {
                                      "minLength": 1,
                                      "type": "string"
                                    },
                                    "maxItems": 1,
                                    "minItems": 1,
                                    "type": "array"
                                  },
                                  "text": {
                                    "maxLength": 25,
                                    "type": "string"
                                  },
                                  "type": {
                                    "const": "URL",
                                    "type": "string"
                                  },
                                  "url": {
                                    "maxLength": 2000,
                                    "minLength": 1,
                                    "type": "string"
                                  }
                                },
                                "required": ["text", "type", "url"],
                                "type": "object"
                              },
                              {
                                "additionalProperties": false,
                                "properties": {
                                  "phone_number": {
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  "text": {
                                    "maxLength": 25,
                                    "type": "string"
                                  },
                                  "type": {
                                    "const": "PHONE_NUMBER",
                                    "type": "string"
                                  }
                                },
                                "required": ["phone_number", "text", "type"],
                                "type": "object"
                              },
                              {
                                "additionalProperties": {},
                                "properties": {
                                  "type": {
                                    "type": "string"
                                  }
                                },
                                "required": ["type"],
                                "type": "object"
                              }
                            ]
                          },
                          "maxItems": 10,
                          "minItems": 1,
                          "type": "array"
                        },
                        "type": {
                          "const": "BUTTONS",
                          "type": "string"
                        }
                      },
                      "required": ["buttons", "type"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    }
                  ]
                },
                "minItems": 1,
                "type": "array"
              },
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "display_name": {
                "description": "A new human name for the copy, from which its system name is made (with _2, _3… added when the account already has that name). Without it the copy keeps the template’s names, and an account that already has a template of that name in that language is 409 template_name_taken.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "example_values": {
