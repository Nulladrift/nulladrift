                "description": "Meta's interactive object. Checked against WhatsApp's limits before anything is written, and refused in words naming the field: a reply-button message (type \"button\", up to 3 buttons), a list message (type \"list\"), a catalogue message (type \"catalog_message\": body up to 1024 characters, footer up to 60, optional action.parameters.thumbnail_product_retailer_id), a single-product message (type \"product\": action.product_retailer_id, optional body and footer, no header) and a multi-product message (type \"product_list\": a text header up to 60 characters, a body, action.sections of product_items, at most 10 sections and 30 products, a title up to 24 characters on each section when there is more than one). A product message may leave out action.catalog_id, and Cosend sends the catalogue linked to the number's WhatsApp Business account in Meta's Commerce Manager; a catalogue message, and a product message without catalog_id, are refused in words when the number has none linked. A catalog_id you give is sent as given. Like every free-form message, they go only inside the 24-hour customer service window. Any other interactive type goes to WhatsApp unchanged."
