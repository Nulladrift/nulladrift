              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "ir": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "name": {
                "maxLength": 120,
