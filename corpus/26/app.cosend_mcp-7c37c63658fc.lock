        {
          "name": "update_order_confirmation",
          "title": "Change “Order confirmation” settings",
          "description": "Changes the settings of an automation set up from Cosend’s “Order confirmation” recipe, named by id, as its settings page in Cosend does: the settings given replace their values, the rest keep theirs, and the result is saved as a new version. If the automation is switched on, the new settings go live with the save, or the save is refused in words and it keeps running what it ran; if it is off, they wait for it to be switched on. An automation from another recipe, or one written by hand, is refused. Each call needs confirming: without confirmation_token it changes nothing and returns a preview with the settings as Cosend filled them in and its check of them, and a token for a person to approve; called again with that token, it saves. Returns the new version.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "id": {
                "description": "The automation set up from the “Order confirmation” recipe whose settings change.",
                "type": "string"
              },
              "settings": {
                "additionalProperties": false,
                "description": "The settings to change, as the recipe’s settings form asks them. A setting left out keeps the value it has.",
                "properties": {
                  "fallback_language": {
                    "description": "Sent when the customer’s own language isn’t one of the message’s approved languages. Left empty, the message’s first approved language.",
                    "pattern": "^([a-z]{2,3}(_[A-Z]{2})?)?$",
                    "picker": "language",
                    "templates": ["template_received"],
                    "title": "Fallback language",
                    "type": "string"
                  },
                  "shop": {
                    "connectors": ["woocommerce"],
                    "description": "The shop whose orders send these messages. When none is chosen, every shop on this number does.",
                    "maxLength": 64,
                    "picker": "account",
                    "title": "Shop",
                    "type": "string"
                  },
                  "template_received": {
                    "category": "utility",
                    "description": "A message approved by WhatsApp. It fills in the order number first, then the total.",
                    "pattern": "^[a-z0-9_]{0,512}$",
                    "picker": "template",
                    "ready_made": {
                      "template": {
                        "category": "utility",
                        "components": [
                          {
                            "text": "Thank you for your order. We have received order {{1}}, total {{2}}, and we are getting it ready.",
                            "type": "BODY"
                          }
                        ],
                        "display_name": "Order received",
                        "example_values": {
                          "body": {
                            "1": "1042",
                            "2": "49.90 EUR"
                          }
                        },
                        "language": "en"
                      }
                    },
                    "title": "Order received message",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["id", "settings"],
            "type": "object"
