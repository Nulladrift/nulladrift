                            "kind": {
                              "const": "service_is",
                              "type": "string"
                            },
                            "service": {
                              "maxLength": 80,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["kind", "service"],
                          "type": "object"
                        },
                        {
