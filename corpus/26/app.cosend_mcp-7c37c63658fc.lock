        {
          "name": "manage_automation",
          "title": "Rename, copy, roll back or delete an automation",
          "description": "Renames, copies, rolls back or deletes an existing automation, keeping its logic as it is. update sets the name or description; copy makes a custom copy on the same number, switched off, with its own persona, knowledge and remembered values (name defaults to the original’s followed by “(copy)”); rollback moves the automation to an earlier version (to_version is the version number) and, if it is on, it runs that version from then on; delete removes it, and no run starts after it. rollback and delete act only on a confirmed call: without confirmation_token they change nothing and return a preview and a token for a person to approve; called again with that token, they act.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "update changes the name or description; copy makes a custom copy, switched off; rollback points it back at an earlier version; delete removes it.",
                "enum": ["update", "delete", "copy", "rollback"],
                "type": "string"
              },
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "connection_id": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The WhatsApp number for an automation that has none and runs on every number. Accepted once; an automation that has a number keeps it, and another one (or null) is refused. The value it already has, null included, changes nothing."
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "description": "The automation id.",
                "type": "string"
              },
              "name": {
                "description": "The copy’s name. Absent: the original’s, followed by “(copy)”.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "to_version": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["action", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
