        {
          "name": "update_procedures",
          "title": "Change the AI receptionist’s procedures",
          "description": "Replaces one AI receptionist’s procedures, named by id, with the whole list sent (at most 10). Each is a condition (when: party_size_over with people, service_is with service, or first_visit) and one to four steps in order (steps: ask with question, deposit_link with amount and currency, book, or hand_over). A deposit’s amount is the one written here; the AI does not set one. An empty list removes them all. Each change needs a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve. Owners and admins.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "procedures": {
                "description": "The whole list, in order: each a condition (`when`) and one to four steps (`steps`) that follow it. It replaces the list there.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "steps": {
                      "items": {
                        "oneOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "kind": {
                                "const": "ask",
                                "type": "string"
                              },
                              "question": {
                                "maxLength": 200,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["kind", "question"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "amount": {
                                "pattern": "^\\d{1,12}(\\.\\d{1,3})?$",
                                "type": "string"
                              },
                              "currency": {
                                "pattern": "^[A-Z]{3}$",
                                "type": "string"
                              },
                              "kind": {
                                "const": "deposit_link",
                                "type": "string"
                              }
                            },
                            "required": ["amount", "currency", "kind"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "kind": {
                                "const": "book",
                                "type": "string"
                              }
                            },
                            "required": ["kind"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "kind": {
                                "const": "hand_over",
                                "type": "string"
                              }
                            },
                            "required": ["kind"],
                            "type": "object"
                          }
                        ]
                      },
                      "maxItems": 4,
                      "minItems": 1,
                      "type": "array"
                    },
                    "when": {
                      "oneOf": [
                        {
                          "additionalProperties": false,
