                        "example_values": {
                          "body": {
                            "1": "Tue, Oct 6, 2:30 PM"
                          }
                        },
                        "language": "en"
                      }
                    },
                    "title": "Reminder message",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["connection_id", "settings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
