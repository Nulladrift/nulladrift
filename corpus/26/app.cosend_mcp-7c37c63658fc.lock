        {
          "name": "set_up_accurate_warehouse_arrival",
          "title": "Set up “Warehouse arrival message”",
          "description": "Sets up Cosend’s “Warehouse arrival message” automation on one WhatsApp number: When an Accurate shipment reaches the warehouse, its receiver gets one WhatsApp message with the shipment’s details. Its settings are this recipe’s own, as its set-up form in Cosend asks them; a setting left out takes its default. It is set up switched off, and acts only once it is switched on. The same recipe is set up once on each number, or once per source when it asks for one. The preview refuses a second one as the save would, and gives no token. It needs accurate, and http connected to the workspace first (by integration key). Each call needs confirming: without confirmation_token it changes nothing and returns a preview with the settings as Cosend filled them in and its check of them, and a token for a person to approve; called again with that token, it saves. Returns the automation, switched off.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "connection_id": {
                "description": "The WhatsApp number (connection id) this automation belongs to: its triggers come from it, its messages go from it, and its templates are read on it. Required, and it cannot be moved afterwards. The same recipe (slug) can be set up once on each number, or once per source on it when the recipe has `multiple`.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Its name in Cosend. Left out, it takes the recipe’s name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "settings": {
                "additionalProperties": false,
                "description": "The recipe’s settings, as its set-up form asks them. A setting left out takes its default; a setting with no default is needed.",
                "properties": {
                  "fallback_language": {
                    "default": "",
                    "description": "Sent when the customer’s own language isn’t one of the message’s approved languages. Left empty, the message’s first approved language.",
                    "pattern": "^([a-z]{2,3}(_[A-Z]{2})?)?$",
                    "picker": "language",
                    "templates": ["template_arrival"],
                    "title": "Fallback language",
                    "type": "string"
                  },
                  "more_blanks": {
                    "default": [],
                    "description": "One line for each further blank, in order. In any blank you can use: {recipient_name}, {code}, {sender_name}, {ref_number}, {status_name}, {price}, {pieces_count}, {description}, {openable}, {recipient_address}, {recipient_zone}, {recipient_subzone}, {delivery_date}, {service_name}, {service_days}.",
                    "entries": "sentences",
