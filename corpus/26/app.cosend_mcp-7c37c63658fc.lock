                          "side_effect": {
                            "enum": ["none", "internal_write", "external_send"],
                            "type": "string"
                          },
                          "test_reads_for_real": {
                            "description": "Whether a Test runs it for real: a read, marked so. Every other action is held back in a Test.",
                            "type": "boolean"
                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "required": ["action", "description", "destructive", "input_schema", "output_schema", "side_effect", "test_reads_for_real", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "integration": {
                      "description": "The integration’s key: what a “Call an integration” step names as `integration`.",
                      "type": "string"
                    }
                  },
                  "required": ["actions", "integration"],
                  "type": "object"
                },
                "type": "array"
              },
              "object": {
                "const": "automation_catalogue",
                "type": "string"
              },
              "triggers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answers": {
                      "description": "Whether the trigger can carry `answers` (what of a customer’s message the automation claims). Only `whatsapp.message_received` can.",
                      "type": "boolean"
                    },
                    "available": {
                      "type": "boolean"
                    },
                    "dedupe_keys": {
                      "description": "The paths the trigger’s `dedupe.key` can name: the fields of what it carries (`contact.id`). The automation does not start again for the same value at that path within `dedupe.window_s` seconds. Validate refuses any other key, at `/trigger/dedupe/key`.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": {
                      "type": "string"
                    },
                    "filters": {
                      "description": "The checks on the event a builder offers on this start, each optional (“From contains”). Each is one clause of the trigger’s `filters.only_when`: `clause`, with the owner’s value as a `lit` where the `param` named `name` stands. Several are one `{ \"kind\": \"op\", \"op\": \"and\", \"args\": [...] }`. They are decided before a run exists: an event they keep out is not run and counts nothing (its run is `skipped`, `filtered`). Only `email.received` has any: `from_contains` and `subject_contains`, matched in any case, and `label`, a Gmail label matched exactly (the owner’s by name, Gmail’s own by id, such as `STARRED`). Empty on every other trigger.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
