            "additionalProperties": false,
            "properties": {
              "change_note": {
                "maxLength": 200,
                "type": "string"
              },
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "connection_id": {
                "description": "The WhatsApp number (connection id) this automation belongs to: its triggers come from it, its messages go from it, and its templates are read on it. Required, and it cannot be moved afterwards. The same recipe (slug) can be set up once on each number, or once per source on it when the recipe has `multiple`.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "ir": {
                "additionalProperties": {},
                "description": "The automation’s flow document (the IR), as a JSON object. `ir_version` selects the document schema Cosend validates it against. A document that does not match is refused with `automation_invalid`, whose `error.details[]` names each failing path as a JSON pointer.",
                "properties": {
