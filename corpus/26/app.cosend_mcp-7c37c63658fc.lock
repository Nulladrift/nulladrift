          "name": "update_contact",
          "title": "Edit a contact",
          "description": "Changes one contact, named by id, by whichever of these are given: name (the name the business sets, which shows first; null goes back to the WhatsApp names; owners and admins only), attributes (field values by key), tags (the whole list, replacing the old one), locale, timezone, and is_blocked (true blocks the contact on their number so nothing is sent to them and their messages are not answered; false unblocks; owners and admins only). The change stays inside Cosend, out of the contact’s view. Returns the contact.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attributes": {
                "additionalProperties": {},
                "description": "Free-form values. PATCH replaces them whole; a POST for a contact that already exists writes the keys sent over its values and removes none. A key registered in /v1/contact-fields must hold a value of its type (text: a string; number: a number; date: YYYY-MM-DD; boolean: true or false; choice: one of its choices) or null; after a PATCH that sets attributes, or a POST that writes them to a contact that already exists, every required field must have a value. A key that is not registered is kept as it comes. A contact has up to 100 keys, each up to 64 characters long, and a text value is up to 1,000 characters long.",
