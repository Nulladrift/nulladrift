                            "type": "object"
                          },
                          "trusted": {
                            "type": "boolean"
                          }
                        },
                        "required": ["fields", "trusted"],
                        "type": "object"
                      },
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    },
                    "params_schema": {
                      "additionalProperties": {},
                      "description": "The JSON Schema of the trigger’s `params`: exactly the ones it accepts, each with a plain `description`, `required` naming the ones it needs, and the recipe forms’ `picker` where a param is one (`tag`, `account`, `form`, `sheet`, `tab`). On a start an integration delivers, `account` also has `connectors`: the keys of the integrations whose accounts it starts on, the ones switching on binds, listing the integrations this workspace can connect; so do `form_id`, `spreadsheet_id` and `sheet`, with the integrations whose trigger takes that setting. An empty object schema when it takes none. Validate refuses any other param, and a needed one left out, at `/trigger/params/<name>`.",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "produced_by": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
