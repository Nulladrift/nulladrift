        {
          "name": "update_number",
          "title": "Change a number’s settings or profile",
          "description": "Changes one WhatsApp number, named by id. action settings takes delivery_mode (stored or direct), override_callback_url (where Meta’s webhooks for the number go; null clears it) and orders_and_bookings (ask_me_first: an order or booking the AI receptionist made waits for a person to tap Send before the customer gets it; send_right_away: the customer gets it at once; either way the customer taps Confirm). A switch to direct with automations, AI conversations or open chats in the way is refused with direct_mode_conflicts listing them: show the person that list, and only once they agree, call again with switch_off_conflicts true, which switches them off and then switches the number. action display_name takes display_name and submits it to Meta’s review; Meta’s decision shows on the number later. action profile takes any of about, description, address, email, websites, vertical and profile_picture (a media id from an upload on this number); every customer sees the profile. Each action needs a confirmed call: without confirmation_token the call is a preview that names the number and returns a token for a person to approve. The number’s webhook verify token and relay secret stay sealed in the number’s settings in the Cosend dashboard, and read as null here. Owners and admins.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "about": {
                "maxLength": 139,
                "minLength": 1,
                "type": "string"
              },
              "action": {
                "description": "settings changes how Meta’s messages for the number are handled. display_name submits a new name to Meta’s review. profile edits the business profile customers see.",
                "enum": ["settings", "display_name", "profile"],
                "type": "string"
              },
              "address": {
                "anyOf": [
                  {
                    "maxLength": 256,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "delivery_mode": {
                "enum": ["stored", "direct"],
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 512,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "display_name": {
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "orders_and_bookings": {
                "description": "Before your customer gets an order or booking the AI receptionist made. `ask_me_first` (the default): it waits for a person to check it and tap Send (`POST /v1/receptionist-actions/{id}/send`), then the customer gets it and taps Confirm. `send_right_away`: the customer gets it at once and taps Confirm. Cancellations, payment links, refunds and order changes go straight to the customer’s Confirm either way.",
                "enum": ["ask_me_first", "send_right_away"],
                "type": "string"
              },
              "override_callback_url": {
                "anyOf": [
                  {
                    "format": "uri",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Your endpoint for Meta’s webhooks for this number. On a `direct` number Cosend sets it as the number’s webhook override at Meta, and Meta sends the number’s messages, echoes, calls and history to it itself; Meta checks it first with `webhook.verify_token`, and keeps template and account webhooks on Cosend. On a `stored` number Cosend receives and keeps every change and relays each one to it in Meta’s envelope, signed `X-Cosend-Signature-256: sha256=<HMAC-SHA256 of the body with webhook.relay_secret>`, retried with back-off until a 2xx. `null` clears it."
              },
              "profile_picture": {
                "additionalProperties": false,
                "properties": {
                  "media_id": {
                    "pattern": "^med_.*",
                    "type": "string"
                  }
                },
                "required": ["media_id"],
                "type": "object"
              },
              "retention_months": {
                "description": "Retention is set once for the whole account, not per connection. Set it with PATCH /v1/account/data-policy.",
                "not": {}
              },
              "switch_off_conflicts": {
                "description": "With delivery_mode direct: true switches off what a 409 direct_mode_conflicts lists for this number, then switches it, all in one step. Automations are switched off, AI conversations ended and open chats marked Done; what is in the way is read again, not taken from the request. Absent or false, a switch with anything in the way is refused with that list.",
