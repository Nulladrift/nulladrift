                "type": "array"
              },
              "short_description": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "1 to 3 lines, shown on the product card."
