        {
          "name": "template_check",
          "title": "Check a template before Meta reviews it",
          "description": "Checks a WhatsApp message template (category, language, components and example values, as Meta takes them) against Meta’s rules, which are errors, and the warning signals Meta names, which are warnings; each problem says where it is and what to change. The verdict is fix_first, warnings or ready, and ready is not an approval: Meta still reviews every template itself. Nothing is submitted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "authentication": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "add_security_recommendation": {
                        "description": "Whether Meta adds \"For your security, do not share this code.\" to the body.",
                        "type": "boolean"
                      },
