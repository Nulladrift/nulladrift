        {
          "name": "update_number",
          "title": "Change a number’s settings or profile",
          "description": "Changes one WhatsApp number, named by id. action settings takes delivery_mode (stored or direct) and override_callback_url (where Meta’s webhooks for the number go; null clears it). action display_name takes display_name and submits it to Meta’s review; Meta’s decision shows on the number later. action profile takes any of about, description, address, email, websites, vertical and profile_picture (a media id from an upload on this number); every customer sees the profile. Each action needs a confirmed call: without confirmation_token the call is a preview that names the number and returns a token for a person to approve. The number’s webhook verify token and relay secret stay sealed in the number’s settings in the Cosend dashboard, and read as null here. Owners and admins.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "about": {
                "maxLength": 139,
                "minLength": 1,
                "type": "string"
              },
              "action": {
                "description": "settings changes how Meta’s messages for the number are handled. display_name submits a new name to Meta’s review. profile edits the business profile customers see.",
                "enum": ["settings", "display_name", "profile"],
                "type": "string"
              },
              "address": {
                "anyOf": [
                  {
                    "maxLength": 256,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "delivery_mode": {
                "enum": ["stored", "direct"],
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 512,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "display_name": {
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "override_callback_url": {
                "anyOf": [
                  {
                    "format": "uri",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Your endpoint for Meta’s webhooks for this number. On a `direct` number Cosend sets it as the number’s webhook override at Meta, and Meta sends the number’s messages, echoes, calls and history to it itself; Meta checks it first with `webhook.verify_token`, and keeps template and account webhooks on Cosend. On a `stored` number Cosend receives and keeps every change and relays each one to it in Meta’s envelope, signed `X-Cosend-Signature-256: sha256=<HMAC-SHA256 of the body with webhook.relay_secret>`, retried with back-off until a 2xx. `null` clears it."
              },
              "profile_picture": {
                "additionalProperties": false,
                "properties": {
                  "media_id": {
                    "pattern": "^med_.*",
                    "type": "string"
                  }
                },
                "required": ["media_id"],
                "type": "object"
              },
              "retention_months": {
                "description": "Retention is set once for the whole account, not per connection. Set it with PATCH /v1/account/data-policy.",
                "not": {}
              },
              "vertical": {
                "anyOf": [
                  {
                    "enum": ["alcohol", "apparel", "automotive", "beauty", "education", "entertainment", "event_planning", "finance", "government", "grocery", "health", "hotel", "nonprofit", "online_gambling", "over_the_counter_drugs", "other", "physical_gambling", "professional_services", "restaurant", "retail", "travel"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "websites": {
                "items": {
                  "format": "uri",
                  "maxLength": 256,
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              }
            },
            "required": ["action", "id"],
            "type": "object"
          },
