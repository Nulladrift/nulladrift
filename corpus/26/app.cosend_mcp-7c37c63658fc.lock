                              "type": "string"
                            },
                            "type": "object"
                          },
                          "output_schema": {
                            "anyOf": [
                              {
                                "additionalProperties": {},
                                "propertyNames": {
                                  "type": "string"
                                },
                                "type": "object"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "The JSON Schema of what the action answers, which the step returns as `result`. `null` when the action does not declare it."
