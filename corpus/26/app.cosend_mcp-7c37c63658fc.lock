            "additionalProperties": false,
            "properties": {
              "blocks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available": {
                      "type": "boolean"
                    },
                    "category": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "destructive": {
                      "type": "boolean"
                    },
                    "display_name": {
                      "type": "string"
                    },
                    "input_schema": {
                      "additionalProperties": {},
                      "description": "The JSON Schema of what the step takes, with the recipe forms’ `picker` where an input is one (`tag`, `template`, `language`, `sheet`, `account`). A send’s `to` is `picker: \"recipient\"`, with two `choices`: `customer`, “The customer who wrote”, which binds `binds` (`{ \"kind\": \"ref\", \"path\": \"contact.id\" }`) and is offered, and chosen first, on the starts its `starts` lists; and `number`, “A fixed number”, typed with its country code as its `description` says. Validate refuses a send with neither (`missing_recipient`) and a number the phone rule refuses (`unusable_recipient`), in plain words naming the step, at `<step>/inputs/to`. Every other input naming one contact is `picker: \"contact\"`, with the same two `choices`, refused as `missing_contact` and `unusable_contact`; every input naming a chat is `picker: \"conversation\"`, with one `choice`, `chat`, “This chat”, which binds `{ \"kind\": \"ref\", \"path\": \"conversation.id\" }` and is offered, and chosen first, on the starts its `starts` lists, refused left empty as `missing_conversation`. Each refusal is at `<step>/inputs/<input>`.",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    },
                    "node": {
                      "type": "string"
                    },
                    "outcomes": {
                      "description": "The named outcomes this block may end with besides working or failing, each with the causes it gives. A split block maps one to a branch (`{ \"type\": \"outcome\", \"step\", \"is\", \"cause\" }`). Empty for a block that only works or fails.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "causes": {
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "description": {
                                  "type": "string"
                                },
                                "name": {
                                  "type": "string"
                                }
                              },
                              "required": ["description", "name"],
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "description": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          }
                        },
                        "required": ["causes", "description", "name"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "output_schema": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "requires_connection": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "side_effect": {
                      "enum": ["none", "internal_write", "external_send", "money"],
                      "type": "string"
                    },
                    "test_reads_for_real": {
                      "description": "The integration actions a Test runs for real through this block: reads, each marked so one by one. Every other integration action is held back in a Test, whatever it does. Empty for every block but “Call an integration”; any other block runs in a Test only when its `side_effect` is `none`.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "action": {
                            "type": "string"
                          },
                          "integration": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "required": ["action", "integration", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "unavailable_reason": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Why the block cannot be used, in one plain sentence an owner reads: the sentence validate refuses it with at save. `null` when `available` is true."
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["available", "category", "description", "destructive", "display_name", "input_schema", "name", "node", "outcomes", "output_schema", "requires_connection", "side_effect", "test_reads_for_real", "unavailable_reason", "version"],
                  "type": "object"
                },
                "type": "array"
              },
              "document_schema": {
                "additionalProperties": {},
                "description": "The JSON Schema of an automation document (`ir_version` 1.0): what it starts on, its steps (actions, conditions, branches, loops, waits) and the expressions a condition is written in, each operator and function by name. Present when `connection_id` names a number.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
