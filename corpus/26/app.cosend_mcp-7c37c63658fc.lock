                        "anyOf": [
                          {
                            "maximum": 90,
                            "minimum": 1,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Minutes the code stays valid, 1 to 90: Meta's footer \"This code expires in N minutes.\" Left out or null, there is no footer."
                      },
                      "delivery": {
                        "description": "How the code reaches the person: {\"type\": \"copy_code\"}, or {\"type\": \"one_tap\" | \"zero_tap\", \"apps\": [{\"package_name\": \"com.example.app\", \"signature_hash\": \"K8a/AINcGX7\"}]} (1 to 5 apps); zero-tap also takes \"zero_tap_terms_accepted\": true.",
                        "oneOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "type": {
                                "const": "copy_code",
                                "type": "string"
                              }
                            },
                            "required": ["type"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "apps": {
                                "description": "The Android apps the code is handed to: 1 to 5, Meta's supported_apps.",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "package_name": {
                                      "maxLength": 224,
                                      "pattern": "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$",
                                      "type": "string"
                                    },
                                    "signature_hash": {
                                      "pattern": "^[A-Za-z0-9+/=]{11}$",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["package_name", "signature_hash"],
                                  "type": "object"
                                },
                                "maxItems": 5,
                                "minItems": 1,
                                "type": "array"
                              },
                              "type": {
                                "const": "one_tap",
                                "type": "string"
                              }
                            },
                            "required": ["apps", "type"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "apps": {
                                "description": "The Android apps the code is handed to: 1 to 5, Meta's supported_apps.",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "package_name": {
                                      "maxLength": 224,
                                      "pattern": "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$",
                                      "type": "string"
                                    },
                                    "signature_hash": {
                                      "pattern": "^[A-Za-z0-9+/=]{11}$",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["package_name", "signature_hash"],
                                  "type": "object"
                                },
                                "maxItems": 5,
                                "minItems": 1,
                                "type": "array"
                              },
                              "type": {
                                "const": "zero_tap",
                                "type": "string"
                              },
                              "zero_tap_terms_accepted": {
                                "const": true,
                                "description": "Meta's zero_tap_terms_accepted: \"Set to true to indicate that you understand that your use of zero-tap authentication is subject to the WhatsApp Business Terms of Service.\" Sent to Meta and recorded in the audit log.",
                                "type": "boolean"
                              }
                            },
                            "required": ["apps", "type", "zero_tap_terms_accepted"],
                            "type": "object"
                          }
                        ]
                      },
                      "languages": {
                        "description": "The language versions to create, e.g. [\"fr\", \"en_US\"]: one template per language, each written by WhatsApp in its language. On an edit, left out or exactly the template's own language.",
                        "items": {
                          "maxLength": 32,
                          "minLength": 2,
                          "type": "string"
                        },
                        "minItems": 1,
                        "type": "array"
                      },
                      "message_send_ttl_seconds": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "How long WhatsApp keeps trying to deliver the message: 30 to 900 seconds, or -1 for 30 days. Left out or null, WhatsApp's default for authentication, 10 minutes."
                      }
                    },
                    "required": ["add_security_recommendation", "delivery", "languages"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "An authentication template, in Meta's shape, in place of components and language: {\"languages\": [\"fr\", \"en_US\"], \"add_security_recommendation\": true, \"code_expiration_minutes\": 10, \"delivery\": {\"type\": \"copy_code\"}, \"message_send_ttl_seconds\": 600}. WhatsApp writes the message and the button label in each language (\"{{1}} is your verification code.\" in English); there is no text to set. One template is created per language, each its own resource; the answer is the version in the first language. Required when category is authentication, and refused on any other category; null is the same as leaving it out."
              },
              "category": {
                "enum": ["marketing", "utility", "authentication"],
                "type": "string"
              },
              "components": {
                "description": "Meta's components, as POST /v1/templates takes them; required on every category but authentication, which takes authentication instead.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "buttons": {
                          "items": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "properties": {
