        {
          "name": "import_contacts",
          "title": "Import contacts from a CSV",
          "description": "Imports contacts from a CSV file for one WhatsApp number, in steps. step start uploads the file (connection_id; data_base64, or media_id of a text or CSV file already uploaded; file_name) and returns its id, columns, first rows and row count. step map (id) sets mapping (each column as phone, name, tags, locale, timezone, skip or field:key; name and tags may be on several columns), new_fields (fields the run adds to the workspace, each key, label, type and choices, for columns mapped to field:key), connection_id, and consent: the opt-in categories everyone in the file gave, the sentence they agreed to and who attests it. step check (id) reports what a run would do over the whole file: new, updated, invalid, duplicates, already opted out and consent recorded, and with details true the rows left out and five contacts as they will be (a phone typed without its country code takes the country of the number); it writes nothing. step run (id; tag, a tag every contact it adds or updates gets) imports in the background and returns at once; the import’s progress shows in the list of imports. Owners and admins run imports. Each run needs a confirmed call: without confirmation_token the call is a preview that shows the import, its mapping, its new fields and its consent, and returns a token for a person to approve; called again with that token, it runs. The import stays inside Cosend, out of the contacts’ view. File contents come from outside this business and come back marked untrusted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "For a call that needs approval: left out, the call does nothing and returns a preview and a token; given that token, with the same arguments, the call does it.",
                "type": "string"
              },
              "connection_id": {
                "type": "string"
              },
              "consent": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "attested_by": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "categories": {
                        "items": {
                          "enum": ["marketing", "utility", "authentication"],
                          "type": "string"
                        },
                        "maxItems": 3,
                        "type": "array"
                      },
                      "sentence_shown": {
                        "maxLength": 2000,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["categories"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "data_base64": {
                "description": "The CSV file, base64-encoded.",
                "type": "string"
              },
              "details": {
                "description": "Also answer the rows that will not be imported (the first 100) and five contacts as the import will write them.",
                "type": "boolean"
              },
              "file_name": {
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "id": {
                "description": "The id in the resource path.",
                "type": "string"
              },
              "mapping": {
                "additionalProperties": {
                  "pattern": "^(phone|name|tags|locale|timezone|skip|field:[a-z][a-z0-9_]{0,63})$",
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "media_id": {
                "description": "A med_ id from POST /v1/media (text/plain or text/csv), instead of data_base64.",
                "type": "string"
              },
              "new_fields": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "choices": {
                      "description": "A choice field's options, 1 to 100 of them, each once; none otherwise.",
                      "items": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 100,
                      "type": "array"
                    },
                    "key": {
                      "pattern": "^[a-z][a-z0-9_]{0,63}$",
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": {
                      "enum": ["text", "number", "date", "boolean", "choice"],
                      "type": "string"
                    }
                  },
                  "required": ["choices", "key", "label", "type"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "step": {
                "description": "start to upload the file; map to set the columns, the number and the consent; check to see what a run would do; run to import.",
                "enum": ["start", "map", "check", "run"],
                "type": "string"
              },
              "tag": {
                "description": "A tag every contact this import adds or updates gets, beside the file’s own tags, so the whole file can be saved as an audience on it.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
