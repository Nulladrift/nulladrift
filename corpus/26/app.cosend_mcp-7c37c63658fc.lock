                        },
                        "maxItems": 100,
                        "type": "array"
                      },
                      "first_order": {
                        "description": "Asked of a customer’s first order.",
                        "type": "boolean"
                      },
                      "kind": {
                        "enum": ["amount", "percent"],
                        "type": "string"
                      },
                      "value": {
