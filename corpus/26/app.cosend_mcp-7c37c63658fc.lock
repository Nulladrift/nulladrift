        {
          "name": "try_assistant",
          "title": "Try the AI assistant",
          "description": "Asks one AI assistant (automation_id) a customer’s question and returns what it would do: its reply, the intent and confidence it read, the knowledge sources it used, whether it would hand the chat to a person, and the message a customer would receive. The trial stays inside Cosend, out of customers’ view. Each chat is one AI conversation on the plan, counted when the assistant is first asked in it; send the chat_id an answer returns, with history, to continue the same chat. For an assistant that is switched off, connection_id with holding_message (and escalate_keywords or closed hours) tries it with the set-up’s answers. Owners and admins.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "automation_id": {
                "description": "The AI assistant being tried: an automation of this workspace with one AI step. The answer comes from its own persona and knowledge, and from no other assistant’s. Alone, the try also uses the escalate_keywords of the version its conversations run (the switched-on one, else the newest), the first message of its branch for the cant_answer outcome of that step and its cause, and its closed message and opening hours; with connection_id, the set-up’s answers replace those.",
                "pattern": "^aut_[0-9A-HJKMNP-TV-Z]{26}$",
                "type": "string"
              },
              "chat_id": {
                "anyOf": [
                  {
                    "pattern": "^ais_[0-9A-HJKMNP-TV-Z]{26}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The Try it chat this message continues: the chat_id an earlier answer in it gave. Each chat counts as one AI conversation, billed like a real one, from the first time the assistant is asked in it. Null or left out starts a new chat; a history that already holds an assistant turn needs it, unless a turn in it was handed over."
              },
              "closed": {
                "additionalProperties": false,
                "description": "With connection_id: the set-up's closed message, opening hours (HH:MM, in the workspace's timezone) and closed-hours passing message. While closed, the answer's closed_message is the message with the hours, and a customer_message for a chat passed on is the closed-hours one.",
                "properties": {
                  "closes_at": {
                    "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                    "type": "string"
                  },
                  "holding_message": {
                    "description": "The set-up's message for when the assistant passes the chat on while closed, in place of holding_message: where it says {opens}, the customer reads when the business next opens. The AI receptionist's default when left out.",
                    "maxLength": 900,
                    "minLength": 1,
                    "type": "string"
                  },
                  "message": {
                    "maxLength": 1024,
                    "minLength": 1,
                    "type": "string"
                  },
                  "open_days": {
                    "items": {
                      "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                      "type": "string"
                    },
                    "maxItems": 7,
                    "minItems": 1,
                    "type": "array"
                  },
                  "opens_at": {
                    "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                    "type": "string"
                  }
                },
                "required": ["closes_at", "message", "open_days", "opens_at"],
                "type": "object"
              },
              "connection_id": {
                "description": "For a receptionist that is not switched on: the number it is being set up on. Requires holding_message; escalate_keywords and closed as the set-up has them. They replace the settings of automation_id’s version.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "escalate_keywords": {
                "description": "With connection_id: the words that pass a chat to a person.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 24,
                "type": "array"
              },
              "history": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "handed_over": {
                      "description": "True on the customer turn after which a person had the chat: its answer was cant_answer, and the automation's steps for that case hand the chat to a person. From then on, as in a real chat, the answer is outcome person_has_chat and the model is not asked.",
                      "type": "boolean"
                    },
                    "role": {
                      "enum": ["customer", "assistant"],
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 4096,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["role", "text"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "holding_message": {
                "description": "Required with connection_id, and only with it: the message a customer is sent when the assistant cannot answer.",
                "maxLength": 900,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["automation_id", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Try the AI assistant"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:13aa5e8a8198299341c3625dbb24511adec5b5859ae159b60cde7147242739c8"
        },
        {
          "name": "update_assistant_persona",
          "title": "Change the AI assistant’s persona",
          "description": "Changes the persona of one AI assistant, named by id. Only the fields sent change; a list (links, never_say) is the whole new list. The persona is set through typed fields: business_name, what_you_do, tone, may_quote_prices, links, never_say and confidence_threshold. Each change needs a confirmed call: without confirmation_token the call is a preview that returns what would happen and a token for a person to approve; called again with that token, it saves. When the assistant is switched on, customers meet the new persona at their next message. Owners and admins.",
