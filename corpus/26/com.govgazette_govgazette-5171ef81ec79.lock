{
  "lockfileVersion": 2,
  "subjects": {
    "com.govgazette/govgazette": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://govgazette.com/api/v1/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2024-11-05", "2025-03-26", "2025-06-18", "2025-11-25", "2026-07-28"]
      },
      "serverInfo": {
        "name": "GovGazette",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Public research is free and needs no account. Start with search_opportunities using a plain-language query and limit 3; add state, NAICS or set-aside filters only when relevant. Select a returned notice id and generation, then use research_opportunity for its source-backed brief. For detail or document, use the exact collection and id returned by search, never a page URL or slug. check_exclusions accepts an identities array of objects with name or verified UEI/CAGE/NPI fields; names alone are possible matches and no match is not clearance. Check freshness and preserve generation, provenance and official source links. Keep empty results explicit and verify requirements with the issuing agency. Private saved-search tools require a workspace bearer key and explicit user intent for writes; never ask for keys in prompts.",
      "tools": [
        {
          "name": "check_exclusions",
          "title": "Check possible exclusion matches",
          "description": "Check 1 to 20 identities against a dated active SAM snapshot. Pass identities as an array of objects, not a record ID or page URL. Each identity needs a name, UEI, CAGE, or NPI. Exact identifier matches and name-only possible matches remain distinct. Read coverage.freshness; stale or unknown-source empty lookups report unavailable with snapshot_status no_match_in_snapshot. No match is not clearance.",
          "inputSchema": {
            "$defs": {
              "Identity": {
                "additionalProperties": false,
                "properties": {
                  "cage": {
                    "description": "Exact five-character CAGE code, when known.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Person or organization name; name-only matches are possible matches.",
                    "type": ["string", "null"]
                  },
                  "npi": {
                    "description": "Exact ten-digit National Provider Identifier, when known.",
                    "type": ["string", "null"]
                  },
                  "uei": {
                    "description": "Exact 12-character Unique Entity ID, when known.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "generation": {
                "description": "Retained snapshot UUID; omit for the current snapshot.",
                "type": ["string", "null"]
              },
              "identities": {
                "description": "One to twenty identities to compare with the dated SAM snapshot.",
                "items": {
                  "$ref": "#/$defs/Identity"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["identities"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "ExclusionCoverage": {
                "properties": {
                  "freshness": {
                    "$ref": "#/$defs/SourceFreshness",
                    "description": "Fresh, stale, unknown or unavailable, with age and the 24-hour warning policy."
                  },
                  "observed_at": {
                    "description": "Observation time does not replace the official source timestamp.",
                    "type": ["string", "null"]
                  },
                  "scope": {
                    "type": ["string", "null"]
                  },
                  "sha256": {
                    "type": ["string", "null"]
                  },
                  "source_date": {
                    "type": ["string", "null"]
                  },
                  "source_url": {
                    "type": ["string", "null"]
                  },
                  "status": {
                    "description": "Present as unavailable when no SAM coverage exists in this generation.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["freshness"],
                "type": "object"
              },
              "ExclusionMatch": {
                "properties": {
                  "identity": {
                    "$ref": "#/$defs/Identity"
                  },
                  "records": {
                    "description": "Candidate exclusion records with match basis; not a clearance decision.",
                    "items": {
                      "$ref": "#/$defs/JsonObject"
                    },
                    "type": "array"
                  },
                  "snapshot_status": {
                    "description": "Observed lookup outcome in the dated snapshot, even when status is unavailable.",
                    "type": "string"
                  },
                  "status": {
                    "description": "Exact or possible match, fresh-snapshot no-match, or unavailable. Stale,\nunknown and missing sources never produce a clean no-match status.",
                    "type": "string"
                  },
                  "truncated": {
                    "type": "boolean"
                  }
                },
                "required": ["identity", "records", "snapshot_status", "status", "truncated"],
                "type": "object"
              },
              "FreshnessState": {
                "enum": ["fresh", "stale", "unknown", "unavailable"],
                "type": "string"
              },
              "Identity": {
                "additionalProperties": false,
                "properties": {
                  "cage": {
                    "description": "Exact five-character CAGE code, when known.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Person or organization name; name-only matches are possible matches.",
                    "type": ["string", "null"]
                  },
                  "npi": {
                    "description": "Exact ten-digit National Provider Identifier, when known.",
                    "type": ["string", "null"]
                  },
                  "uei": {
                    "description": "Exact 12-character Unique Entity ID, when known.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "JsonObject": {
                "description": "Source-specific JSON map. The envelope is stable; map keys vary by official source.",
                "type": "object"
              },
              "SourceFreshness": {
                "properties": {
                  "attention_required": {
                    "type": "boolean"
                  },
                  "evaluated_at": {
                    "description": "UTC time when age was evaluated; source and observation dates are unchanged.",
                    "type": "string"
                  },
                  "max_age_seconds": {
                    "description": "Explicit warning threshold for this daily snapshot. Not a scheduler promise.",
                    "format": "int64",
                    "type": "integer"
                  },
                  "source_age_seconds": {
                    "description": "Age of the official source timestamp, never the import or enrichment timestamp.",
                    "format": "int64",
                    "type": ["integer", "null"]
                  },
                  "state": {
                    "$ref": "#/$defs/FreshnessState"
                  },
                  "warn_age_seconds": {
                    "description": "Early-warning boundary, separate from the stale-source boundary.",
                    "format": "int64",
                    "type": "integer"
                  },
                  "warning": {
                    "description": "User-facing warning, or null when within the warning threshold.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["attention_required", "evaluated_at", "max_age_seconds", "state", "warn_age_seconds"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "coverage": {
                "$ref": "#/$defs/ExclusionCoverage"
              },
              "generation": {
                "type": "string"
              },
              "results": {
                "items": {
                  "$ref": "#/$defs/ExclusionMatch"
                },
                "type": "array"
              }
            },
            "required": ["coverage", "generation", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
