      "serverInfo": {
        "name": "GovGazette",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Public research is free and needs no account. First call tools/list and use its current names and schemas. Confirm a public call with freshness and empty arguments {}, then use search_opportunities with a relevant plain-language query and limit 3. If a tool is unknown, refresh tools/list instead of repeating or guessing its name. Generic search requires collection. Add state, NAICS or set-aside filters only when relevant. Select a returned notice id and generation, then use research_opportunity for its source-backed brief. For detail or document, use the exact collection and id returned by search, never a page URL or slug. check_exclusions accepts an identities array of objects with name or verified UEI/CAGE/NPI fields; names alone are possible matches and no match is not clearance. Preserve generation, provenance and official source links. Keep empty results explicit and verify requirements with the issuing agency. A private-tool 401 does not block public research. Private saved-search tools require account OAuth or a workspace bearer key and explicit user intent for writes; never ask for keys in prompts. First-call recovery: https://govgazette.com/integrations/first-result.md",
      "tools": [
        {
          "name": "check_exclusions",
          "title": "Check possible exclusion matches",
          "description": "Check 1 to 20 identities against the active SAM snapshot. Each identity needs a name, UEI, CAGE, or NPI. Exact identifier matches and name-only possible matches are distinct. If the source is over 24 hours old or its date cannot be verified, the check returns a source_unavailable tool error without results. A fresh snapshot with no match is not clearance.",
          "inputSchema": {
            "$defs": {
              "Identity": {
                "additionalProperties": false,
                "properties": {
                  "cage": {
                    "description": "Exact five-character CAGE code, when known.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Person or organization name, within 256 UTF-8 bytes; name-only matches are possible matches.",
                    "type": ["string", "null"]
                  },
                  "npi": {
                    "description": "Exact ten-digit National Provider Identifier, when known.",
                    "type": ["string", "null"]
                  },
                  "uei": {
                    "description": "Exact 12-character Unique Entity ID, when known.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "generation": {
                "description": "Retained snapshot UUID; omit for the current snapshot.",
                "type": ["string", "null"]
              },
              "identities": {
                "description": "One to twenty identities to compare with the dated SAM snapshot.",
                "items": {
                  "$ref": "#/$defs/Identity"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["identities"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "ExclusionCoverage": {
                "properties": {
                  "freshness": {
                    "$ref": "#/$defs/SourceFreshness",
                    "description": "Fresh, stale, unknown or unavailable, with age and the 24-hour warning policy."
                  },
                  "observed_at": {
                    "description": "Observation time does not replace the official source timestamp.",
                    "type": ["string", "null"]
                  },
                  "scope": {
                    "type": ["string", "null"]
                  },
                  "sha256": {
                    "type": ["string", "null"]
                  },
                  "source_date": {
                    "type": ["string", "null"]
                  },
                  "source_url": {
                    "type": ["string", "null"]
                  },
                  "status": {
                    "description": "Present as unavailable when no SAM coverage exists in this generation.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["freshness"],
                "type": "object"
              },
              "ExclusionMatch": {
                "properties": {
                  "identity": {
                    "$ref": "#/$defs/Identity"
                  },
                  "records": {
                    "description": "Candidate exclusion records with match basis; not a clearance decision.",
                    "items": {
                      "$ref": "#/$defs/JsonObject"
                    },
                    "type": "array"
                  },
                  "snapshot_status": {
                    "description": "Same dated lookup outcome as status. Present only for a completed check.",
                    "type": "string"
                  },
                  "status": {
                    "description": "Exact, possible, or no match in a fresh snapshot. A stale source fails the whole check.",
                    "type": "string"
                  },
                  "truncated": {
                    "type": "boolean"
                  }
                },
                "required": ["identity", "records", "snapshot_status", "status", "truncated"],
                "type": "object"
              },
              "FreshnessState": {
                "enum": ["fresh", "stale", "unknown", "unavailable"],
                "type": "string"
              },
              "Identity": {
                "additionalProperties": false,
                "properties": {
                  "cage": {
                    "description": "Exact five-character CAGE code, when known.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Person or organization name, within 256 UTF-8 bytes; name-only matches are possible matches.",
                    "type": ["string", "null"]
                  },
                  "npi": {
                    "description": "Exact ten-digit National Provider Identifier, when known.",
                    "type": ["string", "null"]
                  },
                  "uei": {
                    "description": "Exact 12-character Unique Entity ID, when known.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "JsonObject": {
                "description": "Source-specific JSON map. The envelope is stable; map keys vary by official source.",
                "type": "object"
              },
              "SourceFreshness": {
                "properties": {
                  "attention_required": {
                    "type": "boolean"
                  },
                  "evaluated_at": {
                    "description": "UTC time when age was evaluated; source and observation dates are unchanged.",
                    "type": "string"
                  },
                  "max_age_seconds": {
                    "description": "Explicit warning threshold for this daily snapshot. Not a scheduler promise.",
                    "format": "int64",
                    "type": "integer"
                  },
                  "source_age_seconds": {
                    "description": "Age of the official source timestamp, never the import or enrichment timestamp.",
                    "format": "int64",
                    "type": ["integer", "null"]
                  },
                  "state": {
                    "$ref": "#/$defs/FreshnessState"
                  },
                  "warn_age_seconds": {
                    "description": "Early-warning boundary, separate from the stale-source boundary.",
                    "format": "int64",
                    "type": "integer"
                  },
                  "warning": {
                    "description": "User-facing warning, or null when within the warning threshold.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["attention_required", "evaluated_at", "max_age_seconds", "state", "warn_age_seconds"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "coverage": {
                "$ref": "#/$defs/ExclusionCoverage"
              },
              "generation": {
                "type": "string"
              },
              "results": {
