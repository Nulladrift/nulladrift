        {
          "name": "create_saved_search",
          "title": "Create a saved search",
          "description": "Create one private saved opportunity search with the supplied name and criteria. Requires authenticated workspace access and explicit user intent. Creates an account workspace if needed and adds a search without replacing existing searches. Returns a private feed link. The first successful check establishes a baseline; no email or external notification is sent.",
          "inputSchema": {
            "$defs": {
              "OpportunityQuery": {
                "additionalProperties": false,
                "properties": {
                  "active": {
                    "description": "Filter by source active status; this does not mean the response deadline is open.",
                    "type": ["boolean", "null"]
                  },
                  "after": {
                    "description": "Last notice ID from next_after in the preceding page.",
                    "type": ["string", "null"]
                  },
                  "agency": {
                    "description": "Agency code on the source notice.",
                    "type": ["string", "null"]
                  },
                  "generation": {
                    "description": "Retained generation UUID from a prior result for a consistent snapshot.",
                    "type": ["string", "null"]
                  },
                  "limit": {
                    "description": "Maximum notices to return, from 1 to 50; defaults to 25.",
                    "format": "uint",
                    "maximum": 50,
                    "minimum": 1,
                    "type": ["integer", "null"]
                  },
                  "naics": {
                    "description": "Two- to six-digit NAICS industry code from a notice or the NAICS reference collection.",
                    "type": ["string", "null"]
                  },
                  "q": {
                    "default": "",
                    "description": "Plain-language keywords; empty returns notices matching the other filters.",
                    "type": "string"
                  },
                  "set_aside": {
                    "description": "Official set-aside code from a notice or the set-asides reference collection.",
                    "type": ["string", "null"]
                  },
                  "state": {
                    "description": "State or territory code for the place of performance.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "criteria": {
                "$ref": "#/$defs/OpportunityQuery",
                "description": "Opportunity filters to save; generation, after and limit are reset by the server."
              },
              "name": {
                "description": "Human-readable name for the new saved search; 1 to 100 UTF-8 bytes after trimming.",
                "type": "string"
              }
            },
            "required": ["criteria", "name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "feed_path": {
                "description": "Private capability path; do not share it publicly.",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "message": {
                "description": "First successful check establishes a baseline, not delivered changes.",
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["feed_path", "id", "message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
