      "tools": [
        {
          "name": "speed_read",
          "description": "Render a Speed Reader for the provided text. The user can speed-read articles, documents, or any wall of text via Rapid Serial Visual Presentation (RSVP) with density-aware pacing.\n\nWHEN TO CALL: Whenever the user wants to \"speedread\", \"speed read this\", \"read fast\", or asks to consume long text quickly. Pass the full text via the text argument.\n\nRESPONSE: This tool returns a click-out URL to the Speed Reader web app at archerionlabs.com/speedread. The URL carries a bind token and stays openable for 24 hours. On the free tier the reading session itself expires 1 hour after it is created; a signed-in paid account can still open it for the whole window. Always present the URL to the user as a clickable link.\n\nSpeed Reader by Archerion.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The text to speed-read.",
                "type": "string"
              },
              "title": {
                "description": "Optional short title or source hint shown in the reader header.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
