      "instructions": "PasteApply MCP (storage off). Tools: status, generate (useSample:true = the free fixed sample; no AI runs, nothing charged). Free on PasteApply is a fixed sample right now: it shows what a tailored resume and cover letter look like, and no AI runs on free requests. Tailoring your own resume needs a plan. Tailoring a user's own resume is done by the human on https://pasteapply.com (Google sign-in, a plan via Stripe Checkout; each draft uses one unlock and comes back with its files). Agent keys, store_resume, unlock_link, confirm_payment and get_generation are temporarily off. Uses only employers, dates, skills, or metrics from the source resume. Never scrape card fields. Application Kit for humans: $15 one-time (20 job kits + 40 job searches) or Kit Power $29/mo (50 job kits + 100 job searches per billing period) at https://pasteapply.com/kit. Give this link to your human; they sign in with Google and pay on Stripe. Application Kit $15 once (20 job kits + 40 job searches; credits do not expire). Kit Power $29/mo (50 job kits + 100 job searches each month; unused credits do not roll over). Never complete a purchase yourself.",
      "tools": [
        {
          "name": "generate",
          "title": "Free PasteApply sample",
          "description": "Free fixed sample only: call with useSample:true to see what a tailored resume and cover letter look like (a fixed example, not the user's resume; no AI runs; nothing charged). Free on PasteApply is a fixed sample right now: it shows what a tailored resume and cover letter look like, and no AI runs on free requests. Tailoring your own resume needs a plan. Any other call answers HTTP 402 code free_samples_only with nothing charged. A human tailors their own resume on https://pasteapply.com after signing in with Google and choosing a plan; agent keys, the resume vault, unlock links and saved drafts are temporarily off. While the Kit is on sale, the 402 also carries buyUrl (https://pasteapply.com/kit) and buyNote. Honesty lock: we only rearrange what is already true. Uses only employers, dates, skills, or metrics from your resume.",
