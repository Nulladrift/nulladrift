            "readOnly": false
          },
          "digest": "sha256:7017b8902d8d443077b222a2f04ac08057f650dc72215a7a3767eeb44c2ed672"
        },
        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to human providers (two steps; not a purchase)",
          "description": "Submits an enquiry to PropFirmPicker — NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token — show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before any provider sees it. Consent means the person has read and agreed to: \"By submitting you agree PropFirmPicker emails you a shortlist and shares nothing else with anyone.\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: By submitting you agree PropFirmPicker emails you a shortlist and shares nothing else with anyone.",
                "type": "boolean"
              }
            },
            "required": ["answers", "consent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:190c7961591d6d32693b751abcf76e75cc0c7b9058f4a6bcab03adc2346d9286"
        }
