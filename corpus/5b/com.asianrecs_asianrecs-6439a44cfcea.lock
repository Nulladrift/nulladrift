{
  "lockfileVersion": 2,
  "subjects": {
    "com.asianrecs/asianrecs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://asianrecs.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "asianrecs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Asian Recs ranks restaurants, dessert shops, cafes and bars in San Francisco and New York by how Asian diners rate them, shown beside how everyone else rates them.\n\nWhen recommending places:\n- Lead with the Asian diners' rating and the \"vs others\" gap; mention what to order.\n- Every result has an asianrecs_link to the place's full page, and each search has a see_all link to the whole list.\n- Only San Francisco and New York are covered. For anywhere else, say so rather than guessing.\n- If asked how ratings are made: they come from public Google and Yelp reviews, comparing how Asian diners rate a place with how everyone else rates the same place. Point to \"How we rank\" on asianrecs.com for more.",
      "tools": [
        {
          "name": "get_place",
          "title": "Asian Recs place details",
          "description": "Full Asian Recs page for one place: both ratings and the gap, share of reviewers who are Asian, dishes Asian diners mention most, quotes from Asian diners, Google and Yelp ratings, and links (Asian Recs, Google Maps, Yelp, Instagram). Use when someone asks about one specific place in San Francisco or New York.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "sf = San Francisco, nyc = New York",
                "enum": ["sf", "nyc"],
                "type": "string"
              },
              "name": {
                "description": "Place name; partial names work.",
                "type": "string"
              },
              "type": {
                "description": "Narrow to one kind of place when a name is ambiguous.",
                "enum": ["restaurants", "desserts", "cafes", "bars"],
                "type": "string"
              }
            },
            "required": ["city", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Asian Recs place details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:191d2626e78bd6d995dbfce0506a70c3cc4c336c3560772114bc5e4c44f29f64"
        },
        {
          "name": "list_filters",
          "title": "Asian Recs neighborhoods and cuisines",
          "description": "Areas, neighborhoods and cuisines available for a city and kind of place, with how many ranked places each has. Use to find the exact neighborhood and cuisine names search_places accepts, or to answer what is covered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "sf = San Francisco, nyc = New York",
                "enum": ["sf", "nyc"],
                "type": "string"
              },
              "type": {
                "description": "Kind of place. Default restaurants. Boba, coffee, tea and bakeries are cafes; ice cream and dessert shops are desserts.",
                "enum": ["restaurants", "desserts", "cafes", "bars"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Asian Recs neighborhoods and cuisines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74c6a3453a87af6ba2c58af7e65bfe01755397ec0a4d4c109ba9d0e1e83ba26d"
        },
        {
          "name": "search_places",
          "title": "Search Asian Recs",
          "description": "Find places in San Francisco or New York ranked by how Asian diners rate them. Each result has the Asian diners' rating, everyone else's rating, the gap between them, how many Asian diners reviewed it, top dishes, neighborhood and a link to its page. Use when someone asks where to eat or drink in San Francisco or New York, or for restaurant, dessert, cafe or bar recommendations there. When nothing matches, message says why.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "sf = San Francisco, nyc = New York",
                "enum": ["sf", "nyc"],
                "type": "string"
              },
              "cuisine": {
                "description": "Cuisine or drink category, e.g. \"ramen\", \"sichuan\", \"korean\", \"dim sum\", or \"boba\" with type cafes.",
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Neighborhood or area, e.g. \"Mission\", \"East Village\", \"Flushing\", \"Manhattan — Downtown\". list_filters has the exact names.",
                "type": "string"
              },
              "near": {
                "description": "A point to measure distance from; adds distance_mi to results.",
                "properties": {
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  }
                },
                "required": ["lat", "lng"],
                "type": "object"
              },
              "query": {
                "description": "Free text matched against name, cuisine, neighborhood and dishes, e.g. a dish like \"soup dumplings\".",
                "type": "string"
              },
              "radius_mi": {
                "description": "With near: only places within this many miles.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sort": {
                "description": "asian_rating: Asian diners' rating, highest first; loved_more: Biggest gap above everyone else; most_asian_diners: Most Asian diners; share_asian: Highest share of Asian reviewers; distance: Closest first (needs near). Default asian_rating.",
                "enum": ["asian_rating", "loved_more", "most_asian_diners", "share_asian", "distance"],
                "type": "string"
              },
              "type": {
                "description": "Kind of place. Default restaurants. Boba, coffee, tea and bakeries are cafes; ice cream and dessert shops are desserts.",
                "enum": ["restaurants", "desserts", "cafes", "bars"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Asian Recs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55708a9424ab5d9fe1d2877bac2027ee65e50e3d4c49faa068da9358726f77e7"
        }
      ],
      "digest": "sha256:a236652bd81a33a137007cb0513fa23ae61896277daa3b0ff76edc7144f3d0de"
    }
  }
}
