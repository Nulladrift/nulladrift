{
  "lockfileVersion": 2,
  "subjects": {
    "com.lonscloud/isbn": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lons-isbn-mcp.padbor.workers.dev/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "lons-isbn",
        "title": "Lons Publishing ISBN",
        "version": "1.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Lons Publishing ISBN: official ISBN-13 under the author's own imprint, accepted by Amazon KDP, Google Books, Fnac, Waterstones, 160+ countries, delivered by e-mail within 6 h, for all authors worldwide (18 languages: fr, en, es, pt, de, it, nl, pl, ar, ja, ko, zh, hi, tr, id, sv, vi, sw). Read-only server. Use get_isbn_offer for packs/prices, get_order_link to give the customer a secure payment page (the customer pays himself; this server never performs payments), get_required_book_info to prepare the book form, faq for common questions. Website: https://lonscloud.com/",
      "tools": [
        {
          "name": "faq",
          "title": "Frequently asked questions",
          "description": "Answers common questions about the ISBN service. Optional keyword filter.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Optional keyword, e.g. 'delivery', 'format', 'pay'.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4188d8d7d7773f7768d83b787d110b85fbf464353acd4e3ebc25b41a5ca0174"
        },
        {
          "name": "get_isbn_offer",
          "title": "ISBN offer, packs and prices",
          "description": "Returns the three ISBN packs (simple, barcode, premium) with prices in USD and FCFA (XOF), what each includes, delivery delay, payment methods, supported languages and contact.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "fr",
                "description": "Customer language: fr (default), en, es, pt, de, it, nl, pl, ar, ja, ko, zh, hi, tr, id, sv, vi, sw.",
                "enum": ["fr", "en", "es", "pt", "de", "it", "nl", "pl", "ar", "ja", "ko", "zh", "hi", "tr", "id", "sv", "vi", "sw"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:caf56abb29e7eba9aa1767ec65074ab1602eca96b576b75c0b4891369a2e938c"
        },
        {
          "name": "get_order_link",
          "title": "Secure order link",
          "description": "Returns the secure page where the CUSTOMER pays for an ISBN pack. card = Stripe Checkout link; mobile_money = order page with the Mobile Money form. This tool never performs or initiates a payment and collects no payment data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "fr",
                "description": "Customer language: fr (default), en, es, pt, de, it, nl, pl, ar, ja, ko, zh, hi, tr, id, sv, vi, sw.",
                "enum": ["fr", "en", "es", "pt", "de", "it", "nl", "pl", "ar", "ja", "ko", "zh", "hi", "tr", "id", "sv", "vi", "sw"],
                "type": "string"
              },
              "pack": {
                "description": "simple (49 $), barcode (52 $), premium (55 $).",
                "enum": ["simple", "barcode", "premium"],
                "type": "string"
              },
              "payment_method": {
                "default": "card",
                "description": "card (Stripe) or mobile_money.",
                "enum": ["card", "mobile_money"],
                "type": "string"
              }
            },
            "required": ["pack"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:893463e668f529548a414482b599a3ff790cda9313ea698bcc80abe306ce5225"
        },
        {
          "name": "get_required_book_info",
          "title": "Book information required after payment",
          "description": "Lists the fields the customer fills in on the thank-you page after payment, so an agent can help prepare them in advance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "fr",
                "description": "Customer language: fr (default), en, es, pt, de, it, nl, pl, ar, ja, ko, zh, hi, tr, id, sv, vi, sw.",
                "enum": ["fr", "en", "es", "pt", "de", "it", "nl", "pl", "ar", "ja", "ko", "zh", "hi", "tr", "id", "sv", "vi", "sw"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ffa89f6f3067b8e9c27a3d6f6a55f2f83e45f4244eee677892f51197c4974cfd"
        }
      ],
      "digest": "sha256:59153967875491326701ef6f08fa8f5a3d037b8e84da173ba94afdb42aecca82"
    }
  }
}
