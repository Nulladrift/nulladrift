            "readOnly": true
          },
          "digest": "sha256:7c0035ba254738727adca1f95880923765416602fdf9654ccc2ca6eb80ad62a2"
        },
        {
          "name": "get_metal_price",
          "title": "Price of one metal",
          "description": "Current spot price of one precious metal in US dollars per troy ounce, gram and kilogram, with the change for the day. Data from MeltValue.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "metal": {
                "description": "Which metal to price.",
                "enum": ["gold", "silver", "platinum", "palladium"],
                "type": "string"
              }
            },
            "required": ["metal"],
            "type": "object"
          },
