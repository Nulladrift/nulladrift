      "instructions": "Motion Brew is a library of animated React components (micro interactions, cards, menus, charts, text effects) built with motion/react, GSAP and Tailwind CSS v4.\n\nHow to use this server:\n1. Find a component with search_components (plain words like \"hold to delete\" or \"sidebar\") or browse with list_components.\n2. Call get_component with its slug. Each component is one self contained file (its icons and the cn() helper are inside), plus a few npm packages.\n3. Run the one install command it gives: it installs the packages and downloads the file to components/<slug>.tsx. Do not write the file out yourself, that is slow. Only without a shell, call get_component with files \"single\" for the contents.\n4. Use it as the usage example shows. If the project is new, get_setup lists what it needs (React and Tailwind CSS v4).\nFor several components at once, get_install_plan gives one install command and the downloads.\n5. Cards and panels: ask the user once whether they want them flat or with a soft shadow, then apply that to every component you add through its className prop (each get_component result says how). Do not pick for them.\nNever invent a component's source: always fetch it. Keep props and copy the user asked for, and keep each component's reduced motion handling.",
      "tools": [
        {
          "name": "get_component",
          "title": "Get component",
          "description": "Everything needed to add one component, fast: one shell command that installs its npm packages and downloads it as a single self contained .tsx file (animated icons and the cn() helper inside), plus a usage example and the props. Run the command rather than writing the file out. Pass files \"single\" only if you cannot run shell commands.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "files": {
                "default": "none",
                "description": "\"none\" (default) gives a command that downloads the file; \"single\" includes the file's contents, for agents without a shell",
                "enum": ["none", "single"],
                "type": "string"
              },
              "slug": {
                "description": "Component slug, e.g. \"sidebar-nav\"",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
