      "serverInfo": {
        "name": "calculatorlib-mcp",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CalculatorLib is a calculation source you can cite. It covers Asian payroll, tax and social-insurance numbers that change by year (cited to the article of law where a legal edition backs the calculator), about 8,000 general calculators, and unit conversion.\n\nFlow: search_calculators({query}) → run_calculator({name, args}) with the EXACT inputSchema field names inside args. get_calculator_schema only when you need every field. Units: convert_units({value, from, to}). Algebra/calculus: solve_math({problem}).\n\nRules\n- Never invent an input the user did not give. A missing required field is refused (isError, ERR_MISSING_INPUT) with the fields to ask for: ask the user. An optional field you omit takes the calculator page's default. Echo back the inputs you used.\n- Send plain numbers (1250000). \"1.250\" or \"10k\" fail with ERR_NUMBER_FORMAT; a unit a field does not take fails with ERR_UNIT.\n- On isError or a suspicious result (0, empty) do not present a number: fix the call or say it failed.\n- structuredContent.warnings says what a number leaves out (a tax layer not modeled, an estimate): always tell the user.\n- Tax and payroll change yearly: run the calculator, never compute from memory. Quote `edition`, `effective_from` and `sources[]` when present; pass policy_edition in args for another year. A result WITHOUT edition/sources has no cited legal basis.\n- Show the share link (structuredContent.url) as a Markdown link, and formula_latex as $$…$$ when present.",
      "tools": [
        {
          "name": "convert_units",
          "description": "Convert a value between units of one category (length, mass, temperature, area, volume, speed, data and 60 more). Names, symbols and common spellings work (\"m\", \"ft\", \"lbs\", \"°C\"). category is optional when the two units identify it; an unknown unit returns the category's unit list. Example: {\"value\":10,\"from\":\"Meter\",\"to\":\"Foot\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Unit category, e.g. length, mass, temperature, area, volume, speed. Optional when from/to belong to only one category; an unknown category returns the list of all 67.",
                "type": "string"
              },
              "from": {
                "description": "Source unit (name or symbol).",
                "type": "string"
              },
              "to": {
                "description": "Target unit (name or symbol).",
                "type": "string"
              },
              "value": {
                "description": "Numeric value to convert.",
                "type": "number"
              }
            },
            "required": ["from", "to", "value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "category": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "result": {
                "type": "number"
              },
              "to": {
                "type": "string"
              },
              "value": {
                "type": "number"
              }
            },
            "required": ["category", "from", "result", "to", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert units"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cba802caf89eede4291ee6d2864e3d72e16dfd42e576523bce5e935ef5dbf3b4"
        },
        {
          "name": "get_calculator_schema",
          "description": "Full input schema (field names, types, units, options) of one calculator. Optional: search_calculators already returns a compact schema per hit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Optional language for labels, titles and number formatting: en, es, vi, hi, ja, ko, tr, ar, ru, fr, zh, tw, pt, de (zh = Simplified, tw = Traditional Chinese; zh-CN / zh-TW / vi-VN style tags are accepted). Default: en.",
                "type": "string"
              },
              "name": {
                "description": "Tool name from search_calculators, e.g. bmi_calculator.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "description": {
                "type": "string"
              },
              "inputSchema": {
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["inputSchema", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get calculator schema"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab801de68a6ef09ed3b0a07268816269fdcbaafb6dd8f654c51d85a08c8676d4"
        },
        {
          "name": "run_calculator",
          "description": "Run a calculator and get the result. Pass the calculator's name (from search_calculators) and its input fields in args. Returns the computed values plus a share link to the calculator page with inputs pre-filled; calculators backed by a legal edition also return edition, effective_from and sources[] (document, article/clause, URL) to cite. Missing inputs are refused (isError), never defaulted. When the calculator has a formula, the result ALSO includes formula_latex — the formula with the user's values substituted; show it to the user (rendered as LaTeX when your client supports it, otherwise inline as text). Example: {\"name\":\"bmi_calculator\",\"args\":{\"unitSystem\":\"metric\",\"weight\":70,\"height\":175}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "args": {
                "additionalProperties": true,
                "description": "Input fields for the calculator (from the search result's inputSchema or get_calculator_schema).",
                "type": "object"
              },
              "lang": {
                "description": "Optional language for labels, titles and number formatting: en, es, vi, hi, ja, ko, tr, ar, ru, fr, zh, tw, pt, de (zh = Simplified, tw = Traditional Chinese; zh-CN / zh-TW / vi-VN style tags are accepted). Default: en.",
                "type": "string"
              },
              "name": {
                "description": "Tool name from search_calculators, e.g. compound_interest_calculator.",
                "type": "string"
              },
              "timezone": {
                "description": "Optional IANA time zone of the user (e.g. Asia/Seoul, America/New_York) or offset (+09:00): date calculators count \"today\" in it. Default: the time zone of the lang's country (en = America/New_York).",
                "type": "string"
              }
            },
            "required": ["args", "name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "data": {
                "description": "Secondary result cells.",
                "type": "array"
              },
              "data_status": {
                "type": "object"
              },
              "data_used": {
                "description": "Real-data figures used, with source and date.",
                "type": "array"
              },
              "edition": {
                "type": "string"
              },
              "effective_from": {
                "type": "string"
              },
              "formula_latex": {
                "description": "Formula with the caller's values unless formula_values is false.",
                "type": "string"
              },
              "formula_values": {
                "type": "boolean"
              },
              "layer_status": {
                "type": "array"
              },
              "main": {
                "description": "Headline cells {label, value, unit?}.",
                "type": "array"
              },
              "rendered_text": {
                "description": "Plain-text result when main and data are empty.",
                "type": "string"
              },
              "sources": {
                "description": "{title, section, cite, url}",
                "type": "array"
              },
              "url": {
                "description": "Share link: the calculator page with these inputs pre-filled.",
                "type": "string"
              },
              "warning": {
                "type": "string"
              },
              "warnings": {
                "type": "array"
              }
            },
            "required": ["data", "main"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cd6c38cdca59090596c225a7f0bb1948c8b26021c43c6922cc02685e08bbf26"
        },
        {
          "name": "search_calculators",
          "description": "Search CalculatorLib by keyword in any of its 12 languages — payroll, tax and social-insurance calculators for Asian markets (year-correct, legal editions cited where available) and about 8,000 general calculators. Returns the best matches (name, title, and a ready-to-use input schema) ranked by relevance and popularity. Call this FIRST, then call run_calculator with the chosen name. Example queries: \"Vietnam personal income tax\", \"lương gross sang net\", \"mortgage monthly payment\", \"body mass index\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Optional language to search in and to return titles and labels in: en, es, vi, hi, ja, ko, tr, ar, ru, fr, zh, tw, pt, de (zh = Simplified, tw = Traditional Chinese; zh-CN / zh-TW / vi-VN style tags are accepted). Default: auto-detected from the query, so titles may come back in the query's language (e.g. vi, es, fr, ja) rather than English; pass lang (e.g. \"en\") to fix the language.",
                "type": "string"
              },
              "limit": {
                "description": "Max results to return (default 8, max 25).",
                "type": "number"
              },
              "query": {
                "description": "Keywords describing the calculation you need.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "count": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "inputSchema": {
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search calculators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:73fa35df779b425bc2db45fbf8bb165b0d13dd64e5eb5574a916624a8d8afdc5"
        },
        {
          "name": "solve_math",
          "description": "Solve algebra, trigonometry or calculus step by step (equations, systems, derivatives, integrals, limits, simplify/factor). Answers are checked numerically; unverifiable problems are refused. Returns LaTeX + plain answer, steps, checks, page link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Step language, default en",
                "type": "string"
              },
              "problem": {
                "description": "LaTeX or text, ≤300 chars, e.g. x^2-5x+6=0",
                "type": "string"
              },
              "type": {
                "enum": ["auto", "equation", "derivative", "integral", "limit", "simplify", "trigonometry", "matrix", "polydiv"],
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer_latex": {
                "type": "string"
              },
              "answer_text": {
                "type": "string"
              },
              "steps": {
                "type": "array"
              },
              "verified": {
                "type": "boolean"
              }
            },
            "required": ["answer_latex", "steps", "verified"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Solve math"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6725f2589d12062148c8c0083415d329a5fd34641ec2e05a78a907cce8fe04ca"
        }
      ],
      "digest": "sha256:2bb519d300ef40607483e7a54604b5981b492e123b0a0542f9fd8298b6ec4f06"
    }
  }
