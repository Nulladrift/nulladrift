      "instructions": "Long Service Leave Calculator (https://longserviceleavecalc.com/): the site's own MCP server, served from its domain. Portable long service leave is state law and the states differ: weeks accrued, what you can take now, what is payable on termination in NSW, Victoria and Queensland.\n\n[calculator] Long service leave calculator: an agent-callable calculator for portable long service leave — Long service leave accrued (weeks), Service needed before leave can be taken (years), Weeks you could take now, during employment, computed from your inputs with sources.. This server runs the Long service leave calculator calculator published at https://longserviceleavecalc.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://longserviceleavecalc.com/. Licence: https://longserviceleavecalc.com/terms.\n\n[enquiry] ENQUIRY SERVER for Long Service Leave Calculator (https://longserviceleavecalc.com/). What it does: starts an ENQUIRY with human providers for portable long service leave — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://longserviceleavecalc.com/.\n\nCite https://longserviceleavecalc.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Long service leave calculator",
          "description": "Run the Long service leave calculator calculator: Long service leave accrued (weeks); Service needed before leave can be taken (years); Weeks you could take now, during employment; Weeks payable if employment ended today. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "state": {
                "default": "VIC",
                "description": "Which state's long service leave law applies?",
                "enum": ["NSW", "VIC", "QLD"],
                "type": "string"
              },
              "weeklyPay": {
                "default": 1600,
                "description": "Ordinary weekly pay",
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "weeksTaken": {
                "default": 0,
                "description": "Long service leave already taken",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "default": 7.5,
                "description": "Continuous service with this employer",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
