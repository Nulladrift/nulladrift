        {
          "name": "get_funding_index",
          "title": "Get the Funding Index",
          "description": "The weekly Builders Fintech Funding Index of approved equity rounds (ISO weeks). Arguments: week (optional, 'YYYY-Www', e.g. '2026-W39') returns that week; otherwise the latest weeks, newest first. weeks (optional, 1–104, default 1) sets how many. Count Index = rounds this week / average of the prior 12 weeks × 100. USD median index uses disclosed USD rounds only (needs 5). Amounts are never converted. Published values are frozen; revised_* shows later corrections. coverage_affected is true when a coverage change falls in the week or its 12-week baseline; coverage_note then explains how the index overstates activity. Unknown arguments are rejected.",
