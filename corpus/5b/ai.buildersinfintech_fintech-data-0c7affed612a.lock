        {
          "name": "find_providers",
          "title": "Find fintech providers by licence and capability",
          "description": "Find companies by product category, licence (licensed_in matches the home country or any passported country), licence type, authority, and agent access (has_sandbox, has_mcp, has_api), optionally min_agent_ready (1–5, the product's Agent-Ready score; available once those results are published). Returns each company with its approved products (with agent_access), LEI, licence summaries and self-reported certifications. Every licence carries source_url and last_checked_at so you can verify it on the regulator's register. From public registers as of the last-checked date. Always confirm on the regulator's register before relying on it. Use list_provider_filters for valid slugs. Ordered by company name, then slug. cursor is the next_cursor from a previous page. Unknown arguments are rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "authority": {
                "description": "Authority slug, e.g. 'bank-of-lithuania'.",
                "type": "string"
              },
              "category": {
                "description": "Product category slug.",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "has_api": {
                "description": "Only companies with a product that has an API (flag, docs or OpenAPI).",
                "type": "boolean"
              },
              "has_mcp": {
                "description": "Only companies with a product that has a public MCP server.",
                "type": "boolean"
              },
              "has_sandbox": {
                "description": "Only companies with a product that has a sandbox.",
                "type": "boolean"
              },
              "licence_type": {
                "description": "Licence type slug, e.g. 'e-money-institution'.",
                "type": "string"
              },
              "licensed_in": {
                "description": "Two-letter ISO country code; matches home or passported licences.",
                "type": "string"
              },
              "limit": {
                "description": "Max companies (≤50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_agent_ready": {
                "description": "Only companies with a product whose Agent-Ready score is at least this (1–5). Available once Agent-Ready results are published.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "q (or query): text matched against company and product names.",
                "type": "string"
              },
              "query": {
                "description": "Alias of q; q wins if both are sent.",
                "type": "string"
              }
