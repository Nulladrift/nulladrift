{
  "lockfileVersion": 2,
  "subjects": {
    "com.scanlabsai/scanner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scanlabsai.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "scanlabsai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ScanLabsAI security scanner. Use scan_website to assess a website, scan_agent to red-team another AI agent or MCP server (agent-to-agent scanning, OWASP LLM Top 10), compliance_report to generate a GDPR/WCAG/PCI compliance report (1 credit), get_fix_guidance to remediate findings, lookup_cves for vulnerability intelligence, check_credits for the balance, and buy_credits for a top-up link. The first scan of every website is free; further website scans, agent scans and compliance reports use AI credits from the account tied to the API key in this connection (create one at https://scanlabsai.com/mcp). Only scan targets you are authorised to test.",
      "tools": [
        {
          "name": "buy_credits",
          "description": "Get a secure Stripe checkout link to buy an AI credit pack for the signed-in account. Requires a ScanLabsAI API key in the MCP connection. Credits are added automatically once payment completes. Packs: starter (5), pro (15), agency (50).",
          "inputSchema": {
            "properties": {
              "pack": {
                "description": "Pack id: starter, pro, or agency. Defaults to pro.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24b512c09fff958eae57213758e4ff916b19d4daf4f54ff3c2790dcd4a1f6b64"
        },
        {
          "name": "check_credits",
          "description": "Check the signed-in account's AI credit balance. Requires a ScanLabsAI API key in the MCP connection (Authorization: Bearer slai_...). Create one at https://scanlabsai.com/mcp.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:99027e3fc89e6a48808f5661df5f53497049b30bbffead21d854262aec746fb4"
        },
        {
          "name": "compliance_report",
          "description": "Generate a website compliance report — the same automated assessment the ScanLabsAI agency portal runs — covering GDPR/CCPA privacy, WCAG 2.1 AA accessibility, PCI DSS 4.0 payment security and general standards. Returns an overall score, per-category scores and the failing/at-risk checks with recommendations, as Markdown. Requires a ScanLabsAI API key in the connection; costs 1 AI credit per report. Only run against sites you are authorised to assess.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The website URL to assess for compliance, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7c9cdd236969daf0abe5f77c173112e32e403300b19389bd7279aeed63794ecc"
        },
        {
          "name": "get_fix_guidance",
          "description": "Get detailed, step-by-step remediation guidance for a specific vulnerability or security issue (e.g. \"missing Content-Security-Policy header\", \"SQL injection\", a CVE id). Returns actionable fixes.",
          "inputSchema": {
            "properties": {
              "issue": {
                "description": "The vulnerability, finding title, or CVE id to fix.",
                "type": "string"
              }
            },
            "required": ["issue"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7777152b609d6e7e47c14fc6a67c5fdff9d1c5f0269191122185eccd4a42c88"
        },
        {
          "name": "get_pricing",
          "description": "Get ScanLabsAI pricing: the free-first-scan policy and AI credit packs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f8642cca75dbb08cad1693fa4df498dafe0bc426866eb21f84c6bd649e6f512"
        },
        {
          "name": "lookup_cves",
          "description": "Look up recent CVEs from the NIST NVD feed, optionally filtered by keyword. Returns id, severity, score and summary.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "Optional keyword, e.g. \"wordpress\" or \"openssl\".",
                "type": "string"
              },
              "limit": {
                "description": "Max results (1-25). Defaults to 10.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf59ecb3ed894bd4adaf966b98e0e752991dd023eccb4a3a808aa947aee2a26c"
        },
        {
          "name": "scan_agent",
          "description": "Red-team an AI agent for security weaknesses — prompt injection, system-prompt leakage, sensitive-data disclosure, unsafe output handling and excessive agency — mapped to the OWASP LLM Top 10, and return a Markdown report. This is agent-to-agent scanning: use it to assess another agent from here. Two target kinds are supported: kind=\"openai\" for an OpenAI-compatible chat-completions endpoint, or kind=\"mcp\" for an MCP server (its tool manifest is audited for tool-poisoning and over-broad capabilities). Requires a ScanLabsAI API key in the connection; each agent scan uses 5 AI credits. Probing is active and adversarial — only scan agents you own or are authorised to test.",
          "inputSchema": {
            "properties": {
              "apiKey": {
                "description": "Optional bearer token / API key the target agent requires. Sent to the target only; not stored.",
                "type": "string"
              },
              "deep": {
                "description": "Run deeper probes (jailbreak + resource-exhaustion). Defaults to false.",
                "type": "boolean"
              },
              "endpoint": {
                "description": "The agent endpoint URL (chat-completions URL, or MCP server URL).",
                "type": "string"
              },
              "kind": {
                "description": "Target type: \"openai\" for a chat-completions endpoint, \"mcp\" for an MCP server.",
                "enum": ["openai", "mcp"],
                "type": "string"
              },
              "model": {
                "description": "Model name for OpenAI-compatible endpoints, e.g. gpt-4o-mini.",
                "type": "string"
              }
            },
            "required": ["endpoint", "kind"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1ec58f2de35b4234f99c392f75a0f1fdb2ed89c9a5a2492e93a461d0895b98b"
        },
        {
          "name": "scan_website",
          "description": "Run a ScanLabsAI security scan against a website and return a full Markdown vulnerability report (grouped by severity, with descriptions and remediation) that you can analyse, act on, and the user can save as security-report.md. Checks OWASP Top 10, CVEs, SSL/TLS, security headers and DNS. Use deep=true for a comprehensive scan (40,000+ vectors, slower). Only scan sites the user is authorised to test.",
          "inputSchema": {
            "properties": {
              "deep": {
                "description": "Run a deep scan (comprehensive, slower). Defaults to false.",
                "type": "boolean"
              },
              "url": {
                "description": "The website URL to scan, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1520ba5d164bed8f86bed276a961e6557a94a839bda762d78d459ec572a9ea52"
        }
      ],
      "digest": "sha256:f6c9343ed03b21f6a57e25c592d8c771a5067f1718e60082233b076d4aa595ce"
    }
  }
