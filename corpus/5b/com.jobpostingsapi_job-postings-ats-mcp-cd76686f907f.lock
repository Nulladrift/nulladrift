      "instructions": "Query 19.8M+ active ATS & corporate career-site job postings across 434 sources (Greenhouse, Workday, Lever, Ashby, iCIMS, SmartRecruiters, etc.). Pass your JobPostings API key via x-api-key header, Authorization: Bearer <jp_key>, or ?apiKey=<jp_key> when calling tools/call. Claim 300 Free Credits ($0.30) on sign-up — No Card Required at https://jobpostingsapi.com/signup.",
      "tools": [
        {
          "name": "company_open_jobs",
          "description": "List all active job postings for a specific company slug or domain, with optional live ETag refresh from Greenhouse, Lever, or Ashby.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "Max jobs to return (1-100)",
                "type": "number"
              },
              "refresh": {
                "default": false,
                "description": "Set to true to trigger a live ETag check against the company ATS board",
                "type": "boolean"
              },
              "slug": {
                "description": "Company slug or domain (e.g. \"stripe\", \"anthropic\", \"openai.com\")",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "0 on success",
                "type": "integer"
              },
              "data": {
                "description": "Active job postings for the requested company",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "description": "Company match metadata, total count, and ETag refresh status",
                "type": "object"
              },
              "status": {
                "description": "ok or error",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Company Open Jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b70497bfd93f86aec08ff48228e32f8c7f65e3469f485231237358233b94dd94"
        },
