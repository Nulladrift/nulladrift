{
  "lockfileVersion": 2,
  "subjects": {
    "ai.agenticterminal/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.agenticterminal.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "at-directory",
        "version": "0.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_merchant",
          "description": "Get the full record for one merchant including all rails, payment endpoints, and OP attestation. Tier 2+ requires an AT credential.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f990a6a7b05dafb970b88f56de3001a30c9818436764c86767b769c6a32b9dd3"
        },
        {
          "name": "list_categories",
          "description": "List the category taxonomy with merchant counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8be47183e14d6b48aed947ce8b31c0e7e6ad6c392c5fc7a4975b08a14e4a1f4f"
        },
        {
          "name": "list_rails",
          "description": "List supported payment rails and their current merchant counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fe5cd4be7a1c6847249a53c76801e89012d6c5d773d3b794d29e4c7a1eaf372c"
        },
        {
          "name": "search_merchants",
          "description": "Search OP-verified merchants by rail, chain, category, agent-callable tier, trust tier, and free text. Ranked by trust tier then verification recency.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accepts_usdc": {
                "type": "boolean"
              },
              "agent_callable_tier": {
                "enum": ["full-api", "structured-handoff", "human-checkout"],
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "chain": {
                "enum": ["tron", "ethereum", "solana", "bsc", "polygon", "arbitrum", "base"],
                "type": "string"
              },
              "limit": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "rail": {
                "enum": ["lightning", "bolt12", "l402", "usdt"],
                "type": "string"
              },
              "trust_tier_min": {
                "enum": [1, 2, 3],
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e60060c952769c0e51989b547f9873dea0fd929b976797d66e615e7c3b469238"
        },
        {
          "name": "verify_payment_endpoint",
          "description": "Run a live check against a merchant's declared payment endpoint for a rail. Returns health, detail, and rail-specific evidence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "merchant_id": {
                "minLength": 1,
                "type": "string"
              },
              "rail": {
                "enum": ["lightning", "bolt12", "l402", "usdt"],
                "type": "string"
              }
            },
            "required": ["merchant_id", "rail"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a2ffa08d467f42fe6b996b4ae345c465799b5cc6c9f79af1bf4e9cfff8ba8416"
        },
        {
          "name": "whoami",
          "description": "Report the resolved credential state and rate limits for the calling agent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a905c66edce312ae55950b87847c150c9afdf6116972a14876f9c171894c2787"
        }
      ],
      "digest": "sha256:a4fbee8238f8176fa72d0802c7a5bd7184497e678024db2e53c8882433cf7abb"
    }
  }
}
