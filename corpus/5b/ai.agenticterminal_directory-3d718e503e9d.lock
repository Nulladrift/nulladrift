{
  "lockfileVersion": 2,
  "subjects": {
    "ai.agenticterminal/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.agenticterminal.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "at-directory",
        "version": "0.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_merchant",
          "description": "Get the full record for one merchant including all rails, payment endpoints, and OP attestation. Tier 2+ requires an AT credential.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bccd9dd41b6c11dc116fe747dbcf6bb06c42b8ca56b88cba804be8cdecd5f5ca"
        },
        {
          "name": "list_categories",
          "description": "List the category taxonomy with merchant counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b33ce510d9853352e06552bbe204d31a007224b79ef9be98f0bd373a218792bc"
        },
        {
          "name": "list_rails",
          "description": "List supported payment rails and their current merchant counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:591236ad87605275cfb3bf7528fef80fa09aafcc08c3938d4a6e1fb3af2b2465"
        },
        {
          "name": "search_merchants",
          "description": "Search OP-verified merchants by rail, chain, category, agent-callable tier, trust tier, and free text. Ranked by trust tier then verification recency.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accepts_usdc": {
                "type": "boolean"
              },
              "agent_callable_tier": {
                "enum": ["full-api", "structured-handoff", "human-checkout"],
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "chain": {
                "enum": ["tron", "ethereum", "solana", "bsc", "polygon", "arbitrum", "base"],
                "type": "string"
              },
              "limit": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "rail": {
                "enum": ["lightning", "bolt12", "l402", "usdt"],
                "type": "string"
              },
              "trust_tier_min": {
                "enum": [1, 2, 3],
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:354d1574072531346c242fa1362e7d7bac6ad371ac1684bb6ae2e94047b1d7ca"
        },
        {
          "name": "verify_payment_endpoint",
          "description": "Run a live check against a merchant's declared payment endpoint for a rail. Returns health, detail, and rail-specific evidence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "merchant_id": {
                "minLength": 1,
                "type": "string"
              },
              "rail": {
                "enum": ["lightning", "bolt12", "l402", "usdt"],
                "type": "string"
              }
            },
            "required": ["merchant_id", "rail"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cbe63e2fc1a3029faea0c60a0b5de0c34941d99cc1a342f8002b59959dfa1fd5"
        },
        {
          "name": "whoami",
          "description": "Report the resolved credential state and rate limits for the calling agent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:45b55e7b21e20a30f63daa9c3fd8cb70ff76f9fe03ffbc2d7abc73205bfdd377"
        }
      ],
      "digest": "sha256:d53bbb73d7d908c3ec14835079027a1f683e48f0aa7c7d6c95f9e67c9f97c4be"
    }
  }
}
