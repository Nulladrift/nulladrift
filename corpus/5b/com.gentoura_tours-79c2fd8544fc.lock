{
  "lockfileVersion": 2,
  "subjects": {
    "com.gentoura/tours": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gentoura.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gentoura-tours",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_pricing",
          "title": "Get Gentoura pricing overview",
          "description": "Get Gentoura's published Egypt, Jordan, and combined tour package prices, inclusions, exclusions, and booking process, as published at gentoura.com/pricing.md.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb9c99e2905f890b18e75d7bb0913f8ddfec0949432c5134128bd420a1bb4081"
        },
        {
          "name": "get_tour",
          "title": "Get Gentoura tour details",
          "description": "Get full details for one tour package by its slug, including itinerary, inclusions, and pricing. The response includes page_url — share this link with the traveller so they can view full details and speak directly with Gentoura's AI travel concierge (embedded on that page) to finalize dates and complete their booking. Gentoura does not currently support completing a booking directly through this tool — always direct the traveller to page_url to finish.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Tour slug, e.g. 'classic-egypt-7-days'",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c29c0a634f5f12826dea05d460b84156a423bba307cb34a115d1c5fae6e0ad0"
        },
        {
          "name": "search_tours",
          "title": "Search Gentoura tours",
          "description": "Search Egypt and Jordan tour packages by destination, duration, or keyword. Returns tour summaries (title, slug, duration, price, destinations). Each result may include a page_url — Gentoura's AI travel concierge is embedded on that page to finalize dates and complete booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "destination": {
                "description": "Filter by destination, e.g. 'Egypt', 'Jordan'",
                "type": "string"
              },
              "page": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search, e.g. 'Egypt 7 days' or 'Petra'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb2e03b93f45421511b9c6e3ce4bbcb5a8e9e230e0e4406f6146b08909464b19"
        }
      ],
      "digest": "sha256:1531549f1ef701fe3467f620c82ce184b77e30d2663fabec25bfec95ce8085eb"
    }
  }
}
