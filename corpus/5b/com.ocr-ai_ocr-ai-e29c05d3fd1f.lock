{
  "lockfileVersion": 2,
  "subjects": {
    "com.ocr-ai/ocr-ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ocr-ai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ocr-ai",
        "title": "OCR-AI",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OCR-AI reads documents (PDF, JPEG, PNG, WebP; Hebrew and English) into text, fields and tables. Use read_document for a file; each page read costs one page from the API key's account, and failed pages are not charged. When pages run out, use buy_pages and give the link to your user. An account's first API key comes with 100 free pages, once.",
      "tools": [
        {
          "name": "buy_pages",
          "title": "Get a link to add pages",
          "description": "Return a Stripe Checkout link for a page pack. Give the link to your user: they pay in their browser, and the pages are added to this key's account as soon as the payment completes. This tool never charges anything by itself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Default: USD.",
                "enum": ["USD", "ILS"],
                "type": "string"
              },
              "pack": {
                "description": "p100: 100 pages ($9 / ₪29); p500: 500 pages ($29 / ₪99); p2000: 2000 pages ($89 / ₪299)",
                "enum": ["p100", "p500", "p2000"],
                "type": "string"
              }
            },
            "required": ["pack"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a link to add pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5cf3d9e7294c49721992060e8c178eca72577c9d72ca4a30d844355189c403b2"
        },
        {
          "name": "check_balance",
          "title": "Pages left",
          "description": "How many pages the API key's account can still read, and a link where the user can add pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pages left"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b75c1f34bd589bac3a7ac0bd8a3e3da6e980544a27b878ebfa1105f572daa12e"
        },
        {
          "name": "read_document",
          "title": "Read a document",
          "description": "Read a PDF or an image (JPEG, PNG, WebP) and return its text, its key fields (vendor, dates, totals, VAT, ids…) and its tables, page by page. Built for Hebrew and English documents, including mixed right-to-left lines. Costs one page from the key's account per page read; a page that fails is not charged. Up to 20 pages per call: read longer PDFs in ranges with \"pages\". A call of many pages can take more than a minute. Pages your client stops waiting for may still be charged, so if a call times out, read smaller ranges, for example 5 pages per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file_base64": {
                "description": "The document's bytes, base64-encoded. Use this or file_url.",
                "type": "string"
              },
              "file_url": {
                "description": "A public https URL of the document. Use this or file_base64.",
                "type": "string"
              },
              "hint": {
                "description": "What the document is, if known. Default: auto.",
                "enum": ["auto", "invoice", "receipt", "card", "table", "text"],
                "type": "string"
              },
              "language": {
                "description": "Language of the field labels and summary in the result. Default: en.",
                "enum": ["en", "he"],
                "type": "string"
              },
              "pages": {
                "description": "PDF pages to read, for example \"1-5,8\". Default: from page 1, up to the per-call limit.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Read a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a19de6bd6677168273397428a8cd39669821e71cff1e02d6734d9c5f2437426"
        }
      ],
      "digest": "sha256:d6d34d3bcef49854aa70b4def9f3bfc560091a1869f844f84b0a87feebf75c54"
    }
  }
}
