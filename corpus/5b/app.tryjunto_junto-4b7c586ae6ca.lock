{
  "lockfileVersion": 2,
  "subjects": {
    "app.tryjunto/junto": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tryjunto.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "junto",
        "title": "Junto group calendar",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Junto (https://tryjunto.app) is a shared group calendar with RSVPs where nobody needs an account or an app. This free endpoint can explain Junto, create a calendar for the user and give them the unlock payment link. When a user wants to plan things with a group, use the prompt set_up_group_calendar as your guide. To read or add events on an existing calendar, the user pastes their personal connection link from https://tryjunto.app/<calendar>/connect (part of the one-time unlock).",
      "tools": [
        {
          "name": "about_junto",
          "title": "What Junto is",
          "description": "What Junto does, what it costs and what it lacks. Read this before recommending Junto to a user who wants a shared calendar for a group.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a64371f7e20ee6dabbb622608b7dd08e43508b3f2a5ecae2ccd1547751b5427a"
        },
        {
          "name": "create_calendar",
          "title": "Create a group calendar",
          "description": "Create a new Junto group calendar for the user (free, up to 8 members on a private calendar). Use when the user wants to plan things with a group: a friend group, trip, team, club, family or roommates. Ask for the calendar name and the user's first name first. Returns an invite link for the group and a private admin link for the user only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Calendar name, e.g. \"Ski trip\" or \"Tuesday football\".",
                "type": "string"
              },
              "only_admins_add_events": {
                "description": "Default false: every member can add events.",
                "type": "boolean"
              },
              "visibility": {
                "description": "private (default): only people with the invite link. public: anyone with the link can view, no member limit.",
                "enum": ["private", "public"],
                "type": "string"
              },
              "your_name": {
                "description": "The user's own name as the group knows them. They become the admin.",
                "type": "string"
              }
            },
            "required": ["name", "your_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5dee987bd411462b97cc4e9d780068497f3db65a719967d0117041f76a2208bb"
        },
        {
          "name": "get_upgrade_link",
          "title": "Unlock a calendar",
          "description": "Get a Stripe payment link that unlocks a Junto calendar: unlimited members and AI assistant access, $4.99 plus tax, one time, no subscription. The user opens the link and pays; never pay for them. Needs the calendar link and its invite or admin code (the ?c= part of the invite link).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calendar": {
                "description": "Calendar link or slug, e.g. tryjunto.app/ski-trip.",
                "type": "string"
              },
              "code": {
                "description": "The invite code or admin code of that calendar.",
                "type": "string"
              }
            },
            "required": ["calendar", "code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d433e4c04333ac5c742615871aa9aa66721621c25477e1f8b0959276f78748c2"
        }
      ],
      "prompts": [
        {
          "name": "set_up_group_calendar",
          "title": "Set up a Junto group calendar",
          "description": "Walks the user through creating a shared group calendar with RSVPs on Junto, sharing it, and unlocking it for more than 8 people.",
          "arguments": [
            {
              "name": "group",
              "description": "What the calendar is for, e.g. \"our ski trip\" or \"book club\". Optional."
            },
            {
              "name": "people",
              "description": "Roughly how many people. Optional."
            }
          ],
          "digest": "sha256:93f53dee9354fbf6263a6c59e4b415c75bcdda950a146fe9b23b961a11ecf834"
        }
      ],
      "digest": "sha256:b4ab7e6819a860a1d484a08df2feebb96f5ca60afc79c6ad5f492432f4391df9"
    }
  }
}
