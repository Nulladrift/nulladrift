{
  "lockfileVersion": 2,
  "subjects": {
    "com.creatordeskai/machine-products": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.creatordeskai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Creator Desk Agent Supervisor",
        "version": "creator-desk-agent-supervisor/0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "creator_desk_agent_preflight",
          "description": "Use when you have a public HTTPS agent origin and need an A2A and x402 readiness verdict with surface checks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "origin": {
                "description": "Public HTTPS origin for the agent/service. Private/local destinations and non-443 ports are rejected.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee75d0329ba0d565959698c3db371f0565dc262590c59d9083dc5ad2b3bff2aa"
        },
        {
          "name": "creator_desk_check_broken_links",
          "description": "Use when you have up to 20 public HTTPS URLs and need per-link status, redirects, latency, and broken-link results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "urls": {
                "description": "1-20 public HTTPS URLs to check. Private/local targets and non-443 ports are rejected.",
                "items": {
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ccd005ed976f85d8a519930a13d3387ac53502822e0290747a7bea0fc9585966"
        },
        {
          "name": "creator_desk_extract_page",
          "description": "Use when you have a public HTTPS HTML page URL and need clean Markdown and page metadata.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public HTTPS HTML page to read. Private/local destinations, embedded credentials and non-443 ports are rejected.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:49762fd857771bc27e2a2727edd64d6cd4bda0899d0bebe447689653d56d94ce"
        },
        {
          "name": "creator_desk_inspect_url",
          "description": "Use when you have a public HTTPS URL and need its HTTP status, redirects, latency, security headers, and page metadata.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public HTTPS URL to inspect. Local/private destinations and non-443 ports are rejected.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ddadee6ce1d0083cb19dff5300ed16d332bd19a0f0cf9273775808e7eb8fe817"
        },
        {
          "name": "creator_desk_lookup_dns",
          "description": "Use when you have a public DNS hostname and optional record type and need the matching DNS records and lookup status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "description": "Public DNS hostname. IP literals, single-label names and local/reserved suffixes are rejected.",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "default": "A",
                "enum": ["A", "AAAA", "MX", "TXT", "NS", "CNAME", "CAA", "SOA"],
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:570e38d8566382b3993659540b3063ea3bef603756e487268e3adf0a4a4a07f0"
        },
        {
          "name": "creator_desk_machine_acquisition_offers",
          "description": "Use when you need Creator Desk Machine Acquisition Network pricing, its service page and available checkout or x402 links.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8952191aa9e51fc406f16ba6707d08f18de01668a2dad43f84839a535bb48328"
        },
        {
          "name": "creator_desk_machine_distribution_offers",
          "description": "Use when you need Creator Desk Machine Distribution pricing, its service page and available checkout or x402 links.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a42ab90a85cc13a3f2306a64e22dd79cae520d866c57ea38bbc13f4e305d283"
        },
        {
          "name": "creator_desk_machine_router_offers",
          "description": "Use when you need Creator Desk Machine Marketplace Router pricing, its service page and available checkout or x402 links.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be03b293af93d038793ed98c4abeae0bd248f9caaf5c2b40c40d7db1e8f4774c"
        },
        {
          "name": "creator_desk_verify_completion",
          "description": "Use when you have a storefront URL and supplied evidence and need a readiness verdict, defects, corrective actions, and an evidence receipt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "evidence": {
                "additionalProperties": false,
                "properties": {
                  "cart": {
                    "additionalProperties": false,
                    "properties": {
                      "available": {
                        "type": "boolean"
                      },
                      "url": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "checkout": {
                    "additionalProperties": false,
                    "properties": {
                      "available": {
                        "type": "boolean"
                      },
                      "url": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "contact_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "privacy_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "product": {
                    "additionalProperties": false,
                    "properties": {
                      "inventory": {
                        "oneOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "number"
                          }
                        ]
                      },
                      "price": {
                        "additionalProperties": false,
                        "properties": {
                          "amount": {
                            "minimum": 0,
                            "type": "number"
                          },
                          "currency": {
                            "pattern": "^[A-Za-z]{3}$",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "title": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "returns_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "shipping_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "terms_url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "objective": {
                "maxLength": 2000,
                "type": "string"
              },
              "standard_id": {
                "const": "CDS-COMMERCE-001",
                "type": "string"
              },
              "standard_version": {
                "const": "0.2.0",
                "type": "string"
              },
              "target_url": {
                "description": "Public HTTPS commerce/storefront URL being verified.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["evidence", "target_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d5271b13cba2c27bccff6105a738ee0524f00fd13155e1209669d5c5f68ab983"
        },
        {
          "name": "creator_desk_word_count",
          "description": "Use when you have optional plain text and need its word count or a deterministic payment canary result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "maxLength": 10000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97446c588f61272f6a6d633dcc576256f1726bb7895cb51d2027007be19d825b"
        }
      ],
      "digest": "sha256:bca7586384ed2f436f9de8cab0ffcde2b56a7c3a60257dd8265122c431421a69"
    }
  }
}
