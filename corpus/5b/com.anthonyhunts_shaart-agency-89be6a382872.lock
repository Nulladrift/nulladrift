    "com.anthonyhunts/shaart-agency": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.anthonyhunts.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "shaart-agency",
        "title": "Anthony Hunt · SHAART Agency",
        "version": "1.0.0",
        "websiteUrl": "https://www.anthonyhunts.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for Anthony Hunt · SHAART Agency, a GoHighLevel, AI automation and digital marketing service in Puerto Rico, Texas and the US. Use get_pricing before quoting any price and never quote a price it does not list; custom projects are quoted after a free call. Use list_services to match the user's need to a service. Booking and payment are done by the user: give them the booking link from get_contact_options.",
      "tools": [
        {
          "name": "get_contact_options",
          "title": "Get contact options",
          "description": "Email, phone, WhatsApp and the booking link for a free 15-minute diagnostic call. Omit channel to get all.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Return only this contact channel",
                "enum": ["email", "phone", "whatsapp", "booking"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get contact options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bdff98ce2dba2f2b60e8985a3c6e0f6619602d14850d020a086a70a1305e47d4"
        },
        {
          "name": "get_pricing",
          "title": "Get pricing",
          "description": "Public plans and add-ons with prices in USD (one-time and monthly), what each includes and excludes, and the page to buy it. Omit plan_id to get everything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan_id": {
                "description": "Return only this plan or add-on",
                "enum": ["consultoria", "consultoria-avanzada", "digitalizate-basico", "addon-whatsapp", "addon-gbp", "addon-ads"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b312f00ab046a3d3733df48e16c8cafe60f7397b204fe4de92860bd8e68918e2"
        },
        {
          "name": "list_posts",
          "title": "List blog posts",
          "description": "Published blog posts about GoHighLevel, AI automation and marketing, newest first. Paginate with next_cursor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page",
                "type": "string"
              },
              "lang": {
                "default": "es",
                "description": "Language",
                "enum": ["es", "en"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Page size",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List blog posts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:722f6561abed6e92645e013e3a9803cb60110282edc1c693acdcafa09d6e566a"
        },
        {
          "name": "list_services",
          "title": "List services",
          "description": "Services this business provides, each with a description and the URL of its page. Omit tag to get all.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tag": {
                "description": "Return only services with this tag",
                "enum": ["ai-agents", "ai-training", "austin", "automation", "booking", "chatbot", "chatgpt", "claude", "contact", "crm", "funnels", "gohighlevel", "landing-page", "lead-follow-up", "meta-ads", "puerto-rico", "seo", "texas", "tracking", "voice-ai", "website", "whatsapp"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8dccd34778db34e5b2f94a355ffbe6f12ec0051905c6a1e6b4c47c628b6ff0f"
        }
      ],
      "digest": "sha256:91d81dcd525f2377c544eebedc893689fdff13f1ea0127eb8cccd12f3e12cfd6"
    }
  }
