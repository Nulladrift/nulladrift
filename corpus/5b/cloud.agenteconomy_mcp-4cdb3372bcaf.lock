{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.agenteconomy/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.agenteconomy.cloud/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agenteconomy-mcp",
        "title": "agenteconomy.cloud — trust hub for the agent economy",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "agenteconomy.cloud trust hub — verified-revenue evidence for the agent economy, over MCP. Tools & prices (mcp-pricing-v1.1): discover free (rate-limited 10/min burst, 120/hour per IP); verify $0.10/call; check $0.25/call; diagnose $1/call; register $5/30 days (start/renew paid; challenge_response, status and update_spec free). SPEND-CAP WARNING: register's $5 (5000000 micro-USDC) is above the $1 default per-call cap many x402 clients ship — raise your client cap before calling register. In this deployment these tools are live: discover, verify, check, diagnose, register. Paid tools use x402 (scheme 'exact'): an unpaid call returns an isError result containing {\"x402/error\":{code:402,data:{accepts:[…]}}}; retry the same call with the signed payment at _meta[\"x402/payment\"]; the settlement receipt returns at _meta[\"x402/payment-response\"]. Verdicts are Ed25519-signed over RFC 8785 canonical JSON; public keys: https://agenteconomy.cloud/data/keys/verdict-signing.json. Referral-only guarantee: discover returns the seller's own endpoint and payment details and that is the whole hand-off — we never route funds, proxy calls, or hold custody; no code path here executes a buyer→seller payment. HTTP mirror of the same operations: https://mcp.agenteconomy.cloud/api/v1/{discover,verify,check,diagnose,register} (x402 v2 headers).",
      "tools": [
        {
          "name": "check",
          "description": "PAID $0.25/call (x402, mcp-pricing-v1.1). Level-1 payment-flow conformance against a live x402 endpoint: quote (402 + parseable v2 PAYMENT-REQUIRED), requirements (accepts[] validity; payTo vs catalog/registration/expected_payto is a named finding), then a REAL probe purchase from our own wallet when an 'exact' entry on our rail advertises ≤ $0.05, and delivery-of-something. Above the cap or upto-only: depth 'quote_only' with the cap disclosed in gates. One signed payment_flow_conformance verdict out (verdict-v1.1.0).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "https:// resource URL whose x402 payment machinery to test",
                "maxLength": 500,
                "type": "string"
              },
              "expected_payto": {
                "description": "optional 0x… address you expect the endpoint to charge to; mismatch is a named finding",
                "type": "string"
              },
              "listing_id": {
                "description": "optional catalog listing id — compares the advertised payTo against the cataloged seller",
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b16b1330090a0c3b9f52fea92f489b3cdcf658ab50a6f8d3378e836f1fec81b5"
        },
        {
          "name": "diagnose",
          "description": "PAID $1.00/call (x402, mcp-pricing-v1.1). Seller-side funnel diagnosis for one x402 endpoint, as data: findability (catalog presence, listing age, description quality, capability-v1 category), conformance (check's real flow — quote, requirements, a REAL probe purchase when an 'exact' entry on our rail advertises ≤ $0.05, settle, deliver), category demand (verified earners, seller-deduped 30d revenue, median on-chain payment vs your price basis) and competition — then ONE primary blocker under a frozen disclosed precedence. One signed seller_diagnostic verdict out (verdict-v1.1.0).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asserted_price_micro": {
                "description": "your advertised price in micro-USDC — becomes the price basis vs the category median; defaults to the live quote's cheapest recognized entry",
                "minimum": 1,
                "type": "integer"
              },
              "endpoint": {
                "description": "https:// resource URL of the x402 endpoint to diagnose (pre-catalog endpoints welcome — findability reports honestly)",
                "maxLength": 500,
                "type": "string"
              },
              "expected_payto": {
                "description": "optional 0x… address you expect the endpoint to charge to; mismatch is a named finding",
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e647a08cfc90f42b829afb51cd064968a1e923403bbfc7ae5c863daf734dcf33"
        },
        {
          "name": "discover",
          "description": "FREE (rate-limited: 10/min burst, 120/hour per IP). Text of what you need in → sellers out with chain evidence (tier, verified revenue windows, real-buyer counts, on-chain-observed median price), the seller’s endpoint and payment details, their description and capability category (seller-asserted/auto-assigned claims, source-labeled), and their registered spec where one exists. Referral-only: you contract and pay the seller directly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "what the buying agent needs",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "network": {
                "description": "CAIP-2 filter, e.g. eip155:8453; default all",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87dc6fe79b6175c01d57f3dd7befc1a23808845e85dff91f20c336ac48203add"
        },
        {
          "name": "register",
          "description": "Supply-side registration: $5 / 30 days (x402, mcp-pricing-v1.1) for actions start and renew; actions challenge_response, status and update_spec are free. You pay to be EXAMINED (EIP-191 ownership challenge + endpoint 402-conformance + registration-v1.0.0 schema validation) and can pay and fail — the fee buys the examination, never the outcome. Presence in discover is never gated by registration, and tier/rank/verdicts never move with it: registration adds claims-labeled data. SPEND-CAP WARNING: $5 = 5000000 micro-USDC is above the $1 default per-call cap many x402 clients ship — raise your client cap for start/renew or it will refuse to sign. Flow: start (submit spec, pay, receive a 72h challenge) → challenge_response (submit the payTo key’s EIP-191 signature; the audit runs) → registered while paid_through holds. renew re-audits and extends 30 days; renewal grace 7 days after paid_through — the mark itself drops at paid_through exactly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "start and renew are paid ($5/30 days); challenge_response, status and update_spec are free",
                "enum": ["start", "challenge_response", "status", "update_spec", "renew"]
              },
              "challenge_id": {
                "description": "challenge_response: optional; defaults to the latest issued challenge",
                "type": "string"
              },
              "registration_id": {
                "description": "from start (all actions after start)",
                "type": "string"
              },
              "seller": {
                "description": "0x… payTo address — alternative lookup where registration_id is not at hand",
                "type": "string"
              },
              "signature": {
                "description": "challenge_response: EIP-191 personal_sign of the exact challenge_text by the payTo key — 0x + 130 hex (r||s||v). update_spec: same signer over the spec-update text (see signed_at)",
                "type": "string"
              },
              "signed_at": {
                "description": "update_spec: ISO 8601 timestamp inside the signed text, within 15 minutes of server time — text: \"agenteconomy.cloud spec update v1\\nregistration_id: <id>\\nspec_hash: <sha256 hex of the JCS-canonical new spec>\\nsigned_at: <this value>\"",
                "type": "string"
              },
              "spec": {
                "description": "registration-v1.0.0 Q1/Q2 document (start, update_spec) — schema: https://agenteconomy.cloud/schemas/registration-v1.0.0.json",
                "type": "object"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26ee950666e002d83d28f434f7c10353bf8fcfb0607cfd89ae04c6c7fc2a9282"
        },
        {
          "name": "verify",
          "description": "PAID $0.10/call (x402, mcp-pricing-v1.1). Seller address or slug in → one signed seller_trust verdict out: the frozen score-v1.0.0 predicate re-evaluated at issuance, the chain evidence it rests on, exclusions applied, and full provenance — recomputable by anyone. Ed25519-signed over RFC 8785 canonical JSON.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "seller": {
                "description": "0x… payTo address or 12-hex slug — exactly one seller per call",
                "type": "string"
              }
            },
            "required": ["seller"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c23e08c505fe3171ac01be2e0b97f745223b398a5ef45b870f99fd274f50d527"
        }
      ],
      "digest": "sha256:263a565c150acc10ca5c33537f61ba0e1b39187b47f76673ef396367a1fc0a8d"
    }
  }
}
