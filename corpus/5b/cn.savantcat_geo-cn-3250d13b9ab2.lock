      "instructions": "中文 AI 可引用性（GEO/AEO）工具包：审计网站能否被 AI 搜索抓取、读懂、引用，探测问题在中文信源池中的占位，并按五大指标 + 语义角色分权输出可自验的测量报告。评分是确定性的（scoring_version 随结果返回），不做 LLM 判定。每次输出都带 _provenance 溯源块（品牌/出处/指纹/授权要求）。",
      "tools": [
        {
          "name": "audit_cn_citability",
          "description": "审计一个网站/页面能否被中文 AI 搜索（豆包、DeepSeek、文心、Kimi 等）抓取、解析与引用。\n\n    一次抓取完成六层检查：可抓取（含中国爬虫矩阵与边缘层拦截实测）、可解析、可引用、\n    实体一致、分发、可信可自验；返回 0-100 分与 A-F 等级、逐项证据、优先修复清单。\n    用途场景：客户站点体检、上线前自检；传 compare_with 可做竞品对比（逐层与逐项差异）。\n    注意：只做确定性检查，不调用大模型；评分口径见 scoring_version。\n    ",
          "inputSchema": {
            "properties": {
              "compare_with": {
                "default": "",
                "title": "Compare With",
                "type": "string"
              },
              "include_raw": {
                "default": false,
                "title": "Include Raw",
                "type": "boolean"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "audit_cn_citabilityArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "audit_cn_citabilityOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e3c67b9472944e7675bc0d5673217b9f49b83772211cd0db4682acf614a48c90"
        },
        {
          "name": "diff_observations",
          "description": "对比某 identity 的**最近两次观测**，判定提升/退化/中性（带阈值与样本门槛说明）。\n\n    判定门槛：相对变化 >= 20% **且** 绝对变化 >= 0.05 才算\"显著\"（severity: rise / sharp_drop）。\n    样本 n < 20 一律返回 severity=low_n，**不给出升降结论**——这是防误报的硬门。\n\n    Args:\n        identity: 品牌名或域名\n        kind: 观测类型，留空取全部\n        series: 题集/口径标识，留空取全部\n    ",
          "inputSchema": {
            "properties": {
              "identity": {
                "title": "Identity",
                "type": "string"
              },
              "kind": {
                "default": "",
                "title": "Kind",
                "type": "string"
              },
              "series": {
                "default": "",
                "title": "Series",
                "type": "string"
              }
            },
            "required": ["identity"],
            "title": "diff_observationsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "diff_observationsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8d4455b09941da3fb5b340d5fdf6dd57f31d956bf926c1638719345bd1e9c58b"
        },
        {
          "name": "list_signals",
          "description": "列出**已检测到的变化信号**（visibility 提升/退化等），带生命周期（first_seen / resolved_at）。\n\n    Args:\n        status: open（未解决，默认）/ resolved（已解决）/ all\n        limit: 最多返回条数\n    ",
          "inputSchema": {
            "properties": {
