      "serverInfo": {
        "name": "savantcat-geo-cn",
        "title": "合尘猫 · 中文 AI 可引用性 GEO/AEO 体检",
        "version": "1.1.0",
        "description": "审计网站能否被 AI 搜索抓取、读懂、引用；五大指标 + 语义角色分权输出可自验的测量报告。",
