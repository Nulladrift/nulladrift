          },
          "digest": "sha256:421f0bd2a33075c501d1d8b39c6e84557c323a8b89473d6dfcb49c8c6cba2887"
        },
        {
          "name": "plan_fixes",
          "description": "按缺口生成优先修复计划（可直接交给客户或工程执行）。\n\n    两种用法：① 传 fail_ids（逗号分隔的自查项编号，如 \"L1-3,L2-4\"）；② 传 url，工具先审计再出计划。\n    返回：按权重排序的修复项、每项「为什么」「怎么补」「验收方式」。\n    ",
          "inputSchema": {
            "properties": {
              "fail_ids": {
                "default": "",
                "title": "Fail Ids",
                "type": "string"
              },
              "top": {
                "default": 8,
                "title": "Top",
                "type": "integer"
              },
              "url": {
                "default": "",
                "title": "Url",
                "type": "string"
              }
            },
            "title": "plan_fixesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "plan_fixesOutput",
            "type": "object"
          },
