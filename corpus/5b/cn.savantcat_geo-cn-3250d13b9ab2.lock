        },
        {
          "name": "probe_source_pool",
          "description": "探测一个中文问题在信源池里的实际占位分布，并判断你的品牌/域名是否在池子里。\n\n    原理：AI 答案只能引用「已进入检索池」的来源。若目标问题下主流信源被平台型站点\n    （知乎/公众号转载站/百家号/CSDN 等）占满而你不在其中，再好的站内优化也不会被引用。\n    返回：结果域名分布、平台归类、是否命中你的品牌/域名、同题竞品域名清单、建议动作。\n    参数：question 用户真实会问的问题原话；brand 品牌词（如「合尘猫」）；domain 你的域名（如 savantcat.cn）。\n    ",
          "inputSchema": {
            "properties": {
              "brand": {
                "default": "",
                "title": "Brand",
                "type": "string"
              },
              "domain": {
                "default": "",
                "title": "Domain",
                "type": "string"
              },
              "question": {
                "title": "Question",
                "type": "string"
              }
            },
            "required": ["question"],
            "title": "probe_source_poolArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "probe_source_poolOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3dece534456a01021b7159e7ddbb203f1df30739f4c134ddfcd1db45e54db468"
        },
        {
          "name": "query_history",
          "description": "查某个品牌/域名在**历史观测**中的时序（多次采样的轨迹）。\n\n    数据来自本工作室按周期采样的记录（写入走 CLI，服务本身只读）。\n    **只在同一 series（同一题集/同一口径）内纵向比较**，不同 series 的值不可直接比大小。\n\n    Args:\n        identity: 品牌名或域名，如 \"合尘猫\" / \"savantcat.cn\"\n        kind: 观测类型，留空取全部。常用：mention_rate(提及率) / citation_rate(引用率) /\n              visibility_score(可见度分) / rank(排名) / robots_policy / llms_txt\n        series: 题集/口径标识，留空取全部\n        limit: 每条 series 最多返回的最新点数\n    ",
          "inputSchema": {
            "properties": {
              "identity": {
                "title": "Identity",
                "type": "string"
              },
              "kind": {
                "default": "",
                "title": "Kind",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "series": {
                "default": "",
                "title": "Series",
                "type": "string"
              }
            },
            "required": ["identity"],
            "title": "query_historyArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "query_historyOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:47a22ece9ff138d9eaaa4b8ba3fbfa8915f367d6530233d8620cc0dd84223c0d"
        },
        {
          "name": "score_visibility",
          "description": "按五大核心指标 + 语义角色分权，计算 AI 搜索可见度并输出可自验的测量报告。\n\n    输入 samples 为 JSON 字符串：\n    {\"brand\":\"合尘猫\",\"domain\":\"savantcat.cn\",\"baseline_negative\":3,\n     \"fact_points\":[\"服务范围\",\"交付周期\",\"定价方式\"],\n     \"samples\":[{\"question\":\"Q1\",\"platform\":\"DeepSeek\",\"run\":1,\"answer\":\"原文回答……\",\n                 \"role\":\"independent|joint|citation_only|none\",\n                 \"sentiment\":\"positive|neutral|negative\",\n                 \"facts\":\"accurate|partial|wrong|unverifiable\",\n                 \"facts_found\":[\"服务范围\"],\"as_of\":\"2026-09-19\"}]}\n    口径：每题建议多轮（同一问题重复 7-8 次）；role 分级对应语义角色权重；\n    返回五大指标、语义角色加权分、逐题明细与「原文摘录」（便于客户自验）。\n    verify_citations=True 时会实测 AI 回答里引用的 URL 是否真的可访问（幻觉守卫）；\n    extract_claims=True 时会把回答中的数字声明单独列出并标记为未核验。\n    ",
          "inputSchema": {
            "properties": {
              "extract_claims": {
                "default": true,
                "title": "Extract Claims",
                "type": "boolean"
              },
              "samples": {
                "title": "Samples",
                "type": "string"
              },
              "verify_citations": {
                "default": true,
                "title": "Verify Citations",
                "type": "boolean"
              }
            },
            "required": ["samples"],
            "title": "score_visibilityArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "score_visibilityOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:14418acdcf7eafbbe559e5c68028e7624e4f2a0d8ae39dff77f738d7b6aa19f6"
        }
