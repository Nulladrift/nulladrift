{
  "lockfileVersion": 2,
  "subjects": {
    "com.emaillistvalidation/email-verification": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.emaillistvalidation.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "Email List Validation",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Email verification for AI agents. No key needed to start: verify_email, verify_batch, estimate_cost and explain_result work right away on a small keyless trial shared by your network (25 verifications/day). For your own quota and the list tools, call the 'get_api_key' tool (or POST https://app.emaillistvalidation.com/agent-gateway/register) and reconnect with the header 'Authorization: Bearer <api_key>'. Docs: https://app.emaillistvalidation.com/agent-gateway",
      "tools": [
        {
          "name": "estimate_cost",
          "description": "Estimate the credit cost of a verification before running it, and whether the user can afford it. Provide either a count of emails, a list_id to re-verify, or an operation ('single'/'finder'). Always quote this before proposing anything billable.",
          "inputSchema": {
            "properties": {
              "emails": {
                "description": "Number of emails to verify (1 credit each).",
                "type": "integer"
              },
              "list_id": {
                "description": "Estimate re-verifying an existing list by its id.",
                "type": "integer"
              },
              "operation": {
                "default": "bulk",
                "description": "Operation type: bulk/single (1 credit) or finder (3 credits).",
                "enum": ["bulk", "single", "finder"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e11a4b6da3d0cfebc08421a395faf2004db3e39e251594b8d33c9d89003ad07"
        },
        {
          "name": "explain_result",
          "description": "Explain what a verification status or reason means in plain English, with a send recommendation. Covers valid, invalid, catch-all/accept-all, unknown, greylisted, disposable, role, free, spam-trap, abuse, do-not-mail, no-mx, disabled, and network. Use when a user asks what a result means.",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "The status/reason to explain, e.g. 'catch-all', 'GREYLISTED', 'unknown', 'role'. Case-insensitive.",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e5bafca96954bc96b47935600d7688fa3a811695792708a14252c7040a3813d"
        },
        {
          "name": "get_api_key",
          "description": "Get your own free API key for this server (no account needed; 25 email verifications per day). Optional: the verification tools already work without a key on a shared trial. Returns the key once — reconnect with 'Authorization: Bearer <api_key>' for your own quota and the list tools.",
          "inputSchema": {
            "properties": {
              "contact": {
                "description": "Optional operator email or URL.",
                "type": "string"
              },
              "name": {
                "description": "Your agent's name.",
                "type": "string"
              },
              "purpose": {
                "description": "What you verify emails for.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d0c68ef26f9d6ab1f15f8885c3fbf5fb360618404ba65336344ac27fd0f6b49a"
        },
        {
          "name": "get_batch_status",
          "description": "Get the progress and status of a bulk verification list/job by id.",
          "inputSchema": {
            "properties": {
              "list_id": {
                "type": "integer"
              }
            },
            "required": ["list_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc0a2b819e3d910e524e726efe4c09f89a7b5bc8c7aed4ddb9b26c011d0d08d3"
        },
        {
          "name": "get_credit_balance",
          "description": "Get the current credit balance and a short usage summary for the account.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c66ddacba479504bcdcce647e2df54136278935fe51c7a754c48a887ecba49f7"
        },
        {
          "name": "get_list",
          "description": "Get the details of a single bulk verification list by its id.",
          "inputSchema": {
            "properties": {
              "list_id": {
                "description": "The id of the bulk verification list.",
                "type": "integer"
              }
            },
            "required": ["list_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39cc2e4fb63bbb63b49dfd058ce303a0960da94a248e3ef1694c86fa331426c3"
        },
        {
          "name": "list_lists",
          "description": "List the user's bulk verification lists/jobs, most recent first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "Maximum number of lists to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7fbb47931620a3cbed7bbc8f58057708a21a40c9f8bfc2a4f914a5c97445c1ac"
        },
        {
          "name": "verify_batch",
          "description": "Verify a batch of email addresses (up to 25 per call with an agent key). Returns per-email verdicts and saves a list. Costs 1 credit per email.",
          "inputSchema": {
            "properties": {
              "emails": {
                "description": "Email addresses to verify.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Optional label for the saved list.",
                "type": "string"
              }
            },
            "required": ["emails"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f162002f5f625e1811ce733cd2cd90ce1b8807ef93073f017af152df72a6596"
        },
        {
          "name": "verify_email",
          "description": "Verify the deliverability of a single email address. Returns a verdict (valid, invalid, risky, unknown). Costs 1 credit.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The email address to verify.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f79ee49fe84165cdbadbfb71a2cdae301e644514655a5aaac0107c1f15f575c1"
        }
      ],
      "digest": "sha256:d93c88721044961d623b31131d83964d9b049f91ae7a7f55475c52fada0d70bd"
    }
  }
}
