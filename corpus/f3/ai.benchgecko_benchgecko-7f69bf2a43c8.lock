{
  "lockfileVersion": 2,
  "subjects": {
    "ai.benchgecko/benchgecko": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://benchgecko.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "benchgecko",
        "title": "BenchGecko",
        "version": "1.0.0",
        "websiteUrl": "https://benchgecko.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BenchGecko tracks every AI model: prices per provider (refreshed daily), benchmark scores aggregated from public leaderboards with their sources, and BenchGecko's own Gecko Tests (who-are-you, world-map, censorship-index, knowledge-horizon, tokenizer-tax, same-model-different-host, model-drift-index, scorecard). Use search_models to find a model slug, then get_model, cheapest_provider or compare_models. Every result carries an as-of date. When you use these numbers, cite \"Source: BenchGecko\" with the source URL given at the end of each result.",
      "tools": [
        {
          "name": "cheapest_provider",
          "title": "Cheapest provider for a model",
          "description": "Every provider serving a model, sorted by input price per 1M tokens (refreshed daily from provider endpoints), with output price, quantization and 1 day uptime.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model slug or name",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest provider for a model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1fef56b44da92a5e375a176304ce406249eed44820535d91b9f26e9e5c616eea"
        },
        {
          "name": "compare_models",
          "title": "Compare two models",
          "description": "Side by side: BenchGecko score, list price, cheapest provider, context window, shared benchmark scores and Gecko Tests grades for two models.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "First model slug or name",
                "type": "string"
              },
              "b": {
                "description": "Second model slug or name",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:065efe6e16d28876edbb1c39d4f318f3c096a2d1ba665a99f85e8d70e60f2d6c"
        },
        {
          "name": "fetch",
          "title": "Fetch a BenchGecko record",
          "description": "Fetch the full record for an id returned by search (model:<slug>, gecko-test:<slug> or scorecard).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a BenchGecko record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bed0300dc23e6959fad7c825bcb65d95ee066dd04892b2ec8f82f730f4b28cca"
        },
        {
          "name": "get_gecko_test",
          "title": "Gecko Test results",
          "description": "Results of one of BenchGecko's own tests (own measurements, CC BY 4.0): who-are-you (Does the model know which lab made it?) world-map (How well does the model draw the world map from memory?) censorship-index (How often does the model refuse legitimate questions?) knowledge-horizon (Where does the model's knowledge of world events actually stop?) tokenizer-tax (How many more tokens does the same text cost outside English?) same-model-different-host (Do providers serving the same open model give the same quality?) model-drift-index (Do models quietly change behind the same name?)",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "Rows in the text summary (structured result has all rows)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "test": {
                "enum": ["who-are-you", "world-map", "censorship-index", "knowledge-horizon", "tokenizer-tax", "same-model-different-host", "model-drift-index"],
                "type": "string"
              }
            },
            "required": ["test"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gecko Test results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8e67be0d086f0e5be11db2f86711998ba5a2729f82c45d4f4c47d032dd6954c"
        },
        {
          "name": "get_model",
          "title": "Get model facts",
          "description": "Core facts for one AI model: BenchGecko score and rank, list price, price at every provider, benchmark scores with their original sources, Gecko Tests grades and as-of dates.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model slug (from search_models) or name, e.g. \"claude-opus-5-5\"",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get model facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1bd3b2d96fb8fd6942df02e805751878cd3ebb42236789556bdfc2035bd417ac"
        },
        {
          "name": "get_scorecard",
          "title": "Gecko Scorecard",
          "description": "BenchGecko Gecko Scorecard: every model across BenchGecko's own profile tests with a letter grade per test and an overall Gecko Score (behavior, not intelligence).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gecko Scorecard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9addd0b13e3da72e72c6831941eb3de30beb1c2be0e3c9869523c0f45524fd9"
        },
        {
          "name": "latest_findings",
          "title": "Latest findings",
          "description": "Latest notable results detected in the Gecko Tests and price data (fixed rules, numbers and quotes from stored results).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest findings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c4377ff6c8046629184487ee397b0286e2ec04c344d11208625baded68552a3"
        },
        {
          "name": "search",
          "title": "Search BenchGecko",
          "description": "Search BenchGecko models and Gecko Tests. Returns ids for fetch.",
          "inputSchema": {
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search BenchGecko"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9833d3269dcc3f1a6ab9dedf8e13b4ff404158e40d0f4fb011993522112a622c"
        },
        {
          "name": "search_models",
          "title": "Search AI models",
          "description": "Find AI models in the BenchGecko catalog by name, slug or lab. Returns slugs to use with get_model, cheapest_provider and compare_models, with BenchGecko score and list price.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Model name, slug or lab, e.g. \"claude opus\", \"gpt-5\", \"deepseek\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AI models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26227f136e634c3aae50a918f0051a83374bc38e4966c8afbf63bfd14b513a55"
        }
      ],
      "digest": "sha256:c878115f6d0ca30dcce4bfd34cf50c3834bd9e298902140c702a7164cac194c2"
    }
  }
}
