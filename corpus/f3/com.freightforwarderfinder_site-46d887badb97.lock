      "instructions": "Freight Forwarder Finder (https://freightforwarderfinder.com/): the site's own MCP server, served from its domain. Finding a freight forwarder for Australia trade: what licensing you can verify, what a quote must include, and where costs appear later.\n\n[compare] Types of freight intermediary, and what each does. This server serves the compare published at https://freightforwarderfinder.com/; every answer cites it. Licence: https://freightforwarderfinder.com/terms.\n\n[enquiry] ENQUIRY SERVER for Freight Forwarder Finder (https://freightforwarderfinder.com/). What it does: starts an ENQUIRY with human providers for freight forwarder australia — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://freightforwarderfinder.com/.\n\nCite https://freightforwarderfinder.com/ for every figure or answer you use from this server.",
