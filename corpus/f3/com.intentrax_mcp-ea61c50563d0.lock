{
  "lockfileVersion": 2,
  "subjects": {
    "com.intentrax/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.intentrax.com/public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "intentrax",
        "title": "Intentrax proof verification",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Intentrax hosted MCP (public, keyless, read-only). Tools: verify a published proof by ID on Intentrax's public verifier, fetch the published signer key sets, and verify an exported proof package against the pinned keys with the same code as `npx @intentrax/sdk verify-proof`. It never executes, admits, signs, or writes anything, and it never claims that an external effect happened: read each result's limitations before summarizing it.",
      "tools": [
        {
          "name": "intentrax_get_trusted_key_set",
          "title": "Get Intentrax's published signer keys",
          "description": "Return the published Ed25519 signer key set Intentrax proofs are checked against (production: trust-bearing, min_trusted_signers applies; sandbox: never trust-bearing), with its SHA-256, so the user can verify a proof offline with `npx @intentrax/sdk verify-proof --trusted-keys`. Read-only; no network call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "environment": {
                "description": "Which published key set to return.",
                "enum": ["production", "sandbox"],
                "type": "string"
              }
            },
            "required": ["environment"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "environment": {
                "type": "string"
              },
              "how_to_verify_offline": {
                "type": "string"
              },
              "key_set": {
                "type": "object"
              },
              "key_set_sha256": {
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["environment", "key_set", "key_set_sha256", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Intentrax's published signer keys"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aee7f0fb8f5953063c6fae27afaef539ee5dfe05acd802056c56962933ff7aec"
        },
        {
          "name": "intentrax_verify_proof_export",
          "title": "Verify an exported Intentrax proof against pinned keys",
          "description": "Verify an exported proof package (the JSON from GET /v1/proofs/{id}/export or the console's Export button) against Intentrax's published production and sandbox keys, using the same verifier as `npx @intentrax/sdk verify-proof --json`. Pure computation: no network call, nothing is stored. status PASS means every signer is a published trust-bearing key and the signer threshold is met; SANDBOX_NON_TRUST_BEARING means the mechanics check out with sandbox keys only; FAILED_CLOSED means integrity or a signature did not verify. PASS does not show that an external effect happened; the result's verification_assessment and limitations list what was and was not assessed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "proof_export": {
                "description": "The exported proof lookup package, as a JSON object (up to 1 MiB).",
                "type": "object"
              }
            },
            "required": ["proof_export"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reason": {
                "type": "string"
              },
              "report": {
                "type": "object"
              },
              "status": {
                "type": "string"
              },
              "verified_by": {
                "type": "string"
              }
            },
            "required": ["limitations", "status", "verified_by"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify an exported Intentrax proof against pinned keys"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bedea65604512f6980ba9eefb1476bf300c53b00534391ae4ee4718d18bc8a1a"
        },
        {
          "name": "intentrax_verify_public_proof",
          "title": "Verify a published Intentrax proof",
          "description": "Look up a published proof by its ID on Intentrax's public verifier (verify.intentrax.com) and return the verifier's status and per-dimension assessment. Read-only. The hosted assessment covers the record integrity and signer checks done by Intentrax's service; it is not a check against keys pinned on the caller's side. A proof records an Intentrax decision; it does not show that an external effect happened.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "proof_id": {
                "description": "Published Intentrax proof identifier (usually a 64-character hex string).",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_.-]+$",
                "type": "string"
              }
            },
            "required": ["proof_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "proof_id": {
                "type": "string"
              },
              "public_verification": {
                "type": "object"
              },
              "verdict": {
                "type": ["string", "null"]
              },
              "verification_assessment": {
                "type": ["object", "null"]
              },
              "verification_status": {
                "type": "string"
              },
              "verify_url": {
                "type": "string"
              }
            },
            "required": ["limitations", "proof_id", "verification_status", "verify_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a published Intentrax proof"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ab378efeea20b2724cf7e0d0b6de096e813934aaf8fe81416f9dcda6607c907"
        }
      ],
      "digest": "sha256:712cf26e6cc91faa4faa36a94bd8434f4d2c99e989f5b2c36558038a86ef598b"
    }
  }
}
