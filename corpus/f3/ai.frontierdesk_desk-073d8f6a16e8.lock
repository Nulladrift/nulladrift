      "instructions": "Read-only access to what Frontier Desk publishes: its dated index of AI-data buyer programs and the two readings built on it, its published notes, the five markets it maps, its guides, standing outlooks and services verticals, and the framing on its public tool pages. search_data_buyers returns one row per buyer program: what it buys, the figures and screens it publishes, the terms it states, a verbatim quote from its own page, and the day Frontier Desk read that page. instant_range returns the span of published per-company figures for a company of a given size and age, naming every program behind the span and every program the company's own size or age screens out. It returns no range at all when fewer than two programs qualify — one advertisement is not a range. read_data_offer reads a pasted data-licensing offer and returns what it finds: the figure against the published span, the payment trigger, exclusivity, export method and retention, each quoted back out of the offer, plus the terms worth settling before signing and the question to ask on each. It stores nothing. list_notes, search_notes and get_note read the desk's published notes, each with the links it cites. list_markets, lookup_firm and get_market_sector read the public projection of the five markets: a firm's type in plain words, its own site, and its sourced relationships. get_market_sector answers a compact summary unless asked for detail \"full\". list_guides, get_guide, list_outlooks, get_outlook, list_verticals and get_vertical read the written library; an outlook's odds are Frontier Desk's own and are settled only by the dated public sources each report names. list_public_pages and get_public_page return a page's copy, not a run of the tool on it. Every answer carries its source: an index row's check date and source URL, a note's own address and links, a page's route. Quote those, not the figures alone. Nothing here holds anything about a particular company. No client, mandate or engagement is reachable through this endpoint, and no tool writes. Every answer carries a `notice` for its group of tools; carry it with anything you quote. Figures are each buyer program's own published figures, quoted from the page named in the row and checked on the date given. A published range is an advertisement, not an offer, and not a valuation of any company's records. Frontier Desk advises the company on a sale or licence of its data; it is not a broker, a data buyer, or a law firm, and nothing here is legal advice.",
