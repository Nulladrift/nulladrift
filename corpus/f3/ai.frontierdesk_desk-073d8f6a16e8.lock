        {
          "name": "get_market_sector",
          "title": "One sector's relationship graphs",
          "description": "One sector's relationship graphs: the firms drawn in each column, the relations between them in each side's own words, the roster of who does what, and the lines on what the connections show. Takes a sector slug from list_markets: accounting, insurance, wealth, it, healthcare, staffing, legal, engineering, marketing, logistics, distribution, operators, software, business-services, property, manufacturing, build-out. By default (detail \"summary\") it answers compactly: per graph, the counts, the columns, the lines on what the connections show, and the first firms and relations in the order the page draws them, each named, with a link to the full JSON. detail \"full\" answers with the same JSON the /markets page loads when a visitor picks that sector, which can run past 100 KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": "summary",
                "description": "\"summary\" (the default) for counts and the first firms and relations in each graph; \"full\" for the whole JSON the page loads.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "graph": {
                "description": "One graph instead of all of them, by key, for example \"services\" or \"credit\". Omit for every graph the sector has.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 12,
                "description": "With detail \"summary\": how many firms and relations to name per graph. Default 12.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "sector": {
                "description": "The sector to draw: accounting, insurance, wealth, it, healthcare, staffing, legal, engineering, marketing, logistics, distribution, operators, software, business-services, property, manufacturing, build-out.",
                "enum": ["accounting", "insurance", "wealth", "it", "healthcare", "staffing", "legal", "engineering", "marketing", "logistics", "distribution", "operators", "software", "business-services", "property", "manufacturing", "build-out"],
