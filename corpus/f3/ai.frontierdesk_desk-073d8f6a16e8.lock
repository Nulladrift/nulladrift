        {
          "name": "search_notes",
          "title": "Search the desk's published notes",
          "description": "The published notes that carry every word asked for, in their title or their text, newest first. Matching is literal and case-insensitive: nothing is stemmed, ranked or inferred, so an empty answer means the words are not in the corpus rather than that the desk has no view. Pass a slug from here to get_note for the whole note.",
          "inputSchema": {
            "additionalProperties": false,
