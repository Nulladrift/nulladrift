        {
          "name": "instant_range",
          "title": "Published range for a company",
          "description": "The span of published per-company figures across the buyer programs a company of this size and age clears, with every source named and quoted. Give headcount and years if you know them; a company that has not stated one is not screened on it. A program is dropped only when the company certainly cannot meet its own stated floor. A /data band is screened the way /data screens it, at the top of the band, so a program is dropped only when the whole band is below its floor; the answer echoes the band, the figure it was screened as, and the programs that depend on where in the band the company sits. Returns has_range: false, with a reason, when fewer than two programs qualify — one program's advertisement is not a range, and no figure is estimated to fill the gap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "headcount": {
                "description": "Full-time employees. Omit if unknown.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
