{
  "lockfileVersion": 2,
  "subjects": {
    "app.itemnumbers/itemnumbers-mbs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://itemnumbers.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "itemnumbers-mbs",
        "title": "itemnumbers MBS schedule",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only lookup of the Australian Medicare Benefits Schedule (MBS): item numbers, descriptors, schedule fees, Medicare benefits, exclusions between items, time tiers and the multiple operation rule, from the official MBS Online publication. Every item number and figure comes from the schedule data, so quote it rather than recalling items from memory. Say which schedule release a figure is from. Present results as reference information from the published schedule, not billing, legal or clinical advice: tell users to check the descriptor in full and the date of service. Never send patient names, dates of birth, Medicare numbers or clinical notes to these tools. The tools read no accounts, bills or saved cases.",
      "tools": [
        {
          "name": "check_item_combination",
          "title": "Check item combination",
          "description": "Compare a set of MBS items for one occasion with the rules written in their descriptors, as schedule reference information: pairs the schedule says are not claimable together, time tiers met or missed, flags for assistant, anaesthetic and hospital-only items, and the multiple operation rule for Group T8 items with the resulting total of schedule fees (a schedule figure, not a patient charge). It reports what the descriptors say and never drops an item; it does not decide what should be billed. Rules the schedule words in ways that are not coded, such as exempt items, are not checked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "durations": {
                "default": [],
                "description": "Minutes the service lasted, only for items whose descriptor has a time tier.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "item_number": {
                      "description": "An MBS item number, 1 to 6 digits, for example 30445.",
                      "pattern": "^\\d{1,6}$",
                      "type": "string"
                    },
                    "minutes": {
                      "maximum": 1440,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["item_number", "minutes"],
                  "type": "object"
                },
                "maxItems": 15,
                "type": "array"
              },
              "item_numbers": {
                "description": "The items performed on one occasion, 1 to 15 item numbers.",
                "items": {
                  "description": "An MBS item number, 1 to 6 digits, for example 30445.",
                  "pattern": "^\\d{1,6}$",
                  "type": "string"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["item_numbers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check item combination"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:711a8e55c87be3f9fb571d5e327c6154ef9d6fce539c75debde8512273964731"
        },
        {
          "name": "get_item_history",
          "title": "Get item history",
          "description": "Show how one MBS item's descriptor and schedule fee changed across the schedule releases held here, newest first. Use it to answer what an item paid or said on an earlier date. Only the releases ingested are listed; it is not a complete history of the item.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item_number": {
                "description": "An MBS item number, 1 to 6 digits, for example 30445.",
                "pattern": "^\\d{1,6}$",
                "type": "string"
              }
            },
            "required": ["item_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get item history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff1e00314175b72a223c71fc7f4bee612533b0bc9d30a2a9d5f65ac2a218c9f7"
        },
        {
          "name": "get_item_relationships",
          "title": "Get item relationships",
          "description": "Show how the schedule itself ties one item to others: items its descriptor (or another item's descriptor) says are not claimable with it, add-on items performed in association with it, and the neighbouring items filed in the same group and subgroup. Each link quotes the descriptor wording and names the item whose descriptor says it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item_number": {
                "description": "An MBS item number, 1 to 6 digits, for example 30445.",
                "pattern": "^\\d{1,6}$",
                "type": "string"
              }
            },
            "required": ["item_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get item relationships"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38f6dced640578d2e17365000940a5f70c4783f72df4f64d6a26bd39cf19fb71"
        },
        {
          "name": "get_mbs_item",
          "title": "Get MBS item",
          "description": "Get one MBS item as published: full descriptor, fees and benefits, item type, dates, EMSN cap if any, and what the descriptor itself says: assistant and anaesthetic flags, hospital-only, time tier, and the items it excludes. Every figure comes from the schedule, never from memory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item_number": {
                "description": "An MBS item number, 1 to 6 digits, for example 30445.",
                "pattern": "^\\d{1,6}$",
                "type": "string"
              }
            },
            "required": ["item_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get MBS item"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58a6838e6f40a0101aeb090d420f59d637b0b02290188f98d4e1a807574c8aa8"
        },
        {
          "name": "search_mbs_items",
          "title": "Search MBS items",
          "description": "Find Medicare Benefits Schedule (MBS) items by item number or by words describing the procedure or service. Returns each match's descriptor, schedule fee and Medicare benefits from the current schedule. Use it first when you have a procedure but not an item number. Never put patient identifiers in the query.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many items to return, 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "An item number or its start (for example 3038), or a few words naming the procedure or service (for example gallbladder removal). Never include patient names, dates of birth or other identifying details.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search MBS items"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56d5965e716e50df854d3b14f6e1848c363c3eb94bb3dbcf5a53cf4d2d06d8d6"
        }
      ],
      "digest": "sha256:960ba6dff60359716c34c6e22f8146af4523f2d45edbc44ca2474e32d8a790b7"
    }
  }
}
