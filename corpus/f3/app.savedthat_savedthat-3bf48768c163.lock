            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "docs_url": {
                "type": "string"
              },
              "platforms": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pricing": {
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["platforms", "pricing", "product", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get SavedThat product info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
