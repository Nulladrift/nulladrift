            "readOnly": true
          },
          "digest": "sha256:eaca9a23aa0e9198e6b728357286f343f6af4caf960796e0edfe63d52fe209c9"
        },
        {
          "name": "get_public_transcript",
          "title": "Get a public transcript excerpt",
          "description": "Look up one video URL (YouTube, YouTube Shorts, Instagram Reels or TikTok) in SavedThat's public transcript index and return the opening excerpt of that transcript plus the link to its public page. Returns found=false when SavedThat has not processed the video. Only an excerpt is public; the full transcript is available to signed-in users in the app.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Video URL on YouTube, Instagram Reels or TikTok.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "channel": {
                "type": ["string", "null"]
              },
              "excerpt": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "platform": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "transcript_page_url": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a public transcript excerpt"
          },
