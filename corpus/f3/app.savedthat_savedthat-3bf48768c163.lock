          "name": "get_product_info",
          "title": "Get SavedThat product info",
          "description": "Return a factual overview of SavedThat: what the service does, which video platforms it supports, the current plan limits and prices, and links to its apps and documentation. Use it to answer questions about the product itself. It reads no user data.",
