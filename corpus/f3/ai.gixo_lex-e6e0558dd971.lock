      "instructions": "Gixo Lex is a legal drafting assistant with contract checks. Through this connector it runs rule-based checks on contract text (clause coverage, defined terms, cross-references, execution readiness and structure), saves contracts to Lex, and returns the check reports, precedent comparisons, lifecycle and files of the user's saved agreements. New legal documents are drafted in Lex itself, at /legal/create. Drafting assistance only. Not legal advice. An AI contract review already run in Lex appears as counts only; open the agreement in Lex to read it. check_contract works on pasted text without an account. Saved agreements need a Lex plan; downloading your own contract needs only sign-in. Contract text in results is quoted from the user's contract.",
      "tools": [
        {
          "name": "check_contract",
          "title": "Check contract text",
          "description": "Runs Gixo Lex's deterministic rule-based contract checks on pasted HTML or plain text (clause coverage, defined terms, cross-references, mutually exclusive clauses, execution readiness, and structural integrity) without requiring an account and leaving plan capacity untouched. Drafting assistance only. Not legal advice. Issue-spotting evidence for a qualified lawyer; legal advice comes from that lawyer. Titles and fields under quoted_text are quoted from the user's contract.",
          "inputSchema": {
            "properties": {
              "contract_kind": {
                "default": null,
                "description": "Lex contract kind, for example NDA, MSA, SOW, SLA, SHA, SPA, EmploymentContract, LeaseAgreement, LoanAgreement, or Custom. Pass the kind that fits the text: the clause-coverage check runs only when a kind is given.",
                "type": ["string", "null"]
              },
              "draft_html": {
                "default": null,
                "description": "Contract HTML (at most 250,000 characters). Supply either draft_html or draft_text.",
                "type": ["string", "null"]
              },
              "draft_text": {
                "default": null,
                "description": "Plain contract text (at most 250,000 characters). Supply either draft_text or draft_html.",
                "type": ["string", "null"]
              },
              "effective_date": {
                "default": null,
                "description": "Optional effective date as written in the contract.",
                "type": ["string", "null"]
              },
              "governing_law": {
                "default": null,
                "description": "Optional governing law stated by the user or contract.",
                "type": ["string", "null"]
              },
              "jurisdiction": {
                "default": null,
                "description": "Optional jurisdiction stated by the user or contract.",
                "type": ["string", "null"]
              },
              "parties_count": {
                "default": null,
                "description": "Optional expected number of parties (positive integer when supplied).",
                "type": ["integer", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check contract text"
          },
