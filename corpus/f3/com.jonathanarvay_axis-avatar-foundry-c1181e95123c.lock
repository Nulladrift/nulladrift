        {
          "name": "post_process_mesh",
          "title": "Post-Process Generated Mesh (Inline GLB or URL)",
          "description": "Post-process a RAW generated mesh (normalize → mesh-repair → rig/skin → validate → export) and return the finished, validated GLB as base64. The inline counterpart of axis_process (which needs a server file path) — the generation post-process step, callable by an LLM/agent that holds the mesh bytes (e.g. fresh TRELLIS output) or a URL to them. Provide the mesh EXACTLY one of two ways: inline as base64 (glb_base64) or as an HTTPS URL (mesh_url) — the URL's host must be on this server's operator-configured allowlist (off by default; an unconfigured allowlist refuses every mesh_url call, it is never open to an arbitrary host). Providing both or neither is a real input error. [Paid: $1.50 USDC via x402 for unauthenticated calls on the hosted /mcp endpoint; settled only on a successful (non-error) result.]",
          "inputSchema": {
            "examples": [
              {
                "asset_kind": "avatar",
                "glb_base64": "Z2xURgIAAAA...",
                "platform": "roblox"
              }
            ],
            "properties": {
              "asset_kind": {
                "description": "Asset kind (skinning auto-on for avatar only)",
                "enum": ["avatar", "prop", "vehicle", "environment", "creature", "weapon_armor", "character_accessory", "generic"],
                "type": "string"
              },
              "glb_base64": {
                "description": "Base64-encoded raw binary GLB to post-process. Provide exactly one of glb_base64 or mesh_url.",
                "type": "string"
              },
              "mesh_url": {
                "description": "HTTPS URL to fetch the raw GLB from instead of inline base64 (e.g. a presigned storage URL) — the host must be on this server's configured allowlist (off by default). Provide exactly one of glb_base64 or mesh_url.",
                "type": "string"
              },
              "platform": {
                "description": "Target engine platform (adds export validation)",
                "enum": ["unity", "unreal", "godot", "roblox", "axis_engine"],
                "type": "string"
              },
              "polygon_tier": {
                "description": "Decimation tier for the output mesh",
                "type": "string"
              },
              "run_skinning": {
                "description": "Override skinning (default: avatars only)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
