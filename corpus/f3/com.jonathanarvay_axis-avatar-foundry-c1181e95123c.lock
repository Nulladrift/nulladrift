        {
          "name": "generate_avatar_from_image",
          "title": "Generate 3D Avatar from Image (Paid)",
          "description": "PAID (x402, 6 USDC): generate a production 3D avatar from a reference photo (base64) — xAI A-pose normalize → TRELLIS.2 GPU mesh → full canonical post-process. Payment settles ONLY when generation completes; a failed generation is never charged. Returns a job_id — poll with the free get_generation_status tool (typical runtime 5-15 minutes). Pass idempotency_key when a retry is possible (timeout/5xx) — replaying the same key returns the original job_id instead of a second GPU job/charge. [Paid: $6.00 USDC via x402 for unauthenticated calls on the hosted /mcp endpoint; DEFERRED settlement — charged only when the generation job completes, a failed job is never charged. Poll get_generation_status (free).]",
          "inputSchema": {
            "examples": [
              {
                "image_b64": "iVBORw0KGgo...",
                "platform": "unity"
              }
            ],
            "properties": {
              "asset_kind": {
                "description": "Asset taxonomy",
                "enum": ["avatar", "prop", "vehicle", "environment", "creature", "weapon_armor", "character_accessory", "generic"],
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional caller-chosen dedup key (<=200 chars, [A-Za-z0-9_.:-]). Replaying the same key (per payer) returns the original job_id — no new GPU job, no new charge. Use on any retry after a timeout/5xx.",
                "type": "string"
              },
              "image_b64": {
                "description": "Base64-encoded reference image (PNG/JPEG)",
                "type": "string"
              },
              "platform": {
                "description": "Target engine (adds rigging + engine export)",
                "enum": ["unity", "unreal", "godot", "roblox", "axis_engine"],
                "type": "string"
              },
              "polygon_tier": {
                "description": "Quality tier (defaults to the platform's configured tier)",
                "enum": ["mobile_light", "mobile_standard", "web_vr", "desktop_standard", "desktop_high", "film_vfx", "ultra_hd"],
                "type": "string"
              },
              "prompt": {
                "description": "Optional style/subject hint alongside the image",
                "type": "string"
              },
              "texture_size": {
                "description": "Texture bake size in px (defaults per platform, else 2048)",
                "type": "number"
              }
            },
            "required": ["image_b64"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
