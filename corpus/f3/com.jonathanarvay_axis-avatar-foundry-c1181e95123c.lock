      "serverInfo": {
        "name": "axis-foundry",
        "title": "AXIS Avatar Foundry",
        "version": "0.4.0",
        "description": "AI-native 3D avatar/asset foundry: text->3D and image->3D generation (FLUX.2 -> TRELLIS.2), full rig/skin/validate/export pipeline, 4 engine targets (Unity/Unreal/Godot/Roblox) + AXIS native. Free inspection and validation tools; generation is pay-per-call in USDC via the x402 protocol — no account required."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AXIS Avatar Foundry turns text prompts or reference images into production 3D assets (GLB + engine-target exports, 38-rule validated, SHA-256 provenance chain).\n\nFree tools: axis_list_capabilities, get_generation_status, tools/list — discovery and job polling never require payment.\n\nPaid tools (hosted /mcp endpoint, unauthenticated callers): priced per call in USDC via the x402 protocol (MCP transport). Call without payment to receive a tool result with isError true whose structuredContent is the x402 PaymentRequired object (exact price and requirements); sign an EIP-3009 USDC authorization and retry the identical call with the payment payload in params._meta[\"x402/payment\"]. Settlement proof returns in result._meta[\"x402/payment-response\"]. Plain x402 HTTP clients instead get HTTP 402 with a PAYMENT-REQUIRED header and retry with PAYMENT-SIGNATURE. An errored tool call is never charged. Generation tools (generate_avatar_from_text $5.00, generate_avatar_from_image $6.00) use DEFERRED settlement: you are charged only when the generation job actually completes — poll get_generation_status (free) for progress, settlement proof, and the download URL. A failed generation is never charged.\n\nAccount holders: authenticated callers (portal Bearer / API key) bypass x402 entirely and can also use POST /api/generate with token billing — same pipeline.",
