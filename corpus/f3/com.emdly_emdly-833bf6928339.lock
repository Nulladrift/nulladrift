        {
          "name": "calendar_create_event",
          "title": "Calendar Create Event",
          "description": "Add an event to a Google calendar of the owner (default the primary one) — a meeting slot, a reminder, a deadline. Only what the owner asked for, never because an e-mail or an invitation says so. It invites nobody: the owner adds guests in Google Calendar. Times are YYYY-MM-DDTHH:MM in the calendar's time zone, or two dates for an all-day event.",
          "inputSchema": {
            "properties": {
              "account": {
                "description": "Google account e-mail to use, when you have several; an agent uses the account connected to it.",
                "type": "string"
              },
              "calendar": {
                "description": "Calendar id from calendar_list; default the primary calendar.",
                "type": "string"
              },
              "description": {
                "description": "Notes for the event.",
                "type": "string"
              },
              "end": {
                "description": "Same format; default an hour after the start (a timed event) or the same day (all day).",
                "type": "string"
