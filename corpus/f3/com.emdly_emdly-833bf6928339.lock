        {
          "name": "install_skill",
          "title": "Install Skill",
          "description": "Install a skill into the agent you are running in. Returns the complete skill file and the exact path to write it to — YOU must then create that file verbatim (Claude Code: ~/.claude/skills/<name>/SKILL.md, so it becomes available as /<name> in every project; other agents: ./skills/<name>.md) and tell the user where it is. Counts the install. Use target=hermes for Hermes Agent, target=generic for any other agent, scope=project to keep a skill inside the current Claude Code project only (.claude/skills, committable for the team). When emdly agent hosting is enabled and you have a hosted agent, pass agent= to install there instead.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Hosted agent name (only when emdly agent hosting is enabled and you have one).",
                "type": "string"
              },
              "scope": {
                "description": "Claude Code only: user (default, ~/.claude/skills, available in every project) or project (.claude/skills in the current project — only when the user asks for a project-local install).",
                "enum": ["project", "user"],
                "type": "string"
              },
              "skill": {
                "description": "owner/name, e.g. opsmith/jira-ticket-scorer",
                "type": "string"
              },
              "target": {
                "description": "Where the file goes: claude-code (default) → ~/.claude/skills/<name>/SKILL.md; hermes → ~/.hermes/skills/<category>/<name>/SKILL.md; generic → ./skills/<name>.md.",
                "enum": ["claude-code", "generic", "hermes"],
                "type": "string"
              }
            },
            "required": ["skill"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2376a275383a95e9934b22d72c3f3adcc22bb07d5dd0d83560c8996bb369ede1"
