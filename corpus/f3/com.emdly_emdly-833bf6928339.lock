        {
          "name": "automation_save",
          "title": "Automation Save",
          "description": "Create an automation for the hosted agent, or replace one (give its `id`). When the owner asks for it — a hosted agent also builds one when the owner asks for anything recurring (a regular report, a check on a schedule, handling of certain e-mails), or after they said yes to its offer. A trigger starts it — manual, schedule (every 15m/30m/1h/3h/6h/12h/1d/1w, at HH:MM, day mon–sun, Prague time) or mail (a connected mailbox, optional from/subject filters, attachments) — then `steps` run in list order unless `next` says otherwise (null ends). Each step: type \"step\" with a short `name` and `description` (what should happen, in plain words — the agent then does it with its skills and connections); type \"condition\" with `name` and a yes/no `question`, going on along `yes` / `no` (step ids or null); type \"send\" with an optional `message` — what to post, in plain words (\"a short report of the numbers, a few emojis\"): the agent writes the post from the steps before, a finished text it posts as it is; empty = the previous step's answer as it is, posted where the agent writes on its own (the chat it was last talked to in) — to post into a particular channel, say so in a step instead (\"post the summary to #ops\"). Ids are yours (e.g. \"save\", \"notify\"). `enabled` switches it on (only when nothing is missing). Returns the id, the editor link and what is missing.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Your hosted agent's name, when you have several (a hosted agent leaves it out).",
                "type": "string"
              },
              "enabled": {
                "description": "Switch it on (true) or off (false); left out keeps it as it is (a new one starts off).",
                "type": "boolean"
              },
              "id": {
                "description": "The automation to replace; leave out to create one.",
                "type": "integer"
              },
              "name": {
                "description": "A short name, e.g. \"Incoming invoices\".",
                "type": "string"
              },
              "steps": {
                "description": "The steps, in order.",
                "items": {
                  "properties": {
                    "description": {
                      "description": "step: what should happen, in plain words.",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "message": {
                      "description": "send: what to post — a brief the agent writes the message from, or a finished text; empty posts the previous step's answer as it is.",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "next": {
                      "description": "The step id after this one; null ends; left out = the next in the list.",
                      "type": "string"
                    },
                    "no": {
                      "description": "condition: the step id to go on with on no (null ends).",
                      "type": "string"
                    },
                    "question": {
                      "description": "condition: the yes/no question.",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["step", "condition", "send"],
                      "type": "string"
                    },
                    "yes": {
                      "description": "condition: the step id to go on with on yes (null ends).",
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "type": "array"
              },
              "trigger": {
                "description": "What starts it.",
                "properties": {
                  "at": {
                    "description": "HH:MM for 1d and 1w.",
                    "type": "string"
                  },
                  "attachments": {
                    "description": "Only messages with attachments.",
                    "type": "boolean"
                  },
                  "day": {
                    "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                    "type": "string"
                  },
                  "every": {
                    "enum": ["15m", "30m", "1h", "3h", "6h", "12h", "1d", "1w"],
                    "type": "string"
                  },
                  "from": {
                    "description": "Sender contains (comma = either).",
                    "type": "string"
                  },
                  "mailbox": {
                    "description": "The mailbox address (mail_accounts).",
                    "type": "string"
                  },
                  "subject": {
                    "description": "Subject contains (comma = either).",
                    "type": "string"
                  },
                  "type": {
                    "enum": ["manual", "schedule", "mail"],
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              }
            },
            "required": ["name", "steps", "trigger"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26a60577f6c98a951c3c721de5b182d1cef44b179b67aca0adc5ea4498c8e6b6"
        },
