        {
          "name": "submit_skill",
          "title": "Submit Skill",
          "description": "Submit a skill to emdly for review (needs sign-in). Creates it under your account — or a new version if you already own one with this name — runs the automated checks and the AI safety scan, and queues it for a human reviewer. Nothing is published by this tool; you get the check results back. The body must be a complete Markdown skill with a title and a \"## License\" section (MIT recommended).",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "Full Markdown: # title, when to use, rules, output format, ## License",
