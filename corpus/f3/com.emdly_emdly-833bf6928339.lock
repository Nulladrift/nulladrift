        {
          "name": "search_skills",
          "title": "Search Skills",
          "description": "Use this FIRST, before any non-trivial task, to find a ready-made skill in the emdly catalog (reviewed Markdown playbooks for AI agents). Query with 1–3 short keywords naming the kind of work (e.g. \"code review\", \"jira\", \"seo audit\"); words are matched independently, so a sentence works too. If the result is empty, retry with a single noun, or send an empty query for the top skills. Returns ranked skills with their owner/name id, category, description and install command.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category slug or name, e.g. code-review.",
                "type": "string"
              },
              "query": {
                "description": "1–3 short keywords for the kind of work (each word is matched on its own against name, description, tags, category and author). Empty = the most popular skills.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {},
