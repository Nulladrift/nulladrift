{
  "lockfileVersion": 2,
  "subjects": {
    "com.kevwire/kevwire": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kevwire.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kevwire",
        "title": "KEVWire",
        "version": "6.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only security intelligence. Cite the source URLs in each record, not KEVWire alone, for factual claims. Known exploitation and CISA KEV membership are different facts; federal due dates are not an organization's SLA. Missing metrics mean unknown, not zero.",
      "tools": [
        {
          "name": "get_record",
          "title": "Get one record with full evidence",
          "description": "Fetch one record by CVE ID, GHSA ID, or KEVWire record ID, with every source, measurement date, CISA deadline and a permalink. Any published CVE resolves, even outside the tracked set. Returns isError with a hint when nothing matches; then try search_vulnerabilities.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50bdb32735e33b7eb6681bba66094549790f6a138090809539ec31464f1c2526"
        },
        {
          "name": "list_recent_exploited",
          "title": "Recently exploited vulnerabilities",
          "description": "Vulnerabilities with documented exploitation (CISA KEV or explicit reporting) published within the last N days, most urgent first. Use it for briefings such as \"what was exploited this week\"; to narrow by product or words, use search_vulnerabilities with known_exploited_only. Paged with offset and hasMore.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 30,
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5421591ea3c3f4acde7e8fa0da7f6288e9ab6cb295f6092d1b895ffd48b4e667"
        },
        {
          "name": "list_sources",
          "title": "List data sources and their status",
          "description": "Every source KEVWire ingests, with scope, limitations, retrieval status, last success and record counts. Use it to describe coverage honestly or to explain why something may be missing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df33f8f794bf33dc1f4a2e809966992e3fc556eb549e387479bac7ccdb66422d"
        },
        {
          "name": "list_technologies",
          "title": "List technology labels",
          "description": "Technology labels (vendors and products) usable in search_vulnerabilities' technologies filter, with how many records each covers, most covered first. Use it to find the exact label before filtering. Optionally filter by text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 100,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db2dd1cc7ee17ab40d8703a3bbd021106c946d733a56fe78acb265564a2d2f6b"
        },
        {
          "name": "search_vulnerabilities",
          "title": "Search vulnerabilities, breaches, and advisories",
          "description": "Search the KEVWire corpus (CISA KEV, NVD high/critical CVEs, GitHub advisories, national CERTs, security reporting, editorial records) by words, technology, kind or exploitation. Use it to answer \"is X affected\" or \"what is known about Y\"; for a known ID use get_record, and for a plain \"what is being exploited lately\" list use list_recent_exploited. Default order is \"urgent\": the last 30 days first, then known exploitation, CVSS 9+, breaches. Results are paged (see hasMore and offset) and include source URLs to cite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["vulnerability", "breach", "advisory", "ai-research"],
                "type": "string"
              },
              "known_exploited_only": {
                "description": "Only records in the CISA Known Exploited Vulnerabilities catalog.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to match, e.g. \"php rce\", a CVE ID, a product, or an event name like \"PHP2Shell\".",
                "maxLength": 500,
                "type": "string"
              },
              "sort": {
                "enum": ["urgent", "newest", "priority", "cvss", "epss"],
                "type": "string"
              },
              "technologies": {
                "description": "Technology labels, e.g. [\"Microsoft Windows\", \"PHP\"]. Matches any.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a30ea16a5171f9ccea74f5e306c0156854d2923cf5ab0cac008d918fdb0b113a"
        }
      ],
      "digest": "sha256:649fa393d45fe7d8476a6fe8edc52ed6dac68710ea83da7d72c2b7a291308d8a"
    }
  }
}
