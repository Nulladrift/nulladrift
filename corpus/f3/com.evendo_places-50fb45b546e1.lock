        {
          "name": "list_subareas",
          "title": "List areas inside a place",
          "description": "List the direct children of a place, e.g. the neighbourhoods of a city or the cities of a region, most prominent first. Useful to suggest areas to explore or to narrow a search.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "area_type": {
                "description": "e.g. Neighbourhoods for a city, Cities for a region, CountryRegions for a country. Omit to see everything one level down, which can include featured venues, not just areas.",
