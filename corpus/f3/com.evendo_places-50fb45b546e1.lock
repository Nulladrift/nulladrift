      "serverInfo": {
        "name": "evendo-places",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Evendo is a worldwide guide to restaurants, bars, shops, attractions and landmarks, organised as Country > Region > City > Neighbourhood > Venue. All results are read-only data from evendo.com. Workflow: (1) resolve_place to turn a place name into an ID; (2) find_venues with that ID and filters, or search_venues for keyword matching (e.g. 'ramen', 'rooftop'); (3) get_venue for full details, links and booking URL, or get_venues to load many at once (e.g. a whole itinerary). Never search for venues by putting a city name in the text ('restaurants in Prague'): resolve the place, then scope by its ID. Text search is keyword-based with English stemming but no typo tolerance and no semantic matching. Each venue appears once per result list, even though Evendo stores a copy of it for every list page it is featured on. Sorting: default is Evendo ranking (most prominent first); use sort_by for place_score (overall quality), rating, most reviewed, or distance. min_place_score keeps only high-quality venues. Mapping everyday words to filters: cheap/budget -> price_level inexpensive; upscale -> expensive or very_expensive; kid-friendly/family -> audience Family Friendly or Child Friendly; dog-friendly -> audience Pet Friendly; wheelchair -> audience Wheelchair Accessible; outdoor/terrace -> environment Outdoor; sunset -> style_visual Sunset Spots; views/panoramic -> style_visual Iconic Views or Panoramas; pub -> Bars + location_type Pub; cafe -> Restaurants + location_type Cafe; museum/gallery/park -> Attractions + category Museum/Gallery/Park; market -> Shopping + category Market; good ratings -> min_rating 4 + min_reviews 10; top rated -> min_rating 4.5 + min_reviews 20. Rooftop, waterfront, live music etc. have no filter: use search_venues. If one value of a field conflicts with another (e.g. 'vegan fine dining', both are categories), filter on the rarer one and check the other in the results, or use search_venues with both words. There are no counts or aggregates: to answer 'how many', page through find_venues until has_more is false; to compare two places, fetch each with the same filters and compare the results yourself.",
      "tools": [
        {
          "name": "find_venues",
          "title": "Find venues in a place",
          "description": "List venues of one type anywhere inside a place (country, region, city or neighbourhood), best-ranked first, or nearest-first when `near` is given; sort_by switches to highest rated, most reviewed or distance. Use for requests like 'top-rated cheap Italian restaurants in Prague', 'most reviewed bars in London' or 'family-friendly outdoor attractions in Scotland'. place_id must come from resolve_place. For keyword matching ('sushi', 'rooftop', 'craft beer'), use search_venues instead. If a neighbourhood returns fewer than ~5 results, widen to its city.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "access": {
                "description": "Physical access difficulty. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Easy Access", "Moderate Access", "Difficult Access"],
                  "type": "string"
                },
                "type": "array"
              },
              "ambience": {
                "description": "Atmosphere tags. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Romantic", "Cozy", "Lively", "Relaxing", "Trendy", "Scenic", "Tranquil", "Unique", "Sophisticated"],
                  "type": "string"
                },
                "type": "array"
              },
              "amenities": {
                "description": "Required amenities. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Restrooms", "Parking", "Wifi", "Seating Areas", "Drink Options", "Food Options", "Trash Bins", "Information Boards"],
                  "type": "string"
                },
                "type": "array"
              },
              "audience": {
                "description": "Who the place suits / accessibility. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Family Friendly", "Child Friendly", "Senior Friendly", "Teen Friendly", "Wheelchair Accessible", "Pet Friendly", "Business Meetings"],
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "description": "Exact, case-sensitive category. Restaurants: \"Italian\", \"Japanese\", \"Mexican\", \"Indian\", \"Chinese\", \"Thai\", \"French\", \"Mediterranean\", \"Seafood\", \"Steakhouse\", \"Pizza\", \"Sushi\", \"Vegan\", \"Vegetarian\", \"Fast Food\", \"Fine Dining\". Bars: \"Cocktail Bar\", \"Wine Bar\", \"Sports Bar\", \"Beer Garden\". Shopping: \"Market\", \"Boutique\", \"Mall\". Attractions: \"Museum\", \"Park\", \"Gallery\", \"Zoo\", \"Theme Park\", \"Garden\". If unsure of the exact value, use search_venues text instead.",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from a previous call with otherwise identical arguments. Never invent one.",
                "type": "string"
              },
              "environment": {
                "description": "\"outdoor\"/\"terrace\"/\"al fresco\" = Outdoor. For \"outdoor seating\" make two calls, Outdoor and \"Indoor and Outdoor\", and merge.",
                "enum": ["Indoor", "Outdoor", "Indoor and Outdoor"],
                "type": "string"
              },
              "experience": {
                "description": "Experience tags. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Cultural Heritage", "Photowalk", "Nature Escape", "Day Trip", "Weekend Getaway", "Food & Drink Tour"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Results per page.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location_type": {
                "description": "Finer type than venue_type, exact match, e.g. \"Pub\", \"Cafe\", \"Restaurant\", \"Attraction\", \"Gastropub\", \"Museum\". Pub = Bars + \"Pub\"; cafe / coffee shop = Restaurants + \"Cafe\".",
                "type": "string"
              },
              "min_place_score": {
                "description": "Minimum Evendo place score (0-100 overall quality; most venues are 20-50, 70+ is excellent, 90+ is a city's very best).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "min_rating": {
                "description": "Minimum average rating, 0-5. \"good\" = 4.0, \"top rated\"/\"best\" = 4.5 (pair with min_reviews).",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "min_reviews": {
                "description": "Minimum number of reviews; use ~50+ to avoid thinly-rated places. \"good\" = 10+, \"top rated\" = 20+.",
                "minimum": 0,
                "type": "integer"
              },
              "near": {
                "additionalProperties": false,
                "description": "Restrict to this radius around a point; results then sort nearest-first unless sort_by says otherwise. For 'near <landmark>', first find the landmark with search_venues (venue_type Landmarks, then Attractions) and use its location.",
                "properties": {
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "radius_km": {
                    "default": 5,
                    "maximum": 50,
                    "minimum": 0.1,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              },
              "place_id": {
                "description": "ID from resolve_place.",
                "type": "string"
              },
              "price_level": {
                "description": "\"cheap\"/\"budget\" = inexpensive; \"upscale\"/\"fancy\" = expensive or very_expensive. There is no \"free\" level; for free places use search_venues with text \"free\".",
                "enum": ["inexpensive", "moderate", "expensive", "very_expensive"],
                "type": "string"
              },
              "sort_by": {
                "description": "best (default): Evendo ranking, or nearest-first when `near` is given. place_score: highest Evendo place score (0-100 overall quality) first. rating: highest average rating first (pair with min_reviews so 1-review places don't win). reviews: most reviewed first ('most popular'). nearest / farthest: by distance, require `near`. Places missing the value sort last. Changing sort_by restarts pagination: don't reuse a cursor from another sort.",
                "enum": ["best", "place_score", "rating", "reviews", "nearest", "farthest"],
                "type": "string"
              },
              "style_aesthetic": {
                "description": "Interior / design aesthetic. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Industrial Designs", "Modern Designs", "Vintage", "Minimalist"],
                  "type": "string"
                },
                "type": "array"
              },
              "style_architecture": {
                "description": "Architecture. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Landmarks", "Heritage Neighborhoods", "Modern Architecture"],
                  "type": "string"
                },
                "type": "array"
              },
              "style_social_media": {
                "description": "Photo / social-media appeal. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Instagrammable", "Photo Spots", "Selfie Spots", "Aesthetic Corners"],
                  "type": "string"
                },
                "type": "array"
              },
              "style_visual": {
                "description": "Views. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Iconic Views", "Panoramas", "Sunrise Spots", "Sunset Spots"],
                  "type": "string"
                },
                "type": "array"
              },
              "sustainability": {
                "description": "Sustainability tags. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Eco-Friendly", "Public-Transport Accessible", "Leave-No-Trace Critical"],
                  "type": "string"
                },
                "type": "array"
              },
              "venue_type": {
                "description": "Restaurants (incl. cafes, diners), Bars (pubs, nightclubs), Shopping (markets, shops), Attractions (museums, parks, galleries, zoos), Landmarks (monuments, historic sites). Unsure between Attractions and Landmarks? Try both.",
                "enum": ["Restaurants", "Bars", "Shopping", "Attractions", "Landmarks"],
                "type": "string"
              },
              "weather_suitability": {
                "description": "Weather suitability. Every listed value must be present (AND), so pass only what the user actually requires.",
                "items": {
                  "enum": ["Any Weather", "Rain / Wet Weather", "Clear Skies", "Windy Conditions", "Mild Temperatures"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["place_id", "venue_type"],
            "type": "object"
          },
