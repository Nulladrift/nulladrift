        {
          "name": "resolve_place",
          "title": "Resolve a place name",
          "description": "Find the Evendo ID of a country, region, city or neighbourhood by name. Always call this first: other tools take place IDs, not names. Names can be ambiguous (several 'Soho's), so check address_city / country_code in the results and pick the right one. If you don't know what kind of place it is, omit place_type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country_code": {
                "description": "ISO 3166-1 alpha-2, e.g. \"GB\", to disambiguate.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Place name, spelled correctly, e.g. \"Prague\", \"Scotland\", \"Soho\".",
                "minLength": 1,
                "type": "string"
              },
              "place_type": {
                "description": "Cities for cities, Neighbourhoods for districts, CountryRegions for regions like Scotland or Bavaria (if none found, try Regions, then omit place_type), Destinations for destination areas, Country for countries.",
                "enum": ["Country", "Regions", "SubRegions", "CountryRegions", "Destinations", "Cities", "Neighbourhoods"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
