      },
      "transport": {
        "type": "http",
        "url": "https://requstory.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "requstory",
        "title": "Requstory",
        "version": "1.2.0",
        "websiteUrl": "https://requstory.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The Requstory Index lists independent B2B suppliers (wholesalers, distributors and manufacturers in the UK and US) with trade facts read from their own websites or confirmed by the owner: prices or quote on request, minimum order, payment terms, delivery and trade accounts, each dated. To buy for a business: search_suppliers, then get_supplier for one supplier's full dated facts, then request_quote with the buyer's details and consent; the buyer gets an email link and the request reaches the supplier once they click it; the supplier replies to the buyer by email. No sign-in or key is needed. Nothing is ordered or paid through these tools. Requstory's free Lab tools (company maps, ease scores, AI readiness, order-to-cash agents) are a separate server at https://requstory.com/mcp/lab.",
      "tools": [
        {
          "name": "get_supplier",
          "title": "Get one supplier",
          "description": "One supplier in the Requstory Index by its website domain: every dated trade fact (prices or quote on request, minimum order, payment terms, delivery, returns, trade account), whether the owner verified the listing, its record with real buyer requests (answered, usual hours to answer, orders that arrived) and prices read on its site or quoted in the last 60 days. Use after search_suppliers, before request_quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "supplier": {
                "description": "The \"supplier\" value from search_suppliers (the supplier's website domain), e.g. \"ukpackaging.com\".",
                "type": "string"
              }
            },
            "required": ["supplier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one supplier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.requstory/key": "none",
            "com.requstory/summary": "One supplier's dated trade facts, its record with buyers and recent prices."
          },
          "digest": "sha256:40c6be5352fb580bb563e18858ebc0bf7b5d94a41cc24e6a1a7a7b416dd73b27"
        },
        {
          "name": "request_quote",
          "title": "Request a quote from a supplier",
          "description": "Send a quote request to one supplier from search_suppliers on behalf of a buyer: what they need, how many and where to deliver. The supplier gets it by email and replies to the buyer directly; nothing is ordered or paid. Use only with the buyer's consent to share their name and email with that supplier. Returns status \"sent\", or \"waiting\" when the supplier has no address for requests yet (Requstory passes it on).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyerCompany": {
                "description": "The buyer's business, if any.",
                "type": "string"
              },
              "buyerEmail": {
                "description": "The buyer's email, where the supplier replies. Use it only with the buyer's consent.",
                "type": "string"
              },
              "buyerName": {
                "description": "The buyer's name.",
                "type": "string"
              },
              "deliverTo": {
                "description": "Where to deliver: town or postcode and country.",
                "type": "string"
              },
              "items": {
                "description": "What the buyer needs: products, sizes, specifications.",
                "type": "string"
              },
              "message": {
                "description": "Anything else for the supplier, such as a delivery date.",
                "type": "string"
              },
              "quantity": {
                "description": "How many, e.g. \"5,000 cups a month\".",
                "type": "string"
              },
              "supplier": {
                "description": "The \"supplier\" value from search_suppliers (the supplier's website domain).",
                "type": "string"
              }
            },
            "required": ["buyerEmail", "buyerName", "deliverTo", "items", "supplier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote from a supplier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "com.requstory/key": "none",
            "com.requstory/summary": "Send a buyer's quote request to a supplier in the Index; the buyer confirms by email, then the supplier replies by email."
          },
          "digest": "sha256:281008e67785baad4151161a94814c4a5500f1af6cd5a0631ae495ee0afaac4d"
        },
        {
          "name": "search_suppliers",
          "title": "Search B2B suppliers",
          "description": "Find independent B2B suppliers (wholesalers, distributors, manufacturers) in the Requstory Index to buy goods for a business: catering disposables and packaging, café and coffee supplies, cleaning and janitorial, packaging, fasteners, industrial and growing supplies, in the UK and US. Each result has dated trade facts: prices shown or quote on request (trade login), minimum order (with amount), payment terms, delivery and returns policies, trade account link, and whether an agent could order online. Verified suppliers confirmed their facts and rank first. Then use get_supplier for one supplier's full facts, or request_quote to ask a supplier for a price, stock or a delivery date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Where the supplier is based.",
                "enum": ["GB", "UK", "US"],
                "type": "string"
              },
              "limit": {
                "description": "Up to 25; default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxMinimumOrder": {
                "description": "Most the minimum order may be, in the supplier's currency. Suppliers with no stated minimum are kept.",
                "minimum": 0,
                "type": "number"
              },
              "payOnAccount": {
                "description": "Only suppliers that state payment terms (for example 30 days on account).",
                "type": "boolean"
              },
              "prices": {
                "description": "shown: prices on the website; quote: quote on request or trade login. Default any.",
                "enum": ["any", "shown", "quote"],
                "type": "string"
              },
              "query": {
                "description": "Product type or supplier name, e.g. \"compostable cups\", \"coffee\", \"M8 bolts\", \"janitorial\".",
                "type": "string"
              },
              "verifiedOnly": {
                "description": "Only suppliers whose owner confirmed the listing.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search B2B suppliers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.requstory/key": "none",
            "com.requstory/summary": "Find B2B suppliers by product type, country, prices, minimum order and payment terms; dated facts."
          },
          "digest": "sha256:5f70c2d408b83bcbad11ae90e20cb13b3c98807fdc0dd5cc28076b31b6ac3df6"
        }
      ],
      "resources": [
