      "serverInfo": {
        "name": "requstory-index",
        "title": "Requstory Index",
        "version": "1.4.0",
        "description": "Requstory is the index AI agents use to find and buy from independent B2B suppliers. Search UK and US wholesalers, distributors and manufacturers by product, price, minimum order and payment terms, read dated trade facts, and request quotes.",
        "websiteUrl": "https://requstory.com",
        "icons": [
          {
            "src": "https://requstory.com/rebuild-assets/brand/mark.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://requstory.com/rebuild-assets/brand/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The Requstory Index lists independent B2B suppliers (wholesalers, distributors and manufacturers in the UK and US) with trade facts read from their own websites or confirmed by the owner: prices or quote on request, minimum order, payment terms, delivery and trade accounts, each dated. To buy for a business: search_suppliers, then get_supplier for one supplier's full dated facts, then request_quote with the buyer's details and consent; the buyer gets an email link and the request reaches the supplier once they click it; the supplier replies to the buyer by email. No sign-in or key is needed. Nothing is ordered or paid through these tools. Requstory's free Lab tools (company maps, ease scores, AI readiness, order-to-cash agents) are a separate server at https://requstory.com/mcp/lab.",
      "tools": [
        {
          "name": "get_supplier",
          "title": "Get one supplier",
          "description": "One supplier in the Requstory Index by its website domain: every dated trade fact (prices or quote on request, minimum order, payment terms, delivery, returns, trade account), whether the owner verified the listing, its record with real buyer requests (answered, usual hours to answer, orders that arrived) and prices read on its site or quoted in the last 60 days. Use after search_suppliers, before request_quote. Returns the supplier's facts, each with its source and date, plus links to its Index page and policies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "supplier": {
                "description": "The \"supplier\" value from search_suppliers (the supplier's website domain), e.g. \"ukpackaging.com\".",
                "type": "string"
              }
            },
            "required": ["supplier"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "canOrderOnline": {
                "description": "Our AI buyer found a way to order on its website.",
                "type": "boolean"
              },
              "category": {
                "description": "What it supplies, for example \"Compostable packaging\".",
                "type": ["string", "null"]
              },
              "country": {
                "description": "Two-letter code of the country it is based in, for example GB.",
                "type": ["string", "null"]
              },
              "deliveryArea": {
                "description": "Where it delivers, as stated.",
                "type": ["string", "null"]
              },
              "deliveryPolicy": {
                "description": "Link to the delivery policy.",
                "type": ["string", "null"]
              },
              "facts": {
                "description": "Where the facts above come from and how old they are.",
                "properties": {
                  "checkedAt": {
                    "description": "When the facts were last read (YYYY-MM-DD).",
                    "type": ["string", "null"]
                  },
                  "confirmedByOwnerAt": {
                    "description": "When the owner confirmed them (YYYY-MM-DD); null if not verified.",
                    "type": ["string", "null"]
                  },
                  "source": {
                    "description": "website (read from its site) or owner (confirmed by the supplier).",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "minimumOrder": {
                "description": "Its stated minimum order; null when none was found.",
                "properties": {
                  "amount": {
                    "description": "The amount read from that text.",
                    "type": ["number", "null"]
                  },
                  "currency": {
                    "description": "Currency of the amount: GBP, USD or EUR.",
                    "type": ["string", "null"]
                  },
                  "text": {
                    "description": "The minimum order as the supplier states it.",
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "name": {
                "description": "Company name.",
                "type": "string"
              },
              "note": {
                "description": "How to read the facts.",
                "type": "string"
              },
              "page": {
                "description": "The supplier's page in the Requstory Index.",
                "type": "string"
              },
              "paymentTerms": {
                "description": "Payment terms as stated, for example \"30 days on account\".",
                "type": ["string", "null"]
              },
              "prices": {
                "description": "Whether a buyer can see prices.",
                "properties": {
                  "example": {
                    "description": "A price read on its site, as written there.",
                    "type": ["string", "null"]
                  },
                  "mode": {
                    "description": "How it shows prices: shown (on the website), quote (on request), trade_login (behind a trade login) or unknown.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "profile": {
                "description": "Requstory company page, when one is published.",
                "type": ["string", "null"]
              },
              "quotes": {
                "description": "request_quote can reach this supplier.",
                "type": "boolean"
              },
              "recentPrices": {
                "description": "Prices read on its site or quoted to buyers in the last 60 days, newest first.",
                "items": {
                  "properties": {
                    "date": {
                      "description": "When it was read or quoted (YYYY-MM-DD).",
                      "type": "string"
                    },
                    "item": {
                      "description": "The product.",
                      "type": ["string", "null"]
                    },
                    "price": {
                      "description": "The price as read or quoted.",
                      "type": ["string", "null"]
                    },
                    "source": {
                      "description": "website (read on its site) or owner (quoted by the supplier).",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "returnsPolicy": {
                "description": "Link to the returns policy.",
                "type": ["string", "null"]
              },
              "supplier": {
                "description": "The supplier's website domain, its id in the Index; pass it to get_supplier or request_quote.",
                "type": "string"
              },
              "track": {
                "description": "Its record with buyer requests sent through Requstory; null before the first one.",
                "properties": {
                  "ordersArrived": {
                    "description": "Orders buyers said arrived.",
                    "type": "integer"
                  },
                  "ordersLate": {
                    "description": "Orders buyers said arrived late.",
                    "type": "integer"
                  },
                  "ordersNotArrived": {
                    "description": "Orders buyers said did not arrive.",
                    "type": "integer"
                  },
                  "requestsAnswered": {
                    "description": "Requests answered out of requests sent, for example \"3 of 4\".",
                    "type": "string"
                  },
                  "since": {
                    "description": "Date of the first request (YYYY-MM-DD).",
                    "type": ["string", "null"]
                  },
                  "source": {
                    "description": "Where the record comes from.",
                    "type": "string"
                  },
                  "usualAnswerHours": {
                    "description": "Typical hours to answer (the median); null before the first answer.",
                    "type": ["integer", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "tradeAccount": {
                "description": "Link to open a trade account.",
                "type": ["string", "null"]
              },
              "verified": {
                "description": "The owner confirmed the listing and its facts.",
                "type": "boolean"
              },
              "website": {
                "description": "Home page address.",
                "type": "string"
              }
            },
            "required": ["canOrderOnline", "facts", "name", "page", "prices", "supplier", "verified", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one supplier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.requstory/key": "none",
            "com.requstory/summary": "One supplier's dated trade facts, its record with buyers and recent prices."
          },
          "digest": "sha256:911257196f6dfbe26fba814e921896a3a3e6531ca68e90ec433d08b249fc1f0b"
        },
        {
          "name": "request_quote",
          "title": "Request a quote from a supplier",
          "description": "Send a quote request to one supplier from search_suppliers on behalf of a buyer: what they need, how many and where to deliver. The supplier gets it by email and replies to the buyer directly; nothing is ordered or paid. Use only with the buyer's consent to share their name and email with that supplier. Returns the request number, the supplier and status \"confirm\": Requstory emails the buyer a link, and the request goes to the supplier once the buyer clicks it. \"next\" says this in words to pass on to the buyer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyerCompany": {
                "description": "The buyer's business, if any.",
                "type": "string"
              },
              "buyerEmail": {
                "description": "The buyer's email, where the supplier replies. Use it only with the buyer's consent.",
                "type": "string"
              },
              "buyerName": {
                "description": "The buyer's name.",
                "type": "string"
              },
              "deliverTo": {
                "description": "Where to deliver: town or postcode and country.",
                "type": "string"
              },
              "items": {
                "description": "What the buyer needs: products, sizes, specifications.",
                "type": "string"
              },
              "message": {
                "description": "Anything else for the supplier, such as a delivery date.",
                "type": "string"
              },
              "quantity": {
                "description": "How many, e.g. \"5,000 cups a month\".",
                "type": "string"
              },
              "supplier": {
                "description": "The \"supplier\" value from search_suppliers (the supplier's website domain).",
                "type": "string"
              }
            },
            "required": ["buyerEmail", "buyerName", "deliverTo", "items", "supplier"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "name": {
                "description": "The supplier's company name.",
                "type": "string"
              },
              "next": {
                "description": "What happens next, in words to pass on to the buyer.",
                "type": "string"
              },
              "requestId": {
                "description": "Requstory's number for this request.",
                "type": "integer"
              },
              "status": {
                "description": "\"confirm\": waiting for the buyer to click the link Requstory emailed them; then it goes to the supplier.",
                "type": "string"
              },
              "supplier": {
                "description": "The supplier's website domain.",
                "type": "string"
              }
            },
            "required": ["name", "next", "requestId", "status", "supplier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote from a supplier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "com.requstory/key": "none",
            "com.requstory/summary": "Send a buyer's quote request to a supplier in the Index; the buyer confirms by email, then the supplier replies by email."
          },
          "digest": "sha256:92a0695cdcc1cb15777fd1d5316fc6909ba64382dc58e08d88573b05e39f8752"
        },
        {
          "name": "search_suppliers",
          "title": "Search B2B suppliers",
          "description": "Find independent B2B suppliers (wholesalers, distributors, manufacturers) in the Requstory Index to buy goods for a business: catering disposables and packaging, café and coffee supplies, cleaning and janitorial, packaging, fasteners, industrial and growing supplies, in the UK and US. Each result has dated trade facts: prices shown or quote on request (trade login), minimum order (with amount), payment terms, delivery and returns policies, trade account link, and whether an agent could order online. Verified suppliers confirmed their facts and rank first. Then use get_supplier for one supplier's full facts, or request_quote to ask a supplier for a price, stock or a delivery date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Keeps suppliers based in this country. Leave it out to include suppliers from every country in the Index.",
                "enum": ["GB", "UK", "US"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many suppliers to return. Verified suppliers come first, then the best matches for the query.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxMinimumOrder": {
                "description": "The order size the buyer plans, to leave out suppliers whose stated minimum order is higher. Compared in the supplier's own currency, with no conversion. Suppliers that state no minimum order are kept.",
                "minimum": 0,
                "type": "number"
              },
              "payOnAccount": {
                "description": "When true, only suppliers that state payment terms (for example 30 days on account). Left out or false, payment terms do not filter the results.",
                "type": "boolean"
              },
              "prices": {
                "default": "any",
                "description": "Filters by how suppliers publish prices: shown finds suppliers whose prices are on their website, so an agent can compare them; quote finds suppliers who price on request or behind a trade login.",
                "enum": ["any", "shown", "quote"],
                "type": "string"
              },
              "query": {
                "description": "Product type or supplier name, e.g. \"compostable cups\", \"coffee\", \"M8 bolts\", \"janitorial\".",
                "type": "string"
              },
              "verifiedOnly": {
                "description": "Only suppliers whose owner confirmed the listing.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
