{
  "lockfileVersion": 2,
  "subjects": {
    "com.bluedoseapp/glp1-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bluedoseapp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.bluedoseapp/glp1-tools",
        "title": "Bluedose GLP-1 Tools",
        "version": "1.0.0",
        "websiteUrl": "https://bluedoseapp.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Injection-site rotation, shot-day countdown and GLP-1 search-interest data from Bluedose. Logging and data only: never gives dosing or medical advice.",
      "tools": [
        {
          "name": "glp1_search_interest",
          "title": "GLP-1 search interest by country",
          "description": "Average monthly Google searches for Mounjaro, Ozempic, Wegovy, Zepbound, Saxenda, tirzepatide and semaglutide in a country (ISO code, e.g. US, BR, JP), from Bluedose's open dataset (Google Keyword Planner, Nov 2026). Searches show interest, not prescriptions.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1da54bfb83c41e6cfa83fec05bc3b2c63eb13e3ede90c4b7a48121e96f209aa"
        },
        {
          "name": "next_injection_site",
          "title": "Next injection site",
          "description": "Suggest the least recently used of the six common subcutaneous injection sites from a history of sites (most recent last). Rotation helper only: it never recommends or calculates doses.",
          "inputSchema": {
            "properties": {
              "enabled": {
                "items": {
                  "enum": ["Abdomen, left", "Abdomen, right", "Thigh, left", "Thigh, right", "Upper arm, left", "Upper arm, right"],
                  "type": "string"
                },
                "type": "array"
              },
              "history": {
                "description": "past sites, most recent last",
                "items": {
                  "enum": ["Abdomen, left", "Abdomen, right", "Thigh, left", "Thigh, right", "Upper arm, left", "Upper arm, right"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cec8a9559a4836e60ed817916d81ab72ae9595510372d67e4923bee44e61a7e2"
        },
        {
          "name": "shot_day_countdown",
          "title": "Days until shot day",
          "description": "Days until the next weekly shot day (0 = today) for a weekday and a reference date. A countdown only.",
          "inputSchema": {
            "properties": {
              "shot_day": {
                "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                "type": "string"
              },
              "today": {
                "description": "YYYY-MM-DD, default today (UTC)",
                "type": "string"
              }
            },
            "required": ["shot_day"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6feafaeca7ea5504e915c153322dee9ee9abf9625da73c2e48372bb424632aea"
        }
      ],
      "digest": "sha256:b70e9024bb79a9bc34dd67b4ca1be14470665c7b0da72d7f944e8d68266d1ead"
    }
  }
}
