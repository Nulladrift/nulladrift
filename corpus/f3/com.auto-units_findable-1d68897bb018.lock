  "subjects": {
    "com.auto-units/findable": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://thefindable.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Findable",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Help the client who says 'I am not showing up'. Start with their public website now. Ask for the URL if missing; do not block on goals, hosting, accounts or optional connections. Reuse known answers. When the user wants to verify newly published changes or requests fresh research, set refresh_public_research to true so recent cached evidence is not reused. Call start_audit, retain its secret ID, then check_audit after about 20 seconds until ready. Never invent a result while it is working. When ready, give a short finding and the first useful action. Explain its likely benefit, realistic review date and how the client will know whether it helped. Offer other changes and detailed evidence only when useful; do not paste the entire report by default. Three unbranded OpenAI API web-search answers are dated samples, not ChatGPT app tests, Google ranks or a visibility rate. Missing data is unknown, never zero. Suggest read-only Google Search Console once, without blocking: the client's assistant can use its own authorized connection, verify the client property and pass selected dated results via shared_data. Reuse useful Semrush, Profound, analytics or other tools the client already has. On 'connect my data/MCPs', explain briefly that their assistant can share selected data with permission; Findable does not inherit tools, credentials or ongoing access. Collect only relevant report data, not secrets or personal customer records. Never claim a persistent connection was created. If setup is needed, explain one useful step at a time and continue the public audit. Clients can sign in on Findable and explicitly save a report from its private link to keep it in their account. MCP sessions are not automatically signed in; the report link connects that specific audit after sign-in. Ongoing provider connections managed in a Findable account are not supported in this pilot. Show actual website drafts and get approval before changes. The client's separate Framer, WordPress, Vercel or other authorized website tool applies approved changes after verifying the project and domain. Findable cannot itself access those tools. Keep the audit ID and result link private unless the client chooses to share them.",
      "tools": [
        {
          "name": "check_audit",
          "title": "Check a Website SEO/AEO audit",
          "description": "Where a Website SEO/AEO audit stands. When it is ready, the full result as text and a link to it on Findable's site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The id start returned.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Website SEO/AEO audit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c9f9acc82ef8f7fe8c0980b7623ed3d82129ab455e5a2c22f6a22453bc3814f"
        },
        {
          "name": "start_audit",
          "title": "Start a Website SEO/AEO audit",
          "description": "Create a stored SEO/AEO audit of a public business website without an account or data connection. Accepts optional dated provider reports. Reads the homepage, up to four internal pages, robots.txt, sitemap.xml and up to five relevant competitor websites discovered from public market research or supplied by the client. Samples three unbranded customer questions about the category, a task and a problem through live OpenAI API web searches when available. Newly audited competitors use the same questions and source-check rubric. Recent public research may be reused with its original dates; private client data is excluded from that cache. Returns an audit ID for retrieving progress and the completed report. Tool results omit contact tables, email addresses and phone numbers. Results include sourced findings, exact target URLs, up to three priorities, relevant content drafts, expected impact, realistic review points and measurement steps. The service cannot access other MCP connections, infer private metrics or edit websites.\n\nStarts the work and returns an id. It usually takes several minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "competitor_urls": {
                "description": "Optional public competitor websites. Findable checks relevance to the same buyers and market before comparing them.",
                "items": {
                  "format": "uri",
                  "maxLength": 2000,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "goals": {
                "description": "The target customer and desired customer action, when known.",
                "maxLength": 2000,
                "type": "string"
              },
              "hosting": {
                "description": "Where the client publishes the website, such as Framer, Webflow or WordPress.",
                "maxLength": 100,
                "type": "string"
              },
              "priority_urls": {
                "description": "Up to three priority pages on the client's website. These replace the automatic page selection.",
                "items": {
                  "format": "uri",
                  "maxLength": 2000,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "refresh_public_research": {
                "description": "Fetch fresh public evidence and analysis even when recent research exists, for example after website changes.",
                "type": "boolean"
              },
              "research_competitors": {
                "description": "Whether the public audit includes relevant competitor discovery and comparisons. Defaults to true.",
                "type": "boolean"
              },
              "shared_data": {
                "description": "Optional snapshots collected with the client's permission through their own tools. Snapshots contain report data rather than credentials. The audit can run without them.",
                "items": {
                  "description": "A dated, client-authorized read-only snapshot from their own connected tool or export. Findable does not inherit that connection or independently verify the snapshot.",
                  "properties": {
                    "collected_at": {
                      "format": "date-time",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                      "type": "string"
                    },
                    "end_date": {
                      "format": "date",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                      "type": "string"
                    },
                    "notes": {
                      "description": "Coverage, missing rows, indexing verdicts or citation observations. No credentials or personal customer data.",
                      "maxLength": 3000,
                      "type": "string"
                    },
                    "property": {
                      "description": "The selected property, project or domain in that provider.",
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "provider": {
                      "description": "Search Console, Semrush, Profound, analytics, or another source.",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "rows": {
                      "items": {
                        "properties": {
                          "label": {
                            "maxLength": 1000,
                            "minLength": 1,
                            "type": "string"
                          },
                          "metrics": {
                            "items": {
                              "properties": {
                                "definition": {
                                  "maxLength": 500,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "name": {
                                  "maxLength": 100,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "unit": {
                                  "maxLength": 80,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "value": {
                                  "anyOf": [
                                    {
                                      "minimum": 0,
                                      "type": "number"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                }
                              },
                              "required": ["definition", "name", "unit", "value"],
                              "type": "object"
                            },
                            "maxItems": 8,
                            "type": "array"
                          },
                          "url": {
                            "format": "uri",
                            "maxLength": 2000,
                            "type": "string"
                          }
                        },
                        "required": ["label", "metrics"],
                        "type": "object"
                      },
                      "maxItems": 50,
                      "type": "array"
                    },
                    "scope": {
                      "description": "Report, filters, country, device, search type, engine coverage, date completeness, and any unknown scope details.",
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "site": {
                      "description": "The client website this data describes.",
                      "format": "uri",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "start_date": {
                      "format": "date",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                      "type": "string"
                    },
                    "totals": {
                      "description": "Actual provider-reported totals. Partial query/page rows are not totals. Unknown values are null.",
                      "items": {
                        "properties": {
                          "definition": {
                            "maxLength": 500,
                            "minLength": 1,
                            "type": "string"
                          },
                          "name": {
                            "maxLength": 100,
                            "minLength": 1,
                            "type": "string"
                          },
                          "unit": {
                            "maxLength": 80,
                            "minLength": 1,
                            "type": "string"
                          },
                          "value": {
                            "anyOf": [
                              {
                                "minimum": 0,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          }
                        },
                        "required": ["definition", "name", "unit", "value"],
                        "type": "object"
                      },
                      "maxItems": 12,
                      "type": "array"
                    }
                  },
                  "required": ["collected_at", "end_date", "notes", "property", "provider", "rows", "scope", "site", "start_date", "totals"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "site": {
                "description": "The client's public HTTPS website, such as https://lightsource.ai/.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a Website SEO/AEO audit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca1c894fa713cc49ad433cb4f618ab6bcb7b51c59f563fd5cb0fc58f5b8451aa"
        }
      ],
      "digest": "sha256:380f2d74195f4674b290cd5c276f65ea2424f2388063d78f0031acea220fc531"
    }
  }
}
