        {
          "name": "prescan_site",
          "title": "Quick pre-scan of a website",
          "description": "Start a quick, anonymous pre-scan of a public website's home page: HTTP headers and HTML only, no real browser. Returns a preScanId to pass to get_prescan_result and a link to the report on cookieinspector.com. CookieInspector works alongside any consent platform; it checks what the banner actually does. Technical findings, not legal advice.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The website to check, e.g. example.com or https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Quick pre-scan of a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12ed6fb9121e3aea282e5ea63bc586cb5cb4d0395330f7e66e5172c717540f33"
        },
        {
          "name": "start_scan",
          "title": "Start a full scan",
          "description": "Start a full CookieInspector scan with a real browser (before and after the consent click, up to 5 pages) on the connected account. Optional region: main (US East), us-west, eu-de (Germany, for EU-targeted banners). Uses the plan's monthly scans. Returns a scanId to poll with get_scan_status, then get_scan_summary. Technical findings, not legal advice.",
          "inputSchema": {
            "properties": {
              "evaluateCcpa": {
                "default": null,
                "description": "Also evaluate CCPA/CPRA (California). Default true.",
                "type": ["boolean", "null"]
              },
              "region": {
                "default": null,
                "description": "Scan location: main, us-west or eu-de",
                "type": ["string", "null"]
              },
              "url": {
                "description": "The website to scan, absolute, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Start a full scan"
