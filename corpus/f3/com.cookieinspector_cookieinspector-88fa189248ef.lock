        },
        {
          "name": "get_prescan_result",
          "title": "Pre-scan result",
          "description": "Return the result of a pre-scan started with prescan_site: riskScore (0 best, 100 worst, the same scale as the full report), risk level, how many cookies load before consent, up to five trackers by name, the consent platform and its confidence, Google Consent Mode status, three findings, and the report link. This is a header-and-HTML pre-scan, single page; the full scan with a real browser, evidence and fix guide requires a CookieInspector account. Technical findings, not legal advice.",
          "inputSchema": {
            "properties": {
              "preScanId": {
                "description": "The preScanId returned by prescan_site",
                "type": "string"
              }
            },
            "required": ["preScanId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Pre-scan result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
