          "title": "Scan status",
          "description": "Status of a scan on the connected account: queued, running, completed or failed, with the riskScore (0 best, 100 worst) once done. Technical findings, not legal advice.",
          "inputSchema": {
            "properties": {
              "scanId": {
                "description": "The scanId returned by start_scan or list_scans",
