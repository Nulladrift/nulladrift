        {
          "name": "list_scans",
          "title": "List recent scans",
          "description": "The most recent scans on the connected account, newest first (up to 20), each with its riskScore (0 best, 100 worst). Technical findings, not legal advice.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": null,
                "description": "How many to return, 1 to 20. Default 10.",
                "type": ["integer", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
