      "serverInfo": {
        "name": "CookieInspector",
        "title": "CookieInspector",
        "version": "1.0.0",
        "description": "Check what a site's cookie banner really blocks: CMP, trackers, cookies before consent.",
        "websiteUrl": "https://www.cookieinspector.com/developers/mcp"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "tools": [
        {
          "name": "explain_finding",
          "title": "Explain a finding or a consent platform",
          "description": "Explain a CookieInspector finding code (e.g. THIRD_PARTY_PRE_CONSENT) or what to check in a named consent platform (e.g. Cookiebot). No network call. Technical findings, not legal advice.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "A finding code from a report, such as COOKIES_BEFORE_CONSENT, or a consent platform name such as OneTrust",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a finding or a consent platform"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4564035a437de8b37c9c375419ca68dbad652a77e04c20834bca3e0bfa51c86b"
        },
        {
          "name": "get_capabilities",
          "title": "What CookieInspector can do here",
          "description": "Describe what CookieInspector checks on a website (cookies and trackers before and after the consent click, banner behaviour, consent platform, Google Consent Mode), which tools work without an account, which need a CookieInspector API key, and the quotas. Call this first when unsure which tool to use. Technical findings, not legal advice.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What CookieInspector can do here"
