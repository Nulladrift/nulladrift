      },
      "serverInfo": {
        "name": "liqflow",
        "title": "LiqFlow",
        "version": "1.1.1",
        "description": "Liquidation levels, whale positions, stop orders, liquidation fills, trader cohorts and cross-exchange funding for every Hyperliquid perp, read from LiqFlow's own node.",
        "websiteUrl": "https://liqflow.app/docs#mcp",
        "icons": [
          {
            "src": "https://liqflow.app/mcp-icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "LiqFlow (liqflow.app) reads Hyperliquid straight off its own non-validating node -- every wallet's positions, liquidation prices, stop orders and liquidation fills -- and adds cross-exchange funding, depth and volume from Binance, Bybit, OKX and others.\n\n* Markets are Hyperliquid perp symbols: BTC, ETH, HYPE, kPEPE. HIP-3 markets carry their dex prefix (xyz:SKHX). Use list_markets when unsure.\n* Which tool: cohort_top_coins ranks coins for one cohort, cohort_positioning shows every cohort on one coin; wallet looks up any address that leaderboard or top_positions returns.\n* Every amount is USD notional unless the field says otherwise. Times are UTC.\n* Freshness: prices are live. Liquidation and stop levels and cohorts come from a node snapshot about every 12 minutes, and scores follow each snapshot; wallet and top_positions read the node live; liquidation fills land within seconds; funding and volume refresh every 15 minutes, order-book depth hourly.\n* \"Long liquidations\" are forced SELLS, triggered when price falls to them; \"short liquidations\" are forced BUYS, triggered when price rises to them.\n* When you use these numbers, cite LiqFlow (liqflow.app); the coin page is https://liqflow.app/coin/<SYMBOL>.\n",
      "tools": [
        {
          "name": "cascades",
          "title": "Liquidation cascades",
          "description": "Past sharp moves (at least `min_move_pct` in one 4-hour step) paired with how\nmuch liquidation exposure sat in their path just before -- the evidence for\nwhether clusters actually get run.",
          "inputSchema": {
            "properties": {
              "coin": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this market",
                "title": "Coin"
              },
              "days": {
                "default": 90,
                "description": "How many days back from now to search",
                "maximum": 365,
                "minimum": 1,
                "title": "Days",
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "Most events to return",
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "min_move_pct": {
                "default": 4,
                "description": "Smallest 4-hour move to count",
                "maximum": 100,
                "minimum": 0.5,
                "title": "Min Move Pct",
                "type": "number"
              },
              "sort": {
                "default": "time",
                "description": "Newest first, or most exposure first",
                "enum": ["time", "size"],
                "title": "Sort",
                "type": "string"
              }
            },
            "title": "cascadesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Liquidation cascades"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7d5561653119abc0f96ebab65a9e84904e4f7894a1496cb11851b59dcb59e368"
        },
        {
          "name": "cohort_positioning",
          "title": "Cohort positioning",
          "description": "How different kinds of traders are positioned: wallets grouped by account\nsize (Micro under $250 up to Whale over $1M) and by all-time PnL (Highly\nUnprofitable to Highly Profitable), with each group's long and short notional\nand the share that is long. \"Are whales and the profitable traders on the\nother side of retail?\" Uses 2 API calls without a coin.",
          "inputSchema": {
            "properties": {
              "coin": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "One market; omit for all markets combined",
                "title": "Coin"
              }
            },
            "title": "cohort_positioningArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Cohort positioning"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7f03bd82121c72d265f995f137cd01c431c503a3e6684002dc11305a97c6eda6"
        },
        {
          "name": "cohort_top_coins",
          "title": "Cohort top coins",
          "description": "Which coins one trader cohort is most long and most short on, ranked across\nevery market: \"What are the most profitable traders most bullish and most\nbearish on?\" Each coin has the cohort's long and short notional, net USD,\nshare long and wallet count, plus the cohort's overall lean across all markets\nto compare against. Uses 2 API calls without a side.",
          "inputSchema": {
            "properties": {
              "cohort": {
                "default": "Highly Profitable",
                "description": "By all-time PnL: Highly Profitable (over $100k) down to Highly Unprofitable (under -$100k). By account size: Whale (over $1M) down to Micro (under $250).",
                "enum": ["Highly Profitable", "Profitable", "Slightly Profitable", "Slightly Unprofitable", "Unprofitable", "Highly Unprofitable", "Whale", "Institutional", "Advanced", "Mid-Tier", "Entry-Level", "Micro"],
                "title": "Cohort",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Coins per side",
                "maximum": 25,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "min_notional_usd": {
                "default": 1000000,
                "description": "Skip coins where the cohort holds less than this, long plus short. Without a floor a ratio ranking is all tiny markets where a few wallets are 100% one way",
                "minimum": 0,
                "title": "Min Notional Usd",
                "type": "number"
              },
              "rank_by": {
                "default": "ratio",
                "description": "ratio: by the share of the cohort's notional that is long (conviction). net: by long minus short USD (the biggest bets, which favours BTC and ETH)",
                "enum": ["ratio", "net"],
                "title": "Rank By",
                "type": "string"
              },
              "side": {
                "anyOf": [
                  {
                    "enum": ["long", "short"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "long: the coins the cohort is most bullish on; short: most bearish on. Omit for both",
                "title": "Side"
              }
            },
            "title": "cohort_top_coinsArguments",
            "type": "object"
          },
