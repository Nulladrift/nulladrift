          "name": "submit_drill_answer",
          "title": "Grade a drill answer",
          "description": "Submit one option id for a Quant Daily drill. Returns whether it is right or wrong and how many attempts remain. A wrong guess does not name the correct option. When the round finishes, returns a Verified answer and the worked explanation. Today's shared drill also says whether this conversation solved in fewer attempts than other conversations that finished that same drill. That line is attempts used, not time; the ranking is anonymous and is not the public website leaderboard. Dev, staging, and test conversations are not in the count. A correct answer adds a link to practice the full timed set. Three attempts per conversation, not per person.",
