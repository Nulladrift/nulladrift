      "instructions": "Grades today's Quant Daily drill for GRE Quantitative Reasoning and GMAT quant practice. Every conversation gets the same checked question. Call the tools; do not write a substitute question or state the option. Attempts are counted per conversation, not per person. Reuse the attemptId. A wrong guess is only right or wrong. The verified answer is returned only after the round finishes. English only; lang hi is rejected.",
