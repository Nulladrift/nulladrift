{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/usage-bill-reconstructor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp-factory.bowling-anthony.workers.dev/usage-bill-reconstructor/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.mcpscores/usage-bill-reconstructor",
        "title": "Usage Bill Reconstructor",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Recomputes a usage-based bill from a customer-supplied tariff (graduated per-meter tiers, optional included allowances, optional fixed charges) and aggregated metered usage, using exact decimal arithmetic. Does not fetch or embed any vendor pricing; it only applies the rules the caller provides, and checks the result against an optional supplied invoice total. Tool calls cost 0.05 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Pure computation only: never fetches vendor data and asserts nothing about any real vendor's actual pricing. Trusts the tariff and usage figures supplied by the caller; does not verify them against any account or provider. Excludes tax, foreign-exchange conversion, and calendar-based proration unless the caller encodes them as fixed_charges. Distinguishes \"calculation under supplied rules\" from \"account bill verification\": a match against invoice_total only means the supplied rules reproduce that total, not that the rules or invoice are correct. Bounded input: 128KiB serialized, 100 meters, 20 tiers per meter, 100 fixed charges, 15 integer digits per numeric field. All monetary and quantity fields must be plain nonnegative decimal strings (no exponents, no negative values); precision beyond the contract is rejected, never silently rounded. Results at most 96 KiB; retry identical input and authorization within 24 hours to recover a purchase.",
      "tools": [
        {
          "name": "usage_bill_reconstructor",
          "description": "Recomputes a usage-based bill from a customer-supplied tariff (graduated per-meter tiers, optional included allowances, optional fixed charges) and aggregated metered usage, using exact decimal arithmetic. Does not fetch or embed any vendor pricing; it only applies the rules the caller provides, and checks the result against an optional supplied invoice total. Price: 0.05 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "pattern": "^[A-Za-z0-9]{1,10}$",
                "type": "string"
              },
              "fixed_charges": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "nonnegative decimal, <=9 fractional digits",
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "id"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "invoice_total": {
                "description": "nonnegative decimal, at most minor_unit_digits fractional digits; never rounded",
                "type": "string"
              },
              "meters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "included_quantity": {
                      "description": "nonnegative decimal, <=6 fractional digits",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "nonnegative decimal, <=6 fractional digits",
                      "type": "string"
                    },
                    "tiers": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "unit_price": {
                            "description": "nonnegative decimal, <=9 fractional digits",
                            "type": "string"
                          },
                          "up_to": {
                            "description": "nonnegative decimal or null for the final unlimited tier",
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["unit_price", "up_to"],
                        "type": "object"
                      },
                      "maxItems": 20,
                      "minItems": 1,
                      "type": "array"
                    }
                  },
                  "required": ["id", "quantity", "tiers"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "minor_unit_digits": {
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["currency", "meters", "minor_unit_digits"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6392a0d4c00d49dd0ac92c71e63a0bb9ec4f7214e72b0246bc23968192f2b86"
        }
      ],
      "digest": "sha256:eb8d08af8a51dee64a668f59df6811f92fe38edffceea4a3a44c28d99ee33e7b"
    }
  }
}
