      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call smart_money_bias with a Hyperliquid perp ticker (BTC, ETH, SOL, HYPE...) to see whether the top-120 30-day-PnL Hyperliquid cohort is long or short it right now. Notional, flows, liquidation price bands, top positions, scans and wallet profiles are on the paid x402 routes. Cohort answers never include full account addresses (truncated to 0x1234…abcd) and liquidation data is only given as aggregated price bands. Public on-chain data only; do not use it to target or harass account holders. Not financial advice.",
      "tools": [
        {
          "name": "smart_money_bias",
          "title": "Hyperliquid smart-money bias (free preview)",
          "description": "Is the smart money long or short this coin? For a Hyperliquid perp ticker, returns how a rules-based cohort of the 120 Hyperliquid accounts with the highest 30-day PnL (public leaderboard) is positioned right now: bias (strong long / lean long / mixed / lean short / strong short), cohort traders long vs short, snapshot age and coverage. Free preview tier. The paid x402 routes add notional and 1h/24h flows (/v1/lite), entries, leverage, liquidation price bands and top positions with truncated addresses (/v1/coin), a market-wide scan (/v1/scan) and live profiles of an account you supply (/v1/wallet). No full addresses or per-account liquidation prices. Read-only analytics on public data; not financial advice.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Hyperliquid perp ticker, e.g. BTC, ETH, SOL, HYPE, kPEPE (BTC-PERP, ETH-USD, SOLUSDT accepted)",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
