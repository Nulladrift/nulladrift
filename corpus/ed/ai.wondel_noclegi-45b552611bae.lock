        "name": "Noclegi",
        "title": "Noclegi MCP",
        "version": "1.0.0",
        "description": "Stays in Poland on noclegi.pl: hotels, guest houses, apartments, cottages, total prices for dates.",
        "websiteUrl": "https://mcps.wondel.ai/servers/noclegi/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Noclegi.pl (https://noclegi.pl) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "noclegi_object",
          "title": "Get one noclegi.pl property",
          "description": "Full details of one place to stay on noclegi.pl: description, address and coordinates, guest rating and recent reviews, check-in/check-out times, amenities, photos, and every room type with its size, beds, amenities and — for given dates and guests — its rate plans (price for the stay, board, cancellation terms, prepayment). With checkin/checkout it also returns the total price of the cheapest room combination for the guests and the booking link; without dates, `price_from` is the site's best 1-night price in the next ~90 days and the night it applies to. When the dates cannot be booked (sold out, minimum stay) `price` is null and the note carries the site's reason. noclegi.pl does not publish the property's own phone or email — bookings go through the site. Fetched live from noclegi.pl (typically ~1 s via direct fetch; up to ~20 s when it falls back to an unblocker). Result: { source, fetchedAt, query, page_url, object: { id, slug, url, name, type, stars, description, address, geo, rating, rating_count, checkin_time, checkout_time, breadcrumbs, amenities, photos, reviews, stay, price, price_before_discount, discount_percent, currency, price_for, prepayment, selected_rooms, price_from, availability_note, booking_url, rooms: [{ id, name, available_rooms, max_guests, area_m2, beds, amenities, rates: [{ price, price_before_discount, discount_percent, board, price_for, cancellation, prepayment, bookable }] }] }, note? }. Prices in PLN incl. taxes and fees.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Adults. Default 2.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "Arrival date, YYYY-MM-DD (from today to about a year ahead). Pass together with checkout; omit both for undated results.",
                "type": "string"
              },
              "checkout": {
                "description": "Departure date, YYYY-MM-DD, after checkin — at most 30 nights (the site drops longer stays).",
                "type": "string"
              },
              "children_ages": {
                "description": "Each child's age in years (0–17), e.g. [4, 9] for two children — prices depend on ages. Default none.",
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": -9007199254740991,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
              },
              "object": {
                "description": "The property: its `slug` from noclegi_search (e.g. 'apartamenty-apartart-zakopane'), its https://noclegi.pl/<slug> link, or its name (looked up through the site's search).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["object"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5abdd81bb248214988dbd1cd662118b7d46a5352ac973fe630615834dcf16bb"
        },
        {
          "name": "noclegi_search",
          "title": "Search accommodation in Poland (noclegi.pl)",
          "description": "Search places to stay in a Polish town or region on noclegi.pl — hotels, guest houses, pensions, apartments, cottages, private rooms, agritourism — with the price for the whole stay, board, guest rating, location and link. Filter by property type, board, minimum rating, free cancellation and total price; sort by price, rating or discount. One results page is up to 50 offers; pass a listing's `slug` to noclegi_object for rooms, rate plans, amenities and the description. Fetched live from noclegi.pl (typically ~1 s via direct fetch; up to ~20 s when it falls back to an unblocker). WITH checkin + checkout, each `price` is the total for the whole stay for the given guests in PLN, incl. taxes and fees (e.g. price_for '2 osoby, 2 noce'); sold-out offers stay listed with price null and available false. WITHOUT dates, `price` is only the site's indicative price for 1 night (price_for '2 osoby, 1 noc'), many offers have none, and the result carries a `note` saying so — pass dates to quote a stay. Result shape: { source, fetchedAt, query, search_url, place: { name, slug, kind, area }, heading, stay: { checkin, checkout, nights } | null, guests: { adults, children_ages }, total_count, page, total_pages, count, listings: [...], note? } — the list key is `listings`; `total_count` counts offers across all pages (use `page` for more). Each listing: { id, slug, url, name, type, stars, city, price, price_before_discount, discount_percent, currency, price_for, board, available, free_cancellation, rating, rating_count, rating_label, lat, lng, image, amenities, labels }. `board` is room_only | breakfast | half_board | full_board | …; `rating` is 0–10; `free_cancellation` is the site's deadline text (Polish) or null; `url` opens the property with the same stay. When a place has few offers the site widens to a radius (the note says so; check `city`). An empty match answers count: 0 with a `note` saying why and what to change — that is a successful result, not an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Adults. Default 2.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "board": {
                "description": "Only offers with this board: room_only, breakfast, half_board, full_board, soft_all_inclusive, all_inclusive.",
                "enum": ["room_only", "breakfast", "half_board", "full_board", "soft_all_inclusive", "all_inclusive"],
                "type": "string"
              },
              "checkin": {
                "description": "Arrival date, YYYY-MM-DD (from today to about a year ahead). Pass together with checkout; omit both for undated results.",
                "type": "string"
              },
              "checkout": {
                "description": "Departure date, YYYY-MM-DD, after checkin — at most 30 nights (the site drops longer stays).",
                "type": "string"
              },
              "children_ages": {
                "description": "Each child's age in years (0–17), e.g. [4, 9] for two children — prices depend on ages. Default none.",
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": -9007199254740991,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "free_cancellation": {
                "description": "Only offers that can be cancelled free of charge.",
                "type": "boolean"
              },
              "min_rating": {
                "anyOf": [
                  {
                    "const": 8,
                    "type": "number"
                  },
                  {
                    "const": 9,
                    "type": "number"
                  },
                  {
                    "const": 9.5,
                    "type": "number"
                  }
                ],
                "description": "Only guest ratings of at least 8, 9 or 9.5 (0–10 scale)."
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
              },
              "page": {
                "description": "Results page, 1-based (up to 50 offers per page). Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "Town or region in Poland, Polish name preferred: 'Zakopane', 'Szklarska Poręba', 'Białka Tatrzańska', 'Mazury', 'Tatry', 'Polskie morze', 'Bieszczady'. Resolved through noclegi.pl's own place search (diacritics optional; a few English names such as 'Warsaw' or 'Baltic coast' are mapped). A https://noclegi.pl/<place> link also works.",
                "minLength": 1,
                "type": "string"
              },
              "price_max": {
                "description": "Maximum total price for the whole stay, whole PLN (needs checkin/checkout).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "price_min": {
                "description": "Minimum total price for the whole stay, whole PLN (needs checkin/checkout).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "description": "Order: recommended (default — the site's own ranking, which may depend on commission), rating, price_asc / price_desc (by price per person per night), discount.",
                "enum": ["recommended", "rating", "price_asc", "price_desc", "discount"],
                "type": "string"
              },
              "types": {
                "description": "Only these property types (any of them): hotel, apartment, guest_house (dom gościnny), pension (pensjonat), villa (willa), private_room (kwatera prywatna), wooden_cottage (domek drewniany), year_round_cottage (domek całoroczny), resort (ośrodek wypoczynkowy), agritourism, inn (zajazd), hostel, student_house, sanatorium.",
