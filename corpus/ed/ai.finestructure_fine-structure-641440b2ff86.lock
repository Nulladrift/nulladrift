                  "type": "string"
                },
                "type": "array"
              },
              "body": {
                "description": "Free text, markdown allowed: context, impact, what you tried",
                "type": "string"
              },
              "expected": {
                "description": "What should have happened",
                "type": "string"
              },
              "reproduction": {
                "description": "Steps, invoke_function calls or curl commands that reproduce it",
                "type": "string"
              },
              "severity": {
                "default": "normal",
                "enum": ["blocker", "high", "normal", "low"],
                "type": "string"
              },
              "title": {
                "description": "One line, what is wrong or missing",
                "type": "string"
              },
              "type": {
                "enum": ["bug", "feature", "question"],
                "type": "string"
              }
