                "description": "For trigger_type schedule or watch: the same shape as in schedule_agent_task, e.g. {\"type\":\"daily\",\"time\":\"08:30\",\"timezone\":\"Asia/Jerusalem\"}.",
                "type": "object"
              },
              "source": {
