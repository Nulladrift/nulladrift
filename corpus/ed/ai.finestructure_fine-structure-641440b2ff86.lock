        {
          "name": "schedule_agent_task",
          "title": "Schedule Agent Task",
          "description": "Create a scheduled task for one of the user's agents. Supported schedule types: once (run_at ISO local time + timezone), interval (interval_minutes 5-1440), hourly, daily (time HH:MM + timezone), weekly (time + timezone + days_of_week 0=Sunday..6), cron (5-field expression + timezone), manual (only runs on demand). Returns the normalized schedule and the computed next_run_at so you can read the fire time back to the user in their timezone. For 'tell me when a new X comes in' (a lead, an order, a signup, any record of an app entity) do not poll with a plain interval: set watch, and the task costs nothing until a new record arrives.",
          "inputSchema": {
            "properties": {
              "activate": {
                "default": true,
                "description": "Start the schedule immediately (true) or save as draft (false)",
                "type": "boolean"
              },
              "agent_id": {
                "description": "The agent id (from create_agent or list_agents)",
                "type": "string"
              },
              "instructions": {
                "description": "What the agent should do on each run, written as instructions to the agent",
                "type": "string"
              },
              "max_runs": {
                "default": 0,
                "description": "Optional cap on total runs (0 = unlimited)",
                "type": "integer"
              },
              "schedule": {
                "description": "Schedule object, e.g. {\"type\":\"daily\",\"time\":\"08:30\",\"timezone\":\"Asia/Jerusalem\"} or {\"type\":\"weekly\",\"time\":\"09:00\",\"timezone\":\"Asia/Jerusalem\",\"days_of_week\":[0]} or {\"type\":\"once\",\"run_at\":\"2026-08-20T09:00\",\"timezone\":\"Asia/Jerusalem\"}",
                "type": "object"
              },
              "title": {
                "description": "Short task title",
                "type": "string"
              },
              "watch": {
                "description": "Run the task only when a record is new, e.g. {\"provider\":\"app_records\",\"app_id\":\"<app id>\",\"entity\":\"Lead\"} with an interval schedule. The platform checks each interval with no model call and no credits, and starts the agent only when a record arrived, with those records in hand. Works for any entity of the user's own apps. Optional: where (exact field values such as {\"status\":\"new\"}), include_existing (also act on the records already there).",
                "type": "object"
              }
            },
            "required": ["agent_id", "instructions", "schedule", "title"],
            "type": "object"
          },
