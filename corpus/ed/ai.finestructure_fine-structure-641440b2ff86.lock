        {
          "name": "set_function_policy",
          "title": "Set Function Policy",
          "description": "Create or update the server-owned access policy of a backend function (functions/<name>.js). Without a policy a function answers only to the app owner's Studio token (401 for app visitors and webhooks). Recipes: anonymous checkout step or inbound webhook/IPN -> require_auth=false; signed-in members -> require_auth=true + allowed_roles (e.g. ['authenticated'] or ['admin','staff']); webhook with a shared secret -> require_secret=true + secret_name (an app secret) that the caller sends in secret_header. allowed_hosts fences the function's outbound network to those hosts plus the platform backend; omit it for open egress.",
          "inputSchema": {
            "properties": {
              "allowed_hosts": {
                "description": "Outbound egress allow-list of host[:port] entries, e.g. ['api.takbull.co.il']. Omit to keep the stored list; pass [] to open egress again",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "allowed_roles": {
                "default": [],
                "description": "App roles allowed when require_auth is true; 'authenticated' = any signed-in app member",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "app_id": {
                "description": "The app ID",
                "type": "string"
              },
              "function": {
                "description": "Function name, e.g. takbull_create (file functions/takbull_create.js)",
                "type": "string"
              },
              "require_auth": {
                "default": true,
                "description": "false = anonymous visitors and external callers may invoke",
                "type": "boolean"
              },
              "require_secret": {
                "default": false,
                "description": "Caller must send a shared secret header (webhooks)",
                "type": "boolean"
              },
              "sdk_identity": {
                "description": "Whose identity the SDK inside the function uses. 'caller' (default): the function reads data as whoever called it, so an anonymous call sees only what anonymous may read. 'app': the SDK acts as the app owner on THIS app's entities (a checkout or payment IPN that must load/update orders whose read policy is owner/admin/staff); the caller still counts as anonymous for rate limits, audit and X-FSe2-Caller-Type. Owner-only. Omit to keep the stored value",
                "enum": ["caller", "app"],
                "type": "string"
              },
              "secret_header": {
                "default": "x-fse2-secret",
                "description": "Header the caller sends the shared secret in",
                "type": "string"
              },
              "secret_name": {
                "default": "",
                "description": "Name of the app secret holding the shared value (set_secret)",
                "type": "string"
              }
            },
            "required": ["app_id", "function", "require_auth"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set Function Policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["security:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:3b50eb309955e06255850eef0084e7a2cd3f70685465fba16497c769542db512"
