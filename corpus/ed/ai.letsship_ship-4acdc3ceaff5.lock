                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "required": ["action", "description", "docsUrl", "id", "reached", "status", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "reachedCount": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "title": {
                      "type": "string"
                    },
                    "totalCount": {
                      "minimum": 0,
