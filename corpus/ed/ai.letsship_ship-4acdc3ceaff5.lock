          },
          "digest": "sha256:14a3c71b3aae5ea3b9e09af34267c23704067a152a6939b7c7aa2faf56284821"
        },
        {
          "name": "merge_mission",
          "title": "Merge a mission's pull request",
          "description": "Merge the mission's open pull request on GitHub with the repository's own merge method; the mission then becomes done, and the merge cannot be undone from here. When the branch is out of date with its base, answers 202 with status 'updating_branch' and a message: SHIP updates the branch and merges once CI passes, with no further call. Answers 409 with the reason for any other blocker (missing reviews, failing checks, another branch protection). On a merge conflict SHIP starts the builder to fix it and merges once the mission is ready again, with no further call. Requires the missions:write scope.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "issueId": {
                "description": "The mission's issue id: a Linear key or a GitHub Issues id, e.g. SHIP-412",
                "type": "string"
              }
            },
            "required": ["issueId"],
            "type": "object"
          },
          "annotations": {
