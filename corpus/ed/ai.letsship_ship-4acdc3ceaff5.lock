        {
          "name": "get_project_transfer",
          "title": "Get project transfer",
          "description": "Read the transfer of a project's repository to the person's GitHub account: its state, what the person does next, where the repository goes, and when SHIP deletes its archived copy. This tool only reads: SHIP moves the transfer on by itself. The result gives the next step in action: choose_target means the person makes an empty repository on their own GitHub account, installs SHIP's GitHub App on it, and you call transfer_project_repository again with that connection's connectorId and the repository as owner/name. wait means SHIP copies and checks the repository: read the transfer with get_project_transfer after pollAfterSeconds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "projectId": {
                "description": "Project id from list_projects",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["projectId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "action": {
                "description": "What the founder does next: name their empty repository with SHIP's GitHub App installed on it, or wait while SHIP copies and checks it.",
                "enum": ["choose_target", "wait", null],
                "type": ["string", "null"]
              },
              "checkedAt": {
                "type": ["integer", "null"]
              },
              "choices": {
                "items": {
                  "properties": {
                    "connectorId": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["connectorId", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "completedAt": {
                "type": ["integer", "null"]
              },
              "createdAt": {
                "type": "integer"
              },
              "deleteAfter": {
                "type": ["integer", "null"]
              },
              "failure": {
                "properties": {
                  "category": {
                    "enum": ["auth", "rate_limit", "timeout", "validation", "infrastructure", "agent", "unknown"],
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "retryable": {
                    "type": "boolean"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["category", "description", "retryable", "title"],
                "type": ["object", "null"]
              },
              "id": {
                "type": "string"
              },
              "pollAfterSeconds": {
                "type": ["integer", "null"]
              },
              "projectId": {
                "type": "string"
              },
              "repository": {
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              },
              "state": {
                "description": "`requested` before SHIP checks anything. `awaiting_target` while the founder must name their own empty repository. `mirroring` while SHIP copies every branch and tag into it, and `verifying` while SHIP checks that each one has the same commit. `repointed` when the project uses the founder's repository. `archived` when SHIP's own copy is read-only and waits for its delete, and `done` after the delete. `failed` gives the cause in `failure`. `cancelled` when the founder stopped it before the repoint.",
                "enum": ["requested", "awaiting_target", "mirroring", "verifying", "repointed", "archived", "done", "failed", "cancelled"],
                "type": "string"
              },
              "updatedAt": {
                "type": "integer"
              },
              "version": {
                "type": "integer"
              }
            },
            "required": ["action", "checkedAt", "choices", "completedAt", "createdAt", "deleteAfter", "failure", "id", "pollAfterSeconds", "projectId", "repository", "state", "updatedAt", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get project transfer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
