        {
          "name": "bind_mcp_server",
          "title": "Bind an MCP server",
          "description": "Create or update the binding for a server the repository declares. roles is the full set of pipeline roles that may use it (reviewer and qa only ever receive read-only tools, and cannot use a server that runs inside the sandbox). transport: 'remote' (the gateway proxies to the server's URL), 'isolate' (the gateway runs the server's npm package in isolation, for a command that needs a secret) or 'local' (the command runs inside the sandbox, no credential). Omit transport and remoteUrl on an update to keep the server the binding is pinned to, with its credential (a roles, tools or credential edit); set them only to bind or re-point the server. Requires the config:write capability.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "approvedTools": {
                "description": "The approved subset of the tool snapshot (refresh_mcp_server_tools first). Omit to keep it.",
                "items": {
                  "properties": {
                    "attestedReadOnly": {
                      "description": "Owner attestation that an UNANNOTATED tool only reads; lets reviewer and qa use it",
                      "type": "boolean"
                    },
                    "name": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "credential": {
                "description": "Write-only credential the gateway attaches; agents never receive it. Omit to keep the stored one. OAuth credentials are not set here: bind as remote with kind 'none', then start_mcp_server_oauth.",
                "oneOf": [
                  {
                    "properties": {
                      "kind": {
                        "const": "none",
                        "type": "string"
                      }
                    },
                    "required": ["kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "headers": {
                        "additionalProperties": {
                          "maxLength": 4096,
                          "minLength": 1,
                          "type": "string"
                        },
                        "description": "Header name to value, 1-10 entries, e.g. { Authorization: 'Bearer ...' }. Remote servers only.",
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "kind": {
                        "const": "headers",
                        "type": "string"
                      }
                    },
                    "required": ["headers", "kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "allowedHosts": {
                        "description": "Exact hostnames the isolated server may reach; the credential can go nowhere else.",
                        "items": {
                          "maxLength": 253,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "minItems": 1,
                        "type": "array"
                      },
                      "env": {
                        "additionalProperties": {
                          "maxLength": 4096,
                          "minLength": 1,
                          "type": "string"
                        },
                        "description": "Environment variable to value, 1-20 entries. Isolated servers only.",
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "kind": {
                        "const": "isolate-env",
                        "type": "string"
                      }
                    },
                    "required": ["allowedHosts", "env", "kind"],
                    "type": "object"
                  }
                ]
              },
              "projectId": {
                "description": "Project id, e.g. from list_projects",
                "minLength": 1,
                "type": "string"
              },
              "remoteUrl": {
                "description": "A fixed https URL: a hosted endpoint for a command server, or an override for a URL server",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "roles": {
                "description": "Every role that may use the server ([] disables it)",
                "items": {
                  "enum": ["planner", "builder", "reviewer", "qa"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "serverName": {
                "description": "Server name as the repository's MCP file declares it (see list_mcp_servers)",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$",
                "type": "string"
              },
              "transport": {
                "type": "string",
                "description": "How the gateway reaches the server: 'remote' proxies to remoteUrl, 'isolate' runs the server's npm package away from the sandbox so a secret stays out of it, and 'local' runs the command inside the sandbox with no credential. Omit it on an update to keep the server the binding is pinned to.",
                "enum": ["remote", "isolate", "local"]
              }
            },
            "required": ["projectId", "roles", "serverName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Bind an MCP server"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d0cba9a407d45514557caa78e7ff4f676ff86d33c8e673d3f4323d1ae6b715ff"
        },
