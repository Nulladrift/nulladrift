      },
      "instructions": "SHIP runs a team of AI coding agents (planner, builder, reviewer, QA) on the user's own GitHub repository. Each mission takes one issue to a pull request that passed CI, a code review and a test of its acceptance criteria.\nStart with whoami (who you act as, the workspace and the token's scopes) or list_projects (the project ids that mission calls need).\nMission lifecycle:\n- start_mission runs an issue that already exists in the tracker; create_mission files the issue and starts it in one call.\n- A mission runs for tens of minutes. To wait on one of its agent runs, call watch_agent_run, not a poll: it returns when the run ends or its stage changes. Read get_mission between runs. inspect_mission has the full record when one fails.\n- To change what a mission does, or to answer its review, call send_mission_instruction. Never call start_mission again to send feedback: call it again only to restart a mission that ended or needs attention.\nCredits: start_mission, create_mission and run_scheduled_task each start a mission, and every started mission spends workspace credits. Read get_billing before you start work for someone. Instructions to a mission that is already open are free.\nHandles are stable: an issue id (SHIP-123, WEB-42) and a project id name the same mission and project across calls and conversations. Keep them instead of searching again.\nA refusal that names a missing scope means this token cannot do that action. Ask the person to grant the scope; do not retry.",
      "tools": [
        {
          "name": "activate_sandbox_template_version",
          "title": "Roll a sandbox back (or forward) to a version",
          "description": "Make a version the one missions use from their next dispatch. It is rebuilt only if its snapshot is gone; the response says which.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
