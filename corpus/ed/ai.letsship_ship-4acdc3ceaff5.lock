        {
          "name": "create_mission",
          "title": "Create a mission",
          "description": "Create the tracker issue AND start the run in one call, for work that has no issue yet. Pass entryStartAt='builder' with an entryPlan to hand over a plan you already wrote; pass entryStartAt='reviewer'/'qa' with entryPrNumber to hand over an existing build — in which case title may be omitted and the pull request's own title names the mission. For the first mission of a SHIP Sites project, pass starter (website, blog, docs or waitlist) and site, the shared form, in place of title and description: SHIP writes the issue, or a mission with no issue on a project SHIP made with Start from scratch, and holds the site address. Read list_site_starters first. This tool calls the SHIP API, documented at https://letsship.ai/docs/api. Requires the missions:run token scope.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agents": {
                "additionalProperties": false,
                "description": "Per-role harness/model override for THIS mission only; overrides ship.yml without changing it",
                "properties": {
                  "builder": {
                    "additionalProperties": false,
                    "properties": {
                      "harness": {
                        "enum": ["claude-code", "codex", "pi", "kilo-code", "open-code"],
                        "type": "string"
                      },
                      "model": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "planner": {
                    "additionalProperties": false,
                    "properties": {
                      "harness": {
                        "enum": ["claude-code", "codex", "pi", "kilo-code", "open-code"],
                        "type": "string"
                      },
                      "model": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "qa": {
                    "additionalProperties": false,
                    "properties": {
                      "harness": {
                        "enum": ["claude-code", "codex", "pi", "kilo-code", "open-code"],
                        "type": "string"
                      },
                      "model": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "reviewer": {
                    "additionalProperties": false,
                    "properties": {
                      "harness": {
                        "enum": ["claude-code", "codex", "pi", "kilo-code", "open-code"],
                        "type": "string"
                      },
                      "model": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "description": {
                "description": "Issue body; acceptance criteria written here are parsed as they would be on any issue",
                "maxLength": 10000,
                "type": "string"
              },
              "entryPlan": {
                "description": "Hand-off plan markdown, for entryStartAt='builder'",
                "type": "string"
              },
              "entryPrNumber": {
                "description": "Existing open PR number, required for entryStartAt='reviewer' or 'qa'",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "entryStartAt": {
                "description": "Pipeline stage to enter at; omit for the default full run starting at the planner",
                "enum": ["builder", "reviewer", "qa"],
                "type": "string"
              },
              "labels": {
                "description": "Tracker labels to apply",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "projectId": {
                "description": "Project id the mission belongs to",
                "type": "string"
              },
              "site": {
                "description": "The form of a site starter. Required with starter; leave out title, description, labels and entry",
                "properties": {
                  "audience": {
                    "description": "website and waitlist: the main audience",
                    "type": "string"
                  },
                  "author": {
                    "description": "blog: the author of the first post",
                    "type": "string"
                  },
                  "brand": {
                    "description": "Where the brand comes from (one of three sources)",
                    "properties": {
                      "brandName": {
                        "description": "2 to 60 characters, for the sources logo and preset",
                        "type": "string"
                      },
                      "logo": {
                        "description": "The logo file, for the brand source logo",
                        "properties": {
                          "contentType": {
                            "enum": ["image/png", "image/jpeg", "image/webp"],
                            "type": "string"
                          },
                          "data": {
                            "description": "The file, base64-encoded, up to 2 MB",
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["contentType", "data"],
                        "type": "object"
                      },
                      "presetId": {
                        "description": "A preset id from list_brand_presets, for the source preset",
                        "type": "string"
                      },
                      "source": {
                        "description": "website: SHIP captures the brand from websiteUrl. logo: from logo. preset: one of list_brand_presets",
                        "enum": ["website", "logo", "preset"],
                        "type": "string"
                      },
                      "websiteUrl": {
                        "description": "An https URL that answers, for the source website",
                        "type": "string"
                      }
                    },
                    "required": ["source"],
                    "type": "object"
                  },
                  "brandRights": {
                    "description": "The confirmation of the person the token acts for: they own this brand or have the right to use it. Send it only when that person confirmed the text that list_site_starters gives.",
                    "properties": {
