        {
          "name": "mark_setup_step",
          "title": "Mark a setup step",
          "description": "Mark a step of the setup checklist completed or skipped for the person this token acts for, as the console's Mark as complete and Skip controls do; open removes the mark. Give step for one milestone, or group to mark every open step of that group (the console's Skip all). A marked step counts as done on that person's checklist and its status says how; reached stays false until SHIP sees the step done. Returns the checklist as it now stands. A token that acts for no person is refused.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "group": {
                "description": "A group id: marks every open step of the group.",
                "enum": ["first_mission", "team", "explore"],
                "type": "string"
              },
              "mark": {
                "description": "open removes the caller's mark.",
                "enum": ["completed", "skipped", "open"],
                "type": "string"
              },
              "step": {
                "description": "The milestone id from get_setup_progress. Give step or group.",
                "enum": ["workspace", "first_mission", "first_review", "first_merge", "preview_deployment", "agent_instructions", "mcp_servers", "custom_sandbox", "teammate", "steer_mission", "checkpoints", "scheduled_task", "agent_to_pr"],
                "type": "string"
              }
            },
            "required": ["mark"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Mark a setup step"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
