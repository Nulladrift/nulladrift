          },
          "digest": "sha256:58faffc633419033cab7df0b053a2af3b7c81c7421f409d0d1db558c8a00a188"
        },
        {
          "name": "add_site_domain",
          "title": "Add a custom domain to a site",
          "description": "Add a custom domain to a hosted site. It starts as pending, and the answer gives two DNS records: a TXT record that proves control of the domain, and a CNAME record that sends its traffic to SHIP. The domain goes live after SHIP finds the TXT record and the certificate is active. Needs a paid plan. This tool calls the SHIP API, documented at https://letsship.ai/docs/api. Requires the config:write capability.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hostname": {
                "description": "The custom domain, e.g. 'blog.example.com'",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "siteId": {
                "description": "Site id from list_sites",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["hostname", "siteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a custom domain to a site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:316a0690d1a1539204b686bbecd80016e5b4c19fc1a1f47e6fb4079d2b360a10"
        },
        {
          "name": "answer_qa_checkpoint",
          "title": "Answer the QA checkpoint of a mission",
          "description": "A mission waits at the QA checkpoint (get_mission shows pauseSource 'qa-unverifiable') when QA could not check some acceptance criteria, so no code change can move it. A person checks those criteria another way, then answers. 'accept' counts QA as passed, 'reject' ends the mission as failed, and 'rerun' runs QA again on the same commit. Send only the decision the person made. Answers 409 when the mission does not wait at the QA checkpoint. Requires the missions:write scope.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "decision": {
                "description": "accept (QA counts as passed), reject (the mission fails) or rerun (QA runs again)",
                "enum": ["accept", "reject", "rerun"],
                "type": "string"
              },
              "issueId": {
                "description": "The mission's issue id: a Linear key or a GitHub Issues id, e.g. SHIP-412",
                "type": "string"
              }
            },
            "required": ["decision", "issueId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Answer the QA checkpoint of a mission"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98913a221588d8e5e7b722439aa5a97d3a96602a8f6aa95cc4c222c7652d20a1"
        },
        {
          "name": "approve_mission_ceiling",
          "title": "Let a mission continue past its credit limit",
          "description": "A mission that reached its credit limit pauses until a member lets it continue. This raises the mission's limit by one step and runs the stage that stopped again, so it spends credits: ask the person first. Returns the new limit. Answers 409 when the mission is not at its limit. Requires the missions:run scope.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "issueId": {
                "description": "The mission's issue id: a Linear key or a GitHub Issues id, e.g. SHIP-412",
                "type": "string"
              },
              "projectId": {
                "description": "Project id the mission belongs to (get_mission's summary.projectId)",
                "type": "string"
              }
            },
            "required": ["issueId", "projectId"],
            "type": "object"
