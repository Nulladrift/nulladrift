              },
              "defaultSandboxTemplateId": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "A sandbox id (sbt_...) from list_sandbox_templates, or null for the platform base"
              },
              "issueCode": {
                "description": "A GitHub Issues project's issue id prefix, 2-5 characters; only new ids use it",
                "pattern": "^[A-Za-z][A-Za-z0-9]{1,4}$",
                "type": "string"
              },
              "jiraConnectorId": {
                "description": "The Jira site's connection id, for tracker jira only",
                "minLength": 1,
                "type": "string"
              },
              "jiraProjectId": {
                "description": "A Jira project's numeric id on the project's Jira site, e.g. 10000; Jira-tracked projects only",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "linearTeamKey": {
                "description": "The key of the Linear team to connect, e.g. ENG",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "A new name",
                "maxLength": 120,
                "minLength": 1,
