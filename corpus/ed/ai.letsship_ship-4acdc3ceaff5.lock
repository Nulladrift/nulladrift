        {
          "name": "publish_starter_site",
          "title": "Publish a starter site",
          "description": "Publish the first version of a site from a brand kit, with no mission and no credits (SHIP-540 ST.5). Only for a project SHIP made with Start from scratch. SHIP writes the kit, the site's address and pages made from the facts of the form into the repository, and that change deploys the site. Send the same site form as create_mission's starter, with brand.source preset. A brand from a website or a logo needs create_mission instead. A second call for the same site answers with the published site. Read get_site for liveDeployId: it is set once the site is live.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "projectId": {
                "description": "The project SHIP made, from list_projects",
                "minLength": 1,
                "type": "string"
              },
              "site": {
                "description": "The form of a site starter. Required with starter; leave out title, description, labels and entry",
                "properties": {
                  "audience": {
                    "description": "website and waitlist: the main audience",
                    "type": "string"
                  },
                  "author": {
                    "description": "blog: the author of the first post",
                    "type": "string"
                  },
                  "brand": {
                    "description": "Where the brand comes from (one of three sources)",
                    "properties": {
                      "brandName": {
                        "description": "2 to 60 characters, for the sources logo and preset",
                        "type": "string"
                      },
                      "logo": {
                        "description": "The logo file, for the brand source logo",
                        "properties": {
                          "contentType": {
                            "enum": ["image/png", "image/jpeg", "image/webp"],
                            "type": "string"
                          },
                          "data": {
                            "description": "The file, base64-encoded, up to 2 MB",
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["contentType", "data"],
                        "type": "object"
                      },
                      "presetId": {
                        "description": "A preset id from list_brand_presets, for the source preset",
                        "type": "string"
                      },
                      "source": {
                        "description": "website: SHIP captures the brand from websiteUrl. logo: from logo. preset: one of list_brand_presets",
                        "enum": ["website", "logo", "preset"],
                        "type": "string"
                      },
                      "websiteUrl": {
                        "description": "An https URL that answers, for the source website",
                        "type": "string"
                      }
                    },
                    "required": ["source"],
                    "type": "object"
                  },
                  "brandRights": {
                    "description": "The confirmation of the person the token acts for: they own this brand or have the right to use it. Send it only when that person confirmed the text that list_site_starters gives.",
                    "properties": {
                      "accepted": {
                        "const": true,
                        "type": "boolean"
                      },
                      "textVersion": {
                        "description": "brandRights.version from list_site_starters",
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["accepted", "textVersion"],
                    "type": "object"
                  },
                  "kind": {
                    "description": "The same kind as starter",
                    "enum": ["website", "blog", "docs", "waitlist"],
                    "type": "string"
                  },
                  "offerings": {
                    "description": "website: one to three products or services",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "outline": {
                    "description": "docs: three to seven page titles",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "product": {
                    "description": "waitlist: what people join the waitlist for. Only a project SHIP made with Start from scratch takes it",
                    "type": "string"
                  },
                  "productName": {
                    "description": "docs: the product name",
                    "type": "string"
                  },
                  "productWebsite": {
                    "description": "docs: the product website, an https URL",
                    "type": "string"
                  },
                  "slug": {
                    "description": "The site address: https://<slug>.letsship.app, 3 to 40 of a-z, 0-9 and hyphens",
                    "minLength": 1,
                    "type": "string"
                  },
                  "topic": {
                    "description": "blog: the topic of the first post",
                    "type": "string"
                  }
                },
                "required": ["brand", "brandRights", "kind", "slug"],
                "type": "object"
              }
            },
            "required": ["projectId", "site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish a starter site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9670bccd6698093d5ea0fe786e573b8a8a2404c4d3d6223a0b5fe851e2d8278"
        },
        {
