          "description": "List the sites that SHIP hosts for the organization, newest first: the address, the template, the status and the live deploy of each. A suspension whose end is in the past reads as active. When more sites exist, pass nextCursor back as cursor.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "nextCursor from the previous page; omit for the first page",
                "type": "string"
              },
              "limit": {
                "description": "Items per page, 1-100 (default 50)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "audience": {
                "description": "`founder`: every project in scope is one SHIP provisioned, so a console speaks of changes and Publish. `developer`: at least one project is a repository of the caller's own, or there is no project.",
                "enum": ["founder", "developer"],
                "type": "string"
              },
              "data": {
                "items": {
                  "properties": {
                    "badgeRequired": {
                      "type": "boolean"
                    },
                    "badgeRequiredByPlan": {
                      "type": "boolean"
                    },
                    "createdAt": {
                      "type": "integer"
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["website", "blog", "docs", "waitlist"],
                      "type": "string"
                    },
                    "lastDeploy": {
                      "properties": {
                        "finishedAt": {
                          "type": ["integer", "null"]
                        },
                        "id": {
                          "type": "string"
                        },
                        "startedAt": {
                          "type": "integer"
                        },
                        "status": {
                          "enum": ["building", "uploading", "live", "unchanged", "failed", "refused", "superseded"],
                          "type": "string"
                        }
                      },
                      "required": ["finishedAt", "id", "startedAt", "status"],
                      "type": ["object", "null"]
                    },
                    "liveDeployId": {
                      "type": ["string", "null"]
                    },
                    "projectId": {
                      "type": ["string", "null"]
                    },
                    "provisionedBy": {
                      "enum": ["ship", "owner"],
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["active", "suspended", "deleting"],
                      "type": "string"
                    },
                    "suspendedUntil": {
                      "type": ["integer", "null"]
                    },
                    "templateId": {
                      "type": "string"
                    },
                    "updatedAt": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["badgeRequired", "badgeRequiredByPlan", "createdAt", "id", "kind", "lastDeploy", "liveDeployId", "projectId", "slug", "status", "suspendedUntil", "templateId", "updatedAt", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextCursor": {
                "type": ["string", "null"]
              },
              "plan": {
                "anyOf": [
                  {
                    "properties": {
                      "badgeRequired": {
                        "type": "boolean"
                      },
                      "badgeRequiredReason": {
                        "type": ["string", "null"]
                      },
                      "customDomains": {
                        "type": "boolean"
                      },
                      "hosting": {
                        "anyOf": [
                          {
                            "properties": {
                              "cancelAtPeriodEnd": {
                                "type": "boolean"
                              },
                              "currentPeriodEnd": {
                                "type": ["integer", "null"]
                              },
                              "quantity": {
                                "minimum": 0,
                                "type": "integer"
                              },
                              "status": {
                                "enum": ["active", "past_due"],
                                "type": "string"
                              }
                            },
                            "required": ["cancelAtPeriodEnd", "currentPeriodEnd", "quantity", "status"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "hostingOffer": {
                        "properties": {
                          "interval": {
                            "enum": ["month"],
                            "type": "string"
                          },
                          "priceUsd": {
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "purchase": {
                            "enum": ["available", "included", "active", "not_available"],
                            "type": "string"
                          }
                        },
                        "required": ["interval", "priceUsd", "purchase"],
                        "type": "object"
                      },
                      "maxSites": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "monthlyPageViewCap": {
                        "type": ["integer", "null"]
                      },
                      "pendingMove": {
                        "anyOf": [
                          {
                            "properties": {
                              "badgeTurnsOn": {
                                "type": "boolean"
                              },
                              "cause": {
                                "enum": ["subscription_ended", "hosting_ended"],
                                "type": "string"
                              },
                              "effectiveAt": {
                                "anyOf": [
                                  {
                                    "type": "integer"
                                  },
                                  {
                                    "type": "null"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "fromTier": {
                                "enum": ["subscription", "packs"],
                                "type": "string"
                              },
                              "id": {
                                "type": "string"
                              },
                              "sitesToEnd": {
                                "items": {
                                  "properties": {
                                    "id": {
                                      "type": "string"
                                    },
                                    "slug": {
                                      "type": "string"
                                    }
                                  },
                                  "required": ["id", "slug"],
                                  "type": "object"
                                },
                                "type": "array"
                              }
                            },
                            "required": ["badgeTurnsOn", "cause", "effectiveAt", "fromTier", "id", "sitesToEnd"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "sitesHeld": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "tier": {
                        "enum": ["subscription", "packs", "free"],
                        "type": "string"
                      }
                    },
                    "required": ["badgeRequired", "badgeRequiredReason", "customDomains", "hosting", "hostingOffer", "maxSites", "monthlyPageViewCap", "pendingMove", "sitesHeld", "tier"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["data", "nextCursor", "plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List sites"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
