        {
          "name": "create_scheduled_task",
          "title": "Create a scheduled task",
          "description": "Create a recurring agent mission. Firing it — on schedule, or immediately via run_scheduled_task — creates an ordinary tracker issue assigned to the agent, which drives a normal pipeline run: a scheduled task is a stored mission request, not a new execution mode. This tool calls the SHIP API, documented at https://letsship.ai/docs/api. Requires the config:write capability.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dayOfMonth": {
                "description": "Day of month, 1-28 — required when interval is 'monthly' (capped at 28 so every month has the day).",
                "maximum": 28,
                "minimum": 1,
                "type": "integer"
              },
              "enabled": {
                "description": "Whether the schedule is armed (default true)",
                "type": "boolean"
              },
              "interval": {
                "description": "Fire cadence. 'weekly' requires weekday; 'monthly' requires dayOfMonth.",
                "enum": ["daily", "weekly", "monthly"],
                "type": "string"
              },
              "labels": {
                "description": "Tracker label names put on every issue this scheduled task files (default none). The label must ALREADY exist in the project's tracker team — the platform attaches labels but cannot create them, so a name the workspace does not have is dropped.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "name": {
                "description": "Scheduled task name, shown in the console and used in the issue title",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "projectId": {
                "description": "Project id the scheduled task belongs to",
                "minLength": 1,
                "type": "string"
              },
              "prompt": {
                "description": "Becomes the created issue's description verbatim on every fire",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "skipIfPreviousOpen": {
                "description": "Skip a scheduled fire while the previous fire's mission is still open (default true — the guardrail is opt-out, not opt-in)",
                "type": "boolean"
              },
              "templateKey": {
                "description": "Attribution only, when authored from a template — see list_scheduled_task_templates",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "time": {
                "description": "24-hour wall-clock time in `timezone`, e.g. '09:00'.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone id, e.g. 'Europe/Amsterdam'.",
                "minLength": 1,
                "type": "string"
              },
              "weekday": {
                "description": "Day of week — required when interval is 'weekly'.",
                "enum": ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                "type": "string"
              }
            },
            "required": ["interval", "name", "projectId", "prompt", "time", "timezone"],
            "type": "object"
          },
