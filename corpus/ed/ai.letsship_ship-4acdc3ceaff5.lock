                      }
                    },
                    "required": ["diskMb", "memoryMib", "vcpu"],
                    "type": "object"
                  }
                ],
                "description": "Container size for this role on this mission"
              }
            },
            "required": ["issueId", "projectId", "role"],
            "type": "object"
          },
          "annotations": {
