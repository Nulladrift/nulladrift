        {
          "name": "remove_site_waitlist_entry",
          "title": "Remove site waitlist entry",
          "description": "Remove one address from the waitlist of a site that SHIP made, for example when a visitor asks to be deleted. Give the address as email. Add entryId from list_site_waitlist to remove that entry only while it still holds the address. When nothing matches, the call fails with site_waitlist_entry_not_found and nothing changes. The address leaves the live list at once. The database's recovery history keeps it for up to 30 days, then it is gone, and SHIP does not restore single addresses. The call needs the site-waitlist:write scope and an owner or an admin of the workspace, and the audit log records each removal.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "The address to remove; upper and lower case do not matter",
                "maxLength": 254,
                "minLength": 1,
                "type": "string"
              },
              "entryId": {
                "description": "The id of the entry, from list_site_waitlist. With it, the call removes that entry only while it still holds the address",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "siteId": {
                "description": "Site id from list_sites",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email", "siteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Remove site waitlist entry"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:82cb69ca6545db0cf8494ea2cfa33ce159946d6637752b84b19d1973c5cac0ef"
        },
        {
          "name": "report_setup_blocker",
          "title": "Report why setup stops",
          "description": "Record why the person this token acts for will not finish setting up SHIP, in their words: for example no repository yet, no wish to set up model keys or credits, or no time now. Call it only after the person said why. Ask them when get_setup_progress shows setup is not done and they say they will stop. Do not guess a reason. Each call is a new report. A token that acts for no person is refused.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "description": "The person's own words, short. Leave out names, keys and anything private.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "reason": {
                "description": "no-repository: no code or no GitHub repository to connect. want-templates: wants to start from a template. model-keys: does not want to set up model keys or credits with a model provider. github-access: does not want to give SHIP access to GitHub. too-complex: the setup is too long or unclear. price: the cost. not-now: only exploring, or will come back later. other: anything else, said in detail.",
                "enum": ["no-repository", "want-templates", "model-keys", "github-access", "too-complex", "price", "not-now", "other"],
                "type": "string"
              }
            },
            "required": ["reason"],
            "type": "object"
