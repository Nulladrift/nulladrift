                "minLength": 1,
                "type": "string"
              },
              "projectId": {
                "description": "Project id the mission belongs to",
                "type": "string"
              },
              "promptContent": {
                "description": "Inline prompt-experiment body, capped at 30,000 characters. Mutually exclusive with promptPath.",
                "maxLength": 30000,
                "minLength": 1,
                "type": "string"
              },
              "promptMode": {
                "description": "How this prompt relates to the repo's own .ship/agents/<role>.md (or ship.yml-pointed) layer. replace (default) makes this the role's only role-prompt layer; extend resolves the repo's layer first and appends this content after it, as a separately attributed span. Only meaningful with promptContent or promptPath. NOTE: the merge is per FIELD, and prompt is one field — a later call that sets a new promptContent/promptPath without repeating promptMode replaces the whole stored prompt, reverting to replace.",
