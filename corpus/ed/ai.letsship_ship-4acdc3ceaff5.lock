        {
          "name": "watch_agent_run",
          "title": "Watch an agent run",
          "description": "Wait on one agent run and follow what its agent does, instead of polling get_agent_run. The call returns when the run ends, when its mission moves to another stage, or after maxSeconds. While it waits, each agent event (a thought, a tool call, a plan update, an error) is sent as a progress notification when the request has a progress token. The result has the status of the run, the stage of its mission, ended, the reason it returned, the last 20 events and a cursor. When the run is still running, call it again with since set to the cursor. A run that already ended returns at once. If your client ends a call after 60 seconds, set maxSeconds below that.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "maxSeconds": {
                "default": 300,
                "description": "The longest time to wait, in seconds (default 300, at most 600)",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "sandboxId": {
                "description": "Agent run id: the run's sandbox id, from list_agent_runs or get_mission",
                "type": "string"
              },
              "since": {
                "description": "The cursor from an earlier result. Only the events after it are sent",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["sandboxId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The id of the last event. Give it as since to continue"
              },
              "ended": {
                "description": "True when the run is no longer running",
                "type": "boolean"
              },
              "events": {
                "description": "The last 20 events at most, oldest first",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "at": {
                      "description": "When the agent emitted it, in epoch milliseconds",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "id": {
                      "description": "The cursor of the event",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "kind": {
                      "description": "thought, action, plan or error",
                      "type": "string"
                    },
                    "text": {
                      "description": "The event as one line",
                      "type": "string"
                    }
                  },
                  "required": ["at", "id", "kind", "text"],
                  "type": "object"
                },
                "type": "array"
              },
