{
  "lockfileVersion": 2,
  "subjects": {
    "ai.preferly/preferly": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.preferly.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "preferly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Preferly's free website checks for AI visibility: whether AI crawlers can reach a site, its llms.txt, the business details in its structured data, and whether its key business facts are readable as text, plus robots.txt lines for AI crawlers. One public website per call. They don't report what AI tools say about a business; for that, each result links to Preferly's free check.",
      "tools": [
        {
          "name": "check_ai_crawler_access",
          "title": "Check AI crawler access",
          "description": "Use this when the user wants to know whether AI crawlers and AI tools can access a specific website. It reads the site's robots.txt and reports, for 10+ AI crawlers (including GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, PerplexityBot and Google-Extended), whether each is allowed or blocked and which rule decides it. It also reports whether the homepage loads for an automated visitor or shows a bot check (such as Cloudflare, SiteGround or AWS WAF), whether the site publishes /llms.txt, and which schema.org types the homepage declares. Input: one public website address. It fetches only robots.txt, the homepage and /llms.txt, identifying itself as PreferlyBot, and changes nothing on the site. A result for the same domain may come from a check run in the last 10 minutes. It does not report what AI tools say about the business, search rankings, or pages other than the homepage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "website": {
                "description": "The public website to check, like example.com or https://www.example.com. One site per call.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "crawlers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "allowed": {
                      "description": "null when robots.txt couldn't be read",
                      "type": ["boolean", "null"]
                    },
                    "label": {
                      "type": "string"
                    },
                    "major": {
                      "type": "boolean"
                    },
                    "rule": {
                      "description": "The robots.txt rule that decides it, e.g. \"Disallow: /\"",
                      "type": "string"
                    },
                    "token": {
                      "type": "string"
                    }
                  },
                  "required": ["allowed", "label", "major", "token"],
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "homepage": {
                "additionalProperties": false,
                "properties": {
                  "botCheck": {
                    "description": "The bot-check vendor, e.g. Cloudflare",
                    "type": "string"
                  },
                  "finalUrl": {
                    "type": "string"
                  },
                  "httpOnly": {
                    "type": "boolean"
                  },
                  "httpStatus": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "httpsError": {
                    "type": "string"
                  },
                  "loaded": {
                    "type": "boolean"
                  },
                  "parked": {
                    "type": "boolean"
                  }
                },
                "required": ["loaded"],
                "type": "object"
              },
              "learnMore": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["label", "url"],
                "type": "object"
              },
              "llmsTxt": {
                "enum": ["found", "missing", "unknown"],
                "type": "string"
              },
              "nextSteps": {
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "notChecked": {
                "type": "string"
              },
              "robotsTxt": {
                "additionalProperties": false,
                "properties": {
                  "read": {
                    "type": "boolean"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["read", "url"],
                "type": "object"
              },
              "structuredData": {
                "description": "schema.org types declared on the homepage",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              },
              "verdict": {
                "enum": ["pass", "warn", "fail", "down"],
                "type": "string"
              }
            },
            "required": ["crawlers", "domain", "homepage", "learnMore", "llmsTxt", "nextSteps", "notChecked", "robotsTxt", "structuredData", "summary", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:005164ebb05bbe9beb7038593cc63cd5268de78b8f4781a41f1a7513b3b72e8f"
        },
        {
          "name": "check_business_info",
          "title": "Check readable business info",
          "description": "Use this when the user asks whether AI tools can read a business's details from its website. It reports whether the business name, phone number, email, address, opening hours and prices are readable as text in the page, only appear after scripts run, or weren't found, on the homepage and up to 2 contact, booking or pricing pages that robots.txt allows. Input: one public website. Reads robots.txt, the homepage, /llms.txt and up to 2 more pages as PreferlyBot; changes nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "website": {
                "description": "The public website to check, like example.com or https://www.example.com. One site per call.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e70e58663d4f16a529c499c9dc751e773c0c8c33302c904b2f3a03ccca2c06c6"
        },
        {
          "name": "check_business_schema",
          "title": "Check business structured data",
          "description": "Use this when the user asks whether a website's structured data (schema.org JSON-LD) describes the business correctly. It reads the homepage's JSON-LD and reports the business type it found (Organization, LocalBusiness or a subtype), which business fields are present, missing or look off (name, url, phone, address, hours and more), and where the structured data and the page disagree. Input: one public website. Reads robots.txt, the homepage and /llms.txt as PreferlyBot; changes nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "website": {
                "description": "The public website to check, like example.com or https://www.example.com. One site per call.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5b4902fbf9362b5d35940b425531d23239c6ba764ad4d6df12b9c9bd0e333139"
        },
        {
          "name": "check_llms_txt",
          "title": "Check llms.txt",
          "description": "Use this when the user asks whether a website has an llms.txt file or whether it's set up correctly. It fetches /llms.txt and reports whether it was found, its size and title, and every place it doesn't follow the llmstxt.org format (missing H1, no summary line, links that aren't Markdown or https), with line numbers. It also lists the homepage's main pages, which can seed a new llms.txt. Input: one public website. Reads robots.txt, the homepage and /llms.txt as PreferlyBot; changes nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "website": {
                "description": "The public website to check, like example.com or https://www.example.com. One site per call.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d9e9a99cbdf7ab1ee19e1a168d3efd81ff4319275ad6c12efad6972f9f19358e"
        },
        {
          "name": "generate_ai_robots_txt",
          "title": "Generate AI robots.txt lines",
          "description": "Use this when the user wants robots.txt lines that control which AI crawlers may read their website. By default it lets AI search and assistant crawlers in (so the site can appear in AI answers) and keeps AI training crawlers out; either can be switched. Optional paths are kept private from every allowed crawler. It returns the lines to paste into robots.txt and which crawlers each group covers. It fetches nothing and needs no website.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "allow_search": {
                "default": true,
                "description": "Let AI search and assistant crawlers in (default true).",
                "type": "boolean"
              },
              "allow_training": {
                "default": false,
                "description": "Let AI training crawlers in (default false).",
                "type": "boolean"
              },
              "disallow_paths": {
                "description": "Paths every allowed crawler should skip, like [\"/admin\", \"/cart\"].",
                "items": {
                  "maxLength": 200,
                  "pattern": "^\\/\\S*$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cf3536126cf9f6e9ca4f1f15c4a021052dc88a0a3e96729c0a8a0d8e84f8cfb"
        },
        {
          "name": "quick_ai_visibility_check",
          "title": "Quick AI visibility check",
          "description": "Use this when the user asks what AI assistants say about a specific business, or whether AI tools mention or recommend it. Given the business's public website, it reads the site (robots.txt, the homepage and up to 2 contact, booking or pricing pages), writes 3 typical customer questions, and asks 3 AI models each question, answering from what they already know (no web search). It reports, for each model, whether it named the business and where it ranked when it gave a list, up to 2 statements where an AI model contradicts the website, and a one-line crawler summary. Input: one public website and, optionally, the business name. A result for the same website may come from a check run in the last 24 hours. Changes nothing on the site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "The business's name, if the website doesn't make it obvious.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "city": {
                "description": "The city the business serves, if the website doesn't say.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "website": {
                "description": "The public website to check, like example.com or https://www.example.com. One site per call.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cached": {
                "description": "True when this is a recent check's result, served again",
                "type": "boolean"
              },
              "checkedAt": {
                "description": "When the models were asked (UTC)",
                "type": "string"
              },
              "contradictions": {
                "description": "Statements where an AI model contradicts the website",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "claim": {
                      "type": "string"
                    },
                    "model": {
                      "type": "string"
                    },
                    "websiteSays": {
                      "type": "string"
                    }
                  },
                  "required": ["claim", "model", "websiteSays"],
                  "type": "object"
                },
                "maxItems": 2,
                "type": "array"
              },
              "crawlerSummary": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "links": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Links to pages on www.preferly.ai",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "models": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "namedIn": {
                      "description": "Answers that named the business",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "of": {
                      "description": "Questions this model answered",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "position": {
                      "description": "Its best position when the model gave a list (1 = first)",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["label", "namedIn", "of"],
                  "type": "object"
                },
                "type": "array"
              },
              "previewLabel": {
                "type": "string"
              },
              "status": {
                "description": "partial: 2 of 3 models answered",
                "enum": ["ok", "partial", "site_unreadable", "temporarily_unavailable"],
                "type": "string"
              },
              "tool": {
                "const": "quick-audit",
                "type": "string"
              }
            },
            "required": ["domain", "links", "status", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9b12cb4f2a09c35cce6297fe276478291e9709131895bbd8b217fc921bff9ff"
        }
      ],
      "digest": "sha256:416f3bd68207d953807120baf56166b369ae7821de2c8047a856b452e6e6417d"
    }
  }
