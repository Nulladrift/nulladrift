{
  "lockfileVersion": 2,
  "subjects": {
    "cc.cyberjobs/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cyberjobs.cc/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "cybersecurity-jobs",
        "title": "CyberJobs.cc",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This server lists open cybersecurity jobs across SOC and incident response, security engineering, cloud security, application security, identity and access, penetration testing and red team, threat intelligence, GRC and compliance, security architecture and consulting and security leadership. Roles are read every hour from each employer's own hiring system, counted once, with the yearly salary range the posting states. Use search_cybersecurity_jobs to find roles, get_cybersecurity_employer for one employer, get_cybersecurity_salaries for salaries per specialty, and get_cybersecurity_job_market for the number of open roles per specialty and employer. Give the user the role links: they open the role, from where the user applies with the employer. Some employers pay the board a referral fee; that never changes a salary figure.",
      "tools": [
        {
          "name": "get_cybersecurity_employer",
          "title": "One employer's security roles and salaries",
          "description": "One employer on the board: what kind of company it is, its open security roles and the salaries they state, where it hires, and a link to its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "The employer's name or slug, e.g. 'CrowdStrike' or 'avepoint'.",
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "One employer's security roles and salaries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4614aac617dce94a22c2177fac5532023b0ebdbe229691851e60223dbc5c44de"
        },
        {
          "name": "get_cybersecurity_job_market",
          "title": "Cybersecurity job market",
          "description": "How many security roles are open today, how many first appeared in the last 7 days, and the open roles per specialty and per employer (with each employer's slug for search_cybersecurity_jobs). Can be limited to the roles open to applicants in one country.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code (e.g. 'US', 'IN'): count only roles that accept applicants in that country.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Cybersecurity job market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:13e0be74b516918e7db9cdbf2d3f2e4e428d74689341d9c41e85be957411ca16"
        },
        {
          "name": "get_cybersecurity_salaries",
          "title": "Cybersecurity salaries by specialty",
          "description": "The yearly salaries open security postings state today, per specialty: the middle salary and the typical band, with how many stated ranges and employers each figure rests on. A specialty is included once at least three employers state ranges for it.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Cybersecurity salaries by specialty"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d9ed79af4de5ad6e298397c714f4084d4ef02e7da4d85c9892b1622b0601e0f1"
        },
        {
          "name": "search_cybersecurity_jobs",
          "title": "Search cybersecurity jobs",
          "description": "Search open cybersecurity roles (SOC and incident response, security engineering, cloud security, application security, identity and access, penetration testing and red team, threat intelligence, GRC and compliance, security architecture and consulting and security leadership) read from the hiring systems of 653 employers. Returns each role's title, employer, specialty, stated salary, where it hires and a link to the role. Every filter is optional.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code (e.g. 'US', 'GB', 'DE'): only roles that accept applicants in that country.",
                "type": "string"
              },
              "kind": {
                "description": "Security specialty, one of the listed slugs, e.g. 'security-operations', 'cloud-security', 'governance-risk-compliance'.",
                "enum": ["security-operations", "security-engineering", "cloud-security", "application-security", "identity-access", "offensive-security", "threat-intelligence", "governance-risk-compliance", "security-architecture", "security-leadership"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of roles to return (1 to 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_salary_usd": {
                "description": "Only roles whose stated yearly salary reaches at least this many US dollars.",
                "maximum": 2000000,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Employer slug; get_cybersecurity_job_market lists them.",
                "type": "string"
              },
              "query": {
                "description": "Words matched against role titles, e.g. 'SOC analyst', 'Okta', 'penetration tester', 'FedRAMP'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search cybersecurity jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:50b7455105708caf2a8dd83b6fc1c67037921ba2bb9308aba0b45319b71145d4"
        }
      ],
      "digest": "sha256:b4d9c84f6cfb21116920f10eb132d18a6e30d56480aa5e6d5bc0dca88df9cfad"
    }
  }
}
