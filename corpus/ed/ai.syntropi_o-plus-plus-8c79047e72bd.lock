                          "maxLength": 255,
                          "minLength": 1,
                          "pattern": "^[A-Za-z0-9._:-]+$",
                          "type": "string"
                        },
                        "maxItems": 25,
                        "type": "array"
                      },
                      "public_disclosure": {
                        "default": [],
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "destination_space_id": {
                              "pattern": "^(?:commons|s_[0-9a-f]{32})$",
