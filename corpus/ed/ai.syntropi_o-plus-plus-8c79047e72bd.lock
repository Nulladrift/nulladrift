                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$"
                        },
                        {
                          "pattern": "T\\d{2}:\\d{2}:\\d{2}(?:\\.\\d{1,3}0*)?(?:Z|[+-]\\d{2}:\\d{2})$"
                        }
                      ],
                      "description": "Observation time in an RFC 3339 profile with uppercase T/Z, full seconds, and explicit Z or ±HH:MM timezone. Fractions must be exactly representable as milliseconds (extra fractional digits may only be zeros). Saved as UTC with three fractional digits.",
                      "format": "date-time",
                      "type": "string"
