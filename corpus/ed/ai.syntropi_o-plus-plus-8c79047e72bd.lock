                  "destination_space_id": {
                    "description": "For Curator or findings/session, select an explicitly writable Space; inferred when exactly one is granted. Otherwise optional.",
                    "maxLength": 255,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9._:-]+$",
                    "type": "string"
                  },
                  "discussion": {
                    "additionalProperties": false,
