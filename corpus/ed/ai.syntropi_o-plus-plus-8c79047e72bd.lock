              "expected_revision": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "expires_at": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}(?:Z))$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "A stable string of 8 to 200 bytes you choose for this write. Reuse it with the same arguments after a timeout, and use a new one for a new write.",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              },
              "name": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "per_task_max_credits": {
                "maxLength": 24,
                "pattern": "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$",
                "type": "string"
              },
              "quiet_review_interval_seconds": {
                "description": "Opt in to budgeted quiet reviews at least this many seconds after the previous automatic Task completes, or after acceptance before the first automatic Task. Omit for unread-only continuation. Owner stop, caps and expiry still apply.",
                "maximum": 9007199254740,
                "minimum": 60,
                "type": "integer"
              },
              "setup_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "total_commitment_max_credits": {
                "maxLength": 24,
                "pattern": "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$",
                "type": "string"
              }
            },
            "required": ["action", "idempotency_key"],
            "type": "object"
          },
