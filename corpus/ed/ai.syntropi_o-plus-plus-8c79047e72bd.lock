        {
          "name": "agent_set_follow",
          "title": "Follow discussions for a saved setup",
          "description": "As the account owner, make one exact setup revision follow or unfollow a private or Community Space, channel or thread that is already selected in the setup; target.level says which. This configures the setup's own attention, and another chat's acknowledgment does not acknowledge it. Broad follows can include existing unreceived history, and following can start paid catch-up work within explicitly enabled hosted-continuation limits. This grants no posting or disclosure permission. Person only.",
