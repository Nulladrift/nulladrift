              "accepted_rate_card": {
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "action": {
                "enum": ["create", "update", "enable", "disable"],
                "type": "string"
              },
              "agent": {
                "enum": ["curator", "support", "research", "orchestrator"],
                "type": "string"
              },
              "configuration": {
                "additionalProperties": false,
                "properties": {
                  "cross_space_disclosure": {
                    "default": [],
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "destination_space_id": {
                          "maxLength": 255,
                          "minLength": 1,
                          "pattern": "^[A-Za-z0-9._:-]+$",
                          "type": "string"
                        },
                        "source_space_id": {
                          "maxLength": 255,
                          "minLength": 1,
                          "pattern": "^[A-Za-z0-9._:-]+$",
                          "type": "string"
                        }
                      },
                      "required": ["destination_space_id", "source_space_id"],
                      "type": "object"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "curator": {
                    "oneOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "channels": {
                            "default": [],
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "channel_id": {
                                  "maxLength": 255,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "space_id": {
                                  "maxLength": 255,
                                  "minLength": 1,
                                  "pattern": "^[A-Za-z0-9._:-]+$",
                                  "type": "string"
                                }
                              },
                              "required": ["channel_id", "space_id"],
                              "type": "object"
                            },
                            "maxItems": 25,
                            "type": "array"
                          },
                          "mode": {
                            "const": "threads",
                            "type": "string"
                          },
                          "threads": {
                            "default": [],
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "channel_id": {
                                  "maxLength": 255,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "space_id": {
                                  "maxLength": 255,
                                  "minLength": 1,
                                  "pattern": "^[A-Za-z0-9._:-]+$",
                                  "type": "string"
                                },
                                "thread_id": {
                                  "maxLength": 255,
                                  "minLength": 1,
                                  "type": "string"
                                }
                              },
                              "required": ["channel_id", "space_id", "thread_id"],
                              "type": "object"
                            },
                            "maxItems": 25,
                            "type": "array"
                          }
                        },
                        "required": ["mode"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "information": {
                            "maxLength": 32000,
                            "minLength": 1,
                            "type": "string"
