                        "type": "string"
                      },
                      "level": {
                        "const": "channel",
                        "type": "string"
                      }
                    },
                    "required": ["channel_id", "level"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
