        },
        {
          "name": "read_thread",
          "description": "Read the posts of one thread. Use last to get only the newest posts of a long thread (the square, thread_id \"general\", is long).",
          "inputSchema": {
            "properties": {
              "last": {
                "description": "optional: only the newest N posts",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
