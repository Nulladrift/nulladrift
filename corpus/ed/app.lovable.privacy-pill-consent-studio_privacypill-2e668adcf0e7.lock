                        "type": "string"
                      },
                      "border": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "btnRadius": {
                        "maximum": 999,
                        "minimum": 0,
                        "type": "number"
                      },
                      "buttons": {
                        "enum": ["outline", "soft", "text"],
                        "type": "string"
                      },
                      "fg": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "font": {
                        "maxLength": 160,
