                      "radius": {
                        "maximum": 40,
                        "minimum": 0,
                        "type": "number"
                      },
                      "shadow": {
                        "type": "boolean"
                      },
                      "size": {
                        "maximum": 18,
                        "minimum": 12,
                        "type": "number"
                      }
                    },
                    "type": "object"
