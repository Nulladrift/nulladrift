      "serverInfo": {
        "name": "privacypill",
        "title": "PrivacyPill",
        "version": "1.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PrivacyPill is a lightweight GDPR / ePrivacy cookie banner with Google Consent Mode v2. You're connected without signing in: pre_consent_scan is free (10 checks per hour per visitor) and reports which cookies and trackers load on a public page before the visitor consents. The other tools act on a PrivacyPill account — the first call to one asks the user to sign in (OAuth), after which the flow is create_site → configure_banner → get_embed_snippet → run_compliance_scan.",
      "tools": [
        {
          "name": "configure_banner",
          "title": "Configure banner",
          "description": "Update a site's cookie banner: layout (pill, bar, modal, corner), colours or preset, categories, services, Google Consent Mode v2, languages and wording. Only the fields you pass change. Pro sites can also switch geo-targeting and monthly rescans.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "design": {
                "additionalProperties": false,
                "description": "Banner fields to change; nested objects merge.",
                "properties": {
                  "autoLang": {
                    "type": "boolean"
                  },
                  "categories": {
                    "properties": {
                      "analytics": {
                        "type": "boolean"
                      },
                      "functional": {
                        "type": "boolean"
                      },
                      "marketing": {
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "closeX": {
                    "description": "Show an X on the banner. Closing it rejects non-essential cookies (all Consent Mode signals denied), as Italy's Garante describes. On by default for new sites.",
                    "type": "boolean"
                  },
                  "defaultLang": {
                    "enum": ["en", "de", "fr", "nl", "es", "it"],
                    "type": "string"
                  },
                  "equal": {
                    "description": "Give Accept and Reject equal visual weight.",
                    "type": "boolean"
                  },
                  "expiryDays": {
                    "maximum": 395,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "gcm": {
                    "properties": {
                      "enabled": {
                        "type": "boolean"
                      },
                      "passthrough": {
                        "type": "boolean"
                      },
                      "redact": {
                        "type": "boolean"
                      },
                      "wait": {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "languages": {
                    "items": {
                      "enum": ["en", "de", "fr", "nl", "es", "it"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "layout": {
                    "enum": ["pill", "bar", "modal", "corner"],
                    "type": "string"
                  },
                  "overrides": {
                    "additionalProperties": {
                      "properties": {
                        "accept": {
                          "maxLength": 40,
                          "type": "string"
                        },
                        "body": {
                          "maxLength": 600,
