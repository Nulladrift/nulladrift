                "description": "Pro: only show the banner where consent law applies.",
                "type": "boolean"
              },
              "monthly_rescan": {
                "description": "Pro: rescan the site automatically every month.",
                "type": "boolean"
              },
              "name": {
                "maxLength": 80,
                "type": "string"
              },
              "site_id": {
                "description": "Site id from list_sites or create_site.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
