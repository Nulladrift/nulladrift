                    "propertyNames": {
                      "enum": ["en", "de", "fr", "nl", "es", "it"],
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "policyUrl": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "preset": {
                    "description": "Apply a built-in colour preset (see GET /presets).",
                    "enum": ["mint", "slate", "paper", "lagoon", "sand", "contrast"],
                    "type": "string"
                  },
                  "reloadOnWithdraw": {
                    "type": "boolean"
                  },
                  "reopen": {
                    "description": "Show a small button to reopen preferences.",
                    "type": "boolean"
                  },
                  "services": {
                    "additionalProperties": {
                      "items": {
                        "maxLength": 120,
                        "type": "string"
                      },
                      "maxItems": 40,
                      "type": "array"
                    },
                    "propertyNames": {
                      "enum": ["necessary", "analytics", "marketing", "functional"],
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "side": {
                    "enum": ["left", "right"],
                    "type": "string"
                  },
                  "theme": {
                    "properties": {
