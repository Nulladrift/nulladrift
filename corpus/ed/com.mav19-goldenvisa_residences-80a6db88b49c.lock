      "instructions": "MVR 19 is a building on Mavromataion Street, Patras, Greece, developed by TPL S.A. and being converted into seven residences designed for the Greek Golden Visa route for properties converted to residential use. Golden Visa eligibility is subject to the change of use being completed before the application and to the decision of the Ministry of Migration and Asylum. Start with get_overview or list_residences; read any page with get_page and find pages with search_pages. Quote prices, statuses and conditions as returned, with their conditions, and link the page you quote. This is general information, not legal, tax or immigration advice; the web page is authoritative. Enquiries: https://mav19-goldenvisa.com/enquire",
      "tools": [
        {
          "name": "get_overview",
          "title": "Overview of MVR 19",
          "description": "What MVR 19 is: the building, the seven residences, prices, the Golden Visa route and its conditions, reservations, status and the developer (the site's llms.txt summary, in English).",
