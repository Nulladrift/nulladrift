          "digest": "sha256:27e69d141385a3205e108abd37015f44927363922e60046970c928e03374ebe9"
        },
        {
          "name": "list_brands_sponsoring_newsletters",
          "title": "List brands sponsoring newsletters",
          "description": "Use this when someone asks which companies or brands sponsor newsletters, overall or in a topic such as AI, finance or marketing. Returns the brands seen in the most newsletters in the last 12 months, mostly read from published issues.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "niche": {
                "description": "Newsletter topic: ai, business, finance, tech, marketing, health, culture, food, productivity, crypto, dev, design, science, education, sports, climate, media, local, legal, travel. Leave out for all newsletters.",
                "enum": ["ai", "business", "finance", "tech", "marketing", "health", "culture", "food", "productivity", "crypto", "dev", "design", "science", "education", "sports", "climate", "media", "local", "legal", "travel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brands": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "domain": {
                      "type": "string"
                    },
                    "last_seen": {
                      "type": ["string", "null"]
                    },
                    "newsletters": {
                      "type": "number"
                    },
                    "recent_newsletters": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["brand", "domain", "last_seen", "newsletters", "recent_newsletters"],
                  "type": "object"
                },
                "type": "array"
              },
              "brands_seen": {
                "type": "number"
              },
              "newsletters_read": {
                "type": "number"
              },
              "niche": {
                "type": ["string", "null"]
              },
              "source_url": {
                "type": "string"
              },
              "updated": {
                "type": "string"
              }
            },
            "required": ["brands", "brands_seen", "newsletters_read", "niche", "source_url", "updated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List brands sponsoring newsletters"
          },
          "behavior": {
