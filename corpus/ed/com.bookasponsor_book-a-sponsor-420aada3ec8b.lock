{
  "lockfileVersion": 2,
  "subjects": {
    "com.bookasponsor/book-a-sponsor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bookasponsor.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sponsor-radar",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Book a Sponsor knows which brands sponsor newsletters, mostly read from published issues. For a specific newsletter, call find_newsletter_sponsors with its web address; if the scan is still running, call get_sponsor_scan with the same address after a short wait. Results name brands and where their ads ran, never people or email addresses. The results_url opens the full results on bookasponsor.com.",
      "tools": [
        {
          "name": "find_newsletter_sponsors",
          "title": "Find sponsors for a newsletter",
          "description": "Use this when someone who runs a newsletter asks which brands might sponsor it or how to find sponsors for it. Takes the newsletter's web address, finds similar newsletters, and returns the brands that sponsored them, with the newsletters and dates where each ad ran. Starts a scan of the public newsletter pages if none exists; a new scan takes about 15 to 60 seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "newsletter_url": {
                "description": "The newsletter's web address, such as yourname.substack.com or yournewsletter.com",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["newsletter_url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "newsletter": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "domain": {
                        "type": "string"
                      },
                      "name": {
                        "type": ["string", "null"]
                      },
                      "niche": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["domain", "name", "niche"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "results_url": {
                "type": ["string", "null"]
              },
              "similar_newsletters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "domain": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["domain", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "sponsors": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "domain": {
                      "type": ["string", "null"]
                    },
                    "last_seen": {
                      "type": ["string", "null"]
                    },
                    "newsletters_sponsored": {
                      "type": ["number", "null"]
                    },
                    "seen_in": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "type": ["string", "null"]
                          },
                          "issue_url": {
                            "type": ["string", "null"]
                          },
                          "newsletter": {
                            "type": "string"
                          }
                        },
                        "required": ["date", "issue_url", "newsletter"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["brand", "domain", "last_seen", "newsletters_sponsored", "seen_in"],
                  "type": "object"
                },
                "type": "array"
              },
              "sponsors_total": {
                "type": "number"
              },
              "status": {
                "enum": ["complete", "running", "needs_details", "failed", "refused"],
                "type": "string"
              }
            },
            "required": ["message", "newsletter", "results_url", "similar_newsletters", "sponsors", "sponsors_total", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find sponsors for a newsletter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ffce27ae2e201f2e3dd46bdb391c92009434541a1e79d36d5c6891ca61eed116"
        },
        {
          "name": "get_newsletter_sponsorship_rates",
          "title": "Get newsletter sponsorship rates",
          "description": "Use this when someone asks how much to charge for a newsletter sponsorship or what newsletters charge for an ad. Returns the median price newsletters list for the main sponsor slot of one issue, by list size, read from their own advertise pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "subscribers": {
                "description": "The newsletter's subscriber count, to pick its size band",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bands": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "high_usd": {
                      "type": "number"
                    },
                    "list_size": {
                      "type": "string"
                    },
                    "low_usd": {
                      "type": "number"
                    },
                    "median_per_1000_subscribers_usd": {
                      "type": "number"
                    },
                    "median_usd": {
                      "type": "number"
                    },
                    "newsletters": {
                      "type": "number"
                    }
                  },
                  "required": ["high_usd", "list_size", "low_usd", "median_per_1000_subscribers_usd", "median_usd", "newsletters"],
                  "type": "object"
                },
                "type": "array"
              },
              "newsletters_priced": {
                "type": "number"
              },
              "read_on": {
                "type": "string"
              },
              "source_url": {
                "type": "string"
              },
              "your_band": {
                "type": ["string", "null"]
              }
            },
            "required": ["bands", "newsletters_priced", "read_on", "source_url", "your_band"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get newsletter sponsorship rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1d0651054ea0186152b5e232e538175113233170a0fcb7eac14ba9853b5e3ec4"
        },
        {
          "name": "get_sponsor_scan",
          "title": "Get a newsletter sponsor scan",
          "description": "Use this to read the result of a sponsor scan that find_newsletter_sponsors started, for example when it reported that the scan was still running. Takes the same newsletter web address.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "newsletter_url": {
                "description": "The newsletter's web address used for find_newsletter_sponsors",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["newsletter_url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "newsletter": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "domain": {
                        "type": "string"
                      },
                      "name": {
                        "type": ["string", "null"]
                      },
                      "niche": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["domain", "name", "niche"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "results_url": {
                "type": ["string", "null"]
              },
              "similar_newsletters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "domain": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["domain", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "sponsors": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "domain": {
                      "type": ["string", "null"]
                    },
                    "last_seen": {
                      "type": ["string", "null"]
                    },
                    "newsletters_sponsored": {
                      "type": ["number", "null"]
                    },
                    "seen_in": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "type": ["string", "null"]
                          },
                          "issue_url": {
                            "type": ["string", "null"]
                          },
                          "newsletter": {
                            "type": "string"
                          }
                        },
                        "required": ["date", "issue_url", "newsletter"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["brand", "domain", "last_seen", "newsletters_sponsored", "seen_in"],
                  "type": "object"
                },
                "type": "array"
              },
              "sponsors_total": {
                "type": "number"
              },
              "status": {
                "enum": ["complete", "running", "needs_details", "failed", "refused"],
                "type": "string"
              }
            },
            "required": ["message", "newsletter", "results_url", "similar_newsletters", "sponsors", "sponsors_total", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a newsletter sponsor scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
