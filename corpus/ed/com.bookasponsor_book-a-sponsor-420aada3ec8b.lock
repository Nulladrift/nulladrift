        {
          "name": "get_newsletter_sponsorship_rates",
          "title": "Get newsletter sponsorship rates",
          "description": "Use this when someone asks how much to charge for a newsletter sponsorship or what newsletters charge for an ad. Returns the median price newsletters list for the main sponsor slot of one issue, by list size, read from their own advertise pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "subscribers": {
                "description": "The newsletter's subscriber count, to pick its size band",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bands": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "high_usd": {
                      "type": "number"
                    },
                    "list_size": {
                      "type": "string"
                    },
                    "low_usd": {
                      "type": "number"
                    },
                    "median_per_1000_subscribers_usd": {
                      "type": "number"
                    },
                    "median_usd": {
                      "type": "number"
                    },
                    "newsletters": {
                      "type": "number"
                    }
                  },
                  "required": ["high_usd", "list_size", "low_usd", "median_per_1000_subscribers_usd", "median_usd", "newsletters"],
                  "type": "object"
                },
                "type": "array"
              },
              "newsletters_priced": {
                "type": "number"
              },
              "read_on": {
                "type": "string"
              },
              "source_url": {
                "type": "string"
              },
              "your_band": {
                "type": ["string", "null"]
              }
            },
            "required": ["bands", "newsletters_priced", "read_on", "source_url", "your_band"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get newsletter sponsorship rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
