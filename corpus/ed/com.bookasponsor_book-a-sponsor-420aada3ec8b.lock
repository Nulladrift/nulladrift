{
  "lockfileVersion": 2,
  "subjects": {
    "com.bookasponsor/book-a-sponsor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bookasponsor.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sponsor-radar",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Book a Sponsor knows which brands sponsor newsletters, mostly read from published issues. For a specific newsletter, call find_newsletter_sponsors with its web address; if the scan is still running, call get_sponsor_scan with the same address after a short wait. Results name brands and where their ads ran, never people or email addresses. The results_url opens the full results on bookasponsor.com.",
      "tools": [
        {
          "name": "find_creators_to_sponsor",
          "title": "Find newsletters, YouTube channels and podcasts to sponsor",
          "description": "Use this when a marketer, founder or media buyer asks which newsletters, YouTube channels or podcasts they should sponsor in a category (such as AI, tech, business, finance or marketing), or which creators have run ads for a specific brand. Returns active creators observed running paid sponsorships in the last 90 days, with their recent sponsors and public media kit URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Optional brand name or domain (e.g. linear.app or Shopify) to find creators who ran ads for that brand.",
                "maxLength": 100,
                "type": "string"
              },
              "channel": {
                "description": "Filter to one channel (newsletter, youtube, or podcast), or leave out for all three.",
                "enum": ["newsletter", "youtube", "podcast"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum creators to return (default 15, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "medium": {
                "description": "Alias for channel (newsletter, youtube, or podcast).",
                "enum": ["newsletter", "youtube", "podcast"],
                "type": "string"
              },
              "niche": {
                "description": "Creator topic: ai, business, finance, tech, marketing, health, culture, food, productivity, crypto, dev, design, science, education, sports, climate, media, local, legal, travel. Leave out for all topics.",
                "enum": ["ai", "business", "finance", "tech", "marketing", "health", "culture", "food", "productivity", "crypto", "dev", "design", "science", "education", "sports", "climate", "media", "local", "legal", "travel"],
                "type": "string"
              },
              "q": {
                "description": "Optional keyword search matching creator name or past sponsor brand.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "channel": {
                "type": ["string", "null"]
              },
              "creators": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "channel": {
                      "type": "string"
                    },
                    "media_kit_url": {
                      "type": "string"
                    },
                    "medium": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "niche": {
                      "type": "string"
                    },
                    "recent_sponsors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "sponsor_history_url": {
                      "type": ["string", "null"]
                    },
                    "verified_reach": {
                      "type": ["string", "null"]
                    },
                    "verified_sponsors_90d": {
                      "type": "number"
                    }
                  },
                  "required": ["channel", "media_kit_url", "medium", "name", "niche", "recent_sponsors", "sponsor_history_url", "verified_reach", "verified_sponsors_90d"],
                  "type": "object"
                },
                "type": "array"
              },
              "creators_matched": {
                "type": "number"
              },
              "directory_url": {
                "type": "string"
              },
              "medium": {
                "type": ["string", "null"]
              },
              "niche": {
                "type": ["string", "null"]
              }
            },
            "required": ["channel", "creators", "creators_matched", "directory_url", "medium", "niche"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find newsletters, YouTube channels and podcasts to sponsor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f3f3b964205f312b15b573a062f40ae789e2260e13f040fa3596942ba19adcbd"
        },
        {
          "name": "find_newsletter_sponsors",
          "title": "Find sponsors for a newsletter",
          "description": "Use this when someone who runs a newsletter asks which brands might sponsor it or how to find sponsors for it. Takes the newsletter's web address, finds similar newsletters, and returns the brands that sponsored them, with the newsletters and dates where each ad ran. Starts a scan of the public newsletter pages if none exists; a new scan takes about 15 to 60 seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "newsletter_url": {
                "description": "The newsletter's web address, such as yourname.substack.com or yournewsletter.com",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["newsletter_url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "newsletter": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "domain": {
                        "type": "string"
                      },
                      "name": {
                        "type": ["string", "null"]
                      },
                      "niche": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["domain", "name", "niche"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "results_url": {
                "type": ["string", "null"]
              },
              "similar_newsletters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "domain": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["domain", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "sponsors": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "domain": {
                      "type": ["string", "null"]
                    },
                    "last_seen": {
                      "type": ["string", "null"]
                    },
                    "newsletters_sponsored": {
                      "type": ["number", "null"]
                    },
                    "seen_in": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "type": ["string", "null"]
                          },
                          "issue_url": {
                            "type": ["string", "null"]
                          },
                          "newsletter": {
                            "type": "string"
                          }
                        },
                        "required": ["date", "issue_url", "newsletter"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["brand", "domain", "last_seen", "newsletters_sponsored", "seen_in"],
                  "type": "object"
                },
                "type": "array"
              },
              "sponsors_total": {
                "type": "number"
              },
              "status": {
                "enum": ["complete", "running", "needs_details", "failed", "refused"],
                "type": "string"
              }
            },
            "required": ["message", "newsletter", "results_url", "similar_newsletters", "sponsors", "sponsors_total", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find sponsors for a newsletter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
