        },
        {
          "name": "delegate_grant",
          "title": "Delegate Grant",
          "description": "Hand a narrower grant to an agent: a subset of this token's scopes, limits no larger, an expiry no later. Answers a refresh token for the agent, shown once.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expires_in": {
                "description": "Seconds until the child expires.",
                "type": "integer"
              },
              "for": {
                "description": "The agent's OpenProfile.md URL, so the app can see who holds it.",
                "type": "string"
              },
              "grant": {
                "description": "Which of the principal's grants to delegate from. Defaults to the token's own grant.",
                "type": "string"
              },
              "lifetime": {
                "description": "e.g. \"500 USD\"",
                "type": "string"
              },
              "per_call": {
                "description": "e.g. \"5 USD\"",
                "type": "string"
              },
              "per_day": {
                "description": "e.g. \"50 USD\", a rolling day",
                "type": "string"
              },
              "scope": {
                "description": "Space-separated scopes, a subset of the parent's.",
                "type": "string"
              }
            },
            "required": ["scope"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2137a24df47729c77aec7ae71ec8e59fcbf2f9971f725e5e0ad8a8482e5b0355"
