        },
        {
          "name": "check_entitlement",
          "title": "Check Entitlement",
          "description": "Does the principal hold this product in good standing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "<host>/<slug>",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
