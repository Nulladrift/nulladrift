      "instructions": "An OpenAccess hub. whoami, my_grants and my_entitlements need a bearer token from this hub; list_apps does not.",
      "tools": [
        {
          "name": "cancel_entitlement",
          "title": "Cancel Subscription",
          "description": "Ask the seller to cancel. The standing stays until the seller reports the cancellation; the seller's cancel link comes back too.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The entitlement id, from my_entitlements.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
