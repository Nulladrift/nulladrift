      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Call check_tool with one tool name, description, and inputSchema. For a whole tools/list, call check_server with tools, or with result.tools. A check stores nothing. When a finding includes resource, pass that toolcard://answers URI to resources/read. endpoint-shaped-name uses toolcard://answers/mcp-tools-mapped-1-to-1-onto-a-rest-api. thin-description and description-echoes-name use toolcard://answers/mcp-server-loads-but-the-agent-never-calls-it. wide-input uses toolcard://answers/picking-the-right-subset-of-parameters. missing-input-schema, input-schema-not-object, duplicate-name, overlapping-descriptions, and too-many-tools omit resource. Do not invent a URI for them. Do not call report_outcome unless you offered the tool and then saw it called or ignored. resources/list returns these three URIs. A read is not a tool call.",
      "tools": [
        {
          "name": "check_server",
          "title": "Check a tools/list result",
          "description": "Check every tool in a tools/list result or a server card. Returns per-tool findings plus duplicate-name, overlapping-descriptions, and too-many-tools. Those three omit resource. Does not store the tools.",
          "inputSchema": {
            "properties": {
              "result": {
                "description": "JSON-RPC tools/list result. Used only when tools is omitted. The array is result.tools.",
                "type": "object"
              },
              "tools": {
                "description": "Tools from a tools/list result or a server card. Each item has name, description, and inputSchema.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1070062a1874b34cbb5114dec4bbc51cb28c1943a7c92d360b1f31b08671a4e4"
        },
        {
          "name": "check_tool",
          "title": "Check one MCP tool definition",
          "description": "Check one MCP tool name, description, and input schema against Toolcard cited rules. Returns findings. A finding with an answer page includes resource, a toolcard://answers URI to pass to resources/read. Does not store the tool.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Description shown to the model",
                "type": "string"
              },
              "inputSchema": {
                "description": "JSON Schema object for the tool arguments",
                "type": "object"
              },
              "name": {
                "description": "Tool name, for example manage_user",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99f6b98fd24e1dc16b70bf007801ffe8f30982bbdce045735d90d0b464e687dd"
        },
        {
          "name": "outcome_summary",
          "title": "Read the call tally",
          "description": "Return the anonymous tally of called versus ignored reports on this server. Not a representative sample.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
