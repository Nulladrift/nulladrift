            "readOnly": true
          },
          "digest": "sha256:7f3b27dabac41da33782592bca4980ed215a56694cd4ce65efd290ca33aea2d7"
        },
        {
          "name": "report_outcome",
          "title": "Report whether a tool was called",
          "description": "Record whether an agent called or ignored a tool. Stores the name, a SHA-256 of the description, and the result. Does not store the raw description.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "Optional short label such as cursor. No account ids.",
                "type": "string"
              },
              "description": {
                "description": "Hashed with SHA-256 and not stored",
                "type": "string"
              },
              "name": {
                "description": "Tool name that was offered to the agent",
                "type": "string"
              },
              "report_id": {
                "description": "Optional idempotency key, 8 to 80 letters, digits, underscore or hyphen",
                "type": "string"
              },
              "result": {
                "description": "Whether an agent called the tool",
                "enum": ["called", "ignored"],
                "type": "string"
              }
            },
            "required": ["name", "result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
