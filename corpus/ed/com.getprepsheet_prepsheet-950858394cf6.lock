{
  "lockfileVersion": 2,
  "subjects": {
    "com.getprepsheet/prepsheet": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getprepsheet.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ChefSums",
        "title": "ChefSums",
        "version": "1.0.7",
        "description": "Free kitchen costing and prep tools from ChefSums (chefsums.com, formerly PrepSheet): cost a recipe and get a menu price, work out GP with UK VAT, build a daily prep list from par levels, and browse a library of pre-costed UK starter recipes and venue menus scaled to any number of covers.",
        "websiteUrl": "https://chefsums.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ChefSums tools for chefs and kitchen managers. All tools are read-only and need no login. Money values are in GBP by default (the maths works for any currency). Prices are ex-VAT unless a field says inc_vat. Use cost_recipe for a user's own recipe, calculate_gp for gross profit with UK VAT, build_prep_list for par levels, and the starter tools for ChefSums's sample UK recipes and menus. Starter recipe costs are sample UK wholesale prices, not the user's supplier prices; say so when showing them. Results are estimates, not accounting or tax advice.",
      "tools": [
        {
          "name": "build_prep_list",
          "title": "Build a prep list",
          "description": "Build a kitchen prep list from par levels: for each item give the par (the amount you want ready for service) and the amount on hand; prep quantity = par minus on hand, never below zero. Groups items by station.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "description": "Items to prep, 1 to 200. Each needs a name, a par level and the amount on hand in the same unit; unit and station are optional.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "Item, e.g. 'Chicken stock'.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "on_hand": {
                      "description": "Amount already prepped and on hand, same unit.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "par": {
                      "description": "Par level.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "station": {
                      "description": "Optional station, e.g. Larder.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "unit": {
                      "description": "Optional unit, e.g. kg, L, portions.",
                      "maxLength": 20,
                      "type": "string"
                    }
                  },
                  "required": ["name", "on_hand", "par"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "description": "Optional title, e.g. 'Friday larder'.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "by_station": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "items_to_prep": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "station": {
                      "type": "string"
                    }
                  },
                  "required": ["items_to_prep", "station"],
                  "type": "object"
                },
                "type": "array"
              },
              "free_template_url": {
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "needs_prep": {
                      "type": "boolean"
                    },
                    "on_hand": {
                      "type": "number"
                    },
                    "par": {
                      "type": "number"
                    },
                    "prep_quantity": {
                      "type": "number"
                    },
                    "station": {
                      "type": "string"
                    },
                    "unit": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "needs_prep", "on_hand", "par", "prep_quantity", "station", "unit"],
                  "type": "object"
                },
                "type": "array"
              },
              "items_already_at_par": {
                "type": "number"
              },
              "items_to_prep": {
                "type": "number"
              },
              "items_total": {
                "type": "number"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["by_station", "free_template_url", "items", "items_already_at_par", "items_to_prep", "items_total", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a prep list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af3d1c6575c8bd7bda982e439df3313ca2b3ddc0f19496f2960334b95456283d"
        },
        {
          "name": "calculate_gp",
          "title": "Calculate GP",
          "description": "UK gross profit (GP) calculator for food and drink. mode 'gp_from_price': give cost_ex_vat and selling_price_inc_vat to get GP % and GP per sale (VAT is removed first, as UK hospitality measures it). mode 'price_from_gp': give cost_ex_vat and target_gp_pct to get the menu price needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cost_ex_vat": {
                "description": "Cost of one item/portion, ex-VAT.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "mode": {
                "description": "gp_from_price or price_from_gp.",
                "enum": ["gp_from_price", "price_from_gp"],
                "type": "string"
              },
              "selling_price_inc_vat": {
                "description": "Menu price inc VAT. Required for gp_from_price.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "target_gp_pct": {
                "description": "Target GP %. Required for price_from_gp.",
                "maximum": 99,
                "minimum": 1,
                "type": "number"
              },
              "vat_rate_pct": {
                "description": "VAT rate. Default 20; use 0 for zero-rated items.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["cost_ex_vat", "mode"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cost_ex_vat": {
                "type": "number"
              },
              "food_cost_pct": {
                "type": "number"
              },
              "gp_pct": {
                "type": "number"
              },
              "gross_profit": {
                "type": "number"
              },
              "mode": {
                "type": "string"
              },
              "more_info": {
                "type": "string"
              },
              "net_price_ex_vat": {
                "type": "number"
              },
              "selling_price_inc_vat": {
                "type": "number"
              },
              "vat_rate_pct": {
                "type": "number"
              },
              "verdict": {
                "type": "string"
              }
            },
            "required": ["cost_ex_vat", "food_cost_pct", "gp_pct", "gross_profit", "mode", "more_info", "net_price_ex_vat", "selling_price_inc_vat", "vat_rate_pct", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate GP"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6bf2e29de1e3e81c797b064d42f43ba30a1d34b0930a4c9e45ca63665b82f45"
        },
        {
          "name": "cost_recipe",
          "title": "Cost a recipe",
          "description": "Cost any recipe from its ingredients. For each ingredient give the pack price, the pack size and the quantity used (same unit as the pack size, e.g. grams). Returns each line cost, batch cost, cost per portion and a suggested menu price from a target food cost % (default 30%), ex-VAT and inc-VAT. open_in_prepsheet_url opens this exact recipe in the free ChefSums tool (no sign-in), where the user can edit, scale, print and save it; the recipe travels in the link itself and is not stored by ChefSums.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ingredients": {
                "description": "The recipe's ingredients, 1 to 100 lines. Each line needs a name, the ex-VAT pack price, the pack size and the quantity used in the same unit as the pack size.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "Ingredient name.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "pack_price": {
                      "description": "Price paid for the whole pack, ex-VAT.",
                      "maximum": 100000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "pack_size": {
                      "description": "Size of the pack, e.g. 2000 for a 2 kg bag in grams.",
                      "exclusiveMinimum": 0,
                      "maximum": 10000000,
                      "type": "number"
                    },
                    "quantity_used": {
                      "description": "Amount used in this recipe, in the same unit as pack_size.",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "unit": {
                      "description": "Optional unit label, e.g. g, ml, each.",
                      "maxLength": 20,
                      "type": "string"
                    }
                  },
                  "required": ["name", "pack_price", "pack_size", "quantity_used"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "portions": {
                "description": "How many portions the batch makes.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "recipe_name": {
                "description": "Optional dish name.",
                "maxLength": 120,
                "type": "string"
              },
              "target_food_cost_pct": {
                "description": "Target food cost as % of the ex-VAT price. Default 30.",
                "maximum": 99,
                "minimum": 1,
                "type": "number"
              },
              "vat_rate_pct": {
                "description": "VAT rate for the inc-VAT price. Default 20 (UK standard).",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["ingredients", "portions"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "batch_cost": {
                "type": "number"
              },
              "cost_per_portion": {
                "type": "number"
              },
              "ingredients": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "line_cost": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "pack_price": {
                      "type": "number"
                    },
                    "pack_size": {
                      "type": "number"
                    },
                    "quantity_used": {
                      "type": "number"
                    },
                    "share_of_cost_pct": {
                      "type": "number"
                    },
                    "unit": {
                      "type": "string"
                    }
                  },
                  "required": ["line_cost", "name", "pack_price", "pack_size", "quantity_used", "share_of_cost_pct", "unit"],
                  "type": "object"
                },
                "type": "array"
              },
              "open_in_prepsheet_url": {
                "type": "string"
              },
              "portions": {
                "type": "number"
              },
              "premium_price_ex_vat_at_75_gp": {
                "type": ["number", "null"]
              },
              "premium_price_inc_vat_at_75_gp": {
                "type": ["number", "null"]
              },
              "recipe_name": {
                "type": "string"
              },
              "suggested_price_ex_vat": {
                "type": "number"
              },
              "suggested_price_inc_vat": {
                "type": "number"
              },
              "target_food_cost_pct": {
                "type": "number"
              },
              "target_gp_pct": {
                "type": "number"
              },
              "vat_rate_pct": {
                "type": "number"
              }
            },
            "required": ["batch_cost", "cost_per_portion", "ingredients", "open_in_prepsheet_url", "portions", "premium_price_ex_vat_at_75_gp", "premium_price_inc_vat_at_75_gp", "recipe_name", "suggested_price_ex_vat", "suggested_price_inc_vat", "target_food_cost_pct", "target_gp_pct", "vat_rate_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cost a recipe"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4dc077899b6c9bd3b06093b35844a53660abb78ed12833ed88e1868f9d5970d8"
        },
        {
          "name": "get_recipe_prep_sheet",
          "title": "Get a recipe prep sheet",
          "description": "Get a printable-style prep sheet for one ChefSums starter recipe, scaled to a number of covers (portions): every ingredient quantity scaled, the method, and the costing (batch cost, cost per portion, suggested menu price ex and inc 20% VAT). Example: slug 'cottage-pie', covers 80.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "covers": {
                "description": "Number of portions to scale to. Defaults to the recipe's base portions.",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Recipe slug from list_starter_recipes, e.g. 'cottage-pie'.",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "base_portions": {
                "type": "number"
              },
              "costing": {
                "additionalProperties": false,
                "properties": {
                  "batch_cost_gbp": {
                    "type": "number"
                  },
                  "cost_per_portion_gbp": {
                    "type": "number"
                  },
                  "suggested_price_ex_vat_gbp": {
                    "type": "number"
                  },
                  "suggested_price_inc_vat_gbp": {
                    "type": "number"
                  },
                  "target_food_cost_pct": {
                    "type": "number"
                  }
                },
                "required": ["batch_cost_gbp", "cost_per_portion_gbp", "suggested_price_ex_vat_gbp", "suggested_price_inc_vat_gbp", "target_food_cost_pct"],
                "type": "object"
              },
              "covers": {
                "type": "number"
              },
              "ingredients": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "line_cost_gbp": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "quantity": {
                      "type": "number"
                    },
                    "unit": {
                      "type": "string"
                    }
                  },
                  "required": ["line_cost_gbp", "name", "quantity", "unit"],
                  "type": "object"
                },
                "type": "array"
              },
              "method_steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "open_in_prepsheet_url": {
                "type": "string"
              },
              "recipe_url": {
                "type": "string"
              },
              "scale_factor": {
                "type": "number"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["base_portions", "costing", "covers", "ingredients", "method_steps", "name", "note", "open_in_prepsheet_url", "recipe_url", "scale_factor", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a recipe prep sheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80621dbc64527b2fda456c6b61709897f5173e20193130a328336ee9c4963940"
        },
        {
          "name": "get_starter_menu",
          "title": "Get a starter menu",
          "description": "Get ChefSums's ready-costed starter menu for a UK venue type. With no venue, lists the venue types (pub, cafe, restaurant, takeaway) and their dishes. With a venue, returns every dish with its menu price, ingredient cost per portion, food cost % and GP % (prices ex-VAT, plus inc 20% VAT).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "venue": {
                "description": "One of pub, cafe, restaurant, takeaway. Omit to list the venue types.",
                "enum": ["pub", "cafe", "restaurant", "takeaway"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "menu": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "average_gp_pct": {
                        "type": "number"
                      },
                      "dishes": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "cost_per_portion_gbp": {
                              "type": "number"
                            },
                            "food_cost_pct": {
                              "type": "number"
                            },
                            "gp_pct": {
                              "type": "number"
                            },
                            "menu_price_ex_vat_gbp": {
                              "type": "number"
                            },
                            "menu_price_inc_vat_gbp": {
                              "type": "number"
                            },
                            "name": {
                              "type": "string"
                            },
                            "slug": {
                              "type": "string"
                            }
                          },
                          "required": ["cost_per_portion_gbp", "food_cost_pct", "gp_pct", "menu_price_ex_vat_gbp", "menu_price_inc_vat_gbp", "name", "slug"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "label": {
                        "type": "string"
                      },
                      "venue": {
                        "type": "string"
                      }
                    },
                    "required": ["average_gp_pct", "dishes", "label", "venue"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "more_info": {
                "type": "string"
              },
              "venues": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "blurb": {
                      "type": "string"
                    },
                    "dish_count": {
                      "type": "number"
                    },
                    "label": {
                      "type": "string"
                    },
                    "venue": {
                      "type": "string"
                    }
                  },
                  "required": ["blurb", "dish_count", "label", "venue"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["menu", "more_info", "venues"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a starter menu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3258f9f679f3a3a62c0f4b5034b498b8d1395e34a2936b683002e7aee8c2eefc"
        },
        {
          "name": "list_starter_recipes",
          "title": "List starter recipes",
          "description": "List ChefSums's library of pre-costed UK starter recipes (pub, cafe, restaurant and takeaway dishes) with their base portions and ingredient cost per portion in GBP. Use the slug with get_recipe_prep_sheet. Optional 'search' filters by name (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "search": {
                "description": "Optional text to filter recipe names, e.g. 'chicken'.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "number"
              },
              "more_info": {
                "type": "string"
              },
              "recipes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "base_portions": {
                      "type": "number"
                    },
                    "cost_per_portion_gbp": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "recipe_url": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["base_portions", "cost_per_portion_gbp", "name", "recipe_url", "slug"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "more_info", "recipes"],
            "type": "object"
          },
