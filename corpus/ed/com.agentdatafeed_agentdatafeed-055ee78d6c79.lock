      "serverInfo": {
        "name": "agentdatafeed",
        "title": "ADF: EU, UK and AU Tenders and Contracts, EU and US Grants, Sanctions (EU, OFAC, UK, CA, JP, NZ), Product Recalls, EU Medicines, Drug Shortages, EU and UK Legislation, EU Case Law, US Federal Register, SEC Filings, LEI, Company Changes, Competition Cases, VAT, Excise and Customs Tariffs, Policy Rates, Bond Yields, Release Calendars, Fuel and Electricity Prices, Travel Advisories, Hazard Alerts, Air Quality, CVE KEV EPSS NVD, CERT Advisories, Public Holidays, Amsterdam Events",
