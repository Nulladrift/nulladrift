        {
          "name": "list_datasets",
          "title": "List datasets, prices and filters",
          "description": "Free. Returns every agentdatafeed dataset with record count, last update, price per query, filters and links. Call it first to choose a dataset, then use get_sample to inspect records or query_dataset for filtered data. When to use each dataset: amsterdam-events: Use when a user asks what is on in Amsterdam on a date or in a district, plans travel, venues, staffing, security or deliveries around large events, or needs crowd sizes, road closures context or permit status before the event appears on ticket sites, for example \"which large events are on in Amsterdam Centrum this weekend?\" security-advisories: Use when a user asks whether a CVE is actively exploited, which vulnerabilities in a vendor or product to patch first, whether it is used in ransomware campaigns, or needs CISA KEV due dates, required actions and FIRST EPSS exploit probability in one call, for example \"is CVE-2021-44228 actively exploited?\" vulnerability-watch: Use when a user asks which recent vulnerabilities affect a server product or version, wants new critical CVEs (for example CVSS 9 or higher) for a vendor this week, or needs CVSS, affected version ranges and exploit signals (KEV, EPSS) for a CVE in the news, for example \"which critical CVEs were published for OpenSSH this week?\" eu-tenders: Use when a user asks which public tenders or government contracts are open in an EU country or sector, wants bid opportunities by CPV code or keyword with a deadline, needs smaller national tenders below the EU thresholds in France (procedures adaptees and national notices from BOAMP, by departement) or Germany (VOB/A and UVgO notices, by NUTS region), or needs to monitor what public buyers are procuring before the deadline passes, for example \"which IT tenders are open in the Netherlands?\" uk-tenders: Use when a user asks which UK government or public sector contracts are open to bid, wants UK tender opportunities by sector, CPV code, keyword, region or buyer with the deadline and value, or needs Find a Tender and Contracts Finder notices in one search, for example SME-friendly IT tenders in Scotland closing this month. au-contracts: Use when a user asks which Australian Government agencies buy a product or service, who won federal contracts in a UNSPSC category, what a supplier or competitor (by name or ABN) has been awarded and for how much, or needs AusTender contract values for market sizing, for example IT consulting contracts above AUD 1 million awarded by Defence this year. eu-funding: Use when a user asks which EU grants, subsidies or Horizon Europe calls are open or coming up for a topic, sector or organisation type, needs the deadline, budget and call link for an EU funding opportunity, or looks for small cascade funding calls for SMEs and start-ups, for example \"which Horizon Europe calls on AI close this quarter?\" us-grants: Use when a user asks which US federal grants or cooperative agreements are open or coming up for a topic, agency or applicant type (for example small businesses, nonprofits, tribal governments or universities), needs the close date, award ceiling, Assistance Listing number and Grants.gov link for a funding opportunity, or wants US federal funding next to EU calls from eu-funding, for example \"which NIH grants for small businesses are open?\" cert-advisories: Use when a user asks whether the Dutch, German, French, Polish, Swedish, Finnish, UK or US national CERT (CISA) or CERT-EU has warned about a CVE, vendor or product, needs the official advisory ID and link for a patch or NIS2 report, wants CISA ICS advisories for industrial or medical equipment, or wants recent government advisories that cover known exploited (CISA KEV) vulnerabilities, for example \"has CERT-Bund, NCSC-NL or CISA warned about this Fortinet vulnerability?\" eu-medicines: Use when a user asks whether a medicine or active substance is authorised in the EU, who holds the marketing authorisation, what it is indicated for, whether there is a current EMA-monitored shortage, or which safety communications and referral procedures concern it, for example \"is semaglutide authorised in the EU and who holds the authorisation?\" sanctions-entities: Use when a user or a KYC, AML, procurement or shipping workflow needs to check whether a company, organisation, vessel or aircraft is on the EU, US OFAC (SDN or non-SDN), UK, Canadian, Japanese (MOF) or New Zealand (MFAT Russia) sanctions list, see on which of these lists it appears with each programme and listing date, find the legal basis of a listing, or look up a sanctioned vessel by IMO number, for example \"is this supplier, ship owner or counterparty sanctioned?\" before onboarding or payment; not for screening individual people. product-recalls: Use when a user, shop, marketplace, procurement or compliance workflow asks whether a product, food, medicine, medical device, vehicle, tyre or child car seat has been recalled or flagged as unsafe in the US (FDA, CPSC, NHTSA), Canada, the UK, the EU (Safety Gate for non-food products, RASFF for food and feed), France (RappelConso), the Netherlands (NVWA), Australia (FSANZ food recalls) or New Zealand (MBIE product recalls), which allergen, contaminant or hazard caused it, how serious the recall class or risk is, whether a recalled car should not be driven, which recalls concern a given brand, barcode, firm or vehicle make, which FDA medical device recalls concern a device type, product code or 510(k) or PMA number and why (root cause), or which EU alerts concern products from a given country of origin, for example \"is this product recalled?\" before it is sold, bought or shipped. eu-legislation: Use when a user, compliance, legal or policy workflow asks which EU regulations, directives or decisions were recently published or amended on a topic, whether an act is in force and from when, which acts amend or repeal a given CELEX number, or needs the CELEX, ELI or OJ reference and the official EUR-Lex link of an EU act, for example \"which EU regulations on packaging were published this year?\" eu-case-law: Use when a user, legal, compliance or research workflow asks which recent rulings of the EU Court of Justice or General Court concern a topic or procedure, which preliminary references came from a given Member State, what a case number or ECLI refers to and when it was decided, or needs the CELEX, ECLI and official EUR-Lex link of an EU judgment, order or Advocate General opinion, for example \"which preliminary rulings on data protection did the Court of Justice deliver this year?\" uk-legislation: Use when a user, compliance, legal or policy workflow asks which UK, Scottish, Welsh or Northern Ireland Acts or statutory instruments were recently made or published on a topic, when an instrument comes into force, where it extends, which department made it, or needs the official legislation.gov.uk identifier, SI number and link of an item of UK legislation, for example \"which UK statutory instruments on pensions were made this year?\" or \"which Scottish Statutory Instruments come into force next month?\" us-federal-register: Use when a user, compliance, legal or policy workflow asks which US federal rules, proposed rules, notices or executive orders were recently published by an agency or on a topic, when a rule takes effect, which comment periods are still open and until when, which documents affect a given CFR title or part, or needs the FR citation, docket ID, RIN and official link of a Federal Register document, for example \"which EPA proposed rules are still open for comment?\" drug-shortages: Use when a user, pharmacist, hospital, wholesaler or procurement workflow asks whether a medicine or active substance is currently in short supply in the US, the EU, Spain, France or Austria, why, since when, when supply is expected back, which manufacturers, strengths or packs are affected, or whether alternatives are available, for example \"is amoxicillin in shortage in Spain or France?\" drug-approvals: Use when a user, analyst, pharmacist, regulatory affairs or market access workflow asks when and by which regulator a medicine or active substance was approved in the US, Canada or the UK, which new active substances, generics or biosimilars were approved in a period, which approvals a company received, or whether an approval was orphan, accelerated, conditional or tentative, for example \"which generics of apixaban did the FDA approve in 2026?\" public-holidays: Use when a user, scheduler, payroll, logistics or booking workflow needs to know whether a date is an official public or bank holiday in one of the covered countries or regions, which holidays fall in a date range, or how to count business days around holidays this year or next year, for example \"is 26 December a bank holiday in Scotland?\" or \"which days are public holidays in Madrid in 2027?\" release-calendars: Use when a user, trading, research, newsroom or scheduling workflow needs an official economic calendar: when an official statistic such as CPI, GDP, employment or trade figures will be (or was) published by Eurostat, the ONS, BLS, BEA, the Census Bureau, Statistics Canada, the ABS, CBS (Netherlands), SCB (Sweden), SSB (Norway) or INE (Spain), when the next FOMC meeting ends or the next Bank of Canada, Norges Bank or RBA rate decision is due, which releases fall in a date range, or whether a release was postponed or cancelled, for example \"when is the next UK CPI release?\" travel-advisories: Use when a user, travel booking, duty-of-care or travel-risk workflow needs to know what the US, UK, Canadian, Dutch, Japanese, French or New Zealand government currently advises about travelling to a country, wants to compare those governments' levels for one destination, list destinations at or above a level, or find advice levels that changed since a date, for example \"what do the US, UK, Canada and the Netherlands advise about travel to Egypt?\" vat-rates: Use when an invoicing, checkout, accounting or e-commerce workflow needs the official VAT, GST or consumption tax rate of a country (EU, UK, Canada and its provinces, New Zealand, Norway, Japan, Iceland or Australia) on a given date, the reduced or zero rate for a category of goods or services such as food, books or accommodation, or the history of rate changes, for example \"what is the reduced VAT rate on books in Germany?\" exchange-rates: Use when an agent converts prices, invoices, tender values, travel costs or accounts between currencies and needs an official central bank exchange rate for a date, the latest published rate, or the rate history of a pair, from the Bank of Canada, Reserve Bank of Australia, US Federal Reserve (H.10), Sveriges Riksbank, Czech National Bank or Central Bank of Iceland, European Central Bank or Danmarks Nationalbank, for example \"what was the Bank of Canada USD/CAD rate on 2026-10-30?\" or \"what is the latest Czech National Bank EUR fixing?\". These are official reference, fixing or indicative rates published once per business day, not live market quotes or transaction rates; for trading use a market data feed. The ECB and Danmarks Nationalbank rates are free of charge on the ECB website (https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html). excise-duties: Use when a pricing, import, compliance, accounting or market research workflow needs the official excise duty on beer, wine, spirits, cigarettes, other tobacco products or road fuels in the United Kingdom, the United States or New Zealand on a given date, the unit the duty is charged on, reduced rates for small producers or draught products, or announced and previous rates, for example \"what is the UK duty on a litre of pure alcohol in 5% beer?\", \"what is the US federal excise tax on a proof gallon of spirits?\" or \"what is the New Zealand excise on cigarettes?\" corporate-tax-rates: Use when a finance, transfer pricing, investment, location comparison, accounting or research workflow needs the official statutory headline corporate income tax rate of a country in a given year or its history since 2000, the split between the central government rate and the sub-central (state or local) rate, a small business rate, or the standard domestic withholding tax rate on outbound dividends, interest, royalties or technical fees, for example \"what is the combined corporate tax rate in Germany in 2025?\", \"how has the Dutch corporate tax rate changed since 2010?\" or \"what is the standard withholding tax on dividends in Brazil?\". Not for effective tax rates, treaty rates, tax planning or advice. customs-tariffs: Use when an import, sourcing, landed cost, e-commerce, compliance or market research workflow needs the official MFN import duty for an HS, HTS or commodity code in the United Kingdom or the United States, the US preferential rate for a free trade agreement or programme, the US column 2 rate, the UK end-use duty and its conditions, or the codes and duties in an HS chapter, for example \"what is the UK import duty on 6403990510?\", \"what is the US general duty on HTS 8471.30.01?\" or \"which US programmes give duty-free entry for 0807.19.70?\" bond-yields: Use when a finance, treasury, pricing, risk, research or reporting workflow needs an official government bond yield or Treasury bill rate for a country, tenor and day, the shape of a yield curve, or how a yield moved over time; for example: what was the US 10-year Treasury yield on 2024-03-15, what is the latest 2-year JGB yield, show the Canadian 3-month bill rate over the last month, is the US curve inverted between 2 and 10 years today? policy-rates: Use when a finance, treasury, lending, pricing or research workflow needs the current or historical official policy rate of the US Federal Reserve, Bank of Canada, Reserve Bank of Australia, Bank of England, Norges Bank, Sveriges Riksbank, Danmarks Nationalbank or Czech National Bank, the date a decision was announced or took effect, or the sequence of rate changes, for example \"what is the Bank of England Bank Rate now and when did it last change?\" or \"when did the Fed last cut rates and by how much?\"; the ECB, Bank of Japan and Swiss National Bank are not included yet company-identifiers: Use when a know-your-customer, onboarding, invoice or supplier validation, or due diligence workflow needs the official LEI, registered name, legal form, business register number, country and parent of a legal entity that recently obtained an LEI, or needs to know whether a counterparty's LEI was recently retired, annulled, merged or its entity closed; for example \"was this counterparty's LEI retired or its entity closed this month?\"; for an older LEI with no recent change, check the record at the GLEIF link. company-changes: Use when a sales prospecting, credit risk, supplier monitoring, know-your-customer or market research workflow needs companies that were newly registered, renamed, declared bankrupt or put into liquidation or restructuring in a country in the last month, filtered by industry or legal form, for example \"which limited companies in software (NACE 62) were registered in Finland this week?\", \"has this Finnish supplier gone bankrupt or into liquidation recently?\" or \"which Latvian SIA companies were registered or struck off in Riga this month?\" competition-cases: Use when a user, M&A, legal, compliance or investment research workflow asks whether a deal or company is under merger review in the UK or has received US HSR early termination, which CMA merger inquiries are open and when their statutory deadline falls, how a recent CMA case was decided, which subsidies were referred to the CMA Subsidy Advice Unit and for whom, or needs the official case link, for example \"which CMA merger inquiries are still open and what are their deadlines?\" or \"did the FTC grant early termination for a deal involving Bayer this year?\" hazard-alerts: Use when a logistics, travel, insurance or supply-chain workflow asks which earthquakes, wildfires, tropical cyclones, floods or other natural hazards hit or threaten a country, route or site in the last 30 days, which official weather warnings (storm, wind, snow, ice, frost, rain, thunderstorm, fog) were in force today in Germany or Canada, or whether a tsunami bulletin was issued, how strong they were, and where to read the official report, for example \"were there strong earthquakes or cyclones near Manila last week?\" or \"is there an orange or red weather warning for Hamburg?\"; the data is refreshed once a day, so do not use it for real-time or life-safety alerts and always check the official warning page. sec-filings: Use when a due diligence, investment research, compliance or monitoring workflow asks which filings a US-listed or SEC-registered company made recently, whether a company filed a new 8-K, 10-K, 10-Q, registration statement, late filing notice, delisting or Form D, which listed companies are the subject of a new 13D or 13G stake disclosure, or needs the accession number, CIK and sec.gov link of a recent filing, for example \"did this company file an 8-K or a late filing notice this week?\" air-quality: Use when a health, travel, real estate, outdoor event, logistics or ESG reporting workflow needs recent official measured air pollution (PM2.5, PM10, NO2 or O3) at or near a place in Europe, the stations with the highest values in a country, or the days in the last week a station crossed an EU limit or alert threshold; the data is refreshed once a day and unverified, so do not use it for real-time health alerts or official compliance assessments. fuel-prices: Use when a travel cost, logistics, fleet, expense, pricing or market research workflow needs the official weekly average pump price of petrol, diesel or LPG in an EU country, the UK or the US (or a US region), how it changed over weeks or years, or the share of taxes in the EU price; for example: what did a litre of diesel cost in Germany last week, how has UK petrol changed since 2022, what is regular gasoline in California now, which EU country has the cheapest Euro-super 95? electricity-prices: Use when an energy cost, smart charging, heat pump or battery scheduling, trading, procurement or ESG reporting workflow needs the official day-ahead wholesale electricity price of a European bidding zone (DK1, DK2, DE-LU, NO2, SE3, SE4) or an ERCOT hub or load zone for a given hour or quarter-hour, tomorrow's cheapest hours, negative price periods, or how prices moved over the last weeks; for example: what is the day-ahead price in DK1 tomorrow at 18:00, which hours are cheapest in Germany tomorrow, were there negative prices in SE4 last week, what did ERCOT HB_NORTH clear at yesterday afternoon?",
