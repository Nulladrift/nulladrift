          "title": "Order a land-registry index / Commander un index",
          "description": "Use this when the user needs the index of immovables (index des immeubles) for one lot. Queues the index on the organization’s own Registre foncier account and returns a job id; follow it with job_get, then job_results. Always consults the Registre. Send a unique idempotency_key; a retry with the same key returns the stored answer instead of charging twice (kept 24 h). Envoyez une idempotency_key unique ; un nouvel essai avec la même clé ne facture pas deux fois (conservée 24 h). Requires an authenticated Fonciq account. / Exige un compte Fonciq authentifié. Side effect: delivers one document and charges the prepaid balance; the Registre foncier also bills its own separate fee. State the amount returned by the call before the user spends. Effet de bord : livre un document et débite le solde prépayé ; le Registre foncier facture aussi ses propres frais. Annoncez le montant renvoyé par l’appel avant toute dépense. À utiliser pour commander l’index des immeubles d’un lot ; consulte toujours le Registre.",
