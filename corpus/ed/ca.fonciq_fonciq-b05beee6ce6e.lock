        {
          "name": "watch_create",
          "title": "Watch a lot / Surveiller un lot",
          "description": "Use this when the user wants a lot re-checked on a schedule (weekly or daily) and notified at their own https webhook; the Registre has no push feed. Creating the watch is not charged, but every later check can deliver a document, so the cost recurs. Send a unique idempotency_key; a retry with the same key returns the stored answer instead of charging twice (kept 24 h). Envoyez une idempotency_key unique ; un nouvel essai avec la même clé ne facture pas deux fois (conservée 24 h). Requires an authenticated Fonciq account. / Exige un compte Fonciq authentifié. À utiliser pour surveiller un lot ; la création n’est pas facturée, mais chaque revérification peut livrer un document.",
