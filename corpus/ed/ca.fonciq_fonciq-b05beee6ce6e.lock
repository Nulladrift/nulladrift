        {
          "name": "flood_zones_lookup",
          "title": "Québec flood zones at a point, address or lot / Zones inondables au Québec",
          "description": "Needs no account. Checks which of 9 open Québec flood-zone sources (BDZI, flood-zone presence grid, the historical 2017-2019 ZIS, Gatineau, Québec, Sherbrooke, Montréal) intersect a point. Give exactly one of: lat+lon, address (Québec civic address, matched to the Référentiel québécois des adresses) or lot (lot number, answered on its RQA address points). Returns the zones at the point, the source zone type, the distance to the nearest zone, CC BY 4.0 attribution per source and a disclaimer. A no-hit means \"No zone found at this point\", never that a property is outside a flood zone; the lot boundary is not evaluated. These are old-generation and indicative maps; new-generation maps (in force by sector since March 1, 2026) are not included, so each answer links to the official Québec map to confirm. The 2017-2019 ZIS was lifted in 2022 and is shown as historical, never rated high. Limits: 30 requests/min and 1000/day per IP, shared with the HTTP endpoint. Docs: https://mcp.fonciq.ca. Sans compte. Indique quelles zones inondables de 9 sources ouvertes touchent un point, une adresse ou un lot ; distance à la zone la plus proche, attribution CC BY 4.0 et avertissement. Une absence de résultat signifie « Aucune zone trouvée à ce point », jamais qu’une propriété est hors zone inondable ; la limite du lot n’est pas évaluée. Cartographie d’ancienne génération et couches indicatives ; la nouvelle génération n’est pas incluse : chaque réponse renvoie à la carte interactive officielle du gouvernement du Québec. La ZIS 2017-2019, levée en 2022, est historique. Information indicative seulement, pas une attestation officielle.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Québec civic address, e.g. \"148 Rue de la Cédrière, Gatineau\". / Adresse civique.",
                "type": "string"
              },
              "lang": {
                "default": "fr",
                "description": "Answer language. / Langue de la réponse.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude WGS84 (Québec). Use with lon.",
                "type": "number"
              },
              "lon": {
                "description": "Longitude WGS84 (Québec). Use with lat.",
                "type": "number"
              },
              "lot": {
                "description": "Québec lot number, 5 to 9 digits, spaces allowed. / Numéro de lot.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Flood zones (free) / Zones inondables (gratuit)"
          },
          "behavior": {
