        {
          "name": "plan_get",
          "title": "Get a cadastral plan / Obtenir un plan cadastral",
          "description": "Use this when the user needs the cadastral plan of one lot; cadastre defaults to the Cadastre du Québec, and other cadastres fail closed. Send a unique idempotency_key; a retry with the same key returns the stored answer instead of charging twice (kept 24 h). Envoyez une idempotency_key unique ; un nouvel essai avec la même clé ne facture pas deux fois (conservée 24 h). Requires an authenticated Fonciq account. / Exige un compte Fonciq authentifié. Side effect: delivers one document and charges the prepaid balance; the Registre foncier also bills its own separate fee. State the amount returned by the call before the user spends. Effet de bord : livre un document et débite le solde prépayé ; le Registre foncier facture aussi ses propres frais. Annoncez le montant renvoyé par l’appel avant toute dépense. À utiliser pour obtenir le plan cadastral d’un lot ; les autres cadastres échouent.",
          "inputSchema": {
