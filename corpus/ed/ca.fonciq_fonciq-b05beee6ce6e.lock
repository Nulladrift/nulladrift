                "description": "Lot number. / Numéro de lot.",
                "type": "string"
              },
              "plan": {
                "description": "Which plan to pull. Omit to list the lot’s real choices and ask the user. / Plan à tirer ; omis, l’appel liste les choix réels du lot.",
                "enum": ["global", "renovation", "parcellaire", "complementaire"],
