      "instructions": "Fonciq gives an authenticated account Québec land data: lots, Registre foncier indexes, deeds and cadastral plans. Typical sequence: lot_resolve → registre_index_request → job_get → job_results → acte_get or plan_get. Tools that deliver a document charge the prepaid balance and consult the Registre foncier, which bills its own separate fee: state the amount returned by the call before the user spends, and never invent an amount. A stored document (index, plan, acte) is free: quote 0 and no Registre fee. Read-only tools charge nothing. For plan choices, call plan_get without plan; capabilities lists the catalogue. Free tools need no account: flood_zones_lookup (30/min), capabilities, workflow_guide, feedback_send. registre_portal_closed: the Registre is closed (6 h–midnight) or maintenance; it runs at opening, nothing lost, no new charge. Answer in the user’s language; the registry data itself is French. Flood-zone results are indicative: no zone at a point does not mean outside the flood zone. Fonciq is a private company, not affiliated with the Ministère des Ressources naturelles et des Forêts or the Registre foncier du Québec. Endpoint and setup: https://mcp.fonciq.ca/llms.txt",
      "tools": [
        {
          "name": "acte_get",
          "title": "Get one deed PDF / Obtenir le PDF d’un acte",
          "description": "Use this when the user needs the PDF of one deed, identified by registration number and circonscription foncière. Returns a deed Fonciq already holds; a deed it does not hold fails closed rather than re-querying. Structured deed analysis is not offered. Send a unique idempotency_key; a retry with the same key returns the stored answer instead of charging twice (kept 24 h). Envoyez une idempotency_key unique ; un nouvel essai avec la même clé ne facture pas deux fois (conservée 24 h). Requires an authenticated Fonciq account. / Exige un compte Fonciq authentifié. Side effect: delivers one document and charges the prepaid balance; the Registre foncier also bills its own separate fee. State the amount returned by the call before the user spends. Effet de bord : livre un document et débite le solde prépayé ; le Registre foncier facture aussi ses propres frais. Annoncez le montant renvoyé par l’appel avant toute dépense. À utiliser pour obtenir le PDF d’un acte par numéro d’inscription ; un acte absent échoue sans nouvelle requête.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "circonscription": {
                "description": "Circonscription foncière, e.g. \"Montréal\".",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique key for this write, 8+ characters. / Clé unique pour cette écriture.",
                "maxLength": 255,
                "minLength": 8,
                "type": "string"
              },
              "registration_number": {
                "description": "Registration number, e.g. \"14 736 430\". / Numéro d’inscription.",
                "type": "string"
              },
              "rf_account_id": {
                "description": "Registre account id; omit for the organization default. / Compte du Registre ; par défaut si omis.",
                "type": "string"
              }
            },
            "required": ["circonscription", "idempotency_key", "registration_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Commander un acte"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b69696cc0c223a245b640b2a87163975ef039ee963c23d541cb176fb0fee24f"
        },
        {
          "name": "batch_submit",
          "title": "Order an index for many lots in one request / Commander un index par lot, en une requête",
          "description": "Use this when the user has a list of lots (up to 500) and wants the index ordered for each. One request to one endpoint, not a loop of single-lot calls: the API queues a single job and spreads the lots across the organization’s active Registre accounts unless one is pinned. Before calling, tell the user how many documents this will order and get their agreement, then pass that same number in documents_confirmed; a mismatch is refused. Send a unique idempotency_key; a retry with the same key returns the stored answer instead of charging twice (kept 24 h). Envoyez une idempotency_key unique ; un nouvel essai avec la même clé ne facture pas deux fois (conservée 24 h). Requires an authenticated Fonciq account. / Exige un compte Fonciq authentifié. Side effect: delivers one document and charges the prepaid balance; the Registre foncier also bills its own separate fee. State the amount returned by the call before the user spends. Effet de bord : livre un document et débite le solde prépayé ; le Registre foncier facture aussi ses propres frais. Annoncez le montant renvoyé par l’appel avant toute dépense. À utiliser pour commander l’index de plusieurs lots en une seule requête, 500 au maximum ; annoncez le nombre de documents et attendez l’accord avant l’appel.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "documents_confirmed": {
                "description": "Number of documents the user explicitly agreed to order. Must equal the number of distinct lots, or the call is refused. / Nombre de documents acceptés par l’utilisateur ; doit égaler le nombre de lots distincts.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Unique key for this write, 8+ characters. / Clé unique pour cette écriture.",
                "maxLength": 255,
                "minLength": 8,
                "type": "string"
              },
              "lots": {
                "description": "Lot numbers, one document each. / Numéros de lot, un document chacun.",
                "items": {
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "rf_account_id": {
                "description": "Registre account id; omit for the organization default. / Compte du Registre ; par défaut si omis.",
                "type": "string"
              }
            },
            "required": ["documents_confirmed", "idempotency_key", "lots"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Commander des index en lot"
