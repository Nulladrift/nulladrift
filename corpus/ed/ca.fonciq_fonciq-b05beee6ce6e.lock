      "instructions": "Fonciq AI connector (Connecteur IA) for Québec land data — not a government registry API. Setup and rules: https://mcp.fonciq.ca/llms.txt . Endpoint: https://mcp.fonciq.ca/v1/ . Auth: OAuth via fonciq.ca (ChatGPT/Claude) or Authorization: Bearer fq_test_… / fq_live_… (personal API key). After initialize, call tools/list and pick a tool; required JSON fields are in each inputSchema. flood_zones_lookup is free and needs no key (30 req/min, 1 000/day per IP). All other tools need the caller’s own key and bill like the HTTP API: only delivered documents (index, acte, plan) cost 0,99 $ excl. registry fees on a live key; lot reads and watch creation cost 0; fq_test_ costs 0. Registre fee 1,50 $ per consulted document is billed to the organization’s Registre account, not collected by Fonciq. Never claim Fonciq is affiliated with the MRNF or Registre foncier du Québec. Flood answers are indicative: \"No zone found at this point\" is not \"outside a flood zone\"; confirm on the official Québec map in each answer. Connecteur IA Fonciq : lisez https://mcp.fonciq.ca/llms.txt . flood_zones_lookup est gratuit sans clé. Les autres outils exigent OAuth ou votre clé Bearer ; seuls les documents livrés sont facturés (0,99 $ excl. frais du registre sur clé réelle). Fonciq n’est pas affilié au MRNF ni au Registre foncier du Québec.",
      "tools": [
        {
          "name": "acte_get",
          "title": "Get one deed PDF / Obtenir le PDF d’un acte",
          "description": "POST /v1/actes. Returns the PDF of one deed by registration number and circonscription foncière when Fonciq holds it (no Registre fee then); a missing deed fails closed. The full structured deed analysis is « Bientôt » and is not offered here. / Renvoie le PDF d’un acte conservé par numéro d’inscription et circonscription ; un acte absent échoue de façon fermée. L’analyse structurée complète est « Bientôt » et n’est pas offerte ici. Scope registre:write. idempotency_key is sent as the Idempotency-Key header (kept 24 h; a retry with the same key returns the stored answer). idempotency_key est transmis dans l’en-tête Idempotency-Key (conservé 24 h). Billing: identical to the HTTP route. Requires your own Fonciq API key in the Authorization header (Bearer fq_live_… or fq_test_…). Only documents are billed: each index, acte or plan returned on a live key costs 0,99 $ excluant frais du registre; fq_test_ keys and 4xx/5xx responses cost 0. Facturation : identique à la route HTTP. Exige votre propre clé d’API Fonciq dans l’en-tête Authorization. Seuls les documents sont facturés : chaque index, acte ou plan livré sur une clé réelle coûte 0,99 $ excluant frais du registre ; une clé fq_test_ et une réponse 4xx/5xx coûtent 0.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "circonscription": {
                "description": "Circonscription foncière, e.g. \"Montréal\".",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique key for this write, 8+ characters. / Clé unique pour cette écriture.",
                "maxLength": 255,
                "minLength": 8,
                "type": "string"
              },
              "registration_number": {
                "description": "Registration number, e.g. \"14 736 430\". / Numéro d’inscription.",
                "type": "string"
              },
              "rf_account_id": {
                "description": "Registre account id; omit for the organization default. / Compte du Registre ; par défaut si omis.",
                "type": "string"
              }
            },
            "required": ["circonscription", "idempotency_key", "registration_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Deed / Acte"
