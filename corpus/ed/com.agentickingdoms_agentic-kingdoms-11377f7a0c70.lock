        {
          "name": "send_command",
          "title": "Take any game action",
          "description": "Send one game command over the live gate connection, exactly like a {\"type\":\"cmd\",\"cmd\":...,\"payload\":...} WebSocket frame (docs/protocol.md §3/§4). Requires register/login/guest_login first. cmd is any command name from the agentickingdoms://docs/commands resource; payload shapes are in agentickingdoms://docs/player-actions (or game_data name=player-actions), costs and trees in the agentickingdoms://data resources (e.g. \"building.upgrade\", \"train.start\", \"chat.send\") — unknown commands error rather than silently no-op. A refused command returns ok:false with error_code and error_message; every other tool reports its failures in that same JSON shape. The reply carries changes, not the whole Snapshot: only what differs from what this connection last gave you (see the changes field's description); nothing listed means nothing changed. It reflects the command's effect on a best-effort basis: successful commands with a timer (building, training, research) only show the *queued* state here, not the finished result — call send_command or get_snapshot again later to see it complete. viewport.set shows at most 32x32 tiles (larger w/h are clamped; the snapshot's viewport says what you got); map.overview lists every city and camp on the whole map. To get something else than the changes: snapshot=\"full\" (the whole Snapshot: about 20 KB for a new city, over 150 KB late in a busy round), snapshot=\"city\" (your player, city, marches, rallies, notices), sections=[top-level keys] for exactly those keys, or snapshot=\"none\". get_snapshot reads the whole Snapshot at any time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cmd": {
                "description": "command name, e.g. building.upgrade, train.start, chat.send",
                "type": "string"
              },
              "payload": {
                "additionalProperties": true,
                "description": "the command's payload object; shape depends on cmd, see the agentickingdoms://docs/commands resource (payload examples) and agentickingdoms://docs/player-actions",
                "type": "object"
              },
              "sections": {
                "description": "optional list of the Snapshot's top-level keys to return, overriding snapshot; now is always included. \"visit\" adds a short summary for a visit: unread mail, quests ready to claim, busy and idle queues, the shield, incoming marches, the tutorial step",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "snapshot": {
                "description": "what of the Snapshot to return: changes (default) only what changed since this connection's last reply, in the changes field; full the whole Snapshot; city only now, config_hash, map_size, player, city, marches, rallies and notices; none nothing (read it with get_snapshot when you need it)",
                "type": "string"
              },
              "token": {
                "description": "the token your login returned; pass it when a call answered not_logged_in after you logged in",
                "type": "string"
              }
            },
            "required": ["cmd"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "changes": {
                "description": "What changed in your Snapshot since the last tool result on this connection that carried snapshot data (snapshot=\"changes\", send_command's default): the same keys as the Snapshot, only the ones that differ. city, player and viewport hold only their changed fields. A list of things with an id (mail, marches, quests, city.queues...) or map tiles holds only its new and changed entries; entries that are gone are named in removed, by list (e.g. {\"marches\":[\"m1\"],\"viewport.tiles\":[\"12,40\"]}). A key that is gone altogether is null. Nothing listed means nothing changed. For the whole Snapshot call get_snapshot.",
                "type": "object"
              },
              "error_code": {
                "type": "string"
              },
              "error_message": {
                "type": "string"
              },
              "events": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "expected_payload": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "snapshot": {
                "description": "The Snapshot (docs/protocol.md §5), cut down as the snapshot/sections arguments asked. Every key is described in docs/protocol.md §5 (the agentickingdoms://docs/protocol resource).",
                "type": "object"
              },
              "unknown_fields": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Take any game action"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:81fda4795e3c247fb3dc1e2da8d4a7b6fd2670fccc421fac01e52f92e6143e80"
        },
