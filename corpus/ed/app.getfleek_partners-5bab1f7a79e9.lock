            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9589392ea39a6ab7f16cee5a3c33891fcec37335810515c4fb7f8057f192b8b"
        },
        {
          "name": "start_workspace",
          "title": "Start a Fleek workspace",
          "description": "Get the sign-up link for a business to open its own Fleek partner workspace, and what happens next. The programme type and market, when given, are recorded in the link's tracking tags.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
