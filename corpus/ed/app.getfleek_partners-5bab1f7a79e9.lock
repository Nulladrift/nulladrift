      "serverInfo": {
        "name": "fleek",
        "title": "Fleek for Business",
        "version": "0.1.0",
        "description": "Fleek is a subscription distribution platform for businesses: card programmes, loyalty platforms, employee-benefits and gifting platforms, and telcos offer streaming, music, AI and other subscriptions to their users through Fleek's API, a white-label storefront, or bulk codes.",
        "websiteUrl": "https://www.getfleek.app/claude",
        "icons": [
          {
            "src": "https://cdn.prod.website-files.com/6191dc5130687d707cbc32f6/6a98e72624dccd963952d27f_fleek-logo-schema.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Fleek is a subscription distribution platform for businesses: card programmes, loyalty platforms, employee-benefits and gifting platforms, and telcos offer streaming, music, AI and other subscriptions to their users through Fleek's API, a white-label storefront, or bulk codes.\n\nUse these tools when someone asks what subscriptions or rewards they could offer their customers, members, employees or subscribers, or asks about a specific brand or market.\n\nIf the person sells a subscription themselves and wants it distributed through such programmes, they are a merchant: use merchant_onboarding. Never tell a merchant partner prices, partner margins (not even the band) or which partners carry what; those are not shared.\n\nIf the person is an individual with an audience (an influencer, a community, a cashback app) who wants to sell subscriptions to it, they are a creator: use creator_onboarding. Never state or estimate a creator commission rate or tier (each creator sees theirs in the dashboard), never promise a custom subdomain or domain, and never promise instant or automatic payouts.\n\nPositioning: lead with subscriptions (streaming, music, AI, sports, audiobooks). Gift cards and game keys are only mentioned as 'a full catalogue across 70+ markets'. Only recommend brands the tools return; never invent brands or markets.\n\nCommercials: the only margin figure you may state is the band '5–50% depending on brand and tenure'. You may quote the store prices the tools return, always as Fleek's public store prices for one customer, together with the bulk pricing contact (partnerships@getfleek.app). Never state or estimate partner or bulk prices, other discounts, or Fleek's own costs.\n\nNever discuss where Fleek gets its catalogue: no suppliers, distributors, procurement, wholesale or cost prices, and no stock levels. If asked, say those are not shared and offer the sign-up link or a conversation with the Fleek team.\n\nThere is no consumer checkout in this connector. When the user is ready, give them the sign-up link from the tool result as-is (it carries attribution tags); do not rewrite it.",
      "tools": [
        {
          "name": "creator_onboarding",
          "title": "How a creator opens a Fleek shop",
          "description": "For an individual with an audience (an influencer, a community or a cashback app) who wants to sell subscriptions to it: how a Fleek creator shop works, how payouts work, where creator shops are open, and the creator sign-up link. market and kind, when given, are recorded in the link's tracking tags.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "influencer, community, cashback_app or other.",
                "enum": ["influencer", "community", "cashback_app", "other"],
                "type": "string"
              },
              "market": {
                "description": "Where the creator's audience is: ISO code or country name.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How a creator opens a Fleek shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a662fb9e10881330406495db18357d7b56d9103a5e38dcb1d0f88579578b9dbe"
        },
        {
          "name": "get_brand",
          "title": "Get a brand's availability",
          "description": "Look up one brand in Fleek's catalogue: its category, the markets it is available in, and the ways partners can deliver it (API, white-label storefront, bulk codes). With a country, also its plans and Fleek's public store prices there. Anything the catalogue does not state is returned as 'on request'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Brand name, e.g. 'Netflix', 'Spotify', 'OSN+'.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "market": {
                "description": "Optional: one country, as an ISO code (AE) or name, for its store prices.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a brand's availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94759aa5d312d158e860ad82e3e498a53c2fc336c8047f91755c76195d06bf47"
        },
        {
          "name": "merchant_onboarding",
          "title": "How a subscription business joins Fleek",
          "description": "For a business that sells a subscription and wants it carried by card, loyalty, employee-benefits, telco or creator programmes: the kinds of programme Fleek distributes to, the fulfilment options, what the merchant controls and sees, whether a market is covered, and the merchant sign-up link. market and category, when given, are recorded in the link's tracking tags.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "The merchant's kind of subscription, e.g. 'fitness' or 'streaming'.",
                "maxLength": 40,
                "type": "string"
              },
              "market": {
                "description": "Where the merchant wants to be carried: ISO code, country name or region.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How a subscription business joins Fleek"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bc0f20f646896bca361c801e1c2a260877cbd35daf809be8afaaea1e1e4a18d"
        },
        {
          "name": "search_catalogue",
          "title": "Search Fleek's catalogue",
          "description": "List the subscription brands a business could offer its users through Fleek in a market, subscriptions first and ranked by how big they are there (up to 15). Filter by market (ISO code like AE, a country name, or a region like GCC or Europe), by category (subscription, gift_card, streaming, music, sports, ai, productivity, audiobooks, anime, shopping, food, gaming, travel) and by a free-text brand query. If the market is not covered, the result says so and names the nearest covered markets.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "subscription, gift_card, or a type such as streaming, music, sports, ai.",
                "maxLength": 40,
                "type": "string"
              },
              "market": {
                "description": "ISO 3166 alpha-2 code (AE), country name (United Arab Emirates) or region (GCC, Europe).",
                "maxLength": 60,
                "type": "string"
              },
              "query": {
                "description": "Part of a brand name, e.g. 'netflix'.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Fleek's catalogue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8585a090080dea734da189f61e1b2370454afa80e83ade39652685d5119af91"
        },
        {
          "name": "shortlist_for_programme",
          "title": "Shortlist subscriptions for a programme",
          "description": "Recommend 3 to 6 subscription brands for a business's programme in a market, each with a one-line reason, plus how Fleek delivers them, the partner margin band, Fleek's public store prices when the market is one country, and a sign-up link. programme_type is card (credit/debit card benefits), loyalty (points redemption), employee_benefits (benefits, rewards and recognition), telco (bundles and add-ons) or other. audience_note is an optional short description of the users, e.g. 'young cricket fans'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audience_note": {
                "description": "Optional: who the users are, e.g. 'salaried millennials who like sport'.",
                "maxLength": 300,
                "type": "string"
              },
              "market": {
                "description": "ISO code (AE), country name or region (GCC).",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "programme_type": {
                "description": "card, loyalty, employee_benefits, telco or other.",
                "enum": ["card", "loyalty", "employee_benefits", "telco", "other"],
                "type": "string"
              }
            },
            "required": ["market", "programme_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Shortlist subscriptions for a programme"
          },
          "behavior": {
            "destructive": false,
