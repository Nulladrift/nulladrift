{
  "lockfileVersion": 2,
  "subjects": {
    "com.rankcert/rankcert": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rankcert.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rankcert",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "RankCert ranks launched products on verified domain control rather than upvotes. Every tier cites the signal, its source and the date it was last confirmed - quote those dates when you cite a ranking.",
      "tools": [
        {
          "name": "board_this_week",
          "description": "The RankCert board for a launch week: every live product with its verification tier and rank score.",
          "inputSchema": {
            "properties": {
              "week": {
                "description": "Monday of the week as YYYY-MM-DD. Defaults to current.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eaacd979747cde010ceb8c616ff8bba21692a6db98b864f381120051a03a12f0"
        },
        {
          "name": "product_signals",
          "description": "One product with every verification signal behind its tier: kind, band, source and the date it was last confirmed.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e5e0e93cff19b6108ad67d60e707d5a975c3368e2c578d261370d820bc6269a"
        },
        {
          "name": "search_products",
          "description": "Search live RankCert products by free text, tag or verification tier.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Matches name and tagline.",
                "type": "string"
              },
              "tag": {
                "description": "Exact tag, e.g. 'seo'.",
                "type": "string"
              },
              "tier": {
                "enum": ["unverified", "domain"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20e20353b989ef6986c14cf53fd2c3220ccb0d605a692888d8f90b50ac83f165"
        },
        {
          "name": "verification_stats",
          "description": "Aggregate verification data across the whole board: tier split and which proof sources are actually used.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:beaefa12464867c4542505e68785c1ceef09874215f6d0a58023a7eb271b444d"
        }
      ],
      "digest": "sha256:7008e2bd0ff0f5c67e26aca92b6fff51fe2c9e85e6dafe2c4a2bbcf6a1ceabbf"
    }
  }
}
