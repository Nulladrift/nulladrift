{
  "lockfileVersion": 2,
  "subjects": {
    "app.openkrill/tapwhich": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tapwhich.openkrill.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "tapwhich",
        "title": "Tapwhich: which card to tap here",
        "version": "1.3.7"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tapwhich tells a cardholder which of their cards earns the most at a place. Call pick_card with the place and the cards they hold. Pass a foreign amount as it was given, with its currency code; the tool converts at its own dated rate. Give the 'answer' line first, then the second-best card. Repeat each card's conditions (such as a minimum spend or a picked category) when you show it. Rates and caps come from the banks' public pages on the read date shown; always end with the 'check' line and the source link. Then pass on the 'freshness' line in the person's language: it says when the best card's rule was last checked against the bank page and whether readers or the page put it in doubt. When 'offers' is not empty, add them after the answer as dated extras: what each gives, for which card, its end date and its source link; they do not change which card wins. If a card is unknown, show the options returned or send the person to https://tapwhich.openkrill.app to see the card list.",
      "tools": [
        {
          "name": "pick_card",
          "title": "Which card to tap here",
          "description": "Use this when someone asks which of their credit or debit cards to pay with at a shop, app, category or city, to get the most cashback. Pass the place (a merchant such as Grab or Shopee, a category such as dining or supermarket, or a city such as Tokyo, or both: 'dining in Tokyo') and the cards they hold (names or ids). It answers in one line, 'use card X here, because Y, up to cap Z', with the second-best card, each card's cap and conditions, and the bank source link, plus the dated bank and card-network offers live at that place for those cards today. The data pack covers Vietnam-issued cards; amounts are in VND.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Purchase amount, in VND unless currency says otherwise. Default 1,000,000 VND.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cards": {
                "description": "The cards the person holds, by name ('VPBank Z JCB') or id ('vpbank-z-jcb').",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "channel": {
                "description": "Online or in a shop, when the place alone does not say.",
                "enum": ["online", "pos"],
                "type": "string"
              },
              "currency": {
                "description": "ISO code of amount when the person gives a foreign amount, such as JPY for 8,000 yen. The tool converts at its own dated rate; do not convert yourself.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "date": {
                "description": "Purchase date YYYY-MM-DD. Default today in Vietnam.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "picks": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "Bonus categories picked on pick-N cards, by group (vib-one, vib-max, cake-freedom, msb-mdigi).",
                "type": "object"
              },
              "place": {
                "description": "Merchant, category or city, for example 'Grab', 'supermarket', 'dining in Tokyo'.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "statement_spend": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Spend so far this statement by card id, for minimum spend and tiers.",
                "type": "object"
              }
            },
            "required": ["cards", "place"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount": {
                "type": "number"
              },
              "answer": {
                "type": "string"
              },
              "best": {
                "type": ["object", "null"]
              },
              "check": {
                "type": "string"
              },
              "converted_from": {
                "type": ["object", "null"]
              },
              "currency": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "freshness": {
                "type": ["string", "null"]
              },
              "offers": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "offers_total": {
                "type": "number"
              },
              "pack": {
                "type": "object"
              },
              "place": {
                "type": "object"
              },
              "ranking": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "second": {
                "type": ["object", "null"]
              }
            },
            "required": ["amount", "answer", "check", "currency", "date", "pack", "place", "ranking"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Picked the card to tap",
            "openai/toolInvocation/invoking": "Comparing your cards..."
          },
          "digest": "sha256:d555e8e62b476442396cbff87268aff7c7486f5f50daff44f1cf90c6d7a0caa9"
        }
      ],
      "digest": "sha256:64cbddd113bddd94e04b61b0c8aa65418c4a28053ae4156c56b6d1ef5a8e1a24"
    }
  }
}
