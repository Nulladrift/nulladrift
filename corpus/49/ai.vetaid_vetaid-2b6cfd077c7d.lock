        {
          "name": "va_condition_intelligence",
          "title": "BVA outcomes by condition",
          "description": "Real Board of Veterans' Appeals outcome data for one VA condition, from\n    1.9 million public BVA decisions, 1992 to present, updated nightly: the\n    share of decided issues GRANTED / DENIED / REMANDED / DISMISSED (shares of\n    all decided issues, so they sum to 100%; complete years, with an all-years\n    block labelled separately), the year-by-year trend, which kinds of evidence\n    went with a grant versus without, the denial reasons tagged in a smaller\n    hand-tagged sample (labelled with its own n), and the legal authorities most\n    cited. Aggregate data only — no PII, and a base rate for appealed cases, not\n    a prediction for one veteran.\n\n    Args:\n        condition: VA condition keyword, e.g. 'ptsd', 'tinnitus', 'sleep apnea',\n            'back', 'knee', 'depression', 'gerd', 'migraines'. An unmatched\n            value returns the list of valid condition keys.\n    ",
          "inputSchema": {
            "properties": {
              "condition": {
                "title": "Condition",
                "type": "string"
              }
            },
            "required": ["condition"],
            "title": "va_condition_intelligenceArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "BVA outcomes by condition"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cbfd9856dd3aa6a3539ba264a114f4006d6f82735a3efa7c023e288a9d78d59e"
        },
        {
          "name": "va_denial_stats",
          "title": "VA appeal denial statistics",
          "description": "Corpus-wide VA appeal statistics from 1.9 million public Board of\n    Veterans' Appeals decisions, 1992 to present, updated nightly: how every\n    decided issue came out (granted / denied / remanded / dismissed / other),\n    the year-by-year trend, and the most-litigated conditions with their own\n    shares. Rates are shares of ALL decided issues, so they sum to 100%, and\n    they use complete crawl years only (an all-years block is included and\n    labelled). Aggregate data only — contains no individual veteran's\n    information.",
          "inputSchema": {
            "properties": {},
            "title": "va_denial_statsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
