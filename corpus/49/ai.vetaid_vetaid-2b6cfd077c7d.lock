        },
        {
          "name": "va_evidence_that_wins",
          "title": "Evidence vs. outcome by condition",
          "description": "MEASURED evidence-vs-outcome data for one VA condition, from the full text\n    of the public BVA archive (1.8M+ decisions): for each kind of evidence — a\n    positive nexus opinion, a private physician letter/DBQ, buddy statements,\n    service treatment records that document the condition (or are silent), a\n    Board hearing, and how the Board read the record (credibility, benefit of the\n    doubt, inadequate exam) — how often the issue was GRANTED when the record had\n    it versus when it did not, with the raw fractions. Single-issue decisions\n    only, so each evidence flag attaches to exactly one decided issue. Use this\n    to say which missing evidence has historically mattered most and by how\n    much; it is an association in appealed cases, not a prediction. Aggregate\n    data only — no PII.\n\n    Args:\n        condition: VA condition keyword, e.g. 'ptsd', 'sleep apnea', 'back', 'knee', 'tinnitus'.\n        benefit: 'service_connection' (default), 'increased_rating', 'tdiu', 'effective_date', or 'all'.\n    ",
          "inputSchema": {
            "properties": {
              "benefit": {
                "default": "service_connection",
                "title": "Benefit",
                "type": "string"
              },
              "condition": {
                "title": "Condition",
                "type": "string"
              }
            },
            "required": ["condition"],
            "title": "va_evidence_that_winsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Evidence vs. outcome by condition"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:95cc8b09ade7055f87ad606bc4ca86c12c491a55c392d2047ded93b403c744bd"
        },
        {
          "name": "va_manual_changes",
          "title": "VA M21-1 manual change log",
          "description": "Recent changes to the VA M21-1 adjudication manual and its sibling VBA\n    manuals — the changelog VA does not publish. VetAid, the veterans claims tool, archives every KnowVA\n    article version weekly and diffs them; each change carries what was added\n    and removed, a link to the current official article, and the conditions and\n    claim topics it touches. Use this when asked whether a VA rule changed\n    recently, or when a claim's stage (exams, nexus, TDIU, SMC, effective dates,\n    Higher-Level Review, Supplemental Claims, Board appeals) may be affected.\n\n    Args:\n        condition: optional condition keyword to filter by (e.g. 'ptsd', 'hearing').\n        topic: optional claim topic: tdiu, smc, effective_date, cue, hlr, supplemental_claim,\n            board_appeal, intent_to_file, presumption, secondary, exams, nexus, lay_evidence,\n            strs, dic, pension, pact, reduction, duty_to_assist, rating_schedule.\n        since: optional ISO date (YYYY-MM-DD); only changes whose new version is dated on/after it.\n    ",
          "inputSchema": {
            "properties": {
              "condition": {
                "default": "",
                "title": "Condition",
                "type": "string"
              },
              "since": {
                "default": "",
                "title": "Since",
                "type": "string"
              },
              "topic": {
                "default": "",
                "title": "Topic",
                "type": "string"
              }
            },
            "title": "va_manual_changesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "VA M21-1 manual change log"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:19b820cc568543211437ea3f7925564afed66dff75911c075a7ef52a60d6d47b"
        },
        {
          "name": "va_top_authorities",
          "title": "Most-cited VA legal authorities",
          "description": "The legal authorities most frequently cited across the public Board of\n    Veterans' Appeals corpus (1.9 million decisions, 1992 to present, updated\n    nightly) — case law (e.g. Gilbert v. Derwinski for benefit-of-the-doubt,\n    DeLuca, Correia, Sharp), 38 C.F.R. regulations, or 38 U.S.C. statutes —\n    ranked by the number of DISTINCT decisions that cite them. Useful for\n    explaining which precedents actually carry VA appeals. The response carries\n    a 'basis' string saying exactly what was counted and over how many\n    decisions; read it before quoting a number. Aggregate data only — no PII.\n\n    Args:\n        kind: 'cases' (default), 'regulations', or 'statutes'.\n        condition: optional condition keyword (e.g. 'ptsd', 'tinnitus', 'back')\n            to rank authorities within that condition's decisions only.\n        limit: how many to return, 1-100 (default 25).\n    ",
          "inputSchema": {
            "properties": {
              "condition": {
                "default": "",
                "title": "Condition",
                "type": "string"
              },
              "kind": {
                "default": "cases",
                "title": "Kind",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              }
            },
            "title": "va_top_authoritiesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Most-cited VA legal authorities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0423645897d4c3828134e15365539d51f51d9ab15f0e9609d3a3a6162d9414b1"
        }
