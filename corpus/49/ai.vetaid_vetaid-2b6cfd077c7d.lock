        {
          "name": "run_my_case_analysis",
          "title": "Run my case analysis",
          "description": "RUN the full VetAid (the veterans claims tool) analysis pipeline on one of the veteran's OWN cases,\n    ON THE VETERAN'S BEHALF. Free for veterans (no credits spent); limited to 5\n    agent-run analyses per day. Takes ~5-8 minutes — afterward poll\n    get_my_case_analysis(case_id) for the results.\n\n    Requires a WRITE-scoped agent key: the veteran must have created the key with\n    the 'Allow running analyses' (read_write) scope. A read-only key returns a\n    'read-only key' error; the daily limit returns 'rate limited'; a case the key\n    owner does not own returns 'not found' (no cross-user access).\n\n    Args:\n        case_id: The id of one of the veteran's own cases (from list_my_va_cases).\n    ",
          "inputSchema": {
            "properties": {
              "case_id": {
                "title": "Case Id",
                "type": "string"
              }
            },
            "required": ["case_id"],
            "title": "run_my_case_analysisArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Run my case analysis"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:133c6d62c14e20e08d5ef1d64c5443ae1cc03df0392a3c2f01f51be09e148a1f"
