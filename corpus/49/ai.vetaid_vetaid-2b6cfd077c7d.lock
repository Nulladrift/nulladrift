      },
      "instructions": "VetAid, the veterans claims tool (vetaid.ai), remote MCP server: VA disability claims data for U.S. military veterans, not veterinary care. VetAid is a free veterans claims tool, not a VA-accredited representative — it does not file anything with VA for you, and it works alongside your accredited VSO, claims agent or attorney. Public tools expose aggregate Board of Veterans' Appeals outcome data (no PII). The PHI tools (list_my_va_cases, get_my_case_analysis) return ONLY the caller's own VA cases and require the veteran's personal agent key in the Authorization header (Bearer vak_...). VetAid is not legal or medical advice.",
      "tools": [
        {
          "name": "get_my_case_analysis",
          "title": "Get my case analysis",
          "description": "Get a per-stage analysis SUMMARY for one of the veteran's OWN cases\n    (read-only; never starts an analysis). Requires the veteran's personal\n    VetAid agent key in the request's Authorization header (Bearer vak_...).\n    Returns 'not found' for any case the key owner does not own — no cross-user\n    access.\n\n    Args:\n        case_id: The id of one of the veteran's own cases (from list_my_va_cases).\n    ",
          "inputSchema": {
            "properties": {
              "case_id": {
                "title": "Case Id",
                "type": "string"
              }
