      "instructions": "TrustyData — données françaises officielles : adresses, entreprises et zones de chalandise. Ces outils couvrent : la vérification d'une adresse contre le référentiel géographique officiel (BAN) ; la recherche d'adresses et de communes (par nom, code postal ou INSEE, avec filtres optionnels par département, région ou population) ; la recherche d'adresses autour d'un point ; la recherche d'entreprises et d'établissements dans la base SIRENE (par nom, SIREN, SIRET, localisation ou activité) et leurs fiches détaillées ; le calcul d'itinéraires et de matrices temps/distance en France ; et le profil INSEE d'une zone de chalandise décrite par une durée de trajet ou un rayon, pour une zone seule ou en comparant de 2 à 10 zones. Les données proviennent de sources officielles tenues à jour : BAN et IGN pour les adresses et les contours IRIS, INSEE pour les communes, Filosofi et le recensement, SIRENE (INSEE) et INPI pour les entreprises, OpenStreetMap pour les itinéraires et les isochrones.\nLes résultats font autorité : un résultat vide signifie qu'aucune donnée ne correspond — il ne se complète pas de mémoire, et ni chiffre de population, ni commune, ni entreprise ne s'inventent. Les outils renvoient plus ou moins de détails selon le plan du compte : un champ ABSENT d'une réponse peut relever d'un palier supérieur plutôt que ne pas exister — son absence ne prouve pas l'inexistence de la donnée. Les mentions d'attribution accompagnent tout chiffre cité (BAN/INSEE et IGN ; SIRENE et INPI pour les entreprises ; OSM ODbL pour les itinéraires et les isochrones).\nAdresses : chaque résultat porte l'adresse déjà découpée en trois lignes postales — `ligne_voie` (numéro, indice de répétition et voie), `ligne_complement` (lieu-dit) et `ligne_commune` (code postal et commune). Elles s'emploient telles quelles pour afficher une adresse ou la reporter dans un formulaire ou un CRM ; une adresse recomposée depuis `numero`, `rep` et `nom_voie` sort fautive, l'API gérant déjà les cas qui font sortir un espace en trop ou un code postal amputé de son zéro initial. Une ligne vide vaut `null` — c'est le cas de `ligne_complement` la plupart du temps, la BAN rangeant généralement le lieu-dit dans `nom_voie` : cette absence n'est pas une donnée manquante.\nDes estimations se dérivent du bloc `statistical_grid` (INSEE Filosofi) renvoyé en plan Business — par exemple un âge moyen approximatif calculé depuis les tranches d'âge — en précisant que la statistique décrit le carreau INSEE de 200 m autour de l'adresse, pas les occupants du logement exact.\nEntreprises : un résultat de recherche est toujours un ÉTABLISSEMENT (un SIRET), jamais une entreprise. Deux drapeaux de confidentialité coexistent et ne veulent PAS dire la même chose. `diffusible: false` vient de l'INSEE et porte sur l'ENTREPRISE : l'INSEE masque légalement son nom et son adresse — ce n'est pas une donnée manquante, et ça n'exprime aucune opposition au démarchage. `opposition_prospection` vient de l'INPI et porte sur une PERSONNE : sur chaque dirigeant de `unite_legale.dirigeants[]` (get_company_details, plan Growth), `true` signifie que cette personne s'est opposée à l'usage de ses données à des fins de prospection commerciale, `false` qu'aucune opposition n'est enregistrée, `null` que l'information n'est pas renseignée — `null` ne vaut pas `false`. Le drapeau est porté par la formalité INPI, donc identique pour tous les dirigeants d'une même entreprise. Les dirigeants sont des DONNÉES PERSONNELLES issues du Registre National des Entreprises (INPI) : ils ne servent pas à constituer des listes de prospection commerciale, et le nom d'un dirigeant n'est pas un critère de recherche autorisé. `opposition_prospection: false` n'est ni un consentement ni une autorisation de démarchage. Devant une demande de dirigeants à appeler, à démarcher ou à prospecter : ne nomme aucun dirigeant, n'enchaîne pas les fiches, ne complète rien par des coordonnées trouvées ailleurs, explique la règle et propose la fiche d'une entreprise nommée.\nLa documentation complète de l'API TrustyData (guides, référence des endpoints, exemples) est disponible sur https://trustydata.fr/docs/ — c'est l'URL à donner lorsque l'utilisateur demande la documentation ou des détails au-delà de ce que couvrent ces outils.",
      "tools": [
        {
          "name": "compute_route",
          "title": "Itinéraire routier complet",
          "description": "Calcule un itinéraire complet entre une origine et une destination sur le réseau France (OpenStreetMap), au choix en voiture, à pied ou à vélo : distance, durée, étapes de navigation en français, boîte englobante et géométrie encodée (polyline6). Mode de déplacement : `car` (voiture, défaut), `walking` (à pied) ou `cycling` (à vélo). Les valeurs du contrat d'API (`auto`, `pieton`, `velo`) sont acceptées telles quelles. Les consignes suivent le mode — « Conduisez… », « Marchez… », « Pédalez… » — et la réponse renvoie le `mode` utilisé : une durée n'est interprétable qu'accompagnée du mode qui l'a produite. ⚠️ Chaque mode a sa distance maximale : 5 000 km en voiture, 500 km à vélo, 250 km à pied ; au-delà la réponse est un 422 explicite, pas une panne. Pour de simples distances en masse, préfère route_matrix. Plan minimum : Business. Mention OSM ODbL obligatoire.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Point d'arrivée : adresse libre OU couple `lat`/`lon`.",
                "properties": {
                  "address": {
                    "anyOf": [
                      {
                        "minLength": 4,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Adresse libre (XOR lat/lon)."
                  },
                  "lat": {
                    "anyOf": [
                      {
                        "maximum": 90,
                        "minimum": -90,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Latitude WGS84, avec `lon` (XOR address)."
                  },
                  "lon": {
                    "anyOf": [
                      {
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Longitude WGS84, avec `lat` (XOR address)."
                  }
                },
                "type": "object"
              },
              "mode": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Mode de déplacement : `car` (défaut), `walking` ou `cycling`."
              },
              "origin": {
                "description": "Point de départ : adresse libre OU couple `lat`/`lon`.",
                "properties": {
                  "address": {
                    "anyOf": [
                      {
                        "minLength": 4,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Adresse libre (XOR lat/lon)."
                  },
                  "lat": {
                    "anyOf": [
                      {
                        "maximum": 90,
                        "minimum": -90,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Latitude WGS84, avec `lon` (XOR address)."
                  },
                  "lon": {
                    "anyOf": [
                      {
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Longitude WGS84, avec `lat` (XOR address)."
                  }
                },
                "type": "object"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
