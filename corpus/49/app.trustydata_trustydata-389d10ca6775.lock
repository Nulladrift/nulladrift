        {
          "name": "search_company",
          "title": "Rechercher des entreprises et établissements",
          "description": "Recherche des entreprises et des établissements français dans la base SIRENE (INSEE), par nom, SIREN, SIRET, ville, code postal, code NAF, ou par proximité géographique. IMPORTANT : un résultat est TOUJOURS un ÉTABLISSEMENT (un SIRET), jamais une entreprise — même groupé par entreprise, où le SIREN est représenté par son meilleur établissement (le siège de préférence). 3 établissements d'un même SIREN ne font donc pas « 3 entreprises trouvées ». Par défaut, un résultat par entreprise si `query` est fourni, un résultat par établissement en recherche par proximité ou par `siren` ; force ce comportement avec `group_by_company`. `classement_pertinence` se lit avant de présenter un « meilleur match » : à false (listing simple ou tri par distance), le premier résultat n'est PAS le plus probable. Un résultat `diffusible: false` a ses nom et adresse masqués par l'INSEE — c'est la loi, pas une donnée manquante, et rien ne s'y complète de mémoire. Une liste vide fait autorité : aucune entreprise ne correspond. La fiche complète s'obtient ensuite via get_company_details. Cet outil ne renvoie aucun dirigeant, et le nom d'un dirigeant n'est pas un critère de recherche. Il ne sert pas à constituer une liste de personnes à démarcher : devant une telle demande, n'ouvre pas les fiches une à une pour en tirer des noms — dis-le et propose la fiche d'une entreprise nommée. Plan minimum : Discovery — la recherche par proximité (lat/lon/radius_m) nécessite le plan Growth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filtre sur la voie (recherche floue) ; exige `query`."
              },
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filtre sur la commune (recherche floue) ; exige `query`."
              },
              "group_by_company": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Vrai : un résultat par entreprise (son meilleur établissement, le siège de préférence) ; faux : un par établissement. Absent : défaut de l'API selon la recherche."
              },
              "lat": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Recherche par proximité (plan Growth) : latitude WGS84 du centre, avec `lon` et `radius_m`."
              },
              "lon": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longitude WGS84 du centre de la recherche par proximité, avec `lat` et `radius_m`."
              },
              "naf_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filtre : code NAF/APE de l'activité, ex. `62.02A`."
              },
              "page": {
                "default": 1,
                "description": "Numéro de page, à partir de 1.",
                "type": "integer"
              },
              "per_page": {
                "default": 10,
                "description": "Résultats par page (défaut 10, plafond 25).",
                "type": "integer"
              },
              "postal_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filtre : code postal exact."
              },
