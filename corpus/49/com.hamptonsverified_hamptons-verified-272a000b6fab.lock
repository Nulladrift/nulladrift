      },
      "instructions": "Output format: present results from these tools as short bullet points grouped under bold category headers (for example **Tonight's events**, **Open now in <town>**, **Closing soon**), one line per venue or event (name, then a one-clause description with the closing time or date where relevant), no prose paragraphs, and at most one short follow-up question. Data semantics: a recently_closed verdict of closed or never-existed is a confirmed finding with a date, not a possibility. The `town` argument on every tool accepts the asker's own place words: regions ('the Hamptons', 'the North Fork'), addresses ('Montauk, NY 11954') and misspellings are resolved by the tool, and `townScope` on the answer reports what was read. When `townScope.recognized` is false the place name was not found and nothing was looked up; the empty result is a not-found, not an absence of places, and `didYouMean` lists near matches where any exist.",
      "tools": [
        {
          "name": "beach_info",
          "title": "Beach: dog rules today, parking permit, lifeguards",
          "description": "One named beach, or every verified beach in a town, village or hamlet ('Amagansett, NY' and 'Sag Harbour' resolve, and `readAs` reports which place was answered for). 49 beaches on both forks, each with: whether dogs are allowed today (the rule is per month and splits morning from daytime; most South Fork ocean beaches are off-leash at dawn and closed to dogs in daylight from May to September), the parking permit the lot needs, whether it is reachable without a car, lifeguard hours, rip-current notes, the governing town, village or state source, and the date it was last read. Permit information here is the line for each named beach only; it does not include non-resident day passes or the permit map by jurisdiction. Returns up to 5. `townScope` reports how the place argument was read; `townScope.recognized: false` means the name matched no East End place, the rows array is empty, and `didYouMean` lists near matches where any exist.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "beach": {
                "description": "Beach name, town, hamlet or village, e.g. 'Georgica', 'Main Beach' or 'Amagansett'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["beach"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Beach: dog rules today, parking permit, lifeguards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a9d5b27ef33376e83277954e6347674514ad6dffcb76c9b466798aa5b031156"
        },
        {
          "name": "benefit_galas",
          "title": "Benefit galas: the dates, the dress code, and who the money goes to",
          "description": "The East End's 2026 benefit season: 15 dated charity galas, each joined to the nonprofit it raises for. `dressCode` is the organiser's own: it is 'Cocktail' on 9 of the 15 and 'Black Tie' on 1; the codes on file are Black Tie, Casual, Cocktail, Garden Casual, Hamptons Chic, Rodeo Glam. `tickets.publishedRate` is per record: false on 14 of the 15, a verified finding that the organiser hands off to a ticketing platform and prints no rate; true on 1, where `tickets.published` carries the organiser's own figure with the URL an editor read it from and the date, as the entry rate ('from') of a ladder. `tickets.tier` is a relative band across these events, not a figure. `tickets.publishedTiers`, where present, is a published line an editor read, including lines that say no price is published and give a phone number. `beneficiary` carries the charity's mission, phone, `donateUrl` and `volunteerUrl`, verified more recently than the ticket link. `alsoThisSeason` holds marquee fixtures with no dated gala record (the Hampton Classic, Authors Night, the art fair). Past benefits appear only when `from` is an earlier date. Returns up to 10. `townScope` reports how the place argument was read; `townScope.recognized: false` means the name matched no East End place, the rows array is empty, and `didYouMean` lists near matches where any exist.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cause": {
                "description": "Filter to one cause, when the question is plainly about one.",
                "enum": ["Animal Welfare", "Arts", "Conservation", "Education", "Health"],
                "type": "string"
              },
              "from": {
                "description": "ISO date. Default is today (East End local), so only benefits still to come are returned. Pass an earlier date to reach ones already held.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "query": {
                "description": "What to look for, e.g. 'animal', 'ARF', 'black tie', 'film', 'land trust', or a benefit's name.",
                "type": "string"
              },
              "to": {
                "description": "ISO date. Omit for the rest of the season.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "town": {
                "description": "A hamlet ('East Hampton', 'Sag Harbor') or a region ('the Hamptons', 'North Fork'), in the asker's own words.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Benefit galas: the dates, the dress code, and who the money goes to"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bc70d50ea69c2aec7397634d3dfcfd38e8c608832164e69a8208462ee65cbef"
        },
        {
          "name": "community_help",
          "title": "Community help: free and low-cost services, in Spanish and English",
          "description": "The guide's bilingual community directory: free and low-cost services for people who live and work on the East End. Immigration legal advocacy, sliding-scale and no-status-asked clinics, food pantries, the winter shelter, tenant-rights and wage-theft hotlines, ESL / GED / citizenship classes, childcare and youth programs, money transfer, Spanish-language Mass times, the Latino markets, and the Sunday soccer leagues. Every record carries `phone`, `source`, `sourceUrl`, `lastVerified`, and the guide's own text in both languages (`description.es` / `description.en`). Two fields are computed rather than stored: `nextSpanishMass` / `nextEnglishMass`, the next service from now on the East End's clock (America/New_York), and `inSeasonNow` on the soccer leagues for this month. `offEastEnd: true` marks a referral to Bay Shore, Hempstead or Central Islip. A record states that a service is free, confidential or safe regarding immigration status only where the provider's own published words state it, and those words are quoted. `query` takes either language; `need` is a shortcut vocabulary. With no argument nothing is looked up and the answer lists the needs and towns covered. Returns up to 8. `townScope` reports how the place argument was read; `townScope.recognized: false` means the name matched no East End place, the rows array is empty, and `didYouMean` lists near matches where any exist.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "Shortcut category, when the question is plainly one of these.",
                "enum": ["legal-aid", "health", "food", "housing", "classes", "work", "money", "family", "worship", "groceries", "traditions", "soccer"],
                "type": "string"
              },
              "query": {
                "description": "The need, in the asker's words and either language, e.g. 'my boss hasn't paid me', 'clases de inglés', 'food pantry', 'misa en español', 'dentist', 'help with rent'.",
                "type": "string"
              },
              "town": {
                "description": "A hamlet ('East Hampton', 'Riverhead') or a region ('the Hamptons', 'North Fork'), in the asker's own words.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Community help: free and low-cost services, in Spanish and English"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4d0a9a9af13d0b11637c031572f1b12e30df0caeb54ef548543f28d400a1f2c"
        },
        {
          "name": "find_shops",
          "title": "Shops: the verified East End stores, and where each one is",
          "description": "Verified East End shops: 86 stores across 15 hamlets on the South Fork, North Fork and Shelter Island, in these categories: fashion, jewelry, swimwear, activewear, kids, toys, home, books, beauty, consignment, accessories, general-store, florist, antiques. Each row carries the address read off the brand's own store page at `sourceUrl`, a cross-checked coordinate with `coordSource` recording what corroborated it, `phone` where one is published, and the one-line `what` the guide keeps. The guide holds no opening hours for any shop, so no row carries an open/closed state or an hours line. `query` matches the name, the brand, the category and `what`, so 'bookshop', 'toys', 'flowers' and 'The Wharf Shop' all resolve. With no arguments nothing is looked up and the answer lists the categories and towns covered. Returns up to 8. `townScope` reports how the place argument was read; `townScope.recognized: false` means the name matched no East End place, the rows array is empty, and `didYouMean` lists near matches where any exist.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["fashion", "jewelry", "swimwear", "activewear", "kids", "toys", "home", "books", "beauty", "consignment", "accessories", "general-store", "florist", "antiques"],
                "type": "string"
              },
              "query": {
                "description": "What to look for, e.g. 'bookshop', 'toys', 'flowers', 'swimwear', 'gift', or a store's name ('The Wharf Shop').",
                "type": "string"
              },
              "town": {
                "description": "A hamlet ('Sag Harbor', 'East Hampton') or a region ('the Hamptons', 'North Fork'), in the asker's own words.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Shops: the verified East End stores, and where each one is"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a89d87a3d7ccd9588aa77fccf6fa0207638c17eae7e5c553ca7d2173b72cdda4"
        },
        {
          "name": "getting_here",
          "title": "Getting here: fares, ferries, and whether the road is moving",
          "description": "How to reach the East End and move around it: Hampton Jitney, the LIRR Cannonball and off-peak Montauk Branch, Blade, seaplanes, the three ferries, cycling, ride-hail, and driving, each with the operator's published fare, season and stop list and the date the guide last read it. Fares are as published, including the prepaid versus on-board Jitney difference and Cross Sound's fuel surcharge. `roadConditionsNow` reports whether this instant falls inside one of the published NY-27 crawl windows, computed against the East End's clock (America/New_York), with the next window's start time and all three published windows with their days and hours; it is the published pattern, not a live incident feed. With `to`, the answer also reports which Jitney stops serve that destination and the drive-time row for that run, with typical and summer minutes. Every figure carries its source; where `sourceCaveat` appears, the record is filed against a link that does not publish the figure and the figure is the guide's own. `townScope` reports how the place argument was read; `townScope.recognized: false` means the name matched no East End place, the rows array is empty, and `didYouMean` lists near matches where any exist.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "mode": {
                "description": "'car-free' drops driving; 'driving' returns road answers only. Omit for every option.",
                "enum": ["car-free", "driving"],
                "type": "string"
              },
              "to": {
                "description": "The destination, a hamlet ('Montauk', 'Sag Harbor') or a region ('the Hamptons', 'North Fork'), in the asker's own words. Omit for the whole picture.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Getting here: fares, ferries, and whether the road is moving"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:485bbdb5294507d8d7c283f1e4a6135ce3679fa00e640751145e4b740cce9fae"
        },
        {
          "name": "golden_hour",
          "title": "Sunset and sunrise: where to stand, and what time to be there",
          "description": "Verified East End sunrise and sunset viewpoints, 31 in all: public overlooks, beaches, vineyard lawns, hotel terraces and bars, each with the time. `time` is computed from that spot's own latitude and longitude for the date, on the East End's clock (America/New_York); sunset here swings over three hours across the year, and Orient and Montauk Point differ by about two minutes. Each row also carries `goldenHour` (the hour into sunset, or out of sunrise), `blueHour`, `arriveBy` (30 minutes earlier, when the lot fills), `parking` and `walkDistance`. `startsIn` counts down when it has not happened yet today; `alreadyPassedToday` is set when it has. `when: 'sunrise'` gives the morning side; the default is sunset. `date` (YYYY-MM-DD) computes for another day, and `inBestMonth` says whether that date falls in the months the record names. `wrongWayRound` lists verified spots in the same towns that face the other way (Ditch Plains is east-facing). The data holds no weather. Returns up to 8. `townScope` reports how the place argument was read; `townScope.recognized: false` means the name matched no East End place, the rows array is empty, and `didYouMean` lists near matches where any exist.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "ISO date (YYYY-MM-DD) to compute for. Omit for today, East End local.",
                "type": "string"
              },
              "query": {
                "description": "What to look for, e.g. 'dinner', 'drinks', 'no walk', 'wheelchair', 'dog', 'kids', 'vineyard', or a spot's name.",
                "type": "string"
              },
              "town": {
                "description": "A hamlet ('Montauk', 'Sag Harbor') or a region ('the Hamptons', 'North Fork'), in the asker's own words.",
                "type": "string"
              },
              "when": {
                "description": "'sunset' (default) or 'sunrise'.",
                "enum": ["sunset", "sunrise"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sunset and sunrise: where to stand, and what time to be there"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c6aeab40a97dd9d29e47a59782bb231c9553ac7c98e4d42ee79c79761544c29"
        },
        {
          "name": "parking_permit_rules",
          "title": "Can I park here? Permits, day passes, and whether it's enforced now",
          "description": "The East End beach-parking permit map, all 7 jurisdictions, resolved against the beach or town in `where`. For a beach name ('Main Beach', 'Ditch Plains') the answer is the verdict for that lot: which permits grant parking, which stickers explicitly do not (an East Hampton Town sticker does not open Main Beach, which is in East Hampton Village), the non-resident and day-pass options with prices, the fine, and where to apply. Each carries `enforcement.enforcedRightNow`, computed from the published season and daily window against the East End's clock (America/New_York), with the season and the daily hours it was computed from. For a town or hamlet the answer is that jurisdiction plus its beaches' permit lines; with `where` omitted, the whole map. 16 beaches are state, county or DEC land where no town permit applies; they come back flagged `outsideTheStickerMap`. The data covers parking only: no dog rules, lifeguard hours or car-free access. `townScope` reports how the place argument was read; `townScope.recognized: false` means the name matched no East End place, the rows array is empty, and `didYouMean` lists near matches where any exist.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "where": {
                "description": "Beach name, town, hamlet or village, e.g. 'Main Beach', 'Coopers', 'Montauk'. Omit for the whole map.",
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Can I park here? Permits, day passes, and whether it's enforced now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
