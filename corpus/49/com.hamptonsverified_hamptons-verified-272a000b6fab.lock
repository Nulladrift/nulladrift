            "readOnly": true
          },
          "digest": "sha256:bd6722bb9283a2122400d4cdb167ec4e0cf9ff615f730e7ac5d397497ef0329a"
        },
        {
          "name": "plan_my_day",
          "title": "Plan a rules-checked East End day",
          "description": "Three distinct, ordered East End day plans built by Hamptons Verified's deterministic planner, the same rules engine as the website. Each plan is a time-ordered list of stops with `time`, `block`, `name`, `town`, `reason`, `source`, the guide's own listing `url`, and a `mapsUrl` directions link. Before a plan is returned the planner applies permanent closures, the selected date's opening hours, age fit, budget, weather, daylight, geographic sequencing and the maximum drive between consecutive stops. A stop that is a dated event carries an `event` object: its `time` is the organiser's published start, with `access`, `accessNote`, `ticketing`, `source`, `sourceUrl` and `lastVerified`. `eventsOnThisDateNotInThePlan` lists events the guide holds for that date and scope that were not used, each with `whyNotInThePlan`. `saved_places` is a preference lane: names supplied by the asker are worked in where eligible and never override a closure, hours, travel or safety rule; the tool has no access to any account, browser or saved list. The answer reports `vibesUnderstood`, `vibesNotUnderstood`, `whoReadAs` and `partySize`, and a stop whose operator publishes a maximum party size below `party_size` carries a `capacityWarning` quoting the operator's line. `townScope` reports how the place argument was read; `townScope.recognized: false` means the name matched no East End place, the rows array is empty, and `didYouMean` lists near matches where any exist.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "budget": {
                "enum": ["low", "mid", "high"],
                "type": "string"
              },
              "date": {
                "description": "ISO date (YYYY-MM-DD) in East End local time; defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "energy": {
                "enum": ["slow-morning", "full-day", "sunrise-to-sunset", "just-afternoon", "just-evening"],
                "type": "string"
              },
              "party_size": {
                "description": "Number of people, as digits. Stops whose operator publishes a maximum below this number carry a `capacityWarning` quoting the operator's line. When omitted, no capacity check is made.",
                "type": "string"
              },
              "saved_places": {
                "description": "Comma-separated venue names the asker wants included, used as preferences only.",
                "type": "string"
              },
              "seed": {
                "description": "Optional stable seed; the same seed and inputs reproduce the same plans.",
                "type": "string"
              },
              "town": {
                "description": "A hamlet or region to keep the day around. Omit for the full East End.",
                "type": "string"
              },
              "vibes": {
                "description": "Comma-separated interests from: quiet, active, foodie, cultural, beach, adventure, romantic, off-season, shopping, anything. Values outside this list do not influence the plan and are reported in `vibesNotUnderstood`.",
                "type": "string"
              },
              "who": {
                "description": "Who the day is for: solo, couple, family, friends, first-date, in-laws. There is no 'group' value: a group of friends is `friends`, a group with children is `family`, and common aliases are resolved to the nearest value, which the answer reports in `whoReadAs`. Group size is `party_size`.",
                "type": "string"
              }
            },
            "type": "object"
          },
