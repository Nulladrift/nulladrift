      "instructions": "Tools are the documented endpoints of Image Search on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/joj-image-search/pricing · Docs: https://jojapi.com/hub/api/joj-image-search",
      "tools": [
