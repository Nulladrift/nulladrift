                "title": "hl",
                "type": "string"
              },
              "nfpr": {
                "title": "nfpr",
                "type": "string"
              },
              "q": {
                "description": "Search query. You can use search parameters.\n\ne.g. `adele site:youtube.com`\ne.g. `query -exclude`",
