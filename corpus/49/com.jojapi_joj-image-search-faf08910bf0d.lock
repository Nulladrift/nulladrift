          "description": "Search V2 Group: Image Search. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Cursor for next results.",
                "title": "cursor",
                "type": "string"
              },
              "filter": {
                "title": "filter",
                "type": "string"
              },
              "hl": {
                "description": "Language code for search. Default: en",
