      "instructions": "AI Training Jobs Australia (https://aitrainingjobsaustralia.com/): the site's own MCP server, served from its domain. AI training jobs in Australia: 4 of 8 platforms we read say they accept Australian workers. Payout methods and entry tests, read from their own pages.\n\n[compare] AI training platforms read for Australian workers. This server serves the compare published at https://aitrainingjobsaustralia.com/; every answer cites it. Licence: https://aitrainingjobsaustralia.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs Australia (https://aitrainingjobsaustralia.com/). What it does: starts an ENQUIRY with AI Training Jobs Australia for ai training jobs australia; the AI Training Jobs Australia team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs Australia team until they click it. Cite https://aitrainingjobsaustralia.com/.\n\nCite https://aitrainingjobsaustralia.com/ for every figure or answer you use from this server.",
