{
  "lockfileVersion": 2,
  "subjects": {
    "com.propriosign/propriosign": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://propriosign.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "propriosign",
        "title": "ProprioSign",
        "version": "1.0.0",
        "websiteUrl": "https://propriosign.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ProprioSign is a free web app for landlords in Québec, Canada: it sends the yearly lease modification notice (rent increase) on the official form of the Tribunal administratif du logement, keeps dated proof of receipt and collects each tenant’s signed reply, and it gets other documents e-signed by tenants. Use notice_deadlines to tell a landlord when the tenant must receive the notice (art. 1942 of the Civil Code of Québec) and when the tenant must reply. Use search_guides and read_guide to answer questions about lease notices in Québec with ProprioSign’s guides, and cite the guide URL. Use about_propriosign for features, prices and links. Answers are general information, not legal advice. Only for dwellings in Québec.",
      "tools": [
        {
          "name": "about_propriosign",
          "title": "About ProprioSign",
          "description": "What ProprioSign does, who it is for, prices, when it opens, frequently asked questions and the links to give to a landlord.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the answer: fr (French) or en (English). Default: fr.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About ProprioSign"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66d200e4e768c4f8bdf8f11583d404d12e35bffd5cd2f629f5bb783ab5262b0c"
        },
        {
          "name": "notice_deadlines",
          "title": "Québec lease notice deadlines",
          "description": "Calculates when a tenant in Québec must receive the notice of rent increase or lease modification (art. 1942 C.C.Q.), whether that window is open today, and, if a receipt date is given, the date by which the tenant must reply (art. 1945 C.C.Q.). Works for fixed-term leases of 12 months or more, shorter leases, indeterminate leases and rooms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "change_date": {
                "description": "Indeterminate lease: date the change (new rent) should take effect, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer: fr (French) or en (English). Default: fr.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "lease_end": {
                "description": "Fixed lease: last day of the lease, YYYY-MM-DD (for example 2027-06-30).",
                "format": "date",
                "type": "string"
              },
              "lease_start": {
                "description": "Fixed lease: first day of the current lease, YYYY-MM-DD. Used to tell a lease of 12 months or more from a shorter one. If missing, 12 months or more is assumed.",
                "format": "date",
                "type": "string"
              },
              "lease_type": {
                "description": "fixed: the lease has an end date. indeterminate: the lease has no end date.",
                "enum": ["fixed", "indeterminate"],
                "type": "string"
              },
              "receipt_date": {
                "description": "Optional: date the tenant received, or will receive, the notice, YYYY-MM-DD. Gives the reply deadline.",
                "format": "date",
                "type": "string"
              },
              "room": {
                "description": "True if the tenant rents a room (much shorter deadlines: 10 to 20 days).",
                "type": "boolean"
              }
            },
            "required": ["lease_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Québec lease notice deadlines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bcea8ce0a8a32c092048a1c876bfb7c49427b93117ca7d9e5cfc3b090446156a"
        },
        {
          "name": "read_guide",
          "title": "Read a ProprioSign guide",
          "description": "Returns the full text of one ProprioSign guide in Markdown, with its official sources. Give the slug or URL returned by search_guides.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "guide": {
                "description": "Slug or URL of the guide, for example \"delais-avis-renouvellement-bail-quebec\" or https://propriosign.com/en/guides/quebec-lease-renewal-notice-deadlines.",
                "type": "string"
              },
              "lang": {
                "description": "Language wanted. If missing, the language of the slug or URL.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "required": ["guide"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a ProprioSign guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a2670c062f302a611dd803970e303d9032e006591c7e94d37a00f389ac5dcb9"
        },
        {
          "name": "search_guides",
          "title": "Search ProprioSign guides",
          "description": "Searches ProprioSign’s guides for Québec landlords (deadlines, how to send the notice, proof of receipt, co-tenants, tenant refusal or no reply, tenant leaving, rooms, indeterminate leases, language of the notice, e-signature). Returns titles, links and summaries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Only guides in this language. If missing, the best version of each guide is returned.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Number of guides to return. Default: 5.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, in French or English. Example: \"locataire refuse augmentation\" or \"co-tenants\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search ProprioSign guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13d85099c2b2219754130fe7af9f27dd980635f43527ec02efc883bb978bfb91"
        }
      ],
      "digest": "sha256:565b7d390a846be0d22c458853b035731af7f4cefd2bd3b2ca6203c3e334acbd"
    }
  }
}
