      "instructions": "PainSpotter is a database of AI-analyzed business opportunities mined from Reddit, Hacker News and Product Hunt discussions. Data is layered: Category (domain) > Theme (a clustered pain point with trend signal) > Opportunity (a concrete product idea with commercial scores).\n\nSuggested flow: call get_overview first to learn the landscape, then list_trending_themes or query_opportunities to drill in, get_theme for market-signal context, and get_opportunity for full detail. For long-form weekly analyses, use list_blog_posts and get_blog_post (free, no quota cost).\n\nTiering: get_overview, get_opportunity, list_blog_posts and get_blog_post are free. query_opportunities, list_trending_themes and get_theme require a Pro plan. When a tool returns an upgrade notice, relay it to the user and point them to https://painspotter.ai/pricing.",
      "tools": [
        {
          "name": "get_blog_post",
          "title": "Get Blog Post",
          "description": "Get the full Markdown body of one published blog post by its slug.\nFree; does not consume API quota. Content is an original AI synthesis with\nno verbatim community quotes.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Article slug, taken from list_blog_posts results.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
