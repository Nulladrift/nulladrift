        {
          "name": "list_trending_themes",
          "title": "List Trending Themes",
          "description": "List themes that are currently heating up (sorted by trend change %), to catch\ndemand that is growing. A theme is the \"market-signal layer\": it aggregates\nmultiple opportunities and carries 30-day mentions, trend direction and audience clarity.\n(Pro tool)",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "description": "Number of themes to return, 1-30. Default 15.",
                "type": "integer"
              },
              "min_mentions": {
                "default": 2,
                "description": "Minimum 30-day discussion count, filters out noise. Default 2.",
                "type": "integer"
              }
            },
            "type": "object"
          },
