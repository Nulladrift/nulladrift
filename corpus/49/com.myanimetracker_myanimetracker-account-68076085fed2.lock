        {
          "name": "search_anime",
          "title": "Search anime",
          "description": "Search the MyAnimeTracker anime catalog by title. Returns matching releases (TV seasons, films, OVAs, specials) with their catalog ID, format, year, episode count and page links. Safe-for-work titles only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "description": "Only this kind of release. Leave out to search all of them.",
                "enum": ["TV", "MOVIE", "OVA", "ONA", "SPECIAL"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many results to return, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a title, in English, romaji or Japanese.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
