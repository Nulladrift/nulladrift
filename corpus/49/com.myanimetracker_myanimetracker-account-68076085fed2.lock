        {
          "name": "mark_episodes_watched",
          "title": "Mark episodes watched",
          "description": "Mark episodes of one anime season or film as watched on the signed-in person's MyAnimeTracker list, from episode 1 through the number given. It never unmarks an episode. Episode numbers count within that one entry (season 2 starts again at 1); a film is through_episode 1. Give a title or a catalog ID.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mal_id": {
                "description": "The catalog ID from a title search (the same number MyAnimeList uses). Use it instead of a title when you have it.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "integer"
              },
              "through_episode": {
                "description": "Mark episodes 1 up to this number as watched. Later episodes are left as they are.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "title": {
                "description": "The show's name, in English or romaji, for example \"Frieren\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["through_episode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Mark episodes watched"
