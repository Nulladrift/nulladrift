      "serverInfo": {
        "name": "myanimetracker",
        "version": "1.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MyAnimeTracker is an anime tracker that keeps whole series in release order. These tools read its reviewed catalog: search titles, get a franchise's watch order, list which episodes are filler, see what is airing this week (its airing calendar), and see what MyAnimeTracker members added most lately. Results are safe-for-work titles, and carry structure only (order, counts, dates, episode numbers), never plot summaries. Pass along the source credits in each result when you repeat its data. Four more tools work with the person's own MyAnimeTracker list once they sign in, which calling one of them asks them to do: my_library reads it, add_to_list adds a series (all its seasons and films count as one), and mark_episodes_watched marks episodes 1 through a number as watched. Those two never remove or overwrite anything. friends_watching lists what the people they follow have been watching, and whats_airing with mine set to true lists when the shows on their list air next. Only do what the person asked for, and tell them what changed.",
      "tools": [
        {
          "name": "add_to_list",
          "title": "Add to my list",
          "description": "Add an anime series to the signed-in person's MyAnimeTracker list with a status. A series is tracked as one thing: all its seasons and films. If any part of it is already on the list, nothing changes. Give a title or a catalog ID.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mal_id": {
                "description": "The catalog ID from a title search (the same number MyAnimeList uses). Use it instead of a title when you have it.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "integer"
              },
              "status": {
                "default": "plan_to_watch",
                "description": "Where to put it: plan_to_watch (the default), watching, completed, on_hold or dropped.",
                "enum": ["plan_to_watch", "watching", "completed", "on_hold", "dropped"],
                "type": "string"
              },
              "title": {
                "description": "The show's name, in English or romaji, for example \"Frieren\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add to my list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://myanimetracker/cards-v1.html",
            "openai/toolInvocation/invoked": "Updated your list",
            "openai/toolInvocation/invoking": "Adding to your list",
            "ui": {
              "resourceUri": "ui://myanimetracker/cards-v1.html"
            },
            "ui/resourceUri": "ui://myanimetracker/cards-v1.html"
          },
          "digest": "sha256:7fbc4f794e86ffe579d4e9fb1d1e51b2b90e03c57f4880c29ebf1aa9043b469d"
        },
        {
          "name": "friends_watching",
          "title": "What my friends are watching",
          "description": "List what the people the signed-in person follows on MyAnimeTracker have been watching or finished over the last 30 days, by their @username, newest first. Only people whose list the person is allowed to see, and safe-for-work titles only.",
