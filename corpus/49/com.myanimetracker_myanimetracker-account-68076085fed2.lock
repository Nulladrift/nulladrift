          },
          "digest": "sha256:c4d703034eebfd39c423047f71d36a2c888799101561bc83cae212f8c3f9cb29"
        },
        {
          "name": "my_library",
          "title": "My anime list",
          "description": "List the signed-in person's MyAnimeTracker list: each title with its status (Watching, Completed, Plan to Watch, On Hold, Dropped), score and how many episodes they have watched. Safe-for-work titles only, most recently updated first. For when their shows air next, use whats_airing with mine set to true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many titles to list, 1 to 50. The most recently updated come first.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Only titles with this status. Leave out for all of them.",
                "enum": ["plan_to_watch", "watching", "completed", "on_hold", "dropped"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
