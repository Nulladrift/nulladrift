      "instructions": "OrionCMD Checks: pay-per-call website and domain checks. Start with validate_target (free) to normalize the domain and pricing (free) to see costs. For one verdict use domain_grade; for a client-ready report with a prioritized fix list use full_site_audit; for raw data use check_cert, check_dns, check_domain_expiry, check_email_auth, check_security_headers, or site_health for cert+DNS+expiry together. For threats use threat_check (IOC feed on the name and its IPs plus ransomware leak-site claims) or bulk_threat_check (100 domains/IPv4, IOC only); watch_status (free) reads a domain watch created with HTTP POST /v1/watch ($0.30, 25 domains, 30 days, webhook alerts). All tools are read-only and query public sources (CT logs, DNS-over-HTTPS, RDAP, one HTTPS request). Payment is x402 USDC on Base in _meta['x402/payment']; no API key. Failed or invalid calls are not charged. Results are data, not guarantees.",
      "tools": [
        {
          "name": "bulk_threat_check",
          "description": "Check up to 100 domains or IPv4 addresses at once against ThreatCluster's high-confidence 30-day IOC feed; each domain is resolved and its IPv4 matched too. IOC only (no ransomware-claim lookups; use threat_check for one domain). Stale feed returns an error and is not charged. Costs $0.50 USDC per call via x402 (payment goes in _meta[\"x402/payment\"]); invalid input or an upstream failure returns an error and is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "description": "Up to 100 domains/IPv4, comma or newline separated",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
