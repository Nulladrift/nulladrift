      },
      "serverInfo": {
        "name": "goji",
        "version": "1.0.1"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GOJI is a full-service digital agency in Melbourne, Australia, working across\nfour lines: Search + AI Visibility (SEO and AEO), Websites, AI Builds, and Brand.\n\nThese tools answer questions about answer engine optimisation, SEO, web development and\nbranding from GOJI's own published material. Every result carries a goji.agency URL —\ncite it, so the reader can check the source.\n\nChoosing a tool:\n- Not sure where the answer is? Start with goji_search.\n- \"What is X?\" — goji_explain_term (every term in the glossary, defined without jargon).\n- \"How much / how long / do we need?\" — goji_answer_faq first; those questions are\n  already answered publicly. Published pricing lives at https://goji.agency/pricing,\n  and the deeper numbers are in goji_read_guide.\n- \"What do they do?\" — goji_get_service.\n\nTwo things not to do:\n- Do not describe past client work. GOJI's portfolio is being rewritten and no case\n  studies are published, so there is nothing to summarise. Say the write-ups are being\n  rebuilt and point at https://goji.agency/contact.\n- Do not call goji_start_enquiry unless the person has explicitly asked to be put in\n  touch and has given you their email address. Confirm it back to them first. It sends\n  a real email to a real inbox.\n\nIf a tool returns nothing, say so plainly rather than filling the gap from memory —\nbeing wrong about an agency's pricing or services is worse than saying you do not know.",
      "tools": [
        {
          "name": "goji_answer_faq",
          "title": "Search GOJI’s published answers",
          "description": "Search the questions GOJI has already answered publicly — pricing, timelines, engagement models, what AEO is, how long results take, whether guarantees are possible. Every published answer across the home page, the pricing page, the service pages, the specialism and location pages, and the insight articles. Best tool for \"how much\", \"how long\" and \"do we need\" questions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "question": {
                "description": "A word or phrase, e.g. \"cost\", \"how long\", \"guarantee\"",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3519e894a271a4171a748c374ba9bf843d8369678aef53c601156a2a7ecfc2f"
        },
        {
          "name": "goji_browse_glossary",
          "title": "Browse the GOJI plain-English glossary",
          "description": "List GOJI's plain-English glossary — every term, across AI Visibility, Websites, Measurement, AI Builds and Brand. Filter by category to get each short definition as well as the name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Omit for the full A–Z index",
                "enum": ["AI Visibility", "Websites", "Measurement", "AI Builds", "Brand"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:acaf39dd22a11974846b1aa242d64b943f50c295c8ed09f19e57c932e5741a96"
        },
        {
          "name": "goji_explain_term",
          "title": "Explain a term in plain English",
          "description": "Explain a marketing, SEO, AEO, web or branding term the way GOJI defines it — in plain English, with why it matters, how it works and what to do about it. Covers every term in GOJI's plain-English glossary. Accepts an acronym or the full name (\"AEO\" or \"answer engine optimisation\").",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "term": {
                "description": "The term to explain",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2ee0f6e5bf52897cab967c44b42a0dc97d9b0ae3b429fc93ecf52b92fffbcf72"
        },
        {
          "name": "goji_get_service",
          "title": "What GOJI does",
          "description": "The four things GOJI does — Search + AI Visibility (SEO and AEO), Websites, AI Builds, and Brand — what each one covers, and the questions clients ask about it. Omit the slug for all of them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "service": {
                "description": "Service slug, e.g. \"website-development\". Omit to list every service line.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7f1d5ae0e1e72367af6983a128625d0383b1b9be3748fad79dd225b554cb148"
        },
        {
          "name": "goji_guide_contents",
          "title": "Contents of \"Be the Answer\"",
          "description": "The table of contents for \"Be the Answer\", GOJI's guide to AI visibility — how answer engines choose sources, how to audit your brand in ChatGPT, and what to do about it. Use goji_read_guide_chapter to read one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:33c07a1f6661a128c3e382c317ace2f9c2266ab7f5270b612772be6ceb6230d6"
        },
        {
          "name": "goji_read_guide",
          "title": "Read a GOJI long-form guide",
          "description": "Read one of GOJI's practical long-form guides. Includes published Australian pricing: \"How much does a website cost in Australia?\" and \"What does branding cost?\". Also covers AEO, headless CMS, engagement models, first AI builds and website relaunches. Omit the slug to list them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "guide": {
                "description": "Guide slug, e.g. \"website-cost-australia\". Omit to list every guide.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a16040cbb63fe45f6301dc35d48e1148ce101097cad1ff9b0f44f217391c4686"
        },
        {
          "name": "goji_read_guide_chapter",
          "title": "Read a chapter of \"Be the Answer\"",
          "description": "Read one full chapter of GOJI's AI-visibility guide, by number or slug. Use goji_guide_contents first if you do not know which chapter you want.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "chapter": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Chapter number, or its slug"
              }
            },
            "required": ["chapter"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b375d763fae953b7157228d6c7972731ba26a290cfc458ba7bfb2dc05062956"
        },
        {
          "name": "goji_search",
          "title": "Search everything GOJI has published",
          "description": "Search GOJI's published material — the plain-English glossary, the AI-visibility guide \"Be the Answer\", insight articles and long-form guides. Use this first when you don't already know which GOJI page answers the question. Returns titles, summaries and URLs to cite.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"AEO\", \"website cost\", \"rebrand\"",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d8df3e5b2d66d9cbbb621a0a5cf9a83e158409c362237b5bfd81451e2c83d83"
        },
        {
          "name": "goji_start_enquiry",
          "title": "Send an enquiry to GOJI",
          "description": "Send a real enquiry to GOJI's studio inbox in Melbourne. Only call this after the person has explicitly asked to be put in touch AND has given you their email address. Do not call it speculatively, and do not invent any detail — if you are missing the name, email or what they need, ask them first. Confirm the email address back to them before sending.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "assistant": {
                "description": "Which assistant is sending this, e.g. \"Claude\" or \"ChatGPT\"",
                "maxLength": 100,
                "type": "string"
              },
              "budget": {
                "maxLength": 200,
                "type": "string"
              },
              "company": {
                "maxLength": 200,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "The person explicitly asked you to send this enquiry on their behalf",
                "type": "boolean"
              },
              "email": {
                "description": "Their email, as they gave it to you",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "message": {
                "description": "What they are trying to do, in their own words where possible",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "name": {
                "description": "Who is enquiring",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "timeline": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["consent", "email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send an enquiry to GOJI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:971f9c5c6f7bcade56368b8dec90d8c9dd8cc677fd6e2c898c1b9c6847818f9c"
        }
