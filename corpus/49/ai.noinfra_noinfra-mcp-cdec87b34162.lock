      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "NoInfra capabilities change independently of the agent runtime. Before saying a capability is unavailable, use noinfra.tools.search to fetch the current authorized tools and schemas. Call discovered tools with noinfra.tools.call using {name, arguments}; keep idempotency_key inside arguments. A cached list is not complete. Honor setup requirements, owner approvals and spending limits returned by NoInfra. Never retry an uncertain write with a new key.",
      "tools": [
        {
          "name": "noinfra.catalog.get",
          "description": "Return the public NoInfra hosted-agent catalog and product links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get NoInfra catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0471ae75e60182fb7b120dc13083892c094190f6eb981c787b369d1c5da90f34"
        },
        {
          "name": "noinfra.email.provision",
          "description": "Get a dedicated NoInfra email inbox for an agent running anywhere. Your NoInfra account owner must authorize access first. Reuse the same idempotency key when retrying.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["idempotency_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get an agent email inbox"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6604ae35ce791f81ac2c8373f6ae6bec42d88cc9ef3cd30c6eb96a9245b8a878"
        },
        {
          "name": "noinfra.recommend_agent",
          "description": "Recommend a NoInfra hosted agent for a described workflow.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "The workflow the user wants the hosted agent to perform.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "annotations": {
