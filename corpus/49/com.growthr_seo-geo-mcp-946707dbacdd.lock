{
  "lockfileVersion": 2,
  "subjects": {
    "com.growthr/seo-geo-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.growthr.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "growthr",
        "title": "Growthr SEO + GEO MCP",
        "version": "1.3.0",
        "description": "SEO and GEO tools for any AI assistant: scan a site the way ChatGPT, Perplexity, Claude, and Google crawlers see it, get the fix order, draft an llms.txt, and check whether an AI answer names a brand. Free, no API key, no account. By Growthr.",
        "websiteUrl": "https://mcp.growthr.com",
        "icons": [
          {
            "src": "https://growthr.com/images/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Growthr's SEO and GEO tools. Scan a public domain, draft its llms.txt, get a fix order, and (when enabled) check where a brand lands in an AI answer. Public domains only. Growthr logs which domains are scanned. Built by Growthr, https://growthr.com.",
      "tools": [
        {
          "name": "growthr_ai_visibility",
          "title": "Check whether an AI answer names a brand",
          "description": "Run one buyer-shaped prompt through Gemini with Google Search grounding (a real, cited web search, the same mechanism behind Google AI Overviews) and report where the brand lands on the five-rung ladder: absent, cited (a page of the brand's site is a source), mentioned (named in the text), recommended (on the shortlist), or recommended against. Also returns the other names on the shortlist and the source domains the answer was built from. One prompt per call; limited to a few calls per day per user because grounded requests are billed per query.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name to look for, e.g. 'Growthr'",
                "type": "string"
              },
              "domain": {
                "description": "Optional brand domain, e.g. growthr.com, to detect citations",
                "type": "string"
              },
              "prompt": {
                "description": "The question a buyer would ask, e.g. 'best corporate event photographer in New York'",
                "type": "string"
              }
            },
            "required": ["brand", "prompt"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "against": {
                "type": "boolean"
              },
              "cited": {
                "type": "boolean"
              },
              "engine": {
                "type": "string"
              },
              "mentioned": {
                "type": "boolean"
              },
              "recommended": {
                "type": "boolean"
              },
              "rung": {
                "enum": ["absent", "cited", "mentioned", "recommended", "recommended against"],
                "type": "string"
              },
              "shortlist": {
                "description": "Providers the answer put forward",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "shortlistSource": {
                "enum": ["llm", "heuristic"],
                "type": "string"
              },
              "sources": {
                "description": "Source domains the answer was built from",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["engine", "rung", "shortlist", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check whether an AI answer names a brand"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bdee5850a7760b1a969ed9b9b991cc9b4927a37b9381082bb8d869c4ab18de45"
        },
        {
          "name": "growthr_fix_order",
          "title": "Order a site's fixes by effort",
          "description": "Run the scan and sort every failed check into buckets: blockers (fix before anything else, they hide everything downstream), this afternoon (metadata, llms.txt, trust pages, on-page), needs a sprint (schema, markdown negotiation, speed), and the off-site work no scan can measure (reviews, directories, third-party mentions), which is what decides whether AI engines recommend a business.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Public domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "afternoon": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "blockers": {
                "description": "Check ids to fix before anything else",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "other": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "score": {
                "type": "integer"
              },
              "sprint": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["afternoon", "blockers", "domain", "score", "sprint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Order a site's fixes by effort"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a7c094770ac3118ae342f0433a4700f0d83627230040d30afe6fca451ffa7fb8"
        },
        {
          "name": "growthr_llms_txt",
          "title": "Draft an llms.txt for a site",
          "description": "Read a site's homepage, sitemap (or homepage links), and up to twelve pages, then draft an llms.txt in the llmstxt.org format: H1 name, blockquote summary, grouped page list with one-line descriptions, contact, profiles, links. The 'When to use' section is left as a marked placeholder on purpose; it is a judgment about the business that no crawler can write. Returns the draft plus notes on anything skipped.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Public domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              },
              "llmsTxt": {
                "description": "The draft, llmstxt.org format",
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pages": {
                "description": "Pages read",
                "type": "integer"
              }
            },
            "required": ["domain", "llmsTxt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Draft an llms.txt for a site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e0c072272326bcea44cc2a8c5143dd0650463dddfed613e6a473d7735ac6a919"
        },
        {
          "name": "growthr_scan",
          "title": "Scan a site for SEO and AI readability",
          "description": "Fetch a public domain the way search engines and AI crawlers do (ChatGPT's GPTBot, Claude's ClaudeBot, and the fetchers behind Perplexity and Google AI Overviews: from a datacenter IP, no JavaScript) and run 22 weighted checks: reachability as a browser, GPTBot, and ClaudeBot; server-rendered content; metadata; strict JSON-LD and Organization schema; robots.txt access for AI crawlers; llms.txt and an in-page link to it; sitemap; honest 404s; markdown negotiation; trust pages; speed; and on-page SEO (title, description, single h1, viewport, alt text, favicon). Returns a 0-100 score and every check with pass/fail, what was found, and a fix hint. Reads about a dozen public URLs once. Growthr logs the domain and tool name for usage stats.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Public domain, e.g. example.com (no path)",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checks": {
                "items": {
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "pass": {
                      "type": "boolean"
                    },
                    "weight": {
                      "type": "number"
                    }
                  },
                  "required": ["id", "label", "pass"],
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "score": {
                "description": "0-100",
                "type": "integer"
              },
              "throttledCount": {
                "description": "Requests the site answered with HTTP 429",
                "type": "integer"
              }
            },
            "required": ["checks", "domain", "score"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Scan a site for SEO and AI readability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b6693b789532be8daeba9defda9fc8ad4fac4582812fe41f2f8e378147eb782d"
        }
      ],
      "digest": "sha256:6f4b3f842b53edd858394f4192c652419c3bbb6848dd20f2eb09efeadf23a745"
    }
  }
}
