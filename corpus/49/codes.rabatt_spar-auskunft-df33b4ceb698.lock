  "subjects": {
    "codes.rabatt/spar-auskunft": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rabatt.codes/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rabatt-codes",
        "title": "rabatt.codes Spar-Auskunft",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Savings information for online shoppers in Switzerland (CH), Germany (DE) and Austria (AT), from the live data of rabatt.codes. The promotions come directly from the shops and are updated several times a day; codes are not tested by hand. Every tool needs the user's country. Results are written in German. Voucher codes are not part of the results: each entry carries a link to the shop page on rabatt.codes where the code is shown. Forecasts are labelled as announced or estimated.",
      "tools": [
        {
          "name": "buy_now_or_wait",
          "title": "Jetzt kaufen oder warten?",
          "description": "Tells whether a promotion is expected soon. With a shop: what is valid now and the next promotion, labelled as announced by the shop or estimated from its past rhythm. Without a shop: announced and estimated promotions across shops in that country. Use it when the user asks whether to buy now or wait, or when a shop will have its next sale. Estimates are not guarantees. Results are in German.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country of the shopper: CH (Switzerland), DE (Germany) or AT (Austria). Required — ask the user if unknown.",
                "enum": ["CH", "DE", "AT"],
                "type": "string"
              },
              "shop": {
                "description": "Optional shop name or domain.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Jetzt kaufen oder warten?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce97a78421d0d75dce6b29870834a5addbb267133a5358fdd58f0ee152268814"
        },
        {
          "name": "find_shop_vouchers",
          "title": "Gutscheine für einen Shop",
          "description": "Looks up the currently valid voucher codes and offers for one online shop in Switzerland, Germany or Austria, using the live data of rabatt.codes (supplied directly by the shops, updated several times a day). Use it when the user asks whether a coupon, promo code or discount exists for a named shop. Returns discount, conditions and expiry date per entry, plus a link to the shop page on rabatt.codes (the code itself is shown there, not in this result). If nothing is valid right now, it says so and adds when the next promotion is expected, if known. Results are in German.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country of the shopper: CH (Switzerland), DE (Germany) or AT (Austria). Required — ask the user if unknown.",
                "enum": ["CH", "DE", "AT"],
                "type": "string"
              },
              "shop": {
                "description": "Shop name or domain, e.g. \"Zalando\" or \"zalando.ch\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "shop"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gutscheine für einen Shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b402c2f73bc3e8d196d0dd5a6447a845073e33e09a8443b5421853b170f551c9"
        },
        {
          "name": "top_vouchers",
          "title": "Wo spare ich am meisten?",
          "description": "Lists the currently valid vouchers and offers with the highest discounts in one country, optionally within one category (for example fashion, electronics, travel, beauty). Use it when the user asks where they can save most right now or wants current deals for a category. The result names the available categories. Results are in German.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category, as a German or English word or a category slug.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Country of the shopper: CH (Switzerland), DE (Germany) or AT (Austria). Required — ask the user if unknown.",
                "enum": ["CH", "DE", "AT"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Wo spare ich am meisten?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad57461161e1099d391fe011f534388a31af0d3b543298be0f31a50929b3eb66"
        }
      ],
      "digest": "sha256:ebd14a08de97cb4acb08817417b51ded7b8be6e32f80fe2b67e4f6e191e8b3c2"
    }
  }
}
