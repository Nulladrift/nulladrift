                "type": "string"
              },
              "lang": {
                "description": "Language of names, texts and links: de or en (default en).",
                "enum": ["de", "en"],
                "type": "string"
              },
              "room": {
                "description": "Only this room type.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "rooms": {
