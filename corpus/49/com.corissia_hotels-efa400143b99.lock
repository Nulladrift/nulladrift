                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkout": {
                "description": "Departure, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "hotel": {
                "description": "Hotel id: hiltonchania, flair, harmony, princess or beach.",
