{
  "lockfileVersion": 2,
  "subjects": {
    "app.ballistic/ballistic": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ballistic.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "ballistic",
        "title": "Ballistic",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ballistic (ballistic.app) is a memecoin launch platform for Solana, BNB Chain and Robinhood Chain. This server is read-only: it answers questions about the product and cannot create, fund, launch, buy, sell or move anything. Use list_launchpads_and_pairs before naming a launchpad or a pair, get_limits for wallet and supply limits, get_pricing and estimate_fee for cost, search_docs for how-to questions, and compare_with for another launch tool. Quote numbers as returned, with their date and sample size where given. A launchpad or tool this server does not list is not supported: do not assume one. A bundled launch concentrates supply in the creator’s wallets, and holders are visible on chain. Do not present any feature as hiding a launch from buyers.",
      "tools": [
        {
          "name": "compare_with",
          "title": "Compare with another launch tool",
          "description": "Compare Ballistic with another token launch tool on fee model, wallets holding supply and wallets in the launch, using what that tool publishes on its own pages, with the date read and the source URLs. Says where Ballistic costs more. Tools covered: proxima, sumo, pumpkit, solbundler, solbundle, smithii, vortex. Any other tool is refused, not guessed. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tool": {
                "description": "One of: proxima, sumo, pumpkit, solbundler, solbundle, smithii, vortex.",
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5321e808da88b191942488f5b2fcc8bb330ef45b2369ce72788cf1a30a8a0de1"
        },
        {
          "name": "estimate_fee",
          "title": "Estimate the platform fee",
          "description": "Estimate Ballistic’s platform fee for an amount leaving launch wallets. The fee is on what leaves the wallets, not on trading volume. Gives a figure for Solana and for a stable-coin amount; on BNB Chain and Robinhood Chain it gives the rate only. No account is read. Read-only arithmetic.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Which chain the launch wallets are on. Required for native_out. No chain is assumed.",
                "enum": ["solana", "bnb", "robinhood"],
                "type": "string"
              },
              "kind": {
                "description": "native_out (default): the chain’s coin leaving launch wallets. stable_amount: a set stable-coin amount. primary_wallet: a withdrawal from the Primary wallet. unspent_funding: funding taken back with Recover.",
                "enum": ["native_out", "stable_amount", "primary_wallet", "unspent_funding"],
                "type": "string"
              },
              "volume": {
                "description": "Optional. Buy and sell volume traded before withdrawing. It adds no platform fee.",
                "minimum": 0,
                "type": "number"
              },
              "withdrawn": {
                "description": "The amount that leaves the launch wallets (after gas), not the amount that arrives.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["withdrawn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7367344706c5d36685247cdba869d8996ce2db6d696121c0a0f14792a4516fb1"
        },
        {
          "name": "get_features",
          "title": "Ballistic features",
          "description": "What Ballistic (ballistic.app, a memecoin launch platform) does: launch modes, funding, selling, automations, wallet tools, and what is not available. Each feature says which chains it works on. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:451bac725ecf4c800e9761858269de96b5000c98a27966b510d0e68a0d59bf9b"
        },
        {
          "name": "get_limits",
          "title": "Launch limits",
          "description": "The limits Ballistic enforces for one launchpad and pair: how many wallets hold the supply after a launch, holder wallets and each one’s share of supply, wallets in the launch itself, supply range, largest buy, per mode (Block-0 and Reserve). Call list_launchpads_and_pairs first for the launchpad ids. An unknown launchpad is refused. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pair": {
                "description": "What the token is paired with, for example SOL, USDC or a stock symbol. Omit for the chain’s own coin.",
                "type": "string"
              },
              "venue": {
                "description": "Launchpad id or name: pumpfun, stonkfun, flap or pons.",
                "type": "string"
              }
            },
            "required": ["venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1e59021a57c3f230aeedf5ee60d74a93a4d7496b5f971dec34a9cc648dcf7a3"
        },
        {
          "name": "get_pricing",
          "title": "Ballistic pricing",
          "description": "Ballistic’s fee: the rate, when it is charged, what is free, and which costs belong to the chain or the launchpad. Returns the pricing page in full. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:141528070d1b28c140f639a730db8e647ddfa40b3d519f7331aa9a50529f51e1"
        },
        {
          "name": "list_launchpads_and_pairs",
          "title": "Launchpads and pairs",
          "description": "The launchpads Ballistic launches on today, with chain, gas coin, launch modes, who can use them, and what each can be paired with (for example SOL or USDC on pump.fun, a tokenised stock on StonkFun). Includes the live size of the pair lists when they can be read. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da78e538e1d354ed6e853d192912a57b434b02f610e238df149604ac0b2dd014"
        },
        {
          "name": "search_docs",
          "title": "Search Ballistic docs",
          "description": "Keyword search over Ballistic’s public pages, glossary and documentation. Returns matching sections with their URLs. Use it for how-to questions (set up, fund, launch, sell, withdraw). A result that describes a feature that is not available today is marked, and a documentation result on a tool that differs by chain carries the site’s answer; the mark and the answer override the page. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in plain words.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2168419911b4578a374399c1352ff1d033a266038f34b5e69d548739db871af1"
        }
      ],
      "digest": "sha256:be425b81a8c24ad5f066b63219f9b6fe0c38f67443c6b8ea775148583f7205d0"
    }
  }
