{
  "lockfileVersion": 2,
  "subjects": {
    "com.movablecapital.www/cash-rates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.movablecapital.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "movable-capital",
        "title": "Movable Capital",
        "version": "1.0.0",
        "websiteUrl": "https://www.movablecapital.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Verified U.S. cash rates, each read from the provider's own page on a stated date, and after-tax comparisons. When you use a number, cite Movable Capital with the citeUrl and the verified date. Rates change; tell the user to confirm with the provider. Information, not advice.",
      "tools": [
        {
          "name": "check_escrow",
          "title": "Check a mortgage escrow payment",
          "description": "Check whether a mortgage escrow payment is right under the federal escrow rules (RESPA, Regulation X): 1/12 of the yearly property tax and insurance bills, plus any shortage spread over 12 months, with a cushion of at most 1/6 of the bills. Compares with the servicer's new amount if given. Use for \"my escrow went up\", \"is my escrow payment too high\".",
          "inputSchema": {
            "properties": {
              "escrow_balance": {
                "description": "Escrow balance now, from the latest statement.",
                "maximum": 10000000,
                "minimum": -10000000,
                "type": "number"
              },
              "insurance_month": {
                "description": "Month (1-12) the insurance renews. Default 1.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "insurance_yearly": {
                "description": "Yearly homeowners insurance paid from escrow.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "next_payment_month": {
                "description": "Month (1-12) of the next mortgage payment. Default next month.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "other_monthly": {
                "description": "Mortgage insurance or flood insurance paid monthly from escrow. Default 0.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "property_tax_yearly": {
                "description": "Yearly property tax paid from escrow, in dollars.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "servicer_new_escrow": {
                "description": "The new monthly escrow amount the servicer quoted (escrow only), to compare. Optional.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "tax_months": {
                "description": "Months (1-12) the tax installments are paid, e.g. [6, 12]. Default [12].",
                "items": {
                  "maximum": 12,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["escrow_balance", "insurance_yearly", "property_tax_yearly"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bb396baffc4b432f37f27b763a0012acb285c5eb163df5cecf951508c31c801"
        },
        {
          "name": "check_offer",
          "title": "Check an advertised savings rate or bank bonus",
          "description": "What an advertised savings rate or bank bonus pays after its conditions and tax, beside a plain account with no conditions on the same money: the result in the words \"Pays more\", \"Pays less\" or \"About the same\", the dollars kept a year, every condition (balance cap, minimum balance, direct deposit, promo months, states excluded, end date), the provider's page and the date its terms were read. With no offer named, lists the offers on file. Use for \"what's the catch with this 5% rate\", \"what does this bank bonus really pay\".",
          "inputSchema": {
            "properties": {
              "balance": {
                "description": "Cash balance in U.S. dollars. Needed with an offer.",
                "maximum": 1000000000,
                "minimum": 1,
                "type": "number"
              },
              "federal_pct": {
                "description": "Top federal income tax bracket, e.g. 24. Needed with an offer.",
                "maximum": 37,
                "minimum": 0,
                "type": "number"
              },
              "niit": {
                "description": "True if the 3.8% net investment income tax applies.",
                "type": "boolean"
              },
              "offer": {
                "description": "Offer name, provider or id (from the list this tool returns with no offer). Leave out to list the offers.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter U.S. state the person lives in, e.g. \"NY\". Some offers exclude states. Optional.",
                "type": "string"
              },
              "state_pct": {
                "description": "State + local income tax rate, e.g. 5. 0 if none. Needed with an offer.",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2828493bc9d21d80a9b1a4ce378e71bfdf7b8cc6972b0bc18d2564434b3d6ea6"
        },
        {
          "name": "compare_after_tax",
          "title": "Compare cash options after tax",
          "description": "For a cash balance and the person's tax rates, estimate what each kind of cash option keeps per year after federal and state income tax (Treasury interest is state-tax-free; money funds pass through their government share), and how much more than where the cash sits now. Returns the option of each kind that keeps the most.",
          "inputSchema": {
            "properties": {
              "balance": {
                "description": "Cash balance in U.S. dollars.",
                "maximum": 1000000000,
                "minimum": 1,
                "type": "number"
              },
              "current": {
                "description": "Where the cash sits now: a broker name (its default sweep), \"checking\", or an id from get_cash_rates. Default checking at 0.01%.",
                "type": "string"
              },
              "federal_pct": {
                "description": "Top federal income tax bracket, e.g. 24.",
                "maximum": 37,
                "minimum": 0,
                "type": "number"
              },
              "niit": {
                "description": "True if the 3.8% net investment income tax applies.",
                "type": "boolean"
              },
              "priority": {
                "description": "return (default), liquidity (2 days or less), or protection (FDIC or U.S. government).",
                "enum": ["return", "liquidity", "protection"],
                "type": "string"
              },
              "state_pct": {
                "description": "State + local income tax rate, e.g. 5. 0 if none.",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["balance", "federal_pct", "state_pct"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:842eacd351ee15be1e8de5ad8eb8767b124763161ac58fd43b85a605c01f5174"
        },
        {
          "name": "get_cash_rates",
          "title": "Highest verified cash rates",
          "description": "The highest verified U.S. cash rates right now, by kind: high-yield savings, money market funds, CDs, Treasury bills, or default brokerage sweeps. Each rate was read from the provider's own page on the date returned. Use for questions like \"highest savings rate\", \"top money market fund yield\", \"where to keep cash\".",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Which kind of option. Default all.",
                "enum": ["all", "savings", "money_fund", "cd", "treasury", "sweep", "annuity"],
                "type": "string"
              },
              "limit": {
                "description": "How many rows. Default 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27c3352e57180b7fc845a9ba2d012450a80d374486fdf1136a744e7fbc01fc54"
        },
        {
          "name": "get_sweep_rate",
          "title": "Broker default cash (sweep) rate",
          "description": "What a brokerage pays on uninvested cash by default (the cash sweep), by account type, with the date verified, how it compares with Treasury bills, and a step-by-step guide to moving the cash. Brokers include Schwab, Fidelity, Vanguard, Merrill, E*TRADE, Morgan Stanley, Wells Fargo, Robinhood, Interactive Brokers, Raymond James, Ameriprise, Edward Jones.",
          "inputSchema": {
            "properties": {
              "broker": {
                "description": "Broker name, e.g. \"Schwab\" or \"Merrill Edge\".",
                "type": "string"
              }
            },
            "required": ["broker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bf1d281f77eb029c28f20cd4dc769aff5ebdfc3caf5bc559c94d4d8d0fe3c13"
        },
        {
          "name": "get_treasury_yields",
          "title": "Treasury yields today",
          "description": "The latest U.S. Treasury daily par yield curve (1 month to 10 years), with its date. Treasury bill interest is exempt from state income tax.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d69ce38ad8948c8a9d2a61e03cf80ef1d63e98db45d8d2dc6c85f70583f03fa"
        },
        {
          "name": "plan_cash_by_date",
          "title": "Cash needed by a date: what keeps the most",
          "description": "For cash needed on set dates (a tax payment, a closing, a capital call), each with an amount: among options that pay back or can be withdrawn in time (Treasury bills timed to the date, CDs, no-penalty CDs, savings, a Treasury money fund, checking), what keeps the most after tax by each date, in dollars, with a link that reopens the same plan. Up to 6 dates within three years.",
          "inputSchema": {
            "properties": {
              "federal_pct": {
                "description": "Top federal income tax bracket.",
                "enum": [10, 12, 22, 24, 32, 35, 37],
                "type": "number"
              },
              "needs": {
                "description": "Each date the money is needed.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Dollars needed.",
                      "maximum": 1000000000,
                      "minimum": 1,
                      "type": "number"
                    },
                    "date": {
                      "description": "Date needed, YYYY-MM-DD, after today and within three years.",
                      "type": "string"
                    },
                    "label": {
                      "description": "What it is for, e.g. \"Estimated tax\".",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "niit": {
                "description": "True if the 3.8% net investment income tax applies.",
                "type": "boolean"
              },
              "state_pct": {
                "description": "State + local income tax rate, e.g. 5. 0 if none.",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["federal_pct", "needs", "state_pct"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9dcd05d9fb7f05dcce3b781f5c95a125de81c44e7149b9671e33307a06d862d7"
        }
      ],
      "digest": "sha256:1b20155c8fc5e2c7dd1f75966143449b8c9c8c352a5bc875ae9af5b1d7025014"
    }
  }
}
