      "serverInfo": {
        "name": "natalchart",
        "title": "NatalChart.AI",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Astrology calculations from the Swiss Ephemeris: tropical zodiac, Placidus houses, the five major aspects. Every tool returns numbers as JSON and no interpretation; the reading is yours to write. Birth data is { date: YYYY-MM-DD, time: HH:mm local or null when unknown, latitude, longitude, timezone (IANA, optional) }; find the coordinates of the birth place yourself. Each tool call spends one request of the key's daily pool: 10 on a free account, 100 on the NatalChart.AI Premium plan, no daily limit on MAX. Tools marked \"Premium or MAX\" need one of those plans. Call \"usage\" to see what is left today.",
      "tools": [
        {
          "name": "best_cities",
          "title": "Best cities for a chart",
          "description": "The catalogue of major cities ranked for one chart, overall or by chosen life spheres, worldwide or in one region. (Premium or MAX) Use it when the user asks where in the world to live, work or travel; it ranks major cities, optionally by life sphere or region.",
          "inputSchema": {
            "properties": {
              "birth": {
                "properties": {
                  "date": {
                    "description": "Birth date, YYYY-MM-DD, 1800 to 2399.",
                    "examples": ["1991-09-06"],
                    "format": "date",
                    "type": "string"
                  },
                  "latitude": {
                    "examples": [50.4501],
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "examples": [30.5234],
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "time": {
                    "description": "Local birth time, HH:mm, 24-hour. null when unknown: the chart is computed for noon and everything that depends on the time is withheld.",
                    "examples": ["18:30"],
                    "type": ["string", "null"]
                  },
                  "timezone": {
                    "description": "IANA time zone. Leave it out to resolve it from the coordinates; historical daylight-saving rules are applied to the date.",
                    "examples": ["Europe/Kyiv"],
                    "type": "string"
                  }
                },
                "required": ["date", "latitude", "longitude"],
                "type": "object"
              },
              "focus": {
                "items": {
                  "enum": ["identity", "love", "body", "money", "home", "mind"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "maximum": 12,
                "minimum": 3,
                "type": "integer"
              },
              "region": {
                "enum": ["Europe", "North America", "Latin America", "Middle East & Africa", "Asia", "Oceania"],
                "type": "string"
              }
            },
            "required": ["birth"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best cities for a chart"
          },
          "behavior": {
            "destructive": false,
