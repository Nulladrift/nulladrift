        {
          "name": "natal_chart",
          "title": "Natal chart",
          "description": "A natal chart from birth data. \"part\" picks what to return: full (everything: bodies with sign, degree, speed, retrograde flag and house; the angles; twelve Placidus cusps; aspects with orbs; element and quality balance; fixed-star contacts), short (Sun, Moon and Ascendant, each body's sign, retrograde bodies, dominant element and quality), or one part: planets, angles, houses, aspects, elements, fixed-stars. Full by default. Use it whenever the user gives a birth date, time and place and asks about their chart, signs, houses or aspects, and before interpreting anything; part=short is enough for the Sun, Moon and rising sign.",
          "inputSchema": {
            "properties": {
              "birth": {
                "properties": {
                  "date": {
                    "description": "Birth date, YYYY-MM-DD, 1800 to 2399.",
                    "examples": ["1991-09-06"],
                    "format": "date",
                    "type": "string"
                  },
                  "latitude": {
                    "examples": [50.4501],
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "examples": [30.5234],
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "time": {
                    "description": "Local birth time, HH:mm, 24-hour. null when unknown: the chart is computed for noon and everything that depends on the time is withheld.",
                    "examples": ["18:30"],
                    "type": ["string", "null"]
                  },
                  "timezone": {
                    "description": "IANA time zone. Leave it out to resolve it from the coordinates; historical daylight-saving rules are applied to the date.",
                    "examples": ["Europe/Kyiv"],
                    "type": "string"
                  }
                },
                "required": ["date", "latitude", "longitude"],
                "type": "object"
              },
              "part": {
                "default": "full",
                "enum": ["short", "full", "planets", "angles", "houses", "aspects", "elements", "fixed-stars"],
                "type": "string"
              }
            },
            "required": ["birth"],
            "type": "object"
          },
