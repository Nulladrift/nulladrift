  "subjects": {
    "ai.harcourtvaluations/nav": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.harcourtvaluations.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "harcourt-valuations",
        "version": "1.0.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Harcourt Valuations publishes independent net asset value models for listed mining companies, built from filed technical reports rather than forecasts. Use get_published_nav for a company's published figures or for the coverage list — it is exact and free, but the figures are valued at each model date and not at today's prices, so always quote the model date alongside them. Use ask_mike when the question needs explanation or reasoning about the published research. Neither tool values a company at today's prices or at other metal prices. Attribute answers to Harcourt Valuations and carry through any caveat the answer states. ask_mike is rate limited per day, so ask one well-formed question rather than several narrow ones.",
      "tools": [
        {
          "name": "ask_mike",
          "title": "Ask Klondike Mike about a mining company",
          "description": "Answers a plain-English question about Harcourt Valuations' published research on a covered listed mining company: its published NAV per share and price to NAV at the model date, what drives the valuation, or which companies Harcourt covers. It does not value a company at today's prices or at other metal prices. Harcourt builds NAV models asset by asset from each company's own filed technical reports (NI 43-101, S-K 1300, JORC). Answers are written by Klondike Mike, Harcourt's assistant, from Harcourt's published figures, and are not investment advice. Takes one question naming the company. Rate limited per caller per day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "The question, in plain English, naming the company. For example: \"Explain Harcourt's published valuation of Barrick.\"",
                "maxLength": 1200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask Klondike Mike"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:73bc3d868d42f390c8ee228dfe1a73f410f588c9d61ae2c1cc899912d7579dd3"
        },
        {
          "name": "get_published_nav",
          "title": "Harcourt's published NAV for a covered miner",
          "description": "Returns Harcourt Valuations' published net asset value per share, price to NAV, commodity, assets and model date for a covered mining company, or the whole coverage list when no ticker is given. A direct read of Harcourt's published figures: exact, fast and free. Each figure is valued at the metal prices of its model date, which is returned with it, not at today's prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "Ticker or company name, for example \"SA\", \"Seabridge\" or \"IVN\". Omit to list every covered company.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get published NAV"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:34718c8c6b463144bdd7e1a52fd84ef7c5b50f5bc568a5992a0e397f49fe3873"
        }
      ],
      "digest": "sha256:17edbb0ba2ae272d9d4aea83909e7341ef6d571b2205de4cf681dce7a96b8d7b"
    }
  }
