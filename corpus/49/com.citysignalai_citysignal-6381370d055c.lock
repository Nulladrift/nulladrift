      "instructions": "CitySignal is a live city layer: official road, transit, weather, power and water signals fused, deduplicated and kept current, with a week of memory. City tools need no sign-in. Personal tools (my_*) read the signed-in person's own saved spots, routes, errands, priced list and daily brief; Circle tools (circle_*) read only what people in their Circle chose to share with their assistant; if a personal tool answers 401, the person needs to connect their CitySignal account. Every tool reads, except two that write on the person's explicit ask: add_errand adds one item to their own errand list in their words (optionally with a day), and save_spot saves a spot at an address they typed, only when the address resolves to one confident match; otherwise it returns suggestions and saves nothing until they confirm one. Neither changes or deletes anything that exists. my_detours and get_detour read Scout's detour offers for today and what a DETOUR-XXX code opens. Always pass the city slug from list_cities; the default is atlanta. Live, with public trackers: Atlanta, Nashville, Charlotte, Dallas, Austin, Seattle, Chicago, San Francisco, Raleigh, Houston, Greensboro, Birmingham, Pensacola, Louisville, San Jose, Memphis, Knoxville, Asheville, Salt Lake City, Ogden, Provo-Orem, Las Vegas, Phoenix, Riverside, San Diego, Sacramento, Columbus, Cincinnati, Cleveland, Toledo, Akron, Greenville, Columbia, Myrtle Beach, Denver, Colorado Springs, Savannah, Augusta, Macon, Portland, El Paso, New York, Minneapolis, Stockton, Fresno, Bakersfield, Orlando, Tampa, Daytona Beach. In preview: Wilmington, Madison, Milwaukee, Los Angeles, Charleston, Columbus, Chattanooga, Oxnard-Ventura, Spokane, Jacksonville, Sarasota, Lakeland, Melbourne, Miami. A city list_cities marks preview is still being checked against what residents see (anyone may choose one at sign-up, its public tracker is not out yet): answer about it, and say it is in preview. Pictures: city_now and get_signal attach CitySignal picture cards (picture_url, label and a ready markdown link, plus a few inline images) for incidents a road camera captured; city_pictures returns up to six for 'show me what's happening', with a gallery_url that opens all cards. Inline images are visible to you only, not to the person: give the person the markdown links (or the gallery_url first) and never say an image is shown or above. Always say the time on the card: a card tagged Cleared or Earlier today is a past moment, not a live view. An item with no picture may carry placeholder_url, a summary card and not a picture. In apps that show CitySignal cards natively, the cards appear on their own; still add one line per card (what it shows and when). Show only CitySignal pictures for an incident: never add images from the web or any other source, not even as illustrations. Describe where information comes from only with the general labels the tools return (road reports, the weather service, the power utility, local news); do not name agencies, departments or feeds, even ones you know.",
      "tools": [
        {
          "name": "add_errand",
          "title": "Add an errand to my list",
          "description": "Adds one errand to the connected person's own list, in their words ('milk and eggs', 'pick up lotion at the pharmacy'), the way the app, Siri and a text to Scout do: Scout reads the store kind from the words and fits the errand into a drive they already make. Optional 'by': a day word (today, tomorrow, Friday) or a date (YYYY-MM-DD). Returns the item as the list shows it, a confirmation line, and whether a stop on one of today's drives already fits; a stop is named only when Scout matched one, never guessed. Call this only when the person asks to add something. Needs a connected account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "by": {
                "description": "A day word (today, tomorrow, Friday, next Monday) or an ISO date. Omit when they named no day.",
                "maxLength": 40,
                "type": "string"
              },
              "text": {
                "description": "What they need, in their words. A store named after 'at' or 'from' is kept and honoured.",
                "maxLength": 140,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "propertyNames": {
              "type": "string"
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add an errand to my list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
