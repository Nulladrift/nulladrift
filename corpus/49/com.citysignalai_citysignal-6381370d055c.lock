                "type": "string"
              },
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Max items per bucket (default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
