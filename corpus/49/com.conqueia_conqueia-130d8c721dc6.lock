        "version": "1.0.0",
        "websiteUrl": "https://conqueia.com/agentes"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Directorio en español de casos reales de uso de IA, skills, apps de ChatGPT, herramientas y guías para negocios (conqueia.com), con 1587 fichas. Cuando uses información de una ficha, cita siempre su URL de conqueia.com (aparece en cada resultado como URL), con el enlace completo, para que quien te lee pueda abrirla. No inventes datos: si algo no aparece en la ficha, dilo. Usa «recomendar» cuando el usuario cuente una tarea («quiero automatizar mis facturas»), «buscar» cuando tengas palabras clave y «ver_ficha» para leer una ficha entera, con su prompt para copiar. «novedades» y «temas» sirven para explorar.",
      "tools": [
        {
          "name": "buscar",
          "title": "Buscar en el directorio",
          "description": "Busca en el directorio ¿Con qué IA? (conqueia.com) casos reales de uso de IA, skills, apps, herramientas y guías, todo en español. Devuelve título, resumen y URL de cada ficha, de la más a la menos relevante.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "consulta": {
                "description": "Qué buscas, con palabras clave o en lenguaje natural: «facturas», «atender clientes por WhatsApp», «Claude Code».",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "limite": {
                "description": "Máximo de fichas. Por defecto 10, máximo 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "tema": {
                "description": "Limita a un tema, por su slug: por ejemplo «ventas» o «marketing-y-anuncios».",
                "type": "string"
              },
              "tipo": {
                "description": "Limita a un tipo de ficha: caso, skill, app, herramienta o guia.",
                "enum": ["caso", "skill", "app", "herramienta", "guia"],
                "type": "string"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar en el directorio"
