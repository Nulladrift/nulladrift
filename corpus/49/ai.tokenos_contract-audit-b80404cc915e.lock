      },
      "instructions": "Use when the user pastes smart-contract code or asks whether a contract is safe, has vulnerabilities, or should be audited. Run quick_audit on the full source. Never claim a contract is fully secure — present results as findings to verify, and recommend a professional audit for contracts that will hold funds.",
      "tools": [
        {
          "name": "quick_audit",
          "title": "Quick security scan",
          "description": "Static heuristic scan of a Solidity or Solana (Anchor / Rust) contract: findings with severity, line numbers and fixes, plus a letter grade.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Full contract source (Solidity, Anchor or native Rust)",
                "type": "string"
              },
              "language": {
                "description": "Optional — auto-detected when omitted",
                "enum": ["solidity", "anchor", "rust-solana"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quick security scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/tokenos-audit.html",
            "openai/resultCanProduceWidget": true,
            "openai/toolInvocation/invoked": "Scan complete",
            "openai/toolInvocation/invoking": "Scanning contract",
            "openai/widgetAccessible": false,
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/tokenos-audit.html",
              "visibility": ["model"]
