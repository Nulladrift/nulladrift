          "title": "List companies by type",
          "description": "Visible companies in one segment: government, public, foreign or bonds. חברות גלויות לפי סוג. Same rows as GET /api/v1/companies/by-type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max 100. Default 20.",
