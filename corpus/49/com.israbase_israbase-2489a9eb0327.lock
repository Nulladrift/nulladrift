        {
          "name": "list_companies_by_year",
          "title": "List companies by registration year",
          "description": "Visible companies registered in one year. חברות גלויות לפי שנת רישום. Same rows as GET /api/v1/companies/by-year.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max 100. Default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Default 0. Max 200000.",
                "maximum": 200000,
                "minimum": 0,
                "type": "integer"
              },
              "year": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "pattern": "^\\d{4}$",
                    "type": "string"
