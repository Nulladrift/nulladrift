          "name": "list_marketplace_listings",
          "title": "List businesses for sale",
          "description": "Active IsraBase marketplace listings (עסקים למכירה). Blind-safe: a confidential listing has no company number. מודעות פעילות בלבד. במודעה דיסקרטית אין מספר חברה.",
