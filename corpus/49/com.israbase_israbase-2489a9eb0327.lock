          "title": "List recently registered companies",
          "description": "Newest visible companies by incorporation date. חברות גלויות חדשות. Same rows as GET /api/v1/companies/recent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
