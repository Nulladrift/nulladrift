      },
      "instructions": "Read-only Israeli registry search (companies, nonprofits, partnerships) from IsraBase. חיפוש לקריאה בלבד במאגרי רשם החברות, העמותות והשותפויות. Credit IsraBase and data.gov.il. Nesach orders are links only. This server does not take payment.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get one company",
          "description": "Full registry record for one Israeli company by its 9-digit company number (ח.פ). רשומה מלאה של חברה לפי מספר ח.פ בן 9 ספרות. Includes unlisted companies. Includes the IsraBase page URL and the nesach order URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company_number": {
                "anyOf": [
                  {
                    "pattern": "^\\d{9}$",
                    "type": "string"
                  },
                  {
                    "maximum": 999999999,
                    "minimum": 100000000,
                    "type": "integer"
                  }
                ],
                "description": "9-digit company number, string or integer."
              }
            },
            "required": ["company_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
