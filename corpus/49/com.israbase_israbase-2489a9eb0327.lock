        },
        {
          "name": "search_companies",
          "title": "Search the registry",
          "description": "Search Israeli companies, nonprofits or partnerships by name or number. חיפוש חברות, עמותות או שותפויות לפי שם או מספר. Optional city, status and segment apply to companies. segment matches the HTTP API type query: government, public, foreign or bonds. Default active_only returns visible (publicly listed) rows only. Set active_only to false to include unlisted rows. Direct get_* tools always look up by number, listed or not.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "active_only": {
                "description": "Default true. true keeps visible = 1 (the public listing filter).",
                "type": "boolean"
              },
              "city": {
                "description": "Company city. Hebrew name. Optional.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Max 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name or registration number. שם או מספר.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "segment": {
                "description": "Company segment. Same values as the HTTP type query. Optional.",
                "enum": ["government", "public", "foreign", "bonds"],
                "type": "string"
              },
              "status": {
                "description": "Company status. Hebrew value, exact match. Optional.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Which registry. Default company.",
                "enum": ["company", "nonprofit", "partnership", "all"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
