        {
          "name": "get_status",
          "title": "Stan bazy Pelnory",
          "description": "Świeżość bazy (asOf.prawo: dzień bazy prawa, czyli ostatni udany przebieg prawa albo dzień ostatniej pełnej publikacji, jeśli późniejszy; ostatnia pełna publikacja prawa, pole fullPublication: OK / STALE po 48 h / UNKNOWN; najnowsze orzeczenie per typ sądu), liczby aktów per bramka i orzeczeń per typ sądu. unitTextUncertain: liczba przepisów z tekstem niepewnym (stan TEXT_UNCERTAIN), OK / STALE / PARTIAL (liczba niepełna) / UNKNOWN. coverage: per akt z tekstem coveredFrom (od tego dnia jest tekst; wcześniej NOT_COVERED), versions, currentFrom; ze stan także coveredOnDay (czy akt ma tekst na ten dzień) i ich liczba.",
