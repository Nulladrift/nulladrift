                "description": "przepis: „art. 52 § 1 pkt 3 lit. a” albo ścieżka arti(52)/para(1). Indeks górny numeru: „art. 385^1” albo „art. 385(1)” (także cyfrą w indeksie górnym Unicode), ścieżka arti(385^1); zapis bez znaku indeksu („art. 3851”) oznacza artykuł o takim numerze. Nawias tuż po numerze, bez spacji, to zawsze indeks górny („art. 22(1)” = art. 22^1), nigdy ust. ani §.",
