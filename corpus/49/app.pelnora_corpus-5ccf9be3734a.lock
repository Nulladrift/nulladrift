      "instructions": "Pelnora: polskie prawo (teksty jednolite i rekonstrukcje stanu na dzień, z jawnym stanem i bramką) i orzecznictwo z powiązaniami przepisów z orzeczeniami. Tylko odczyt.\nKażdy wynik niesie pola state, asOf, license i citation (gotowe zdanie do cytowania z atrybucją „Pelnora, pelnora.app”).\nStany NOT_COVERED, UNAPPLIED_SINCE, REPEALED, UNKNOWN, WORDING_CONFLICT, TEXT_UNCERTAIN: nie cytuj jako obowiązującego. FUTURE_PENDING (dzień w przyszłości): tekst bez zmian, które wejdą do tego dnia.\nstateDetails.stale (przy OK, FUTURE_PENDING i TEXT_UNCERTAIN): baza Pelnory może być nieaktualna, bo od ostatniej pełnej aktualizacji (publishedAt) minęło ponad 48 h (hours); zmiany udostępnione w serwisie ELI Sejmu po checkedThrough (kursor zmian ELI, nie data ogłoszenia) mogą nie być uwzględnione. Przekaż komunikat z note i odeślij do ISAP. Stan aktualizacji: pole fullPublication w get_status.\nstateDetails.updateFailed (get_act, get_provision): aktualizacja aktu w bazie Pelnory nie powiodła się od since; tekst może nie uwzględniać zmian ogłoszonych od tego dnia. Przekaż zdanie z note i odeślij do ISAP. Lista wszystkich takich aktów: pole updateFailed w get_status.\nstateDetails.eliTextPending[] (get_act, get_provision): tekst nowelizacji albo nowego tekstu jednolitego (eli, kind, publishedOn) nie jest jeszcze dostępny w serwisie ELI Sejmu. Przy kind novel pokazany tekst nie uwzględnia zmian z tej nowelizacji; przy kind tj tekst jest zbudowany na poprzednim tekście jednolitym. Przekaż zdanie z note; odesłanie do tekstu ogłoszonego w Dzienniku Ustaw (nie do ISAP). Lista wszystkich takich aktów: pole eliTextPending w get_status.\nget_provision przed datą wejścia w życie z odnośnika tekstu jednolitego: entersIntoForce (od tego dnia obowiązuje całe pokazane brzmienie), entersIntoForceNotes[].kind: added (przepis dodany, do daty nie obowiązuje), changed (nowe brzmienie, do daty obowiązuje brzmienie dotychczasowe), partial (wejście w życie w części, zakres w source); subtreeEntersIntoForce (jednostki niższe kontenera). entersIntoForceSentences: gotowe zdania ze strony artykułu, które dotyczą tej jednostki (czas według dnia odczytu; te same co message w /prawo/search); przekaż je użytkownikowi.\nstateDetails.textIncomplete[] (get_provision, przepis albo jego przodek): tekst jest niepełny. Nowela dodała jednostki (addedPaths, addedLabel; change: ADDED), których jeszcze nie ma w tekście; w miejscu wstawienia stoi wiersz „…: zmiana nienaniesiona”. Pokazany tekst nie jest kompletny i nie należy go traktować jako pełnego brzmienia przepisu. Przekaż użytkownikowi zdanie z notice.\naddedNotApplied (get_provision, błąd 404 z nearest): przepisu nie ma w tekście na ten dzień, bo dodała go nowela, której zmiany nie są jeszcze naniesione. Pola jak wpis stateDetails.textIncomplete[] przepisu nadrzędnego (a gdy przepis nadrzędny nie ma tekstu, jak wpis stateDetails.unapplied.amendments[] z change: ADDED): path (przepis nadrzędny, przy którym stoi oznaczenie), addedPaths (wśród nich szukany przepis), addedLabel, eli, publication, actDate, novelKind (nowela), effectiveDate (dzień dodania), notice (zdanie ze strony artykułu). Brak pola niczego nie przesądza: nie potwierdza, że żadna nienaniesiona nowela nie dodała tego przepisu (pola nie ma także przy akcie uchylonym, stanie nieodczytanym, nieustalonym celu zmian, innej nienaniesionej noweli w artykule i dwóch nowelach dodających ten przepis). Stan i zmiany: get_provision przepisu nadrzędnego (gdy pole jest, to addedNotApplied.path).\ntextBasis (get_provision, stan OK): brzmienie według tekstu jednolitego tj, ważne do dnia przed textUntil. W kolejnym tekście jednolitym przepis ma inne brzmienie albo go nie ma, a dzień zmiany nie został ustalony; textUntilNovel (gdy jest) to ustawa, z której dniem wejścia w życie zbiega się textUntil; od textUntil tego tekstu nie ma: wewnątrz odcinka NOT_COVERED, a gdy textUntil to stan kolejnego tekstu jednolitego, już jego brzmienie. Cytuj z tym tekstem jednolitym i przekaż note.\nWORDING_CONFLICT (get_provision): tekst jednolity drukuje kilka brzmień przepisu, a inne niż podawane ma datę, która już minęła (data i jej źródło, bez rozstrzygnięcia, które obowiązuje), albo daty nie ma w źródłach (dateUnknown, bez from, powód w dateNote); bez body, wszystkie brzmienia w wordings[] (from, dateSource, novel tylko przy brzmieniu z datą; served to brzmienie podawane do tej pory, nie wybór). Także przepis niższy (stateDetails.wordingConflict.inherited): kilka brzmień ma przepis nadrzędny, tekst niższego nie jest podawany jako obowiązujący. Ten sam stan ma przepis z brzmieniem wybranym po dacie na dzień przed tą datą albo między różnymi datami z odnośnika i ELI (until, eliDate). Nie wybieraj brzmienia: przekaż stateDetails.wordingConflict.note i odeślij do ISAP (sourceUrl). Przepis nadrzędny: body bez zmian, subtreeWordingConflict[], brzmienia w subtreeWordings[], citation z ostrzeżeniem. gateReason z „brzmienia podwójne (n)”: tyle takich jednostek w akcie (G1/G2 pokazane jako G3, gateRaisedFrom).\nTEXT_UNCERTAIN (get_provision): tekst podany, ale mapa jednostek wskazuje, że może być niepełny albo nie ten: tekst jednolity drukuje pod ścieżką przepisu, przepisu niższego albo nadrzędnego kilka brzmień (pathCollision, subtreePathCollision, inheritedFrom, variants), w numeracji jednostek niższych brakuje pozycji (numberingGaps[] z missingPaths) albo przepis (lub nadrzędny) stoi bezpośrednio przed brakującym numerem i zwykle zawiera jego tekst (gapNeighbor). Ten sam stan ma przepis, którego niezgodność z tekstem jednolitym ustaliła kontrola (stateDetails.textUncertain.textCheck: reason, tj, page, pdfUrl), i przepis nadrzędny takiego przepisu (subtreeTextCheck[] z path). Powody w stateDetails.textUncertain.reasons; citation z ostrzeżeniem. Nie cytuj jako pewnego brzmienia: przekaż stateDetails.textUncertain.note i odeślij do ISAP (przy textCheck: tekst jednolity użyty w kontroli tj, strona page). get_act: textCheckUnits (count, units[] z path, reason, tj, page): przepisy aktu z takim ustaleniem kontroli, zdanie w note. Inne stany ostrzegawcze mają pierwszeństwo (wtedy samo stateDetails.textUncertain). Liczba takich przepisów: pole unitTextUncertain w get_status.\nrepealedWithContainer (get_provision, stan REPEALED, bez body): tekst na ten dzień podaje tylko uchylony nagłówek rozdziału albo działu, bez artykułów; przepis był pod tym nagłówkiem we wcześniejszej wersji. container: nagłówek (label, name) oraz, gdy są w odnośniku tekstu jednolitego, repealedOn, repealedBy (eli, provision), footnote, source: data i akt uchylenia tego nagłówka. stateDetails.unitRepealed: własnej daty uchylenia przepisu nie ma w danych; gdy znany jest container.repealedOn, repealedNotLaterThan podaje ten dzień jako najpóźniejszy możliwy dzień uchylenia przepisu (repealedNotLaterThanSource: container), a bez niego repealedOnUnknown: true. beforeChange: dzień przed uchyleniem nagłówka, gdy tego dnia obowiązuje wersja z tekstem przepisu; lastText: ostatnia wersja sprzed uchylenia nagłówka, z tekstem przepisu. W dniach od uchylenia nagłówka do początku wersji, która to uchylenie uwzględnia, tekst na ten dzień pochodzi z wersji sprzed uchylenia; note podaje wtedy dzień uchylenia nagłówka.\nNO_TEXT: akt znany (tytuł, bramka, sourceUrl), ale jego tekstu w bazie Pelnory nie ma. get_act daje sam stan, get_provision błąd z tym stanem; tekst sprawdź u źródła (sourceUrl).\nOrzeczenia: textStatus withheld / flagged to tekst niepublikowany (tylko metadane i adres źródła); przy withdrawn nie cytuj.\nDUPLICATE_OF (rekord jest kopią tego samego dokumentu z innego źródła): pole primaryId wskazuje rekord główny; cytuj rekord główny (citation już go wskazuje).\ndocumentKind (zawsze obecne; poza odpowiedzią 410 dokumentu wycofanego): ruling = orzeczenie; legal_question (zagadnienie prawne), request (wniosek o podjęcie uchwały), unknown (dokument z listy zagadnień SN, rodzaj nieustalony) NIE są orzeczeniami: nie cytuj ich jako wyroku ani uchwały.\nSTALE; computedAt=… (nagłówek x-corpus-state): dane prekomputowane (pokrycie, liczności) nieświeże, podane z datą przeliczenia. To inne znaczenie niż fullPublication.state STALE w get_status i stateDetails.stale, które dotyczą pełnej aktualizacji prawa.\nCzas (stan prawny na dzień): parametr stan = RRRR-MM-DD. W get_act i get_provision bez stan: dziś w strefie Europe/Warsaw. W list_acts, get_status i rulings_for_provision bez stan: bez filtra dnia. Wersja tekstu obowiązuje w przedziale półotwartym [validFrom, validTo): dzień validTo należy już do następnej wersji. Wersje powstają według dat wejścia w życie zmian (od stanu najnowszego tekstu jednolitego), nie według dat publikacji w bazie. Dzień przed pierwszą wersją aktu (coveredFrom) daje stan NOT_COVERED bez tekstu, nigdy cichy zamiennik tekstem z innego dnia; od kiedy akt ma tekst: get_status (coverage) albo get_timeline. Skutek wsteczny („z mocą od”) i data stosowania („stosuje się od”) nie są modelowane: wersja ma flagę applicationFlags w provenance (get_timeline), a dzień w przedziale mocy wstecznej późniejszej noweli także notę: w get_timeline zawsze retroactive[] przy wersji, w get_act i get_provision stateDetails.retroactive[], gdy klauzula może dotyczyć tego tekstu.\nstateDetails.retroactive[] (get_act, get_provision): dzień leży w [from, entry) późniejszej noweli eli z klauzulą „z mocą od” (clause, zakres w noweli: scope), a klauzula może dotyczyć tego tekstu. Tekst i stan bez zmian. reach: covers (klauzula wymienia przepisy noweli zmieniające ten akt, w get_provision: ten przepis), unknown (nie ustalono). Gdy klauzula na pewno wymienia inne przepisy noweli (elsewhere), noty tu nie ma; zostaje w get_timeline (versions[].retroactive[]). unit (get_provision): target (instrukcja noweli dotyczy tego przepisu albo jego części), other (według danych o zmianach w bazie Pelnory nie dotyczy), unknown (nie ustalono; także instrukcja zapisana przy przepisie nadrzędnym). textLacksNovel: false oznacza, że baza wersji może już zawierać część noweli. Przekaż zdanie z note; nie wnioskuj o skutku wstecznym przy unknown ani unit other.\nBłąd przejściowy bazy danych: wynik z isError, _meta.status 503 i _meta.retryAfter (sekundy), w treści error z komunikatem o ponowieniu. Ponów to samo wywołanie po retryAfter sekundach; taki błąd nie mówi nic o przepisie ani orzeczeniu.\nOpis: https://corpus.pelnora.app/llms.txt. Licencja: https://corpus.pelnora.app/license",
      "tools": [
        {
          "name": "get_act",
          "title": "Stan aktu na dzień",
          "description": "Stan aktu: bramka zaufania, stan tekstu na dzień (state), wersja, pochodzenie (TJ / rekonstrukcja, nowele), tytuł, citation. Bez pełnego tekstu; przepisy: get_provision.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "eli": {
                "description": "ELI aktu: DU/1974/141 albo DU-1974-141 (Kodeks pracy)",
                "pattern": "^[Dd][Uu][-/]\\d{4}[-/]\\d{1,5}$",
                "type": "string"
              },
              "stan": {
                "description": "dzień stanu tekstu RRRR-MM-DD (domyślnie dziś)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["eli"],
            "type": "object"
