          "description": "Oś czasu aktu: daty (ogłoszenie, wejście w życie, uchylenie, wygaśnięcie), teksty jednolite z datą stanu, wersje tekstu [validFrom, validTo) z pochodzeniem (TJ / rekonstrukcja, nowele zastosowane, flagi „z mocą od” / „stosuje się od”), odcinki zamknięte z liczbą jednostek bez tekstu, nowelizacje z datami wejścia w życie transz. Lista tych jednostek tylko z details = units. Tekst wersji: get_act / get_provision z stan = validFrom.",
