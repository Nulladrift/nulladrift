      "instructions": "Pelnora: polskie prawo (teksty jednolite i rekonstrukcje stanu na dzień, z jawnym stanem i bramką zaufania G1–G3) i orzecznictwo z powiązaniami przepisów z orzeczeniami. Serwer tylko do odczytu.\nstate: stan tekstu na dzień. OK: tekst obowiązujący. FUTURE_PENDING: dzień w przyszłości, tekst bez zmian, które wejdą w życie do tego dnia. NOT_COVERED, UNAPPLIED_SINCE, REPEALED, UNKNOWN, WORDING_CONFLICT, TEXT_UNCERTAIN: stany ostrzegawcze. NO_TEXT: akt znany, ale bez tekstu w bazie Pelnory.\ncitable: true, gdy tekst przepisu można podać jako obowiązujący na dzień stanu albo gdy wynik jest orzeczeniem z tekstem. false: przy stanach ostrzegawczych i NO_TEXT, przy zdaniu citation z ostrzeżeniem, przy textStatus withheld, flagged i withdrawn oraz przy documentKind innym niż ruling.\nuserNotice: zdania dla użytkownika z pól wyniku, dosłownie (note i notice ze stateDetails, entersIntoForceSentences, textBasis.note, addedNotApplied.notice). Brak pola: brak takich zdań.\nofficialSource: {name, url}, źródło urzędowe tekstu dla tej sytuacji: ISAP albo Dziennik Ustaw (tekst nowelizacji jeszcze niedostępny w serwisie ELI Sejmu); brak pola: brak adresu w danych.\ntextComplete (get_provision z tekstem): false, gdy tekst jest niepełny (stateDetails.textIncomplete[], jednostki niższe bez tekstu, tekst ucięty) albo niepewny (TEXT_UNCERTAIN).\ncitation: gotowe zdanie do cytowania z atrybucją „Pelnora, pelnora.app”; przy duplikacie (primaryId) zdanie rekordu głównego.\nstan: parametr RRRR-MM-DD, dzień stanu prawnego. Bez niego get_act i get_provision podają stan na dziś w strefie Europe/Warsaw, a list_acts, get_status i rulings_for_provision działają bez filtra dnia.\nasOf: data stanu danych, z których pochodzi wynik (w get_status asOf.prawo: dzień bazy prawa).\nWersja tekstu obowiązuje w przedziale półotwartym [validFrom, validTo): dzień validTo należy już do następnej wersji.\n_meta.retryAfter (błąd przejściowy 503): po ilu sekundach ponowienie wywołania ma sens; taki błąd nie mówi nic o przepisie ani orzeczeniu.\nSłownik pól i stanów: https://corpus.pelnora.app/mcp-fields.md. Opis API: https://corpus.pelnora.app/llms.txt. Licencja: https://corpus.pelnora.app/license",
      "tools": [
        {
          "name": "get_act",
          "title": "Stan aktu na dzień",
          "description": "Stan aktu: bramka zaufania, stan tekstu na dzień (state), wersja, pochodzenie (TJ / rekonstrukcja, nowele), tytuł, citation. Bez pełnego tekstu; przepisy: get_provision.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "eli": {
                "description": "ELI aktu: DU/1974/141 albo DU-1974-141 (Kodeks pracy)",
                "pattern": "^[Dd][Uu][-/]\\d{4}[-/]\\d{1,5}$",
                "type": "string"
              },
              "stan": {
                "description": "dzień stanu tekstu RRRR-MM-DD (domyślnie dziś)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["eli"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stan aktu na dzień"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e31adafaba593d8ecb5615d0917f648a603db375f1dfc1b40b3265cc25f063f"
        },
        {
          "name": "get_provision",
          "title": "Przepis (artykuł, paragraf, ustęp…)",
          "description": "Przepis na dzień ze stanem i zdaniem do cytowania: treść w `body` (bez oznaczenia), oznaczenie w `unitLabel` („art. 52 § 1”). Przepis jako „art. 52 § 1” albo ścieżka arti(52)/para(1); indeks górny numeru: „art. 385^1” albo „art. 385(1)”. Stan WORDING_CONFLICT: bez `body`, wszystkie brzmienia w `wordings`. Stan TEXT_UNCERTAIN: `body` podane, ale może być niepełne albo nie tym brzmieniem (kilka brzmień pod ścieżką albo luka w numeracji; powody w `stateDetails.textUncertain`). Nieistniejący przepis: błąd z listą najbliższych jednostek (nearest); przepis dodany nowelą, której zmiany nie są jeszcze naniesione: ten sam błąd z polem `addedNotApplied`. Gdy artykułu o podanym numerze nie ma, a jest artykuł, którego numer z indeksem górnym składa się z tych samych cyfr (zamiast „art. 3851” art. 385^1), nearest zaczyna się od niego: to podpowiedź, nie odpowiedź o tym przepisie.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "eli": {
                "description": "ELI aktu: DU/1974/141 albo DU-1974-141 (Kodeks pracy)",
                "pattern": "^[Dd][Uu][-/]\\d{4}[-/]\\d{1,5}$",
                "type": "string"
              },
              "stan": {
                "description": "dzień stanu tekstu RRRR-MM-DD (domyślnie dziś)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "unit": {
                "description": "przepis: „art. 52 § 1 pkt 3 lit. a” albo ścieżka arti(52)/para(1). Indeks górny numeru: „art. 385^1” albo „art. 385(1)” (także cyfrą w indeksie górnym Unicode), ścieżka arti(385^1); zapis bez znaku indeksu („art. 3851”) oznacza artykuł o takim numerze. Nawias tuż po numerze, bez spacji, to zawsze indeks górny („art. 22(1)” = art. 22^1), nigdy ust. ani §.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["eli", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
