        {
          "name": "list_acts",
          "title": "Wyszukiwanie aktów z tekstem",
          "description": "Szuka aktów z tekstem w bazie Pelnory (bramki G1–G3) po fragmencie tytułu albo ELI; wielkość liter bez znaczenia (także polskie litery), bez odmiany wyrazów. Bez query: wszystkie (strony po 50, nextCursor). Ze stan: tylko akty, które mają tekst na ten dzień (wersja z validFrom ≤ stan < validTo), z coveredFrom; akt przed pokryciem nie jest na liście, akt uchylony przed tym dniem jest poza listą albo ma stan REPEALED. Licznik otherDocuments w rulings_for_provision liczy bez filtra stan.",
          "inputSchema": {
