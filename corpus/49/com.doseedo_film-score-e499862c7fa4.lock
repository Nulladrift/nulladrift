        {
          "name": "doseedo_recipes",
          "title": "Recipes (named pipelines)",
          "description": "The named pipelines people actually ask for — stems, session (mix → DAW project), cover, transcribe, generate, render-midi (your notes played by an instrument model), custom-instrument (train your own from a recording), timbre-transfer (your notes, a recording's tone), sound-design (SFX / foley / one-shots), analyze-song (key/tempo/sections/chords), convert, bounce, and the compose-part guide (a part in the session's key at its tempo: analyze → you write the MIDI → place or render it) — each with its inputs, the tool calls in order, outputs, a credit/time estimate and how to VERIFY success from the response. Call with no name for the index (pick by use_when), or with a name for the full recipe. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "A recipe name or alias, e.g. \"session\" / \"stems-to-session\". Omit to list all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
