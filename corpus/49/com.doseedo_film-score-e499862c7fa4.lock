        {
          "name": "doseedo_instruments",
          "title": "Instrument catalog (the sound palette)",
          "description": "The instrument list — the sound palette: every instrument doseedo can PLAY YOUR NOTES on (doseedo_render_midi) — orchestral strings, brass and winds, guitars, basses, keys, drums and percussion, and World instruments (koto, sitar, banjo, pedal steel, tabla, congas…). Each entry gives the EXACT render call (`call`: instrument, plus timbre_preset where one is needed — a koto is the acoustic_guitar model with the koto timbre), its playable range in concert MIDI pitch, whether it plays chords, its presets (pizz, muted, sax registers…) and a demo render. No args → the whole catalog; query:\"warm low brass\" / family / culture:\"India\" (a culture's own instruments: \"Indian\", \"Japanese\", \"Celtic\", \"Latin America\"…) / pitches:[…] (instruments whose range holds them) / chords:true narrow it; id:\"cello\" → one instrument in full. Read-only, free, no key needed — read it before writing a part.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chords": {
                "description": "true = only instruments one player can play chords on.",
                "type": "boolean"
              },
              "culture": {
                "description": "Only the instruments that are this culture's own sound — a culture (\"India\", \"Japan\", \"Middle East\", \"Celtic\", \"Cuba\", \"Mexico\", \"Brazil\", \"Americana\"…), a word for one (\"Indian\", \"Carnatic\", \"Irish\") or a region (\"South Asia\", \"Latin America\", \"Europe\"). The whole listing names every culture.",
                "type": "string"
              },
              "family": {
                "description": "Only this family.",
                "enum": ["strings", "brass", "winds", "piano", "guitar", "bass", "drums", "world", "pitched_percussion", "unpitched_percussion", "synth"],
                "type": "string"
              },
              "id": {
                "description": "One instrument (id, alias or label, e.g. \"cello\", \"upright bass\", \"koto\") → its full entry: every preset with its own call and range, transposition, aliases, demo, page.",
                "type": "string"
              },
              "pitches": {
                "description": "MIDI pitches the part uses (concert, 60 = C4) — only instruments whose range holds every one.",
