              "name": {
                "description": "Optional: a name for this job's files, e.g. \"rainy-loop-3\". Every file it returns downloads as <name>_<part>.<ext> (rainy-loop-3_Celesta.wav, rainy-loop-3_rough-mix.wav; one take: rainy-loop-3.wav), so the user can find them. Give each job its own name (a second take: \"rainy-loop-3b\"). Default: doseedo-<last 6 characters of the job id>.",
                "maxLength": 80,
                "type": "string"
              },
              "video_key": {
                "description": "R2 ingest key of the film (the same upload doseedo_spot_video read; starts with \"ingest/\").",
                "type": "string"
              },
              "video_url": {
                "description": "https URL of the film, as an alternative to video_key (fetched through the URL up to 256 MB; upload a bigger film).",
                "type": "string"
              }
