      "serverInfo": {
        "name": "doseedo-film-score",
        "title": "Doseedo Film Score: spot a video, play your score on AI instruments, mix it to picture",
        "version": "0.22.0",
        "description": "Score video as an agent: cue sheet from the cut, 100+ AI instruments play your MIDI, mix to picture",
        "websiteUrl": "https://doseedo.com/guides/score-a-film-with-an-ai-agent"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "doseedo film-score = SCORE A VIDEO AS AN AGENT: doseedo watches the film, YOU write the music, doseedo plays it on 100+ real instruments and lays it on the picture. THE LOOP: 1) doseedo_get_upload_url {filename:\"film.mp4\"} → curl PUT the file → video_key. 2) doseedo_spot_video {video_key} → job_id → doseedo_wait_task → the cue sheet: every cut frame-exact, SCENES (where the picture moves to a new place, cut or no cut: start, pace, a 640-px frame — LOOK at each: where, when, what culture; change the music ON its start), a storyboard (the whole film on one JPEG) and each shot with a keyframe JPEG (it sees light, motion and editing, not story), the dialogue spans, and cues 1M1, 1M2 … with SMPTE start/end, emotion, energy, hit points and a suggested bpm. 3) Per cue: doseedo_tempo_map {…cue.tempo_map_input} → tempo_map + the beat each hit lands on (beat 0 = the cue's first frame). 4) WRITE every part as notes on that grid [{pitch, start_beats, duration_beats, velocity}] — accents on the hit beats, thinner under dialogue; instruments from doseedo_instruments (copy an entry's call; ranges in concert pitch; a section is ONE part with players: N). 5) doseedo_render_score {parts, tempo_map} → a stem per part with a fit receipt. 6) doseedo_mix {from_job} → the cue mixed (seated, a hall, the written dynamics as the balance) + its mixgraph. 7) doseedo_score_to_picture {video_key, tracks:[{audio_url: <mix_url>, start_timecode: <the cue's>, name:\"1M1\"}…]} → the scored film (picture untouched), printmaster and M&E, with what it MEASURED: where each cue landed, the music under the lines in dB, the final LUFS and true peak. 8) Optional: doseedo_session_from_stems {from_job, mix_job} → a Logic / Ableton / REAPER project per cue, or with target: \"premiere\" | \"finalcut\" | \"resolve\" a video editor's project (the film on V1, every stem a clip, a marker per cue). A FILM WITH MUSIC ALREADY ON IT: doseedo_split_soundtrack {video_key} → its dialogue / music / effects stems + where the music plays. Keeping the production audio would mix the old music under yours. REPLACE: lay stems.dialogue + stems.effects (start_s 0, role \"dialogue\" / \"effects\") with your cues and production_audio:\"drop\". REMIX / RE-ORCHESTRATE: stems.music → doseedo_analyze_song (key, tempo, chords) / doseedo_separate_stems / doseedo_transcribe (its notes) → write it for your players. KEEP and score around it: write cues only where soundtrack.stems.music.spans shows none, or lay stems.music back with duck:false. RULES: (1) There is no prompt-to-score — you write the notes, doseedo performs them. (2) An AI render may miss a note: read each part's fit receipt and re-render a failed part (doseedo_render_midi revise_take_url redoes one region). (3) Async tools return job_id → doseedo_wait_task {job_id} (≤ 50 s a call; call again while still_running). (4) Result URLs are pre-signed for 24 h: plain curl, and pass one as another tool's audio_url as is. A job's name (\"main-title-cue\") names its files: <name>_<part>.<ext>. (5) Errors carry code / retryable / next — act on next; service_unavailable = wait 30 s, retry ONCE, then tell the user. (6) doseedo_quote prices a call before you make it: spotting and delivery spend no credits (a daily fair-use cap), rendering spends credits. SOUND DESIGN: doseedo_generate_sound {prompt, kind:\"hit\"} — impacts, whooshes, risers — laid with role:\"sfx\". YOUR OWN SOUND: doseedo_train_instrument (30 s–3 min of one instrument → lora_id). The steps with cost, time and how to verify: doseedo_recipes {name:\"score-a-film\"}.",
