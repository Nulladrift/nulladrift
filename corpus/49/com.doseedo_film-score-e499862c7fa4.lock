                    },
                    "instrument": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["audio_url", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "style": {
                "description": "A mix style: an id or words (\"dry 90s rock\"). Pick it for the picture — the default (film-orchestral, a 2.3 s scoring hall) suits film drama, not every orchestra: film-orchestral-sections = the same hall, the strings and winds seated wider, a fader per section (buses[].fader_db); cartoon-studio = a cartoon / animation orchestra (a close, dry, wide scoring stage, punchy rides); golden-age-cartoon = a 1940s–50s cartoon (mono, small studio, tape); film-scoring-stage = intimate TV / documentary; concert-hall; film-epic-hybrid = trailer / action; cathedral-choral; classical-chamber; 2020s-tech-ad = a tech / product / brand film (sleek modern electronic, matched to official tech ads); or jazz-combo (a small jazz band), big-band (a big band, seated in sections), ambient, 1970s-analog-rock, 2020s-pop …",
                "type": "string"
              },
              "target_lufs": {
                "description": "Master loudness, -24..-6 LUFS (default: the style's — -18 for film-orchestral, -14 for the blind default). Met within ~0.3 LU (a loud target clips the shortest transients first); output.loudness says what landed, and why when short. With mix_job it re-masters the stored mix.",
