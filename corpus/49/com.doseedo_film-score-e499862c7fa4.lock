                      "type": "number"
                    },
                    "velocity": {
                      "type": "number"
                    }
                  },
                  "required": ["duration_beats", "pitch", "start_beats"],
                  "type": "object"
                },
                "type": "array"
              },
              "time_signature": {
                "description": "Meter of the notes, e.g. \"4/4\" (default).",
                "type": "string"
              }
            },
            "type": "object"
          },
