        },
        {
          "name": "doseedo_supervise_cues",
          "title": "Cut cues from public-domain scores",
          "description": "MUSIC SUPERVISION, for a film whose direction is classical or orchestral: instead of writing every note, each cue is CUT FROM A REAL PUBLIC-DOMAIN SCORE (~1,000 orchestral pieces, Baroque to late Romantic, free to use in a film — no rights holds, no ShareAlike). The search fits each cue: its length to the frame (a passage bent ≤ ~17 % in tempo, cut on a bar line where it must), the cue sheet's turns on the score's own section changes, its hits on real accents, its mode and meter, its level over time (a quiet cue thins a tutti's doublings; the loudest moment lands on the source's own rise), and cues of one piece play fresh bars. SAY WHO PLAYS AND HOW BUSY IT IS, or a quiet piano-and-strings cue is cut from a tutti: instruments = the cue's players (the source plays only its parts for those); density = sparse | moderate | busy | driving, or notes a second; per film, or per_cue. Input: spot_job (the doseedo_spot_video job id — spotter \"model\" gives each second its level) or cue_sheet; cues (ids, default every score cue); direction {era: [\"Baroque\"|\"Classical\"|\"Romantic\"…], genre, composer: [\"Antonín Dvořák\"…], mode: major|minor}; prefer {cue: file} = take that cue from an alternative an earlier answer listed. Async: job_id → doseedo_wait_task (~5–60 s; a bad direction, cue or prefer fails at once), CPU, no credits. Result per cue: source {composer, title, licence, credit — the line a CC BY edition asks for}, edit (bars, stretch, cuts), render {score_url, instruments, name} = the doseedo_render_score call that plays it (pass it as is; change an instrument by editing instruments), mix_lufs_offset_db (master the cue at the delivery loudness plus this: doseedo_mix target_lufs), alternatives [{composer, title, file, cost}]. Cancel: the plane has no stop for a running catalogue search — it runs to completion (credits spent), the job ends as canceled and its output is discarded. Only a job still queued at the plane is refunded by the plane's own failure refund.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cue_sheet": {
                "description": "Alternative to spot_job: a cue sheet {video: {duration}, cues: [{id, kind?: \"score\", start_s, end_s, suggested_bpm?, turns?: [{time_s}], hits?: [{time_s}], dynamics?: [{at_s, mark}], instruments?: [names], density?}], cue_model?: {level_db_per_s}} — doseedo_spot_video's, or your own cue plan in its shape.",
                "type": "object"
              },
              "cues": {
                "description": "Only these cue ids (default: every score cue, ≤ 40).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "density": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "enum": ["sparse", "moderate", "busy", "driving"],
                    "type": "string"
                  }
                ],
