        {
          "name": "doseedo_wait_task",
          "title": "Wait for a job",
          "description": "Wait for an async doseedo job to finish: polls server-side for up to timeout_seconds (5–50; one call can never hold longer than 50 s), then returns the result or the latest status. If it returns still_running:true, call it again — a submit reply's eta_seconds says how long the whole job usually takes (transcribe ~15 s, a render 1–3 min, audio_to_session ~4 min), so a 3-minute job is three or four calls, not one. A finished job answers with its output, artifacts (pre-signed links) and note.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Alternatively the job_id (job_…) from a submit tool or the jobs API — replaces task_id + kind.",
                "type": "string"
              },
              "kind": {
                "description": "Which job kind created the task — the registry name the submit reply carried (generate_music, generate_sound, generate_loop, cover_stem, fill_gap, render_midi, train_instrument, render_score, mix, mix_preset, session_from_stems, spot_video, score_to_picture, reframe_video, cover_song, separate_stems, split_soundtrack, transcribe, audio_to_session, convert_project, bounce_session, analyze_song, detect_chords, beat_grid, identify_sound, check_take, analyze_midi, supervise_cues); the short codes (generate, sound, loop, coverstem, fillgap, render, train, score, mixpre, stemsess, spot, picture, reframe, cover, separate, soundtrack, session, convert, bounce, analyze, chords, beats, identify, check, harmony, supervise) are accepted aliases.",
                "enum": ["generate_music", "generate_sound", "generate_loop", "cover_stem", "fill_gap", "render_midi", "train_instrument", "render_score", "mix", "mix_preset", "session_from_stems", "spot_video", "score_to_picture", "reframe_video", "cover_song", "separate_stems", "split_soundtrack", "transcribe", "audio_to_session", "convert_project", "bounce_session", "analyze_song", "detect_chords", "beat_grid", "identify_sound", "check_take", "analyze_midi", "supervise_cues", "generate", "sound", "loop", "coverstem", "fillgap", "render", "train", "score", "mixpre", "stemsess", "spot", "picture", "reframe", "cover", "separate", "soundtrack", "session", "convert", "bounce", "analyze", "chords", "beats", "identify", "check", "harmony", "supervise"],
