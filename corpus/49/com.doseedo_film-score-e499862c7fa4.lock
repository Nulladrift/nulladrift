        {
          "name": "doseedo_analyze_midi",
          "title": "Analyze MIDI harmony",
          "description": "Check the HARMONY of notes before rendering or placing them: factor a MIDI progression into its sonorities (mode \"midi\", default — chord-detection-free: each segment of simultaneously sounding pitches reduced to an anchor pitch class + register-exact shape, covered with recurring shape cells) or into chord symbols (mode \"chord\": one estimated chord per ~2 beats + a corpus-grammar cell cover with a schedule). Input: notes[] (the rows you would give doseedo_render_midi / set_midi_notes) with bpm, or midi_url (a .mid ≤2 MiB: a doseedo result link such as a stem's MIDI, or a public URL). Synchronous (~2–10 s), CPU, no credits. Returns sonorities[] or chords[], cover, cells, compression — read chords[].chord / sonorities[].anchor to confirm the key and progression you intended. Cancel: not applicable — the result is returned in the submit response; the job is already finished.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "beats_per_segment": {
                "description": "mode chord: segment length in beats (0.25–8, default 2).",
                "type": "number"
              },
              "bpm": {
                "description": "Tempo of the notes (needed with notes; default 120).",
                "type": "number"
              },
              "idempotency_key": {
                "description": "Optional. Any unique string for THIS request (e.g. a UUID). Re-sending the same call with the same key after a timeout returns the same job instead of starting a second one.",
                "type": "string"
              },
              "midi_url": {
                "description": "Alternative to notes: https URL of a Standard MIDI File (≤2 MiB).",
                "type": "string"
              },
              "min_seg_beats": {
                "description": "mode midi: shortest sonority segment in beats (default 0.25).",
                "type": "number"
              },
              "mode": {
                "description": "\"midi\" (default): sonority / shape factoring. \"chord\": chord symbols per segment + cell cover.",
                "enum": ["midi", "chord"],
                "type": "string"
              },
              "notes": {
                "description": "The notes to analyze, in beats from bar 1 (same rows as doseedo_render_midi). Needs bpm.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "duration_beats": {
                      "type": "number"
                    },
                    "pitch": {
                      "type": "number"
                    },
