        },
        {
          "name": "doseedo_train_instrument",
          "title": "Train a custom instrument",
          "description": "Make a CUSTOM INSTRUMENT in your own sound: upload 30 s–3 min of ONE instrument playing (your own player, a rare or folk instrument, a prepared/invented instrument, a vintage synth) and doseedo trains a private adapter (LoRA) on its serving instrument model in about 1–2 minutes. After that, doseedo_render_midi {instrument: <the same instrument>, lora_id} plays ANY notes you write in that sound. Several takes help (up to 8 files; the first 3 min are used, ≥8 s required); a clean, solo, dry recording works best. instrument = the closest catalog instrument — it picks the model voice the adapter trains on (a shamisen trains as acoustic_guitar, a whistle as flute: doseedo_instruments lists each one's call.instrument). The notes are transcribed for you (pass notes to skip that). 20 credits. Result: lora_id, name, the windows it trained on, loss first→last, and `use` (the render args). Earlier ones: doseedo_list_jobs {kind:\"train_instrument\"}. Owner-only: no one else can render with it. Async: job_id → doseedo_wait_task (~1–2 min). Cancel: the plane has no stop for a running training — it runs to completion (credits spent), the job ends as canceled and its output is discarded. Only a job still queued at the plane is refunded by the plane's own failure refund.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_key": {
                "description": "R2 ingest key of an uploaded audio file (from doseedo_get_upload_url / POST /api/upload/r2/ingest-url; starts with \"ingest/\"). One recording; or audio_keys for several.",
                "type": "string"
              },
              "audio_keys": {
                "description": "Several uploaded takes of the SAME instrument (≤8).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "audio_url": {
                "description": "https URL of a recording (a doseedo result link — a separated stem works — or any public URL). Alternative to audio_key.",
                "type": "string"
              },
              "audio_urls": {
                "description": "Several recording URLs of the same instrument (≤8).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bpm": {
                "description": "Optional tempo of the recording (30–300).",
                "type": "number"
              },
              "drum_mode": {
                "description": "true for an unpitched percussion recording.",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "Optional. Any unique string for THIS request (e.g. a UUID). Re-sending the same call with the same key after a timeout returns the same job instead of starting a second one.",
                "type": "string"
              },
              "instrument": {
                "description": "REQUIRED. The catalog instrument it is closest to (call.instrument from doseedo_instruments, e.g. \"violin\", \"acoustic_guitar\", \"flute\", \"percussion\").",
                "type": "string"
              },
              "name": {
                "description": "A name for it, e.g. \"Grandpa's banjo\" (≤80 chars).",
                "type": "string"
              },
              "notes": {
                "description": "Optional: the notes played, one list per file — [[{pitch, start, end, velocity?}…]] in SECONDS. Omitted, they are transcribed.",
                "type": "array"
              },
              "seed": {
                "description": "Random seed.",
                "type": "number"
              },
              "steps": {
                "description": "Training steps 50–800. Default 300 for ≤60 s of audio, 400 above.",
                "type": "number"
              }
            },
            "required": ["instrument"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
