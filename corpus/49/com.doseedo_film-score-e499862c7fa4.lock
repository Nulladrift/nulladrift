                  {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                ],
                "description": "An orchestra's room: \"studio\" (intimate scoring stage, ~1.2 s, close), \"stage\" (~1.8 s), \"hall\" (the default scoring hall, ~2.3 s), \"cathedral\" (~4 s, wet) — or 0..1 between them. Sets the decay, size and how wet every seat sits."
              },
              "stems": {
                "description": "[{name, audio_url, instrument?}] — the stems (≤ 32). instrument = the sound it plays (a doseedo_instruments id: \"violin\", \"timpani\", \"harp\"), which decides how it is mixed; without it the name decides.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "audio_url": {
