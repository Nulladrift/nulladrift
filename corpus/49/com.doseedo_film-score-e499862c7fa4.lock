        {
          "name": "doseedo_mix",
          "title": "Mix and master stems",
          "description": "MIXING and MASTERING: each part levelled, panned, high-passed, given its depth on a shared reverb, mastered to a loudness target — a WAV AND `mixgraph`, the mix as a document. After doseedo_render_score pass from_job (its parts and the instruments they play are the stems); or stems: [{name, audio_url, instrument?}]. An orchestra (strings / winds / brass / timpani / harp…) is SEATED by default (film-orchestral: violins left, low strings right, brass behind, each seat at its depth in a 2.3 s hall, written dynamics riding the faders); others mixed blind. style: film-orchestral, film-orchestral-sections, film-scoring-stage, concert-hall, film-epic-hybrid, cathedral-choral, classical-chamber, cartoon-studio, golden-age-cartoon, jazz-combo, jazz-strings, big-band, ambient, country-pop, metal-modern, 1950s-mono, 1960s-lcr-pop, 1970s-analog-rock, 1970s-dub, 1980s-pop-gated, 1990s-rock-dry, 1990s-hiphop, lofi-hiphop, 2000s-loudness-rock, 2010s-edm, 2010s-trap, 2020s-pop, 2020s-hyperpop, 2020s-tech-ad (id or words). guitar_tone = guitar sound. balance {part: dB} moves parts on top of the levelling (+3 = a melody forward). Change the mix: edit the returned mixgraph — strips[] {stem, gain_db, pan, seat, chain, sends}, buses[] (verb = the hall; a section's fader_db = its level), master.chain, automation [{target: \"strips.<stem>.gain_db\", points: [[seconds, dB]…]}] for rides (dB off the strip's gain_db: 0 = as set, -60 mutes) — and call again with mix_job (this job_id) + only your edits (or the whole mixgraph + the same stems): rendered as written, rails reported, no credits. Then doseedo_session_from_stems {from_job, mix_job: <this job_id>} → the DAW project at this mix's levels and pans. TO PICTURE: dialogue (the VO; the music ducks under it), music_offset_s (bar 1 on the picture), length_s (cut + end fade). Async: job_id → doseedo_wait_task (~15–90 s). Cancel: the plane has no stop for a running mix — it runs to completion (credits spent), the job ends as canceled and its output is discarded. Only a job still queued at the plane is refunded by the plane's own failure refund.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balance": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "{part name: dB in -12..12} — your balance on top of the levelling (and of the written dynamics a from_job reads).",
                "type": "object"
              },
              "bpm": {
                "description": "The music's tempo: a guitar tone's echoes (an eighth, a dotted eighth) land on it. from_job fills it.",
                "maximum": 400,
                "minimum": 20,
                "type": "number"
              },
              "dialogue": {
                "description": "The VO / dialogue on the picture's timeline (≤ 4): [{name?, audio_url}]. The music ducks under each line until the voice sits duck.vo_over_db over it, with a 1–4 kHz carve while it talks; the voice joins after the music's master chain. Report: output.dialogue.lines [{start_s, end_s, duck_db, vo_over_music_db}] as mixed.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "audio_url": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["audio_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "duck": {
                "additionalProperties": false,
                "description": "How the music sits under the dialogue: {vo_over_db (default 7 dB — a broadcast mix's 6–10), carve_db (default 3, at 1–4 kHz), max_db (default 12), include (default true; false = the music bed alone, ducked as if the voice played)}.",
                "properties": {
                  "carve_db": {
                    "type": "number"
                  },
                  "include": {
                    "type": "boolean"
                  },
                  "max_db": {
                    "type": "number"
                  },
                  "vo_over_db": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "dynamics": {
                "additionalProperties": {
                  "type": "array"
                },
                "description": "Fader rides from written dynamics: {part name: [[onset_seconds, velocity 0-127], …]}. from_job fills it from the score (pp to ff ≈ 17 dB); pass {} for no rides.",
                "type": "object"
              },
              "dynamics_carried": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "{part name: top velocity} — parts whose stems already play their written level (a render part's dynamics_level receipt, up to its top_vel). Their rides count it: no doubled swing. from_job fills it.",
                "type": "object"
              },
              "dynamics_ride": {
                "description": "How hard the written dynamics move the faders: 1 = default (pp to ff ≈ 17 dB), 0 = no rides, up to 1.5.",
                "type": "number"
              },
              "end_fade_s": {
                "description": "With length_s: the fade at the program's end (0–10 s, default 0.5).",
                "type": "number"
              },
              "from_job": {
                "description": "MCP: a doseedo_render_score job_id — its parts are the stems, each with the instrument it plays, and each part's written dynamics (its mean velocity) set its balance.",
                "type": "string"
              },
              "from_jobs": {
                "description": "MCP: ONE cue rendered as several doseedo_render_score jobs (its parts split across renders): every job's parts are the stems, balanced and ridden by their written dynamics as one score.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "guitar_tone": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "additionalProperties": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "The guitars' and bass guitar's own SOUND. Every guitar and bass-guitar part (an upright played pizzicato too; never a synth bass or an 808) gets a tone by default (\"auto\"): a mixing chain for the style — compression, the amp's voicing and speaker, chorus / phaser / tremolo, its own echo and reverb, in stereo — fitted to that stem (drive only where the genre is driven, and less on a take that already came out amped; an acoustic gets EQ, compression and a room, never an amp; a bass stays centred and dry). \"none\" = as rendered (dry, mono). Or name one: a tone id, or words (\"surf\", \"dark trap loop\", \"80s chorus\") — for every guitar, or {part name: tone} for one. Tones — electric: clean-studio, pop-shimmer, funk-quack, funk-phaser, disco-chank, neo-soul, motown-soul, jazz-archtop, jazz-fusion, country-twang, country-ballad, surf-drip, desert-twang, rockabilly-slap, fifties-tweed, sixties-jangle, british-chime, psychedelic-swirl, soft-rock-phase, eighties-chorus, city-pop, new-wave-flange, post-punk-chorus, grunge-chorus, dream-pop, indie-jangle, math-rock-clean, emo-twinkle, reggae-skank, ska-upstroke, dub-skank, afrobeat-clean, soukous-sparkle, bachata-requinto, cumbia-psych, gospel-clean, rnb-smooth, edm-funk, hiphop-sample, lofi-tape, trap-ambient, ambient-swell, cinematic-clean, prog-clean, blues-edge, blues-lead, heartland-edge, indie-rock-edge, worship-dotted, post-rock, seventies-crunch, southern-rock, slide-delta, alt-rock-crunch, britpop-wall, grunge-rhythm, eighties-arena-lead, synthwave-lead, shoegaze-wash, pop-punk-rhythm, punk-raw, metal-rhythm, metal-lead, djent-tight, doom-fuzz, garage-fuzz · acoustic: acoustic-natural, acoustic-pop-strum, acoustic-fingerstyle, acoustic-intimate, acoustic-country, acoustic-bluegrass, acoustic-rock, acoustic-celtic, acoustic-12-string, acoustic-lofi, acoustic-cinematic, acoustic-hiphop-loop, acoustic-worship, acoustic-latin-strum, acoustic-blues, acoustic-gypsy-jazz · nylon: nylon-bossa, nylon-classical, nylon-flamenco, nylon-latin-pop, nylon-lofi, nylon-cinematic · steel: pedal-steel-country, pedal-steel-ambient, lap-steel-island · bass: bass-studio, bass-sixties-thump, bass-finger-funk, bass-slap, bass-picked-rock, bass-driven-rock, bass-metal, bass-dub, bass-jazz-electric, bass-fretless, bass-eighties-chorus, bass-hiphop, bass-lofi, bass-country, bass-indie, bass-dance, bass-latin, bass-cinematic · upright: upright-jazz, upright-slap, upright-folk, upright-sampled, upright-latin, upright-cinematic. The mix says what it chose and why: mixgraph.provenance.guitar_tones {part: {tone, why, read, drive}}; the chain is the strip's own (strips[].chain), editable like the rest."
              },
              "idempotency_key": {
                "description": "Optional. Any unique string for THIS request (e.g. a UUID). Re-sending the same call with the same key after a timeout returns the same job instead of starting a second one.",
                "type": "string"
              },
              "length_s": {
                "description": "The program's length (a :30 = 30; ≤ 600 s): the mix is cut there with end_fade_s (default 0.5 s); the room's tail never runs past it.",
                "maximum": 600,
                "minimum": 0.5,
                "type": "number"
              },
              "mix_job": {
                "description": "MCP: a doseedo_mix job_id to edit — its whole stored mix (every ride) is the base, mixgraph is applied on top, and its stems are reused when you pass no from_job / stems.",
                "type": "string"
              },
              "mixgraph": {
                "description": "An edited mix — the mixgraph a doseedo_mix returned, changed — rendered against the same stems (from_job or stems). With mix_job: ONLY what you change (strips[] by stem, automation[] rides by target — points: [] removes one, buses[] by id, master) — the rest is that mix as stored. A mixgraph marked `partial` (its rides summarized) is refused without mix_job. Omit for a fresh mix.",
                "type": "object"
              },
              "music_offset_s": {
                "description": "Where bar 1 of the music sits on the picture (seconds, ≤ 600; the program ≤ 600 s): every music stem — and its rides — starts this late; the dialogue does not move.",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "name": {
                "description": "Optional: a name for this job's files, e.g. \"rainy-loop-3\". Every file it returns downloads as <name>_<part>.<ext> (rainy-loop-3_Celesta.wav, rainy-loop-3_rough-mix.wav; one take: rainy-loop-3.wav), so the user can find them. Give each job its own name (a second take: \"rainy-loop-3b\"). Default: doseedo-<last 6 characters of the job id>.",
                "maxLength": 80,
                "type": "string"
              },
              "print_sections": {
                "description": "Also print every section as its own stem: output.section_stems [{name, members, url}] — a 24-bit WAV per section (its players, their room and hall share, through the mix's own master), and the dialogue as one; the prints add up to the mix (report.prints.sum_error_db). Sections are the mix's group buses (film-orchestral-sections: strings / woodwinds / brass / percussion / keys_harp; parts in none print as \"other\"). About twice the render time; no extra credits. Works with mix_job too.",
                "type": "boolean"
              },
              "room": {
                "anyOf": [
                  {
                    "enum": ["studio", "stage", "hall", "cathedral"],
                    "type": "string"
