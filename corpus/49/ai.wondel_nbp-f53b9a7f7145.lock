{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/nbp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/nbp/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "NBP",
        "title": "NBP MCP",
        "version": "1.0.0",
        "description": "Official Polish central bank (NBP) exchange rates, currency conversion and gold prices.",
        "websiteUrl": "https://mcps.wondel.ai/servers/nbp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Narodowy Bank Polski (https://api.nbp.pl) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "nbp_convert",
          "title": "Convert currencies via NBP rates",
          "description": "Convert an amount between two currencies using official NBP mid rates, cross-rated through PLN. Supports PLN and every currency NBP quotes: table A is used first and table B (exotic currencies, published Wednesdays) is consulted automatically for codes A doesn't carry — each side of the response shows the rate, table and effectiveDate used. Latest rates by default, or historical with date. NBP publishes only on Polish business days — on weekends/holidays the request falls back to the most recent preceding publication; effectiveDate in the response shows the date actually used.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Amount in the source currency to convert.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "date": {
                "description": "Optional historical date (YYYY-MM-DD). Omit for the latest rates.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "Source currency code (e.g. USD, PLN). Case-insensitive.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh NBP fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "to": {
                "description": "Target currency code (e.g. EUR, PLN). Case-insensitive.",
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a8dc4d629d7e816edbaac0f941b96a1870054f141fbbf1ed31b9f46c49e6785"
        },
        {
          "name": "nbp_exchange_rate",
          "title": "NBP currency rate vs PLN",
          "description": "Get the official NBP rate for one currency against PLN (Polish złoty) — the latest rate by default, or the rate in force on a historical date. Tables 'a'/'b' return the mid rate; table 'c' returns bid/ask. NBP publishes only on Polish business days — on weekends/holidays the request falls back to the most recent preceding publication; effectiveDate in the response shows the date actually used. Use nbp_rate_series for a multi-day history.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "Three-letter ISO 4217 currency code (e.g. USD, EUR, CHF). Case-insensitive.",
                "type": "string"
              },
              "date": {
                "description": "Optional historical date (YYYY-MM-DD). Omit for the latest rate.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh NBP fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "table": {
                "description": "NBP table: 'a' (default) = official mid rates of ~35 major currencies, published every business day; 'b' = mid rates of ~115 less-traded currencies, published Wednesdays; 'c' = bid/ask (buy/sell) rates of major currencies, published every business day.",
                "enum": ["a", "b", "c"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b069f8453040b8c8807ad552db2a09e22b2e2c68673bccdc78130c0ed6c8edfb"
        },
        {
          "name": "nbp_exchange_rates",
          "title": "NBP exchange-rate table",
          "description": "Get a full NBP (Polish central bank) exchange-rate table against PLN — the latest published table by default, or the table in force on a historical date. NBP publishes only on Polish business days — on weekends/holidays the request falls back to the most recent preceding publication; effectiveDate in the response shows the date actually used. Rates data starts 2002-01-02.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Optional historical date (YYYY-MM-DD). Omit for the latest table.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh NBP fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "table": {
                "description": "NBP table: 'a' (default) = official mid rates of ~35 major currencies, published every business day; 'b' = mid rates of ~115 less-traded currencies, published Wednesdays; 'c' = bid/ask (buy/sell) rates of major currencies, published every business day.",
                "enum": ["a", "b", "c"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a8473f31b606542239bf2a7d8b7bff62126cdfa9d237d251927a9839a53a279"
        },
        {
          "name": "nbp_gold_price",
          "title": "NBP gold price",
          "description": "Get the official NBP gold price — PLN per 1 gram of 1000-fineness gold. Latest price by default; or one historical date; or the last N quotes (last_n, max 255); or a start_date/end_date range (max 93 days per query). Published every business day. NBP publishes only on Polish business days — on weekends/holidays the request falls back to the most recent preceding publication; effectiveDate in the response shows the date actually used. Gold data starts 2013-01-02.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "One historical date (YYYY-MM-DD). Mutually exclusive with last_n and the range.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "end_date": {
                "description": "Range end (YYYY-MM-DD, inclusive). Requires start_date; span ≤ 93 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "last_n": {
                "description": "Return the last N published prices (1-255). Mutually exclusive with date and the range.",
                "maximum": 255,
                "minimum": 1,
                "type": "integer"
              },
              "no_cache": {
                "description": "Force a fresh NBP fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "start_date": {
                "description": "Range start (YYYY-MM-DD, inclusive). Requires end_date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:640355e34136717697f44df16cd399c6fac564cde76a4b56429230d8775b1d93"
        },
        {
          "name": "nbp_rate_series",
          "title": "NBP currency rate history",
          "description": "Get a historical time series of NBP rates for one currency against PLN: either the last N published quotes (last_n, default 30, max 255) or an explicit start_date/end_date window (max 93 days per query — NBP's hard limit; chain calls for longer spans). Quotes exist only for publication days: business days for tables 'a'/'c', Wednesdays for 'b'. Data starts 2002-01-02.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "Three-letter ISO 4217 currency code (e.g. USD, EUR, CHF). Case-insensitive.",
                "type": "string"
              },
              "end_date": {
                "description": "Window end (YYYY-MM-DD, inclusive). Requires start_date; span ≤ 93 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "last_n": {
                "description": "Return the last N published quotes (1-255). Default 30. Mutually exclusive with start_date/end_date.",
                "maximum": 255,
                "minimum": 1,
                "type": "integer"
              },
              "no_cache": {
                "description": "Force a fresh NBP fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "start_date": {
                "description": "Window start (YYYY-MM-DD, inclusive). Requires end_date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "table": {
                "description": "NBP table: 'a' (default) = official mid rates of ~35 major currencies, published every business day; 'b' = mid rates of ~115 less-traded currencies, published Wednesdays; 'c' = bid/ask (buy/sell) rates of major currencies, published every business day.",
                "enum": ["a", "b", "c"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c265b7f1cc07f66033d1eb179c1fceb58ab59448c1f8709c2569e20a15407ca6"
        }
      ],
      "digest": "sha256:0891186451dc12d47db8456c3b5466b789bef59d3aed87a188fa8ca625593b6b"
    }
  }
}
