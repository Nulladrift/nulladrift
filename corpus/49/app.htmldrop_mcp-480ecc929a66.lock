{
  "lockfileVersion": 2,
  "subjects": {
    "app.htmldrop/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://htmldrop.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "htmldrop",
        "version": "0.3.4"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "tools": [
        {
          "name": "htmldrop_delete",
          "description": "Delete a site by its id. The id is the opaque string returned from htmldrop_list (NOT the slug). Once deleted the public URL returns 404 immediately.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The site's id, as returned by htmldrop_list.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "deleted": {
                "description": "Always true on success.",
                "type": "boolean"
              },
              "id": {
                "description": "The deleted site's id.",
                "type": "string"
              }
            },
            "required": ["deleted", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Delete htmldrop site"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfc425c197e42d5a23a885abd049b084833ef68e7c61f221c513f1f7e06dd26c"
        },
        {
          "name": "htmldrop_list",
          "description": "List every site the authenticated tenant has published. Returns each site's slug, id, and public URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "sites": {
                "description": "Every published site for the authenticated tenant.",
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["sites"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List htmldrop sites"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a7213435d641a91944fd3a4742a571f3eb670e77afc4960985e63bb5fe5b5916"
        },
        {
          "name": "htmldrop_publish",
          "description": "Publish an HTML or Markdown document as a hosted page on htmldrop. Returns the public share URL. Use this whenever a user asks to publish, share, or 'put on the web' some HTML / Markdown content. Pass exactly one of `html` or `markdown`.",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "Raw HTML document content. Either this or `markdown` must be set.",
                "type": "string"
              },
              "markdown": {
                "description": "Markdown content. Will be rendered to HTML on the server. Either this or `html` must be set.",
                "type": "string"
              },
              "slug": {
                "description": "Optional URL slug (3-63 chars, lowercase letters, numbers, hyphens). If omitted, a random slug is assigned.",
                "type": "string"
              },
              "title": {
                "description": "Optional title shown in the dashboard list.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "description": "Opaque site id. Pass to htmldrop_delete to remove later.",
                "type": "string"
              },
              "slug": {
                "description": "Resolved slug for the published site.",
                "type": "string"
              },
              "url": {
                "description": "Public share URL of the published page.",
                "type": "string"
              }
            },
            "required": ["id", "slug", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish to htmldrop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3ca6e606cbcf3c5c8e7b9b7b04901a9a6f7fba3301399a75654b03dcfa335b27"
        }
      ],
      "digest": "sha256:a687ececc68c4b682f820130c7cb42a277962ae2b58d6e4f14b06ab6abb66bc6"
    }
  }
}
