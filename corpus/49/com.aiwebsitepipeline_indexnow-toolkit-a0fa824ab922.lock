{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiwebsitepipeline/indexnow-toolkit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://indexnow-toolkit-mcp.lipmichal.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "indexnow-toolkit",
        "title": "IndexNow Toolkit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Builds and validates IndexNow submissions. build_indexnow_payload turns a URL list into an exact, spec-checked POST body plus the curl command to send it. validate_indexnow_key checks a key against the protocol rules and tells you where the key file must live. diff_sitemaps compares two sitemap XML documents and returns only the URLs worth submitting. This server constructs and validates payloads; it does not submit them for you.",
      "tools": [
        {
          "name": "build_indexnow_payload",
          "title": "Build an IndexNow POST body",
          "description": "Validates a key and URL list against the IndexNow spec and returns the exact JSON POST body, the endpoint, a ready-to-run curl command, and the reason for every URL it dropped. Enforces the same-host rule, the 10000-URL batch limit, https/http consistency, fragment stripping and de-duplication.",
          "inputSchema": {
            "properties": {
              "engine": {
                "description": "indexnow (default), bing, yandex, seznam or naver.",
                "type": "string"
              },
              "host": {
                "description": "The host, e.g. example.com. Inferred from the first URL if omitted.",
                "type": "string"
              },
              "key": {
                "description": "The IndexNow key, 8-128 characters of [a-zA-Z0-9-].",
                "type": "string"
              },
              "keyLocation": {
                "description": "Optional URL of the key file if it is not at https://host/<key>.txt.",
                "type": "string"
              },
              "urlList": {
                "description": "Absolute URLs to submit. All must be on the same host.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["key", "urlList"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e31ba9492f2af258e5264755b0d695880a3fc719eb19e6812621450d5234484"
        },
        {
          "name": "diff_sitemaps",
          "title": "Diff two sitemaps into an IndexNow list",
          "description": "Parses two sitemap documents (urlset XML, sitemapindex XML, or a newline-delimited URL list) and reports added, removed and lastmod-changed URLs. Returns only the URLs worth submitting to IndexNow. Pass a key to also get the finished, validated POST body.",
          "inputSchema": {
            "properties": {
              "current_sitemap": {
                "description": "The current sitemap document.",
                "type": "string"
              },
              "engine": {
                "description": "Optional target endpoint name.",
                "type": "string"
              },
              "include_removed": {
                "description": "Include removed URLs in the submission list. Default false.",
                "type": "boolean"
              },
              "key": {
                "description": "Optional IndexNow key; supplying it returns a ready-to-send payload.",
                "type": "string"
              },
              "keyLocation": {
                "description": "Optional key file URL.",
                "type": "string"
              },
              "previous_sitemap": {
                "description": "The earlier sitemap document.",
                "type": "string"
              }
            },
            "required": ["current_sitemap", "previous_sitemap"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dee82c6ee7fffc72c176464e132e158059b23db7c3d6a9c2e30b83c9de33e3a1"
        },
        {
          "name": "validate_indexnow_key",
          "title": "Validate an IndexNow key",
          "description": "Checks an IndexNow key against the protocol schema (length, character set) and, given a host, returns the exact URL the key file must be served from, the exact contents it must have, and the curl command to verify it. Most 403 rejections are a key file that returns an HTML 404 page with a 200 status.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "Optional host, e.g. example.com, to compute the key file URL.",
                "type": "string"
              },
              "key": {
                "description": "The key to check.",
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a540e0188e59551516e05d9c5db4875e515631254b22f33b44dda2fd46b3cc45"
        }
      ],
      "digest": "sha256:55ca4929d278d496d83fad577230619e8906110261f1edebfafada4b59134219"
    }
  }
}
