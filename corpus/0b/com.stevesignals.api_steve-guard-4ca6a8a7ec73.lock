        {
          "name": "smart_money_flow",
          "description": "Are PROVEN smart-money / alpha wallets net-BUYING or net-SELLING this token RIGHT NOW? Backed by our proprietary cross-coin reputation universe — NOT a public whale-tracker or a wrapper around on-chain data you already have. Returns signal = SMART_CONVERGENCE (multiple proven wallets accumulating — early-demand) / SMART_DISTRIBUTION (proven wallets exiting — smart-money dumping) / SMART_SINGLE / null, with n_buyers, n_sellers. Call before entering to see if informed capital is actually behind a move. Solana (base58) or Robinhood-chain (0x). Free 10/day, then $0.01/call.",
