          "description": "Are MULTIPLE independent proven-informed wallets CONVERGING on this Solana token right now? Our validated edge: a single informed wallet is noise, but a CLUSTER of independent informed wallets buying the same coin within a short window out-of-sample precedes up-moves. Returns confirmed (bool), n_informed (how many proven-informed wallets bought it in the last 6h), avg_informedness. Proprietary — built from our cross-coin informedness universe. Solana (base58). Free 10/day, then $0.01/call.",
