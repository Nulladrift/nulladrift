        {
          "name": "flow_inflection",
          "description": "Has net-USD money-flow DIRECTION just flipped for this token? Unique temporal signal (not a static snapshot): returns flow_state = ACCUMULATING / DISTRIBUTION_ONSET (money started leaving in the last hour vs prior window — early exit) / REVERSAL_UP (money started arriving — early entry) / DISTRIBUTING / CHOPPY. Robinhood-chain (0x) or Solana (base58). Call before an entry to avoid buying a top a static footprint would miss.",
