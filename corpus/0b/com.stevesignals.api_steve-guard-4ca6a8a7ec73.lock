        {
          "name": "exhaustion",
          "description": "Pressure RATE-OF-CHANGE (2nd derivative) — a signal no other tool computes. Measures whether buy/sell pressure is ACCELERATING or EXHAUSTING across consecutive time-buckets. signal = SELL_EXHAUSTION (price falling but sell-pressure declining bucket-over-bucket → sellers running out, bottom forming) / BUY_CLIMAX (price rising but buy-pressure fading → buyer appetite peaking, top forming) / ACCELERATION_UP / ACCELERATION_DOWN / STEADY. Leading: pressure-momentum breaks BEFORE the price reversal. RH-chain (0x) or Solana (base58).",
          "inputSchema": {
            "properties": {
              "token": {
                "description": "0x-address or base58 mint",
                "type": "string"
