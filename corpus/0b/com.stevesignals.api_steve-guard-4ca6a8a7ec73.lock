        {
          "name": "check_robinhood",
          "description": "Robinhood Chain (chain 4663) token pre-buy INTEL — near-zero competitor coverage. One call: safety (honeypot/tax/mint via GoPlus) + wallet distribution (top-holder %, holders) + NET-USD wallet-footprint (buy$ vs sell$, repeat-buyers, strong-loaders) -> 0-100 score + accumulation/distribution verdict. The dollar-weighted net-USD footprint separates real accumulation from a 'count trap' (more buys but net distribution). Specialist coverage generic EVM rug-checkers lack. Free 10/day, then paid via guard_pricing.",
          "inputSchema": {
            "properties": {
