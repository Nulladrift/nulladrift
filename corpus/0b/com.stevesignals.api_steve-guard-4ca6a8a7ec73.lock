        {
          "name": "impersonation_check",
          "description": "Is THIS token the REAL contract for its ticker, or a same-symbol copycat? Scammers reuse famous/existing tickers; an agent told to buy '$FOO' needs the legit contract. Returns rank-by-liquidity among all same-symbol tokens on-chain, is_canonical, the real contract if this is an impersonator, a famous-name flag, and impersonation_risk (LOW/MEDIUM/HIGH). Robinhood-chain (0x) or Solana (base58).",
