        },
        {
          "name": "timing_signal",
          "description": "Is NOW a good entry, a wait, or an exit point? Fuses three axes no other tool combines: money-flow DIRECTION (capital arriving vs leaving, from temporal net-USD), price EXTENSION (already run / fresh / crashing), and short-term MOMENTUM. signal = ENTER (money in + price not yet run) / WAIT_PULLBACK (accumulating but extended) / TAKE_PROFIT (distribution after a run) / EXIT_NOW (money out + falling) / WATCH, plus entry_quality 0-100. Best entry = capital in + price fresh; best exit = capital out + price extended. RH-chain (0x) or Solana (base58).",
