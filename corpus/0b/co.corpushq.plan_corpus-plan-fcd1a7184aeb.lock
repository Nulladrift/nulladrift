          },
          "digest": "sha256:ee2ff5417bd2682d63d19ee9a5ec51cf4af2c90c27dc8f9db66baf62c7b627bc"
        },
        {
          "name": "get_public_report",
          "title": "Read a saved shared audit report",
          "description": "Read the stored public audit report for a saved Corpus Plan share slug. Unsaved reports require saving through the website first. Only public report facts are returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The slug from a /r/{slug} Corpus Plan report URL.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
