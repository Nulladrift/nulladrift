        },
        {
          "name": "get_report_recommendations",
          "title": "Prioritize saved report findings",
          "description": "Return observed findings ordered critical, major, minor, then other severities, with existing fix hints. Requires a saved public share slug, not private account access. No new crawl, invented findings or automatic fixes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The slug from a /r/{slug} Corpus Plan report URL.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
