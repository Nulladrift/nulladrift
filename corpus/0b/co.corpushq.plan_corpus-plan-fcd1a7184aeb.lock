            "readOnly": true
          },
          "digest": "sha256:6349fdde4b27d138921869f1f0903fa032aecb345284f1eef34c17d89e1e0014"
        },
        {
          "name": "get_report_progress",
          "title": "Read shared audit progress",
          "description": "Read the current status and progress lines for a Corpus Plan audit behind a public report slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The slug from a /r/{slug} Corpus Plan report URL.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
