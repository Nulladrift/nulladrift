            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7def42142981808c532172d017132e8d283dc81ba52f937dc8d58f5bd322230b"
        },
        {
          "name": "run_audit",
          "title": "Run a free website audit",
          "description": "Use this when the user wants a website audited. Starts Corpus Plan's free audit of a public website (up to 20 pages of that site) and returns the overall score, the five pillar scores including AI citability, the top three issues, the Product information document and the workspace link where the user can save the report. The same site audited from an AI assistant in the last 24 hours is returned again instead of re-crawled. If the result says running, call again with the same url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The website to audit, e.g. example.com or https://example.com.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
