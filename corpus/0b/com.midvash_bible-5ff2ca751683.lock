        {
          "name": "get_passage",
          "description": "Fetches Bible passages from natural-language references such as \"John 3:16-18\", \"Psalm 23\", \"Romans 8:1-9:5\" (crossing chapters) or \"John 3:16; Romans 8:1\" (several at once). This is the primary lookup tool when the user gives a citation instead of structured book/chapter/verse fields.",
          "inputSchema": {
            "properties": {
              "reference": {
                "description": "One or more free-form Bible references. Accepts localized book names, abbreviations, whole chapters (\"Psalm 23\"), verse ranges (\"John 3:16-18\"), chapter ranges (\"Genesis 1-3\"), ranges that cross chapters (\"Romans 8:1-9:5\"), and several references separated by semicolons or commas (\"John 3:16; Romans 8:1\"). At most 10 per call.",
                "type": "string"
              },
              "version": {
                "description": "Optional Bible version slug. If omitted, uses the first version enabled by the connection URL, or \"bsb\" (English) when no version filter exists. When the user writes in another language, pass a version in that language.",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "copyright": {
