        {
          "name": "get_strongs",
          "description": "Looks up a word in Strong's lexicon — 8,674 Hebrew and 5,523 Greek entries — by Strong's number (\"H430\", \"G2316\") or by the word itself, in the original script or transliterated (\"elohim\", \"θεός\"). Returns the lemma, transliteration, definition and senses, translated into the requested language. Use it when the question is what an original-language word means.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Restricts the search, and is required when `number` is given without an H or G prefix.",
                "enum": ["hebrew", "greek"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum entries when searching by word. Default: 5; max: 15.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "number": {
                "description": "Strong's identifier: \"H430\" for Hebrew, \"G2316\" for Greek. A bare number like \"430\" also works if `language` is given.",
                "type": "string"
              },
              "translation_language": {
                "description": "Language for the definitions: en, pt-br, es, fr, de, it, zh, ru, ko. Defaults to the connection language, or English.",
                "type": "string"
              },
              "word": {
                "description": "A word to look up instead of a number. Accepts the original script (\"אלהים\", \"θεός\") or a transliteration (\"elohim\", \"theos\"). Vowel points and accents are ignored.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "entries": {
                "items": {
                  "properties": {
                    "definition": {
                      "type": ["string", "null"]
                    },
                    "derivation": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Strong's identifier, such as \"H430\".",
                      "type": "string"
                    },
                    "kjv_definition": {
                      "type": ["string", "null"]
                    },
                    "language": {
                      "enum": ["hebrew", "greek"],
                      "type": "string"
                    },
                    "lemma": {
                      "type": "string"
                    },
                    "number": {
                      "type": "integer"
                    },
                    "outline": {
                      "type": ["string", "null"]
                    },
                    "part_of_speech": {
                      "type": ["string", "null"]
                    },
                    "pronunciation": {
                      "type": ["string", "null"]
                    },
                    "transliteration": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "language", "lemma", "number"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Strong's lexicon entry"
