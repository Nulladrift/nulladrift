        {
          "name": "get_commentary",
          "description": "Fetches the Midvash commentary for the chapter a reference points to — what the chapter is about, its context and its main movements. Every one of the 1,189 Bible chapters has one, in 9 languages. Use this for \"what is this chapter about\" questions. For the text itself, use get_passage. Returns a summary with a link to the full commentary.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional language for the commentary: en, pt-br, es, fr, de, it, zh, ru, ko. Defaults to the connection language, or English.",
                "type": "string"
              },
              "reference": {
                "description": "Any Bible reference inside the chapter you want commentary on. \"John 3\", \"João 3:16\" and \"Romans 8:1-11\" all resolve to that chapter.",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get chapter commentary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2608062438374ade56aab2173389c214d691d2a3b6e70d5ec262ff97d4591425"
        },
        {
          "name": "get_cross_references",
          "description": "Finds other Bible passages that relate to a given verse, ranked by how widely the link is attested. This answers \"what else in Scripture speaks to this?\" — the standard next step in study after reading a verse. Returns each related passage with its text, so no follow-up lookup is needed.",
          "inputSchema": {
            "properties": {
              "include_text": {
                "description": "Whether to include the text of each related passage. Default true. Set false for a compact list of references only.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum number of related passages. Default: 10; max: 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "reference": {
                "description": "The verse to start from, such as \"John 3:16\" or \"Romanos 8:28\". Must point at a single verse; a whole chapter is too broad for cross-references.",
                "type": "string"
              },
              "version": {
                "description": "Optional Bible version slug for the text of the related passages. Defaults to the connection version, or \"bsb\" (English).",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "copyright": {
                "description": "Attribution the version license requires (e.g. CC BY-SA). Present only for versions that need it; show it with the text.",
                "type": "string"
              },
              "passages": {
                "items": {
                  "properties": {
                    "book": {
                      "type": "string"
                    },
                    "book_id": {
                      "type": "integer"
                    },
                    "chapter": {
                      "type": "integer"
                    },
                    "text": {
                      "type": "string"
                    },
                    "verse_end": {
                      "type": "integer"
                    },
                    "verse_start": {
                      "type": "integer"
                    },
                    "votes": {
                      "description": "How many sources attest this link. Higher is stronger.",
                      "type": "integer"
                    }
                  },
                  "required": ["book", "book_id", "chapter", "verse_end", "verse_start", "votes"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "properties": {
                  "book": {
                    "type": "string"
                  },
                  "book_id": {
                    "type": "integer"
                  },
                  "chapter": {
                    "type": "integer"
                  },
                  "verse": {
                    "type": "integer"
                  }
                },
                "required": ["book", "book_id", "chapter", "verse"],
                "type": "object"
