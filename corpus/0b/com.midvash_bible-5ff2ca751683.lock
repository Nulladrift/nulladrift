      "instructions": "Midvash MCP gives AI clients fast, no-key access to Scripture in 119 free Bible versions across 69 languages. Use get_passage for natural references, search_bible to find verses, and compare_passage to compare translations.",
      "tools": [
        {
          "name": "compare_passage",
          "description": "Compares the same Bible passage across multiple Bible versions and returns a Markdown side-by-side style comparison. Use this for translation comparison, sermon preparation, or study questions. For a single version, use get_passage.",
          "inputSchema": {
            "properties": {
              "reference": {
                "description": "Free-form Bible reference to compare. Accepts supported localized book names, abbreviations, whole chapters, and verse ranges. Examples: \"John 3:16\", \"João 3:16-18\", \"Psalm 23\".",
                "type": "string"
              },
              "versions": {
                "description": "Optional list of Bible version slugs to compare. If omitted, uses versions enabled by the connection URL, or a small default set. Maximum 8 versions.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Bible passage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a57e7822804141bd1851a6aa86cc174a8cee985f04f27116b430132a23f6b271"
        },
        {
          "name": "get_chapter",
          "description": "Fetches a full Bible chapter from a specific version, formatted in Markdown with numbered verses. Use this when the user needs chapter-level context instead of an isolated verse.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "Bible book name, slug, or abbreviation. Accepts supported localized names such as \"John\", \"João\", \"Salmos\", or \"1 Sm\".",
                "type": "string"
              },
              "chapter": {
                "description": "Chapter number within the selected book. Must be 1 or greater.",
                "minimum": 1,
                "type": "integer"
              },
              "version": {
                "description": "Bible version slug to read from, such as \"onbv\", \"kjv\", \"bsb\", or \"rvr1909\". Must be enabled by the connection URL filters.",
                "type": "string"
              }
            },
            "required": ["book", "chapter", "version"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "copyright": {
                "description": "Attribution the version license requires (e.g. CC BY-SA). Present only for versions that need it; show it with the text.",
                "type": "string"
              },
              "reader_url": {
                "description": "Link to read the passage on midvash.com.",
                "type": "string"
              },
              "verses": {
                "items": {
                  "properties": {
                    "book": {
                      "description": "Book name in the language of the version.",
                      "type": "string"
                    },
                    "book_id": {
                      "description": "Canonical book number, 1 to 66.",
                      "type": "integer"
                    },
                    "chapter": {
                      "type": "integer"
                    },
                    "text": {
                      "type": "string"
                    },
                    "verse": {
                      "type": "integer"
                    }
                  },
                  "required": ["book", "book_id", "chapter", "text", "verse"],
                  "type": "object"
                },
                "type": "array"
              },
              "version": {
                "description": "Version slug, such as \"kjv\".",
                "type": "string"
              },
              "version_name": {
                "description": "Human-readable version name.",
                "type": "string"
              }
            },
            "required": ["verses", "version"],
            "type": "object"
          },
          "annotations": {
