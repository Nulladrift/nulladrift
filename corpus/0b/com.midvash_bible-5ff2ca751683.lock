                "description": "Version slug, such as \"kjv\".",
                "type": "string"
              },
              "version_name": {
                "description": "Human-readable version name.",
                "type": "string"
              }
            },
            "required": ["passages", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
