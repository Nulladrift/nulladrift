        {
          "name": "search_bible",
          "description": "Searches the Bible text for words or an exact phrase and returns matching verses ranked by relevance. Matching ignores letter case, accents, and Hebrew and Arabic vowel marks; wrap the query in double quotes for an exact phrase. Use this for discovery questions like \"find verses about love\". For a known citation, use get_passage or get_verse.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "Optional book name, slug, or abbreviation in any supported book locale (ex.: \"John\", \"João\", \"Salmos\").",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of matches to return. Default: 20; max: 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for. Every word must appear in the verse, in any order. Wrap the whole query in double quotes for an exact phrase. Accents and letter case are ignored. This is keyword search, not semantic search.",
                "type": "string"
              },
              "testament": {
                "description": "Optional testament filter. Use \"old\" for Old Testament or \"new\" for New Testament. Ignored when book is provided.",
                "enum": ["old", "new"],
                "type": "string"
              },
              "version": {
                "description": "Optional Bible version slug such as \"onbv\", \"kjv\", \"bsb\", or \"rvr1909\". If omitted, uses the first version enabled by the connection URL, or \"bsb\" (English). When the user writes in another language, pass a version in that language.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "copyright": {
                "description": "Attribution the version license requires (e.g. CC BY-SA). Present only for versions that need it; show it with the text.",
                "type": "string"
              },
              "matches": {
                "items": {
                  "properties": {
                    "book": {
                      "description": "Book name in the language of the version.",
                      "type": "string"
                    },
                    "book_id": {
                      "description": "Canonical book number, 1 to 66.",
                      "type": "integer"
                    },
                    "chapter": {
                      "type": "integer"
                    },
                    "text": {
                      "type": "string"
                    },
                    "verse": {
                      "type": "integer"
                    }
                  },
                  "required": ["book", "book_id", "chapter", "text", "verse"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              },
              "strategy": {
                "description": "How the results were produced: ranked on the requested version, ranked on another version of the same language, substring fallback, or a book-scoped scan.",
                "enum": ["ranked", "ranked-cross-version", "substring", "scan"],
                "type": "string"
              },
              "version": {
                "description": "Version slug, such as \"kjv\".",
                "type": "string"
              },
              "version_name": {
                "description": "Human-readable version name.",
                "type": "string"
              }
