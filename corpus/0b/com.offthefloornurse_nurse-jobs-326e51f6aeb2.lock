{
  "lockfileVersion": 2,
  "subjects": {
    "com.offthefloornurse/nurse-jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://offthefloornurse.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "offthefloor",
        "title": "Off the Floor nurse jobs",
        "version": "1.0.0",
        "description": "Remote, hybrid and non-bedside nursing jobs for RNs, LPNs and NPs from Off the Floor: the free preview listings in full and counts for the rest.",
        "websiteUrl": "https://offthefloornurse.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Nurse job listings from Off the Floor (https://offthefloornurse.com), read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; every result gives data_updated_at. Tools return the free preview listings in full and counts for the rest: a listing outside the free preview is counted, never described, and no tool returns an apply link. Free to use; please cite Off the Floor and link the source_url in each result.",
      "tools": [
        {
          "name": "employer_counts",
          "title": "Employers hiring nurses",
          "description": "Which employers have nurse jobs on Off the Floor (https://offthefloornurse.com) and how many open listings each has, optionally for one US state. Returns employer names with counts, and a link to the employer's page on the site where there is one. Names and counts only: no titles, pay or links to listings. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "state": {
                "description": "A US state as a 2-letter code (\"TX\") or full name (\"Texas\"), any case. Matches listings that name the state, plus remote listings open across the US.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:093799bbb3825b955aafe07eec631f9f2befe954ebc33ce62839894cd8d0b2ae"
        },
        {
          "name": "job_board_info",
          "title": "About Off the Floor",
          "description": "About Off the Floor (https://offthefloornurse.com): what the job board is, where its data comes from, totals (listings, employers, remote, hybrid, listings with posted pay, free preview size), what is free and what a plan adds, the plan prices and refund rule as the pricing page prints them, and the links to the developer docs, MCP URL and OpenAPI spec. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0db6ffbde7120b7cdf8a8c423347541ec56a3ef7d2743426c0e34f9473c6ad8e"
        },
        {
          "name": "list_roles",
          "title": "List nurse job roles",
          "description": "List the role families on Off the Floor (https://offthefloornurse.com) with how many listings each has and how many are fully remote, plus listing counts by license (RN, LPN, NP) and by work mode. Counts only, from the board's current data file. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:455055b5bf14b46751abc2be6294c16a2ccccdfba69f3df04bda19b941101f91"
        },
        {
          "name": "search_jobs",
          "title": "Search nurse jobs",
          "description": "Search remote, hybrid and non-bedside nurse jobs on Off the Floor (https://offthefloornurse.com). Filter by role family, US state, fully remote and license. Returns counts for every match (total_matching, free_preview_matching, locked_matching) and the free preview listings that match, in full: title, employer, posted pay, work mode, location, states and a link to the listing page. Listings outside the free preview are counted only; a plan on the site shows their employer, pay and apply link. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "license": {
                "description": "License the listing accepts: RN, LPN (LPN/LVN) or NP.",
                "enum": ["RN", "LPN", "NP"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many free preview listings to return, 1 to 20. Default 10. Counts always cover every match.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "remote_only": {
                "default": false,
                "description": "Only fully remote listings (work mode remote). Default false.",
                "type": "boolean"
              },
              "role": {
                "description": "Role family. One of: utilization-review (Utilization review), case-management (Case management), telehealth (Telehealth), triage (Phone triage), documentation (Documentation and coding), quality (Quality), informatics (Informatics), education (Education), other (Other off-the-floor).",
                "enum": ["utilization-review", "case-management", "telehealth", "triage", "documentation", "quality", "informatics", "education", "other"],
                "type": "string"
              },
              "state": {
                "description": "A US state as a 2-letter code (\"TX\") or full name (\"Texas\"), any case. Matches listings that name the state, plus remote listings open across the US.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d7c7e8b4b65f667f3d1aa8ca35109411fedc67c65fb68ed8fe1bfb2df3ca099"
        }
      ],
      "digest": "sha256:53cef387f984e4fb6e6a0b1e04a15b7a5e5e2808cf30e8274e3ebe8b588248b5"
    }
  }
