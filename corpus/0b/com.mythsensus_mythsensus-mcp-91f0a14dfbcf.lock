        {
          "name": "get_deity_lore",
          "description": "Look up an encyclopedic profile of any of 1,044 deities across 9 mythologies — Hinduism, Greek, Chinese, Norse, Shinto, Egyptian, Roman, Thai mythology & Thai Buddhism (e.g. Ganesha, Zeus, Odin, Amaterasu, Anubis, Guan Yin, Phra Phrom). Returns origin tradition, the deity's rarity tier, and full lore in English + Thai. Use whenever a user asks \"who is X?\", \"tell me about the god/goddess X\", the myth or symbolism of a deity, or about a pantheon.",
          "inputSchema": {
            "properties": {
              "deity": {
                "description": "Deity name or partial (e.g. \"Ganesha\", \"amaterasu\", \"thor\"). Case-insensitive; partial matches return candidates.",
                "type": "string"
              },
              "lang": {
                "description": "Output language (optional; omit to get BOTH English and Thai).",
                "enum": ["th", "en"],
                "type": "string"
              }
            },
            "required": ["deity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
