        {
          "name": "calculate_cosmic_score",
          "description": "Compute the Mythsensus Cosmic Score (1–1,000) for a birth date. Synthesises 26 ancient divination systems including BaZi, Vedic Jyotish, Western astrology, Nine Star Ki, Thai Seven Number, Mayan Tzolk'in, Norse Runes, and 19 others. Returns numeric score, band (Dawn→Divine), percentile, plus a 5-of-26 per-system consensus preview. Deterministic: same input always returns the same output.",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "Birth day (1-31)",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "hour": {
                "description": "Birth hour (0-23, optional — improves BaZi/Vedic/Western precision; default 12 noon)",
                "maximum": 23,
                "minimum": 0,
                "type": "integer"
              },
              "lang": {
                "description": "Output language (optional; default th)",
                "enum": ["th", "en"],
                "type": "string"
              },
              "lat": {
                "description": "Birth latitude (optional; default 13.75 = Bangkok)",
                "type": "number"
              },
              "lon": {
                "description": "Birth longitude (optional; default 100.5 = Bangkok)",
                "type": "number"
              },
              "minute": {
                "description": "Birth minute (0-59, optional; default 0)",
                "maximum": 59,
                "minimum": 0,
                "type": "integer"
              },
              "month": {
                "description": "Birth month (1-12)",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "timezone": {
                "description": "Timezone offset hours (optional; default +7)",
                "type": "number"
              },
              "year": {
                "description": "Birth year (4-digit, e.g. 1990)",
                "maximum": 2100,
                "minimum": 1500,
                "type": "integer"
              }
            },
            "required": ["day", "month", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "calculate cosmic score"
