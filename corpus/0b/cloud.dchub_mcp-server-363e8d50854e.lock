        {
          "name": "get_fiber_intel",
          "title": "Fiber Intelligence",
          "description": "Use this when the user asks about fiber routes, carriers or connectivity for a market: long-haul, metro, dark or IX routes. Filter by carrier, route_type, market. Returns GeoJSON routes: carrier, type, fiber count, lit capacity, distance. Without full access you get a sample of routes, not the full set; the full set needs a full-access key. Ex: \"Zayo long-haul routes via Dallas.\" Filter by market (slug from rank_markets) or carrier. For one building use get_facility. Gated: give human_url to your human. For multi-step data center or energy questions, start with execute_plan.",
