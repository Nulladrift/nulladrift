        {
          "name": "suggest_reallocation",
          "title": "Suggest Reallocation",
          "description": "Use this when a saved data center site drifts (its national standing dropped — surfaced by get_shortlist refresh or a set_shortlist_alert firing), get replacement candidates from the rest of that shortlist so the alert becomes an action, not just a warning (Phase 5). Returns TWO tiers — tier_1_same_region (a near-in tactical swap) and tier_2_cross_region (a different-region arbitrage) — each re-scored against the DRIFTED slot's own objectives, PLUS drift_is_systemic: if the rest of your shortlist also slipped, the drop is region/baseline-wide and a same-region swap will inherit it (prefer cross_region); if peers held, it's idiosyncratic (tactical_ok). DC Hub does the reduction; the final weighted pick is yours. Candidates come from THIS shortlist only (save more via save_to_shortlist to widen the pool). Scoped to your API key. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "drifted_site_ref": {
                "description": "Optional site_ref of the drifted slot to replace; if omitted, the current lowest-scoring site is treated as the drifted one",
                "type": "string"
              },
              "shortlist_name": {
                "description": "The shortlist to re-allocate within (created via save_to_shortlist)",
                "type": "string"
              }
