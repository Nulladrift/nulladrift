          "description": "Use this when the user wants an async, cited data center research dossier from DC Hub's corpora (news, deals, facilities, market deep-dive narratives + live market components) — a decision-ready analyst brief with [n] citations, not a lookup. Requires a key (one get_api_key call). Submits the question, waits up to ~35s for completion, and returns the finished dossier inline when ready; if still running, returns {task_id} — call research_task task_id=<id> to fetch it. Params: question (required for a new dossier, min 12 chars) OR task_id (poll an earlier one). Typical completion under a minute. Answers \"write me a cited brief on this\", \"what do recent deals say about gas-bridged power\". Try: research_task question=\"What do recent deals say about gas-bridged power for data centers in ERCOT?\". Do NOT use for a single fact (use search_intelligence / semantic_search); this synthesizes ACROSS sources with citations. For multi-step data center or energy questions, start with execute_plan.",
