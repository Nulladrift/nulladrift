        {
          "name": "get_energy_prices",
          "title": "Energy Prices",
          "description": "Use this when the user asks what electricity or natural gas costs for a data center in a US ISO or state (\"what does power cost in ERCOT?\", \"retail rate in Virginia?\"); price alone does not rank sites (the cheapest ISO may have no headroom; execute_plan weighs both). Returns EIA RETAIL electricity rates, which are monthly and not live (about 3 months behind; retail_rates.latest_period names the month), for one ISO footprint (the average of its states), one state, or the US: retail_rates {avg_cents_kwh, min_cents_kwh, max_cents_kwh, latest_period, states_covered} in CENTS/kWh, plus avg_rate_kwh, retail_rate_kwh and industrial_rate_kwh in DOLLARS/kWh (by_sector when no sector is given); and natural_gas_usd_mmbtu, the latest Henry Hub daily spot in $/MMBtu, one national benchmark rather than a state or ISO price, with its own natural_gas.period and as_of. Example: \"What is the retail power price and gas price in ERCOT?\" — get_energy_prices iso=ERCOT. Params: iso (ERCOT, PJM, MISO, CAISO, SPP, NYISO, ISONE) or state (e.g. TX); data_type is accepted but does not change the response. At an anonymous or free-key seat the figures come back null with gated: true; an email-bound key opens them. For multi-step data center or energy questions, start with execute_plan.",
