          "description": "Use this when the user asks whether one data center site (lat/lon) is fiber-ready: near-net distance to a carrier-served facility, how many distinct fiber carriers are reachable, and whether there is single-carrier risk (no path diversity). This is the parcel connectivity answer engineering site-selectors screen on. Example: \"Is this Loudoun County parcel fiber-ready and how many carriers can serve it?\" — get_fiber_readiness lat=39.04 lon=-77.48 radius_km=50. Params: lat (-90..90, required), lon (-180..180, required), radius_km (search radius in km, default 50, range 5-200). Returns: {score 0-100 (null when not scored — see carrier_data_coverage), near_net_bucket (\"on-net\"|\"near-net\"|\"acceptable\"|\"build-required\"|\"unknown\"), nearest_carrier_km, carrier_count, top_carriers:[{carrier, distance_km}], single_carrier_risk (bool, null when not scored), fiber_coverage_km, verdict_short, carrier_data_coverage (\"confirmed\"|\"none_in_region\")}. IMPORTANT — \"unknown\" is NOT \"bad\": carrier presence comes from PeeringDB, which is global but thin outside dense US/EU metros, so DC Hub distinguishes \"no carrier serves this point\" from \"PeeringDB does not describe this region\". For multi-step data center or energy questions, start with execute_plan.",
