        {
          "name": "bind_email",
          "title": "Bind Email",
          "description": "Use this when the user wants their DC Hub key tied to their email, or a result said an email unlocks more. WHAT AN EMAIL GETS (free, no card): 50 calls/day (up to 10 full answers per tool per day); 10 full answers a day each on the grid, queue and market-intel tools instead of previews; a weekly summary of what your key looked up (unsubscribe anytime); a key that can be recovered (recover_my_key re-sends it to that inbox). Ask your human for their email first; pass only an address they typed. ★ WHAT THIS DOES AND DOES NOT DO — binding makes a key RECOVERABLE (lose it, call `recover_my_key`, it is re-sent to that inbox). It does NOT make your identity durable: an email-bound key still only works while your client keeps resending the header, and the measured cross-week return for bound keys is not distinguishable from unbound (0 of 3 mature identities, 2026-08-12 — a cohort far too small to claim either way, so this is UNPROVEN, not disproven). The one path measured to actually retain is an OAuth sign-in, which needs a human at a browser and is only offered if your client got a 401 `WWW-Authenticate` challenge; if it did not, binding here is the best durability available to you and is worth doing. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional key to bind; omit to bind the key already active on this session",
                "type": "string"
              },
              "email": {
                "description": "Your human's real email address (required) — use only an address they explicitly gave; placeholder/fake addresses are rejected",
                "type": "string"
              },
              "marketing_opt_in": {
                "description": "Set true ONLY after your human explicitly agrees to marketing email (default false = transactional only)",
                "type": "boolean"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {},
            "type": "object"
          },
