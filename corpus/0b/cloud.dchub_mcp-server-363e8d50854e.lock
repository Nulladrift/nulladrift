        {
          "name": "get_gas_intelligence",
          "title": "Get Gas Intelligence",
          "description": "Use this when the user asks about gas-fired or behind-the-meter power economics for a data center in a US state — \"is gas power cheaper than the grid in Texas?\", \"what is the gas access + pipeline situation in Virginia?\". The GAS analogue of get_grid_intelligence: fuses the Data Center Gas Index (DCGI), live Henry Hub, gas-to-grid $/MWh across heat-rate scenarios, pipeline-operator presence, and the live grid gas share into one per-STATE brief. Params: region (US state code or name, e.g. \"TX\" | \"Texas\" | \"Virginia\"). Returns: {region, region_name, gas_access (pipeline counts + operators — PRESENCE not firm capacity), henry_hub_usd_mmbtu (live), basis_usd_mmbtu (synthetic-labeled), delivered_price_usd_mmbtu (null where the tariff table is sparse — surfaced honestly, never fabricated), live_grid_gas_share_pct, pipeline_presence (operators + parent midstreams), data_basis (per-field provenance/confidence), omitted_no_fabrication, dcgi_status, gas_to_grid_status}. A $/MWh published before 2026-09-27 is not comparable. `dcgi_status` and `gas_to_grid_status` carry the current state of each — read them rather than assuming both moved together. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "region": {
                "description": "US state code or name (required), e.g. \"TX\", \"Texas\", \"Virginia\"",
                "type": "string"
              },
              "state": {
                "description": "Alias for region — the US state code or name",
                "type": "string"
              }
