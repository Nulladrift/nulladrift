        {
          "name": "get_hosting_capacity",
          "title": "Feeder Hosting Capacity",
          "description": "Use this when the user asks how many MW a distribution feeder can take: utility-published hosting capacity — the MW a NAMED distribution feeder can actually take, straight from the utility's own hosting-capacity GIS. Published records from many utilities (e.g. Con Edison, National Grid NY/MA, NYSEG/RG&E, Rhode Island Energy, Orange & Rockland, Central Hudson, Eversource CT, BGE, Pepco/Delmarva/ACE, Dominion VA, Ameren Illinois, AEP Ohio & I&M, Xcel MN/CO, DTE, Avista; the no-args call lists current coverage). This is filed distribution-level truth, not a proximity proxy. Three ways to call it: lat+lon (+radius_km, default 25) for a point; utility or market for a whole published territory; NO ARGS for the coverage list of every market that has data. Answers \"can this feeder actually take 20 MW\", \"where can I plug in without waiting on a substation upgrade\". Try: get_hosting_capacity utility=\"Ameren Illinois\" capacity_type=load min_mw=5. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "capacity_type": {
                "description": "Restrict to one published type: \"load\" (what a new data-center load can DRAW — the type that answers siting), \"gen\" (DER/generation EXPORT headroom — NOT available load), or \"bus_headroom\" (transmission bus MW).",
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the point to search around, decimal degrees. Must be paired with lon.",
                "type": "number"
              },
              "latitude": {
                "description": "Alias for lat — either name works",
                "type": "number"
              },
              "limit": {
                "description": "Max results to return (1-500; default varies by tool)",
