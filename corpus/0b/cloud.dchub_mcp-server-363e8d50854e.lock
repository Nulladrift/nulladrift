          "description": "Use this when the user wants data center facilities similar to one they like (\"what else looks like this?\"). Example: \"Find alternatives to the Ashburn QTS campus for about 50MW.\" — find_alternatives facility_id=<id>. Params: facility_id or name (the target, required); optional capacity_mw, radius_km, limit. Returns: ranked alternatives, each with similarity_score, match_reasons, and key_differences versus the target. Do NOT use to score one site (use score_facility or analyze_site) or to compare a known short-list head-to-head (use compare_sites); this DISCOVERS candidates from a single seed facility. For multi-step data center or energy questions, start with execute_plan.",
