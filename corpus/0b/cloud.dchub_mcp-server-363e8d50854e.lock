        {
          "name": "bind_email",
          "title": "Bind Email",
          "description": "Use this when the user wants their DC Hub key tied to their email, or a result said an email unlocks more. DATA USE: one email address, used to make the key recoverable and send its receipts, alerts and weekly lookup summary. DC Hub keeps it and never sells it or shares it for anyone else’s use (https://dchub.cloud/privacy). Run only when your human asks; confirm the address with them first. WHAT AN EMAIL KEEPS: the key, with its saved shortlists, alerts and tracked changes (get_changes), for the next chat; fuller market answers; a weekly summary of what your key looked up (unsubscribe anytime); and recovery (recover_my_key re-sends a lost key to that inbox). Ask your human for their email first; pass only an address they typed. ★ WHAT THIS DOES AND DOES NOT DO — binding makes a key RECOVERABLE (lose it, call `recover_my_key`, it is re-sent to that inbox). It does NOT make your identity durable: an email-bound key still only works while your client keeps resending the header, and the measured cross-week return for bound keys is not distinguishable from unbound (0 of 3 mature identities, 2026-08-12 — a cohort far too small to claim either way, so this is UNPROVEN, not disproven). For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional key to bind; omit to bind the key already active on this session",
                "type": "string"
              },
              "email": {
                "description": "Your human's real email address (required) — use only an address they explicitly gave and confirmed; placeholder/fake addresses are rejected. DC Hub keeps it and never sells or shares it",
                "type": "string"
              },
              "marketing_opt_in": {
                "description": "Set true ONLY after your human explicitly agrees to marketing email (default false = transactional only)",
                "type": "boolean"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
