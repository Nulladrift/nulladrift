        {
          "name": "get_renewable_energy",
          "title": "Renewable Energy",
          "description": "Use this when the user asks about renewable energy for a data center (execute_plan covers renewables plus siting): siting a renewable-powered data center, sizing a PPA, reading one US state's utility-scale fuel mix, or assessing RE100/24-7-CFE feasibility. Example: \"What is Texas wind+solar capacity and how much utility-scale solar is operating today?\" — get_renewable_energy energy_type=solar state=TX. Params: energy_type one of \"solar\" | \"wind\" | \"combined\" (omit for all); state 2-letter US code (e.g. TX, VA, AZ); lat+lon (optional) for the nearest projects within 50mi. Returns: {capacity_mw_total, by_fuel: {solar_utility, solar_rooftop, wind_onshore, wind_offshore}, capacity_factor_pct, top_projects[{name, mw, operator, cod}], state_rps_target_pct, source: \"EIA-860 + state RPS\"}. Do NOT use for live grid generation (use get_grid_data) or non-US (use get_grid_scoreboard for EU/UK/AU/TW). Give state or lat/lon (decimal degrees); energy_type narrows. Empty = no installations there: widen to the state. For multi-step data center or energy questions, start with execute_plan.",
