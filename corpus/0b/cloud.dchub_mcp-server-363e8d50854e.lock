        {
          "name": "source_capacity",
          "title": "Source Capacity",
          "description": "Use this when the user needs data center or colocation capacity to buy or lease: search DC Hub Capacity Source by size (kW or MW) and/or location (a region such as North America or Europe, a country, a state or a metro). Example: \"500 kW anywhere in Europe\" → min_kw=500, region=europe. New data center capacity listings are coming soon: query them with source_capacity, or browse https://dchub.cloud/listings. Size is min_kw (in kW) or min_mw (in MW), matched against what a listing can ACTUALLY deliver, not its headline total: `contiguous_kw` (the largest single contiguous block) and `min_contract_kw` (the smallest chunk the provider will contract); a listing that declares neither is matched on its total. Location is region (a region key or alias) or location (free text matched against each listing's region, country, state and metro); market, state, delivery_type and available_by narrow further. Listings are powered land, powered shells, turnkey capacity and colocation to buy or lease, for enterprise and agent-led procurement. Who sees what, and when, in machine-readable form: https://dchub.cloud/api/v1/listings/terms. For multi-step data center or energy questions, start with execute_plan.",
