              "notes": {
                "description": "Anything else the provider should know about the requirement. It travels with the requirement, so leave out anything that identifies your human",
                "type": "string"
              },
              "regions": {
                "description": "Comma-separated regions of interest from north_america, latin_america, europe, asia_pacific and middle_east_africa (aliases emea, apac, latam, americas), e.g. \"europe, apac\"",
