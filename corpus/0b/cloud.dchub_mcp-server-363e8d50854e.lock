        {
          "name": "rank_markets",
          "title": "Rank Markets",
          "description": "Use this when the user wants a ranked list of data-center markets, including where a data center can get grid power (criteria=\"ai_ready\", DCPI): top N by cheapest_power, most_capacity, most_operators, fastest_growing, best_overall, or ai_ready (where new AI load can land, per DCPI). Filter by region, min_capacity_mw. Returns ranked rows with score, MW and a slug for follow-ups; score is the sort value, not a 0-100 scale, and score_basis says what it is (ai_ready omits it and explains its composite in `methodology`). Below full access: a trimmed preview; DCHUB_API_KEY is optional. Ex: \"Top 10 US markets, ai_ready.\" Next: to buy or lease capacity in these markets, call source_capacity; to register a requirement with providers, call request_capacity_intro after your human approves. Returns market slugs to feed get_market_intel and get_market_dcpi_rank. limit 1-500; set projection=identity_only to save tokens. For multi-step data center or energy questions, start with execute_plan.",
