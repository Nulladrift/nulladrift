        {
          "name": "analyze_parcel",
          "title": "Analyze Parcel",
          "description": "Use this when the user has a land parcel for a data center site: structured read of its boundary — pass your own GeoJSON Polygon/MultiPolygon, OR just lat+lon and DC Hub finds the containing parcel in its HOSTED parcel-boundary layer (public county/state GIS polygons, covering a set of priority data-center counties in VA, IL, TX, OH, UT, OR, IA and WY; a point outside it returns parcel_not_covered with the analyze_site preview + the coverage list, never a guess). Returns _entity=parcel_analysis: geodesic total_acres, a per-member acreage breakdown, a contiguous flag, representative_point = the centroid of the LARGEST-area member (never the multi-part geometric center, which can land off-parcel on a highway median or river and poison every point-keyed read), and hosted_parcel {parcel_id, county, state, acres_per_source} when the polygon came from the hosted layer. Also returns a site_evaluation_handoff to pipe into analyze_site + get_water_risk at that anchor. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "capacity_mw": {
                "description": "Optional target load in MW to pass through into the site_evaluation_handoff",
                "type": "number"
              },
              "geometry": {
                "description": "GeoJSON Polygon or MultiPolygon parcel boundary, e.g. {\"type\":\"Polygon\",\"coordinates\":[[[lng,lat],[lng,lat],...]]} — a MultiPolygon carries discontinuous parcels as one envelope. Omit to look up the hosted parcel containing lat/lon instead"
              },
              "lat": {
                "description": "Latitude of a point ON the parcel — used with lon when geometry is omitted to look up the containing parcel from the hosted county/state GIS layer",
                "type": "number"
              },
              "latitude": {
                "description": "Alias for lat — either name works",
                "type": "number"
              },
              "lng": {
                "description": "Alias for lon — either name works",
                "type": "number"
              },
              "lon": {
                "description": "Longitude of a point ON the parcel (used with lat when geometry is omitted)",
                "type": "number"
              },
              "longitude": {
                "description": "Alias for lon — either name works",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {},
            "type": "object"
