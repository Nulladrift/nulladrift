        {
          "name": "set_site_alert",
          "title": "Set Site Alert",
          "description": "Use this when the user wants an email watch on a saved data center site (free with a key) — DC Hub emails you when that site’s DCPI score, grid capacity, or nearby facilities move, so you don’t have to keep re-checking. On the free tier the alert is delivered to your human’s bound email (call bind_email first; notify_email is forced to that address). A paid DC Hub plan can send to any address. The \"monitor my shortlist for me\" loop: call save_site first (it returns a saved_site_id), then set_site_alert on that id. Params: saved_site_id (required integer, from save_site or list_saved_sites), trigger_type (\"dcpi_change\" | \"capacity_change\" | \"new_facility_nearby\", default \"dcpi_change\"), threshold (number — the points/MW move that fires it, default 5), notify_email (required — the address the alert is sent to). Answers \"let me know if anything changes at the site I saved\". Try: set_site_alert saved_site_id=12 trigger_type=dcpi_change threshold=5 notify_email=you@firm.com. Returns {ok, alert_id, message}. Do NOT use to watch a whole MARKET (use set_market_alert) or to save a new site (use save_site); this arms a monitor on ONE already-saved site. For multi-step data center or energy questions, start with execute_plan.",
