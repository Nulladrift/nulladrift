        {
          "name": "set_market_alert",
          "title": "Set Market Alert",
          "description": "Use this when the user wants alerts on a data center market's DCPI power score: subscribes to movement alerts (free with a key) — get notified when its Excess-Power / Constraint score moves. On the free tier, email alerts are delivered to the email your human bound via bind_email (call bind_email first; the destination is forced to that address). Set channel=\"email\". One call: pass `email` (an address your human typed here) with channel=\"email\" and DC Hub binds it to this key first (minting a free key if this session has none), then arms the watch; no separate claim_free_key or bind_email. Alerts send when the market’s verdict flips or its scores move past the threshold, so a quiet market sends nothing. Webhook delivery (channel=\"webhook\" + destination=<https URL>) needs a paid DC Hub plan. Lets an agent MONITOR markets, not just query them. Answers \"tell me when this market moves\", \"ping me if Northern Virginia’s power score changes\". Try: set_market_alert market=northern-virginia channel=webhook destination=https://hooks.example.com/dc. Do NOT use to read a market right now (use get_market_dcpi_rank); this SUBSCRIBES to future movement. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "Delivery channel: \"email\" (free, sent to your bound email) or \"webhook\" (paid plan)",
                "type": "string"
              },
              "destination": {
                "description": "For channel=\"webhook\", the https URL to POST alerts to (paid plan); ignored for email (forced to bound address)",
                "type": "string"
              },
              "email": {
                "description": "Optional, channel=\"email\" only: your human's email, typed by them here. Binds it to the key (a free key is minted if this session has none) and arms the watch in one call",
                "type": "string"
              },
              "market": {
                "description": "Market slug (metro) to watch, e.g. northern-virginia — valid slugs come from rank_markets / get_market_dcpi_rank",
                "type": "string"
