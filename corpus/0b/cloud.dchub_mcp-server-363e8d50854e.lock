              },
              "longitude": {
                "description": "Alias for lon — either name works",
                "type": "number"
              },
              "market": {
                "description": "Alias for utility — either name works (e.g. \"Northern Virginia · Richmond\", \"New York City · Westchester\").",
                "type": "string"
              },
              "min_mw": {
