        {
          "name": "analyze_site",
          "title": "Analyze Site",
          "description": "Use this when the user asks whether a specific site or coordinate works for a data center (lat/lon, or a market name for a market-level read). Returns a 0-100 composite, verdict, power/gas/fiber/market/risk sub-scores, nearby infrastructure and power cost; capacity_mw adds a capacity_context block and does NOT move overall_score. Keyless returns the verdict band and the power band, with the other factors named; a key (DCHUB_API_KEY, optional) adds a few full site reports each month; other scores and figures need a full-access key. Without a key, the first 2 `analyze_site` calls each UTC day from a network return the full site report; after that, no full report until UTC midnight. When a result is partial, show your user the human_message (or for_your_human) text and its link. Ex: \"Score 33.45,-112.07 for 100 MW.\" Next: to buy or lease capacity in these markets, call source_capacity; to register a requirement with providers, call request_capacity_intro after your human approves. Needs BOTH lat and lon in decimal degrees (else missing_coordinates); take them from get_facility or search_facilities. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "candidate_id": {
                "description": "PREFERRED for queue survivors: a cand_… id from get_refined_queue — coordinates come from the FROZEN mint (lat/lon args are ignored; zero transcription drift; expired ids fail closed with candidate_expired).",
                "type": "string"
              },
              "capacity_mw": {
                "description": "Target power load for the build in megawatts (MW), e.g. 100 (typical 50-500)",
                "type": "number"
              },
              "include_fiber": {
                "description": "Include fiber-connectivity analysis (default true)",
                "type": "boolean"
              },
              "include_grid": {
                "description": "Include grid-headroom / substation analysis (default true)",
                "type": "boolean"
              },
              "include_risk": {
                "description": "Include water/drought/climate risk analysis (default true)",
                "type": "boolean"
              },
              "lat": {
                "description": "Site latitude in decimal degrees (-90 to 90; required unless candidate_id or location given), e.g. 33.45",
                "type": "number"
              },
              "latitude": {
                "description": "Alias for lat — either name works",
                "type": "number"
              },
              "lng": {
                "description": "Alias for lon — either name works",
                "type": "number"
              },
              "location": {
                "description": "Market NAME or metro slug instead of coordinates, e.g. \"ashburn\", \"northern-virginia\", \"dallas\". Resolved to that market's PUBLISHED CENTROID through the DCPI market row, and the answer carries a resolved_from block saying so.",
                "type": "string"
              },
              "lon": {
                "description": "Site longitude in decimal degrees (-180 to 180; required unless candidate_id or location given), e.g. -112.07",
                "type": "number"
              },
              "longitude": {
                "description": "Alias for lon — either name works",
                "type": "number"
              },
              "mpp_credential": {
                "description": "Per-call payment (Stripe MPP): the Shared Payment Token for challenges[0]; pays that challenge for this one call. Send it only with your human's explicit approval of the charge.",
                "type": "string"
              },
              "mpp_pay": {
                "description": "Per-call payment quote (Stripe MPP): true returns a signed payment challenge instead of the preview; no money moves. Set it only after your human has explicitly approved paying for this call.",
                "type": "boolean"
              },
              "state": {
                "description": "US state abbreviation (optional) — improves the tax-incentive lookup, e.g. AZ",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "composite_score": {},
              "fiber": {},
              "interpretation": {},
              "limiting_factor": {},
              "location": {},
              "locked": {},
              "nearby": {},
              "overall_score": {},
              "power_cost": {},
              "preview": {},
              "scores": {},
              "site_headline": {},
              "verdict": {}
            },
            "type": "object"
          },
