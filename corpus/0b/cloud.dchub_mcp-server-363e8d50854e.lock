        {
          "name": "get_refined_queue",
          "title": "Get Refined Queue",
          "description": "Use this when you need interconnection queue projects filtered server-side. Instead of pulling the raw queue into context to filter (token-expensive, error-prone), push the predicates to the data layer and get back ONLY the survivors. Filter by min_mw, max_ttp_months (ISO-level avg interconnection wait), iso (comma-union), state (the project's own US state), baseload_only (firm/dispatchable — excludes wind/solar/storage), fuel_type (isolate a specific fuel, e.g. gas or nuclear), and the spatial predicates max_fiber_km + geocoded_only. Answers \"show me 1 GW+ gas projects that can connect in under three years\", \"what is in the queue that actually fits my timeline\". Try: get_refined_queue min_mw=1000 fuel_type=gas max_ttp_months=34 — \"1 GW+ gas in ISOs under 34-month time-to-power.\" NOTE max_ttp_months is a HARD ISO cut (SPP ~24 is the only ISO under 30, so <=30 can return nothing); use >=34 to include MISO/ERCOT/ISO-NE. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "baseload_only": {
                "description": "Keep only firm/dispatchable fuel (nuclear, gas, steam, geothermal, hydro, coal); exclude wind/solar/storage. Firm-vs-intermittent split only — does NOT sub-divide peaker vs combined-cycle gas (no duty-cycle field in the queue).",
                "type": "boolean"
              },
              "developer": {
                "description": "ERCOT only: keep projects whose developer name contains this text (case-insensitive substring, e.g. 'tenaska'). Developer names come from ERCOTQueue (ercotqueue.com, Matt Prusak, CC BY 4.0) joined to ERCOT's own queue by INR; other ISOs…",
                "type": "string"
              },
              "fuel_type": {
                "description": "Isolate a fuel by inclusive substring match on the raw label; comma/semicolon-separated for a union, e.g. 'gas' hits GAS/Natural Gas, 'nuclear,hydro' unions both.",
                "type": "string"
              },
              "geocoded_only": {
                "description": "Keep only survivors that carry lat/lng (~83% of the queue) — the ones with a ready site_evaluation_handoff you can pipe into analyze_site. Default false",
                "type": "boolean"
              },
              "iso": {
                "description": "Restrict to one or more ISOs, comma-separated for a union: PJM, ERCOT, MISO, CAISO, SPP, NYISO, ISONE (ISO-NE). e.g. iso=ERCOT,PJM. Omit for all; combines with max_ttp_months as an intersection",
                "type": "string"
              },
              "limit": {
                "description": "Max results to return (1-500; default varies by tool)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "max_fiber_km": {
                "description": "Keep only survivors within N km of the nearest MAPPED long-haul fiber route endpoint — coarse backbone proximity from a sparse ~260-node dataset over a county-centroid origin, NOT last-mile fiber. Implies geocoded rows only",
                "type": "number"
              },
              "max_ttp_months": {
                "description": "Max time-to-power in months (ISO-level avg interconnection wait; HARD cut keeping projects in ISOs at/under this — PJM ~51, CAISO ~40, ISO-NE ~34, MISO ~34, ERCOT ~33, NYISO ~31, SPP ~24; <=30 leaves only SPP)",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "min_mw": {
                "description": "Minimum project capacity in MW, e.g. 1000 for 1 GW+",
                "type": "number"
              },
              "state": {
                "description": "Restrict to projects in one or more US states, by the project's own state (two-letter code or full name, comma-separated for a union), e.g. state=NV.",
                "type": "string"
              },
              "status": {
                "description": "Queue status filter. Default 'active' = still progressing (excludes withdrawn/cancelled/suspended/in-commercial-operation) — cross-ISO safe (SPP labels live projects 'IA FULLY EXECUTED/ON SCHEDULE' not 'active').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {},
            "type": "object"
