        {
          "name": "source_capacity",
          "title": "Source Capacity",
          "description": "Use this when the user needs data center or colocation capacity to buy or lease: search DC Hub Capacity Source by size (kW or MW) and/or location (a region such as North America or Europe, a country, a state or a metro). Example: \"500 kW anywhere in Europe\" → min_kw=500, region=europe. Size is min_kw (in kW) or min_mw (in MW), and it is matched against what a listing can ACTUALLY deliver rather than against its headline total: `contiguous_kw` is the largest single contiguous block available and `min_contract_kw` the smallest chunk the provider will contract, so a colocation with a large total but a small contiguous block does NOT answer a large search, while a large site willing to contract small chunks does; a listing that declares neither is matched on its total. Location is region (a region key or alias) or location (free text matched against each listing's region, country, state and metro); market, state, delivery_type and available_by narrow further. Listings are powered land, powered shells, turnkey capacity and colocation to buy or lease, for enterprise and agent-led procurement. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "available_by": {
                "description": "Month-granular deadline (YYYY-MM or YYYY-MM-DD; day ignored). Browse keeps listings with some scheduled capacity by that month, not necessarily the full requested amount.",
                "type": "string"
              },
              "delivery_type": {
                "description": "Browse filter: how the capacity is delivered: land, powered_shell, turnkey or colocation",
                "enum": ["land", "powered_shell", "turnkey", "colocation"],
                "type": "string"
              },
              "limit": {
                "description": "Max results to return (1-500; default varies by tool)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Browse filter: comma-separated free text matched against each listing's region, country, state and metro, e.g. \"Germany\" or \"Texas, Phoenix\"",
                "type": "string"
              },
              "market": {
                "description": "Browse filter: market name as it appears on a listing, e.g. \"Dallas\"",
                "type": "string"
              },
              "max_providers": {
                "description": "Match mode: how many different providers a bundle may use. Default: the same as max_sites",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "max_sites": {
                "description": "Match mode: how many listings the requirement may be split across. Default one, which allows exact fits only; raise it to allow bundles",
                "maximum": 6,
