        {
          "name": "execute_plan",
          "title": "Execute Plan",
          "description": "Start here for any data center or energy question. Answers any data center power, grid, interconnection queue, time-to-power, fiber or site question in one call. Pass the user's question unchanged as intent. Returns one dated, cited answer. Covers megawatts and power density, grid headroom and power availability, interconnection queues, substations and transmission, site selection and buildable capacity, colocation and wholesale data-center markets, AI/GPU compute campuses, fiber routes, diversity and latency, PPAs and energy pricing, tax incentives and permitting, water and climate risk, data-center M&A and deals, power generation, gas and energy infrastructure (the Data Center Gas Index, DCGI), and markets scored by the Data Center Power Index (DCPI). Each step is listed with its status, as_of and citation, at your own access level; single-tool questions should call that tool directly, and plan_query shows the plan without running it. Front door for multi-part questions: pass intent unchanged; add market, iso, state or lat/lon when you know them.",
          "inputSchema": {
            "properties": {
              "capacity_mw": {
                "description": "Target capacity in MW, e.g. 100.",
                "type": "number"
              },
              "cohort": {
                "description": "Optional experiment tag for adoption/retention measurement, e.g. \"cohort.front_door\". Has NO effect on routing, planning, geography or results — it is recorded only."
              },
              "compact": {
                "description": "true (default) puts fact_header first in the answer: three lines, SOURCE and AS_OF, ENTITY, SUMMARY with the DCPI verdict when the answer carries one. false returns the answer without it.",
                "type": "boolean"
              },
              "context": {
                "description": "Optional structured hints AND step-arg overrides: {lat, lon, iso, market, capacity_mw, candidate_id, state, since} — user-supplied values beat minted ones. The typed top-level params below are merged into this and WIN on conflict."
              },
              "detail": {
                "description": "\"compact\": the answer, each step's status, dated facts, citations and replay ids, without step bodies. \"full\": every step's full result.",
                "type": "string"
              },
              "intent": {
                "description": "The user's infrastructure question, passed through UNCHANGED. Examples: \"how soon can a 100 MW load get power in ERCOT\" · \"evaluate 100 MW power headroom for a GPU training cluster in PJM\" · \"interconnection queue and energy prices in MISO…",
                "type": "string"
              },
              "iso": {
                "description": "ISO/RTO code to pin geography, e.g. \"PJM\", \"ERCOT\".",
                "type": "string"
              },
              "lat": {
                "description": "Latitude for a specific site.",
                "type": "number"
              },
              "lon": {
                "description": "Longitude for a specific site.",
                "type": "number"
              },
              "market": {
                "description": "Metro slug or name to pin the analysis to, e.g. \"ashburn\". Beats any market the planner would mint.",
                "type": "string"
              },
              "max_fanout": {
                "description": "Max per-finalist fan-out calls for one step, 1-3 (default 2)"
              },
              "max_steps": {
                "description": "Max plan steps to execute, 1-8 (default 6)"
              },
              "state": {
                "description": "US state code, e.g. \"VA\".",
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
