        {
          "name": "generate_site_analysis",
          "title": "Generate Site Analysis",
          "description": "Use this when the user wants a shareable data center Site Analysis PDF for ONE lat/lon (a powered-land parcel, a candidate campus) — the polished client deliverable, not just a score. Example: \"Make the Site Analysis PDF for this parcel, 150 MW, for Example Capital.\" — generate_site_analysis lat=39.04 lon=-77.48 capacity_mw=150 prepared_for=\"Example Capital\" prepared_by=\"Your firm\". Params: lat (-90 to 90, required), lon (-180 to 180, required), capacity_mw (target load MW, e.g. 50-500), prepared_for (client name on the cover), prepared_by (your firm — brands the report; defaults to DC Hub), latency_target (optional metro override; default = nearest real carrier hotel). Returns: {survey:{verdict, power/transmission, gas, water, air-permitting, fiber carriers, latency-to-nearest-carrier-hotel, market, tax}, pdf_report_url}. pdf_report_url is a ready-to-open link to download the branded DC Hub Land & Power Site Analysis PDF — no login needed, valid ~7 days; hand it to your human. For just the numeric suitability score (no PDF), use analyze_site instead. For multi-step data center or energy questions, start with execute_plan.",
