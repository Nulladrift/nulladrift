        {
          "name": "get_gas_index",
          "title": "Gas Index (DCGI)",
          "description": "Use this when the user asks which US states suit gas-fired data center power: the Data Center Gas Index (DCGI), a per-state score. ★ DO NOT COMPARE a DCGI figure published before 2026-08-08 with one published now — they are different indices; the full record is at /api/v1/dcgi/methodology under `corrections`. A state that cannot be priced comes back verdict UNSCORED with dcgi null and an `unscored_reason`, never a placeholder score, so treat UNSCORED as absence and not as a low score. `gas_price_series` names which EIA series answered each state. Gas-fired $/MWh figures, withdrawn the same day for a separate defect, were republished 2026-09-27 under one burner-tip price rule (see get_gas_economics). Every caller gets each state's gas_price in $/MMBtu, EIA survey data (public domain), dated by gas_price_period and gas_price_window and labelled by gas_price_series and gas_price_source; the DCGI score, its two sub-scores and the pipeline counts come with a full-access key. Use get_gas_intelligence for pipeline, operator and parent-midstream data. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "limit": {
