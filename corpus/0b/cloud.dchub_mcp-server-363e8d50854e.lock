        {
          "name": "get_shortlist",
          "title": "Get Shortlist",
          "description": "Use this when the user wants to see a saved data center site shortlist. With refresh=true (default) each site is RE-SCORED against the current national percentile baseline and returns saved_score, current_score, and score_delta_since_saved — so you see whether a site slipped because IT changed or the POPULATION did. The reliable way to maintain a siting campaign across days/weeks. Scoped to your API key. For multi-step data center or energy questions, start with execute_plan.",
