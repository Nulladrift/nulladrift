        {
          "name": "get_permitting_intel",
          "title": "Permitting & Moratorium Intel",
          "description": "Use this when the user asks about data center permitting or moratoriums — curated, HUMAN-VERIFIED jurisdiction records: moratoriums, zoning restrictions, tax changes, utility pauses. Each record is stage-tagged (read the detail prefix: \"Enacted\" / \"Proposed\" / \"Speculative\"), with jurisdiction, state/country, the source article URL, and map coordinates. The permitting-risk axis for site selection that no other machine-readable source serves — e.g. New York's statewide >=50MW moratorium, county-level halts. Full for every caller, no key needed. Answers \"is there a moratorium where I want to build\", \"which jurisdictions just tightened data-center zoning\". Try: get_permitting_intel class=moratorium — or state=MN. class=legislation returns data-center BILL STATUS (Open States): bill_id, stage, last/next action + date, effective_date, impact_tag, official_url, as_of; filter with topic. Rendered live as the Permitting & Zoning layer on https://dchub.cloud/land-power-map. Do NOT use for tax INCENTIVE programs by state (use get_tax_incentives); this tracks restrictions and risk per jurisdiction. For multi-step data center or energy questions, start with execute_plan.",
