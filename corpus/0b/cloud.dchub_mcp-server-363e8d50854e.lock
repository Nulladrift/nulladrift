        {
          "name": "score_facility",
          "title": "Score Facility",
          "description": "Use this when the user wants a 0-100 grade for one existing data center facility across 7 dimensions — power, fiber, water, climate_risk, tax_environment, talent_pool, expansion. Example: \"How does the CoreWeave Las Vegas site score, power-weighted?\" — score_facility facility_id=<id> weighting=power_priority. Params: facility_id or name (required); weighting one of \"balanced\" (default) | \"power_priority\" | \"risk_priority\" | \"expansion_priority\". Returns: composite 0-100, tier_classification, peer comparison, and per-dimension detail. Do NOT use for a raw lat/lon parcel (use analyze_site), to compare 2 or more sites (use compare_sites), or to find similar sites (use find_alternatives). For multi-step data center or energy questions, start with execute_plan.",
