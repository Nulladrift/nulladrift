        {
          "name": "get_infra_projects",
          "title": "Get Infra Projects",
          "description": "Use this when the user asks what gas pipeline or transmission line projects are planned, proposed, approved or under construction — the forward build-out, not the existing network. e.g. \"which interstate gas pipelines are under construction into Louisiana?\", \"what 345 kV transmission projects are planned in PJM by 2030?\", \"what new projects appeared since last month?\". COVERS: (1) natural gas pipeline projects US-wide from the EIA natural gas pipeline projects list (public domain) — operator, status (Announced, Pre-applied, Applied, Approved, Construction, On Hold, Completed), states crossed, capacity in MMcf/d, miles, cost in $M, diameter, FERC/state docket, in-service year; (2) transmission projects from five ISOs' own project lists — ERCOT (TPIT), PJM (RTEP), MISO (MTEP Appendix A), SPP (STEP) and ISO-NE (RSP list); NOT CAISO or NYISO, and not utilities outside those ISOs. Each ISO publishes a different grain (an upgrade or facility, not a whole project), so a row count is a count of upgrades. Answers \"what gas pipelines are being built into Louisiana, how much capacity do they add, and when do they enter service\". Try: get_infra_projects type=gas_pipeline state=LA status=Construction. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "in_service_after": {
                "description": "Only projects entering service on or after this date (YYYY-MM-DD or YYYY). Gas compares the in-service year; transmission the actual, else projected, in-service date",
                "type": "string"
              },
              "in_service_before": {
                "description": "Only projects entering service on or before this date (YYYY-MM-DD or YYYY)",
                "type": "string"
              },
              "include_delisted": {
                "description": "Also return projects the latest source release no longer lists (completed, withdrawn or dropped). Default false",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results to return (1-500; default varies by tool)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_capacity": {
                "description": "Gas only: minimum pipeline capacity in million cubic feet per day (MMcf/d), e.g. 1000. With type=all it narrows to gas projects",
                "type": "number"
              },
              "min_kv": {
                "description": "Transmission only: minimum voltage in kilovolts (kV), e.g. 345. With type=all it narrows to transmission projects",
                "type": "number"
              },
              "new_since": {
                "description": "Only projects DC Hub first saw on or after this date (YYYY-MM-DD). The initial backfill is never counted as new",
                "type": "string"
              },
              "state": {
                "description": "US state abbreviation, e.g. TX or LA. Gas projects match any state they cross; transmission projects are all TX",
                "type": "string"
              },
              "status": {
                "description": "Status, case-insensitive; comma list allowed. Gas: Announced, Pre-applied, Applied, Approved, Construction, On Hold, Completed. Transmission: Planned, Conceptual, Under Construction, Completed, Cancelled",
                "type": "string"
              },
              "type": {
                "description": "Which project list: gas_pipeline (EIA, US-wide), transmission (ERCOT TPIT, Texas only) or all (default)",
