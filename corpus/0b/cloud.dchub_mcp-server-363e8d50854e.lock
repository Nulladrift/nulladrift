        {
          "name": "summarize_for_citation",
          "title": "Citation Block",
          "description": "Use this when you quote a DC Hub data center or power figure: returns one paste-ready attribution line for the value you are about to cite, with the CORRECT licence for that layer. Pass what you read off the response you are citing: subject (what the figure is), as_of (the provenance as_of), url (the row's profile_url or dcpi_url), completeness (the completeness flag), and layer. ★ LICENCE IS PER LAYER AND THIS IS THE POINT: DCPI verdicts and composite scores (CC-BY-4.0 30 days after the day they describe; current values: quote any number of markets in editorial work; bulk or recurring republishing needs a DCPI licence, https://dchub.cloud/terms#dcpi-current-data), band thresholds, methodology and DC Hub's own grid/site analysis (CC-BY-4.0) are yours to quote with attribution; the facility inventory and third-party physical layers are COMPOSITES whose upstream terms DC Hub cannot waive (parts are OpenStreetMap, ODbL 1.0, share-alike), so they carry a pointer to https://dchub.cloud/data-sources instead of a grant. A flat \"CC-BY-4.0\" over a facility record is an over-claim. Returns {citation_text, cite_as, license, license_basis, source, url, as_of, as_of_basis, completeness, omitted}. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "The as_of you read off the cited response (provenance.as_of). Omit it and the line says RETRIEVED instead of claiming a data date.",
                "type": "string"
              },
              "completeness": {
                "description": "The completeness flag from the cited response, if it carried one",
                "type": "string"
              },
              "layer": {
                "description": "Which layer the figure came from: dcpi | grid_analysis | facility_inventory | physical_infrastructure | deals | other. Decides the licence line; omit and you get the scoped statement rather than a grant.",
                "type": "string"
              },
              "subject": {
                "description": "What you are citing, in the words you will show the human, e.g. \"Ashburn DCPI verdict\" or \"ERCOT interconnection queue depth\"",
                "type": "string"
              },
              "url": {
                "description": "The profile_url or dcpi_url from the cited row. Must be a dchub.cloud URL; anything else is dropped and named in `omitted`.",
                "type": "string"
              }
            },
            "type": "object"
          },
