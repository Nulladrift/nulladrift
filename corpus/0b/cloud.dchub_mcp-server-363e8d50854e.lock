        {
          "name": "execute_plan",
          "title": "Execute Plan",
          "description": "Use this when a data center question spans several topics: one-call planner over grid headroom and power availability, interconnection queues, PPAs and energy pricing, power generation, gas and energy infrastructure (the Data Center Gas Index, DCGI), substations and transmission, megawatts and power density, site selection and buildable capacity, colocation and wholesale data-center markets, AI/GPU compute campuses, fiber routes, diversity and latency, tax incentives and permitting, water and climate risk, data-center M&A and deals. Recommended entry for a question that spans more than one of those: it picks and chains the right tools and returns one dated, cited answer. Pass the user's question as `intent`. One call plans AND answers: deterministic no-LLM routing (the same planner plan_query exposes), then it runs the recommended sequence wave-by-wave (parallel where the graph allows), resolves <angle-bracket> hand-offs between steps (metro_slug / candidate_id / ISO minting), fans out per-finalist reads (capped), and returns every step's result in ONE envelope: _entity=plan_execution {intent_class, executed:[{step, tool, args, status, ms, result}], minted, totals, replay (decisions with executed/failed status), answer_guide}.",
          "inputSchema": {
            "properties": {
              "capacity_mw": {
                "description": "Target capacity in MW, e.g. 100.",
                "type": "number"
              },
              "cohort": {
                "description": "Optional experiment tag for adoption/retention measurement, e.g. \"cohort.front_door\". Has NO effect on routing, planning, geography or results — it is recorded only."
              },
              "context": {
                "description": "Optional structured hints AND step-arg overrides: {lat, lon, iso, market, capacity_mw, candidate_id, state, since} — user-supplied values beat minted ones. The typed top-level params below are merged into this and WIN on conflict."
              },
              "intent": {
                "description": "The user's infrastructure question, passed through UNCHANGED. Examples: \"how soon can a 100 MW load get power in ERCOT\" · \"evaluate 100 MW power headroom for a GPU training cluster in PJM\" · \"interconnection queue and energy prices in MISO…",
                "type": "string"
              },
              "iso": {
                "description": "ISO/RTO code to pin geography, e.g. \"PJM\", \"ERCOT\".",
                "type": "string"
              },
              "lat": {
                "description": "Latitude for a specific site.",
                "type": "number"
              },
              "lon": {
                "description": "Longitude for a specific site.",
                "type": "number"
              },
              "market": {
                "description": "Metro slug or name to pin the analysis to, e.g. \"ashburn\". Beats any market the planner would mint.",
                "type": "string"
              },
              "max_fanout": {
                "description": "Max per-finalist fan-out calls for one step, 1-3 (default 2)"
              },
              "max_steps": {
                "description": "Max plan steps to execute, 1-8 (default 6)"
              },
              "state": {
                "description": "US state code, e.g. \"VA\".",
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
