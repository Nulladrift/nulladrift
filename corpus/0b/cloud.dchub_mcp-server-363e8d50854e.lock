        {
          "name": "get_power_availability_timeline",
          "title": "Get Power Availability Timeline",
          "description": "Use this when the user asks when power will be available, or about time-to-power, in a US state: year by year. Composes: new generation coming online from EIA-860M monthly, split by confidence class (under-construction vs planned vs testing — never blended); scheduled retirements as dated subtractions; LBNL interconnection-queue depth as congestion context (NO delivery dates — the feed has none and most queued MW never completes). The one derived number, cumulative_firm_signal_mw, counts ONLY under-construction+testing minus retirements — speculative permitting-stage MW is shown but never folded in. Answers \"when is new capacity landing in Ohio\", \"what comes online in Georgia by 2027\" with dated, sourced, per-lane-vintaged numbers. HONESTY LINE: supply-side signals, not a load-interconnection promise — generation ≠ deliverable load, and utility study timelines / large-load tariff processes / substation-grain delivery are declared out of coverage in constraint_coverage rather than estimated. Try: get_power_availability_timeline state=OH. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "mw": {
                "description": "Optional target MW for CONTEXT ONLY — echoed back with an explicit note; never converted into an energize-by date, which this data cannot honestly state",
                "type": "number"
              },
              "state": {
                "description": "2-letter US state code (required), e.g. OH, GA, TX — the timeline grain; a state can span ISOs and the response reports ISO membership as context",
                "type": "string"
              },
              "years": {
                "description": "Window in years from now, 1-6 (default 5)",
                "type": "number"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {},
            "type": "object"
