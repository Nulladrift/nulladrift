        {
          "name": "register_standing_intent",
          "title": "Register Standing Intent (webhook push)",
          "description": "Use this when the user wants a webhook when data center deals change: Register a STANDING QUERY with webhook push — DC Hub POSTs an HMAC-signed webhook to YOUR https URL whenever matches grow (push, not poll: \"notify my orchestrator on any new deal in Columbus\"). Requires a key. Params: kind (\"new_deal_in_market\" watches deals in the market param · \"news_keyword\" watches news matching q · \"permitting_change\" watches published permitting intel AND bill status changes on data-center bills, optionally per state; scope=records|legislation keeps one, topic narrows to bills with that impact tag), market / q / state (the watch parameter for the chosen kind), webhook_url (your public HTTPS endpoint — private/internal hosts are rejected). Answers \"notify my system whenever a new moratorium appears\", \"push me new matches instead of making me poll\", \"tell my orchestrator when a deal lands in Columbus\". Try: register_standing_intent kind=news_keyword q=moratorium webhook_url=https://hooks.example.com/dchub. kind=\"capacity\" instead registers a standing CAPACITY REQUIREMENT with DC Hub Capacity Source (no webhook_url): target_mw or target_kw, markets / states / regions / countries (comma-separated), optional… For multi-step data center or energy questions, start with execute_plan.",
