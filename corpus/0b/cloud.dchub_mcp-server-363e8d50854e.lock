        {
          "name": "ai_capacity_index",
          "title": "AI Capacity Index",
          "description": "Use this when the user asks where AI compute capacity could land: ranks data center markets by where 100MW of AI training capacity can land in the next 30/60/90 days. Returns top markets with facility_count, operator_count, deployable_mw estimate (megawatts), hyperscale_ready flag, rack power density and cooling-type signals where facility data carries them, and composite score (depth + diversity + power). Refreshed Fridays 14:00 UTC. Use for AI capex planning, GPU cluster siting, hyperscaler deal forecasting. For grid power availability use DCPI (rank_markets ai_ready). Do NOT use for a general best-markets ranking (use rank_markets) or forward grid-emergence (use grid_transition_radar). Next: to buy or lease capacity in these markets, call source_capacity; to register a requirement with providers, call request_capacity_intro after your human approves. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "horizon": {
                "description": "Deployment horizon in days: 30, 60, or 90 (default 90)",
                "maximum": 90,
                "minimum": 30,
                "type": "integer"
              },
              "limit": {
                "description": "Number of top markets to return (default 20)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {},
            "type": "object"
          },
