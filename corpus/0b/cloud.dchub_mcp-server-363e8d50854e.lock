        {
          "name": "find_sites",
          "title": "Find Sites",
          "description": "Use this when the user has no data center site yet and wants candidate search areas (site selection by substation voltage, gas and fiber distance); execute_plan covers a multi-part siting question. THE INVERSE QUERY: every other DC Hub siting tool needs a coordinate you already have — analyze_site scores one, get_composite_site_score grades one, rank_sites orders candidates YOU already enriched, find_alternatives needs a seed facility. This one answers \"where should I even be looking?\". Returns candidate SEARCH AREAS anchored on real HIFLD substations at or above min_voltage_kv, spatially de-duplicated by cluster_km so a dense metro yields distinct areas instead of 40 near-identical rows, each carrying measured distance to the nearest gas pipeline and fiber route plus state-grain moratorium context, and a next_calls handoff. Answers \"where should I even be looking for 200 MW in Ohio\" and \"which areas near Dallas sit on 230kV with gas within 5 miles\". Try: find_sites state=OH min_voltage_kv=230 max_gas_km=8 — or find_sites lat=39.04 lon=-77.48 radius_km=60 min_voltage_kv=500. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "cluster_km": {
                "description": "Collapse anchors within this many km into one candidate area (default 8, max 100). Raise it for broader coverage, lower it for denser results",
                "type": "number"
              },
              "exclude_moratorium": {
                "description": "true = drop candidates in a state with a published data-center moratorium. STATE grain, not jurisdiction grain",
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude of a search centre, e.g. 39.04 — use with lon (+ radius_km) instead of state",
                "type": "number"
              },
              "latitude": {
                "description": "Alias for lat — either name works",
                "type": "number"
              },
              "limit": {
                "description": "Max results to return (1-500; default varies by tool)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Alias for lon — either name works",
                "type": "number"
              },
              "lon": {
                "description": "Longitude of a search centre, e.g. -77.48",
                "type": "number"
              },
              "longitude": {
                "description": "Alias for lon — either name works",
                "type": "number"
              },
              "max_fiber_km": {
                "description": "Drop candidates farther than this from the nearest fiber route (CHORD approximation — see fiber_distance_basis). Applied ONLY if the fiber layer answers",
                "type": "number"
              },
              "max_gas_km": {
                "description": "Drop candidates farther than this from the nearest gas pipeline. Applied ONLY if the gas layer answers — check constraint_coverage",
                "type": "number"
              },
              "min_voltage_kv": {
                "description": "Only anchor on substations at or above this voltage in kV (default 115). 230+ for hyperscale, 500 for the largest campuses",
