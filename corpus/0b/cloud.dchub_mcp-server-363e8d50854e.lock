        {
          "name": "get_grid_intelligence",
          "title": "Grid Intelligence",
          "description": "Use this when the user asks about grid capacity, power availability, headroom or time-to-power in a US ISO (PJM, ERCOT, CAISO, MISO, SPP, NYISO, ISO-NE) or a market's grid. Returns live demand, fuel mix, queue depth, DCPI excess-power and constraint scores, time-to-power, reserve margin. avg_time_to_power_months and avg_queue_wait_months are DIFFERENT measurements; quote the one you mean. Can be scoped to a data center market or site: execute_plan pairs the grid with that place's facilities, capacity and markets. Below full access: a trimmed preview; DCHUB_API_KEY is optional. Ex: \"PJM headroom for 200 MW?\" iso must be a US ISO (ERCOT, PJM, CAISO, MISO, SPP, NYISO, ISO-NE); other codes return region_not_covered. For multi-step data center or energy questions, start with execute_plan.",
