        {
          "name": "claim_free_key",
          "title": "Claim Free Key",
          "description": "Use this when the user wants more DC Hub data center data than keyless allows, or asks for a key; no key is needed to start. Mints a free key and returns it plus connect_url, a connector URL with the key embedded (the only thing hosted chat clients keep). Free key: previews plus 2 full answers per tool per day. WHAT AN EMAIL GETS (free, no card): 50 calls/day (up to 10 full answers per tool per day); 10 full answers a day each on the grid, queue and market-intel tools instead of previews; a weekly summary of what your key looked up (unsubscribe anytime); a key that can be recovered (recover_my_key re-sends it to that inbox). Ask the user for an email first; pass it only if they typed it. Save and reuse the key (lost one: recover_my_key); don't re-mint. Then ask the real question (execute_plan for multi-step). If a call was answered with a sign-in challenge (401 WWW-Authenticate), prefer signing in: that identity persists, but a human must finish it in a browser. No challenge (Claude Code, Cursor, most agents) means OAuth is not available to you and the key is right. Ex: \"Set me up with a DC Hub key.\" For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "client_name": {
                "description": "Your agent/app name for attribution, e.g. \"Claude Desktop\" or \"acme-siting-bot\"",
                "type": "string"
              },
              "email": {
                "description": "Optional owner email to make the key recoverable across sessions; use only an address your human explicitly gave",
                "type": "string"
              }
            },
            "type": "object"
