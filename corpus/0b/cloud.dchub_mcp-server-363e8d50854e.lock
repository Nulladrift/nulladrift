        {
          "name": "accept_capacity_terms",
          "title": "Accept Capacity Terms",
          "description": "Use this when the user has read and agreed to DC Hub's capacity introduction terms (https://dchub.cloud/listings#terms): records that acceptance, once per terms version, so Capacity Source listing details open for them. Call it when source_capacity returns a listing locked with access.reason terms_acceptance_required, never on your own judgement: nothing opens without your human's agreement. Requires an identified caller (get_api_key, then bind_email with your human's address, or an OAuth connection) and accept_terms=true. Returns accepted and the terms version, recorded in DC Hub's lead register. Do NOT use to request an introduction (use request_capacity_intro) or to browse listings (use source_capacity). For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "accept_terms": {
                "description": "Set true ONLY after your human has read and agreed to the introduction terms at https://dchub.cloud/listings#terms. Unless it is exactly true, nothing is sent",
                "type": "boolean"
              },
              "terms_version": {
                "description": "The terms version your human agreed to, e.g. access.unlock.terms.version from source_capacity. Omit to send the version currently published",
