        {
          "name": "get_retirement_headroom",
          "title": "Get Retirement Headroom",
          "description": "Use this when the user asks where retiring power plants free grid capacity: scans EIA-860M retirements to find near-term transmission grid headroom — a retiring plant is a CONCRETE headroom event (its POI frees injection capacity), from FILED data, not forecasts. Returns _entity=retirement_headroom_results: retiring generators inside your horizon (name, MW, fuel, prime mover, retirement_date), representative_point, nearest substations with distance_km + count within 25 km, county-level queue_pressure (competing in-progress MW), iso_context (the generator's own EIA balancing-authority code), and a pre-filled site_evaluation_handoff (analyze_site + get_water_risk args, capacity_mw = YOUR target load). Answers \"where is grid capacity about to free up\", \"which retiring plants open injection headroom near me\". Try: get_retirement_headroom target_mw=50 horizon_months=18 region_iso=MISO — \"50 MW opening near a substation inside 18 months, sidestepping the 4-7yr mega-queue.\" Honesty: meta.caveat flags that filed dates are subject to ISO reliability reviews (RMR extensions). Use to find WHERE capacity opens next; for what's already queued use get_refined_queue; for one site use analyze_site. For multi-step data center or energy questions, start with execute_plan.",
          "inputSchema": {
            "properties": {
              "fuel_filter": {
                "description": "Optional filter for retiring fuel categories, substring-matched (e.g., 'Coal', 'Natural Gas', 'Petroleum').",
                "type": "string"
              },
              "horizon_months": {
                "description": "Time horizon in months to look ahead for planned retirements, 1-120 (e.g., 12, 18, 36).",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Max results to return (1-500; default varies by tool)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "region_iso": {
                "description": "Optional target region or ISO (e.g., 'MISO', 'PJM', 'ERCOT', 'SPP', 'CAISO', 'NYISO', 'ISONE'). Matches the generator's own EIA balancing-authority code — real market boundaries, not state lines. Comma-separated for a union.",
                "type": "string"
              },
              "target_mw": {
                "description": "Minimum required headroom in megawatts (MW) — filters to retiring generators at/above this size. Also passed through as the handoff's analyze_site capacity_mw (the DC you are siting).",
                "type": "number"
              }
            },
            "required": ["horizon_months", "target_mw"],
            "type": "object"
