        {
          "name": "semantic_search",
          "title": "Semantic Search",
          "description": "Use this when a data center or energy question is conceptual or fuzzy and keyword filters fall short — semantic (meaning-based) retrieval across DC Hub's industry news, M&A deals, the global facility map, per-market DCPI deep-dive narratives, press releases, announcements, permitting intel, construction permits, tax incentives and the capacity pipeline, ranked by relevance with citable source fields (news url/title, deal parties/value, facility name/location, deep-dive market/url). Examples: \"what is happening with behind-the-meter gas for AI data centers?\", \"deals involving nuclear power for hyperscalers\", \"why is Northern Virginia constrained?\" — semantic_search q=\"behind-the-meter gas for AI data centers\". Params: q (required, natural-language query); corpus (optional CSV subset of news_articles,deals,facilities,market_narratives,press_releases,announcements,permitting_intel,construction_permits,tax_incentives,capacity_pipeline; default all); k (1-15, default 8). Returns {results:[{source_table, kind, text, score, cite:{…}}]}; score is 0-1 relevance, not a DCPI score. For multi-step data center or energy questions, start with execute_plan.",
