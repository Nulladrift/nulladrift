          "description": "Use this when the user asks what a data-center deal means for power: deal flow with each market's DCPI verdict — \"what is the real play?\". Returns recent deals (buyer, seller, value, market) + each market DCPI verdict and time-to-power; with a full-access key, the per-deal autopsy read (long-dated land/power option vs near-term build vs queue gamble). Progressive disclosure to keep the default cheap: by default each read ships only a comparables COUNT (the verdict text is always included); pass comparables=\"summary\" for the top-2 grounding signals, or comparables=\"full\" to expand the complete cited set for a deal you're drilling into. Answers \"who is actually buying data centers right now, and are those markets any good\", \"what is the real play behind this deal\". Try: deal_autopsy limit=15. For multi-step data center or energy questions, start with execute_plan.",
