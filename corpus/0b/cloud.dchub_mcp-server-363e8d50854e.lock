                "type": "string"
              },
              "countries": {
                "description": "Comma-separated countries of interest, e.g. \"Germany, Netherlands\"",
                "type": "string"
              },
              "markets": {
                "description": "Comma-separated markets of interest, e.g. \"Dallas, Phoenix\"",
                "type": "string"
