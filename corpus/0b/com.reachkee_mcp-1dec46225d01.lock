{
  "lockfileVersion": 2,
  "subjects": {
    "com.reachkee/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.reachkee.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "reachkee",
        "title": "ReachKee",
        "version": "1.5.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ReachKee B2B people/company search, filter resolution, email lookup (single + batch), profile/company enrichment and AI lead scoring. Authenticate with your MCP API key (mk_...) or card number via Authorization: Bearer <card_no> (or card_no tool argument). Typical flow: parse_icp (free) turns an ideal-customer description into filter suggestions; resolve_filter (free) turns each filter value into search filter IDs with a ready-to-paste filter_snippet; search_leads / search_companies run instant one-page searches (1 credit per successful page of 25 with results; same query+page within 24h is free). query_email finds one person's email (charged email_cost only when found; slow, 30-120s); bulk_query_email queues up to 50 people (charged only per found email; poll get_bulk_email_results with the returned job_id). enrich_profile returns one person's full profile (1 credit per success; repeat within 24h is free). enrich_company returns full company details (free, same as the web app; cached 24h). score_rows AI-scores up to 25 rows against your ideal-customer description (1 credit per call, charged only when at least one row is scored). create_search_task runs large multi-page background searches (check get_task for queue and ETA). card_status is free. One balance shared with the web app. Pricing: https://reachkee.com/pricing",
      "tools": [
        {
          "name": "bulk_query_email",
          "title": "Batch email lookup (up to 50 people)",
          "description": "Start a background email lookup batch for up to 50 people. Provide profile_urns (from search_leads rows) and/or profile_urls. Deliberately slow (3-8s between people; up to 1-2 min per person worst case). Billing: email_cost credits charged ONLY per person whose email or phone is actually found. Returns job_id - poll get_bulk_email_results. One active batch per card.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "profile_urls": {
                "description": "Public profile page URLs",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "profile_urns": {
                "description": "profile_urn values from search_leads rows",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10400984856384b2d15406d68ba65d58786e27569c8119171b1c3ec3933794e2"
        },
        {
          "name": "card_status",
          "title": "Check card status and balance",
          "description": "Free. Returns status, remaining credits and usage limits of the authenticated card.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization header)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dc555ff05a50e35396851e0c6c973f61fb31a88cce074739c34c990b25340021"
        },
        {
          "name": "create_search_task",
          "title": "Create background search task",
          "description": "Create a background B2B search task (people or company). Pages are fetched slowly in the background under strict rate limits. Credits are frozen upfront and settled by actual rows fetched. Returns the task plus queue position and ETA (hours).",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "page_from": {
                "description": "First page (default 1)",
                "type": "integer"
              },
              "page_size": {
                "description": "Rows per page, max 100 (default 25)",
                "type": "integer"
              },
              "page_to": {
                "description": "Last page (default = page_from)",
                "type": "integer"
              },
              "query": {
                "description": "Sales-style filter string, e.g. (filters:List((type:CURRENT_COMPANY,values:List((id:123,text:Acme,selectionType:INCLUDED)))))",
                "type": "string"
              },
              "task_type": {
                "description": "Search type",
                "enum": ["people", "company"],
                "type": "string"
              },
              "title": {
                "description": "Optional task title",
                "type": "string"
              }
            },
            "required": ["query", "task_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b1ab0bf8ab8c52f615ef5381ad8baa4784b24961f4d2c83fd7596ec372cee54"
        },
        {
          "name": "enrich_company",
          "title": "Get full company details",
          "description": "Fetch full details of one company found by search_companies: description, website, industry, headquarters, employee count and growth, revenue range, specialties, type, year founded. Input: company_id / company_urn / link from a search_companies row. Billing: free, same as company details in the web app (results cached for 24h).",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "company_id": {
                "description": "Numeric company id, e.g. \"2382910\"",
                "type": "string"
              },
              "company_urn": {
                "description": "company_urn value from a search_companies row",
                "type": "string"
              },
              "link": {
                "description": "Company link containing /company/<id>",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8304eb9e75513a6f770d78735e2a3b02c3611f4d9e0c0d516e508cfb7ab7346e"
        },
        {
          "name": "enrich_profile",
          "title": "Get full profile for one person",
          "description": "Fetch the complete public profile of one person found by search_leads: headline, about summary, positions (experience), educations, skills, languages, public contact info (emails/phones/websites), connection count and the real public profile URL. Input is the profile_urn field from a search_leads row. Billing: 1 credit per successful fetch; repeating the same person within 24h is free (cached). Takes 5-30 seconds.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "profile_urn": {
                "description": "profile_urn value from a search_leads row, e.g. urn:li:fs_salesProfile:(ACwAA...,NAME_SEARCH,abcd)",
                "type": "string"
              }
            },
            "required": ["profile_urn"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c8f80a625116e8210faf4ef6c90afd08eed34fca0e61d5b176bb85f1ef8ca398"
        },
        {
          "name": "get_bulk_email_results",
          "title": "Get batch email lookup results",
          "description": "Free. Get status and per-person results of a bulk_query_email job. Jobs expire 24h after creation and the in-memory queue is lost on server restart (credits are only charged per found email, so nothing is lost financially).",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization header)",
                "type": "string"
              },
              "job_id": {
                "description": "Job id returned by bulk_query_email, e.g. be_1a2b3c4d5e6f",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4f8590da47bb0b5e01e83985146f04d7b618aafb00119297ff506a30582cc598"
        },
        {
          "name": "get_task",
          "title": "Get task status",
          "description": "Get one task: status, progress, billing (frozen/charged), queue position and ETA. Does not return result rows (use get_task_results).",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization header)",
                "type": "string"
              },
              "task_id": {
                "description": "Task id, e.g. t_8a67cd3548bc",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:91692c7f63b4721a987474df3fb81fdcd0cde02d71a5ef9c125708aafbf1c16a"
        },
        {
          "name": "get_task_results",
          "title": "Get task results",
          "description": "Get kept result rows of a task (paginated). Rows are simplified: name/title/company/location/email/link/page.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization header)",
                "type": "string"
              },
              "limit": {
                "description": "Max rows to return, up to 200 (default 50)",
                "type": "integer"
              },
              "offset": {
                "description": "Row offset (default 0)",
                "type": "integer"
              },
              "task_id": {
                "description": "Task id",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fc3602b7e01954f58d0f1440b3e7c5d14228fdef14aa6fa83f6bc7460818ebfd"
        },
        {
          "name": "list_tasks",
          "title": "List my tasks",
          "description": "List all tasks for this card with status, progress and usage snapshot.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization header)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f76035d639019e9797e996f331636b90ebf413627385d103465f86278ad52cf8"
        },
        {
          "name": "parse_icp",
          "title": "Parse ideal-customer description into search suggestions",
          "description": "Free. Turn a natural-language description (any language) of your ideal customer or candidate into structured suggestions: entity_type (people/company), scoring dimensions, and search filter suggestions (industry, geography, titles, company size, ...). Use the output to compose keywords/query for search_leads, search_companies or create_search_task.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "description": {
                "description": "One-paragraph description of the ideal customer/candidate, e.g. \"medical device purchasing managers in Australia\" or \"Shanghai-based senior semiconductor recruiters\"",
                "type": "string"
              },
              "entity_type": {
                "description": "Optional: people = find persons, company = find companies (auto-detected when omitted)",
                "enum": ["people", "company"],
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:769e507acb36b23e83c3a3e07aad6fda6ee3992953b5363e9c91c889c5d375da"
        },
        {
          "name": "query_email",
          "title": "Find email for one person",
          "description": "Look up email addresses (plus phones and social links) for one person. Provide profile_url OR profile_urn (the profile_urn field returned by search_leads rows). Optional first_name/last_name/company improve matching. Billing: charged email_cost credits only when an email or phone is actually found; no result = no charge. Slow: can take 30-120 seconds.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "company": {
                "description": "Optional company name (improves matching)",
                "type": "string"
              },
              "first_name": {
                "description": "Optional first name (improves matching)",
                "type": "string"
              },
              "last_name": {
                "description": "Optional last name (improves matching)",
                "type": "string"
              },
              "profile_url": {
                "description": "Public profile page URL of the person",
                "type": "string"
              },
              "profile_urn": {
                "description": "profile_urn value from a search_leads row, e.g. urn:li:fs_salesProfile:(ACwAA...,NAME_SEARCH,abcd)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:675589d1b02213559b9995c9afee15fe6b7bfeb42607a76dd82be16dcd772b97"
        },
        {
          "name": "resolve_filter",
          "title": "Resolve filter text to search filter IDs",
          "description": "Free. Turn a human filter value (region \"Shanghai\", industry \"Medical Device\", title \"CEO\", company \"Siemens\", ...) into search filter options with IDs, plus a ready-to-paste filter_snippet for the query parameter of search_leads / search_companies / create_search_task. Combine snippets like: (filters:List(SNIPPET,SNIPPET),keywords:...,spellCorrectionEnabled:true).",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "filter_type": {
                "description": "Which filter to resolve",
                "enum": ["REGION", "INDUSTRY", "CURRENT_COMPANY", "PAST_COMPANY", "TITLE", "COMPANY_SIZE", "SENIORITY", "FUNCTION", "SCHOOL"],
                "type": "string"
              },
              "text": {
                "description": "The value to resolve, e.g. \"Shanghai\" / \"Medical Device\" / \"CEO\". Optional for enum-like types (INDUSTRY, COMPANY_SIZE, SENIORITY, FUNCTION): omit to list all options.",
                "type": "string"
              }
            },
            "required": ["filter_type"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9af2d5ac4a53f9c27920d7e6d8b09c41fd2f1efab5245e3d39e68738dee5032f"
        },
        {
          "name": "score_rows",
          "title": "AI-score rows against your ICP",
          "description": "Score up to 25 rows against your ideal-customer profile with AI. Billing: 1 credit per call (up to 25 rows, same as AI scoring in the web app), charged only when at least one row is scored. Provide icp_description (any language) - or reuse the dimensions array returned by a previous call to skip re-parsing - plus rows like {name,title,company,location,summary}. Returns 0-100 score, verdict, confidence and a one-line reason per row. Takes a few seconds per row.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "dimensions": {
                "description": "Optional: dimensions from a previous score_rows/parse_icp result (skips re-parsing)",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "entity_type": {
                "description": "Optional, default people",
                "enum": ["people", "company"],
                "type": "string"
              },
              "icp_description": {
                "description": "One-paragraph ideal-customer/candidate description",
                "type": "string"
              },
              "locale": {
                "description": "Language of reasons (default zh)",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "rows": {
                "description": "1-25 rows: {name,title,company,location,summary}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a2658244fe3c005c3f84efec557e6e692ced3e3696d35e265b3a6529d1cff7d1"
        },
        {
          "name": "search_companies",
          "title": "Search companies (accounts) now",
          "description": "Instant B2B company (accounts) search, returns one page of 25 rows synchronously. Give free-text keywords OR a full Sales-style query string. Billing: 1 credit per successful page with results; the same query+page repeated within 24h is served from cache for free.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "keywords": {
                "description": "Free-text keywords, e.g. \"solar energy manufacturer germany\"",
                "type": "string"
              },
              "page": {
                "description": "1-based page number (default 1), 25 rows per page",
                "type": "integer"
              },
              "query": {
                "description": "Full Sales-style filter string (overrides keywords), e.g. (filters:List((type:INDUSTRY,values:List((id:112,text:Renewables,selectionType:INCLUDED)))),spellCorrectionEnabled:true)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:19ee698cf48ebdda49801797a57e53fee427b42bbe756ff8c426fc997be9113c"
        },
        {
          "name": "search_leads",
          "title": "Search people (leads) now",
          "description": "Instant B2B people (leads) search, returns one page of 25 rows synchronously. Give free-text keywords OR a full Sales-style query string. Billing: 1 credit per successful page with results; the same query+page repeated within 24h is served from cache for free.",
          "inputSchema": {
            "properties": {
              "card_no": {
                "description": "Card number (optional if provided via Authorization: Bearer header)",
                "type": "string"
              },
              "keywords": {
                "description": "Free-text keywords, e.g. \"medical device ceo australia\"",
                "type": "string"
              },
              "page": {
                "description": "1-based page number (default 1), 25 rows per page",
                "type": "integer"
              },
              "query": {
                "description": "Full Sales-style filter string (overrides keywords), e.g. (filters:List((type:CURRENT_COMPANY,values:List((id:123,text:Acme,selectionType:INCLUDED)))),keywords:ceo,spellCorrectionEnabled:true)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2d557ca375fb8da6d81d14c3ab60369a415e7aa67e2af4fd4a3a721e9d25585"
        }
      ],
      "digest": "sha256:d5ad35a9cd9d49e074ad62e749e72bf69d69ed9809b41feca0505a9b0946e949"
    }
  }
}
