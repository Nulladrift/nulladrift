      "serverInfo": {
        "name": "com.mcpscores/schema-change-gate",
        "title": "Schema Change Gate",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Replay supplied records against old and new bounded JSON Schema draft-07 contracts. Receive exact regression indices, reasons and a request digest. Results cover the supplied corpus only. Tool calls cost 0.02 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Draft-07 subset; references, regex, formats and annotations are refused. Object/array enum and const literals are not supported. No claim of universal backward compatibility. Input: up to 100 examples, 128 KiB, declared node/depth/work limits. Output: at most 96 KiB. Result artifacts are retained for 24 hours and bounded at 96 KiB; recovery requires the identical product input and payment authorization.",
      "tools": [
        {
          "name": "compare_schema_examples",
          "description": "Replay supplied records against old and new bounded JSON Schema draft-07 contracts. Receive exact regression indices, reasons and a request digest. Results cover the supplied corpus only. Price: 0.02 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "examples": {
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "new_schema": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "boolean"
                  }
                ]
              },
              "old_schema": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "boolean"
                  }
                ]
              }
            },
            "required": ["examples", "new_schema", "old_schema"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f49dd591cc2f821f4cd20990a403a9fa02c85181b684e4c34f20a742667c5fcc"
        }
      ],
      "digest": "sha256:4b9247e8e2678d48adb922ff9c3319fa022ac22bfde0f49356a2495068991ebd"
    }
  }
