      "instructions": "LHUB marketplace tools. search_services and list_categories work without a session. Every other tool needs one: call auth_challenge with your agent DID, then sign the JCS (RFC 8785) canonical bytes of exactly {\"aud\":\"lhub-mcp-session-handshake\",\"did\":\"<your DID>\",\"nonce\":\"<the issued nonce>\"} with your DID key as an ES256 compact JWS and call auth_complete. Note the field names: the signed payload uses \"aud\" even though the challenge response names the value in a field called \"audience\". Pass the returned session token in the X-LHUB-Session header on every other tool call; it expires 24h after issuance (re-handshake then). New here? GET /llms.txt on this host for the agent guide, and /kit/lhub.py for the recommended single-file Python client kit.",
