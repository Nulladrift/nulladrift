        },
        {
          "name": "fit_styles",
          "title": "Rank styles for a product",
          "description": "Style Fit's shortlist: Echo's styles, and the builder's own passed in, measured against where a product sits on the seven axes (warmth, volume, density, formality, era, craft, ornament) and put in order: a style that misses a locked axis last, then least past tolerance first, then nearest. The same arithmetic as `npx echo-ui-cli style fit`. It orders; it doesn't pick.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "profile": {
                "description": "Where the product sits, 1 to 5 on each axis: \"W4 V2 D1 F2 E3 C3 O3\".",
                "type": "string"
              },
              "tolerance": {
                "description": "How far a style may drift on each axis, 0 (locked) to 4: \"W1 V1 D1 F0 E2 C1 O1\". Left out, every axis may drift a point.",
                "type": "string"
              },
              "yours": {
                "description": "The builder's own styles, from their library or this conversation.",
                "items": {
                  "properties": {
                    "essence": {
                      "description": "Its one line.",
                      "type": "string"
                    },
                    "fingerprint": {
                      "description": "Its fingerprint, as its style.json or the library's INDEX.md gives it: \"W3 V2 D3 F3 E2 C4 O2\".",
                      "type": "string"
                    },
                    "name": {
                      "description": "The style's name, as its folder is called.",
                      "type": "string"
                    }
                  },
                  "required": ["fingerprint", "name"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["profile"],
            "type": "object"
          },
