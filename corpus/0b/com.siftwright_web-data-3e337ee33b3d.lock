{
  "lockfileVersion": 2,
  "subjects": {
    "com.siftwright/web-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://siftwright.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "siftwright",
        "title": "Siftwright web data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Siftwright web data tools: YouTube transcripts, website screenshots/PDFs, Google News, post-quantum TLS scans, company contact details, website tech stacks, App Store reviews, company job openings and domain WHOIS/DNS. Results count toward the caller's Siftwright API plan (https://siftwright.com/pricing/); failed items are free. Docs: https://siftwright.com/docs/#mcp",
      "tools": [
        {
          "name": "app_store_reviews",
          "title": "Apple App Store reviews",
          "description": "Get Apple App Store reviews for apps (by name, numeric ID or URL) in one or more countries, filtered by rating, keywords and date. Every 25 reviews returned count as one result (rounded up per request).",
          "inputSchema": {
            "properties": {
              "apps": {
                "description": "1 to 5 app names, App Store IDs or URLs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "countries": {
                "description": "Two-letter storefront codes. Default [\"us\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "keywords": {
                "description": "Keep only reviews mentioning any of these words.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxRating": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "maxReviewsPerApp": {
                "description": "Default 200.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "minRating": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO date; keep only reviews on or after it.",
                "type": "string"
              },
              "sortBy": {
                "enum": ["mostrecent", "mosthelpful"],
                "type": "string"
              }
            },
            "required": ["apps"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6e9016d915e15027f00f9b570707fc31d945167fc018243dca07627f53a87d31"
        },
        {
          "name": "ats_jobs",
          "title": "Company job openings",
          "description": "List open jobs from company careers pages on Greenhouse, Lever, Ashby, SmartRecruiters and Recruitee in one schema (title, team, location, remote, salary when published, apply URL), with title, location, department and recency filters. Every 3 jobs returned count as one result (rounded up per request).",
          "inputSchema": {
            "properties": {
              "companies": {
                "description": "1 to 10 careers-page URLs, company domains, or ats:slug values like greenhouse:airbnb.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "departments": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "excludeTitleKeywords": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "includeDescription": {
                "description": "Include full job description text. Default false.",
                "type": "boolean"
              },
              "locations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxJobsPerCompany": {
                "description": "Default 100.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "postedWithinDays": {
                "description": "0 = any time.",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "remoteOnly": {
                "type": "boolean"
              },
              "titleKeywords": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["companies"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4e852368ef0ec6c6937bb8249e8e32c11dd6b04b5a9b21be0528b6d106a2f3c9"
        },
        {
          "name": "contact_details",
          "title": "Company contact details",
          "description": "Find public emails, phone numbers and social profiles (LinkedIn, X/Twitter, Facebook, Instagram, YouTube) on company websites by crawling up to a few pages of each site. Each website with a successful crawl counts as one result.",
          "inputSchema": {
            "properties": {
              "maxPagesPerDomain": {
                "description": "Pages to crawl per site. Default 6.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "urls": {
                "description": "1 to 10 company websites or domains.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a296f3738d7205fb8ccd7cb7483089a8b6ba9141fb9bd1de8fbb6c4892f94033"
        },
        {
          "name": "domain_whois",
          "title": "Domain WHOIS & DNS lookup",
          "description": "Look up who a domain is registered with, when it was created, when it expires, its status, nameservers and DNSSEC (from RDAP/WHOIS registries), plus A, MX, SPF and DMARC records, and whether it looks available. Every 3 domains with a registry answer count as one result (rounded up per request).",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "1 to 50 domain names.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "includeDns": {
                "description": "Add A, MX, SPF and DMARC records. Default true.",
                "type": "boolean"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8704e8a9932191cd0efa9ed649b21f235c63b34c789341d4c0b040362a8ef95c"
        },
        {
          "name": "google_news",
          "title": "Google News search",
          "description": "Search Google News for a keyword, company or topic and get articles as structured data (title, link, source, published time). Each article returned counts as one result.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code. Default US.",
                "type": "string"
              },
              "language": {
                "description": "Default en.",
                "type": "string"
              },
              "maxItems": {
                "description": "Default 30.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for, up to 300 characters.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:13eeba73741b7e50d4adf18f1bbf8294d38d2ad91a4264b6966a8baf6899767c"
        },
        {
          "name": "pqc_scan",
          "title": "Post-quantum TLS readiness scan",
          "description": "Check whether domains use post-quantum TLS key exchange (X25519MLKEM768 / ML-KEM), which groups they prefer, TLS 1.2/1.3 support, certificate algorithms and expiry, and HSTS, with a letter grade. Each host that answers counts as one result.",
          "inputSchema": {
            "properties": {
              "hosts": {
                "description": "1 to 20 public domain names (a URL is fine; the hostname is used).",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["hosts"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:038cefc84f622e2f9e53998133e105c00403645cfa3de7e9a8abfad695e2163b"
        },
        {
          "name": "tech_stack",
          "title": "Website tech stack",
          "description": "Detect what a website is built with: CMS, ecommerce platform, frameworks, analytics, ad pixels, hosting, CDN, email and DNS provider, with the evidence for each detection. Each website that loads counts as one result.",
          "inputSchema": {
            "properties": {
              "includeDns": {
                "description": "Add DNS-based detections (email and DNS provider). Default true.",
                "type": "boolean"
              },
              "urls": {
                "description": "1 to 20 websites or domains.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9fe1aa8f84b41ef5b2faeec0d3b416b17aca1170d1defb768bb7b1ba3a4bd9b1"
        },
        {
          "name": "website_screenshot",
          "title": "Website screenshot or PDF",
          "description": "Capture a PNG or JPEG screenshot, or render a PDF, of public web pages in a real browser. Returns a signed fileUrl per page that can be downloaded without a key for 7 days. Each page captured counts as one result.",
          "inputSchema": {
            "properties": {
              "delaySec": {
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "format": {
                "description": "Default png.",
                "enum": ["png", "jpeg", "pdf"],
                "type": "string"
              },
              "fullPage": {
                "description": "Capture the whole page height. Default true.",
                "type": "boolean"
              },
              "pdfPageFormat": {
                "enum": ["A4", "A3", "Letter", "Legal"],
                "type": "string"
              },
              "urls": {
                "description": "1 to 5 http(s) URLs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "viewportHeight": {
                "description": "Default 800.",
                "maximum": 2160,
                "minimum": 240,
                "type": "integer"
              },
              "viewportWidth": {
                "description": "Default 1280.",
                "maximum": 3840,
                "minimum": 320,
                "type": "integer"
              },
              "waitForSelector": {
                "description": "CSS selector to wait for before capturing.",
                "type": "string"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3cd36f1edec3a5159effbb9a9e3645d91d75a3d5b31355204266f100e17c8497"
        },
        {
          "name": "youtube_transcript",
          "title": "YouTube transcript",
          "description": "Get transcripts (captions) for YouTube videos, Shorts, playlists or channels as plain text and timed segments, with video metadata. Uses the captions YouTube already has; videos without captions return a failed item. Each video whose transcript comes back counts as one result on your Siftwright plan; failures are free.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Preferred caption language code(s), comma-separated in order of preference. Default en.",
                "type": "string"
              },
              "maxVideosPerSource": {
                "description": "For playlists and channels. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "outputFormats": {
                "description": "Default [\"text\",\"segments\"].",
                "items": {
                  "enum": ["text", "segments", "srt", "vtt"],
                  "type": "string"
                },
                "type": "array"
              },
              "translateTo": {
                "description": "Optional language code to machine-translate the captions into.",
                "type": "string"
              },
              "urls": {
                "description": "1 to 10 YouTube video, Shorts, playlist or channel URLs (or 11-character video IDs).",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f63a5f31ae6271b29f347d68708fdfb0b60e46716009b2f96421bc45b29b0c7e"
        }
      ],
      "digest": "sha256:dcbc6a52a6de1bc224371ccd7d071f40aff870ff9a5938c239ce2dd30309dc01"
    }
  }
}
