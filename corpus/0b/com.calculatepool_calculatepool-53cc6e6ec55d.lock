      "serverInfo": {
        "name": "calculatepool",
        "title": "Calculate Pool",
        "version": "1.1.0",
        "websiteUrl": "https://calculatepool.com/ai-assistants/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Swimming pool math from calculatepool.com. Use the tools for every number instead of answering from memory: pool_volume for gallons, litres and cubic feet from shape and size; chemical_dose for how much chlorine, salt, baking soda, stabilizer, calcium chloride, muriatic acid or soda ash to add, in common package sizes; pump_size for the flow rate a turnover needs; heater_size for heater BTU/h; pool_facts for gallons of standard pool sizes. If the user gives dimensions but not gallons, call pool_volume first and pass its gallons on. Only numbers are needed; never ask for names, addresses or photos. Repeat the safety line of chemical answers, say the result is an estimate to check against the product label, and keep the link line at the end of the answer.",
      "tools": [
        {
          "name": "chemical_dose",
          "title": "Pool chemical dose",
          "description": "Use this when someone asks how much of a pool chemical to add to go from a current to a target level: chlorine (liquid chlorine 12.5 %, bleach 10 % or 6 %, cal-hypo 65 % or 73 %, dichlor, trichlor) for free chlorine; salt for a salt chlorinator; baking soda to raise or muriatic acid to lower total alkalinity; stabilizer (cyanuric acid); calcium chloride for calcium hardness; muriatic acid to lower pH or soda ash to raise it. Levels in ppm (pH for the pH chemicals). Returns the amount in fl oz, oz or lb, a readable amount, the number of common packages, the factor used and a safety line. Not for shock targets or water-balance (LSI) questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chemical": {
                "description": "Product. muriatic_acid_ph lowers pH, muriatic_acid_ta lowers total alkalinity.",
                "enum": ["liquid_chlorine_12_5", "bleach_10", "bleach_6", "cal_hypo_65", "cal_hypo_73", "dichlor", "trichlor", "salt", "baking_soda", "stabilizer_cya", "calcium_chloride", "calcium_chloride_anhydrous", "muriatic_acid_ph", "muriatic_acid_ta", "soda_ash"],
                "type": "string"
              },
              "current": {
                "description": "Current level: ppm (free chlorine, salt, alkalinity, stabilizer, calcium hardness) or pH for muriatic_acid_ph and soda_ash.",
                "type": "number"
              },
              "gallons": {
                "description": "Pool volume in US gallons (from pool_volume if the user gave dimensions).",
                "maximum": 2000000,
                "minimum": 100,
                "type": "number"
              },
              "target": {
                "description": "Target level in the same unit as current.",
                "type": "number"
              },
              "total_alkalinity": {
                "description": "Only for muriatic_acid_ph and soda_ash: current TA in ppm (default 100); the pH dose scales with it.",
                "maximum": 300,
                "minimum": 20,
                "type": "number"
              }
            },
            "required": ["chemical", "current", "gallons", "target"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "type": "number"
              },
              "amount_text": {
                "type": "string"
              },
              "chemical": {
                "type": "string"
              },
              "current": {
                "type": "number"
              },
              "direction": {
                "enum": ["raise", "lower"],
                "type": "string"
              },
              "factor": {
                "type": "string"
              },
              "gallons": {
                "type": "number"
              },
              "link": {
                "description": "Page of calculatepool.com for the same calculation.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "packages": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "count": {
                        "type": "integer"
                      },
                      "note": {
                        "type": "string"
                      },
                      "package": {
                        "type": "string"
                      },
                      "text": {
                        "type": "string"
                      }
                    },
                    "required": ["count", "note", "package", "text"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "parameter": {
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "safety": {
                "type": "string"
              },
              "target": {
                "type": "number"
              },
              "total_alkalinity": {
                "type": "number"
              },
              "unit": {
                "enum": ["fl oz", "oz", "lb"],
                "type": "string"
              }
            },
            "required": ["amount", "amount_text", "chemical", "current", "direction", "factor", "gallons", "link", "note", "packages", "parameter", "product", "safety", "target", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pool chemical dose"
          },
          "behavior": {
            "destructive": false,
