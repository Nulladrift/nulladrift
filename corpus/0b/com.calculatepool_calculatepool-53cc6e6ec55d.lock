        {
          "name": "pool_facts",
          "title": "Standard pool sizes in gallons",
          "description": "Use this when someone asks how many gallons a common pool size holds, e.g. a 24 ft round above-ground pool with a 52 in wall or a 16 x 32 inground pool, or wants a table of standard sizes. Returns inground rectangles (12x24 to 25x50 ft at 3.5, 4.5 and 5.5 ft average depth) and above-ground round and oval pools (12-33 ft round, 12x24 to 21x41 ft oval at 48, 52 and 54 in walls) with the factors used. For any other size or shape use pool_volume.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Which table (default all).",
                "enum": ["all", "inground", "above_ground"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "factors": {
                "additionalProperties": false,
                "properties": {
                  "gallons_per_cubic_foot": {
                    "type": "number"
                  },
                  "litres_per_gallon": {
                    "type": "number"
                  },
                  "round_and_oval_factor": {
                    "type": "number"
                  }
                },
                "required": ["gallons_per_cubic_foot", "litres_per_gallon", "round_and_oval_factor"],
                "type": "object"
              },
              "kind": {
                "type": "string"
              },
              "link": {
                "description": "Page of calculatepool.com for the same calculation.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "rows": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "gallons": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "depth": {
                            "type": "string"
                          },
                          "gallons": {
                            "type": "integer"
                          }
                        },
                        "required": ["depth", "gallons"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "pool": {
                      "type": "string"
                    }
                  },
                  "required": ["gallons", "kind", "pool"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["factors", "kind", "link", "note", "rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
