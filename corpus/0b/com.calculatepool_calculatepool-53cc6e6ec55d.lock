        {
          "name": "pump_size",
          "title": "Pool pump flow rate",
          "description": "Use this when someone asks what size pool pump they need or what flow rate turns their pool over in a given number of hours. Takes gallons and turnover hours (default 8). Returns gallons per minute, gallons per hour, a rule-of-thumb horsepower range, the minimum sand, cartridge and DE filter area for that flow, and pipe velocities. Not for electricity cost or pump model recommendations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gallons": {
                "description": "Pool volume in US gallons (from pool_volume if the user gave dimensions).",
                "maximum": 2000000,
                "minimum": 100,
                "type": "number"
              },
              "turnover_hours": {
                "description": "Hours for one full turnover (default 8; 6 for heavy use).",
                "maximum": 24,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["gallons"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "filter_min_sqft": {
                "additionalProperties": false,
                "properties": {
                  "cartridge": {
                    "type": "number"
                  },
                  "de": {
                    "type": "number"
                  },
                  "sand": {
                    "type": "number"
                  }
                },
                "required": ["cartridge", "de", "sand"],
                "type": "object"
              },
              "gallons": {
                "type": "number"
              },
              "gallons_per_hour": {
                "type": "integer"
              },
              "gpm": {
                "type": "number"
              },
              "hp_hint": {
                "type": "string"
              },
              "link": {
                "description": "Page of calculatepool.com for the same calculation.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "pipe_velocity_fps": {
                "additionalProperties": false,
                "properties": {
                  "1.5_in": {
                    "type": "number"
                  },
                  "2.5_in": {
                    "type": "number"
                  },
                  "2_in": {
                    "type": "number"
                  }
                },
                "required": ["1.5_in", "2.5_in", "2_in"],
                "type": "object"
              },
              "turnover_hours": {
                "type": "number"
              }
            },
            "required": ["filter_min_sqft", "gallons", "gallons_per_hour", "gpm", "hp_hint", "link", "note", "pipe_velocity_fps", "turnover_hours"],
            "type": "object"
          },
          "annotations": {
