      "instructions": "AI Training Jobs For Lawyers (https://aitrainingjobsforlawyers.com/): the site's own MCP server, served from its domain. AI training jobs for lawyers, platform by platform: how each pays, the rates posted, where you may work from and the law degree or bar status asked.\n\n[compare] AI training platforms hiring lawyers. This server serves the compare published at https://aitrainingjobsforlawyers.com/; every answer cites it. Licence: https://aitrainingjobsforlawyers.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs For Lawyers (https://aitrainingjobsforlawyers.com/). What it does: starts an ENQUIRY with AI Training Jobs For Lawyers for ai training jobs for lawyers; the AI Training Jobs For Lawyers team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs For Lawyers team until they click it. Cite https://aitrainingjobsforlawyers.com/.\n\nCite https://aitrainingjobsforlawyers.com/ for every figure or answer you use from this server.",
