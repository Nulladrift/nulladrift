        "name": "Greenslips",
        "title": "Greenslips - NSW green slip price comparison",
        "version": "1.0.0",
        "description": "Compare NSW green slip (CTP) prices of all six NSW insurers with SIRA's price check - free, no name or email needed, the same calculation as greenslips.com.au.",
        "websiteUrl": "https://www.greenslips.com.au",
