          "description": "Query Google Search Console search performance (Search Analytics) for a site from gsc_sites: clicks, impressions, CTR and average position, grouped by query, page, country, device, date or searchAppearance, with optional filters. Data lags about two days; the default range is the 28 days ending three days ago.",
          "inputSchema": {
            "properties": {
              "account": {
                "description": "Google account e-mail to read as, when you have several; an agent reads as the account connected to it.",
                "type": "string"
              },
              "dimensions": {
                "description": "Group by; default [\"query\"]. Empty for site totals.",
                "items": {
                  "enum": ["query", "page", "country", "device", "date", "searchAppearance"],
                  "type": "string"
                },
                "type": "array"
              },
              "end_date": {
                "description": "YYYY-MM-DD; default 3 days ago.",
                "type": "string"
              },
              "filters": {
                "description": "Up to 5 filters, all must match.",
                "items": {
                  "properties": {
                    "dimension": {
                      "enum": ["query", "page", "country", "device", "searchAppearance"],
                      "type": "string"
                    },
                    "expression": {
                      "description": "Country as ISO 3166-1 alpha-3 (cze), device as DESKTOP/MOBILE/TABLET.",
                      "type": "string"
                    },
                    "operator": {
                      "description": "Default contains.",
                      "enum": ["equals", "notEquals", "contains", "notContains", "includingRegex", "excludingRegex"],
                      "type": "string"
                    }
                  },
                  "required": ["dimension", "expression"],
                  "type": "object"
                },
                "type": "array"
              },
              "row_limit": {
                "description": "1–5000; default 100.",
                "type": "integer"
              },
              "site": {
                "description": "Site URL exactly as gsc_sites lists it.",
                "type": "string"
              },
              "start_date": {
                "description": "YYYY-MM-DD; default 30 days ago.",
                "type": "string"
              },
              "start_row": {
                "description": "Offset for paging; default 0.",
                "type": "integer"
              },
              "type": {
                "description": "Search type; default web.",
                "enum": ["web", "image", "video", "news", "discover", "googleNews"],
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
