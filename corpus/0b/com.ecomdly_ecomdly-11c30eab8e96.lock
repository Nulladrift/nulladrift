        {
          "name": "shop_request",
          "title": "Shop Request",
          "description": "Call the API of a connected e-shop (Shoptet, Upgates, Shopify, WPJ Shop, WooCommerce, PrestaShop, Shoper, Shopware, Magento, BigCommerce, IdoSell) — ecomdly adds the owner's API access, you never see or need the key. Follow the platform's skill (shop_list names it) for paths and limits, and for the job itself (product titles, descriptions, translations, prices, stock, feeds) a skill from the ecomdly catalog — search_skills first, before you change products. `path` is relative to the API (Shoptet: /api/orders?page=1, Upgates: /orders?page=1, Shopify: /graphql.json and WPJ Shop: /admin/graphql/ with a POST body {\"query\": …}, WooCommerce: /orders?per_page=50, PrestaShop: /orders?display=full, Shoper: /orders?limit=50, Shopware: /search/order with a POST body of criteria, Magento: /V1/orders?searchCriteria[pageSize]=50, BigCommerce: /v2/orders?limit=50 or /v3/catalog/products, IdoSell: /orders/orders/search with a POST body {\"params\": {…}}). Reading always works (GET, GraphQL queries, Shopify bulk queries, Shopware and IdoSell searches, a Shoper bulk of GETs); changes (other POST/PUT/PATCH/DELETE, GraphQL mutations) only where the owner allowed them on ecomdly, and only what the owner confirmed in this conversation. For a custom API you sign in yourself as its docs say, writing {{secret}} where the key goes (headers, path or body). Returns the status, the limit headers and the body (long bodies are cut — page through, or use a snapshot / bulk query).",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "The body of a POST/PUT/PATCH as text: JSON — for GraphQL (Shopify, WPJ Shop, BigCommerce /graphql) {\"query\": \"…\", \"variables\": {…}} — or, for PrestaShop writes, the resource XML.",
                "type": "string"
              },
              "headers": {
                "description": "Custom API only: a JSON object of headers the API wants, e.g. {\"Authorization\": \"Bearer {{secret}}\"} or {\"Authorization\": \"Basic {{basic:apiuser}}\"}. Write {{secret}} where the key goes (also in the path or body); ecomdly puts it in on the server and never shows it to you.",
                "type": "string"
              },
              "method": {
                "description": "GET (default), POST, PUT, PATCH or DELETE.",
                "type": "string"
              },
              "path": {
                "description": "The API path with its query string, e.g. /api/orders?page=1&itemsPerPage=50 (Shoptet), /orders?page=1 (Upgates), /graphql.json (Shopify), /admin/graphql/ (WPJ Shop), /orders?per_page=50 (WooCommerce), /orders?display=full (PrestaShop), /orders?limit=50 (Shoper), /search/order (Shopware), /V1/orders?searchCriteria[pageSize]=50 (Magento), /v2/orders?limit=50 (BigCommerce), /orders/orders/search (IdoSell). A full https URL on the platform's own hosts also works (a Shoptet snapshot resultUrl).",
                "type": "string"
              },
              "shop": {
                "description": "The e-shop to use — its name or id from shop_list; may be left out when only one is connected.",
                "type": "string"
              }
            },
