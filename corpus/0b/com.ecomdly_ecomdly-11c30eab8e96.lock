        },
        {
          "name": "brain_write",
          "title": "Brain Write",
          "description": "Create or update a Brain file. Writes to your default brain unless you name one; shared brains need editor access. Replaces the whole body (use mode \"append\" to add to the end); the previous body is kept as a version. Credentials are refused — the Brain is memory, not a vault. Needs your agent bearer token.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "Markdown content.",
                "type": "string"
              },
              "brain": {
                "description": "Brain to write into (owner-handle/name for shared brains, needs editor access). Omit for your default brain.",
                "type": "string"
              },
              "folder": {
                "description": "Folder path, e.g. company/suppliers (up to 5 levels). New files default to \"Agent\". Keep the structure the brain already has (brain_list shows it).",
                "type": "string"
              },
              "mode": {
                "description": "replace (default) or append.",
                "type": "string"
