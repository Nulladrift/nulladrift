        {
          "name": "api_request",
          "title": "Api Request",
          "description": "Call the API of an app the owner connected on ecomdly (Intercom) — ecomdly adds the owner's access, you never see or need the key. Follow the service's skill (api_list names it) for paths and limits. `path` is relative to the service (Intercom: /conversations?per_page=50, /contacts/<id>). Reading always works (GET, Intercom's POST …/search); changes (other POST/PUT/PATCH/DELETE) only where the owner allowed them on ecomdly, and only what the owner asked for. Returns the status, paging/limit headers and the body (long bodies are cut — page through). E-shops go through shop_request, not here.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "The app to use — its name or id from api_list; may be left out when only one is connected.",
                "type": "string"
              },
              "body": {
                "description": "The JSON body of a POST/PUT/PATCH (an Intercom search: {\"query\": {…}, \"pagination\": {\"per_page\": 50}}).",
                "type": "string"
              },
              "method": {
                "description": "GET (default), POST, PUT, PATCH or DELETE.",
                "type": "string"
              },
              "path": {
                "description": "The API path with its query string, e.g. /conversations?per_page=50 or /contacts/<id> (Intercom).",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
