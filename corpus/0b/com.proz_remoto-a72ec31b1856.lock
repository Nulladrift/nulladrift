        {
          "name": "get_open_slots",
          "title": "Get bookable times",
          "description": "Bookable times for one interpreter, using Remoto's booking calendar rules. Most interpreters take scheduled-call requests instead of fixed slots (bookingRoute = scheduled_request): the person proposes a date, time and length and the interpreter confirms.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "First day, YYYY-MM-DD (default today).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "interpreter_id": {
                "description": "Interpreter id: the number in the public profile URL (/profile/<id>), or the profile URL itself.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "source": {
                "description": "Language pair being booked (prices the slot).",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "description": "Target language: a name (\"Farsi\", \"Brazilian Portuguese\", \"ASL\") or code (\"fas\", \"spa\", \"ase\").",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone for the returned times, e.g. America/New_York (default UTC).",
                "maxLength": 64,
                "type": "string"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD (default from + 13 days, max 31 days).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["interpreter_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "bookingRoute": {
                "enum": ["calendar_slots", "scheduled_request", "unavailable"],
