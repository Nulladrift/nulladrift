        {
          "name": "get_start_link",
          "title": "Get a link to start or book",
          "description": "A link the person opens to start an on-demand call or book a scheduled one, prefilled with the language pair and/or interpreter. Payment is entered on Remoto's page (card, Apple Pay, Google Pay, PayPal; guests need no account). This tool creates nothing and charges nothing.",
          "inputSchema": {
            "properties": {
              "duration_minutes": {
                "description": "Scheduled only: booked length in minutes.",
                "maximum": 480,
                "minimum": 1,
                "type": "integer"
              },
              "interpreter_id": {
                "description": "Interpreter id: the number in the public profile URL (/profile/<id>), or the profile URL itself.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "mode": {
                "description": "on_demand = connect now; scheduled = book a time.",
                "enum": ["on_demand", "scheduled"],
                "type": "string"
              },
              "source": {
                "description": "Source language: a name (\"Farsi\", \"Brazilian Portuguese\", \"ASL\") or code (\"fas\", \"spa\", \"ase\").",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "starts_at": {
                "description": "Scheduled only: the chosen start time (ISO 8601 with offset, e.g. a bookable time's startsAt). With interpreter_id, source and target the link is a price-locked booking link.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "target": {
                "description": "Target language: a name (\"Farsi\", \"Brazilian Portuguese\", \"ASL\") or code (\"fas\", \"spa\", \"ase\").",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["mode"],
            "type": "object"
          },
