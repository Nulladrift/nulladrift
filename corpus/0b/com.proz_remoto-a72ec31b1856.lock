        {
          "name": "get_price_quote",
          "title": "Get a price quote",
          "description": "Client price for a language pair: per-minute USD with all platform fees included, billed per second after a one-minute minimum; scheduled calls are a fixed total (minutes × per-minute price). With interpreter_id the result is that interpreter's exact price; without it, the pair's typical price and range.",
          "inputSchema": {
            "properties": {
              "duration_minutes": {
                "description": "Scheduled: booked length (default 60). On demand: expected length for an estimate (default 10).",
                "maximum": 480,
                "minimum": 1,
                "type": "integer"
              },
              "interpreter_id": {
                "description": "Interpreter whose exact price is quoted. When absent, the quote is the pair's typical price and range.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "mode": {
                "description": "on_demand (default) or scheduled.",
                "enum": ["on_demand", "scheduled"],
                "type": "string"
              },
              "source": {
                "description": "Source language: a name (\"Farsi\", \"Brazilian Portuguese\", \"ASL\") or code (\"fas\", \"spa\", \"ase\").",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "description": "Target language: a name (\"Farsi\", \"Brazilian Portuguese\", \"ASL\") or code (\"fas\", \"spa\", \"ase\").",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["source", "target"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
