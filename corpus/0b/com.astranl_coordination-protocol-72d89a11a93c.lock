            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ea4c03e10c0d93b612de5a97dead4f861464e2e3e8333339507aff29c1307841"
        },
        {
          "name": "coordination_contract",
          "description": "Read the published six-step coordination contract, refusals and boundaries verbatim. No account or project. AstraNL never completes checkout, pays, fills seller forms or holds funds. With receipt=true, an available digest receipt can be confirmed through any door; it is not a quote, a price guarantee or proof of delivery.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "receipt": {
                "default": false,
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read the six-step coordination contract"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0dcb141c17508dc4472a87bc2a9db3f65c1553543c79b6c89d96bddd5be7c0ba"
        },
        {
          "name": "create_task",
          "description": "Ask AstraNL to find and coordinate a verified executor for a physical task in the Netherlands. Returns an ingress receipt at once and a case once planning found a path; the client pays the executor directly; AstraNL holds no money. A step can stand on confirmed references supplied in based_on. Fee: submitting costs nothing; AstraNL charges 1 percent of the transaction only when it coordinated a completed paid task, nothing else.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "based_on": {
                "description": "References verified before this step is stored.",
                "items": {
                  "maxLength": 64,
                  "minLength": 4,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "budget_cents": {
                "description": "budget in euro cents",
                "minimum": 100,
                "type": "integer"
              },
              "deadline": {
                "description": "by when; ISO date or plain words",
                "maxLength": 100,
                "type": "string"
              },
              "location": {
                "description": "city or address in the Netherlands",
                "maxLength": 200,
                "type": "string"
              },
              "need": {
                "description": "what must happen, in plain words",
                "maxLength": 800,
                "type": "string"
              },
              "proof": {
                "description": "what evidence closes the task, agreed before work starts",
                "maxLength": 400,
                "type": "string"
              },
              "reply_channel": {
                "description": "email or https URL where AstraNL may answer you",
                "maxLength": 300,
                "type": "string"
              },
              "synthetic": {
                "description": "true marks a test that must never be counted or executed",
                "type": "boolean"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a coordinated real-world task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none to submit; a reply_channel is needed to be answered",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you only want to know whether it is possible (ask_astranl), or the task is digital-only, outside the Netherlands, or an emergency",
              "example_intent": "Collect a signed document from an office in Zaandam and deliver it to Amsterdam by Thursday, proof: photo of the signed handover, budget 60 euro",
              "next_possible_action": "check_task with the receipt_id, then with the task_id",
              "proof_level": "ingress receipt is unsigned proof of receipt only; execution proof arrives later through check_task and get_evidence",
              "required_inputs": ["need", "location", "deadline", "proof: what evidence closes the task", "budget_cents", "reply_channel: where AstraNL may answer you"],
              "returns": "an ingress receipt RCPT-n that proves AstraNL received the task; later a case id once planning found a path; the client pays the executor directly",
              "side_effect_class": "creates_a_record",
              "use_when": "you want AstraNL to find and coordinate a verified executor for a physical task in the Netherlands and you can state need, place, deadline, proof criterion and budget"
            }
          },
          "digest": "sha256:50489e584d5289faaf55c1221aa8cba62fe94c6c0f1c438f1a721d59ee3979bc"
        },
        {
          "name": "estimate_cost",
          "description": "Instant planning cost figure in EUR for one job category in the Netherlands (not a quote; answers in under 2 s). labor_cost = labor_hours x labor_rate x location_mult, always. The rate comes from AstraNL's S_PRICEBASE (CAO wage with employer cost, overhead and profit) or its labour cost canon; hours from CBS-derived norms where AstraNL has one, otherwise a planning factor labelled ASSUMPTION; location_mult is 1.0 with its basis (no sourced regional factor for renovation labour). Each material line says price_source live_read (store, read_at, product link) or indicative (basis and date). No robot price or savings is given without evidence. Sources are in estimate.labour and estimate.materials. This is a planning figure, not a reviewed estimate of a real job. Read-only, free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area_m2": {
                "description": "Surface area or working volume in square meters. Optional but improves accuracy. For non-area tasks (e.g. plumbing repair) pass 0 or omit.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "category": {
                "description": "Service category. Same enum as create_task.",
                "enum": ["painting", "cleaning", "plumbing", "roofing", "renovation", "electrical", "garden", "repair", "moving", "construction", "delivery", "logistics", "energy", "solar", "hvac", "automotive", "welding", "manufacturing", "installation", "maintenance", "inspection", "carpentry", "flooring", "demolition", "insulation", "glazing"],
                "type": "string"
              },
              "location": {
                "description": "City in the Netherlands. Pricing varies by region (Amsterdam tends to be highest). Optional — omitting uses national median.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate task cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f39ddc8ba603fcbec8e4869354ea041a84bc90a6fb87f118d6dcc644724e823"
        },
