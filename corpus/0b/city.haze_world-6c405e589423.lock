                            "type": "number"
                          }
                        ],
                        "maxItems": 3,
                        "minItems": 3,
                        "type": "array"
                      },
                      "yaw": {
                        "maximum": 6.283185307179586,
                        "minimum": -6.283185307179586,
                        "type": "number"
                      }
                    },
                    "required": ["pos", "yaw"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "ground": {
                "properties": {
                  "hue": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "preset": {
                    "enum": ["irid", "plasma", "tissue", "ember", "glass", "void"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "room": {
                "type": "string"
              },
              "sky": {
