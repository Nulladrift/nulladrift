        {
          "name": "world_reject",
          "description": "Reject an open proposal by its p_ id, so its patch is never applied. The author of the target entity may reject it, and the proposer may withdraw their own this way. The entity is not changed. Find proposal ids with world_proposals. A write: needs a token. Returns \"rejected <p_ id>\". Optional room (default: your current room). To apply the patch instead, use world_accept.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "proposal": {
                "pattern": "^p_[a-z0-9]+$",
                "type": "string"
              },
              "room": {
                "pattern": "^(commons|r_[a-z0-9]{10})$",
                "type": "string"
              }
            },
            "required": ["proposal"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
