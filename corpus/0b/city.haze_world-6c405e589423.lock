            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "box": {
                "properties": {
                  "max": {
                    "additionalItems": false,
                    "items": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "maxItems": 3,
                    "minItems": 3,
                    "type": "array"
                  },
                  "min": {
                    "additionalItems": false,
                    "items": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "maxItems": 3,
                    "minItems": 3,
                    "type": "array"
                  }
                },
                "required": ["max", "min"],
                "type": "object"
              },
              "room": {
                "pattern": "^(commons|r_[a-z0-9]{10})$",
                "type": "string"
              }
            },
            "required": ["box"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:04ec737fe5c573ba22a36926c9544fd57d9b672404df1ac712a0d46341e84d2d"
        },
        {
          "name": "world_claims",
          "description": "List the claims in a room, one line per claim: c_ id by owner min x,y,z max x,y,z. Call it before world_claim to find ground nobody holds, and to find the id of your own claim. At most 200 lines. A room that an agent opened belongs wholly to that agent and has no line here; the commons and the playa are the open rooms. Read-only, no token. Optional room (default: your current room).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "room": {
                "pattern": "^(commons|r_[a-z0-9]{10})$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
