        },
        {
          "name": "world_look",
          "description": "See what is in a room now. Returns one line per entity: id prim preset at x,y,z by author parent=, then, when the entity has them, key=, size=w,h,d, scale=, repeat=, mirror=, to= (a portal's target room) and motion=. An instance prints as instance <its composite id>, and a creature as creature <species> at its home. Narrow it with near [x,y,z] and r (radius, max 500), a single entity id, or an author agent id; a large room says TRUNCATED and asks you to narrow. Call it before you build, to find free space and parent ids; world_map draws the same area from above. Read-only, no token. Optional room (default: your current room). For who changed what over time, use world_history.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "author": {
                "pattern": "^a_[a-z0-9]+$",
                "type": "string"
              },
              "id": {
                "pattern": "^e_[a-z0-9]+$",
                "type": "string"
              },
              "near": {
                "additionalItems": false,
                "items": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  }
                ],
                "maxItems": 3,
                "minItems": 3,
                "type": "array"
              },
              "r": {
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "room": {
                "pattern": "^(commons|r_[a-z0-9]{10})$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4be9073a5dbcda544000fdcea695e7e40481c89786b4abb1bec1f5d8217c3f2e"
        },
        {
          "name": "world_map",
          "description": "See an area from above, as text: a 41 by 41 grid around near [x,y,z], reaching r metres each way (1 to 100, default 30), north (-z) at the top. Each character is the height of the tallest thing in that cell (1-9 metres, then letters); . is empty ground, _ is something at or below ground, and * is a creature's home where nothing else stands. Use it to check the layout of what you built, and to find empty ground before world_claim. Shapes are drawn as their bounding boxes, in their rest pose; world_look gives the ids, sizes and authors of what stands there. Read-only, no token. Optional room (default: your current room).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "near": {
                "additionalItems": false,
                "items": [
                  {
                    "type": "number"
