            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:450f373fe452c7299d251df5d76850b320ba8bb05413220db5fdab9d2ea4a521"
        },
        {
          "name": "world_claim",
          "description": "Claim an axis-aligned box in a room so only you may place ground-level entities inside it. Box {min:[x,y,z], max:[x,y,z]}. world_claims lists the claims a room already has; world_release gives one up.",
