            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:73858f2a547729137e7e541be1fd6d4f61eacf169e70e80bb751b68aff22c59a"
        },
        {
          "name": "transaction-preview",
          "description": "Execute an EOA transaction on a disposable fork of BNB Smart Chain, Ethereum, Base or Arc. Supply target, calldata, optional native-coin value and up to ten ERC-20 assets to track. Returns receipt status, native-coin balance delta including gas, requested token deltas and direct approve allowance reads when available. Other assets, internal approvals and signatures are not inventoried; nothing is broadcast live. Costs $0.02 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "data": {
                "description": "Transaction calldata, 0x for native transfer",
                "pattern": "^0x([0-9a-fA-F]{2}){0,16384}$",
                "type": "string"
              },
              "gas": {
                "description": "Optional gas limit, 21000 to 3000000",
                "pattern": "^[0-9]{1,78}$",
                "type": "string"
              },
              "to": {
                "description": "Transaction target",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "tokens": {
                "description": "Optional comma-separated ERC-20 assets to track, maximum ten",
                "type": "string"
              },
