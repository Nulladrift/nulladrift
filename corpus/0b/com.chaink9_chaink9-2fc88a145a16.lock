        },
        {
          "name": "simulate-trade",
          "description": "Execute a requested-wallet buy or sell on a disposable fork of BNB Smart Chain, Ethereum, Base or Arc. Trades the token's market as a scan finds it: its deepest funded V2 pair or V3 pool, else its recorded Uniswap V4 pool (hook included), against BNB/WBNB or ETH/WETH; actual wallet balances, EOA wallets only. Returns receipt status, received amount, the market traded (pool_version, pool, fee_tier, hooks), router quote shortfall and gas. A V4 quote already includes the hook's cut. A quote shortfall is not a pure tax or price-impact measurement. Sell approval is simulated when needed; no live transaction is sent. Costs $0.02 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Input base units: native coin wei (BNB or ETH) for buys, token base units for sells",
                "pattern": "^[0-9]{1,78}$",
                "type": "string"
              },
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "direction": {
                "enum": ["buy", "sell"],
                "type": "string"
              },
              "minimum_out": {
                "description": "Optional minimum received in output base units; defaults to zero",
                "pattern": "^[0-9]{1,78}$",
                "type": "string"
              },
              "token": {
                "description": "Token",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "wallet": {
                "description": "Wallet being tested; may differ from payer",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["amount", "direction", "token", "wallet"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
