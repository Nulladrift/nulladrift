        },
        {
          "name": "liquidity-report",
          "description": "Read the token's market at one finalized block. A V3 or V4 pool returns pool_version, fee, hook, active liquidity, price and (V3) the coins the pool holds; its positions are NFTs, so holders and lock IDs are refused. A V2 pair returns canonical reserves against WBNB/WETH (PancakeSwap on BSC, Uniswap on Ethereum and Base), LP supply, burned LP and up to ten supplied holders. On BSC, optionally verify up to ten PinkLock V2 simple lock IDs against the pinned BSC contract, exact runtime hash and aggregate LP custody. Reports future, elapsed, withdrawn and unsupported vesting records. No holder/lock discovery or withdrawal simulation; other contract-held LP remains unknown. Lock and holder amounts overlap. Costs $0.003 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "holders": {
                "description": "Optional comma-separated LP holder addresses, maximum ten",
                "type": "string"
              },
              "pinklock_ids": {
                "description": "Optional, BSC only: comma-separated PinkLock V2 lock IDs, maximum ten unique decimal IDs; only simple time locks counted",
                "type": "string"
              },
              "token": {
                "description": "Token",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
