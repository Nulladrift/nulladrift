      "serverInfo": {
        "name": "chaink9",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ChainK9 checks tokens on BNB Smart Chain, Ethereum, Base and Arc for traps (honeypots, hidden or changing taxes, owner powers) by actually buying and selling them on a private fork of the chain. Start with the free verdict tool. The other tools are paid per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana with x402 (the payment goes in the tool call's _meta, as @x402/mcp clients do); failed calls are free.",
      "tools": [
        {
          "name": "deployer-report",
          "description": "Verify a token's successful finalized top-level creation transaction and return known verified deployments by that sender with stored scans. Coverage grows as creation proofs are submitted. Does not discover every deployment, trace launchpad/internal CREATE, attribute a team, or label a deployer a scammer. Costs $0.005 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "creation_tx": {
                "description": "Actual top-level contract creation transaction, not pair creation",
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "token": {
                "description": "Created token",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["creation_tx", "token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b8f9e79f6bc918faf262693a8a8cd4f3a14ca0b6b7a0f54d0549a4874b222367"
        },
        {
          "name": "exit-check",
          "description": "Test up to four independent sell sizes from an EOA's existing token balance. Each size starts from the same fork snapshot; approvals are included when needed. Sells through the token's V2, V3 or V4 market (as simulate-trade finds it) with the wallet's real BNB or ETH for gas. Returns observed sell outcomes, not a guarantee of future exit. Costs $0.04 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amounts": {
                "description": "One to four comma-separated token base-unit integers",
                "type": "string"
              },
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "token": {
                "description": "Token",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "wallet": {
                "description": "Existing holder",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["amounts", "token", "wallet"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f8cffc4e81b3dcc3efeddd024a7c80a82b944cc5af29d1aa0f03267eb4b0f203"
