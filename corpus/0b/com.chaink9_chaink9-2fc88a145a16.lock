        {
          "name": "scan",
          "description": "Check a token on BNB Smart Chain, Ethereum, Base or Arc for traps before buying it. ChainK9 forks the chain and really buys and sells the token in a sandbox (its V2 or V3 pool: PancakeSwap on BSC, where a V2 pair against USDT or USDC is traded through BNB, Uniswap on Ethereum and Base; or its Uniswap V4 pool, hook included, against the native coin or, traded through it, USDT or USDC; on Arc, its V4 pool against USDC), then runs 70+ checks: honeypot, hidden and changing buy and sell taxes, owner pause, blacklist, mint and confiscation powers, transfer and sell limits, cooldowns, liquidity, upgrade authority. Returns a verdict (danger, caution, ok) and every check's result. Results are reused for 10 minutes. Not charged when the address isn't a token or has no liquidity yet (422). Costs $0.02 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "fresh": {
                "description": "Set true to request a new scan for a later risk comparison; default false reuses the cache",
                "enum": ["false", "true"],
                "type": "string"
              },
              "token": {
                "description": "Token address on the chosen chain",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
