                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4c89d8e76d0464629c0c07a0c763cd158b234a25e1a330d9e7fa014f4c638d85"
        },
        {
          "name": "scan-ultra",
          "description": "ChainK9's deepest token check on BNB Smart Chain, Ethereum, Base or Arc, for bigger buys and due diligence. Everything /scan does (a real buy and sell on a fork of the chain plus 70+ checks: honeypot, changing taxes, owner powers tried for real, limits, cooldowns, liquidity, upgrade authority), plus who holds the token: the largest holder's and the top 10's share of supply, ranked from the token's whole transfer history with the largest balances read on chain, and whether a single wallet holds the pool's liquidity tokens and could pull the liquidity. Holder checks cover tokens with up to about 10,000 transfers (most new launches) and say so when a token has more. A stored ultra result also answers /scan and /report. Not charged when the address isn't a token or has no liquidity yet (422). Costs $0.05 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "properties": {
