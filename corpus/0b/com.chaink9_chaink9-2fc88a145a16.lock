        {
          "name": "feed",
          "description": "The newest tokens that just got a market on BNB Smart Chain (PancakeSwap), Ethereum, Base or Arc (Uniswap), newest first, with ChainK9's verdict where the token was scanned on that chain. Funded launches are usually scanned in the background within minutes, so most of them already carry a verdict. Costs $0.002 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "limit": {
                "description": "How many markets, 1 to 200 (default 50)",
                "pattern": "^[0-9]{1,3}$",
                "type": "string"
