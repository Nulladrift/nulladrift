          "description": "Read actual wallet balances for up to twenty supplied token addresses on one chain and prioritize their stored ChainK9 scan verdicts. Includes scan age/staleness and missing reports. Does not discover wallet assets, run fresh scans or establish wallet-specific sellability; use exit-check for that. Costs $0.005 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
