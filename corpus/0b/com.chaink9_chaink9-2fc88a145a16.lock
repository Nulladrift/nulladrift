        },
        {
          "name": "trace",
          "description": "Follow the money out of one transaction on BNB Smart Chain, Ethereum, Base or Arc, wallet to wallet: native coin anywhere in its call tree (so a drainer contract's payouts count) and every token transfer it logged, then each receiving wallet's outgoing transfers that pass that amount on (first in, first out, wallets funded twice followed once for the sum), up to depth hops (1 to 5, default 3). A swap doesn't end the trail: it continues with what came back. Each trail ends at a mixer (Tornado Cash pools and routers on Ethereum and BSC, labeled with the pool), a contract (exchange, bridge, router, pool; known ones labeled), a busy exchange or service wallet, a wallet still holding the funds, a burn, or the depth limit; ends lists which, with the amount that reached it. Up to 80 hops. Not charged if the transaction isn't found (404) or moved nothing (422). Costs $0.01 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "depth": {
                "description": "How many hops to follow, 1 to 5 (default 3)",
                "pattern": "^[1-5]$",
                "type": "string"
              },
              "hash": {
                "description": "Transaction hash on the chosen chain",
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
