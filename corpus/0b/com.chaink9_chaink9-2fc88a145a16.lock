          "digest": "sha256:4c35759e1916517f690644c96a6211dc663dfd4245fe5dfbab44dd479e8c5867"
        },
        {
          "name": "launch-feed",
          "description": "Filter the latest collector candidates on one chain for currently funded markets: canonical V2 and V3 pools against the wrapped coin with at least the minimum wrapped-coin reserve, and Uniswap V4 pools against the native or wrapped coin with active liquidity (V4 only when min_wrapped is zero, since a V4 pool's own coins can't be read); optional stored verdict. Checks at most twenty candidates at one finalized block. Ordered by pair creation, not first liquidity time; most funded markets are scanned in the background within minutes and re-scanned an hour later; unscanned markets are unknown and stored verdicts may be old. Costs $0.003 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "bsc (BNB Smart Chain, the default), eth (Ethereum) or base (Base)",
                "enum": ["bsc", "eth", "base", "arc"],
                "type": "string"
              },
              "limit": {
                "description": "Candidate markets to examine, default ten",
                "pattern": "^([1-9]|1[0-9]|20)$",
                "type": "string"
              },
              "min_wbnb": {
                "description": "Older name of min_wrapped",
                "pattern": "^[0-9]{1,78}$",
                "type": "string"
              },
              "min_wrapped": {
                "description": "Minimum WBNB/WETH reserve in wei, default zero",
                "pattern": "^[0-9]{1,78}$",
                "type": "string"
              },
              "verdict": {
                "enum": ["ok", "caution", "danger", "unknown"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
