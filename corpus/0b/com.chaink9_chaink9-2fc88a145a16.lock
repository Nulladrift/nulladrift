            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4fe96c6b507dcff50d424094e0e927f23bcbeaf37d902b8d4871f4e587f5d71e"
        },
        {
          "name": "scan-lite",
          "description": "A quicker, cheaper ChainK9 check for bots that need a fast yes or no before buying a token on BNB Smart Chain, Ethereum, Base or Arc. It really buys and sells the token once on a fork of the chain, then reads the contract: honeypot, buy and sell tax, trade gas, ownership, owner functions in the bytecode, blacklist, proxy, liquidity and source checks. It skips /scan's extra trades and time-travel probes (taxes that change over time or after several sells, owner powers tried for real, transfer limits and cooldowns), so a recent full /scan is returned instead when one exists. The report's tier field says which ran. Lite results are stored, so /report returns them later too. Not charged when the address isn't a token or has no liquidity yet (422). Costs $0.005 per successful call in USDC on Base, Polygon, Arbitrum, Avalanche, BNB Smart Chain (USDT) or Solana, paid with x402 in the call's _meta; failed calls are free.",
          "inputSchema": {
            "properties": {
