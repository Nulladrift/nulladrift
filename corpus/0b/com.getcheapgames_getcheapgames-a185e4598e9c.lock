                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["currency", "pageUrl", "pricesByPlatform", "slug", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
