          "description": "Return the games in one franchise or series, such as every Call of Duty, with each one's lowest listed price per platform: grouped by sub-series, newest release first, each game's editions after it. Use it for questions about a whole series; for one publisher's catalogue use get_publisher_games, and for one game's store offers get_game_offers. `name` must be the franchise's exact name, as search_games lists it under franchises (Assassin's Creed), and an unknown name returns an error result. `total` is the franchise's full size, which can exceed `limit`. Links go through getcheapgames.com and carry the stores' partner tracking; listed prices exclude the service fee marketplaces add at checkout.",
