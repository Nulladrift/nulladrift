      "serverInfo": {
        "name": "getcheapgames",
        "title": "getcheapgames — game key price comparison",
        "version": "1.0.0",
        "websiteUrl": "https://getcheapgames.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
