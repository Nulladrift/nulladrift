              },
              "maxPrice": {
                "type": ["string", "null"]
              },
              "platform": {
                "type": ["string", "null"]
              },
              "ranking": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "bestListedPrice": {
                      "description": "The lowest listed price of an in-stock key that activates in the market; null for a free game, or when no such key is in stock.",
                      "type": ["string", "null"]
                    },
                    "bestMayNotActivateHere": {
                      "description": "True when keys are in stock but none is confirmed to activate in the market, so there is no bestListedPrice; never true beside a price.",
                      "type": ["boolean", "null"]
                    },
                    "buyUrl": {
                      "description": "Redirect through getcheapgames.com to the lowest-priced in-stock key that activates in the market; null when there is none.",
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "eligibleOfferCount": {
                      "description": "In-stock keys that activate in the market, in `currency`: the offers bestListedPrice is the lowest of, the count the game's page states.",
                      "type": "integer"
                    },
                    "eligibleStoreCount": {
                      "description": "Distinct stores among those eligible offers, as the page counts them.",
                      "type": "integer"
                    },
                    "genres": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "imageUrl": {
                      "type": ["string", "null"]
                    },
                    "isAtThirtyDayLow": {
                      "type": ["boolean", "null"]
                    },
                    "offerCount": {
                      "description": "Every listing tracked for the game, in any stock, region or currency. Not the set bestListedPrice is the lowest of: see eligibleOfferCount.",
                      "type": "integer"
                    },
                    "pageUrl": {
                      "description": "Its price comparison page.",
                      "type": "string"
                    },
                    "priceNote": {
                      "description": "Why there is no bestListedPrice, when there is none.",
                      "type": ["string", "null"]
                    },
                    "pricesByPlatform": {
                      "additionalProperties": {
                        "type": "string"
                      },
