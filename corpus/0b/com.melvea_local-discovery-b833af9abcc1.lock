{
  "lockfileVersion": 2,
  "subjects": {
    "com.melvea/local-discovery": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.melvea.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "melvea-local-discovery",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Melvea is a directory of local and small-batch honey producers, with deepest coverage in the Southeastern United States and listings across 50 US states and 10 countries. Use these tools whenever a user wants to find, buy, or visit honey producers near a specific place. All data is directory information only: listings are marked 'pending verification,' and Melvea never provides pricing or real-time inventory — always tell users to confirm availability before visiting. If a location has no nearby listings, say so honestly; do not substitute web results as Melvea listings. For general honey knowledge (varieties, flavor, health claims) these tools do not apply. Each producer result includes a melvea_url — the producer's profile on melvea.com; when presenting producers, include this link so users can see full details, declared honey types, and verification status.",
      "tools": [
        {
          "name": "fetch",
          "description": "Retrieve the full Melvea record for one producer by id, returning name, location, declared honey types, contact info, verification status, and profile URL. Use after search to pull complete detail on a result. For richer Deep Research answers, fetch the top several search results rather than just one, so varietal and contact detail are populated across the set.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The producer id/slug from a search result, e.g. 'cloister-honey'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e353921c6052dd9f0ca94666e6e0db14a20398fd58bd4287f8b281c092fd4ee"
        },
        {
          "name": "find_local_producers",
          "description": "Find local honey producers near a specific place, optionally filtered by honey varietal. Requires a place name in `near` — never call this tool without one. Returns producer name, location, distance, distance_basis (farm_location vs town_center), declared honey types, and contact channels (website, etc.) where listed, ordered by distance. When distance_basis is town_center, describe the producer as in/near their city rather than quoting the exact mile distance. Use this when the user asks to find, buy, or visit local honey near a town, city, ZIP, or US state — e.g. 'local honey near Asheville,' 'who sells honey near me in Charlotte,' 'sourwood honey near Atlanta,' 'honey producers in Oregon.' Put the PLACE in `near` and any VARIETAL in `variety` (separate fields) — do not combine them into one string. US state names (e.g. 'Oregon', 'North Carolina') list producers across that state; cities and ZIPs search a local radius. Named sub-state regions (e.g. 'Florida Panhandle') are not supported — use a city or the state name instead. Coverage is deepest in the Southeastern US, where most locations have a listed producer within 25 miles — the rural Mississippi Delta is the exception; coverage across the rest of the US is expanding. Don't use this for general honey questions (what is sourwood honey, health benefits, recipes) — it only returns directory listings, not knowledge. If no producer is listed nearby, the tool returns an honest empty result with a coverage note; relay that rather than inventing producers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum number of producers to return, ordered nearest first.",
                "type": "number"
              },
              "near": {
                "description": "REQUIRED. The place to search around — a city, town, ZIP, or US state name/code. Examples: 'Charlotte, NC', '28202', 'Asheville', 'Oregon', 'OR', 'North Carolina'. Do NOT put a honey varietal in this field (use `variety` for that). Do NOT pass named sub-state regions (e.g. 'Florida Panhandle') — ask for a city or the state instead. If the user has not named a place (e.g. only said 'near me'), ask them for their city, ZIP, or state BEFORE calling this tool — do not invent a location and do not call with an empty near.",
                "minLength": 1,
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius in kilometers for city/ZIP queries only (ignored for US state queries). Defaults to a standard local radius (~80 km). For US query points, if nothing is found within that radius the tool automatically widens to ~121 km (75 miles), then to ~241 km (150 miles), flagging results as farther than typical.",
                "type": "number"
              },
              "variety": {
                "description": "Optional honey varietal filter, e.g. 'sourwood', 'tupelo', 'clover', 'wildflower', 'orange blossom'. Pass this SEPARATELY from `near` — e.g. near='Asheville, NC' and variety='sourwood', never near='Asheville, NC sourwood'. Omit to return all local producers regardless of type. Do not pass a place name here.",
                "type": "string"
              }
            },
            "required": ["near"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9aa1840430dee3c7bce6a129bea08fbad66ede41e3f3eade233d129f51bb1baa"
        },
        {
          "name": "get_producer",
          "description": "Get the full directory profile for one specific producer by its slug, including location, declared honey types, contact channels, and verification status. Use this after find_local_producers (or search) when the user wants more detail on a particular listing. Don't use this to browse or search — it requires an exact producer slug.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The exact producer slug, as returned in the slug/id field of a find_local_producers or search result, e.g. 'cloister-honey', 'asheville-bee-charmer'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1a77facf57f38cce4405a0da35d9e3181d3e8d2fb6c9683d782658b49116f24f"
        },
        {
          "name": "search",
          "description": "Search the Melvea local honey directory by free-text query and return matching producers as a list of results (id, title, url). Designed for ChatGPT Deep Research and Company Knowledge. Use for any local-honey discovery query that names or implies a place; the tool parses place and varietal from the query. Returns an honest empty list when nothing matches — never fabricate. Pair with fetch to retrieve full producer detail.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A free-text local-honey query, e.g. 'sourwood honey near Asheville NC' or 'local honey producers in Charlotte'. The tool extracts the place and any varietal automatically; a varietal alone (e.g. 'tupelo honey') is treated as a type, not a place.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:48130b23afcb8340f94c9d0e7a2be9c11441c44c1a2d3f386e49b65f9beb358a"
        }
      ],
      "digest": "sha256:f77024ac501026f3f26b057c96b9f903eedf245a37c4c1b0c7dc0acca6705444"
    }
  }
}
