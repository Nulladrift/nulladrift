{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/feed-reader": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://feed-reader.bowling-anthony.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.mcpscores/feed-reader",
        "title": "MCPFax Feed Reader",
        "version": "1.0.2",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You need what a source published since you last looked, without re-reading everything before it. Tool calls are x402-paid in USDC on Base: send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). read_feed and discover_feeds cost $0.005 each. Pass 'since' with your last poll time to get only what is new — the cheap way to watch a source. initialize, ping and tools/list are free, as are request_data and demand_report. A URL that is not a feed returns not_a_feed and is NOT charged.",
      "tools": [
        {
          "name": "demand_report",
          "title": "What agents are asking for most (free)",
          "description": "FREE, no payment. The aggregate of what agents have told us they are looking for, most-requested first, with the categories nothing available yet serves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days, default 30, max 90.",
                "examples": ["30"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:461261ad42bf84d61377fdd16143b94cfa57291dcfeff96122da0471054405cb"
        },
        {
          "name": "discover_feeds",
          "title": "Find the feed for a website",
          "description": "Given a site's normal URL, return the feeds it declares in its HTML head, each with title and type. Use when you know a site publishes updates but not where its feed lives. If the page declares none, conventional locations are suggested and clearly marked as guesses that may 404. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The site's page URL, e.g. 'https://blog.rust-lang.org'.",
                "examples": ["https://blog.rust-lang.org"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2221fe5ecca0bdd60294a562c62b254ff91166fd0cf3fe01aec566aeca4ce51e"
        },
        {
          "name": "read_feed",
          "title": "Read an RSS or Atom feed as structured items",
          "description": "Fetch any RSS, RSS/RDF or Atom feed and get back one consistent shape: title, link, ISO-8601 publication date, author, summary and categories per item, plus the feed's own title and last-build time. The three feed dialects disagree about every element name and date format; this normalises them so you never branch on feed type. Pass 'since' to return only items published after a timestamp — the cheap way to poll for what changed. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum items to return. Default 20, maximum 100.",
                "examples": ["20"],
                "type": "string"
              },
              "since": {
                "description": "ISO-8601 timestamp; return only items published at or after it. Use your last poll time.",
                "examples": ["2026-08-23T00:00:00Z"],
                "type": "string"
              },
              "url": {
                "description": "Absolute URL of the feed itself, e.g. 'https://hnrss.org/frontpage'.",
                "examples": ["https://hnrss.org/frontpage"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:33743b186513925a290a962ed35cf2682ac63bb8c44777b1389a167bde86e4bc"
        },
        {
          "name": "request_data",
          "title": "Tell us what data you are looking for (free)",
          "description": "FREE, no payment. Describe in your own words the data you are trying to buy — anything, not just feeds — and get back whether we operate a service that supplies it, with the MCP endpoint if so. Every request is catalogued so repeatedly-requested data gets built. Nothing identifying is stored, only the words of the request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "What you are looking for.",
                "examples": ["live electricity spot prices by ZIP"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5bcbd1d81d3b998b00055e5b344c391028341d97cab08906f5b2079ed9d9d231"
        }
      ],
      "digest": "sha256:08bc70f8b2caba6ff6287cdb60b86c90683ee135223a88e5b290cbdec04bce7f"
    }
  }
}
