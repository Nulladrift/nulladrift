{
  "lockfileVersion": 2,
  "subjects": {
    "com.divetripplanner/caves": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://divetripplanner.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "divetripplanner",
        "title": "DiveTripPlanner",
        "version": "1.0.0",
        "websiteUrl": "https://divetripplanner.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cave and mine diving sites worldwide from divetripplanner.com: depths, required certification level, configurations, access, warnings, closures, who guides and fills nearby, and current conditions. Start with search_caves or list_regions, then get_cave or get_region. Always pass on the warnings and closures, link the page you used, and remind divers to dive within their training. Fair use: for answering divers' questions, at most 20 requests a minute; not for copying the database (for bulk or commercial use, contact jos@divetripplanner.com).",
      "tools": [
        {
          "name": "check_team",
          "title": "Which caves fit a team",
          "description": "The same check as the trip planner: for each cave of a region (or the given caves), whether the whole team can dive it, only partly, or not, with the reasons and the warnings that apply to them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "caves": {
                "description": "Cave ids; default all caves of the region.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "divers": {
                "items": {
                  "properties": {
                    "cert": {
                      "description": "Cave level: ow (none), cavern, intro, full.",
                      "enum": ["ow", "cavern", "intro", "full"],
                      "type": "string"
                    },
                    "configs": {
                      "description": "What they dive: backmount, sidemount, ccr, small (small/no-mount).",
                      "items": {
                        "enum": ["backmount", "sidemount", "ccr", "small"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "dpv": {
                      "description": "Brings a scooter and is DPV-trained.",
                      "type": "boolean"
                    },
                    "gasCerts": {
                      "description": "Gas certifications: nitrox, adv_nitrox, deco, normoxic, hypoxic.",
                      "items": {
                        "enum": ["nitrox", "adv_nitrox", "deco", "normoxic", "hypoxic"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "maxDepth": {
                      "description": "Their own depth limit in metres, if lower than their certifications give.",
                      "maximum": 400,
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "description": "A first name or label.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "srt": {
                      "description": "Trained in rope work (SRT).",
                      "type": "boolean"
                    }
                  },
                  "required": ["cert", "name"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "description": "Language of the texts: nl, en (default), fr, es or de.",
                "enum": ["nl", "en", "fr", "es", "de"],
                "type": "string"
              },
              "region": {
                "description": "Region id.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["divers", "region"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b929d6cb58d608a1f27ff184a23897bb2b7149058152d6c72d98b1b59ff15fa3"
        },
        {
          "name": "current_conditions",
          "title": "Current conditions",
          "description": "What is known about a cave right now: visibility reported by divers (last 14 days, else the latest up to 60 days), river flow and level with a visibility estimate where the cave has a gauge, rain of the past 7 days, and tropical storms nearby. Updated once a day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cave": {
                "description": "Cave id.",
                "maxLength": 80,
                "type": "string"
              },
              "lang": {
                "description": "Language of the texts: nl, en (default), fr, es or de.",
                "enum": ["nl", "en", "fr", "es", "de"],
                "type": "string"
              },
              "region": {
                "description": "Region id.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["cave", "region"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87c1c96e1a46566572535a01e8faad89098f21c5fbf2dffd8da38cf0a80a3d21"
        },
        {
          "name": "get_cave",
          "title": "Cave details",
          "description": "Everything the cave's public page says: depth, certification level, configurations, access, the story, warnings, closure, water temperature, who guides there, fill stations nearby and sources.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cave": {
                "description": "Cave id (from search_caves).",
                "maxLength": 80,
                "type": "string"
              },
              "lang": {
                "description": "Language of the texts: nl, en (default), fr, es or de.",
                "enum": ["nl", "en", "fr", "es", "de"],
                "type": "string"
              },
              "region": {
                "description": "Region id.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["cave", "region"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:863e09553293bd847821097897851d5e5ca6105b2e5c90ea16320496e23f2810"
        },
        {
          "name": "get_region",
          "title": "Region details",
          "description": "A region's practical information (rules, fees, emergency numbers, gas), travel advisory, its dive centres, instructors and fill stations with their services, and the list of its caves.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Language of the texts: nl, en (default), fr, es or de.",
                "enum": ["nl", "en", "fr", "es", "de"],
                "type": "string"
              },
              "region": {
                "description": "Region id from list_regions.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["region"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ff7632240a3b6a94496c580fc5b4551953de0285efef778ba57b09e782b9f40"
        },
        {
          "name": "list_regions",
          "title": "List regions",
          "description": "All cave diving regions with their country, number of caves, maximum depth and page address. Filter by country (ISO code or name).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Country code (fr, mx) or name (France, Mexico).",
                "maxLength": 80,
                "type": "string"
              },
              "lang": {
                "description": "Language of the texts: nl, en (default), fr, es or de.",
                "enum": ["nl", "en", "fr", "es", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8fdc4a019273d25c5f6c5e785f0320e5983431b618274f3f26a53e7d1dbad5d6"
        },
        {
          "name": "search_caves",
          "title": "Search caves",
          "description": "Find caves by name (also other spellings), region, country, maximum depth or the certification level a team has. Returns a short line per cave with its page; use get_cave for the details and warnings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "certification": {
                "description": "The team's cave level (ow, cavern, intro, full): only caves that need at most this.",
                "enum": ["ow", "cavern", "intro", "full"],
                "type": "string"
              },
              "country": {
                "description": "Country code or name.",
                "maxLength": 80,
                "type": "string"
              },
              "includeClosed": {
                "description": "Also closed and information-only caves (default false).",
                "type": "boolean"
              },
              "lang": {
                "description": "Language of the texts: nl, en (default), fr, es or de.",
                "enum": ["nl", "en", "fr", "es", "de"],
                "type": "string"
              },
              "limit": {
                "description": "At most this many results (default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maxDepth": {
                "description": "Only caves whose known maximum depth is at most this many metres.",
                "maximum": 400,
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Part of the cave's name.",
                "maxLength": 80,
                "type": "string"
              },
              "region": {
                "description": "Region id from list_regions (lot, riviera-maya).",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74caf507d95482c4f2acae77e697b5d3e6c0c1f701ee80f10775664946729c4d"
        }
      ],
      "digest": "sha256:9ab94da34aecff786afd40996b79cdb62fddc9ae467676ec29ef91542eb57cd6"
    }
  }
}
