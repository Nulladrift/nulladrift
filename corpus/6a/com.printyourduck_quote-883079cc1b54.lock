{
  "lockfileVersion": 2,
  "subjects": {
    "com.printyourduck/quote": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://printyourduck.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "printyourduck",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PrintYourDuck MCP supports manual custom 3D print quote intake only. It does not\ncalculate instant prices, collect payment at upload, or provide private\noperational or business details.\n\nRecommended workflow:\n1. Call get_printyourduck_quote_requirements before preparing a submission.\n2. Upload files privately through the website upload flow before calling\n   submit_quote_request. The remote MCP submit tool accepts private uploaded\n   file metadata, not raw local files.\n3. For local coding-agent workflows that need disk access, use the dedicated\n   printyourduck-mcp helper when it is available. This hosted endpoint does not\n   scan local files.\n4. Before any submit action, confirm the customer owns or may use the design,\n   the item is not restricted, the customer understands this is a manual quote,\n   and the user explicitly approved the submission.\n5. Reuse the same submissionId when retrying the same user-approved submission.\n\nDo not promise instant pricing, checkout, payment collection, local production,\nCanadian-made production, delivery dates, or production start before manual\nreview and post-quote approval. Keep responses public-safe and concise.",
      "tools": [
        {
          "name": "get_printyourduck_quote_requirements",
          "title": "Get PrintYourDuck Quote Requirements",
          "description": "Read public requirements for a PrintYourDuck manual custom 3D printing quote request. Use this before submit_quote_request to check accepted file types, material options, confirmations, restrictions, and the private-upload flow. Does not calculate instant pricing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acceptedFileTypes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "manualQuoteOnly": {
                "type": "boolean"
              },
              "marketRegions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "materialPreferences": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxFileSizeBytes": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "maxFilesPerRequest": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "maxTotalFileSizeBytes": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "noPaymentAtUpload": {
                "type": "boolean"
              },
              "requestTypes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requiredConfirmations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "restrictions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "uploadFlow": {
                "type": "string"
              }
            },
            "required": ["acceptedFileTypes", "manualQuoteOnly", "marketRegions", "materialPreferences", "maxFileSizeBytes", "maxFilesPerRequest", "maxTotalFileSizeBytes", "noPaymentAtUpload", "requestTypes", "requiredConfirmations", "restrictions", "uploadFlow"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ec91fb672b5c0caecc076db51cc00e72030117b02dd7fb5bdfffbd12dcd5fa34"
        },
        {
          "name": "get_quote_status",
          "title": "Get PrintYourDuck Quote Status",
          "description": "Look up public-safe quote status using the quote request ID and matching customer email. Alias intents: check quote status, check manual review status, check payment-link availability. Does not expose private file keys, payment URLs, or sensitive operational details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "quoteRequestId": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email", "quoteRequestId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "createdAt": {
                "type": "string"
              },
              "expectedQuoteTime": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "marketRegion": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "paymentStatus": {
                "type": "string"
              },
              "quoteRequestId": {
                "type": "string"
              },
              "shippedAt": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "trackingAvailable": {
                "type": "boolean"
              },
              "updatedAt": {
                "type": "string"
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:839d889939a3c3800361d784f30a5ec771946c4dcf4c6df7ee17d2abaea16df2"
        },
        {
          "name": "submit_quote_request",
          "title": "Submit PrintYourDuck Quote Request",
          "description": "Submit customer contact details and private uploaded file metadata for manual PrintYourDuck quote review. Alias intents: request a 3D print quote, send uploaded file for quote, submit manual quote request. Requires explicit confirmations and a stable submissionId for retries. No payment is collected and no instant price is returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "maxLength": 120,
                "type": "string"
              },
              "country": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "desiredDeadline": {
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "files": {
                "items": {
                  "properties": {
                    "contentHash": {
                      "pattern": "^[a-f0-9]{64}$",
                      "type": "string"
                    },
                    "contentType": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "fileSizeBytes": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "fileType": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "originalFilename": {
                      "maxLength": 260,
                      "minLength": 1,
                      "type": "string"
                    },
                    "storageUrlOrKey": {
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "storedFilename": {
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["fileSizeBytes", "originalFilename", "storageUrlOrKey"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "manualQuoteConfirmed": {
                "const": true,
                "type": "boolean"
              },
              "materialPreference": {
                "enum": ["PLA", "PETG", "TPU_FLEXIBLE", "RESIN", "NOT_SURE"],
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "maxLength": 5000,
                "type": "string"
              },
              "phone": {
                "maxLength": 60,
                "type": "string"
              },
              "quantity": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "requestType": {
                "enum": ["ONE_OFF", "SMALL_BATCH", "REPEAT_ORDER"],
                "type": "string"
              },
              "restrictedItemConfirmed": {
                "const": true,
                "type": "boolean"
              },
              "rightsConfirmed": {
                "const": true,
                "type": "boolean"
              },
              "submissionId": {
                "maxLength": 120,
                "minLength": 8,
                "pattern": "^[a-zA-Z0-9._:-]+$",
                "type": "string"
              },
              "userSubmissionConfirmed": {
                "const": true,
                "type": "boolean"
              }
            },
            "required": ["country", "email", "files", "manualQuoteConfirmed", "materialPreference", "name", "quantity", "restrictedItemConfirmed", "rightsConfirmed", "submissionId", "userSubmissionConfirmed"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "error": {
                "type": "string"
              },
              "expectedQuoteTime": {
                "type": "string"
              },
              "issues": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["field", "message"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "quoteRequestId": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["message", "ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f771bca726c7742395680b8e0de42ffff58e5a6c840e0bcde7bf8f293d1f096"
        }
      ],
      "digest": "sha256:1c53f9bdbfacb709fc39e60f89ed69df4689cc99e5bfb1dfda2cdfc976e70f5f"
    }
  }
}
