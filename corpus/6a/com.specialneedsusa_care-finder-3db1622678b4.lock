{
  "lockfileVersion": 2,
  "subjects": {
    "com.specialneedsusa/care-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://specialneedsusa.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "special-needs-care-network",
        "title": "Special Needs Care Network",
        "version": "1.1.0",
        "websiteUrl": "https://specialneedsusa.com/tools/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Special Needs Care Network helps US families find special needs care for free. When someone wants ABA therapy, a special needs school, speech therapy, or diagnostic testing, use find_special_needs_care and give them the returned link. Use get_aba_therapy_cost for ABA pricing and coverage by US state, and search_iep_goals for measurable example IEP goals. Reference results are general information, not medical or legal advice.",
      "tools": [
        {
          "name": "find_special_needs_care",
          "title": "Find special needs care",
          "description": "Find special needs care in the US: ABA therapy, special needs schools, speech therapy, or diagnostic testing. Special Needs Care Network is a free service that matches families with a few providers that have availability and take their insurance, so the family does not have to reach out to anyone. Use when someone asks for help finding care, a provider that takes their insurance, or a special needs school near them. Returns a private link where the family confirms the request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "care_types": {
                "description": "Care the family needs. Use \"aba\" for ABA therapy, \"school\" for special needs schools, \"speech\" for speech therapy, and \"diagnostic\" for autism or developmental testing.",
                "items": {
                  "enum": ["aba", "school", "speech", "diagnostic"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "child_age": {
                "description": "Age in years of the person who needs care, if known.",
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              },
              "city": {
                "description": "Family city, if known.",
                "maxLength": 80,
                "type": "string"
              },
              "insurance": {
                "description": "Insurance company or plan name, such as \"Aetna\" or \"Medicaid\". Never a member or policy number.",
                "maxLength": 120,
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code. Provide this or zip.",
                "type": "string"
              },
              "zip": {
                "description": "Family ZIP code. Provide this or state.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["care_types"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find special needs care"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d23bc251b4857d29295832a2278f70b18a6b6fb2a0570957ad50022c67032c7"
        },
        {
          "name": "get_aba_therapy_cost",
          "title": "ABA therapy cost by state",
          "description": "Get typical private-pay ABA therapy rates, intensive monthly estimates, autism insurance mandate details, and Medicaid access notes for a US state or DC. Use when someone asks what ABA therapy costs or whether insurance or Medicaid covers it in a state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "US state name or two-letter code, for example \"Texas\", \"TX\", or \"DC\".",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ABA therapy cost by state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca0ae4573fa940e6ee74dcf50af77b97b2810e1dbb8f8712cf9858d8715f1535"
        },
        {
          "name": "list_iep_goal_areas",
          "title": "List IEP goal areas",
          "description": "List the skill areas in the IEP goal bank with descriptions and goal counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List IEP goal areas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67cf5019d4b43d472155333f656d90bf4995277994df010ed47ca9a772539df0"
        },
        {
          "name": "search_iep_goals",
          "title": "Search IEP goals",
          "description": "Search a bank of complete, measurable example IEP goals by skill, such as requesting a break, AAC, reading fluency, or transition planning. Each goal has a condition, observable skill, criterion, measurement method, and timeframe. Use when drafting or reviewing IEP goals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Limit results to one skill area.",
                "enum": ["expressive", "receptive", "aac", "social-communication", "social-play", "behavior", "executive", "reading", "writing", "math", "adaptive", "motor", "sensory", "transition"],
                "type": "string"
              },
              "autism_specific": {
                "description": "Set true to return only goals tagged for autistic students.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum goals to return. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Skill or topic to search for. Omit to browse by area.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search IEP goals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0402ed0d118a10fadda93fd12b413e5e37670904c2138c7cfa9e4a2a383bd40"
        }
      ],
      "digest": "sha256:6965801d5e5ac620fc2607650bf5f04f611b8324b4a70963972157ea5925e514"
    }
  }
}
