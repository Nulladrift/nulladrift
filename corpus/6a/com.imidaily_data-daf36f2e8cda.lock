        {
          "name": "get_settlement_blocs",
          "title": "Supranational Settlement Blocs",
          "description": "IMI Daily's Supranational Settlement Blocs (SSBs): treaties such as EU/EEA free movement, MERCOSUR, GCC, CARICOM/OECS, ECOWAS, the Common Travel Area and the Trans-Tasman Travel Arrangement that give citizens of one member settlement rights in others. Includes member countries, tiers, conditions and whether CBI citizens are excluded.",
