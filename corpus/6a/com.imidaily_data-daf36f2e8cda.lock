          "title": "Recent program and rule changes",
          "description": "Dated log of changes IMI Daily detected in its datasets: program minimums, timelines and requirements, citizenship-catalog rules, approved-agent additions and removals, settlement blocs, and EB-5 regional center approvals and terminations.",
