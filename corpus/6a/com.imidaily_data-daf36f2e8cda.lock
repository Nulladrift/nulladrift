          "title": "Get a program profile",
          "description": "Full IMI Daily profile of one program: investment options and minimums, income and net-worth requirements, validity, stay rules, years to PR and citizenship, dual citizenship, visa-free access, settlement blocs, plus overview, how to qualify, benefits, citizenship timeline and legal basis (with source links).",
