          "description": "Everything IMI Daily holds on a country: all paths to citizenship from the IMI Citizenship Catalog (naturalization, marriage, descent, investment, birth, exception, dual citizenship), settlement-bloc memberships, residence and citizenship programs, approved CBI agent lists, statistics datasets and tax regimes. For the United States it also summarizes the USCIS EB-5 regional center lists.",
