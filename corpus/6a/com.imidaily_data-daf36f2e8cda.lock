        {
          "name": "search_programs",
          "title": "Search residence and citizenship programs",
          "description": "Search IMI Daily's database of 300+ residence-by-investment, citizenship-by-investment, golden visa, digital nomad, retirement/independent-means, talent and descent programs worldwide. Filter by country, region, type, budget, income, stay requirement and time to citizenship. Returns compact rows with a url to each IMI Daily program page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citizenship_path": {
                "description": "Only programs that can lead to citizenship",
                "type": "boolean"
              },
              "country": {
                "description": "Country name, e.g. 'Portugal'",
                "type": "string"
              },
              "grants": {
                "description": "Status granted: 'Citizenship', 'Permanent Residency' or 'Temporary Residency'",
                "type": "string"
              },
              "limit": {
                "description": "1-100, default 20",
                "type": "integer"
              },
              "max_annual_income_usd": {
                "description": "Applicant's annual income in USD (returns programs whose income requirement is at or below this)",
                "type": "number"
              },
              "max_annual_stay_days": {
                "description": "Maximum days per year the person can spend in the country",
                "type": "integer"
              },
              "max_investment_usd": {
                "description": "Maximum minimum-investment budget in USD",
                "type": "number"
              },
              "max_years_to_citizenship": {
                "description": "Maximum years to citizenship",
                "type": "number"
              },
              "offset": {
                "description": "Pagination offset",
                "type": "integer"
              },
              "program_type": {
                "description": "e.g. 'Citizenship by Investment', 'Residence by Investment' (golden visa), 'Digital Nomad Visa', 'Independent Means Visa', 'Active Investor Visa', 'Talent Visa', 'Citizenship by Descent'",
                "type": "string"
              },
              "query": {
                "description": "Free text, e.g. 'EU golden visa real estate'",
                "type": "string"
              },
              "region": {
                "description": "Region, e.g. 'Europe', 'Americas', 'Asia', 'Africa', 'Oceania'",
                "type": "string"
              },
              "settlement_bloc": {
                "description": "Settlement bloc, e.g. 'EU/EEA', 'MERCOSUR', 'GCC', 'CARICOM'",
                "type": "string"
              },
              "sort": {
                "enum": ["min_investment", "years_to_citizenship", "annual_stay", "visa_free", "relevance"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
