        {
          "name": "find_eb5_regional_centers",
          "title": "EB-5 regional centers (USCIS)",
          "description": "Check the U.S. EB-5 regional centers designated by USCIS: the current approved list and the list of terminated centers with termination dates and whether the termination is under appeal. Search by center name or ID, filter by state or status. Data comes from the official USCIS lists, refreshed several times a day. Approval is a USCIS designation, not an endorsement of the center or its projects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "1-500, default 50",
                "type": "integer"
              },
              "query": {
                "description": "Regional center name or USCIS ID (e.g. 'RC2200000218' or 'ID1504052589')",
                "type": "string"
              },
              "state": {
                "description": "U.S. state name or two-letter code, e.g. 'Texas' or 'TX'",
                "type": "string"
              },
              "status": {
                "description": "Default all",
                "enum": ["approved", "terminated", "all"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "EB-5 regional centers (USCIS)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9656ccd84cb10833843f228f1c92539b4e57ce1486bc69e54755c3d7d469f67"
        },
