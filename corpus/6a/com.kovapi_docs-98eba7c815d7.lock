{
  "lockfileVersion": 2,
  "subjects": {
    "com.kovapi/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kovapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kovapi-docs",
        "title": "KovAPI Docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the KovAPI API documentation. Use search_docs to find a page, read_doc to read it as Markdown, list_models for model ids and prices. Base URL for API calls: https://kovapi.com/v1 (OpenAI-compatible) and https://kovapi.com/anthropic (Anthropic Messages).",
      "tools": [
        {
          "name": "list_models",
          "title": "List models and prices",
          "description": "Every model on sale at KovAPI with its id, name, vendor, category and USD price, plus the link to its API doc (Markdown).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Only this category.",
                "enum": ["chat", "image", "video"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dbdb3ef77f152da87054b53b30d27be7bc4ed497d2de673eef992c1f686da2f4"
        },
        {
          "name": "read_doc",
          "title": "Read a docs page as Markdown",
          "description": "Return one KovAPI documentation page as Markdown. Pass a path or URL, e.g. /docs/api, /docs/nano-banana-2, /docs/guide/errors, /docs/integrations/claude-code, /docs-guide, /docs/webhooks, or a docs.kovapi.com URL. A language prefix (/zh /en /es /ja /ko /ru) picks the language; the bare path is the site default.",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Docs path or full URL.",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c93b40e8271a32e609d3b59cf77323d46ad3facbb955727fb3c84da21ac78b4"
        },
        {
          "name": "search_docs",
          "title": "Search the KovAPI docs",
          "description": "Search the KovAPI API documentation: guide pages and sections, every model doc, endpoints, integrations and the FAQ. Returns titles with URLs; read one with read_doc.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the docs to search (default en).",
                "enum": ["zh", "en", "es", "ja", "ko", "ru"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for, e.g. \"image to image\", \"webhook signature\", \"429\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e789c0cf6246d2440c3185d776aa90d6a64c0327e362ae1bfc05e61656898d30"
        }
      ],
      "digest": "sha256:cf18969c9630f2aa08ae11460b5447f35723c29153851edfdbaf025ad7e7a5d9"
    }
  }
}
