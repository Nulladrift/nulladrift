        },
        {
          "name": "render_game_room",
          "title": "Show the game room card",
          "description": "Renders a Play Face to Face room result as an invitation card with the room code, QR invitation, guest link, and host action.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "expires_at": {
                "type": "string"
              },
              "game": {
                "type": "string"
              },
              "game_name": {
                "type": "string"
              },
              "host_url": {
                "format": "uri",
                "type": "string"
              },
              "join_url": {
                "format": "uri",
                "type": "string"
              },
              "joined_players": {
                "type": "integer"
              },
              "options": {
                "additionalProperties": {},
                "type": "object"
              },
              "player_count": {
                "type": "integer"
              },
              "qr_payload": {
                "format": "uri",
                "type": "string"
              },
              "room_id": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["expires_at", "game", "game_name", "host_url", "join_url", "joined_players", "options", "player_count", "qr_payload", "room_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show the game room card"
          },
