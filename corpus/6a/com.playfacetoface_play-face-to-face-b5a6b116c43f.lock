              }
            ]
          },
          "digest": "sha256:375af1a81d18d9a42a8fecb4bd7e1c3894381635deda187056cfbfe313b06f77"
        },
        {
          "name": "get_room_status",
          "title": "Get game room status",
          "description": "Returns the public waiting or expiry status of a Play Face to Face room.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "room_id": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["room_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get game room status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
