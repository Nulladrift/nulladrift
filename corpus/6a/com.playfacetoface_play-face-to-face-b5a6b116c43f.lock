          "digest": "sha256:25668401c5758fb6e4167b1ebba68ffbf0d5d81aa0caf28d1f98b9d4cac33845"
        },
        {
          "name": "list_games",
          "title": "List Play Face to Face games",
          "description": "Returns multiplayer games currently available for browser room creation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
