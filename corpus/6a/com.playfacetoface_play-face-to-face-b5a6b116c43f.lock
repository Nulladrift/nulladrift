              }
            ]
          },
          "digest": "sha256:2389120c4a48c5c4f808d75bc9c35ecfa51be7749e2f9572e745b132ebcbfc73"
        },
        {
          "name": "record_invite_copied",
          "title": "Record invitation copy",
          "description": "Record that the room card copied a guest invitation. This tool is available only to the room card.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "room_id": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["room_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
