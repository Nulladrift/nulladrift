        },
        {
          "name": "recommend_games",
          "title": "Recommend multiplayer games",
          "description": "Returns currently available Play Face to Face games ranked against player count, available time, complexity, and preferences.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "complexity": {
                "enum": ["easy", "medium", "high"],
                "type": "string"
              },
              "max_duration_minutes": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "player_count": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "preferences": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend multiplayer games"
