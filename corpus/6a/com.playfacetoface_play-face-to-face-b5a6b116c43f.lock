          "listChanged": true
        }
      },
      "instructions": "Play Face to Face provides a current game catalog, recommendations, supported room options, ephemeral room creation, room status, and a browser invitation card.",
      "tools": [
        {
          "name": "create_game_room",
          "title": "Create a multiplayer game room",
          "description": "Creates an ephemeral Play Face to Face multiplayer room that friends can join from browsers. The result includes a canonical guest link, a room-scoped host link, public room metadata, and an expiry time. The idempotency key associates retries with one creation intent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "A game ID returned by list_games.",
                "minLength": 1,
                "type": "string"
              },
              "idempotency_key": {
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "options": {
                "additionalProperties": {},
                "default": {},
                "type": "object"
              },
              "player_count": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["game", "idempotency_key", "player_count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a multiplayer game room"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Game room created.",
            "openai/toolInvocation/invoking": "Creating game room…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:6494b7796ae744dd52686202eb1fb46d95b40ef11cb11cd85856dc670e338b09"
        },
        {
          "name": "get_game_options",
          "title": "Get supported game options",
