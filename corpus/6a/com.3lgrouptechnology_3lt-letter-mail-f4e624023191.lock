            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:c65c03a752bdf8c1e5c825bc6607984ee629b5096be6c29a7388f6f4c0a391c8"
        },
        {
          "name": "create_fax_draft",
          "title": "Draft a Fax",
          "description": "Create a fax DRAFT: validates the recipient number, counts the PDF's\npages, screens its text, and returns a price quote (Phaxio per-page\ncost x pages + the flat $1.00 service fee). This NEVER transmits\nanything — call approve_fax, then send_fax.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "your 3L-Group Technology API key (lms_...).",
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "optional label for your own records."
              },
              "pdf_path": {
                "description": "path to the PDF file on the server to fax.",
                "type": "string"
              },
              "to_number": {
                "description": "recipient fax number — 10-digit US number or a full\nE.164 number starting with +.",
                "type": "string"
              }
            },
            "required": ["api_key", "pdf_path", "to_number"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:701774ecf62e98428cb5caf47784b3c1d3abadb58de2053a0e9613c156cd536b"
        },
        {
          "name": "draft_letter",
          "title": "Draft a Letter",
          "description": "Create a letter DRAFT: verifies the recipient address with PostGrid,\nscreens content, and returns a price quote. This NEVER mails anything.\n\nPass EITHER html (letter body as an HTML string) OR pdf_path (path to a\nPDF file on the server). PDF text is extracted for screening; if\nextraction fails the draft is kept but flagged needs_review.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "your 3L-Group Technology API key (lms_...).",
                "type": "string"
              },
              "certified": {
                "default": false,
                "description": "OPT-IN ONLY — True for USPS Certified Mail with Electronic\nReceipt (tracked, signature on delivery). Defaults to False, which\nsends standard First Class mail. Only set True when the customer\nexplicitly asked for certified mail: it costs significantly more\n(PostGrid's certified rate + the flat $1.00 service fee, roughly\n$11 per letter). Never default this to True.",
                "type": "boolean"
              },
              "color": {
                "default": false,
                "description": "True for color printing, False for black & white.",
                "type": "boolean"
              },
              "description": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "optional label for your own records."
              },
              "from_address": {
                "additionalProperties": true,
                "description": "sender address dict, same shape as `to`.",
                "type": "object"
              },
              "html": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "letter body as an HTML string (use this OR pdf_path)."
              },
              "pdf_path": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "server-local path to a PDF to mail instead of html."
              },
              "quantity": {
                "default": 1,
                "description": "number of identical letters (10+ gets the bulk rate).",
                "type": "integer"
              },
              "to": {
                "additionalProperties": true,
                "description": "recipient address dict with name, address_line1, address_city,\naddress_state, address_zip (US).",
                "type": "object"
              }
            },
            "required": ["api_key", "from_address", "to"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
