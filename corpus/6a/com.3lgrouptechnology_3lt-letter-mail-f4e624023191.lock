          },
          "digest": "sha256:27b3d88a833ecec052ae5be245e98a4f2e7de8f3d7278cdb5f0e6537acbcfe60"
        },
        {
          "name": "send_fax",
          "title": "Send a Fax",
          "description": "Transmit an APPROVED fax via Phaxio. Refuses drafts that were never\napproved and faxes that were already sent — a fax can be transmitted\nexactly once.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "your 3L-Group Technology API key (lms_...).",
                "type": "string"
              },
