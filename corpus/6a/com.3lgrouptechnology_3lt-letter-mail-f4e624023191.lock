        },
        {
          "name": "request_send",
          "title": "Request Letter Send",
          "description": "Request that a draft be mailed.\n\napproval-tier keys: creates a PENDING request and returns a one-tap\nAllow/Deny approval_url for the human. Nothing is mailed until Allow.\non_command keys: may auto-send inside guardrails (spend caps, content\nscreening, anomaly detection); anything outside them stays PENDING.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "your 3L-Group Technology API key (lms_...).",
                "type": "string"
              },
              "draft_id": {
                "description": "the draft_id returned by draft_letter.",
                "type": "integer"
              }
            },
            "required": ["api_key", "draft_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
