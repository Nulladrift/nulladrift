      "tools": [
        {
          "name": "approve_fax",
          "title": "Approve a Fax",
          "description": "Approve a fax DRAFT so it can be transmitted. The content is\nre-screened at approval time. Only the key that created the fax can\napprove it. Nothing is transmitted by this call — send_fax does that.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "your 3L-Group Technology API key (lms_...).",
                "type": "string"
              },
              "fax_id": {
                "description": "the fax_id returned by create_fax_draft.",
                "type": "integer"
              }
            },
            "required": ["api_key", "fax_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
