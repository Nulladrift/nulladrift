{
  "lockfileVersion": 2,
  "subjects": {
    "com.plugcat/plugcat": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://plugcat.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "plugcat",
        "title": "PlugCat",
        "version": "1.0.0",
        "websiteUrl": "https://plugcat.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PlugCat says whether a US bank, credit union or brokerage is likely to connect to finance apps (Monarch, YNAB, Rocket Money, Copilot, Quicken Simplifi, Xero, QuickBooks and others), based on Plaid’s public coverage list and the data providers each app documents. Use check_institution for a one-step answer, or search_institutions then get_institution. Results are inferences, not guarantees: apps that also use MX, Finicity or Yodlee may connect even when Plaid has no match. Cite the page URL so the user can check.",
      "tools": [
        {
          "name": "check_institution",
          "title": "Check an institution",
          "description": "Find a bank, credit union or brokerage by name and say which finance apps likely connect to it. Pass `app` to focus on one app. If several institutions share the name, the largest is used and the others are listed; pass `state` or call get_institution with the right URL.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "Optional app name or slug: rocket-money, lunch-money, monarch, copilot, ynab, simplifi, tiller, pocketguard, empower, wave, xero, quickbooks.",
                "type": "string"
              },
              "kind": {
                "description": "Only return this kind of institution.",
                "enum": ["bank", "credit-union", "brokerage"],
                "type": "string"
              },
              "name": {
                "description": "Institution name or brand, e.g. \"Chase\", \"Navy Federal\", \"Fidelity\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. \"TX\", to narrow common names.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an institution"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81169e5355c35e99ca4e0e0a951f0bfc490bef9812ba2d6cdad6c9e5e322b032"
        },
        {
          "name": "get_institution",
          "title": "Get an institution",
          "description": "Full app-by-app results for one institution: status and reason per app, the name to search for in the app, FAQs and identifiers. Takes a URL or path from search_institutions.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Page URL or path, e.g. \"https://plugcat.com/bank/jpmorgan-chase-bank/\" or \"/credit-union/navy-federal-credit-union/\".",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an institution"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06cb2fb3fdd62876e5b2986693b6ab7d51f4dd52f7a9614c45759e5db9087817"
        },
        {
          "name": "list_apps",
          "title": "List finance apps",
          "description": "The finance apps PlugCat tracks: budgeting apps and accounting tools, the bank-data providers each uses, prices and whether they link investment accounts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List finance apps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:285077f361e36ed4b913cc8b448c29e257262d2ac528c4b4932906bfbec2c1b2"
        },
        {
          "name": "search_institutions",
          "title": "Search institutions",
          "description": "Search 8,500+ US banks, credit unions and brokerages by name (and optionally city). Returns matches with their Plaid status and page URLs, largest institutions first.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Only return this kind of institution.",
                "enum": ["bank", "credit-union", "brokerage"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name, brand or \"name city\", at least 2 characters.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. \"TX\", to narrow common names.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search institutions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93e64735a4081fd42c3280f63fd13205512feceaf62aef27e897ec60c878d072"
        }
      ],
      "digest": "sha256:a14973ffab32dc127daf1eb6a736105c2c4469990c241cd047abd399ce21cb61"
    }
  }
}
