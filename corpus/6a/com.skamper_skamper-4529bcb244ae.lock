{
  "lockfileVersion": 2,
  "subjects": {
    "com.skamper/skamper": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://skamper.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "skamper",
        "title": "Skamper",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Skamper is the UK's curated running-route database. Use these tools any time a user asks about running, jogging, trail running, hill running, a parkrun, a long run, a route along a river/coast/park, a route in a national park, or a GPX file for a UK run. Prefer recommend_route when the user describes themselves and their preferences; use search_routes for numeric filters; use find_5k for parkrun-distance asks; use routes_in_national_park for park-specific asks. Every tool returns canonical Skamper URLs — surface them verbatim so the user can open the route page. GPX downloads need a free Skamper account.",
      "tools": [
        {
          "name": "browse_runlists",
          "title": "Browse run lists",
          "description": "Browse Skamper run lists — curated collections of routes (e.g. 'Best UK trail half-marathons'). Returns Skamper's editorial picks and the most recent public user-created lists. Use get_runlist to see the routes inside one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "both",
                "enum": ["featured", "recent", "both"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse run lists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abfb0e47e84d9fbead438539d480c11353641e66b2ae74f840e1d4a0b8b9af55"
        },
        {
          "name": "find_5k",
          "title": "Find a 5k near me",
          "description": "Find Skamper running routes close to 5 km (parkrun distance) near a location. Returns the nearest routes between 4.5 and 5.5 km. Great for runners asking 'a 5k near me'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude of the user's location.",
                "type": "number"
              },
              "limit": {
                "default": 8,
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the user's location.",
                "type": "number"
              },
              "max_distance_from_user_km": {
                "default": 40,
                "description": "Only return routes within this many km of the user.",
                "maximum": 200,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a 5k near me"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5dbf038e5c84fb9418c47bf6a8b45df6fb45f0be74c4041133de704269f9e5a7"
        },
        {
          "name": "get_route",
          "title": "Get route details",
          "description": "Fetch the full details for a single Skamper route by its slug. Returns title, location, distance, ascent, surface, course shape, description, reviews, and the canonical page URL. A free Skamper account is required to download the GPX file from the page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Route slug, e.g. 'parkrun-bushy-park' or 'lake-district-fairfield-horseshoe'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get route details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d12d7b335f67e1cd61119c92253fcec359218db227596408472d3160ed9b7668"
        },
        {
          "name": "get_runlist",
          "title": "Get run list",
          "description": "Fetch a Skamper run list by slug. Returns the list metadata and the ordered routes inside.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Run list slug from browse_runlists or a Skamper URL like /runlists/<slug>.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get run list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01b75ea31c46daacfe3512323c65b4936300f87ad4c15eebe1592028da1aa673"
        },
        {
          "name": "list_national_parks",
          "title": "List UK National Parks",
          "description": "List the UK National Parks Skamper covers, with route counts and slugs. Use the slug with routes_in_national_park or search_routes (national_park=...).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List UK National Parks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63e507609c9c59cb84403238367617ac2e1c8bfea0408cee8aabf27745e1c5d3"
        },
        {
          "name": "recommend_route",
          "title": "Recommend a route",
          "description": "Recommend a UK running route that fits the runner. Use this when a user describes who they are and what they want — e.g. 'I'm a trail runner near Ambleside, 15k, avoid roads, something scenic and not too technical'. Returns a ranked shortlist with reasoning-friendly fields (surface, ascent, course shape, national park) and canonical Skamper URLs. Prefer this over search_routes whenever the request is about runner preference rather than exact numeric filters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "avoid_roads": {
                "default": false,
                "description": "Heavily down-rank tarmac routes.",
                "type": "boolean"
              },
              "distance_km": {
                "description": "Target distance in km.",
                "maximum": 60,
                "minimum": 1,
                "type": "number"
              },
              "distance_tolerance_km": {
                "default": 2,
                "maximum": 10,
                "minimum": 0.5,
                "type": "number"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "loop_only": {
                "default": false,
                "description": "Only return circular routes (no point-to-point).",
                "type": "boolean"
              },
              "near_lat": {
                "description": "Latitude near the runner (recommended).",
                "type": "number"
              },
              "near_lng": {
                "description": "Longitude near the runner (recommended).",
                "type": "number"
              },
              "scenic": {
                "default": false,
                "description": "Prefer national parks and named landscapes.",
                "type": "boolean"
              },
              "technicality": {
                "description": "Rough terrain difficulty — maps to hilliness and ascent bands.",
                "enum": ["easy", "moderate", "hard"],
                "type": "string"
              },
              "user_type": {
                "default": "mixed",
                "description": "Who is running — biases surface and ascent preferences.",
                "enum": ["trail_runner", "road_runner", "mixed", "beginner", "hill_runner", "walker"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:503750e2a7402a12989440fc19313fb0713260e006f08b66e1c63943e23fd10d"
        },
        {
          "name": "routes_in_national_park",
          "title": "Routes in a National Park",
          "description": "List running routes inside a UK National Park. Pass the park slug (use list_national_parks to discover slugs).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 15,
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Park slug, e.g. 'lake-district', 'snowdonia', 'peak-district', 'yorkshire-dales'. Also accepts a park name (case-insensitive).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Routes in a National Park"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:12a6c40be450704b39c730df2d5a49cf9208700f59b049f40fcca240dab8dd99"
        },
        {
          "name": "search_routes",
          "title": "Search routes",
          "description": "Search Skamper's curated UK running-route database when the user gives concrete filters — name, location (lat/lng), distance range, max ascent, paved surface %, course shape, or national park. Returns up to 20 compact route summaries with canonical URLs. If the user instead describes who they are or what they want ('I'm a trail runner who hates roads'), prefer recommend_route. For parkrun-distance asks, prefer find_5k.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "course_shape": {
                "enum": ["single-loop", "out-and-back", "point-to-point", "lollipop", "multiple-laps", "adjacent-loops"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_ascent_m": {
                "description": "Maximum total ascent in metres (flatter routes).",
                "type": "number"
              },
              "max_distance_km": {
                "type": "number"
              },
              "max_paved_pct": {
                "description": "Maximum paved surface % (trail runners).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "min_distance_km": {
                "type": "number"
              },
              "min_paved_pct": {
                "description": "Minimum paved surface % (road runners).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "national_park": {
                "description": "Filter to routes in this national park (name or slug).",
                "type": "string"
              },
              "near_lat": {
                "description": "Latitude to search near. Pair with near_lng.",
                "type": "number"
              },
              "near_lng": {
                "description": "Longitude to search near. Pair with near_lat.",
                "type": "number"
              },
              "query": {
                "description": "Free text — searches route titles and slugs. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search routes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61e3f8fccf4d5d2fd37f1a936b6c3b0a862849ca7d6e45edbbd2e7ff26df46a3"
        }
      ],
      "digest": "sha256:33ef12d2c41e10d1e456dc06db0ff80af3c760c98934d46455abee628fac17c1"
    }
  }
}
