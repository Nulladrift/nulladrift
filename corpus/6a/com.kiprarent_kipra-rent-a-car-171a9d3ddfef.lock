                      "type": "string"
                    },
                    "per_day_eur": {
                      "type": "number"
                    }
                  },
                  "required": ["kind", "name", "per_day_eur"],
                  "type": "object"
                },
                "type": "array"
              },
              "available_count": {
                "type": "number"
              },
              "booking_url": {
                "description": "Opens the list of cars for these dates.",
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "next_available": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "pickup_at": {
                        "type": "string"
                      },
                      "return_at": {
                        "type": "string"
                      },
                      "vehicle_count": {
                        "type": "number"
                      }
                    },
                    "required": ["pickup_at", "return_at", "vehicle_count"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "pickup_at": {
                "type": "string"
              },
              "pickup_location": {
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "type": "string"
