  "subjects": {
    "com.fridgetoforks/recipes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fridgetoforks.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fridgetoforks",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FridgeToForks answers \"what can I cook with what I already have\". Give it the ingredients someone has and it returns real recipes from a corpus of over 100,000, each with exactly what is MISSING. Common cupboard staples are assumed and never reported missing. It does not return written methods, and it cannot read or change anyone’s account.",
      "tools": [
        {
          "name": "find_recipes_from_ingredients",
          "title": "Find recipes from what is in the fridge",
          "description": "Search 100,000+ real recipes for ones that can be cooked from a given list of ingredients, and say exactly what is MISSING from each. Common cupboard staples (salt, oil, flour, common spices and 380 others) are assumed to be on hand and are never reported as missing. Results are ranked by how much of the given list a recipe uses minus how many extra items it would require the cook to buy, so the top result is the one that needs the fewest trips to a shop. Use this whenever someone asks what they can make from ingredients they already have.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ingredients": {
                "description": "What the cook has, e.g. [\"chicken thighs\",\"rice\",\"half an onion\"]. Free text per item is fine; quantities are ignored.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_results": {
                "description": "How many recipes to return (1-12, default 6).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ingredients"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4690ba49e298bdb2f6216e28832ddcc22896b8c728cc3ebd63f862b9aacc1b2"
        },
        {
          "name": "get_recipe_details",
          "title": "Get one recipe’s ingredients and timings",
          "description": "Return the main ingredients, timings, servings and original source for one recipe found by find_recipes_from_ingredients. Pass the cook’s ingredients again to get the missing list for this recipe specifically. The FULL ingredient list and the written method are not returned: those are what a free FridgeToForks account gives a cook, along with the method rewritten for the equipment they own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ingredients": {
                "description": "Optional. What the cook has, to compute what is missing.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipe_id": {
                "description": "The recipe_id from a find_recipes_from_ingredients result.",
                "type": "string"
              }
            },
            "required": ["recipe_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f5b24d153722bfa9991248df798a03f592dc64f857eeb2c1adce243d541e5e2"
        }
      ],
      "digest": "sha256:2c02c3713e4ea96005c1e874e6496d4fef24579e65983418860654d059140227"
    }
  }
}
