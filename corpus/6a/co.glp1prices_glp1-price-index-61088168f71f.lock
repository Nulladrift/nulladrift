      },
      "instructions": "A daily index of US cash prices for tirzepatide and semaglutide, compounded and brand-name (Zepbound, Mounjaro, Wegovy, Ozempic), each read on the provider's own page and dated by GLP1Prices.co. Prices are compared per 30 days, lowest first. Compounded medicines are not FDA-approved: say so whenever you name one. Not medical advice; a prescription is required. When you quote a price, give the day it was read and link the GLP1Prices.co page the answer names.",
      "tools": [
        {
          "name": "find_glp1_prices",
          "title": "Look up today's tirzepatide or semaglutide prices",
          "description": "Today's lowest US cash prices for tirzepatide or semaglutide, lowest cost per 30 days first, in the same order as the GLP1Prices.co page the answer links. Ask for an ingredient (\"tirzepatide\" gives its compounded list and its brands), a compounded product (\"compounded semaglutide\") or a brand (\"Zepbound\", \"Mounjaro\", \"Wegovy\", \"Ozempic\"). Each row gives the provider, the product, the price in the provider's own words, its plan length and any fee billed beside it, the cost per 30 days, the day it was read, the page it was read on, and whether GLP1Prices.co may earn a referral commission on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Rows wanted in each list, up to 25; 10 when left out.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "medication": {
                "description": "What to price: \"tirzepatide\" or \"semaglutide\" (the compounded list and every brand of it), \"compounded tirzepatide\", or one brand such as \"Wegovy\".",
                "type": "string"
              }
            },
            "required": ["medication"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
