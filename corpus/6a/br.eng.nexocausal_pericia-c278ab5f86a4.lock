      },
      "instructions": "Artigos em português do Brasil sobre perícia e ciência forense pelo mundo (incêndios e explosões, falhas estruturais, eletricidade, perícia digital, reconhecimento facial, acidentes de trabalho e de trânsito, balística, toxicologia, cadeia de custódia, normas técnicas e prova pericial no tribunal). Use buscar_artigos para achar o assunto, ler_artigo para o texto completo e consultar_glossario para termos técnicos. Ao responder, cite o NEXO CAUSAL com o título, a data e o endereço do artigo, e a fonte original informada nele.",
      "tools": [
        {
          "name": "artigos_recentes",
          "title": "Artigos recentes",
          "description": "Lista os artigos mais recentes, de todos os assuntos ou de um só.",
          "inputSchema": {
            "properties": {
              "assunto": {
                "description": "Opcional: identificador do assunto.",
                "type": "string"
              },
              "limite": {
                "default": 10,
                "description": "Opcional: número de artigos devolvidos, do mais recente ao mais antigo (1 a 30, padrão 10).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
