            "readOnly": true
          },
          "digest": "sha256:7da7b8f98f716b03989e35beac379e6ce12932e78ba72dace934ef0a5a60b860"
        },
        {
          "name": "buscar_artigos",
          "title": "Buscar artigos",
          "description": "Busca artigos do NEXO CAUSAL por palavras (em português ou inglês) no título, no resumo e nos marcadores. Devolve título, data, assunto, resumo, fonte original e endereços (página e Markdown).",
          "inputSchema": {
            "properties": {
              "assunto": {
                "description": "Opcional: identificador do assunto (veja listar_assuntos), ex.: \"eletricidade\".",
                "type": "string"
              },
              "consulta": {
                "description": "Palavras a buscar, ex.: \"incêndio bateria de lítio\" ou \"reconhecimento facial erro\".",
                "type": "string"
              },
              "limite": {
                "default": 8,
                "description": "Opcional: número máximo de artigos devolvidos (1 a 20, padrão 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3efe778e77dfd87ef02f9631d9bf4ae86780812d82549e0b038984be005e5ba"
        },
        {
          "name": "consultar_glossario",
          "title": "Consultar glossário",
          "description": "Procura termos de perícia no glossário do NEXO CAUSAL (definição, equivalente em inglês e artigos em que aparecem).",
          "inputSchema": {
            "properties": {
              "limite": {
                "default": 5,
                "description": "Opcional: número máximo de termos devolvidos (1 a 20, padrão 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "termo": {
                "description": "Termo ou parte dele, em português ou inglês, ex.: \"arco elétrico\" ou \"flashover\".",
                "type": "string"
              }
            },
            "required": ["termo"],
            "type": "object"
          },
          "annotations": {
