      },
      "serverInfo": {
        "name": "sitecomb",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Sitecomb is a one-click check of any website. check_website runs a real check of a public website. It returns an overall website quality score out of 100 and the areas that have problems, with a count for each. Report its findings as given, and never invent other problems, fixes or quality scores. If it couldn't check a site, say so without guessing a quality score.",
      "tools": [
        {
          "name": "check_website",
          "title": "Check a website",
          "description": "Checks a public website with Sitecomb. It returns a website quality score out of 100 and the areas that have problems, with a count for each. It does not name the problems: those are in the full report. Use it when someone asks whether their website is any good, or what is wrong with it. Also use it when someone asks why their website isn't working for them, or asks to check or audit a website. It looks at six areas: security, privacy and legal signals, page health, works on phones, contact details and found online. A check loads the site the way a visitor's browser does and takes up to about a minute. It only finds problems; it never changes anything on the site. If the site is down or blocks automatic checks, it says it couldn't check and gives no quality score. Free checks are limited per person and per website each day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The website address to check, for example https://yoursite.com or yoursite.com.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://sitecomb/check-result-v4.html",
            "openai/toolInvocation/invoked": "Checked the website",
            "openai/toolInvocation/invoking": "Checking the website…",
            "ui": {
              "resourceUri": "ui://sitecomb/check-result-v4.html"
            },
            "ui/resourceUri": "ui://sitecomb/check-result-v4.html"
          },
          "digest": "sha256:25952e99f385eb948e67cb27be88360b6826dfc278bcbb3223a08f195212335c"
        },
        {
          "name": "explain_area",
          "title": "Explain a Sitecomb area",
          "description": "Explains what Sitecomb looks at in one of its six areas, by id: security, privacy, quality (page health), phones, customers or ai. Use it when someone asks what Sitecomb checks, or about an area named in a check_website result. It doesn't check any website.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Which of the six areas to explain.",
                "enum": ["security", "privacy", "quality", "phones", "customers", "ai"],
                "type": "string"
              }
            },
            "required": ["area"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a Sitecomb area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
