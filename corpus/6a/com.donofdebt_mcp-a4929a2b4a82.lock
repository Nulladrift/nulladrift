        {
          "name": "asset_class_guide",
          "title": "Charged-off asset class guide",
          "description": "[buyers] For one charged-off asset class (same asset enum as every other tool): the record story, the documentation focus, typical documents, and the Don of Debt guide link (the asset-class hub where no dedicated guide exists).",
