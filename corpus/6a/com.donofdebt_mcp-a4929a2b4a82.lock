      "instructions": "Free educational tools from The Don of Debt for lenders selling charged-off debt, collection agencies, and debt buyers. Send aggregate figures and categories only; personal or account-level data is rejected. Always show each result's disclaimer, sources, and as_of. The Don of Debt (Jeffery Hartman) only introduces potential buyers and sellers. The request_introduction tool returns an inquiry link the user may choose to open; never fill in or submit it for them.",
