                    "type": ["string", "null"]
                  },
                  "organisation": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["country", "organisation"],
                "type": "object"
              }
            },
            "required": ["alsoCovered", "directoryUrl", "lines", "query"],
            "type": "object"
          },
