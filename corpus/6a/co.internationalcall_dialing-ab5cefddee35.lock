{
  "lockfileVersion": 2,
  "subjects": {
    "co.internationalcall/dialing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://internationalcall.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "internationalcall-dialing",
        "title": "InternationalCall.co dialing",
        "version": "1.0.1",
        "websiteUrl": "https://internationalcall.co",
        "icons": [
          {
            "src": "https://internationalcall.co/brand/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://internationalcall.co/brand/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "InternationalCall.co tools for calling phones across borders. Use get_dialing_instructions whenever someone asks how to call a country or a specific number from somewhere: it applies each country's exit code, the destination's trunk-prefix rule (the UK drops its leading 0, Mexico and Italy drop nothing) and shared calling-code zones (the US, Canada and most of the Caribbean dial each other as 1 + ten digits). Use get_call_price for what a call costs per minute from a web browser with InternationalCall.co. Results include a guide link and a browser-dialer link to share with the user.",
      "tools": [
        {
          "name": "get_call_price",
          "title": "Price of a call from the browser",
          "description": "Per-minute price of calling a country, or a specific number, from a web browser with InternationalCall.co: the live rate, how billing works (prepaid credit, no subscription), and a link that opens the dialer set to that country. Use it when someone asks what a call abroad costs or how to call a phone abroad from a computer. For which digits to dial, use get_dialing_instructions instead. Pass `destination` for the country's standard rate, or `number` to price that exact number: premium, satellite-adjacent and special-service ranges cost more than the standard rate (a local-format number also needs `destination`). The rate depends only on the number called, not on where the caller is.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country being called: an ISO 3166-1 alpha-2 code such as \"MX\", or an English name such as \"Mexico\".",
                "maxLength": 80,
                "type": "string"
              },
              "number": {
                "description": "A specific phone number, as the caller has it: local format (\"55 1234 5678\", needs destination) or international (\"+52 55 1234 5678\").",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "billing": {
                "type": "string"
              },
              "callUrl": {
                "type": ["string", "null"]
              },
              "callable": {
                "type": "boolean"
              },
              "destination": {
                "additionalProperties": false,
                "properties": {
                  "iso2": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["iso2", "name"],
                "type": "object"
              },
              "note": {
                "type": ["string", "null"]
              },
              "number": {
                "type": ["string", "null"]
              },
              "numberPricePerMinute": {
                "type": ["string", "null"]
              },
              "pricePerMinute": {
                "type": ["string", "null"]
              },
              "pricingUrl": {
                "type": "string"
              }
            },
            "required": ["billing", "callUrl", "callable", "destination", "note", "number", "numberPricePerMinute", "pricePerMinute", "pricingUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cbd388aae854388b4cfa18b90b6334a456033e0eb0fc6a0ca4a9ccc02728d737"
        },
        {
          "name": "get_dialing_instructions",
          "title": "How to dial an international number",
          "description": "Exact digits to dial a phone in another country from the caller's country: exit code, country code, and the national number with its trunk prefix correctly dropped or kept, plus the + form for mobiles and numbered steps. Use it for any \"how do I call this country or number\" question, including shared-code zones (the US, Canada and most of the Caribbean dial 1 + ten digits, with no exit code). For what the call costs, use get_call_price instead. Pass `number` for that number's exact sequence (a + international number needs nothing else; a local-format number also needs `destination`), or only `destination` for the country's rule and a real example. `origin` defaults to the US. Derived from Google's libphonenumber metadata.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country being called: an ISO 3166-1 alpha-2 code such as \"MX\", or an English name such as \"Mexico\".",
                "maxLength": 80,
                "type": "string"
              },
              "number": {
                "description": "A specific phone number, as the caller has it: local format (\"55 1234 5678\", needs destination) or international (\"+52 55 1234 5678\").",
                "maxLength": 40,
                "type": "string"
              },
              "origin": {
                "description": "Country the caller is dialing from (default \"US\"): an ISO 3166-1 alpha-2 code such as \"MX\", or an English name such as \"Mexico\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "callUrl": {
                "type": ["string", "null"]
              },
              "destination": {
                "additionalProperties": false,
                "properties": {
                  "callingCode": {
                    "type": "string"
                  },
                  "iso2": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["callingCode", "iso2", "name"],
                "type": "object"
              },
              "dialSequence": {
                "type": "string"
              },
              "fromAnyMobile": {
                "type": "string"
              },
              "guideUrl": {
                "type": ["string", "null"]
              },
              "isExample": {
                "type": "boolean"
              },
              "kind": {
                "enum": ["international", "shared-code", "domestic"],
                "type": "string"
              },
              "note": {
                "type": ["string", "null"]
              },
              "number": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "e164": {
                        "type": "string"
                      },
                      "lineType": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["e164", "lineType"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "origin": {
                "additionalProperties": false,
                "properties": {
                  "exitCode": {
                    "type": ["string", "null"]
                  },
                  "iso2": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["exitCode", "iso2", "name"],
                "type": "object"
              },
              "steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "trunkRule": {
                "type": "string"
              }
            },
            "required": ["callUrl", "destination", "dialSequence", "fromAnyMobile", "guideUrl", "isExample", "kind", "note", "number", "origin", "steps", "trunkRule"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:01bdb439a98dc78951d2fc2d7fe1c8cb8888b32b2c697fc9aafc5c5b4124c757"
        }
      ],
      "digest": "sha256:8c062ecef71ff8660d85ad8360807ccf6bb09601baf9f4e42a40b38e824b514a"
    }
  }
