      "instructions": "InternationalCall.co tools for calling phones across borders. Use get_dialing_instructions whenever someone asks how to call a country or a specific number from somewhere: it applies each country's exit code, the destination's trunk-prefix rule (the UK drops its leading 0, Mexico and Italy drop nothing) and shared calling-code zones (the US, Canada and most of the Caribbean dial each other as 1 + ten digits). Use get_call_price for what a call costs per minute from a web browser with InternationalCall.co. Results include a guide link and a browser-dialer link to share with the user. Use find_number_for_callers_abroad when someone abroad needs to reach an organisation back home (a tax office, pension or benefits agency, immigration service, bank or phone carrier): domestic hotlines and toll-free numbers mostly do not connect from abroad, and it returns the number the organisation itself publishes for callers abroad, with its hours and the page it was read on. It covers banks, tax offices, pension and social security offices, health insurers, consular lines, immigration and passport offices, student loan offices, carriers and airlines in 89 countries, by name or by kind of office.",
      "tools": [
        {
          "name": "find_number_for_callers_abroad",
          "title": "Number an organisation gives callers abroad",
          "description": "The phone number a tax office, pension or benefits agency, immigration service, bank, student loan servicer or phone carrier publishes for people calling from OUTSIDE its country (domestic short codes, 0800/1-800 and 0300-style numbers mostly do not connect from abroad), as read on the organisation's own website, with its published hours and time zone, the source page, and a link that opens a browser dialer with the number filled in. Pass `organisation` (\"HMRC\", \"Wells Fargo\", \"National Pension Service\", \"Kela\") and optionally `country` to narrow it, or only `country` to list what is covered there. For how to dial a number use get_dialing_instructions; for what a call costs use get_call_price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The organisation's country: an ISO 3166-1 alpha-2 code such as \"MX\", or an English name such as \"Mexico\".",
                "maxLength": 80,
                "type": "string"
              },
              "organisation": {
                "description": "The organisation, as people call it (\"HMRC\", \"Social Security\", \"Banco BHD\", \"Kela\"), or the kind of office when the name is not known (\"tax office\", \"pension\", \"health insurance\", \"consulate\", \"passport\", \"student loan\", \"bank\", \"airline\"); pair it with `country`.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alsoCovered": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "directoryUrl": {
                "type": "string"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "callUrl": {
                      "type": "string"
                    },
                    "callableFromBrowser": {
                      "type": "boolean"
                    },
                    "country": {
                      "type": "string"
                    },
                    "e164": {
                      "type": "string"
                    },
                    "hours": {
                      "type": "string"
                    },
                    "iso2": {
                      "type": "string"
                    },
                    "line": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "number": {
                      "type": "string"
                    },
                    "organisation": {
                      "type": "string"
                    },
                    "pageUrl": {
                      "type": "string"
                    },
                    "reachableFromPhoneAbroad": {
                      "type": "boolean"
                    },
                    "sourceUrl": {
                      "type": "string"
                    },
                    "testCallConnectedOn": {
                      "type": "string"
                    },
                    "timeZone": {
                      "type": "string"
                    },
                    "verifiedOn": {
                      "type": "string"
                    }
                  },
                  "required": ["callUrl", "country", "e164", "hours", "iso2", "line", "note", "number", "organisation", "pageUrl", "sourceUrl", "timeZone", "verifiedOn"],
                  "type": "object"
                },
                "type": "array"
