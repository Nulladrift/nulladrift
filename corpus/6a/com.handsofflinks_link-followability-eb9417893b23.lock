      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.handsofflinks/link-followability",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fetches a page and reports whether a specific link on it is followable, combining X-Robots-Tag, robots meta tags and anchor rel tokens with most-restrictive-wins.",
      "tools": [
        {
          "name": "check_link_followability",
          "title": "Check whether a link on a page is followable",
          "description": "Fetch a live web page and decide whether a link on it is followable by a crawler. Combines the X-Robots-Tag response header, the robots/user-agent meta tags, and the anchor's own rel tokens (nofollow, ugc, sponsored), with the most restrictive signal winning. Returns a verdict per matching anchor plus the exact reasons it was blocked. Use it to verify a backlink you were promised is actually followable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page_url": {
                "description": "Absolute http(s) URL of the page that contains the link.",
                "type": "string"
              },
              "target": {
                "description": "Optional. Only report anchors whose href (raw or resolved) contains this string, or whose host equals it. Omit to evaluate every anchor on the page.",
                "type": "string"
              },
              "user_agent": {
                "description": "Optional crawler name to evaluate for, e.g. 'googlebot'. Directives addressed to another named agent are then ignored. Defaults to the wildcard agent.",
                "type": "string"
              }
            },
            "required": ["page_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:acefa8289a7f7b7bdc5cb9aa6a1c8b073f69dd0e7124afe7bbb0d210f53c3b90"
        }
      ],
      "digest": "sha256:d07c6634a6a2a90aefd5252a896e2ce12f61ccf3e50802d012c59de04fe5af1c"
    }
  }
}
