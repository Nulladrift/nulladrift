        {
          "name": "request_booking",
          "title": "Request a booking (the person confirms)",
          "description": "Hold one free time for the user for 5 minutes. This does NOT book the appointment. It returns confirm_url: you MUST show that link to the user right away and tell them to open it, enter their phone number and the code we text them, and confirm. Until they do, nothing is booked; never say the appointment is booked or confirmed. Depending on the professional, confirming books it at once or sends a request the office accepts or declines. Use a start_local value from get_availability. If the professional cannot be booked online, the answer gives their contact options instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_name": {
                "description": "Full name of the person who will attend (they can correct it on the confirm page).",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "lang": {
                "description": "Language of the confirm page and messages for the user (ISO 639-1). Default: the professional's language.",
                "type": "string"
              },
              "mode": {
                "description": "office (in person) or video. Default: in person when offered.",
                "enum": ["office", "video"],
                "type": "string"
              },
              "reason": {
                "description": "Optional short reason for the visit, in the user's words. Leave out sensitive details.",
                "maxLength": 200,
                "type": "string"
              },
              "slug": {
                "description": "The professional's slug.",
                "type": "string"
              },
              "start": {
                "description": "Start time in the professional's local time, YYYY-MM-DDTHH:MM (start_local from get_availability). An ISO time with offset is also accepted.",
                "type": "string"
              }
            },
            "required": ["client_name", "slug", "start"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "items": {
                  "properties": {
                    "label": {
                      "description": "Day and hour in words",
                      "type": "string"
                    },
                    "start": {
                      "description": "Same time as ISO 8601 with UTC offset",
                      "type": "string"
                    },
                    "start_local": {
                      "description": "Local wall time of the professional, YYYY-MM-DDTHH:MM",
                      "type": "string"
                    }
                  },
                  "required": ["label", "start", "start_local"],
                  "type": "object"
                },
                "type": "array"
              },
              "confirm_url": {
                "type": "string"
              },
              "contact": {
                "properties": {
                  "page_url": {
                    "type": "string"
                  },
                  "phone": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "whatsapp_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["page_url", "phone", "whatsapp_url"],
                "type": "object"
              },
              "expires_at": {
                "type": "string"
              },
              "hold_minutes": {
                "type": "integer"
              },
              "mode": {
                "enum": ["office", "video"],
                "type": "string"
              },
              "needs_professional_approval": {
                "type": "boolean"
              },
              "professional": {
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["name", "slug"],
                "type": "object"
              },
              "reason": {
                "type": "string"
              },
              "start": {
                "type": "string"
              },
              "start_local": {
                "type": "string"
              },
              "status": {
                "enum": ["needs_confirmation", "unavailable", "contact_directly"],
                "type": "string"
              },
              "what_to_tell_user": {
                "type": "string"
              },
              "when": {
                "type": "string"
              }
            },
            "required": ["professional", "status", "what_to_tell_user"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a booking (the person confirms)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
