        },
        {
          "name": "search_professionals",
          "title": "Search professionals",
          "description": "Find claimed physicians, dentists, attorneys or accountants listed on Siporpro. Use free text (e.g. \"cardiologist Panama City\", \"abogado de migración\") and/or filters. Words that name a place must match the professional's location; results match every word when possible (match: all), else some of them (match: partial). Returns ranked matches with their public page URL and can_book (true = request_booking works for them). Only real, claimed profiles are listed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City or neighborhood, e.g. \"Panama City\", \"Obarrio\".",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. PA, US, MX.",
                "type": "string"
              },
              "lang": {
                "description": "Language for the answer (ISO 639-1): es, en, pt, fr, de, it, zh, ja, ko, ar, hi, ru, id. Default en.",
                "type": "string"
              },
              "language": {
                "description": "Only professionals who attend in this language (ISO 639-1, e.g. es, en).",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results (default 10, at most 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "profession": {
                "description": "physician (medical doctor), dentist, attorney (lawyer) or accountant (CPA).",
                "enum": ["physician", "dentist", "attorney", "accountant"],
                "type": "string"
              },
              "query": {
                "description": "Free text: specialty, name, area, need. Any language.",
                "type": "string"
              },
              "specialty": {
                "description": "Specialty words, e.g. \"cardiology\", \"pediatría\", \"immigration\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "match": {
                "description": "all = every query word matched; partial = only some did (none matched all).",
                "enum": ["all", "partial"],
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "area": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "can_book": {
                      "type": "boolean"
                    },
                    "city": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "country": {
                      "type": "string"
                    },
                    "languages": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page_url": {
                      "type": "string"
                    },
                    "profession": {
                      "enum": ["physician", "dentist", "attorney", "accountant"],
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "specialties": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "video_visits": {
                      "type": "boolean"
                    }
                  },
                  "required": ["area", "can_book", "city", "country", "languages", "name", "page_url", "profession", "slug", "specialties", "title", "video_visits"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["match", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search professionals"
          },
