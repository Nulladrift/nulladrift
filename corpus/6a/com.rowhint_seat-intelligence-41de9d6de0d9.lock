{
  "lockfileVersion": 2,
  "subjects": {
    "com.rowhint/seat-intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.rowhint.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "RowHint Seat Intelligence",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "rowhint_compare_seats",
          "description": "Compare two specific seats on the same aircraft side by side. Returns scores, notes, dimensions, and a recommendation for which seat is better. Use when someone asks \"Should I pick 14A or 22F on the Southwest 737 MAX 8?\" or is deciding between two seats.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "config_id": {
                "description": "Aircraft configuration ID",
                "type": "string"
              },
              "seat_a": {
                "description": "First seat to compare (e.g., 14A)",
                "type": "string"
              },
              "seat_b": {
                "description": "Second seat to compare (e.g., 22F)",
                "type": "string"
              }
            },
            "required": ["config_id", "seat_a", "seat_b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04cab9cd825e17d0c8c17cb3a393fab896ffb43602929032ae9f398947349205"
        },
        {
          "name": "rowhint_get_best_seats",
          "description": "Find the highest-rated seats on a specific aircraft configuration. Filter by cabin class (economy, premium, business, first) and number of results. Use when someone asks \"What's the best seat on the United 777?\" or \"Best economy seat on Delta A321neo?\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cabin": {
                "description": "Filter by cabin tier. Omit for all cabins.",
                "enum": ["economy", "premium", "business", "first"],
                "type": "string"
              },
              "config_id": {
                "description": "Aircraft configuration ID",
                "type": "string"
              },
              "limit": {
                "description": "Number of seats to return (default 3, max 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["config_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b19fe8ce31180c336c336e590f7c1c0b1ec818bbefe7818ce54f337df4ee7bef"
        },
        {
          "name": "rowhint_get_config_overview",
          "description": "Get a summary of an aircraft configuration including total seats, cabin layout, best and worst seats per cabin, and facility locations (galleys, lavatories). Use when someone asks \"Tell me about the American Airlines 787-9\" or wants a general overview before choosing a seat. Also use to discover valid config_ids for other tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aircraft": {
                "description": "Aircraft slug (e.g., boeing-787-9). Use with airline.",
                "type": "string"
              },
              "airline": {
                "description": "Airline slug (e.g., american-airlines). Use with aircraft.",
                "type": "string"
              },
              "config_id": {
                "description": "Direct configuration ID (e.g., AA-789). Takes precedence if both provided.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0c11feb5b7545511866e09310ea00c0f11dc12b647653a6e8d35c708afef561"
        },
        {
          "name": "rowhint_get_seat_score",
          "description": "Get the quality score (1-10), color rating, and detailed notes for a specific airline seat. Returns comfort assessment, recline data, proximity warnings, and window alignment issues. Use when someone asks \"Is seat 14A good on the Delta 737-800?\" or wants to know about a specific seat before booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "config_id": {
                "description": "Aircraft configuration ID (e.g., DL-738, UA-77W). Get valid IDs from rowhint_get_config_overview.",
                "type": "string"
              },
              "seat": {
                "description": "Seat identifier — row number + letter (e.g., 21A, 3F, 45K)",
                "type": "string"
              }
            },
            "required": ["config_id", "seat"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a0877cb1f6db54ef279020b5cdf404ba9d6102ccaf3d6a756db27b27365aa02"
        },
        {
          "name": "rowhint_get_windowless_seats",
          "description": "List all window-position seats that have no actual window on a specific aircraft. These are seats labeled as window seats in airline booking systems but where the fuselage structure blocks the view. Use when someone asks about window seats, specifically wants to avoid windowless positions, or is choosing between window seats.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "config_id": {
                "description": "Aircraft configuration ID",
                "type": "string"
              }
            },
            "required": ["config_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:191f39e34d0009337662e564e91e9c490c97e4f22e59faed9c71f188cbec312c"
        },
        {
          "name": "rowhint_help_me_pick",
          "description": "Conversational seat picker. Asks the user a few structured questions (flight, route length, what they care most about, cabin class), then returns the top 3 seat recommendations with notes. Use this when someone wants help choosing but hasn't specified a seat or even which aircraft — the tool walks them through it via elicitation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "flight": {
                "description": "Optional flight number. If omitted, the tool will elicit it from the user.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:344999f7ffc9789832df7349ab91be7a4dba576ab8392270d869c43445df790d"
        },
        {
          "name": "rowhint_pick_seat",
          "description": "Get the best seat recommendations for a specific flight. Takes a flight number (e.g., \"UA1234\", \"DL567\") and optionally cabin class, seat position preference (window/aisle), and priority (legroom/recline/quiet). Returns top picks with scores and notes, seats to avoid, aircraft info, and a confidence rating. Use when someone says \"I'm flying AA1234 next week, where should I sit?\" or \"Best window seat on DL567?\" This is the easiest way to get seat recommendations — just provide a flight number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cabin": {
                "description": "Cabin class filter",
                "enum": ["economy", "premium", "business", "first"],
                "type": "string"
              },
              "flight": {
                "description": "Flight number (e.g., UA1234, DL567, AA100)",
                "type": "string"
              },
              "position": {
                "description": "Seat position preference",
                "enum": ["window", "aisle", "middle"],
                "type": "string"
              },
              "priority": {
                "description": "What matters most: legroom, recline, or quiet location",
                "enum": ["legroom", "recline", "quiet"],
                "type": "string"
              }
            },
            "required": ["flight"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ce6dc14255c1e43872efc70c2794576b2216a8816c252700a30b4d2b8cf3ccb"
        },
        {
          "name": "rowhint_seat_roast",
          "description": "Roasts a specific airline seat. Returns a one-paragraph, voice-y takedown of the seat based on its quality score, proximity issues, recline/legroom data, and any notes. Use when someone asks 'how bad is seat 31B on the United 787-9?' — they want the unvarnished truth, not a neutral lookup.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "config_id": {
                "description": "Aircraft configuration ID. If omitted, the tool elicits it from the user.",
                "type": "string"
              },
              "seat": {
                "description": "Seat identifier (e.g., 31B). If omitted, the tool elicits it.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b1d06c9d5dcb81a47ddf2ac33331f4069a5ebfff139f3b4a7d6051a00d0a212"
        }
      ],
      "digest": "sha256:16859c7546618464a9b219161eb2f05992298e4959af29b7623f8fb832fa7e79"
    }
  }
}
