      "tools": [
        {
          "name": "ask_business",
          "title": "Ask a verified business a question",
          "description": "Ask one plain question about a verified business, for example \"do you take emergency calls on weekends?\" or \"is the Tuesday class for beginners?\". The answer is written at once from what the business published on Orbylon (who it is, its hours, its phone, what it sells and its prices) and from nothing else: when that does not answer the question, the reply says so (answered: false) and gives the business's phone to ask directly. It never guesses. Not every business answers questions here; one that does not points to list_business_offerings and lookup_business instead. Prices, bookings and orders still go through list_business_offerings, place_order and request_quote.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The business domain, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "question": {
                "description": "One question about the business, in the customer's words",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask a verified business a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d89198d797b64a09a346beae0655387dfe9233d78ea6d5ec4e956cd40838c61"
        },
        {
          "name": "check_business_token",
          "title": "Check a gift card, pass or membership",
          "description": "Return what is left on a closed-loop token issued by a business through Orbylon: a gift card, prepaid hours, a membership or a points balance. Takes the code printed on the card. The amount left is balance_cents for a gift card (integer cents, in currency), balance_hours for prepaid hours or balance_points for points, and reads_as says it in words, money written like every price here (e.g. CA$25.00 left); a membership is only valid or not. These are not money and cannot be cashed out or transferred: they are only good with the business that issued them, which is named in the answer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "The code on the card, e.g. ABCD-2345-PQRS",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a gift card, pass or membership"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c257f1577d777f76eefe9bbc5d9665543e4f736023501b424e54ac0e73eb9f31"
        },
        {
          "name": "find_businesses",
          "title": "Find businesses by need and place",
          "description": "Find businesses that sell what the customer needs in the place they name, for example need \"espresso beans\" and place \"Montreal\", or need \"plumber\" and place \"H2X\". Both are required. Searches businesses published on Orbylon whose owners proved they own their website, by the words of what they sell and the place they named. Results are ordered by how closely those words match, then by name. No business pays to rank higher, and a business that is not on Orbylon is not here. Each result gives the business's name, city, address, hours and phone as its owner confirmed them, what it sells with exact prices, and which tool to use next: place_order for a priced item, request_quote for an item priced on request, list_business_offerings for the full list. At most 10 results. To try it on Orbylon's fictional test businesses, use the place \"Orbylon Test City\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "need": {
                "description": "What the customer needs, in a few words: a product, a service or a kind of business",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "place": {
                "description": "Where: a city, a region or a postal code, e.g. Montreal, Laval, QC or H2X 1Y4",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["need", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find businesses by need and place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f878414547a9bf492755ad7f56c613e24c88ef878b19ba1c485bb8cd8701652"
        },
        {
          "name": "get_order_status",
          "title": "Check an order",
          "description": "Return what happened to an order placed with place_order: its status, the item, the quantity, the total, and, when the business takes card payment, whether it is paid and the pay_url if not. Takes the business domain and the reference the order answer gave. Never returns the buyer's address, email or phone.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The business domain, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "reference": {
                "description": "The reference place_order returned",
                "maxLength": 64,
                "minLength": 6,
                "type": "string"
              }
            },
            "required": ["domain", "reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:67ae54491056a24b531640311cb6b90bca897fa4870b2c815075daae5122394d"
        },
        {
          "name": "list_business_offerings",
          "title": "List what a verified business sells",
          "description": "Return the machine-readable catalogue a verified business publishes. Under owner_provided: who and where the business is, then each item with its name, description, integer price in cents, currency and unit, as the business typed them. Prices are exactly what the business published. An item with price_on_request: true has no price (it reads \"Price on request\"): the business quotes each job, so ask it with request_quote rather than estimate a number.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The business domain, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List what a verified business sells"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5776a5751d889bcc5b6e920cea8be93b3d536d786862deb553bf9c657d9299d2"
        },
        {
          "name": "list_business_paid_endpoints",
          "title": "List the calls a verified business sells",
          "description": "Return the priced endpoints a verified business publishes: each with its title, what it does, the HTTP method, the price, and the URL to call. Calling that URL returns HTTP 402 with payment terms in the Payment-Required header, and the payment settles directly to the business. A call that fails is never charged for. A business that sells none answers an empty list with a note saying so.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The business domain, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the calls a verified business sells"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17dc9fef0081fb828e00a3665dc8bab5646bb0b70dee678f6d33da26b0915ee0"
        },
        {
          "name": "lookup_business",
          "title": "Look up a verified business",
          "description": "Return the verified identity record for a domain: its domain-bound Ed25519 public key, when it was verified and how, and what it can prove: its signed documents (under capabilities.proofs.list, each with its slug, when it was signed, its SHA-256 and a verify link anyone can open) and a published catalogue of what it sells. Use this before trusting or transacting with a business. A 'not verified' answer means Orbylon has no proof about them, not that they are fraudulent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The business domain, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a verified business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c0cb488939561fcacb842a392626df0484d6ff39b707e0d6f794ebf2ad43363"
        },
        {
          "name": "place_order",
          "title": "Order from a verified business",
          "description": "Order an item a verified business publishes (see list_business_offerings or find_businesses). Two steps. First call without confirm: it places nothing and returns the seller, the item, the quantity, the unit price, the full total, the currency, how payment happens, and the refund and cancelling terms. Show those to the customer. Then call again with the same fields and confirm: true, only after the customer agreed. The order goes straight to the business, where it already works: email, its own store or its own system, and the answer carries a reference to pass to get_order_status. When the business connected a payment account (Stripe, PayPal, Mollie, Razorpay, Lemon Squeezy or Paddle), the answer carries a pay_url on that account; the money goes to the business, never to Orbylon. For an appointment, the answer can carry a book_url where the buyer chooses the time on the business's own booking page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirm": {
                "description": "Leave out to see the seller, the full price and the terms first. Send true only after the customer agreed to them.",
                "type": "boolean"
              },
              "domain": {
                "description": "The business domain, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "fulfilment": {
                "description": "How the buyer receives it, and how the business reaches them",
                "properties": {
                  "address": {
                    "properties": {
                      "city": {
                        "maxLength": 100,
                        "type": "string"
                      },
                      "country": {
                        "maxLength": 60,
                        "type": "string"
                      },
                      "line1": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "line2": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "postal": {
                        "maxLength": 20,
                        "type": "string"
                      },
                      "region": {
                        "maxLength": 100,
                        "type": "string"
                      }
                    },
                    "required": ["city", "country", "line1", "postal"],
                    "type": "object"
                  },
                  "email": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["ship", "email", "pickup", "none"],
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "note": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["kind"],
                "type": "object"
              },
              "idempotency_key": {
                "description": "Send the same key when retrying",
                "maxLength": 128,
                "type": "string"
              },
              "item": {
                "description": "The item name exactly as listed",
                "maxLength": 140,
                "minLength": 1,
                "type": "string"
              },
              "item_id": {
                "description": "The item id from the catalogue",
                "maxLength": 140,
                "minLength": 1,
                "type": "string"
              },
              "note": {
                "maxLength": 400,
                "type": "string"
              },
              "quantity": {
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domain", "fulfilment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Order from a verified business"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2ce1e65fa5e04a04d39561c9b7476acdb7883f797a71d350952644f6acc5b8c3"
        },
        {
          "name": "request_quote",
          "title": "Ask a verified business for a quote",
          "description": "Ask a verified business for a quote on an item it lists as price on request (price_on_request: true in list_business_offerings): a roofer, a lawyer, a garage. The request is emailed to the business, which replies to the customer with its price. Nothing is paid or owed and no wallet is needed. Ask the customer first and send consent: true only if they agreed that their name, contact and request go to the business. Returns a reference and a status URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "consent": {
                "description": "True only if the customer agreed that their name, contact and request are sent to the business",
                "type": "boolean"
              },
              "details": {
                "description": "What the job is, in the customer's words",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "The business domain, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "description": "Where the business replies. Give email or phone, at least one",
                "maxLength": 200,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Send the same key when retrying",
                "maxLength": 128,
                "type": "string"
              },
              "item": {
                "description": "The service name exactly as listed",
                "maxLength": 140,
                "minLength": 1,
                "type": "string"
              },
              "item_id": {
                "description": "The item id from the catalogue",
                "maxLength": 140,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "The customer's name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Where the business replies. Give email or phone, at least one",
                "maxLength": 40,
                "type": "string"
              },
              "photo_url": {
                "description": "An https link to a photo the customer shared, if any",
                "maxLength": 1000,
                "type": "string"
              },
              "postal_code": {
                "description": "Where the work is, or the customer's postal code",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "timing": {
                "description": "When the customer wants it done, e.g. \"within two weeks\" or \"flexible\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["consent", "details", "domain", "name", "postal_code", "timing"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a verified business for a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef6c84f456614ca4329e40184e9b5f00407c79c49e7ef8986131d36c127e5cd4"
        },
        {
          "name": "scan_business_readiness",
          "title": "Scan business readiness",
          "description": "Scan any business website and report whether AI agents can find, trust, and pay it. Returns pillar scores, a grade, per-check evidence, and a link to the report (it opens for whoever has the link and is not listed anywhere).",
