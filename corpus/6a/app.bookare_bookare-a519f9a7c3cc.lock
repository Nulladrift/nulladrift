        {
          "name": "create_coupon",
          "title": "Create a coupon",
          "description": "Creates a coupon for buying packs. kind: percent (value = % off), amount (value_eur off), extra (value = free classes added), bonus (value = % more classes, same price and expiry: 30 turns 10 classes into 13; 100 = 1+1, double). Free classes do not apply to unlimited packs. Without code it applies automatically to the members it is for; with code the member types it when buying. Acts on one venue, given its address and access key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_key": {
                "description": "The venue’s access key.",
                "type": "string"
              },
              "address": {
                "description": "The venue’s address name, the \"name\" in name.bookare.app.",
                "type": "string"
              },
              "code": {
                "description": "Optional code, 3-30 Latin letters, digits or dashes. Leave out for an automatic coupon.",
                "type": "string"
              },
              "from": {
                "description": "Optional first day, YYYY-MM-DD.",
                "type": "string"
              },
              "group_ids": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["percent", "amount", "extra", "bonus"],
                "type": "string"
              },
              "max_uses": {
                "description": "Total uses. Leave out for no limit.",
                "type": "integer"
              },
              "member_ids": {
                "description": "Only for these members (with group_ids). Leave both out for all members.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Shown to members next to the price, e.g. \"New Year\".",
                "type": "string"
              },
              "pack_ids": {
                "description": "Only for these packs (pack ids). Leave out for all packs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "per_member": {
                "description": "Uses per member, 0 = no limit. Default 1.",
                "type": "integer"
              },
              "until": {
                "description": "Optional last day, YYYY-MM-DD.",
                "type": "string"
              },
              "value": {
                "description": "percent: 1-100; extra: 1-100 classes; bonus: 1-500 (% more classes, 100 = 1+1). Not for amount.",
                "type": "integer"
              },
              "value_eur": {
                "description": "Only for kind amount, e.g. 10.",
                "type": "number"
              }
            },
            "required": ["access_key", "address", "kind", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a coupon"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
