        {
          "name": "import_bookings",
          "title": "Bring over bookings and class history",
          "description": "Moving from another system: adds up to 100 bookings at once, past (with attendance) or upcoming. Each row names the class by class_id, or by date, time and class_type_id; a past class that is not on the calendar is created. An upcoming class must already be on the calendar. Nothing is emailed and no pack is charged again (classes_used on the imported pack already counts them); the booking is linked to the member’s pack so a later cancellation gives the class back. Acts on one venue, given its address and access key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_key": {
                "description": "The venue’s access key.",
                "type": "string"
              },
              "address": {
                "description": "The venue’s address name, the \"name\" in name.bookare.app.",
                "type": "string"
              },
              "bookings": {
                "description": "Up to 100 rows.",
                "items": {
                  "properties": {
                    "class_id": {
                      "description": "Id of a class on the calendar. Or give date, time and class_type_id instead.",
                      "type": "string"
                    },
                    "class_type": {
                      "description": "Or the class type’s name.",
                      "type": "string"
                    },
                    "class_type_id": {
                      "type": "string"
                    },
                    "date": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    },
                    "duration_minutes": {
                      "description": "Only used when a class has to be created. Default 60.",
                      "type": "integer"
                    },
                    "external_id": {
                      "description": "The booking’s id in the old system.",
                      "type": "string"
                    },
                    "free": {
                      "description": "True = not booked with a pack (gift, free class).",
                      "type": "boolean"
                    },
                    "guest_name": {
                      "description": "For a person without an account. Leave out the member fields.",
                      "type": "string"
                    },
                    "instructor_id": {
                      "description": "Only used when a past class has to be created.",
                      "type": "string"
                    },
                    "member_email": {
                      "description": "Or the member’s email.",
                      "type": "string"
                    },
                    "member_external_id": {
                      "type": "string"
                    },
                    "member_id": {
                      "type": "string"
                    },
                    "member_pack_id": {
                      "description": "The member pack it was booked with.",
                      "type": "string"
                    },
                    "pack_external_id": {
                      "description": "Or the external_id the member’s pack was imported with. Without either, the member’s pack that covered that day is linked.",
                      "type": "string"
                    },
                    "status": {
                      "description": "Default: attended for past classes, booked for future ones. Future classes take only booked or cancelled.",
                      "enum": ["booked", "attended", "no_show", "cancelled", "late_cancel"],
                      "type": "string"
                    },
                    "time": {
                      "description": "Start time HH:MM, venue local time.",
                      "type": "string"
                    },
                    "trial": {
                      "description": "The member’s trial class.",
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["access_key", "address", "bookings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Bring over bookings and class history"
          },
          "behavior": {
            "destructive": false,
