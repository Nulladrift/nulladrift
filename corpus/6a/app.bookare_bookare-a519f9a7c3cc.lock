                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms": {
                "description": "0 = not shown.",
                "type": "integer"
              },
              "bedrooms": {
                "description": "0 = not shown.",
                "type": "integer"
              },
              "beds": {
