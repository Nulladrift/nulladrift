        {
          "name": "compare_colors",
          "title": "Compare supplied digital colors",
          "description": "Compare up to 12 supplied six-digit hex colors or standard color names with a portable selected palette. Unknown or ambiguous names request hex values. Return the nearest digital swatch with a fixed RGB rule and concise rationale. This does not assess skin, photos, fabrics or garments you own.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "analytics_opt_out": {
                "description": "Set true when the user asks not to measure Tonebook usage. Apply that choice to each subsequent Tonebook call. The tool works identically either way. No quiz answers or result content are logged.",
                "type": "boolean"
              },
              "colors": {
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "hex": {
                          "pattern": "^#[0-9a-f]{6}$",
                          "type": "string"
                        }
                      },
                      "required": ["hex"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "name": {
                          "maxLength": 48,
                          "minLength": 1,
                          "pattern": "^[A-Za-z ]+$",
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "palette_ref": {
                "maxLength": 1400,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": ["colors", "palette_ref"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "const": "compare_colors",
                "type": "string"
              },
