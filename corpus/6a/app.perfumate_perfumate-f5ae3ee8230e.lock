      "serverInfo": {
        "name": "perfumate",
        "title": "PerfuMate",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PerfuMate is a perfume formulation workbench. When the user wants to build, create or compose a perfume or accord, find_starting_formula gives a reference recipe already checked against IFRA. search_materials finds materials by name, scent or family; get_material says what one smells like and how much IFRA allows; check_formula checks any formula against IFRA Category 4 and lists the EU allergens to declare. Every result is a reference, not a certificate. find_starting_formula and check_formula return a link that opens the formula in the PerfuMate editor; offer it when the user wants to keep working on the formula. A user who links a PerfuMate account can work on their own bench: list_formulas, get_formula, list_shelf and the other account tools read it; create_formula, edit_formula, add_to_shelf and the rest change it, and every change appears in their PerfuMate apps within seconds. Read before you write, use the ids the reads return, and say what you changed. A change is written in place, with no new version; undo_last_change takes the last one back, save_version keeps a version when asked. For \"what can I make with what I own\" read list_shelf, then rebuild_from_shelf or find_substitutes. get_scent_profile, find_substitutes, rebuild_from_shelf, the accord tools and scale_to_concentration run PerfuMate's own engines, so their numbers are the app's. For a concentration-only request such as \"make it 20%\", use scale_to_concentration and omit totalGrams: it keeps the current weighed total and recomposes the recipe. Set totalGrams only for a final weight the user explicitly requested; never calculate a new weight by dividing the existing grams by the requested percentage. Physically adding solvent to an existing mixture is a different request: preserve its existing ingredient amounts and use edit_formula for the requested solvent addition. update_formula.targetConcentrationPct only saves a target; make_dilution records a stock bottle dilution, not a formula change. Deleting is two steps: delete_items shows exactly what would go and returns a token; call confirm_delete only after the user says yes to that list. Deleted items stay restorable for 30 days. On an AI Studio plan without Unlimited, the bench keeps the free account's limits; a write past them is refused with the reason and changes nothing.",
      "tools": [
        {
          "name": "add_to_shelf",
          "title": "Add materials to your shelf",
          "description": "Use this when the user says they have bought or own materials and wants them on their shelf. Adds catalog materials by name or CAS, or their own new ones; each item can carry the bottle strength, solvent, stock in grams, price per gram, supplier and lot. Without a strength, a catalog material gets its usual working dilution (in DPG unless a solvent is given), else neat. A list can also come as pasted text or an attached file: one material per line, or a table whose header row names the columns. Names that match nothing come back with suggestions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "file": {
                "description": "A list the user attached in the chat: CSV, TSV, TXT or Excel (.xlsx).",
