                "type": "object"
              },
              "items": {
                "items": {
                  "properties": {
                    "cas": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "dilutionPct": {
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    },
                    "lot": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "lowStockGrams": {
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "material": {
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    },
                    "newMaterial": {
                      "anyOf": [
                        {
                          "const": true,
