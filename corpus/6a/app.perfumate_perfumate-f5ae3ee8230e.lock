        {
          "name": "edit_formula",
          "title": "Edit a formula's lines",
          "description": "Use this when the user wants to change a formula on their bench: add or remove a material, set an amount or a bottle strength, swap a material, flag or note a line, reorder, or scale the whole formula. Changes the working copy in place, as one hand edit in the editor does. No version is made; undo_last_change reverses the change, save_version keeps a version when the user asks. Only when a batch was made from the working copy does the first change start one new working version (the result says so). A formula open in the app updates within seconds. Lines are named by material or id. For add/set_amount always specify unit: g is a weighed amount; % is the final weighed share of the whole formula (including solvent, not the pure aromatic relative/absolute percent). Other weighed lines are held fixed; several % targets are solved together. Never copy relativePct or absolutePct as grams. Read get_formula first and use weighedPct for this kind of percentage edit. Whole-formula scale changes weight while preserving the recipe ratios; use scale_to_concentration to change finished concentration. Adding a specified solvent amount preserves existing ingredient amounts and increases the total weight.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "formula": {
                "description": "The formula: its id (from list_formulas) or its exact name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "operations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Amount in the explicit unit; never infer grams from a percentage.",
                      "maximum": 100000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "dilutionPct": {
                      "description": "Strength of the stock bottle used by this line, not the finished formula concentration. This does not make a physical stock dilution.",
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    },
                    "factor": {
                      "description": "For scale: the explicitly requested multiplier of all weighed amounts, not a concentration percentage.",
                      "exclusiveMinimum": 0,
                      "maximum": 1000,
                      "type": "number"
                    },
                    "flag": {
                      "anyOf": [
                        {
                          "enum": ["too_strong", "too_weak", "replace"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "line": {
                      "description": "The line: its material name or line id.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "lines": {
                      "description": "For reorder: lines in their new order.",
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 200,
                      "type": "array"
                    },
                    "material": {
                      "maxLength": 160,
                      "type": "string"
                    },
                    "newMaterial": {
                      "anyOf": [
                        {
                          "const": true,
                          "type": "boolean"
                        },
                        {
                          "properties": {
                            "cas": {
                              "maxLength": 40,
                              "type": "string"
