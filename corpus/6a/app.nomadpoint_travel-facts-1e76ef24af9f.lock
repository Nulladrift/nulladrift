{
  "lockfileVersion": 2,
  "subjects": {
    "app.nomadpoint/travel-facts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nomadpoint.app/mcp-public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nomadpoint-travel-facts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "NomadPoint answers two travel questions from its own records. Whether a passport needs a visa for a country and how long it may stay, and how many Schengen days someone has used and has left under the 90/180 rule. It also saves a trip you planned with someone as a real itinerary they can open and keep (create_trip_plan), with no account needed on your side.\n\nUse these instead of guessing from memory: entry rules change, and the Schengen count is easy to get wrong (entry and exit days both count, and the window is the whole area, not per country). Always tell the user to confirm entry rules with the destination's official source before travelling.",
      "tools": [
        {
          "name": "calculate_schengen_days",
          "title": "Calculate Schengen days",
          "description": "Use this when someone wants to know how many days they have used or have left in the Schengen Area under the 90/180 rule, or whether a planned trip would overstay. Pass every stay in any Schengen country with entry and exit dates. Do not use it for countries outside the Schengen Area, or for holders of an EU/EEA/Swiss passport, to whom the rule does not apply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Date to assess on, YYYY-MM-DD. Defaults to today.",
                "type": "string"
              },
              "stays": {
                "description": "Each stay in the Schengen Area. Past and planned stays can be mixed.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "entry": {
                      "description": "Arrival date, YYYY-MM-DD. Counts as a full day.",
                      "type": "string"
                    },
                    "exit": {
                      "description": "Departure date, YYYY-MM-DD. Counts as a full day.",
                      "type": "string"
                    }
                  },
                  "required": ["entry", "exit"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["stays"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:06794bccf9f37c34dfdaafa3cbf5179135451bd79177bfcd3be866f38e377be8"
        },
        {
          "name": "check_visa_requirement",
          "title": "Check visa requirement",
          "description": "Use this when someone asks whether they need a visa to visit a country, or how long they can stay, for a specific passport. Returns the entry type (visa free, visa on arrival, e-visa, visa required) and the permitted stay in days when known. Do not use it for work, study or residence permits; it covers short tourist stays only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "The country being visited as an ISO 3166-1 alpha-2 code, e.g. US, GB, TH",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "passport": {
                "description": "The passport's issuing country as an ISO 3166-1 alpha-2 code, e.g. US, GB, TH",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["destination", "passport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:703cb7249a6787e66c5417dd34f5944e0ee77371bff68a87bea4b0ec83a565e2"
        },
        {
          "name": "create_trip_plan",
          "title": "Save a trip plan",
          "description": "Use this after you have planned a trip with someone, to hand them the itinerary as a real, editable plan instead of a wall of text. No account or key needed. Pass the stops in order with arrival and departure dates, and optionally things to do in each. Returns plan_url: the traveller opens it to see the route and save it to their own NomadPoint on iPhone, Mac or web (free). Give the traveller that link. Do not use it for bookings: it records a plan, it does not reserve anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "What the traveller would call it, e.g. 'Japan in April'",
                "type": "string"
              },
              "stops": {
                "description": "Each city on the route, in order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "activities": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "notes": {
                            "type": "string"
                          },
                          "place_name": {
                            "type": "string"
                          },
                          "start": {
                            "description": "Local time at the place, YYYY-MM-DDTHH:MM",
                            "type": "string"
                          },
                          "title": {
                            "description": "e.g. 'Fushimi Inari at sunrise'",
                            "type": "string"
                          }
                        },
                        "required": ["start", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "arrive": {
                      "description": "Arrival date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "city": {
                      "description": "The city itself, e.g. 'Kyoto', not a neighbourhood or hotel",
                      "type": "string"
                    },
                    "country_code": {
                      "description": "ISO 3166-1 alpha-2, e.g. JP",
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "depart": {
                      "description": "Departure date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "notes": {
                      "type": "string"
                    }
                  },
                  "required": ["arrive", "city", "country_code", "depart"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["name", "stops"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:03c95d02e35499e3db4759b5dd8657cede77897ea8ae83121dca3d80ee166781"
        }
      ],
      "digest": "sha256:f6b29200013d9c34d2ae7d233b83383e65943438ff35f77d8a094bcc6aaf6870"
    }
  }
}
