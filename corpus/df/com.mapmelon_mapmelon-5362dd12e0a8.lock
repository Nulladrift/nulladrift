      "tools": [
        {
          "name": "checkAvailability",
          "title": "Check Coliving Availability",
          "description": "Check if a coliving has available accommodations for a specific date range and number of guests. Returns available room types with pricing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "colivingId": {
                "description": "The coliving ID to check availability for",
                "type": "integer"
              },
              "endDate": {
                "description": "Check-out date in ISO 8601 format (YYYY-MM-DD)",
                "type": "string"
              },
              "guests": {
                "default": 1,
                "description": "Number of guests",
                "minimum": 1,
                "type": "integer"
              },
              "startDate": {
                "description": "Check-in date in ISO 8601 format (YYYY-MM-DD)",
                "type": "string"
              }
            },
            "required": ["colivingId", "endDate", "startDate"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d4041e9969bff535cbe1b4fa1abe668eb94981f53b3e12033a608a41d31f505"
        },
        {
          "name": "checkAvailabilityBySlug",
          "title": "Check Coliving Availability by Slug",
          "description": "Check if a coliving has available accommodations using its URL slug instead of ID. Returns available room types with pricing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "endDate": {
                "description": "Check-out date in ISO 8601 format (YYYY-MM-DD)",
                "type": "string"
              },
              "guests": {
                "default": 1,
                "description": "Number of guests",
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The coliving URL slug (e.g., 'sun-and-co')",
                "type": "string"
              },
              "startDate": {
                "description": "Check-in date in ISO 8601 format (YYYY-MM-DD)",
                "type": "string"
              }
            },
            "required": ["endDate", "slug", "startDate"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b361be80d7d7da85236038e456473f6df46b4526516bfe21fbc1326fa6d0392"
        },
        {
          "name": "getAccommodations",
          "title": "Get Coliving Accommodations",
          "description": "Get all accommodation types (rooms, beds) for a specific coliving. Returns pricing, capacity, and unit details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "colivingId": {
                "description": "The coliving ID",
                "type": "integer"
              }
            },
            "required": ["colivingId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
