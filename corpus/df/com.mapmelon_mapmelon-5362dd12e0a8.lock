          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03063511506f7fff221014620edcec6b94680047ca6fe647fb1e8839fd54c1ad"
        },
        {
          "name": "getAllCountries",
          "title": "Get All Countries with Colivings",
          "description": "Get a list of all countries that have active colivings on Mapmelon, grouped by continent. Shows the number of colivings in each country.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
