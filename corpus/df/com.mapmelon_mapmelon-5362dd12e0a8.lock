        },
        {
          "name": "getAllCategories",
          "title": "Get All Categories",
          "description": "Get all available amenity and lifestyle categories that can be used to filter colivings. Categories are grouped into: location, food, coworking, facilities, structure, activities, community.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
