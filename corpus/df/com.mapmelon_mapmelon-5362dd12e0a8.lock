        {
          "name": "getColivingsByAmenities",
          "title": "Get Colivings by Amenities",
          "description": "Search for coliving spaces that have specific amenities/categories. Use category names like 'pool', 'gym', 'surf', 'yoga', 'pet friendly', 'coworking', etc. Use getAllCategories tool to see all available categories.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "List of category/amenity names to filter by (e.g., ['pool', 'gym', 'yoga'])",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
