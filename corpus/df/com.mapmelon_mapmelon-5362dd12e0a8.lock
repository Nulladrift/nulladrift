          "digest": "sha256:420186f94fd7beb5fe6aeae7fbbb1675e64d821ece5a50985395bc9877903aa4"
        },
        {
          "name": "getAvailabilityByMonth",
          "title": "Get Monthly Availability Calendar",
          "description": "Get a monthly availability overview for a coliving. Returns which accommodation types have available units for each week of the specified month.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "colivingId": {
                "description": "The coliving ID",
                "type": "integer"
              },
              "month": {
                "description": "Month number (1-12)",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "year": {
                "description": "Year (e.g., 2026)",
                "type": "integer"
              }
            },
            "required": ["colivingId", "month", "year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4edac755d23a8b87534464f8476b3c20956cf7450727696d5a960492a44be015"
        },
        {
          "name": "getColivingById",
          "title": "Get Coliving Details",
          "description": "Get full details for a specific coliving by its ID or URL slug. Returns comprehensive information including description, location, amenities, pricing, reviews, and accommodation types.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The coliving URL slug (e.g., 'sun-and-co', 'nine-coliving')",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6baad56d5ac314f8d27090d154590720f12f1c4ef102028c5c5b4380b243e840"
        },
        {
          "name": "getColivingReviews",
          "title": "Get Coliving Reviews",
          "description": "Get user reviews for a specific coliving. Returns review text, ratings, and reviewer information.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of reviews to return",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The coliving URL slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2e3c4b7de997bde968034efd28087f3ed1f8ca2c68e34aca197e006feff8531"
        },
        {
          "name": "getColivingsByAmenities",
          "title": "Get Colivings by Amenities",
          "description": "Search for coliving spaces that have specific amenities/categories. Use category names like 'pool', 'gym', 'surf', 'yoga', 'pet friendly', 'coworking', etc. Use getAllCategories tool to see all available categories.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "List of category/amenity names to filter by (e.g., ['pool', 'gym', 'yoga'])",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["categories"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:454d1443ba4c782530ca9043fad1695aa728ff9c05020192412a978524688f40"
        },
        {
          "name": "getColivingsByBudget",
          "title": "Get Colivings by Budget",
          "description": "Search for coliving spaces within a price range. Prices are per night in EUR. Returns colivings with at least one accommodation within the specified budget.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "description": "Maximum price per night in EUR",
                "minimum": 0,
                "type": "number"
              },
              "minPrice": {
                "default": 0,
                "description": "Minimum price per night in EUR",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["maxPrice"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ebd488e7ec0d7b5803831302d2fec22c05b62d98a62f184212d576d016193ceb"
        },
        {
          "name": "getColivingsByContinent",
          "title": "Get Colivings by Continent",
          "description": "Search for coliving spaces in a specific continent. Valid continents: Europe, Asia, Africa, North America, South America, Oceania.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "continent": {
                "description": "Continent name",
                "enum": ["Europe", "Asia", "Africa", "North America", "South America", "Oceania"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["continent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3dbc769ff5cd552ee9cdea458734bd8d9354c9a3070d90b53a33c41087985b28"
        },
        {
          "name": "getColivingsByCountry",
          "title": "Get Colivings by Country",
          "description": "Search for coliving spaces in a specific country. Use ISO 3166-1 alpha-2 country codes (e.g., 'pt' for Portugal, 'es' for Spain, 'th' for Thailand).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "countryCode": {
                "description": "ISO 3166-1 alpha-2 country code (e.g., 'pt', 'es', 'th')",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["countryCode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f9eccb051cf7eddb405fb7ffa08bc741262b3bed5c15e8af5afde0c185254f2"
        },
        {
          "name": "getColivingsByLifestyle",
          "title": "Get Colivings by Lifestyle",
          "description": "Search for coliving spaces by lifestyle category group. Groups: 'community' (shared meals, activities, min stay), 'location' (beach, city, mountain), 'coworking' (desks, monitors, call rooms), 'facilities' (pool, gym, kitchen), 'activities' (yoga, surf, hiking), 'food' (breakfast, vegan), 'structure' (apartments, dorms).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lifestyle": {
                "description": "Lifestyle category group name",
                "enum": ["community", "location", "coworking", "facilities", "activities", "food", "structure"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["lifestyle"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06964b174ec475f3c55275a65b21c2e5feeca025f3ad49a7a9e3de7cb8faec2c"
        },
        {
          "name": "getColivingsByLocation",
          "title": "Get Colivings by Location",
          "description": "Search for coliving spaces by location name. Searches across city, region, country name, and coliving name. Use this for flexible location searches like 'Bali', 'Lisbon', 'Barcelona'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Location search query (city, region, country, or coliving name)",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ff1b07837f9dfc228869c7a28289c7d99f38623455ff90c478a21b608e91866"
        }
