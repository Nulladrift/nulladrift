  "lockfileVersion": 2,
  "subjects": {
    "com.permitinfobroker/permits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://permitinfobroker.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "permitinfobroker",
        "title": "PermitInfoBroker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Building permits issued in 30 US cities and counties, updated daily from official open data. Free tools show coverage and counts; search_permits, permit_history_for_address, weekly_permit_report and top_contractors return records and are paid per call in USDC via x402.",
      "tools": [
        {
          "name": "count_permits",
          "title": "Count matching permits",
          "description": "How many permits match a search (area, category, city, zip, distance, multi-trade projects, dates, minimum value) before paying for the records. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Permit category, e.g. roof, pool, solar, hvac, new_residential",
                "enum": ["pool", "roof", "solar", "hvac", "electrical", "plumbing", "addition", "foundation", "windows", "fence", "remodel", "new_residential", "commercial", "demolition", "other"],
                "type": "string"
              },
              "city": {
                "description": "City name, case-insensitive",
                "maxLength": 80,
                "type": "string"
              },
              "includeRenewals": {
                "description": "Include New York renewals of existing permits (left out by default)",
                "type": "boolean"
              },
              "jurisdiction": {
                "description": "Area id, e.g. new-york-ny, miami-dade-fl. Use list_coverage for names.",
                "enum": ["austin-tx", "dallas-tx", "collin-county-tx", "fort-worth-tx", "san-antonio-tx", "new-york-ny", "los-angeles-ca", "chicago-il", "seattle-wa", "miami-dade-fl", "orlando-fl", "mesa-az", "maricopa-county-az", "new-orleans-la", "montgomery-county-md", "nashville-tn", "columbus-oh", "louisville-ky", "phoenix-az", "denver-co", "raleigh-nc", "philadelphia-pa", "washington-dc", "boston-ma", "minneapolis-mn", "cape-coral-fl", "riverside-county-ca", "detroit-mi", "cleveland-oh", "new-hanover-county-nc"],
                "type": "string"
              },
              "minValue": {
                "description": "Minimum job valuation in USD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "multiTrade": {
                "description": "Only permits at addresses with another type of permit within 90 days (usually bigger projects)",
                "type": "boolean"
              },
              "near": {
                "description": "Only permits near a zip code in the area or a \"lat,lng\" point",
                "pattern": "^(\\d{5}|-?\\d{1,3}(\\.\\d+)?,\\s*-?\\d{1,3}(\\.\\d+)?)$",
                "type": "string"
              },
              "radiusMiles": {
                "default": 5,
                "description": "Radius around near, in miles",
                "maximum": 50,
                "minimum": 0.1,
                "type": "number"
              },
              "since": {
                "description": "Issued on or after (YYYY-MM-DD)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "until": {
                "$ref": "#/properties/since",
                "description": "Issued on or before (YYYY-MM-DD)"
              },
              "zip": {
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["jurisdiction"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:930ffe5f8de4916440e008ea07d72ed16e1784a265d16823c4bd6a808a0d49e0"
        },
        {
          "name": "list_coverage",
          "title": "List coverage",
          "description": "List covered US cities and counties (ids, names, permit counts, newest permit date, and how often their records include zip, location, job value, contractor and phone), permit categories and prices. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
