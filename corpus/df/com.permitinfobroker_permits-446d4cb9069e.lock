        },
        {
          "name": "permit_history_for_address",
          "title": "Permit history for an address",
          "description": "Every known building permit at a street address in any covered area. Costs $0.05 in USDC (x402; Base, Solana, Polygon or Arbitrum); no charge when nothing matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address, e.g. 1712 Bluebonnet Ln",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "zip": {
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["address"],
