        {
          "name": "get_record",
          "title": "Read one New Runtime record",
          "description": "Use after search_archive, whats_new, what_changed, get_topic_brief or contextualize_url to read one record in full: metadata (dates, topics, source URLs, primary_source_url) and the body as Markdown (capped; see truncated). Pass any newruntime.com record URL they return (notes, signals, analyses, patterns, shifts, systems, projects, topics, tools, guides, sources), or kind + slug. level \"short\" returns only the title, dates, summary, topics, first source URLs, primary source and routes (2-3 KB instead of up to 60 KB; no body): use it to triage several records, then read the ones you keep at the default level \"full\". Free, no auth. Example: {\"url\": \"https://newruntime.com/patterns/company-memory-needs-write-loops/\", \"level\": \"short\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["post", "signal", "analysis", "pattern", "shift", "system", "project", "topic", "delta", "graveyard", "tool", "learn", "week", "source", "company"],
                "type": "string"
              },
              "level": {
                "default": "full",
                "description": "full (default): metadata and the body as Markdown. short: title, dates, summary, topics, first sources and routes only.",
                "enum": ["full", "short"],
                "type": "string"
              },
              "slug": {
                "maxLength": 200,
                "type": "string"
              },
              "url": {
                "description": "A https://newruntime.com/<section>/<slug>/ record URL.",
                "examples": ["https://newruntime.com/analysis/claude-plugins-now-depend-on-anthropic-s-distribution-rules/"],
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "body_chars": {
                "description": "Length of the full body in characters.",
                "type": "number"
              },
              "body_markdown": {
                "description": "Body text as Markdown, or null."
              },
              "json_url": {
                "description": "Machine-readable twin of the record, or null."
              },
              "kind": {
                "description": "Record kind.",
                "type": "string"
              },
              "level": {
                "description": "short when level short was asked; absent for the full record.",
                "type": "string"
              },
              "markdown_url": {
                "description": "Full Markdown twin.",
                "type": "string"
              },
              "next": {
                "description": "Level short: how to read the body.",
                "type": "string"
              },
              "primary_source_missing": {
                "description": "True when every source of the record is secondary coverage.",
                "type": "boolean"
              },
              "primary_source_url": {
                "description": "First source that is not press, newsletter or social coverage; null when the record cites none."
              },
              "record": {
                "description": "Metadata: title, dates, source_urls, topics, routes (level short: scalar fields, topics, first source URLs and routes only).",
                "properties": {},
                "type": "object"
              },
              "source_urls_total": {
                "description": "Level short: how many source URLs the record cites when more than the five listed.",
                "type": "number"
              },
              "summary": {
                "description": "Level short: one-paragraph summary, or null."
              },
              "truncated": {
                "description": "True when body_markdown was cut; markdown_url has it all.",
                "type": "boolean"
              },
              "url": {
                "description": "Canonical newruntime.com URL.",
                "type": "string"
              }
            },
            "required": ["kind", "record", "url"],
            "type": "object"
          },
