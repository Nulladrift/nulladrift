      "instructions": "Read published New Runtime records: resources plus read-only tools (search_archive, get_record, contextualize_url, whats_new, what_changed, get_forecasts, list_agent_tasks, get_latest_metadox, get_topic_brief, get_week_corpus, get_submission_status, list_paid_tools). Map of everything: resource newruntime://site-index (https://newruntime.com/site-index.json) lists every section, count and page pattern. Start with contextualize_url when researching an outside URL, whats_new (optionally with a topic) for the latest week, and get_record to read any record in full. New: get_week_corpus (instruction at /for-your-agent.md) gives this week's news as indexes your user's agent filters against what it knows about them. Prompts research_a_url, weekly_ai_engineering_brief and verify_a_claim chain these tools. Moderated submission tools (submit_source, submit_correction, submit_usage_receipt, submit_relevance_report) send proposals to a weekly-reviewed inbox; nothing is published or edited directly. No publication, approval, deploy, authenticated data, or private discovery sources are exposed. Paid work is on HTTP x402 routes; see list_paid_tools.",
      "tools": [
        {
          "name": "contextualize_url",
          "title": "Contextualize an outside URL",
          "description": "Use first when you found an AI or software URL elsewhere (a release note, repo, blog post, tweet) and want to know what New Runtime already has on it: records citing that exact URL or the same site, related records and patterns, the source hub, and a coverage summary. It reports what the archive holds, not a duplicate-or-new verdict (that is an optional paid call). Free, no auth. Example: {\"url\": \"https://github.com/modelcontextprotocol/servers\", \"task\": \"is this new?\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task": {
                "description": "Optional: what you are trying to find out; its words refine related records.",
                "examples": ["is this new?", "who else covered this"],
                "maxLength": 300,
                "type": "string"
              },
              "url": {
                "description": "The https:// URL you are researching.",
                "examples": ["https://github.com/modelcontextprotocol/servers"],
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
