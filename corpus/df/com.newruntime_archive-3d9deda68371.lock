        {
          "name": "get_forecasts",
          "title": "Read the New Runtime forecast ledger",
          "description": "Use when you need falsifiable, dated predictions about AI engineering: New Runtime's forecast ledger (claim, probability, due date, source analysis, topics). Narrow it with query (words over the claim, signpost, resolution criteria and source title; word forms match) and/or topic (a topic slug such as mcp or coding-agents, or a system); page with limit (at most 50) and offset (pass next_offset). matched counts the forecasts that pass the filter, count the whole ledger. Forecasts are graded when due; the scorecard (hit rate, Brier score) stays empty until the first ones resolve, and the result says when that is. Free, no auth. Example: {\"status\": \"open\", \"query\": \"agent protocol\", \"topic\": \"mcp\", \"limit\": 10}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many matching forecasts: the next_offset of the previous call.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in the claim, signpost, resolution criteria and source title; every word must match (word forms match). When no forecast has every word, forecasts with the most matching words are returned and match says \"any\".",
                "examples": ["agent protocol", "Anthropic", "open weights"],
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "status": {
                "default": "all",
                "enum": ["open", "resolved", "all"],
                "type": "string"
              },
              "topic": {
                "description": "Topic slug or name (topics of the source analysis), or a system (openclaw, hermes).",
                "examples": ["mcp", "coding-agents"],
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "description": "Forecasts in the ledger.",
                "type": "number"
              },
              "counts_by_status": {
                "description": "Counts for open, confirmed, refuted, unclear.",
                "properties": {},
                "type": "object"
              },
              "generated_at": {
                "description": "When the ledger was generated."
              },
              "hint": {
                "description": "When nothing matched: what to try.",
                "type": "string"
              },
              "items": {
                "description": "Forecasts.",
                "items": {
                  "properties": {
                    "claim": {
                      "description": "The dated claim."
                    },
                    "due_on": {
                      "description": "Resolution date."
                    },
                    "id": {
                      "description": "Forecast id."
                    },
                    "made_on": {
                      "description": "Date made."
                    },
                    "origin_title": {
                      "description": "Title of that record."
                    },
                    "origin_url": {
                      "description": "Record the forecast came from."
                    },
                    "probability": {
                      "description": "Probability given when made."
                    },
                    "signpost": {
                      "description": "What would resolve it."
                    },
                    "status": {
                      "description": "open | confirmed | refuted | unclear."
                    },
                    "topics": {
                      "description": "Topics of the source record."
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "match": {
                "description": "all when every query word matched; any when no forecast had them all and the most matching words come first; null without a query."
              },
              "matched": {
                "description": "Forecasts matching the filter (all pages).",
                "type": "number"
              },
              "matched_words": {
                "description": "Query words used for matching (stemmed).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next": {
                "description": "How to see the rest, when more follow.",
                "type": "string"
              },
              "next_offset": {
                "description": "Pass as offset for the next page; null on the last page."
              },
              "offset": {
                "description": "Forecasts skipped before this page.",
                "type": "number"
              },
              "query": {
                "description": "The query as given, when one was given.",
                "type": "string"
              },
              "returned": {
                "description": "Forecasts returned.",
                "type": "number"
              },
              "routes": {
                "description": "HTML, JSON and Markdown routes of the ledger.",
                "properties": {},
                "type": "object"
              },
              "schema_version": {
                "description": "Response schema version."
              },
              "scorecard": {
                "description": "Resolved and graded counts, hit rate and Brier score (null until graded).",
                "properties": {},
                "type": "object"
              },
              "status": {
                "description": "Status filter: open, resolved or all.",
                "type": "string"
              },
              "topic": {
                "description": "Topic or system filter, when one was given.",
                "type": "string"
              },
              "track_record": {
                "description": "While nothing is graded: when the first forecast is due.",
                "type": "string"
              }
            },
            "required": ["count", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3a4f2e9a322c520b4e46acdf582981922e28091d57ca3fb7a7c42bcbd0b8b1a"
        },
