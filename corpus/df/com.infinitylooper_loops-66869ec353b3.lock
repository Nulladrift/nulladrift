        {
          "name": "search_loops",
          "title": "Search looping video backgrounds",
          "description": "Search the free looping video library. query takes plain words and ranks like the site's search box (spelling variants, synonyms, plurals, typo repair; words with no match are set aside and reported in search.dropped). Filters narrow the results. Answers {data, next_cursor, total, search}; each loop has id, slug, title, url, description, best_for, tags, themes, preview_url, poster_url, file (width, height, orientation, duration_seconds, has_audio, size) and licence. Pass next_cursor back as cursor for more.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "next_cursor from a previous answer.",
                "maxLength": 200,
                "type": "string"
              },
              "has_audio": {
                "description": "true for loops with sound, false for silent loops.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many loops to return, 1 to 100 (default 10).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_duration": {
                "description": "Maximum length in seconds.",
                "maximum": 86400,
                "minimum": 1,
                "type": "integer"
              },
              "min_height": {
                "description": "Minimum height in pixels, for example 2160 for 4K.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "orientation": {
                "description": "landscape (16:9) or vertical (9:16).",
                "enum": ["landscape", "vertical"],
                "type": "string"
              },
              "query": {
                "description": "Plain words, for example cozy rain window or neon city night.",
                "maxLength": 200,
                "type": "string"
              },
              "theme": {
                "description": "A theme id from list_themes, for example rain.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
