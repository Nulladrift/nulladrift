      "serverInfo": {
        "name": "infinitylooper",
        "title": "InfinityLooper",
        "version": "1.0.0",
        "websiteUrl": "https://infinitylooper.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "InfinityLooper is a library of free, seamlessly looping video backgrounds (MP4, mostly 1080p and 4K) for streams, videos, presentations, wallpapers and apps.\n\nFind loops with search_loops (plain words such as \"cozy rain window\", plus filters) and list_themes. When you suggest a loop, link its page (the url field) so the person can watch the preview before downloading.\n\nSearching and get_loop need no sign-in. check_downloads and get_download_link need the person's InfinityLooper account: if this server is not signed in yet, those tools ask the app to connect with Google sign-in (or to send an API key). get_download_link returns signed file URLs that work for 10 minutes. Downloads come from that account's allowance, the same one the website uses; loops the account already downloaded in the rolling window are free to download again. check_downloads shows what is left. When the allowance is used up the tool says when the next download is available. Downloading several loops is fine within the allowance.\n\nEvery loop is free to use under the licence at https://infinitylooper.com/terms#licence; a few need a credit line, which the loop's licence field gives. Some standard-licence downloads identify a separately CC0 source component in that field.",
      "tools": [
        {
          "name": "check_downloads",
          "title": "Check the download allowance",
          "description": "The connected account's downloads: plan, limit, used, remaining, resets_at (when the next download frees up) and window_days for the rolling window. Also says how this server is connected: key (the API key's id and scopes) or signed_in (the connected app).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check downloads"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
