          "digest": "sha256:439c624e76223529dc39cef9a3df57b30a9b96c072b56dfcc4ade8a59ed4c58a"
        },
        {
          "name": "get_download_link",
          "title": "Get download links for a loop",
          "description": "Signed URLs for a loop's full-quality MP4 files, valid for 10 minutes: fetch them straight away. Uses one download from the account's allowance, shared with the website; a loop the account already downloaded in the rolling window is free again (redownload: true, counted: false), and so is a retry with the same idempotency_key (counted: false). When the allowance is used up the answer is an error that says when the next download is available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "idempotency_key": {
                "description": "Optional. Send the same value when retrying the same loop so a retry is never counted twice.",
                "pattern": "^[\\x21-\\x7e]{1,128}$",
                "type": "string"
              },
              "slug": {
                "description": "The loop's slug (from search_loops, for example cat-playing-piano-in-the-rain) or its id (IL-AB-0205).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
