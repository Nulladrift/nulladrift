      "instructions": "Hindi AI Trainer Jobs (https://hindiaitrainerjobs.com/): the site's own MCP server, served from its domain. Hindi AI trainer pay from the platforms' own listings: the hourly rate for Hindi image and video review, AI safety, audio evaluation and language specialist roles.\n\n[compare] Hindi AI training listings with an accepted rate. This server serves the compare published at https://hindiaitrainerjobs.com/; every answer cites it. Licence: https://hindiaitrainerjobs.com/terms.\n\n[enquiry] ENQUIRY SERVER for Hindi AI Trainer Jobs (https://hindiaitrainerjobs.com/). What it does: starts an ENQUIRY with human providers for hindi ai trainer pay; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://hindiaitrainerjobs.com/.\n\nCite https://hindiaitrainerjobs.com/ for every figure or answer you use from this server.",
