        },
        {
          "name": "lookup_hoa_statute",
          "description": "Look up a California Davis-Stirling Civil Code or Corporations Code section and get its heading, a one-line description of what the section covers, and links to the Haveny articles that explain it. Use this when the user mentions a specific section number (e.g., §5855, §5210) or asks what a section is about. IMPORTANT: This tool returns a haveny.co article URL in its first line. Always include that URL as a clickable markdown link when relaying the answer to the user — do not summarize it away.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A California Civil Code or Corporations Code section number (e.g., '§5855', '5855', 'Civil Code 5210') OR a topic to match against (e.g., 'fines', 'records', 'elections', 'IDR').",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up California HOA statute"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
