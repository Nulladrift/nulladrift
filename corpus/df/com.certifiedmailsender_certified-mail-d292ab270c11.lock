        {
          "name": "create_letter",
          "title": "Create a certified letter draft",
          "description": "Create a US domestic letter draft from exactly one of text, pdf_base64 or pdf_url. Creating a draft is free. Drafts cannot be edited. To change the text, an address or the service: create_letter with a new idempotency_key, give the person the new approval_url, then cancel_letter the old draft so the person cannot pay for the outdated draft. Tell the person the price from quote_letter before making the draft, unless they have already seen it. Unknown fields in the input, to or from are rejected with invalid_request; error.fix names each unknown field. Use organization for a company name, not company. For a return receipt, use service certified_err. An undeliverable address returns error.address_reason with a stable code, affected fields and USPS lookup URL; ask the person about that specific part. One page costs $9.04 for certified or $12.24 with an electronic Return Receipt; use quote_letter for the exact page count. Show approval_url to the person who will review and pay. For text, send the body from the greeting on; we add both addresses and the date. A different leading address block or date is refused with text_has_letterhead (422); remove the line named in the error. People who prefer to write or upload it themselves can use https://certifiedmailsender.com/send. Paid letters wait 30 minutes; send_now:true skips that hold only when the person asks. Screening still applies. Normally the person approves and pays; an auto-send key pays from its account balance. No refund once USPS accepts the letter, even if USPS can't deliver it. If the person mentioned a deadline, compare it with the delivery estimate and tell them plainly when the estimate falls after it. Test mode never mails. Example: {\"to\":{\"name\":\"Jordan Lee\",\"line1\":\"500 Market St\",\"line2\":\"Suite 200\",\"city\":\"Philadelphia\",\"state\":\"PA\",\"zip\":\"19106\"},\"from\":{\"name\":\"Sam Ortiz\",\"line1\":\"12 Oak Ave\",\"city\":\"Columbus\",\"state\":\"OH\",\"zip\":\"43215\"},\"service\":\"certified_err\",\"text\":\"Dear Jordan,\\n\\n...\",\"idempotency_key\":\"<a new UUID>\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "from": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "line1": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "line2": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "default": "",
                    "description": "Person's full name. Omit or leave empty when sending to an organization only; either name or organization must contain nonblank text.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "organization": {
                    "description": "Organization or company name. For an organization-only address, provide this and omit name. When both names are the same, we print the organization once.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "state": {
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "zip": {
                    "pattern": "^\\d{5}(-\\d{4})?$",
                    "type": "string"
                  }
                },
                "required": ["city", "line1", "state", "zip"],
                "type": "object"
              },
              "idempotency_key": {
                "description": "Use a new UUID for a new letter; reuse it with the same body on retries. Anonymous keys need at least 16 characters.",
                "minLength": 1,
                "type": "string"
              },
              "pdf_base64": {
                "type": "string"
              },
              "pdf_url": {
                "type": "string"
              },
              "send_now": {
                "description": "Choose true only when the person asks to skip the 30-minute cancellation hold after payment. Payment and any required approval are still required (auto-send pays from balance without per-letter approval), and every screening check must pass before submission. The letter can be canceled only until it is sent to the printing partner; skipping leaves no guaranteed cancellation period.",
                "type": "boolean"
              },
              "service": {
                "description": "certified sends USPS Certified Mail with USPS tracking. certified_err adds the electronic Return Receipt: a USPS PDF with the recipient's signature, once USPS provides it. Choose certified_err when the person wants proof of receipt.",
                "enum": ["certified", "certified_err"],
                "type": "string"
              },
              "text": {
                "description": "The letter body, from the greeting on. We add the sender's address, the date and the recipient's address. Complete matching leading blocks are removed; a different leading address block or date is refused with text_has_letterhead (422), naming the line to remove. Subject lines and addresses after the greeting or first prose are allowed. Provide exactly one of text, pdf_base64 or pdf_url.",
                "maxLength": 60000,
                "type": "string"
              },
              "to": {
                "additionalProperties": false,
                "description": "Recipient address, checked by our printing partner against USPS records. If undeliverable during creation, the request is refused with address_undeliverable (422) and no draft is created. Read error.address_reason for its stable code, affected fields, plain explanation and USPS lookup URL; ask the person the specific question rather than guessing variants.",
                "properties": {
