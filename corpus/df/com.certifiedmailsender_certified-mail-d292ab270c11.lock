        {
          "name": "quote_letter",
          "title": "Quote a certified letter",
          "description": "Get an itemized price for 1-10 pages or count a base64 PDF. Quoting is free. Unknown input fields are rejected with invalid_request; error.fix names each unknown field and the accepted fields. For a return receipt, use service certified_err. One page costs $9.04 for certified or $12.24 with an electronic Return Receipt; use quote_letter for the exact page count. Quoting never creates, pays for or mails a letter. No refund once USPS accepts the letter, even if USPS can't deliver it. If the person mentioned a deadline, compare it with the delivery estimate and tell them plainly when the estimate falls after it. Example: {\"pages\":1,\"service\":\"certified\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "pages": {
                "description": "Page count from 1 to 10. Provide exactly one of pages or pdf_base64; omit pages when providing a PDF.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "pdf_base64": {
                "description": "A base64-encoded PDF whose pages we count for the quote. Provide exactly one of pages or pdf_base64; omit pages when providing a PDF. Neither field takes precedence: sending both is rejected, even if the counts agree.",
                "type": "string"
              },
              "service": {
                "enum": ["certified", "certified_err"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "const": "usd",
                "type": "string"
              },
              "line_items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount_cents": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "code": {
                      "enum": ["postage", "printing", "service_fee"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["amount_cents", "code", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "pages": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "partner_cost_cents": {
                "description": "Public printing-and-postage cost in USD cents. The itemized price adds a 10% service fee; total_cents is before any Stripe sales tax.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "service": {
                "enum": ["certified", "certified_err"],
                "type": "string"
              },
              "total_cents": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["currency", "line_items", "pages", "partner_cost_cents", "service", "total_cents"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote a certified letter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:863a226d096d22619ebcedc37a9f6b08085f04f881c1fbf92f9b257e141adaab"
        },
        {
          "name": "send_letter_now",
          "title": "Send a paid letter now",
          "description": "Skip a paid letter's 30-minute cancellation hold when the person asks to send it right away. This never bypasses screening and does not submit immediately. Idempotent while paid, screening or held for review; refused before payment or after submission or cancellation. Cancellation stays possible until submission, with no guaranteed extra time. Read the returned cancel_until and next_step; only the hold is skipped. Use id with its creating API key, or the complete private letter_url. Example: {\"letter_url\":\"https://certifiedmailsender.com/l/<id>?t=<token>\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Letter id; send the API key that created it in Authorization.",
                "minLength": 1,
                "type": "string"
              },
              "letter_url": {
                "description": "Complete private letter_url or approval_url, including its t token.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acceptance_expected_by": {
                "description": "Eastern date (YYYY-MM-DD) by whose end the acceptance scan usually appears. Present from submission while no acceptance or individual-piece network/delivery scan is recorded and next_step gives this date. Null after an individual-piece scan even if acceptance is missing; proof_of_mailing remains null. Before it ends, tell the person when to contact support; after it ends, contact support now so we can check with the printing partner and USPS.",
                "type": ["string", "null"]
              },
              "address_as_given": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "city": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "line1": {
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      "line2": {
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      "name": {
                        "default": "",
                        "description": "Person's full name. Omit or leave empty when sending to an organization only; either name or organization must contain nonblank text.",
                        "maxLength": 40,
                        "type": "string"
                      },
                      "organization": {
                        "description": "Organization or company name. For an organization-only address, provide this and omit name. When both names are the same, we print the organization once.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "state": {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "zip": {
                        "pattern": "^\\d{5}(-\\d{4})?$",
                        "type": "string"
                      }
                    },
                    "required": ["city", "line1", "name", "state", "zip"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "address_note": {
                "description": "The address partner’s raw note, not wording to relay to the person. Use next_step for the plain-language version to tell the person.",
                "type": ["string", "null"]
              },
              "address_status": {
                "enum": ["pending", "deliverable", "corrected", "undeliverable"],
                "type": "string"
              },
              "approval_url": {
                "description": "Private review page with the expected mailing date and USPS delivery estimate (not guaranteed). If the person mentioned a deadline, compare it with the delivery estimate and tell them plainly when the estimate falls after it.",
                "type": "string"
              },
              "cancel_until": {
                "description": "The scheduled end of the 30-minute cancellation hold, as an ISO 8601 / UTC RFC 3339 timestamp with milliseconds (YYYY-MM-DDTHH:mm:ss.sssZ); null for drafts or letters no longer cancellable. If skipped, this is when sending became eligible after payment. Cancellation remains possible until actual submission, even after this timestamp or during review; no extra cancellation period is guaranteed.",
                "type": ["string", "null"]
              },
              "created_at": {
                "description": "UTC RFC 3339 timestamp with milliseconds, YYYY-MM-DDTHH:mm:ss.sssZ.",
                "type": "string"
              },
              "document_source": {
                "anyOf": [
                  {
                    "enum": ["text", "pdf"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "files_deleted_at": {
                "description": "UTC time the letter files were deleted, or null. After deletion, preview_url is retained for compatibility but no longer downloads a file; receipt_url is omitted. Tracking and the record stay available at letter_url.",
                "type": ["string", "null"]
              },
              "first_usps_scan": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "at": {
                        "description": "UTC RFC 3339 timestamp with milliseconds, YYYY-MM-DDTHH:mm:ss.sssZ.",
                        "type": "string"
                      },
                      "date": {
                        "description": "Local scan calendar date (YYYY-MM-DD).",
                        "type": "string"
                      },
                      "scan": {
                        "type": "string"
                      }
                    },
                    "required": ["at", "date", "scan"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Earliest recorded individual-letter USPS scan, including acceptance: at is UTC, date is the scan’s local YYYY-MM-DD date, scan is USPS’s wording. Excludes shipment acceptance-pending and printing-partner scans. Null means no individual-letter scan is recorded, not that the letter was never mailed. Only proof_of_mailing establishes an acceptance date."
              },
              "from": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "line1": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "line2": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "default": "",
                    "description": "Person's full name. Omit or leave empty when sending to an organization only; either name or organization must contain nonblank text.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "organization": {
                    "description": "Organization or company name. For an organization-only address, provide this and omit name. When both names are the same, we print the organization once.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "state": {
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "zip": {
                    "pattern": "^\\d{5}(-\\d{4})?$",
                    "type": "string"
                  }
                },
                "required": ["city", "line1", "name", "state", "zip"],
                "type": "object"
              },
              "id": {
                "type": "string"
              },
              "letter_url": {
                "description": "Keep this complete private link, including its t token. An anonymous letter can be read and canceled only with that token; an id alone or an API key created later cannot open it. A letter created with an API key can also be read and canceled with that same key.",
                "type": "string"
              },
              "mode": {
                "enum": ["test", "live"],
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "origin": {
                "enum": ["web", "api", "mcp", "unknown"],
                "type": "string"
              },
              "pages": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "partner_checked_at": {
                "description": "UTC time of the last successful live tracking poll recorded by this service, even if USPS supplied no new scans. Null means no successful poll time is recorded (including test or legacy letters). A read never polls the partner; this is not a delivery or mailing time or a freshness guarantee.",
                "type": ["string", "null"]
              },
              "preview_url": {
                "type": "string"
              },
              "proof_of_mailing": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "at": {
                        "description": "USPS acceptance scan time, in UTC RFC 3339 format with milliseconds (YYYY-MM-DDTHH:mm:ss.sssZ).",
                        "type": "string"
                      },
                      "date": {
                        "description": "The scan’s local date (YYYY-MM-DD), as USPS Tracking shows it. Cite this as the mailing date.",
                        "type": "string"
                      },
                      "scan": {
                        "description": "USPS’s acceptance scan text.",
                        "type": "string"
                      }
                    },
                    "required": ["at", "date", "scan"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The acceptance scan records when USPS accepted the letter; null until an acceptance scan is recorded. Assistants cite date as the mailing date. This is not a postmarked receipt or a legal-status determination."
              },
              "quote": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "const": "usd",
                    "type": "string"
                  },
                  "line_items": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "amount_cents": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "code": {
                          "enum": ["postage", "printing", "service_fee"],
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        }
                      },
                      "required": ["amount_cents", "code", "label"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "pages": {
                    "maximum": 10,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "partner_cost_cents": {
                    "description": "Public printing-and-postage cost in USD cents. The itemized price adds a 10% service fee; total_cents is before any Stripe sales tax.",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "service": {
                    "enum": ["certified", "certified_err"],
                    "type": "string"
                  },
                  "total_cents": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["currency", "line_items", "pages", "partner_cost_cents", "service", "total_cents"],
                "type": "object"
              },
              "receipt_url": {
                "description": "Private token link to the USPS electronic Return Receipt PDF. Present only for certified_err in receipt_ready while files are retained; omitted means no downloadable receipt is available here, not that delivery failed. Keep the t token; this receipt is private like the letter PDF.",
                "type": "string"
              },
              "refund": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amount_cents": {
                        "description": "Full refund amount in USD cents, including sales tax for a card payment; zero when nothing was charged.",
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "destination": {
                        "anyOf": [
                          {
                            "enum": ["card", "balance"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "The card paid with or the prepaid balance paid from; null when nothing was charged."
                      },
                      "state": {
                        "description": "accepted means the card processor accepted the refund or the prepaid balance was credited; it does not mean a card refund has posted at the bank. manual means we will refund it by hand; pending means acceptance is not yet recorded. not_charged means no money moved.",
                        "enum": ["accepted", "manual", "pending", "not_charged"],
                        "type": "string"
                      }
                    },
                    "required": ["amount_cents", "destination", "state"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Refund record for a canceled, rejected or failed letter; null when no refund is due. Use state and amount_cents to tell the person what happened to their payment. Card refunds usually show within 5 to 10 business days; the bank decides exactly when."
              },
              "review_note": {
                "type": ["string", "null"]
              },
              "send_now": {
                "description": "Whether someone chose to skip the 30-minute cancellation hold. This never skips required payment or screening; auto-send keys have no per-letter approval step.",
                "type": "boolean"
              },
              "service": {
                "enum": ["certified", "certified_err"],
                "type": "string"
              },
              "state": {
                "description": "Persisted lifecycle state, not proof of mailing. printed comes from a Printed tracking observation; USPS acceptance requires proof_of_mailing. Reads can skip intermediate states. Test letters stop at submitted and never print or mail.",
                "enum": ["draft", "paid", "screening", "review", "submitted", "printed", "mailed", "in_transit", "delivered", "receipt_ready", "canceled", "failed", "returned", "refunded"],
                "type": "string"
              },
              "timeline": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "at": {
                      "description": "When the event happened, in UTC RFC 3339 format with milliseconds (YYYY-MM-DDTHH:mm:ss.sssZ). For USPS tracking scans, this is USPS’s scan time, not the time we recorded it.",
                      "type": "string"
                    },
                    "last_at": {
                      "description": "UTC time of the last observation in a collapsed status-check row; omitted for one observation. at remains the first observation time, not a mailing time.",
                      "type": "string"
                    },
                    "note": {
                      "description": "Event wording. Printing partner job statuses are observations at the check time; handed to USPS is not a USPS acceptance scan.",
                      "type": "string"
                    },
                    "observations": {
                      "description": "Count of adjacent identical printing-partner status checks collapsed into this row; omitted for a single observation. No USPS scans or state transitions are collapsed.",
                      "maximum": 9007199254740991,
                      "minimum": 2,
                      "type": "integer"
                    },
                    "source": {
                      "description": "Who reported it. partner includes the printing partner’s Printed and Provided to postal processing facility scans; other USPS scans remain usps.",
                      "type": "string"
                    },
                    "state": {
                      "anyOf": [
                        {
                          "enum": ["draft", "paid", "screening", "review", "submitted", "printed", "mailed", "in_transit", "delivered", "receipt_ready", "canceled", "failed", "returned", "refunded"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "When an acceptance scan exists, the USPS mailed tag belongs to that scan. A legacy mailed tag alone is not proof of mailing; read proof_of_mailing."
                    }
                  },
                  "required": ["at", "note", "source", "state"],
                  "type": "object"
                },
                "type": "array"
              },
              "to": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "line1": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "line2": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "default": "",
                    "description": "Person's full name. Omit or leave empty when sending to an organization only; either name or organization must contain nonblank text.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "organization": {
                    "description": "Organization or company name. For an organization-only address, provide this and omit name. When both names are the same, we print the organization once.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "state": {
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "zip": {
                    "pattern": "^\\d{5}(-\\d{4})?$",
                    "type": "string"
                  }
                },
                "required": ["city", "line1", "name", "state", "zip"],
                "type": "object"
              },
              "tracking_number": {
                "type": ["string", "null"]
              },
              "tracking_url": {
                "type": ["string", "null"]
              }
            },
            "required": ["acceptance_expected_by", "address_as_given", "address_note", "address_status", "cancel_until", "created_at", "document_source", "files_deleted_at", "first_usps_scan", "from", "id", "letter_url", "mode", "next_step", "origin", "pages", "partner_checked_at", "preview_url", "proof_of_mailing", "quote", "refund", "review_note", "send_now", "service", "state", "timeline", "to", "tracking_number", "tracking_url"],
            "type": "object"
          },
          "annotations": {
