                      },
                      "line2": {
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      "name": {
                        "default": "",
                        "description": "Person's full name. Omit or leave empty when sending to an organization only; either name or organization must contain nonblank text.",
                        "maxLength": 40,
                        "type": "string"
                      },
                      "organization": {
                        "description": "Organization or company name. For an organization-only address, provide this and omit name. When both names are the same, we print the organization once.",
