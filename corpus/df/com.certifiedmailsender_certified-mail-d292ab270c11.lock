      "serverInfo": {
        "name": "certifiedmailsender",
        "title": "Certified Mail Sender",
        "version": "1.0.1",
        "description": "USPS Certified Mail: person-approved or trusted auto-send, with optional electronic Return Receipt.",
        "websiteUrl": "https://certifiedmailsender.com",
        "icons": [
          {
            "src": "https://certifiedmailsender.com/assets/certified-mail-sender-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://certifiedmailsender.com/assets/certified-mail-sender-1024.png",
            "mimeType": "image/png",
            "sizes": ["1024x1024"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Certified Mail Sender: USPS Certified Mail. quote_letter; create_letter drafts free. Person pays at approval_url; trusted auto-send uses prepaid balance. Never pay. Share only with them. Say exactly: \"This link is private. Anyone with it can read your letter and tracking. Until it goes to our printing partner, normally 30 minutes after payment, they can pay a draft, cancel or send it. Then it shows records only and changes nothing. Don't forward it; tap Open letter on its page and share that PDF instead.\"\n\nNo account/monthly fee. Price: postage/printing + 10%. 1 page: $9.04 certified; $12.24 with electronic Return Receipt.\ncreate_letter: to/from, service, one of text/pdf_base64/pdf_url, new idempotency_key; approval_url/letter_url. The person checks letter/addresses/price/authority; auto-send pays after address confirmation, including USPS corrections.\nKeep letter_url whole, including t. get_letter: state/timeline/tracking/next_step; list_letters: key's letters. preview_url opens only the PDF; it cannot change the letter. If asked what to share, give preview_url.\nPaid letters wait 30 minutes. cancel_until: deadline; hold end, not the final cutoff; cancel_letter: full refund until submission. Only if the person asks to send right away, use send_letter_now after payment or send_now:true on create_letter. Screening must pass. Skipping leaves no guaranteed cancellation period.\n\nErrors: code/message/fix. address_undeliverable means no draft; error.address_reason: code/fields/message/partner_message/lookup_url. unit_required: ask for the apartment/suite/unit; street_number_unconfirmed: check street number; street_not_found: check street name/spelling; city_zip_mismatch: check city and ZIP. Ask the person; do not guess variants. text_has_letterhead: remove the leading address/date the error names. We add both addresses and the date; start from the greeting on.\n\nPeople can write or upload at https://certifiedmailsender.com/send. Not affiliated with USPS; no legal advice.",
      "tools": [
        {
          "name": "cancel_letter",
          "title": "Cancel a letter",
          "description": "Cancel before submission to the printing partner and refund any payment in full. Read refund.state, refund.amount_cents and refund.destination in the result; do not claim a refund succeeded unless its state is accepted. Card refunds go back to the card paid with and usually show within 5 to 10 business days; the bank decides exactly when. Balance refunds return to the prepaid balance. Paid letters normally have a 30-minute hold. Canceling is free; a submitted letter cannot be canceled. Read the returned refund and next_step; cancellation does not mail anything. Use id with its API key, or the complete private letter_url. Example: {\"letter_url\":\"https://certifiedmailsender.com/l/<id>?t=<token>\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Letter id; send the API key that created it in Authorization.",
                "minLength": 1,
                "type": "string"
              },
              "letter_url": {
                "description": "Complete private letter_url or approval_url, including its t token.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acceptance_expected_by": {
                "description": "Eastern date (YYYY-MM-DD) by whose end the acceptance scan usually appears. Present from submission while no acceptance or individual-piece network/delivery scan is recorded and next_step gives this date. Null after an individual-piece scan even if acceptance is missing; proof_of_mailing remains null. Before it ends, tell the person when to contact support; after it ends, contact support now so we can check with the printing partner and USPS.",
                "type": ["string", "null"]
              },
              "address_as_given": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "city": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "line1": {
                        "maxLength": 64,
                        "minLength": 1,
