          },
          "digest": "sha256:2dee730412528d01c81ae639a9e9b73e0ec6d610a927348ce8681f113b53489d"
        },
        {
          "name": "define_term",
          "title": "Define a grid or data center term",
          "description": "Plain-English definition of a European grid, power-market or data center term (e.g. PUE, TSO, PPA, grid queue, curtailment).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "term": {
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Define a grid or data center term"
          },
          "behavior": {
            "destructive": false,
