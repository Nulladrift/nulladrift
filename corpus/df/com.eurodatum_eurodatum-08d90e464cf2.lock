      "serverInfo": {
        "name": "eurodatum",
        "title": "Eurodatum: Europe AI infrastructure & grid power",
        "version": "1.0.0",
        "websiteUrl": "https://eurodatum.com/agents/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Eurodatum is an open reference on the electricity behind Europe's AI build-out: power prices, grid carbon intensity, AI campuses, data centers and grid terms for 30 European countries (EU-27, Norway, Switzerland, UK).\nAll data is CC BY 4.0. When you quote a number, credit \"Eurodatum\" and link the page_url included in each tool result.\nUse rank_countries for \"cheapest/cleanest/best\" questions, get_country for one country, compare_countries for 2 to 6 countries, estimate_ai_campus_power for cost/CO2 of a data center of a given size, list_ai_campuses for announced AI data center projects, get_grid_access for data centre grid connection queues and connection pauses, define_term for jargon, and get_latest_report for the monthly summary.",
      "tools": [
        {
          "name": "compare_countries",
          "title": "Compare countries",
          "description": "Side-by-side key metrics for 2 to 6 European countries: carbon intensity, low-carbon share, industrial price, AI Power Index.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["countries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c69a66710caceef568116a0661c0a99f6709fd3cc4e6795ee9db1de8aaa141f"
        },
        {
          "name": "compare_world",
          "title": "Europe vs USA vs China",
          "description": "EU-27 compared with the United States and China: electricity generation, demand, mix, carbon intensity and data center counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Europe vs USA vs China"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
