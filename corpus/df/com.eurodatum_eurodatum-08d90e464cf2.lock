            "readOnly": true
          },
          "digest": "sha256:e77bfd2abddc8af43dccac5ebc601fb8b089ba3827c80b700079d23db40671ab"
        },
        {
          "name": "estimate_ai_campus_power",
          "title": "Estimate AI campus power cost & CO2",
          "description": "Estimate yearly electricity use, power bill (at Eurostat industrial prices) and CO2 for an AI data center of a given IT load, in one country or ranked across all countries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional. Omit to rank all countries from cheapest.",
                "type": "string"
              },
              "it_load_mw": {
                "description": "IT load in MW",
                "maximum": 5000,
                "minimum": 1,
                "type": "number"
              },
              "pue": {
                "default": 1.2,
                "maximum": 2.5,
                "minimum": 1,
                "type": "number"
              },
              "utilisation_pct": {
                "default": 80,
                "maximum": 100,
                "minimum": 10,
                "type": "number"
              }
            },
            "required": ["it_load_mw"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate AI campus power cost & CO2"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f581c4276067fa29e0ad934202f72db9cc0761ef5950e0e3a3059012111ec9a"
        },
        {
          "name": "get_country",
          "title": "Country power profile",
          "description": "Full electricity profile of one European country for AI infrastructure: mix, carbon intensity, industrial and wholesale prices, data centers, grid operators, climate, and an editorial grid-access outlook.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name, slug or ISO-2 code, e.g. 'Germany', 'germany', 'DE'",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Country power profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b11b56fa9c4357a393b13e1d5278d4397dccfc30d6a2f5ee7a4862220198ed71"
        },
        {
          "name": "get_grid_access",
          "title": "Data centre grid connection queues",
          "description": "How many GW of data centres (or large loads) are queuing for a grid connection in each European country, compared with the country's average load, plus what the grid operator is doing (paused, fees, auctions, maturity tests). Every row has a source. Filter by country or policy status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country name, slug or ISO-2 code",
                "type": "string"
              },
              "status": {
                "description": "Optional policy filter",
                "enum": ["paused", "reform", "auction", "conditional", "cap-proposed", "fast-track", "open"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Data centre grid connection queues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2e943cecd01d75d60c8f0120690d028b4bb53290e920b96dbd76bba54e835c95"
        },
        {
          "name": "get_latest_report",
          "title": "Latest monthly report",
          "description": "The latest 'State of European AI power' monthly report: five key findings plus wholesale prices, AI Power Index leaders, campus pipeline, grid carbon and industrial prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest monthly report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1164831f0f8904490d7e2a567c97b0b47cc48f7ef6d2fffd14eebc92793dc0b9"
        },
        {
          "name": "list_ai_campuses",
          "title": "List announced AI campuses",
          "description": "Announced and under-construction AI data center campuses in Europe (tracker with a primary source per project). Filter by country, status or minimum MW.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "type": "string"
              },
              "min_mw": {
                "minimum": 0,
                "type": "number"
              },
              "status": {
                "enum": ["announced", "bid", "mou", "in-build", "partly-live", "delayed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List announced AI campuses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1409acc6299bb1b206cb17a9ae801aff5524d0648040efa4f2e94031c6c9c779"
        },
        {
          "name": "rank_countries",
          "title": "Rank European countries",
          "description": "Rank the 30 tracked European countries on one metric (cheapest power, cleanest grid, AI Power Index, data center count, etc.). Returns rank, value and links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "description": "ai_power_index: AI Power Index (0-100, price and carbon weighted equally, higher is better); industrial_price: Industrial electricity price, €/kWh excl. VAT, 20-70 GWh/yr consumers (Eurostat); carbon_intensity: Grid carbon intensity, gCO2/kWh; low_carbon_share: Low-carbon share of generation, %; wholesale_price: Average day-ahead wholesale price, last 12 months, €/MWh; negative_price_hours: Hours with negative wholesale prices, last 12 months; ai_campus_power_cost: Yearly power bill of a 100 MW AI campus, € million; data_centers: Colocation facilities (PeeringDB); cooling_climate: Cooling degree days, 5-year average (lower is cooler); interconnection_2030: Planned cross-border grid capacity in 2030, MW (ENTSO-E TYNDP)",
                "enum": ["ai_power_index", "industrial_price", "carbon_intensity", "low_carbon_share", "wholesale_price", "negative_price_hours", "ai_campus_power_cost", "data_centers", "cooling_climate", "interconnection_2030"],
                "type": "string"
              }
            },
            "required": ["metric"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rank European countries"
          },
