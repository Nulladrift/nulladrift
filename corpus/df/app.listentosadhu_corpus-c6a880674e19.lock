        {
          "name": "search",
          "description": "Semantic + lexical search over the corpus. Returns verses, documents, track passages and titles matching a natural-language query, each with the id needed to fetch the full record (verse_id→verse_get, document_id→document_get, track_id+start_ms/end_ms→transcript_window; media_id→media_render to play the clip). Every filter is optional. Use min_score to drop weak matches.",
          "inputSchema": {
            "properties": {
              "author_id": {
                "description": "Commentator (document) / speaker (track).",
                "type": "string"
              },
              "date_from": {
                "description": "Track date lower bound YYYY-MM-DD.",
                "type": "string"
              },
              "date_to": {
                "description": "Track date upper bound YYYY-MM-DD.",
                "type": "string"
              },
              "kind": {
                "description": "Document (commentary|prose_chapter|letter) or track (lecture|conversation) subtype.",
                "type": "string"
              },
              "lang": {
                "description": "Result language (ISO-639-1).",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 50).",
                "type": "number"
              },
              "location_id": {
                "description": "Track location.",
                "type": "string"
              },
              "min_score": {
                "description": "Drop hits scoring below this cosine floor (0..1, default 0 = no floor).",
