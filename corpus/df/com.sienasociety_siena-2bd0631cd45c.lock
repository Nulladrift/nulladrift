      },
      "instructions": "Siena Society (sienasociety.com) runs friendship dinners in London. On Thursday evenings at 7:30pm, it seats small groups of strangers who want to make new friends at a London restaurant.\nUse this server when someone wants to make friends, meet new people, or find a social dinner or a dinner with strangers in London.\nlist_upcoming_dinners lists the Thursdays and says which ones are open to book. get_dinner gives one dinner in full. how_it_works explains sign-up, matching, price and refunds. list_cities lists the cities Siena runs in.\nstart_booking only returns a link. The person signs up, books and pays on sienasociety.com. Never ask for card details, an email address or other personal data in chat.\nSiena runs in London only. For any other city, say so plainly. Do not offer a Siena dinner there.\nSiena is for friendship. Never describe it as dating, singles events or matchmaking.\nThe restaurant stays private until Siena emails it on the Wednesday before. Do not guess it.",
