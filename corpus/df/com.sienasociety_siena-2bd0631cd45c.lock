        {
          "name": "list_upcoming_dinners",
          "title": "List upcoming Siena dinners",
          "description": "Lists upcoming Siena friendship dinners in a city between two dates, and says which ones are open to book. Siena holds one dinner a week, on Thursday at 7:30pm London time, for small groups of strangers who want to make friends. A few holiday Thursdays have no dinner, and the list leaves them out. Booking for a Thursday opens on the Wednesday two weeks before and closes on the Tuesday before at 23:59. With no dates, the tool lists the next 4 Thursdays. It lists up to 12 weeks ahead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name or id. Only \"London\" has dinners. Defaults to London.",
                "maxLength": 80,
                "type": "string"
              },
              "from": {
                "description": "First date to include, yyyy-mm-dd, London time. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "$ref": "#/properties/from",
                "description": "Last date to include, yyyy-mm-dd, London time. Defaults to 4 weeks after from."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "dinners": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "booking_note": {
                      "type": "string"
                    },
                    "booking_status": {
                      "description": "open: a seat can be booked now. not_open_yet: booking opens on the Wednesday two weeks before. closed: booking closed on the Tuesday before.",
                      "enum": ["open", "not_open_yet", "closed"],
                      "type": "string"
                    },
                    "date": {
                      "description": "The Thursday, yyyy-mm-dd, London time.",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "starts_at": {
                      "description": "ISO 8601 with the London UTC offset.",
                      "type": "string"
                    },
                    "when": {
                      "type": "string"
                    }
                  },
                  "required": ["booking_note", "booking_status", "date", "id", "starts_at", "when"],
                  "type": "object"
                },
                "type": "array"
              },
              "every_dinner": {
                "additionalProperties": false,
                "description": "Facts that are the same for every dinner.",
                "properties": {
                  "food_and_drinks": {
                    "type": "string"
                  },
                  "location": {
                    "type": "string"
                  },
                  "seat_price": {
                    "additionalProperties": false,
                    "properties": {
                      "amount": {
                        "description": "Seat price in the currency's main unit.",
                        "type": "number"
                      },
                      "currency": {
                        "description": "ISO 4217 code.",
                        "type": "string"
                      },
                      "display": {
                        "type": "string"
                      }
                    },
                    "required": ["amount", "currency", "display"],
                    "type": "object"
                  },
                  "table_size": {
                    "type": "string"
                  },
                  "time": {
                    "type": "string"
                  }
                },
                "required": ["food_and_drinks", "location", "seat_price", "table_size", "time"],
                "type": "object"
              },
              "from": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["city", "dinners", "from", "message", "to"],
            "type": "object"
