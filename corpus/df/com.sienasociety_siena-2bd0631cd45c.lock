                    "type": "string"
                  },
                  "time": {
                    "type": "string"
                  }
                },
                "required": ["food_and_drinks", "location", "seat_price", "table_size", "time"],
                "type": "object"
              },
              "from": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["city", "dinners", "from", "message", "to"],
            "type": "object"
