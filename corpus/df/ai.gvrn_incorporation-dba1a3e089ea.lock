      "instructions": "GVRN Incorporation MCP — submit company incorporation requests for review by the GVRN corporate-secretarial (corpsec) team.\n\nFlow (three steps):\n1. Verify the user's email ONCE, up front: ask for their email → request_email_otp → ask for the 6-digit code they received → verify_email_otp → verificationToken (valid ~30 min, reused by every other tool).\n2. create_incorporation_draft with the verificationToken and whatever details the user has already given. Add more later with update_incorporation_draft only if the user volunteers more.\n3. submit_incorporation as soon as the user confirms — do NOT hold submission back to fill gaps. A human corpsec specialist reviews every request and follows up on missing details via the verified email.\n\nKeep it light for the user:\n- Ask only for their email (required) and, ideally, a company name and jurisdiction. Everything else is optional — take what the user offers, never run through the field list question by question.\n- Never invent field values; leave unknown fields out.\n- Relay the draftId to the user so they can resume later. Drafts are only accessible with a token for the email that created them — if the token expires, re-verify the same email to continue.\n- Track progress after submission with get_incorporation_status.\n- This tool files a request for human review; it does not legally incorporate a company by itself.",
      "tools": [
        {
          "name": "create_incorporation_draft",
          "title": "Create incorporation draft",
          "description": "Creates a new incorporation request draft bound to the verified email, using any fields provided. Requires a verificationToken from verify_email_otp; every other field is optional. Returns a draftId that identifies the draft for later updates, submission, and status checks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "alternativeCompanyNames": {
                "description": "Fallback company names in priority order",
                "items": {
                  "maxLength": 300,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "businessDescription": {
                "description": "What the company will do",
                "maxLength": 5000,
                "type": "string"
              },
              "companyName": {
                "description": "Preferred company name",
                "maxLength": 300,
                "type": "string"
              },
              "currency": {
                "description": "Share capital currency, e.g. \"USD\"",
                "maxLength": 10,
                "type": "string"
              },
              "entityType": {
                "description": "e.g. \"LTD\", \"FOUNDATION\", \"LLC\" — free text is accepted",
                "maxLength": 100,
                "type": "string"
              },
              "founders": {
                "description": "Founders / shareholders / directors",
                "items": {
                  "description": "Founder details — every field optional",
                  "properties": {
                    "email": {
                      "description": "Founder's contact email",
                      "maxLength": 320,
                      "type": "string"
                    },
                    "fullName": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "nationality": {
                      "description": "Nationality or citizenship, free text",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "role": {
                      "description": "e.g. \"Director\", \"Shareholder\", \"CEO\"",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "shareAmount": {
                      "description": "Number of shares allocated to this founder",
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "jurisdiction": {
                "description": "Target jurisdiction, e.g. \"BVI\", \"CAYMAN\", \"PANAMA\" — free text is accepted",
                "maxLength": 100,
                "type": "string"
              },
              "notes": {
                "description": "Anything else relevant: existing structures, PEP status, special requests",
                "maxLength": 10000,
                "type": "string"
              },
              "parValue": {
                "description": "Par value per share",
                "minimum": 0,
                "type": "number"
              },
              "totalShares": {
                "description": "Total shares to be issued",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "urgency": {
                "description": "Timeline constraints, e.g. \"needed before token launch July 1\"",
                "maxLength": 500,
                "type": "string"
              },
              "verificationToken": {
                "description": "Token from verify_email_otp for the email the draft is bound to",
                "type": "string"
              }
            },
            "required": ["verificationToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
