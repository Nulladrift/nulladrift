{
  "lockfileVersion": 2,
  "subjects": {
    "com.scripthaul/transcripts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scripthaul.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "scripthaul",
        "title": "ScriptHaul",
        "version": "1.0.0",
        "description": "Free YouTube transcripts for agents: single videos in seven formats, channel/playlist listings, and bulk ZIP download links. No API key, no account.",
        "websiteUrl": "https://scripthaul.com",
        "icons": [
          {
            "src": "https://scripthaul.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ScriptHaul fetches YouTube transcripts. To answer questions about a channel or playlist: call list_videos to see every video with its date and ID, pick the relevant ones by title, and call get_transcript for each. Cached transcripts are unlimited; uncached fetches and cold enumerations share a small daily allowance per IP. When the user wants every transcript as files, use get_bulk_download_link — bulk downloads run free on scripthaul.com. Use get_latest_videos with exactly one channel or playlist to read its latest RSS entries for zero credits and no cold-fetch allowance. Latest-upload requests have a separate allowance of 30 per IP per day, including cached reads, resetting at midnight UTC.",
      "tools": [
        {
          "name": "get_bulk_download_link",
          "title": "Get bulk download link",
          "description": "For a YouTube channel or playlist URL, returns a prefilled scripthaul.com link where the user can download every transcript as a ZIP for free. Bulk jobs cannot run over this keyless MCP server; they need the website. Costs 0 credits. Example prompt: \"Give me a download link for every transcript in https://www.youtube.com/@TED.\"",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "YouTube channel or playlist URL (also accepts @handles).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "type": {
                "description": "What the input resolved to.",
                "enum": ["channel", "playlist"],
                "type": "string"
              },
              "url": {
                "description": "Prefilled scripthaul.com link that starts the bulk download.",
                "type": "string"
              }
            },
            "required": ["type", "url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get bulk download link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3313d76ca42ddaaa6a80d870048b7a63fdc15a7a589d511849e1a48bf7b018a"
        },
        {
          "name": "get_latest_videos",
          "title": "Get latest channel or playlist videos",
          "description": "Read up to the newest 15 public RSS entries from exactly one channel or playlist, cached for ten minutes. Costs 0 credits and no cold-fetch allowance. Separate allowance: 30 requests per IP per day shared across channels and playlists, including cached reads; resets at midnight UTC. Use a UC channel ID, an already-resolved channel alias, or a public playlist ID/URL; an unknown handle must first be resolved on the keyed API. This is a recent window, not a complete inventory. Example prompt: \"What did channel UCAuUUnT6oDeKwE6v1NGQxug upload recently?\"",
          "inputSchema": {
            "additionalProperties": false,
            "oneOf": [
              {
                "required": ["channel"]
              },
              {
                "required": ["playlist"]
              }
            ],
            "properties": {
              "channel": {
                "description": "UC channel ID, a /channel/UC… URL, or an already-resolved alias.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "playlist": {
                "description": "Public YouTube playlist ID or URL.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ok": {
                "const": true
              },
              "videos": {
                "items": {
                  "properties": {
                    "cached": {
                      "type": "boolean"
                    },
                    "published_at": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "video_id": {
                      "pattern": "^[A-Za-z0-9_-]{11}$",
                      "type": "string"
                    }
                  },
                  "required": ["cached", "published_at", "title", "url", "video_id"],
                  "type": "object"
                },
                "maxItems": 15,
                "type": "array"
              }
            },
            "required": ["ok", "videos"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get latest channel or playlist videos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:02ff9848111576676d93c706c5006d31aad8f88f1154accca97873df01b21649"
        },
        {
          "name": "get_transcript",
          "title": "Get YouTube transcript",
          "description": "Fetch the transcript of a single YouTube video by URL or 11-character video ID. Serves the permanent cache instantly when available and otherwise fetches from YouTube (uncached fetches are limited per IP per day). Formats: clean text, timestamped, both, srt, vtt, md, json. Costs 0 credits. Example prompt: \"Get the transcript of https://youtu.be/jNQXAC9IVRw.\"",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "Output format. Default \"clean\" (plain text). \"timestamped\" prefixes each line with a timestamp; srt/vtt are subtitle files; json is structured.",
                "enum": ["clean", "timestamped", "both", "srt", "vtt", "md", "json"],
                "type": "string"
              },
              "language": {
                "description": "Preferred caption language code such as \"en\" or \"pt-BR\". Optional; defaults to English with fallback to whatever track exists.",
                "type": "string"
              },
              "video_url": {
                "description": "YouTube video URL (watch, youtu.be, shorts, embed, live) or a bare 11-character video ID.",
                "type": "string"
              }
            },
            "required": ["video_url"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Transcript metadata. The transcript text itself is delivered in the text content block, not duplicated here.",
            "properties": {
              "channel": {
                "description": "Channel name when known.",
                "type": "string"
              },
              "characters": {
                "description": "Length of the rendered transcript text.",
                "type": "integer"
              },
              "format": {
                "description": "The output format that was rendered.",
                "type": "string"
              },
              "kind": {
                "description": "manual = creator captions, asr = auto-generated.",
                "enum": ["manual", "asr"],
                "type": "string"
              },
              "language": {
                "description": "Language of the DELIVERED track. May differ from the requested language when YouTube refuses on-the-fly translation; the text header says so when it happens.",
                "type": "string"
              },
              "title": {
                "description": "Video title when known.",
                "type": "string"
              },
              "video_id": {
                "description": "The 11-character YouTube video ID.",
                "type": "string"
              }
            },
            "required": ["characters", "format", "kind", "language", "video_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get YouTube transcript"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5970b50c7f7b94d3d56f2a45c91557cd15022473973c6eec5265fed6419b370a"
        },
        {
          "name": "list_videos",
          "title": "List videos in a channel or playlist",
          "description": "List the videos of a YouTube channel or playlist: date, video ID, and title for each. Use this to answer questions about a channel — pick the relevant videos by title, then call get_transcript for each one. Listings are cached for a few hours; a fresh enumeration counts against the same daily allowance as uncached fetches. Costs 0 credits. Example prompt: \"List the videos in https://www.youtube.com/@TED.\"",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum videos to list, newest first for channels. Default 100, maximum 200.",
                "type": "integer"
              },
              "url": {
                "description": "YouTube channel or playlist URL (also accepts @handles).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "shown": {
                "description": "How many are included below (bounded by limit).",
                "type": "integer"
              },
              "title": {
                "description": "Channel or playlist title when known.",
                "type": "string"
              },
              "truncated": {
                "description": "True when the source has more videos than one enumeration returns (500).",
                "type": "boolean"
              },
              "type": {
                "enum": ["channel", "playlist"],
                "type": "string"
              },
              "video_count": {
                "description": "Total videos in the listing snapshot.",
                "type": "integer"
              },
              "videos": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "published_at": {
                      "description": "ISO date when known.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["shown", "type", "video_count", "videos"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List videos in a channel or playlist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:601b3ccbc51271a8d587f41c85eeadcf15102829380943721f19a4e8c48d1c9a"
        }
      ],
      "digest": "sha256:5ecc6fe299e1b07ecf0d3e4aec82ee9a2664e7aafeaeec7f4d2dcbb03526c210"
    }
  }
}
