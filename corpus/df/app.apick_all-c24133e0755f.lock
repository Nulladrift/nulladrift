        },
        {
          "name": "base64_to_image",
          "title": "base64 이미지 변환",
          "description": "Decode a base64-encoded image string back into an image file. base64 로 인코딩된 이미지 문자열을 원본 이미지 파일로 디코딩해 반환합니다. \"data:image/타입;base64,\" 접두어가 붙은 문자열도 허용됩니다. [호출당 2포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "base64": {
                "description": "이미지 base64 문자열 (data:image/타입;base64, 접두어 허용)",
                "type": "string"
              }
            },
            "required": ["base64"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
