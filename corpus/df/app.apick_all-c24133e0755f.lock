      "tools": [
        {
          "name": "account_realname",
          "title": "계좌 예금주 실명 조회",
          "description": "Look up the account holder name of a Korean bank account. 대한민국 은행 계좌의 예금주명을 조회합니다. 송금 전 예금주 확인 등에 사용합니다. bank_code 또는 bank_name 중 하나는 입력해야 합니다. [호출당 60포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "account_num": {
                "description": "계좌번호 (숫자만, 하이픈 제외)",
                "type": "string"
              },
              "bank_code": {
                "description": "은행 코드 (bank_code Tool로 조회 가능, 예: 004)",
                "type": "string"
              },
              "bank_name": {
                "description": "은행명 (예: 국민). bank_code 대신 입력 가능",
                "type": "string"
              }
            },
            "required": ["account_num"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d9180a2c73a56608974c0d67c36364d926f5d8fc5ef5a6d35d1689cddd952cb5"
        },
        {
          "name": "amazon_product",
          "title": "아마존 상품 정보 조회",
          "description": "Amazon product by URL or ASIN: title, price, rating, reviews count, availability, seller, features, images. 아마존 상품 주소 또는 ASIN 으로 상품명·가격·평점·리뷰 수·재고·판매자·특징·이미지를 조회합니다. [호출당 20포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asin": {
                "description": "ASIN 10자리 (미국 아마존 기준)",
                "type": "string"
              },
              "url": {
                "description": "아마존 상품 주소 (/dp/ASIN 형식, url 또는 asin 중 하나 필수)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25299e6d3f27d31276c35aa3ae4975ebd9e91db8fd028f40a22932331be133cb"
        },
        {
          "name": "app_reviews",
          "title": "앱 리뷰 조회",
          "description": "Get iOS app metadata and customer reviews by numeric app id. iOS 앱 정보(평점·가격·장르)와 고객 리뷰를 함께 돌려줍니다. country 기본 kr, page 로 리뷰 페이지를 넘깁니다(최대 10). [호출당 30포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "appId": {
                "description": "iOS 앱 ID (숫자)",
                "pattern": "^[0-9]{1,12}$",
                "type": "string"
              },
              "country": {
                "description": "국가 코드 (기본 kr)",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "page": {
                "description": "리뷰 페이지 (기본 1, 최대 10)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f073d6fb8e5de2337e14aeddc73013d6e34b5b7464335098b6c734e0e778e22e"
        },
        {
          "name": "bank_code",
          "title": "은행코드 조회",
          "description": "List Korean bank codes and names. 대한민국 은행 코드·은행명 전체 목록을 반환합니다. transfer_1won, account_realname Tool의 bank_code 입력값을 찾을 때 사용합니다. 무료입니다. [무료]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
