        {
          "name": "check_spam_number",
          "title": "스팸/광고/범죄 전화번호 조회",
          "description": "Check whether a phone number has been reported for spam, advertising, or criminal use in Korea. 스팸/광고/범죄에 사용된 전화번호인지 조회합니다. 수신 전화 필터링, 이상 거래 탐지 등에 사용합니다. [호출당 10포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "number": {
                "description": "전화번호 (예: 01012341234)",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
