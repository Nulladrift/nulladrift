      "serverInfo": {
        "name": "jojapi-sms-verify",
        "title": "SMS Verify API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of SMS Verify on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/sms-verify/pricing · Docs: https://jojapi.com/hub/api/sms-verify",
      "tools": [
        {
          "name": "get_pricing",
          "title": "Price List",
          "description": "What a verification SMS costs in every country it can be sent to, in credits, sorted by country name. Each country is priced for a typical mobile number and checked at least once a day (`checked_at`, UTC); carriers within a country can differ, so use Estimate Cost for an exact number. Countries SMS cannot be sent to are left out. Group: Pricing. Billing per call: Requests: metered (~0.47 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b61685f8f863118778a82002109893afd3c55c3daf34cd00b43a434d42eba76"
        },
        {
          "name": "post_estimate_cost",
          "title": "Estimate Cost",
          "description": "What a verification SMS to this phone number would cost, in credits, and the number's country (`region_code`, ISO 3166-1 alpha-2; `null` when the number belongs to no assigned range). Nothing is sent. The price is for this number's carrier, so it can differ from the country's price in the price list. Group: Pricing. Billing per call: 0 Credits, Requests: metered (~0.44 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body.",
                "properties": {
                  "target": {
                    "description": "The phone number in international format, with its country calling code, for example `+1 201 555 0123`. Spaces and dashes are allowed; a missing `+` is added.",
                    "example": "+1 201 555 0123",
                    "type": "string"
                  }
                },
                "required": ["target"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b719b083cb1e310a4e17449c5175a844a02d75a6512b25a2b810d21ccebbe4e"
        },
        {
          "name": "post_send_numeric_verify",
          "title": "Send Verify SMS",
          "description": "Sends a six-digit verification code to a phone number by SMS and returns the code, so you can compare it with what the user types. The message reads `123-456 is your verification code. Don't share.` The request is charged the message's cost in credits (`cost`), which depends on the destination country and carrier; a message that would cost more than 10,000 credits is not sent (`max_cost_exceeded`). Failed requests are not charged. Group: Verification. Billing per call: Credits: metered (~1285.62 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body.",
                "properties": {
                  "target": {
                    "description": "The phone number in international format, with its country calling code, for example `+1 201 555 0123`. Spaces and dashes are allowed; a missing `+` is added.",
                    "example": "+1 201 555 0123",
                    "type": "string"
                  }
                },
                "required": ["target"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f1251bae249c62df2f4658c22fdee06903e03a396abfce6c748ad396849ae4af"
        }
      ],
