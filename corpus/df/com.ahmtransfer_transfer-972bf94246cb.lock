        "type": "http",
        "url": "https://ahmtransfer.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ahm-transfer",
        "title": "AHM Transfer",
        "version": "1.0.0",
        "websiteUrl": "https://ahmtransfer.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Private airport transfers around Alanya and Antalya (Turkey). Prices are in EUR per vehicle; pairs without a list price are quoted on WhatsApp. Bookings are confirmed by AHM Transfer on WhatsApp; no payment is taken online.",
      "tools": [
        {
          "name": "create_booking_link",
          "title": "Create booking link",
          "description": "Builds a link to AHM Transfer's booking page with the request (route, date, time, passengers) already filled in. The traveller reviews it there and sends it to AHM Transfer on WhatsApp with one tap. Nothing is booked or charged by this tool: the request is confirmed by AHM Transfer in the WhatsApp chat and payment is made after the ride. Known places: Gazipaşa Airport (GZP); Antalya Airport (AYT); Alanya Center; Mahmutlar / Kestel; Konaklı / Avsallar; Okurcalar / Türkler; Side / Manavgat. The airports are named \"Antalya Airport (AYT)\" and \"Gazipaşa Airport (GZP)\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Transfer date, YYYY-MM-DD",
                "type": "string"
              },
              "from": {
                "description": "Pick-up place",
                "type": "string"
              },
              "language": {
                "description": "Language of the booking page and message (default en)",
                "enum": ["tr", "en", "ru", "de"],
                "type": "string"
              },
              "name": {
                "description": "Passenger name for the name sign",
                "type": "string"
              },
              "note": {
                "description": "Flight number, hotel name, child seat or other notes",
                "type": "string"
              },
              "passengers": {
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Pick-up or flight arrival time, HH:MM (local time)",
                "type": "string"
              },
              "to": {
                "description": "Drop-off place",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e361c61bfb331e97b2901943e67d6c68027fd470c6af27d45a89312af7fc3b79"
        },
        {
          "name": "get_service_info",
          "title": "Get service information",
          "description": "Facts about AHM Transfer: vehicles, passenger capacity, payment, cancellation, flight-delay and child-seat policy, service area, languages, contact details and the FAQ.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the FAQ text (default en)",
                "enum": ["tr", "en", "ru", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get service information"
          },
          "behavior": {
