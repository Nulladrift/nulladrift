        {
          "name": "update_member",
          "title": "Update a member's details",
          "description": "Use this when someone asks to change a member's name, phone, email or language. Returns the member's id, name, gym and which fields changed; contact details are never returned. Not for adding a new member.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "New email address.",
                "maxLength": 254,
                "type": "string"
              },
              "expectedLastEditTime": {
                "description": "The lastEditTime from list_members. A member changed since then is refused.",
                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              },
              "language": {
                "description": "New language for their messages, as a code such as en or it.",
                "maxLength": 10,
