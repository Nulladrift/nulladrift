        {
          "name": "get_gym_payment_summary",
          "title": "Summarize gym takings",
          "description": "Use this when someone asks how much their gym took in, or how many payments succeeded, failed or were canceled. Returns payment counts by status and totals by currency; totals include every status. Covers up to 31 days and 100 payments and defaults to the next 7 days, which hold no payments yet. Not for moving money: it cannot charge, refund or transfer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "endTime": {
                "description": "End of the range as an ISO 8601 date-time, after startTime and at most 31 days later; defaults to 7 days after the start",
                "maxLength": 32,
                "type": "string"
              },
              "gymId": {
                "description": "Id of one of the user's gyms, as the gym list returns it (24 lowercase hex characters)",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "startTime": {
                "description": "Start of the range as an ISO 8601 date-time, matched against when each payment was recorded; defaults to now, so pass a past date for past takings",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["gymId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "range": {
                "additionalProperties": false,
                "properties": {
                  "endTime": {
                    "maxLength": 32,
                    "type": "string"
                  },
                  "startTime": {
                    "maxLength": 32,
                    "type": "string"
                  }
                },
                "required": ["endTime", "startTime"],
                "type": "object"
              },
              "recordCount": {
                "minimum": 0,
                "type": "integer"
              },
              "recordCountIsLowerBound": {
                "type": "boolean"
              },
              "statuses": {
                "description": "Payment counts per status, such as SUCCEEDED, FAILED, CANCELED or OTHER",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "status": {
                      "pattern": "^[A-Z0-9_-]{1,48}$",
                      "type": "string"
                    }
                  },
                  "required": ["count", "status"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "totals": {
                "description": "Amount totals per currency, summed over every status including FAILED and CANCELED payments. Payment and member ids, processor or card data, contacts, notes, discounts, decline reasons, services and individual transactions are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "currency": {
                      "pattern": "^(?:[A-Z]{3}|UNSPECIFIED)$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "currency"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "totalsArePartial": {
                "description": "True when more than 100 payments fall in the range or any returned amount is missing or invalid",
                "type": "boolean"
              }
            },
            "required": ["range", "recordCount", "recordCountIsLowerBound", "statuses", "totals", "totalsArePartial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Summarize gym takings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["gymflexa:read"],
                "type": "oauth2"
              }
            ]
          },
