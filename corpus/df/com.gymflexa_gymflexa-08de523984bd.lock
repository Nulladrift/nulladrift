        {
          "name": "book_appointment",
          "title": "Book a gym session",
          "description": "Use this when someone asks to book a member into a session, class or personal training at their gym. Returns the new session with its time, trainer and services; it takes the gym's usual session length and reminders, so the gym's reminder messages go to the member. Not for finding free slots.",
