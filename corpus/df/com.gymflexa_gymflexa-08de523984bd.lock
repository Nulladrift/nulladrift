      "instructions": "# Safe gym operations with GymFlexa\n\nThis skill drives the GymFlexa MCP connector. The user must connect GymFlexa\nand authorize an account with live access to the intended organization. If\nauthorization fails, ask the user to connect GymFlexa. Never request, embed, or\nrepeat an API key, password, OAuth token, payment credential, or webhook\nsecret.\n\n## What the connector changes\n\nThe read tools change nothing. Six tools write, as the signed-in team member:\n`book_appointment`, `reschedule_appointment`, `cancel_appointment`,\n`create_member`, `update_member` and `set_inventory_quantity`. GymFlexa's own\nrules apply to every write: the signed-in account must still be on the gym's\nteam, and the plan's monthly session limit counts bookings made here.\n\nIf those six tools are missing, the connection was authorized to read only\n(every connection made before November 2026 was). Ask the user to disconnect\nGymFlexa and connect it again, allowing GymFlexa to create and update data.\n\nConfirm every write with the user before calling it: which member, which gym,\nwhen, and what will change. Booking, moving and cancelling reach the member:\na booking schedules the gym's reminder messages, a move moves them, and\ndeclining a session the member requested sends the gym's cancellation message\nwhen the gym set one up. Cancelling a booked session sends the member\nnothing. Say so when you ask.\n\nThe connector cannot delete anything, take, charge, refund, retry, settle,\ntransfer or otherwise move funds, send a message of its own, change reminder\nor template settings, create a repeating series of sessions, change services,\nprices, staff or roles, or touch expenses. It cannot provide workout,\nnutrition, medical, insurance, employment, credit, eligibility, or another\nindividualized or high-impact recommendation. Direct the user to the GymFlexa\napp for those.\n\n## Resource identifiers and tenant checks\n\nEvery id is an exact lowercase 24-character hex id returned by a tool. Keep\nthem distinct:\n\n- `gymId` selects one gym owned by the signed-in user's organization, from\n  `list_gyms`. A write may leave it out when the account has one gym.\n- `memberId` names one member, from `list_members` or `create_member`;\n  `appointmentId` one session, from `list_appointments`; `inventoryItemId`\n  one stock item, from `list_inventory_items`.\n- `providerIds` are the trainer ids `list_trainers` returns; `serviceIds` the\n  service ids `list_services` returns.\n- `lastEditTime` is a record's version. Moving or cancelling a session,\n  updating a member and setting a stock quantity take it as\n  `expectedLastEditTime` and are refused with `conflict` when the record\n  changed since it was read.\n- `requestId` is a unique id you choose for each new booking or member, such\n  as a UUID. Calling again with the same `requestId` returns the first result\n  instead of booking or adding twice.\n\nResolve a name with a list tool, then reuse the exact returned id. Never guess\nan id, treat an opaque id as authority, or reuse one from another\norganization. Malformed and cross-tenant ids fail closed.\n\nThe availability API is also used by GymFlexa's public booking page. The\nconnector must finish its tenant-owned gym lookup before calling that route.\nIf ownership cannot be proved, stop; never use public availability as a\ncross-tenant fallback.\n\n## Available tools\n\n| Tool                       | Use it when someone asks…                                                                    |\n| -------------------------- | -------------------------------------------------------------------------------------------- |\n| `list_gyms`                | which gyms they run; also resolves the gym id every other tool needs                         |\n| `get_gym`                  | for a gym's opening hours, timezone, currency or session length                              |\n| `get_gym_availability`     | when there are free session slots, or which coming days are fully booked (up to 14 days)     |\n| `get_gym_schedule_summary` | how busy each UTC day is, past or upcoming (booking counts, at most 31 days)                 |\n| `get_gym_payment_summary`  | how much was taken in, by status and currency (at most 31 days)                              |\n| `list_services`            | what a class, personal training session or other service costs, with the ids a booking takes |\n| `list_trainers`            | which trainers can be booked, with the ids a booking takes                                   |\n| `list_members`             | who the members are, or for a member's id by name (up to 100)                                |\n| `list_appointments`        | when a member is booked, which sessions a trainer has, or what is booked on a day            |\n| `list_inventory_items`     | how much of a product or supply is in stock, or what is running low                          |\n| `show_gym_overview`        | for a one-card overview of one gym                                                           |\n| `book_appointment`         | to book a member into a session                                                              |\n| `reschedule_appointment`   | to move a session to another day or time                                                     |\n| `cancel_appointment`       | to cancel a session, or decline one a member requested                                       |\n| `create_member`            | to add a new member                                                                          |\n| `update_member`            | to change a member's name, phone, email or language                                          |\n| `set_inventory_quantity`   | to correct or update a stock count                                                           |\n\n`list_gyms` and `list_services` use opaque cursors and accept a maximum page of 100. Report `hasMore` and reuse `nextCursor`; never claim completeness when\nmore pages exist. A cursor is query-bound and must not be reused for another\ngym. `list_members`, `list_appointments` and `list_inventory_items` accept a\nmaximum result limit of 100 and return `hasMore`; members and sessions default\nto 20, stock to 50. `list_trainers` is capped at 100.\n\nBoth summary tools inspect at most 101 source records, return at most 100, and\nmark `recordCountIsLowerBound` when more exist. Their default range starts now\nand runs seven days forward, and their maximum is 31 days; pass explicit past\ndates for past payments or past workload. The overview counts at most 100 scheduled\nrecords, previews 12 services, and examines at most 14 availability days. A\ndisplayed `+` count is a lower bound, not an estimate of the total.\n\n## Booking workflow\n\n1. Find the member with `list_members` and its `search` (any words of their\n   name, ignoring case and accents). If they are not there, offer to add them\n   with `create_member`, then use the id it returns.\n2. Use `get_gym` for the gym's timezone and usual session length, and\n   `get_gym_availability` when the user has no time in mind.\n3. Use `list_services` for the services asked for, and `list_trainers` when\n   the gym has several trainers and the user named one or must choose.\n4. Confirm the member, gym, local day and time, services and trainer with the\n   user, then call `book_appointment` with a new `requestId`. Give\n   `startTime` with the gym's UTC offset. Leave `durationMinutes` out for the\n   gym's usual length.\n5. Report the booked time in the gym's timezone, and that the gym's reminders\n   will reach the member.\n\n`book_appointment` books only a member of the same gym and only trainers: the\nteam members with the trainer role, or the founder of a gym they run alone.\nWithout `providerIds` it books the only trainer, or the user when they are a\ntrainer; with several trainers it answers `provider_required`: ask which one.\n`plan_limit_reached` means the gym's monthly session limit is used up; the\nowner can upgrade in the app.\n\n## Moving or cancelling a session\n\n1. Find the session with `list_appointments` (by member, gym and day) and\n   keep its `id` and `lastEditTime`. A trainer's sessions are those whose\n   `providerIds` hold the trainer's id from `list_trainers`; move or cancel\n   them one at a time, each confirmed.\n2. Confirm the change with the user, then call `reschedule_appointment` (the\n   member, trainer, services and length stay the same unless a new\n   `durationMinutes` is given) or `cancel_appointment`. Cancelling keeps the\n   session as canceled; it never deletes it.\n3. On `conflict`, read the session again, tell the user what changed, and ask\n   again before retrying with the new `lastEditTime`.\n\nOnly requested and booked sessions can be moved or canceled. One the member\nattended or missed stays as it is.\n\n## Members\n\n`create_member` needs a name; phone, email and language are optional. The\nphone and email are saved for the gym's messages but never returned. Use\n`update_member` with the member's `lastEditTime` to change a name, phone,\nemail or language; only the fields given change.\n\n## Stock\n\n`list_inventory_items` shows each item's unit, quantity, minimum and whether\nit is at or below its minimum. `set_inventory_quantity` replaces the stored\nquantity with the number given: when the user reports a change (\"we sold\ntwo\"), work out the new total from the quantity you read, confirm it, and send\nthat total with the item's `lastEditTime`.\n\n## When the answer is lost\n\n`delivery_unknown` means the connection dropped after the request was sent,\nso the change may have been saved. For a booking or a new member, retry with\nthe same `requestId`: a record already saved is returned instead of written\ntwice. For anything else, read the record again before deciding to retry.\n\n## Privacy boundary\n\nMember display names and pseudonymous member and session ids are personal\ndata. Use them only when the requested workflow needs to resolve a member or\nchange their sessions, and do not repeat more names or identifiers than\nneeded in the answer.\n\nSafe results may include:\n\n- owned gym ids and display metadata; safe locale, currency, timezone and\n  opening hours; public bookable-capacity summaries;\n- service ids, names and prices;\n- trainer ids and display names;\n- member display names and ids, gym link, language and edit time;\n- session ids, member, gym and trainer ids, times, status, edit time and\n  bounded service summaries;\n- stock item ids, names, units, quantities and minimums; and\n- UTC-day aggregate schedule counts and aggregate recorded payment\n  statuses/totals.\n\nThe connector intentionally never returns:\n\n- member email, phone, address, date of birth or other profile fields,\n  notes, attendance, workout, service or payment history, even right after\n  you sent them;\n- session, member or stock free-text notes, or reminder contents;\n- trainer contact details, working hours, commission or performance data;\n- individual payment ids or amounts, services, discounts, notes, decline\n  reasons, processor/customer ids, cardholder data, credentials or errors;\n- gym contact/address, organization internals, billing/trial state,\n  integrations, reminders, webhooks or arbitrary upstream documents; or\n- raw upstream errors, secrets, logs, files or conversation history.\n\nDo not infer, reconstruct, request, or ask the user to paste excluded fields.\nAsk for a member's phone or email only to add or update that member, never to\nanswer a question. The overview never queries member records. Schedule and\npayment summaries request only minimum fields for immediate aggregation and\nexpose no person-linked record, identifier, exact booked time, or individual\npayment.\n\n## Configuration and capacity audit\n\n1. Use `list_gyms` unless the exact owned gym id is already available.\n2. Call `get_gym` for timezone, opening hours and configured duration.\n3. Call `get_gym_availability`. It follows the gym's own online-booking window\n   (by default from two hours ahead to six months ahead) and returns the first\n   14 days that have openings.\n4. Compare configured hours with daily slot counts and first/last bookable\n   times. Do not extrapolate beyond the days it returns or infer why time is\n   unavailable.\n\nBookable availability times are administrative capacity, not an individual's\nbooked session.\n\n## Schedule audit\n\nUse `get_gym_schedule_summary` with an explicit bounded range when the user's\ndates matter. It groups source `startTime` values by UTC calendar day, then\ndiscards each value. State that the day basis is UTC, that canceled bookings\nare counted, and that the count may be a lower bound. Never infer member\nidentity, attendance, trainer assignment, service, status, or workload cause\nfrom a count; use `list_appointments` when the user needs the sessions\nthemselves.\n\n`show_gym_overview` uses a fixed seven-day schedule range and renders safe\naggregate metrics without querying members. Avoid restating every number if a\nconcise operational observation or next safe check answers the user.\n\n## Catalog and recorded-payment audit\n\nUse `list_services` for catalog names and prices. A catalog price is\nconfiguration, not proof of a final charge or member purchase.\n\nUse `get_gym_payment_summary` only for aggregate administrative status. It\nreturns status counts and amount totals by currency, never an individual row.\nThe currency totals add every status, FAILED and CANCELED included, so they\nare not the amount actually collected; say so, and use the status counts to\nshow how many payments succeeded.\nWhen `totalsArePartial` is true, say that totals cover only the bounded source\nrecords and must not be treated as the gym's full total. Recorded status is not\nindependent proof of bank settlement. The connector cannot charge, refund,\nretry, settle, transfer, or otherwise move funds.\n",
