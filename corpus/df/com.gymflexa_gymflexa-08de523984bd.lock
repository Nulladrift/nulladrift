        {
          "name": "show_gym_overview",
          "title": "Show gym overview",
          "description": "Use this when someone wants a quick overview or dashboard of one gym. Returns an overview card with the gym's details, booking counts for the next 7 days, open online-booking slots across up to 14 days with openings and up to 12 services with prices (no member, trainer or payment data). Not for a single member or booking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "gymId": {
                "description": "Id of one of the user's gyms, as the gym list returns it (24 lowercase hex characters)",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["gymId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "appointmentCount": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "appointmentCountIsLowerBound": {
                "type": "boolean"
              },
              "availabilityDays": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "day": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["count", "day"],
                  "type": "object"
                },
                "maxItems": 14,
                "type": "array"
              },
              "availableDayCount": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "availableSlotCount": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "gym": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "currency": {
                        "anyOf": [
                          {
                            "pattern": "^[A-Z]{3}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "defaultLocale": {
                        "anyOf": [
                          {
                            "maxLength": 16,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "id": {
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "timezone": {
                        "anyOf": [
                          {
                            "maxLength": 64,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["currency", "defaultLocale", "id", "name", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Gym metadata; null when not found. The overview never reads or returns member records, individual appointments or payments, attendance or service history, trainers, notes or health and fitness details."
              },
              "scheduleDays": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "day": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["count", "day"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "scheduleRange": {
                "additionalProperties": false,
                "properties": {
                  "endTime": {
                    "maxLength": 32,
                    "type": "string"
                  },
                  "startTime": {
                    "maxLength": 32,
                    "type": "string"
                  }
                },
                "required": ["endTime", "startTime"],
                "type": "object"
              },
              "serviceCount": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "serviceCountIsLowerBound": {
                "type": "boolean"
              },
              "services": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "lastEditTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "price": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
