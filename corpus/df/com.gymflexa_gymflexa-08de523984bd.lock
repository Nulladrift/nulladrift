              "gym": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "appointmentDuration": {
                        "description": "Default session length in minutes",
                        "type": ["number", "null"]
                      },
                      "countryCode": {
                        "anyOf": [
                          {
                            "pattern": "^[A-Z]{2}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "currency": {
                        "anyOf": [
                          {
                            "pattern": "^[A-Z]{3}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "defaultLocale": {
                        "anyOf": [
                          {
                            "maxLength": 16,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "firstDayOfTheWeek": {
                        "anyOf": [
                          {
                            "enum": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "id": {
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      "lastEditTime": {
                        "anyOf": [
                          {
                            "maxLength": 32,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "name": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "openingHours": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "close": {
                              "anyOf": [
                                {
                                  "pattern": "^\\d{2}:\\d{2}$",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "day": {
                              "enum": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                              "type": "string"
                            },
                            "open": {
                              "anyOf": [
                                {
                                  "pattern": "^\\d{2}:\\d{2}$",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "required": ["close", "day", "open"],
                          "type": "object"
                        },
                        "maxItems": 14,
                        "type": "array"
                      },
                      "timezone": {
                        "anyOf": [
                          {
                            "maxLength": 64,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["appointmentDuration", "countryCode", "currency", "defaultLocale", "firstDayOfTheWeek", "id", "lastEditTime", "name", "openingHours", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Scheduling settings of the gym; null when not found. Address, phone, website, organization, billing, integrations, reminders, members and arbitrary metadata are excluded."
