{
  "lockfileVersion": 2,
  "subjects": {
    "com.astranl/renovation-estimate-nl": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://astranl.com/mcp/streamable"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "astranl-mcp",
        "version": "1.37.51"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "1. Call ask_astranl with your need in plain words. 2. When ready, call create_task with the required details to submit the job. 3. Use check_task for progress and get_evidence for recorded proof. The AstraNL core profile provides these tools: astranl_renovation_estimate_nl, astranl_contractor_check_nl, astranl_permit_rules_nl, astranl_material_price_nl, astranl_verify_receipt. AstraNL never pays, never completes a checkout and never holds money. Reading and verifying need no key.",
      "tools": [
        {
          "name": "astranl_contractor_check_nl",
          "title": "Contractor check before paying, Netherlands (aannemer controleren)",
          "description": "Check a Dutch or EU company before paying an advance or signing with it (aannemer controleren, KvK nummer controleren, btw-nummer controleren, contractor check Netherlands). Call it when someone is about to pay a deposit or invoice to a contractor or supplier, or sign with it, and has its KvK number (8 digits, sent as text), company name or EU VAT number. Returns verdicts, not register data: active KvK registration yes or no, name match (EXACT, NORMALIZED_MATCH or NO_MATCH), VAT number valid in VIES, EU sanctions list candidates, a published insolvency under the KvK number, open questions and a check_id. A KvK register query is paid: 0.25 EUR per sealed call on https://astranl.com/api/contractor-check/sealed with an agent key; through this tool a call with a kvk_number answers payment_required with that route and reads nothing. The VIES and sanctions screening without a KvK number are free. It does not tell who may sign for the company, whether an IBAN belongs to it or its credit risk. Same input and answer as check_counterparty_nl. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "city": {
                "description": "not used; kept for compatibility, AstraNL does not search the register by name",
                "maxLength": 80,
                "type": "string"
              },
              "company_name": {
                "description": "the company name exactly as your document or contact states it",
                "maxLength": 200,
                "type": "string"
              },
              "kvk_number": {
                "description": "Dutch KvK number, exactly 8 digits, sent as text so a leading zero is kept, as printed on the invoice, quote, contract or website imprint",
                "maxLength": 12,
                "type": "string"
              },
              "purpose": {
                "description": "optional: the next action you are about to take, for example approve supplier or pay invoice",
                "maxLength": 200,
                "type": "string"
              },
              "vat_number": {
                "description": "EU VAT number with country prefix, for example NL810433941B01",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Contractor check before paying, Netherlands (aannemer controleren)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "alias_of": "check_counterparty_nl",
              "auth_requirement": "none to call; a KvK read needs the prepaid agent wallet, header X-Agent-Key, on the sealed route",
              "cost_or_fee_if_any": "a check with a kvk_number is paid first: 0.25 EUR per sealed call from the prepaid agent wallet at GET /api/contractor-check/sealed; unpaid it answers payment_required and reads nothing. VIES and sanctions screening without a kvk_number read no KvK data",
              "do_not_use_when": "you need to know who may legally sign for the company, whether an IBAN belongs to it, its credit risk or solvency; this tool cannot tell you that",
              "example_intent": "Before we pay invoice 2026-114 from SUPPLIER B.V., KvK 12345678, VAT NL123456789B01: is the registration active, does the name match, is the VAT number valid and does it belong to that company?",
              "next_possible_action": "record_counterparty_check with the check_id when someone else must verify it later; attach check_id and the result to your own approval or payment record; stop and ask a human when any source is UNKNOWN, a name does not match, a sanctions candidate appears or an establishment is inactive",
              "profile_core": "https://astranl.com/mcp/streamable?profile=core",
              "proof_level": "observation of official sources at observed_at; verifiable by others after record_counterparty_check; never a statement that the counterparty is trustworthy",
              "required_inputs": ["kvk_number for the register verdicts", "company_name for the name verdict", "vat_number for VIES"],
              "returns": "verdicts derived from the sources, not the register data: KvK registration found and active or not, supplied name against the register EXACT or NORMALIZED_MATCH or NO_MATCH, VAT valid in VIES, VIES name against the register, EU sanctions list candidates, open questions, a check_id and a link to the KVK source; record_counterparty_check turns it into a public verifiable record; access_basis names the evidence class, accountable holder, terms and recheck rule of each source",
              "search_phrases": ["aannemer controleren", "KvK nummer controleren", "bedrijf controleren", "btw-nummer controleren", "contractor check Netherlands", "is this Dutch company real"],
              "side_effect_class": "read_only; the digest of the result is kept 48 hours so it can be recorded on request",
              "use_when": "you are about to act on a counterparty you know only from a document, email or website: approve a supplier, pay an invoice, sign an order, onboard a customer, and you need the official register facts and a record you can attach to your approval; in particular before a person pays an advance or signs with a Dutch construction firm, where it adds contractor_report"
            }
          },
          "digest": "sha256:87bd60f7acd964a40a7ec624e7200e6ed57f68a98845c95d43f7beb02907dd03"
        },
        {
          "name": "astranl_material_price_nl",
          "title": "Building material price and stock in Dutch stores (bouwmaterialen prijs)",
          "description": "Current price and stock of one building material in Dutch stores (bouwmaterialen prijs, prijs gipsplaat, building material price Netherlands). Call it when someone needs the price or availability of a specific product, given as a GTIN or EAN barcode, a store product link, or plain words to get candidates first. Returns each offer of the same trade item with the price in EUR including VAT, stock and read time per store, the identical item at other stores, the cheapest available offer and the status of each source; a Dutch postcode adds delivery cost in EUR and dates. Seller prices at read time, not a quote; it never orders, reserves or pays. Same input and answer as check_material. Read-only, free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": "short",
                "description": "short (default): at most three offers to show the person; full: every offer, delivery rule and source.",
                "enum": ["short", "full"],
                "type": "string"
              },
              "need_date": {
                "description": "ISO planning date (YYYY-MM-DD), passed as the order date for delivery quotes; defaults to today in Europe/Amsterdam.",
                "format": "date",
                "type": "string"
              },
              "postcode": {
                "description": "Dutch delivery postcode: 1234AB, 1234 AB or 1234. Adds per-offer delivery quotes.",
                "pattern": "^[1-9][0-9]{3}(?: ?[A-Za-z]{2})?$",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "Number of store units as sold, from 1 to 10000. Packs are not converted.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "ref": {
                "description": "a GTIN or EAN with valid check digit (e.g. 8710839100056), a Bouwmaat, Hubo or Houtdirect product link with ?variant=, a partner shop product link, store:variant (e.g. hubo:48564194312444), or plain words for candidates",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Building material price and stock in Dutch stores (bouwmaterialen prijs)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "alias_of": "check_material",
              "auth_requirement": "none",
              "cost_or_fee_if_any": "free",
              "do_not_use_when": "you need a binding quote, a reservation or an order; or the part is a machine or robot component with a manufacturer part number (use ground_component)",
              "example_intent": "Is Alabastine Muurvuller 8710839100056 cheaper elsewhere right now?",
              "next_possible_action": "estimate_case_create to price a whole job; check_estimate_materials to watch its materials",
              "profile_core": "https://astranl.com/mcp/streamable?profile=core",
              "required_inputs": ["ref"],
              "search_phrases": ["bouwmaterialen prijs", "prijs gipsplaat", "waar te koop bouwmateriaal", "building material price Netherlands"],
              "side_effect_class": "read_only",
              "use_when": "you need the current price and stock of a specific building material, or want to know whether the identical trade item is cheaper at another Dutch store, with proof of where and when it was read"
            }
          },
          "digest": "sha256:c577fd52b7d009da1c0c480cd11bcac338ed6156ccadd8de08d1ba476b6c33cf"
        },
        {
          "name": "astranl_permit_rules_nl",
          "title": "Building permit fee and skip rule of a Dutch municipality (bouwleges)",
          "description": "Permit fee and skip rule of a Dutch municipality for a renovation or building job (bouwleges, leges omgevingsvergunning, container op straat vergunning, building permit cost Netherlands). Call it when someone plans building work in a Dutch municipality and asks what the omgevingsvergunning costs, or whether a skip or container on the street needs a permit. Input: the municipality name or CBS code (for example Zaanstad or GM0479) and the planned construction cost in EUR excluding VAT as bouwkosten_eur (default 50000). Returns the 2026 leges fee in EUR for the technical building activity, whether a street container needs a permit, a notification or nothing with its fee and precario in EUR where confirmed, and for each the regulation, article, source URL and read date. The municipality decides; spatial permit parts are not included. Same input and answer as nl_municipal_build_rules. Read-only, free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bouwkosten_eur": {
                "description": "planned construction cost excluding VAT in euro; default 50000",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "municipality": {
                "description": "Dutch municipality name or CBS code, e.g. Zaanstad or GM0479",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["municipality"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Building permit fee and skip rule of a Dutch municipality (bouwleges)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "alias_of": "nl_municipal_build_rules",
              "auth_requirement": "none",
              "cost_or_fee_if_any": "free",
              "do_not_use_when": "the job is outside the Netherlands, or the user needs a binding decision of the municipality",
              "example_intent": "What is the building permit fee in Haarlem for a 60000 euro renovation, and may I put a skip on the street?",
              "next_possible_action": "coordination_open_case or the human door https://astranl.com/en/do/ to find an executor for the job",
              "profile_core": "https://astranl.com/mcp/streamable?profile=core",
              "proof_level": "municipal regulation text on overheid.nl at the read date, checked by number match; not a municipal decision",
              "required_inputs": ["municipality"],
              "returns": "leges status and fee with regulation, article, source URL, read date and verification; container rule class, fee and precario with legal basis and source; links to the public pages",
              "search_phrases": ["bouwleges", "leges omgevingsvergunning", "vergunning verbouwing kosten", "container op straat vergunning", "building permit cost Netherlands"],
              "side_effect_class": "read_only",
              "use_when": "a user plans a renovation, extension or building job in the Netherlands and needs the permit fee or the skip-on-the-street rule of a municipality, with a source"
            }
          },
          "digest": "sha256:c0e5b7ee76129bbdc8f13e53c912e85d43afc7f73aa42b71c4f5f11e287be62e"
        },
        {
          "name": "astranl_renovation_estimate_nl",
          "title": "Renovation cost estimate, Netherlands (verbouwing kosten)",
          "description": "Rough cost of a renovation or home repair job in the Netherlands (verbouwing kosten, renovatie kosten, schilderen kosten per m2, renovation cost Netherlands). Call it when someone asks what a job such as painting, roofing, flooring, plumbing, insulation or a general renovation will roughly cost in a Dutch city, before quotes are requested. Input: one job category, the area in m2 and the city. Returns a planning figure in EUR: labour hours (h) times an hourly rate (EUR per hour, excluding VAT) plus the listed material lines in EUR, a low, typical and high range in EUR, the VAT basis of every amount, the source and date of every figure, as_of, the answer schema version and a signed receipt that can be checked offline against the published AstraNL log key. A planning figure for one job category, not a quote and not the full scope of a job. Same input and answer as estimate_cost. Read-only, free, no account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area_m2": {
                "description": "Surface area or working volume in square meters. Optional but improves accuracy. For non-area tasks pass 0 for a labour-only planning figure. Omitting area_m2 assumes 20 m2. Send a JSON number such as 40, not the text \"40\".",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "category": {
                "description": "The closest trade word, for example renovation, painting, plumbing, roofing, flooring. Same enum as create_task.",
                "enum": ["painting", "cleaning", "plumbing", "roofing", "renovation", "electrical", "garden", "repair", "moving", "construction", "delivery", "logistics", "energy", "solar", "hvac", "automotive", "welding", "manufacturing", "installation", "maintenance", "inspection", "carpentry", "flooring", "demolition", "insulation", "glazing"],
                "type": "string"
              },
              "location": {
                "description": "City in the Netherlands. Optional; defaults to Netherlands. No regional price adjustment is applied (location_mult = 1.0).",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Renovation cost estimate, Netherlands (verbouwing kosten)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "alias_of": "estimate_cost",
              "profile_core": "https://astranl.com/mcp/streamable?profile=core",
              "search_phrases": ["verbouwing kosten", "renovatie kosten", "wat kost een verbouwing", "schilderen kosten per m2", "dak vervangen kosten", "vloer leggen kosten", "renovation cost Netherlands", "home repair cost estimate"]
            }
          },
          "digest": "sha256:c27c0034ca5043f98b265e360a5989f33155ca48d4c22c7f9996e05cc0ee4c80"
        },
        {
          "name": "astranl_verify_receipt",
          "title": "Verify an AstraNL receipt or reference",
          "description": "Check whether an AstraNL reference or receipt is genuine (verify receipt, controleer bewijs). Call it when you hold an AstraNL id such as alk_..., ASTRA-A-..., ASTRA-C-..., att_... or RCPT-n, for example receipt.reference of an astranl_renovation_estimate_nl answer, and need to know whether it is real and what it confirms. Returns the integrity checks (hashes, Ed25519 signature, Merkle inclusion), the attested claim with issuer, time, validity and status, and when to check again. An estimate receipt can also be checked offline with the published key, without this call. Same input and answer as verify_astranl. Read-only, free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer_sha256": {
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "ref": {
                "description": "Any AstraNL reference: action receipt ASTRA-A-..., policy receipt ASTRA-R-..., consumption or agreement certificate ASTRA-C-..., log event alk_..., attestation att_/atr_..., ingress receipt RCPT-n",
                "maxLength": 64,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify an AstraNL receipt or reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "alias_of": "verify_astranl",
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you have no reference id; AstraNL cannot verify free-text claims",
              "example_intent": "A supplier sent me ASTRA-R-38887071074F as proof; is it real and what does it actually confirm?",
              "next_possible_action": "consume a VALID receipt for your own next action, or refuse to act on anything not VALID",
              "profile_core": "https://astranl.com/mcp/streamable?profile=core",
              "proof_level": "cryptographic integrity plus attested claim scope; apply your own acceptance rules",
              "required_inputs": ["ref"],
              "returns": "integrity layer (hash, signature, Merkle, recomputed live) and claim layer (attested, issuer, source, method, observed_at, validity window, status VALID/EXPIRED/REVOKED/UNKNOWN, limits), reverify rule, next actions",
              "search_phrases": ["verify receipt", "controleer bewijs", "is this AstraNL reference genuine"],
              "side_effect_class": "read_only",
              "use_when": "someone handed you an AstraNL reference (ASTRA-A, ASTRA-R, ASTRA-C, alk_, att_, RCPT-n) and you must know whether it is genuine, current and what exactly it does and does not confirm"
            }
          },
          "digest": "sha256:59e1418d156b0e60951bb064df6b5de419d9dade483eb89bd165ef7edf4de028"
        }
      ],
      "digest": "sha256:c18dcea6b738ee183d42278a94dc1497e2bbb4b20eb840a6eb4aeba30e55433a"
    }
  }
}
