      "serverInfo": {
        "name": "foliofact",
        "title": "FolioFact — value-investing fund research",
        "version": "1.1.0",
        "websiteUrl": "https://foliofact.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FolioFact is a value-investing research database: quarterly filings from curated\nvalue investors, the stocks they hold, insider (Form 4/5) activity, and fund\nconviction signals.\n\nMost tools need no credentials at all. Five tools — stock_financials,\nstock_insiders, stock_earnings, stock_options, compare_stocks — and deep insider_feed pages\nrequire FolioFact Pro.\n\nThere are two ways to sign in, and you should prefer the first:\n\n1. Browser sign-in (OAuth 2.1). Calling a Pro tool without credentials returns\n   HTTP 401 with a WWW-Authenticate header pointing at\n   /.well-known/oauth-protected-resource/mcp. Follow that to sign the user in\n   through their browser. Do not ask the user to paste a key when this is\n   available — it is fewer steps and no secret is ever handled.\n2. API key. The user creates one at https://foliofact.com/settings#api_keys_card\n   and it is sent as \"Authorization: Bearer ff_...\" or \"X-Api-Key: ff_...\".\n\nA Pro entitlement is detected automatically from whichever credential is used.\nA signed-in caller WITHOUT Pro gets an isError result pointing at\nhttps://foliofact.com/pricing — that is a\nsubscription prompt, not an authentication failure, so signing in again will\nnot change it.\n",
