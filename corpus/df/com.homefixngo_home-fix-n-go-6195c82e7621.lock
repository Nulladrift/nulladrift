        {
          "name": "request_quote",
          "title": "Send a quote request to Home Fix N Go",
          "description": "Sends the customer's job straight to the Home Fix N Go team as a free quote request, with the customer's own name and phone, only with their permission, and with their photos if they have any (photo for one attached file, photos for up to 8 links or base64 images). The team is notified at once and replies with a free fixed price, usually the same day: the customer does not need to visit the website. Nothing is booked or charged. Returns a reference to give the customer, how many photos arrived, and an optional WhatsApp link for adding more photos or a video. Do not send photos of documents, payment cards or ID. Use dry_run to check everything, photos included, without sending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai_assessment": {
                "description": "What you can see in the customer's photos, in plain words (for example: black mould along the bath sealant, the grout is cracked)",
                "maxLength": 1500,
                "type": "string"
              },
              "assistant": {
                "description": "Your name, e.g. ChatGPT, Claude, Gemini",
                "maxLength": 80,
                "type": "string"
              },
              "customer_name": {
                "maxLength": 120,
                "type": "string"
              },
              "customer_type": {
                "enum": ["homeowner", "landlord", "holiday-let", "hotel-or-guest-house", "business"],
                "type": "string"
              },
              "dry_run": {
                "description": "Validate and preview without sending anything",
                "type": "boolean"
              },
              "email": {
                "maxLength": 120,
                "type": "string"
              },
              "job_description": {
                "description": "What needs doing, room by room if more than one thing",
                "maxLength": 3000,
                "type": "string"
              },
              "materials": {
                "description": "Whether they want the team to supply materials or already have them",
                "maxLength": 200,
                "type": "string"
              },
              "notes": {
                "maxLength": 1500,
                "type": "string"
              },
              "photo": {
                "additionalProperties": false,
                "description": "One photo the customer attached (a file the customer shared in the chat)",
                "properties": {
                  "data": {
                    "description": "The image as base64 (no data: prefix needed), at most 15 MB",
                    "type": "string"
                  },
                  "download_url": {
                    "description": "A temporary download link to a file the customer attached",
                    "maxLength": 4000,
                    "type": "string"
                  },
                  "file_id": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "file_name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "media_type": {
                    "description": "e.g. image/jpeg",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "url": {
                    "description": "A public https link to the image",
                    "maxLength": 2000,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "photos": {
                "description": "Up to 8 photos of the job: a wide shot and close-ups help most",
                "items": {
                  "additionalProperties": false,
                  "description": "One photo: a link we can download (url or download_url) or the image itself as base64 (data).",
                  "properties": {
                    "data": {
                      "description": "The image as base64 (no data: prefix needed), at most 15 MB",
                      "type": "string"
                    },
                    "download_url": {
                      "description": "A temporary download link to a file the customer attached",
                      "maxLength": 4000,
                      "type": "string"
                    },
                    "file_id": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "file_name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "media_type": {
                      "description": "e.g. image/jpeg",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "url": {
                      "description": "A public https link to the image",
                      "maxLength": 2000,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "property": {
                "description": "e.g. second-floor flat, terraced house, 8-room guest house",
                "maxLength": 120,
                "type": "string"
              },
              "service": {
                "enum": ["painting-decorating", "bathrooms-plumbing", "flooring", "handyman-maintenance", "interior-finishing", "refurbishments"],
                "type": "string"
              },
              "timing": {
                "description": "When they would like it done",
                "maxLength": 200,
                "type": "string"
              },
              "town_or_postcode": {
                "description": "Where the job is",
                "maxLength": 120,
                "type": "string"
              },
              "whatsapp_or_phone": {
                "description": "UK mobile or phone number",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["customer_name", "job_description", "town_or_postcode", "whatsapp_or_phone"],
            "type": "object"
          },
