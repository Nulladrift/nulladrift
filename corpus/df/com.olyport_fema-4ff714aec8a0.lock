        {
          "name": "get_disaster_declarations",
          "description": "Get FEMA disaster declarations filtered by state, year, or type.\n\n    Returns federal disaster declarations including major disasters,\n    emergencies, and fire management assistance. Each record includes\n    the disaster number, title, declaration date, and affected area.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX', 'FL').\n        year: Filter by fiscal year of the declaration (e.g. 2023).\n        disaster_type: Declaration type code: 'DR' (major disaster),\n            'EM' (emergency), or 'FM' (fire management assistance).\n        limit: Maximum number of records to return (default 25, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "disaster_type": {
                "default": null,
                "title": "Disaster Type",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_disaster_declarationsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_disaster_declarationsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38a62c3bee8e70cd0ca67757ab8f0a95d0afb78f756aed5de744e9b7230a2a3e"
        },
        {
          "name": "get_disaster_detail",
          "description": "Get detailed information about a specific FEMA disaster declaration.\n\n    Returns comprehensive data for a single disaster including all declared\n    programs, incident dates, and affected areas. Use disaster numbers\n    from get_disaster_declarations results.\n\n    Args:\n        disaster_number: The FEMA disaster number (e.g. 4737, 3604).\n    ",
          "inputSchema": {
            "properties": {
              "disaster_number": {
                "title": "Disaster Number",
                "type": "integer"
              }
            },
