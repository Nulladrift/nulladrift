{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiactradar/ai-act-radar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.aiactradar.com/mcp/v1"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "ai-act-radar",
        "version": "0.2.2"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_obligation_for_role",
          "description": "Look up the AI Act obligations for a specific role and AI-system risk category. Returns the relevant articles, deadlines, official sources and the most recent events for the primary article. This is informational, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "risk_category": {
                "description": "The AI Act risk classification of the system you offer or use.",
                "enum": ["prohibited", "high-risk", "limited-risk", "minimal-risk", "gpai", "gpai-systemic-risk"],
                "type": "string"
              },
              "role": {
                "description": "The AI Act role you operate as.",
                "enum": ["provider", "deployer", "distributor", "importer", "gpai-provider"],
                "type": "string"
              }
            },
            "required": ["risk_category", "role"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Obligations for a role and risk class"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad9a34e8924140fc3f5a61a9e98e7ae83e4b3fb6b440e16660159a8d6c44bd02"
        },
        {
          "name": "lookup_article",
          "description": "Look up a reference to Regulation (EU) 2024/1689 (e.g. \"Art. 53(1)(d)\", \"Annex III\", \"Recital 60\") and return related events plus the EUR-Lex URL. Matches whole references: \"Art. 5\" finds Art. 5 and Art. 5(1)(b), never Art. 50. References the Regulation does not have (Art. 1 to 113, Annex I to XIII, Recital 1 to 180) return known: false and no EUR-Lex link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "article": {
                "description": "Article identifier, e.g. \"Art. 53\", \"Art. 53(1)(d)\", \"Annex III\", \"Recital 60\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["article"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up an AI Act article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c5f5c551cca1e682adde16dde679cf92b17a86f51e44e4eb58320910b35485a"
        },
        {
          "name": "query_ai_act_updates",
          "description": "Query EU AI Act regulatory updates from primary sources, newest first. Filters (date range, source, topics, severity) apply to the whole register before limit. Every event has the same shape in all tools: id, source_id, event_type, severity, topics, title_en, title_de, summary_en, summary_de, url_official, url_kind (\"official\", or \"secondary\" where no official publication was found), ai_act_articles (array), version, published_at (ISO 8601).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "description": "Without a key at most 10.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "severity_min": {
                "description": "Minimum severity. Optional.",
                "enum": ["info", "low", "medium", "high", "critical"],
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 date or timestamp, e.g. \"2026-11-01\" or \"2026-11-01T00:00:00Z\". Only events published at or after this. Optional.",
                "format": "date-time",
                "type": "string"
              },
              "source_id": {
                "description": "Source id. 22 active sources: aiboard, aioffice, bfdi, bnetza, bsi, cen, cnil, codeofpractice, curia, cz-ctu, digitalstrategy, dsk, ec-spoc, edpb, etsi, eurlex, fra, lv-ptac, nl-algoritmeregister, nl-ap, servicedesk, sk-mirri. Paused (no events): haveyoursay, oecd-ai. Historical (no longer fetched, past events stay queryable): consilium, edps, ep, iso, national-be, national-dk, national-es, national-fr, national-ie, national-it, national-pl, rtr. Optional.",
                "enum": ["aiboard", "aioffice", "bfdi", "bnetza", "bsi", "cen", "cnil", "codeofpractice", "curia", "cz-ctu", "digitalstrategy", "dsk", "ec-spoc", "edpb", "etsi", "eurlex", "fra", "lv-ptac", "nl-algoritmeregister", "nl-ap", "servicedesk", "sk-mirri", "haveyoursay", "oecd-ai", "consilium", "edps", "ep", "iso", "national-be", "national-dk", "national-es", "national-fr", "national-ie", "national-it", "national-pl", "rtr"],
                "type": "string"
              },
              "topics": {
                "description": "Events with at least one of these topics. Fixed taxonomy, see https://docs.aiactradar.com/concepts/topics/. Optional.",
                "items": {
                  "enum": ["gpai", "high-risk", "prohibited", "transparency", "data-governance", "human-oversight", "robustness", "cybersecurity", "fundamental-rights", "standards", "enforcement", "sandbox", "national-de", "national-fr", "national-nl", "national-other", "meta"],
                  "type": "string"
                },
                "type": "array"
              },
              "until": {
                "description": "ISO 8601 date or timestamp, e.g. \"2026-11-01\" or \"2026-11-01T00:00:00Z\". Only events published at or before this. Optional.",
                "format": "date-time",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query AI Act updates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d8abe75e13b4ed1ec6ffc1382294c4639a39b7dcdf598b46572007d052c6468"
        },
        {
          "name": "summarize_changes_since",
          "description": "Generate a structured digest of AI Act regulatory changes since a given date, grouped by severity, in English or German. Useful for weekly compliance reviews or audit prep. Returns Markdown plus event_count (events in the digest) and total_matching. Without a key the digest holds the 10 most severe events.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "enum": ["en", "de"],
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 date or timestamp, e.g. \"2026-11-01\" or \"2026-11-01T00:00:00Z\". The digest covers everything from this date forward. Required.",
                "format": "date-time",
                "type": "string"
              },
              "topics": {
                "description": "Restrict digest to these topics. Optional.",
                "items": {
                  "enum": ["gpai", "high-risk", "prohibited", "transparency", "data-governance", "human-oversight", "robustness", "cybersecurity", "fundamental-rights", "standards", "enforcement", "sandbox", "national-de", "national-fr", "national-nl", "national-other", "meta"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Summarize changes since a date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d19ca8d387c190aa6ba0292eb9b269c6e8635b92999ced0c26c98558792daced"
        }
      ],
      "digest": "sha256:8effa9e0b0a2729c62ec5d72312b4b152b46474da14f7077378afd89c9bae2d7"
    }
  }
}
