{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiactradar/ai-act-radar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.aiactradar.com/mcp/v1"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "ai-act-radar",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_obligation_for_role",
          "description": "Look up the AI Act obligations for a specific role and AI-system risk category. Returns the relevant articles, recent guidance updates, and applicable templates. This is informational, not legal advice.",
          "inputSchema": {
            "properties": {
              "risk_category": {
                "description": "The AI Act risk classification of the system you offer or use.",
                "enum": ["prohibited", "high-risk", "limited-risk", "minimal-risk", "gpai", "gpai-systemic-risk"],
                "type": "string"
              },
              "role": {
                "description": "The AI Act role you operate as.",
                "enum": ["provider", "deployer", "distributor", "importer", "gpai-provider"],
                "type": "string"
              }
            },
            "required": ["risk_category", "role"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:528a7c9d6f6a67a8a95e28639e93bbf39c994451c7900bc93700dc65a7327fea"
        },
        {
          "name": "lookup_article",
          "description": "Look up a specific AI Act article (e.g. \"Art. 53(1)(d)\" or \"Annex III\") and return all related events from our pipeline plus the official EUR-Lex URL.",
          "inputSchema": {
            "properties": {
              "article": {
                "description": "Article identifier — e.g. \"Art. 53\", \"Art. 53(1)(d)\", \"Annex III\", \"Recital 60\".",
                "type": "string"
              }
            },
            "required": ["article"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87bf832362e62ede8c8c7b1166cc8d4c3b240e886af2db8a4b6e95c88694d9c0"
        },
        {
          "name": "query_ai_act_updates",
          "description": "Query EU AI Act regulatory updates from primary sources. Returns structured events with titles, summaries, severity, topics and source URLs. Optionally filter by date range, source, topics, or severity. Use this when you need recent or historical regulatory changes affecting AI builders, GPAI providers, or deployers.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "severity_min": {
                "description": "Minimum severity. Optional.",
                "enum": ["info", "low", "medium", "high", "critical"],
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 timestamp; only events published after this. Optional.",
                "type": "string"
              },
              "source_id": {
                "description": "One of: eurlex, aioffice, aiboard, codeofpractice, haveyoursay, cen, bnetza, bfdi, bsi, cnil, nl-algoritmeregister, oecdai. Optional.",
                "type": "string"
              },
              "topics": {
                "description": "Topic taxonomy. e.g. [\"gpai\",\"transparency\",\"high-risk\"]. Optional.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "until": {
                "description": "ISO 8601 timestamp; only events published before this. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:934348b3cff1ad202746f94b1d390a9517ca94ddbc58481a2ff8a28a0ffa4559"
        },
        {
          "name": "summarize_changes_since",
          "description": "Generate a structured digest of all AI Act regulatory changes since a given date, grouped by topic and severity. Useful for weekly compliance reviews or audit prep. Returns Markdown.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "en",
                "enum": ["en", "de"],
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 date; the digest covers everything from this date forward.",
                "type": "string"
              },
              "topics": {
                "description": "Restrict digest to these topics. Optional.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:59389d8977d76531c0b1010f2484189e939d6cf8bf6412127b08013799512753"
        }
      ],
      "digest": "sha256:e1dd7fb9bf122642d8f303a10c72dae543dde0b86c365b7cba7be45f138c7c31"
    }
  }
}
