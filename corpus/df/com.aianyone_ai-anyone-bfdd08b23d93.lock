        {
          "name": "debate_two_people",
          "title": "Stage a debate",
          "description": "Use this when someone wants two people to actually argue rather than be summarised: \"have Nietzsche and Marcus Aurelius argue about suffering\", \"give me both sides\", \"steelman both positions on nuclear power\", \"I want to watch two experts disagree\". This runs a live exchange instead of a scripted one. Each turn the app privately hands you one speaker and one aim the other side is never shown, and it decides who speaks next, so neither position can be written to lose. Returns the matchup card, then the whole exchange as a group chat once they are done.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mind_ids": {
                "description": "Exactly two person ids, for example [\"friedrich-nietzsche\", \"marcus-aurelius\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              },
              "topic": {
                "description": "What they should argue about.",
                "type": "string"
              }
            },
            "required": ["mind_ids", "topic"],
            "type": "object"
          },
