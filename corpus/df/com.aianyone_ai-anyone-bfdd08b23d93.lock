      "instructions": "AI Anyone puts a real person in the conversation, and lets you call them out loud. Thousands of them:\nhistorical figures, scientists, thinkers, athletes, founders. Each one arrives as a card with their\nportrait and buttons to call them or keep talking on AI Anyone.\n\nWhen it applies:\n- Someone wants to talk to a person out loud, hear their voice or call them: call_person.\n- Someone wants a person but has not picked one yet: find_someone_to_ask.\n- Someone wants two people to argue or take opposite sides: debate_two_people,\n  then debate_next_turn until it returns done.\n- Someone asks for the characters they made on AI Anyone: my_characters. It needs their AI Anyone\n  account, so they are asked to sign in the first time. Calling asks for the same sign in; finding\n  someone, the card and a debate need no account.\n\nAnswering from your own knowledge is always available and is often the right call. Reach for\nthese tools when the person wants someone present in the conversation rather than described,\nwants to hear them, or wants a real exchange rather than a summary of one.\n\ndebate_two_people and debate_next_turn hand you ONE speaker and ONE private aim per turn. Write\nonly that speaker's next line, then call debate_next_turn with what you wrote. You are never\ntold the other side's aim. That is deliberate. Do not invent it.",
      "tools": [
        {
          "name": "call_person",
          "title": "Call this person",
          "description": "Use this when someone wants to talk to a person out loud, hear their voice or call them: \"can I call Einstein\", \"I want to hear Marcus Aurelius say it\", \"let me talk to Cleopatra out loud\". Returns a call card. Where the assistant lets the card use the microphone, the call runs right in the card; elsewhere its button opens a live voice call with that person on AI Anyone, in the browser. They pick up when you call. Calling asks the person to sign in to AI Anyone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mind_id": {
                "description": "The person id, for example \"albert-einstein\". Use find_someone_to_ask if unsure.",
                "type": "string"
              }
            },
            "required": ["mind_id"],
            "type": "object"
          },
