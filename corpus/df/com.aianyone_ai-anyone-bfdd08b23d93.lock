        {
          "name": "find_someone_to_ask",
          "title": "Find someone to ask",
          "description": "Use this when someone wants a person to learn from or talk to but has not named one yet: \"who should I learn negotiation from\", \"find me a stoic to talk to\", \"which historical figures are worth asking about leadership\". Returns a grid of real people rendered in the conversation, each with a portrait and a role. The person picks one to call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter. It must be one of the stored values listed here, for example \"history-politics\" or \"science-tech\". Leave it out and ask in words (\"historical figures\") if unsure.",
                "enum": ["history-politics", "science-tech", "arts-culture", "philosophy-ideas", "business-finance", "literature", "anime-manga", "movies-tv", "gaming", "music", "sports", "mythology-fantasy", "other"],
                "type": "string"
              },
              "limit": {
                "description": "How many to return, 1 to 24. Defaults to 12.",
                "type": "number"
              },
              "query": {
                "description": "Name or topic, for example \"stoicism\" or \"Nietzsche\".",
                "type": "string"
              }
            },
            "type": "object"
          },
