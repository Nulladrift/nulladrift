                          "enum": ["joker", "banner", "mystic_summit", "greedy_joker", "jolly_joker", "devious_joker", "the_duo", "fibonacci", "smiley_face", "photograph", "baron", "shoot_the_moon", "raised_fist", "four_fingers", "shortcut", "smeared_joker", "pareidolia", "hack", "sock_and_buskin", "half_joker"],
