      "instructions": "Exact action values are conditional on the supported game model. Read get_solver_capabilities. No sampled full-deck or shop advice.",
      "tools": [
        {
          "name": "compare_actions",
          "description": "Compare all immediate plays or exact small-deck play/discard values, with the same contract and validation as HTTP. Exact mode limits: 12 draw cards, two hands, two discards. Select explain_actions for particular branches.",
          "inputSchema": {
            "additionalProperties": false,
            "else": {
              "properties": {
                "state": {
                  "properties": {
                    "deck": {
                      "maxItems": 12
                    },
                    "discards_left": {
                      "maximum": 2
                    },
                    "hands_left": {
                      "maximum": 2
                    }
                  }
                }
              }
            },
            "if": {
              "properties": {
                "analysis_mode": {
                  "const": "immediate_score"
                }
              },
              "required": ["analysis_mode"]
            },
            "properties": {
              "analysis_mode": {
                "default": "exact_blind_survival",
                "enum": ["exact_blind_survival", "immediate_score"],
                "type": "string"
              },
              "budget_score_calls": {
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "contract_version": {
                "const": "balatro-web-v1",
                "type": "string"
              },
              "explain_actions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cards": {
                      "items": {
                        "pattern": "^[23456789TJQKA][SHCD](:[bmwgsxofhpR]+)?$",
                        "type": "string"
                      },
                      "maxItems": 5,
                      "minItems": 1,
                      "type": "array"
                    },
                    "kind": {
                      "enum": ["play", "discard"],
                      "type": "string"
                    }
                  },
                  "required": ["cards", "kind"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "request_id": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "additionalProperties": false,
                "properties": {
                  "chips_needed": {
                    "exclusiveMinimum": 0,
