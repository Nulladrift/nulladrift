                  "levels": {
                    "additionalProperties": {
                      "maximum": 255,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "propertyNames": {
                      "enum": ["high_card", "pair", "two_pair", "three_of_a_kind", "straight", "flush", "full_house", "four_of_a_kind", "straight_flush", "five_of_a_kind", "flush_house", "flush_five"]
