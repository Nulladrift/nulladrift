                    "type": "number"
                  },
                  "deck": {
                    "items": {
                      "pattern": "^[23456789TJQKA][SHCD](:[bmwgsxofhpR]+)?$",
                      "type": "string"
                    },
                    "maxItems": 52,
                    "minItems": 0,
                    "type": "array"
