      },
      "tools": [
        {
          "name": "contract_expiry",
          "description": "Published FC last-trading/first-notice dates for a product and optional YYYYMM delivery month (default next published month). Never runs an expiry engine; unpublished months are unknown with a product-page link. Official exchange notices take precedence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "month": {
                "description": "Delivery month as six digits YYYYMM with month 01-12, e.g. 202612; omitted = earliest published month at or after the current exchange-local month, falling back to the current month if none is published (unpublished dates remain unknown).",
                "examples": ["202612"],
                "pattern": "^\\d{4}(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "product": {
                "description": "FC product slug with two alphanumeric segments separated by one hyphen, at most 40 characters, e.g. shfe-cu or nymex-cl; case-insensitive and normalized to lowercase, with no default when required.",
                "examples": ["shfe-cu", "nymex-cl"],
                "maxLength": 40,
                "pattern": "^[a-zA-Z0-9]+-[a-zA-Z0-9]+$",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:04b9fb38cd0fdbe9a11a93483575e167622083fd1a573dc815607b86495e04b2"
        },
        {
          "name": "next_closure",
          "description": "Next published exchange holiday or half-day from the fixed MO static calendar list; weekends alone are not holiday events. No extrapolation beyond coverage. Official exchange notices take precedence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "exchange": {
                "description": "Exchange code: SHFE, INE, DCE, CZCE, GFEX, CFFEX, SGE, SSE, SZSE, BSE, HKEX, NB, SB, TWSE, KRX, JPX, SGX, BMD, LME, ICE, COMEX, CBOT, CME, NYSE, NYMEX, EUREX or OSE; case-insensitive (shfe becomes SHFE), or an FC product slug such as shfe-cu (lowercased), at most 40 characters; required unless marked optional, with results limited to published coverage. This tool matches MO holiday market IDs directly; a product slug does not resolve to its exchange.",
                "examples": ["SHFE", "shfe", "shfe-cu"],
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["exchange"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:97ce75255106cb2bb58132f36a72fe14d2663ae6260a3be83057a28ac4d99553"
        },
        {
          "name": "recent_notices",
          "description": "CEC published notice records in Chinese or available English summaries; at most 30 days. Falls back to Chinese when English is unavailable, without translation. Published records are not verified current rules. Official Chinese exchange notices take precedence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 7,
                "description": "Integer lookback of 1-30 calendar days, including today in Asia/Shanghai, e.g. 7; omitted = 7, with actual source coverage reported separately.",
                "examples": [7, 30],
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "exchange": {
                "description": "Exchange code: SHFE, INE, DCE, CZCE, GFEX, CFFEX, SGE, SSE, SZSE, BSE, HKEX, NB, SB, TWSE, KRX, JPX, SGX, BMD, LME, ICE, COMEX, CBOT, CME, NYSE, NYMEX, EUREX or OSE; case-insensitive (shfe becomes SHFE), or an FC product slug such as shfe-cu (lowercased), at most 40 characters; required unless marked optional, with results limited to published coverage. Omitted = all exchanges; CEC records are matched by exchange code, not product slug.",
                "examples": ["SHFE", "shfe", "shfe-cu"],
                "maxLength": 40,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Case-sensitive notice language: en for available English summaries or zh for Chinese originals, e.g. en; omitted = en, falling back to Chinese when an English summary is unavailable, without translation.",
                "enum": ["en", "zh"],
                "examples": ["en", "zh"],
                "type": "string"
              },
              "topic": {
                "description": "Case-sensitive CEC topic from the enum, e.g. margin or margin-price-limits; margin/price_limit match margin-price-limits, position_limit matches trading-limits, fees matches fees-order-size and listing matches contract-listing; omitted = no topic filter (recent_rule_changes still returns rule topics only).",
                "enum": ["margin", "price_limit", "position_limit", "fees", "delivery", "listing", "margin-price-limits", "trading-limits", "fees-order-size", "rules-amendments", "contract-listing", "hedging", "compliance", "consultations", "market-makers"],
                "examples": ["margin", "margin-price-limits"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c14b1b9389daf3e069c88c8e976fd9a7bde2b2a7a2ce33567c517792dca2db4b"
        },
        {
          "name": "recent_rule_changes",
          "description": "CEC published rule changes: margin, price limits, position/opening limits, fees, delivery and listing. Requested window at most 90 days; reports actual available window, never current parameter history. Official Chinese exchange notices take precedence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 7,
                "description": "Integer lookback of 1-90 calendar days, including today in Asia/Shanghai, e.g. 7; omitted = 7, with actual source coverage reported separately.",
                "examples": [7, 90],
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "exchange": {
                "description": "Exchange code: SHFE, INE, DCE, CZCE, GFEX, CFFEX, SGE, SSE, SZSE, BSE, HKEX, NB, SB, TWSE, KRX, JPX, SGX, BMD, LME, ICE, COMEX, CBOT, CME, NYSE, NYMEX, EUREX or OSE; case-insensitive (shfe becomes SHFE), or an FC product slug such as shfe-cu (lowercased), at most 40 characters; required unless marked optional, with results limited to published coverage. Omitted = all exchanges; CEC records are matched by exchange code, so use product for a product-slug filter.",
                "examples": ["SHFE", "shfe", "shfe-cu"],
                "maxLength": 40,
                "type": "string"
              },
              "product": {
                "description": "FC product slug with two alphanumeric segments separated by one hyphen, at most 40 characters, e.g. shfe-cu or nymex-cl; case-insensitive and normalized to lowercase, with no default when required. Omitted = all products; matches CEC product keys.",
                "examples": ["shfe-cu", "nymex-cl"],
                "maxLength": 40,
                "pattern": "^[a-zA-Z0-9]+-[a-zA-Z0-9]+$",
                "type": "string"
              },
              "topic": {
                "description": "Case-sensitive CEC topic from the enum, e.g. margin or margin-price-limits; margin/price_limit match margin-price-limits, position_limit matches trading-limits, fees matches fees-order-size and listing matches contract-listing; omitted = no topic filter (recent_rule_changes still returns rule topics only).",
                "enum": ["margin", "price_limit", "position_limit", "fees", "delivery", "listing", "margin-price-limits", "trading-limits", "fees-order-size", "rules-amendments", "contract-listing", "hedging", "compliance", "consultations", "market-makers"],
                "examples": ["margin", "margin-price-limits"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:96a1aa40b03f9e74e053c87b6096e28757596d17e9cb13de818c1db6fc56f3a3"
        },
        {
          "name": "trading_day",
          "description": "Exchange-local trading date and civil/incoming night attribution. Mainland China and the 24 MO scopes; SGX is equity/FX/rates, HKEX is cash equities. Outside published coverage is unknown. Official exchange notices take precedence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Valid calendar date in YYYY-MM-DD form, e.g. 2026-11-06, interpreted as the exchange-local trading date rather than UTC; omitted = today in the exchange/product time zone (UTC fallback if the zone is unavailable).",
                "examples": ["2026-11-06"],
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "exchange": {
                "description": "Exchange code: SHFE, INE, DCE, CZCE, GFEX, CFFEX, SGE, SSE, SZSE, BSE, HKEX, NB, SB, TWSE, KRX, JPX, SGX, BMD, LME, ICE, COMEX, CBOT, CME, NYSE, NYMEX, EUREX or OSE; case-insensitive (shfe becomes SHFE), or an FC product slug such as shfe-cu (lowercased), at most 40 characters; required unless marked optional, with results limited to published coverage.",
                "examples": ["SHFE", "shfe", "shfe-cu"],
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["exchange"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
