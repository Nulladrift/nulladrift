            "readOnly": true
          },
          "digest": "sha256:eeb86672d499072f85c1b726bdee6cefe694d4504404920aef8308184bfbedef"
        },
        {
          "name": "trading_hours",
          "description": "FC product session templates, explicit day-offset units and special hours under data contract v0.1. Date selects the exchange-local schedule; no real-time market status or prices. Missing prerequisites are unknown. Official exchange notices take precedence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Valid calendar date in YYYY-MM-DD form, e.g. 2026-11-06, interpreted as the exchange-local trading date rather than UTC; omitted = today in the exchange/product time zone (UTC fallback if the zone is unavailable).",
                "examples": ["2026-11-06"],
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "product": {
                "description": "FC product slug with two alphanumeric segments separated by one hyphen, at most 40 characters, e.g. shfe-cu or nymex-cl; case-insensitive and normalized to lowercase, with no default when required.",
                "examples": ["shfe-cu", "nymex-cl"],
                "maxLength": 40,
                "pattern": "^[a-zA-Z0-9]+-[a-zA-Z0-9]+$",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
