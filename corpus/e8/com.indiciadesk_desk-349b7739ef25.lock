      "instructions": "INDICIA DESK publishes descriptive crypto-options and on-chain market data and the verdicts of hypotheses tested on it. This is not investment advice: state the facts plainly and do not turn the numbers into buy/sell recommendations, price targets or forecasts. Mention the as_of time once; if stale is true, say the data is older than usual. Credit \"INDICIA DESK (indiciadesk.com)\" and share the returned link when the user wants more detail.",
