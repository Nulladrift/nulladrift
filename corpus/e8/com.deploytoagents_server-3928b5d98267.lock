{
  "lockfileVersion": 2,
  "subjects": {
    "com.deploytoagents/server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://deploytoagents.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "deploy-to-agents",
        "title": "Deploy to Agents",
        "version": "0.3.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this server to audit a public app's agent-facing surfaces, inspect the result, and create an evidence-based distribution plan. It does not yet publish customer artifacts or guarantee recommendation by any model.",
      "tools": [
        {
          "name": "audit_app",
          "title": "Audit an app for agent distribution",
          "description": "Queue a bounded audit of a public HTTP or HTTPS app and return an unlisted receipt URL. Reuse get_audit_result until processing completes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "Public website or application URL to audit",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audit_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "hostname": {
                "type": "string"
              },
              "privacy": {
                "const": "unlisted-noindex-unless-explicitly-published",
                "type": "string"
              },
              "receipt_url": {
                "format": "uri",
                "type": "string"
              },
              "status": {
                "const": "queued",
                "type": "string"
              }
            },
            "required": ["audit_id", "hostname", "privacy", "receipt_url", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fef39c03e50cdfa9bf1d8f6acb73168a993dc03ca2e1ecb3f754aeeb77b849a2"
        },
        {
          "name": "create_distribution_plan",
          "title": "Create an evidence-based distribution plan",
          "description": "Turn a completed technical audit into prioritized remediation plus official-registry, public-repository, customer-evidence, and independent-discovery actions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audit_id": {
                "description": "Completed audit UUID",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["audit_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audit_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "hostname": {
                "type": "string"
              },
              "limitation": {
                "type": "string"
              },
              "plan": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "type": "string"
                    },
                    "channel": {
                      "type": "string"
                    },
                    "priority": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["required", "recommended", "verified", "not-applicable"],
                      "type": "string"
                    }
                  },
                  "required": ["action", "channel", "priority", "reason", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "score": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["audit_id", "hostname", "limitation", "plan", "score"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:717341de78d2b9cbec83166d5cfe3667b63d3e3836d0503f0ae3c0367401186b"
        },
        {
          "name": "get_audit_result",
          "title": "Get an audit result",
          "description": "Retrieve the current status, score, findings, privacy state, and evidence URL for an audit UUID.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audit_id": {
                "description": "Audit UUID returned by audit_app",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["audit_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audit_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "completed_at": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "findings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "evidence": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "maxPoints": {
                      "type": "number"
                    },
                    "points": {
                      "type": "number"
                    },
                    "status": {
                      "enum": ["pass", "warn", "fail", "not-applicable"],
                      "type": "string"
                    },
                    "url": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["evidence", "id", "label", "maxPoints", "points", "status", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "hostname": {
                "type": "string"
              },
              "receipt_url": {
                "format": "uri",
                "type": "string"
              },
              "requested_at": {
                "type": "string"
              },
              "score": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "status": {
                "enum": ["queued", "running", "completed", "failed"],
                "type": "string"
              },
              "visibility": {
                "enum": ["public", "unlisted-noindex"],
                "type": "string"
              }
            },
            "required": ["audit_id", "completed_at", "findings", "hostname", "receipt_url", "requested_at", "score", "status", "visibility"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d525f0ecd5ce97169e2c38a5a4efba6c48f9428b568fd82648d579da941bb287"
        },
        {
          "name": "get_customer_zero_evidence",
          "title": "Get Deploy to Agents Customer Zero evidence",
          "description": "Return the public self-audit evidence and the explicit boundary between technical readiness and independent discovery.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claim": {
                "type": "string"
              },
              "customer_zero": {
                "const": true,
                "type": "boolean"
              },
              "externally_verified": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "identifier": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["identifier", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "independent_discovery_status": {
                "const": "not-yet-proven",
                "type": "string"
              },
              "next_proof": {
                "type": "string"
              },
              "receipt_url": {
                "format": "uri",
                "type": "string"
              },
              "technical_audit_score": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["claim", "customer_zero", "externally_verified", "independent_discovery_status", "next_proof", "receipt_url", "technical_audit_score"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bc5d34f722819be2d1f26d2a57156d73cf6899ed12867191c9f71bff922207e7"
        }
      ],
      "resources": [
        {
          "uri": "deploytoagents://customer-zero",
          "name": "customer-zero-evidence",
          "title": "Customer Zero evidence",
          "description": "Public technical evidence and its current limitations",
          "mimeType": "application/json",
          "digest": "sha256:c7061102fefb4188aeac0ed6f813d0d171d078f664a24365954f3a4201097553"
        }
      ],
      "digest": "sha256:d28466fc1eca9d48a2837ff34c1c88d60262fb16d799ea6f124fef35fd7ae7d2"
    }
  }
}
