        {
          "name": "compute_commission",
          "description": "Compute a sales-commission engagement under ASC 340-40 (incremental cost to obtain a contract). Give the commission amount, the benefit period it amortizes over, and how many months have elapsed; it classifies the cost, then capitalizes a recoverable commission and amortizes it straight-line — returning the capitalized asset, amortization to date, the period expense, and the net carrying amount. This is a capitalized asset and an amortization schedule, NOT revenue. It refuses (asks) if recoverability or the amount is unclear. The result is recorded on the engagement file; a principal signs before the workpapers are delivered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benefit_months": {
                "description": "The benefit period over which it amortizes, in months.",
                "type": "number"
              },
              "commission_usd": {
                "description": "The commission — the incremental cost to obtain the contract.",
                "type": "number"
              },
              "elect_practical_expedient": {
                "description": "Set true ONLY if the entity has ELECTED the ≤1-year practical expedient (340-40-25-4) to expense a commission that amortizes within a year. Omit/false → a ≤12-month commission CAPITALIZES (25-1); the expedient is a disclosed election, never auto-applied.",
                "type": "boolean"
              },
              "engagement_id": {
                "description": "The commission engagement (opened via open_engagement, classified as a commission).",
                "type": "string"
              },
              "expected_to_be_recovered": {
                "description": "Whether the cost is expected to be recovered (340-40-25-1). Omit if unknown and it will ask.",
                "type": "boolean"
              },
              "months_elapsed": {
                "description": "Months elapsed into the benefit period at this close.",
                "type": "number"
              }
            },
            "required": ["benefit_months", "commission_usd", "engagement_id", "months_elapsed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
