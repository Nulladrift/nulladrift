        {
          "name": "compute_lease",
          "description": "Measure a lease under ASC 842 (v1: the lessee side — real estate and equipment). Give the term, the CERTIFIED discount rate (the rate implicit in the lease, or the incremental borrowing rate — it will NOT assume one), and the payment schedule; it measures the lease liability (present value of the payments), the right-of-use asset (liability + initial direct costs − incentives), and the amortization schedule — a single straight-line lease cost for an operating lease (842-20-25-6) or amortization + interest for a finance lease (842-20-25-5). Usage-based variable payments are excluded from the liability (842-10-30-6). Whatever it can't ground — a missing rate, an undetermined classification — it logs as an OPEN ITEM rather than guessing; lessor accounting is deferred. The result is recorded on the engagement file; a principal signs before the workpapers are delivered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_discount_rate_pct": {
                "description": "The CERTIFIED annual discount rate (%). Omit and it will ask — it never assumes a rate.",
                "type": "number"
              },
              "classification": {
                "description": "The certified classification. Omit to default to operating (the v1 real-estate wedge).",
                "enum": ["operating", "finance"],
                "type": "string"
              },
              "engagement_id": {
                "description": "The lease engagement (opened via open_engagement, classified as a lease).",
                "type": "string"
              },
              "incentives_usd": {
                "description": "Lease incentives received (e.g. a tenant-improvement allowance) — reduces the ROU asset.",
                "type": "number"
              },
              "initial_direct_costs_usd": {
                "description": "Initial direct costs — added to the ROU asset.",
                "type": "number"
              },
              "party": {
                "description": "v1 is lessee-only; a lessor request is deferred to v2.",
                "enum": ["lessee", "lessor"],
                "type": "string"
              },
              "payment_timing": {
                "description": "Whether payments fall at period end (arrears, default) or start (advance).",
                "enum": ["arrears", "advance"],
                "type": "string"
              },
              "payments": {
                "description": "The lease payment schedule.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount_usd": {
                      "description": "The payment amount.",
                      "type": "number"
                    },
                    "kind": {
                      "description": "Payment type. usage-based is excluded from the liability (842-10-30-6).",
                      "enum": ["fixed", "in_substance_fixed", "index_based", "usage"],
