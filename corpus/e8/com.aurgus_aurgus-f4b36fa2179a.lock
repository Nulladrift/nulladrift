                "description": "Payments made at or before commencement — added to the ROU asset.",
                "type": "number"
              },
              "term_periods": {
                "description": "The lease term as a number of periods.",
                "type": "number"
              }
            },
            "required": ["annual_discount_rate_pct", "engagement_id", "payments", "term_periods"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Measure a lease (ASC 842)"
          },
