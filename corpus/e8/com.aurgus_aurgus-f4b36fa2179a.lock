        {
          "name": "close_agreement",
          "description": "Close an agreement for good — the terminal true-up at the END of its life (its term ended, or it's being wound down). Closing posts a final true-up Adjustment that matches the accrual to the settled amount (open → $0), THEN FREEZES the agreement: it moves to 'closed' and NO new transactions ever calculate against it again. This is NOT the periodic run (compute_close) or the periodic payout (settlement) — it ends the agreement. Because it MOVES MONEY (the true-up Adjustment), call WITHOUT confirm first to DRY-RUN — it reports the adjustment that would post and that the agreement will be frozen. Call again with confirm:true to post it and close. Terminal. Needs the agreement_id. Requires a connected Aurgus account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agreement_id": {
                "description": "The agreement to close (terminal).",
                "type": "string"
              },
              "confirm": {
                "description": "Omit/false to DRY-RUN (preview the terminal true-up + freeze); true to post the Adjustment and close.",
                "type": "boolean"
              },
              "force": {
                "description": "Administrative close flag, recorded on the audit trail (the true-up always resolves the open balance regardless).",
                "type": "boolean"
              },
              "reason": {
                "description": "Why it's being closed — recorded on the audit trail.",
                "type": "string"
              }
            },
            "required": ["agreement_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Close an agreement (terminal)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a4a0fe16e59e498c75cd104e23815ed29c1a1ad6f5ff646b8885e386f632327"
        },
        {
          "name": "compose_agreement",
          "description": "Build a rebate/incentive agreement by talking it through — no document needed. Describe the program in plain words and Aurgus DRAFTS the terms (who qualifies, how volume is measured and over what period, the threshold, the rate or per-unit reward, any cap, and approval routing) and asks the consultant-style questions a controller would ask before assuming. IMPORTANT: these terms are DRAFTED by the model from your words — they are PROPOSED, NOT PARSED, and nothing is created. When the terms are right, call again with finalize=true and the reviewed proposal, and Aurgus stages it for a person with approval authority to approve in the browser (you can NOT approve your own). This is how you establish an agreement (ASC 606 step 1) when you have no document — before any transaction data is asked for. When a document exists, prefer ingest_agreement (its deterministic parser touches the numbers with zero LLM).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clarifications": {
                "description": "Answers to the follow-up questions from a previous turn, so the draft refines. Each item pairs the question asked with the answer.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "description": {
                "description": "Plain-language description of the program — who it's for, how it's measured and over what period, the rate/threshold/cap, the dates. On the first turn, just describe it.",
                "type": "string"
              },
              "finalize": {
                "description": "Set true ONLY after the terms have been reviewed and the follow-ups resolved. Stages the proposal for human approval; omit/false to just draft and refine.",
                "type": "boolean"
              },
              "proposal": {
                "description": "Required when finalize=true: the EXACT drafted proposal returned by a prior (non-finalize) call, echoed back verbatim — so what is staged is exactly what was reviewed. Staging does NOT re-run the model.",
                "properties": {
                  "agreementName": {
                    "type": "string"
                  },
                  "customerName": {
                    "type": ["string", "null"]
                  },
                  "direction": {
                    "type": ["object", "null"]
                  },
                  "primitives": {
                    "type": "object"
                  },
                  "programType": {
                    "type": "string"
                  }
                },
                "required": ["agreementName", "primitives"],
                "type": "object"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Draft an agreement in conversation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6836692d833fdc65ab33dff70da81bf99d97149dfcde05b8bac6e224e8c794e5"
        },
