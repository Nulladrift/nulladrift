                "type": "string"
              },
              "period": {
                "description": "The close period, when named (e.g. 'Q3 2026').",
                "type": "string"
              },
              "program": {
                "description": "The program being closed, when named (e.g. 'tiered volume rebate').",
                "type": "string"
              },
              "who_certifies": {
                "description": "Who will certify the terms + mapping (name or email), when the user has named them — captured at open so the certifier is on the engagement from the start.",
                "type": "string"
              }
            },
