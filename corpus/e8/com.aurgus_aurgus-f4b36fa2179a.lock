        {
          "name": "explain",
          "description": "State the governed US-GAAP treatment FOR A PAYMENT TYPE — a rebate, incentive, chargeback, or trade-spend payment — under ASC 606 (customer rebate / consideration payable to a customer / variable consideration), ASC 705-20 (vendor rebate), or ASC 340-40 (sales commission). It CLASSIFIES the payment and returns the governed treatment, the exact ASC citation, and the rule applied — deterministic and grounded, it will not guess and asks which payment type applies when unclear. It is NOT a free-form accounting Q&A or advisory debate: it does not argue a position, weigh a contrary opinion, or answer open questions beyond the payment-type classification (the `scenario` text is context only). For anything past the treatment of a payment type, run the engagement (compose/ingest the agreement, then compute).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buys_distinct_good_or_service": {
                "description": "True if the payment is in exchange for a distinct good or service the counterparty actually transfers (e.g. advertising, data, slotting with proof-of-performance), as opposed to a plain price concession. This can reclassify the treatment (ASC 606-10-32-26 / 705-20-25-2).",
                "type": "boolean"
              },
              "fair_value_cap_usd": {
                "description": "Required only when buys_distinct_good_or_service is true: the fair value of that distinct good/service. The payment is a purchase only up to fair value; any excess reverts to the default treatment.",
                "type": "number"
              },
              "payment": {
                "description": "The nature of the payment. customer_rebate = you pay/credit your customer (sell side); spa_or_billback = a special pricing agreement / billback credit to the customer; chargeback = a channel chargeback / price protection; vendor_rebate = a vendor pays/credits you (buy side); internal_commission = you pay your own salesperson. Omit if unknown and the tool will return the options to choose from.",
                "enum": ["customer_rebate", "spa_or_billback", "chargeback", "vendor_rebate", "internal_commission"],
                "type": "string"
              },
              "scenario": {
                "description": "Optional free-text description of the user's scenario, for context.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
