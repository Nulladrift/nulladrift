                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: Send my contact details to up to three relevant Alpine transfer operators, chosen by Ski Transfer Quotes, who'll contact me directly. I'll be emailed each firm's name as my details go to it, and can stop any more firms getting them.",
                "type": "boolean"
              }
