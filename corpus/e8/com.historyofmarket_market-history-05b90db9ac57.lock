{
  "lockfileVersion": 2,
  "subjects": {
    "com.historyofmarket/market-history": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://historyofmarket.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "history-of-market",
        "title": "History of Market",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only U.S. stock market history from historyofmarket.com: S&P 500 since 1928 (annual price and total returns, drawdowns, bear markets, Shiller CAPE since 1871, forward P/E, index changes), Nasdaq 100, Dow, semiconductors (SOX), sector ETFs (XLK, XLF, XLY, XLP) and the Magnificent 7. Data is refreshed after each U.S. trading day. Start with get_latest for current readings, annual_returns for calendar-year returns, or search_charts to find the dataset behind a question, then get_dataset to read it. When you use a number, cite the page_url returned with it.",
      "tools": [
        {
          "name": "annual_returns",
          "title": "Calendar-year returns",
          "description": "Calendar-year returns by year with the arithmetic mean and compound annual rate over the complete years in the range. The basis depends on the index and is stated in `basis`: sp500 (from 1928) has both price return and total return (dividends reinvested); ndx and sox are index levels, price return only; xlk, xlf, xly and xlp are fund prices adjusted for dividends, total return only. A basis an index does not have is null. The current year is year-to-date and flagged `ytd`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_year": {
                "description": "First year to include.",
                "type": "integer"
              },
              "index": {
                "description": "Which index or ETF. Default sp500.",
                "enum": ["sp500", "ndx", "sox", "xlk", "xlf", "xly", "xlp"],
                "type": "string"
              },
              "to_year": {
                "description": "Last year to include.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calendar-year returns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19088dec22fd0a67c630940353594ade3c8b753872b0a41b04b13363ee48dfd0"
        },
        {
          "name": "get_dataset",
          "title": "Read a dataset",
          "description": "Read one published dataset (the JSON behind a chart), e.g. \"sp500/drawdowns\", \"sp500/pe\", \"ndx/forward-pe\", \"recessions\". Rows can be filtered by `since`/`until` on their `date` (or `year`). A result is capped at about 60,000 characters: when a file is larger (long daily series), each array keeps its most recent rows and the cut is reported under `windowed`. Scalars and summary fields are always included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Dataset path without /api/ and .json, as returned by search_charts.",
                "type": "string"
              },
              "since": {
                "description": "Keep rows dated on or after this (YYYY-MM-DD or YYYY).",
                "type": "string"
              },
              "tail": {
                "description": "Rows kept per array after filtering, from the end. By default every row is returned when the result fits; long daily series are cut to their most recent rows and reported under `windowed`.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "until": {
                "description": "Keep rows dated on or before this (YYYY-MM-DD or YYYY).",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a dataset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef47b12665c157bc9bf8b63795ba1c6d6837799a62c4bc9962f9116288bb8155"
        },
        {
          "name": "get_latest",
          "title": "Latest readings",
          "description": "Current headline readings (value, unit, observation date) for the site's charts: S&P 500 level, Shiller CAPE, forward P/E for the S&P 500, Nasdaq 100, SOX and sector ETFs, VIX, drawdown from the high, breadth, Magnificent 7 weight and more. Pass `id` for one chart, or omit it for all.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Chart id, e.g. \"pe\" (Shiller CAPE), \"forward-pe\", \"ndx-forward-pe\", \"drawdown\", \"vix\". Omit for every reading.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest readings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b8babdeaa92c4908f7c98ca367c0e5122310c4b6fa6cb23ec2871b9655e8833"
        },
        {
          "name": "index_changes",
          "title": "Index additions and deletions",
          "description": "Constituent changes with effective date, the company added, the company removed and the reason. sp500 from 2016, ndx from 2020. Newest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "index": {
                "description": "Default sp500.",
                "enum": ["sp500", "ndx"],
                "type": "string"
              },
              "limit": {
                "description": "Default 20.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Only changes effective on or after this date (YYYY-MM-DD).",
                "type": "string"
              },
              "ticker": {
                "description": "Only changes that add or remove this ticker.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Index additions and deletions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d92cd28e463a468ca9d1b5ada9ad845c58b762c6940c7442cca9edf6f21cbefd"
        },
        {
          "name": "search_charts",
          "title": "Find a chart or dataset",
          "description": "Search the site's charts by topic or question (e.g. \"bear markets\", \"Shiller CAPE\", \"Nasdaq 100 drawdown\", \"monthly seasonality\"). Returns each chart's title, the question it answers, its page and the dataset path to pass to get_dataset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match against chart titles and the questions they answer.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a chart or dataset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15c3d762879fefce8145e31016c59dc5cec4d8ce81d0fced26f68cc286d7dd34"
        }
      ],
      "digest": "sha256:fc362c4ad4bac8420a588e93fe4c63e0f278fe2887dd7225f7fc0f95eb866060"
    }
  }
}
