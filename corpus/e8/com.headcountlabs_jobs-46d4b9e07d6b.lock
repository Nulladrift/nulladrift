        {
          "name": "get_job",
          "title": "Get job details",
          "description": "Get a job by job_id. Default shape matches search_jobs, plus the full description, currentness, stale, last_checked_at, and linked postings. Pass view: \"full\" for every REST field, or fields to pick top-level properties (job_id is always included).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "fields": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["job_id", "currentness", "stale", "company_id", "employer_name", "title", "description", "work_arrangement", "locations", "job_first_seen_at", "curated_at", "job_updated_at", "postings", "company", "normalized"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Top-level job properties as a comma-separated string or field array; job_id is always included."
              },
              "job_id": {
                "format": "uuid",
                "type": "string"
              },
              "view": {
                "default": "compact",
                "description": "compact (default): the same summary search_jobs returns, plus the whole description, whether the job is still open, when it was last checked, and the linked postings. full: every field of the job, as the REST API returns it.",
                "enum": ["compact", "full"],
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
