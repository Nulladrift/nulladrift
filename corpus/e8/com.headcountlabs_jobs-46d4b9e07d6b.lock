        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search current job postings by keyword, title, company, place, pay and date. Call list_fields for filter names. Country and employment_type accept comma-separated values or arrays. Pages return up to 50 jobs (limit, default 10), or 10 when descriptions is \"full\". Pass next_cursor as cursor for the next page. One search shows up to 250 jobs; narrow filters or use count_jobs for how many match. Default results are compact summaries (employer, title, locations, pay, dates, urls, snippet). Pass view: \"full\", fields, or get_job for more. descriptions: \"snippet\" (default) previews text; \"full\" returns whole descriptions. title matches one phrase in order. title_advanced and description_advanced are Boolean: an operator between every two words or groups, for example title_advanced: \"(engineer OR developer) AND NOT manager\" (write AND NOT, never a bare NOT after a word; keep at least one word that is not negated). sort: relevance needs q, title or description; with only title_advanced or description_advanced use updated.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The next_cursor from the previous result, to see the next page.",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              },
              "descriptions": {
                "default": "snippet",
                "description": "snippet (default): a short preview of each description, up to 50 jobs per page. full: the whole text, up to 10 jobs per page.",
                "enum": ["snippet", "full"],
                "type": "string"
              },
              "fields": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["job_id", "currentness", "stale", "company_id", "employer_name", "title", "description", "work_arrangement", "locations", "job_first_seen_at", "curated_at", "job_updated_at", "postings", "company", "normalized"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Top-level job properties as a comma-separated string or field array; job_id is always included."
              },
              "filters": {
                "additionalProperties": false,
                "default": {},
                "properties": {
                  "active": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "application_check": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "application_check_since": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "city": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "City name."
                  },
                  "company": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "Company name."
                  },
                  "company_id": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ]
                  },
                  "company_linked": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "country": {
                    "anyOf": [
                      {
                        "maxLength": 16384,
                        "type": "string"
                      },
                      {
                        "items": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "type": "array"
                      }
                    ],
                    "description": "One or more two-letter country codes, comma-separated or as an array (US,CA)."
                  },
                  "curated_since": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "curated_until": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "currentness": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "description": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "description_advanced": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "Boolean search of the job description. AND, OR, NOT, brackets and \"quoted phrases\", with an operator between every two words or groups: write nurse AND NOT manager (never nurse NOT manager), and keep at least one word that is not negated. At most 200 characters and 64 words or operators. Example: python AND (sql OR \"data analysis\") AND NOT intern."
                  },
                  "employment_type": {
                    "anyOf": [
                      {
                        "maxLength": 16384,
                        "type": "string"
                      },
                      {
                        "items": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "type": "array"
                      }
                    ],
                    "description": "One or more employment type values, comma-separated or as an array."
                  },
                  "exclude_source": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "first_seen_since": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "Date (YYYY-MM-DD) or ISO time; jobs we first found on or after it. For a daily check for new jobs, pass the time of the last check."
                  },
                  "first_seen_until": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "has_application_url": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "has_description": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "has_location": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "has_pay": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "has_posting_url": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "job_id": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "last_fetch_since": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "last_fetch_until": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "location": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "msa": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "near": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "A US place to search around: a ZIP code (78701), a city with its state (Austin, TX), or latitude,longitude. Use with radius_miles."
                  },
                  "pay_currency": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "pay_max": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "pay_min": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "Lowest yearly pay, in pay_currency (default USD). Hourly pay is about yearly / 2,080, so $45 an hour is about 93,600."
                  },
                  "posted_since": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "Date (YYYY-MM-DD) or ISO time; jobs posted on or after it."
                  },
                  "posted_until": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "posting_id": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "posting_status": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "published_since": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "q": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "type": "string"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "type": "boolean"
                      },
                      {
                        "items": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array"
                      }
                    ],
                    "description": "Words matched against title and description, ranked by relevance. Every word must match; for a list of skills where any may match, use description_advanced with OR, for example python OR sql OR \"data analysis\"."
                  },
                  "radius_miles": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "Miles from near, 1-100 (default 25)."
                  },
                  "remote": {
                    "description": "true is the same as work_arrangement=remote.",
                    "type": "boolean"
                  },
                  "remote_type": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "source": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "source_class": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "source_posting_id": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "source_type": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "stale": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "state": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "US state, two letters (CA) or full name."
                  },
                  "title": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "One phrase in the job title, words in order. For words in any order or Boolean logic use title_advanced."
                  },
                  "title_advanced": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "Boolean search of the job title, words in any order. AND, OR, NOT, brackets and \"quoted phrases\", with an operator between every two words or groups: write nurse AND NOT manager (never nurse NOT manager), and keep at least one word that is not negated. At most 200 characters and 64 words or operators. Example: (engineer OR developer) AND NOT manager. For one phrase in order use title."
                  },
                  "updated_since": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "updated_until": {
                    "$ref": "#/properties/filters/properties/company_id"
                  },
                  "work_arrangement": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/0"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/1"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/2"
                      },
                      {
                        "$ref": "#/properties/filters/properties/q/anyOf/3"
                      }
                    ],
                    "description": "remote, hybrid or in_person; comma-separate several."
                  }
                },
                "type": "object"
              },
              "limit": {
                "default": 10,
                "description": "Jobs per page, 1-50 (1-10 when descriptions is \"full\"). Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "relevance, updated. relevance needs q, title or description; with only title_advanced or description_advanced use updated.",
                "enum": ["relevance", "updated"],
                "type": "string"
              },
              "view": {
                "default": "compact",
                "description": "compact (default): one short summary per job. full: every field of every job, as the REST API returns it.",
                "enum": ["compact", "full"],
                "type": "string"
              }
            },
            "type": "object"
