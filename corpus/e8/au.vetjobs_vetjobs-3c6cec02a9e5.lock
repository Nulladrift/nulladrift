{
  "lockfileVersion": 2,
  "subjects": {
    "au.vetjobs/vetjobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://vetjobs.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "vetjobs",
        "title": "VetJobs.au job inventory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to Australia's dedicated veterinary job board. Call list_categories first for vocabulary and volume, then search_jobs. Pass first_party=true to search only listings employers posted directly. Expired listings are never returned.",
      "tools": [
        {
          "name": "get_job",
          "title": "Get one job listing",
          "description": "Fetch a single live listing by its numeric id, in the same shape search_jobs returns, including embedded schema.org JobPosting structured data. Returns an error if the listing is unknown, unpublished or expired — treat that as 'no longer available' rather than retrying.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Numeric listing id from search_jobs.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6af152d47ba21f5f0f55584a9047536609a09f500bdbf7beb8fb2ed6dd43401"
        },
        {
          "name": "list_categories",
          "title": "List categories, states and live counts",
          "description": "The board's vocabulary and volume: every occupation category with its live count, the states that currently have listings, the total active count and the first-party vs imported split. Call this first to learn valid filter values and how much inventory exists before searching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3350f510ee5ade595657cbf9a6e0711173d4e6ee8c33c976ed1241e66b4cf2b5"
        },
        {
          "name": "recent_changes",
          "title": "Listings changed since a timestamp",
          "description": "Incremental sync: every listing created or updated since the given ISO 8601 timestamp, newest first. Poll this instead of re-fetching the whole board — combine with the returned ids to keep a local copy current. Expired listings are never returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "first_party": {
                "description": "Restrict to first-party (non-imported) listings.",
                "type": "boolean"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "updated_since": {
                "description": "ISO 8601 date or datetime to sync from.",
                "type": "string"
              }
            },
            "required": ["updated_since"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9056e2f3419686c28ed841a5d941b574b5a6e6a3f7d65f45cc7b88dbd30f595"
        },
        {
          "name": "search_jobs",
          "title": "Search Australian veterinary jobs",
          "description": "Search live veterinary job listings on VetJobs.au, Australia's dedicated veterinary job board: veterinarian, veterinary nurse, locum, practice manager, reception and animal care roles posted by clinics, hospitals and practices across Australia (plus some New Zealand roles), with no recruiter middlemen. Expired listings are never returned; a listing that is gone from the source disappears from results. Each listing reports provenance: source, is_imported, first_party and source_url. Pass first_party=true to restrict results to listings the employer posted directly — the most current inventory, and the subset safest to cite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Occupation slug. Call list_categories first for the vocabulary and live counts, e.g. veterinary-nurse, veterinarian-small-animal.",
                "type": "string"
              },
              "employment_type": {
                "description": "FULL_TIME, PART_TIME, LOCUM_TENENS, CASUAL, CONTRACTOR, TEMPORARY, RESIDENCY, INTERNSHIP, VOLUNTEER or OTHER.",
                "type": "string"
              },
              "first_party": {
                "description": "true = only listings posted directly by the employer (excludes scraped imports); false = only imports. Omit for both.",
                "type": "boolean"
              },
              "new_graduates_accepted": {
                "description": "true = only listings that say they accept new graduates (graduate-friendly roles); false = only listings that do not. Omit for both.",
                "type": "boolean"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free-text search over title, employer, location and description.",
                "type": "string"
              },
              "state": {
                "description": "Australian state/territory code, e.g. QLD, NSW, VIC.",
                "type": "string"
              },
              "updated_since": {
                "description": "ISO 8601 date or datetime. Returns only listings changed since then — use this for incremental sync instead of re-fetching everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0754d6075ae268372adceeacebaa73ae07be89a508e950771411daa80baf085"
        }
      ],
      "digest": "sha256:494fa486f8dc24d6ef9ebd0bdea2eadbb2c1263b111187c4f76809db9348c4cf"
    }
  }
}
