{
  "lockfileVersion": 2,
  "subjects": {
    "au.vetjobs/vetjobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://vetjobs.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "vetjobs",
        "title": "VetJobs.au job inventory",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to Australia's dedicated veterinary job board. Call list_categories first for vocabulary and volume, then search_jobs. first_party=true restricts to listings the employer placed directly; employer_feed=true restricts to listings read from the employer's own ATS feed. Expired listings are never returned.",
      "tools": [
        {
          "name": "get_job",
          "title": "Get one job listing",
          "description": "Fetch a single live listing by its numeric id, in the same shape search_jobs returns, including embedded schema.org JobPosting structured data. Returns an error if the listing is unknown, unpublished or expired — treat that as 'no longer available' rather than retrying.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Numeric listing id from search_jobs.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6af152d47ba21f5f0f55584a9047536609a09f500bdbf7beb8fb2ed6dd43401"
        },
        {
          "name": "list_categories",
          "title": "List categories, states and live counts",
          "description": "The board's vocabulary and volume: every occupation category with its live count, the states that currently have listings, the total active count and the first-party vs imported split. employer_feed counts the imported rows that came from an employer's own careers feed, so an agent does not mistake them for scraped third-party inventory. Call this first to learn valid filter values and how much inventory exists before searching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7345def39d5a32661df6fac80b81a43ba40001a7bc8235e5739984e0d89a6083"
        },
        {
          "name": "recent_changes",
          "title": "Listings changed since a timestamp",
          "description": "Incremental sync: every listing created or updated since the given ISO 8601 timestamp, newest first. Poll this instead of re-fetching the whole board — combine with the returned ids to keep a local copy current. Expired listings are never returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employer_feed": {
                "description": "Restrict to listings read from the employer's own careers feed (genuine inventory, though imported).",
                "type": "boolean"
              },
              "first_party": {
                "description": "Restrict to first-party (non-imported) listings; the conservative placement subset.",
                "type": "boolean"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "updated_since": {
                "description": "ISO 8601 date or datetime to sync from.",
                "type": "string"
              }
            },
            "required": ["updated_since"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:35077a764035ffa953b55b386d2f54b2b14c1c7989c67a098c1f8f706305bb23"
        },
        {
          "name": "search_jobs",
          "title": "Search Australian veterinary jobs",
          "description": "Search live veterinary job listings on VetJobs.au, Australia's dedicated veterinary job board: veterinarian, veterinary nurse, locum, practice manager, reception and animal care roles posted by clinics, hospitals and practices across Australia (plus some New Zealand roles), with no recruiter middlemen. Expired listings are never returned; a listing that is gone from the source disappears from results. Each listing reports provenance: source, is_imported, first_party, employer_feed and source_url. first_party is how the listing reached us (the employer posted it directly or an approved ad was placed on its behalf) and is therefore a conservative subset: genuine employer ads imported from an employer's own ATS feed are also marked imported, so is_imported alone does not mean an ad was scraped. employer_feed says it was read from that feed; imported is not a synonym for untrustworthy, so the subset safest to cite is first_party=true OR employer_feed=true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Occupation slug. Call list_categories first for the vocabulary and live counts, e.g. veterinary-nurse, veterinarian-small-animal.",
                "type": "string"
              },
              "employer_feed": {
                "description": "true = only listings read from the employer's own careers feed (an ATS board); these are genuine employer ads even though an importer created the row. Combine with first_party=true to cover both kinds of genuine inventory. false = only rows not from an employer feed. Omit for both.",
                "type": "boolean"
              },
              "employment_type": {
                "description": "FULL_TIME, PART_TIME, LOCUM_TENENS, CASUAL, CONTRACTOR, TEMPORARY, RESIDENCY, INTERNSHIP, VOLUNTEER or OTHER.",
                "type": "string"
              },
              "first_party": {
                "description": "true = only listings deliberately posted by the employer or placed on its behalf (first_party); this is the conservative subset, and it omits auto-imported employer feeds (genuine employer ads from an ATS board — see employer_feed). false = only imports. Omit for both.",
                "type": "boolean"
              },
              "new_graduates_accepted": {
                "description": "true = only listings that say they accept new graduates (graduate-friendly roles); false = only listings that do not. Omit for both.",
                "type": "boolean"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free-text search over title, employer, location and description.",
                "type": "string"
              },
              "state": {
                "description": "Australian state/territory code, e.g. QLD, NSW, VIC.",
                "type": "string"
              },
              "updated_since": {
                "description": "ISO 8601 date or datetime. Returns only listings changed since then — use this for incremental sync instead of re-fetching everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26e9410a0406348913aac6fa4cf5ec2bc6a9deeb56ac49d73149a01918506f8f"
        }
      ],
      "digest": "sha256:88d16daa5a511f55de35841a88c0c14e9c2748c646158dbc388fd8d94906bc40"
    }
  }
}
