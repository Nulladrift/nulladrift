{
  "lockfileVersion": 2,
  "subjects": {
    "ai.edge-agents/intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pay.edge-agents.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "edge-agents-ai",
        "title": "Edge Agents AI",
        "version": "2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Machine-purchasable macro, market and decision intelligence over 808 services. Search or browse first, inspect a service's price and freshness, and evaluate a free sample before purchasing. Every tool here reads: edge_get_report_terms returns a report's live x402 price and rails, but settlement runs over the plain HTTP endpoint it names, not through this server, which holds no funds and signs nothing.",
      "tools": [
        {
          "name": "edge_ask",
          "title": "Ask a question, get the services to buy",
          "description": "Describe what you want to know in plain language and get back the services worth buying, with price, endpoint, free-sample link and the keywords that matched. A question with several parts, for example 'btc leverage and eurozone inflation', is split into topics and routed separately, and the picks are bundled with a total price. Routing only: nothing is called or purchased, and it matches keywords rather than interpreting the question. Start here when you do not yet know which services you need.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "Your question or need in plain language, up to 300 characters, for example 'what can move bitcoin next, and when'.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6a0799f8ce85d19006f8697169d344e73be14e94e1b09dd23455b99034e2b2e5"
        },
        {
          "name": "edge_get_free_sample",
          "title": "Get a free illustrative sample",
          "description": "Fetch a free, illustrative sample of a service's output so the response shape and evidence style can be inspected before paying. The sample is illustrative: treat it as a schema and quality guide, not as current market evidence.",
          "inputSchema": {
            "properties": {
              "serviceId": {
                "description": "The service id to sample.",
                "type": "string"
              }
            },
            "required": ["serviceId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:004696400e8106c2771d36aca6d54d4913b7355cf5f742e773a4e91af6bc8b69"
        },
        {
          "name": "edge_get_report_terms",
          "title": "Get a report's live payment terms (x402)",
          "description": "Read the live x402 payment terms for a service's report: the price, and one offer per settlement rail, exactly as the paid endpoint issues them. Use this to check a report's cost against your own spend policy before committing. Settlement happens over the plain HTTP endpoint named in the response, not through this tool -- signing a payment needs your own wallet, which no MCP client holds.",
          "inputSchema": {
            "properties": {
              "serviceId": {
                "description": "The service id whose payment terms you want.",
                "type": "string"
              }
            },
            "required": ["serviceId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5c2a79d039de163e820ed4fb7560615e683a6687e20cc4967e1b50134efaa515"
        },
        {
          "name": "edge_get_service",
          "title": "Get a service's full record",
          "description": "Look up one service by its id and return its full public record: what it produces, its price, its freshness target, its output schema version and its purchase endpoint. Call this before purchasing so the price and freshness are known rather than assumed. The top result is the exact id match.",
          "inputSchema": {
            "properties": {
              "serviceId": {
                "description": "The service id, as returned by edge_search_services or a product bundle's sample.serviceId.",
                "type": "string"
              }
            },
            "required": ["serviceId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:40a74718c9b8b1ce7e178ad179aa33eb03f5a74b19bccd1a746daa505eff5d01"
        },
        {
          "name": "edge_list_families",
          "title": "List service families",
          "description": "List the families the catalogue is organised into, with a service count for each. Use this to browse when a keyword search is too narrow, or to check coverage of a subject area before committing to a purchase.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:225a31f6599758344f1438bcff70522d7cc81989f536edc23065ceb82b988708"
        },
        {
          "name": "edge_list_products",
          "title": "List the buyer-facing product bundles",
          "description": "List the packaged products, each of which composes several specialist services into one buyer outcome, with its free sample and its representative purchase path. Prefer these over assembling specialist services yourself when a product already matches the question.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:47ad5758126c8d6b2dbcfa95b41c1b9edba1a66afbd5350ff354a495504aac19"
        },
        {
          "name": "edge_search_services",
          "title": "Search the intelligence catalogue",
          "description": "Find intelligence services by keyword. Returns id, name, description, family and price for each match. Start here when you know what evidence you need but not which service provides it.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results to return (default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search, for example 'bitcoin leverage' or 'eurozone inflation'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:467cb67b476fc1136d63cded8807447133ef4f7866e95dc6dc2cc3a0f661145b"
        },
        {
          "name": "edge_service_health",
          "title": "Check service availability and freshness",
          "description": "Report per-service availability and data freshness. Call this when a purchase matters and staleness would change the decision: a service can be operational but working from evidence older than its freshness target, which is reported rather than hidden. Omit serviceId for the platform summary; pass one for a single service's probe record.",
          "inputSchema": {
            "properties": {
              "serviceId": {
                "description": "Optional. A single service's id, for its own probe record instead of the platform summary.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bcd65d0281bc58579a7fa4a78f6a29c0c5633bc5101094359bc943234c50daa1"
        }
      ],
      "digest": "sha256:0ec29b3abce9dd9b40d9353bd653980cb5887a11720b1a54187ad44a3a06807d"
    }
  }
}
