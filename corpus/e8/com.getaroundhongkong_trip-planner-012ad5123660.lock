        {
          "name": "plan_trip",
          "title": "Plan a public transport trip in Hong Kong",
          "description": "Routes between two places in Hong Kong by MTR, bus, minibus, tram and ferry, best first: departure and arrival times, every walk and ride with stops, Octopus fares for the group, live next departures, traffic delays, and a link to open the trip on a live map. Also lists Klook things to do near the destination (affiliate ads).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "default": 1,
                "description": "Aged 12–59",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "arrive_by": {
                "default": false,
                "description": "true: time is when to arrive; false: when to leave",
                "type": "boolean"
              },
              "bus": {
                "description": "A preferred bus or green minibus number, e.g. \"33\" or \"1A\": options are then only trips on it (its next departures from the nearest stop within about 10 minutes' walk, heading for the destination), or route_note says why there are none",
                "maxLength": 6,
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Aged 3–11",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "currency": {
                "description": "Also show fares in this currency (fares are charged in HKD). Default follows language",
                "enum": ["HKD", "USD", "JPY", "TWD", "CNY", "SGD", "KRW"],
                "type": "string"
              },
              "disabled": {
                "default": 0,
                "description": "Persons with disabilities",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "from": {
                "description": "Start: a place name, address or \"lat,lon\" (e.g. \"Tsim Sha Tsui Star Ferry\", \"238 Nathan Road\", \"22.2988,114.1722\")",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for place and line names: en, zh-HK (Traditional Chinese), zh-CN (Simplified), ja, ko",
                "enum": ["zh-HK", "zh-CN", "en", "ja", "ko"],
                "type": "string"
              },
              "leave_at": {
                "description": "Same as time (the name the answer uses); time wins if both are given",
                "type": "string"
              },
              "options": {
                "default": 3,
                "description": "How many route options",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "seniors": {
                "default": 0,
                "description": "Aged 60+",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "step_free": {
                "default": false,
                "description": "Wheelchair / step-free: avoids stairs, minibuses and trams",
                "type": "boolean"
              },
              "time": {
                "description": "ISO 8601 date-time, e.g. 2026-10-05T09:30:00+08:00 (Hong Kong is UTC+8). Default: now",
                "type": "string"
              },
              "to": {
                "description": "Destination, same forms as from",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "arrive_by": {
                "description": "ISO 8601",
                "type": "string"
              },
              "from": {
                "additionalProperties": {},
                "properties": {
                  "also": {
                    "description": "Other candidates when the match is loose",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "area": {
                    "description": "District",
                    "type": "string"
                  },
                  "kind": {
                    "description": "mtr, bus, ferry, restaurant, hotel, attraction, address…",
                    "type": "string"
                  },
                  "lat": {
                    "type": "number"
                  },
                  "lon": {
                    "type": "number"
                  },
                  "metres": {
                    "description": "Distance from near, when given",
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "note": {
                    "description": "Set when the match is loose: check it's the place meant",
                    "type": "string"
                  }
                },
                "required": ["lat", "lon", "name"],
                "type": "object"
              },
              "leave_at": {
                "description": "ISO 8601",
                "type": "string"
              },
              "message": {
                "description": "Set when no route was found",
                "type": "string"
              },
              "open_in_planner": {
                "description": "Link that opens this trip on the site with live times",
                "type": "string"
              },
              "options": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "arrive": {
                      "type": "string"
                    },
                    "best_for": {
                      "description": "fastest, cheapest, fewest changes, least walking",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "depart": {
                      "description": "HH:MM, Hong Kong time",
                      "type": "string"
                    },
                    "fare": {
                      "additionalProperties": {},
                      "description": "Total for the group, Octopus; plus the requested currency if any",
                      "properties": {
                        "hkd": {
                          "type": "number"
                        },
                        "note": {
                          "type": "string"
                        }
                      },
                      "required": ["note"],
                      "type": "object"
                    },
                    "minutes": {
                      "type": "number"
                    },
