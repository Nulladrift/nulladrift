        {
          "name": "get_events",
          "title": "What's on in Hong Kong",
          "description": "Big events in Hong Kong (concerts at the major venues, sports, festivals, arts), the same list as getaroundhongkong.com/events: titles in five languages, dates, venue, coordinates, nearest MTR station, and this site's page for getting there. Filter by dates (events overlapping from–to, Hong Kong dates, YYYY-MM-DD; from today on by default) and featured (the biggest, most crowded ones).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "featured": {
                "description": "Only the featured (biggest) events",
                "type": "boolean"
              },
              "from": {
                "description": "First day, YYYY-MM-DD (default today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD (default: everything coming up)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "events": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "end": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    },
                    "ends": {
                      "description": "Roughly when it ends each day, HH:MM, Hong Kong: from its running time, else about 2.5 hours after a concert starts; null if not known",
                      "type": ["string", "null"]
                    },
                    "featured": {
                      "description": "A big event: expect crowds",
                      "type": "boolean"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "credit": {
                              "description": "Whose picture it is: credit it when showing it",
                              "type": "string"
                            },
                            "focus": {
                              "description": "Where to centre a crop, CSS background-position",
                              "type": "string"
                            },
                            "height": {
                              "type": "number"
                            },
                            "source": {
                              "description": "The page it's from: link to it when showing it",
                              "type": "string"
                            },
                            "url": {
                              "description": "The event's own picture (its organiser's artwork), on this site",
                              "type": "string"
                            },
                            "width": {
                              "type": "number"
                            }
                          },
                          "required": ["credit", "height", "source", "url", "width"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Featured events' pictures; null until one is found"
                    },
                    "kind": {
                      "description": "sport, arts, concert or festival",
                      "type": "string"
                    },
                    "lat": {
                      "type": ["number", "null"]
                    },
                    "link": {
                      "description": "The organiser's page",
                      "type": ["string", "null"]
                    },
                    "lon": {
                      "type": ["number", "null"]
                    },
                    "not_yet_known": {
                      "description": "Details not filled in yet (place, station, time, title.ja…)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "start": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    },
                    "station": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "name": {
                              "additionalProperties": false,
                              "properties": {
                                "en": {
                                  "type": "string"
                                },
                                "zh": {
                                  "type": "string"
                                }
                              },
                              "required": ["en", "zh"],
                              "type": "object"
                            }
                          },
                          "required": ["id", "name"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Nearest MTR station"
                    },
                    "time": {
                      "description": "Start time HH:MM, Hong Kong, where known (the first show's, where it differs by night)",
                      "type": ["string", "null"]
                    },
                    "times": {
                      "anyOf": [
                        {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Start time HH:MM by date (YYYY-MM-DD) where shows start at different times; null when every day is the same"
                    },
                    "title": {
                      "additionalProperties": false,
                      "properties": {
                        "en": {
                          "type": "string"
                        },
                        "ja": {
                          "type": "string"
                        },
                        "ko": {
                          "type": "string"
                        },
                        "zh-cn": {
                          "type": "string"
                        },
                        "zh-hk": {
                          "type": "string"
                        }
                      },
                      "required": ["en", "ja", "ko", "zh-cn", "zh-hk"],
                      "type": "object"
                    },
                    "url": {
                      "additionalProperties": false,
                      "description": "This site's page for it (guide, venue guide or the planner), per language",
                      "properties": {
                        "en": {
                          "type": "string"
                        },
                        "ja": {
                          "type": "string"
                        },
                        "ko": {
                          "type": "string"
                        },
                        "zh-cn": {
                          "type": "string"
                        },
                        "zh-hk": {
                          "type": "string"
                        }
                      },
                      "required": ["en", "ja", "ko", "zh-cn", "zh-hk"],
                      "type": "object"
                    },
                    "venue": {
                      "additionalProperties": false,
                      "properties": {
                        "en": {
                          "type": "string"
                        },
                        "zh": {
                          "type": "string"
                        }
                      },
                      "required": ["en", "zh"],
                      "type": "object"
                    }
                  },
                  "required": ["end", "ends", "featured", "id", "image", "kind", "lat", "link", "lon", "start", "station", "time", "times", "title", "url", "venue"],
                  "type": "object"
                },
                "type": "array"
              },
              "from": {
                "description": "First day covered, YYYY-MM-DD (Hong Kong)",
                "type": "string"
              },
              "to": {
                "description": "Last day covered, or null for everything coming up",
                "type": ["string", "null"]
              }
            },
            "required": ["events", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7d050bf8b0e1213bed75439031c409ed3dafb5cfa689f781f2442cd83a717e6e"
        },
        {
          "name": "nearby_departures",
          "title": "Live departures near a place in Hong Kong",
          "description": "What's leaving now from the MTR stations, bus stops and green minibus stops around a place in Hong Kong, nearest first: each route and direction once (at its nearest stop), where it's heading and the minutes until its next two departures, live from the operators. No destination needed: for \"when's my bus\" or \"what leaves near here\". Trams, ferries and Light Rail aren't included; for a trip from A to B use plan_trip.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language for place and line names: en, zh-HK (Traditional Chinese), zh-CN (Simplified), ja, ko",
                "enum": ["zh-HK", "zh-CN", "en", "ja", "ko"],
                "type": "string"
              },
              "place": {
                "description": "Where: a place name, address or \"lat,lon\" (e.g. \"Mong Kok\", \"Hotel Icon\", \"22.3016,114.1772\")",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checked_at": {
                "type": "string"
              },
              "incomplete": {
                "type": "string"
              },
              "place": {
                "additionalProperties": {},
                "properties": {
                  "also": {
                    "description": "Other candidates when the match is loose",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "area": {
                    "description": "District",
                    "type": "string"
                  },
                  "kind": {
                    "description": "mtr, bus, ferry, restaurant, hotel, attraction, address…",
                    "type": "string"
                  },
                  "lat": {
                    "type": "number"
                  },
                  "lon": {
                    "type": "number"
                  },
                  "metres": {
                    "description": "Distance from near, when given",
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "note": {
                    "description": "Set when the match is loose: check it's the place meant",
                    "type": "string"
                  }
                },
                "required": ["lat", "lon", "name"],
                "type": "object"
              },
              "source": {
                "type": "string"
              },
              "stops": {
                "description": "Nearest first, within about 400 m (stations about 750 m). Each route and direction appears once, at its nearest stop",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "departures": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "minutes": {
                            "description": "Minutes until the next departures, soonest first; 0 = due now",
                            "items": {
                              "type": "number"
                            },
                            "type": "array"
                          },
                          "route": {
                            "description": "Bus or minibus number, or the MTR line (\"Tsuen Wan\")",
                            "type": "string"
                          },
                          "scheduled": {
                            "description": "true: the first time is the timetable's, not live",
                            "type": "boolean"
                          },
                          "towards": {
                            "description": "Where it heads (a minibus's from its route and direction; absent where unknown)",
                            "type": "string"
                          }
                        },
                        "required": ["minutes", "route"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "kind": {
                      "description": "mtr, bus or minibus",
                      "type": "string"
                    },
                    "lat": {
                      "type": "number"
                    },
                    "lon": {
                      "type": "number"
                    },
                    "metres": {
                      "description": "Straight-line distance from the place",
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["departures", "lat", "lon", "metres", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["checked_at", "place", "source", "stops"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
