        {
          "name": "search_routes",
          "title": "Look up a Hong Kong bus route or MTR line",
          "description": "Hong Kong bus and green minibus routes by number, and MTR lines by name or code, the same as typing one in the site's Nearby box: where each runs between, its operator, its first and last departures by day, and this site's page for it (every stop, fares, live arrivals). A number can be several routes (route 40 is Citybus, KMB and three minibus routes in different districts): all are returned, each with its ends. Special services (a supplementary or short-working run) are left out once they have no departure left today. For travelling somewhere, use plan_trip.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Only buses, green minibuses or MTR lines",
                "enum": ["bus", "minibus", "mtr"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for place and line names: en, zh-HK (Traditional Chinese), zh-CN (Simplified), ja, ko",
                "enum": ["zh-HK", "zh-CN", "en", "ja", "ko"],
                "type": "string"
              },
              "query": {
                "description": "A route number or line: \"40\", \"N21\", \"A21\", \"28M\", \"Island Line\", \"港島綫\", \"TWL\"",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "type": "string"
              },
              "routes": {
                "description": "Every route matching: a number names all operators' and districts' routes with it. Empty when none does",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "description": "An MTR line's code (\"ISL\")",
                      "type": "string"
                    },
                    "from": {
                      "description": "One end",
                      "type": ["string", "null"]
                    },
                    "kind": {
                      "description": "bus, minibus or mtr",
                      "type": "string"
                    },
                    "operator": {
                      "description": "KMB, Citybus, Green minibus, MTR…",
                      "type": "string"
                    },
                    "route": {
                      "description": "The route number (\"40\", \"N21\"), or the MTR line's name (\"Island Line\")",
                      "type": "string"
                    },
                    "timetable": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "days": {
                              "items": {
                                "additionalProperties": false,
                                "properties": {
                                  "days": {
                                    "description": "\"Mon–Fri\", \"Sat\", \"Sun\"",
                                    "type": "string"
                                  },
                                  "departures": {
                                    "description": "How many leave that day",
                                    "type": "number"
                                  },
                                  "every_min": {
                                    "description": "Gap between departures, [shortest, longest] minutes",
                                    "items": {
                                      "type": "number"
                                    },
                                    "type": "array"
                                  },
                                  "first": {
                                    "type": "string"
                                  },
                                  "last": {
                                    "type": "string"
                                  }
                                },
                                "required": ["days", "departures", "first", "last"],
                                "type": "object"
                              },
                              "type": "array"
                            },
                            "from_stop": {
                              "description": "The first stop, where these times are from",
                              "type": "string"
                            }
                          },
                          "required": ["days", "from_stop"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "One direction's first and last departures by day (the page has both directions)"
                    },
                    "to": {
                      "description": "The other end (a circular route has one)",
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "This site's page for the route: every stop, fares, both directions, live arrivals",
                      "type": "string"
