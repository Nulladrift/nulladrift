      "serverInfo": {
        "name": "get-around-hong-kong",
        "title": "Get Around Hong Kong",
        "version": "1.6.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Get Around Hong Kong plans public transport trips in Hong Kong: MTR, Light Rail, buses, green minibuses, trams and ferries combined, with Octopus fares, live departure times, road congestion delays and step-free routes.\nUse plan_trip for any \"how do I get from A to B in Hong Kong\" question; it accepts place names, addresses or coordinates directly. If the user names a bus or minibus they want to take (\"I take the 33\"), pass it as bus. Mention any warnings on the options you suggest. Use search_routes for questions about a route or line itself (\"where does bus 40 go\", \"first and last train on the Island Line\"): a number can be several routes (different operators or districts), so give each with its ends rather than picking one, and share its url (this site's page for it). Use service_updates for \"are there any MTR delays / road problems now\". Use border_crossings for \"how busy is the border / Lo Wu / Shenzhen Bay now\" or before planning a trip to Shenzhen or Macau: suggest a quieter crossing, then plan_trip to its lat,lon. Use nearby_departures for \"when's the next bus / train from here\", \"what leaves near my hotel\": live times at the stops around a place, no destination needed. Use search_place to find or disambiguate a place first when unsure. Use get_events for \"what's on\" in Hong Kong on a date, or to warn of crowds at a venue on the day of a trip (featured events draw the biggest crowds); then plan_trip to its lat,lon or share its url.\nTimes are Hong Kong time (UTC+8). Answer in the user's language by passing language. Share the open_in_planner link so the user can follow the trip on a live map.\nthings_to_do_nearby are Klook affiliate links (advertising): if you mention them, say they are ads.",
      "tools": [
        {
          "name": "border_crossings",
          "title": "Hong Kong border crossing queues",
          "description": "How busy each land and bridge crossing between Hong Kong and mainland China is right now (Lo Wu, Lok Ma Chau Spur Line, Shenzhen Bay, Heung Yuen Wai, Huanggang Port, Hong Kong–Zhuhai–Macao Bridge, Man Kam To, Sha Tau Kok): the Immigration Department's queue level and waiting range on the Hong Kong side, leaving and entering, for Hong Kong residents and for visitors, with how to get there and where to plan a trip to.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language for place and line names: en, zh-HK (Traditional Chinese), zh-CN (Simplified), ja, ko",
                "enum": ["zh-HK", "zh-CN", "en", "ja", "ko"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "crossings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "description": "LWS, LSC, SBC, HYW, HGP, HZM, MKT, STK",
                      "type": "string"
                    },
                    "entering_hk": {
                      "additionalProperties": false,
                      "description": "Arrival hall queue",
                      "properties": {
                        "residents": {
                          "additionalProperties": false,
                          "properties": {
                            "level": {
                              "description": "normal, busy, very busy, closed or no data",
                              "type": "string"
                            },
                            "wait": {
                              "description": "The published range, e.g. \"under 30 min\"",
                              "type": "string"
                            }
                          },
                          "required": ["level"],
                          "type": "object"
                        },
                        "visitors": {
                          "additionalProperties": false,
                          "properties": {
                            "level": {
                              "description": "normal, busy, very busy, closed or no data",
                              "type": "string"
                            },
                            "wait": {
                              "description": "The published range, e.g. \"under 30 min\"",
                              "type": "string"
                            }
                          },
                          "required": ["level"],
                          "type": "object"
                        }
                      },
                      "required": ["residents", "visitors"],
                      "type": "object"
                    },
                    "how_to_get_there": {
                      "description": "How most people reach it on the Hong Kong side",
                      "type": "string"
                    },
                    "lat": {
                      "description": "Where a trip there is planned to (pass lat,lon to plan_trip)",
                      "type": "number"
                    },
                    "leaving_hk": {
                      "additionalProperties": false,
                      "description": "Departure hall queue",
                      "properties": {
                        "residents": {
                          "additionalProperties": false,
                          "properties": {
                            "level": {
                              "description": "normal, busy, very busy, closed or no data",
                              "type": "string"
                            },
                            "wait": {
                              "description": "The published range, e.g. \"under 30 min\"",
                              "type": "string"
                            }
                          },
                          "required": ["level"],
                          "type": "object"
                        },
                        "visitors": {
                          "additionalProperties": false,
                          "properties": {
                            "level": {
                              "description": "normal, busy, very busy, closed or no data",
                              "type": "string"
                            },
                            "wait": {
                              "description": "The published range, e.g. \"under 30 min\"",
                              "type": "string"
                            }
                          },
                          "required": ["level"],
                          "type": "object"
                        }
                      },
                      "required": ["residents", "visitors"],
                      "type": "object"
                    },
                    "lon": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "entering_hk", "how_to_get_there", "lat", "leaving_hk", "lon", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "live": {
                "description": "false when the figures are more than 30 minutes old",
                "type": "boolean"
              },
              "published_at": {
                "description": "When the Immigration Department last updated the levels, ISO 8601",
                "type": ["string", "null"]
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["crossings", "live", "published_at", "source"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
