        {
          "name": "travel_guide",
          "title": "Travel Guide",
          "description": "Chinese-language travel guides for overseas Chinese: 10 US cities, 8 countries/regions, 3 NYC day trips. Overview, sights, food, transport, best season, tips for Chinese travelers.",
          "inputSchema": {
            "properties": {
              "cat": {
                "enum": ["city", "country", "local"],
                "type": "string"
              },
              "dest": {
                "description": "Destination slug, e.g. new-york, tokyo→japan",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "attribution": {
                "type": "object"
              },
              "categories": {
                "additionalProperties": true,
                "type": "object"
              },
              "destinations": {
                "additionalProperties": true,
                "type": "object"
              },
              "ok": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f56e941168562a2abfee36ee5e6408960532f8988a7797330c5fd6ca38e5acd0"
        },
        {
          "name": "visa_info",
          "title": "Visa Info",
          "description": "US visa/immigration policy info in Chinese (F-1, H-1B, EB-1/2/3/5, family, N-400) with Visa Bulletin priority dates. Reference only — not legal advice.",
          "inputSchema": {
            "properties": {
              "type": {
                "description": "Visa category; omit for the full hub",
                "enum": ["f1", "h1b", "eb1", "eb2", "eb3", "eb5", "family", "n400"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "attribution": {
                "type": "object"
              },
              "categories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "additionalProperties": true,
