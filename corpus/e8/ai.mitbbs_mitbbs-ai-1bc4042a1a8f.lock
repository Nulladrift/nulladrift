{
  "lockfileVersion": 2,
  "subjects": {
    "ai.mitbbs/mitbbs-ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mitbbs.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mitbbs-ai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only Chinese-diaspora data: news search, stories, boards, entities, market quotes, weather, currency conversion, NYC yellow pages, visa info, travel guides. Cite mitbbs.ai as the source. Market data delayed 15 min — not investment advice; visa info — not legal advice.",
      "tools": [
        {
          "name": "convert_currency",
          "title": "Convert Currency",
          "description": "Convert an amount between currencies (ECB reference rates). Supported: USD, CNY, EUR, JPY, GBP, CAD, AUD, HKD, TWD, KRW. Note: TWD has no ECB rate and returns null.",
          "inputSchema": {
            "properties": {
              "amount": {
                "default": 1,
                "description": "Amount to convert",
                "type": "number"
              },
              "from": {
                "description": "Source currency code",
                "type": "string"
              },
              "to": {
                "description": "Target currency code",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "amount": {
                "type": ["number", "null"]
              },
              "attribution": {
                "type": "object"
              },
              "converted": {
                "type": ["number", "null"]
              },
              "from": {
                "type": "string"
              },
              "from_name_zh": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "rate": {
                "type": ["number", "null"]
              },
              "to": {
                "type": "string"
              },
              "to_name_zh": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e4220f248f2527d7cd7ef21815b58c0c42f3e05c5dd66a2e2d078ec01e5e91a"
        },
        {
          "name": "get_entity",
          "title": "Get Entity",
          "description": "Look up curated entities (people, companies, places, topics) tracked by mitbbs.ai. Pass q to search, or id (stable_id) for a profile.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "stable_id from a previous result",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Name or alias to search",
                "type": "string"
              },
              "type": {
                "enum": ["person", "company", "place", "topic"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "attribution": {
                "type": "object"
              },
              "entities": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "canonical_name": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "entity_id": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "entity": {
                "additionalProperties": true,
                "type": "object"
              },
              "ok": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:552ef5ca3a0827b14b5bb573d47dfa34b6314445d6aaf4eee800e3d3a54ce86d"
        },
        {
          "name": "get_story",
          "title": "Get Story",
          "description": "Read a story thread: topic metadata plus the site own summary. Summary-only for every rights basis (owner ruling 2026-11-08): post full text is never served; posts is always empty. Includes rights_basis, source_url and provenance (content SHA256).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "topic_id": {
                "description": "Topic id from search_news",
                "type": "integer"
              }
            },
            "required": ["topic_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "attribution": {
                "type": "object"
              },
              "ok": {
                "type": "boolean"
              },
              "posts": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "author": {
                      "type": "string"
                    },
                    "post_id": {
                      "type": "integer"
                    },
                    "posted_at": {
                      "type": "string"
                    },
                    "subject": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "topic": {
                "additionalProperties": true,
                "properties": {
                  "board_id": {
                    "type": "integer"
                  },
                  "created_at": {
                    "type": "string"
                  },
                  "provenance": {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  "replies": {
                    "type": "integer"
                  },
                  "rights_basis": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "topic_id": {
                    "type": "integer"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e6acd5e44840dd854c0327e07a09f947701eff7d766db6d66d60b5fd074679c1"
        },
        {
          "name": "list_boards",
          "title": "List Boards",
          "description": "List public forum boards (id, name, description, topic/post counts, url).",
