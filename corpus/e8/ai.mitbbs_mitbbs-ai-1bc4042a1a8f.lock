          "title": "Yellow Pages",
          "description": "Search 4,389+ NYC Chinese business listings by keyword or category (Chinese).",
          "inputSchema": {
            "properties": {
              "cat": {
                "description": "Category in Chinese, e.g. 餐馆",
                "type": "string"
              },
              "limit": {
                "default": 10,
