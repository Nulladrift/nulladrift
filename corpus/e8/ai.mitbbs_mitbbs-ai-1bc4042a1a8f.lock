          "name": "weather",
          "title": "Weather",
          "description": "Current weather + 7-day forecast for 16 cities (Chinese + English). Source: Open-Meteo (CC-BY 4.0).",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug: new-york, los-angeles, san-francisco, boston, chicago, houston, seattle, dc, toronto, vancouver, london, sydney, beijing, shanghai, taipei, hong-kong",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
