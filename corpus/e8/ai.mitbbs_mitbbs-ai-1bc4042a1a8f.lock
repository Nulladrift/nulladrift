                    },
                    "id": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "parent_id": {
                      "type": "integer"
                    },
                    "posts": {
                      "type": "integer"
                    },
                    "topics": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "ok": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70c0b93ef6849e983ea369fe3f8ef6318d15cbf6f2b0d5065247f6bf1472bafd"
        },
        {
          "name": "market_quote",
          "title": "Market Quote",
          "description": "Unified market quote: US stock (NVDA), forex pair (USD_CNY or USD/CNY), or crypto (BTC or bitcoin). Data delayed 15 minutes; reference only, not investment advice.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Ticker (NVDA), pair (USD_CNY), or crypto (BTC)",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "attribution": {
                "type": "object"
              },
              "kind": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "pair": {
                "type": "string"
              },
              "quote": {
                "additionalProperties": true,
                "type": "object"
              },
              "symbol": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:30aa2f7fc4bd46b2890a1d46e1f6cc5eda6f0398bb2f73f580199f9ad393f5fe"
        },
        {
          "name": "search_news",
          "title": "Search News",
          "description": "Search mitbbs.ai Chinese-language news headlines and forum posts (guest-readable boards only). Returns url, title, excerpt, board, author, posted_at, source_name, source_url, rights_basis per result.",
          "inputSchema": {
            "properties": {
              "board": {
                "description": "Restrict to one forum id",
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search keywords (Chinese or English)",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "attribution": {
                "type": "object"
              },
              "ok": {
                "type": "boolean"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "author": {
                      "type": "string"
                    },
                    "board": {
                      "type": "string"
                    },
                    "board_id": {
                      "type": "integer"
                    },
                    "excerpt": {
                      "type": "string"
                    },
                    "post_id": {
                      "type": "integer"
                    },
                    "posted_at": {
                      "type": "string"
                    },
                    "rights_basis": {
                      "type": "string"
                    },
                    "source_name": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "topic_id": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
