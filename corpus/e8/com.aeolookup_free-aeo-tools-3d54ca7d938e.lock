            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dcdaaa6ac3b170a1acbace863b7ba8ea6a16608effdfc81146f5e459870912bf"
        },
        {
          "name": "validate_llms_txt",
          "title": "llms.txt validator",
          "description": "Fetches /llms.txt (or the llms.txt address given), validates it against the llmstxt.org proposal (one H1, optional summary, H2 sections of [name](url): notes links), tests up to eight of its links and reports whether llms-full.txt exists. States the evidence on how little the file is read. Free, no key. Docs: https://aeolookup.com/aeo-tools/llms-txt-validator/",
          "inputSchema": {
            "properties": {
              "check_links": {
                "description": "Test up to eight of the file's links that are on its own site (default true).",
                "type": "boolean"
              },
              "url": {
                "description": "The page or site to check, for example https://example.co.uk/ (https:// is added if missing).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
