      "serverInfo": {
        "name": "aeolookup",
        "title": "AEO Lookup free AEO tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free answer-engine-optimisation checks for any public web page, plus business AI calculators. For a site, start with run_aeo_audit, then use the single checks for detail; the checks take a \"url\" and only read public pages. For a business owner asking what AI could save them, use calculate_ai_savings, calculate_ai_time_saved, estimate_ai_staff_impact, check_job_ai_risk or score_ai_readiness: they need no url, return a partial estimate with its sources, and point to a free AI audit for the full breakdown.",
      "tools": [
        {
          "name": "calculate_ai_savings",
          "title": "AI savings calculator",
          "description": "Estimates how much a UK business could save a year by handing admin to AI: a range in pounds from team size, weekly admin hours per person, hourly pay (default the ONS 2025 UK median) and sector exposure (Department for Education ranking), with two or three insights. Partial by design: the free AI audit gives the full breakdown. Free, no key. Docs: https://aeolookup.com/ai-calculators/ai-savings-calculator/",
          "inputSchema": {
            "properties": {
              "admin_hours": {
                "description": "Hours of admin each person does a week (default 10).",
                "maximum": 50,
                "minimum": 0.5,
                "type": "number"
              },
              "hourly_pay": {
                "description": "Average hourly pay in pounds (default 19.67, the UK median).",
                "maximum": 500,
                "minimum": 5,
                "type": "number"
              },
              "industry": {
                "description": "The business sector (default other).",
                "enum": ["accountancy", "legal", "property", "recruitment", "marketing", "it", "consulting", "health", "retail", "education", "hospitality", "trades", "manufacturing", "other"],
                "type": "string"
              },
              "staff": {
                "description": "Number of staff.",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["staff"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1354d21a496208fd297079d25483e512c5673d0b9b277d4a877082e812235f1c"
        },
        {
          "name": "calculate_ai_time_saved",
          "title": "AI time-saved calculator",
          "description": "Estimates the hours a week AI could save one person or a team, from the hours spent on seven everyday task types (email, scheduling, quotes and invoices, data entry, customer questions, documents, marketing), using a share per task informed by IPPR and McKinsey research. Returns a range and the task with the biggest saving. Free, no key. Docs: https://aeolookup.com/ai-calculators/ai-time-saved-calculator/",
          "inputSchema": {
            "properties": {
              "customers": {
                "description": "Hours a week one person spends on answering customer questions (phone, chat, email) (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "data": {
                "description": "Hours a week one person spends on data entry, admin and updating records (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "documents": {
                "description": "Hours a week one person spends on reports, proposals and documents (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "email": {
                "description": "Hours a week one person spends on email and messages (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "marketing": {
                "description": "Hours a week one person spends on social posts, newsletters and marketing copy (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "people": {
                "description": "How many people spend their week like this (default 1).",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "quotes": {
                "description": "Hours a week one person spends on quotes, invoices and chasing payments (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "scheduling": {
                "description": "Hours a week one person spends on scheduling, bookings and reminders (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:93247eacbd79bd4eb25acf92c8e2d7ea464e0fb6012b6a475af7b0d4331e8844"
        },
        {
          "name": "check_ai_crawler_access",
          "title": "AI crawler checker",
          "description": "Checks whether the crawlers behind ChatGPT, Claude, Perplexity, Google AI Overviews, Copilot and 14 more may read a page: robots.txt rules (RFC 9309), robots meta and X-Robots-Tag directives, and whether the site's firewall refuses each crawler's user agent. Separates search and user crawlers (which decide whether you can be cited) from training crawlers (which do not). Free, no key. Docs: https://aeolookup.com/aeo-tools/ai-crawler-checker/",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Optional path to test instead of the URL's own path, for example /blog/.",
                "type": "string"
              },
              "url": {
                "description": "The page or site to check, for example https://example.co.uk/ (https:// is added if missing).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:55252d7e13b5672ef534a0803f9522081cd76e82a84be576f340414bfe4fb422"
        },
        {
          "name": "check_job_ai_risk",
          "title": "Is my job at risk from AI?",
          "description": "Rates a UK occupation's exposure to AI (high, medium or low, following the Department for Education's 2023 ranking), the share of its tasks AI can do today and the tasks it reaches first. Free, no key. Docs: https://aeolookup.com/ai-calculators/is-my-job-at-risk-from-ai/",
          "inputSchema": {
            "properties": {
              "job": {
                "description": "The occupation.",
                "enum": ["management-consultant", "accountant", "solicitor", "telephone-sales", "admin-assistant", "customer-service", "marketing", "hr-officer", "software-developer", "estate-agent", "recruiter", "teacher", "manager", "nurse", "sales-rep", "chef", "care-worker", "electrician", "roofer", "driver", "hairdresser", "cleaner"],
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b81bbe5dfd007a4d8324853888e567109df2d3ca3bdfbdb10311f93ea09e6df8"
        },
        {
          "name": "check_structured_data",
          "title": "Schema checker",
          "description": "Extracts every JSON-LD block on a page, lists the schema.org types it describes, flags missing required and recommended properties (Organization, LocalBusiness, Article, FAQPage, Product, Service, Person, BreadcrumbList, Event) and scores entity signals: a named organisation, sameAs links to other profiles, a logo and an @id. Free, no key. Docs: https://aeolookup.com/aeo-tools/schema-checker/",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The page or site to check, for example https://example.co.uk/ (https:// is added if missing).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cb5358cbc56b0b33a4a6d7bbc6234bbf2308c77b43598e38487de6cd939fec80"
        },
        {
          "name": "estimate_ai_staff_impact",
          "title": "Will AI replace my staff?",
          "description": "Estimates how much of a team's work AI could take on today, as full-time roles' worth of tasks, from headcount in seven role groups, ordered by the Department for Education's exposure ranking. Measures tasks, not people. Free, no key. Docs: https://aeolookup.com/ai-calculators/will-ai-replace-my-staff/",
          "inputSchema": {
            "properties": {
              "admin": {
                "description": "How many people work as admin, reception and office support (default 0).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "customer": {
                "description": "How many people work as customer service and phone sales (default 0).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "finance": {
                "description": "How many people work as bookkeeping, payroll and finance admin (default 0).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "handson": {
                "description": "How many people work as hands-on staff (trades, care, kitchen, warehouse, drivers) (default 0).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "managers": {
                "description": "How many people work as managers and directors (default 0).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "marketing": {
                "description": "How many people work as marketing and content (default 0).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "professional": {
                "description": "How many people work as professionals (accountants, solicitors, consultants, analysts) (default 0).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1ea9f3c29c2926b51165cad2f643526cd76b4551b99df9bb49d1b33cd6c1d7c2"
        },
        {
          "name": "generate_llms_txt",
          "title": "llms.txt generator",
          "description": "Drafts an llms.txt for a site: the name and summary from its home page, then its pages from the sitemap grouped by section, with titles and descriptions read from up to 24 pages. Returns the file as text, for a person to edit before publishing. Free, no key. Docs: https://aeolookup.com/aeo-tools/llms-txt-validator/",
          "inputSchema": {
            "properties": {
              "max_links": {
                "description": "Roughly how many links to include (default 40).",
                "maximum": 100,
                "minimum": 5,
                "type": "integer"
              },
              "url": {
                "description": "The page or site to check, for example https://example.co.uk/ (https:// is added if missing).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:218c4b9b185da152cf4e4feb9bd40387ef0e0f678a64f62d1f383fbd5baac5ed"
        },
        {
          "name": "run_aeo_audit",
          "title": "Full AEO audit",
          "description": "Runs all four checks on one address (AI crawler access, structured data, llms.txt, answer readiness) and returns each result plus an overall score: the mean of the crawler, schema and answer-readiness scores. llms.txt is reported but not scored, because the evidence says few systems read it. Free, no key. Docs: https://aeolookup.com/aeo-tools/api/",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The page or site to check, for example https://example.co.uk/ (https:// is added if missing).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:be6afc8ea4591dd40c68abb7cf76b5dad2d68af045c35335c0c3870999848f81"
        },
        {
          "name": "score_ai_readiness",
          "title": "AI readiness score",
          "description": "Scores how ready a small business is to put AI tools to work, out of 100, from eight yes or no questions (digital records, one customer system, written processes, known repetitive tasks, current AI use, an owner, a clear website, time to bed in), and names the two biggest gaps. Free, no key. Docs: https://aeolookup.com/ai-calculators/ai-readiness-score/",
          "inputSchema": {
            "properties": {
              "digital": {
                "description": "Most of your business records are in software, not on paper or in heads (15 points).",
                "type": "boolean"
              },
              "onePlace": {
                "description": "Customer details live in one system (a CRM, booking or accounts tool), not scattered across inboxes (15 points).",
                "type": "boolean"
              },
              "owner": {
                "description": "One person is responsible for trying AI in the business (10 points).",
                "type": "boolean"
              },
              "processes": {
                "description": "Your routine jobs (quoting, booking, onboarding, invoicing) follow written steps (15 points).",
                "type": "boolean"
              },
              "repetitive": {
                "description": "You can name the three most repetitive tasks in your week (10 points).",
                "type": "boolean"
              },
              "time": {
                "description": "You could give a new tool two or three hours a week for a month to bed in (15 points).",
                "type": "boolean"
              },
              "using": {
                "description": "Someone on the team already uses an AI assistant such as ChatGPT or Copilot every week (10 points).",
                "type": "boolean"
              },
              "website": {
                "description": "Your website answers customers' common questions clearly, so AI assistants can find and quote you (10 points).",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1ad3b9eba811b8945dbf830a632de4b2adbce724283dd6c9da45a337090d17ef"
        },
        {
          "name": "score_answer_readiness",
          "title": "Answer-readiness checker",
          "description": "Scores a page out of 100 on 14 published checks: indexable, title and description, one H1, question headings, direct first-sentence answers, structured data, dates, a named author, lists and tables, source links, specific figures, length, declared language and stock AI phrasing. Returns each check's points, what it found and the fix, ordered by points available. Free, no key. Docs: https://aeolookup.com/aeo-tools/answer-readiness-checker/",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The page or site to check, for example https://example.co.uk/ (https:// is added if missing).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
