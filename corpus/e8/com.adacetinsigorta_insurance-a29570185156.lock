      },
      "instructions": "Insurance agency connector: quotes from the insurance companies the agency works with, offer selection and the link to the agency's payment page. A quote takes two steps: list_products gives the products, and start_quote with the chosen product follows as soon as the product is known (it needs no personal details up front). In clients that show apps, start_quote answers `status: awaiting_form` and opens the agency's secure form in the chat. The form collects identity, vehicle or property details and sends them to the agency directly, so they do not enter the chat history: while the form is open, its fields, identity numbers, dates of birth and other personal data are entered in the form, not collected in the chat. Only when no form can be shown (start_quote returns field errors instead of a form), the missing fields are collected in the chat one by one. Card details are never part of the chat; payment happens only on the agency's payment page. This connector has no price estimates: it gives no estimated, average or typical premium and no price range, and figures from memory, the web or other sites are not prices for this user. The only prices are the offers of a quote run started for this user; each offer is presented with the note that its price applies only to this person and this quote. A question about what insurance would cost is answered by starting a quote, not by an estimate.",
      "tools": [
        {
          "name": "get_payment_link",
          "title": "Ödeme bağlantısı",
          "description": "Creates the link to the agency's payment page for the selected offer. After this the selection of the run can no longer be changed. Card details are never part of the chat; payment happens only on the linked page. Needs the policyholder's date of birth (18 or older) unless the policyholder is a company. When the quote card is open, payment continues from the card, so this tool is not needed again.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "quoteRef": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["quoteRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ödeme bağlantısı"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://adacetin/quote.83c6449d.html"
            }
          },
          "digest": "sha256:0306d54bf234a0272586eff231101370da4014532790cbb54581317b5a522025"
        },
        {
          "name": "get_quote_status",
          "title": "Teklif durumu",
          "description": "Returns the state of a quote run: its offers (each with an `offerRef` and its `coverages`: the company's coverage lines as `title` and `value`; offers also differ in their main coverages, not only in price), the companies that gave no offer with the reason (`failures[].reason`, `category`, `retryable`, `fields`), the selected offer, and the payment and policy state. Offers that already arrived are listed while quoting is still running. It waits up to `waitSeconds` (default 20) for the run to finish; if it is still running the answer has `status: quoting`, the `pending` companies and a `next` hint, and calling this tool again with the same `quoteRef` keeps waiting for the run, so no user message is needed in between. Changes nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "quoteRef": {
                "description": "`quoteRef` from start_quote.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "waitSeconds": {
                "description": "While quoting is still running, wait up to this many seconds for it to finish before answering (default 20, max 25; 0 = answer at once).",
                "maximum": 25,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["quoteRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Teklif durumu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://adacetin/quote.83c6449d.html"
            }
          },
          "digest": "sha256:ff2c37d27adbc017f9b8f8b1af8c64f795f80c50cd63b54777894e3c0d2f6dfb"
        },
        {
          "name": "list_products",
          "title": "Ürünleri listele",
          "description": "Lists the insurance products a quote can be requested for, with the quote form fields of each (path, label, required, options). Fields with `input: \"lookup\"` take a code from a list, which search_field_options returns; `dependsOn` lists the fields whose values that list needs first. No sign-in needed. Returns no personal data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ürünleri listele"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc1740e789c2a0ce7c18115ed0ec7102bbeb2f2e8363ee8f9823ded1769de9ae"
        },
        {
          "name": "search_field_options",
          "title": "Liste seçeneklerini ara",
          "description": "Searches the options of a list field (`input: \"lookup\"` in list_products), such as occupation, brand, model, usage type or coverage limit. Returns up to 20 `{ value, label }`; the `value` (code) is what start_quote takes. Search is case- and accent-insensitive Turkish. Without `query` it returns the first options (a short list comes back complete; `truncated: true` means more options exist and a narrower `query` finds them). If nothing in a short list matches, all its options come back with `noMatch: true`, so the user can pick the one that fits. A field with `dependsOn` needs those fields' codes in `context`. No sign-in needed. Returns no personal data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 200,
                      "type": "string"
                    },
                    {
                      "type": "number"
                    }
                  ]
                },
                "description": "Codes of the fields in `dependsOn`, keyed by field path, e.g. { \"arac.modelYear\": 2020, \"arac.usageStyle\": \"01\", \"arac.marka\": \"045\" }.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "field": {
                "description": "Field `path` from list_products (a field with `input: \"lookup\"`).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "product": {
                "description": "Product key (`product` from list_products).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Text to search in option labels, e.g. \"audi\" or \"sigortacı\". Omit to get the first options.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["field", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Liste seçeneklerini ara"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb0cb868f5910b97610499a437120557920b27c6362792b5040c9bbd4c01fc64"
        },
        {
          "name": "select_offer",
          "title": "Teklif seç",
          "description": "Selects one offer (`offerRef`) of a quote run. Replaces an earlier selection of the same run. Premium and validity are read from the stored offer, not from the input.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "offerRef": {
                "description": "`offerRef` of the offer to select.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "quoteRef": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["offerRef", "quoteRef"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Teklif seç"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://adacetin/quote.83c6449d.html"
            }
          },
          "digest": "sha256:248ff8b005729be2e05040faa34202e4eabee358d3ad08e483250475562fb4ba"
        },
        {
          "name": "start_quote",
          "title": "Teklif al",
          "description": "Requests quotes for one product from the insurance companies the agency works with. `fields` uses the field paths from list_products; `input: \"lookup\"` fields take the option `value` from search_field_options (a label is accepted only when it matches exactly one option, otherwise the error lists `candidates` for the user to choose from). Waits up to about 20 seconds; if quoting is still running it returns `status: quoting` with the `pending` companies, and get_quote_status continues the same run (it waits for it), so no user message is needed in between. The same request repeated within 10 minutes is not sent to the companies again. The policyholder must be 18 or older. Prices are set by the insurance companies.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fields": {
                "additionalProperties": {},
                "description": "Quote form values, nested by the field paths from list_products (`insurer.kimlikNo` → `{ insurer: { kimlikNo } }`).",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "product": {
                "description": "Product key (`product` from list_products).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["fields", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Teklif al"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
