{
  "lockfileVersion": 2,
  "subjects": {
    "ai.a2uicatalog/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://a2uicatalog.ai/mcp-docs"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "a2uicatalog-docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search this product's own documentation — auth, versioning, pricing, the API surface, and the runbook catalog. This server answers questions FROM docs; it does not take product actions (compose/render/publish) — use the separate a2uicatalog product MCP server at https://a2uicatalog.ai/mcp for that. Call search_docs(query) first; call list_docs() to browse the full indexed set without a query.",
      "tools": [
        {
          "name": "list_docs",
          "description": "Use this to browse everything the documentation index holds when you have no specific query, or to see what topics exist before searching. Returns the indexed sections as entries of title, section and url, up to max_results.",
          "inputSchema": {
            "properties": {
              "max_results": {
                "description": "Max entries to return. Omit for all.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "docs": {
                "description": "Indexed sections.",
                "items": {
                  "additionalProperties": true,
                  "description": "A section.",
                  "properties": {
                    "section": {
                      "description": "Docs area.",
                      "type": "string"
                    },
                    "title": {
                      "description": "Section title.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Source URL.",
                      "type": "string"
                    }
                  },
                  "required": ["section", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Total sections in the index.",
                "type": "integer"
              }
            },
            "required": ["docs", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "list_docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:419ab806707ebfada5fc071e55ff48aac3bf496c224c1fcbccd08db7d0095966"
        },
        {
          "name": "search_docs",
          "description": "Use this to answer a question about the product (auth, versioning, pricing, API surface, runbook catalog) from its own documentation, given a plain-English query. Returns {results}: ranked sections, each with title, section, a text snippet, a score and the real source URL, never fabricated content; empty if nothing matches.",
          "inputSchema": {
            "properties": {
              "max_results": {
                "description": "Max results to return. Default 5.",
                "type": "integer"
              },
              "query": {
                "description": "Plain-English question or keywords.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "note": {
                "description": "Set when nothing matched.",
                "type": "string"
              },
              "results": {
                "description": "Ranked sections, best first.",
                "items": {
                  "additionalProperties": true,
                  "description": "A section.",
                  "properties": {
                    "score": {
                      "description": "Match score.",
                      "type": "number"
                    },
                    "section": {
                      "description": "Docs area.",
                      "type": "string"
                    },
                    "snippet": {
                      "description": "Excerpt around the match.",
                      "type": "string"
                    },
                    "title": {
                      "description": "Section title.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Source URL.",
                      "type": "string"
                    }
                  },
                  "required": ["score", "section", "snippet", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "search_docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6d32f58ec945e057bb77cdbd79117a8d68f128f89580e6f8d61ac234c63b0f2"
        }
      ],
      "digest": "sha256:5ff89d5f8a7855f090c21885d4431ba6671d946b23a11600c84756819613c64b"
    }
  }
}
