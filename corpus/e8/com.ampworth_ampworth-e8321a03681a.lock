                "description": "Peak load per square metre of floor, where a floor area was given. A useful sanity check.",
                "type": "number"
              }
            },
            "required": ["annualHeatDemandKwh", "annualHotWaterKwh", "annualSpaceHeatingKwh", "basis", "basisNote", "dailyHotWaterLitres", "designBasis", "externalDesignTemp", "flowTemperature", "heatLossCoefficientWPerK", "heatPumpElectricityKwh", "heatingDegreeDays", "hotWaterFromSummerUse", "internalTemp", "location", "method", "notes", "peakHeatLossKw", "references", "scop", "scopAssumed", "temperatureDifference", "warning"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
