        },
        {
          "name": "heat_pump_size",
          "title": "What size heat pump do I need?",
          "description": "Estimate the heat pump a UK house needs, and what it would cost to run against the\nfuel it burns now.\n\nIMPORTANT: MIS 3005-D requires a heat pump to be sized from a room-by-room heat loss calculation to\nBS EN 12831, and nothing here replaces that. Say so whenever you report a result from this, and point\nthe user at the room-by-room calculation. What the figure is for is checking whether a size somebody\nhas been quoted is plausible, because oversizing is the commonest fault in heat pump installations and\nit is invisible to the person living with it.\n\nThere are two routes and the first is much the better one.\n\nFrom metered fuel, which is preferred: give 'annualFuelUse' from a year of bills. The fuel becomes heat\ndelivered, hot water comes off it using the MIS 3005-D formula, and what remains divided by the local\nheating degree days gives the building's heat loss coefficient in watts per kelvin. Degree days are\ncomputed from the Met Office monthly means published in MGD 007 section 5.\n\nFrom the fabric, as a fallback when there are no bills: give 'floorAreaM2', an 'insulation' level and a\n'propertyType'. The watts per kelvin per square metre behind this are a reasonable reading of British\nhousing stock but they are NOT MCS figures, because MCS publishes no such shortcut. Say so when using\nthis route.\n\nEither way the peak load is the coefficient multiplied by the design temperature difference for the\nlocation, from Table 2 of MIS 3005-D. The heat pump must deliver at least that at the design outside\ntemperature and the design flow temperature, which is not the same as its headline rating.\n\nThe result also compares what each of four flow temperatures would cost to run, which is the decision\nthat governs the bill and the one a quotation most often leaves unstated. Supply 'quotedHeatPumpKw' to\nhave a quoted size checked against the estimate.\n\nMethod from MIS 3005-D. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualFuelUse": {
                "description": "How much of that fuel the house burns in a year, in its own unit: kWh for gas and electricity, litres for oil and LPG, kilograms for coal. Give this if it is known: it describes the actual house and is far better than the fabric estimate.",
                "type": "number"
              },
              "applianceEfficiency": {
                "description": "Seasonal efficiency of the existing boiler as a decimal. Defaults to a realistic figure for the fuel instead of the one on the badge.",
                "type": "number"
              },
              "bedrooms": {
                "description": "Number of bedrooms, for the hot water demand. Defaults to 3.",
                "type": "integer"
              },
              "designBasis": {
                "description": "'a' for the 99% outside design temperature or 'b' for the colder 99.6% one. Defaults to 'a'.",
                "type": "string"
              },
              "electricityPricePerKwh": {
                "description": "Price of a unit of electricity, in pounds. Optional.",
                "type": "number"
              },
              "floorAreaM2": {
                "description": "Total heated floor area in square metres, over all storeys. Used only when no fuel figure is given.",
                "type": "number"
              },
              "flowTemperature": {
                "description": "The flow temperature the system would be designed around: 35, 45, 50 or 55. Defaults to 45. This is the single biggest influence on running cost.",
                "type": "number"
              },
              "fuel": {
                "description": "The fuel the house is heated with now: 'mains_gas', 'oil', 'lpg', 'electricity' or 'coal'. Defaults to 'mains_gas'.",
                "type": "string"
              },
              "fuelPricePerUnit": {
                "description": "Price of one unit of the current fuel, in pounds. Optional; supplying it and the electricity price gives a running cost comparison.",
                "type": "number"
              },
              "insulation": {
                "description": "How well insulated the building is: 'solid', 'cavity_unfilled', 'insulated', 'modern' or 'very_efficient'. Used only with floorAreaM2.",
                "type": "string"
              },
              "internalTemp": {
                "description": "Whole-house mean internal design temperature in Celsius. Defaults to 20, which is a reasonable average of the room-by-room figures in MIS 3005-D Table 1.",
                "type": "number"
              },
              "location": {
                "description": "Nearest of the eight tabulated locations: 'belfast', 'birmingham', 'cardiff', 'edinburgh', 'glasgow', 'london', 'manchester' or 'plymouth'. Required.",
                "type": "string"
              },
              "nonHeatingFraction": {
                "description": "Share of that fuel used for something other than heating and hot water, such as a gas hob, as a decimal. A hob is usually 0.03 to 0.05. Defaults to 0.",
                "type": "number"
              },
              "occupants": {
                "description": "Number of people living there, if known. MIS 3005-D takes the greater of this and bedrooms plus one.",
                "type": "integer"
              },
              "propertyType": {
                "description": "'detached', 'semi', 'end_terrace', 'mid_terrace', 'flat' or 'bungalow'. Used only with floorAreaM2. Defaults to 'semi'.",
                "type": "string"
              },
              "quotedHeatPumpKw": {
                "description": "The output of a heat pump somebody has quoted, in kW. Optional; supplying it says whether that size looks plausible against this estimate.",
                "type": "number"
              },
              "scop": {
                "description": "Seasonal coefficient of performance of the proposed heat pump, if it is known from the MCS Product Directory. Defaults to an indicative figure for the chosen flow temperature.",
                "type": "number"
              },
              "summerMonthFuelUse": {
                "description": "Fuel used in a single summer month, in the same unit, when the heating is off. Give this if it can be found: almost all of it is hot water, so it separates hot water from space heating exactly and removes the biggest assumption in the estimate.",
                "type": "number"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualDifference": {
                "description": "Positive when the heat pump costs less.",
                "type": "number"
              },
              "annualHeatDemandKwh": {
                "type": "number"
              },
              "annualHotWaterKwh": {
                "type": "number"
              },
              "annualSpaceHeatingKwh": {
                "type": "number"
              },
              "basis": {
                "type": "string"
              },
              "basisNote": {
                "type": "string"
              },
              "breakEvenScop": {
                "description": "The seasonal efficiency at which the two cost the same.",
                "type": "number"
              },
              "currentAnnualCost": {
                "type": "number"
              },
              "dailyHotWaterLitres": {
                "type": "number"
              },
              "designBasis": {
                "type": "string"
              },
              "externalDesignTemp": {
                "type": "number"
              },
              "flowTemperature": {
                "type": "number"
              },
              "flowTemperatureCosts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "annualCost": {
                      "type": "number"
                    },
                    "chosen": {
                      "type": "boolean"
                    },
                    "description": {
                      "type": "string"
                    },
                    "electricityKwh": {
                      "type": "number"
                    },
                    "flowTemperature": {
                      "type": "number"
                    },
                    "indicativeScop": {
                      "type": "number"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["chosen", "description", "electricityKwh", "flowTemperature", "indicativeScop", "label"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "heatLossCoefficientWPerK": {
                "description": "How many watts the building loses for every degree between inside and outside. The figure everything else follows from.",
                "type": "number"
              },
              "heatPumpAnnualCost": {
                "type": "number"
              },
              "heatPumpElectricityKwh": {
                "type": "number"
              },
              "heatingDegreeDays": {
                "type": "number"
              },
              "hotWaterFromSummerUse": {
                "description": "True when a summer month's fuel separated hot water from space heating, instead of an allowance standing in for it.",
                "type": "boolean"
              },
              "internalTemp": {
                "type": "number"
              },
              "location": {
                "additionalProperties": false,
                "properties": {
                  "altitudeM": {
                    "type": "integer"
                  },
                  "annualMeanTemp": {
                    "type": "number"
                  },
                  "designTempA": {
                    "description": "Hourly dry-bulb temperature exceeded for 99% of the hours in a year.",
                    "type": "number"
                  },
                  "designTempB": {
                    "description": "The colder 99.6% figure. Using it removes the need for any uplift for intermittent heating.",
                    "type": "number"
                  },
                  "heatingDegreeDays": {
                    "type": "number"
                  },
                  "metOfficeStation": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["altitudeM", "annualMeanTemp", "designTempA", "designTempB", "heatingDegreeDays", "metOfficeStation", "name"],
                "type": "object"
              },
              "method": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "peakHeatLossKw": {
                "description": "The space heating load at the design outside temperature. The heat pump must deliver at least this, at the design flow temperature, without help from an immersion heater.",
                "type": "number"
              },
              "quotedSizeCheck": {
                "additionalProperties": false,
                "properties": {
                  "plausible": {
                    "description": "False when the quoted unit looks considerably larger than the house appears to need, which is worth questioning.",
                    "type": "boolean"
                  },
                  "quotedKw": {
                    "type": "number"
                  },
                  "ratioToEstimate": {
                    "description": "The quoted output divided by the estimated peak load.",
                    "type": "number"
                  },
                  "verdict": {
                    "type": "string"
                  }
                },
                "required": ["plausible", "quotedKw", "ratioToEstimate", "verdict"],
                "type": ["null", "object"]
              },
              "references": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clause": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["document", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "scop": {
                "type": "number"
              },
              "scopAssumed": {
                "description": "True when an indicative figure stood in for a real one from the product directory.",
                "type": "boolean"
              },
