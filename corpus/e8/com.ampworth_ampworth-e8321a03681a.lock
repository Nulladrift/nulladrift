        {
          "name": "room_heat_loss",
          "title": "Room heat loss",
          "description": "Calculate the design heat loss of a single room in watts, following BS EN 12831 as\nMIS 3005-D applies it. This is the figure a heat pump is sized from and the figure the radiator in\nthat room must be able to deliver.\n\nBS EN 12831 is a room-by-room method. Run this once for each heated room and add the results; sizing\na heat pump from floor area alone is what produces the oversized installations that cycle all winter.\n\nInternal design temperatures come from Table 1 of MIS 3005-D and follow from the room type: 22 for a\nbathroom, 21 for living and dining rooms, 18 for bedrooms, halls, kitchens and toilets. These are\nminimums, so a higher figure is accepted and a lower one is refused.\n\nExternal design temperatures come from Table 2, for eight locations, in two columns: 'a' is the 99%\nfigure and 'b' the colder 99.6% one, which needs no uplift for intermittent heating.\n\nEach element needs an area, a U-value, and a kind. The kind matters because it fixes which temperature\ndifference applies. Walls, windows, doors, roofs and suspended floors lose heat to the outside design\ntemperature. A SOLID FLOOR ON THE GROUND loses heat to the local annual average air temperature\ninstead, which is far warmer, and getting this wrong is the commonest error in a heat loss calculation.\nWindow and door areas belong to the window and the door, not to the wall behind them.\n\nMethod from MIS 3005-D. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airChangesPerHour": {
                "description": "How many times an hour the air in the room is replaced. A draughty old room may be 1.5 or more; a well sealed new one 0.5. Defaults to 1.",
                "type": "number"
              },
              "ceilingHeightM": {
                "description": "Floor to ceiling height in metres. Defaults to 2.4.",
                "type": "number"
              },
              "designBasis": {
                "description": "'a' for the 99% outside design temperature or 'b' for the colder 99.6% figure. Column B needs no uplift for intermittent heating. Defaults to 'a'.",
                "type": "string"
              },
              "elements": {
                "description": "Every surface through which the room loses heat. At least one is required.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "areaM2": {
                      "description": "Area of the element in square metres. Window and door areas are taken out of the wall area, not counted twice. Required.",
                      "type": "number"
                    },
                    "kind": {
                      "description": "One of 'external_wall', 'window', 'door', 'roof', 'suspended_floor', 'ground_floor' or 'unheated_space'. Required.",
                      "type": "string"
                    },
                    "label": {
                      "description": "A name for this element, so the result can be read back against the survey.",
                      "type": "string"
                    },
                    "uValue": {
