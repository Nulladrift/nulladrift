        {
          "name": "solar_pv_self_consumption",
          "title": "Solar PV self-consumption",
          "description": "Estimate what proportion of a domestic solar PV system's annual output is consumed in\nthe house and what proportion is exported, using the lookup tables in MGD 003.\n\nThe tables are not a model. They come from half-hourly monitoring of real British households by\nLoughborough University, with battery behaviour modelled on top, so they carry the real shape of\ndomestic demand: a peak before the sun is up, another after it has gone, and a quiet middle of the day.\n\nThree things index them. The annual generation, which comes from the MIS 3002 output estimate. The\nhousehold's annual consumption from a bill based on actual meter readings, which defaults to the\nBritish average of 3,500 kWh where it is unknown. And the weekday occupancy pattern, which is\n'home_all_day', 'in_half_the_day' or 'out_all_day'; where the pattern is unknown MGD 003 says to use\nthe middle one, and that is what an omitted value resolves to.\n\nBattery capacity is the USABLE capacity, which is smaller than the figure printed on the battery.\nSupplying import and export prices adds a value in pounds to the result.\n\nNote that self-consumption is not the same as independence from the grid, and the result reports both.\n\nMethod from MGD 003. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualConsumptionKwh": {
                "description": "The household's annual electricity consumption in kWh, from a bill based on actual meter readings. Defaults to 3500, which MGD 003 uses where the figure is unknown.",
                "type": "number"
              },
              "annualGenerationKwh": {
                "description": "Expected annual AC output of the PV system in kWh, as produced by the MIS 3002 estimation method. Required.",
                "type": "number"
              },
              "batteryKwh": {
                "description": "Usable capacity of any battery in kWh, which is smaller than the headline capacity. Omit or use 0 for no battery.",
                "type": "number"
              },
              "exportPricePerKwh": {
                "description": "What the household is paid for a unit exported, in pounds. Optional.",
                "type": "number"
              },
              "importPricePerKwh": {
                "description": "What the household pays for a unit of grid electricity, in pounds. Optional; supplying it adds a value to the result.",
                "type": "number"
              },
              "occupancy": {
                "description": "Weekday occupancy pattern: 'home_all_day', 'in_half_the_day' or 'out_all_day'. Defaults to 'in_half_the_day', which is what MGD 003 says to use when the pattern is unknown.",
                "type": "string"
              }
            },
            "required": ["annualGenerationKwh"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualBillSaving": {
                "description": "Value of the units not bought, in pounds. Only present when an import price was given.",
                "type": "number"
              },
              "annualConsumptionKwh": {
                "type": "number"
              },
              "annualExportIncome": {
                "description": "Value of the units exported, in pounds. Only present when an export price was given.",
                "type": "number"
              },
              "annualGenerationKwh": {
                "type": "number"
              },
              "annualValue": {
                "description": "The two added together.",
                "type": "number"
              },
              "batteryGainKwh": {
                "description": "Extra units kept in the house each year because of the battery.",
                "type": "number"
              },
              "batteryKwh": {
                "type": "number"
              },
              "consumptionAssumed": {
                "description": "True when the 3500 kWh default stood in for a figure the caller did not give.",
                "type": "boolean"
              },
              "exportedKwh": {
                "type": "number"
              },
              "gridIndependencePercent": {
                "description": "Proportion of the household's own consumption met by the system instead of by the grid. Different from self-consumption, and usually smaller.",
                "type": "number"
              },
              "importedKwh": {
                "description": "Units still bought from the grid over the year.",
                "type": "number"
              },
              "method": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "occupancy": {
                "type": "string"
              },
              "occupancyLabel": {
                "type": "string"
              },
              "references": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clause": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["document", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "selfConsumedKwh": {
                "type": "number"
              },
              "selfConsumptionPercent": {
                "description": "Proportion of generation used in the home instead of exported.",
                "type": "number"
              },
              "withoutBatteryPercent": {
                "description": "What the same system would self-consume with no battery.",
                "type": "number"
              }
            },
            "required": ["annualConsumptionKwh", "annualGenerationKwh", "batteryKwh", "consumptionAssumed", "exportedKwh", "gridIndependencePercent", "importedKwh", "method", "notes", "occupancy", "occupancyLabel", "references", "selfConsumedKwh", "selfConsumptionPercent", "withoutBatteryPercent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
