      "instructions": "Ampworth covers homes in the United Kingdom only. Its methods come from the published MCS standards, and the network connection route from the ENA's G98 and G99. Don't apply them to another country: say the tools don't cover it.\n\nEvery answer is for understanding a system or checking a quotation, not a design. Say that an installation still needs a survey and a design from a certified installer. Ampworth recommends no installer; to find one, point to https://mcscertified.com/find-an-installer/.\n\nAsk for a required input rather than guessing it, especially a postcode, a roof direction or a year of energy use. When an answer relies on a default, say which one. Pass on the figures, the standard and the warnings each result returns.\n\nCalculators:\n- When someone asks what system they need, start with solar_pv_system_size or heat_pump_size. Use the single-method tools to check a figure they already have.\n- To check a quoted heat pump, give its output to heat_pump_size as quotedHeatPumpKw.\n- When a field must be one of a fixed set, such as a design location, room type or fuel, call list_calculators for the values.\n- Prices are in pounds per unit (0.27, not 27p), and efficiencies and fractions are decimals (0.85, not 85%).\n\nDocuments:\n- For an explanation, call search_documents, then get_document for the best match, and answer from it. Link to the page's url, not the Markdown copy.\n- Articles are marked beginner, intermediate or advanced. Match the level to the person asking.\n\nWhen a question needs both, calculate first, then use the documents to explain the result and what to ask an installer.",
      "tools": [
        {
          "name": "connection_route",
          "title": "Network connection route",
          "description": "Work out which ENA connection procedure a domestic installation of solar panels,\nbatteries or both falls under: connect first and notify the distribution network operator within 28\ndays, or apply and wait for approval before anything is connected.\n\nThe rules are the ENA's engineering recommendations, not MCS documents: EREC G98 for small\ninstallations, EREC G99 for everything larger, and EREC G100 for export limitation. Every test is in\namps per phase at a nominal 230 V, and it applies to the premises as a whole, so list EVERY inverter\nthat can export, existing ones included. A battery counts as generation even if it only ever charges\nfrom the panels.\n\nThe figure that counts is each inverter's registered capacity: its AC rating, or a lower limit the\nmanufacturer has fixed. It is NOT the panels' kWp. A 4.4 kWp array on a 3.68 kW inverter is a 3.68 kW\ninstallation. Where an inverter has been capped below its hardware rating, give the hardware rating as\n'designCapacityKw', because G99 tests that separately.\n\nThe routes are: G98 when the total is 16 A per phase or less (3.68 kW single phase, 11.04 kW three\nphase); G99 SGI-1, also connect and notify, when the total is within 16 A but an inverter built for up\nto 32 A has been capped; G99 SGI-2 and SGI-3, fast track applications answered within 10 working days,\nwhich allow larger totals held back by a type-tested export limiter; and the standard G99 application\nfor anything else. An export limiter NEVER brings an installation under G98.\n\nIMPORTANT: this says which procedure applies, not what the operator will decide. Approval depends on\nthe local network, which only the operator can assess. Say so whenever you report a result.\n\nMethod from EREC G98 / G99. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "devices": {
                "description": "Every inverter at the premises that can export: solar, battery and hybrid, existing ones included. A battery counts even if it only charges from the panels. At least one is required.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "designCapacityKw": {
                      "description": "What the inverter was built to deliver before any fixed limit, in kW AC: G99 calls this the intrinsic design capacity. Only differs from 'registeredCapacityKw' for an inverter capped below its hardware rating. Defaults to the registered capacity.",
                      "type": "number"
                    },
                    "existing": {
                      "description": "True for a device that is already installed. It still counts toward the total. Defaults to false.",
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "'solar' for a solar inverter, 'battery' for an AC-coupled battery inverter, 'hybrid' for one inverter serving both panels and battery, or 'other'. Required.",
                      "type": "string"
                    },
                    "label": {
                      "description": "A name for this device, for the breakdown.",
                      "type": "string"
                    },
                    "phase": {
                      "description": "On a three phase supply, which phase the device is connected to: 'L1', 'L2', 'L3', or 'all' for a three phase inverter, which is split evenly. Ignored on a single phase supply. Defaults to 'L1'.",
                      "type": "string"
                    },
                    "registeredCapacityKw": {
                      "description": "The most the device can export, in kW AC: the inverter's rated output, or a lower limit the manufacturer has fixed so the customer cannot change it. From the datasheet or the ENA type test register. Not the panels' kWp. Required.",
                      "type": "number"
                    }
                  },
                  "required": ["kind", "registeredCapacityKw"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "exportLimitKw": {
                "description": "The export limit a fully type-tested G100 scheme would hold the premises to, in kW per phase, where one is proposed. Optional. An export limit never brings an installation under G98, but it decides which G99 route applies.",
                "type": "number"
              },
              "otherInstallationsNearby": {
                "description": "True when the same installer has fitted, or plans to fit, generation at other premises within 500 metres, or on the same street, within 28 days either side. That turns a G98 notification into an application. Defaults to false.",
                "type": "boolean"
