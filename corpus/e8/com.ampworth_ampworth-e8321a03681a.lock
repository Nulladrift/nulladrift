        {
          "name": "solar_pv_system_size",
          "title": "What size solar system do I need?",
          "description": "Work out the solar PV system a UK home needs: the capacity in kWp, the number of\npanels, the battery to go with it, and what it would do to the electricity bill.\n\nThis runs the MCS arithmetic backwards. The other solar calculators here each answer one question\nabout a system somebody has already specified. This one starts from what a household uses and\narrives at the system that covers it, which is the question a householder actually has.\n\nThe chain is short and every link is published. Annual consumption sets the generation the array has\nto make. The MCS irradiance dataset behind MIS 3002 says what one kWp makes on that roof, which gives\na capacity. Capacity divided by panel size gives a panel count, rounded up, because panels come whole.\nThe MGD 003 tables then say how much of that generation the household will use and how much it will export.\n\nOnly the postcode and the roof direction are required. Direction is a compass point, not an angle:\n'S', 'SE', 'SW', 'E', 'W', 'NE', 'NW' or 'N'. Give the annual consumption from a bill if it is known,\nsince the 3,500 kWh default is only the British average. Shading can be described in words instead of\nmeasured, and a roof area caps the panel count where the roof is the constraint.\n\nNo cost is assumed. Installed prices vary far too much between houses to guess at, so a payback figure\nappears only when a cost from a real quotation is supplied.\n\nUse this to size a system or to sanity-check a quotation. Use 'solar_pv_output' instead when the\ncapacity is already known and the question is only what it will generate.\n\nMethod from MIS 3002. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualConsumptionKwh": {
                "description": "The household's electricity use in kWh a year, from a bill. Defaults to 3500, which is the British average and the figure MGD 003 falls back on, but a real bill sharpens the answer considerably.",
                "type": "number"
              },
              "batteryModuleKwh": {
                "description": "Nominal capacity of one battery module in kWh. Batteries are sold in whole modules, so the answer rounds up to one. Defaults to 5.",
                "type": "number"
              },
              "direction": {
                "description": "Compass point the roof faces: 'S', 'SE', 'SW', 'E', 'W', 'NE', 'NW' or 'N'. Required.",
                "type": "string"
              },
              "electricityPricePerKwh": {
                "description": "What the household pays for a unit, in pounds. Optional; supplying it puts a value on the answer.",
                "type": "number"
              },
              "exportPricePerKwh": {
                "description": "What the household is paid for a unit exported, in pounds. Optional.",
                "type": "number"
              },
              "inclination": {
                "description": "Roof pitch in degrees from horizontal. Defaults to 35, which is typical of a British pitched roof. A flat roof is 0.",
                "type": "number"
              },
              "includeBattery": {
                "description": "Whether to size a battery alongside the panels. Defaults to false.",
                "type": "boolean"
              },
              "installedCost": {
                "description": "The installed cost of the system in pounds, from a quotation. Optional; supplying it gives a payback period. No cost is assumed if it is left out, because prices vary too much to guess at.",
                "type": "number"
              },
              "occupancy": {
                "description": "Weekday occupancy: 'home_all_day', 'in_half_the_day' or 'out_all_day'. Decides how much of the generation is used at home instead of exported. Defaults to 'in_half_the_day'.",
                "type": "string"
              },
              "panelWatts": {
                "description": "Nameplate rating of a single panel in watts. Defaults to 440, which is typical of a current domestic module.",
                "type": "number"
              },
              "postcode": {
                "description": "UK postcode of the property, for example 'BS1 5TR'. Only the outward code matters. Required.",
                "type": "string"
              },
              "roofAreaM2": {
                "description": "Shade-free roof area available for panels, in square metres. Optional; when given it caps the number of panels.",
                "type": "number"
              },
              "shadeFactor": {
                "description": "A measured shade factor between 0.5 and 1 from an MGD 005 assessment. Overrides 'shading' when given.",
                "type": "number"
              },
              "shading": {
                "description": "How much shading the roof has, in words: 'none', 'light', 'moderate' or 'heavy'. Defaults to 'none'. Use 'shadeFactor' instead if a proper MGD 005 assessment has been done.",
                "type": "string"
              }
            },
            "required": ["direction", "postcode"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualBenefit": {
                "description": "Bill saving plus export income.",
                "type": "number"
              },
              "annualBillSaving": {
                "type": "number"
              },
              "annualConsumptionKwh": {
                "type": "number"
              },
              "annualExportIncome": {
                "type": "number"
              },
              "annualGenerationKwh": {
                "type": "number"
              },
              "battery": {
                "additionalProperties": false,
                "properties": {
                  "averageDailyConsumptionKwh": {
                    "type": "number"
                  },
                  "extraKwhKeptAtHome": {
                    "type": "number"
                  },
                  "moduleKwh": {
                    "type": "number"
                  },
                  "modules": {
                    "type": "integer"
                  },
                  "nominalKwh": {
                    "type": "number"
                  },
                  "selfConsumptionGainPercent": {
                    "description": "Percentage points of self-consumption the battery adds.",
                    "type": "number"
                  },
                  "usableKwh": {
                    "description": "What the battery will actually give back, which is what MGD 003 is indexed on.",
                    "type": "number"
                  }
                },
                "required": ["averageDailyConsumptionKwh", "extraKwhKeptAtHome", "moduleKwh", "modules", "nominalKwh", "selfConsumptionGainPercent", "usableKwh"],
                "type": ["null", "object"]
              },
              "capacityKwp": {
                "description": "The installed capacity: the panel count multiplied by the panel rating.",
                "type": "number"
              },
              "consumptionAssumed": {
                "description": "True when the 3500 kWh default stood in for a figure the caller did not give.",
                "type": "boolean"
              },
              "currentAnnualCost": {
                "type": "number"
              },
              "direction": {
                "additionalProperties": false,
                "properties": {
                  "key": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "orientation": {
                    "description": "Degrees from due south, as MIS 3002 measures it.",
                    "type": "number"
                  }
                },
                "required": ["key", "label", "orientation"],
                "type": "object"
              },
              "exportedKwh": {
                "type": "number"
              },
              "generationAsPercentOfUse": {
                "description": "Annual generation as a percentage of annual consumption. Above 100 means the system makes more over a year than the house uses, though not at the same times.",
                "type": "number"
              },
              "gridIndependencePercent": {
                "description": "The share of the household's own use met by the system.",
                "type": "number"
              },
              "idealCapacityKwp": {
                "description": "The capacity that would exactly cover a year of consumption, before rounding up to whole panels.",
                "type": "number"
              },
              "importedKwh": {
                "description": "Units still bought from the grid over a year.",
                "type": "number"
              },
              "inclination": {
                "type": "number"
              },
              "installedCost": {
                "type": "number"
              },
              "method": {
                "type": "string"
              },
              "newAnnualCost": {
                "type": "number"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "occupancyLabel": {
                "type": "string"
              },
              "panelWatts": {
                "type": "number"
              },
              "panels": {
                "type": "integer"
              },
              "paybackYears": {
                "description": "Installed cost divided by the annual benefit. Only present when a cost was supplied.",
                "type": "number"
              },
              "postcodeUsed": {
                "type": "string"
              },
              "references": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clause": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["document", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "roofAreaNeededM2": {
                "type": "number"
              },
              "roofLimited": {
                "description": "True when the roof area given, not consumption, set the size.",
                "type": "boolean"
              },
              "selfConsumedKwh": {
                "type": "number"
              },
              "selfConsumptionPercent": {
                "type": "number"
              },
              "shadeFactor": {
                "type": "number"
              },
              "shading": {
                "additionalProperties": false,
                "description": "The shading description used, when one was chosen in place of a measured factor.",
                "properties": {
                  "description": {
                    "type": "string"
                  },
                  "key": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "shadeFactor": {
                    "type": "number"
                  },
                  "sunpathSegments": {
                    "description": "The equivalent count on the MGD 005 sunpath chart, out of 84.",
                    "type": "integer"
                  }
                },
                "required": ["description", "key", "label", "shadeFactor", "sunpathSegments"],
                "type": ["null", "object"]
              },
              "specificYieldKwhPerKwp": {
                "description": "Kk: the kWh a kWp produces in a year at this zone, pitch and orientation.",
                "type": "number"
              },
              "zone": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  }
                },
                "required": ["city", "code"],
                "type": "object"
              }
            },
            "required": ["annualConsumptionKwh", "annualGenerationKwh", "capacityKwp", "consumptionAssumed", "direction", "exportedKwh", "generationAsPercentOfUse", "gridIndependencePercent", "idealCapacityKwp", "importedKwh", "inclination", "method", "notes", "occupancyLabel", "panelWatts", "panels", "postcodeUsed", "references", "roofAreaNeededM2", "roofLimited", "selfConsumedKwh", "selfConsumptionPercent", "shadeFactor", "specificYieldKwhPerKwp", "zone"],
            "type": "object"
          },
