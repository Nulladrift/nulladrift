        {
          "name": "hot_water_cylinder",
          "title": "Hot water demand and cylinder size",
          "description": "Work out the daily hot water demand of a dwelling and the size of cylinder a heat\npump needs, using the formula in MIS 3005-D 3.5.2 and the BS 6700 guidance reproduced in MGD 007.\n\nThe demand is 45 litres a day for each of N, where N is the greater of the number of bedrooms plus one\nand the number of people actually living there. For a new build, where occupancy is unknown, the\nbedroom count is used.\n\nThe cylinder does not have to hold a whole day's demand, because it reheats as it empties. What it must\ncover is the largest draw-off before the heat pump catches up, which is why a larger heat pump needs a\nsmaller cylinder: reheat time is volume times temperature rise, divided by 14.3 times the kW.\n\nThe result gives the BS 6700 minimum, a recommended size rounded to a volume cylinders are made in, and\nthe reheat time. Note that cylinder volume is not the whole story: a heat pump cylinder needs a much\nlarger coil than a boiler cylinder, because the water arrives cooler and there is less temperature\ndifference to drive heat across the surface.\n\nMethod from MIS 3005-D. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bathrooms": {
                "description": "Number of bathrooms with a bath. Defaults to 1.",
                "type": "integer"
              },
              "bedrooms": {
                "description": "Number of bedrooms in the property. Required.",
                "type": "integer"
              },
              "coldWaterTemp": {
                "description": "Incoming mains temperature in Celsius. Defaults to 10.",
                "type": "number"
              },
              "heatPumpOutputKw": {
                "description": "Heat output of the heat pump in kW when it is heating the cylinder. A larger heat pump reheats faster, so it needs less stored volume. Defaults to 6.",
                "type": "number"
              },
              "occupants": {
                "description": "Number of people who actually live there, if known. MIS 3005-D takes the greater of this and bedrooms plus one. Leave it out for a new build, where the occupancy is not yet known.",
                "type": "integer"
              },
              "storageTemp": {
                "description": "Temperature the cylinder is stored at, in Celsius. Defaults to 55, which is a common heat pump setting. A weekly pasteurisation cycle above 60 is separate.",
                "type": "number"
              }
            },
            "required": ["bedrooms"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "bathrooms": {
                "type": "integer"
              },
              "bedrooms": {
                "type": "integer"
              },
              "coldWaterTemp": {
                "type": "number"
              },
              "dailyDemandLitres": {
                "description": "Average daily hot water demand: 45 litres for each of N.",
                "type": "number"
              },
              "designOccupancy": {
                "description": "N in the MIS 3005-D formula: the greater of bedrooms plus one and the known occupants.",
                "type": "integer"
              },
              "energyPerDayKwh": {
                "description": "Heat needed each day to raise the daily demand from mains temperature to storage temperature.",
                "type": "number"
              },
              "heatPumpOutputKw": {
                "type": "number"
              },
              "method": {
                "type": "string"
              },
              "minimumCylinderLitres": {
                "description": "The BS 6700 minimum for this number of bathrooms and this heat pump output, before the allowance MGD 007 adds for extra bathing capacity.",
                "type": "integer"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "occupancyBasis": {
                "description": "Which of the two gave the larger figure.",
                "type": "string"
              },
              "occupants": {
                "type": "integer"
              },
              "recommendedCylinderLitres": {
                "description": "Cylinder volume from the BS 6700 guidance in MGD 007, given the number of baths and the heat pump output.",
                "type": "integer"
              },
              "references": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clause": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["document", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "reheatMinutes": {
                "description": "Roughly how long the heat pump takes to bring the whole cylinder up from cold, ignoring standing losses.",
                "type": "number"
              },
              "storageTemp": {
                "type": "number"
