        {
          "name": "radiator_flow_temperature",
          "title": "Radiator flow temperature",
          "description": "Work out the flow temperature a heat pump must produce to heat a room through a\ngiven radiator, and the resulting MCS Heat Emitter Guide star rating, following section 4 of MGD 007.\n\nThis is the calculation that decides whether a heat pump will be cheap or expensive to run. A heat\npump's efficiency falls as the water temperature rises, by roughly two to three per cent per degree,\nand the temperature it must produce is set by the radiators, not by the machine.\n\nSupply the room's design heat loss in watts, from a room-by-room calculation, and the rated output of\nthe radiator in that room. British catalogues normally quote at a mean-water-to-air difference of 50 K;\nif yours quotes 60, say so and the figure is restated.\n\nThe result gives the oversize factor, which is the radiator's output at 50 K divided by the room's heat\nloss, and converts it to a required flow temperature through the BS EN 442 output law. Star ratings run\nfrom 0 to 6, one star per five degrees of flow temperature, with six stars at 35 degrees.\n\nRun this for every room. A house runs at the flow temperature its worst room demands, so one undersized\nradiator sets the running cost for the whole house.\n\nMethod from MGD 007. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "radiatorOutputW": {
                "description": "Rated output of the radiator or radiators in that room, in watts, at the catalogue temperature. Required.",
                "type": "number"
              },
              "ratedAtDeltaT": {
                "description": "The mean-water-to-air temperature difference the rated output was quoted at. British catalogues normally quote 50; some older ones quote 60. Defaults to 50.",
                "type": "number"
              },
              "roomHeatLossW": {
                "description": "The room's design heat loss in watts, from a room-by-room heat loss calculation. Required.",
                "type": "number"
              },
              "roomTemp": {
                "description": "Internal design temperature of the room in Celsius. Defaults to 21.",
                "type": "number"
              },
              "systemDeltaT": {
                "description": "Designed drop in water temperature between flow and return, in kelvin. Heat pump systems commonly use 5; boiler systems used 10 or 20. Defaults to 5.",
                "type": "number"
              }
            },
            "required": ["radiatorOutputW", "roomHeatLossW"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "flowTemperature": {
                "description": "The flow temperature the heat pump must produce, in Celsius.",
                "type": "number"
              },
              "meanWaterTemp": {
                "description": "Average of flow and return temperature needed to deliver the room's heat loss through this radiator.",
                "type": "number"
              },
              "method": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "outputAtDeltaT50": {
                "description": "The radiator's output restated at a mean-water-to-air difference of 50 K, so oversize factors are comparable between catalogues.",
                "type": "number"
              },
              "outputAtDesignFlowW": {
                "description": "What this radiator actually gives at the flow temperature worked out here.",
                "type": "number"
              },
              "oversizeFactor": {
                "description": "Radiator output at 50 K divided by the room's heat loss. The single number the Heat Emitter Guide turns into a star rating.",
                "type": "number"
              },
              "radiatorOutputForFiveStarsW": {
                "description": "The radiator output at 50 K that would reach a five star rating, meaning a 40 degree flow temperature.",
                "type": "number"
              },
              "radiatorOutputW": {
                "type": "number"
              },
              "ratedAtDeltaT": {
                "type": "number"
              },
              "references": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clause": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
