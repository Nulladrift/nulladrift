        {
          "name": "heat_pump_running_cost",
          "title": "Heat pump running cost",
          "description": "Compare what a household spends heating on its current fuel with what the same heat\nwould cost from a heat pump.\n\nThe heat demand is worked out from the household's own metered fuel use, not from a model,\nbecause a year of bills describes a particular house far better than any estimate of it. Supply the\nannual fuel use in the fuel's own unit (kWh for gas and electricity, litres for oil and LPG, kilograms\nfor coal), its price per unit in pounds, and the seasonal efficiency of the existing appliance, which\ndefaults to a realistic figure for that fuel instead of the one on the badge.\n\nThe comparison turns on one ratio. A heat pump costs less to run whenever its seasonal coefficient of\nperformance beats the ratio between the price of a unit of electricity and the price of a unit of heat\nfrom the current fuel. The result reports that break-even figure explicitly.\n\nSCOP must be the figure at the flow temperature the system is actually designed for. The same machine\ncan return 4.2 at 35 degrees and 3.1 at 55, and quoting the first for a system designed at the second\nis the commonest way of overstating a saving.\n\nThis is a running cost comparison. It says nothing about the capital cost or any grant.\n\nMethod from MCS 007. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualFuelUse": {
                "description": "How much of that fuel the house uses in a year, in the fuel's own unit: kWh for gas and electricity, litres for oil and LPG, kilograms for coal. Take it from a year of bills. Required.",
                "type": "number"
              },
              "applianceEfficiency": {
                "description": "Seasonal efficiency of the existing appliance, as a decimal. Defaults to the typical figure for the fuel.",
                "type": "number"
              },
              "electricityPricePerKwh": {
                "description": "Price of a unit of electricity, in pounds. Required.",
                "type": "number"
              },
              "electricityStandingChargePerDay": {
                "description": "Daily electricity standing charge in pounds. It is paid either way, so it only changes the answer if the tariff changes with the heat pump.",
                "type": "number"
              },
              "fuel": {
                "description": "The fuel being replaced: 'mains_gas', 'oil', 'lpg', 'electricity' or 'coal'. Defaults to 'mains_gas'.",
                "type": "string"
              },
              "fuelPricePerUnit": {
                "description": "Price of one unit of that fuel, in pounds. Required.",
                "type": "number"
              },
              "fuelStandingChargePerDay": {
                "description": "Daily standing charge for that fuel in pounds, if it has one. A house that removes its gas boiler can usually stop paying this.",
                "type": "number"
              },
              "nonHeatingFraction": {
                "description": "Share of that fuel used for something other than heating and hot water, such as a gas hob, as a decimal. A hob is usually 0.03 to 0.05. Defaults to 0.",
                "type": "number"
              },
              "scop": {
                "description": "Seasonal coefficient of performance of the proposed heat pump: the units of heat it delivers per unit of electricity, averaged over a year at the design flow temperature. Required.",
                "type": "number"
              }
            },
            "required": ["annualFuelUse", "electricityPricePerKwh", "fuelPricePerUnit", "scop"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualDifference": {
                "description": "Positive when the heat pump costs less.",
                "type": "number"
              },
              "annualHeatDemandKwh": {
                "description": "Useful heat the house actually needs in a year, after the existing appliance's losses are taken off its fuel input.",
                "type": "number"
              },
              "applianceEfficiency": {
                "type": "number"
              },
              "breakEvenPriceRatio": {
                "description": "How many times dearer a unit of electricity is than a unit of the current fuel. Compare it with the SCOP: a heat pump saves money whenever the SCOP beats this ratio.",
                "type": "number"
              },
              "breakEvenScop": {
                "description": "The seasonal efficiency at which the heat pump costs exactly what the current system costs. Below this it costs more.",
                "type": "number"
              },
              "costPerKwhHeatHeatPump": {
                "description": "What a unit of delivered heat would cost from the heat pump.",
                "type": "number"
              },
              "costPerKwhHeatNow": {
                "description": "What a unit of delivered heat costs today, in pounds.",
                "type": "number"
              },
              "currentAnnualCost": {
                "type": "number"
              },
              "fuel": {
                "additionalProperties": false,
                "properties": {
                  "key": {
                    "type": "string"
                  },
                  "kwhPerUnit": {
                    "description": "Energy in a single unit of that fuel.",
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "typicalEfficiency": {
                    "description": "Seasonal efficiency of a reasonable appliance burning it, as a decimal.",
                    "type": "number"
                  },
                  "unit": {
                    "description": "The unit the fuel is normally metered or bought in.",
                    "type": "string"
                  }
                },
                "required": ["key", "kwhPerUnit", "name", "typicalEfficiency", "unit"],
                "type": "object"
              },
              "heatPumpAnnualCost": {
                "type": "number"
              },
              "heatPumpElectricityKwh": {
                "description": "Units of electricity the heat pump would use in a year.",
                "type": "number"
              },
              "method": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "percentDifference": {
                "type": "number"
              },
              "references": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clause": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["document", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "scop": {
                "type": "number"
              },
              "verdict": {
                "type": "string"
              }
            },
            "required": ["annualDifference", "annualHeatDemandKwh", "applianceEfficiency", "breakEvenPriceRatio", "breakEvenScop", "costPerKwhHeatHeatPump", "costPerKwhHeatNow", "currentAnnualCost", "fuel", "heatPumpAnnualCost", "heatPumpElectricityKwh", "method", "notes", "percentDifference", "references", "scop", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
