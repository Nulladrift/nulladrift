        {
          "name": "solar_pv_shading",
          "title": "Solar PV shade factor",
          "description": "Convert a completed MCS sunpath shading assessment into a shade factor, using the\nprocedure in MGD 005.\n\nThe MCS sunpath chart is divided into 84 segments, each worth one per cent of the year's useful\nirradiance. An assessor stands at the middle of where the array will go, plots what blocks the\nhorizon onto the chart, and counts the segments covered. This tool takes that count and returns\n1 minus the loss, which is the SF term in the MIS 3002 output estimate.\n\nObjects within ten metres of the array are near shading and are assessed separately, from each\naffected part of the array, not from its middle. They can be listed here for the record, but\nMGD 005 is explicit that near shading has a considerable effect and should be avoided.\n\nThis tool does not perform the assessment. It does the arithmetic on an assessment somebody made.\n\nMethod from MGD 005. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nearObjects": {
                "description": "Objects within ten metres of the middle of the array, each assessed from its own position on the array. Optional.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "What the object is, for example 'chimney' or 'television aerial'.",
                      "type": "string"
                    },
                    "modulesAffected": {
                      "description": "How many modules in the array this object shades.",
                      "type": "integer"
                    },
                    "segments": {
                      "description": "Segments the object touches on the sunpath chart, from 0 to 84.",
                      "type": "integer"
                    }
                  },
                  "required": ["modulesAffected", "segments"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "segments": {
                "description": "Number of segments on the MCS sunpath chart that the obstruction touches, from 0 to 84. Each segment is worth one per cent of the year's irradiance.",
                "type": "integer"
              }
            },
            "required": ["segments"],
