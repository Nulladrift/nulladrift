      "serverInfo": {
        "name": "ampworth",
        "title": "UK home energy calculators and documents, following the MCS standards",
        "version": "1.0.0",
        "description": "Every Ampworth tool on one server: the solar and heat pump sizing calculators, the nine single-method calculators, and search and reading of the guides, articles and questions. The same tools are also served separately at /mcp/calculators and /mcp/documents.",
        "websiteUrl": "https://ampworth.com"
