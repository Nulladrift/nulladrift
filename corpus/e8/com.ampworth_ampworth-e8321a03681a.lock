        {
          "name": "heat_pump_noise",
          "title": "Heat pump noise assessment",
          "description": "Calculate the sound pressure level an air source heat pump produces at an assessment\nposition, and whether it meets the 37 dB(A) permitted development noise limit, using the method in\nMCS 020.\n\nThe formula is Lp = Lw + 10 log(Q / 4.pi.r^2) - Ab.\n\nLw is the A-weighted sound POWER level of the unit from its product fiche, energy label or the MCS\nproduct database. This is not the sound pressure level, which is a smaller number that already has a\ndistance built into it; confusing the two produces an answer that is wrong by about twenty decibels.\nThe figure for low noise mode must not be used.\n\nQ is the directivity factor, from the count of reflecting surfaces within one metre of the unit that\nextend at least a metre past it in two or more directions. The ground counts; vegetation does not.\nOne surface gives Q=2, two gives Q=4, three gives Q=8. More than three cannot meet MCS 020 at all.\n\nr is the straight-line distance in metres to the assessment position, which is a window or door of a\nhabitable room in a NEIGHBOURING property, at any floor. Every affected position must be checked\nseparately, and the nearest is not always the worst.\n\nAb is the barrier attenuation. Fences with gaps, and vegetation of any kind, count as no barrier.\n\nWhere several units serve one position, list them all and they are combined logarithmically.\n\nMethod from MCS 020. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "units": {
                "description": "The heat pump or heat pumps being assessed, each with its own distance and barrier to this assessment position. At least one is required.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "barrierType": {
                      "description": "'type_1' for solid masonry or a solid fence at least 18 mm thick, 'type_2' for a solid fence thinner than 18 mm, or 'none'. Fences with gaps, and vegetation, are 'none'. Defaults to 'none'.",
                      "type": "string"
                    },
                    "distance": {
                      "description": "Straight-line distance in metres from the centre of the unit to the assessment position, measured to the nearest 0.1 m. Required.",
                      "type": "number"
                    },
                    "label": {
                      "description": "A name for this unit, for a result covering more than one.",
                      "type": "string"
                    },
                    "lineOfSight": {
                      "description": "Whether the assessment position can be seen from the top edge of the unit: 'none', 'partial' (visible if you move up to 0.25 m in any direction) or 'full'. Defaults to 'full'.",
                      "type": "string"
                    },
                    "reflectingSurfaces": {
                      "description": "How many surfaces sit within one metre of the unit and extend at least a metre past it in two or more directions. The ground counts; vegetation does not. 1, 2 or 3. More than 3 fails MCS 020 outright. Required.",
                      "type": "integer"
                    },
                    "soundPowerLevel": {
                      "description": "A-weighted sound POWER level of the unit in dB(A), from the product fiche, the energy label or the MCS product database. Not the sound pressure level, which is a different and smaller number. The figure for low noise mode must not be used. Required.",
                      "type": "number"
                    }
                  },
                  "required": ["distance", "reflectingSurfaces", "soundPowerLevel"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["units"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "compliant": {
                "description": "True when the level is at or below the limit.",
                "type": "boolean"
              },
              "headroom": {
                "description": "Decibels below the limit. Negative when the limit is exceeded.",
                "type": "number"
              },
              "limit": {
                "description": "The permitted development noise limit, 37.0 dB(A).",
                "type": "number"
              },
              "method": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "references": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clause": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["document", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "remedies": {
                "description": "What would bring a failing position within the limit.",
                "items": {
                  "type": "string"
