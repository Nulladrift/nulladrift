        {
          "name": "solar_pv_output",
          "title": "Solar PV annual output",
          "description": "Estimate the annual AC electricity output of a UK solar photovoltaic system, in kWh,\nusing the standard estimation method that MIS 3002 requires every MCS certified installer to use.\n\nThe method is: annual output = kWp x Kk x SF, where Kk is read from the MCS irradiance dataset for\nthe site's postcode zone, roof pitch and orientation, and SF is a shade factor between 0 and 1.\n\nSupply the postcode and the array's capacity in kWp, plus the roof's pitch in degrees from horizontal\nand its orientation in degrees away from due south in either direction, so that south is 0, south-east\nand south-west are both 45, east and west are both 90, and north is 180.\n\nThe result carries the tabulated yield, the estimate, and what the same array would produce at the\nbest pitch and orientation for that zone, so a roof that is merely good is not mistaken for a poor one.\nThis covers the United Kingdom only; the dataset has no values for anywhere else.\n\nMethod from MIS 3002. These calculators follow the published MCS methods, for understanding a system and checking a quotation. Anything that gets installed still needs a design and a site survey from a certified installer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capacityKwp": {
                "description": "Total installed capacity in kilowatts peak: the sum of the nameplate watts of every module, divided by 1000. Required.",
                "type": "number"
              },
              "inclination": {
                "description": "Pitch of the array in degrees from horizontal. A flat roof is 0 and a wall-mounted array is 90. Required.",
                "type": "number"
              },
              "orientation": {
                "description": "Degrees the array faces away from due south, in either direction, so due south is 0, south-east and south-west are 45, east and west are 90, and due north is 180. Required.",
                "type": "number"
              },
              "postcode": {
                "description": "UK postcode of the installation, for example 'BS1 5TR'. Only the outward code matters. Give this or 'zone'.",
                "type": "string"
              },
              "shadeFactor": {
                "description": "Proportion of output left after shading, between 0.5 and 1. Use 1 for a clear horizon. Defaults to 1.",
                "type": "number"
              },
              "zone": {
                "description": "MCS postcode zone code, for example '5E'. An alternative to 'postcode' when the zone is already known.",
                "type": "string"
              }
            },
            "required": ["capacityKwp", "inclination", "orientation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualOutputKwh": {
                "description": "The estimate: capacity multiplied by Kk multiplied by the shade factor.",
                "type": "number"
              },
              "bestCaseAnnualKwh": {
                "description": "What this capacity would produce at the best pitch and orientation for the zone, unshaded. A yardstick, not a target: a roof faces where it faces.",
                "type": "number"
              },
              "bestCaseInclination": {
                "description": "The pitch that yields most at this zone when facing due south.",
                "type": "number"
              },
              "bestCaseOrientation": {
                "description": "The orientation that yields most at this pitch and zone. Almost always due south.",
                "type": "number"
              },
              "capacityKwp": {
                "type": "number"
              },
              "inclination": {
                "description": "Inclination after rounding to the nearest degree, as the method requires.",
                "type": "number"
              },
              "method": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "orientation": {
                "description": "Orientation after rounding to the nearest five degrees, as the method requires.",
                "type": "number"
              },
              "percentOfBestCase": {
                "description": "The estimate as a percentage of that best case.",
                "type": "number"
              },
              "postcodeUsed": {
                "description": "The postcode the zone was resolved from, when one was given.",
                "type": "string"
              },
              "references": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clause": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["document", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "shadeFactor": {
                "type": "number"
              },
              "shadingLossKwh": {
                "type": "number"
              },
              "specificYieldKwhPerKwp": {
                "description": "Kk: the kWh a single kWp produces in a year at this zone, pitch and orientation, before shading.",
                "type": "number"
              },
              "unshadedOutputKwh": {
                "description": "What the same array would produce with a clear horizon. Equals the estimate when the shade factor is 1.",
                "type": "number"
              },
              "zone": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  }
                },
                "required": ["city", "code"],
                "type": "object"
              }
            },
            "required": ["annualOutputKwh", "bestCaseAnnualKwh", "bestCaseInclination", "bestCaseOrientation", "capacityKwp", "inclination", "method", "notes", "orientation", "percentOfBestCase", "references", "shadeFactor", "shadingLossKwh", "specificYieldKwhPerKwp", "unshadedOutputKwh", "zone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Solar PV annual output"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
