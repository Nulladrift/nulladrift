                "type": "number"
              },
              "starRating": {
                "description": "Temperature star rating from the MCS Heat Emitter Guide, 0 to 6. More stars mean a lower flow temperature and a more efficient system.",
                "type": "integer"
              },
              "starRatingLabel": {
                "type": "string"
              },
              "verdict": {
                "type": "string"
              }
            },
            "required": ["flowTemperature", "meanWaterTemp", "method", "notes", "outputAtDeltaT50", "outputAtDesignFlowW", "oversizeFactor", "radiatorOutputForFiveStarsW", "radiatorOutputW", "ratedAtDeltaT", "references", "returnTemperature", "roomHeatLossW", "starRating", "starRatingLabel", "verdict"],
            "type": "object"
          },
          "annotations": {
