          "title": "Discount posture",
          "description": "How often and how deep each brand discounts, over a window (7-365 days, default 30), from two separate readings: homepage_banner = days a promotion banner was on the brand's homepage (read from our homepage captures; 'not_measured' when we hold no capture in the window), and product_markdowns = products whose price, read in the window, is below their full price, with average and max markdown %, in one store and currency per brand. A brand can run product markdowns with no homepage banner, and the reverse: when product markdowns are 0 or near 0 but the homepage advertises a discount (a cart- or collection-level sale), homepage_promo_not_on_product_prices quotes the brand's homepage line verbatim with its source and dates.",
