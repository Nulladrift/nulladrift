      "instructions": "RivalSweeper Signals - eCommerce competitive intelligence for AI agents: competitor prices, promotions, price/stock alerts and history, competitor sets and AI-readiness scores.\nSign in with your RivalSweeper account: Signals is included in your plan and covers your own site and the rivals you track in RivalSweeper (add rivals in the app).\nDevelopers without a RivalSweeper plan can use a prepaid API key (\"Authorization: Bearer rsk_...\", 1 credit = $0.02, no data = no charge): https://www.rivalsweeper.com/solutions/signals-api\nNewly added rival brands can take up to 24 hours before data appears; tools say so when that applies (list_my_tracked_brands shows each brand's data status).\nWorkflow tip: start with list_my_tracked_brands, then get_competitor_moves_feed or get_significant_competitor_changes for \"what changed\". get_my_usage_and_plan shows your plan usage and the domains you can query. If a signal is missing, call request_missing_data_signal.",
      "tools": [
        {
          "name": "check_brand_data_coverage",
          "title": "Signal coverage for a domain (free)",
          "description": "Check which competitive signals RivalSweeper has for an eCommerce domain, with per-signal freshness (for prices: when a price was last read, plus the share of priced products read in the last 7 days; records counts products, each product once however many variant rows it has; for large catalogs these come from a sample and are marked records_approximate). A signal is available exactly when its tool has data: promotions counts the live offers get_active_promotions_and_coupons returns, prices follow get_brand_price_statistics. Free and non-billable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "eCommerce domain, e.g. gymshark.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
