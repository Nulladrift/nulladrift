              },
              "period": {
                "description": "Fiscal period: 'FY2025', 'Q2 FY2027' (also 'FY27Q2', 'Q2 2027'), 'latest', 'latest quarter', 'latest annual', 'ttm', 'ytd', 'annual', 'quarterly', 'all', or a period-end date. The company's own fiscal years. Omit for every period in the latest record. A period earlier than the data held returns that the data does not go back that far, and what is held.",
                "type": "string"
              },
              "statement": {
                "description": "Which statement. Default 'all': every statement and table held for each period.",
                "enum": ["income_statement", "balance_sheet", "cash_flow", "all"],
                "type": "string"
              },
              "ticker": {
                "description": "Ticker symbol, case-insensitive. Examples: NVDA, brk-b, BRK.B.",
                "type": "string"
              }
