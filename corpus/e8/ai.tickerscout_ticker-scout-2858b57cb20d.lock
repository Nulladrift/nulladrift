        {
          "name": "get_financials",
          "title": "Financial statements (the whole record)",
          "description": "Income statement, balance sheet and cash flow, already assembled from a company's SEC filings, for up to three fiscal years plus the latest quarter, year to date and trailing twelve months, with segment tables, per-share figures and the record's own notes. This is the published financials.json, whole or by top-level section. Already assembled: no XBRL concept selection, no deriving a discrete quarter from year-to-date columns, no scale factor to infer. Section names differ per company, so call with no sections first (or read available_sections) and then request only what you need. Request the figure_sources section by name for a sec.gov link to the line of the filing that prints each figure; a whole-file call leaves it out. All money is in actual dollars (not thousands, not millions), per-share figures in dollars per share (per ADS for a foreign issuer that has one), share counts in actual shares, split-adjusted. A foreign issuer's figures are converted to US dollars at the rate recorded on each period. For one statement or one period, searching older records too, use get_statements; for one figure, get_figure.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "record": {
                "description": "An earlier published record, by tag ('FY27Q1') or by the period its filing reports ('Q1 FY2027'). Omit for the latest. list_periods lists every record.",
                "type": "string"
              },
              "sections": {
                "description": "Top-level sections to return, for example annual, quarterly, trailing_twelve_months, notes, uncertainties, figure_sources. Omit for the whole file (without figure_sources). An unknown name returns the valid list for that company.",
                "items": {
                  "type": "string"
