  "subjects": {
    "ai.tickerscout/ticker-scout": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.tickerscout.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ticker-scout",
        "version": "3.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Financial statements and filing summaries for public companies, assembled from their SEC filings (10-K, 10-Q, 8-K; 20-F and 6-K for foreign issuers). All money is in actual dollars, not millions. Every figure carries the SEC accession number of its filing; cite it, and the sec_link where one is given. Fiscal years and quarters are each company's own. There are no stock prices, market data or estimates, and nothing here is investment advice. If unsure which tool fits, call guide.",
      "tools": [
        {
          "name": "compare_companies",
          "title": "Compare a figure across companies",
          "description": "One standard figure for two to ten companies side by side: revenue, net income, EPS, operating income, free cash flow, debt, cash, equity or any other standard figure listed in get_figure. Defaults to each company's latest discrete period (its latest quarter, or its latest fiscal year if that is newer); pass period='latest annual', 'ttm', 'latest quarter' or a fiscal year. Fiscal calendars differ between companies, so each row states its own period and dates, and the field it was read from; a company that does not report the figure, or the period, gets a row saying so rather than failing the call. All money is in actual dollars (not thousands, not millions), per-share figures in dollars per share (per ADS for a foreign issuer that has one), share counts in actual shares, split-adjusted. A foreign issuer's figures are converted to US dollars at the rate recorded on each period.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "figure": {
                "description": "A standard figure name or synonym, e.g. revenue, net income, diluted eps, fcf.",
                "type": "string"
              },
              "period": {
                "description": "Default 'latest'. Fiscal year: 'FY2025', 'FY25', 'fiscal 2025' or '2025'. Quarter: 'Q2 FY2027', 'Q2 2027', 'FY27Q2', '2027Q2', '2Q27', 'second quarter 2027', or 'Q2' for the latest second quarter. Special: 'latest' (most recent period of any kind), 'latest quarter', 'latest annual', 'ttm' (trailing twelve months), 'ytd' (year to date), 'prior ytd', 'annual' (every fiscal year), 'quarterly' (every quarter), 'all' (every period in every published record). A period-end date such as '2026-07-26' also works.",
                "type": "string"
              },
              "tickers": {
                "description": "Two to ten tickers.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["figure", "tickers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ed0bd41fb147e55d3d594b66f414c9b466c935cf16d7df70eaa0ad5a6f636cf"
        },
        {
          "name": "get_company",
          "title": "Company profile and coverage manifest",
          "description": "Company identity and coverage manifest: name, CIK, exchange, state of incorporation, SIC industry, the fiscal period of the latest data, the SEC filings that record is built from (the annual report and the latest quarterly report, each with its own fiscal year, filing date, accession number and EDGAR link), every published record with its permanent URLs, and the predicted next filing date and form (a prediction from filing history; a filing date is not an earnings date). Pass `record` for an earlier record's manifest.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "record": {
                "description": "An earlier published record, by tag ('FY27Q1') or by the period its filing reports ('Q1 FY2027'). Omit for the latest. list_periods lists every record.",
                "type": "string"
              },
              "ticker": {
                "description": "Ticker symbol, case-insensitive. Examples: NVDA, brk-b, BRK.B.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e86aac59c297aa35e9c25bf2ec2270502a7efc74ac8352e5de496342c9875fbb"
        },
        {
          "name": "get_company_metrics",
          "title": "KPIs, non-GAAP and industry metrics",
          "description": "Measures a company reports outside its GAAP statements, as it defines them: `operating` KPIs (users, subscribers, paid memberships, bookings, stores, RevPAR, deliveries, backlog, remaining performance obligations), `non_gaap` measures (adjusted EPS, adjusted operating income, EBITDA, FFO for a REIT, core earnings, with the reconciling figures held), `bank` metrics (CET1 and other capital ratios, net interest margin, efficiency ratio, average balances and yields, credit quality) and `insurance` metrics (premiums, underwriting results, combined and loss ratios, investment income, float, book value). Default: every kind this company reports. These are the company's own definitions from its filings or earnings release. Every period in the latest record by default, or the periods named by `period`. Actual dollars (not millions), shares split-adjusted, a foreign issuer's figures in US dollars.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "Which kind. Default 'all'.",
                "enum": ["operating", "non_gaap", "bank", "insurance", "all"],
                "type": "string"
              },
              "period": {
                "description": "Fiscal period: 'FY2025', 'Q2 FY2027' (also 'FY27Q2', 'Q2 2027'), 'latest', 'latest quarter', 'latest annual', 'ttm', 'ytd', 'annual', 'quarterly', 'all', or a period-end date. The company's own fiscal years. Omit for every period in the latest record. A period earlier than the data held returns that the data does not go back that far, and what is held.",
                "type": "string"
              },
              "ticker": {
                "description": "Ticker symbol, case-insensitive. Examples: NVDA, brk-b, BRK.B.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
