                            "maxLength": 5,
                            "minLength": 5,
                            "type": "string"
                          }
                        },
                        "required": ["city", "state", "street", "zip"],
                        "type": "object"
                      },
                      "crewSize": {
                        "maximum": 12,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "desiredArrivalWindow": {
                        "type": "string"
                      },
                      "flightsOfStairs": {
                        "maximum": 20,
                        "minimum": 0,
                        "type": ["integer", "null"]
                      },
                      "laborHours": {
                        "maximum": 50,
                        "minimum": 2,
                        "type": "number"
                      },
                      "notes": {
                        "maxLength": 6000,
                        "type": ["string", "null"]
                      },
                      "requestedDate": {
                        "type": "string"
                      },
                      "workerLocationID": {
                        "maximum": 2147483647,
                        "minimum": 1,
                        "type": ["integer", "null"]
                      }
                    },
                    "required": ["address", "desiredArrivalWindow", "requestedDate"],
                    "type": ["object", "null"]
                  },
                  "serviceType": {
                    "enum": ["Unknown", "Standard", "Elite", "MoversPlusTruck", "Transport", "HybridZS", "Container", "FreightTrailer", "CarShipping", "TruckRental", "ManagedLaborHourly", "ManagedLaborPlus", "CorporateRelocation_LaborOnly", "CorporateRelocation_LocalFullService"],
