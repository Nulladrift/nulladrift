        {
          "name": "get_provider_reviews",
          "description": "Gets customer reviews for a specific moving provider, newest first, paginated. For 'recent' or 'last N months' requests, compute the cutoff date yourself and pass it as startDate (yyyy-MM-dd): only reviews on/after that date are returned and the paging counts reflect the filtered set (a real server-side filter, not a sort). Each review includes rating, summary text, reviewer display name, move location, and date. The review total/count returned here is provider-wide -- aggregated across all of this provider's locations -- whereas list_service_providers and get_provider_details report a per-location review count/rating instead. Both figures are individually correct; they measure different scopes and must never be presented as contradictory.",
          "inputSchema": {
            "properties": {
              "pageNumber": {
                "default": null,
                "description": "The 1-based page number (defaults to the first page)",
                "type": ["integer", "null"]
              },
              "pageSize": {
                "default": null,
                "description": "The number of reviews per page (defaults to the API default)",
                "type": ["integer", "null"]
              },
              "providerId": {
                "description": "The provider's unique identifier",
                "type": "integer"
              },
              "startDate": {
                "default": null,
                "description": "Optional cutoff date (yyyy-MM-dd). Returns only reviews on/after this date. Compute it yourself for 'last N months' style requests. Omit for all reviews.",
                "type": ["string", "null"]
              }
            },
            "required": ["providerId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
