        {
          "name": "list_service_providers",
          "description": "Lists moving-labor service providers serving a 5-digit US ZIP code on a given date, factoring in availability. This is the primary way to discover which providers serve an area. Resolve any city/state the user gives you to a single 5-digit ZIP yourself before calling; if the location is ambiguous, ask the user to confirm which ZIP. Results include providers that cannot currently be booked (canBook=false with reasonsCantShow) and are ordered per sortOrder: best price -> PriceLowToHigh, most expensive -> PriceHighToLow, best quality/highest rated -> QualityRating, most reviews -> MostReviewed, soonest available -> Availability, best match (marketplace default) -> BestMatch. When serviceType is MoversPlusTruck, unloadingZipCode (the destination ZIP) is required or the request is rejected by the Partner API. resultFormat controls the shape: Compact (default) returns a trimmed list where startingPrice is a flat estimated starting total for the quoted job size, not an hourly rate; Full returns the complete raw provider list and pricing breakdown. Interpreting pricing (labor-only / Standard): there is NO single \"$X per hour\" rate. Do NOT compute one by dividing price by hours, or by crew x hours. In the Compact (default) shape the only price field is startingPrice: present it as a flat estimated starting total for the job size you passed (laborHours/crewSize), and call again with resultFormat=Full when you need the per-hour breakdown. In the Full shape, price is a flat estimated starting total for actualNumHours hours with actualCrewSize crew -- it is not an hourly rate; the only true per-hour figure is extraHourRate (the cost of each additional hour of labor beyond the base). In the Full shape state pricing as: \"$<price> for <actualCrewSize> movers for <actualNumHours> hours, plus $<extraHourRate>/hr for any additional time.\" Prefer serviceMiniDescription and publicNotices verbatim when present. Never present a single blended hourly rate. Review scope: in the Compact shape, reviewCount and averageRating -- and in the Full shape, the raw numberOfReviews and ratingAverage fields -- are for the single provider location serving the searched ZIP, not the provider overall. This per-location figure can legitimately differ from the provider-wide review total returned by get_provider_reviews; never present the two as contradictory.",
          "inputSchema": {
            "properties": {
              "crewSize": {
                "default": 2,
                "description": "How many crew members should be sent. Defaults to 2.",
                "type": "integer"
              },
              "flightsOfStairs": {
                "default": 0,
                "description": "Number of flights of stairs at the loading location. Defaults to 0.",
                "type": "integer"
              },
              "laborHours": {
                "default": 2,
                "description": "The amount of labor hours needed (rounded to the nearest 15-minute increment). Defaults to 2.",
                "type": "number"
              },
