{
  "lockfileVersion": 2,
  "subjects": {
    "com.privacypolicyurl/privacy-policy-url": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.privacypolicyurl.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.privacypolicyurl/privacy-policy-url",
        "title": "Privacy Policy URL",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Privacy Policy URL hosts a privacy policy at a stable HTTPS link that platforms (app stores, ad networks, lead forms) accept. Call list_resource_types to see which types are free. create_privacy_policy_url returns liveUrl at once for free types or when the request carries a valid Agent API key; otherwise it returns checkoutUrl ($49/year, paid by a human in Stripe Checkout) and pendingUrl, the address that goes live after payment. check_privacy_policy_url confirms liveness. generate_store_privacy_labels answers Apple's App Privacy details and Google Play's Data safety form from the app's SDKs, each answer with its source; no side effects. generate_privacy_manifest writes the app's own PrivacyInfo.xcprivacy and lists anything App Store Connect would reject it for. check_a2p_10dlc_documents opens a business's privacy policy, SMS terms and opt-in page and checks what US carriers look for before approving an A2P 10DLC texting campaign; read-only, nothing stored.",
      "tools": [
        {
          "name": "check_a2p_10dlc_documents",
          "title": "Check A2P 10DLC documents before registering",
          "description": "Opens a business's privacy policy, SMS terms and opt-in page (public https links) and checks what US carrier reviewers look for before approving an A2P 10DLC texting campaign: the non-sharing statement and no wording that lets mobile data go to third parties (Twilio 30908, 30932), frequency, \"Message and data rates may apply\", STOP and HELP in the terms, and an opt-in that is never pre-ticked (30924). Returns verdict and pass/warn/fail checks per page. Pattern checks, not a carrier's decision; nothing is stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "optInUrl": {
                "maxLength": 2048,
                "type": "string"
              },
              "privacyUrl": {
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "termsUrl": {
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["privacyUrl"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:22f395e3eed7a636a109e47e9441017fb2b6954ae4d438d669a38f0716d06921"
        },
        {
          "name": "check_privacy_policy_url",
          "title": "Check a privacy policy URL",
          "description": "Confirm whether a hosted privacy policy is live. Returns status (active or not_found), liveUrl, and updatedAt when live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "companySlug": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["companySlug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:161b01aae58b4886be919e905da735436ca3d99c8d6b2b3ac611a2913e2da6a2"
        },
        {
          "name": "create_privacy_policy_url",
          "title": "Create a hosted privacy policy URL",
          "description": "Generate and host a privacy policy for a business, app, store or site and return its stable HTTPS URL. Free resource types and Agent API key holders get liveUrl at once; other types get a Stripe Checkout link ($49/year) for a human to pay, plus the pendingUrl that goes live after payment. Repeating a call with the same inputs (or the same idempotencyKey) within 24 hours returns the first result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "caloppa": {
                "description": "Include CalOPPA sections.",
                "type": "boolean"
              },
              "ccpa": {
                "description": "Include CCPA/CPRA (California) sections.",
                "type": "boolean"
              },
              "companyName": {
                "description": "Business, app or site name as it should appear in the policy.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "companySlug": {
                "description": "URL slug (a-z, 0-9, hyphens). Defaults to a slug of companyName.",
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?$",
                "type": "string"
              },
              "coppa": {
                "description": "Include COPPA (children under 13) sections.",
                "type": "boolean"
              },
              "email": {
                "description": "Owner contact email. Receives the live link and manages the URL later.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "gdpr": {
                "description": "Include GDPR (EU/UK) sections.",
                "type": "boolean"
              },
              "idempotencyKey": {
                "description": "Your own retry key. Defaults to a hash of the other inputs.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "resourceType": {
                "description": "What the policy covers. See list_resource_types for which are free.",
                "enum": ["Mobile App", "Website", "SaaS/Web App", "E-commerce Store", "Browser Extension", "Desktop App", "API/SDK", "IoT/Device", "Lead Form/Landing Page", "Ad or Campaign Page"],
                "type": "string"
              }
            },
            "required": ["companyName", "email", "resourceType"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2651b36140e2307ae73ae8ef4410b99bbc2f86a056413c9fc8873b480356ae9"
        },
        {
          "name": "generate_privacy_manifest",
          "title": "Generate the app's PrivacyInfo.xcprivacy",
          "description": "Apple privacy manifest for the app's own code: the data the app itself collects (ownData ids), its own tracking (with tracking domains), the required-reason APIs its code uses with Apple's reason codes, and optionally SDKs linked statically without their own manifest. SDKs with their own manifest are covered by theirs (Apple). Categories: NSPrivacyAccessedAPICategoryFileTimestamp (DDA9.1, C617.1, 3B52.1); NSPrivacyAccessedAPICategorySystemBootTime (35F9.1, 8FFB.1, 3D61.1); NSPrivacyAccessedAPICategoryDiskSpace (85F4.1, E174.1, 7D9E.1, B728.1); NSPrivacyAccessedAPICategoryActiveKeyboards (3EC4.1, 54BD.1); NSPrivacyAccessedAPICategoryUserDefaults (CA92.1, 1C8F.1, AC6B.1). Returns plist (XML), manifest (the same as JSON) and problems (empty when App Store Connect should accept it).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "apiReasons": {
                "additionalProperties": {
                  "items": {
                    "maxLength": 10,
                    "type": "string"
                  },
                  "maxItems": 5,
                  "type": "array"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "ownData": {
                "items": {
                  "enum": ["account_email", "account_name", "phone", "address", "user_id", "precise_location", "coarse_location", "photos_videos", "audio", "messages", "user_content", "support", "contacts", "health", "fitness", "search", "purchases", "gameplay"],
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "settings": {
                "additionalProperties": {
                  "type": "boolean"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "staticSdks": {
                "items": {
                  "enum": ["firebase-analytics", "firebase-crashlytics", "firebase-auth", "firebase-messaging", "admob", "meta", "revenuecat", "onesignal", "sentry", "stripe", "mixpanel", "amplitude", "google-sign-in", "sign-in-with-apple", "appsflyer"],
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "tracking": {
                "properties": {
                  "domains": {
                    "items": {
                      "maxLength": 253,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  "enabled": {
                    "type": "boolean"
                  }
                },
                "required": ["enabled"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:391a7b2e50509dae84aef2c0a8b65d9d2ca83f83d0258d387159f3f3734a6de9"
        },
        {
          "name": "generate_store_privacy_labels",
          "title": "Generate App Store and Google Play privacy label answers",
          "description": "Answers for Apple's App Privacy details and Google Play's Data safety form from the SDKs an app uses, their settings and the data the app collects itself. Every answer carries the vendor or store page it comes from. Settings are yes/no questions per SDK (ids like ga.user_id, app.iap); unknown ids are rejected. SDK ids: firebase-analytics, firebase-crashlytics, firebase-auth, firebase-messaging, admob, meta, revenuecat, onesignal, sentry, stripe, mixpanel, amplitude, google-sign-in, sign-in-with-apple, appsflyer. Returns wizardUrl, a privacy-policy wizard link with the same services and personal data filled in. A starting point to check, not legal advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deletionRequest": {
                "type": "boolean"
              },
              "encryptedInTransit": {
                "type": "boolean"
              },
              "ownData": {
                "items": {
                  "enum": ["account_email", "account_name", "phone", "address", "user_id", "precise_location", "coarse_location", "photos_videos", "audio", "messages", "user_content", "support", "contacts", "health", "fitness", "search", "purchases", "gameplay"],
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "platforms": {
                "items": {
                  "enum": ["ios", "android"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "sdks": {
                "items": {
                  "enum": ["firebase-analytics", "firebase-crashlytics", "firebase-auth", "firebase-messaging", "admob", "meta", "revenuecat", "onesignal", "sentry", "stripe", "mixpanel", "amplitude", "google-sign-in", "sign-in-with-apple", "appsflyer"],
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "settings": {
                "additionalProperties": {
                  "type": "boolean"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["platforms", "sdks"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8af24ae6540f1172c82012e0268a69d297575008c0cebaa8953f881a6618adc"
        },
        {
          "name": "list_resource_types",
          "title": "List resource types",
          "description": "The resourceType values create_privacy_policy_url accepts, and which of them are hosted free. No side effects.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e98028075dd4c8de3ebcceb73449cd97ba872c445ebe9c80c96d2814e1910d79"
        }
      ],
      "resources": [
        {
          "uri": "privacy-policy-url://docs",
          "name": "docs",
          "title": "How to use Privacy Policy URL",
          "description": "Short usage notes for the tools, pricing and the REST equivalent.",
          "mimeType": "text/markdown",
          "digest": "sha256:c13f49dc003f18a03072996384e169c6543964757a51441bb9ec592e49915af5"
        }
      ],
      "digest": "sha256:5862dc2d1cca7c7bea6445fbd6aeac3a7dc7f20baf0251dea3d4a1ac904c8d95"
    }
  }
