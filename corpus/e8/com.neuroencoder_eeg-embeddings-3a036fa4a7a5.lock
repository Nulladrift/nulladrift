{
  "lockfileVersion": 2,
  "subjects": {
    "com.neuroencoder/eeg-embeddings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.neuroencoder.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "neuroencoder",
        "title": "Neuroencoder EEG embeddings",
        "version": "2.4.0",
        "websiteUrl": "https://docs.neuroencoder.com/agents"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "EEG embeddings from EPI-300K: one 768-d vector per window (30 s by default, window_seconds 2 to 30). Without data: list_samples, get_sample. With a local .edf/.bdf/.npy file: create_upload, PUT the file to upload_url yourself, start_embedding_job, get_job until succeeded, then get_result_url (.npy float32 [windows, 768]). Research use only; not a medical device.",
      "tools": [
        {
          "name": "account",
          "description": "This API key: tier, limits and usage this month.",
          "inputSchema": {
            "properties": {},
            "title": "accountArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4851c460941e3cb3b129a4832570b0b94111f7f447e0afb52be7a9614f0d197d"
        },
        {
          "name": "create_upload",
          "description": "Start an upload of a local .edf, .bdf or .npy file (at most 2 GB). Returns id and a presigned upload_url: PUT the file there within 10 minutes with exactly upload_headers (e.g. curl -X PUT --upload-file night.edf -H 'Content-Length: N' '<upload_url>', no Authorization header), then call start_embedding_job with the id. Only the extension of filename is used.",
          "inputSchema": {
            "properties": {
              "bytes": {
                "title": "Bytes",
                "type": "integer"
              },
              "filename": {
                "title": "Filename",
                "type": "string"
              }
            },
            "required": ["bytes", "filename"],
            "title": "create_uploadArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ee01218ec53b15bc5d1ea32f934f33f6655ae7c20913e3726a97c50781ab9a5"
        },
        {
          "name": "get_job",
          "description": "A job's status (queued, running, succeeded, failed, cancelled, expired), usage, error or result. Poll every 5 s while queued or running.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "get_jobArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d0fba45e5c5540048519ca4b85b0e1619c9d83fabeb06eb3274e4da62dd0ce3a"
        },
        {
          "name": "get_result_url",
          "description": "Fresh presigned GET URL (10 minutes) of a succeeded job's result: .npy float32 [windows, 768]; window i starts at i * t_start_step s.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "get_result_urlArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8020508efc524951e5a090dc71da67c19b33862e839bd86b14033b667f5aab0f"
        },
        {
          "name": "get_sample",
          "description": "One sample: README, licence, channels_used, and its embeddings in the POST /v1/embeddings response format (first windows only for long ones).",
          "inputSchema": {
            "properties": {
              "name": {
                "title": "Name",
                "type": "string"
              }
            },
            "required": ["name"],
            "title": "get_sampleArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfbf4a47000576d55851c92bdc64cfc7197c35a3fbbed115806add06530b1ea9"
        },
        {
          "name": "list_samples",
          "description": "Precomputed real outputs (no upload needed): ids, titles, sizes, download URLs.",
          "inputSchema": {
            "properties": {},
            "title": "list_samplesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:84978ec7189be71ed5a4e9e0fc0c7bfd300efe49da7ee67c16c407757146e29e"
        },
        {
          "name": "start_embedding_job",
          "description": "Queue an embeddings job on an uploaded file. window_seconds: 2 to 30 (default 30); stride_seconds: default window_seconds. picks: EDF/BDF channel labels to keep; channel_names: 10-20 labels overriding the file's; sfreq: required for .npy. Bills 30 s of EEG per window at any window_seconds (refunded on failure). Poll get_job.",
          "inputSchema": {
            "properties": {
              "channel_names": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Channel Names"
              },
              "file_id": {
                "title": "File Id",
                "type": "string"
              },
              "picks": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Picks"
              },
              "sfreq": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Sfreq"
              },
              "stride_seconds": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stride Seconds"
              },
              "window_seconds": {
                "default": 30,
                "title": "Window Seconds",
                "type": "number"
              }
            },
            "required": ["file_id"],
            "title": "start_embedding_jobArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7c9a1611576cdc93fdc6856882c5fbaa76c90444b60bca8b41aa8f7ff67b359a"
        }
      ],
      "digest": "sha256:552598685ee7a1a322aae3897f19c820954c612b404cf86b5bfb3cf8a0d954d3"
    }
  }
}
