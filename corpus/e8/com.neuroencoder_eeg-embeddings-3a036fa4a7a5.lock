{
  "lockfileVersion": 2,
  "subjects": {
    "com.neuroencoder/eeg-embeddings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.neuroencoder.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "neuroencoder",
        "title": "Neuroencoder EEG embeddings",
        "version": "2.4.0",
        "websiteUrl": "https://docs.neuroencoder.com/agents"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "EEG embeddings from EPI-300K: one 768-d vector per window (30 s by default, window_seconds 2 to 30). Without data: list_samples, get_sample. With a local .edf/.bdf/.npy file: create_upload, PUT the file to upload_url yourself, start_embedding_job, get_job until succeeded, then get_result_url (.npy float32 [windows, 768]). Sleep staging of a whole-night PSG: create_upload, PUT, start_sleep_staging_job, get_job, get_result_url (hypnogram JSON and CSV). Research use only; not a medical device.",
      "tools": [
        {
          "name": "account",
          "description": "This API key: tier, limits and usage this month.",
          "inputSchema": {
            "properties": {},
            "title": "accountArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["embeddings", "models"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c6c60ce3d2aa152e074934f4481d4939ac43632be865ef497642153fe318856b"
        },
        {
          "name": "create_upload",
          "description": "Start an upload of a local .edf, .bdf or .npy file (at most 2 GB). Returns id and a presigned upload_url: PUT the file there within 10 minutes with exactly upload_headers (e.g. curl -X PUT --upload-file night.edf -H 'Content-Length: N' '<upload_url>', no Authorization header), then call start_embedding_job with the id. Only the extension of filename is used.",
          "inputSchema": {
            "properties": {
              "bytes": {
                "title": "Bytes",
                "type": "integer"
              },
              "filename": {
                "title": "Filename",
                "type": "string"
              }
            },
            "required": ["bytes", "filename"],
            "title": "create_uploadArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["embeddings", "models"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d814c403e3481adb04b9506b697dfb69f308691239e9d6d538f8cf9d5de1c775"
        },
        {
          "name": "get_job",
          "description": "A job's status (queued, running, succeeded, failed, cancelled, expired), usage, error or result. Poll every 5 s while queued or running.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "get_jobArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["embeddings", "models"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fe833c9a8e917c898455045b0a569bc7b02cb03d26420a07df926983293b0428"
        },
        {
          "name": "get_result_url",
          "description": "Fresh presigned GET URLs (10 minutes) of a succeeded job's result. Embeddings: .npy float32 [windows, 768], window i starts at i * t_start_step s. Sleep staging: url = hypnogram JSON (stage, probabilities, confidence per 30 s epoch), csv_url = CSV, plus the summary.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "get_result_urlArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["embeddings", "models"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7b5262505049a1d75ca5534e1f784b2aa4e69f03b09bed7e079e105e532b4549"
        },
        {
          "name": "get_sample",
          "description": "One sample: README, licence, channels_used, and its embeddings in the POST /v1/embeddings response format (first windows only for long ones).",
          "inputSchema": {
            "properties": {
              "name": {
                "title": "Name",
                "type": "string"
              }
            },
            "required": ["name"],
            "title": "get_sampleArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:f92b10fddb230666b4da9c6b31322c205b61c8cb98561fdb2dcee089a903e902"
        },
        {
          "name": "list_samples",
          "description": "Precomputed real outputs (no upload needed): ids, titles, sizes, download URLs.",
          "inputSchema": {
            "properties": {},
            "title": "list_samplesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:6adae257d17313fbafe4ae04ffaa95a019c521bd8a8bc831448e1ea8697c8068"
        },
        {
          "name": "start_embedding_job",
          "description": "Queue an embeddings job on an uploaded file. window_seconds: 2 to 30 (default 30); stride_seconds: default window_seconds. picks: EDF/BDF channel labels to keep; channel_names: 10-20 labels overriding the file's; sfreq: required for .npy. Bills 30 s of EEG per window at any window_seconds (refunded on failure). Poll get_job.",
          "inputSchema": {
            "properties": {
              "channel_names": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Channel Names"
              },
              "file_id": {
                "title": "File Id",
                "type": "string"
              },
              "picks": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Picks"
              },
              "sfreq": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Sfreq"
              },
              "stride_seconds": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Stride Seconds"
              },
              "window_seconds": {
                "default": 30,
                "title": "Window Seconds",
                "type": "number"
              }
            },
            "required": ["file_id"],
            "title": "start_embedding_jobArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["embeddings", "models"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:1d3be6face022bd16c91239aeab7bba4926463f61817ef279a093fd20c276afc"
        },
        {
          "name": "start_sleep_staging_job",
          "description": "Queue sleep staging of an uploaded whole-night PSG (.edf/.bdf; >= 1 EEG channel with a 10-20 label at >= 100 Hz; EOG used if present). eeg_channel/eog_channel: channels for the YASA features; picks, channel_names as for embeddings. Counts 1 night of the weekly quota (refunded on failure). Poll get_job, then get_result_url. Research use only, not a medical device.",
          "inputSchema": {
            "properties": {
              "channel_names": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Channel Names"
              },
              "eeg_channel": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Eeg Channel"
              },
              "eog_channel": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Eog Channel"
              },
              "file_id": {
                "title": "File Id",
                "type": "string"
              },
              "picks": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Picks"
              },
              "units": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Units"
              }
            },
            "required": ["file_id"],
            "title": "start_sleep_staging_jobArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["embeddings", "models"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0f388e2aef531f66b5da6887c9c9f02558d81306f7a3e759e7bf59acac9a7276"
        }
      ],
      "digest": "sha256:052d0651151cd19da95dfaae2a230908ed796c690d4d4fead2b4b6705ed75e1d"
    }
  }
}
