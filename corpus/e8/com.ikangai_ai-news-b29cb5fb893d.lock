        },
        {
          "name": "search_stories",
          "title": "Search AI news",
          "description": "Search AI news stories by words in the text, with optional filters. All words must match.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "change_type": {
                "description": "What kind of change: capability (New capability), breaking_change (Breaking change), outage (Outage), pricing_and_limits (Pricing and limits), security (Security), regulation (Rules and regulation), business (Business), research (Research), other (Other)",
                "enum": ["capability", "breaking_change", "outage", "pricing_and_limits", "security", "regulation", "business", "research", "other"],
                "type": "string"
              },
              "company": {
                "description": "Only stories about this organisation.",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for.",
                "maxLength": 200,
                "type": "string"
              },
              "since": {
                "description": "Only stories published on or after this ISO 8601 date.",
                "maxLength": 32,
                "type": "string"
              },
              "status": {
                "description": "Only stories with this reliability status.",
                "enum": ["official", "confirmed", "reported", "rumor"],
                "type": "string"
              },
              "topic": {
                "description": "Only this topic, such as Models or Policy & Regulation.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
