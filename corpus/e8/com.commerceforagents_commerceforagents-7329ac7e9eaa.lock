        {
          "name": "compare-vpn",
          "title": "Compare VPN Plans",
          "description": "Use this when the user asks which VPN to buy, wants the cheapest VPN, a VPN for streaming, torrenting or travel, a VPN for public Wi-Fi safety, an audited no-logs VPN, or wants to avoid renewal price traps. Ranks a curated catalog of US-priced (USD) VPN plans (NordVPN, Surfshark, ExpressVPN, Proton VPN, Private Internet Access, CyberGhost), cheapest first, by effective monthly cost over the preferred term including renewals, and shows the upfront price, renewal price, devices, money-back days, audited no-logs (with auditor), jurisdiction and RAM-only servers; privacy facts not confirmed on the provider's own pages are marked unconfirmed. The catalog is a selection, not the whole market; each result states the oldest price-check date. Prices are US/USD; local checkout prices may differ. Inputs, all optional: term_months (1, 12, 24 or 36), min_devices, needs (streaming, p2p; plans where the feature is unconfirmed are excluded), country (only adds a note when not US) and checkout (default false: pricing-page links; true: plan-preselected checkout links). No personal data is used. Keywords: best VPN, cheapest VPN, VPN comparison, VPN deals, no-logs VPN, VPN renewal price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "checkout": {
                "default": false,
                "description": "Default false: return pricing-page links. Set true to return plan-preselected provider checkout links instead.",
                "type": "boolean"
              },
              "country": {
                "description": "Two-letter country code. Prices are always US prices in USD; for a country other than US the result says local checkout prices may differ.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "min_devices": {
                "description": "Minimum simultaneous devices needed.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "needs": {
                "description": "Required features: streaming, p2p (torrenting).",
                "items": {
                  "enum": ["streaming", "p2p"],
                  "type": "string"
                },
                "type": "array"
              },
              "term_months": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 12,
                    "type": "number"
                  },
                  {
                    "const": 24,
                    "type": "number"
                  },
                  {
                    "const": 36,
                    "type": "number"
                  }
                ],
                "default": 24,
                "description": "Preferred subscription length in months: 1, 12, 24 or 36."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currencyNote": {
                "type": "string"
              },
              "disclosure": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "missingTermNote": {
                "description": "Providers with no plan for the requested term.",
                "type": "string"
              },
              "oldestVerifiedDate": {
                "type": "string"
              },
              "plans": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "auditedNoLogs": {
                      "anyOf": [
                        {
                          "type": "boolean"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Independent no-logs audit; null if not confirmed on the provider's pages."
                    },
                    "auditor": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "devices": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Simultaneous devices; null is unlimited."
                    },
                    "effectiveMonthly": {
                      "description": "windowTotal / windowMonths; the ranking price.",
                      "type": "number"
                    },
                    "factsSourceUrls": {
                      "description": "Provider pages the privacy facts were checked against.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "factsVerifiedDate": {
                      "type": "string"
