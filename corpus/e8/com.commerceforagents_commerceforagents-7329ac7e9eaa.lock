        {
          "name": "submit-switch-request",
          "title": "Submit Energy Switch Request",
          "description": "Files a concierge switch request for an offer from a comparison: contract data, IBAN and the consents in one call. The booking form opened by start-booking calls it; autonomous MCP clients that hold the user's complete data and authorization can call it directly. Stores the request encrypted, sends the confirmation emails and returns only masked data. An operator later submits the contract application to the provider.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accountHolder": {
                "description": "Account holder if different from the contract holder.",
                "maxLength": 150,
                "type": "string"
              },
              "authorization": {
                "description": "The three consents the user gave in the form, with the wording versions shown to them.",
                "properties": {
                  "contractSubmissionAccepted": {
                    "const": true,
                    "type": "boolean"
                  },
                  "privacyPolicyAccepted": {
                    "const": true,
                    "type": "boolean"
                  },
                  "privacyPolicyVersion": {
                    "type": "string"
                  },
                  "sepaMandateAccepted": {
                    "const": true,
                    "type": "boolean"
                  },
                  "sepaMandateVersion": {
                    "type": "string"
                  },
                  "type": {
                    "const": "interactive",
                    "type": "string"
                  }
                },
                "required": ["contractSubmissionAccepted", "privacyPolicyAccepted", "privacyPolicyVersion", "sepaMandateAccepted", "sepaMandateVersion", "type"],
                "type": "object"
              },
              "birthDate": {
                "description": "Date of birth, ISO format YYYY-MM-DD. Energy providers require it for the contract.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "desiredStartDate": {
                "description": "Desired contract start, ISO YYYY-MM-DD. Omit for the next possible date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "description": "Email address — receives the booking confirmation and provider documents.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "firstName": {
                "description": "First name (Vorname).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "houseNumber": {
                "description": "House number (Hausnummer), e.g. \"12a\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "iban": {
                "description": "IBAN as entered in the form; spaces allowed.",
                "maxLength": 40,
                "minLength": 15,
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Random per form instance. A retry with the same key returns the first result instead of filing twice.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "language": {
                "description": "Language of the conversation — used for the confirmation email. Default: \"de\".",
                "enum": ["de", "en"],
                "type": "string"
              },
              "lastName": {
                "description": "Last name (Nachname).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "meterNumber": {
                "description": "Meter number (Zählernummer, optional — printed on the meter or the last bill).",
                "maxLength": 60,
                "type": "string"
              },
              "moveInDate": {
                "description": "Move-in date (Umzugsdatum), ISO YYYY-MM-DD. Required for switchType \"relocation\", ignored for a switch.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "phone": {
                "description": "Phone number (optional, some providers ask for it).",
                "maxLength": 40,
                "type": "string"
              },
              "previousCustomerNumber": {
                "description": "Customer number at the previous provider (Kundennummer, optional but speeds up the switch).",
                "maxLength": 60,
                "type": "string"
              },
              "previousProvider": {
                "description": "Current/previous energy provider. Required for switchType \"switch\".",
                "maxLength": 150,
                "type": "string"
              },
              "ref": {
                "description": "Offer reference from a compare-tariffs result (field `ref`).",
                "pattern": "^[a-z0-9]+\\.\\d+$",
                "type": "string"
              },
              "salutation": {
                "description": "Salutation (Anrede), required by the providers: \"herr\", \"frau\" or \"divers\".",
                "enum": ["herr", "frau", "divers"],
                "type": "string"
              },
              "street": {
                "description": "Street of the supply address (Straße).",
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              },
              "switchType": {
                "description": "\"switch\": changing provider at the current address (Anbieterwechsel). \"relocation\": moving in / first contract at this address (Umzug/Neueinzug).",
                "enum": ["switch", "relocation"],
                "type": "string"
              }
            },
            "required": ["authorization", "birthDate", "email", "firstName", "houseNumber", "iban", "idempotencyKey", "lastName", "ref", "salutation", "street", "switchType"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annualTotalEur": {
                "type": "number"
              },
              "maskedIban": {
                "type": "string"
              },
              "nextSteps": {
                "type": "string"
              },
              "provider": {
                "type": "string"
              },
              "requestId": {
                "type": "string"
              },
              "status": {
                "const": "received",
                "type": "string"
              },
              "tariff": {
                "type": "string"
              }
            },
            "required": ["annualTotalEur", "maskedIban", "nextSteps", "provider", "requestId", "status", "tariff"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
