        {
          "name": "start-booking",
          "title": "Open Booking Form",
          "description": "Opens the booking form for one offer from a comparison, identified by its `ref`; the form renders below the message. Read-only: the call submits, stores and sends nothing, and takes no personal data. In the form the user enters the contract details (page 1), then the IBAN and consent (page 2), and files the request there. Messages such as 'Bitte öffne das Buchungsformular', 'ich möchte diesen Tarif', 'den nehme ich', 'book #2' or 'switch me to this', usually sent by the card's 'Jetzt buchen' button, ask for this form. `language` sets the language of the form. There is no self-service checkout link. Keywords: Buchungsformular, Tarif buchen, wechseln, Wechsel beauftragen, Vertrag abschließen, open booking form, book, switch, sign up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "Language of the conversation; the booking form uses it. Default: de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "ref": {
                "description": "Offer reference from a compare-tariffs result (field `ref`). No personal data.",
                "pattern": "^[a-z0-9]+\\.\\d+$",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annualConsumptionKwh": {
                "type": "number"
              },
              "annualTotalEur": {
                "type": "number"
              },
              "city": {
                "type": "string"
              },
              "energyType": {
                "enum": ["electricity", "gas"],
                "type": "string"
              },
              "instruction": {
                "type": "string"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "monthlyAvgEur": {
                "type": "number"
              },
              "postalCode": {
                "type": "string"
              },
              "provider": {
                "type": "string"
              },
              "providerLogoUrl": {
                "type": "string"
              },
              "ref": {
                "type": "string"
              },
              "tariff": {
                "type": "string"
              }
            },
            "required": ["annualConsumptionKwh", "annualTotalEur", "energyType", "instruction", "language", "monthlyAvgEur", "postalCode", "provider", "ref", "tariff"],
            "type": "object"
          },
          "annotations": {
