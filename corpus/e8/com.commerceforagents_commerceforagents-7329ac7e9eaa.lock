        {
          "name": "book-contract",
          "title": "Request Energy Contract (Concierge Switch)",
          "description": "Files a concierge switch request with the complete contract data in one call. Intended for autonomous agents that already hold the user's full profile, IBAN and a standing authorization; in a conversation with a person, start-booking opens a form in which the user enters these data. Commerce for Agents stores the request encrypted and an operator submits the contract application to the provider; the user receives a confirmation email at once and the provider's contract documents later. There is no self-service checkout link. Input: the `ref` of the chosen offer plus the contract data. Postal code and city come from the comparison; previousProvider, previousCustomerNumber and meterNumber are printed on the last energy bill. `consent: true` attests that the user explicitly agreed to (1) Commerce for Agents submitting the contract on their behalf, (2) the SEPA direct-debit mandate for the given IBAN and (3) the privacy policy at commerceforagents.com/privacy, either by an explicit yes in the conversation or by a standing authorization given to the agent. The response contains nextSteps for the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accountHolder": {
                "description": "Account holder if different from the contract holder.",
                "maxLength": 150,
                "type": "string"
              },
              "birthDate": {
                "description": "Date of birth, ISO format YYYY-MM-DD. Energy providers require it for the contract.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "The user has explicitly agreed to: (1) Commerce for Agents submitting this contract on their behalf, (2) the provider's contract terms as shown by tariff-details, (3) the SEPA mandate for the given IBAN, (4) the privacy policy — and has been told the contract can be withdrawn within 14 days. True only after that agreement.",
                "type": "boolean"
              },
              "desiredStartDate": {
                "description": "Desired contract start, ISO YYYY-MM-DD. Omit for the next possible date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "description": "Email address — receives the booking confirmation and provider documents.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "firstName": {
                "description": "First name (Vorname).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "houseNumber": {
                "description": "House number (Hausnummer), e.g. \"12a\".",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "iban": {
                "description": "IBAN for the SEPA direct-debit mandate, no spaces (e.g. DE89370400440532013000).",
                "pattern": "^[A-Z]{2}\\d{2}[A-Z0-9]{10,30}$",
                "type": "string"
              },
              "language": {
                "description": "Language of the conversation — used for the confirmation email. Default: \"de\".",
                "enum": ["de", "en"],
                "type": "string"
              },
              "lastName": {
                "description": "Last name (Nachname).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "meterNumber": {
                "description": "Meter number (Zählernummer, optional — printed on the meter or the last bill).",
                "maxLength": 60,
                "type": "string"
              },
              "moveInDate": {
                "description": "Move-in date (Umzugsdatum), ISO YYYY-MM-DD. Required for switchType \"relocation\", ignored for a switch.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "phone": {
                "description": "Phone number (optional, some providers ask for it).",
                "maxLength": 40,
                "type": "string"
              },
              "previousCustomerNumber": {
                "description": "Customer number at the previous provider (Kundennummer, optional but speeds up the switch).",
                "maxLength": 60,
                "type": "string"
              },
              "previousProvider": {
                "description": "Current/previous energy provider. Required for switchType \"switch\".",
                "maxLength": 150,
                "type": "string"
              },
              "ref": {
                "description": "Offer reference from a compare-tariffs result (field `ref`).",
                "pattern": "^[a-z0-9]+\\.\\d+$",
                "type": "string"
              },
              "salutation": {
                "description": "Salutation (Anrede), required by the providers: \"herr\", \"frau\" or \"divers\".",
                "enum": ["herr", "frau", "divers"],
                "type": "string"
              },
              "street": {
                "description": "Street of the supply address (Straße).",
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              },
              "switchType": {
                "description": "\"switch\": changing provider at the current address (Anbieterwechsel). \"relocation\": moving in / first contract at this address (Umzug/Neueinzug).",
                "enum": ["switch", "relocation"],
                "type": "string"
              }
            },
            "required": ["birthDate", "consent", "email", "firstName", "houseNumber", "iban", "lastName", "ref", "salutation", "street", "switchType"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annualTotalEur": {
                "type": "number"
              },
              "nextSteps": {
                "type": "string"
              },
              "provider": {
                "type": "string"
              },
              "requestId": {
                "type": "string"
              },
              "status": {
                "const": "received",
                "type": "string"
              },
              "tariff": {
                "type": "string"
              }
            },
            "required": ["annualTotalEur", "nextSteps", "provider", "requestId", "status", "tariff"],
            "type": "object"
          },
