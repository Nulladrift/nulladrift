        {
          "name": "compare-esims",
          "title": "Compare Travel eSIMs",
          "description": "Use this when the user needs phone data abroad: a travel eSIM, an international data plan for a trip, avoiding roaming charges, \"will my phone work in Japan\", the cheapest data for N days in a country, or unlimited travel data. Ranks a curated catalog of country eSIM packages (Airalo, Saily, Ubigi, Holafly, Nomad) by USD list price among packages valid for the whole trip with at least the data needed, listing each provider's cheapest package first and then the remaining packages by price, and shows price per GB and per day with a provider link. It does not check phone compatibility; the phone must be eSIM-capable and unlocked. Destinations: AU, BR, CA, CO, DE, ES, FR, GB, GR, IT, JP, KR, MX, NL, PT, TH, TR, US. Inputs: destination (country code), days, optional data_gb, unlimited and providers. No personal data is used. Keywords: travel eSIM, eSIM for Japan, cheapest eSIM, international data plan, roaming.",
