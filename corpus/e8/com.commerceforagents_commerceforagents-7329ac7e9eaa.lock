        {
          "name": "compare-broadband",
          "title": "Find US Internet Providers at an Address",
          "description": "For questions like “what internet providers are at my address?”, “is fiber available?”, “fast home internet near me?”, “Starlink vs cable?”, “cheapest internet at my address?”, “how much is internet here?”, or “moving to an address, what internet can I get?”, look up US fixed broadband provider availability and speed by address or coordinates. Returns FCC availability and maximum advertised speeds by census block (not building-level), ranked by low latency, then speed. Address is sent to the US Census Bureau Geocoder to identify the census block; starting prices (\"from $X/mo\", with conditions, source and check date) for major national and regional providers (e.g. AT&T, Verizon, T-Mobile, Spectrum, Xfinity, Optimum, Starlink). Filter by minimum download speed or technology.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "US street address incl. city and state or ZIP.",
                "minLength": 5,
                "type": "string"
              },
              "lat": {
                "description": "Latitude, if no address is given.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude, if no address is given.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "minDownloadMbps": {
                "description": "Only providers advertising at least this download speed.",
                "minimum": 0,
                "type": "number"
              },
              "technology": {
                "description": "Only these technologies.",
                "items": {
                  "enum": ["fiber", "cable", "dsl", "fixed_wireless", "satellite", "other"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Internet providers found",
            "openai/toolInvocation/invoking": "Looking up internet providers…"
          },
          "digest": "sha256:23cd314cba76697c4b00ecf5558657680665987dc42536f656e4e8e68047b43d"
