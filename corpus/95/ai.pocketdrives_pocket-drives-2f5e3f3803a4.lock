      },
      "instructions": "Pocket Drives MCP — browse and quote luxury vehicle rentals on pocketdrives.ai.\n\nThis is a public, read-only MCP. No authentication is required.\n\nTypical renter flow:\n1. drives_location_suggest — resolve a city, airport, or venue\n2. drives_search_vehicles — find available vehicles for location and dates\n3. drives_vehicle_detail — full vehicle info and host policies\n4. drives_vehicle_availability — monthly calendar with daily rates\n5. drives_get_quote — full price breakdown for selected dates\n\nAdditional tools:\n- drives_airport_search / drives_venue_search — delivery pickup options\n- drives_host_showroom — host profile by username\n- drives_vehicle_reviews — renter reviews (use asset_id from search results)\n\nBooking completion happens in the Pocket Drives iOS app or on pocketdrives.ai.",
      "tools": [
        {
          "name": "drives_airport_search",
          "title": "Airport search",
          "description": "Search airports for delivery pickup with delivery fee information.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum results",
                "type": "integer"
              },
              "query": {
                "description": "Airport name or IATA code to search",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airport search"
          },
          "behavior": {
