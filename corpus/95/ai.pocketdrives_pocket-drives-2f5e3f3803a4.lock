          "digest": "sha256:389b018745553856c70ebc05668119eb386e5b93de496110a6e1af26360afb50"
        },
        {
          "name": "drives_vehicle_availability",
          "title": "Vehicle availability",
          "description": "Get a monthly availability calendar with daily rates for a vehicle.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset_rental_id": {
                "description": "Rental asset ID from search or detail results",
