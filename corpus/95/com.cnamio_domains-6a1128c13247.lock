{
  "lockfileVersion": 2,
  "subjects": {
    "com.cnamio/domains": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.cnamio.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "cnamio",
        "title": "Cnamio",
        "version": "1.0.0",
        "websiteUrl": "https://cnamio.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cnamio connects end users' custom domains to an app. To integrate it into a codebase, call get_integration_guide and follow it. To connect a domain now: check_domain, then connect_domain_automatic (when connectMethods has api_token and the domain owner gives a provider API token) or connect_domain (returns the records to create), then get_connection_status until completed. DNS records that already exist are never changed. Domain tools need the application credentials (HTTP Basic applicationId:secret) or a session token; ask the project owner, never invent them.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check a domain",
          "description": "Read-only. Finds where a domain's DNS is hosted and how it can be connected: provider, setupType, connectMethods (api_token when the records can be created with the user's provider token), nameservers, recordState for a single CNAME, and conflicts with records already published.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkConflicts": {
                "default": true,
                "type": "boolean"
              },
              "dnsRecords": {
                "description": "Records your product needs. host is relative to the zone; placeholders {DOMAIN}, {SUBDOMAIN}, {SLD}, {TLD}; @ is the apex (no CNAME at the apex).",
                "items": {
                  "properties": {
                    "host": {
                      "examples": ["{SUBDOMAIN}"],
                      "type": "string"
                    },
                    "optional": {
                      "type": "boolean"
                    },
                    "priority": {
                      "type": "integer"
                    },
                    "ttl": {
                      "type": "integer"
                    },
                    "type": {
                      "enum": ["A", "AAAA", "CNAME", "TXT", "MX", "CAA"],
                      "type": "string"
                    },
                    "value": {
                      "examples": ["custom.yourapp.com"],
                      "type": "string"
                    }
                  },
                  "required": ["host", "type", "value"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "domain": {
                "examples": ["links.mybrand.com"],
                "type": "string"
              }
            },
            "required": ["dnsRecords", "domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:129997bc150f5e21e47fad022e45089183922f4241b1d2dbba822e842077d4e8"
        },
        {
          "name": "connect_domain",
          "title": "Connect a domain (manual records)",
          "description": "Starts a manual connection: returns the exact records the domain owner must create at their DNS provider and starts watching propagation on the authoritative nameservers (up to 72 hours). Does not change DNS. Follow it with get_connection_status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dnsRecords": {
                "description": "Records your product needs. host is relative to the zone; placeholders {DOMAIN}, {SUBDOMAIN}, {SLD}, {TLD}; @ is the apex (no CNAME at the apex).",
                "items": {
                  "properties": {
                    "host": {
                      "examples": ["{SUBDOMAIN}"],
                      "type": "string"
                    },
                    "optional": {
                      "type": "boolean"
                    },
                    "priority": {
                      "type": "integer"
                    },
                    "ttl": {
                      "type": "integer"
                    },
                    "type": {
                      "enum": ["A", "AAAA", "CNAME", "TXT", "MX", "CAA"],
                      "type": "string"
                    },
                    "value": {
                      "examples": ["custom.yourapp.com"],
                      "type": "string"
                    }
                  },
                  "required": ["host", "type", "value"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "userId": {
                "description": "Your user id, echoed in webhooks.",
                "type": "string"
              }
            },
            "required": ["dnsRecords", "domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:adce7d91da800839f97d76d98fd82b4828d2637b97b66478af0b49bd65ca5dc7"
        },
        {
          "name": "connect_domain_automatic",
          "title": "Connect a domain with the provider token",
          "description": "Creates the records at the domain's DNS provider with an API token the domain owner provides (only when check_domain returned connectMethods containing api_token). The token is used during this call only and is never stored; existing records are never changed or deleted (a conflict returns 409 with the reasons). Never ask for or use DNS provider passwords.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dnsRecords": {
                "description": "Records your product needs. host is relative to the zone; placeholders {DOMAIN}, {SUBDOMAIN}, {SLD}, {TLD}; @ is the apex (no CNAME at the apex).",
                "items": {
                  "properties": {
                    "host": {
                      "examples": ["{SUBDOMAIN}"],
                      "type": "string"
                    },
                    "optional": {
                      "type": "boolean"
                    },
                    "priority": {
                      "type": "integer"
                    },
                    "ttl": {
                      "type": "integer"
                    },
                    "type": {
                      "enum": ["A", "AAAA", "CNAME", "TXT", "MX", "CAA"],
                      "type": "string"
                    },
                    "value": {
                      "examples": ["custom.yourapp.com"],
                      "type": "string"
                    }
                  },
                  "required": ["host", "type", "value"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "providerToken": {
                "description": "The domain owner's API token for their DNS provider.",
                "type": "string"
              },
              "userId": {
                "type": "string"
              }
            },
            "required": ["dnsRecords", "domain", "providerToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62335e20e69915c376017eafef89af95a62ab0bcf80892de4c67f56b5fe934af"
        },
        {
          "name": "get_connection_status",
          "title": "Connection status",
          "description": "Status of a connection: pending, in_progress, completed (connected) or failed (72 hours without propagation).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "description": "job_id returned by connect_domain or connect_domain_automatic",
                "pattern": "^job_[0-9a-f-]{36}$",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d78881eaa0fae2da7b29845993bca699c7774fcd4c070402509e2807b037bdf3"
        },
        {
          "name": "get_integration_guide",
          "title": "Cnamio integration guide",
          "description": "Returns the step-by-step guide to add custom domain connection to a project with Cnamio: records, environment variables, server session route, browser connect window, headless API and webhook verification (Node.js and Python). Start here when integrating Cnamio into code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:363227d4ff209cde7582d3648d94a909bb61d127090886dc7fc18e68138113ad"
        },
        {
          "name": "list_connections",
          "title": "List connections",
          "description": "Recent connections of the application, newest first, optionally for one domain or status. Needs the application credentials (not a session token).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "enum": ["pending", "in_progress", "completed", "failed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:967b147d9fc2cec6edd803d2301839f424851461b89132999a620d35d55beb26"
        },
        {
          "name": "recheck_propagation",
          "title": "Check propagation now",
          "description": "Asks Cnamio to check the domain's authoritative nameservers again now (at most once every 5 minutes per connection).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "description": "job_id returned by connect_domain or connect_domain_automatic",
                "pattern": "^job_[0-9a-f-]{36}$",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a08dbbe324dd80610e758a68315ca983a089248b75fd2078c01dbb116119e93e"
        }
      ],
      "digest": "sha256:d95985875f99c313b225e7ed7a3e3659b64d4604884f6167a554d9eba20d1bab"
    }
  }
}
