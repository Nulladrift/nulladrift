{
  "lockfileVersion": 2,
  "subjects": {
    "com.oroboros-design.angel/base-token-audit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://angel.oroboros-design.com/mcp/base-token-audit"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "angel-base-token-audit",
        "title": "Base Token Audit — ERC-20 honeypot check before swap or approve",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call token_risk before your agent swaps into, approves or signs for an ERC-20 on Base or Ethereum: proxies, owner powers in the bytecode (mint, pause, blacklist, fee setters, trading switch), owner share — risk low, medium or high. Technical data and risk-analysis service only: no custody, no order execution, no investment advice. Free: 500 calls with a free key (no account, no card), 5 calls a day without one. Then €9 one-time for 5,000 calls by card for businesses (buy_pack_with_card), or 0.02 USDC per call via x402.",
      "tools": [
        {
          "name": "buy_pack_with_card",
          "title": "Angel: 5,000 calls by card",
          "description": "For businesses without USDC: 5,000 calls €9.00, one-time, 90 days, businesses only, paid in EUR by card or Link. Returns checkout_url for a person to open; the checkout asks for the company or freelance name. After payment the success page (Accept: application/json) returns the key, and it is e-mailed.\nAfter: any tool with bundle_token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calls": {
                "default": 5000,
                "enum": [5000],
                "type": "integer"
              },
              "email": {
                "description": "Where the key is sent (optional; Stripe asks otherwise).",
                "format": "email",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Angel: 5,000 calls by card"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7c80d249dcf3d302254c8cdbc4203d557c5fade670f9d1d61cf10a831921ddb0"
        },
        {
          "name": "token_risk",
          "title": "Honeypot and rug-pull check for an ERC-20 before swap or approve",
          "description": "Honeypot and rug-pull check for an ERC-20 on Base or Ethereum before a swap, approval or signature, read straight from the contract: upgradeable proxy (EIP-1967, beacon, clone), owner powers in the bytecode (mint, pause, blacklist, fee or max-tx setters, trading switch, burn from any address), owner renounced or active and the owner's share of supply; known issuers labeled. Risk low, medium or high with reasons. Signals, not investment advice. Free with a key (500 calls) or 5 calls a day without one; then 0.02 USDC per call via x402, or 1 call from a key.\nAfter: preflight before your agent pays or signs on the site that offers this token (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Your key instead of paying per call: free (500 calls, POST /key) or bought by card. The connection header X-Bundle-Token works too.",
                "type": "string"
              },
              "chain": {
                "enum": ["base", "ethereum"],
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from (optional; the x402 price is the same for every address).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "token": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Honeypot and rug-pull check for an ERC-20 before swap or approve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a752c8c1c11ae8ce6e73d28253673b0bfb963aed713811120cb25e18d690c428"
        }
      ],
      "digest": "sha256:ee77b0607268280c41148c21fef171a891fcb776aad9425c736fecce3b091ab8"
    }
  }
}
