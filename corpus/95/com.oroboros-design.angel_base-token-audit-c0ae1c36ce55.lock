{
  "lockfileVersion": 2,
  "subjects": {
    "com.oroboros-design.angel/base-token-audit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://angel.oroboros-design.com/mcp/base-token-audit"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "angel-base-token-audit",
        "title": "Base Token Audit — ERC-20 honeypot check and swap route data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call token_risk before your agent swaps into, approves or signs for an ERC-20 on Base or Ethereum: proxies, owner powers in the bytecode (mint, pause, blacklist, fee setters, trading switch), owner share — risk low, medium or high. Then get_swap_route (free) for a quote and the unsigned transaction your agent signs and sends itself. Technical data and risk-analysis service only: no custody, no order execution, no investment advice; the disclosed 0.5 % integrator fee is deducted inside a swap you send. token_risk: 3 free calls per agent, then 0.015 USDC on Base via x402.",
      "tools": [
        {
          "name": "buy_pack_with_card",
          "title": "TradeSignal: pack by card",
          "description": "For agents and people without USDC: prepaid packs paid in EUR by card or Link (100 calls €1.50 · 500 calls €5.00 · 5,000 calls €39.00) — including Link's wallet for agents (one-time card, approved by the human). Returns checkout_url; after payment the success page (Accept: application/json) returns the bundle_token, and it is e-mailed.\nAfter: get_signals with bundle_token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calls": {
                "default": 100,
                "enum": [100, 500, 5000],
                "type": "integer"
              },
              "email": {
                "description": "Where the token is sent (optional; Stripe asks otherwise).",
                "format": "email",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de5c3d3a6f983d6d260b2211850cda478c073cf392aaf1329407c0b11c209329"
        },
        {
          "name": "get_swap_route",
          "title": "Swap route on Base (free)",
          "description": "Free route data: the best swap route on Base (or Ethereum) for a token you already checked with token_risk — quote, minimum out, approval target and, with taker, the unsigned transaction you sign and send yourself. Technical data and risk-analysis service only: no custody, no order execution, no investment advice. Disclosed: the 0.5 % integrator fee is a technical API provisioning fee for computing the route data, deducted by the aggregator inside the swap and sent to Angel's wallet; buy_amount is already net of it. Run token_risk on buy_token first.\nAfter: approve the spender if approval is set, then send the transaction from your own wallet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buy_token": {
                "description": "0x address or USDC, WETH, ETH",
                "type": "string"
              },
              "chain": {
                "enum": ["base", "ethereum"],
                "type": "string"
              },
              "sell_amount": {
                "description": "integer in the token's smallest unit (1 USDC = 1000000)",
                "type": "string"
              },
              "sell_token": {
                "description": "0x address or USDC, WETH, ETH",
                "type": "string"
              },
              "slippage_bps": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "taker": {
                "description": "your wallet, to get the unsigned transaction",
                "type": "string"
              }
            },
            "required": ["buy_token", "sell_amount", "sell_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c2b9ab5887826bec28f3d8945e3443d3471c0f0a5f348791d8433bcb493fa28e"
        },
        {
          "name": "token_risk",
          "title": "Honeypot and rug-pull check for an ERC-20 before swap or approve",
          "description": "Honeypot and rug-pull check for an ERC-20 on Base or Ethereum before a swap, approval or signature, read straight from the contract: upgradeable proxy (EIP-1967, beacon, clone), owner powers in the bytecode (mint, pause, blacklist, fee or max-tx setters, trading switch, burn from any address), owner renounced or active and the owner's share of supply; known issuers labeled. Risk low, medium or high with reasons. Signals, not investment advice. 0.015 USDC base (new payers 0.015, >10 payments 0.0105; 1 pack call).\nAfter: gas-window before you trade on that chain (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack, buy_subscription (pro/desk) or buy_enterprise instead of paying per call.",
                "type": "string"
              },
              "chain": {
                "enum": ["base", "ethereum"],
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "token": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:22b5cf1d1823f7139a7bf133474dbaa87a7d094d30ad0656d911e766a6033c37"
        }
      ],
      "digest": "sha256:4f94680491cc402b64f86dd1b23db3ba0670f102be49af5d32684576400b98ea"
    }
  }
}
