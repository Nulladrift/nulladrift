        {
          "name": "plan_paced_day",
          "title": "Plan a paced day",
          "description": "Builds a pain-friendly, paced daily plan (spoon theory / energy envelope) from today's energy and pain levels and the user's task list. Orders tasks, inserts rest breaks, keeps usage near 70% of capacity and moves overflow tasks to later. Use when someone with chronic pain, fibromyalgia, chronic fatigue or long COVID asks how to pace themselves, plan their day, or avoid crashing. Does not store data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "energy_level": {
