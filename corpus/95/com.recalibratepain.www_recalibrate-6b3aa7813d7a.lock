        {
          "name": "start_calm_exercise",
          "title": "Start a calming exercise",
          "description": "Starts a guided, interactive calming exercise for pain and stress relief: box breathing, relaxing 4-6 breath, 4-7-8 sleep breathing, 5-4-3-2-1 grounding, body scan, progressive muscle relaxation or a pain reprocessing moment. Pass a technique, or a situation (e.g. 'can't sleep', 'panicking', 'flare') to pick one automatically.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "minutes": {
                "description": "Session length in minutes",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "situation": {
                "description": "What the user is dealing with, used to choose a technique",
                "type": "string"
              },
              "technique": {
                "description": "Specific technique, optional",
                "enum": ["box_breathing", "relaxing_breath", "478_breathing", "grounding_54321", "body_scan", "progressive_muscle_relaxation", "pain_reprocessing"],
