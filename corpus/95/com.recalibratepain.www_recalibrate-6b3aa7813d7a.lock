        {
          "name": "check_pain_flare",
          "title": "Pain flare check-in",
          "description": "Runs a quick chronic pain flare check-in: rates flare severity against usual pain, screens symptoms for warning signs that need urgent medical care, and returns a step-by-step flare plan plus trigger insights. Use when the user is having a flare-up or their pain is worse than usual. Does not store data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hours_slept": {
                "description": "Hours slept last night",
                "maximum": 24,
                "minimum": 0,
                "type": "number"
              },
              "pain_level": {
                "description": "Pain right now, 0-10",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "possible_triggers": {
                "description": "Things that may have triggered it (sleep, stress, weather, overdoing it)",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "symptoms": {
                "description": "Symptoms the user describes",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "usual_pain_level": {
                "description": "Usual everyday pain, 0-10",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["pain_level"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
