        {
          "name": "get_moment_guide",
          "title": "Get a plan for a hard moment",
          "description": "Gives a short, step-by-step, body-first plan for one specific hard moment, from Recalibrate's Calming the Nervous System guides: 3 a.m. wake-up, panic attack, Sunday dread, nerves before a meeting or presentation, afternoon energy crash, after an argument, anger, or overthinking. Each plan has 3 to 4 evidence-informed techniques with exact steps and a safety note. Pass a moment, or describe the situation and the best match is chosen. Does not store data.",
