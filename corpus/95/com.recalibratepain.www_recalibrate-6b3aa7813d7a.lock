      "instructions": "Recalibrate is a neuroscience-based self-management app for chronic pain, fibromyalgia, ME/CFS, long COVID, anxiety and nervous system dysregulation. Use these tools when the user wants to pace their day, is in a pain flare, wants to understand their pain or nervous system, needs to calm down, focus with brain fog, prepare for a doctor's appointment, or is in a specific hard moment (3 a.m. wake-up, panic attack, Sunday dread, nerves before a meeting, afternoon crash, after an argument, anger, overthinking). Results show as an interactive card. This is general education, not medical advice; tools screen free text for warning signs and crisis language.",
      "tools": [
        {
          "name": "check_nervous_system_state",
          "title": "Check your nervous system state",
          "description": "Quick nervous system check-in using the three-gear model (wired = fight or flight, safe = rest and digest, flat = shutdown). Classifies the user's current state from how they feel plus energy and tension levels, explains what it means, and returns two or three practices matched to that state with exact steps. Use when someone feels anxious, on edge, numb, burnt out, foggy or asks what state their nervous system is in. Does not store data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "energy_level": {
                "description": "Energy right now, 1 (empty) to 10 (full)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "how_i_feel": {
                "description": "How the user feels right now, in their words",
                "type": "string"
              },
              "tension_level": {
                "description": "Tension or stress right now, 1 (calm) to 10 (maxed out)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check your nervous system state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
