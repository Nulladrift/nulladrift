      "serverInfo": {
        "name": "doseedo",
        "title": "doseedo — film scoring, music & audio for AI agents: spot a video, 100+ AI instruments play your MIDI, sound effects & foley, stem separation, audio to MIDI, mixing to picture, Logic Pro & Ableton sessions",
        "version": "0.22.0",
        "description": "Score video, make music as an agent: 100+ AI instruments play your MIDI, audio, stems, Logic/Ableton",
        "websiteUrl": "https://doseedo.com/mcp"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "doseedo = MUSIC & AUDIO FOR AGENTS: you write the notes, doseedo_render_midi plays them on 100+ instruments (doseedo_instruments, no key) + sound effects + AI audio (stems, transcribe, cover, mix, convert 10 DAWs) + FILM SCORING (doseedo_spot_video, doseedo_score_to_picture) + DAW SESSIONS (read, edit, download a Logic project; Dø Desktop applies edits live). RULES: (1) Before a session build call doseedo_edit_ops_reference ONCE (the default view fits; op:\"<name>\" / section:\"recipes\" for detail) and copy a recipe. (2) Never drive the user's screen (no clicking in Logic, no GUI scripting); without Dø Desktop hand over the downloaded project. (3) YOU write the music, doseedo plays it: every part's notes → doseedo_render_score / doseedo_render_midi (recipe compose-piece); doseedo_generate_music is a prompt-only sketch, never the deliverable. (4) AI renders return several takes that may miss or change notes — offer them, or pick by comparing to your notes. (5) After unzipping a download run EVERY place_local_files command or those tracks open empty (replay audio_source:\"place_local_files\" / a \"NOT bundled\" warning = action required). (6) Verify from the response (replay, cover.instrument_swaps), never by unzipping. (7) Result URLs are pre-signed: plain curl, no auth, 24 h, reusable as audio_url; name:\"x\" → files x_<part>.<ext>. (8) Errors carry code / retryable / next — act on next; service_unavailable or timeout = wait 30 s, retry ONCE, then tell the user which doseedo service is down; never loop. IDS & UNITS: beats are absolute from bar 1 (beat 0 = bar 1) at the project tempo. Faders: set_channel_volume 0.709 = 0 dB, 1.0 = +6 dB (a new track opens at 0 dB in the download). Ids: mint 12 random lowercase hex and on add_track ALWAYS pass both track_id t_<hex> and channel_id ch_<same hex> (bus ch_b_<hex>, marker m_<hex>); every other id (param_id, marker_id, clip_id) comes from doseedo_get_session. Quick Sampler: a one-shot plays at its recorded pitch on C3 = MIDI 60 and plays the WHOLE sample (sample_start_seconds / sample_end_seconds trim it; mode classic stops at note-off — size notes to the sampler's plays_beats from get_session; mode one_shot rings out; edit_midi_notes resizes existing notes by i / pitch / range). Send level 1 = unity (linear 0–2; level_raw 0–127 where offered). WORKFLOW (a session in 5 calls): 1) doseedo_create_session or doseedo_list_sessions → session_id. 2) doseedo_get_session → track ids, regions in beats AND seconds, tempo_bpm, time_signature, mixer, plugins, key_signature (when known), sync.live_edits. On a big session notes are omitted by default (notes_omitted:true) — pass include_notes:true with tracks:[ids] to read them. 3) doseedo_edit_session with ALL ops in ONE call (≤500, in order) + a batch_key so a retry dedups; atomic by default — a rejection names a code (unknown_op, unknown_id, duplicate_id, unknown_plugin, forbidden_group, …) and, where it can, a did_you_mean; fix and re-send the whole batch with the same batch_key. 4) doseedo_download_session → a no-auth URL + a `replay` report of what landed (per track: sample, notes, regions; deferred ops; warnings). 5) curl it into ~/Downloads, unzip, run place_local_files. Never poll the session for changes: doseedo_get_session is the read (the raw /edits feed is rate-limited). ★ FILES ON THE USER'S MACHINE never leave it and are not limited by plan: add_track content_type:\"instrument\" (Quick Sampler is the default instrument) → load_quick_sampler_sample {track_id, sample_path:\"/abs/path.wav\", audio_info:{…header numbers, below}, mode?:\"classic\"|\"one_shot\"|\"slicer\"} (audio_info is REQUIRED for a local sample — the sampler spans the whole file); audio regions: attach_audio {track_id, local_path, audio_info:{sample_rate, frame_count, channels, bits_per_sample, bytes, data_offset}, start_beats} (REPLACES the track's primary region — it does not stack), or N regions with set_track_clips {track_id, clips:[{start_beats, end_beats, audio_ref:{local_path, audio_info, source_offset_samples?}}…]} (REPLACES the track's clips, an earlier attach_audio included; cut one long stem into sections with source_offset_samples — no need to write a file per region). Use one sample rate for every file — the project runs at it. Read audio_info from the header, e.g. `python3 -c \"import wave,os,json,sys; w=wave.open(sys.argv[1]); print(json.dumps({'sample_rate':w.getframerate(),'frame_count':w.getnframes(),'channels':w.getnchannels(),'bits_per_sample':w.getsampwidth()*8,'bytes':os.path.getsize(sys.argv[1]),'data_offset':w.getfp().tell()+8}))\" file.wav` (data_offset = where the samples start; a wrong one makes Logic re-cut the regions). The project with its files in Media/Audio Files is then self-contained — zip and share it as is. doseedo_download_session then returns place_local_files — cp commands to run AFTER unzipping, for local samples and local audio alike — run them exactly as given. Upload only when the SERVER must read the audio (separation, transcription, cover, conversion) or the file is on another device: doseedo_get_upload_url → curl PUT → pass audio_key to a job, or doseedo_add_audio_to_session {audio_key} → sha256 for load_quick_sampler_sample / attach_audio {blob_sha256}. Uploads for processing accept WAV/AIFF/FLAC/MP3/M4A/Ogg on every plan; audio STORED in a session (doseedo_add_audio_to_session) stays lossless (WAV/AIFF/FLAC) only on Pro+ — below Pro+ lossless is not kept, so send Opus (audio/ogg) or use the local-path ops above. PLUGINS insert BY NAME: add_device {channel_id, device:{name:\"Quick Sampler\" | \"ES2\" | \"Channel EQ\" | …}} — no AU codes; a name the strip cannot load is rejected (unknown_plugin, with the closest names). doseedo_list_plugins shows the stock palette and, when the desktop is connected, the plugins on the user's Mac. set_device_param needs a param_id — read it from doseedo_get_session tracks[].plugins[].params (set_device_params_batch accepts param_id or id); rename/move/delete_marker take the marker_id get_session lists (beats ABSOLUTE from bar 1). KEY: doseedo_get_session reports key_signature when the session knows it (synced from Logic, or set); set it with the set_key_signature op {tonic, mode, beat?} where the ops reference lists it — doseedo_analyze_song on a reference (a stem, a take, an upload) gives the key to write in. LIVE vs OFFLINE — \"will my edit land in the user's Logic project?\" is ONE answer everywhere: live_edits:true|false + live_edits_reason on doseedo_desktop_status, doseedo_list_plugins and doseedo_get_session.sync — relay live_edits_reason to the user. Dø Desktop (macOS) puts edits into the Logic project it is linked to: it saves the project, keeps a backup, closes it, writes the edits and reopens it (~10–20 s; apply_mode:\"reopen\"; sync.last_apply says what landed or why it waits) — so send each change as ONE batch and warn the user the project will close and reopen. Otherwise they persist and land in the next download or open — nothing is lost. doseedo_download_session needs NO desktop (rebuilt server-side from the edit log); its replay.deferred lists ops the offline build could not synthesize. doseedo_bounce_session needs the desktop. A deleted session answers 410 session_deleted on every read — stop using its id. COMPOSING: doseedo does not write music — you do, and doseedo plays it. Background music for a video, an instrumental, a theme, a song: plan it (length → bars at your tempo, key, form, instruments from doseedo_instruments), write EVERY part as notes, then doseedo_render_score {parts} (one stem per part + a mix → doseedo_mix) or, for one instrument, doseedo_render_midi — the steps: doseedo_recipes name=\"compose-piece\". doseedo_generate_music is a prompt-only sketch with no notes behind it (no key, bpm/time_signature only tag the caption; a take is often near-silent, a drone or clicks): only when the user asks for exactly that, and never as the deliverable. For a part that must fit: doseedo_analyze_song {audio_url | audio_key} on the reference → key, bpm, meter, sections, chords (synchronous); the session tempo comes from doseedo_get_session. Write the notes yourself in that key ([{pitch, start_beats, duration_beats, velocity}] in beats from bar 1), optionally check them with doseedo_analyze_midi (free), then EITHER put them in the session (set_midi_notes on an instrument track — exact notes, played by the DAW instrument) OR render them as AI audio with doseedo_render_midi {notes | midi_url | session_id+track_id, instrument (+ timbre_preset) = an entry's `call` from doseedo_instruments, bpm, takes?, voice_split?, refine?} → job_id → doseedo_wait_task → result.takes[{url, rank, score}] best-first + seed. The notes are sent AS WRITTEN (no snapping). A chord part needs voice_split:true (one voice per render; result.voices maps them). ANALYSIS (synchronous, no credits): doseedo_analyze_song (key/tempo/sections/chords), doseedo_detect_chords (chord chart), doseedo_beat_grid (beat times), doseedo_analyze_midi (harmony of MIDI you wrote). SCORING (a cue, an arrangement, a film): a FILM starts with doseedo_spot_video {video_key | video_url} (the cue sheet: every cut frame-exact, shots with keyframe JPEGs, dialogue spans, cues with SMPTE in/out, hit points and a bpm — each cue's tempo_map_input goes straight to doseedo_tempo_map) and ends with doseedo_score_to_picture {video_key, tracks:[{audio_url: <mix_url>, start_timecode}]} (the cues laid at their timecodes, ducked under the dialogue, normalised to a delivery loudness and muxed onto the untouched picture — recipe score-a-film); in between you plan and write every part; doseedo_tempo_map turns hit points / SMPTE timecodes into a tempo_map that lands them on downbeats (free); doseedo_render_score plays ALL the parts in one call (parts[] you wrote, a multi-track midi_url, or a musicxml_url — dynamics, articulations, pizz./con sord. are performed; an instrument is one player, a SECTION is players: N on its part — an orchestra's strings are violins I / II, violas, cellos, basses with players 4–8; a CHOIR is Soprano / Alto / Tenor / Bass parts on instrument \"choir\" that sing parts[].lyrics (\"Ooh\" without), players 4–8 for a dense choir — recipe choir) → one stem per part, each with a fit receipt (did it play its notes); doseedo_mix {from_job} MIXES them (levelled, an orchestra seated, a hall, mastered) and returns the mix as a document you edit and re-render — never rebuild a mix by hand; doseedo_session_from_stems {from_job, mix_job} turns that into a Logic/Ableton project (audio + MIDI + tempo map, at the mix's levels and pans) — and {cues: [{cue, start_s, from_job, mix_job}…]} turns a WHOLE FILM into ONE editable project (every cue on one timeline, one joined tempo map with each cue on a bar line, a marker per cue); doseedo_generate_sound makes the hits and textures. MEASURE, don't guess: render_midi results carry takes[].check (notes heard, timing ms, LUFS) when the part was given as notes, doseedo_check_take measures any take, and revise_take_url + revise_start_beats/end_beats on doseedo_render_midi redoes just one region of a take. AI AUDIO is async: submit tools return a job_id plus kind (the registry name, e.g. separate_stems), eta_seconds and suggested_next_wait → doseedo_wait_task {job_id, timeout_seconds ≤50} (one call holds at most 50 s; repeat while still_running — ~15 s transcribe, 1–3 min render, ~4 min audio_to_session). Pass idempotency_key on a submit you might retry. doseedo_list_jobs finds earlier jobs (filter by kind / status / session_id), doseedo_cancel_job stops one (what a cancel can stop and refund differs per kind — each tool description says). Downloads: every result URL (takes, stems, MIDI, sessions, converted projects) is a pre-signed link — curl -OJ <url>, no auth header — valid until the artifact's expires_at (24 h); doseedo_check_task on the job re-issues fresh links after that. Hand a result URL straight to doseedo_transcribe / doseedo_analyze_song / doseedo_separate_stems / doseedo_render_midi timbre_audio_url / doseedo_add_audio_to_session as audio_url. A result too big for one answer comes back reshaped, never cut: `truncated` lists what was shortened and `next` says how to fetch the rest. INSTRUMENTS: doseedo_instruments (no key) — the catalog doseedo_render_midi plays: query:\"low brass\" / pitches:[…] / id:\"cello\"; copy the entry's call (a World instrument is its voice + timbre_preset, e.g. koto = acoustic_guitar + koto:preset1). BRING YOUR OWN SOUND: doseedo_train_instrument (30 s–3 min of ONE instrument → lora_id in ~1–2 min → doseedo_render_midi {…, lora_id} plays any notes in it); timbre_audio_url on doseedo_render_midi (your notes, a recording's tone) and per part on doseedo_render_score — a CHOIR sings as one singer by default (\"choir:trio\" / \"choir:m2\" the other voices) or in ANY SINGER'S voice: parts[].timbre_audio_url = their recording (recipe \"choir\"); a SOLO SINGER is instrument \"voice\" (doseedo_render_midi {instrument:\"voice\", lyrics, notes} — one singer (Solo) by default, \"voice:m2\" a man's voice, timbre_audio_url yours); doseedo_cover_stem (a recorded line — humming, a riff — re-played by another instrument). SOUND DESIGN / FOLEY: doseedo_generate_sound (hits, loops, textures: impacts, whooshes, footsteps, ambiences). RECIPES: doseedo_recipes lists the named pipelines (stems, session, cover, transcribe, render-midi, score, custom-instrument, timbre-transfer, sound-design, analyze-song, convert, bounce, generate; the compose-piece, compose-part and score-a-film guides) with inputs, tool calls in order, outputs, cost/time and how to VERIFY — no key needed. COST: doseedo_quote {job, args} prices a job before submitting — spends nothing. HOUSEKEEPING: doseedo_list_sessions pages with offset; doseedo_delete_sessions soft-deletes in bulk (dry run first, show the user the count, then confirm:true). AUTH: an X-API-Key header on this MCP connection, or an OAuth sign-in (mint a key at https://doseedo.com/settings/api-keys). Scopes: doo / write:sessions = full; ops:<group> (mixer, regions, plugins, tracks, project, markers, automation, history) = only that op category; read:sessions = read-only (writes → 403 code=read_only_key — do not retry, tell the user which scope the key needs). ERRORS are JSON {error, code, retryable, plane, next, request_id}: act on next; quote request_id to support.",
