              "include_params": {
                "description": "Include plugin params (default true). false keeps param_count only.",
                "type": "boolean"
              },
              "session_id": {
                "description": "From doseedo_list_sessions.",
                "type": "string"
              },
              "tracks": {
                "description": "Only these tracks (track_id t_… or channel_id ch_…; a track name matches too). The rest of the session (tempo, markers, buses, sync) is always included.",
                "items": {
                  "type": "string"
