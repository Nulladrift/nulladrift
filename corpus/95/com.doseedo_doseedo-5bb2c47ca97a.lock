        {
          "name": "doseedo_score_to_picture",
          "title": "Lay the score on the picture",
          "description": "SCORE TO PICTURE: the last step of scoring a film. Lays each mixed cue (and any sound effect) on the video at its SMPTE timecode, with dialogue ducking (the lines found on the video's own soundtrack by VAD, or the spans you pass; the music dips ahead of each line and comes back after it), normalises the program to a delivery loudness (web −16, streaming −14, broadcast/ebu −23, atsc −24 LUFS, or a number; true peak under the ceiling) and muxes it onto the picture untouched (no re-encode). Returns the scored video, the printmaster WAV and the music-and-effects stem, plus a report of what it MEASURED: where each track landed (and what was cut at the film's edges), how far the music sits under the lines, and the final loudness and true peak. CPU, no credits. tracks: [{audio_url (a doseedo_mix mix_url as returned, or any public https URL) | audio_key, start_timecode (in the film's timecode) | start_s, gain_db?, role?: music|dialogue|effects, duck?, name?}], ≤ 64. Keep the production audio (default) or drop it (production_audio:\"drop\"). A FILM THAT ALREADY HAS MUSIC: keeping its audio mixes the old music under yours — split it first (doseedo_split_soundtrack) and lay its dialogue and effects stems back (start_s 0, role dialogue / effects) with production_audio:\"drop\": the old music is gone, the lines are kept, and the duck reads the lines off the dialogue stem; lay the old music stem back too with duck:false to keep it (or a part of it). With dialogue tracks the delivery also returns the dialogue / music / effects stems. Up to 25 minutes of film per call (a reel). Async: job_id → doseedo_wait_task. Cancel: a delivery still queued never starts and one running stops within seconds; either way its credit is refunded and the job ends as canceled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dialogue": {
                "description": "Dialogue spans [{start_s, end_s}] to duck under, instead of detecting them (use the cue sheet's dialogue, or your own).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "end_s": {
                      "type": "number"
                    },
                    "start_s": {
                      "type": "number"
                    }
                  },
                  "required": ["end_s", "start_s"],
                  "type": "object"
                },
                "type": "array"
              },
              "duck": {
                "additionalProperties": false,
                "description": "Dialogue ducking (on by default): depth_db (default 10), attack_ms (250: how early before a line the music is down), release_ms (700), sfx (false: duck effects too), enabled.",
                "properties": {
                  "attack_ms": {
                    "maximum": 3000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "depth_db": {
                    "maximum": 40,
                    "minimum": 0,
                    "type": "number"
                  },
                  "enabled": {
                    "type": "boolean"
                  },
                  "release_ms": {
                    "maximum": 5000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "sfx": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "idempotency_key": {
                "description": "Optional. Any unique string for THIS request (e.g. a UUID). Re-sending the same call with the same key after a timeout returns the same job instead of starting a second one.",
                "type": "string"
              },
              "loudness": {
                "anyOf": [
                  {
                    "enum": ["web", "streaming", "broadcast", "ebu", "atsc"],
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "Delivery loudness: \"web\" (−16 LUFS, default), \"streaming\" (−14), \"broadcast\" / \"ebu\" (−23), \"atsc\" (−24), or a LUFS number (−36…−8)."
              },
              "name": {
                "description": "Optional: a name for this job's files, e.g. \"rainy-loop-3\". Every file it returns downloads as <name>_<part>.<ext> (rainy-loop-3_Celesta.wav, rainy-loop-3_rough-mix.wav; one take: rainy-loop-3.wav), so the user can find them. Give each job its own name (a second take: \"rainy-loop-3b\"). Default: doseedo-<last 6 characters of the job id>.",
                "maxLength": 80,
                "type": "string"
              },
              "production_audio": {
                "description": "keep (default) mixes the video's own soundtrack — all of it, its music included — under the score; drop replaces it (lay a doseedo_split_soundtrack's dialogue + effects stems to keep the lines).",
                "enum": ["keep", "drop"],
                "type": "string"
              },
              "production_gain_db": {
                "description": "Trim on the production audio when kept (default 0).",
                "maximum": 12,
                "minimum": -60,
                "type": "number"
              },
              "start_timecode": {
                "description": "SMPTE timecode of the film's first frame (default: the file's own, else 00:00:00:00) — the clock the tracks' start_timecode is read on.",
                "type": "string"
              },
              "tracks": {
                "description": "What to lay on the film, in any order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "audio_key": {
                      "description": "An ingest key instead of audio_url.",
                      "type": "string"
                    },
                    "audio_url": {
                      "description": "The cue's mixed audio (doseedo_mix mix_url as returned) or any public https URL.",
                      "type": "string"
                    },
                    "duck": {
                      "description": "false = this music track is not ducked: a band seen playing in the scene or a drop (the scene's own sound, forward), or the film's own music laid back from doseedo_split_soundtrack (mixed under its lines already). Default true.",
                      "type": "boolean"
                    },
                    "fade_in_s": {
                      "description": "A longer fade in from its first heard sample (the first frame when its head is cut).",
                      "maximum": 30,
                      "minimum": 0,
                      "type": "number"
                    },
                    "fade_out_s": {
                      "description": "A longer fade out to its last heard sample — its own end, length_s, or the last frame: let a piece go over the last shot instead of cutting it.",
                      "maximum": 60,
                      "minimum": 0,
                      "type": "number"
                    },
                    "gain_db": {
                      "description": "Level trim (default 0).",
                      "maximum": 24,
                      "minimum": -60,
                      "type": "number"
                    },
                    "length_s": {
                      "description": "How much of the audio plays from source_start_s (default: to its end or the last frame). The cut is faded (declick).",
                      "maximum": 7200,
                      "minimum": 0.05,
                      "type": "number"
                    },
                    "name": {
                      "description": "A label for the report, e.g. 1M3.",
                      "type": "string"
                    },
                    "repeat_every_s": {
                      "description": "A LOOP: lay this audio again every this many seconds (its period, to the millisecond — a loop of N bars at one fixed tempo: N × beats per bar × 60 / bpm) until repeat_until_s. The file may be longer than its period: its tail rings over the seam. For music that repeats verbatim (a vamp, a bed, a picture that is itself a loop: the cue sheet's video.picture_loop) — render and mix the loop ONCE instead of every stem for the whole length. receipt: tracks[].repeats.",
                      "maximum": 7200,
                      "minimum": 1,
                      "type": "number"
                    },
                    "repeat_until_s": {
                      "description": "With repeat_every_s: no copy starts at or after this film second (default: the last frame).",
                      "maximum": 7200,
                      "minimum": 0,
                      "type": "number"
                    },
                    "role": {
                      "description": "music (default; ducked under the dialogue), dialogue (never ducked — the lines the rest ducks under; a split soundtrack's dialogue stem), effects / sfx (not ducked unless duck.sfx).",
                      "enum": ["music", "dialogue", "effects", "sfx"],
                      "type": "string"
                    },
                    "source_start_s": {
                      "description": "Where in the AUDIO it starts playing (default 0): pick the stretch of a longer piece — a public-domain recording cut to a :30 starts at the phrase you chose. The cut is faded (declick).",
                      "maximum": 7200,
                      "minimum": 0,
                      "type": "number"
                    },
                    "start_s": {
                      "description": "Or where it starts in seconds from the first frame (negative = its head is before the first frame and cut there).",
                      "type": "number"
                    },
                    "start_timecode": {
                      "description": "Where it starts, in the film's timecode (HH:MM:SS:FF) — the cue sheet's start_timecode.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array"
              },
              "video_key": {
                "description": "R2 ingest key of the video (the same upload doseedo_spot_video used).",
                "type": "string"
              },
              "video_url": {
                "description": "https URL of the video, as an alternative to video_key.",
                "type": "string"
              }
            },
            "required": ["tracks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
