              "quantize_midi": {
                "description": "Snap every pitched MIDI lane: \"grid\" = to the grid its own onsets support (straight/swing 8ths, 16ths, triplets, detected per lane); \"score\" = notation positions (straight 8ths). Default off (played timing).",
