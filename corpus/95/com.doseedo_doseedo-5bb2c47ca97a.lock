        {
          "name": "doseedo_convert_project",
          "title": "Convert a DAW project (DAW converter)",
          "description": "DAW CONVERTER: a project rebuilt natively in the target: tracks, MIDI, audio clips, tempo and markers arrive editable (Logic/Ableton/Pro Tools/REAPER pairs also automation, buses/sends, plugin state; into FL 3rd-party plugins only). Sources: Logic .logicx, Ableton .als, FL Studio .flp, Pro Tools .ptx, REAPER .rpp, Cubase .cpr, Dorico .dorico/.musicxml, Studio One .song, GarageBand .band (SOURCE only — zip the .band package like a .logicx; a GarageBand 6 project must be re-saved in GarageBand 10), Bitwig = any .dawproject (Bitwig/Studio One/Cubase export it; a native .bwproject is refused — File > Export… > DAWproject in Bitwig). The enum lists the exact pairs. ★ ASYMMETRIC TARGETS (an undocumented native file is never written): TO Cubase, Studio One or Bitwig = ONE .dawproject the app imports, not a .cpr/.song/.bwproject; TO Dorico = MusicXML (.mxl, Dorico's own notation import), not a .dorico. FROM Cubase the .cpr carries tracks, tempo and MIDI parts but not the audio pool (audio tracks arrive empty). FROM Dorico a .dorico carries players and flows but NOT its notes: convert its MusicXML export instead (.musicxml/.mxl accepted under dorico2*). Every result carries a transfer REPORT: `report`, `lossy`, `summary[]` (what changed), `warnings[]` (read before opening) — relay them; silence is never \"lossless\". Upload first: doseedo_get_project_upload_url + PUT (zip a project FOLDER so its audio travels; a bare project file works too; multipart past ~4 GB). Directions: \"<source>2<target>\"; \"auto2<target>\" detects the source; \"<daw>2<daw>\" rebuilds Logic/Ableton/FL/REAPER/Pro Tools in place (e.g. options.third_party_plugins:\"disable\"). To EDIT a project use doseedo_import_project; to convert a session the tools built: doseedo_download_session → upload that zip → logic2<target> (not a session_id). Async: job_id → doseedo_wait_task (15 s–2 min; `stage`); `file` is a direct storage link. Cancel: no stop — it completes, the job ends canceled, output discarded; the credit is refunded only when the conversion itself fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "direction": {
                "description": "Source and target as \"<source>2<target>\" (logic | ableton | fl | protools | reaper | cubase | dorico | studioone | bitwig | garageband | aaf), \"auto2<target>\" to let the server detect the source, or \"<daw>2<daw>\" to rebuild in the same format (Logic/Ableton/FL/REAPER/Pro Tools only). cubase2* reads a .cpr and *2cubase writes a .dawproject (Cubase 14+/Nuendo open it natively). dorico2* reads a .dorico, .musicxml or .mxl and *2dorico writes MusicXML (.mxl). studioone2* reads a .song and *2studioone writes a .dawproject (Studio One 6.5+ imports it). bitwig2* reads any .dawproject and *2bitwig writes a .dawproject (Bitwig 5+ imports it). garageband2* reads a zipped .band package (source only — no *2garageband). aaf2* reads an AAF (Pro Tools / Logic / Resolve / Premiere export) — zip the .aaf with its audio files so clips relink by name; audio only, every clip unwarped at its exact time, no *2aaf or aaf2dorico.",
                "enum": ["logic2ableton", "ableton2logic", "fl2logic", "fl2ableton", "ableton2fl", "logic2fl", "reaper2logic", "reaper2ableton", "reaper2fl", "logic2reaper", "ableton2reaper", "fl2reaper", "protools2logic", "protools2ableton", "protools2fl", "protools2reaper", "logic2protools", "ableton2protools", "fl2protools", "reaper2protools", "cubase2logic", "cubase2ableton", "cubase2fl", "cubase2reaper", "cubase2protools", "cubase2dorico", "logic2cubase", "ableton2cubase", "fl2cubase", "reaper2cubase", "protools2cubase", "dorico2logic", "dorico2ableton", "dorico2fl", "dorico2reaper", "dorico2protools", "dorico2cubase", "logic2dorico", "ableton2dorico", "fl2dorico", "reaper2dorico", "protools2dorico", "garageband2logic", "garageband2ableton", "garageband2fl", "garageband2reaper", "garageband2protools", "garageband2cubase", "garageband2dorico", "bitwig2logic", "bitwig2ableton", "bitwig2fl", "bitwig2reaper", "bitwig2protools", "bitwig2cubase", "bitwig2dorico", "logic2bitwig", "ableton2bitwig", "fl2bitwig", "reaper2bitwig", "protools2bitwig", "cubase2bitwig", "dorico2bitwig", "studioone2logic", "studioone2ableton", "studioone2fl", "studioone2reaper", "studioone2protools", "studioone2cubase", "logic2studioone", "ableton2studioone", "fl2studioone", "reaper2studioone", "protools2studioone", "cubase2studioone", "aaf2logic", "aaf2ableton", "aaf2fl", "aaf2reaper", "aaf2protools", "aaf2cubase", "aaf2studioone", "aaf2bitwig", "logic2logic", "ableton2ableton", "fl2fl", "reaper2reaper", "protools2protools", "auto2logic", "auto2ableton", "auto2fl", "auto2reaper", "auto2protools", "auto2cubase", "auto2dorico", "auto2bitwig", "auto2studioone"],
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Any unique string for THIS request (e.g. a UUID). Re-sending the same call with the same key after a timeout returns the same job instead of starting a second one.",
                "type": "string"
