                "type": "string"
              },
              "instrument": {
                "description": "REQUIRED. The catalog instrument it is closest to (call.instrument from doseedo_instruments, e.g. \"violin\", \"acoustic_guitar\", \"flute\", \"percussion\").",
                "type": "string"
