        {
          "name": "doseedo_tempo_map",
          "title": "Tempo map from hit points",
          "description": "Scoring to picture: turn HIT POINTS (a cut, an impact, the title card — as seconds from the cue start or SMPTE timecodes) into a TEMPO MAP that lands each hit exactly on a downbeat (or a beat / an eighth — per hit with hits[].land), staying near your tempo and inside bpm_range. A cue whose pace changes (she runs faster, then stops): give the hit where it changes a bpm, and the map moves to that tempo from there, every hit still landed. An AD or any cue that must hold ONE tempo: fixed_bpm: true (+ max_deviation_bpm, tolerance_ms) finds the tempo and the bar-1 offset (music_offset_s) landing the most hits, and says which ones it could not. Returns tempo_map [{beat, bpm}] to pass unchanged to doseedo_render_midi / doseedo_render_score / doseedo_session_from_stems, and hits[] with the beat, bar and beat-in-bar each hit lands on — write the accent, stinger or change there. Handles 23.976 / 24 / 25 / 29.97 (\";\" = drop-frame) / 30 / 50 / 59.94 / 60 fps timecode. Pure math: free, instant, no key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bpm": {
                "description": "The cue's tempo (20–300) — the map stays as close to it as the hits allow.",
                "type": "number"
              },
              "bpm_range": {
                "description": "Allowed tempo range [min, max] (default ±12 % of bpm).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "fixed_bpm": {
                "description": "ONE tempo for the whole cue (an ad, a song-form cue): the solver picks the tempo (within max_deviation_bpm of bpm; default exactly bpm) and where bar 1 sits (music_offset_s, default within the first bar; offset_range_s) so the most hits land within tolerance_ms (default 40). Hits it cannot land come back landed:false with nearest_beat — never an error.",
                "type": "boolean"
              },
              "fps": {
                "description": "Frame rate of the timecodes: 23.976, 24, 25, 29.97, 30, 50, 59.94, 60.",
                "type": "number"
              },
              "hits": {
                "description": "The moments the music must land on: [{time_s} (seconds from the cue start) or {timecode: \"01:00:12:08\"} (film timecode, with fps and start_timecode), label?, land?, bpm?}] — land = THIS hit's landing (\"downbeat\", \"beat\" or \"eighth\"; default: the request's land), e.g. the big cuts on bar lines and a quick accent on an eighth. bpm = the tempo FROM this hit on, a new section (the chase at 160 from the cut where she starts running, back to 112 when she stops), until a later hit names another; the range around it scales with it. A bare number = {time_s}.",
                "items": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "bpm": {
                          "type": "number"
                        },
                        "label": {
                          "type": "string"
                        },
                        "land": {
                          "enum": ["downbeat", "beat", "eighth"],
                          "type": "string"
                        },
                        "priority": {
                          "description": "What this hit is worth when not every hit can land (tolerance_ms): \"must\" for the moment the cue is written to (the reveal, the title, the drop) — the map lands it first and the rest around it; \"low\" gives way first. Default \"normal\"; a downbeat hit already outweighs a beat.",
                          "enum": ["must", "high", "normal", "low"],
                          "type": "string"
                        },
                        "time_s": {
                          "type": "number"
                        },
                        "timecode": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "land": {
                "description": "Land hits on bar lines (default), on any beat, or on any eighth — the default for every hit without its own land.",
                "enum": ["downbeat", "beat", "eighth"],
                "type": "string"
              },
              "max_deviation_bpm": {
                "description": "How far the tempo may move from bpm (both modes; in place of bpm_range). A variable map at 124 ±12 % can swing 11+ bpm between hits — 3 keeps it a steady groove.",
                "type": "number"
              },
              "offset_range_s": {
                "description": "fixed_bpm: where bar 1 may sit on the cue, [min, max] seconds (default [0, one bar]).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "start_s": {
                "description": "Alternative: the cue start in seconds of film time (informational when hits are time_s).",
                "type": "number"
              },
              "start_timecode": {
                "description": "Film timecode of the cue's first downbeat (bar 1); hit timecodes are measured from it.",
                "type": "string"
              },
              "time_signature": {
                "description": "Meter (default 4/4).",
                "type": "string"
              },
              "tolerance_ms": {
                "description": "SOFT hits (0–250 ms): a hit within this of the grid counts as landed, and one the grid can't reach is reported (landed:false, with nearest_beat and off_ms), never refused. The map is fitted over the whole cue, so it lands the most hits — downbeats and priority \"must\" first. Every hit then carries error_ms; hit_rate = landed / all. A hit with landed:false gets no accent of its own (an accent between the beats sounds like a mistake).",
                "type": "number"
              }
            },
            "required": ["bpm", "hits"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb365f691303dbe4f4146324c46351df4b6d96f496137be8ff2d0073a024a9c2"
        },
        {
          "name": "doseedo_train_instrument",
          "title": "Train a custom instrument",
          "description": "Make a CUSTOM INSTRUMENT in your own sound: upload 30 s–3 min of ONE instrument playing (your own player, a rare or folk instrument, a prepared/invented instrument, a vintage synth) and doseedo trains a private adapter (LoRA) on its serving instrument model in about 1–2 minutes. After that, doseedo_render_midi {instrument: <the same instrument>, lora_id} plays ANY notes you write in that sound. Several takes help (up to 8 files; the first 3 min are used, ≥8 s required); a clean, solo, dry recording works best. instrument = the closest catalog instrument — it picks the model voice the adapter trains on (a shamisen trains as acoustic_guitar, a whistle as flute: doseedo_instruments lists each one's call.instrument). The notes are transcribed for you (pass notes to skip that). 20 credits. Result: lora_id, name, the windows it trained on, loss first→last, and `use` (the render args). Earlier ones: doseedo_list_jobs {kind:\"train_instrument\"}. Owner-only: no one else can render with it. Async: job_id → doseedo_wait_task (~1–2 min). Cancel: the plane has no stop for a running training — it runs to completion (credits spent), the job ends as canceled and its output is discarded. Only a job still queued at the plane is refunded by the plane's own failure refund.",
