        {
          "name": "decode_riscv_trap",
          "title": "Decode a RISC-V trap cause",
          "description": "Decodes the mcause value of a 32-bit RISC-V core into the exception or interrupt it names, and says what mepc and mtval hold for that cause and what to check. Use it when a RISC-V microcontroller, such as an ESP32-C3 or a GD32V, stops in its trap handler and the register values are known. It covers the causes of the RISC-V privileged specification, not vendor-specific ones.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mcause": {
                "description": "The mcause register. Bit 31 set means an interrupt.",
