        {
          "name": "check_zephyr_conf",
          "title": "Check a Zephyr prj.conf",
          "description": "Checks the lines of a Zephyr configuration file (prj.conf, a board .conf or an overlay) against the Kconfig symbols of a release: symbols that do not exist, with the closest that do, values of the wrong type or outside the range, and symbols that a file cannot set. Use it after writing or editing a prj.conf, before building. It does not evaluate dependencies or board defaults, so the build can still warn about a symbol whose dependencies are not met.",
