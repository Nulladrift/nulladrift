      },
      "instructions": "For microcontroller firmware. The tools give exact registers, bit fields, interrupts and pins from the vendors' own files and Kconfig symbols and devicetree bindings from the Zephyr releases, compute CAN, UART, I2C, timer and watchdog values, check code and configuration against a part or a release, and decode crashes: Cortex-M fault registers, a RISC-V trap, an ESP-IDF panic, a Zephyr fatal error. Use the lookup, calc, check and decode tools instead of recalling these values from memory, also when a value seems familiar, and say so when a tool has no data for a part. Register data covers STM32, nRF51, nRF52, nRF53, nRF54L and nRF91, RP2040 and RP2350, ESP32, AVR (ATmega, ATtiny, AVR Dx and Ex), Microchip SAM C21, D, E5x and L21, TI MSPM0, and NXP i.MX RT, LPC, MCX, K32 L and Kinetis parts. find_device says whether a part is covered. No datasheet text is included.\n\nBefore you write code for a microcontroller family, an RTOS, an SDK or a bus that has not come up in this session, call get_platform_pitfalls. For a symptom seen on hardware, call diagnose_symptom before you change code. To observe what the firmware does, or for a compiler, linker or macro technique, call get_debug_technique. Before a board bring-up, a driver, an interrupt handler, a watchdog, a firmware update or low-power work, call get_playbook and take its steps in order. To harden firmware, call get_break_list and find what the code does under each fault. Before you call firmware done, review it with get_firmware_rules and report by rule id.\n\nYou work on firmware with an engineer who has the board. You cannot see it. The engineer is your **eyes**, and every claim about the hardware needs **evidence** from the target.\n\n- **Observe before you edit.** A symptom on hardware gets a measurement before it gets a code change. Most symptoms start outside the code: power, clock, reset, pins, configuration.\n- **Ask for one observation at a time.** Say where to look, the value you expect, and what each answer will mean. One clear question gets a measurement. Five get a guess.\n- **Take the cheapest test that splits the suspects.** A read beats a scope, and a scope beats a rewrite. Count what the test itself disturbs: a debugger and a print change the timing, and reading some registers clears them.\n- **Change one thing between two tests.** Two changes give one result that nobody can read.\n- **Look values up.** Registers, bits, pins, interrupt names and timing values come from the vendor's files, because a value that is nearly right does not work on hardware.\n- **Leave evidence and a way back in.** Every wait gets a timeout. Every failure leaves a trace: a reset cause, a fault record, a counter. The debug port, the bootloader or a recovery path stays reachable.\n- **Prove the fix.** Make it fail again, then pass, with the same measurement. A fix that nobody can explain is not kept.\n- **Report what ran.** \"It builds\" is not \"it works\". Say what was proven on the target and what was not, and take temporary instrumentation out again.",
      "tools": [
        {
          "name": "calc_can_bit_timing",
          "title": "Calculate CAN bit timing",
          "description": "Computes the CAN bit timing for a clock, a bit rate and a sample point: prescaler, time quanta, both segments and the jump width, with the real bit rate, the real sample point and the register value. Use it when setting up CAN or CAN FD instead of working the values out by hand. The controller classic gives the counts for a classic CAN controller whose time quantum is the prescaler times the clock period, within the fields most of them have: a prescaler up to 64, segments up to 16 and 8 quanta, and a jump width up to 4. sja1000 and mcp2515 are those two controllers, which halve the oscillator before the prescaler and have limits of their own. With bxcan (CAN_BTR of STM32) or mcan-nominal and mcan-data (NBTP and DBTP of Bosch M_CAN, which several vendors use for CAN FD), it also packs the register value.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bit_rate": {
                "description": "The bit rate in bits per second, for example 500000. Above 1000000 only for mcan-data.",
                "maximum": 8000000,
                "minimum": 1000,
                "type": "integer"
              },
              "clock_hz": {
                "description": "The clock that feeds the bit timing logic of the CAN controller, in Hz. It is often not the core clock. For sja1000 and mcp2515, the frequency of the oscillator.",
                "maximum": 4000000000,
                "minimum": 1,
                "type": "integer"
              },
              "controller": {
                "description": "classic (counts only, a plain prescaler), sja1000 or mcp2515 (counts only), bxcan, mcan-nominal (arbitration phase) or mcan-data (the data phase of CAN FD).",
                "enum": ["classic", "sja1000", "mcp2515", "bxcan", "mcan-nominal", "mcan-data"],
                "type": "string"
              },
              "sample_point": {
                "description": "The wanted sample point as a fraction of the bit. Default 0.875, which CANopen and DeviceNet use.",
                "maximum": 0.95,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["bit_rate", "clock_hz", "controller"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate CAN bit timing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tools"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:4ff7b6e40180bac86adb374a70fba79aa90c5bdf4ecc91fd8e77a6ee3b251167"
        },
        {
          "name": "calc_i2c_timing",
          "title": "Calculate I2C timing",
          "description": "Computes I2C timing from the limits of the I2C-bus specification: the SCL low and high times for a bus speed as counts of the controller's clock, or the register value of a controller it knows. It can also check an existing register value against the limits. Use it to set up an I2C controller instead of copying a timing value from another project, where the clock differs. The controller generic gives counts for any controller that takes SCL low and high times. The controller stm32-timingr gives I2C_TIMINGR for the STM32 series that have that register, which F1, F2, F4 and L1 do not.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "analog_filter": {
                "description": "stm32-timingr only: whether the analog noise filter is on. Default true, as after reset.",
                "type": "boolean"
              },
              "bus_hz": {
                "description": "The wanted SCL frequency in Hz. Default: the highest the mode allows.",
                "maximum": 1000000,
                "minimum": 1000,
                "type": "integer"
              },
              "clock_hz": {
                "description": "The clock of the I2C controller in Hz. For stm32-timingr, the I2C kernel clock selected in RCC.",
                "maximum": 4000000000,
                "minimum": 1,
                "type": "integer"
              },
              "controller": {
                "description": "generic for counts of the controller's clock, or stm32-timingr for the STM32 I2C_TIMINGR register.",
                "enum": ["generic", "stm32-timingr"],
                "type": "string"
              },
              "digital_filter": {
                "description": "stm32-timingr only: the DNF field of I2C_CR1, 0 to 15. Default 0.",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "fall_ns": {
                "description": "The fall time of SCL and SDA in ns. Default: the longest the mode allows.",
                "maximum": 300,
                "minimum": 0,
                "type": "number"
              },
              "mode": {
                "description": "standard (up to 100 kHz), fast (up to 400 kHz) or fast-plus (up to 1 MHz).",
                "enum": ["standard", "fast", "fast-plus"],
                "type": "string"
              },
              "rise_ns": {
                "description": "The rise time of SCL and SDA in ns. Default: the longest the mode allows.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "timingr": {
                "description": "stm32-timingr only: an existing I2C_TIMINGR value to check. Omit it to compute one.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              }
            },
            "required": ["clock_hz", "controller", "mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate I2C timing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tools"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b30be175e7cf6f82028eaeab38437a70148d1e4c81ffbb33bd1f112afad1f5b4"
        },
        {
          "name": "calc_timer_prescaler",
          "title": "Calculate timer prescaler and reload",
          "description": "Computes the prescaler and the auto-reload value of a timer for an update or PWM frequency, with the real frequency, its error and the PWM duty resolution in bits. Use it to set up a periodic interrupt or a PWM output. For any timer with a 16-bit prescaler and a 16-bit or 32-bit counter that both count from 0, which is how most microcontroller timers are built.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clock_hz": {
                "description": "The clock of the timer in Hz, which is often not the bus clock: check the clock tree of the part.",
                "maximum": 4000000000,
                "minimum": 1,
                "type": "integer"
              },
              "counter_bits": {
                "anyOf": [
                  {
                    "const": 16,
                    "type": "number"
                  },
                  {
                    "const": 32,
                    "type": "number"
                  }
                ],
                "description": "The width of the counter, 16 or 32. Default 16."
              },
              "frequency_hz": {
                "description": "The wanted update or PWM frequency in Hz. Fractions are allowed, such as 0.5.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              }
            },
            "required": ["clock_hz", "frequency_hz"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate timer prescaler and reload"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tools"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:2461a3888f9bd615af1e3b184c0b13bdf1269ec4c546400433ba931e060a90fc"
        },
        {
          "name": "calc_uart_baud",
          "title": "Calculate a UART baud rate divisor",
          "description": "Computes the divisor for a UART baud rate from the peripheral clock, with the real baud rate and its error in percent, and the BRR value for STM32. Use it to set a baud rate or to find out why a link shows framing errors or garbage. The peripheral generic fits any UART that divides its clock by a whole number, with 16 or 8 samples a bit. For the STM32 USART and LPUART it also gives the BRR value.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "baud": {
                "description": "The baud rate, for example 115200.",
                "maximum": 20000000,
                "minimum": 50,
                "type": "integer"
              },
              "clock_hz": {
                "description": "The clock of the UART in Hz.",
                "maximum": 4000000000,
                "minimum": 1,
                "type": "integer"
              },
              "oversampling": {
                "anyOf": [
                  {
                    "const": 8,
                    "type": "number"
                  },
                  {
                    "const": 16,
                    "type": "number"
                  }
                ],
                "description": "Samples per bit, 16 or 8. Default 16. The LPUART ignores it."
              },
              "peripheral": {
                "description": "generic, stm32-usart or stm32-lpuart.",
                "enum": ["generic", "stm32-usart", "stm32-lpuart"],
                "type": "string"
              }
            },
            "required": ["baud", "clock_hz", "peripheral"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate a UART baud rate divisor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tools"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:5d4745de9d69d5c2f7a6f810be498cec9d46c365afcc231021a34b7e11858a5c"
        },
        {
          "name": "calc_watchdog_timeout",
          "title": "Calculate watchdog register values",
          "description": "Computes the register values of a watchdog for a timeout, with the real timeout. Use it to set up a watchdog instead of working the prescaler and the reload value out by hand. It knows the STM32 independent watchdog (IWDG_PR and IWDG_RLR), the STM32 window watchdog (WDGTB and the counter) and the nRF watchdog (CRV). The timeout is never shorter than the one asked for.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clock_hz": {
                "description": "The clock of the watchdog in Hz. Default 32000 for stm32-iwdg (LSI) and 32768 for nrf-wdt. Required for stm32-wwdg: its APB clock.",
                "maximum": 4000000000,
                "minimum": 1,
                "type": "integer"
              },
              "timeout_ms": {
                "description": "The wanted timeout in milliseconds.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "watchdog": {
                "description": "stm32-iwdg, stm32-wwdg or nrf-wdt.",
                "enum": ["stm32-iwdg", "stm32-wwdg", "nrf-wdt"],
                "type": "string"
              }
            },
            "required": ["timeout_ms", "watchdog"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
