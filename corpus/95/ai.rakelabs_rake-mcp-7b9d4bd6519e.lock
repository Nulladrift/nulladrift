      "serverInfo": {
        "name": "rake-mcp",
        "title": "Rake",
        "version": "3.0.0",
        "description": "Write and debug firmware with exact chip data",
        "websiteUrl": "https://www.rakelabs.ai/docs/firmware-mcp",
        "icons": [
          {
            "src": "https://mcp.rakelabs.ai/favicon-96x96.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          },
