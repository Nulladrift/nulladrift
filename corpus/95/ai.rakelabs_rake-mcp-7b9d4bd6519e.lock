                "type": "string"
              },
              "mepc": {
                "description": "The mepc register: the program counter that the core saved when it took the trap.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              },
              "mtval": {
                "description": "The mtval register: the faulting address or instruction, depending on the cause.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              }
            },
            "required": ["mcause"],
            "type": "object"
