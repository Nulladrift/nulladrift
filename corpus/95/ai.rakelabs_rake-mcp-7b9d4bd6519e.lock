        {
          "name": "check_build_flags",
          "title": "Check compiler and linker flags",
          "description": "Reads compiler and linker command lines, or the values of CFLAGS and LDFLAGS, and reports what bites on a microcontroller: objects built for different cores or float ABIs, a link line without the core or the float ABI, sections without garbage collection, a build without debug information or without warnings. Use it after writing or changing a Makefile, a CMake toolchain file or the flags of a build. It knows the flags of GCC and Clang and reads the flags only, not the code.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "flags": {
                "description": "The command lines or lists of flags, one command per line: a compile line and the link line, or the values of CFLAGS and LDFLAGS.",
                "maxLength": 48000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["flags"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check compiler and linker flags"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tools"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6d358f6da1184ca8f03fd3e1b5423bc5444c689288191727d715fbf912580313"
        },
        {
          "name": "check_esp_idf_api",
          "title": "Check code against an ESP-IDF release",
          "description": "Finds the ESP-IDF functions, types and headers in a piece of code that do not fit the ESP-IDF release of the project: removed, changed or deprecated by that release, or introduced after it. Each finding names the replacement. Use it on ESP32 code before building, when the code may come from another ESP-IDF major version, for example ESP-IDF 4 driver calls in an ESP-IDF 5 project. The list comes from Espressif's migration guides for ESP-IDF 5.0 to 5.5, so a name outside those guides is not judged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "The C or C++ source to check.",
                "maxLength": 48000,
                "minLength": 1,
                "type": "string"
              },
              "idf_version": {
                "description": "The ESP-IDF release the project builds with, for example 5.3 or 4.4.",
                "pattern": "^v?[45]\\.\\d{1,2}(\\.\\d{1,2})?$",
                "type": "string"
              }
            },
            "required": ["code", "idf_version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check code against an ESP-IDF release"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tools"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:94d2a63fd0ec5db8530bc3c349b7f53f9e53a1fcc9a68843d3b5deb3b9bb5aed"
        },
        {
