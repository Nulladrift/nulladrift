        {
          "name": "decode_cortex_m_fault",
          "title": "Decode Cortex-M fault registers",
          "description": "Decodes Arm Cortex-M fault status register values (CFSR, and optionally HFSR, MMFAR, BFAR, SFSR, SFAR, EXC_RETURN and the stacked PC) into the faults they record and the checks to make next. For Cortex-M3, M4, M7, M33, M55 and M85. Use it when firmware lands in HardFault, MemManage, BusFault, UsageFault or SecureFault and the register values are known.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bfar": {
                "description": "BusFault Address Register, read from 0xE000ED38.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              },
              "cfsr": {
                "description": "Configurable Fault Status Register, read from 0xE000ED28.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              },
              "exc_return": {
                "description": "The value of LR at the first instruction of the fault handler, 0xFFFFFFxx.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              },
              "hfsr": {
                "description": "HardFault Status Register, read from 0xE000ED2C.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              },
              "mmfar": {
                "description": "MemManage Fault Address Register, read from 0xE000ED34.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              },
              "sfar": {
                "description": "SecureFault Address Register, read from 0xE000EDE8. Cores with TrustZone only.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              },
              "sfsr": {
                "description": "SecureFault Status Register, read from 0xE000EDE4. Cores with TrustZone only.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              },
              "stacked_pc": {
                "description": "The PC value in the exception stack frame.",
                "pattern": "^0[xX][0-9a-fA-F]{1,8}$",
                "type": "string"
              }
            },
            "required": ["cfsr"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Decode Cortex-M fault registers"
