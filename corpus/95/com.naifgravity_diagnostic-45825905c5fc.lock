            "required": ["collision_id", "confidence", "confidence_label", "diagnosis", "evidence_hash", "failure_class", "free_checks", "policy", "quote_endpoint", "repair_available", "repair_scope", "secrets_redacted", "trace_id"],
            "type": "object"
