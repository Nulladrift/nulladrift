        {
          "name": "diagnose_json_schema_failure",
          "title": "Diagnose JSON / MCP Schema Type Mismatch",
          "description": "Diagnose a bounded JSON Schema or MCP input-schema type mismatch using only sanitized paths and types; no raw payload is required.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "actual_type": {
                "enum": ["string", "integer", "number", "boolean", "object", "array", "null"],
                "type": "string"
              },
              "context": {
                "maxLength": 2048,
                "type": "string"
              },
              "error_message": {
                "maxLength": 4096,
                "minLength": 3,
                "type": "string"
              },
              "expected_type": {
                "enum": ["string", "integer", "number", "boolean", "object", "array", "null"],
                "type": "string"
              },
              "instance_path": {
                "maxLength": 1024,
                "pattern": "^(?:\\/(?:[^~/]|~[01])*)*$",
                "type": "string"
              },
              "schema_path": {
                "maxLength": 1024,
                "pattern": "^(?:\\/(?:[^~/]|~[01])*)*$",
                "type": "string"
              }
            },
            "required": ["error_message"],
