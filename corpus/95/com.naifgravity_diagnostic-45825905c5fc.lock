      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free bounded diagnostics only. Never send secrets. These tools do not create checkout, payment or production changes. If repair_available is true, use the returned existing quote_endpoint separately.",
      "tools": [
        {
          "name": "diagnose_api_auth_401",
          "title": "Diagnose API Authentication 401",
          "description": "Diagnose a sanitized HTTP 401 authentication failure without accepting credentials or contacting the target endpoint.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "maxLength": 2048,
                "type": "string"
              },
              "endpoint": {
                "description": "Only scheme, host and path are retained; query and fragment are discarded.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "error_message": {
                "maxLength": 4096,
                "minLength": 3,
                "type": "string"
              },
              "http_status": {
                "const": 401,
                "type": "number"
              },
              "method": {
                "enum": ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS"],
                "type": "string"
              }
            },
            "required": ["error_message", "http_status"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "collision_id": {
                "type": ["string", "null"]
              },
              "confidence": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "confidence_label": {
                "enum": ["high", "medium", "low"],
                "type": "string"
              },
              "diagnosis": {
                "type": "string"
              },
              "evidence_hash": {
                "type": "string"
              },
              "failure_class": {
                "type": "string"
              },
              "free_checks": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "policy": {
                "additionalProperties": false,
                "properties": {
                  "automatic_checkout": {
                    "type": "boolean"
                  },
                  "automatic_execution": {
                    "type": "boolean"
                  },
                  "automatic_payment": {
                    "type": "boolean"
                  },
                  "automatic_quote": {
                    "type": "boolean"
                  },
                  "free_diagnosis": {
                    "type": "boolean"
                  },
                  "raw_input_stored": {
                    "type": "boolean"
                  }
                },
                "required": ["automatic_checkout", "automatic_execution", "automatic_payment", "automatic_quote", "free_diagnosis", "raw_input_stored"],
                "type": "object"
              },
              "quote_endpoint": {
                "type": ["string", "null"]
              },
              "repair_available": {
                "type": "boolean"
              },
              "repair_scope": {
                "type": ["string", "null"]
              },
              "secrets_redacted": {
                "type": "boolean"
              },
              "trace_id": {
                "type": "string"
              }
