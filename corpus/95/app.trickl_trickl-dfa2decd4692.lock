{
  "lockfileVersion": 2,
  "subjects": {
    "app.trickl/trickl": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.trickl.app/mcp/dev"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "trickl-dev",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Trickl developer tools. Call get_started first to pick an integration path and get a step-by-step plan, then write the integration in the user's codebase. search_docs / read_doc hold the full reference. With a test key on the connector, the sandbox tools (check_api_key, register_test_provider, create_test_goal, simulate_goal_event, cancel_test_goal, list_webhook_deliveries) prove the integration end to end without real money. Never put an API key in client-side code or a commit; it belongs in the user's server env.",
      "tools": [
        {
          "name": "cancel_test_goal",
          "title": "Cancel a sandbox goal",
          "description": "Cancels a sandbox goal via POST /goals/:goalId/cancel, as the user's server would when a customer cancels: collected chunks (and a refundable deposit) are refunded less Trickl's fee, in the ledger only, and goal.cancelled is sent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goalId": {
                "description": "goalId from create_test_goal",
                "type": "string"
              }
            },
            "required": ["goalId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:777f83b755b384b535992899f10470fc1ed9d2f99dd6199bf8f41843224b002a"
        },
        {
          "name": "check_api_key",
          "title": "Check the API key",
          "description": "Confirms this connector's test key works and shows its platform, scopes and mode. Run it before the other sandbox tools; if it fails, the message says what the user needs to fix.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:33d0ca8b33017625337c2645e22732d3146a81b42ce794d66567bfabe13c26d4"
        },
        {
          "name": "create_test_goal",
          "title": "Create a sandbox goal",
          "description": "Creates a goal with POST /goals/create using the test key. No money moves. Returns goalId, paymentUrl (hosted checkout) and clientSecret (embedded checkout). Amounts are integer cents, USD.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "callbackUrl": {
                "description": "Where the buyer returns after confirming; localhost is allowed in test mode",
                "type": "string"
              },
              "cancelUrl": {
                "type": "string"
              },
              "deadline": {
                "description": "ISO 8601 due date, 24h to 2 years out (one-time goals only)",
                "type": "string"
              },
              "depositAmount": {
                "description": "Upfront card charge in cents. One-time: ≥ 50 and < targetAmount. Subscription: = targetAmount or omit",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "depositRefundable": {
                "type": "boolean"
              },
              "description": {
                "description": "What the buyer is saving for, max 500 characters",
                "type": "string"
              },
              "frequency": {
                "description": "Makes it a recurring subscription; omit for a one-time purchase",
                "enum": ["WEEKLY", "BIWEEKLY", "MONTHLY", "QUARTERLY", "YEARLY"],
                "type": "string"
              },
              "imageUrl": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {},
                "description": "Echoed verbatim in every webhook, e.g. { orderId }",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "providerLinkCode": {
                "description": "From register_test_provider",
                "type": "string"
              },
              "targetAmount": {
                "description": "Price in cents, e.g. 2999 = $29.99",
                "maximum": 9007199254740991,
                "minimum": 50,
                "type": "integer"
              }
            },
            "required": ["description", "providerLinkCode", "targetAmount"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:93203e507c7f31d75962c7783c12d95ba70974b65d33951ca8387175a852ae80"
        },
        {
          "name": "get_goal",
          "title": "Get a sandbox goal",
          "description": "Returns a sandbox goal's current state via GET /goals/:goalId: status, amounts saved, buyer, deadline.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goalId": {
                "description": "goalId from create_test_goal",
                "type": "string"
              }
            },
            "required": ["goalId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b1fd92827ea32e3779b646c644920fc1f11f57b43d7b6241f2d524e98f0c2d4c"
        },
        {
          "name": "get_started",
          "title": "Get a Trickl setup plan",
          "description": "Start here. Without an integration, explains the ways to add Trickl (own business such as a SaaS, or a multi-seller platform) and how to choose. With one, returns a step-by-step plan for the coding agent: keys, exact API calls, webhook handling, what to store, and how to prove it works with this server's sandbox tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "integration": {
                "description": "own_*: the user's own business gets paid (SaaS, app, course, membership); own_embedded_checkout puts checkout inside their app. platform_*: many sellers on the user's platform get paid. embedded = in-page iframe, hosted = redirect to Trickl. embed_widget: paste-in pricing widget, no backend. Omit to see the choices.",
                "enum": ["embed_widget", "own_embedded_checkout", "own_hosted_checkout", "platform_embedded_checkout", "platform_hosted_checkout"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:233358feb33c64678b209b8308b41b244bdcb78c5b35acbc3ed05162f53b0b19"
        },
        {
          "name": "list_webhook_deliveries",
          "title": "List webhook deliveries",
          "description": "Shows every webhook Trickl sent for a sandbox goal, newest first, with its payload and the receiver's result. DELIVERED = got a 2xx. FAILED = rejected, retry scheduled at nextRetryAt. EXHAUSTED = gave up. PENDING / DELIVERING = in flight; check again in a few seconds. Use lastStatusCode and lastError to debug the receiver.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goalId": {
                "description": "goalId from create_test_goal",
                "type": "string"
              }
            },
            "required": ["goalId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:14e6ac98a21eaa3a0bf1d8e77e9dc7a989627eab0ad429a659dca595b76a5299"
        },
        {
          "name": "read_doc",
          "title": "Read a docs section",
          "description": "Returns one section of the Trickl docs in full (Markdown), by id from search_docs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Section id, e.g. \"platform-api/sandbox-test-mode\"",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b7b96d93402cdefcfb7f9a145f55a90ea5565e72d955320e974bc791a04701e7"
        },
        {
          "name": "register_test_provider",
          "title": "Register a sandbox seller",
          "description": "Registers a seller (provider) under the test key via POST /providers/register and returns providerLinkCode (needed to create goals) and webhookSecret (to verify webhooks). Idempotent on externalCreatorId. webhookUrl must be a public https URL that reaches the user's receiver, e.g. an ngrok or cloudflared tunnel to localhost. Sandbox webhooks are real signed HTTP requests.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "businessName": {
                "description": "Default: Sandbox Seller",
                "type": "string"
              },
              "email": {
                "description": "Must not belong to an existing Trickl provider. Default: a per-seller @example.com address",
                "type": "string"
              },
              "externalCreatorId": {
                "description": "The seller's id in the user's app. Default: sandbox-seller-1",
                "type": "string"
              },
              "stripeConnectAccountId": {
                "description": "Leave empty in sandbox: a placeholder is used, since sandbox goals never reach Stripe",
                "type": "string"
              },
              "webhookUrl": {
                "description": "https URL of the user's webhook receiver",
                "type": "string"
              },
              "websiteUrl": {
                "description": "Seller site; its host is allowed for redirects and embedded checkout",
                "type": "string"
              }
            },
            "required": ["webhookUrl"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3148ee4a522711aed78217ae97c68d9e9edd0ffbf95ba7e494025267f05742b"
        },
        {
          "name": "search_docs",
          "title": "Search the Trickl docs",
          "description": "Keyword search over the Trickl partner docs (platform API, webhooks, embed widget). Returns section ids with snippets; read one with read_doc. Leave query empty for the full table of contents.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "e.g. \"deadline goal\", \"verify signature\", \"REDIRECT_URL_NOT_ALLOWED\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aebea7211edd43a63205ffa9a941b8237efa5a5365b5c3c3e42f76a56afc3e8c"
        },
        {
          "name": "simulate_goal_event",
          "title": "Simulate a goal event",
          "description": "Moves a sandbox goal through its lifecycle instantly; each event sends the real signed webhook to the seller's webhookUrl, exactly as live would. confirm: the buyer signs up and links a bank (goal.deposit_paid if there is a deposit; for subscriptions also goal.subscription_created, plus goal.cycle_paid at once if the deposit paid the first period in full). collect: one collected chunk (round-ups and/or Trickl Down, which arrive the same way), $3 by default (goal.round_up_collected); fails with ALREADY_FUNDED when the current period is already paid. complete: one-time goals finish (goal.completed); subscriptions pay the current period and start the next (goal.cycle_paid; the goal stays SAVING). payment_failed: a failed chunk (goal.payment_failed), with reversal=true for the clawback path. expire: a deadline goal fell short (goal.deadline_charge_failed). Confirm first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "collect / payment_failed only: cents, default 300",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "event": {
                "enum": ["confirm", "collect", "complete", "payment_failed", "expire"],
                "type": "string"
              },
              "goalId": {
                "description": "goalId from create_test_goal",
                "type": "string"
              },
              "reason": {
                "description": "payment_failed with reversal only",
                "enum": ["ach_return", "dispute"],
                "type": "string"
              },
              "reversal": {
                "description": "payment_failed only: true = a chunk already counted is reversed (clawback); false = a collection failed",
                "type": "boolean"
              }
            },
            "required": ["event", "goalId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:338b6a8ed4b8c46618b4cc7287dbbe0981f605f5bf8cac5fc431a0838c9dbd7d"
        }
      ],
      "digest": "sha256:fa25bc1b62cdfaa9a980f4d07758372701cae9fbb0acb406f9ecbbacfef8b66a"
    }
  }
}
