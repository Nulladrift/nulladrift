{
  "lockfileVersion": 2,
  "subjects": {
    "com.microversesystems/market-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.microversesystems.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "microverse-market-data",
        "title": "Microverse Market Data",
        "version": "1.0.0",
        "description": "Live and historical order books from crypto exchanges, Kalshi and Polymarket.",
        "websiteUrl": "https://microversesystems.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Live and historical market data from Microverse Systems' own feed handlers.\n\nCoverage: order books from ~18 crypto exchanges (Binance, Coinbase, OKX, Bybit, Kraken, ...), Kalshi event\ncontracts, Kalshi perpetual futures and Polymarket. Live books are real time (sub-second); history is\navailable for crypto venues for the last ~30 days via replay (US Eastern times).\n\nStart with list_venues, then list_symbols or search_prediction_markets to find symbols. Use compare_venues\nto see one asset across every exchange (best bid/offer, spreads, outliers) and get_consolidated_book for\nmerged depth. Prices are in the venue's quote currency (usually USDT); sizes are in the base asset\n(contracts for Kalshi/Polymarket). status 'live' means our feed is connected and updating; age_ms is how\nlong ago the book last changed. Data is informational only, not investment advice or an execution venue.",
      "tools": [
        {
          "name": "compare_venues",
          "title": "Compare one asset across venues",
          "description": "Top of book for one asset (e.g. 'BTC', 'SOL') on every crypto exchange we carry, in one quote\n    currency (USDT by default; 'USD' for Coinbase, Gemini and Bitfinex). Returns each venue's best\n    bid/ask, spread in bps, deviation from the median mid, plus the consolidated best bid and offer\n    (which venues hold them) and whether the venues are crossed (an apparent arbitrage).",
          "inputSchema": {
            "properties": {
              "asset": {
                "title": "Asset",
                "type": "string"
              },
              "quote": {
                "default": "USDT",
                "title": "Quote",
                "type": "string"
              }
            },
            "required": ["asset"],
            "title": "compare_venuesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:87e6391da1e7d2be0508c13a82ddc659424db43fe6012a9594e2bb490155d02e"
        },
        {
          "name": "get_consolidated_book",
          "title": "Get consolidated order book",
          "description": "Depth merged across every live crypto exchange for one asset: at each price, the total size and\n    the size per venue. exclude_venues is a comma-separated list of venue ids to leave out. Venues whose\n    price is far from the others (usually a stale book) are left out unless include_outliers is true.",
          "inputSchema": {
            "properties": {
              "asset": {
                "title": "Asset",
                "type": "string"
              },
              "depth": {
                "default": 20,
                "title": "Depth",
                "type": "integer"
              },
              "exclude_venues": {
                "default": "",
                "title": "Exclude Venues",
                "type": "string"
              },
              "include_outliers": {
                "default": false,
                "title": "Include Outliers",
                "type": "boolean"
              },
              "quote": {
                "default": "USDT",
                "title": "Quote",
                "type": "string"
              }
            },
            "required": ["asset"],
            "title": "get_consolidated_bookArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d46bf0636e3845331e6ed06e29c5a66fe336f138b022281112dccfbd9c55724d"
        },
        {
          "name": "get_historical_book",
          "title": "Get historical order book",
          "description": "Recorded order-book snapshots for one symbol over a time window, replayed from our raw captures.\n    date is YYYY-MM-DD; start/end are HH:MM[:SS] US Eastern time; window up to 2 hours; interval_seconds\n    5..600 (one snapshot per interval); levels_per_side up to 20. Use list_history for dates and symbols.",
          "inputSchema": {
            "properties": {
              "date": {
                "title": "Date",
                "type": "string"
              },
              "end": {
                "title": "End",
                "type": "string"
              },
              "interval_seconds": {
                "default": 60,
                "title": "Interval Seconds",
                "type": "integer"
              },
              "levels_per_side": {
                "default": 5,
                "title": "Levels Per Side",
                "type": "integer"
              },
              "start": {
                "title": "Start",
                "type": "string"
              },
              "symbol": {
                "title": "Symbol",
                "type": "string"
              },
              "venue": {
                "title": "Venue",
                "type": "string"
              }
            },
            "required": ["date", "end", "start", "symbol", "venue"],
            "title": "get_historical_bookArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0a0125317fa5e30c8bbf7ce85ece5dc438912d47a810b3bc4c2de888f77efb4a"
        },
        {
          "name": "get_kalshi_perps",
          "title": "Kalshi perpetual futures",
          "description": "Kalshi perpetual futures: every contract with its live best bid/ask from our feed, contract size,\n    underlying, reference and mark prices, funding cap, open interest, 24h volume and whether the market\n    is open. asset_class filters (e.g. 'Crypto', 'Equity'). Stock perps follow stock-market hours.",
          "inputSchema": {
            "properties": {
              "asset_class": {
                "default": "",
                "title": "Asset Class",
                "type": "string"
              },
              "open_only": {
                "default": false,
                "title": "Open Only",
                "type": "boolean"
              }
            },
            "title": "get_kalshi_perpsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3049d75b55102413fd0387d24c7e4c9b1da4687aed3e224112422e3ff8054364"
        },
        {
          "name": "get_order_book",
          "title": "Get order book",
          "description": "Live order book for one symbol on one venue: bids and asks as [price, size], best levels, mid,\n    spread (absolute and basis points), last trade, feed status and book age. symbol can be loose\n    ('BTC', 'BTC-USDT', 'BTCUSDT') or an exact Kalshi/Polymarket ticker. depth is per side (max 50).",
          "inputSchema": {
            "properties": {
              "depth": {
                "default": 20,
                "title": "Depth",
                "type": "integer"
              },
              "symbol": {
                "title": "Symbol",
                "type": "string"
              },
              "venue": {
                "title": "Venue",
                "type": "string"
              }
            },
            "required": ["symbol", "venue"],
            "title": "get_order_bookArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bfa6ed8ced472f353de1fff9ce2c283587c3927eae9835ffdaaebb4caef5aa68"
        },
        {
          "name": "list_history",
          "title": "List available history",
          "description": "Dates with recorded order-book history, per venue (crypto exchanges, about the last 30 days).\n    With a venue, also lists the symbols recorded on its most recent day.",
          "inputSchema": {
            "properties": {
              "venue": {
                "default": "",
                "title": "Venue",
                "type": "string"
              }
            },
            "title": "list_historyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b3a2f5bf928bb64ed7835d173bcf363a7e764a8d15989111b0afa2758b4002b"
        },
        {
          "name": "list_symbols",
          "title": "List symbols",
          "description": "List the symbols (books) on one venue with best bid/ask and status. Optional search filters by\n    symbol or base asset (e.g. 'SOL'). For Kalshi/Polymarket prefer search_prediction_markets.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 200,
                "title": "Limit",
                "type": "integer"
              },
              "search": {
                "default": "",
                "title": "Search",
                "type": "string"
              },
              "venue": {
                "title": "Venue",
                "type": "string"
              }
            },
            "required": ["venue"],
            "title": "list_symbolsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bf5c11792380a2039798bf0a7f73101461fb654a97cc6b9ed6685cb254bdd334"
        },
        {
          "name": "list_venues",
          "title": "List venues",
          "description": "List every venue (exchange or market) with how many books we carry, how many are live, and whether\n    history is available. Use the venue ids it returns in the other tools.",
          "inputSchema": {
            "properties": {},
            "title": "list_venuesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2694c4a452dc89cb7f337bdb2a08dbd9a08f8e17e4971e82b51a4c34b416f5c9"
        },
        {
          "name": "search_prediction_markets",
          "title": "Search prediction markets",
          "description": "Search Kalshi event contracts and Polymarket markets by text (e.g. 'bitcoin', 'election', 'Fed').\n    Returns tickers with titles, strikes/outcomes, close times and live best bid/ask (probability, 0-1).\n    Use get_order_book(venue, ticker) for the full book.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "venue": {
                "default": "all",
                "title": "Venue",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_prediction_marketsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d700ba7b9e6bf4d4a6af3b9ad025584ac3d5b45ed860cdee6b285ab14a1da6ab"
        }
      ],
      "digest": "sha256:b5d7c764fc848777ebf03945caeac0c70b29f6b2d4302c9a677fe92eb205f52f"
    }
  }
