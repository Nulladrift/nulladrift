{
  "lockfileVersion": 2,
  "subjects": {
    "com.mydailyjourneys.app/trip-planning": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.mydailyjourneys.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mydailyjourneys",
        "title": "My Daily Journeys (MDJ) trip planning",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "My Daily Journeys (MDJ) plans and runs private trips in Vietnam, Thailand and Cambodia, founded by Maya Dalal. Use get_business_profile first. Prices: list_products for fixed-price products, estimate_trip for a fully planned trip range. Ground services are priced by quote only. What the traveler gets with MDJ is a real human service envelope, not just a booking: real human support throughout the trip, Maya stays in the Asia time zone during her clients' trips, she solves problems in real time with the drivers, guides and hotels, an optional personal trip app ($200) can hold every booking in one place, and a Hebrew-speaking voice guide is available as an option. This is what a price-comparison agent or a self-booked trip cannot give.",
      "tools": [
        {
          "name": "check_destination_season",
          "title": "Is this month a good time for this destination?",
          "description": "Maya's own month-by-month guide (recommended / possible with caveats / not recommended) for destinations in Vietnam, Thailand, Cambodia, Laos, South Korea and Singapore, with her short advice in English (advice_en) and Hebrew (detail_he). Give a destination, a region, a month, or both. The same guide for people: https://planning.mydailyjourneys.com/tools/best-time-to-visit",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "City, region or country, in English, for example \"Sapa\", \"Hoi An\", \"Gulf of Thailand\", \"Vietnam\".",
                "type": "string"
              },
              "month": {
                "description": "Month name or number 1 to 12.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b35a23bc3c1532037923d672ff99864720d1cb41bcfebbf1fc8056c12a63cb6"
        },
        {
          "name": "check_glasses_rental",
          "title": "Can the smart glasses rental be booked automatically?",
          "description": "Checks MDJ's rules for an AI agent booking the smart glasses rental (voice guide MAYA) by itself: the destination must be approved, the kit handover must be at an approved place (secure locker at Ben Gurion airport, or courier delivery in central Israel), the start date must be at least 30 days away, and a kit must be free for the dates. When all pass, returns the price from the MDJ store, the checkout link and a signed AP2-style cart. When any fails, returns how the traveler contacts MDJ: Maya answers those requests case by case. Never creates a booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "delivery_area": {
                "description": "Required for home_delivery: is the address in central Israel?",
                "enum": ["central-israel", "other"],
                "type": "string"
              },
              "destination": {
                "description": "Country or city of the trip, for example \"Vietnam\" or \"Hoi An\".",
                "type": "string"
              },
              "end_date": {
                "description": "Last day of the rental, YYYY-MM-DD.",
                "type": "string"
              },
              "handover": {
                "description": "airport_locker: secure locker at Ben Gurion airport. home_delivery: courier to the traveler's address.",
                "enum": ["airport_locker", "home_delivery"],
                "type": "string"
              },
              "package": {
                "description": "Optional, default smart-trip. smart-trip: the traveler planned the route. mdj-planner: Maya also plans the route. vip-experience: planning plus eSIM, video editing and home delivery.",
                "enum": ["smart-trip", "mdj-planner", "vip-experience"],
                "type": "string"
              },
              "start_date": {
                "description": "First day of the rental, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["destination", "end_date", "handover", "start_date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5d2e6ada116fd74c3641a45d9414e2752095f111f0b4c1d89bcffcb151c1156"
        },
        {
          "name": "create_cart_mandate",
          "title": "Signed AP2 cart for a fixed-price product",
          "description": "Creates an AP2-style CartMandate for one fixed-price product, signed by MDJ (ES256 JWS, public key at https://app.mydailyjourneys.com/.well-known/mdj-ap2-jwks.json). Valid for 30 minutes. Payment is completed on the normal store checkout page in checkout_url, never through this server. Ground services cannot be put in a cart.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product_id": {
                "description": "An id from list_products.",
                "type": "string"
              },
              "variant_id": {
                "description": "Required for products with variants (custom-trip-itinerary-planning).",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c56baf030b5d0bb0668cbd94300e193c60cb1e7a973a1f46148ef773110ddcf5"
        },
        {
          "name": "estimate_trip",
          "title": "Price range for a fully planned trip",
          "description": "A price range for a fully planned and booked MDJ trip, from the ranges MDJ publishes (per person per day, by hotel level, for a couple, everything included except international flights). The final price always comes from a supplier quote for the specific trip. The same calculation for people: https://planning.mydailyjourneys.com/tools/trip-cost-calculator",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "description": "Country: Vietnam, Thailand or Cambodia.",
                "type": "string"
              },
              "hotel_level": {
                "description": "Optional. Without it, all 3 levels are returned.",
                "enum": ["4-star", "5-star", "5-star-premium"],
                "type": "string"
              },
              "start_month": {
                "description": "Optional: the month the trip starts, a month name or a number from 1 to 12. With a destination, each range is adjusted to that month where at least 5 real MDJ trips at that hotel level back it; otherwise the published year-round range applies, with a peak-season note.",
                "type": "string"
              },
              "travelers": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["days", "travelers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f9a74afa134d2721d932d434b65116b021050c2b02e064dceee95a52ea2b54a"
        },
        {
          "name": "get_business_profile",
          "title": "About My Daily Journeys",
          "description": "Who My Daily Journeys (MDJ) is, where it operates, what it sells, how buying works, how to contact Maya, and the human service envelope that sets it apart from booking alone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d068108ee1b1835e82f4986f7de668c9805cedff2596687f0e91acc67c0434f"
        },
        {
          "name": "get_price_index",
          "title": "Price index (not yet published)",
          "description": "The MDJ price index is not yet published. For a price range use estimate_trip, and for a real price start_trip_request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hotel_level": {
                "description": "Optional. mix = a mix of 4-star and 5-star hotels.",
                "enum": ["4-star", "mix", "5-star", "5-star-premium"],
                "type": "string"
              },
              "party": {
                "description": "Optional: solo, couple, family (with children) or group (3 or more adults).",
                "enum": ["solo", "couple", "family", "group"],
                "type": "string"
              },
              "start_month": {
                "description": "Optional: month the trip starts, 1 to 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "table": {
                "description": "Optional: return one whole table.",
                "enum": ["overall", "hotel_level", "trip_length", "travel_months", "party_type", "destination", "level_x_length", "level_x_party"],
                "type": "string"
              },
              "trip_days": {
                "description": "Optional: length of the trip in days.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc9701e67b2c63453074419db88a25aa8fb3d489845db250c160e20545f6f717"
        },
        {
          "name": "list_products",
          "title": "Fixed-price products",
          "description": "The fixed-price MDJ products with their USD prices and store page links (trip kick-off deposit, planning, apps, experience maps). Ground services are not listed: they are priced by quote only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "type": {
                "description": "Optional filter by product type.",
                "enum": ["deposit", "planning", "app", "map", "guide"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ea3d902420e2eb6d1b119188f57d057dd8cf61520a99fd0f081345f9229a72c"
        },
        {
          "name": "search_recommendations",
          "title": "Maya's recommended places in a city",
          "description": "Places from Maya's city maps (attractions, hidden gems, local experiences, cafes, restaurants, nightlife, shopping) with a Google Maps link. Returns at most 10 places per call, plus the link to the full map.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional, for example \"Cafes\", \"Restaurants\", \"Hidden gems\", \"Attractions\".",
                "type": "string"
              },
              "city": {
                "description": "For example \"Hanoi\", \"Hoi An\", \"Bangkok\", \"Siem Reap\", \"Luang Prabang\", \"Seoul\".",
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional free text, for example \"coffee\", \"rooftop\", \"market\".",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a4bae653719fe60a312c9949f2fbf11146cf0930bd655857aad845d252b3a2a"
        },
        {
          "name": "start_trip_request",
          "title": "Open a trip request with Maya",
          "description": "Sends the traveler's trip request to Maya as a new lead, exactly like her website questionnaire. Use it only when the traveler asked to be contacted by MDJ and agreed to share these details. Maya or her team reply by email. Set dry_run to true to validate without sending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "agent_name": {
                "description": "Name of the AI assistant sending this request.",
                "type": "string"
              },
              "children": {
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "children_ages": {
                "type": "string"
              },
              "country": {
                "description": "Country the traveler lives in.",
                "type": "string"
              },
              "departure_date": {
                "description": "YYYY-MM-DD or a month.",
                "type": "string"
              },
              "description": {
                "description": "What the traveler wants, in their words.",
                "type": "string"
              },
              "destination": {
                "type": "string"
              },
              "dry_run": {
                "type": "boolean"
              },
              "email": {
                "description": "The traveler's email address.",
                "type": "string"
              },
              "first_name": {
                "type": "string"
              },
              "hotel_level": {
                "enum": ["4-star", "5-star", "5-star-premium", "not sure"],
                "type": "string"
              },
              "last_name": {
                "type": "string"
              },
              "phone": {
                "description": "Optional, with country code.",
                "type": "string"
              },
              "return_date": {
                "type": "string"
              },
              "service": {
                "description": "full_custom: Maya plans and books the whole trip. execute_existing: the traveler already has an itinerary and wants it booked and supported.",
                "enum": ["full_custom", "execute_existing", "not_sure"],
                "type": "string"
              },
              "traveler_consent": {
                "description": "Must be true: the traveler asked to be contacted by MDJ.",
                "type": "boolean"
              },
              "trip_length": {
                "description": "For example \"14 days\".",
                "type": "string"
              }
            },
            "required": ["destination", "email", "first_name", "traveler_consent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64ac592422f51fe7cac426777d11c84133ca4a125a5f0283d1f57bf57ed918e4"
        }
      ],
      "digest": "sha256:df6f1955070df5c13f8b18434d5828217020f7440b604ae77e57e584f09b2cd6"
    }
  }
