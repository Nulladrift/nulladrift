      "instructions": "Augmap makes maps of places in the continental United States (the lower 48 states and DC): restaurants, trails, lodging and street addresses, organized into lists and days. Planning a trip is one use. Use it only when a request needs places mapped, found, organized or shared, or an Augmap account action. General knowledge, weather-only questions and places outside the continental US (Alaska, Hawaii, other countries) need no Augmap calls. Reuse a known map. Find saved maps when the traveler refers to an earlier saved map; a new map needs no account lookup. For a new map call map_create, e.g. {\"title\":\"Portland walk\",\"destination\":\"Portland, ME\",\"context\":\"Food and waterfront for two\",\"travel_mode\":\"pedestrian\"}. A place search also needs map_create first when no map_id is available. It returns map_id and map_url. Give the traveler map_url, keep map_id for calls, and never invent either. Include map_url when reporting a change.\n\nResults: structuredContent and the JSON text in content contain the same complete tool result. Read whichever your host provides; do not process both as separate results.\n\nAccess: map_id is an identifier and grants nothing. Signed-in connections save new maps to the account at creation (request_id deduplicates retries) and need no draft_handle. Anonymous creation also returns draft_handle and draft_expires_at: the handle opens this unsaved map only. Pass it on every call for the map. The map opens until draft_expires_at, which edits do not extend; after that it is archived, and it opens again only once saved to an account. Tell the traveler that date when you give them map_url. Once the map is saved to an account, draft_handle stops working: sign-in decides, and a signed-in call ignores it. Explicit nonblank handles override X-Augmap-Draft-Handle; blank is absent, invalid explicit handles fail without fallback. Share links are for people, never credentials. To read a map from a share link the traveler gives you, call map_get_state with share_url instead of map_id: nothing is saved or copied. access viewer is read-only, without context or rejected places; if this account can already open the map, the result also has map_id for edits. Never publish draft_handle. browser_url is a private one-time editor handoff for your browser, valid five minutes; the traveler gets map_url.\n\nResources: read map://maps to find saved account maps (sign-in required; map_list is the tool fallback). Read map://{map_id}/lists for list summaries and their resource URIs, then the needed map://{map_id}/lists/{list_id} instead of the whole map. State, context and history also have resources; presets/vocab describe supported values. Map resources require account access or X-Augmap-Draft-Handle; never put credentials in URIs. If your host cannot read resources or send that header, use map_get_state with draft_handle. Reads change nothing and are safe to repeat. Map responses carry version and pending_changes: others' changes since your last change, or since the version you pass as since. Mention others' changes before editing.\n\nLists: each list has a kind. plan lists are the map's plan, numbered and routed in order: days, tours, venues to visit or compare, or one per house or neighborhood: the place plus what is around it (set day_noun, e.g. House 1, House 2). saved lists keep places aside as options; use saved only when the traveler asks to save, keep or collect places, such as favorites, maybes or ideas. When unclear, use plan. Every map has rejected; a deleted list's places go to Unscheduled. A string in to points at an existing list (list_id or name); to put a place in a new list, pass to:{\"new\":\"<name>\"} or to:{\"new\":\"Maybe\",\"kind\":\"saved\"}. list_id is stable; use it once you have it. map_edit_lists creates, updates (name, kind, pinned_to) and deletes lists. Pin example: {\"map_id\":\"<returned id>\",\"ops\":[{\"op\":\"update\",\"list\":\"rainy-day\",\"pinned_to\":\"plan-2\"}]}.\n\nPlaces: search first; add a result by its place_id and name, and the server supplies the point. Places can also come from other tools or sources (web search, a document, the traveler's list): add one by place.address, e.g. {\"op\":\"add\",\"place\":{\"name\":\"Rental\",\"address\":\"10 Exchange St, Portland, ME\"},\"to\":\"day-1\"}, or by place.point with that source's coordinates. Never invent coordinates. If an address matches several towns, the batch fails with candidates: ask which, then add its place_id. A place needs place_id, point, address or geometry; address excludes place_id and point. Add example: {\"map_id\":\"<returned id>\",\"ops\":[{\"op\":\"add\",\"place\":{\"name\":\"<result name>\",\"place_id\":\"<result id>\",\"notes\":\"Lunch\"},\"to\":{\"new\":\"Day 1\"}}]}. Include draft_handle when needed. place is nested; notes is plural and gives a short reason for each added place. Leave status tentative unless the traveler confirms a booking or commitment; do not invent reservations. Other place ops select place by entry_id or name; update uses set. Move example for map_edit_places: {\"op\":\"move\",\"place\":\"<entry_id>\",\"to\":\"<list_id>\",\"index\":0}. Moves within and between lists use map_edit_places; map_edit_lists changes the lists themselves. Read full state with map_get_state when needed. remove parks a place in rejected; restore returns it. Each edit batch is atomic; unknown keys are errors, never silently ignored.\n\nGeometry: call map_edit_places with an add operation: {\"op\":\"add\",\"place\":{\"name\":\"Trail\",\"notes\":\"Requested walk\",\"geometry\":{\"type\":\"LineString\",\"coordinates\":[[lng,lat],[lng,lat]]}},\"to\":\"day-1\"}. Use actual supplied or grounded coordinates. Geometry belongs inside place.geometry. Custom point locations use place.point:{lat,lng}; set.address or set.point moves a place.\n\nSearch: results are Augmap places, built on Overture Maps and ranked for what the traveler asks for, with hours and amenity evidence where known; each names its source and license. Place data can be wrong or out of date, so confirm what matters (hours, prices, reservations) with the place. Ordinary discovery uses text with an explicit location, e.g. {\"text\":\"seafood restaurant\",\"city\":\"Portland\",\"state\":\"ME\"}. Provide city/state or near; if need_location is returned, retry with an explicit location. Omit along_route unless the traveler actually wants places along a route. Route search adds either along_route:{\"list\":\"<list_id>\"} for an existing plan list with a computed route, or along_route:{\"start\":{\"address\":\"1 Monument Sq, Portland, ME\"},\"end\":{\"lat\":43.91,\"lng\":-69.96}}; each endpoint, near and map_set_view center take {lat,lng}, {address} or {place_id}. Never send an empty along_route or repeat it after a route error; ordinary text search needs no route. name is a name lookup (partial matches possible); place_id is an exact lookup; near can locate a search. A street address as text or name returns address results (category street_address, place_id addr:…), e.g. {\"label\":\"rental\",\"text\":\"10 Exchange St, Portland, ME\"}; add the result by its place_id. Only precision \"exact\" is the door; any other precision is approximate, so say so. address_match \"none\" means no such address: try the place name, add the town and state, or search nearby. Street addresses cover most states, not all: Nevada has none for Las Vegas (Clark County) or Reno (Washoe County), and New Hampshire, South Carolina, Georgia, Michigan, South Dakota, Louisiana, Pennsylvania, Idaho and DC are thin. In New York City give the borough (Manhattan, Brooklyn, Queens, The Bronx, Staten Island), not \"New York\", e.g. {\"text\":\"350 5th Ave, Manhattan, NY\"}. Batch queries with labels. Only fields_granted are known; request extra fields rather than treating a missing field as absent. Search is bounded, not exhaustive: an empty result does not prove no suitable place exists.\n\nAccounts: map_save, map_list and map_share require sign-in (OAuth 2.1 authorization code + PKCE S256 or a Connected apps bearer key; device flow is unsupported), never just a draft_handle. The host prompts and retries; pass draft_handle to map_save. Without OAuth, the traveler can save at map_url; this app then needs that account's bearer key to keep editing. map_list includes maps shared with the account (access editor or viewer). Share links are for the traveler to pass on: a view link opens for anyone; an edit link invites people, who sign in to edit. map_share supports create/list/revoke/set_role and list_members/remove_member/set_member_role.\n\nConcurrent edits: pass the version you planned from as expected_version on map_edit_places, map_edit_lists or map_update. If someone else changed what the edit touches, nothing is applied; the error result has conflict, their pending_changes and the current version: re-plan from it and resend.\n\nRetries: reuse op_id only for the same edit after a transport timeout. A rejected batch changed nothing; fix the named fields before another call. With retry_after_s, wait then retry once.\n\n## Account connection (OAuth)\nUse your host's Augmap sign-in when available; do not ask the traveler to copy tokens into chat. If implementing the OAuth client yourself, GET https://mcp.augmap.ai/.well-known/oauth-protected-resource/mcp, then https://auth.augmap.ai/.well-known/oauth-authorization-server (OpenID discovery is the fallback). The issuer is https://auth.augmap.ai. A 401 WWW-Authenticate challenge names resource_metadata and the scopes to request.\nUse authorization code + PKCE S256 with a fresh verifier and state. Resolve your client-ID metadata document or register a public client at registration_endpoint. Open authorization_endpoint with resource=https://mcp.augmap.ai/mcp. For https://mcp.augmap.ai/mcp, https://augmap.ai/connect?client_id=...&redirect_uri=...&code_challenge=...&state=... is a compact equivalent for HTTPS and loopback callbacks; native custom-scheme callbacks must use the discovered authorization_endpoint directly. WorkOS validates client identity and callback membership.\nVerify state and exchange the code at token_endpoint with the original redirect_uri and verifier. Send Authorization: Bearer <access_token> to this MCP URL; account authorization takes precedence over draft handles. Request offline_access, store refresh tokens securely, and retain replacements. A rejected refresh requires a new connection.\nWorkOS names the requesting app and asks for approval of new access; it can reuse previous consent. WorkOS supports authorization code flow with PKCE S256 and does not support the OAuth device authorization flow (device_authorization_endpoint): do not use device flow. Use browser authorization or an account app key from Connected apps; the existing draft_handle keeps working only until the map is saved.\n",
      "tools": [
        {
          "name": "map_create",
          "title": "Create map",
          "description": "Create a map of places in the continental US. Returns map_id and map_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_name": {
                "description": "Name shown for this app in the map sharing panel.",
                "maxLength": 48,
                "type": "string"
              },
              "context": {
                "description": "Traveler preferences and planning notes, e.g. seafood and playgrounds. Stored context is limited to 10,240 UTF-8 bytes.",
                "maxLength": 10000,
                "type": "string"
              },
              "conversation_id": {
                "description": "Your stable id for this conversation (≤64 chars, no ':', not 'user' or 'system'). With it, pending_changes lists only changes made by others.",
                "maxLength": 64,
                "pattern": "^(?!user$|system$)[^:\\x00-\\x1f\\x7f-\\x9f\\u2028\\u2029]*$",
                "type": "string"
              },
              "day_noun": {
                "description": "The word the map numbers its days with, when they are not days: \"House\" for houses to tour gives House 1, House 2. Default \"Day\"; \"\" resets it.",
                "maxLength": 24,
                "type": "string"
              },
              "destination": {
                "description": "City or region in the continental US, e.g. Asheville, NC.",
                "type": "string"
              },
              "interests": {
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "request_id": {
                "description": "Your id for this create: 1–64 letters, digits, hyphens or underscores. Signed in, a retry with the same id returns the same map; otherwise the retry is not charged twice.",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "route_stops": {
                "description": "Whether plan lists draw routes and travel times between their places. Default true; false is for lists that are not journeys, such as one list per area.",
                "type": "boolean"
              },
              "title": {
                "description": "Map title.",
                "type": "string"
              },
              "travel_mode": {
                "enum": ["auto", "bicycle", "pedestrian"],
                "type": "string"
              },
              "view": {
                "additionalProperties": false,
                "properties": {
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lng": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "zoom": {
                    "maximum": 16,
                    "minimum": 3,
                    "type": "number"
                  }
                },
                "required": ["lat", "lng"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "browser_url": {
                "type": "string"
              },
              "draft_expires_at": {
                "type": "string"
              },
              "draft_handle": {
                "type": "string"
              },
              "map_id": {
                "type": "string"
              },
              "map_url": {
                "type": "string"
              },
              "save_state": {
                "enum": ["unsaved", "saved"],
                "type": "string"
              }
            },
            "required": ["map_id", "map_url", "save_state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:99a1734e836c46da0addfa9abdecc261560a169fe15eea8f7361d05e7c3e543d"
        },
        {
          "name": "map_edit_lists",
          "title": "Edit lists",
          "description": "Create, update (rename, change kind, pin a saved list to a plan list) or delete lists. A plan list's date goes in its name (\"Sat, Oct 3 · Acadia\"). Deleting a list moves its places to Unscheduled or to. Each op result has the list_id and kind of the list it used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conversation_id": {
                "maxLength": 64,
                "pattern": "^(?!user$|system$)[^:\\x00-\\x1f\\x7f-\\x9f\\u2028\\u2029]*$",
                "type": "string"
              },
              "draft_handle": {
                "description": "The draft_handle map_create returned; unsaved maps only.",
                "type": "string"
              },
              "expected_version": {
                "description": "The version you planned this edit from. If someone else has since changed what it touches, nothing is applied and the result is a conflict with their changes and the current version.",
                "maxLength": 64,
                "type": "string"
              },
              "map_id": {
                "pattern": "^[a-z0-9_-]{1,64}$",
                "type": "string"
              },
              "ops": {
                "items": {
                  "oneOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "description": "plan (default): part of the map's plan, numbered and routed in order: days, tours, houses, venues or neighborhoods to visit or compare. saved: places kept aside as options, only when the traveler asks to save, keep or collect them (favorites, maybes, ideas).",
                          "enum": ["plan", "saved"],
                          "type": "string"
                        },
                        "name": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "op": {
                          "const": "create",
                          "type": "string"
                        },
                        "op_id": {
                          "maxLength": 64,
                          "type": "string"
                        }
                      },
                      "required": ["name", "op"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "anyOf": [
                        {
                          "required": ["name"]
                        },
                        {
                          "required": ["kind"]
                        },
                        {
                          "required": ["pinned_to"]
                        }
                      ],
                      "properties": {
                        "kind": {
                          "description": "Convert to this kind; list_id stays.",
                          "enum": ["plan", "saved"],
                          "type": "string"
                        },
                        "list": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "name": {
                          "description": "New name; list_id stays.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "op": {
                          "const": "update",
                          "type": "string"
                        },
                        "op_id": {
                          "maxLength": 64,
                          "type": "string"
                        },
                        "pinned_to": {
                          "anyOf": [
                            {
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Saved lists: the plan list it belongs to; null unpins."
                        }
                      },
                      "required": ["list", "op"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "list": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "op": {
                          "const": "delete",
                          "type": "string"
                        },
                        "op_id": {
                          "maxLength": 64,
                          "type": "string"
                        },
                        "to": {
                          "description": "An existing list for its places; default Unscheduled.",
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["list", "op"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["map_id", "ops"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5c703ecdacf703b448c4e937754d3fdfdf46b0b8cc438a1c39d5fa2846a1aeb3"
        },
        {
