        {
          "name": "get_update",
          "description": "Fetch one Corduroy Labs update in full by its slug.\n\n    Args:\n        slug: the update's slug (e.g. \"the-studio-machine-readable\").\n            Obtain slugs from list_updates().\n\n    Returns:\n        A dict with slug, title, url, date_published, summary,\n        content_html, and optionally tags, location, image.\n    ",
          "inputSchema": {
            "properties": {
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_updateArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d55313ce65a74c79a593344dc448b51e71ab9cfbbb1d52aee8eddcad3d6ddcf8"
        },
        {
          "name": "list_updates",
          "description": "List Corduroy Labs blog updates, newest first.\n\n    Args:\n        limit: optional maximum number of items to return.\n\n    Returns:\n        A list of update summaries with: slug, title, url,\n        date_published, summary, and optionally tags, location, image.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Limit"
              }
            },
            "title": "list_updatesArguments",
            "type": "object"
          },
          "outputSchema": {
