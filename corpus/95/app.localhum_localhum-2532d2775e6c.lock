          "digest": "sha256:3c631f841774769e5407acfb1f77053ecadf85d453630623b09b2811d00bae6a"
        },
        {
          "name": "localhum_venue",
          "title": "One venue",
          "description": "Look up one venue by name (\"Winstons\", \"The Casbah\", \"Pure Project North Park\") or its localhum address: where it is, its own website and Instagram, its regular weekly nights and deals, and what it has booked in the coming days. When several venues fit the name, returns them to choose from. Its pages are for personal, non-commercial use with their localhum links (localhum.app/terms#use).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 14,
                "description": "How many days ahead to list booked things, 1 to 60.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "The venue's name, as people say it, or its localhum.app address.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise: one line a listing with its link. detailed: adds the address, the full description, ticket links and start and end times.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
