        {
          "name": "localhum_whats_on",
          "title": "What's on",
          "description": "Find what's on at San Diego's bars, breweries, clubs, cafes, galleries and small venues from a question in plain words. Use it for questions about events or things to do in San Diego: live music, a band or DJ, trivia, karaoke, comedy, open mics, drag, dance nights, run clubs, markets, classes, happy hours and deals, on a day or in a neighbourhood.\nPass the question the way the person said it, place and time included: \"live jazz in North Park tonight\", \"free things to do this weekend\", \"happy hour near Ocean Beach on Friday\", \"anything at the Casbah this week\". Place, time, the kinds of thing wanted, what to leave out (\"not happy hours\"), free and for kids are all read from the words, so keep them in and don't rewrite them into keyword lists. A short list works (\"comedy or open mic\"); for several different wishes, ask once for each. With no place it searches all of Greater San Diego; with no time, the next seven days. It covers San Diego County only (localhum_areas lists every neighbourhood and city); for anywhere else it says so and lists nothing.\nReturns listings with the day, time, venue, neighbourhood, price when the venue gave one, and a link to each. Several pages of results come with next_offset. Each listing comes with its localhum link; localhum's terms allow personal, non-commercial use with that link (localhum.app/terms#use).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Optional. A neighbourhood or region to search when the question names no place: a name (\"Ocean Beach\", \"OB\") or an area value from localhum_areas (\"san-diego/ocean-beach\", \"greater-san-diego\").",
                "maxLength": 80,
                "type": "string"
              },
              "day": {
                "description": "Optional. The days to search when the question names no time: today, tonight, tomorrow, this_weekend, this_week, next_weekend, next_week, monday, tuesday, wednesday, thursday, friday, saturday, sunday, a date (YYYY-MM-DD) or a range (YYYY-MM-DD..YYYY-MM-DD, up to 31 days). A time in the question wins.",
                "maxLength": 30,
                "type": "string"
              },
              "exclude": {
                "description": "Optional. Kinds to leave out, from the same list (\"happy-hour\" leaves out happy hours and deals).",
                "items": {
                  "enum": ["live-music", "open-mic", "dj", "karaoke", "social-dance", "comedy", "drag", "theatre", "spoken-word", "film", "wrestling", "trivia", "bingo", "game-night", "bar-games", "happy-hour", "tasting", "food-truck", "brunch", "cooking-class", "farmers-market", "market", "shop-event", "art", "museum", "science-nature", "art-class", "craft", "writing", "talk-workshop", "kids-program", "yoga", "fitness", "wellness", "run-ride", "race", "outdoors", "play-league", "sports-screen", "live-sports", "civic", "volunteer", "fundraiser", "club", "faith-cultural", "rally", "festival", "parade", "party"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "for_kids": {
                "description": "Optional. true: only things for children or families.",
                "type": "boolean"
              },
              "free": {
                "description": "Optional. true: only things that are free.",
                "type": "boolean"
              },
              "kinds": {
                "description": "Optional. The kinds of thing wanted, when you know them; used as given instead of reading them from the question. One or more of: live-music (Live music), open-mic (Jam & open mic), dj (DJ & dance night), karaoke (Karaoke), social-dance (Social dance), comedy (Comedy), drag (Drag & cabaret), theatre (Theatre & dance), spoken-word (Spoken word), film (Film), wrestling (Wrestling & combat), trivia (Trivia), bingo (Bingo), game-night (Game night), bar-games (Bar games), happy-hour (Happy hour & deals), tasting (Tasting & release), food-truck (Food trucks & pop-ups), brunch (Brunch), cooking-class (Cooking class), farmers-market (Farmers market), market (Market & fair), shop-event (Shop event), art (Art show), museum (Museum & history), science-nature (Science & nature), art-class (Art class), craft (Craft & make), writing (Writing & words), talk-workshop (Talk & workshop), kids-program (Kids program), yoga (Yoga & pilates), fitness (Fitness), wellness (Wellness), run-ride (Run & ride), race (Race & challenge), outdoors (Outdoors), play-league (Play & league), sports-screen (Game on screen), live-sports (Live sports), civic (Civic), volunteer (Volunteer), fundraiser (Fundraiser & benefit), club (Club & meetup), faith-cultural (Faith & cultural), rally (Rally & march), festival (Festival & fair), parade (Parade & spectacle), party (Holiday & party).",
                "items": {
                  "enum": ["live-music", "open-mic", "dj", "karaoke", "social-dance", "comedy", "drag", "theatre", "spoken-word", "film", "wrestling", "trivia", "bingo", "game-night", "bar-games", "happy-hour", "tasting", "food-truck", "brunch", "cooking-class", "farmers-market", "market", "shop-event", "art", "museum", "science-nature", "art-class", "craft", "writing", "talk-workshop", "kids-program", "yoga", "fitness", "wellness", "run-ride", "race", "outdoors", "play-league", "sports-screen", "live-sports", "civic", "volunteer", "fundraiser", "club", "faith-cultural", "rally", "festival", "parade", "party"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Listings to return, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Listings to skip, for the next page: the next_offset of the previous answer.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "question": {
                "description": "The question in plain words, with its place and time: \"trivia tonight in Hillcrest\", \"what's on in OB this weekend\", \"comedy next Friday\".",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise: one line a listing with its link. detailed: adds the address, the full description, ticket links and start and end times.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "sections": {
                "items": {
