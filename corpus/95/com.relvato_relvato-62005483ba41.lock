        {
          "name": "update_check_settings",
          "title": "Change a monitor's settings",
          "description": "Change a monitor's own settings. Each monitor takes only its sections (get_check lists them as editable.sections): checkout (checkout monitors), devices (flow and page monitors), errorScan, brokenLinks, accessibilityPages (accessibility), uptime (the URL, text that must / must not appear, accepted statuses, timeout, alert after N minutes, maintenance windows, an API endpoint's method / body / JSON rules), aiOutput, browseUrl (storefront), shopUrl / productUrl (prices), dkimSelectors (email authentication), structurePages (structure drift), webVitalsDevices (Core Web Vitals). Every address must be a full URL on the site's own domain. A section you pass replaces that section; the rest stays. Turning it on or off and its schedule: update_check. The visual monitor: update_visual_monitor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accessibilityPages": {
                "description": "Accessibility: extra pages to test on top of the key pages (full URLs on the site, up to 20). A new page's issues are reviewed on its first scan, not failed",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "aiOutput": {
                "additionalProperties": false,
                "description": "The site's own AI feature: its endpoint (full URL on the site), a fixed prompt, and what the answer must (not) contain",
                "properties": {
                  "bodyTemplate": {
                    "description": "POST body as JSON; {{prompt}} is replaced with the prompt. Default {\"prompt\":\"{{prompt}}\"}",
                    "type": "string"
                  },
                  "endpoint": {
                    "description": "The AI feature's endpoint Relvato calls: a full URL on the site",
                    "type": "string"
                  },
                  "golden": {
                    "description": "Optional: a good answer to compare with; Relvato AI flags a big drop in how close the reply is",
                    "type": "string"
                  },
                  "maxLatencyMs": {
                    "description": "Warn when the answer takes longer than this, in milliseconds",
                    "type": "number"
                  },
                  "method": {
                    "description": "HTTP method (default POST)",
                    "enum": ["POST", "GET"],
                    "type": "string"
                  },
                  "minLength": {
                    "description": "Warn when the answer is shorter than this many characters",
                    "type": "number"
                  },
                  "mustExclude": {
                    "description": "The answer must contain none of these, e.g. \"error\" or an apology (case-insensitive)",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "mustInclude": {
                    "description": "The answer must contain every one of these (case-insensitive)",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prompt": {
                    "description": "The fixed prompt sent every run (keeping it the same is what makes a regression show)",
                    "type": "string"
                  },
                  "responsePath": {
                    "description": "Dot path to the answer text in the JSON reply, e.g. \"reply\" or \"choices.0.message.content\" (blank = the whole reply)",
                    "type": "string"
                  }
                },
                "required": ["endpoint", "mustExclude", "mustInclude", "prompt"],
                "type": "object"
              },
              "brokenLinks": {
                "additionalProperties": false,
                "description": "Extra pages to crawl, address fragments to skip, and whether external links are checked too",
                "properties": {
                  "checkExternal": {
                    "description": "Also check links to other sites",
                    "type": "boolean"
                  },
                  "ignore": {
                    "description": "Address fragments to skip (a link containing one isn't checked)",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "urls": {
                    "description": "Extra pages to crawl, full URLs on the site",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["checkExternal", "ignore", "urls"],
                "type": "object"
              },
              "browseUrl": {
                "description": "Storefront: the shop page (blank = the calibrated one)",
                "type": "string"
              },
              "checkId": {
                "description": "The monitor's id",
                "type": "string"
              },
              "checkout": {
                "additionalProperties": false,
                "description": "Checkout monitors",
                "properties": {
                  "coupon": {
                    "additionalProperties": false,
                    "description": "Apply a coupon at checkout and check the outcome (null removes it)",
                    "properties": {
                      "code": {
                        "description": "The coupon code",
                        "type": "string"
                      },
                      "expect": {
                        "description": "What should happen: applies (default) or rejected",
                        "enum": ["applies", "rejected"],
                        "type": "string"
                      }
                    },
                    "required": ["code"],
                    "type": ["object", "null"]
                  },
                  "depth": {
                    "description": "\"ready\" stops at the payment step; \"order\" places a REAL test order (the WordPress plugin marks it, keeps it out of stock, analytics and ad platforms, and removes it)",
                    "enum": ["ready", "order"],
                    "type": "string"
                  },
                  "expect": {
                    "additionalProperties": false,
                    "description": "What the order totals must be",
                    "properties": {
                      "discount": {
