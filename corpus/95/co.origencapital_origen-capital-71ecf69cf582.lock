{
  "lockfileVersion": 2,
  "subjects": {
    "co.origencapital/origen-capital": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://origencapital.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "origen-capital",
        "title": "Origen Capital",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free lookup of US community lenders (CDFIs, low-income credit unions, SBA microlenders, ITIN-friendly national nonprofits) by lane + county + state, and of who actually approves home loans in each county (HMDA), in English or Spanish. Reference data from public federal sources, each record dated — not a lender, nobody paid to be listed, no borrower data collected. Use origen_financing_coverage to see what is covered.",
      "tools": [
        {
          "name": "origen_financing_coverage",
          "title": "What the directory covers",
          "description": "Coverage of the Origen Capital directory. Without arguments: national totals, per-lane counts, sources with vintages and refresh cycles. With a state: its county coverage and largest county lists, so an agent can form a valid lookup.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "US state name or two-letter code (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf38e58321fae0abd7cdcbabfb93f351cc41ff164f7427e94cf506fddc4e4a94"
        },
        {
          "name": "origen_financing_lookup",
          "title": "Look up community lenders for a US county",
          "description": "The CDFIs, low-income credit unions, SBA microloan intermediaries, and ITIN-friendly national nonprofits serving a US county — the lenders that say yes when a bank says no. By lane (business, home, personal), in English or Spanish. Splits institutions headquartered in the county from those with only a walk-in branch there; a county with no door at all is answered honestly with the state tier. Every record names its federal source and vintage. Public federal data; nobody pays to be listed; no borrower information is asked or taken.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "US county name, e.g. 'Harris County'. A city name also works and resolves to its county ('Houston' → Harris County).",
                "type": "string"
              },
              "itin": {
                "description": "true when the borrower has an ITIN and no SSN — the answer leads with verified ITIN-friendly options",
                "type": "boolean"
              },
              "lane": {
                "description": "'business', 'home', or 'personal' — plain words and Spanish work too ('negocio', 'vivienda', 'préstamo personal')",
                "type": "string"
              },
              "language": {
                "description": "Answer language, default 'en'",
                "enum": ["en", "es"],
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code, e.g. 'Texas' or 'TX'",
                "type": "string"
              },
              "types": {
                "description": "Optional: keep only these kinds of institution (any match). Omit for all.",
                "items": {
                  "enum": ["credit_union", "cdfi", "sba_microlender", "national_nonprofit", "minority_depository"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["county", "lane", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe6ce11352c9d875ef5232abe219ea77df398441fccaa00e8d960cafa82c3afc"
        },
        {
          "name": "origen_home_loan_approvals",
          "title": "Who approves home loans in a US county",
          "description": "How often home-purchase applications in a US county were approved or denied in the latest HMDA year, the most common reasons for denial, and the lenders that made the most home loans there — each with applications, loans made, denial rate and median rate. From the federal Home Mortgage Disclosure Act public loan records. Counts and rates only; nothing is ranked or recommended. Small lenders below HMDA's reporting threshold, including many credit unions in the directory, are not counted.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "US county name, e.g. 'Harris County'. A city name also works ('Houston' → Harris County).",
                "type": "string"
              },
              "language": {
                "description": "Answer language, default 'en'",
                "enum": ["en", "es"],
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code, e.g. 'Texas' or 'TX'",
                "type": "string"
              }
            },
            "required": ["county", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60897da5c2730414e51ac40b64d6cf9fad26df9f212e1b14c447f4e73e276e19"
        },
        {
          "name": "origen_institution",
          "title": "Look up one institution",
          "description": "Find an institution in the directory by name (optionally narrowed to a state) or by the id a lookup returned. Returns its kind, certifications, lanes, head-office county, every county where it keeps a door, and the federal list and vintage it comes from. Answers 'not in the directory' plainly — most banks are not in it by design.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "An id from a previous lookup, e.g. 'california/mission-asset-fund-cdfi' (optional; overrides name)",
                "type": "string"
              },
              "language": {
                "description": "Language for notes, default 'en'",
                "enum": ["en", "es"],
                "type": "string"
              },
              "name": {
                "description": "Institution name or part of it, e.g. 'Mission Asset Fund'",
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b9a81c02555050f42016bae24a74bb17622e6a2708dcc9a078fdf4a34373b89"
        }
      ],
      "digest": "sha256:30bb01ec9bae32f5b5f41d35a170a0c46257d67f1dd5eaa8df623aa81f9ae553"
    }
  }
}
