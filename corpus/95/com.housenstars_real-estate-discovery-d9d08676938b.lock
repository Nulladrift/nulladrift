        {
          "name": "search_hns_properties",
          "title": "Search HOUSE N STARS properties",
          "description": "Search real public luxury real estate listings from the HOUSE N STARS structured property dataset using server-side WordPress search. Supports free-text criteria and filters for location, property type, Sale/Rent status, price range, bedrooms and result limit. Returns structured listing data including title, location, property type, transaction type, price display, bedrooms, bathrooms, surface, features and public listing URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bedrooms": {
                "description": "Minimum number of bedrooms requested by the user.",
                "type": "number"
              },
              "limit": {
                "description": "Maximum number of results to return. Maximum 20.",
                "type": "number"
              },
              "location": {
                "description": "Location filter, for example Dubai, Abu Dhabi, Monaco, Nice, Èze.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price as a number, without currency symbols.",
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price as a number, without currency symbols.",
                "type": "number"
              },
              "property_type": {
                "description": "Property type, for example Villa, Apartment, Penthouse, Townhouse.",
                "type": "string"
              },
              "query": {
                "description": "Free text search, for example sea view, garden, penthouse, waterfront. Do not use this field for sale/rent intent alone; use transaction_type.",
                "type": "string"
              },
              "transaction_type": {
                "description": "Sale/Rent filter. Use exactly Sale for properties for sale and Rent for rental properties. Do not put rent/rental/for rent into query when this parameter is used.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "number"
              },
