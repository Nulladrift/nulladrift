{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.jobjar.www/trades": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.jobjar.com.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "jobjar-trades",
        "title": "JobJar: find a tradie",
        "version": "1.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "JobJar's index of local Australian trades businesses. Search, then send one quote request to up to 3 businesses with quotable: true (request_quotes), or for businesses with bookable: true check availability and request a booking. The customer always confirms by a link sent to their own mobile or email.",
      "tools": [
        {
          "name": "get_listing",
          "description": "One business's full listing by id (from search_trades).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a business's listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:792d6f31ee30de363ef961ee1503e03406b64a0c18c588c94e5b7e76e9dca4cb"
        },
        {
          "name": "quote_status",
          "description": "Which businesses have answered a quote request, and what they said. Needs the request_id and status_key from request_quotes.",
          "inputSchema": {
            "properties": {
              "request_id": {
                "type": "string"
              },
              "status_key": {
                "type": "string"
              }
            },
            "required": ["request_id", "status_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check quote replies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2816602911aec86e468ead2c1cb88cd99ecb96b17a9621621a494d3ebfb6b223"
        },
        {
          "name": "request_quotes",
          "description": "Send one quote request to up to 3 local businesses at once (quotable: true from search_trades), so the customer doesn't have to ring around. Call with step 'check' first and show the customer the read_back; only after they agree, call again with step 'send' and identical details. If the person has connected JobJar (signed in once), it sends straight away with their verified mobile; otherwise they get a code or link on their own mobile or email and nothing reaches the businesses until they confirm. Each business replies to the customer directly with a price, a time to come and look, or 'not for me'.",
          "inputSchema": {
            "properties": {
              "customer_email": {
                "description": "If no mobile, or as well.",
                "type": "string"
              },
              "customer_mobile": {
                "description": "Australian mobile. The confirm link and replies go here.",
                "type": "string"
              },
              "customer_name": {
                "type": "string"
              },
              "details": {
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "job": {
                "description": "What needs doing, in the customer's words, with anything that helps price it (size, brand, age, access).",
                "type": "string"
              },
              "listing_ids": {
                "description": "Ids from search_trades, chosen by the customer.",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "postcode": {
                "type": "string"
              },
              "step": {
                "enum": ["check", "send"],
                "type": "string"
              },
              "suburb": {
                "type": "string"
              },
              "timing": {
                "description": "When they need it, e.g. 'this week', 'urgent', 'no rush'.",
                "type": "string"
              }
            },
            "required": ["customer_name", "job", "listing_ids", "postcode", "step", "suburb"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask up to 3 tradies for a quote"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e249f3e1c68f6a668818de33093072ab02c905070fce23824264727c36de854d"
        },
        {
          "name": "search_trades",
          "description": "Find local trades businesses in Australia for a job and suburb (plumbers, electricians, air conditioning, locksmiths and more). Returns the best matches with contact details; quotable: true means JobJar can send them a quote request (request_quotes); bookable: true means they also take bookings, with guide prices and next free times.",
          "inputSchema": {
            "properties": {
              "job": {
                "description": "The job in plain words, e.g. 'leaking hot water system'.",
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "suburb": {
                "description": "Suburb or postcode of the job.",
                "type": "string"
              },
              "trade": {
                "enum": ["plumber", "electrician", "aircon", "locksmith", "roofing", "painter", "handyman", "carpenter", "tiler", "landscaper", "reticulation", "fencing", "pest", "solar", "garagedoor", "appliance", "renovator", "plasterer"],
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search local tradies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:37e688597e676cc06b4c32d2229863380cd20061e051cd1ebe95e39348776846"
        }
      ],
      "digest": "sha256:1aa56b490d5984507b30176eb73dd8e9f41664ff7dd75e5c6d03133a607dc988"
    }
  }
}
