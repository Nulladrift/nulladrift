{
  "lockfileVersion": 2,
  "subjects": {
    "com.pdfia/pdf-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pdfia.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pdfia",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free PDF toolkit (pdfia.com). PDFs travel as base64 strings (max 10 MB per file). Files are processed in-memory and never stored. Rate limit: ~30 operations per 10 minutes.",
      "tools": [
        {
          "name": "add_page_numbers",
          "description": "Stamp page numbers onto every page of a PDF. Returns base64.",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              },
              "format": {
                "description": "Default n",
                "enum": ["n", "page-n", "n-of-total"],
                "type": "string"
              },
              "position": {
                "description": "Default bottom-center",
                "enum": ["bottom-center", "bottom-right", "bottom-left", "top-center"],
                "type": "string"
              },
              "size": {
                "description": "Font size 6–24, default 12",
                "type": "number"
              },
              "start": {
                "description": "First number, default 1",
                "type": "number"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5bb8c01df611944a4022321396cd65d49722f24c420c9cbb3a97427f15a2c997"
        },
        {
          "name": "extract_pages",
          "description": "Extract the given pages into a new PDF (original order). Returns base64.",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              },
              "pages": {
                "description": "Page list like \"2, 5-7\" (1-based)",
                "type": "string"
              }
            },
            "required": ["file", "pages"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e54162d3827da21734ecb2f6e1a62412140d790a0ea7c212eba9984b013668bd"
        },
        {
          "name": "flatten_pdf",
          "description": "Flatten fillable form fields into permanent page content so answers can't be edited. Returns base64.",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b95a64221f9b2d85e2e76a46bdc732dab9d3cf86dff30f3162ce5db833301c0"
        },
        {
          "name": "get_pdf_metadata",
          "description": "Read a PDF's document properties (title, author, subject, keywords, creator, producer, dates, page count).",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cd71808bd86f9bc7e0be408be88ee31ba403368e231bb684944fb5a5f8caa40"
        },
        {
          "name": "merge_pdfs",
          "description": "Merge multiple PDF files into one, in the order given. Returns the merged PDF as base64.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "2+ PDFs, base64-encoded, in merge order",
                "items": {
                  "description": "The PDF file, base64-encoded (max 10 MB)",
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86541d8d5408ad94333aacae85c7a2a3622dfd79ff3c1cfa65ed765d94f6395c"
        },
        {
          "name": "remove_pages",
          "description": "Delete the given pages from a PDF. Returns the remaining document as base64.",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              },
              "pages": {
                "description": "Page list like \"2, 5-7\" (1-based)",
                "type": "string"
              }
            },
            "required": ["file", "pages"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54c35cf29b0d225291ea1c5dc5d48012d7722c1eaed9dd8969a0c39f1724279a"
        },
        {
          "name": "rotate_pdf",
          "description": "Rotate pages clockwise by 90, 180, or 270 degrees. Rotates all pages unless a page list is given. Returns base64.",
          "inputSchema": {
            "properties": {
              "degrees": {
                "enum": [90, 180, 270],
                "type": "number"
              },
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              },
              "pages": {
                "description": "Optional page list like \"1, 3\"; omit to rotate all",
                "type": "string"
              }
            },
            "required": ["degrees", "file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01df32b3b20eecf9fb291df40c0e9a3f6e2e31572e2c4ccf14db4f53fb203e25"
        },
        {
          "name": "set_pdf_metadata",
          "description": "Rewrite a PDF's document properties. Pass empty strings to strip identifying metadata before sharing. Returns base64.",
          "inputSchema": {
            "properties": {
              "author": {
                "type": "string"
              },
              "creator": {
                "type": "string"
              },
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              },
              "keywords": {
                "description": "Comma-separated",
                "type": "string"
              },
              "producer": {
                "type": "string"
              },
              "subject": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad5417f0cdfbceec7bf467c74441315ec8d948d7b6120597658a5675ea61ece6"
        },
        {
          "name": "split_pdf",
          "description": "Split a PDF into parts. Provide ranges like \"1-3, 5, 8-10\" (each comma group becomes one output PDF), or omit ranges to get every page as its own PDF. Returns base64 files.",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              },
              "ranges": {
                "description": "e.g. \"1-3, 5, 8-10\"; omit for one file per page",
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98ad87ad073d6c5f5267fc932714d56fc1c02edb778a3f12c5ebad6b0507023e"
        },
        {
          "name": "watermark_pdf",
          "description": "Stamp a diagonal text watermark (e.g. \"CONFIDENTIAL\", \"DRAFT\") across every page. Returns base64.",
          "inputSchema": {
            "properties": {
              "color": {
                "description": "Default gray",
                "enum": ["gray", "red", "blue"],
                "type": "string"
              },
              "file": {
                "description": "The PDF file, base64-encoded (max 10 MB)",
                "type": "string"
              },
              "opacity": {
                "description": "0.02–1, default 0.15",
                "type": "number"
              },
              "size": {
                "description": "Font size in points, 8–200, default 60",
                "type": "number"
              },
              "text": {
                "description": "Watermark text",
                "type": "string"
              }
            },
            "required": ["file", "text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ddf28be59a6045e239f26cb678e7a0655b4bc776f8b67872f654ba4abc4d4a35"
        }
      ],
      "digest": "sha256:cda9747f5b003785a55287bc80dcb950cc01f751d2d2d09970e03e4a29498782"
    }
  }
}
