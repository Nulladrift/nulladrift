      "instructions": "6102ttk.com karar araması — Türk ticaret hukuku kararları (Yargıtay hukuk daireleri ve kurulları, bölge adliye\nmahkemesi hukuk daireleri; ~420 bin karar). Metinler anonimleştirilmiştir (kişisel veriler maskeli, maskeleme kusursuz\nolmayabilir). Bu araçlar hukuki görüş vermez; yalnız karar metni, künye ve resmî bağlantı döndürür.\n\nÖNERİLEN AKIŞ\n1. Soruyu mahkemenin diline çevir: Daire kendi hükmünü kanun maddesi ve yerleşik ibarelerle yazar (\"hak ve nesafet indirimi\",\n   \"TTK 341\", \"dava şartı\"); taraflar sorunun kelimeleriyle anlatır. Sorgunun çekirdeği, aranan hükmü kuran bir gerekçe\n   cümlesinde mutlaka geçecek iki-üç kavram olsun.\n2. karar_say ile say (birkaç kez): hedef kabaca 50–300 eşleşen karar. Çok fazlaysa öbek, yakınlık ya da bir + daha ekle; çok\n   azsa (özellikle 0) en dar şartı gevşet (öbeği yakınlığa, +'yı işaretsize, tek biçimi OR'a). \"tek_basina\" sayıları hangi\n   şartın daralttığını gösterir. Aranan hükmü taşıyan öbeğe ^2–^3 ver, bağlam kelimelerini işaretsiz bırak.\n3. karar_ara ile ilk 20'yi al.\n4. Seçmek/sıralamak için karar_gerekce ile Dairenin KENDİ gerekçesini oku. Aranan husus yalnız taraf iddiasında, ilk derece\n   özetinde, bilirkişi aktarımında, karşı oyda ya da başka bir kararın naklinde geçiyorsa o karar konuyu çözmüyor demektir.\n   Kullanıcıya bir kararı sunarken gerekçeden BİREBİR cümle alıntıla (harf, ek, olumsuzluk değiştirmeden) ve künyeyi + resmî\n   bağlantıyı ver. \"Bu karar uygulanır\", \"yerleşik içtihat\" gibi nitelemeyi kullanıcıya kendi değerlendirmen olarak sun.\n5. Tam metin gerekirse karar_metni; kanun metni için madde_getir.\n\nSORGU DİLİ (karar_say ve karar_ara)\n  teminat              kelime — kök üzerinden: teminatın, teminata … eşleşir (kavram alanı)\n  +teminat             mutlaka geçecek          -zamanaşımı   geçmeyecek (sert araç: doğru kararı da atabilir)\n  işaretsiz kelime     şart değil; yalnız sıralamaya katkı verir\n  \"hak ve nesafet\"     öbek: yan yana, bu sırayla\n  \"kira artış\"~5       yakınlık: bu sırayla, aralarında en çok 5 kelime (ters sıra için ikinci öbek yaz)\n  \"hak ve nesafet\"^3   ağırlık\n  +( a OR b OR \"c d\" ) seçeneklerden en az biri         ( … AND … ) ikisi birden\n  ham:\"İçtihadı Birleştirme\"   tam yazım (kök değil, birebir) — kökleme bozuyorsa kullan\n- Türkçe karakterlerle yaz (ı, ş, ğ, ö, ü, ç); ASCII \"kismi\" dizindeki \"kısmi\"yi BULMAZ.\n- Olumsuzluk korunur: \"ödenmemiştir\" ile \"ödenmiştir\" ayrı kelimelerdir.\n- Araç her kelimenin dizinde neye çevrildiğini gösterir (\"ceviri\"); anlamsız bir köke düşen ifadeyi ham:\"…\" ile yaz.\n- Sıralama BM25 + Dairenin değerlendirme bölümünde geçen kavramlara ek ağırlık. Sorgu en çok 500 karakter.\nÖrnek (kira tespitinde hak ve nesafet indirimi):\n  +\"kira tespit\"~2 +( \"hak ve nesafet\" OR hakkaniyet ) +( indirim OR \"uygun bir oranda\" ) \"emsal kira\"^2 \"TBK 344\"\n\nKİMLİK: her kararın \"satir\" numarası vardır; karar_gerekce ve karar_metni bu numarayı alır.\nSINIR: sunucu aynı anda sınırlı sayıda çağrı işler; \"sunucu şu an yoğun\" hatası gelirse birkaç saniye bekleyip aynı çağrıyı\nyinele. IP başına dakikada sınırlı çağrı; HTTP 429 gelirse bir dakika bekle.",
      "tools": [
