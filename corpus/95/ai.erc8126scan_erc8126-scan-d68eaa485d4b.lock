  "subjects": {
    "ai.erc8126scan/erc8126-scan": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://erc8126scan.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "erc8126-scan",
        "title": "ERC-8126 Scan",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Security intelligence for ERC-8004 agents. list_services and get_index_stats are free and need no key, wallet or payment — call list_services first for the catalogue and prices. Every other tool is paid, either per call in USDC over x402 or against an erc8126_ API key passed as a bearer token. All tools are read-only. Judge an agent by risk_level, not overall_risk_score: scoring presumes risk, so an unassessed agent scores 100 exactly like a dangerous one.",
      "tools": [
        {
          "name": "get_agent",
          "title": "Get agent detail",
          "description": "Fetch the full detail record for a single agent by UUID, including verification state and metadata. Judge the agent by `risk_level`, not the raw overall_risk_score: 'not_verified' means nobody has paid to assess it yet and scores 100 by presumption, which is not a finding against the agent. Costs $0.001 USDC per call when paying with x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Agent UUID.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0e78d2ba77fe7b7c9a585970ac2b5b56c935f30da1357646453ad422bcf9a18b"
        },
        {
          "name": "get_agent_activity",
          "title": "Get agent activity",
          "description": "Fetch on-chain activity and liveness signals for one agent, including whether it is currently active and when it was last checked. Costs $0.002 USDC per call when paying with x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Agent UUID.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4c667d7a86430ea3c82f1af03090d729d59506e76e204a16af7151c40071a590"
        },
        {
          "name": "get_agent_report",
          "title": "Get agent security report",
          "description": "Fetch the full security assessment report for one agent: per-dimension findings, evidence and recommendations. Returns data only for agents owned by the caller — the wallet bound to your API key, or the wallet that paid via x402. Other agents return FORBIDDEN_NOT_OWNER. Use get_agent for public scores on any agent. Costs $0.02 USDC per call when paying with x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Agent UUID.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c244ad7e3d0d3b800327c0085c4d452afd6b3ea8b471e62ddd4bc2d9355e17b"
        },
        {
          "name": "get_index_stats",
          "title": "Index coverage",
          "description": "Free. How much of the ERC-8004 agent population this index covers: total agents synced from the on-chain Identity Registry, and how many carry verification results. Use it to judge whether the index is likely to know about the agent you care about before paying to look it up.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:acd998d6cd26abe0d28b3d306a23ab65bc6b66493e31b0d4b35fa9caafbc0f2d"
        },
        {
          "name": "get_report_price",
          "title": "What a full report costs",
          "description": "Free. The price of a full report in both USDC and CENTRY, plus the address to pay. CENTRY is cheaper — the discount percentage is included. Use this before purchase_report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:64cd760cc71fbe6dbe0fa3cbeec4156da8dff44f64f2ad5c6e93b266b3cf5a8d"
        },
        {
          "name": "get_verification_challenge",
          "title": "Start a verification",
          "description": "Free. Everything needed to verify an agent in one call: the exact message to sign, the address to send CENTRY to, and the amount. An agent airdropped 1 CENTRY uses this to spend it — the first verification costs exactly that 1 CENTRY. Sign the message, send the payment, then call verify_agent with the signature and the transaction hash. No key, wallet auth or payment to call this. IMPORTANT: each signature may be used ONCE. Call this again for a fresh challenge before run_verification, or that step fails with 'Signature already used'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "The agent's UUID, as given in the outreach memo.",
                "type": "string"
              },
              "wallet": {
                "description": "The wallet that will sign and pay, 0x-prefixed.",
                "type": "string"
              }
            },
            "required": ["agent_id", "wallet"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e7538548c2af4916e1cba2ba37c06f6d3f8a1b58332afffc2e3d623f18bdfb9d"
        },
        {
          "name": "list_services",
          "title": "List services and prices",
          "description": "Free. The catalogue: every tool on this server, what it returns, what it costs per call, and how to read the risk fields. Call this first — it is authoritative about pricing, needs no payment, key or wallet, and answers most questions about what this server can do without spending anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:26ee9c4aba09f804a3cdc316b6c1fff3508e31782b7404d5a9f04911e3933e82"
        },
        {
          "name": "purchase_report",
          "title": "Buy a full report with CENTRY or USDC",
          "description": "Free to call. Buys the full security report for an agent you own, paying by on-chain transfer rather than x402 — which is the only way to pay in CENTRY. Call get_report_price first for the amount and the address, transfer it on Base, then call this with the tx hash. Paying in CENTRY is cheaper than USDC; the discount is in the price quote. The alternative is get_agent_report, which charges USDC per call over x402 and cannot accept CENTRY.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "The agent's UUID. You must own it.",
                "type": "string"
              },
              "payment_token": {
                "description": "CENTRY or USDC. Defaults to USDC.",
                "type": "string"
              },
              "payment_tx_hash": {
                "description": "Hash of the CENTRY or USDC transfer.",
                "type": "string"
              },
              "signature": {
                "description": "Signature over the challenge message.",
                "type": "string"
              },
              "signed_message": {
                "description": "The exact message that was signed.",
                "type": "string"
              },
              "wallet": {
                "description": "The owning wallet, 0x-prefixed. Must match the signature.",
                "type": "string"
              }
            },
            "required": ["agent_id", "payment_tx_hash", "signature", "signed_message", "wallet"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:96e6e8edebd9af8418c84d0a31deafe82a76242c9f2b84c67c077e19f65e035f"
        },
        {
          "name": "read_messages",
          "title": "Read messages sent to your address",
          "description": "Free. Returns any message sent to an address on Base alongside a token transfer. Two channels: a MemoSender `Memo` event, which you can also subscribe to yourself, and older memos appended to ERC-20 transfer calldata, which the Transfer event does not carry and transfer indexers do not return. If you received a token and want to know why, call this with your address. No key, wallet or payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The receiving address, 0x-prefixed.",
                "type": "string"
              },
              "limit": {
                "description": "How many recent transfers to inspect (default 10, max 50).",
                "type": "number"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:48f9ad05b1906b1375b2a77709fdf793c3ec07ed968021712f57717afbf54d53"
        },
        {
          "name": "run_verification",
          "title": "Spend a credit and verify",
          "description": "Free to call. Runs the verification itself, consuming one credit. This is the step AFTER verify_agent: redeeming a payment grants a credit, and this spends it. Needs a FRESH challenge from get_verification_challenge — the signature used for verify_agent is already spent and reusing it fails with 'Signature already used'. Returns per-dimension results (ETV, SCV, WV, MCV, and WAV plus domain if the agent has proved domain ownership by DNS TXT record).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "type": "string"
              },
              "signature": {
                "description": "Signature over the challenge message.",
                "type": "string"
              },
              "signed_message": {
                "description": "The exact message that was signed.",
                "type": "string"
              },
              "wallet": {
                "type": "string"
              }
            },
            "required": ["agent_id", "signature", "signed_message", "wallet"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d3b37eb08725929b971294e6ef594044300005441aaf115c8ae78b6a773a768c"
        },
        {
          "name": "search_agents",
          "title": "Search agents",
          "description": "Search and filter scanned ERC-8004 agents by chain, risk score range, and verification status. Returns a paginated list with per-dimension scores (ETV, MCV, SCV, WAV, WV) and an overall risk score. Pass `wallet` or `id` to look up a single agent directly. IMPORTANT: read `risk_level`, not `overall_risk_score`, to judge an agent. Scoring presumes risk, so an agent nobody has paid to verify scores 100 exactly like one assessed as dangerous. risk_level separates them: 'not_verified' means unassessed and is NOT a finding against the agent, while 'critical' means verified and genuinely high risk. Most indexed agents are 'not_verified'. Costs $0.001 USDC per call when paying with x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Filter by chain, e.g. 'base', 'ethereum'.",
                "type": "string"
              },
              "id": {
                "description": "Look up one agent by its UUID.",
                "type": "string"
              },
              "limit": {
                "description": "Page size. Capped by your plan tier.",
                "minimum": 1,
                "type": "integer"
              },
              "max_score": {
                "description": "Maximum overall risk score (0-100).",
                "type": "integer"
              },
              "min_score": {
                "description": "Minimum overall risk score (0-100).",
                "type": "integer"
              },
              "order": {
                "description": "Sort direction. Defaults to desc.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "page": {
                "description": "Page number, 1-indexed.",
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Sort field. Defaults to created_at.",
                "enum": ["created_at", "overall_risk_score", "name"],
                "type": "string"
              },
              "verified": {
                "description": "Filter by verification status.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "wallet": {
                "description": "Look up one agent by registrant or agent wallet address.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d6e37fe316c78cfde4cd03a4c9f4c9296baf7c1b0b37c0fd897a7ed180dc1331"
        },
        {
          "name": "verify_agent",
          "title": "Redeem a payment and verify",
          "description": "Free to call. Submits a signed challenge and the CENTRY payment transaction, and credits the agent so verification can run. Call get_verification_challenge first. The cost is the on-chain CENTRY transfer, not a fee on this tool. This CONSUMES the signature: get a fresh challenge before calling run_verification. Granting the credit is not the end — run_verification spends it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "type": "string"
              },
              "payment_tx_hash": {
                "description": "Hash of the CENTRY transfer.",
                "type": "string"
              },
              "signature": {
                "description": "Signature over the challenge message.",
                "type": "string"
              },
              "signed_message": {
                "description": "The exact message that was signed.",
                "type": "string"
              },
              "wallet": {
                "type": "string"
              }
            },
            "required": ["agent_id", "payment_tx_hash", "signature", "signed_message", "wallet"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c302bb670c3173d03e9e7faf89643680b49b2c19360755bd3b8df6920465bcd8"
        }
      ],
      "digest": "sha256:7f2a0e54c3b4db3c85f9be17a0247b576242cde74d44089ce613e2331be6d25d"
    }
  }
