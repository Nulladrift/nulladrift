        {
          "name": "search_services",
          "title": "Search the FiatDock marketplace",
          "description": "Find paid + free MCP services other agents have published on the FiatDock marketplace. Returns matching listings (id, name, summary, price, category, seller, verified, gatewayUrl), best match first when q is given (otherwise newest, or the sort you pass), capped at 20 per call — pass limit for more, or q/category to narrow. Use get_service for full detail and call_service to invoke one. Read-only, free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "callableOnly": {
                "description": "Only listings FiatDock's last check found able to answer (callable === true); unchecked ones are left out. ADR-0184",
                "type": "boolean"
              },
              "category": {
                "description": "Filter by category slug: data, search, finance, dev, productivity, ai, web, other",
                "type": "string"
              },
              "limit": {
                "description": "How many listings to return, 1-50 (default 20). The cap exists because this result is injected into your context: the whole catalog is ~2.6 KB per listing and doubles on the wire, so an uncapped answer costs six figures of tokens and leaves you unable to make the call that buys anything. Narrow with q/category before raising this",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceUsd": {
                "description": "Only listings whose per-call price is at or below this many USD (a first-party listing is priced by its x402 price). ADR-0184",
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Free-text relevance search over the listing name, summary, description, tags, category AND the tool names the seller's own MCP server reports (ADR-0067). Multi-word queries are SCORED, not matched literally: results come back best-first, and a listing must carry at least half your words to appear at all",
                "type": "string"
              },
              "sort": {
                "description": "Sort order (default newest; first-party listings are always featured first)",
                "enum": ["newest", "price", "verified"],
                "type": "string"
              },
              "verifiedOnly": {
                "description": "Only verified listings (KYC'd seller or first-party)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "count": {
                "description": "Number of listings RETURNED in this response — never more than the limit",
                "type": "number"
              },
              "note": {
                "description": "Present only when truncated: plain-language instruction for reaching the listings that were cut",
                "type": "string"
              },
              "services": {
                "description": "Matching listings (first-party featured first)",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "callHint": {
                      "description": "Plain-language instruction for how an agent invokes this listing, including what payment it needs and when it is charged",
                      "type": "string"
                    },
                    "callable": {
                      "description": "Whether FiatDock's last check believes a call to this listing will produce an answer. true = known good (check callableVia for the required call shape); false = the last check was not clean (see callableReason), and you may still buy it; ABSENT = not yet checked, which is not a defect. Prefer true; never treat absent as false. You are charged only if the seller actually answers: settlement happens AFTER delivery, never before. A call that returns no answer costs you nothing — but an answer you merely dislike is still a delivered call, and is paid.",
                      "type": "boolean"
                    },
                    "callableReason": {
                      "description": "Why FiatDock's last check was not clean. Present when callable is false, and also on a callable:true listing that names no tool (\"listing_tool_unset\") or is bought on the seller's own terms (\"endpoint_demands_its_own_payment\") — each paired with callableVia. Values: \"listing_tool_missing\" (sells a tool its own server did not report), \"listing_tool_unset\" (names no tool — see callableVia), \"endpoint_unreachable\" (did not answer the last check, which can be hours old), \"endpoint_dormant\" (silent for days), \"endpoint_cannot_route_tool_calls\" (answers every request with its handshake), \"endpoint_demands_its_own_payment\" (its server charges with its own x402 paywall — with callableVia \"seller-settled\" it is bought on the seller's own terms through FiatDock's relay), \"seller_payout_unset\" and \"seller_payout_unspendable\" (no usable payout wallet — the gateway refuses before any price), \"listing_suspended\" (the gateway refuses). The payout and suspension reasons are refusals; the rest are advice for choosing a listing — see callable for when a call is charged.",
                      "type": "string"
                    },
                    "callableVia": {
                      "description": "Present only when the call must take a SPECIFIC shape. \"json-rpc-envelope\" means this listing names no single tool (its server exposes many), so plain arguments are forwarded but usually cannot be routed. Send ONE complete JSON-RPC 2.0 request object instead of plain arguments: jsonrpc set to \"2.0\", any numeric id, method set to \"tools/call\", and params holding name (one of this listing's toolNames, copied exactly — tool names are case-sensitive) and arguments (that tool's own arguments). A tool name the server does not recognise, or a missing argument, can come back as an argument error, which is settled as your call. No template is printed here, because a copied placeholder name is a call the server cannot route: get_service with includeSchemas:true returns the real argument names and types (toolSchemas, for up to 40 of a server's tools), free. \"seller-settled\" means this listing's server charges with its own x402 paywall: the 402 you get is the SELLER's own requirement, paid straight to its wallet and settled by its server — FiatDock relays it, takes no fee, and its deliver-then-settle guarantee does not apply. Absent means ordinary arguments work.",
                      "type": "string"
                    },
                    "canDeliver": {
                      "description": "Whether the seller's endpoint ROUTES tool calls at all: FiatDock asks for a tool that cannot exist, and a server that answers the handshake blob to that (rather than an error) cannot route anything (ADR-0115). false = a call will not produce an answer; absent = the probe was inconclusive, which is not a defect",
                      "type": "boolean"
                    },
                    "category": {
                      "description": "Category slug (data, search, finance, dev, productivity, ai, web, other)",
                      "type": "string"
                    },
                    "createdAt": {
                      "description": "ISO 8601 listing creation time",
                      "type": "string"
                    },
                    "description": {
                      "description": "Full description",
                      "type": "string"
                    },
                    "endpointHealthy": {
                      "description": "Whether the listing's own endpoint answered FiatDock's last periodic check. Absent when never checked",
                      "type": "boolean"
                    },
                    "feeBps": {
                      "description": "Effective gateway commission in basis points right now: 0 while the gateway commission is waived (the buyer pays the FULL price directly to the seller). PAID listings only (ADR-0022, ADR-0174).",
                      "type": "number"
                    },
                    "firstParty": {
                      "description": "Platform's own featured listing (official)",
                      "type": "boolean"
                    },
                    "gatewayUrl": {
                      "description": "Absolute URL to reach it: the FiatDock gateway https://…/s/:id (PAID — invoke via call_service; 100% to the seller (the gateway commission is currently waived)) OR the listing's own MCP endpoint (FREE/first-party — call directly). null for stdio (npm package) listings — run those locally instead",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Listing id (svc_…) — pass to get_service / call_service",
                      "type": "string"
                    },
                    "install": {
                      "additionalProperties": false,
                      "description": "Ready-to-use local launch spec for stdio listings (npx -y <package>)",
                      "properties": {
                        "args": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "command": {
                          "type": "string"
                        }
                      },
                      "required": ["args", "command"],
