        {
          "name": "satellite_scenes",
          "title": "Latest satellite images of any point (Sentinel-2) ($0.009)",
          "description": "PAID ($0.009 USDC via x402). The newest satellite images of any coordinate, from the Copernicus Sentinel-2 Level-2A archive (free, open imagery; ~10 m per pixel; a revisit every ~5 days) via Element 84's Earth Search catalogue: for each scene the capture time, cloud cover, MGRS tile, sun elevation, a small JPEG preview link and the full-resolution true-colour image as a Cloud-Optimized GeoTIFF. Filter by a cloud limit (default 30%) and a look-back window (default 60 days, up to 365); newest first. No scene in the window answers 404 and is not charged. Every answer carries the attribution the Copernicus licence asks for. Without payment this returns the 402 challenge; the fiatdock-mcp npm package pays automatically. Any answer the tool cannot produce is >= 400 and is NOT charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How far back to look, in days, 1-365 (default 60)",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "lat": {
                "description": "Latitude in decimal degrees (-90 to 90)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "How many scenes, 1-10, newest first (default 3)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude in decimal degrees (-180 to 180)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "maxCloudPct": {
                "description": "Only scenes with at most this much cloud, 0-100 (default 30)",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "payment": {
                "description": "Base64 of a single x402 v2 PaymentPayload (EIP-3009 transferWithAuthorization on Base USDC). OMIT it on the first call: the 402 you get back carries `howToPay.payloadTemplate` — the exact envelope to fill in — plus the price and the EIP-712 domain. Send it on the second call to complete the purchase; it is forwarded as the PAYMENT-SIGNATURE header, never as body data. Nothing is charged for the 402 itself, and a call that fails after payment settles nothing.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "asOf": {
                "description": "ISO time the catalogue was read",
                "type": "string"
              },
              "attribution": {
                "description": "The attribution the Copernicus licence asks for — keep it beside any use of the images",
                "type": "string"
              },
              "collection": {
                "description": "The imagery collection (Sentinel-2 Level-2A)",
                "type": "string"
              },
              "count": {
                "description": "Scenes returned",
                "type": "number"
              },
              "defaulted": {
                "additionalProperties": false,
                "description": "Present only when the body was empty: which subject the answer is for, and why",
