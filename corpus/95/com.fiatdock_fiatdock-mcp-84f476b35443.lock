                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "hours": {
                "description": "How many hours ahead the `hourly` rows reach, 1-72 (default 24). Steps are 1 h for about the first 2.5 days and 6 h after",
                "maximum": 72,
                "minimum": 1,
                "type": "integer"
              },
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90 (required with lon; an empty body answers the published example point)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, -180 to 180 (required with lat)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "payment": {
                "description": "Base64 of a single x402 v2 PaymentPayload (EIP-3009 transferWithAuthorization on Base USDC). OMIT it on the first call: the 402 you get back carries `howToPay.payloadTemplate` — the exact envelope to fill in — plus the price and the EIP-712 domain. Send it on the second call to complete the purchase; it is forwarded as the PAYMENT-SIGNATURE header, never as body data. Nothing is charged for the 402 itself, and a call that fails after payment settles nothing.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "asOf": {
                "description": "ISO time the forecast was read from MET (or revalidated as unchanged)",
                "type": "string"
              },
              "attribution": {
                "description": "The credit MET Norway's licence (CC BY 4.0 / NLOD 2.0) requires — keep it beside any use of the data",
                "type": "string"
              },
              "current": {
                "additionalProperties": true,
                "description": "The forecast for the hour now falls in (a forecast, not an observation)",
                "properties": {
                  "airTemperatureC": {
                    "type": ["number", "null"]
                  },
                  "cloudCoverPct": {
                    "type": ["number", "null"]
                  },
                  "precipitationNext1hMm": {
                    "type": ["number", "null"]
                  },
                  "relativeHumidityPct": {
                    "type": ["number", "null"]
                  },
                  "symbol": {
                    "type": ["string", "null"]
                  },
                  "time": {
                    "type": "string"
                  },
                  "windFromDeg": {
                    "type": ["number", "null"]
                  },
                  "windSpeedMs": {
                    "type": ["number", "null"]
                  }
                },
                "required": ["airTemperatureC", "cloudCoverPct", "precipitationNext1hMm", "relativeHumidityPct", "symbol", "time", "windFromDeg", "windSpeedMs"],
                "type": "object"
              },
              "daily": {
                "description": "One row per UTC day, today first: min/max temperature, total precipitation, main condition",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "date": {
                      "description": "UTC calendar date (YYYY-MM-DD)",
                      "type": "string"
