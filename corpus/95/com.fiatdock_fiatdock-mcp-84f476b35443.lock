          "description": "PAID ($0.0027 USDC via x402). How to reach the organisation behind a website, read from its own HTML (the homepage, plus its contact page when linked): social profiles (X, LinkedIn company pages, GitHub, YouTube, Instagram, Facebook, TikTok, Telegram, Discord, Reddit, Farcaster, Bluesky…), role email addresses (info@, sales@, support@, press@…), phone numbers from tel: links, and contact-page URLs. Addresses that look like a person's are never returned — only counted. Up to 3 redirects followed, each safety-checked; JavaScript is not run (a JavaScript-only page answers 422, not charged). Without payment this returns the 402 challenge; the fiatdock-mcp npm package pays automatically. Any answer the tool cannot produce is >= 400 and is NOT charged.",
