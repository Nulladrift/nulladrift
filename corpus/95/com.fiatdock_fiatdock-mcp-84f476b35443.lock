                      "date": {
                        "description": "YYYY-MM-DD",
                        "type": "string"
                      },
                      "global": {
                        "description": "True = nationwide; false = only in `regions`",
                        "type": "boolean"
                      },
                      "localName": {
                        "description": "Name in the country's language",
                        "type": "string"
                      },
                      "name": {
                        "description": "Name in English",
                        "type": "string"
                      },
                      "regions": {
                        "description": "ISO 3166-2 subdivisions it applies in (empty when nationwide)",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "types": {
                        "description": "The source's classification: Public, Bank, School, Authorities, Optional, Observance",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["date", "global", "localName", "name", "regions", "types"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The first nationwide Public holiday after dateChecked in the same year; null when none remains that year (ask for the next year) or no date was checked"
              },
              "note": {
                "description": "How isHoliday is decided, and what the source does and does not cover",
                "type": "string"
              },
              "regionalHolidaysOnDate": {
                "description": "Holidays on dateChecked that apply only in some regions",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "date": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    },
                    "global": {
                      "description": "True = nationwide; false = only in `regions`",
                      "type": "boolean"
                    },
                    "localName": {
                      "description": "Name in the country's language",
                      "type": "string"
                    },
                    "name": {
                      "description": "Name in English",
                      "type": "string"
                    },
                    "regions": {
                      "description": "ISO 3166-2 subdivisions it applies in (empty when nationwide)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "types": {
                      "description": "The source's classification: Public, Bank, School, Authorities, Optional, Observance",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["date", "global", "localName", "name", "regions", "types"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "description": "Where the calendar came from",
                "type": "string"
              },
              "year": {
                "description": "The year listed",
                "type": "number"
              }
            },
            "required": ["asOf", "count", "country", "dateChecked", "holidays", "holidaysOnDate", "isHoliday", "nextHoliday", "note", "regionalHolidaysOnDate", "source", "year"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
