        {
          "name": "call_service",
          "title": "Call a marketplace service",
          "description": "Invoke a listed FiatDock service. PAID listings go THROUGH the gateway (POST /s/:id) so the non-custodial payment is enforced — ONE x402 payment: the full price, straight to the seller's wallet (the gateway commission is currently waived). TO BUY: call once WITHOUT `payment` to get the 402 challenge and step-by-step instructions, sign it with your own wallet, then call again with the same id/args plus `payment` set to the base64 x402 payload — the gateway settles on-chain directly to the seller and returns their response. No wallet? `npx fiatdock-mcp` with AGENT_PRIVATE_KEY signs automatically. FREE / first-party listings are forwarded to their real MCP endpoint directly (no payment). Pass the service's expected request body as `args`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "args": {
                "additionalProperties": {},
                "description": "JSON payload to send to the service (e.g. an MCP JSON-RPC request body) — shape is defined by that service",
                "type": "object"
              },
              "id": {
                "description": "Listing id (svc_…) to invoke, from search_services",
                "type": "string"
              },
              "payment": {
                "description": "Base64 x402 v2 PaymentPayload signed by YOUR wallet, satisfying every entry in the 402's `accepts`. Omit on the first call to receive the challenge; send it on the second call to complete the purchase. Sent to the gateway as the X-PAYMENT header — FiatDock never holds the funds.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ok": {
                "description": "true when the underlying service returned a 2xx",
                "type": "boolean"
              },
              "result": {
                "description": "The service's response body — parsed JSON when it returned JSON, otherwise the raw text"
              },
              "routedThroughGateway": {
                "description": "true if PAID (settled via /s/:id — 100% to the seller (the gateway commission is currently waived)); false if FREE/first-party direct",
                "type": "boolean"
              },
              "service": {
                "description": "Listing id that was invoked",
                "type": "string"
              },
              "status": {
                "description": "HTTP status returned by the service (or the gateway)",
                "type": "number"
              }
            },
            "required": ["ok", "routedThroughGateway", "service", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4ab5fc84e0b4ff7e652a34f6acc380e29bde0a1f27453d558f8c338c3f152d47"
        },
        {
          "name": "call_x402",
          "title": "Call any x402 endpoint",
          "description": "Call a pay-per-call x402 endpoint from the public index (find it with search_x402) — any host, not only FiatDock listings. TO BUY: call once WITHOUT `payment` to get the endpoint's 402 decoded (its price, its payTo, the EIP-712 domain) plus step-by-step instructions, sign ONE entry of accepts — the one on a network you can pay — with your own wallet, then call again with the same url/method/body plus `payment` set to the base64 x402 payload; the money goes straight from your wallet to the endpoint's payTo, FiatDock takes no fee and never touches it. No wallet? `npx fiatdock-mcp` with AGENT_PRIVATE_KEY and a maxPriceUsd ceiling signs and pays automatically. The endpoint's answer comes back as `result` with its settlement receipt when it settled. Reaches only hosts the public index lists; a FiatDock listing is called with call_service.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "body": {
                "additionalProperties": {},
                "description": "JSON body to send (default {}). Its shape is the endpoint's — read its description, or the 402's own hint",
                "type": "object"
              },
              "method": {
                "description": "HTTP method (default POST — most x402 endpoints take a JSON body)",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "payment": {
                "description": "Base64 of ONE x402 v2 PaymentPayload you signed for ONE entry of the endpoint's accepts (from the first call's 402 — pick the network you can pay). Sent to the ENDPOINT as its PAYMENT-SIGNATURE header, never read by FiatDock. Omit on the first call to receive the challenge",
                "type": "string"
              },
              "url": {
                "description": "The endpoint URL from search_x402 (https). Fill any path parameter (e.g. :email) yourself",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "allow": {
                "description": "The endpoint's Allow header on a 405, when it sent one",
                "type": "string"
              },
              "hint": {
                "description": "Present on a 405: the endpoint refused this HTTP method — call again with the other one (the index records no method)",
                "type": "string"
              },
              "method": {
                "description": "GET or POST",
                "type": "string"
              },
              "note": {
                "description": "Present only when truncated",
                "type": "string"
              },
              "ok": {
                "description": "true when the endpoint answered 2xx",
                "type": "boolean"
              },
              "paid": {
                "description": "true when a payment header travelled with the request — yours, or one this package signed",
                "type": "boolean"
              },
              "result": {
                "description": "The endpoint's response body — parsed JSON when it returned JSON, otherwise the raw text"
              },
              "settlement": {
                "description": "The endpoint's decoded PAYMENT-RESPONSE header when it settled: the x402 settlement receipt (tx hash, network, payer)"
              },
              "status": {
                "description": "The ENDPOINT's HTTP status (a 402 comes back as isError with the decoded challenge instead)",
                "type": "number"
              },
              "truncated": {
                "description": "True when the body was cut at 256 KB",
                "type": "boolean"
              },
              "url": {
                "description": "The URL that was called",
                "type": "string"
              }
            },
            "required": ["method", "ok", "paid", "status", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6a93c3b7a46681667d112b00f0bc7b92e3149166fda2773cf0a8eb9276193180"
        },
        {
          "name": "company_financials",
          "title": "Company financials from SEC XBRL ($0.0045)",
          "description": "PAID ($0.0045 USDC via x402). A US-listed company's financials as it filed them with the SEC (XBRL company facts), by ticker (AAPL, BRK-B) or CIK: for its last 1-12 fiscal years (10-K) or three-month quarters — revenue, net income, diluted EPS, total assets, total liabilities, stockholders' equity, cash, operating cash flow, shares outstanding — each with the us-gaap tag it came from, the fiscal year/period and the filing. Restatements win; a value the company did not tag is null, never computed (no derived Q4). US-GAAP filers only (not IFRS). An unknown ticker or an SEC outage answers 404/502 and is not charged. Public-domain data, not investment advice. Without payment this returns the 402 challenge; the fiatdock-mcp npm package pays automatically. Any answer the tool cannot produce is >= 400 and is NOT charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
