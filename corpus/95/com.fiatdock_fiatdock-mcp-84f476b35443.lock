          "description": "PAID ($0.001 USDC via x402). The latest Base block number plus its timestamp — a freshness/liveness probe for agents that need to know the chain head. Without payment this returns the 402 challenge; the fiatdock-mcp npm package pays automatically. On any RPC failure the call returns 4xx/5xx and is NOT charged.",
