        {
          "name": "public_holidays",
          "title": "Public holidays by country (and is this date one?) ($0.001)",
          "description": "PAID ($0.001 USDC via x402). Every holiday Nager.Date lists for a country and year (nationwide and regional, with its types), and for one date (default today, UTC): isHoliday (a nationwide Public holiday only), the other nationwide and regional holidays that day, and the next nationwide public holiday that year. Coverage depends on the source: ~200 countries, not e.g. Saudi Arabia, the UAE or India (404); regional and observance coverage varies. A country or year it does not cover is 404, an outage 502 - not charged. Without payment this returns the 402 challenge; the fiatdock-mcp npm package pays automatically. Any answer the tool cannot produce is >= 400 and is NOT charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country, ISO 3166-1 alpha-2 (US, DE, GB, BR, JP …). The covered list is https://date.nager.at/api/v3/AvailableCountries. An empty body answers for DE",
                "type": "string"
              },
              "date": {
                "description": "A date (YYYY-MM-DD) to check: is it a holiday, and which is the next one after it. Default: today (UTC) when the year is the current one",
                "type": "string"
              },
              "payment": {
                "description": "Base64 of a single x402 v2 PaymentPayload (EIP-3009 transferWithAuthorization on Base USDC). OMIT it on the first call: the 402 you get back carries `howToPay.payloadTemplate` — the exact envelope to fill in — plus the price and the EIP-712 domain. Send it on the second call to complete the purchase; it is forwarded as the PAYMENT-SIGNATURE header, never as body data. Nothing is charged for the 402 itself, and a call that fails after payment settles nothing.",
                "type": "string"
              },
              "year": {
                "description": "Year, 1976-2076 (default: the year of `date`, else the current UTC year)",
                "maximum": 2076,
                "minimum": 1976,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "asOf": {
                "description": "ISO time the source was read (answers are cached up to 12 h)",
                "type": "string"
              },
              "count": {
                "description": "Holidays listed for the year",
                "type": "number"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code",
                "type": "string"
              },
              "dateChecked": {
                "description": "The date asked about (default today, UTC); null when another year was asked without a date",
                "type": ["string", "null"]
              },
              "defaulted": {
                "additionalProperties": false,
                "description": "Present only when the body was empty: which subject the answer is for, and why",
                "properties": {
                  "field": {
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  },
                  "value": {
                    "type": "string"
                  }
                },
                "required": ["field", "note", "to", "value"],
                "type": "object"
              },
              "holidays": {
                "description": "Every holiday the source lists for the country and year, by date — nationwide and regional, all types",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "date": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    },
                    "global": {
                      "description": "True = nationwide; false = only in `regions`",
                      "type": "boolean"
                    },
                    "localName": {
                      "description": "Name in the country's language",
                      "type": "string"
                    },
                    "name": {
                      "description": "Name in English",
                      "type": "string"
                    },
                    "regions": {
                      "description": "ISO 3166-2 subdivisions it applies in (empty when nationwide)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "types": {
                      "description": "The source's classification: Public, Bank, School, Authorities, Optional, Observance",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["date", "global", "localName", "name", "regions", "types"],
                  "type": "object"
                },
                "type": "array"
              },
              "holidaysOnDate": {
                "description": "Nationwide holidays on dateChecked, of any type (a Bank-only or School-only day is here but does not set isHoliday)",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "date": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    },
                    "global": {
                      "description": "True = nationwide; false = only in `regions`",
                      "type": "boolean"
                    },
                    "localName": {
                      "description": "Name in the country's language",
                      "type": "string"
                    },
                    "name": {
                      "description": "Name in English",
                      "type": "string"
                    },
                    "regions": {
                      "description": "ISO 3166-2 subdivisions it applies in (empty when nationwide)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "types": {
                      "description": "The source's classification: Public, Bank, School, Authorities, Optional, Observance",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["date", "global", "localName", "name", "regions", "types"],
                  "type": "object"
                },
                "type": "array"
              },
              "isHoliday": {
                "description": "True only when a NATIONWIDE holiday of type Public falls on dateChecked; null when no date was checked",
                "type": ["boolean", "null"]
              },
              "nextHoliday": {
                "anyOf": [
                  {
                    "additionalProperties": true,
