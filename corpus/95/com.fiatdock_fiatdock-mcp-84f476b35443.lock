                "description": "Only these form types (e.g. 10-K,10-Q,8-K,4,DEF 14A). Omit for all"
              },
              "limit": {
                "description": "How many filings, newest first, 1-100 (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
