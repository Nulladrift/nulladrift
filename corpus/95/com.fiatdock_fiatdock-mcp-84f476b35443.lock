            "required": ["asOf", "asset", "buyAndHoldReturnPct", "endPriceUsd", "equityCurve", "exposurePct", "finalEquityUsd", "market", "maxDrawdownPct", "method", "note", "params", "period", "sharpe", "source", "startPriceUsd", "strategy", "totalReturnPct", "tradeList", "trades", "winRatePct"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
