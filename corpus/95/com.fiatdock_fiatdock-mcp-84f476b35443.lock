        {
          "name": "x402_top_services",
          "title": "x402 market leaderboard (who earns, from how many payers) ($0.009)",
          "description": "PAID ($0.009 USDC via x402). Who is actually earning on x402: every seller (host) in Coinbase's public x402 discovery index, read hourly, with its 30-day paid calls, paying wallets, calls per payer (near 1.0 = a one-off sweep, higher = repeat buyers), estimated revenue (calls × listed price, counted only for resources priced in USDC on a known chain), median price, networks and its most-called resource. Rank by revenue, calls or payers; filter by keyword (e.g. \"search\", \"token safety\") and network; minPayers (default 3) drops sellers whose only payers are their own testers. Useful to price a product, find who sells what, or pick a provider by evidence. Without payment this returns the 402 challenge; the fiatdock-mcp npm package pays automatically. Any answer the tool cannot produce is >= 400 and is NOT charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many sellers, 1-50, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minPayers": {
                "description": "Only sellers with at least this many paying wallets on one resource (default 3 — fewer is usually a single tester)",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "network": {
                "description": "Only resources on this network (\"base\", \"solana\" or a CAIP-2 id like eip155:8453)",
                "type": "string"
              },
              "payment": {
                "description": "Base64 of a single x402 v2 PaymentPayload (EIP-3009 transferWithAuthorization on Base USDC). OMIT it on the first call: the 402 you get back carries `howToPay.payloadTemplate` — the exact envelope to fill in — plus the price and the EIP-712 domain. Send it on the second call to complete the purchase; it is forwarded as the PAYMENT-SIGNATURE header, never as body data. Nothing is charged for the 402 itself, and a call that fails after payment settles nothing.",
                "type": "string"
              },
              "q": {
                "description": "Only sellers with a resource matching these words (e.g. \"search\", \"token safety\")",
                "type": "string"
              },
              "sort": {
                "description": "Rank by estimated 30-day revenue (default), 30-day calls, or paying wallets",
