        {
          "name": "strategy_backtest",
          "title": "Strategy backtest (crypto, daily closes) ($0.009)",
          "description": "PAID ($0.009 USDC via x402). Backtest a simple, stated trading rule on a crypto asset's daily USD closes from Coinbase Exchange and compare it with buying and holding over the same window. Strategies: sma_cross (long while the fast simple moving average is above the slow one), rsi_reversion (buy below rsiBuy, sell above rsiSell), dca (buy a fixed slice every dcaEveryDays), buy_and_hold. Signals formed at one close are executed at the next (no look-ahead); a fee of feeBps per trade; long or flat only. Returns total return, buy-and-hold return, max drawdown, Sharpe, exposure, win rate, the trades and an equity curve, with the full rules in method. 30-365 days. An empty body tests BTC, SMA 20/50 over 180 days. A ticker with no Coinbase USD market is 404 (not charged). A test of past prices, not a forecast or advice. Without payment this returns the 402 challenge; the fiatdock-mcp npm package pays automatically. Any answer the tool cannot produce is >= 400 and is NOT charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Crypto asset ticker with a USD market on Coinbase Exchange (BTC, ETH, SOL, …). Default BTC",
                "type": "string"
              },
              "capitalUsd": {
                "description": "Starting capital in USD, 10-10000000 (default 1000)",
                "maximum": 10000000,
                "minimum": 10,
                "type": "number"
              },
              "days": {
                "description": "Length of the tested window in days, 30-365 (default 180)",
                "maximum": 365,
                "minimum": 30,
                "type": "integer"
              },
              "dcaEveryDays": {
                "description": "dca: days between purchases, 1-30 (default 7)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "fast": {
                "description": "sma_cross: fast moving-average length in days, 2-100 (default 20)",
                "maximum": 100,
                "minimum": 2,
                "type": "integer"
              },
              "feeBps": {
                "description": "Fee on every trade in basis points, 0-100 (default 10 = 0.1%)",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "payment": {
                "description": "Base64 of a single x402 v2 PaymentPayload (EIP-3009 transferWithAuthorization on Base USDC). OMIT it on the first call: the 402 you get back carries `howToPay.payloadTemplate` — the exact envelope to fill in — plus the price and the EIP-712 domain. Send it on the second call to complete the purchase; it is forwarded as the PAYMENT-SIGNATURE header, never as body data. Nothing is charged for the 402 itself, and a call that fails after payment settles nothing.",
                "type": "string"
              },
              "rsiBuy": {
                "description": "rsi_reversion: buy when RSI falls below this, 1-50 (default 30)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "rsiPeriod": {
                "description": "rsi_reversion: RSI length in days, 2-50 (default 14)",
                "maximum": 50,
                "minimum": 2,
                "type": "integer"
              },
              "rsiSell": {
                "description": "rsi_reversion: sell when RSI rises above this, 50-99 (default 70)",
                "maximum": 99,
                "minimum": 50,
                "type": "number"
              },
              "slow": {
                "description": "sma_cross: slow moving-average length in days, 3-200, longer than fast (default 50)",
                "maximum": 200,
                "minimum": 3,
                "type": "integer"
              },
              "strategy": {
                "description": "sma_cross (long while the fast moving average is above the slow one), rsi_reversion (buy when RSI falls below rsiBuy, sell when it rises above rsiSell), dca (buy a fixed amount every dcaEveryDays), buy_and_hold. Default sma_cross",
                "enum": ["sma_cross", "rsi_reversion", "dca", "buy_and_hold"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "asOf": {
                "description": "ISO time the prices were read",
                "type": "string"
              },
              "asset": {
                "description": "The asset tested (its ticker)",
                "type": "string"
              },
              "buyAndHoldReturnPct": {
                "description": "Buying at the first close and holding, in percent (no fee) — the benchmark",
                "type": "number"
              },
              "endPriceUsd": {
                "description": "Close on the last day of the window",
                "type": "number"
              },
              "equityCurve": {
                "description": "Up to 31 evenly spaced points of the equity curve, with the asset's close",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "equityUsd": {
                      "type": "number"
                    },
                    "priceUsd": {
                      "type": "number"
                    }
                  },
                  "required": ["date", "equityUsd", "priceUsd"],
                  "type": "object"
                },
                "type": "array"
              },
              "exposurePct": {
                "description": "Share of days the rule held the asset, in percent",
                "type": "number"
              },
              "finalEquityUsd": {
                "description": "Capital at the end, cash plus the asset at the last close",
                "type": "number"
              },
              "market": {
                "description": "The Coinbase Exchange market read, e.g. BTC-USD",
                "type": "string"
              },
              "maxDrawdownPct": {
                "description": "The largest peak-to-trough fall of the rule's equity, in percent",
                "type": "number"
              },
              "method": {
                "description": "The rules, in full — enough to recompute every number",
                "type": "string"
              },
              "note": {
                "description": "What a backtest is and is not",
                "type": "string"
              },
              "params": {
                "additionalProperties": true,
                "description": "The parameters the rule used (defaults filled in)",
                "properties": {},
                "type": "object"
              },
              "period": {
                "additionalProperties": true,
                "description": "The tested window: first and last completed UTC day, and its length",
                "properties": {
                  "days": {
                    "type": "number"
                  },
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "required": ["days", "from", "to"],
                "type": "object"
              },
              "sharpe": {
                "description": "Annualised Sharpe ratio of daily equity returns (risk-free 0); null when equity never moved",
                "type": ["number", "null"]
              },
              "source": {
                "description": "Where the prices come from",
                "type": "string"
              },
              "startPriceUsd": {
                "description": "Close on the first day of the window",
                "type": "number"
              },
              "strategy": {
                "description": "The rule tested: sma_cross, rsi_reversion, dca or buy_and_hold",
                "type": "string"
              },
              "totalReturnPct": {
                "description": "The rule's return over the window, fees included, in percent",
                "type": "number"
              },
              "tradeList": {
                "description": "The last 30 trades: date, buy or sell, execution close",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "priceUsd": {
                      "type": "number"
                    },
                    "side": {
                      "type": "string"
                    }
                  },
                  "required": ["date", "priceUsd", "side"],
                  "type": "object"
                },
                "type": "array"
              },
              "trades": {
                "description": "Number of trades (buys and sells)",
                "type": "number"
              },
