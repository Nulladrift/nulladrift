              },
              "name": {
                "description": "The ENS name",
                "type": "string"
              },
              "note": {
                "description": "What the records are, and the limits",
                "type": "string"
              },
              "primaryName": {
                "description": "The address's own primary (reverse) name, verified to resolve back, or null",
                "type": ["string", "null"]
              },
              "query": {
                "additionalProperties": true,
                "description": "What was asked: a name or an address",
