              },
              "filters": {
                "additionalProperties": true,
                "description": "The cloud limit and look-back window applied",
                "properties": {
                  "days": {
                    "type": "number"
                  },
                  "maxCloudPct": {
                    "type": "number"
                  }
                },
                "required": ["days", "maxCloudPct"],
                "type": "object"
              },
              "matched": {
                "description": "Scenes the catalogue matched before the limit",
                "type": ["number", "null"]
              },
              "note": {
                "description": "How to use the image links, and their limits",
                "type": "string"
              },
              "point": {
                "additionalProperties": true,
