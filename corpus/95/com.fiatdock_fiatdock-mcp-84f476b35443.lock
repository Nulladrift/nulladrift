                "type": "object"
              },
              "count": {
                "description": "Filings returned",
                "type": "number"
              },
              "defaulted": {
                "additionalProperties": false,
                "description": "Present only when the body was empty: which subject the answer is for, and why",
                "properties": {
                  "field": {
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  },
