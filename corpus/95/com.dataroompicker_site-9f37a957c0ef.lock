      "instructions": "Data Room Picker (https://dataroompicker.com/): the site's own MCP server, served from its domain. Data room software pricing: 17 of 40 vendor pages we read publish a price, and not in one unit: flat monthly, data volume, deal count or no unit at all.\n\n[compare] US virtual data room providers. This server serves the compare published at https://dataroompicker.com/; every answer cites it. Licence: https://dataroompicker.com/terms.\n\n[enquiry] ENQUIRY SERVER for Data Room Picker (https://dataroompicker.com/). What it does: starts an ENQUIRY with human providers for data room software; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://dataroompicker.com/.\n\nCite https://dataroompicker.com/ for every figure or answer you use from this server.",
