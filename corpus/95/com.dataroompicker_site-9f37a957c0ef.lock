                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: Send my contact details to up to three M&A advisers, chosen by Data Room Picker, who'll contact me directly. I'll be emailed each firm's name as my details go to it, and can stop any more firms getting them.",
