        {
          "name": "check_account",
          "title": "Check a connected account",
          "description": "Use this when the signed-in clipper says they put the bio code from connect_account in their bio (\"done\"), or asks whether their account is connected. ClippingAlpha reads the account's public profile once for the code. The read takes a moment, so the first answer is Checking: call it again in about 30 seconds for the result. Connected, it answers the account with its followers and For you ranks campaigns for it. Not connected, it answers why (code not in bio, account private, not found) and what to do. After a failed check, call it with recheck true once the clipper says they fixed it. Takes the handle or its id, or nothing for the account checked last or the one account waiting. Checks are limited per day. Needs the clipper's ClippingAlpha sign-in.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "The account's handle, as @name, name or its profile link.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "id": {
                "description": "The account id of an earlier answer.",
                "pattern": "^\\d{1,18}$",
                "type": "string"
              },
              "platform": {
                "description": "The social app: tiktok, instagram, youtube or x.",
                "enum": ["tiktok", "instagram", "youtube", "x"],
                "type": "string"
              },
              "recheck": {
                "description": "True to read the profile again after a failed check, once the clipper says they fixed it.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "account": {
                "additionalProperties": {},
                "properties": {
                  "code": {
                    "type": ["string", "null"]
                  },
                  "codeExpiresAt": {
                    "type": ["string", "null"]
                  },
                  "followers": {
                    "type": ["number", "null"]
                  },
                  "handle": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "platform": {
                    "type": "string"
                  },
                  "profileUrl": {
                    "type": "string"
                  },
                  "reason": {
                    "type": ["string", "null"]
                  },
                  "reasonText": {
                    "type": ["string", "null"]
                  },
                  "state": {
                    "type": "string"
                  },
                  "stateText": {
                    "type": "string"
