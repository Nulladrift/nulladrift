      "instructions": "ClippingAlpha ranks live paid creator campaigns (clipping, UGC, logo, music) from Content Rewards, Promote.fun, Clipster, Clipstake, Vyro and Evangelist by Alpha Score, with pay, budget, run-out forecasts, briefs and the best moments to clip. Clipping campaigns pay for clips cut from the footage they provide, UGC campaigns for original videos about a product, music campaigns for edits that use an artist's track as the sound, and logo campaigns for the creator's own niche videos with the brand's logo on them. The Alpha Score weighs pay per 1K views after fees, approval odds, budget left and payout reliability against the live campaigns of the same type. What a post earns depends on its views and the brand approving it. top_alpha_now returns the best live campaigns now and search_campaigns the ones that match filters. For one campaign, named by brand/series or the campaignId of an earlier answer, show_campaign, get_campaign, get_brief, get_moments, get_assets and plan_clips return its panel, rules, brief, moments, file links and creative plan. For planning or cutting clips, the top clipping campaign is the first one top_alpha_now gives with cuttable: true, which lists only the clipping campaigns whose footage ClippingAlpha has read and can cut into clips. Numbers come from each clipping platform's public pages and carry the time they were read. Join links open the campaign on its clipping platform. Signed in through ClippingAlpha's OAuth, a clipper can save campaigns, set alert rules and see the files a campaign provides for clipping, cut_clips cuts vertical clips with captions from that footage for their own work on the campaign, my_clips gives their private download links for 24 hours, and my_referral shows their referral link, friends and badges, which are status and in-product perks, never cash. To connect their TikTok, Instagram, YouTube or X account in chat, connect_account gives a code for its bio and check_account reads the public profile for it, so top_alpha_now and search_campaigns rank for that account. The creator edits, publishes and submits their own work and is responsible for following the campaign's, the brand's and the platforms' rules. This server never posts or submits on anyone's behalf. Campaigns labeled 18+ are in regulated categories such as gambling, prediction markets or crypto trading. Signed in, a client with MCP Events can subscribe to campaign.new, campaign.budget_low and campaign.ended.",
