        {
          "name": "set_alert_rule",
          "title": "Set an alert rule",
          "description": "Add an alert rule for the signed-in clipper, or change one with rule_id. For example, 'tell me about YouTube campaigns on Clipster over $2 per 1K' is platforms youtube, boards clipster, min_rate_per_1k_usd 2. A rule matches new campaigns by minimum pay per 1K views (in $0.50 steps), social apps, niches, clipping platforms, pay type, lowest Alpha tier and open join. mode personalised instead turns on (or with active false, off) the one Personalised alert: new campaigns at the top of the clipper's For you list, fitting their connected account, with cadence instant or daily. Alerts arrive on the clipper's channels within their daily cap and quiet hours. Needs the clipper's ClippingAlpha sign-in. Changes only their own rules.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "active": {
                "description": "false pauses the rule.",
                "type": "boolean"
              },
              "boards": {
                "description": "Clipping platforms. Empty for every clipping platform.",
                "items": {
                  "enum": ["content-rewards", "promote-fun", "clipster", "clipstake", "vyro", "evangelist"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "cadence": {
                "description": "Personalised only: instant as campaigns launch (the default), or daily for one digest at 09:00 in the clipper's time zone.",
                "enum": ["instant", "daily"],
                "type": "string"
              },
              "min_rate_per_1k_usd": {
                "description": "Minimum pay per 1,000 views in USD, rounded down to $0.50 steps. 0 for any.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "min_tier": {
                "description": "Lowest Alpha tier to alert on.",
                "enum": ["alpha", "solid", "fair"],
                "type": "string"
              },
              "mode": {
                "description": "custom (the default) sets a rule by the filters above. personalised sets the one Personalised alert, which fits the clipper's connected account, and ignores the filters.",
                "enum": ["custom", "personalised"],
                "type": "string"
              },
              "niches": {
                "description": "Content niches. Empty for every niche.",
                "items": {
                  "enum": ["podcast", "streams", "gaming", "sports", "film-and-tv", "music", "brand-ads", "ugc-and-apps", "behind-the-scenes", "gambling", "prediction-markets", "crypto-trading"],
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
