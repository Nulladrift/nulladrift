        {
          "name": "top_alpha_now",
          "title": "Top campaigns now",
          "description": "Use this when the user asks for the best live paid creator campaigns now, optionally for one social app or one campaign type (clipping, UGC, logo or music). Returns a market line (live campaigns, clipping platforms, new today, budget left and the median pay per 1K views), then the top live campaigns by Alpha Score, which weighs pay per 1K views after fees and payout rules, approval odds and the budget runway against live campaigns of the same type. Campaign types: clipping cuts clips from the footage the campaign provides, ugc films your own content about the product, logo puts the brand's logo on your own niche content, music uses the artist's track as the sound. Campaigns come from Content Rewards, Promote.fun, Clipster, Clipstake, Vyro and Evangelist, each with pay, budget left, a page link, a join link and whether ClippingAlpha can cut clips from its footage (Can cut clips or not). With cuttable, only the campaigns ClippingAlpha can cut into clips now are listed, the first one the top campaign for planning or cutting clips. What a post earns depends on its views and the brand approving it. Read only.",
