            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app": {
                "description": "Set only by the ClippingAlpha app in the chat, to count its steps. Leave it out.",
                "enum": ["make_clips", "plan_video", "cut", "poll", "download", "submit"],
                "type": "string"
              },
              "campaign": {
                "description": "The campaign as brand/series, its page URL or its campaignId.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "clips": {
                "description": "The clip numbers of the campaign's creative plan, for example [1, 2, 3].",
                "items": {
                  "maximum": 200,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array"
              },
              "edit": {
                "description": "Or one mix of your own: 2 to 4 segments of the campaign's videos, cut into one vertical edit.",
                "properties": {
                  "segments": {
                    "description": "2 to 4 segments in the order they play, the hook first, 20 to 45 seconds in all.",
                    "items": {
                      "properties": {
                        "end_sec": {
                          "description": "Where it ends, at least 3 seconds later.",
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "number"
                        },
                        "source_id": {
                          "description": "The sourceId of one of the campaign's videos or brand files.",
                          "pattern": "^\\d{1,18}$",
