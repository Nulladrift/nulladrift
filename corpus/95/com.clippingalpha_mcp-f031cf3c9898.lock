        "name": "clippingalpha",
        "title": "ClippingAlpha",
        "version": "1.0.0",
        "description": "ClippingAlpha ranks live paid creator campaigns (clipping, UGC, logo, music) from Content Rewards, Promote.fun, Clipster, Clipstake, Vyro and Evangelist by Alpha Score, with pay, budget, run-out forecasts, briefs and the best moments to clip.",
