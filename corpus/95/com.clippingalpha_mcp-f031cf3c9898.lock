        {
          "name": "search_campaigns",
          "title": "Search campaigns",
          "description": "Use this when the user wants paid creator campaigns (clipping, UGC, logo or music) that match filters: type, social app, minimum pay per 1K views, niche, clipping platform, Alpha tier, open join, new in the last hours or words in the name. Campaign types: clipping cuts clips from the footage the campaign provides, ugc films your own content about the product, logo puts the brand's logo on your own niche content, music uses the artist's track as the sound. Returns live campaigns from Content Rewards, Promote.fun, Clipster, Clipstake, Vyro and Evangelist, ranked by Alpha Score by default, with pay, budget left, the budget run-out forecast, a page link and a join link for each, and whether ClippingAlpha can cut clips from its footage. With cuttable, only the campaigns ClippingAlpha can cut into clips now are listed, the first one the top campaign for planning or cutting clips. What a post earns depends on its views and the brand approving it. Read only.",
          "inputSchema": {
