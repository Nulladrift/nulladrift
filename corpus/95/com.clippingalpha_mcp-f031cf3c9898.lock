          "description": "Use this when the user asks what to make for a campaign, how to start, or what a clip needs: ClippingAlpha's creative plan for one campaign. What to make (how many clips the material supports, the length, vertical or not, the social apps and how that fits TikTok, Reels and Shorts), what to cut it from (ready clips to post as is, or no footage, make your own content), the clips best first grouped by source video (its title, app, length and a summary in our words, then per clip the cut range, what happens there, why it should work from the moment score, a spoken opener and the 9:16 fit, numbered steps to follow and a Watch link to the original public video at that second, a brand file by its number with no link), the brand's short ready clips one card each with every analysed clip counted (post as is or reframe to 9:16, why it works or not, the steps), what to post instead for a logo or music campaign (the niche, where the logo goes, the sound, lyrics on screen, the effort), what every post must include and avoid (tags, mentions, #ad, logo or end card, call to action, banned content) with the brief's own words for each rule, and how to get the footage in the brief's words. Each clip carries its hook idea, labelled as a suggestion, and the hook ideas no clip carries follow. Signed out, the best 3 clips a source. Signed in, a handful of clips a source, the footage the clipping platform gives the clippers who join included, and the footage password when the brand published one for clippers. Each clip also carries the ffmpeg command that cuts it, 9:16 at 1080 by 1920, from a file the clipper downloaded themselves. Signed in, a separate ClippingAlpha tool cuts these clips by number into vertical MP4s with captions and download links. For planning or cutting clips, the top clipping campaign is the first of the top campaigns listed with cuttable true, the ones ClippingAlpha can cut. On a campaign it cannot cut, the plan says so and names the top one it can cut. Never a transcript line. Read only, this tool cuts nothing.",
