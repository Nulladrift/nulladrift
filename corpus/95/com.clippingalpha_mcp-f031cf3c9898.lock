        {
          "name": "cut_clips",
          "title": "Cut clips",
          "description": "Use this when the signed-in clipper asks to cut, make or download clips, for example \"cut clips 1 to 3\" after the creative plan numbered them. ClippingAlpha's server cuts each clip from the campaign's source video into a vertical 1080 by 1920 MP4 with captions burned in, the brief's #ad on screen when it asks for one, and loudness levelled. For planning or cutting clips, the top clipping campaign is the first of the top campaigns listed with cuttable true, the ones ClippingAlpha can cut. Takes the clip numbers of the campaign's creative plan, brand clips and mixes included, or a source_id with a start and end in seconds. A mix is one 20 to 45 second edit from 2 to 4 segments across the campaign's videos, the hook first, each segment trimmed on sentence edges and joined with short crossfades, one caption style and the loudness levelled over the whole edit. A mix comes by its number in the creative plan, or as an edit of 2 to 4 segments, and counts as one clip. It cuts the footage the campaign gives its clippers, as the signed-in answers list it: the YouTube, Twitch, Kick, TikTok, Instagram and X videos it links and its brand files (Google Drive, Dropbox, Frame.io, WeTransfer, OneDrive, Egnyte, the Evangelist media library), the footage its clipping platform gives the clippers who join included. Never an upload or a video ClippingAlpha has not read: a campaign it cannot cut is refused with the top campaign it can cut instead. Up to 5 clips a call and 10 a day, within a daily clip limit per clipper and a daily total for all clipping. A refused call says when the limit resets and uses none of it. Answers at once with the clip ids. The download links follow when the clips are ready, usually within a minute or two. Each link works for 24 hours. Needs the clipper's ClippingAlpha sign-in. Nothing is posted anywhere. The clipper asks for the cut for their own work on the campaign and is responsible for using it within the campaign's, the brand's and the platforms' rules (clippingalpha.com/terms#terms-clips).",
