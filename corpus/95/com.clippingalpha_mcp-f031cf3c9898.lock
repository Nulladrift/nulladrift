                        },
                        "start_sec": {
                          "description": "Where this segment starts, in seconds of that video.",
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["end_sec", "source_id", "start_sec"],
                      "type": "object"
                    },
                    "maxItems": 4,
                    "minItems": 2,
                    "type": "array"
                  }
                },
                "required": ["segments"],
                "type": "object"
              },
              "ranges": {
                "description": "Or exact ranges of the campaign's videos or brand files.",
                "items": {
                  "properties": {
                    "end_sec": {
                      "description": "Where it ends, 3 seconds to 3 minutes after the start.",
                      "maximum": 100000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "source_id": {
                      "description": "The sourceId of one of the campaign's videos or brand files, as an earlier signed-in answer gave it.",
                      "pattern": "^\\d{1,18}$",
