                "maxLength": 80,
                "type": "string"
              },
              "board": {
                "description": "Only campaigns listed on this clipping platform.",
                "enum": ["content-rewards", "promote-fun", "clipster", "clipstake", "vyro", "evangelist"],
                "type": "string"
              },
              "cuttable": {
                "description": "True to plan or cut clips: then only clipping campaigns whose footage ClippingAlpha has read and can cut into clips are listed, each with its moments. Leave it out to find or compare campaigns.",
                "type": "boolean"
              },
              "for_clips": {
                "description": "The same as cuttable, kept for earlier calls.",
                "type": "boolean"
              },
              "for_you": {
                "description": "Rank for the signed-in user's connected social account: fit, an estimate at their recent views and Alpha Score. Default true when signed in. False for the usual order.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many to return, default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_rate_per_1k_usd": {
                "description": "Minimum pay per 1,000 views in USD (CPM campaigns only).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "min_tier": {
                "description": "Lowest Alpha tier to include. alpha is the top 10 percent of the market.",
                "enum": ["alpha", "solid", "fair"],
                "type": "string"
              },
              "new_within_hours": {
                "description": "Only campaigns new in this many hours: discovered by ClippingAlpha, on Content Rewards launched there. 24 is New today. A new round of an older campaign is new.",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "description": "One content niche.",
                "enum": ["podcast", "streams", "gaming", "sports", "film-and-tv", "music", "brand-ads", "ugc-and-apps", "behind-the-scenes", "gambling", "prediction-markets", "crypto-trading"],
                "type": "string"
              },
              "open_join_only": {
                "description": "Only campaigns anyone can join now, with no application.",
                "type": "boolean"
              },
              "platforms": {
                "description": "Only campaigns that pay for at least one of these social apps.",
                "items": {
                  "enum": ["tiktok", "instagram", "youtube", "x", "facebook", "twitch", "kick", "threads", "snapchat"],
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              },
              "query": {
                "description": "Only a brand, campaign or creator name to look up, for example lovable or MrBeast. Leave it out for what the user does or wants (fashion videos, join without applying, high pay): use type, niche, platforms, min_rate_per_1k_usd and open_join_only for those. If no name matches, the other filters still answer.",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "description": "Order. Default alpha, the Alpha Score.",
                "enum": ["alpha", "newest", "rate", "budget_left"],
                "type": "string"
              },
              "type": {
                "description": "One campaign type: clipping cuts clips from the footage the campaign provides, ugc films your own content about the product, logo puts the brand's logo on your own niche content, music uses the artist's track as the sound.",
                "enum": ["clipping", "ugc", "logo", "music"],
                "type": "string"
