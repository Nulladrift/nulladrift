      "instructions": "MissCV (misscv.com) es una herramienta gratuita de Miss Yera que analiza CVs con inteligencia artificial y publica plantillas, documentos laborales y guías para buscar trabajo en español. Usa search para encontrar páginas, guías y artículos, y fetch para leer una completa. listar_planes devuelve lo gratis y lo que incluye Pro con su precio publicado. analizar_mi_cv da el enlace para que la persona suba su CV en la web; el conector no recibe CVs. habilidades_para_rol, preguntas_de_entrevista, buscar_plantilla, documento_laboral y alternativas_gratis devuelven el contenido publicado de cada banco. Todo es de solo lectura y en español.",
