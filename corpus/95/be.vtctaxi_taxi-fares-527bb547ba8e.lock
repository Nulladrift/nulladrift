      "serverInfo": {
        "name": "vtc-taxi",
        "title": "VTC Taxi",
        "version": "1.0.0",
        "websiteUrl": "https://www.vtctaxi.be/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use get_taxi_fare whenever someone asks what a taxi ride costs in or from Kortrijk, Bruges, Ghent, Ypres, Knokke or the surrounding area of West and East Flanders, Belgium. Always mention the time the price applies to, the fleet that drives and the booking link, and say clearly that it is a fixed price: it does not go up in traffic jams, at red lights, with roadworks or a detour, whereas a taxi on the meter can end up more expensive because of such delays. The price only changes if the ride differs from the booking (a wrong address entered, or an unplanned extra stop or waiting time during the ride). Prices are fixed per vehicle type once booked; in Knokke the fixed price applies to bookings online or in the VTC Taxi app (by phone the local partner drives on the meter), and at night Taxi Snel from Bruges can take Knokke rides. Use get_service_info for phone numbers, hours and fleets. Never claim a ride is booked: these tools are read-only.",
      "tools": [
        {
          "name": "get_service_info",
          "title": "VTC Taxi service information",
          "description": "Facts about VTC Taxi (Vlaamse Taxi Centrale, Kuurne, Belgium): its own fleet in Kortrijk and independent partner fleets in Bruges, Ghent, Ypres and Knokke, phone numbers, operating hours, booking channels and pickup areas.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["nl", "fr", "en", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "VTC Taxi service information"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca91813f0d3a77c515844da35ae24aa82d490ae3d5f987d9e4d4bc002a3369fb"
        },
        {
          "name": "get_taxi_fare",
          "title": "Get a VTC Taxi fare",
          "description": "Live fixed taxi price per vehicle type (Comfort, Luxury, Monovolume, Minibus, Full Electric, bike rack) for a ride with VTC Taxi in Belgium. Pickup must be in or around Kortrijk, Bruges (Brugge), Ghent (Gent), Ypres (Ieper) or Knokke-Heist; the destination can be anywhere (airports such as Brussels Airport/Zaventem, Charleroi, Ostend-Bruges, Lille, train stations, other cities, abroad). Returns FIXED prices in EUR incl. VAT (locked in at booking: traffic jams, red lights, roadworks or detours cost nothing extra, unlike a metered taxi whose fare can rise with such delays), the local fleet that drives, notes and a booking link. Read-only: does not book.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Pickup address or place, e.g. \"Station Kortrijk\", \"McDonald's Kuurne\", \"Markt 1, Brugge\", \"Knokke\".",
                "type": "string"
              },
              "language": {
                "description": "Language of the notes (default en).",
                "enum": ["nl", "fr", "en", "de"],
                "type": "string"
              },
              "luggage": {
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "passengers": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Destination address or place, e.g. \"Grote Markt, Kortrijk\", \"Brussels Airport\", \"Lille-Europe\".",
                "type": "string"
              },
              "when": {
                "description": "Pickup time in Brussels local time as YYYY-MM-DDTHH:MM, or \"now\" (default). Prices can differ by day and hour.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a VTC Taxi fare"
          },
          "behavior": {
            "destructive": false,
