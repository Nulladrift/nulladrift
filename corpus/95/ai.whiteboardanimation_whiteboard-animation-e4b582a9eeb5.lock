          },
          "meta": {
            "openai/profile": true,
            "securitySchemes": [
              {
                "scopes": ["mcp:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:653b6adff63858fadfbd8459ca398fc80cbe03c3d51cf98e213c8f6357783576"
        },
        {
          "name": "wait_drawing",
          "title": "Wait for a drawing",
          "description": "For the drawing card: answers get_drawing as soon as the drawing moves on from the status and progress the card last showed, or after about 50 seconds.",
          "inputSchema": {
            "properties": {
              "drawing_id": {
                "type": "string"
              },
              "progress": {},
              "status": {
                "type": "string"
              }
            },
            "required": ["drawing_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:32eed1a1a9ec89342092b1e1dd2aa1aad9418df24df0494b9b3a9978c6b5d508"
        },
        {
          "name": "wait_render",
          "title": "Wait for rendered files",
          "description": "A render link’s files: each drawing’s state (pending, rendering, saved, failed) and, once saved, its file name and size in the browser’s downloads. Pass back the states of the last answer: it answers as soon as any of them moves on, or after about 50 seconds.",
          "inputSchema": {
            "properties": {
              "render_id": {
                "type": "string"
              },
              "states": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["render_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:e79e8274585fa7d4ceef813c42c1401905dd9efb3569ef77a2432cc8fdde18b3"
        }
