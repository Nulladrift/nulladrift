{
  "lockfileVersion": 2,
  "subjects": {
    "ai.whiteboardanimation/whiteboard-animation": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.whiteboardanimation.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "whiteboard-animation",
        "version": "0.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "create_drawing",
          "title": "Draw a picture",
          "description": "Draw a picture as a whiteboard animation. Spends credits (see quote). Answers at once with the drawing_id; the drawing takes a few minutes, follow it with get_drawing.",
          "inputSchema": {
            "properties": {
              "image": {
                "properties": {
                  "download_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  }
                },
                "required": ["download_url"],
                "type": "object"
              },
              "max_credits": {
                "minimum": 0,
                "type": "number"
              },
              "quote_version": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "settings": {
                "properties": {
                  "brush": {
                    "properties": {
                      "seed": {
                        "type": "integer"
                      },
                      "size": {
                        "maximum": 8,
                        "minimum": 0.1,
                        "type": "number"
                      },
                      "swing": {
                        "maximum": 8,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["seed", "size", "swing"],
                    "type": "object"
                  },
                  "color_duration": {
                    "maximum": 600,
                    "minimum": 1,
                    "type": "number"
                  },
                  "color_order": {
                    "enum": ["subject", "natural", "regions"],
                    "type": "string"
                  },
                  "hold": {
                    "anyOf": [
                      {
                        "const": 0
                      },
                      {
                        "const": 0.08
                      },
                      {
                        "const": 0.16
                      },
                      {
                        "const": 0.32
                      }
                    ]
                  },
                  "line_duration": {
                    "maximum": 600,
                    "minimum": 1,
                    "type": "number"
                  },
                  "strategy": {
                    "enum": ["baseline", "regions", "attention", "cohesion"],
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              },
              "title": {
                "maxLength": 120,
                "type": "string"
              },
              "upload_id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["image"],
            "securitySchemes": [
              {
                "scopes": ["mcp:write"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://whiteboard-animation/drawing-card-v1.html"
            }
          },
          "digest": "sha256:200375b8467e1960cd326a1a8b69ae380e7264e72bbcd44f2b6eafff1e613537"
        },
        {
          "name": "create_upload",
          "title": "Upload a picture",
          "description": "Start uploading a picture: answers an upload_url to PUT the bytes to, with the given headers. Then call create_drawing with the upload_id. Not needed when the host attaches the picture to create_drawing itself.",
          "inputSchema": {
            "properties": {
              "content_type": {
                "enum": ["image/png", "image/jpeg", "image/webp"],
                "type": "string"
              },
              "file_name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "size": {
                "maximum": 10485760,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["content_type", "file_name", "size"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:9d465a2271166be0e1caaf86f2a4f0f6e50f73ea3f01faae811d8ca61049aa10"
        },
        {
          "name": "get_drawing",
          "title": "Get a drawing",
          "description": "A drawing by id: its status and progress, its preview page, and once done the export options render_link accepts for it.",
          "inputSchema": {
            "properties": {
              "drawing_id": {
                "type": "string"
              }
            },
            "required": ["drawing_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://whiteboard-animation/drawing-card-v1.html"
            }
          },
          "digest": "sha256:4239aad91ca6afea9a947c49eab3bb24ffc34d68cd2b6e4d5f71c56936bc3b14"
        },
        {
          "name": "list_drawings",
          "title": "List drawings",
          "description": "The latest drawings in the library, newest first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0649d0afe4a7b6ea0572f93eee571627d0e53585cabf5ee286e7d6f471a8f4d8"
        },
        {
          "name": "quote",
          "title": "Quote a drawing",
          "description": "What drawing one picture costs, in credits, and the quote_version to pass when creating it.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:b76f9545a6b5849d31d12f293e0d6cd6f66a29cc9c6cb81f101c745bb6fa2b84"
        },
        {
          "name": "render_link",
          "title": "Render link",
          "description": "One link that renders up to 20 of your drawings as files, each with its own choices (format, resolution, aspect, background, hand…; see get_drawing export_options). Opening it in a browser renders them one after another and saves each file to that browser’s downloads; drawings still being drawn are rendered once they finish. Follow it with wait_render.",
          "inputSchema": {
            "properties": {
              "drawings": {
                "items": {
                  "properties": {
                    "aspect": {
                      "enum": ["original", "16:9", "9:16", "1:1"],
                      "type": "string"
                    },
                    "background": {
                      "enum": ["paper", "colour", "transparent", "layers"],
                      "type": "string"
                    },
                    "colour": {
                      "pattern": "^#[0-9a-f]{6}$",
                      "type": "string"
                    },
                    "drawing_id": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "format": {
                      "enum": ["mp4", "webm", "png"],
                      "type": "string"
                    },
                    "hand": {
                      "pattern": "^[\\w-]{1,40}$",
                      "type": "string"
                    },
                    "hand_direction": {
                      "enum": ["auto", "right", "bottom"],
                      "type": "string"
                    },
                    "hand_size": {
                      "maximum": 1.5,
                      "minimum": 0.65,
                      "type": "number"
                    },
                    "hand_tilt": {
                      "maximum": 15,
                      "minimum": -15,
                      "type": "integer"
                    },
                    "resolution": {
                      "enum": ["original", "720p", "1080p"],
                      "type": "string"
                    },
                    "skip": {
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "timing": {
                      "enum": ["keep", "trim"],
                      "type": "string"
                    },
                    "trace": {
                      "type": "boolean"
                    }
                  },
                  "required": ["drawing_id"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["drawings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a549a5ca73512ac731160dc81e52bb2ab89212118689c791dfc61be50d09bb82"
        },
        {
          "name": "status",
          "title": "Account status",
          "description": "Call first. The signed-in workspace: its plan, credits left, drawings queued and running, and how many may queue.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
