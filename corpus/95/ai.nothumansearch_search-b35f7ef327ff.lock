{
  "lockfileVersion": 2,
  "subjects": {
    "ai.nothumansearch/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nothumansearch.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "nothumansearch",
        "title": "Not Human Search",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search engine for AI agents. Use search_agents to find agent-ready tools, APIs, and services ranked by agentic readiness score (0-100). Use get_site_details with the returned search_id to inspect one result and record selection only. If and only if the principal explicitly currently wants one supported next step with that selected domain, use the returned action_interest.call_contract to call record_action_interest; never infer interest from search, rank, selection, or provider availability. Recording interest contacts no provider and creates no ticket, charge, rank change, or commercial proof.",
      "tools": [
        {
          "name": "check_url",
          "title": "Check Any URL's Agentic Readiness",
          "description": "On-demand agentic-readiness check for any URL. Runs the NHS 7-signal crawler live (llms.txt, ai-plugin.json, OpenAPI, structured API, MCP server, robots.txt AI rules, Schema.org) and returns a score 0-100 with per-signal breakdown. Use before calling an unfamiliar API to confirm it's agent-usable. Re-runnable without the submissions-table side-effect of submit_site — ideal for verify-before-use workflows.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Full URL or bare domain (e.g. 'stripe.com' or 'https://stripe.com'). Homepage works best — NHS probes the /.well-known/ paths, /robots.txt, /llms.txt relative to the site root.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a991648adb720247aa883eec97536e85eb5788809523befd23a155c47dcceae5"
        },
        {
          "name": "find_mcp_servers",
          "title": "Find MCP Servers",
          "description": "List sites in the index that expose a live MCP server, ranked by agentic readiness. The result set carries a query-free discovery receipt and any eligible provider-funded actions appear separately without changing organic order. Pairs naturally with verify_mcp for a probe-before-use workflow.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by public category (ai-tools, developer, data, finance, ecommerce, jobs, security, health, education, communication, productivity, news). Audit-only buckets may appear in /api/v1/categories as other or spam, but are not promoted as discovery inventory. Omit for all categories.",
                "enum": ["ai-tools", "developer", "data", "finance", "ecommerce", "jobs", "security", "health", "education", "communication", "productivity", "news"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional keyword to narrow results (e.g. 'payments', 'jobs', 'weather')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff8cccf0ee99e172add07a16879f06bcbfad19724629fbbed41601fc6b356e3a"
        },
        {
          "name": "get_site_details",
          "title": "Get Site Agentic Readiness Report",
          "description": "Get the full agentic readiness report for a specific domain: score, category, all 7 signal checks (llms.txt, ai-plugin.json, OpenAPI, structured API, MCP server, robots.txt AI rules, Schema.org), plus any cached llms.txt content and OpenAPI summary. When an exact search_id newly records this organic-result selection, the response also carries an optional record_action_interest opportunity for this domain. Selection alone is never interest and never contacts the provider.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain to look up (e.g. 'stripe.com'). Do not include scheme or path.",
                "type": "string"
              },
              "search_id": {
                "description": "Optional receipt returned by a receipt-bearing NHS discovery tool. If this domain was returned, NHS records a detail selection and may return a separate, noncommercial action-interest opportunity requiring explicit current-principal attestation.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2dfa00ebcfae4c8c7a7e0b7c6b0e310572004aaae574a232072ec0a0749b0a2"
        },
        {
          "name": "get_stats",
          "title": "Get Index Stats",
          "description": "Current Not Human Search index stats: total sites, average agentic score, top category, sites added in the last 7 days, count of sites exposing an MCP server, and count scoring a perfect 100/100.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81f74ba6cddc45c012c0430601e39225b05e703e316021134bb759b448073016"
        },
        {
          "name": "get_top_sites",
          "title": "Get Top Scored Sites",
          "description": "Get the highest-scored agent-ready sites in the index, optionally filtered by category. Organic order is always readiness-score order. A supported category creates a query-free discovery receipt that can support separately disclosed provider-funded actions and explicit action interest; unfiltered browsing stays free and does not enter the Stage 1 demand cohort.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by public category (ai-tools, developer, data, finance, ecommerce, jobs, security, health, education, communication, productivity, news). Audit-only buckets may appear in /api/v1/categories as other or spam, but are not promoted as discovery inventory. Omit for all categories.",
                "enum": ["ai-tools", "developer", "data", "finance", "ecommerce", "jobs", "security", "health", "education", "communication", "productivity", "news"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bac76074c707d62248edaf89556499e14627e06c801f9485040c2e688c71ed2c"
        },
        {
          "name": "handoff_provider_action",
          "title": "Continue Through an NHS-Observed Provider Handoff",
          "description": "Present the exact ticket bearer returned by prepare_provider_action. NHS records one privacy-safe handoff receipt, then returns the attributed provider action URL. Optionally and separately, the principal may authorize the exact DNS-verified provider to resolve only the ticket's controlled topic, region, USD budget band, urgency, and allowlisted requirement flags. Declining that optional disclosure does not block the handoff. No query, contact detail, agent/principal identity, network address, referrer, or user-agent is disclosed. The handoff and resolver charge neither party; only the provider's configured downstream outcome can create a provider charge.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attribution_token": {
                "description": "Exact bearer returned by prepare_provider_action; NHS does not store the raw token.",
                "type": "string"
              },
              "controlled_intent_disclosure_consent_version": {
                "description": "https://nothumansearch.ai/privacy#controlled-intent-disclosure-consent-v1; required only when the optional disclosure consent is true.",
                "enum": ["nhs-provider-controlled-intent-disclosure-consent-v1"],
                "type": "string"
              },
              "handoff_consent_version": {
                "description": "https://nothumansearch.ai/privacy#handoff-consent-v1",
                "enum": ["nhs-provider-handoff-consent-v1"],
                "type": "string"
              },
              "principal_controlled_intent_disclosure_consent": {
                "description": "Optional separate authorization for the exact DNS-verified provider to resolve the bounded controlled-intent bundle after handoff. False or omitted does not block handoff.",
                "type": "boolean"
              },
              "principal_handoff_consent": {
                "const": true,
                "description": "Caller attests the principal authorized the separate observed handoff under the exact published wording.",
                "type": "boolean"
              },
              "ticket_id": {
                "description": "Action ticket ID returned by prepare_provider_action.",
                "type": "string"
              }
            },
            "required": ["attribution_token", "handoff_consent_version", "principal_handoff_consent", "ticket_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7cef027dbdcc01abfbb7cbd6c8afa714cce8778f4312097d573e4bab3531edc1"
        },
        {
          "name": "list_categories",
          "title": "List Index Categories",
          "description": "List all categories in the Not Human Search index with site counts and average agentic scores. Use this to understand what kinds of agent-ready services exist before searching — counts are live, so the distribution shifts as the index grows.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:565f163dca2949d3e6c15e48fb272caff5d0189110b6fb546e311f93033b128f"
        },
        {
          "name": "prepare_provider_action",
          "title": "Prepare an Authorization-Attested Provider Action Ticket",
          "description": "Prepare a signed action ticket for a separately disclosed provider-funded offer returned beside a receipt-bearing NHS discovery result. This step never returns the provider action URL or records a handoff. It requires the discovery receipt and the caller's explicit ticket-authorization attestation. It accepts controlled constraints only—no name, email, contact detail, raw prompt, agent identity, or principal identity fields. Discovery and direct provider access remain free; preparing a ticket charges neither party. Exact v1 wording: https://nothumansearch.ai/privacy#consent-v1",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_band": {
                "enum": ["unspecified", "under_100", "100_499", "500_1999", "2000_plus"],
                "type": "string"
              },
              "consent_version": {
                "description": "https://nothumansearch.ai/privacy#consent-v1",
                "enum": ["nhs-principal-consent-v1"],
                "type": "string"
              },
              "demand_topic": {
                "description": "One controlled topic already present on the referenced search receipt.",
                "enum": ["payments", "commerce", "jobs", "data", "search", "weather", "maps", "email", "messaging", "image", "video", "audio", "documents", "security", "finance", "health", "education", "news", "analytics", "automation", "productivity", "identity", "storage", "ai-tools", "developer-tools", "other"],
                "type": "string"
              },
              "offer_id": {
                "description": "Provider-funded offer ID returned separately beside a receipt-bearing NHS discovery result.",
                "type": "string"
              },
              "principal_consent": {
                "const": true,
                "description": "Caller attests that the human/company principal authorized this ticket preparation under the published versioned wording.",
                "type": "boolean"
              },
              "region_code": {
                "description": "Optional uppercase ISO country or country-region code.",
                "type": "string"
              },
              "requirement_flags": {
                "items": {
                  "enum": ["api_access", "mcp", "sandbox", "self_serve", "enterprise", "compliance", "multilingual", "human_support"],
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array",
                "uniqueItems": true
              },
              "search_id": {
                "description": "Discovery receipt proving the provider appeared organically.",
                "type": "string"
              },
              "urgency": {
                "enum": ["unspecified", "now", "7_days", "30_days", "researching"],
                "type": "string"
              }
            },
            "required": ["consent_version", "demand_topic", "offer_id", "principal_consent", "search_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:30ca42d41aea38ec036d7347002f7aa8776dd9525a0bdcec76158b568ef250ad"
        },
        {
          "name": "recent_additions",
          "title": "Recently Indexed Agent-First Sites",
          "description": "List agent-ready sites newly added to the Not Human Search index, sorted newest first. A supported category creates a query-free discovery receipt that can support separately disclosed provider-funded actions and explicit action interest; unfiltered catalog watching stays free and does not enter the Stage 1 demand cohort.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by public category (ai-tools, developer, data, finance, ecommerce, jobs, security, health, education, communication, productivity, news). Audit-only buckets may appear in /api/v1/categories as other or spam, but are not promoted as discovery inventory. Omit for all categories.",
                "enum": ["ai-tools", "developer", "data", "finance", "ecommerce", "jobs", "security", "health", "education", "communication", "productivity", "news"],
                "type": "string"
              },
              "days": {
                "description": "Look back window in days (default 7, max 90)",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Max results (default 10, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b829aa2a46f6423f431638312224f0647632f2755bf6ff0f67d44aff709b4020"
        },
        {
          "name": "record_action_interest",
          "title": "Record Caller-Attested Action Interest",
          "description": "Record the caller's attestation that its human or company principal currently wants one controlled next step with a site returned organically by a receipt-bearing NHS discovery tool. This creates a private Stage 1 demand receipt that expires with the source discovery receipt, no later than 30 days after it. It does not contact the provider, create an action ticket or charge, change rank or score, or count as commercial proof. No query, contact data, free-form text, or agent/principal identity is accepted. Exact v1 wording: https://nothumansearch.ai/privacy#action-interest-v1",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_type": {
                "description": "The one next step the principal currently wants.",
                "enum": ["quote", "trial", "demo", "booking", "application", "signup", "purchase"],
                "type": "string"
              },
              "caller_attests_principal_interest": {
                "const": true,
                "description": "Caller attests current principal interest under the exact published v1 wording; this is not authority to contact the provider.",
                "type": "boolean"
              },
              "confirmation_version": {
                "description": "https://nothumansearch.ai/privacy#action-interest-v1",
                "enum": ["nhs-action-interest-v1"],
                "type": "string"
              },
              "domain": {
                "description": "Bare domain that appeared in the referenced organic results; no scheme or path.",
                "type": "string"
              },
              "search_id": {
                "description": "Committed privacy-safe receipt returned by a receipt-bearing NHS discovery tool.",
                "type": "string"
              }
            },
            "required": ["action_type", "caller_attests_principal_interest", "confirmation_version", "domain", "search_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06dae2c52471784fc0e6129a3ae01457c158d8bc2370ceb9d0c3b0997ccb4cef"
        },
        {
          "name": "register_monitor",
          "title": "Monitor a Site's Agentic Readiness",
          "description": "Register an email to get alerted when the indicated domain's agentic readiness score drops. Useful for agents tracking a dependency's agent-readiness health — e.g. an agent that relies on stripe.com's MCP surface wants to know the moment it regresses. Returns an unsubscribe URL. Multiple monitors per email allowed, one per domain.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain to monitor (no scheme, e.g. 'stripe.com')",
                "type": "string"
              },
              "email": {
                "description": "Email address to receive alert",
                "type": "string"
              }
            },
            "required": ["domain", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98c4aae0668e88ac02696db92616e59ca660b9a464b59d0829bc094aeee7ae88"
        },
        {
          "name": "search_agents",
          "title": "Search the Agentic Web",
          "description": "Search for websites, APIs, and services that AI agents can actually use. Results are ranked by agentic readiness score (0-100) based on llms.txt, OpenAPI specs, ai-plugin.json, structured APIs, and MCP server availability. Use this to discover payment APIs, job boards, data sources, or any web service your agent needs to call.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by public category (ai-tools, developer, data, finance, ecommerce, jobs, security, health, education, communication, productivity, news). Audit-only buckets may appear in /api/v1/categories as other or spam, but are not promoted as discovery inventory.",
                "enum": ["ai-tools", "developer", "data", "finance", "ecommerce", "jobs", "security", "health", "education", "communication", "productivity", "news"],
                "type": "string"
              },
              "has_api": {
                "description": "Only return sites with a documented structured API",
                "type": "boolean"
              },
              "has_llms_txt": {
                "description": "Only return sites that publish an llms.txt file (LLM-first site summary)",
                "type": "boolean"
              },
              "has_mcp": {
                "description": "Only return sites that expose an MCP server",
                "type": "boolean"
              },
              "has_openapi": {
                "description": "Only return sites with a published OpenAPI / Swagger spec",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 10, max 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_score": {
                "description": "Minimum agentic readiness score 0-100 (higher = more agent-ready)",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Keyword query (e.g. 'payment API', 'weather data', 'job board')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b850f398e8de27adaf724f8533c9fb43931be86c985a6dba6e60c53d48b8fd4b"
        },
        {
          "name": "submit_site",
          "title": "Submit a Site for Indexing",
          "description": "Submit a URL for NHS to crawl and score. Use when you discover an agent-first tool, API, or service that isn't in the index yet. NHS will fetch the site, check its 7 agentic signals (llms.txt, ai-plugin.json, OpenAPI, structured API, MCP server, robots.txt AI rules, Schema.org), compute a score, and add it to the index. The site becomes searchable within a few seconds if the crawl succeeds.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Full URL to submit (include scheme, e.g. 'https://example.com'). Homepage is best — NHS will check /.well-known/ paths, /robots.txt, /llms.txt, etc. relative to the site root.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14efcfa8745a42820c16b50e24770aa1a6fc973e70cda39b0d01abfaca91e108"
        },
        {
          "name": "verify_mcp",
          "title": "Verify MCP Endpoint",
          "description": "Actively probe any URL to check if it is a live, spec-compliant MCP server. Sends a JSON-RPC tools/list request and verifies a valid response. Use this before depending on a third-party MCP endpoint — manifests and documentation can claim MCP support without actually serving it. Returns {verified: true/false, endpoint, note}.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Full URL of the MCP endpoint to probe (include scheme, e.g. 'https://example.com/mcp').",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:61004d49221dfa2bcdbd8b7a49adad679a3464a6ca2007dc7c09228d6da831dd"
        }
      ],
      "digest": "sha256:498b6e8f47d624c030c3f638b30f912a78e6c4606ae3c0bfde471173283ae7cf"
    }
  }
