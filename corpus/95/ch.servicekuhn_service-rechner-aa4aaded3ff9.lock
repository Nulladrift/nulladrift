                "type": "string"
              },
              "datum": {
                "description": "Tag als JJJJ-MM-TT aus termin_freie_zeiten. Date.",
                "type": "string"
              },
              "email": {
                "description": "E-Mail-Adresse der Person, dorthin geht der Bestätigungslink. Email for the confirmation link.",
                "maxLength": 120,
                "type": "string"
              },
              "erstzulassung": {
                "description": "1. Inverkehrsetzung (Fahrzeugausweis Ziffer 36) als JJJJ-MM oder 03.2009. First registration.",
                "maxLength": 20,
                "type": "string"
