      },
      "instructions": "Service-Rechner der Garage Kuhn AG, unabhängiger Porsche-Spezialist in Thalwil (Schweiz), Telefon 044 723 11 01. Berechnet nach den öffentlich zugänglichen Wartungsplänen von Porsche Schweiz und Porsche Deutschland, welcher Service als Nächstes fällig ist und welche Arbeiten dazugehören (Wortlaut der Porsche-Unterlagen mit Seitenzahl und Link aufs Original). Das Auto wird als modell (freier Text, z. B. «997 Carrera S», «Cayman GT4»), baureihe oder plan_id angegeben, dazu km und die 1. Inverkehrsetzung (erstzulassung, JJJJ-MM oder 03.2009; Schweizer Fahrzeugausweis Ziffer 36). Passt ein Jahr zu zwei Generationen, liefert das Werkzeug eine Rückfrage mit den möglichen plan_id. Fehlerhafte Angaben werden mit einem Hinweis zurückgegeben. Das Ergebnis enthält ein Erinnerungsdatum (vier Wochen vor dem nächsten Service, spätestens nach einem Jahr), einen Text und eine Kalenderdatei (.ics). Ist der Service in weniger als fünf Wochen fällig oder überfällig, gibt es keine Erinnerung. Termine und Offerten für alle Leistungen, Spezialität Porsche, auch VW, Audi, Skoda und weitere Marken: termin_freie_zeiten liefert freie Zeiten, termin_buchen reserviert einen Termin, offerte_anfragen legt eine Offerten-Anfrage an (Unfall, Lack, Einbruch, Restauration, Abschleppen). Die Person bestätigt innert 24 Stunden über den Link in der Mail der Garage Kuhn, lädt dort den Fahrzeugausweis hoch und nimmt die AGB an, sonst wird gelöscht. Richtwert ohne Gewähr: massgebend sind Herstellerunterlagen, die Serviceanzeige im Fahrzeug und die Befundaufnahme in der Werkstatt. Unabhängige Fachwerkstatt, keine Verbindung zu und keine Freigabe durch die Dr. Ing. h.c. F. Porsche AG. \n\nEnglish: Service calculator of Garage Kuhn AG, an independent Porsche specialist in Thalwil, Switzerland (+41 44 723 11 01). It calculates from the public Porsche maintenance schedules which service is due next and which tasks it includes. Inputs: the car as modell (free text such as \"997 Carrera S\"), baureihe or plan_id, the mileage (km) and the month of first registration (erstzulassung, e.g. 2009-03). Results include a reminder date, an .ics file and a booking link. Appointments and quotations for all services, Porsche specialist, other makes welcome: termin_freie_zeiten lists free slots, termin_buchen reserves one, offerte_anfragen creates a quotation request; the person confirms it within 24 hours via the link in the email from Garage Kuhn, otherwise it is released. Tool texts are in German. Guide value only. search and fetch return Porsche maintenance plans and calculations as documents.",
