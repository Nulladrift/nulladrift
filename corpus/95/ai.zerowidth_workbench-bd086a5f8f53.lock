        {
          "name": "workbench_flows_scaffold",
          "title": "Scaffold a first-draft Workbench flow",
          "description": "Creates a runnable first-draft flow from a spec you author: pick the simplest pattern that fits (classifier for read-and-bucket, structurer for transform/extract/draft-for-review, agent for genuinely conversational), write a production-quality system prompt grounded in what the user told you, and mark anything stubbed with [STUB: ...] markers plus stubNotes. The draft opens in Workbench's simple editor at /w/<workspace>/flows/<id> — give the user that path. May return `needs_confirmation`; show the user what you're proposing and wait for their approval, then re-call with the approvalId. When the draft comes from a Compass change, pass its opportunityId so the flow and the change point at each other (Compass shows 'Open in Workbench'; the flow shows where it came from). Then: workbench_flows_run to try it, workbench_flows_publish when it's ready for schedules and share links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "categories": {
                "description": "classifier only: 2-12 buckets. The classifier asks the systemPrompt as one pick-one question with these as the options, and returns `values.category` plus `answers.category` (probabilities and confidence).",
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["value"],
                  "type": "object"
                },
                "type": "array"
              },
              "description": {
                "description": "1-2 sentences: what it does, where it fits.",
                "type": "string"
              },
              "flowName": {
                "description": "Imperative + specific, ≤80 chars.",
                "type": "string"
              },
              "inputDescription": {
                "description": "What the flow's single input carries.",
                "type": "string"
              },
              "mode": {
                "description": "Pattern editor the draft opens in. Pick interviewer for conversations that LEARN something from a person (research calls, intake, retros) — pair it with workbench_flows_share_create so non-account humans can talk to it.",
                "enum": ["agent", "structurer", "classifier", "interviewer"],
                "type": "string"
              },
              "model": {
                "description": "The model node slug the draft runs on, from workbench_node_catalog_get, that the workspace allows. For a classifier, a `decision` entry (Jev, Kev, Solar Decide); defaults to TypeSafe: Jev Latest. Otherwise an `llm` entry (e.g. an OpenAI, Anthropic, or Google model); defaults to Claude Haiku 4.5. Set it here rather than editing the flow afterwards.",
                "type": "string"
              },
              "opportunityId": {
                "description": "Compass change (from compass_opportunities_list) this draft implements. Sets the flow ↔ change link; refused when the change already has a draft.",
                "type": "string"
              },
              "responseSchemaJson": {
                "description": "structurer only: the output JSON Schema, JSON-encoded as a string (object root, required fields, additionalProperties false).",
                "type": "string"
              },
              "stubNotes": {
                "description": "What's stubbed / missing / worth wiring next.",
                "type": "string"
              },
              "systemPrompt": {
                "description": "The draft's behavior — production-quality first attempt with [STUB: ...] / [FILL IN: ...] markers where reality is missing. Required for structurer and classifier. Leave it out of an agent to get the bare model with no instructions (a 'promptless' agent).",
                "type": "string"
              },
              "variables": {
                "description": "agent / interviewer: types and descriptions for the {{tokens}} in systemPrompt. Every {{token}} becomes a variable on its own (the test pane and scenarios list it, the app fills it per user at run time); pass this only to set a type other than string or say what fills it.",
                "items": {
                  "properties": {
                    "description": {
                      "description": "What the app passes in, e.g. 'The member's first name, from the CRM'.",
                      "type": "string"
                    },
                    "name": {
                      "description": "The token's name, as in {{name}}.",
                      "type": "string"
                    },
                    "type": {
                      "description": "Default string.",
                      "enum": ["string", "number", "boolean", "array", "object"],
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this.",
                "type": "string"
              }
            },
            "required": ["flowName", "mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Scaffold a first-draft Workbench flow"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
