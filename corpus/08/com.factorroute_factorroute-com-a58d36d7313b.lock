        {
          "name": "prompt_payment_interest",
          "title": "Interest owed on a late government invoice",
          "description": "Interest a federal agency owes on a late invoice under the Prompt Payment Act at the current Treasury rate (simple daily interest, added to principal every 30 days), or, for a state, the state's prompt payment rule with the interest at a rate you supply. Use for government contractors waiting on agency payments.",
