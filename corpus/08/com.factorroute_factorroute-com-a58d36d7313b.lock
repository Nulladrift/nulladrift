        {
          "name": "estimate_factoring_cost",
          "title": "Factoring cost and effective annual rate",
          "description": "Cost of factoring one invoice (or one month of invoices): cash advanced, fees, rebate, cost as a percent of the invoice and the effective annual rate on the cash actually received, next to a bank line. Same math as FactorRoute's factoring cost calculator. Fee is a flat rate per 30 days billed in blocks of increment_days (30, 15, 10 or 1 for daily proration).",
          "inputSchema": {
            "properties": {
              "advance_rate_pct": {
                "description": "Advance rate, percent. Default 85.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "bank_apr_pct": {
                "description": "Bank line APR to compare. Default 10.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "days_outstanding": {
                "description": "Days until the customer pays.",
                "maximum": 365,
                "minimum": 1,
                "type": "number"
              },
              "fee_pct_per_30_days": {
                "description": "Discount fee, percent per 30 days (e.g. 2.5).",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "increment_days": {
                "description": "Billing block in days. Default 30.",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "invoice_amount": {
                "description": "Invoice face value in dollars.",
                "minimum": 1,
                "type": "number"
              },
              "monthly_fees": {
                "description": "Recurring monthly fees in dollars (service, lockbox). Default 0.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["days_outstanding", "fee_pct_per_30_days", "invoice_amount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Factoring cost and effective annual rate"
          },
          "behavior": {
