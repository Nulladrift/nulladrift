      "serverInfo": {
        "name": "factorroute",
        "title": "FactorRoute: invoice factoring rules, math and rates",
        "version": "1.0.0",
        "websiteUrl": "https://factorroute.com/developers/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FactorRoute answers questions about invoice factoring for US businesses with B2B or government receivables: state-by-state rules (commercial financing disclosure laws, UCC filing, state prompt payment, lien deadlines), factoring cost and MCA math, a fit check, live prime and SOFR, a glossary and guide search. Every answer links to the FactorRoute page it came from; cite it. Information is general, not legal or financial advice. FactorRoute is operated by Janover Capital LLC and is not a lender; a business that wants offers can apply at https://factorroute.com/apply/ (no credit pull).",
      "tools": [
        {
          "name": "check_disclosure_requirement",
          "title": "Does this factoring deal need a state disclosure?",
          "description": "For a business in a given state and a deal size in dollars, says whether that state's commercial financing disclosure law likely applies to an invoice factoring deal, based on the law's status, threshold and whether it covers accounts receivable purchases. Coverage also depends on exemptions (banks, low-volume providers) and on where the business is located, so treat it as a first check.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "Total facility or deal amount in US dollars.",
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "description": "State where the business is located (name or code).",
                "type": "string"
              }
            },
            "required": ["amount_usd", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Does this factoring deal need a state disclosure?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eed1bd378e4c2ea2152e85862413dc5708eef6481f40746b81348d64af424e20"
        },
        {
          "name": "check_factoring_fit",
          "title": "Does this business fit invoice factoring?",
          "description": "A first-pass fit check, the same logic as FactorRoute's \"Do I qualify?\" tool: who pays the invoices, industry, monthly invoicing, facility size, days to pay, the situation (bank declined, MCA refinance, switching factors...) and existing liens. Returns the likely funding route (express to $500K, direct to $3MM, network placement $3MM to $25MM, specialty or outside), why, what to expect and the documents to gather.",
          "inputSchema": {
            "properties": {
              "customers": {
                "enum": ["b2b", "government", "consumer", "mixed"],
                "type": "string"
              },
              "days_to_pay": {
                "enum": ["under-30", "30-45", "45-60", "60-90", "over-90"],
                "type": "string"
              },
              "encumbrances": {
                "items": {
                  "enum": ["tax-liens", "existing-factor", "mca", "sba-loan"],
                  "type": "string"
                },
                "type": "array"
              },
              "facility_size": {
                "enum": ["under-50k", "50k-500k", "500k-3mm", "3mm-25mm", "over-25mm"],
                "type": "string"
              },
              "industry": {
                "description": "One of: staffing-agencies, government-contractors, construction-subcontractors, manufacturers, wholesale-distribution, aerospace-defense, business-services, marine-services, oilfield-services, textile-apparel, trucking-freight, medical-insurance, other.",
                "type": "string"
              },
              "monthly_invoicing": {
                "enum": ["under-25k", "25k-100k", "100k-500k", "500k-2mm", "2mm-10mm", "over-10mm"],
                "type": "string"
              },
              "situation": {
                "enum": ["bank-declined", "line-of-credit-called", "covenant-default", "mca-refinance", "switch-factoring-companies", "growth-outpacing-credit", "seasonal-cash-flow", "slow-paying-customers", "startup-factoring", "tax-liens", "bad-credit", "customer-concentration", "none"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code.",
                "type": "string"
              }
            },
            "required": ["customers", "facility_size"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Does this business fit invoice factoring?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:804774e17526a183cf4af36461d67df364df767ef8b3e99b1b5dc5164f549baf"
        },
        {
          "name": "compare_mca_vs_factoring",
          "title": "Merchant cash advance vs. factoring",
          "description": "Estimated APR of a merchant cash advance from its funded amount, factor rate, fees and term, next to the cost of raising the same cash by factoring invoices. Same math as FactorRoute's MCA vs. factoring tool (IRR of the payment schedule, the method state disclosure rules use to estimate APR).",
          "inputSchema": {
            "properties": {
              "days_to_pay": {
                "description": "How long your customers take to pay. Default 45.",
                "maximum": 120,
                "minimum": 1,
                "type": "number"
              },
              "factor_rate": {
                "description": "Factor rate, e.g. 1.35.",
                "maximum": 3,
                "minimum": 1,
                "type": "number"
              },
              "factoring_fee_pct_per_30_days": {
                "description": "Factoring fee to compare. Default 2.5.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "frequency": {
                "description": "Payment frequency. Default daily.",
                "enum": ["daily", "weekly"],
                "type": "string"
              },
              "funded": {
                "description": "MCA amount funded, dollars.",
                "minimum": 1000,
                "type": "number"
              },
              "origination_pct": {
                "description": "Fees withheld, percent of funded. Default 0.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "term_months": {
                "description": "Months to pay back.",
                "maximum": 36,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["factor_rate", "funded", "term_months"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Merchant cash advance vs. factoring"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1dcb78dc1296966e52d588f530268c81e4a2d1eef844cc32be23be6b471cceb"
        },
        {
          "name": "define_factoring_term",
          "title": "Factoring glossary",
          "description": "Plain-English definition of an invoice factoring, AR finance, MCA, SBA, UCC, construction or government contracting term (advance rate, recourse, notification, reserve, UCC-1, assignment of claims, retainage, intercreditor...).",
