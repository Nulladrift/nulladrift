        {
          "name": "get_state_factoring_rules",
          "title": "State factoring rules",
          "description": "Everything FactorRoute has verified about invoice factoring in one US state or DC: commercial financing disclosure law (status, threshold, citation, whether it covers factoring, APR, registration), where UCC liens are filed and searched, how fast state agencies must pay vendors and the late-payment interest, private construction prompt pay, mechanics lien and payment bond deadlines, the main industries and payers, and sources. Use for \"is factoring regulated in X\", \"where do I search UCC liens in X\", \"how long does X state take to pay contractors\".",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "State name or two-letter code, e.g. \"TX\" or \"New York\". DC is accepted.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
