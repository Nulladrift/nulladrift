      "serverInfo": {
        "name": "whichagent-car-rental",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "availability",
          "description": "Returns a normalized availability handoff for a source-linked independent Orange County, CA car-rental provider, including availability class live, booking-site, or none; it does not guarantee inventory. Use when: the user has selected a provider and wants the provider handoff to check availability for specific pickup and return dates and, optionally, a vehicle type. Do not use when: the user needs guaranteed real-time inventory or price, national chains or franchises, a category outside car rentals, payment, or a completed reservation; availability only returns a class and provider handoff.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "business_id": {
                "description": "Required stable business ID returned by search."
              },
              "pickup_date": {
                "description": "Required pickup date in YYYY-MM-DD format."
              },
              "return_date": {
                "description": "Required return date in YYYY-MM-DD format."
              },
              "vehicle_type": {
                "description": "Optional requested vehicle type or class, such as SUV or exotic."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:82187a11b730c94ff24df7f8f02c7e24075aca70d5134c8893d236a15b69626e"
        },
        {
          "name": "book",
          "description": "Returns a normalized booking handoff link for a source-linked independent Orange County, CA car-rental provider; it never creates or confirms a reservation. Use when: the user has selected a provider and wants its official booking or contact handoff for specific rental dates and, optionally, a vehicle type. Do not use when: the user needs WhichAgent to create or confirm a reservation, take payment, guarantee a real-time price or inventory, find national chains or franchises, or serve a category outside car rentals.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "business_id": {
                "description": "Required stable business ID returned by search."
              },
              "pickup_date": {
                "description": "Required pickup date in YYYY-MM-DD format."
              },
              "return_date": {
                "description": "Required return date in YYYY-MM-DD format."
              },
              "vehicle_type": {
                "description": "Optional requested vehicle type or class, such as SUV or exotic."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72850736395fc5fe656fda602e325120943d73c9cb285e0ffbaaf1d2ed991711"
        },
        {
          "name": "compare",
          "description": "Returns a normalized, source-linked comparison of selected independent Orange County, CA car-rental providers. Use when: the user wants to compare two or more search results on city, vehicle types, monthly-rental capability, or published handoff capabilities. Do not use when: the user needs national chains or franchises, rankings based on guaranteed real-time prices or inventory, a category outside car rentals, payment, or a completed reservation.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "business_ids": {
                "description": "Required array or comma-separated list of at least two stable business IDs returned by search."
              },
              "criteria": {
                "description": "Optional array or comma-separated list of comparison fields: city, vehicle_types, monthly_rentals, capabilities."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b61afc49d4d22d3f2e6d2775d75fe346ed06066b8b04966a77f15188f47501de"
        },
        {
          "name": "details",
          "description": "Returns a normalized, source-linked business record for one independent Orange County, CA car-rental provider. Use when: the user wants published details, vehicle types, capabilities, contact information, or source links for a car-rental business selected from search. Do not use when: the user needs national chains or franchises, a business outside this Orange County car-rental dataset, guaranteed real-time price or inventory, payment, or a completed reservation.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "business_id": {
                "description": "Required stable business ID returned by search, for example newport-exotics."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b1406c8b3e0bc7a745e907abb39628883b0f73d12d3b05bafbc8624e352af751"
        },
        {
          "name": "search",
          "description": "Returns normalized, source-linked business records for independent Orange County, CA car-rental providers. Use when: the user wants to find or compare independent local car-rental businesses in Orange County with constraints such as city, vehicle type, or monthly rentals. Do not use when: the user needs national chains or franchises, a category outside car rentals, guaranteed real-time prices or inventory, payment, or a completed reservation.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "city": {
                "description": "Optional Orange County city name, such as Irvine or Costa Mesa."
              },
              "monthly_rentals": {
                "description": "Optional boolean; true limits results to providers with a published monthly-rental capability."
              },
              "vehicle_type": {
                "description": "Optional vehicle type or class published by the provider, such as SUV, exotic, or minivan."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d42d1d35217aceb31d726f073bf128f161b3fd725931e0d06caf4b384c48883c"
        }
      ],
      "digest": "sha256:df384141e999ead13e3fa6964032a259259cfa14f92707251d421375b2f47db3"
    }
