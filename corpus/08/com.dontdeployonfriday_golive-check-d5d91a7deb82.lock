{
  "lockfileVersion": 2,
  "subjects": {
    "com.dontdeployonfriday/golive-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dontdeployonfriday.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "golive-check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call analyze_headers with headers you already collected from a deployment you operate. Call explain_finding with one finding id from the seven. Call get_fix with one finding id and a platform of caddy, nginx, vercel, netlify, nextjs. An omitted or unknown platform returns fix null. Call report_feedback with one finding id and an outcome of false_positive, fix_worked, fix_failed. It returns stored false and writes nothing. This server does not fetch a URL and does not guess the platform from the Server header. When platform is caddy, non-empty config text is scanned for one Strict-Transport-Security header form, one Content-Security-Policy header form, one X-Content-Type-Options nosniff header form, one X-Frame-Options DENY or SAMEORIGIN header form, one Referrer-Policy header form with a non-empty value, Caddy header deletions of both Server and X-Powered-By, and one Caddy > replace of Access-Control-Allow-Origin whose replacement is non-empty and is not *. That deletion scan is present only when both are deleted. That replace is absent when the replacement is empty or *. When platform is nginx, non-empty config text is scanned for one add_header Strict-Transport-Security line with max-age greater than 0, one add_header Content-Security-Policy line with a non-empty quoted value, one add_header X-Content-Type-Options line set to nosniff, one add_header X-Frame-Options line set to DENY or SAMEORIGIN, and one add_header Referrer-Policy line with a non-empty quoted value. Content-Security-Policy-Report-Only does not count. A Content-Security-Policy frame-ancestors line does not count as X-Frame-Options. Any other X-Content-Type-Options value is absent. Any other X-Frame-Options value is absent. An empty quoted Referrer-Policy value is absent. When platform is nginx, the version-leak field is present only for both lines server_tokens off; and proxy_hide_header X-Powered-By;. One of those lines is absent. The CORS field is present for one add_header Access-Control-Allow-Origin line whose quoted value is non-empty after trim and is not *. When platform is vercel, JSON headers entries are scanned for HSTS, CSP, nosniff, frame, referrer, and Access-Control-Allow-Origin using those same value rules, and the version-leak field is absent because vercel.json cannot delete Server or X-Powered-By. When platform is netlify, an indented Header: value line is scanned the same way, and the version-leak field is absent. When platform is nextjs, a headers() key and value pair is scanned the same way, and the version-leak field is present only when poweredByHeader is false. A value that contains {, }, or $ is absent. The Caddy scans still run only when platform is caddy. Other config text and paths are not checked. Nothing is for sale.",
      "tools": [
        {
          "name": "analyze_headers",
          "description": "Check raw HTTP response headers from a deployment you already operate. Returns the same object as POST /v1/analyze. Unknown fields are ignored. A url field is not fetched. Nothing is stored. Nothing is for sale.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "config_text": {
                "description": "Optional config text. Not copied into the response. When platform is caddy and this is non-empty, GLC-HSTS-MISSING includes config_header present or absent for one Caddy Strict-Transport-Security form with max-age greater than 0, GLC-CSP-MISSING includes config_header present or absent for one Caddy Content-Security-Policy form with a non-empty quoted value, GLC-NOSNIFF-MISSING includes config_header present or absent for one Caddy X-Content-Type-Options form set to nosniff, GLC-FRAME-MISSING includes config_header present or absent for one Caddy X-Frame-Options form set to DENY or SAMEORIGIN, GLC-REFERRER-MISSING includes config_header present or absent for one Caddy Referrer-Policy form with a non-empty value, and GLC-SERVER-VERSION-LEAK includes config_header present or absent only when that text deletes both Server and X-Powered-By. One deletion is absent. GLC-CORS-WILDCARD-CREDENTIALS includes config_header present or absent for one Caddy > replace of Access-Control-Allow-Origin whose replacement is non-empty and is not *. A line that sets that header without >, and a deletion, are absent. A Content-Security-Policy frame-ancestors line does not count as X-Frame-Options. When platform is nginx and this is non-empty, GLC-HSTS-MISSING includes config_header present or absent for one nginx add_header Strict-Transport-Security line with max-age greater than 0, GLC-CSP-MISSING includes config_header present or absent for one nginx add_header Content-Security-Policy line whose quoted value is non-empty after trim, and GLC-NOSNIFF-MISSING includes config_header present or absent for one nginx add_header X-Content-Type-Options line whose quoted value is nosniff. Any other value is absent. GLC-FRAME-MISSING includes config_header present or absent for one nginx add_header X-Frame-Options line whose quoted value is DENY or SAMEORIGIN. Any other value is absent. Content-Security-Policy-Report-Only does not count. A Content-Security-Policy frame-ancestors line does not count as X-Frame-Options. An empty quoted value, or a quoted value that is only spaces, is absent. A value that contains {, }, or $ is absent. GLC-REFERRER-MISSING includes config_header present or absent for one nginx add_header Referrer-Policy line whose quoted value is non-empty after trim. After trim, the accepted lines are add_header Referrer-Policy \"<value>\" always; and add_header Referrer-Policy \"<value>\";. The semicolon is required. An empty quoted value, or a quoted value that is only spaces, is absent. A value that contains {, }, or $ is absent. When platform is nginx, the version-leak field is present only for both lines server_tokens off; and proxy_hide_header X-Powered-By;. One of those lines is absent. The CORS field is present for one add_header Access-Control-Allow-Origin line whose quoted value is non-empty after trim and is not *. When platform is vercel, JSON headers entries are scanned for HSTS, CSP, nosniff, frame, referrer, and Access-Control-Allow-Origin using those same value rules, and the version-leak field is absent because vercel.json cannot delete Server or X-Powered-By. When platform is netlify, an indented Header: value line is scanned the same way, and the version-leak field is absent. When platform is nextjs, a headers() key and value pair is scanned the same way, and the version-leak field is present only when poweredByHeader is false. A value that contains {, }, or $ is absent. The Caddy scans still run only when platform is caddy. Other config text is not checked. Do not include secret values.",
                "type": "string"
              },
              "headers_raw": {
                "description": "Raw HTTP response headers from a deployment this agent already operates, including an optional status line, as curl -sI prints them. This server does not request a URL.",
                "type": "string"
              },
              "paths_tested": {
                "description": "Optional paths. Accepted and not checked. This server does not request them.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "platform": {
                "description": "Platform whose config the caller can edit. A fix snippet is attached only for caddy, nginx, vercel, netlify, or nextjs. Any other declared platform, or an omitted platform, returns fix null. This server does not guess the platform from the Server header.",
                "pattern": "^[a-z0-9_-]{1,32}$",
                "type": "string"
              }
            },
            "required": ["headers_raw"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "checked": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "config_text": {
                "enum": ["absent", "not_checked"]
              },
              "findings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "config_header": {
                      "description": "On GLC-HSTS-MISSING, GLC-CSP-MISSING, GLC-NOSNIFF-MISSING, GLC-FRAME-MISSING, GLC-REFERRER-MISSING, GLC-SERVER-VERSION-LEAK, and GLC-CORS-WILDCARD-CREDENTIALS, when platform is caddy and config_text is a non-empty string. present or absent for that finding. GLC-HSTS-MISSING is also present or absent when platform is nginx and config_text is a non-empty string, for one nginx add_header Strict-Transport-Security line whose quoted value contains max-age= and an integer greater than 0. A value that contains {, }, or $ is absent. GLC-CSP-MISSING is also present or absent when platform is nginx and config_text is a non-empty string, for one nginx add_header Content-Security-Policy line whose quoted value is non-empty after trim. Content-Security-Policy-Report-Only does not count. An empty quoted value, or a quoted value that is only spaces, is absent. A value that contains {, }, or $ is absent. GLC-NOSNIFF-MISSING is also present or absent when platform is nginx and config_text is a non-empty string, for one nginx add_header X-Content-Type-Options line whose quoted value is nosniff. After trim, the accepted lines are add_header X-Content-Type-Options \"nosniff\" always; and add_header X-Content-Type-Options \"nosniff\";. The semicolon is required. Any other value is absent. A value that contains {, }, or $ is absent. GLC-FRAME-MISSING is also present or absent when platform is nginx and config_text is a non-empty string, for one nginx add_header X-Frame-Options line whose quoted value is DENY or SAMEORIGIN. After trim, the accepted lines are add_header X-Frame-Options \"DENY\" always;, add_header X-Frame-Options \"SAMEORIGIN\" always;, add_header X-Frame-Options \"DENY\";, and add_header X-Frame-Options \"SAMEORIGIN\";. The semicolon is required. Any other value is absent. A value that contains {, }, or $ is absent. A Content-Security-Policy frame-ancestors line does not count. GLC-REFERRER-MISSING is also present or absent when platform is nginx and config_text is a non-empty string, for one nginx add_header Referrer-Policy line whose quoted value is non-empty after trim. After trim, the accepted lines are add_header Referrer-Policy \"<value>\" always; and add_header Referrer-Policy \"<value>\";. The semicolon is required. An empty quoted value, or a quoted value that is only spaces, is absent. A value that contains {, }, or $ is absent. When platform is nginx, the version-leak field is present only for both lines server_tokens off; and proxy_hide_header X-Powered-By;. One of those lines is absent. The CORS field is present for one add_header Access-Control-Allow-Origin line whose quoted value is non-empty after trim and is not *. When platform is vercel, JSON headers entries are scanned for HSTS, CSP, nosniff, frame, referrer, and Access-Control-Allow-Origin using those same value rules, and the version-leak field is absent because vercel.json cannot delete Server or X-Powered-By. When platform is netlify, an indented Header: value line is scanned the same way, and the version-leak field is absent. When platform is nextjs, a headers() key and value pair is scanned the same way, and the version-leak field is present only when poweredByHeader is false. A value that contains {, }, or $ is absent. GLC-SERVER-VERSION-LEAK is present only when that text deletes both Server and X-Powered-By. One deletion is absent. GLC-CORS-WILDCARD-CREDENTIALS is present only when that text has one Caddy > replace of Access-Control-Allow-Origin whose replacement is non-empty and is not *. A line that sets the header without >, and a deletion, are absent. Omitted when config_text is absent. Omitted on the version leak and CORS when the platform is not caddy, including when the Server header says caddy. Omitted on GLC-HSTS-MISSING when the platform is not caddy, nginx, vercel, netlify, or nextjs, including when the Server header says nginx. Omitted on GLC-CSP-MISSING when the platform is not caddy, nginx, vercel, netlify, or nextjs, including when the Server header says nginx. Omitted on GLC-NOSNIFF-MISSING when the platform is not caddy, nginx, vercel, netlify, or nextjs, including when the Server header says nginx. Omitted on GLC-FRAME-MISSING when the platform is not caddy, nginx, vercel, netlify, or nextjs, including when the Server header says nginx. Omitted on GLC-REFERRER-MISSING when the platform is not caddy, nginx, vercel, netlify, or nextjs, including when the Server header says nginx. The finding is not cleared. The config text is not copied.",
                      "enum": ["present", "absent"]
                    },
                    "evidence": {
                      "type": "string"
                    },
                    "fix": {
                      "anyOf": [
                        {
                          "type": "null"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "last_verified": {
                              "type": "string"
                            },
                            "note": {
                              "type": "string"
                            },
                            "platform": {
                              "type": "string"
                            },
                            "snippet": {
                              "type": "string"
                            },
                            "source_url": {
                              "type": "string"
                            }
                          },
                          "required": ["last_verified", "platform", "snippet", "source_url"],
                          "type": "object"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "severity": {
                      "type": "string"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "required": ["evidence", "fix", "id", "severity", "why"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "parsed_header_count": {
                "minimum": 0,
                "type": "integer"
              },
              "paths_tested_count": {
                "minimum": 0,
                "type": "integer"
              },
              "platform": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "schema": {
                "const": "golive-check.analyze.v0"
              }
            },
            "required": ["checked", "config_text", "findings", "notes", "parsed_header_count", "paths_tested_count", "platform", "schema"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze response headers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6778658675cdabefd8016d5c50522db9f82348111064681df361a86cc76817f9"
        },
        {
          "name": "explain_finding",
          "description": "Explain one finding id from the seven. Returns id, severity, why, and answer_page. answer_page is the CSP and clickjacking page for GLC-CSP-MISSING and GLC-FRAME-MISSING, and null for the other five. Unknown fields are ignored. A url field is not fetched. Nothing is stored. Nothing is for sale.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "id": {
                "description": "One finding id from the seven. Unknown fields are ignored. A url field is not fetched.",
                "enum": ["GLC-HSTS-MISSING", "GLC-CSP-MISSING", "GLC-NOSNIFF-MISSING", "GLC-FRAME-MISSING", "GLC-REFERRER-MISSING", "GLC-SERVER-VERSION-LEAK", "GLC-CORS-WILDCARD-CREDENTIALS"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer_page": {
                "anyOf": [
                  {
                    "type": "null"
                  },
                  {
                    "const": "https://dontdeployonfriday.com/csp-and-clickjacking.html"
                  }
                ],
                "description": "https://dontdeployonfriday.com/csp-and-clickjacking.html for GLC-CSP-MISSING and GLC-FRAME-MISSING. Null for the other five. This server does not fetch it."
              },
              "id": {
                "enum": ["GLC-HSTS-MISSING", "GLC-CSP-MISSING", "GLC-NOSNIFF-MISSING", "GLC-FRAME-MISSING", "GLC-REFERRER-MISSING", "GLC-SERVER-VERSION-LEAK", "GLC-CORS-WILDCARD-CREDENTIALS"],
                "type": "string"
              },
              "severity": {
                "enum": ["high", "medium", "low"],
                "type": "string"
              },
              "why": {
                "type": "string"
              }
            },
            "required": ["answer_page", "id", "severity", "why"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a finding"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0078dced3d9bf1e1b5a7dbbeca48a30b499e87fbc61d226f8011fbc2c8ea2a34"
        },
        {
          "name": "get_fix",
          "description": "Return the registry snippet for one finding id and one platform. The platforms are caddy, nginx, vercel, netlify, nextjs. The result is id and fix. fix has platform, snippet, source_url, and last_verified, and note when the registry file has one. An omitted or unknown platform returns fix null. Unknown fields are ignored. A url field is not fetched. source_url is not fetched. Nothing is stored. Nothing is for sale.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "id": {
                "description": "One finding id from the seven. Unknown fields are ignored. A url field is not fetched.",
                "enum": ["GLC-HSTS-MISSING", "GLC-CSP-MISSING", "GLC-NOSNIFF-MISSING", "GLC-FRAME-MISSING", "GLC-REFERRER-MISSING", "GLC-SERVER-VERSION-LEAK", "GLC-CORS-WILDCARD-CREDENTIALS"],
                "type": "string"
              },
              "platform": {
                "description": "Platform whose config the caller can edit. caddy, nginx, vercel, netlify, nextjs returns that registry snippet. Any other value, or an omitted platform, returns fix null. This server does not guess the platform from the Server header. source_url is a citation and is not fetched.",
                "pattern": "^[a-z0-9_-]{1,32}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "fix": {
                "anyOf": [
                  {
                    "type": "null"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "last_verified": {
                        "type": "string"
                      },
                      "note": {
                        "type": "string"
                      },
                      "platform": {
                        "type": "string"
                      },
                      "snippet": {
                        "type": "string"
                      },
                      "source_url": {
                        "type": "string"
                      }
                    },
                    "required": ["last_verified", "platform", "snippet", "source_url"],
                    "type": "object"
                  }
                ]
              },
              "id": {
                "enum": ["GLC-HSTS-MISSING", "GLC-CSP-MISSING", "GLC-NOSNIFF-MISSING", "GLC-FRAME-MISSING", "GLC-REFERRER-MISSING", "GLC-SERVER-VERSION-LEAK", "GLC-CORS-WILDCARD-CREDENTIALS"],
                "type": "string"
              }
            },
            "required": ["fix", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a fix snippet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2dfb189f16d4929460f6e8c143cd88ab075d76513c0d86342a9f5b4e165ac16a"
        },
        {
          "name": "report_feedback",
          "description": "Report one finding id and one outcome. The outcomes are false_positive, fix_worked, fix_failed. The result is id, outcome, and stored false. Nothing is written: no file, no counter, and no log line. A note, a url, and headers are ignored. A url field is not fetched. This server does not guess the platform from the Server header. Nothing is for sale.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "id": {
                "description": "One finding id from the seven. A note, a url, and headers are ignored. A url field is not fetched.",
                "enum": ["GLC-HSTS-MISSING", "GLC-CSP-MISSING", "GLC-NOSNIFF-MISSING", "GLC-FRAME-MISSING", "GLC-REFERRER-MISSING", "GLC-SERVER-VERSION-LEAK", "GLC-CORS-WILDCARD-CREDENTIALS"],
                "type": "string"
              },
              "outcome": {
                "description": "Exactly one of false_positive, fix_worked, fix_failed. Any other value is unknown_outcome. Nothing is written.",
                "enum": ["false_positive", "fix_worked", "fix_failed"],
                "type": "string"
              }
            },
            "required": ["id", "outcome"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "enum": ["GLC-HSTS-MISSING", "GLC-CSP-MISSING", "GLC-NOSNIFF-MISSING", "GLC-FRAME-MISSING", "GLC-REFERRER-MISSING", "GLC-SERVER-VERSION-LEAK", "GLC-CORS-WILDCARD-CREDENTIALS"],
                "type": "string"
              },
              "outcome": {
                "enum": ["false_positive", "fix_worked", "fix_failed"],
                "type": "string"
              },
              "stored": {
                "const": false
              }
            },
            "required": ["id", "outcome", "stored"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Report a finding outcome"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd223709d2e9b950f04cee9696ee296c3fd8104481ed9bf2822ff30cff4c0c2a"
        }
      ],
      "digest": "sha256:86ef552fc1d98a49e471fdbba2133acd1447120e5eaad4318b3e41597b0c722f"
    }
  }
