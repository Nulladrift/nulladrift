      "instructions": "Tools to virtually stage, redesign, enhance, declutter and convert real-estate photos via the AI HomeDesign API. Typical flow: call `list_capabilities` to see the tools, then a high-level helper such as `virtual_staging`, `enhance_image`, `remove_items`, `interior_design` or `day_to_dusk` with a public image URL. For full control use `create_order` -> `run_process` -> `get_process`. Results come back as downloadable image URLs.\n\nPRESENTATION RULES — always obey a tool's `present_instructions` and `action_required` fields when present:\n• Style choice: when a tool returns `need_style` with a `styles` list, do NOT use an interactive dropdown/picker — write your own message listing EVERY style (title + description) as cards, tag 2-3 best fits from the photo, and ask the user to reply. Use only those styles — never invent or substitute names (no 'Mid-Century Modern', 'Coastal', etc.).\n• Results: present each finished image as a downloadable image FILE (a file/preview card), not as a raw text link.",
