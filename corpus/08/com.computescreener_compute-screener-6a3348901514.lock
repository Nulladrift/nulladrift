      "instructions": "Compute Screener: free compute prices. Use it when someone asks what a GPU costs to rent per hour (H100, H200, B200 and the others), which cloud or marketplace prices a GPU lowest, or what an AI model's API costs per 1M tokens. It publishes two daily price indices, for GPU rental and for AI tokens, and each exchange's compute futures prices. GPU prices are recalculated every minute (each source's schedule is on the status page); token prices once a day. GPU rental: USD per GPU-hour for H100, H200, A100, B200, B300, RTX PRO 6000, L40S, RTX A6000, RTX 6000 Ada, L40, RTX 5090, RTX 4090, each standardized to an on-demand, 8-GPU, US contract, from posted on-demand prices only (no spot, interruptible or reserved prices); one value per day in US Central time, the current day provisional. AI tokens: USD per 1M tokens at the mix of tokens agents send (87% cache read, 12% input, 1% output), weighted by each company's models' usage on OpenRouter, for Anthropic, OpenAI, Google, xAI, Meta, Moonshot AI, Alibaba, DeepSeek, Z.ai, Xiaomi, StepFun, MiniMax, Mistral, Reflection AI, NVIDIA, Thinking Machines (those with a price), one value per UTC day. Changes (change_1d_pct, change_1w_pct, change_1m_pct) are percent changes from the latest value at least that many days earlier and at most 3 days more (7 for the 1-month change, as the weekly history has one value a week); where there is none, from the value that day interpolated between the nearest days before and after it. Each GPU and company has a url: its page with the chart, history and a description. A final value is never changed: an error found in one is noted (errata, with the correct value when it can be recomputed) in the answers about its index or model, as their pages note it, and in a list's rows that give it; get_data_status lists them all. The figures are published under CC BY 4.0 with credit to Compute Screener (terms: https://computescreener.com/terms). They are information about posted prices and markets. Methodology: https://computescreener.com/methodology. The tools answer what the website shows. Tools: get_gpu_prices and get_token_prices (latest indices; one GPU with its providers, other posted prices and compute futures, one company with its models), get_price_history (daily history, or a period such as a month), get_gpu_price_at (a price at a past time), get_price_changes (what moved over 1, 5, 7 or 30 days), get_model_prices (each AI model's posted API prices, the cheapest first on request), get_provider_prices (each GPU provider's posted prices, AWS, Azure, Google Cloud and Oracle included), get_workload_cost (each model's break-even throughput on each GPU, and gross margin), get_gpu_market_prices (A40, L4, V100, T4 and over 60 more GPUs as posted, those without an index; NVIDIA's, AMD's and Intel's, no TPUs or Trainium), list_indices (everything listed), verify_price (a final value's manifest and how anyone can recompute it from the public files), get_data_status (freshness, sources and the errata), search and fetch (the site's pages, among them wholesale electricity prices at the Texas and California hubs, AI coding tools by usage on OpenRouter, AI data center sites and the terms of use).",
