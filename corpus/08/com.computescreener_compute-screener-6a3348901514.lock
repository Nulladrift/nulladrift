              "companies": {
                "items": {
                  "properties": {
                    "bloomberg_tickers": {
                      "description": "As the site shows them beside the lab: Bloomberg tickers of benchmark indices for the same lab. Prices on this site are calculated independently and differ from those indices.",
                      "items": {
                        "type": ["string", "null"]
                      },
                      "type": ["array", "null"]
                    },
                    "change_1d_pct": {
                      "description": "Percent change from the latest value 1 to 4 days earlier (none: interpolated)",
                      "type": ["number", "null"]
                    },
                    "change_1m_pct": {
                      "description": "Percent change from the latest value 30 to 37 days earlier (none: interpolated)",
                      "type": ["number", "null"]
