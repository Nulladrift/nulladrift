        {
          "name": "get_workload_cost",
          "title": "Break-even throughput and gross margin",
          "description": "Break-even throughput, as each GPU's and each model's page shows it: the tokens per second one GPU must sell at a model's list price (3 input : 1 output) to cover the GPU's rental price today. Give a GPU for every model on it, a model for every GPU, or a company for its models; give a throughput for what the gross margin calculator on a model's page shows: the revenue per GPU-hour and the gross margin. For questions like \"how many tokens per second must an H100 sell to cover its rent?\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Only this company's models.",
                "enum": ["Anthropic", "OpenAI", "Google", "xAI", "Meta", "Moonshot AI", "Alibaba", "DeepSeek", "Z.ai", "Xiaomi", "StepFun", "MiniMax", "Mistral", "Reflection AI", "NVIDIA", "Thinking Machines"],
                "type": "string"
              },
              "gpu": {
                "description": "One GPU; omit for all listed.",
                "enum": ["H100", "H200", "A100", "B200", "B300", "RTX PRO 6000", "L40S", "RTX A6000", "RTX 6000 Ada", "L40", "RTX 5090", "RTX 4090"],
                "type": "string"
              },
              "model": {
                "description": "A model's name or page id (e.g. \"Claude Opus 5.5\"); omit for every model.",
                "type": "string"
              },
              "throughput_tokens_per_second": {
                "description": "Tokens per second one GPU generates (input and output, 3 to 1).",
                "maximum": 10000000,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "license": {
                "type": ["string", "null"]
              },
              "methodology": {
                "type": ["string", "null"]
              },
              "note": {
                "type": ["string", "null"]
              },
              "rows": {
                "items": {
                  "properties": {
                    "breakeven_tokens_per_second": {
                      "description": "Tokens per second one GPU must sell at the list price to cover its rental",
                      "type": ["number", "null"]
                    },
                    "company": {
                      "type": ["string", "null"]
                    },
                    "gpu": {
                      "type": ["string", "null"]
                    },
                    "gross_margin_pct": {
                      "description": "At the given throughput, as the gross margin calculator",
                      "type": ["number", "null"]
                    },
                    "model": {
                      "type": ["string", "null"]
                    },
                    "rental_price": {
                      "description": "The GPU's index, USD per GPU-hour",
                      "type": ["number", "null"]
                    },
                    "revenue_per_gpu_hour": {
                      "description": "At the given throughput, as the gross margin calculator",
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["gpu", "model"],
                  "type": ["object", "null"]
                },
                "type": ["array", "null"]
              },
              "throughput_tokens_per_second": {
                "type": ["number", "null"]
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Break-even throughput and gross margin"
          },
          "behavior": {
            "destructive": false,
