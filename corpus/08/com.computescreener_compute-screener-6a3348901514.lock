        "name": "computescreener",
        "title": "Compute Screener",
        "version": "1.26.1",
        "description": "Free compute prices: what GPUs cost to rent per hour (daily GPU rental price indices and each provider's prices), AI model API prices per 1M tokens by company and model, and compute futures prices, with history.",
        "websiteUrl": "https://computescreener.com",
        "icons": [
          {
            "src": "https://computescreener.com/assets/brand/cs-logo-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
