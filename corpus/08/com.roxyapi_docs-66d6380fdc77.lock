{
  "lockfileVersion": 2,
  "subjects": {
    "com.roxyapi/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://roxyapi.com/mcp/docs"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "roxy-docs",
        "title": "RoxyAPI Docs MCP Server (keyless, for coding agents)",
        "version": "2.0.0",
        "description": "Keyless docs search so coding agents wire up RoxyAPI: every endpoint, param and SDK call.",
        "websiteUrl": "https://roxyapi.com/docs/mcp"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Call search_docs before writing any RoxyAPI call. For the exact request and response contract of an operation, query the OpenAPI spec at https://roxyapi.com/api/v2/openapi.json with jq; the recipe and the audit rules are in https://roxyapi.com/AGENTS.md. Never guess a path, a field or an enum value.",
      "tools": [
        {
          "name": "search_docs",
          "description": "Search the RoxyAPI knowledge base and get back ranked documentation snippets, each with a source URL. It covers API endpoints with their request and response fields, SDK usage for TypeScript, Python, PHP, C#, Go, Rust, and Dart, the WordPress plugin, authentication and API keys, UI components, and step by step integration guides. Call this first whenever you need to integrate RoxyAPI into an app: to find which endpoint or SDK method to use, what parameters a call takes, how to authenticate, or how to wire a feature end to end. Pass the user question verbatim as `query`. If the first results miss, rephrase once and retry.",
          "inputSchema": {
            "examples": [
              {
                "query": "how do I authenticate an API request"
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max hits to return. Default 10, capped at 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "User question or keywords. Free text. The whole question works better than guessed keywords.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hits": {
                "items": {
                  "properties": {
                    "rank": {
                      "type": "number"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "source_type": {
                      "enum": ["guide", "agents", "template", "openapi", "component"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["rank", "snippet", "source_type", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["hits"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f51dc85c0710ec9c003e25dbc549704b1bb41e3e321d7d82a8ddbe11713d5ce0"
        }
      ],
      "digest": "sha256:ef67dff61f43dc8cc436c8bf41c734af60aae9d1b7560e3425b85ee96cf27a9c"
    }
  }
}
