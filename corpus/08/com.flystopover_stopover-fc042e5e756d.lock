        {
          "name": "plan_trip",
          "title": "Plan a multi-city trip",
          "description": "Use this when someone asks which order to visit several cities in, the cheapest way to see them, or the cheapest dates and flights for a multi-city trip (for example: Dallas to Lisbon, Madrid and Paris in May, what order?). Plans a multi-city trip with Stopover. Given a home city, 2 to 7 cities to visit and a date window, it prices every order of the cities and finds the one that costs least (or balances price and travel time, or is fastest), with the dates and the flight or train for each leg. Fares come from free sources (Kiwi.com, Ryanair and recently seen fares) and are estimates at the time shown. Takes about 10 to 90 seconds. Returns the recommended order and dates, the nights in each city, the total per person in USD and how each fare was priced, the saving against the order the cities were listed in, other orders with their prices, each leg with booking links, and a link to the full plan on flystopover.com. A plan still running after about 200 seconds comes back as a plan id to look up later. Does not book anything, and is not for hotels or car rentals.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "airlines_only": {
                "description": "true: book with airlines only. Leaves out fares sold by booking sites like Kiwi.com, so every ticket is bought from the airline and no link goes to a booking site. Default false.",
                "type": "boolean"
              },
              "avoid_airlines": {
                "description": "Airlines not to fly, as names or two letter codes, like [\"Ryanair\", \"W6\"].",
                "items": {
                  "maxLength": 40,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "cities": {
                "description": "The 2 to 7 cities to visit, as city names or airport codes, like [\"Lisbon\", \"Madrid\", \"Paris\"]. Any order unless fixed_order is true.",
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 2,
                "type": "array"
              },
              "end_at": {
                "description": "Where the trip finishes when it is not back home, like \"Chicago\" for a trip that starts in Dubai.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "end_date": {
                "description": "The last day the trip may end (the day back home), YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fixed_order": {
                "description": "true: visit the cities in the order listed, and only choose dates and flights. Default false, which lets the planner choose the order.",
                "type": "boolean"
              },
              "flexible": {
                "description": "true (the default): the trip may start and end on any days inside the window, chosen for price. false: leave on start_date and come back on end_date exactly.",
                "type": "boolean"
              },
              "flights_only": {
                "description": "true: flights only, no trains or buses between cities. Default false, which lets a train or bus take a leg when it is the better buy.",
                "type": "boolean"
              },
              "home": {
                "description": "Where the trip starts, and ends unless end_at is set: a city name or airport code, like \"Dallas\" or \"DFW\".",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "max_days": {
                "description": "The longest the whole trip may be, in days, when the window is wider than the trip should be. Only with flexible dates.",
                "maximum": 60,
                "minimum": 2,
                "type": "integer"
              },
              "max_layover_hours": {
                "description": "The longest layover allowed on a flight, in hours, 1 to 24.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "max_stops": {
                "description": "The most stops one flight may make: 0 for nonstop only, 1 or 2.",
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "description": "What to optimize: cheapest (lowest total price), balanced (price and travel time, the default) or fastest.",
                "enum": ["cheapest", "balanced", "fastest"],
                "type": "string"
              },
              "must_be_in": {
                "description": "Nights that must be spent in a given city, like a wedding in Paris on 2027-06-14: [{\"city\": \"Paris\", \"date\": \"2027-06-14\"}].",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "maxLength": 60,
                      "minLength": 2,
                      "type": "string"
                    },
                    "date": {
                      "description": "YYYY-MM-DD, the night that must be spent in the city.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["city", "date"],
                  "type": "object"
                },
                "maxItems": 7,
                "type": "array"
              },
              "nights": {
                "additionalProperties": false,
                "description": "Nights in each city, as a range, like {\"min\": 2, \"max\": 4}. Without it the planner uses 2 to 4.",
                "properties": {
                  "max": {
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "min": {
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["max", "min"],
                "type": "object"
              },
              "nights_by_city": {
                "description": "Nights for particular cities, overriding nights for those cities, like [{\"city\": \"Paris\", \"min\": 3, \"max\": 3}].",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "maxLength": 60,
                      "minLength": 2,
                      "type": "string"
                    },
                    "max": {
                      "maximum": 30,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "min": {
                      "maximum": 30,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["city", "max", "min"],
                  "type": "object"
                },
                "maxItems": 7,
                "type": "array"
              },
              "protected_only": {
                "description": "true: only tickets sold as one booking, so a missed connection is the airline's problem. Leaves out self-transfer combinations. Default false.",
                "type": "boolean"
              },
              "start_date": {
                "description": "The first day the trip may start, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "travelers": {
                "description": "How many people travel together on the same flights, 1 to 9. Default 1. Prices are given per person and for the group.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cities", "end_date", "home", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "items": {
                  "additionalProperties": false,
