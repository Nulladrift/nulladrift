                "minLength": 3,
                "type": "string"
              },
              "url": {
                "description": "Address of one public web page, for example https://example.com/blog/guide. Pass url or domain, not both needed. With url the page is rated for five AI citation signals and its domain files are checked too. A bare domain means https.",
