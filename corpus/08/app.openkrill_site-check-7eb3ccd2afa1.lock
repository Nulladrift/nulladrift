        {
          "name": "check_ai_crawler_access",
          "title": "Check AI crawler access in robots.txt",
          "description": "Checks whether 14 AI crawlers may fetch a page. Use it when the user asks whether AI crawlers can read a website or page, for example \"can AI crawlers read example.com?\", \"is GPTBot blocked in my robots.txt?\" or \"which AI bots are allowed on https://example.com/blog?\". Pass the page address. Returns, for 14 AI crawlers, whether robots.txt allows the page and the rule that decided it, plus the sitemaps, the redirect chain, and the page's X-Robots-Tag header and robots meta tag. It requests the page as ChatGPT-User, OAI-SearchBot, GPTBot, ClaudeBot, PerplexityBot and a browser, and says if ChatGPT can read it in one verdict (readable, blocked by CDN or WAF, blocked by robots, needs JavaScript, redirect problem, needs sign-in) with the fix. That test is by user agent from Agent Tools servers, not from OpenAI's addresses. Do not use it for private or local addresses, for security scans, or to collect a site's content.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Address of a public web page, for example https://example.com/pricing. A bare domain such as example.com means https. Only public http and https sites on the standard ports are checked.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "blockedCrawlers": {
                "description": "Tokens of the crawlers robots.txt blocks on this page.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "crawlers": {
                "items": {
                  "properties": {
                    "allowed": {
                      "description": "Whether robots.txt allows this crawler on the page. null means robots.txt could not be read, so there is no verdict.",
                      "type": ["boolean", "null"]
                    },
                    "crawler": {
                      "description": "User-agent token, such as GPTBot.",
                      "type": "string"
                    },
                    "operator": {
                      "description": "Company that runs the crawler.",
                      "type": "string"
                    },
                    "purpose": {
                      "description": "What the crawler collects for, such as training or search.",
                      "type": "string"
                    },
                    "rule": {
                      "description": "The robots.txt line that decided it, such as Disallow: /.",
                      "type": "string"
                    }
                  },
                  "required": ["allowed", "crawler", "operator", "purpose"],
                  "type": "object"
                },
                "type": "array"
              },
              "failure": {
                "description": "Why the page was not reached or read, such as a timeout or a refused redirect.",
                "type": "string"
              },
              "finalUrl": {
                "description": "Address of the final page after redirects.",
                "type": "string"
              },
              "metaRobots": {
                "description": "The page's robots meta tag.",
                "type": "string"
              },
              "notes": {
                "description": "Plain-language caveats to pass on with the result.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "description": "As-of caveat: what the site sent to Agent Tools at that moment, not what every crawler sees.",
                "type": "string"
              },
              "reachable": {
                "description": "False when no page answered; failure then says why.",
                "type": "boolean"
              },
              "redirects": {
                "description": "Redirect chain from the address to the page.",
                "items": {
                  "properties": {
                    "location": {
                      "description": "Location header of a redirect hop: where it points next.",
                      "type": "string"
                    },
                    "status": {
                      "description": "HTTP status code of this hop, such as 301 or 200.",
                      "type": "integer"
                    },
                    "url": {
                      "description": "Address requested at this hop.",
                      "type": "string"
                    }
                  },
                  "required": ["status", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "robots": {
                "properties": {
                  "httpStatus": {
                    "description": "HTTP status code of robots.txt.",
                    "type": "integer"
                  },
                  "note": {
                    "type": "string"
                  },
                  "sitemaps": {
                    "description": "Sitemap addresses listed in robots.txt.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "status": {
                    "description": "found: rules were read. missing: a 4xx answer, so nothing is restricted. unreachable: a 5xx, no answer, or a web page instead of a robots file, so there is no verdict.",
                    "enum": ["found", "missing", "unreachable"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Address of robots.txt.",
                    "type": "string"
                  }
                },
                "required": ["status", "url"],
                "type": "object"
              },
              "source": {
                "description": "Where the data came from: the website itself.",
                "type": "string"
              },
              "status": {
                "description": "HTTP status code of the final page.",
                "type": "integer"
              },
              "url": {
                "description": "The address checked, after a bare domain became https.",
                "type": "string"
              },
              "xRobotsTag": {
                "description": "The page's X-Robots-Tag response header.",
                "type": "string"
              }
            },
            "required": ["notice", "reachable", "source", "url"],
            "type": "object"
