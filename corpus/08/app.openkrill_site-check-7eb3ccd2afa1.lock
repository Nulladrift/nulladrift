                "maxLength": 100000,
                "type": "string"
              },
              "target": {
                "description": "A domain, host or page address you own, such as example.com or https://app.example.com/dashboard. Not a bare IP: pass a host name that points at the server. The host is checked; a page address also names the page whose scripts are read for keys (the home page otherwise).",
                "maxLength": 260,
