                    }
                  },
                  "required": ["count", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "failure": {
                "description": "Why the page was not reached or read, such as a timeout or a robots.txt disallow for Agent Tools.",
                "type": "string"
              },
              "finalUrl": {
                "description": "Address of the page after redirects.",
                "type": "string"
              },
              "findings": {
                "items": {
                  "properties": {
