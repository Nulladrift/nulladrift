        {
          "name": "trace_redirects",
          "title": "Trace a 301 redirect chain",
          "description": "Traces the redirects and headers of a web address. Use it when the user asks where a web address redirects to, or for a 301 redirect chain, for example \"why does http://example.com end up on another address?\", \"show the redirect chain for this link\" or \"does this site redirect http to https?\". Pass the address. Returns each hop with its status code and target, the final address and status, whether http is upgraded to https, and the main response headers such as cache-control and strict-transport-security. At most 6 redirects are followed. Do not use it for private or local addresses, to read page content, or to scan a site for vulnerabilities.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Address of a public web page, for example https://example.com/pricing. A bare domain such as example.com means https. Only public http and https sites on the standard ports are checked.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "chain": {
                "description": "Each hop in order, ending with the final page.",
                "items": {
                  "properties": {
                    "location": {
                      "description": "Location header of a redirect hop: where it points next.",
                      "type": "string"
                    },
                    "status": {
                      "description": "HTTP status code of this hop, such as 301 or 200.",
                      "type": "integer"
                    },
                    "url": {
                      "description": "Address requested at this hop.",
                      "type": "string"
                    }
                  },
                  "required": ["status", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "failure": {
                "description": "Why the page was not reached or read, such as a timeout or a refused redirect.",
                "type": "string"
              },
              "finalUrl": {
                "description": "Address of the final page after redirects.",
                "type": "string"
              },
              "headers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Main response headers of the final page, such as cache-control.",
                "type": "object"
              },
              "missingSecurityHeaders": {
                "description": "Common security headers the https page lacks.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "description": "Plain-language caveats to pass on with the result.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "description": "As-of caveat: what the site sent to Agent Tools at that moment, not what every crawler sees.",
                "type": "string"
              },
              "reachable": {
                "description": "False when no page answered; failure then says why.",
                "type": "boolean"
              },
              "source": {
                "description": "Where the data came from: the website itself.",
                "type": "string"
              },
              "status": {
                "description": "HTTP status code of the final page.",
                "type": "integer"
              },
              "upgradesToHttps": {
                "description": "True when an http address redirects to https.",
                "type": "boolean"
              },
              "url": {
                "description": "The address checked, after a bare domain became https.",
                "type": "string"
              }
            },
            "required": ["chain", "notice", "reachable", "source", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Trace a 301 redirect chain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Trace a 301 redirect chain",
            "openai/toolInvocation/invoking": "Trace a 301 redirect chain..."
          },
          "digest": "sha256:c130aa8a919fbda5b991c6c5c3a8111cae0c42d9dd7b9992dbb4f63f70f20ce1"
        }
      ],
