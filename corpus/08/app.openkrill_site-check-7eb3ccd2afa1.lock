                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "description": "As-of caveat: what the site sent to Agent Tools at that moment, not what every agent sees.",
                "type": "string"
              },
              "origin": {
                "description": "Origin the sitemap was read from, after redirects.",
                "type": "string"
              },
              "reachable": {
                "description": "False when the site did not answer; failure then says why.",
                "type": "boolean"
