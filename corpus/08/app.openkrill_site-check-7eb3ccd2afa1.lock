      },
      "instructions": "Site SEO & AI Crawler Audit: SEO, AI citation, CRO, leaks. Pass a public page address or domain, such as https://example.com/pricing; a bare domain means https. Private, local or internal addresses are refused: say so, ask for a public address and do not work around it. Report results as what the site published at that moment. robots.txt is a request, not access control; if it is unreachable there is no verdict. If robots.txt disallows a page for Agent Tools, tell the user and do not retry another way. If the site did not answer, give the failure and suggest checking the address or trying later. A link sample is not every page. Content added by JavaScript is not seen. The landing check is a checklist, not a forecast. exposure_check refuses a bare IP: ask for a host name. The first call usually returns ownership_not_proven with publicFindings (headers, robots.txt paths, admin paths by status) and a DNS TXT record and a file: give the public findings, tell the user exactly what to publish, then call exposure_check again with the same target once it is live. Lead with exposed or clean and the top risks with one fix each, then the evidence, and say open ports are not checked. Only confirmed findings have a severity. For needs verification, give the unknown fact and how the owner checks it. For legal signals, give law, finding, fix and source, list not checked ones with their reason, and say once it is not legal advice. Pass one marketing email as email when the user asks about email. Never repeat a key beyond the masked prefix. ai_app_check is for an app made with an AI app builder: lead with exposed or clean and each finding with its exact fix; give headerFix.snippet as a code block with where it goes. Without proof it returns header results and the token to publish: give both. Say database checks read only status and row counts, and that write rules are not tested. For launch readiness, give launchList: the failing items with their fix first, then the warnings, and say the owner checks the rest; pass checklist true when the user wants that list. For pre-launch pages, give shipNaked: each fail or warn with its finding, then its snippet as a code block to paste, and say once it is not legal advice. Never use exposure_check on a target the user does not own, or to look up a person, user name or email. Do not use these tools to scan for vulnerabilities, collect contacts, prices or content, or monitor a site. Site checks also have a tighter limit of their own: at most 4 a minute and 30 every 10 minutes from one network; after a burst_limit answer, wait retry_after_seconds before the next check. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. When the user asks to report a problem with these tools or to request a tool, submit_feedback sends their message to the maintainers; get_feedback_reply reads the reply.",
      "tools": [
        {
          "name": "ai_readiness_check",
          "title": "Check AI readiness of a store or page",
          "description": "Checks if AI agents can read and cite a store or page. Use it when the user asks if AI agents can read a store or cite a page, for example \"does shop.example.com have an llms.txt?\" or \"will AI assistants cite this page?\". Pass url for a page, or domain for domain files only. Returns whether it has /llms.txt (llmstxt.org), /agents.md, the UCP file at /.well-known/ucp (version, services) and /sitemap.xml, and which of 14 AI crawlers robots.txt (RFC 9309) blocks site-wide. With a page it also rates five citation signals (summary near the top, author credentials, Q&A format, heading structure, structured data) as pass, warn or fail with evidence and a fix. It requests only robots.txt, these files, the page and its Markdown copy, skips what robots.txt disallows for Agent Tools, and shows what is published, not whether an agent can buy. Do not use it for private or local addresses, to read page content, or to scan for vulnerabilities.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "domain": {
                "description": "Host name of a public store or website, for example shop.example.com. Pass url or domain, not both needed. With domain only the domain files are checked (llms.txt, agents.md, UCP, sitemap, AI crawler rules).",
