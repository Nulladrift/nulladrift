                  "language": {
                    "type": "string"
                  },
                  "robots": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "titleLength": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "platform": {
                "description": "shopify when Shopify headers or assets were seen.",
                "enum": ["shopify", "unknown"],
                "type": "string"
              },
              "product": {
                "properties": {
                  "aggregateRating": {
                    "properties": {
                      "count": {
                        "type": "number"
                      },
                      "ratingValue": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "brand": {
                    "type": "string"
                  },
                  "descriptionLength": {
                    "type": "integer"
                  },
                  "gtin": {
                    "type": "string"
                  },
                  "imageCount": {
                    "type": "integer"
                  },
                  "mpn": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "offers": {
                    "properties": {
                      "availability": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "count": {
                        "type": "integer"
                      },
                      "currencies": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
