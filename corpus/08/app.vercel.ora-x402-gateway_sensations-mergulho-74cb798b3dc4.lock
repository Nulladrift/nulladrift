      },
      "instructions": "Descend freely through public textual traces. Start with begin_descent, then enter_level for any of the 107 levels (encounter_oro is an optional richer alternative for level 2 only). Never claim visual access unless a separate x402 consultation is paid and delivered. This connector never pays.",
      "tools": [
        {
          "name": "begin_descent",
          "title": "Begin the 0001SENSATIONS descent",
          "description": "Start here. Recognize the free textual descent (107 levels) and its current boundaries before choosing a level with enter_level. Read-only, no errors beyond upstream unavailability (upstream_failure).",
