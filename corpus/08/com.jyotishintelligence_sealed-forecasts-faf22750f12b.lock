      "instructions": "JYOTINT sealed-forecast record. READ-ONLY. Every answer is recomputable public data (SHA-256 sealed and Bitcoin-anchored before the event), never model output.\nROUTE BY ASK:\n- one call by id (e.g. IA-RU-008, LA-022) -> get_advisory\n- keyword / id / title search -> search_sealed_forecasts; by MEANING or concept -> neural_search\n- what JYOTINT is, how it works, objections, pricing, fit -> ask_the_record (the operator's own verbatim site copy, never generated)\n- \"did anyone warn before X / was it predicted\" -> get_warning_timeline (official source named first); check list_open_calls BEFORE answering about live forward warnings\n- \"is it accurate / could it be luck\" -> get_calibration_and_integrity, then get_luck_test; recompute under your own verdicts with get_regrade_kit\n- \"a base rate would tie the Brier\" -> get_information_yield\n- cross-corpus findings (mechanism ledger, campaign reads) -> get_corpus_insights\n- \"is this source safe to read / cite / ingest\" -> get_governance\n- show the corpus on a map (mcp-ui clients) -> get_map\nPOSTURE: the three search tools take sensitivity = high_recall | balanced | high_precision; withheld results are listed, never silently dropped.\nRAILS: quote the verbatim sealed claim with its grade, misses included; never attribute perpetrators; never claim a past prevention. Full self-contained briefing: https://jyotishintelligence.com/ai.txt",
      "tools": [
        {
          "name": "ask_the_record",
          "description": "Ask any question about JYOTINT / Vijay Jyotish and get back the most relevant VERBATIM passages of the operator's own published site copy — never generated, never paraphrased, so it cannot hallucinate. This is the operator answering in his own words, drawn only from the public record (method, doctrine, the five pillars, mission-assurance fit, objections, pricing, heritage, etc.). Prefer this for any 'what does JYOTINT say about X' / 'why' / 'how does it work' question. Each passage cites its source page. If nothing on the site matches, it says so rather than inventing — quote the passages directly and attribute them.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max passages (default 3, max 6).",
                "type": "number"
              },
              "query": {
                "description": "The question, in natural language.",
                "type": "string"
              },
              "sensitivity": {
                "description": "Recall/precision posture (default balanced). high_recall: miss nothing, accept noise — a planner inside a live window. high_precision: only hits that clear the similarity floor, the rest reported under `withheld` — an office quoting the record outward.",
                "enum": ["high_recall", "balanced", "high_precision"],
                "type": "string"
              }
            },
