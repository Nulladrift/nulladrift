{
  "lockfileVersion": 2,
  "subjects": {
    "app.footballfinder/football-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.footballfinder.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "football-finder",
        "title": "Football Finder",
        "version": "0.3.0",
        "websiteUrl": "https://footballfinder.app",
        "icons": [
          {
            "src": "https://mcp.footballfinder.app/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Football Finder lists upcoming football matches worldwide, with their grounds, teams, ticket prices and places nearby.\nresolve_entities turns names into Football Finder ids; the other tools take those ids.\nMatches, grounds and teams in results carry a `url` to their footballfinder.app page, and a related id carries a matching field, such as `stadiumUrl` beside `stadiumId`.\nFootball Finder's data does not include betting odds, predictions or injury news.",
      "tools": [
        {
          "name": "find_trip_windows",
          "title": "Plan a football trip",
          "description": "Finds runs of days for seeing several matches, scored by the matches a visitor could attend. Use it for trip planning, such as a few days in a city or when to travel to see a team. Accepts a city slug, team or competition ids, a date range and a trip length; with no filters it returns the top trips anywhere.",
          "inputSchema": {
            "properties": {
              "citySlug": {
                "description": "City slug from resolve_entities, for \"a few days in <city>\".",
                "maxLength": 80,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "from": {
                "description": "Earliest date, YYYY-MM-DD.",
                "type": "string"
              },
              "leagueIds": {
                "description": "For \"trips around <league>\".",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "limit": {
                "description": "How many trips to return at most.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "maxDays": {
                "description": "Longest trip, in days.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "minGames": {
                "description": "Fewest matches worth the trip.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "teamIds": {
                "description": "For \"trips to see <team>\".",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "to": {
                "description": "Latest date, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a football trip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:e6a97ab4378d1130fbec94785f42983d25cf97d4038368c09ec0e4b6d16a2450"
        },
        {
          "name": "get_city_guide",
          "title": "City guide",
          "description": "Returns Football Finder's short highlights for visitors to a city, and how many places to eat, drink and see it lists, with the page that shows them. Use it for what to do around a match. No highlights and no places mean the city is not covered yet.",
          "inputSchema": {
            "properties": {
              "citySlug": {
                "description": "City slug from resolve_entities or find_trip_windows.",
                "maxLength": 80,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["citySlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "City guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:f2cb53319b50e978f984734b53aec2f8a0fa58258cfc11d63f09a1ee40c27003"
        },
        {
          "name": "get_match",
          "title": "Match details",
          "description": "Returns one match: kickoff in local time, venue, competition, recent form, head-to-head, league positions, players to watch, the cheapest ticket price held, and a written preview when one exists. Use it for questions about a specific match. The match url opens its footballfinder.app page, which lists the ticket sellers.",
          "inputSchema": {
            "properties": {
              "fixtureId": {
                "description": "Match id, from search_fixtures, find_trip_windows or an earlier result.",
                "type": "string"
              }
            },
            "required": ["fixtureId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Match details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:23cf98e97ecbbabe4136a5da3a3d9f94534f50e6d39bb12dd153a1f9d0a84d92"
        },
        {
          "name": "get_match_description",
          "title": "Match write-up",
          "description": "Returns Football Finder's written description of a match. Use it when the user wants background on a match. status \"none\" means no description has been written for that match.",
          "inputSchema": {
            "properties": {
              "fixtureId": {
                "description": "Match id, from search_fixtures, find_trip_windows or an earlier result.",
                "type": "string"
              }
            },
            "required": ["fixtureId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Match write-up"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:b0c50ab00fd58f10ad5a2b2020df387ca2b8dd16c0f0507df4be678b37df050a"
        },
        {
          "name": "get_stadium",
          "title": "Ground details and getting there",
          "description": "Returns a ground's city, capacity, surface and resident clubs, the nearest train, metro and bus stops with walking times, and atmosphere notes by stand when held. It also returns how many places to eat, drink and stay near the ground Football Finder lists, with the page that shows them. Use it for questions about a ground or getting there. With \"from\" set to a place name or address, it also returns the straight-line distance from that place. It holds no routes, lines or journey times.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Only when the user asks how far the ground is from somewhere. my_location uses the location the user shared; place looks up a hotel name or address they typed (pass it as \"query\", as they wrote it).",
                "properties": {
                  "kind": {
                    "description": "my_location: the location the user shared; place: a place given in query.",
                    "enum": ["my_location", "place"],
                    "type": "string"
                  },
                  "query": {
                    "description": "With kind place: the hotel name or address, as the user wrote it.",
                    "maxLength": 160,
                    "minLength": 2,
                    "type": "string"
                  }
                },
                "required": ["kind"],
                "type": "object"
              },
              "stadiumId": {
                "description": "Stadium id, from resolve_entities, search_fixtures, get_team or an earlier result.",
                "type": "string"
              }
            },
            "required": ["stadiumId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ground details and getting there"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:b5b66fee30756b5b7c9d1b748c19b50c1de669aa3fd1d9c28b16495550b14054"
        },
        {
          "name": "get_team",
          "title": "Team details",
          "description": "Returns a team's country, founding year and coach and, on request, players to watch, last five results and full squad. Use it for questions about a team.",
          "inputSchema": {
            "properties": {
              "include": {
                "description": "What to add to the basics. Default: stars and form. Ask for squad only when needed.",
                "items": {
                  "enum": ["squad", "stars", "form"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "teamId": {
                "description": "Team id, from resolve_entities or an earlier result.",
                "type": "string"
              }
            },
            "required": ["teamId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Team details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:12bf13a25d5d712f7eaa3a0cdc7a572bba4ada600cfb8c71955ea2043cb73e9a"
        },
        {
          "name": "get_tickets",
          "title": "Ticket prices",
          "description": "Returns the ticket options held for a match, cheapest first, with prices in the venue's currency. Use it for ticket questions. \"partnerListings\": 0 means no ticket marketplace lists the match yet. The match url opens its page, which lists every seller.",
          "inputSchema": {
            "properties": {
              "fixtureId": {
                "description": "Match id, from search_fixtures, find_trip_windows or an earlier result.",
                "type": "string"
              }
            },
            "required": ["fixtureId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ticket prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:c3e661a93a4b9e29d02d0e96884ac049322603615a2fba8c6d966468d60988de"
        },
        {
          "name": "resolve_entities",
          "title": "Find teams, competitions, places and grounds",
          "description": "Looks up teams, competitions, countries, cities and stadiums by English name and returns their Football Finder ids, which the other tools take. Use it first whenever the user names a team, competition or place. Names with no match are listed as unresolved, with the closest name held when there is one. Names that fit several entries, such as smaller clubs that share a name in different countries, are listed as ambiguous with each option and its country; well-known clubs and competitions resolve directly.",
          "inputSchema": {
            "properties": {
              "cities": {
                "description": "City names in English.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "country": {
                "description": "A country name in English.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "leagues": {
                "description": "Competition names in canonical English, e.g. \"Premier League\".",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "stadiums": {
                "description": "Stadium names as usually written, e.g. \"Signal Iduna Park\".",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "teams": {
                "description": "Club or national-team names in canonical English, e.g. \"Real Madrid\".",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find teams, competitions, places and grounds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:fbb960cfa3936013fb3f9b54d62da4364ab395abf52591ee26e890c0ab3d9fa6"
        },
        {
          "name": "search_fixtures",
          "title": "Search matches",
          "description": "Lists matches in a date window, filtered by Football Finder ids for teams, competitions or stadiums, by a point and radius, by a city slug or by a country code. Use it for \"what is on\" questions. Returns up to 25 matches in kickoff order, or biggest competitions first; \"truncated\": true means more exist. When the window has no matches, it also returns the next matches with the same filters and, for a single stadium, other grounds nearby on the same dates.",
          "inputSchema": {
            "properties": {
              "citySlug": {
                "description": "A city slug from resolve_entities. Use when it gave no centre.",
                "maxLength": 80,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "countryCode": {
                "description": "Country code from resolve_entities, e.g. \"ES\" or \"GB-ENG\".",
                "pattern": "^[A-Z]{2}(-[A-Z]{3})?$",
                "type": "string"
              },
              "from": {
                "description": "Window start, YYYY-MM-DD or ISO datetime.",
                "type": "string"
              },
              "leagueIds": {
                "description": "League ids from resolve_entities.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "limit": {
                "description": "How many matches to return at most.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A city centre and radius, as resolve_entities returns them.",
                "properties": {
                  "lat": {
                    "description": "Latitude of the centre.",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lng": {
                    "description": "Longitude of the centre.",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "radiusKm": {
                    "description": "Search radius in km, up to 200.",
                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["lat", "lng", "radiusKm"],
                "type": "object"
              },
              "orderBy": {
                "description": "kickoff (default) or priority (biggest competitions first).",
                "enum": ["kickoff", "priority"],
                "type": "string"
              },
              "stadiumIds": {
                "description": "Stadium ids from resolve_entities or an earlier result.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "teamIds": {
                "description": "Team ids from resolve_entities.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "teamSide": {
                "description": "With teamIds: home games only, away only, or both (default).",
                "enum": ["home", "away", "any"],
                "type": "string"
              },
              "to": {
                "description": "Window end, YYYY-MM-DD (that whole day is included) or ISO datetime.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search matches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:c9b02f39e4dc47f590ae549169ebd97b78d29d13bd3aac3ea5a0f40b06b0180b"
        }
      ],
      "digest": "sha256:fd9bd4d3c3aafaf03feff98d04b588219104f96aa255f26ecc927a2e19b2f573"
    }
  }
}
