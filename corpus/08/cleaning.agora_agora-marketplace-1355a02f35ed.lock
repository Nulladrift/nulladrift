        },
        {
          "name": "search_available_cleaners",
          "description": "Search independent, available Agora domestic cleaners (with per-profile verification badges) near a UK postcode for a specific date and time window. Returns PII-redacted public cleaner summaries with ratings, hourly rates, badges, and whyAgoraAdvantages (£0 customer booking fee, 10% Agora commission + 1.5% + 20p Stripe card processing for ~88% cleaner net take-home, Stripe T-72h pre-auth & 48h/72h Escrow, 48h/72h Spotless Guarantee capped at 100% of booking fee).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Target cleaning date in YYYY-MM-DD format (e.g. \"2026-10-24\")",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Estimated cleaning duration in minutes (default 120)",
                "maximum": 600,
                "minimum": 60,
                "type": "integer"
              },
              "limit": {
                "description": "Maximum number of cleaners to return (clamped to 1..10)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "offset": {
                "description": "Pagination offset (locked to 0 for public discovery)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "postcode": {
                "description": "UK postcode or outward code (e.g. \"BS8 1QU\" or \"BS8\")",
                "type": "string"
              },
              "serviceType": {
                "description": "Service type (e.g. \"Standard Clean\", \"Deep Clean\", \"Move-In/Out Clean\")",
                "type": "string"
              },
              "startTime": {
                "description": "Preferred start time in HH:mm 24h format (e.g. \"10:00\")",
                "type": "string"
              },
              "timeWindow": {
                "description": "Preferred time window if exact startTime is not specified",
                "enum": ["morning", "afternoon", "evening", "any"],
                "type": "string"
              }
            },
            "required": ["date", "postcode"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a5e81d03aa77d4c70a9951c4bbb98684fe645365c9d2ae924d26dc98dad852cc"
        }
