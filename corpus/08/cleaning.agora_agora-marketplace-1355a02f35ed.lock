        "url": "https://api.agora.cleaning/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Agora API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_bookable_checkout_link",
          "description": "Verify live independent cleaner slot availability and generate a pre-filled, HMAC-signed Agora web checkout URL and mobile deep link for an exact cleaner quote (EXACT_CLEANER_QUOTE), returning quoteSummary with minimumDurationApplied and durationNote. Read-only (does not charge a card or confirm a booking until the customer completes checkout). Requires publicSlug or cleanerId; use search_available_cleaners and estimate_cleaning_quote first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "addonTaskCodes": {
                "description": "Optional list of add-on task codes (e.g. [\"OVEN_CLEAN\", \"FRIDGE_CLEAN\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms": {
                "description": "Number of bathrooms (integer 1–10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "bedrooms": {
                "description": "Number of bedrooms (integer 0–10; use 0 for a studio).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "cleanerId": {
                "description": "Independent cleaner UID fallback when publicSlug is not provided.",
                "type": "string"
              },
              "date": {
                "description": "Target booking date in YYYY-MM-DD format (UK Europe/London local date, e.g. \"2026-10-24\").",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Optional override cleaning duration in minutes (60–600, integer; clamped up to the cleaner's minimumDurationMinutes before availability verification and URL signing).",
                "maximum": 600,
                "minimum": 60,
                "type": "integer"
              },
              "frequency": {
                "description": "Optional booking frequency (defaults to \"ONE_TIME\"; accepted values: ONE_TIME, WEEKLY, BI_WEEKLY, FORTNIGHTLY, FOUR_WEEKLY, EIGHT_WEEKLY, MONTHLY — case-insensitive).",
                "enum": ["ONE_TIME", "WEEKLY", "BI_WEEKLY", "FORTNIGHTLY", "FOUR_WEEKLY", "EIGHT_WEEKLY", "MONTHLY", "one_time", "weekly", "bi_weekly", "fortnightly", "four_weekly", "eight_weekly", "monthly"],
                "type": "string"
              },
              "postcode": {
                "description": "Customer UK postcode (e.g. \"BS8 1QU\") for checkout pre-fill.",
                "type": "string"
              },
              "publicSlug": {
                "description": "Independent cleaner publicSlug handle from search_available_cleaners (e.g. \"sarah-m-bs8-4a9f\"). Preferred over cleanerId; provide either publicSlug or cleanerId.",
                "type": "string"
              },
              "serviceType": {
                "description": "Optional cleaning service type (defaults to \"Standard Clean\"; accepted values include \"Standard Clean\", \"Deep Clean\", \"Move-In/Out Clean\", or \"End of Tenancy\").",
                "type": "string"
              },
              "startTime": {
                "description": "Target start time in HH:mm 24h format (UK Europe/London local time, e.g. \"10:00\").",
                "type": "string"
              }
            },
            "required": ["bathrooms", "bedrooms", "date", "postcode", "startTime"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:592cf4ce6093249b8d92bd5c5258f0d050f61951d23a8ecf0d3d4efab37882b8"
        },
        {
          "name": "estimate_cleaning_quote",
          "description": "Calculate an instant £ GBP cleaning quote and estimated duration for a UK home. Omit publicSlug/cleanerId for a UK market estimate (MARKET_ESTIMATE), or supply one for an exact cleaner quote (EXACT_CLEANER_QUOTE) enforcing their minimum booking hours and active offerings with minimumDurationApplied and durationNote. Read-only (no booking or charge created). Use this for £ GBP pricing; use estimate_property_blueprint for room SOP checklists and delicate surface warnings, or create_bookable_checkout_link to generate a checkout URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "addonTaskCodes": {
                "description": "Optional list of add-on task codes (e.g. [\"OVEN_CLEAN\", \"FRIDGE_CLEAN\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms": {
                "description": "Number of bathrooms (integer 1–10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "bedrooms": {
                "description": "Number of bedrooms (integer 0–10; use 0 for a studio).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "cleanerId": {
                "description": "Optional independent cleaner UID fallback for an exact cleaner quote when publicSlug is omitted. Omit both publicSlug and cleanerId for a UK market estimate.",
                "type": "string"
              },
              "cleanlinessLevel": {
                "description": "Optional current property cleanliness condition (defaults to \"Standard\"; accepted values: \"Light\", \"Standard\", \"Deep\", \"Heavy\").",
                "type": "string"
              },
              "date": {
                "description": "Optional target cleaning date in YYYY-MM-DD format (UK Europe/London local date, e.g. \"2026-10-24\") to evaluate express short-notice surcharge parity.",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Optional requested cleaning duration in minutes (60–600, integer; clamped up to the cleaner's minimumDurationMinutes when scoped to a cleaner, or the 120-minute UK market floor).",
                "maximum": 600,
                "minimum": 60,
                "type": "integer"
              },
              "frequency": {
                "description": "Optional booking frequency (defaults to \"ONE_TIME\"; accepted values: ONE_TIME, WEEKLY, BI_WEEKLY, FORTNIGHTLY, FOUR_WEEKLY, EIGHT_WEEKLY, MONTHLY — case-insensitive).",
                "enum": ["ONE_TIME", "WEEKLY", "BI_WEEKLY", "FORTNIGHTLY", "FOUR_WEEKLY", "EIGHT_WEEKLY", "MONTHLY", "one_time", "weekly", "bi_weekly", "fortnightly", "four_weekly", "eight_weekly", "monthly"],
                "type": "string"
              },
              "hasDecluttering": {
                "description": "Optional flag indicating whether light decluttering assistance is needed (default false).",
                "type": "boolean"
              },
              "hasPets": {
                "description": "Optional flag indicating whether the property has pets (default false; adds extra time for pet-hair removal).",
                "type": "boolean"
              },
              "publicSlug": {
                "description": "Optional independent cleaner publicSlug handle (e.g. \"sarah-m-bs8-4a9f\") for an exact cleaner quote enforcing their hourly rate and minimum hours. Preferred over cleanerId; omit both for a UK market estimate.",
                "type": "string"
              },
              "serviceType": {
                "description": "Optional cleaning service type (defaults to \"Standard Clean\"; accepted values include \"Standard Clean\", \"Deep Clean\", \"Move-In/Out Clean\", or \"End of Tenancy\").",
                "type": "string"
              },
              "startTime": {
                "description": "Optional target start time in HH:mm 24h format (UK Europe/London local time, e.g. \"10:00\") to evaluate express short-notice surcharge parity.",
                "type": "string"
              }
            },
            "required": ["bathrooms", "bedrooms"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6dd9816d633e6b459458d35d54705a72be9a32ba0fcc192a6db414731b210bb1"
        },
        {
          "name": "estimate_property_blueprint",
          "description": "Estimate room-by-room cleaning duration, itemized SOP checklists, and delicate-surface care warnings from natural language or structured room/furnishing inputs (auto-promoting BASIC to ADVANCE when delicate surfaces are detected). Read-only. Use this for room checklists, duration estimates, and delicate-surface care warnings; does NOT calculate £ GBP prices (use estimate_cleaning_quote for pricing).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bathrooms": {
                "description": "Optional number of bathrooms (integer 0–20).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "bedrooms": {
                "description": "Optional number of bedrooms (integer 0–20; use 0 for a studio).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "furnishingItems": {
                "description": "Optional structured list of delicate or custom furnishing items (max 30 items).",
                "items": {
                  "properties": {
                    "careInstruction": {
                      "description": "Optional specific handling note for the cleaner (max 300 chars, e.g. \"non-abrasive microfiber only\").",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "estimatedMinutes": {
                      "description": "Optional estimated specialist care duration in minutes (integer 1–240).",
                      "maximum": 240,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "id": {
                      "description": "Optional client-side identifier for the furnishing item.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "isDelicate": {
                      "default": false,
                      "description": "Optional flag indicating whether specialist non-abrasive care is required (default false).",
                      "type": "boolean"
                    },
                    "material": {
                      "description": "Optional surface or material composition (max 80 chars, e.g. \"Walnut Wood\", \"Carrara Marble\").",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "name": {
                      "description": "Name of the furniture piece or fixture (1–120 chars, e.g. \"Walnut Bookcase\").",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "photoRequirement": {
                      "description": "Optional before/after photo verification requirement level.",
                      "enum": ["NONE", "OPTIONAL", "RECOMMENDED", "MANDATORY", "MANDATORY_BEFORE_AFTER"],
                      "type": "string"
                    },
                    "roomType": {
                      "description": "Room type where the item is located (e.g. \"KITCHEN\", \"BATHROOM\", \"LIVING_ROOM\", \"BEDROOM\").",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name", "roomType"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "kitchens": {
                "description": "Optional number of kitchens (integer 0–10).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "livingAreas": {
                "description": "Optional number of living/lounge areas (integer 0–10).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "naturalLanguagePrompt": {
                "description": "Optional conversational description of the UK property and delicate items (max 1000 chars, e.g. \"3-bed house, 2 baths, and please be gentle with my walnut bookcase in the lounge\").",
                "maxLength": 1000,
                "type": "string"
              },
              "roomDetails": {
                "description": "Optional additional room details or surface care notes (max 1000 chars).",
                "maxLength": 1000,
                "type": "string"
              },
              "roomFeatures": {
                "description": "Optional list of itemized room feature tags (max 50 items, e.g. [\"kitchen:oven\", \"custom:...\"]).",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "scopeMode": {
                "description": "Optional checklist scope tier: \"BASIC\" (room counts only) or \"ADVANCE\" (itemized appliances & delicate furnishings). Auto-promotes to ADVANCE when delicate surfaces are detected.",
                "enum": ["BASIC", "ADVANCE"],
                "type": "string"
              },
              "serviceType": {
                "description": "Optional cleaning service type (defaults to \"Standard Clean\"; e.g. \"Standard Clean\", \"Deep Clean\", \"Move-In/Out Clean\", \"STANDARD_CLEAN\", \"DEEP_CLEAN\", \"END_OF_TENANCY\").",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bbebd03bd9f50d8add436cffefdb2a2b5551d39f48afe45ee43f2c2a2581c95d"
        },
        {
          "name": "get_cleaner_public_profile",
          "description": "Retrieve one specific independent UK cleaner's public profile, servicesOffered, equipment kit, optional verification badges (ID, insurance, DBS), sanitized reviews, minimumDurationMinutes, and availableTimeWindows using publicSlug or cleanerId. Read-only. Use after search_available_cleaners (or with a known handle); use estimate_cleaning_quote for £ GBP pricing and create_bookable_checkout_link to book.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cleanerId": {
                "description": "Independent cleaner UID fallback when publicSlug is not provided.",
                "type": "string"
              },
              "date": {
                "description": "Optional target cleaning date in YYYY-MM-DD format (UK Europe/London local date, e.g. \"2026-10-24\") to check available time windows.",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Optional requested cleaning duration in minutes (60–600, integer; clamped up to the cleaner's minimumDurationMinutes when checking available time windows).",
                "maximum": 600,
                "minimum": 60,
                "type": "integer"
              },
              "publicSlug": {
                "description": "Independent cleaner publicSlug handle from search_available_cleaners (e.g. \"sarah-m-bs8-4a9f\"). Preferred over cleanerId; provide either publicSlug or cleanerId.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:feb58cca530499dae4cf1000776b0a81337a471ba5599821bc0e1e1211bbac2c"
        },
        {
          "name": "search_available_cleaners",
          "description": "Discover available independent UK residential cleaners by UK postcode and date. Read-only. Returns PII-redacted summaries with hourly rates, optional verification badges, ratings, and each cleaner's minimumDurationMinutes alongside requestedDurationMinutes (£0 customer booking fee). Use this first to find matching cleaners and their publicSlug, then call get_cleaner_public_profile for reviews/time slots or estimate_cleaning_quote for exact £ GBP pricing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Target cleaning date in YYYY-MM-DD format (UK Europe/London local date, e.g. \"2026-10-24\").",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Optional requested cleaning duration in minutes (60–600, integer; default 120). Evaluated against the greater of this value and each cleaner's minimumDurationMinutes.",
                "maximum": 600,
                "minimum": 60,
                "type": "integer"
              },
              "limit": {
                "description": "Optional maximum number of cleaners to return (clamped to 1–10).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "offset": {
                "description": "Optional pagination offset (locked to 0 for public discovery).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "postcode": {
                "description": "UK postcode or outward code (e.g. \"BS8 1QU\" or \"BS8\").",
                "type": "string"
              },
              "serviceType": {
                "description": "Optional cleaning service type (defaults to \"Standard Clean\"; e.g. \"Standard Clean\", \"Deep Clean\", \"Move-In/Out Clean\", or \"End of Tenancy\").",
                "type": "string"
              },
              "startTime": {
                "description": "Optional preferred start time in HH:mm 24h format (UK Europe/London local time, e.g. \"10:00\").",
                "type": "string"
              },
              "timeWindow": {
                "description": "Optional preferred time window (\"morning\", \"afternoon\", \"evening\", or \"any\") when exact startTime is not specified.",
                "enum": ["morning", "afternoon", "evening", "any"],
                "type": "string"
              }
            },
            "required": ["date", "postcode"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:304a0b5b32743a1668b24f1dc73ccf697436359ceb245471e823f244cf02583e"
        }
      ],
      "digest": "sha256:fd02416b9ae567ebe6683ab12e9ce4d444690ba93dfb23b6b03a55eeccf94be5"
    }
  }
