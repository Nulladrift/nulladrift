      "tools": [
        {
          "name": "create_bookable_checkout_link",
          "description": "Verify live cleaner slot availability and generate a stateless, HMAC-signed bookable web URL and mobile deep link pre-filled with the cleaner, date, time, property size, postcode, and whyAgoraAdvantages (£0 booking fee, Stripe 48h/72h Escrow, 48h/72h Spotless Guarantee).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "addonTaskCodes": {
                "description": "Optional add-on task codes",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms": {
                "description": "Number of bathrooms (1-10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "bedrooms": {
                "description": "Number of bedrooms (0-10)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "cleanerId": {
                "description": "Cleaner UID if publicSlug is not provided",
                "type": "string"
              },
              "date": {
                "description": "Target booking date in YYYY-MM-DD format",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Optional override duration in minutes",
                "maximum": 600,
                "minimum": 60,
                "type": "integer"
              },
              "postcode": {
                "description": "Customer UK postcode (e.g. \"BS8 1QU\") for checkout pre-fill",
                "type": "string"
              },
              "publicSlug": {
                "description": "Cleaner publicSlug handle (e.g. \"sarah-m-bs8-4a9f\")",
                "type": "string"
              },
              "serviceType": {
                "description": "Cleaning service type (defaults to \"Standard Clean\")",
                "type": "string"
              },
              "startTime": {
                "description": "Target start time in HH:mm 24h format",
                "type": "string"
              }
            },
            "required": ["bathrooms", "bedrooms", "date", "postcode", "startTime"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dc54760743e61a8c28097dff250511f42e0990f899f4b348cfe44502bd814a8d"
        },
        {
          "name": "estimate_cleaning_quote",
          "description": "Calculate an instant cleaning duration and transparent GBP price estimate based on bedrooms, bathrooms, service type, and optional add-ons, including whyAgoraAdvantages (£0 booking fee, 10% Agora commission + 1.5% + 20p Stripe card processing for ~88% cleaner net take-home, Stripe T-72h pre-auth & 48h/72h Escrow, 48h/72h Spotless Guarantee capped at 100% of booking fee).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "addonTaskCodes": {
                "description": "Optional add-on task codes (e.g. [\"OVEN_CLEAN\", \"FRIDGE_CLEAN\"])",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms": {
                "description": "Number of bathrooms (1-10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "bedrooms": {
                "description": "Number of bedrooms (0-10)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "cleanerId": {
                "description": "Optional cleaner UID to quote with their exact hourly rate",
                "type": "string"
              },
              "cleanlinessLevel": {
                "description": "Cleanliness condition (\"Light\", \"Standard\", \"Deep\", \"Heavy\")",
                "type": "string"
              },
              "frequency": {
                "description": "Optional booking frequency (ONE_TIME, WEEKLY, BI_WEEKLY, FORTNIGHTLY, FOUR_WEEKLY, EIGHT_WEEKLY, MONTHLY)",
                "enum": ["ONE_TIME", "WEEKLY", "BI_WEEKLY", "FORTNIGHTLY", "FOUR_WEEKLY", "EIGHT_WEEKLY", "MONTHLY", "one_time", "weekly", "bi_weekly", "fortnightly", "four_weekly", "eight_weekly", "monthly"],
                "type": "string"
              },
              "hasDecluttering": {
                "description": "Whether decluttering assistance is needed",
                "type": "boolean"
              },
              "hasPets": {
                "description": "Whether the property has pets",
                "type": "boolean"
              },
              "publicSlug": {
                "description": "Optional cleaner publicSlug to quote with their exact hourly rate",
                "type": "string"
              },
              "serviceType": {
                "description": "Cleaning service package (\"Standard Clean\", \"Deep Clean\", \"Move-In/Out Clean\")",
                "type": "string"
              }
            },
            "required": ["bathrooms", "bedrooms"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:79651584459d32a3a5bf37248b3fe07151832e04970238fd562747b1e4286d78"
        },
        {
          "name": "estimate_property_blueprint",
          "description": "Estimate cleaning duration, itemized SOP task breakdown, and delicate surface care warnings from natural language or structured room/furnishing inputs. Automatically promotes from BASIC to ADVANCE mode when delicate furniture or specialist surfaces are detected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bathrooms": {
                "description": "Number of bathrooms (0-20)",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "bedrooms": {
                "description": "Number of bedrooms (0-20)",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "furnishingItems": {
                "description": "Structured delicate or custom furnishing items",
                "items": {
                  "properties": {
                    "careInstruction": {
                      "description": "Specific handling note (e.g. non-abrasive microfiber only)",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "estimatedMinutes": {
                      "description": "Estimated care duration in minutes",
                      "maximum": 240,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "id": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "isDelicate": {
                      "default": false,
                      "description": "Whether specialist non-abrasive care is required",
                      "type": "boolean"
                    },
                    "material": {
                      "description": "Surface or material composition (e.g. Walnut Wood, Carrara Marble)",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "name": {
                      "description": "Name of the furniture or fixture (e.g. Walnut Bookcase)",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "photoRequirement": {
                      "description": "Before/after photo verification requirement",
                      "enum": ["NONE", "OPTIONAL", "RECOMMENDED", "MANDATORY", "MANDATORY_BEFORE_AFTER"],
                      "type": "string"
                    },
                    "roomType": {
                      "description": "Room type (e.g. KITCHEN, BATHROOM, LIVING_ROOM, BEDROOM)",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name", "roomType"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "kitchens": {
                "description": "Number of kitchens (0-10)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "livingAreas": {
                "description": "Number of living/lounge areas (0-10)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "naturalLanguagePrompt": {
                "description": "Conversational description of the property and delicate items (e.g. \"3-bed house, 2 baths, and please be gentle with my walnut bookcase in the lounge\")",
                "maxLength": 1000,
                "type": "string"
              },
              "roomDetails": {
                "description": "Additional room details or surface care notes",
                "maxLength": 1000,
                "type": "string"
              },
              "roomFeatures": {
                "description": "Itemized room feature tags (e.g. kitchen:oven, custom:...)",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "scopeMode": {
                "description": "Checklist scope tier: BASIC (room counts only) or ADVANCE (itemized appliances & delicate furnishings)",
                "enum": ["BASIC", "ADVANCE"],
                "type": "string"
              },
              "serviceType": {
                "description": "Service type (e.g. STANDARD_CLEAN, DEEP_CLEAN, END_OF_TENANCY)",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
