        {
          "name": "get_cleaner_public_profile",
          "description": "Retrieve the public profile of an Agora cleaner by their publicSlug or cleanerId, including equipment kit, verified certifications, sanitized review excerpts, and coarsened available time windows.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cleanerId": {
                "description": "Cleaner UID if publicSlug is not provided",
                "type": "string"
              },
              "date": {
                "description": "Optional target date (YYYY-MM-DD) to check available time windows",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Optional duration in minutes for availability check",
                "maximum": 600,
                "minimum": 60,
                "type": "integer"
              },
              "publicSlug": {
                "description": "Cleaner publicSlug handle (e.g. \"sarah-m-bs8-4a9f\")",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
