{
  "lockfileVersion": 2,
  "subjects": {
    "com.falcoscan/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://falcoscan.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "falcoscan",
        "title": "FalcoScan",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FalcoScan tracks 8,000+ AI products across 30 scored markets, including whether each product is still running. Without a key, use lookup_product, ai_graveyard, list_markets and market_overview: public facts, opportunity, saturation and wrapper risk bands, the AI Graveyard and market averages, each with a FalcoScan link to cite. An API key from https://falcoscan.com/data-access adds exact scores and full catalog search.",
      "tools": [
        {
          "name": "ai_graveyard",
          "description": "AI products FalcoScan has verified as shut down or acquired, each with a published source: what happened, the year, the buyer and the market. Filter by year, buyer or market. Up to 25 rows per call, newest first.",
          "inputSchema": {
            "properties": {
              "buyer": {
                "description": "Acquiring company, e.g. \"NVIDIA\".",
                "type": "string"
              },
              "market": {
                "description": "Market name or slug, e.g. \"Coding\" or \"search-seo\".",
                "type": "string"
              },
              "year": {
                "description": "Year it shut down or was acquired, e.g. 2025.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fe23d8979e9f53bed753805ec862f1f639ef154b5aca954be8dcecc1ea5d171"
        },
        {
          "name": "list_markets",
          "description": "Every AI market FalcoScan scores, with its public averages (opportunity, saturation, wrapper share, heat), how many products in it are operating, and a link to its market page.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:608bf33223b99992767059bdc80dfa65ae7f95f20dc8ebab299c52fcdb3d967a"
        },
        {
          "name": "lookup_product",
          "description": "Look up an AI product on FalcoScan by name or website. Returns up to 5 matching products, each with its market, whether it is operating, shut down or acquired (with buyer, year and a source), opportunity, saturation and wrapper risk bands, pricing type, free tier, API, founding year, headquarters, website and a FalcoScan link to cite.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Product name, e.g. \"Cursor\".",
                "type": "string"
              },
              "url": {
                "description": "Product website, e.g. \"cursor.com\". Give a name, a url or both.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:77197e2b1d02c69da0cac251584322dcd0e30230fd10d59b499303bdcc9dc987"
        },
        {
          "name": "market_overview",
          "description": "One AI market: how many products are operating, its public averages, how many of its products shut down or were acquired, and its top 10 operating products in the order its FalcoScan market page lists them, with bands.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "Market name or slug, e.g. \"Healthcare\" or \"human-resources\".",
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b41d9df63b6f9f0d687ccbf8568a5061bf5e7241168a453448df8617b9f366a"
        }
      ],
      "digest": "sha256:70fb78c8be5d66d96449d37c788e6c85534cb75ad0db04a8b53808b17d45b99d"
    }
  }
}
