{
  "lockfileVersion": 2,
  "subjects": {
    "com.kentapplied/data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.kentapplied.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "kent-applied",
        "title": "Kent Applied",
        "version": "1.0.0",
        "description": "Sourced healthcare facts, chart data and research from www.kentapplied.com.",
        "websiteUrl": "https://www.kentapplied.com/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to the healthcare facts, chart data and Insights pages that Kent Applied publishes at www.kentapplied.com. Everything here is already public on the site. Each result links to its page on kentapplied.com, names the original sources and gives the date the figures were checked. Reuse is free with credit to Kent Applied under CC BY 4.0; the original source data keeps its own terms.",
      "tools": [
        {
          "name": "get_chart_data",
          "title": "Get a Kent Applied chart's data",
          "description": "Returns the data behind one chart in the library at kentapplied.com/charts, by its slug. Includes the title, subtitle, data rows, units, how Kent Applied made the chart, the source line and original sources, the date checked, links to the chart page and its CSV download, and the credit line for reuse (CC BY 4.0). Lists longer than 500 items are cut, and the CSV has them all.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The chart's slug, the last part of its address: kentapplied.com/charts/<slug>/.",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_chart_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_chart_dataDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7df4c3122dccf39faac2056a022c88eaf2c576d42bac0c76f04b464a16655620"
        },
        {
          "name": "search_facts",
          "title": "Search Kent Applied facts",
          "description": "Searches the sourced healthcare facts published at kentapplied.com/facts by keyword or topic. Returns up to 10 facts. Each has its number, a one-sentence statement, the original source with where in it the figure appears, the date Kent Applied checked it against that source, a link to the fact's page and the credit line for reuse (CC BY 4.0).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many results to return, from 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "A few keywords, such as 'claim denials' or 'rural hospitals'.",
                "maxLength": 200,
                "minLength": 1,
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_factsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_factsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50626215ce768ef081122a20933b3f56320452eb9b624a49fb9d36f2ac225693"
        },
        {
          "name": "search_insights",
          "title": "Search Kent Applied research and articles",
          "description": "Searches the research, data stories and blog posts published at kentapplied.com/insights by keyword or topic. Returns up to 10 pages. Each has its title, kind, summary, publish date, the sources it names, the date its figures were checked, a link and the credit line (CC BY 4.0).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many results to return, from 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "A few keywords, such as 'claim denials' or 'rural hospitals'.",
                "maxLength": 200,
                "minLength": 1,
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_insightsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_insightsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aed0d6c34ae990b50cd34431bcbe7773fe9b11f93d2b230932635583985952e1"
        }
      ],
      "digest": "sha256:11e2ec4182a818058a421e99c2f0d0d8a13f5d4fe95926a1c1bd0a4b15748388"
    }
  }
}
