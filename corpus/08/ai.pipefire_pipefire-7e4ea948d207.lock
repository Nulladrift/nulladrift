        {
          "name": "analyze_email_headers",
          "title": "Email header analyzer",
          "description": "Read the raw headers of a received email: SPF, DKIM and DMARC results, alignment, the delivery path and delays. Use when someone pastes headers and asks why a message went to spam or failed authentication.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "headers": {
                "description": "The raw email headers (the part above the message body), copied from \"Show original\" in Gmail or \"View source\" in Outlook.",
                "type": "string"
              }
            },
            "required": ["headers"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "One row per authentication or delivery check.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "check": {
                      "description": "What was checked, e.g. SPF, DKIM, DMARC or alignment.",
                      "type": "string"
                    },
                    "finding": {
                      "description": "What the headers show, in one sentence.",
                      "type": "string"
                    },
                    "fix": {
                      "description": "What to change. Empty when nothing needs doing.",
                      "type": "string"
                    },
                    "state": {
                      "enum": ["pass", "warn", "fail"],
                      "type": "string"
                    }
                  },
                  "required": ["check", "finding", "fix", "state"],
                  "type": "object"
                },
                "type": "array"
              },
              "fromDomain": {
                "description": "The sender domain from the From header.",
                "type": ["string", "null"]
              },
              "hops": {
                "description": "How many servers the message passed through.",
                "type": "integer"
              },
              "outOf": {
                "description": "The maximum score: the number of checks run.",
                "type": "number"
              },
              "score": {
                "description": "Checks passed (half points for warnings).",
                "type": "number"
              },
              "toolUrl": {
                "description": "The same check as a free web tool on pipefire.ai.",
                "type": "string"
              },
              "totalSeconds": {
                "description": "Delivery time end to end, when the timestamps allow.",
                "type": ["number", "null"]
              }
            },
            "required": ["checks", "fromDomain", "hops", "outOf", "score", "toolUrl", "totalSeconds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
