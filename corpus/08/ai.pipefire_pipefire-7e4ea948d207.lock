                "type": "integer"
              },
              "readyMailboxes": {
                "description": "Mailboxes warmed and ready to send.",
                "type": "integer"
              },
              "replies": {
                "description": "Prospects who replied this month (auto-replies and bounces excluded).",
                "type": "integer"
              },
              "repliesWaiting": {
                "description": "Replies waiting for the user to answer.",
                "type": "integer"
              },
              "sending": {
                "description": "Campaigns sending now.",
                "type": "integer"
              },
              "sent": {
                "description": "Emails sent this calendar month so far.",
                "type": "integer"
              }
            },
            "required": ["campaigns", "interested", "link", "meetings", "paused", "readyMailboxes", "replies", "repliesWaiting", "sending", "sent"],
