        {
          "name": "check_domain_email_setup",
          "title": "Email authentication check (MX, SPF, DKIM, DMARC)",
          "description": "Check whether a domain is set up to send and receive email properly: MX, SPF, DKIM and DMARC in one go, each with pass/warn/fail, what was found, and how to fix it. Use when someone asks why their email goes to spam, whether their domain is set up right, or before sending cold email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain to check, e.g. example.com. A URL or email address also works.",
