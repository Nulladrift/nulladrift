              "name": {
                "description": "Campaign name. Defaults to audience and place.",
                "maxLength": 160,
                "type": "string"
              },
              "offer": {
                "description": "What you want the email to argue, in your own words. Example: \"we fix their Google reviews in 30 days\".",
                "maxLength": 240,
                "type": "string"
