        {
          "name": "check_blacklists",
          "title": "Email blacklist check",
          "description": "Check whether a domain's sending IPs, or a single IPv4 address, are listed on the major email blacklists (Spamhaus, Barracuda, SpamCop and others). Returns each IP with its result on every list (clean, listed or unknown), totals, and the removal page for each listing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "target": {
                "description": "A domain (example.com) or a public IPv4 address (203.0.113.7). For a domain, its mail server and SPF IPs are checked.",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checked": {
                "description": "How many list checks were made.",
                "type": "integer"
              },
              "ips": {
                "description": "Each IP checked with its results. Empty when a domain has no sending IPs of its own (e.g. it sends through Google Workspace).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ip": {
                      "description": "A sending IP address that was looked up.",
                      "type": "string"
                    },
                    "lists": {
                      "description": "One entry per blacklist queried for this IP.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "description": "The blacklist, e.g. Spamhaus ZEN.",
                            "type": "string"
                          },
                          "removal": {
                            "description": "Delisting page.",
                            "type": "string"
                          },
                          "state": {
                            "description": "clean = not listed, listed = on the list, unknown = the list did not answer.",
                            "enum": ["clean", "listed", "unknown"],
                            "type": "string"
                          }
                        },
                        "required": ["name", "removal", "state"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "source": {
                      "description": "Where the IP came from, e.g. the MX or SPF record.",
                      "type": "string"
                    }
                  },
                  "required": ["ip", "lists", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "kind": {
                "description": "Whether the target was an IP address or a domain.",
                "enum": ["ip", "domain"],
                "type": "string"
              },
              "listed": {
                "description": "How many list checks came back listed.",
                "type": "integer"
              },
              "note": {
                "description": "Context for reading the result, such as why a domain has no IPs to check. Null when there is none.",
                "type": ["string", "null"]
              },
              "target": {
                "description": "The domain or IPv4 address that was checked, normalised.",
                "type": "string"
              },
              "toolUrl": {
                "description": "The same check as a free web tool on pipefire.ai.",
                "type": "string"
              },
              "unknown": {
                "description": "How many lists could not be queried.",
                "type": "integer"
              }
            },
            "required": ["checked", "ips", "kind", "listed", "note", "target", "toolUrl", "unknown"],
            "type": "object"
          },
