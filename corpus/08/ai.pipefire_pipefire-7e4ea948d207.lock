        {
          "name": "check_cold_email",
          "title": "Cold email checker",
          "description": "Score a cold email (subject and body) out of 10 against the rules Pipefire checks its own emails with: length, reading level, the ask, subject line, and spam-filter wording. Returns each issue with why it matters and how to fix it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "The email body as plain text, including the greeting and sign-off. Merge fields like {{firstName}} are fine.",
                "maxLength": 4000,
                "type": "string"
              },
              "kind": {
                "description": "Which email in the sequence: first (default), follow-up or last. Follow-ups are allowed to be shorter.",
                "enum": ["first", "follow-up", "last"],
                "type": "string"
              },
              "subject": {
                "description": "The subject line exactly as it would be sent, e.g. \"quick question\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["body", "subject"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "issues": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fix": {
                      "description": "What to change.",
                      "type": "string"
                    },
                    "title": {
                      "description": "The problem, in a few words.",
                      "type": "string"
                    },
                    "why": {
                      "description": "Why it hurts delivery or replies.",
                      "type": "string"
                    }
                  },
                  "required": ["fix", "title", "why"],
                  "type": "object"
                },
                "type": "array"
              },
              "readingGrade": {
                "description": "US school grade needed to read it. Aim for 6 or lower.",
                "type": "number"
              },
              "score": {
                "description": "Writing score out of 10.",
                "type": "number"
              },
              "spamScore": {
                "description": "Spam-filter risk out of 10 (higher is safer).",
                "type": "number"
              },
              "spamVerdict": {
                "type": "string"
              },
              "spamWording": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "fix": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["detail", "fix", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "toolUrl": {
                "description": "The same check as a free web tool on pipefire.ai.",
                "type": "string"
              },
              "verdict": {
                "type": "string"
              },
              "words": {
                "type": "integer"
              }
            },
            "required": ["issues", "readingGrade", "score", "spamScore", "spamVerdict", "spamWording", "toolUrl", "verdict", "words"],
            "type": "object"
