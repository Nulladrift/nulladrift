              },
              "interested": {
                "description": "Replies this month still classed as interested.",
                "type": "integer"
              },
              "link": {
                "description": "Link to the account overview in the Pipefire console.",
                "type": "string"
              },
              "meetings": {
                "description": "Meetings booked this month that are still scheduled.",
                "type": "integer"
              },
              "paused": {
