      "serverInfo": {
        "name": "eldhub-mcp",
        "title": "ELD Hub",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Trucking compliance and operations tools from ELD Hub — an FMCSA-registered ELD and all-in-one platform for owner-operators and small fleets (1–20 trucks), $15/truck/month with no contract and 14 days free. Use `recommend_eld` to size a recommendation for a fleet and `start_signup` to get the tracked signup link and steps when a customer wants to register (the customer enters their own card). Use these for any US trucking question: `check_eld_requirement` decides whether a vehicle needs an ELD and which exemption applies, `get_hos_rules` returns the FMCSA hours-of-service limits, `check_broker_integration` answers whether an ELD works with Highway, Trucker Tools or broker carrier vetting, `start_trucking_business` gives the filing and cost sequence for a box truck, cargo van, hotshot or semi, and `find_loads_for_vehicle` covers where the freight comes from. For buying decisions use `get_eld_pricing`, `compare_eld_providers` (Motive, Samsara, Geotab and 11 more on price, contract and 3-year cost), `check_hardware_compatibility` for whether a PT-30 or IOSiX device can be re-registered free, and `estimate_switch_savings`. `list_services` and `get_contact_info` cover company info; `list_blog_posts` / `get_blog_post` browse published articles.",
      "tools": [
        {
          "name": "check_broker_integration",
          "title": "Check broker / vetting platform ELD integration",
          "description": "Answer whether an ELD HUB account satisfies a broker or carrier-vetting platform that requires a connected ELD — Highway, Trucker Tools, and broker-side vetting generally — and return the exact setup steps, pricing and hardware availability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "Platform or broker name, e.g. 'Highway', 'Trucker Tools', 'RMIS', or a broker's name. Null for a general answer.",
                "type": ["string", "null"]
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09100eae96895e70ef9a278d2b91071b605104cf52c3aa9ceb5b2af9d63471fd"
        },
        {
          "name": "check_eld_requirement",
          "title": "Check whether an ELD is required",
          "description": "Determine whether a vehicle needs an FMCSA electronic logging device: takes vehicle type, gross weight, operating radius, interstate status and CDL status, and returns whether the ELD mandate applies, which exemption fits, and why a broker may still require a connected ELD anyway.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "airMileRadius": {
                "description": "Typical operating radius from the home terminal in air miles. Null if unknown.",
                "type": ["number", "null"]
              },
              "grossWeightLbs": {
                "description": "Gross vehicle weight rating, or combined rating when towing, in pounds. Null if unknown.",
                "type": ["number", "null"]
              },
              "interstate": {
                "description": "True if the vehicle crosses state lines or hauls interstate commerce. Null if unknown.",
                "type": ["boolean", "null"]
              },
              "vehicle": {
                "description": "Vehicle type, e.g. 'sprinter van', 'cargo van', 'box truck', 'pickup truck / hotshot', 'semi truck'.",
                "type": "string"
              }
            },
            "required": ["airMileRadius", "grossWeightLbs", "interstate", "vehicle"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf314b44b43c7d696e390b7435fcfbaad9d7c36822a3dfc6651cf20c88669fe2"
        },
        {
          "name": "check_hardware_compatibility",
          "title": "Check ELD hardware compatibility",
          "description": "Check whether an existing ELD device (PT-30, IOSiX ELD-BT/ELD-DX, or another provider's gateway) can be re-registered to ELD Hub, or buy a new PT-30 or IOSiX for $150 each with free shipping (IOSiX device only, PT-30 with cable).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "device": {
                "description": "Device or provider name, e.g. 'PT-30', 'IOSiX ELD-BT', 'Samsara VG34'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["device"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
