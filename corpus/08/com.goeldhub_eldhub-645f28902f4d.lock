        {
          "name": "compare_eld_providers",
          "title": "Compare ELD providers",
          "description": "Compare FMCSA-registered ELD providers on monthly price per truck, contract length, hardware cost, three-year total cost of ownership and hidden fees. Optionally filter to a specific provider and size the cost to a fleet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Optional provider name to focus on, e.g. 'Motive' or 'Samsara'. Null returns all providers.",
                "type": ["string", "null"]
              },
              "trucks": {
                "anyOf": [
                  {
                    "maximum": 500,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional fleet size used to compute annual software cost per provider. Null omits it."
              }
            },
            "required": ["provider", "trucks"],
            "type": "object"
