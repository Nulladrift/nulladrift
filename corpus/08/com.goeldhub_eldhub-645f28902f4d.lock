          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "device": {
                "description": "Device or provider name, e.g. 'PT-30', 'IOSiX ELD-BT', 'Samsara VG34'.",
