        {
          "name": "get_hos_rules",
          "title": "Get FMCSA hours-of-service rules",
          "description": "Return the current FMCSA hours-of-service limits for property-carrying or passenger-carrying CMV drivers: the 11-hour driving limit, 14-hour on-duty window, 30-minute break, 60/70-hour weekly cap, 34-hour restart, sleeper-berth split and the 150 air-mile short-haul exception.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "driverType": {
                "anyOf": [
                  {
                    "enum": ["property", "passenger"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Type of CMV driver. Null defaults to property-carrying (freight)."
              }
            },
            "required": ["driverType"],
            "type": "object"
