{
  "lockfileVersion": 2,
  "subjects": {
    "co.quantkit/asia-market-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.quantkit.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "asia-market-data",
        "version": "0.3.1"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Financial market data for A-share (China), Hong Kong, and US markets. Provides latest available quotes, K-line/candlestick data, market status, and global market summaries. All data and schedules are unofficial, may be delayed, for information only — not financial advice. Symbol format: CODE.MARKET (e.g. 600519.SH, 0700.HK, NVDA.US). Supported markets: SH (Shanghai), SZ (Shenzhen), HK (Hong Kong), US (United States).",
      "tools": [
        {
          "name": "kline",
          "description": "Get historical daily K-line (candlestick/OHLCV) bars for one stock.\n\nReturns daily bars only — this tool never returns intraday ticks; for the\nlatest available price use stock_quote. A-share and HK bars come from the\nTencent public feed (forward-adjusted where the feed provides it, which is\nnot guaranteed for HK); US bars come from yfinance. Newer dates last. No\nauthentication required.\n\nUse this when the request is about history: trends, ranges, chart data\nover days-to-a-year. For the latest price alone use stock_quote (much\nfaster); for market-wide indices use market_summary. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "period": {
                "default": "3mo",
                "description": "Lookback window ending today: \"1mo\", \"3mo\", \"6mo\", or \"1y\".\nDefaults to \"3mo\". For A-share and HK symbols any other value\nreturns an error. Each bar has date, open, close, high, low,\nvolume.",
                "type": "string"
              },
              "symbol": {
                "description": "Stock symbol in CODE.MARKET format — SH, SZ, HK, or US\n(e.g. \"600519.SH\", \"0700.HK\", \"AAPL.US\"). HK codes may omit\nleading zeros.",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:688ba3bac143571be1d131138b17e257638a6bafb8f0de215a01dde2107e8816"
        },
        {
          "name": "market_status",
          "description": "Report open/closed state for US, HK, and CN stock markets right now (US also pre-market/after-hours).\n\nCalculated from a built-in unofficial schedule against the current clock;\nno data feed is contacted. US hours follow New York time, daylight saving\nincluded. Markets are shown closed on listed exchange holidays (US and HK\n2026-2027, CN 2026); US early closes end at 13:00 and HK half days at\n12:00. For a year without a calendar the response carries a \"warnings\"\nentry. Lunch breaks and unscheduled closures are not modelled. Read-only,\ninstant, no authentication.\n\nUse this to check whether a market can trade before quoting; use\nmarket_summary for index prices, stock_quote for individual stocks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:7094d472648c72ed8cb235fcc14373f3a397d023e9435f6cd70f219e0931826d"
        },
        {
          "name": "market_summary",
          "description": "Get the latest price and day-change percentage for six major global indices (S&P 500, NASDAQ, Dow Jones, Hang Seng, SSE Composite, CSI 300).\n\nSources are public feeds (yfinance); values are the latest available,\nunofficial and possibly delayed. An index that fails to fetch returns an\n\"error\" entry for that index only.\nRead-only, no authentication.\n\nUse this for market-direction questions spanning regions; use\nstock_quote for single stocks, kline for index history, and\nmarket_status for open/closed state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:408b33783757f3e900dc8109a9b0821e0b4017c29d8511f26d396bf25d5c77df"
        },
        {
          "name": "stock_quote",
          "description": "Get the latest available quote (price, change, day range, volume) for one stock in a single market.\n\nReads from free public feeds (Tencent for A-share/HK, yfinance for US);\nno API keys involved. Data is unofficial and may be delayed; where the\nresponse has a \"timestamp\" field it shows when the quote is from. Invalid\nor unknown symbols return an {\"error\": ...} object instead of raising.\n\nUse this for ONE symbol. Use stock_quote_batch when the request names\nmultiple symbols — it returns one call's worth of data for up to 20 at\nonce. Use kline instead for historical bars, market_summary for index\nsnapshots. This tool is read-only and safe to call repeatedly.\nRequires no authentication.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Stock symbol in CODE.MARKET format — market is one of\nSH (Shanghai), SZ (Shenzhen), HK (Hong Kong), US (US listings).\nExamples: \"600519.SH\", \"0700.HK\", \"NVDA.US\". HK codes may omit\nleading zeros (\"0700.HK\" == \"00700.HK\").",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:e135927905e4bf1ead572380dda31a8ec728f580da9095f140edac95b08632cf"
        },
        {
          "name": "stock_quote_batch",
          "description": "Get latest available quotes for up to 20 stocks in one call, in symbol order.\n\nSame data and sources as stock_quote, just batched: each list element is\none quote object (or an {\"error\": ...} object for that symbol — one bad\nsymbol never fails the batch). No API keys involved; data is unofficial\nand may be delayed.\n\nUse this when a request mentions MORE THAN ONE stock, and stock_quote\nwhen it names exactly one — results are identical per symbol, so the\nbatch simply saves round-trips. Requests naming more than 20 symbols\nare truncated at 20 and the response includes a \"note\" saying how many\nwere skipped. Read-only and safe to call repeatedly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "symbols": {
                "description": "Comma-separated CODE.MARKET symbols, e.g.\n\"600519.SH,0700.HK,AAPL.US\". Whitespace around commas is fine.",
                "type": "string"
              }
            },
            "required": ["symbols"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:8bf4476878c8c750fd65f0688807578065b13d3898fea9b5fa215c24fef52307"
        }
      ],
      "digest": "sha256:17826a1fa2e30264ed091910513cb1d152aba1071d18fc3449c5989099d96960"
    }
  }
}
