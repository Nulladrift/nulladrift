        {
          "name": "get_readiness_questions",
          "title": "Get readiness questions",
          "description": "Returns the self-assessment questions on AI readiness in four areas (data, processes, people, compliance), each with its id, the reason it is asked and the allowed answer options. Answers are option ids, not free text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
