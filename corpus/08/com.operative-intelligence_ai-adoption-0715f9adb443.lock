              },
              "internal_hourly_cost_eur": {
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "internal_hours": {
                "properties": {
                  "data_preparation": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "internal_it": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "training": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "workshops": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "internal_it_hourly_cost_eur": {
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "lang": {
