                    "minimum": 0,
                    "type": "number"
                  },
                  "plan": {
                    "enum": ["digitalocean_basic_2gb", "digitalocean_basic_4gb", "digitalocean_basic_8gb", "hetzner_regular_performance", "hetzner_general_purpose"],
                    "type": "string"
