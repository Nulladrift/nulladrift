      "serverInfo": {
        "name": "oi-ai-adoption-check",
        "title": "OI AI Adoption Check",
        "version": "0.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OI AI Adoption: a curated knowledge base on using AI in work processes (28 adoption patterns with workflows, prerequisites, risks and sourced effects), a register of EU and national rules for SI, AT, DE and HR, an AI readiness self-assessment, a cost and payback estimate and a phased rollout plan. Deterministic, no language model, no sign-in; it stores no inputs.\nadoption_find_patterns is the entry point for a described process or a general question about introducing AI. It returns, in this order: questions that change the recommendation (ask_first, at most two, plus at most one in ask_also_if_essential), one recommended way as a workflow at the user (recommendation: how it would work, what it brings with sourced effects only, what is needed, safe defaults, risks and the law, a first step), alternatives, approaches that do not fit the stated facts, and an internal part with pattern ids, evidence levels and sources.\nEach result lists in presentation.for_user the fields written for the user and in presentation.internal the fields that hold what the advice is based on (pattern ids, evidence levels, sources).\nThe other tools return the full pattern with sources (adoption_get_pattern), the rules per country (adoption_get_regulations), the process types (adoption_list_process_types), readiness questions and scoring, a cost and payback estimate with public sources and a rollout plan. The prompt ai_adoption_advice contains a complete guide for answering.\nIntended use of the results (the same rules as in the OI AI Adoption Advisor skills): ask the questions in ask_first (at most two) before giving the recommendation, and for a general question (task general_question) reply first with only those two business questions; then give one recommended way in five parts: how it would work for the user (3 to 5 steps), what it brings (only the sourced effects, at most two sentences), what is needed, what to watch out for (at most three points, the law in one sentence), a first step doable within a week. Pattern ids, evidence levels and sources are for when the user asks what the advice is based on; costs only when asked; no promotion of anyone; the user's language and form of address.",
      "tools": [
        {
          "name": "adoption_find_patterns",
          "title": "Advise on AI for a described process",
          "description": "Advises on using AI in a process the user describes, from a curated knowledge base with sources. The caller passes the description, the task that best matches it and the process properties it states; the server selects deterministically and does not use a language model. The result puts questions to ask first (ask_first) at the top, then one recommended way as a workflow (recommendation: how it would work, what it brings with sourced effects only, what is needed, what to watch out for, a first step), at most two alternatives, and an internal part with ids, evidence levels and sources. For a general question without a concrete process, task general_question returns two business questions and no recommendation yet; with user_unsure true it returns simpler questions and example tasks.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "The user's description of the process, unchanged",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the result: sl, en, de or hr. Texts not yet translated are returned in English and marked in the result.",
                "enum": ["sl", "en", "de", "hr"],
                "type": "string"
              },
              "process_type": {
                "description": "Optional filter by process type",
                "enum": ["data_capture", "communication", "documents", "planning", "control", "knowledge"],
                "type": "string"
              },
              "properties": {
                "additionalProperties": false,
                "description": "Process properties the description states; leave out what it does not say",
                "properties": {
                  "access_restricted_documents": {
                    "description": "Are some documents visible only to certain people or groups?",
                    "type": "boolean"
                  },
                  "allocates_by_personal_traits": {
                    "description": "Does the solution allocate work based on individual behaviour, performance or personal traits?",
                    "type": "boolean"
                  },
                  "assigns_people": {
                    "description": "Does the planning assign people (not only vehicles, machines or rooms)?",
                    "type": "boolean"
                  },
                  "contacts_natural_persons": {
                    "description": "Are the contacts natural persons (named individuals or sole traders) rather than only company addresses?",
                    "type": "boolean"
                  },
                  "cost_data_per_deal": {
                    "description": "Are costs (material, hours, transport) already recorded per deal or project?",
                    "type": "boolean"
                  },
                  "country": {
                    "description": "In which country does the process run?",
                    "enum": ["SI", "AT", "DE", "HR", "other_eu"],
                    "type": "string"
                  },
                  "cross_border_eu": {
                    "description": "Are some customers businesses in another EU Member State?",
                    "type": "boolean"
                  },
                  "customer_facing": {
                    "description": "Do customers or other external people interact with the solution directly?",
                    "type": "boolean"
                  },
                  "decision_logic": {
                    "description": "Will the solution follow fixed rules and an optimisation method, or learn from data or use a language model?",
                    "enum": ["fixed_rules_or_optimisation", "machine_learning_or_llm"],
                    "type": "string"
                  },
                  "document_kind": {
                    "description": "What kind of documents are processed?",
                    "enum": ["domestic_invoices", "foreign_invoices", "other_documents"],
                    "type": "string"
                  },
                  "employee_expense_items": {
                    "description": "Are employee expense claims, card transactions or travel costs among the checked items?",
                    "type": "boolean"
                  },
                  "entry_device": {
                    "description": "On what device do people enter the data?",
                    "enum": ["phone", "desktop", "hands_free"],
                    "type": "string"
                  },
                  "entry_length": {
                    "description": "Are entries short (a few fields or sentences) or long (full documents)?",
                    "enum": ["short", "long"],
                    "type": "string"
                  },
                  "error_cost": {
                    "description": "How costly is an undetected error in the output?",
                    "enum": ["low", "medium", "high"],
                    "type": "string"
                  },
                  "food_business": {
                    "description": "Is the organisation a food business?",
                    "type": "boolean"
                  },
                  "handles_job_applications": {
                    "description": "Can the incoming messages include job applications?",
                    "type": "boolean"
                  },
                  "horizon_year": {
                    "description": "Until which year should the solution remain in use? (year)",
                    "minimum": 0,
                    "type": "number"
                  },
                  "input_structure": {
                    "description": "In what form does the input arrive?",
                    "enum": ["structured", "semi_structured", "unstructured"],
                    "type": "string"
                  },
                  "labelled_irregularities": {
                    "description": "Are past cases already marked as errors or irregularities (for example corrected duplicates)?",
                    "type": "boolean"
                  },
                  "line_level_purchase_data": {
                    "description": "Are purchases available per line (item, quantity, price), for example from e-invoices or the ERP?",
                    "type": "boolean"
                  },
                  "load_variability": {
                    "description": "How much does the workload vary between days or weeks?",
                    "enum": ["low", "medium", "high"],
                    "type": "string"
                  },
                  "medical_purpose": {
                    "description": "Is the output used for diagnosis, prevention, prediction or treatment of people?",
                    "type": "boolean"
                  },
                  "monthly_volume": {
                    "description": "How many cases does the process handle per month? (cases per month)",
                    "minimum": 0,
                    "type": "number"
                  },
                  "personal_data": {
                    "description": "Does the process handle personal data?",
                    "type": "boolean"
                  },
                  "prices_from_system": {
                    "description": "Do prices and discounts come from a business system (price list, ERP) rather than being written by hand?",
                    "type": "boolean"
                  },
                  "regulated_domain": {
                    "description": "Is the process subject to sector regulation (for example health or finance)?",
                    "type": "boolean"
                  },
                  "road_transport": {
                    "description": "Are vehicles with drivers subject to EU drivers' hours rules planned?",
                    "type": "boolean"
                  },
                  "schedule_change_frequency": {
                    "description": "How often do schedules change after they are published?",
                    "enum": ["rare", "weekly", "daily"],
                    "type": "string"
                  },
                  "sends_marketing_email": {
                    "description": "Will found contacts receive marketing email?",
                    "type": "boolean"
                  },
                  "structured_einvoice_share": {
                    "description": "What share of incoming invoices already arrives as structured e-invoices?",
                    "enum": ["none", "some", "most"],
                    "type": "string"
                  },
                  "weighing_for_billing": {
                    "description": "Is the measured weight used for invoicing or payment?",
                    "type": "boolean"
                  },
                  "work_equipment_inspections": {
                    "description": "Do the checklists include inspections of work equipment or vehicles?",
                    "type": "boolean"
                  },
                  "works_council": {
                    "description": "Is there a works council or workers' representative?",
                    "type": "boolean"
                  },
                  "write_actions": {
                    "description": "Should the assistant be able to change data or trigger actions in company systems, not only read?",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "task": {
                "description": "The task that best matches the description. One of: general_question: a general question without a concrete process (for example how to introduce AI in the business); voice_entry: Entering data into a form by voice instead of typing; data_entry_from_documents: Taking data from incoming documents (orders, invoices, delivery notes) into the ERP; mail_routing: Sorting incoming e-mail and documents to the right person or team; register_checks: Checking and completing customer and supplier data from official registers; goods_receipt: Receiving goods with a photo of the delivery note and weighing; customer_questions: Answering frequent customer questions; email_reply_drafts: Preparing replies to incoming e-mail; complete_requests: Collecting all the details of a request before it is handed over; quote_from_inquiry: Preparing a quote from a customer inquiry; lead_finding: Finding and qualifying potential customers; bookings_reminders: Online booking of appointments with reminders; summarise_documents: Summarising long documents into the points that matter; documents_from_templates: Creating documents such as quotes or reports from templates; compare_documents: Comparing documents and finding deviations; translate_documents: Translating technical documents; demand_forecast: Forecasting demand; shift_scheduling: Planning shifts while respecting rules and wishes; resource_scheduling: Scheduling vehicles, machines or rooms; stock_replenishment: Deciding how much stock to order; deal_margin: Seeing the margin of each deal or project; anomaly_detection: Catching duplicate invoices and unusual costs; purchasing_analysis: Analysing purchases and consumption; digital_checklists: Replacing paper checklists with digital ones (for example HACCP, vehicle checks); ai_compliance_check: Checking whether your use of AI complies with the rules; internal_document_search: Finding answers in internal instructions and policies; assistant_connected_to_systems: Letting the assistant you already pay for read your company systems; employee_onboarding: Onboarding new employees; professional_decision_support: Supporting professional decisions (clinical, technical)",
                "enum": ["general_question", "voice_entry", "data_entry_from_documents", "mail_routing", "register_checks", "goods_receipt", "customer_questions", "email_reply_drafts", "complete_requests", "quote_from_inquiry", "lead_finding", "bookings_reminders", "summarise_documents", "documents_from_templates", "compare_documents", "translate_documents", "demand_forecast", "shift_scheduling", "resource_scheduling", "stock_replenishment", "deal_margin", "anomaly_detection", "purchasing_analysis", "digital_checklists", "ai_compliance_check", "internal_document_search", "assistant_connected_to_systems", "employee_onboarding", "professional_decision_support"],
                "type": "string"
              },
              "user_unsure": {
                "description": "Only for task general_question: true after the user said they do not know; returns simple questions and example tasks",
                "type": "boolean"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54d8437b7b2223a6c4c36dea65cd966ab08dc0b4951e06d82bdb8d6ece9b48a8"
        },
        {
          "name": "adoption_get_pattern",
          "title": "Get adoption pattern details",
          "description": "Returns the user-facing recommendation for one pattern (workflow, sourced effects, needs, risks, a first step) and, in an internal part, the full pattern with every claim resolved to its sources (title, publisher, URL, date read, location) and evidence level, or marked as having no source. The internal part answers questions such as what the advice is based on.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Pattern id, e.g. P01",
                "enum": ["P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08", "P09", "P10", "P11", "P12", "P13", "P14", "P15", "P16", "P17", "P18", "P19", "P20", "P21", "P22", "P23", "P24", "P25", "P26", "P27", "P28"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the result: sl, en, de or hr. Texts not yet translated are returned in English and marked in the result.",
                "enum": ["sl", "en", "de", "hr"],
                "type": "string"
              },
              "sections": {
                "description": "Sections of the internal part to return; when left out: approaches, prerequisites, effect, risks, compliance",
                "items": {
                  "enum": ["activities", "problem", "fit", "approaches", "prerequisites", "implementation", "operation", "effect", "risks", "typical_mistakes", "compliance"],
                  "type": "string"
                },
                "maxItems": 11,
                "type": "array"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
