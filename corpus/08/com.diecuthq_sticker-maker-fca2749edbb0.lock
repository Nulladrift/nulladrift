          "name": "generate",
          "title": "Make a sticker",
          "description": "Upload a logo, a label or a photo and get a die-cut sticker PNG: cut out, with an even white border and a transparent background, ready to print. With a redeem code that has credits it spends one credit and returns the clean PNG's URL. Without a code it returns a free watermarked preview URL and an unlock object that says how your user can pay.",
