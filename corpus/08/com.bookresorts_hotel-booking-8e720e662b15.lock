      },
      "instructions": "BookResorts books hotels and resorts worldwide at live rates (USD, taxes & fees included) as an independent travel agency since 1993. Flow: search_hotels → get_hotel (rooms, boards, cancellation, option_id) → create_booking_link (a 24-hour secure checkout URL for one option; the traveller enters details and pays on https://www.bookresorts.com). Never ask for card details in chat. Humans 24/7: 1-888-605-1350. Docs: https://www.bookresorts.com/ai-agents",
      "tools": [
        {
          "name": "create_booking_link",
          "title": "Create a checkout link",
          "description": "Create a secure checkout link for one room option from get_hotel. Give the link to the traveller: it opens our checkout with that exact room, dates and price, where they enter their details and pay (rate re-confirmed live). Links last 24 hours. Never ask the traveller for card details yourself.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkout": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children_ages": {
                "items": {
                  "maximum": 17,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "hotel_id": {
                "type": "string"
              },
              "option_id": {
                "description": "option_id from get_hotel",
                "type": "string"
              },
              "rooms": {
                "default": 1,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["checkin", "checkout", "hotel_id", "option_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "board": {
                "type": "string"
              },
              "booking_link": {
                "description": "Give this URL to the traveller; it opens our secure checkout with the room, dates and price. Valid 24 hours.",
                "type": "string"
              },
              "hotel": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "refundable": {
                "type": "boolean"
              },
              "room": {
                "type": "string"
              },
              "total_price_usd": {
                "type": "number"
              }
            },
            "required": ["booking_link", "hotel", "room", "total_price_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a checkout link"
          },
          "behavior": {
