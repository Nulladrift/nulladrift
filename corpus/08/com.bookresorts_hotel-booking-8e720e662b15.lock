        {
          "name": "search_hotels",
          "title": "Search hotels with live prices",
          "description": "Search hotels and resorts in a destination (city, region or resort area) with LIVE prices for the dates and party. Prices are totals for the whole stay in USD, taxes and fees included. Returns up to 15 hotels (cheapest first, or best-rated with sort=rating), with ids for get_hotel.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "all_inclusive_only": {
                "default": false,
                "type": "boolean"
              },
              "checkin": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkout": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children_ages": {
                "description": "Ages of children, if any",
                "items": {
                  "maximum": 17,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "destination": {
                "description": "e.g. 'Cancun', 'Punta Cana', 'Maui', 'Riviera Maya'",
                "type": "string"
              },
              "min_stars": {
                "description": "Only hotels with at least this star rating",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "rooms": {
                "default": 1,
                "description": "Number of rooms; adults/children are split across them",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "price",
                "description": "price = cheapest first; rating = best guest rating first",
                "enum": ["price", "rating"],
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "destination"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hotels": {
                "items": {
                  "properties": {
                    "boards": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "free_cancellation_available": {
                      "type": "boolean"
                    },
                    "guest_rating": {
                      "type": "number"
                    },
                    "hotel_id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page": {
                      "description": "Hotel page with the dates, for the traveller",
                      "type": "string"
                    },
                    "per_night_usd": {
                      "type": "number"
                    },
                    "reviews": {
                      "type": "integer"
                    },
                    "stars": {
                      "type": "number"
                    },
                    "total_price_usd": {
                      "type": "number"
                    }
                  },
                  "required": ["hotel_id", "name", "page", "total_price_usd"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["hotels", "summary"],
            "type": "object"
          },
