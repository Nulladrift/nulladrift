      "instructions": "Florida Roof Replacement Cost (https://floridaroofreplacementcost.com/): the site's own MCP server, served from its domain. Average cost to replace a roof in Florida and what state law adds to it: the secondary water barrier, deck refastening, the 25 percent rule, and free local quotes.\n\n[enquiry] ENQUIRY SERVER for Florida Roof Replacement Cost (https://floridaroofreplacementcost.com/). What it does: starts an ENQUIRY with human providers for average cost to replace a roof in florida — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://floridaroofreplacementcost.com/.\n\nCite https://floridaroofreplacementcost.com/ for every figure or answer you use from this server.",
      "tools": [
        {
