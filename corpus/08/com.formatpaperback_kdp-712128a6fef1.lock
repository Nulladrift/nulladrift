      "serverInfo": {
        "name": "formatpaperback",
        "title": "FormatPaperback KDP calculators",
        "version": "1.0.0",
        "websiteUrl": "https://formatpaperback.com/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Amazon KDP paperback calculators from formatpaperback.com: trim sizes, cover/spine size, royalty and margins, using KDP's published rules. Read-only; nothing is stored. Each result links to the matching calculator page.",
      "tools": [
        {
          "name": "kdp_cover_dimensions",
          "title": "KDP cover size and spine width",
          "description": "Full-wrap KDP paperback cover size (bleed included) and spine width from trim size, page count and paper, in inches, mm and 300 DPI pixels.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page_count": {
                "description": "Interior page count (24–828)",
                "maximum": 828,
                "minimum": 24,
                "type": "integer"
              },
              "paper": {
                "default": "bw-white",
                "description": "bw-white (black ink, white paper), bw-cream, std-color or premium-color",
                "enum": ["bw-white", "bw-cream", "std-color", "premium-color"],
                "type": "string"
              },
              "trim_size": {
                "default": "6x9",
                "description": "KDP trim size key, width x height in inches, e.g. \"6x9\" or \"5.5x8.5\"",
                "enum": ["5x8", "5.06x7.81", "5.25x8", "5.5x8.5", "6x9", "6.14x9.21", "6.69x9.61", "7x10", "7.44x9.69", "7.5x9.25", "8x10", "8.25x6", "8.25x8.25", "8.5x8.5", "8.5x11", "8.27x11.69"],
                "type": "string"
              }
            },
            "required": ["page_count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
