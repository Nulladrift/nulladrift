          },
          "digest": "sha256:eddc19a636f4ebb8d9d00ee348fe906a4a4099dadd5252d7dce4fc538ca2956f"
        },
        {
          "name": "kdp_margins",
          "title": "KDP margins and gutter",
          "description": "Inside (gutter) and outside margins KDP requires for a paperback page count, plus the largest text area at a trim size.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page_count": {
                "description": "Interior page count (24–828)",
                "maximum": 828,
                "minimum": 24,
                "type": "integer"
              },
              "trim_size": {
                "default": "6x9",
                "description": "KDP trim size key, width x height in inches, e.g. \"6x9\" or \"5.5x8.5\"",
                "enum": ["5x8", "5.06x7.81", "5.25x8", "5.5x8.5", "6x9", "6.14x9.21", "6.69x9.61", "7x10", "7.44x9.69", "7.5x9.25", "8x10", "8.25x6", "8.25x8.25", "8.5x8.5", "8.5x11", "8.27x11.69"],
                "type": "string"
              }
            },
            "required": ["page_count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f301b1eaa175b5fa640ad6a58546e8a30ea6dd757b06cb3ac260097acbee0184"
        },
        {
          "name": "kdp_royalty",
          "title": "KDP paperback royalty",
          "description": "KDP paperback printing cost and royalty per sale from list price, page count, marketplace and ink, using KDP's published formulas and 50%/60% rates.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "expanded_distribution": {
                "default": false,
                "description": "Expanded Distribution (40% rate, Amazon.com only)",
                "type": "boolean"
              },
              "ink": {
                "default": "bw",
                "description": "bw (black ink, white or cream), bw-groundwood, std-color or premium-color",
                "enum": ["bw", "bw-groundwood", "std-color", "premium-color"],
                "type": "string"
              },
              "list_price": {
                "description": "Tax-exclusive list price in the marketplace's currency",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "marketplace": {
                "default": "us",
                "description": "us (Amazon.com, USD), uk, eu, pl, se, jp, ca or au",
                "enum": ["us", "uk", "eu", "pl", "se", "jp", "ca", "au"],
                "type": "string"
              },
              "page_count": {
                "description": "Interior page count (24–828)",
                "maximum": 828,
                "minimum": 24,
                "type": "integer"
              },
              "trim_size": {
                "default": "6x9",
                "description": "Trim size key; large trims (wider than 6.12 in or taller than 9 in) cost more to print",
                "enum": ["5x8", "5.06x7.81", "5.25x8", "5.5x8.5", "6x9", "6.14x9.21", "6.69x9.61", "7x10", "7.44x9.69", "7.5x9.25", "8x10", "8.25x6", "8.25x8.25", "8.5x8.5", "8.5x11", "8.27x11.69"],
                "type": "string"
              }
            },
            "required": ["list_price", "page_count"],
            "type": "object"
          },
