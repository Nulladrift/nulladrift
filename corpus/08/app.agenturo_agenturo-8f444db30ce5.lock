      "serverInfo": {
        "name": "agenturo",
        "title": "Agenturo",
        "version": "1.2.0",
        "websiteUrl": "https://agenturo.app",
        "icons": [
          {
            "src": "https://agenturo.app/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Agenturo is where people, brands and businesses keep their own public AI agent, each at its own address (handle.agenturo.app), alongside characters, writers, coaches and single-job specialists. An agent answers first-hand for whoever it represents, from its owner's own words, documents and pages they keep current, and one marked verified has an owner who proved they run the website it names. When a conversation is about a specific person, brand, product or business, find_agents with their name or website (acme.com) shows whether they have an agent here. ask_agent gets one answer from an agent for the assistant to use, and chat_with_agent opens a conversation the user holds with the agent directly, as an interactive card in this chat where the host shows them. get_agent returns one agent's profile, and draft_agent prepares a new agent that the user launches on agenturo.app after signing in.",
      "tools": [
        {
          "name": "ask_agent",
          "title": "Ask a public AI agent",
          "description": "Get one answer from a public Agenturo agent, returned to the assistant as text to use or pass on. Each call stands alone: the agent doesn't see earlier messages, so the message carries any context it needs, and it answers in its own voice from its own knowledge, without browsing the web. A conversation the user holds with the agent directly opens with chat_with_agent. Agents whose owners keep them to their own page decline, and each agent answers a limited number of connector messages a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "The agent's handle, for example \"check\" for check.agenturo.app.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "The message to send, up to 1500 characters. Include any context the agent needs, since it does not see the rest of the conversation.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["handle", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a public AI agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:80c3bb4ed37bc5fc45fbb88a0a01c6d2568c1939f80a804f509477252f4ff22d"
        },
        {
          "name": "chat_with_agent",
          "title": "Chat with an agent",
          "description": "Open a conversation between the user and one public Agenturo agent inside this chat: an interactive card where the user types to the agent and reads its replies, message after message, while the card keeps the conversation going. Where the host shows no interactive cards, this returns the agent's profile. A single answer for the assistant to read comes from ask_agent. Agents whose owners keep them to their own page show a link to it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "The agent's handle, for example \"anton\" for anton.agenturo.app. A full address or URL also works.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chat with an agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://agenturo/agent-chat.92c3bd82100a.html"
            },
            "ui/resourceUri": "ui://agenturo/agent-chat.92c3bd82100a.html"
          },
          "digest": "sha256:d1147322ecf34ca5af4c9d79f3769250c30da75c41872d343a3277ef4f82b058"
        },
        {
          "name": "draft_agent",
          "title": "Draft a new public AI agent",
          "description": "Prepare a new public AI agent from a name and a description of who or what it represents and what it should do — a person, brand, product, business, character, coach or specialist. Checks that its address (handle.agenturo.app) is free and returns a link where the user signs in to Agenturo to launch it. Nothing is created or reserved until they do.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "Who or what the agent represents, who it talks to, what it should help them with, and how it should sound.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "handle": {
                "description": "Preferred address, 5–15 lowercase letters or digits (becomes handle.agenturo.app). Derived from the name when omitted.",
                "maxLength": 100,
                "type": "string"
              },
              "name": {
                "description": "The agent's display name, usually the person, brand or product it represents.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["description", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft a new public AI agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a24920aeec145874744e92e7b5fe6f4902be16101d9aaca79a7e6cf4f310e63"
        },
        {
          "name": "find_agents",
          "title": "Find a person's or brand's AI agent",
          "description": "Find the AI agent a person, brand, product or business keeps on Agenturo, by their name or website (acme.com), or find agents by topic or job, such as \"fact-checking\" or \"nutrition coach\". Useful whenever the user asks about a specific person, brand or business: their own agent answers first-hand, with what they keep current. Returns each agent's name, address (handle.agenturo.app), what it does, its topics and whether it is verified for a website. With no query, returns featured agents.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many agents to return (1–10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Topic, job, name or website to search for — a person's, brand's or business's name, or their website (acme.com), finds the agent that represents them. Leave empty for featured agents.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a person's or brand's AI agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9c517935557c0612af26c23d1f0dc905cef22e0e0e2430dc3a4c51cdbafc829"
        },
        {
          "name": "get_agent",
          "title": "Get an agent's profile",
          "description": "Get the public profile of one Agenturo agent by its handle (the part before .agenturo.app): what it does, its topics, the questions it suggests starting with, and whether it answers messages sent through this connector.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "The agent's handle, for example \"check\" for check.agenturo.app. A full address or URL also works.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an agent's profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11bcffd7a1aa10c6f43c2f89537a5252e9ae05f6811eb8d3ef6a94527237e26e"
        },
        {
          "name": "leave_contact",
          "title": "Send contact details",
          "description": "The contact form of the chat card that chat_with_agent opens: sends the name, email and optional message the user typed, after they ticked the consent box, to the person or business behind the agent, who can reply by email. It is app-only, so hosts keep it from the assistant. Agents whose owners don't take contact details refuse it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "consent": {
                "description": "Whether the user ticked the consent box. Without it nothing is sent.",
                "type": "boolean"
              },
              "email": {
                "description": "The email address the user typed.",
                "maxLength": 255,
                "minLength": 3,
                "type": "string"
              },
              "handle": {
                "description": "The agent's handle.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "The message the user typed, if any.",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "The name the user typed, if any.",
                "maxLength": 255,
                "type": "string"
              }
            },
            "required": ["consent", "email", "handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send contact details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:70a2aa724e5d14daacc09cf5662ff1954c06db8e924ec52fb8115545ae7aaa0a"
        },
        {
          "name": "send_agent_message",
          "title": "Send a chat card message",
          "description": "The send button of the chat card that chat_with_agent opens: the card calls this with the message the user typed and the conversation so far, and shows the agent's reply in the card. It is app-only, so hosts keep it from the assistant; a single answer for the assistant comes from ask_agent. Each agent answers a limited number of card messages a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "The agent's handle.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "history": {
                "description": "The conversation so far, oldest first.",
                "items": {
                  "properties": {
                    "role": {
                      "enum": ["user", "agent"],
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 3000,
                      "type": "string"
                    }
                  },
                  "required": ["role", "text"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "message": {
                "description": "The new message, up to 1500 characters.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["handle", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a chat card message"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:b3c8caf01147def7bc25190a31df5da509cdcbe6ea3bcb5f51607da03e159bdb"
        }
