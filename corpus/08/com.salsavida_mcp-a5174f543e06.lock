      "instructions": "Find public Salsa Vida events and guides. Event dates are local calendar dates, never inferred UTC times. Omitted date filters default to UTC today through 13 days later. For today or tonight, pass the explicit user-local local calendar date, which may be yesterday in UTC. Every record includes its source URL. Calendar coverage is explicit; an unavailable date window is not a zero-result search. Public query analytics are aggregated; client names are self-reported.",
