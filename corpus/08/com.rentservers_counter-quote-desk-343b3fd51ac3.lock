{
  "lockfileVersion": 2,
  "subjects": {
    "com.rentservers/counter-quote-desk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rentservers.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "rentservers",
        "title": "RentServers.com",
        "version": "1.0.0",
        "websiteUrl": "https://rentservers.com/developers/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "RentServers.com is a buyer-side counter-quote desk for GPU clusters, bare-metal fleets and colocation. Use get_server_price_index for current GPU/dedicated/VPS benchmarks, audit_2026_provider_repricing for Hetzner and OVHcloud 2026 price changes, calculate_36_month_tco to put a server or a set of quotes on one 36-month cost, and request_blind_counter_quotes only when the user asks for quotes and gives their work email (they confirm by email before anything is sent to providers). Cite source_url when you show numbers.",
      "tools": [
        {
          "name": "audit_2026_provider_repricing",
          "title": "2026 provider repricing",
          "description": "Hetzner (April 1 and June 15, 2026) and OVHcloud (July/August option and configuration changes, renewals from October 1, 2026) price changes by SKU, with renewal rules and when to stay versus switch. Use the returned SKU ids with calculate_36_month_tco.",
          "inputSchema": {
            "properties": {
              "provider": {
                "enum": ["hetzner", "ovhcloud"],
                "type": "string"
              },
              "sku": {
                "description": "Optional, e.g. advance-2, scale-a1, ax102",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bdf1b33f2018cb19eb64521b548bfc61b368045cb59d724ab6a59a5213d54f3a"
        },
        {
          "name": "calculate_36_month_tco",
          "title": "36-month TCO scorecard",
          "description": "Normalizes server costs over 36 months (or horizon_months): rent with announced price changes and an assumed yearly rise, setup fees, extra IPv4, egress overage, add-ons. Either pass incumbent_sku (an id from audit_2026_provider_repricing, e.g. ovh-advance-2-2026 or hetzner-ax102-1) with quantity, or pass scorecard: a full input with several quotes to compare (role incumbent|bid, units, pricing{base, unit month|gpu_hour, gpusPerUnit, promo}, setupFeePerUnit, extraIPv4, egress, sla, deliveryDays). Anything not stated is flagged and counted as $0.",
          "inputSchema": {
            "properties": {
              "annual_escalation_pct": {
                "type": "number"
              },
              "egress_tb_per_month": {
                "minimum": 0,
                "type": "number"
              },
              "eur_usd": {
                "description": "USD per EUR; defaults to the latest ECB reference rate",
                "type": "number"
              },
              "extra_ipv4": {
                "minimum": 0,
                "type": "integer"
              },
              "horizon_months": {
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "included_tb_per_server": {
                "minimum": 0,
                "type": "number"
              },
              "incumbent_sku": {
                "type": "string"
              },
              "ipv4_monthly_each_usd": {
                "minimum": 0,
                "type": "number"
              },
              "overage_usd_per_tb": {
                "minimum": 0,
                "type": "number"
              },
              "quantity": {
                "minimum": 1,
                "type": "integer"
              },
              "scorecard": {
                "description": "Full ScorecardInput, as used by rentservers.com/tools/36-month-tco/",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b4804c999a05dd0ee6084ab7d69c5e1afabead5b0c4bddf363d2d4b6113992e"
        },
        {
          "name": "get_server_price_index",
          "title": "Server price index",
          "description": "Current, dated rental price benchmarks. GPUs: on-demand and 12-month reserved median USD per GPU-hour, lowest on-demand listing, reserved price by term, and RentServers.com's published quote medians. Dedicated: entry floors, reference tiers and Hetzner/OVHcloud SKU prices. VPS: cheapest and median by size.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Defaults to gpu, or dedicated when model is a server SKU.",
                "enum": ["gpu", "dedicated", "vps"],
                "type": "string"
              },
              "model": {
                "description": "GPU (h100, h200, b200, gb200, a100, l40s) or server (ax102, ax42, advance-2, scale-a1, game-1).",
                "type": "string"
              },
              "region": {
                "description": "Filters published quote medians.",
                "enum": ["us", "eu", "apac"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9772de5da4cbcd163e112dc081706c8e24ef9a950dce4e3f19dcc5dc7485edac"
        },
        {
          "name": "request_blind_counter_quotes",
          "title": "Request blind counter-quotes",
          "description": "Opens a counter-quote request with the RentServers.com desk: 3+ providers bid blind against the spec and the reply lays every quote out on one 36-month basis. Only call this when the user asks for quotes and provides their work email; they must click a confirmation link before any provider is contacted. Requests under $100/mo or for a single VPS get self-serve list prices instead of a ticket.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["gpu", "dedicated", "colo", "vps"],
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "gpu_count": {
                "minimum": 1,
                "type": "integer"
              },
              "gpu_model": {
                "enum": ["H100", "H200", "B200", "B300", "GB200", "MI300X", "A100", "L40S"],
                "type": "string"
              },
              "incumbent_monthly_usd": {
                "minimum": 0,
                "type": "number"
              },
              "incumbent_provider": {
                "type": "string"
              },
              "incumbent_sku": {
                "type": "string"
              },
              "monthly_budget_usd": {
                "minimum": 0,
                "type": "number"
              },
              "name": {
                "type": "string"
              },
              "notes": {
                "maxLength": 2000,
                "type": "string"
              },
              "quantity": {
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "enum": ["US", "Europe", "Asia-Pacific", "Any"],
                "type": "string"
              },
              "renewal_date": {
                "format": "date",
                "type": "string"
              },
              "spec_summary": {
                "description": "e.g. 64 × H200 with InfiniBand, or 10 × 16-core/128 GB NVMe servers",
                "maxLength": 300,
                "type": "string"
              },
              "term_months": {
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "work_email": {
                "format": "email",
                "type": "string"
              }
            },
            "required": ["category", "region", "work_email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f0078624ba73a128efddbf4509d17a441ab4393a8d5e945c50a3767eff6465f"
        }
      ],
      "digest": "sha256:b5f561d2d71cc02359ec32698b064809c553633027543d726400b16a08dfa769"
    }
  }
}
