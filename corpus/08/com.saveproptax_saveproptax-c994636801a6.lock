{
  "lockfileVersion": 2,
  "subjects": {
    "com.saveproptax/saveproptax": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://saveproptax.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "saveproptax",
        "title": "SavePropTax",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Check whether a California home qualifies for a Proposition 8 decline-in-value property tax reduction, and start a filing the owner completes themselves. The check is free. Filing costs the owner a flat $29, paid by the owner after they personally sign; the signing link is emailed to the owner and never returned to this client. Full API reference: https://saveproptax.com/agents",
      "tools": [
        {
          "name": "check_property_tax_savings",
          "description": "Free check of whether a California home qualifies for a Proposition 8 decline-in-value property tax reduction. Returns a status (qualifies, fair_assessment, not_enough_data, not_residential, window_closed, county_not_served, already_filed, address_not_found, needs_more_info, busy), the current assessment, our opinion of value from recent comparable sales, and the estimated annual savings. When the property qualifies, the result includes a continueToken for start_filing. Checking is free and can only ever lower a tax bill, never raise it.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Street address including the city, for example \"3746 Norris Canyon Rd, San Ramon\"",
                "type": "string"
              },
              "unit": {
                "description": "Unit number for multi-unit buildings, for example \"Unit 12\"",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66f9d680d7598d6a2e00a25cc17e09040860501b93b9feb447c9766f226f004a"
        },
        {
          "name": "get_filing_status",
          "description": "Coarse status of a filing by document id: awaiting_signature, awaiting_payment, filed, delivered, or unknown. Returns no personal information, addresses, or amounts.",
          "inputSchema": {
            "properties": {
              "docId": {
                "description": "The docId returned by start_filing",
                "type": "string"
              }
            },
            "required": ["docId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc2e9bba3ef2224e77fe84ba722d11e8d3e5abe2cd25ea973ccfc92afa88efe5"
        },
        {
          "name": "start_filing",
          "description": "Start a county filing for a property that qualified in check_property_tax_savings. Prepares the county's own review form and emails a signing link to the OWNER'S email address. The link is never returned here: the owner personally reviews, signs, and pays a flat $29 before anything is filed. Requires the continueToken from a qualifying check (valid 24 hours).",
          "inputSchema": {
            "properties": {
              "continueToken": {
                "description": "The continueToken from a qualifying check_property_tax_savings result",
                "type": "string"
              },
              "ownerEmail": {
                "description": "Owner email; the signing link is delivered there",
                "type": "string"
              },
              "ownerName": {
                "description": "Owner name or names exactly as they appear on title",
                "type": "string"
              },
              "ownerPhone": {
                "description": "Owner daytime phone with area code",
                "type": "string"
              },
              "rentedOut": {
                "description": "Whether the property is rented out. Required for San Bernardino, Santa Cruz and Marin, whose county forms ask.",
                "type": "boolean"
              }
            },
            "required": ["continueToken", "ownerEmail", "ownerName", "ownerPhone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:80404d696ca177af47a9f7790af1fc80196d8f8a34f0a623cb6cf9878abf13b2"
        }
      ],
      "digest": "sha256:e312475e3736364497bd458e3b04f4394a45bec5a1e89ffcb5edcf4c0869c993"
    }
  }
}
