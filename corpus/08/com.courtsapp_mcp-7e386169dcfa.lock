                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "clickTrackUrl": {
                      "type": "string"
                    },
                    "comingSoon": {
                      "type": "boolean"
                    },
                    "courtCount": {
                      "type": "number"
                    },
                    "distance": {
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
                    },
                    "lat": {
                      "type": "number"
                    },
                    "listingTier": {
                      "enum": ["bookable", "connected", "listed"],
                      "type": "string"
                    },
                    "lng": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "paidListing": {
                      "type": "boolean"
