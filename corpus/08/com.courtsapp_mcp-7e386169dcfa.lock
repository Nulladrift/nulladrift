        {
          "name": "search_open_play",
          "title": "Search Open Play Sessions",
          "description": "Use this when the user wants open play, drop-in, or to join a game with other players instead of reserving a whole court. Typical asks: \"pickleball open play near me tonight\", \"drop-in tennis this weekend\", \"beginner open play in Scottsdale\", \"I'm solo, where can I find a game?\". Finds open play sessions with spots left at CourtsApp facilities near a location, or at one facility.\nRequires location (city+state or zip preferred), facilityName, or facilityId. When the user names a facility, pass it as facilityName right away — do not ask for the city first. date, time, sport, and level are optional filters; with no date it looks 7 days ahead.\nReturns facilities, each with up to 5 sessions: level, when (facility-local), price per player, spotsLeft, maxPlayers, and url. The url is the booking page for that session — share it once the user picks a session.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Optional facility-local date as YYYY-MM-DD. Omit to search the next 7 days.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "facilityId": {
                "description": "Optional facility UUID from another CourtsApp tool, to list one facility's sessions. Never invent one.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "facilityName": {
                "description": "Facility name the user said (e.g. \"Sportime Englewood\"). Every word must appear in the name, in any order, so partial names work. Searched nationwide; add location to sort same-named clubs by distance.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "level": {
                "description": "Optional skill level: Beginner, Advanced beginner, Intermediate, Advanced intermediate, Advanced, Expert, or Professional. Omit when the user has not said, or says any level.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "location": {
                "description": "Where to search (50-mile radius). With facilityName or facilityId there is no radius and location only sorts by distance. Accepts city+state, city-only, state-only, zip, or lat+lng. City+state or zip are preferred. Never use 0,0 or guess coordinates.",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  },
                  "state": {
                    "type": "string"
                  },
                  "zip": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "maxResults": {
                "description": "Number of facilities to return (1–10, default 3).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "sport": {
                "description": "Optional sport filter (e.g. \"pickleball\"). Omit to include every sport.",
                "enum": ["tennis", "pickleball", "padel", "table-tennis", "badminton", "racquetball", "squash"],
                "type": "string"
              },
              "time": {
                "description": "Optional earliest start time of day as HH:MM 24-hour (e.g. \"17:00\" for evening sessions). Pass the user's spoken time directly — no timezone conversion.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "available": {
                "type": "boolean"
              },
              "facilities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "distance": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "photoUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "sessions": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "type": "string"
                          },
                          "endTime": {
                            "type": "string"
                          },
                          "level": {
                            "type": "string"
                          },
                          "maxPlayers": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "price": {
                            "type": "string"
                          },
                          "pricePerPlayerCents": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "sessionId": {
                            "type": "string"
                          },
                          "sport": {
                            "type": "string"
                          },
                          "spotsLeft": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "startTime": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          },
                          "when": {
                            "type": "string"
                          }
                        },
                        "required": ["date", "endTime", "level", "maxPlayers", "price", "pricePerPlayerCents", "sessionId", "sport", "spotsLeft", "startTime", "url", "when"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "state": {
                      "type": "string"
                    },
                    "timezone": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["address", "city", "distance", "id", "name", "photoUrl", "sessions", "state", "timezone", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "hint": {
                "type": "string"
              }
            },
            "required": ["available", "facilities", "hint"],
            "type": "object"
