        {
          "name": "get_facility_details",
          "title": "Get Facility Details",
          "description": "Use this when the user asks about a specific facility: hours, address, phone number, amenities, policies, what sports it offers, or its courts. Looks the facility up in the CourtsApp database. Typical asks: \"what time does the club open?\", \"does it have indoor courts?\", \"how much is the per-player fee?\", \"what's the cancellation policy?\", \"is there a pro shop or parking?\".\nAccepts partial name matches, city, state, or zip. facilityId is optional — use it only when you already have a real facility id from another CourtsApp tool; otherwise use name and location fields. At least one search field is required.\nReturns up to 5 matching facilities, bookable first, then connected, then listed, by name. Each includes: name, listingTier (bookable, connected, or listed), comingSoon status, description/about, seoDescription, timezone, full address, phone number, website, bookingUrl, hours of operation, amenities, booking/cancellation policies, per-player fees, check-in policy, available sports, indoorCourtCount, outdoorCourtCount, courtSurfaces, courtGroups (listed and connected: courts per sport, setting, and surface), bookable court details (name, environment, surface, sports), lat and lng (when known), photos (photoUrl is the first), and a link to the facility page. website and bookingUrl are https links, or null when the stored value is missing or not a normal web URL.\nFacilities with comingSoon: true are joining CourtsApp but not yet bookable. For connected facilities, send the user to bookingUrl. For listed facilities, send the user to website. Do not search availability or create a CourtsApp checkout for either.\nbookingPolicies.advanceBookingDays is the maximum advance booking window across all sports. When different sports have different windows, advanceBookingDaysBySport lists each sport and its window (e.g. Pickleball 7 days, Tennis 14 days). If a user asks about a date that one sport allows but another doesn't, explain which sport(s) can be booked that far out and which cannot.\nWhen bookingPolicies includes perPlayerFeeDollars or perPlayerFeePolicy, tell the user about the per-player fee — it affects total cost beyond the court rental price. When checkInPolicy is present, share it so the user knows what to expect on arrival.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City name (case-insensitive partial match). E.g. \"Austin\", \"New York\".",
                "type": "string"
              },
              "facilityId": {
                "description": "Optional. Must be a valid UUID string (RFC 4122) when provided — used for exact lookup by id. Omit when searching by name, city, state, or zip instead.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "description": "Facility name or partial name (case-insensitive). E.g. \"Lifetime\", \"Central Park Tennis\", \"YMCA\".",
                "maxLength": 100,
                "type": "string"
              },
              "state": {
                "description": "State name or abbreviation (case-insensitive). E.g. \"Texas\", \"TX\", \"New York\", \"NY\".",
                "type": "string"
              },
              "zip": {
                "description": "Zip/postal code (exact match)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "facilities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "about": {
                      "type": "string"
                    },
                    "address": {
                      "type": "string"
                    },
                    "amenities": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "bookingPolicies": {
                      "additionalProperties": false,
                      "properties": {
                        "advanceBookingDays": {
                          "type": "number"
                        },
                        "advanceBookingDaysBySport": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "days": {
                                "type": "number"
                              },
                              "sport": {
                                "type": "string"
                              }
                            },
                            "required": ["days", "sport"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "cancellationWindowHours": {
                          "anyOf": [
                            {
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "checkInPolicy": {
                          "type": "string"
                        },
                        "hasGuestFee": {
                          "type": "boolean"
                        },
                        "perPlayerFeeDollars": {
                          "type": "number"
                        },
                        "perPlayerFeePolicy": {
                          "type": "string"
                        }
                      },
                      "required": ["advanceBookingDays", "hasGuestFee"],
                      "type": "object"
                    },
                    "bookingUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "city": {
                      "type": "string"
                    },
                    "comingSoon": {
                      "type": "boolean"
                    },
                    "courtGroups": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "count": {
                            "type": "number"
                          },
                          "setting": {
                            "type": "string"
                          },
                          "sportName": {
                            "type": "string"
                          },
                          "surface": {
                            "type": "string"
                          }
                        },
                        "required": ["count", "setting", "sportName", "surface"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "courtSurfaces": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "courts": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "environment": {
                            "type": "string"
                          },
                          "id": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "sports": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "surface": {
