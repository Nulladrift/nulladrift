        {
          "name": "get_lesson_times",
          "title": "Lesson Times",
          "description": "Use this when the user has picked a coach from search_lessons and wants to see when that coach is free for a private lesson. Not for court times (search_courts). Typical asks: \"when is that coach free Saturday morning?\", \"any evening times next week?\".\nRead-only: it shows the coach's open lesson times at one location and does not book anything. Pass the coach's listingId and the locationId from search_lessons (a coach who teaches at several places needs one). Optional: lessonLength in minutes (30, 60, 90 or 120; default the coach's usual length), startDate and endDate (YYYY-MM-DD, local days at the location; default the next 7 days, at most 14; times start 18 hours out, since coaches need that much notice), and earliestTime and latestTime (HH:MM, local) to narrow each day, for example evenings.\nReturns the coach (with teachmeUrl, their own TeachMe.To page, where the player chooses a location, date and time themselves), the location and the coach's other locations, the lesson length, prices (TeachMe.To quotes for one student, fees included: one lesson, and the 10-lesson pack where the coach sells one; the exact total comes back with the checkout link) and open times grouped by local day, each with a slotKey and a checkoutUrl (TeachMe.To's checkout for that time with the coach, place and time already filled in: to book, share it exactly as returned; no contact details are needed). Times are in the location's own time zone. Each day shows a spread of its times and openTimes says how many there are in all; at most 4 days are shown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "earliestTime": {
                "description": "Only times starting at or after this local time, HH:MM 24-hour (for example 17:00 for evenings).",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "endDate": {
                "description": "Last day to show, YYYY-MM-DD. Defaults to a week from the first day; at most 14 days in all.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "latestTime": {
                "description": "Only times starting at or before this local time, HH:MM 24-hour.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "lessonLength": {
                "description": "Lesson length in minutes. Leave out for the coach's usual length.",
                "enum": [30, 60, 90, 120],
                "type": "integer"
              },
              "listingId": {
                "description": "The coach's listingId from search_lessons.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "locationId": {
                "description": "The locationId from search_lessons (the coach's place nearest the user). Needed when the coach teaches at more than one place.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "startDate": {
                "description": "First day to show, YYYY-MM-DD, a local day at the location. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["listingId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "coach": {
                "additionalProperties": false,
                "properties": {
                  "listingId": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "photoUrl": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "rating": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "teachmeUrl": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["listingId", "name", "photoUrl", "rating", "teachmeUrl"],
                "type": "object"
              },
              "currency": {
                "type": "string"
              },
              "days": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "openTimes": {
                      "type": "integer"
                    },
                    "slots": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "checkoutUrl": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "slotKey": {
                            "type": "string"
                          },
                          "startAt": {
                            "type": "string"
                          },
                          "time": {
                            "type": "string"
                          }
                        },
                        "required": ["checkoutUrl", "slotKey", "startAt", "time"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "timezoneAbbrev": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["date", "label", "openTimes", "slots", "timezoneAbbrev"],
                  "type": "object"
                },
                "type": "array"
              },
              "daysWithOpenings": {
                "type": "integer"
              },
              "hint": {
                "type": "string"
              },
              "lessonLength": {
                "type": "integer"
              },
              "lessonLengths": {
                "items": {
                  "type": "integer"
                },
                "type": "array"
