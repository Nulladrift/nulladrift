        {
          "name": "get_facility_times",
          "title": "Get Facility Times",
          "description": "Lists every open court time at one bookable CourtsApp facility on one day, grouped by indoor or outdoor and surface, with per-hour prices and a booking link for each. The CourtsApp facility card calls this to show a club's times on its profile; it is not needed to find courts for a user, which search_courts does (it returns the first few times per club). Needs the facility's id (from search_courts or get_facility_details). The date is optional and defaults to today where the facility is (tomorrow when nothing is left today); sport defaults to the facility's first sport.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Day to list, YYYY-MM-DD. Defaults to today where the facility is.",
                "format": "date",
                "type": "string"
              },
              "facilityId": {
                "description": "The facility's id (a UUID), as returned by search_courts or get_facility_details.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "sport": {
                "description": "Sport slug or name, e.g. \"pickleball\" or \"Table Tennis\". Defaults to the facility's first sport.",
                "type": "string"
              }
            },
            "required": ["facilityId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day listed, YYYY-MM-DD.",
                "type": "string"
              },
              "facilityId": {
                "type": "string"
              },
              "groups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "setting": {
                      "enum": ["Indoor", "Outdoor"],
                      "type": "string"
                    },
                    "slots": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "description": "YYYY-MM-DD.",
                            "type": "string"
                          },
                          "discountedPrice": {
                            "description": "Price per hour after any discount, in cents.",
                            "type": "number"
                          },
                          "duration": {
                            "description": "Minutes.",
                            "type": "number"
                          },
                          "originalPrice": {
                            "description": "List price per hour, in cents.",
                            "type": "number"
                          },
                          "startTime": {
                            "description": "Start time in the club's local time, HH:MM (24-hour).",
                            "type": "string"
                          },
                          "url": {
                            "description": "The CourtsApp booking page for this time.",
                            "type": "string"
                          }
                        },
                        "required": ["date", "discountedPrice", "duration", "originalPrice", "startTime", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "surface": {
                      "description": "Short surface name, e.g. Hard.",
                      "type": "string"
                    }
                  },
                  "required": ["setting", "slots", "surface"],
                  "type": "object"
                },
                "type": "array"
              },
              "rolledOver": {
                "description": "True when no date was given and nothing was left today, so this is tomorrow.",
                "type": "boolean"
              },
              "sport": {
                "description": "Sport slug.",
                "type": "string"
              },
              "sportName": {
                "type": "string"
              }
            },
            "required": ["date", "facilityId", "groups", "rolledOver", "sport", "sportName"],
            "type": "object"
          },
