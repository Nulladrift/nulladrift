        {
          "name": "search_tournaments",
          "title": "Find Tournaments",
          "description": "Use this when the user wants tournaments or leagues to play in, near a location or by name. Not for court availability (search_courts), open play (search_open_play) or coaching (search_lessons). Typical asks: \"pickleball tournaments near me\", \"tennis leagues in Dallas\", \"any tournaments this weekend?\", \"when does registration close for Moneyball?\".\nRead-only: it searches CourtsApp's catalog of events and cannot register anyone. Each event has a registration url on the organizer's site: share it exactly as returned and let the user sign up there. Never say anyone is registered.\nLocation is optional (city+state, zip, or lat+lng; a state alone lists that state's events). With a city or zip it returns events within 150 miles, soonest first, each with distanceMiles; if none are that close it says so and returns the 2 nearest, which are not near, so never call them nearby. Without a location it returns the soonest events anywhere. Use q or name for an event name (e.g. \"Moneyball\"), type to limit to tournaments or leagues, and from/to (YYYY-MM-DD) for dates; it starts from today by default. maxResults is 1-10 (default 6).\nReturns tournaments, each with name, eventType, venueName, city, state, startDate and endDate (calendar days), registrationCloseDate, closingSoon (registration closes within 5 days), priceMinCents and priceMaxCents with currency (cents; 0 means free), url, and distanceMiles; plus total and hint.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "description": "Optional first day to include, as YYYY-MM-DD: events still on or after it are returned. Defaults to today.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "location": {
                "description": "Where to look (150-mile radius). City+state or zip are preferred; a state alone lists that state's events with no distances. Use lat+lng only if the user provided real coordinates. Never use 0,0 or guess coordinates. Optional: leave it out to search everywhere.",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  },
                  "state": {
                    "type": "string"
                  },
                  "zip": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "maxResults": {
                "description": "Number of events to return (1-10, default 6).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Optional event name or venue to look for, e.g. \"Moneyball\".",
                "maxLength": 100,
                "type": "string"
              },
              "sport": {
                "description": "Optional sport to find events for. Pass it whenever the user names one. Case-insensitive. Common aliases accepted (e.g. \"pickle ball\" → pickleball).",
                "enum": ["tennis", "pickleball", "padel", "table-tennis", "badminton", "racquetball", "squash"],
                "type": "string"
              },
              "to": {
                "description": "Optional last day to include, as YYYY-MM-DD: events starting on or before it are returned. Omit for no end date.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "type": {
                "description": "Optional: only tournaments, or only leagues. Leave it out for both.",
                "enum": ["tournament", "league"],
                "type": "string"
              }
            },
            "type": "object"
          },
