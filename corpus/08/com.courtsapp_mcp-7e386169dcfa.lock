                      "type": "string"
                    },
                    "photoUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "slots": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "type": "string"
                          },
                          "discountedPrice": {
                            "type": "number"
