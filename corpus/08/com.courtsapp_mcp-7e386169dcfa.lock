        {
          "name": "get_lesson_booking_link",
          "title": "Lesson Booking Link",
          "description": "Optional: use this only when the user asks to have their own details filled in on the checkout for them. The default way to book needs no contact details: share the picked time's checkoutUrl from get_lesson_times exactly as returned. This tool prepares a TeachMe.To checkout for that lesson and returns a link where the user pays, with the coach, location, time and the student's details already filled in.\nIt sends the student's full name, email address and phone number to TeachMe.To to prepare that checkout (they are what lets TeachMe.To fill them in), and creates their TeachMe.To account if the email is new. Ask the user for all three first, and use only what the user gave you. Nothing is charged by this tool, and CourtsApp takes no payment for lessons: the user pays on TeachMe.To, and the coach then accepts the time or suggests another, so it is a request, never a confirmed booking.\nRequires listingId, locationId and slotKey (from get_lesson_times, exactly as returned), lessonLength (minutes, the one used for the times), studentName, studentEmail and studentPhone. lessons is how many lessons to buy as a prepaid pack, 1-20 (default 1).\nReturns paymentUrl (share it exactly as returned), the coach, location and local time, and the quote: lessons, pricePerLesson, fees, total and currency.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lessonLength": {
                "description": "Lesson length in minutes: the lessonLength of the times the user picked from.",
                "enum": [30, 60, 90, 120],
                "type": "integer"
              },
              "lessons": {
                "default": 1,
                "description": "How many lessons to buy as a prepaid pack (1-20). Defaults to 1. The first lesson is at the time picked.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "listingId": {
                "description": "The coach's listingId from search_lessons or get_lesson_times.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "locationId": {
                "description": "The locationId the time is at, from get_lesson_times.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "slotKey": {
                "description": "The slotKey of the time the user picked, copied exactly as returned. It cannot be edited.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "studentEmail": {
                "description": "The student's email address, as the user gave it.",
                "maxLength": 254,
                "minLength": 3,
                "type": "string"
              },
              "studentName": {
                "description": "The student's full name, as the user gave it.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "studentPhone": {
                "description": "The student's phone number with area code, as the user gave it.",
                "maxLength": 40,
                "minLength": 7,
                "type": "string"
              }
            },
            "required": ["lessonLength", "listingId", "locationId", "slotKey", "studentEmail", "studentName", "studentPhone"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
