        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CourtsApp finds and books racquet sport courts (pickleball, tennis, padel, badminton, racquetball, squash, table tennis) with live open times and prices from the clubs themselves, plus open play (drop-in) sessions, coaches and private lessons, and tournaments and leagues.\nUse it when someone wants to play, book or learn a racquet sport, for example:\n- \"Where can I play pickleball tonight?\" / \"Tennis courts near me\" / \"Book a padel court Saturday at 9am\" → search_courts\n- \"Pickleball open play near me\" / \"Drop-in tennis this weekend\" / \"I'm solo, where can I find a game?\" → search_open_play\n- \"Pickleball lessons near me\" / \"Find a tennis coach in Phoenix\" → search_lessons\n- \"Pickleball tournaments this month\" / \"Tennis leagues in Dallas\" → search_tournaments\n- \"What are the hours at [club]?\" / \"Does [club] have indoor courts?\" → get_facility_details\n\n## Links\nShare every link exactly as a tool returned it, query string included (it carries the booking details and where the visit came from). Do not shorten, clean or rebuild links.\n\n## Facility questions\nWhen the user asks about a specific facility (hours, address, phone number, amenities, policies, what sports it offers, courts, etc.), use get_facility_details. It accepts partial name matches, city, state, or zip. facilityId is optional: pass it only when you have a real facility id from another CourtsApp tool; otherwise use name and city/state or zip.\n\n## Time Handling\nPass date and time as separate plain values — no timezone conversion needed.\n  - date: YYYY-MM-DD (e.g. \"2026-01-22\")\n  - time: HH:MM 24-hour (e.g. \"15:00\")\nExamples:\n  - User says \"3pm tomorrow\"  → date: \"2026-01-23\", time: \"15:00\"\n  - User says \"9am on Jan 22\" → date: \"2026-01-22\", time: \"09:00\"\n  - User says \"noon\"          → time: \"12:00\"\n  - User says \"7:30pm\"        → time: \"19:30\"\nThe server handles all timezone conversion internally.\n\n## Listing tiers\nFacilities have listingTier: bookable, connected, or listed.\n- bookable: checkout through CourtsApp. comingSoon: true means they are joining but not taking CourtsApp bookings yet.\n- connected: host a CourtsApp page and send the user to the facility booking URL (bookingUrl). Never create a CourtsApp checkout for them.\n- listed: host a CourtsApp page and send the user to the facility website. Do not search availability or create a CourtsApp checkout.\nsearch_courts without a sport (or with only a state) lists bookable, connected, and listed clubs (places to play, no times). With a sport and a place to search around, the results are bookable clubs with open times first, then up to 10 nearby connected facilities (listingTier: connected, no times): offer them after the bookable ones and send the user to their bookingUrl; then up to 10 nearby listed facilities (listingTier: listed, no times). The card shows the first 8 clubs and its Map button shows all of them: name the rest in text if the user wants more.\n\nWhen a facility is coming soon:\n- Tell the user the facility is on CourtsApp but not bookable yet — it will be soon.\n- Do not search availability or generate a booking link for coming-soon facilities.\n- Offer to share any details you do have (location, sports, amenities) and suggest they check back soon.\n\n## Workflow\n- User wants to find places to play, see open court times, or book in an area (\"courts near me\", \"pickleball in Austin\") → search_courts with the location (city+state, zip, or lat+lng) and the sport if they named one. Sport is what unlocks live open times: with a sport you get today's open times; without one you get places to play, not times, and the hint says to ask which sport. A state alone only lists places to play: ask for a city or zip to show times.\n- Date is optional and defaults to today: pass it only when the user named a day. Time is optional: if the user gave none, leave it out and the results start at the earliest open time (from now if today, otherwise from 6am); then ask whether they want a specific time. Duration defaults to 60 minutes when the user does not specify one.\n- User picks a time to book → get_booking_link with the facilityId, sportId, date, time, and duration from the results\n- After a place list, if the user wants times, ask which sport (if you do not have one) and a city or zip (if you only have a state), then call search_courts again.\n- User asks about a specific facility (hours, amenities, location, policies, courts, sports, etc.) → get_facility_details\n- User wants open play, drop-in, or to join a session/game with other players (not reserve a whole court) → if they named a facility, call search_open_play with facilityName right away; otherwise collect location (date, time, and level are optional) → search_open_play → ask user to pick a session → give them that session's url\n- User wants a coach or private lessons (\"tennis lessons near me\", \"a pickleball coach in Phoenix\") → search_lessons with the sport and a location (city+state or zip) → user picks a coach → get_lesson_times with that coach's listingId and locationId → user picks a time → share that time's checkoutUrl exactly as returned (TeachMe.To's checkout with the coach, place and time filled in; no name, email or phone needed). The user adds their details and pays on TeachMe.To; CourtsApp does not charge for lessons. See Lessons.\n- User wants a tournament or league to play in (\"pickleball tournaments near me\", \"is there a Moneyball this weekend\") → search_tournaments with the sport and a location (city+state or zip); pass q or name for an event name. Location, dates, and type (tournament or league) are optional. Give the user the event's url to register: CourtsApp does not register anyone.\n\n## Open Play\nOpen play is a scheduled drop-in session where players buy individual spots and are grouped by level; the facility assigns courts. It is NOT a court reservation: never use search_courts open times or get_booking_link for it, and never send an open play url for a court rental. Prices are per player and one booking takes 1–4 spots. Say the level (e.g. Intermediate), the facility-local time from the session's when field, the per-player price, and spots left. The url opens the CourtsApp page where the user picks how many spots, signs in, and pays — you cannot reserve a spot yourself and spots are not held until checkout.\n\n## Per-Player Fees & Check-In Policies\nSome facilities charge a per-player fee on top of the court rental. When a facility has perPlayerFeeDollars and/or perPlayerFeePolicy in its data, you MUST proactively mention this to the user — it affects total cost. Present the fee clearly (e.g. \"$5 per player\") and relay the facility's policy text so the user knows what to expect. Before calling get_booking_link for those facilities, ask how many players (1–8) and pass that as players so the booking link and total price include the fee. If the user does not say, default is 2. Similarly, when a facility has a checkInPolicy, share it with the user so they know the check-in procedure.\n\n## Lessons\nWhen the lesson tools are available and the user wants a coach or private lessons (pickleball or tennis only), the steps are:\n1. search_lessons with sport and a location (city+state or zip). Each coach comes with listingId, locationId, prices and nextOpen, the soonest open time in the coach's local time (with its own checkoutUrl).\n2. get_lesson_times with the chosen coach's listingId and the locationId from the search. Add startDate and endDate for a day or a weekend, earliestTime and latestTime for a time of day, lessonLength if the user wants 30, 90 or 120 minutes. It returns the coach's locations, prices (TeachMe.To quotes for one student, fees included: one lesson, and the 10-lesson pack where the coach sells one) and open times grouped by day, each with a checkoutUrl in the location's own time zone: say times as given, never converted to the user's zone, and offer two or three, not the whole list.\n3. Once the user picks a time, share that time's checkoutUrl (from get_lesson_times, or nextOpen.checkoutUrl from the search) exactly as returned, never edited. It opens TeachMe.To's checkout with the coach, place and time already filled in, for one lesson; the player adds their own details and pays there. Do NOT ask the user for their name, email or phone: none is needed. (The CourtsApp card shows this as one button, so you may have nothing to do here.) A time with no checkoutUrl can use the coach's own TeachMe.To page (teachmeUrl), where the player picks the time again. Times start 18 hours out, since coaches need that much notice: no time sooner is offered.\n4. Optional, only if the user asks to have their own details filled in on the checkout for them (or wants a pack of lessons): ask for the student's full name, email address and phone number, and how many lessons (default 1), tell them these go to TeachMe.To, then call get_lesson_booking_link with the coach's listingId, the locationId, the picked time's slotKey exactly as returned, the lessonLength, the lessons count and those three details. Share paymentUrl exactly as returned, with the total and what it covers.\nCourtsApp does not charge for lessons and never takes payment for them: the user finishes and pays on TeachMe.To. The time is a request, not a reservation: after the user pays, the coach accepts it or suggests another time. Never say a lesson is booked, confirmed or paid, and never say CourtsApp booked it. If a time was just taken, call get_lesson_times again and offer another.\nPrices are all-in totals (service and other fees included) in the currency shown. Say prices per lesson: startingPrice is the per-lesson rate when buying a 10-lesson pack (\"from $X per lesson\") and singleLessonPrice is one lesson (null means it is not listed, so do not guess it). The exact total for the chosen time and number of lessons comes back with the checkout link. Never quote a coach, time or price the tools did not return. If nobody is nearby, say so.\n\n## Tournaments\nsearch_tournaments finds tournaments and leagues from CourtsApp's event catalog. It is read-only: CourtsApp does not register anyone or sell entries, so never say the user is registered or signed up. Each event's url is the organizer's registration page: share it exactly as returned and let the user register there.\nWith a city or zip it returns events within 150 miles, soonest first, with distanceMiles. If nothing is that close the result says so and lists the 2 nearest: lead with \"nothing near you\", name them with how far away they are, and never call them nearby. Without a location it returns the soonest events anywhere.\nstartDate and endDate are calendar days: say them exactly as given, never shifted for a time zone. Prices are priceMinCents to priceMaxCents in the event's currency (cents; 0 means free): say a range, or one amount when they are equal. closingSoon means registration closes within 5 days: say the registrationCloseDate. Never quote an event, date, or price the tool did not return.\n",
      "tools": [
        {
          "name": "get_booking_link",
          "title": "Get Booking Link",
          "description": "Use this when the user has picked an open court time from search_courts and wants to reserve it (\"book the 6pm court\", \"reserve that one for 90 minutes\", \"lock in Saturday at 9\"). Get a booking link for a court.\nRequires facilityId, date, time, sportId, and duration.\nOptional players (1–8, default 2) pre-fills the booking page and is used for per-player fee totals.\nReturns a URL to the booking page with pre-filled details and pricing info (court + player fees).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD (from the slot the user picked)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "duration": {
                "description": "Duration in minutes, e.g. 60 (from the slot the user picked)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "facilityId": {
                "description": "Facility UUID from search_courts results",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "players": {
                "default": 2,
                "description": "Optional number of players (1–8). Defaults to 2. Required for accurate totals when the facility charges a per-player fee — ask the user before calling when perPlayerFeeDollars is set.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "sportId": {
                "description": "Sport UUID from search_courts results",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "surface": {
                "description": "Optional surface filter (e.g. \"Hard\", \"Clay\")",
                "type": "string"
              },
              "time": {
                "description": "HH:MM 24-hour (from the slot the user picked)",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              }
            },
            "required": ["duration", "facilityId", "sportId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "type": "string"
              },
              "bookingUrl": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "duration": {
                "type": "string"
              },
              "facilityImage": {
                "type": "string"
              },
              "facilityName": {
                "type": "string"
              },
              "perPlayerFeeDollars": {
                "type": "number"
              },
              "playerFeeCents": {
                "type": "number"
              },
              "players": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "sport": {
                "type": "string"
              },
              "subtotalCents": {
                "type": "number"
              },
              "surface": {
                "type": "string"
              },
              "taxCents": {
                "type": "number"
              },
              "time": {
                "type": "string"
              },
              "totalCents": {
                "type": "number"
              }
            },
            "required": ["address", "bookingUrl", "date", "duration", "facilityImage", "facilityName", "playerFeeCents", "players", "sport", "subtotalCents", "surface", "taxCents", "time", "totalCents"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Booking link ready.",
            "openai/toolInvocation/invoking": "Getting booking link…",
            "ui": {
              "resourceUri": "ui://widget/checkout-card-v5.html"
            },
            "ui/resourceUri": "ui://widget/checkout-card-v5.html"
          },
          "digest": "sha256:2a1509699483a9b1a09dd304139a638f776a419e4d2a16c7fd3e9831f6e2a898"
        },
