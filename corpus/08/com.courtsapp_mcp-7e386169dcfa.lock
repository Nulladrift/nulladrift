      "serverInfo": {
        "name": "courtsapp",
        "title": "CourtsApp",
        "version": "1.0.0",
        "description": "Find and book pickleball, tennis and padel courts with live open times, plus open play, coaches and lessons, and tournaments, on CourtsApp.",
        "websiteUrl": "https://courtsapp.com",
        "icons": [
          {
            "src": "https://courtsapp.com/apple-touch-icon.png",
