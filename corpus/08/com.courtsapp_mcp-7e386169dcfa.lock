        {
          "name": "search_lessons",
          "title": "Find Lessons",
          "description": "Use this when the user wants a coach or private lessons for pickleball or tennis near a location. Not for court availability (search_courts) or open play (search_open_play). Typical asks: \"pickleball lessons near me\", \"find a tennis coach in Phoenix\", \"tennis lessons for my kid\", \"a private pickleball lesson this weekend\", \"who can help me fix my serve?\".\nRead-only: it finds TeachMe.To coaches within 25 miles who have an open lesson time in the next two weeks (times start 18 hours out, since coaches need that much notice), and does not book anything. Next, get_lesson_times shows a coach's open times, and each time has a checkoutUrl: TeachMe.To's checkout with the coach, place and time already filled in, where the user pays on TeachMe.To.\nRequires sport and a location (city+state, zip, or lat+lng). A state alone is too broad, so ask for a city or zip code. maxResults is 1-6 (default 3).\nReturns coaches, each with listingId and locationId (pass both to get_lesson_times), name, rating, reviewCount, a short headline, distanceMiles, city, singleLessonPrice (one lesson, all fees included; null when not listed, never guess it), startingPrice (the per-lesson rate when buying a 10-lesson pack, so say \"from $X per lesson\") and nextOpen (the soonest open time in the coach's local time, with its slotKey and checkoutUrl: share that link exactly as returned to book it; the player needs to give no contact details). Each coach also has locations (where they teach near the search, nearest first, with distanceMiles) and teachmeUrl, their own TeachMe.To page, where the player chooses a location, date and time themselves.",
