        {
          "name": "search_courts",
          "title": "Find Courts",
          "description": "Use this when the user wants to find places to play racquet sports (pickleball, tennis, padel, badminton, racquetball, squash, table tennis) near a location, or wants to see open court times. Typical asks: \"pickleball courts near me\", \"where can I play tennis tonight?\", \"book a padel court Saturday at 9am\", \"any indoor pickleball courts open now in Austin?\", \"court rental prices near 85016\".\nSport is what unlocks live open times. With a sport and a place to search around (city+state, zip code, lat+lng, or a facilityName) it returns live open times at nearby bookable clubs, followed by nearby connected and listed clubs without times (up to 10 of each). The card shows the first 8 clubs and its Map button shows all of them, so name the rest in text if the user wants more. The date is optional and defaults to today (the date where the clubs are, and if nothing more is open today the results move on to the next day), so \"near me\" or \"now\" needs no date. Time is optional: without it the tool returns the earliest open times (from now if the date is today, otherwise from 6am). Duration is optional and defaults to 60 minutes. Returns sportId (use for get_booking_link), facilities with available slots, and hint. Facilities may include perPlayerFeeDollars, perPlayerFeePolicy, and checkInPolicy when set — mention these to the user when present.\nWithout a sport it lists nearby places to play instead, not live times, and the hint says to ask the user which sport. A state alone also lists places only (a state is too wide to search around), and the hint says to ask for a city or zip. Search by city+state, zip code, or lat+lng (nearest clubs within 50 miles), by state alone (listed by name), or look up one club with facilityName. Returns up to 50 bookable (including coming soon), 25 connected, and 25 listed facilities (10 of each for a state alone), bookable first, each with a photo, address, lat and lng (when known), sports, court count, and the CourtsApp page url (plus distance for radius searches).\nThe result has mode: \"times\" (live open times) or \"directory\" (places to play, no times). To turn a place list into open times, ask the user for what the hint says (the sport, or a city or zip) and call this tool again.\nFor connected facilities, send the user to bookingUrl. For listed facilities, send the user to website. Do not create a CourtsApp checkout for either. Facilities with comingSoon: true are joining CourtsApp but are not yet bookable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Optional date to check live open times, as YYYY-MM-DD (e.g. \"2026-01-22\"). Defaults to today where the clubs are, so leave it out when the user named no day. Used with a sport.\nPass the user's spoken date directly — no timezone conversion.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "duration": {
                "default": 60,
                "description": "Optional play duration in minutes, used with a sport: 30, 60, 90 or 120. Defaults to 60.",
                "enum": [30, 60, 90, 120],
                "type": "integer"
              },
              "facilityName": {
                "description": "Name of a club to find. With a sport it shows that club's live open times (a location is optional, the club says where to look) by narrowing the nearby bookable clubs by name and, if the location search finds none, searching by name instead. Without a sport it returns the clubs whose name has every word, in any area (a city, zip or coordinates only put the nearest first).",
                "maxLength": 100,
                "type": "string"
              },
              "location": {
                "description": "Where to search. Accepts city+state, city-only, state-only, zip, or lat+lng. City+state or zip are preferred for accuracy. City-only may return broader results. Never use 0,0 or guess coordinates. A state alone lists that state's clubs by name (places only, no live times): live times need a city, zip, or lat+lng.",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  },
                  "state": {
                    "type": "string"
                  },
                  "zip": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "maxResults": {
                "description": "Only used for live open times (with a sport). Number of facilities with open times to return (1–10, default 3). Use more when the user wants to compare options.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "sortBy": {
                "description": "Only used for live open times (with a sport). How to sort results. \"distance\" (default) returns closest facilities first. \"price\" returns cheapest facilities first.",
                "enum": ["distance", "price"],
                "type": "string"
              },
              "sport": {
                "description": "Sport to look for. Pass it whenever the user names one: with a sport and a location the tool returns live open times; without one it only lists places to play (and the hint says to ask which sport). Case-insensitive. Common aliases accepted (e.g. \"ping pong\" → table-tennis, \"paddle\" → padel).",
                "enum": ["tennis", "pickleball", "padel", "table-tennis", "badminton", "racquetball", "squash"],
                "type": "string"
              },
              "time": {
                "description": "Optional start time as HH:MM in 24-hour format (e.g. \"15:00\" or \"9:00\"), used with a sport. Omit it when the user gave no time; results then start at the earliest open time that day (from now if today, otherwise from 6am).\nPass the user's spoken time directly — no timezone conversion.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "facilities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "bookingUrl": {
                      "anyOf": [
