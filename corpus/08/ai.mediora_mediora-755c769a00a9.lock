        {
          "name": "mediora__explain_condition",
          "title": "Explain a clinical condition",
          "description": "Return the full explainer for a clinical condition by slug. Includes: what the condition is, the key markers used in diagnosis, common symptoms, and when the patient should seek clinical evaluation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language code. Defaults to 'en'.",
                "enum": ["en", "ru", "he"],
                "type": "string"
              },
              "slug": {
                "description": "Mediora canonical slug (e.g. 'hba1c', 'ferritin'). Use mediora__list_markers / mediora__list_conditions to discover slugs.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a clinical condition"
          },
          "behavior": {
            "destructive": false,
