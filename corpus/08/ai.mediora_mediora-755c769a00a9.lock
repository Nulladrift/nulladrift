            "readOnly": true
          },
          "digest": "sha256:bb66f08f4728b126e61ac0766d5eedc2933c48d0b39bf40d471b43ea1183000f"
        },
        {
          "name": "mediora__explain_marker",
          "title": "Explain a blood-test marker",
          "description": "Return the full explainer for a single blood-test marker by slug. Includes: what it measures, what high/low values mean, when the value is clinically actionable, the conditions typically associated with it, and - where habits genuinely move the number - what can be done about a high or low result. Those action fields are empty when the value follows an underlying cause rather than lifestyle, which is itself the answer. When a person has checked the reference range against an official source, rangeSource names it (title, url, checkedOn).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language code. Defaults to 'en'.",
                "enum": ["en", "ru", "he"],
                "type": "string"
              },
              "slug": {
                "description": "Mediora canonical slug (e.g. 'hba1c', 'ferritin'). Use mediora__list_markers / mediora__list_conditions to discover slugs.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a blood-test marker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb463626e68f3eb7bf952316c910b8ba3f3d9ab46469d0e7cb5067f2409937bc"
        },
        {
          "name": "mediora__explain_panel",
          "title": "Explain a lab panel",
          "description": "Return the markers that make up a lab panel by slug — each resolved to its Mediora marker slug, name and one-line summary — plus the panel's search aliases (CBC/FBC, CMP, LFT, TFT, renal panel, …). Answers \"what's included in a CBC / lipid panel / CMP\". Follow each marker into mediora__explain_marker for full detail.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language for the marker names/summaries. Defaults to 'en'.",
                "enum": ["en", "ru", "he"],
                "type": "string"
              },
              "slug": {
                "description": "Panel slug (e.g. 'complete-blood-count', 'lipid-panel', 'comprehensive-metabolic-panel'). Use mediora__list_panels to discover slugs.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a lab panel"
          },
          "behavior": {
