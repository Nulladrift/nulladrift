{
  "lockfileVersion": 2,
  "subjects": {
    "com.artnap/artnap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://artnap.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "artnap",
        "title": "Artnap",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Artnap is an archive of public domain art from museum open access collections. Use search_artworks to find works, get_artwork for one work and its museum record, list_artists and list_museums to browse, get_license_summary for the license line. Link people to the Artnap page of each work.",
      "tools": [
        {
          "name": "get_artwork",
          "title": "Get artwork",
          "description": "One artwork by its Artnap id: title, artist, year, museum, license, the 2,500 px image, its Artnap page and the holding museum's own record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Artnap artwork id, for example \"aic-56905\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get artwork"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b983e60a5be828ba1ea970e71c22dba5f00ff1fecbefb4447b8c39741f92ed85"
        },
        {
          "name": "get_license_summary",
          "title": "Get license summary",
          "description": "The license line for one artwork (public domain, CC0 or CC BY) and where to check it at the holding museum.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Artnap artwork id.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get license summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5e6c4ab0c7625ed59992479fbc7f8db9f11ac14765d516978765ac5e076fbcf"
        },
        {
          "name": "list_artists",
          "title": "List artists",
          "description": "Artists in the Artnap archive whose name matches the words given, with dates, number of works and their Artnap page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Part of the artist name, for example \"monet\" or \"utagawa\".",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List artists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9f29c80bd9882e0411572135878016ac24f5748f5e31a48419a35ec06daea5b"
        },
        {
          "name": "list_museums",
          "title": "List museums",
          "description": "The museums and libraries whose open access collections Artnap brings together, with the number of works from each and their Artnap page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List museums"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb84cf123734ed27923fb744546b0f19e9e4f12b44bd8aa944ff6ba143d3c917"
        },
        {
          "name": "search_artworks",
          "title": "Search artworks",
          "description": "Search the Artnap archive of public domain paintings, drawings, prints and posters from museum open access collections. Returns each work with title, artist, year, museum, license, a 2,500 px image address and its Artnap page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artist": {
                "description": "Artist name, exactly as Artnap lists it (see list_artists).",
                "type": "string"
              },
              "color": {
                "description": "Main color of the work.",
                "enum": ["red", "orange", "yellow", "green", "teal", "blue", "purple", "pink", "brown", "black", "white", "gray"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many works to return (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "museum": {
                "description": "Museum name or code (see list_museums).",
                "type": "string"
              },
              "q": {
                "description": "Words to search for: subject, title, style or artist (for example \"moonlight sea\" or \"Hokusai wave\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search artworks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4771feb8813c74600bd299a0123509538ae849e4fb2101ba3be0f8ccd2a624a2"
        }
      ],
