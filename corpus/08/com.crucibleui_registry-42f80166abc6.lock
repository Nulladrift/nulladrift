          "title": "Search the Crucible registry",
          "description": "Search Crucible's animated React components by keyword, category, or tier. Returns names, descriptions, and dependencies. Use get_component to fetch source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
