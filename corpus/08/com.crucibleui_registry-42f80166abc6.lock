            "readOnly": false
          },
          "digest": "sha256:573dbd35cd44233bebde6a1a2a989842f68d45b9ac23bb2a2af127baa14ff616"
        },
        {
          "name": "search_registry",
          "title": "Search the Crucible registry",
          "description": "Search Crucible's animated React components by keyword, category, or tier. Returns names, descriptions, and dependencies. Use get_component to fetch source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["backgrounds", "text", "cards", "data", "ai", "buttons", "navigation", "cursors", "scroll", "loaders", "utility", "inputs", "sections", "app", "templates", "themes"],
                "type": "string"
              },
              "query": {
                "description": "Keyword matched against name, title, and description",
                "type": "string"
              },
              "tier": {
                "enum": ["free", "pro"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
