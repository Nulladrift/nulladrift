          "name": "get_usage",
          "title": "Get component usage example",
          "description": "Show how to USE a Crucible component correctly: a worked example (its demo source) plus the conventions that make it render — notably the `relative isolate` wrapper that background components require. Call this before writing integration code so the install actually renders.",
