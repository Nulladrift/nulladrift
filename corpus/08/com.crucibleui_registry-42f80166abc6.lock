      "tools": [
        {
          "name": "get_component",
          "title": "Get component source",
          "description": "Fetch the full TypeScript source of a Crucible component, ready to drop into a shadcn-style project. Pro components require an Authorization: Bearer <CRUCIBLE_TOKEN> header (get a token at https://crucibleui.com/account).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Component name, e.g. 'corona' — find names via search_registry",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:780c2102127b834371cc16f86faf13232899086220470848254d169ba1073113"
        },
        {
          "name": "get_usage",
          "title": "Get component usage example",
          "description": "Show how to USE a Crucible component correctly: a worked example (its demo source) plus the conventions that make it render — notably the `relative isolate` wrapper that background components require. Call this before writing integration code so the install actually renders.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Component name, e.g. 'corona' — find names via search_registry",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
