            "readOnly": false
          },
          "digest": "sha256:4dae79eece49a0aee7f136c721dfe5fab210a607380394d0c2c3fe7663e2d503"
        },
        {
          "name": "install_instructions",
          "title": "Get install instructions",
          "description": "How to install a Crucible component into a project: shadcn CLI command, registry config, and npm dependencies.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Component name, e.g. 'corona'",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
