{
  "lockfileVersion": 2,
  "subjects": {
    "app.rowb.dubai-log/uae-costs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dubai-log.rowb.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "dubai-log",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "compute_cost",
          "description": "Compute one Dubai cost from published rates. kind=taxi_minimum (RTA minimum fare), salik_monthly (toll cost for a commute), fuel_tank (cost to fill a tank), fuel_per_km (fuel cost for a distance). Deterministic arithmetic only - no AI, and unpublished values are returned as not_published rather than guessed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crossings_per_day": {
                "description": "salik_monthly: charged crossings per day",
                "type": "number"
              },
              "days_per_month": {
                "description": "salik_monthly: days per month (default 30)",
                "type": "number"
              },
              "fuel": {
                "enum": ["super_98", "special_95", "e_plus_91", "diesel"],
                "type": "string"
              },
              "fuel_l_per_100km": {
                "description": "fuel_per_km: consumption",
                "type": "number"
              },
              "gates_per_crossing": {
                "description": "salik_monthly: gates passed per crossing (default 2)",
                "type": "number"
              },
              "kind": {
                "enum": ["taxi_minimum", "salik_monthly", "fuel_tank", "fuel_per_km"],
                "type": "string"
              },
              "km": {
                "description": "fuel_per_km: distance",
                "type": "number"
              },
              "mode": {
                "description": "taxi_minimum: road pickup or e-hail",
                "enum": ["road", "ehail"],
                "type": "string"
              },
              "tank_litres": {
                "description": "fuel_tank: tank size in litres",
                "type": "number"
              },
              "window": {
                "description": "salik_monthly: time window",
                "enum": ["peak", "offpeak", "sunday"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b1a48cbd048599d50dffbb04cdfd005a5c761d638bd6d6eed76c293e60d1612"
        },
        {
          "name": "get_rates",
          "description": "Return the Dubai (UAE) rate card this service computes with: RTA taxi minimum fares, Salik toll rates by time window, and the published monthly fuel prices. Every rate carries its source URL and the date it was read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7e66d32e93bf2ef8a0077f28ca63b18436ba5d9e09fdff1da6ceeb877f38fa2b"
        },
        {
          "name": "health_check",
          "description": "Report whether this service is up and which version answered. Use it to confirm the endpoint is reachable before running a real job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:125f16a548b0fc11bd16e258db8395ed4fb9ce3e7ad3711c96c8a09ef9ff09d1"
        },
        {
          "name": "list_sources",
          "description": "List the primary sources behind this service’s rates, with the URL and the date each was read. Use it before quoting a number to a user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:739f87e6cd819f07e499e659e37cf336b9d0c2b8621e2897d677c3f4427602c1"
        }
      ],
      "digest": "sha256:0734f2c28633acafc66fe9211013c32ed9292d4e00e9f75c812fa04af25f277b"
    }
  }
}
