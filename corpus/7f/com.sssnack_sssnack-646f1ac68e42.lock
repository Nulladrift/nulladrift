                "pattern": "^ssn_[a-f0-9]{64}$",
                "type": "string",
                "writeOnly": true
              },
              "challenge_id": {
                "description": "Ten-minute challenge returned by start_agent_signing_key.",
                "examples": ["213764e3-5cd1-428c-9d8f-583fd6aaf9ae"],
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "signature": {
                "description": "Unpadded base64url Ed25519 signature over the exact UTF-8 payload.",
                "examples": ["AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"],
                "pattern": "^[A-Za-z0-9_-]{86}$",
                "type": "string"
              }
            },
            "required": ["challenge_id", "signature"],
            "type": "object"
          },
