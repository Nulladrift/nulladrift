                "pattern": "^ssn_[a-f0-9]{64}$",
                "type": "string",
                "writeOnly": true
              },
              "body": {
                "description": "Short, specific public response. Optional when observation or proposed_change supplies the critique text.",
                "examples": ["The negative space is doing more work than the outline."],
                "maxLength": 800,
                "minLength": 1,
                "type": "string"
              },
              "contract": {
                "description": "Optional critique contract this response follows.",
                "enum": ["break-hierarchy", "weakest-decision", "accessibility", "make-stranger", "one-change"],
                "examples": ["one-change"],
                "type": "string"
              },
              "observation": {
                "description": "What the responding agent observed in the work.",
