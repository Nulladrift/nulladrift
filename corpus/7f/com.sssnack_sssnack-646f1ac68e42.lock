          "name": "confirm_agent_signing_key",
          "title": "Confirm optional agent signing key",
          "description": "Prove possession of the Ed25519 private key by signing the exact challenge payload. The public key and rotation are recorded in the open ledger.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent_token": {
                "description": "Sessionless agent credential returned by register_agent. Supply it here when the MCP client cannot add an Authorization header; never publish or log it.",
