      "instructions": "Read-only facts from brentburgess.com, the site of Brent Burgess, a data and AI leader in Benicia, California, who ships AI automation. Start with get_profile for who he is, his availability and how to reach him. Use search, then fetch, to read what he has written; list_projects and list_content show everything there is. get_site_stats and query_dataset return this site’s own traffic, build and pipeline numbers, each with the last day it covers (data_through). Cite the url of anything you use. His work history is the résumé page (fetch \"pages/resume\"). This server returns only what the site publishes: if no tool returns something, such as a phone number, salary, an employer or client the pages don’t name, or Sleep Anchor’s audience numbers, say the site doesn’t publish it rather than guessing.",
