{
  "lockfileVersion": 2,
  "subjects": {
    "app.catalantable/recipes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://catalantable.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "catalan-table-recipes",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The Catalan Table: traditional Catalan and Spanish recipes. 470+ tested recipes with ingredients, step-by-step instructions, and nutrition, in English, Spanish, and Catalan. Use `search` to find recipes, then `fetch` with a result id for the full recipe. `get_recipe` returns the same recipe as structured JSON; `list_categories` lists categories. Cite the recipe url when presenting a recipe.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a full recipe",
          "description": "Use this to retrieve the complete recipe (ingredients with quantities, steps, tips, nutrition) for an id returned by `search`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": false,
                "properties": {
                  "category": {
                    "type": ["string", "null"]
                  },
                  "contentType": {
                    "type": "string"
                  },
                  "date": {
                    "type": "string"
                  },
                  "locale": {
                    "enum": ["en", "es", "ca"],
                    "type": "string"
                  },
                  "tags": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["category", "contentType", "date", "locale", "tags"],
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91e09b99d3d6c3458129ad1ec7a0c6f1cf2bf00ceaea27097457d715bed83d12"
        },
        {
          "name": "get_recipe",
          "title": "Get a recipe as structured data",
          "description": "Use this when you already know a recipe's slug and want structured JSON (ingredient quantities and units, steps, servings, nutrition) instead of prose, for example to scale quantities or build a shopping list.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "enum": ["en", "es", "ca"],
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": ["string", "null"]
              },
              "contentType": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "ingredientSections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ingredients": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "quantity": {
                            "type": ["number", "string", "null"]
                          },
                          "quantityMax": {
                            "type": ["number", "string", "null"]
                          },
                          "text": {
                            "type": "string"
                          },
                          "unit": {
                            "type": "string"
                          }
                        },
                        "required": ["name", "quantity", "quantityMax", "text", "unit"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["ingredients", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "locale": {
                "enum": ["en", "es", "ca"],
                "type": "string"
              },
              "nutrition": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "basis": {
                        "enum": ["per_serving", "per_item", "per_100g"],
                        "type": "string"
                      },
                      "per100g": {
                        "additionalProperties": false,
                        "properties": {
                          "calories": {
                            "type": "number"
                          },
                          "carbs": {
                            "type": "number"
                          },
                          "fat": {
                            "type": "number"
                          },
                          "protein": {
                            "type": "number"
                          }
                        },
                        "required": ["calories", "carbs", "fat", "protein"],
                        "type": "object"
                      },
                      "source": {
                        "type": "string"
                      },
                      "values": {
                        "additionalProperties": false,
                        "properties": {
                          "calories": {
                            "type": "number"
                          },
                          "carbs": {
                            "type": "number"
                          },
                          "fat": {
                            "type": "number"
                          },
                          "protein": {
                            "type": "number"
                          }
                        },
                        "required": ["calories", "carbs", "fat", "protein"],
                        "type": "object"
                      }
                    },
                    "required": ["basis", "per100g", "source", "values"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "procedureSections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "steps": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["description", "name", "steps"],
                  "type": "object"
                },
                "type": "array"
              },
              "servings": {
                "type": ["number", "null"]
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tips": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "yield": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "label": {
                        "type": "string"
                      },
                      "quantity": {
                        "type": "number"
                      },
                      "quantityMax": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["label", "quantity", "quantityMax"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["category", "contentType", "date", "description", "id", "ingredientSections", "locale", "nutrition", "procedureSections", "servings", "tags", "tips", "title", "url", "yield"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fa2367618a0fe4eb6a25b5842790af92b9e594084782fa4cacfdfab915fa4197"
        },
        {
          "name": "list_categories",
          "title": "List recipe categories",
          "description": "Use this to browse the recipe categories (main dishes, soups, desserts, breads, sauces and preserves, drinks...) with recipe counts, before searching.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "enum": ["en", "es", "ca"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "type": "number"
                    },
                    "key": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["count", "key", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["categories"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:997c7d15f4e8822ff2abaf47eb3df8092be47851653aea5e35bfffbe2d253991"
        },
        {
          "name": "search",
          "title": "Search Catalan and Spanish recipes",
          "description": "Use this when the user wants Catalan, Spanish, or Mediterranean recipes or cooking ideas: dishes, desserts, breads, sauces, preserves, drinks, or techniques. Searches 470+ tested recipes by dish name, ingredient, or tag, in English, Spanish, or Catalan. Returns up to 10 results; call `fetch` with a result id for the full recipe.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6bc0c566c960c0bbf626422c9d0a9b9d8315c2d7463b2882bf8c2b7504121ef6"
        }
      ],
      "digest": "sha256:2c2aa66d0e36c7be1234c73428875e98e850a834a4c49ec183f2093e55bc21e3"
    }
  }
}
