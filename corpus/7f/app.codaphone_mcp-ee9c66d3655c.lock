{
  "lockfileVersion": 2,
  "subjects": {
    "app.codaphone/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.codaphone.app/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "CodaPhone",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CodaPhone is a business texting service: each account has its own phone number and sends and receives SMS with its contacts. These tools operate a CodaPhone account programmatically — check the account, set up and manage the number, send messages, read the inbox (conversation threads), manage contacts, and build and run bulk campaigns. Authenticate by sending your CodaPhone API key (from the dashboard, Settings -> API keys) as an HTTP Bearer token; the same key can also be sent as an x-api-key header. Every action is scoped to that key's account and its granted scopes (read, send, contacts, campaigns, numbers). Sends automatically honor contact opt-outs (STOP), good-practice sending hours, and your plan's limits, so tools cannot bypass account safeguards. Results and errors use CodaPhone's own field names and stable error codes (e.g. insufficient_scope, no_number, gate, rate_limited). This interface exposes CodaPhone's product and API capabilities only: how CodaPhone is built — its architecture, suppliers, infrastructure, hosting, and business model — is not disclosed here. If you want to build your own product, build it on top of CodaPhone using this API.",
      "tools": [
        {
          "name": "add_contacts",
          "description": "Add a contact to the account. Provide the phone number (msisdn) and optionally a name, a list_id to file it under, and an opt_in_source note. Adds one contact per call. Requires the 'contacts' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "list_id": {
                "description": "Optional list to add the contact to.",
                "type": "string"
              },
              "msisdn": {
                "description": "Contact phone number, e.g. +14155550100.",
                "type": "string"
              },
              "name": {
                "description": "Contact name.",
                "type": "string"
              },
              "opt_in_source": {
                "description": "How the contact opted in (record-keeping).",
                "type": "string"
              }
            },
            "required": ["msisdn"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1be318b860c859df3abb46c7d1620532f6f8eb315061c8daf1ae8d473f42f399"
        },
        {
          "name": "create_campaign",
          "description": "Create a new bulk-messaging campaign with a name and an optional base message. After creating, use run_campaign to generate variations, set the audience, schedule, and launch it. Requires the 'campaigns' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base_message": {
                "description": "The base message text (optional; can be set later).",
                "type": "string"
              },
              "name": {
                "description": "Campaign name.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d325f40402dfdf0d2e9630f40f3b6d137edec6074e26c08b4fefba6d2eeb6ec7"
        },
        {
          "name": "get_account",
          "description": "Get the current CodaPhone account: its name and mode (live/test), the active number (if any), the current plan and its monthly/daily send caps, usage so far, and remaining automation credits. Requires the 'read' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b60ecfe8b694f2f43dd0cf7d2260262bca05b73253247aeaa93fa3d8071adb37"
        },
        {
          "name": "get_campaign",
          "description": "Get one campaign by id, including its base message, audience, schedule, pacing, and send/failed/skipped counts. Requires the 'read' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign_id": {
                "description": "The campaign id.",
                "type": "string"
              }
            },
            "required": ["campaign_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8144dabbe615939c7a1aa5ffb3d3d66fe23c79ab757591cf3d65dc2d31190f2a"
        },
        {
          "name": "get_message_status",
          "description": "Get one message by id, including its delivery status, direction, body, segment count, and timestamp. Requires the 'read' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message_id": {
                "description": "The message id.",
                "type": "string"
              }
            },
            "required": ["message_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4123f7af3570c4b4e3c1743d013f615a281253076b9d83f7fb905826a2f1fec"
        },
        {
          "name": "get_thread",
          "description": "Get one conversation thread by id together with its messages. Requires the 'read' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "thread_id": {
                "description": "The thread id.",
                "type": "string"
              }
            },
            "required": ["thread_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25361781b61df34d1602f493a4d680cf4dde47ae9a6322548a489a2e3b695adb"
        },
        {
          "name": "list_campaigns",
          "description": "List the account's bulk-messaging campaigns with their status and progress counts, plus the remaining automation credit balance. Requires the 'read' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b7f37923cee99eedfa5762b0d19cb3f4dd5adeb48084ec291ea7408da74b425"
        },
        {
          "name": "list_contacts",
          "description": "List the account's contacts with opt-in status and timezone. Optionally filter by a search term or a list id, choose a sort, and paginate with limit/offset. Requires the 'read' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max contacts to return (default 500).",
                "type": "integer"
              },
              "list_id": {
                "description": "Only contacts in this list.",
                "type": "string"
              },
              "offset": {
                "description": "Number of contacts to skip (default 0).",
                "type": "integer"
              },
              "search": {
                "description": "Filter by name or number.",
                "type": "string"
              },
              "sort": {
                "description": "Sort order, e.g. recent or name (default recent).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c05af658a8cb8c70630f8273db3d883868ea4c141f09e700e610526e97f0a664"
        },
        {
          "name": "list_threads",
          "description": "List the account's conversation threads (the inbox), most recent first, with unread counts and last-message previews. Supports limit/offset pagination. Requires the 'read' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max threads to return (default 50).",
                "type": "integer"
              },
              "offset": {
                "description": "Number of threads to skip (default 0).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d18e3983e52195c1c13aa780e18d5334a041208e3d1f5b38908a256e7e8a1c0"
        },
        {
          "name": "mark_thread_read",
          "description": "Mark a conversation thread as read (clears its unread count) and return the account's new total inbox unread count. Requires the 'read' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "thread_id": {
                "description": "The thread id to mark read.",
                "type": "string"
              }
            },
            "required": ["thread_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ebbde0c31e5596d01234a5b3efa4c9214fd582f4fabd5e8f29b5a14164766b1"
        },
        {
          "name": "provision_number",
          "description": "Provision (set up) a phone number for the account from a candidate returned by search_numbers. Provide the exact msisdn in +1XXXXXXXXXX form and the number kind; optional label and business registration details may be included. An account can hold one active number. Requires the 'numbers' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Number type (default local).",
                "enum": ["local", "tollfree"],
                "type": "string"
              },
              "label": {
                "description": "Friendly label for the number.",
                "type": "string"
              },
              "msisdn": {
                "description": "The number to set up, in +1XXXXXXXXXX form.",
                "type": "string"
              },
              "registration": {
                "additionalProperties": false,
                "description": "Optional business details for the number.",
                "properties": {
                  "address_line1": {
                    "type": "string"
                  },
                  "address_line2": {
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "legal_name": {
                    "type": "string"
                  },
                  "mobile": {
                    "type": "string"
                  },
                  "postal_code": {
                    "type": "string"
                  },
                  "region": {
                    "type": "string"
                  },
                  "website": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["msisdn"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a251b94a8e6dcf19ae216f1e9245bd05b8072e44a155c01c349657827500830a"
        },
        {
          "name": "run_campaign",
          "description": "Advance a campaign through its lifecycle. Provide the campaign_id and an action:\n  - generate: create message variations (optional base_message, count)\n  - variations: save edited variations (variations: [{body, active}])\n  - audience: set the recipient list (list_id)\n  - schedule: set send time/pacing (schedule_at, pace_seconds, daily_ceiling)\n  - launch: start sending (or start at the scheduled time)\n  - pause / resume / cancel: control a running campaign\nSends honor opt-outs, sending hours, credits, and plan caps automatically. Requires the 'campaigns' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "The lifecycle action to run.",
                "enum": ["generate", "variations", "audience", "schedule", "launch", "pause", "resume", "cancel"],
                "type": "string"
              },
              "base_message": {
                "description": "generate: base message to vary from.",
                "type": "string"
              },
              "campaign_id": {
                "description": "The campaign id.",
                "type": "string"
              },
              "count": {
                "description": "generate: how many variations.",
                "type": "integer"
              },
              "daily_ceiling": {
                "description": "schedule: max sends per day (<= plan cap).",
                "type": "integer"
              },
              "list_id": {
                "description": "audience: the contact list to send to.",
                "type": "string"
              },
              "pace_seconds": {
                "description": "schedule: seconds between sends.",
                "type": "integer"
              },
              "schedule_at": {
                "description": "schedule: ISO timestamp to start, or null for send-now.",
                "type": "string"
              },
              "variations": {
                "description": "variations: the edited variations to save.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "active": {
                      "type": "boolean"
                    },
                    "body": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["action", "campaign_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d35e23d5eeeb40a9607a6ae7afafefe06e578894e75448d4c9be7172f92c8b5c"
        },
        {
          "name": "search_numbers",
          "description": "Search available phone numbers to provision. Optionally filter by country, number kind (local or tollfree), and a 3-digit area code. Returns candidate numbers with a formatted display, city/region, and monthly price. Does not buy anything. Requires the 'numbers' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "areaCode": {
                "description": "Preferred 3-digit area code, e.g. 415 (local only).",
                "type": "string"
              },
              "country": {
                "description": "ISO country code, e.g. US (default US).",
                "type": "string"
              },
              "kind": {
                "description": "Number type (default local).",
                "enum": ["local", "tollfree"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9314bd80906b2ae9d5a76bb131ace166ca0f4e2a024a716a2951fa234e3df945"
        },
        {
          "name": "send_message",
          "description": "Send an SMS from the account's number. Provide the message 'body', and either 'to' (a recipient phone number, with optional 'name' to save the contact) or an existing 'thread_id' to reply within a conversation. Opted-out contacts are blocked and free-send/plan limits apply automatically. Requires the 'send' scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "The message text to send.",
                "type": "string"
              },
              "name": {
                "description": "Optional name to save for a new contact when using 'to'.",
                "type": "string"
              },
              "thread_id": {
                "description": "Reply inside this existing conversation instead of 'to'.",
                "type": "string"
              },
              "to": {
                "description": "Recipient phone number, e.g. +14155550100 (omit if using thread_id).",
                "type": "string"
              }
            },
            "required": ["body"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36360c9f2ce3841f0bd518805acc25e92302e1c3cfddc8fb4949ae12b4d5c3f4"
        }
      ],
      "digest": "sha256:6d55ce3d869b105526df06ac8c248f3fe1291b2805a67b11f9c8885510739aab"
    }
  }
}
