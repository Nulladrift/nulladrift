{
  "lockfileVersion": 2,
  "subjects": {
    "com.obbjects/obbjects": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://obbjects.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "obbjects",
        "title": "obbjects",
        "version": "0.2.1",
        "websiteUrl": "https://obbjects.com/mcp",
        "icons": [
          {
            "src": "https://obbjects.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "obbjects is a catalog of single objects photographed or drawn on a plain white background. Search with search_objects, then use image_url directly in slides, pages, ads or mockups. On a background that isn't white, use transparent_png_url when it is set. Results marked match: 'partial' only fit some of the search words. If nothing fits, tell the user and call request_object so it gets added. Respect each object's license and keep the attribution.",
      "tools": [
        {
          "name": "get_object",
          "title": "Get object",
          "description": "Get one object by id, with image URLs, license and attribution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Object id from search_objects",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6945f0e571f9f64b623a596948fd1d0eecfabc1cc339169249e25108ad063499"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List object categories in the catalog with how many objects each has. Browse one with search_objects, setting category and leaving query empty.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7009355c31a24a983687d16130175904724eead1f85a311575ca0168b451b79c"
        },
        {
          "name": "request_object",
          "title": "Request an object",
          "description": "Ask obbjects to add an object it doesn't have yet. Use after search_objects finds no good match. Requests are reviewed and the most wanted objects are photographed or sourced first. Nothing is returned now; search again later.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "The object, as specific as useful, e.g. 'red office stapler, side view'",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "use": {
                "description": "Optional: what it is for, e.g. 'slide about office supplies'",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b8a3d937d50271298f1c7c8521bc8bafadec6e2b967fe4382597de7b5f180835"
        },
        {
          "name": "search_objects",
          "title": "Search objects",
          "description": "Search the obbjects catalog of isolated object images on a plain white background. Returns matches with image_url (1024px square WebP on white), transparent_png_url (same image with a transparent background, for placing on colored slides or pages; null if the object has none), thumbnail_url, license and attribution. Each result has match 'full' (all words matched) or 'partial'. When nothing matches fully, the response has a note and you can call request_object. Use short noun phrases like 'coffee mug' or 'red ball'. To browse, leave query empty and set category (and optionally color): you get that category's objects, newest first, up to limit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Exact category from list_categories; alone, it lists that category",
                "maxLength": 50,
                "type": "string"
              },
              "color": {
                "description": "Dominant color word, e.g. 'red'",
                "maxLength": 30,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What object you need, e.g. 'coffee mug'. Leave empty to browse a category",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d062dd6fa7e3d07f74be0fcdc02efb91996d336ca47c0d85ea8c935d164a752"
        }
      ],
      "digest": "sha256:b6d9b453572e3798b459c34c73b23200cad42f4c4177ff1f0e063f5460077c21"
    }
  }
}
