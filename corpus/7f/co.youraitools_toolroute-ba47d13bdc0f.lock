{
  "lockfileVersion": 2,
  "subjects": {
    "co.youraitools/toolroute": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/toolroute/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "toolroute",
        "title": "ToolRoute",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ToolRoute narrows a large tool list to the few tools a task needs. Call register_tools once with your tools (or a remote MCP URL) to get a set_id, then route_tools with set_id + the task for each turn and inject only the returned definitions. BM25 keyword ranking, no LLM. Free: 200 route_tools calls per IP per day; register_tools is free.",
      "tools": [
        {
          "name": "register_tools",
          "title": "Register a tool set (ToolRoute)",
          "description": "Register a tool list once and get a set_id for route_tools. Pass \"tools\" (array in MCP, OpenAI, Anthropic, Gemini or Bedrock form, max 500) or \"url\" (public remote MCP server; its tools are listed, never called). Same tools always get the same set_id; sets are kept 90 days after last use. Free.",
          "inputSchema": {
            "properties": {
              "tools": {
                "description": "Tool definitions (MCP, OpenAI, Anthropic, Gemini or Bedrock form), max 500. For route: only if you have no set_id (the set is registered on the fly).",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "Register: public remote MCP server URL (https). Tools are listed, never called.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fccf2b60e0c27b1cbf44101a46adbf7900fecff25a195bd267877dc5d0cf685"
        },
        {
          "name": "route_tools",
          "title": "Route a task to the right tools (ToolRoute)",
          "description": "Which of my tools does this task need? Send \"set_id\" (from register_tools) or \"tools\", plus \"query\" (the task). Returns a ranked shortlist (adaptive 3-12 tools, or \"k\"), confidence (high/medium/low/none), matched terms, token savings and the definitions ready to inject (\"format\": mcp, openai, anthropic, gemini or names). BM25 keyword ranking, no LLM. Free: 200 calls/day per IP, then $0.001 per call via x402 or credits.",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "Definition format (default mcp; names = names only)",
                "enum": ["mcp", "openai", "anthropic", "gemini", "names"],
                "type": "string"
              },
              "k": {
                "description": "Fixed shortlist size (default adaptive)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_k": {
                "description": "Upper bound for the adaptive size (default 12)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The task or user request to route, e.g. \"check if this wallet is sanctioned\".",
                "type": "string"
              },
              "set_id": {
                "description": "set_id (\"ts_...\" from register, or a ToolFit pin).",
                "type": "string"
              },
              "tools": {
                "description": "Tool definitions (MCP, OpenAI, Anthropic, Gemini or Bedrock form), max 500. For route: only if you have no set_id (the set is registered on the fly).",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c02e9c73209d176eacff2568b5c806abf81049da75da5387d8495c9b18a01ac"
        }
      ],
      "digest": "sha256:198a87263ecd107a24e8c41ca259e7be49acb41e10b6556fa15254a18cae92d0"
    }
  }
}
