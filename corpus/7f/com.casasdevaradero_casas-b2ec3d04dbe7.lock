        },
        {
          "name": "pedir_reserva",
          "title": "Enviar una solicitud de reserva",
          "description": "Envía al dueño la solicitud de reserva en nombre del usuario. NO es un pago ni una reserva cerrada: el dueño tiene 48 horas para aceptar o rechazar. Llama solo si el usuario ha leído los términos de ver_terminos y te ha dicho expresamente que los acepta; entonces pasa acepta_terminos = true. Necesitas su nombre real y su WhatsApp con código de país. Devuelve un enlace privado donde el usuario sigue el estado y, si el dueño acepta, ve su contacto para acordar el depósito directamente con él.",
          "inputSchema": {
            "properties": {
              "acepta_terminos": {
                "description": "true solo si el usuario leyó y aceptó expresamente los términos",
                "type": "boolean"
              },
              "casa": {
                "type": "string"
              },
              "correo": {
                "description": "Opcional: para avisarle de la respuesta",
                "type": "string"
              },
              "idioma": {
                "enum": ["es", "en"],
                "type": "string"
              },
              "llegada": {
                "type": "string"
              },
              "nombre": {
                "description": "Nombre de quien se aloja",
                "type": "string"
              },
              "personas": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "salida": {
                "type": "string"
              },
              "whatsapp": {
                "description": "WhatsApp con código de país, por ejemplo +34 600 111 222",
                "type": "string"
              }
            },
            "required": ["acepta_terminos", "casa", "llegada", "nombre", "personas", "salida", "whatsapp"],
            "type": "object"
          },
