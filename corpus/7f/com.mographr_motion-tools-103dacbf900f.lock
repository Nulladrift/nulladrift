{
  "lockfileVersion": 2,
  "subjects": {
    "com.mographr/motion-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.mographr.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mographr-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_motion_render",
          "description": "Poll a render started with render_motion_tool. Returns status, progress and (when completed) the MP4 download URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "renderId": {
                "type": "string"
              }
            },
            "required": ["renderId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check render status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4a47e880893295ae6eff93f9eeef398bfda5a1a44bb8103fc6156841df5ecdef"
        },
        {
          "name": "get_motion_tool",
          "description": "Get one Mographr tool's full schema: customizable fields (with max lengths and examples), design-system variants (use the variant id when rendering), color schemes, output size and an example render call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Tool slug from list_motion_tools, e.g. \"lower-thirds\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get motion tool schema"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b708d095efee0fa977c10e82479c9637d0fa46171492afc8ca00d4fee4114c86"
        },
        {
          "name": "list_motion_tools",
          "description": "List Mographr's free motion-graphics tools: customizable animated video templates (lower thirds, titles, intros, callouts) that render a real MP4. Each tool supports custom text, preset color schemes and multiple design systems. Free renders include a small mographr.com watermark; each tool's page offers an interactive editor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List motion tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0c48af52d06e4b5e9e6a461123fb707c4d83ebe9f9555e4c27f6b651f4e4ad96"
        },
        {
          "name": "render_motion_tool",
          "description": "Render a customized MP4 with a Mographr free tool. Pass the tool slug, optional variantId (a design-system variant from get_motion_tool; defaults to the tool's default variant), optional colorSchemeId, and `fields` — the text values keyed by field key. Returns a renderId to poll with get_motion_render plus the interactive page URL. Free renders carry a small mographr.com watermark and take ~1–3 minutes on the CPU render lane.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "colorSchemeId": {
                "description": "Color scheme id (from get_motion_tool). Optional.",
                "type": "string"
              },
              "fields": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Text values keyed by field key, e.g. {\"title\": \"Jane Doe\", \"subtitle\": \"Product Designer\"}",
                "type": "object"
              },
              "slug": {
                "type": "string"
              },
              "variantId": {
                "description": "Design-system variant id (from get_motion_tool). Optional.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Render a motion graphic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef13490f95926d61ad7d5bfd686fd89d56139cbb7282b2b9bc58e68bb68a0f12"
        }
      ],
      "digest": "sha256:95d526393f96184679186759dde2485c0a7232ce7e072849c7703c66bd4902c9"
    }
  }
}
