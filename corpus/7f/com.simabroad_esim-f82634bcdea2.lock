{
  "lockfileVersion": 2,
  "subjects": {
    "com.simabroad/esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://purgqqlrtcqxxkvfydsy.supabase.co/functions/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "simabroad-mcp",
        "title": "SimAbroad",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Travel eSIMs for 200+ destinations. Use list_destinations to check coverage and get a country_code, then search_esim_plans with that code, the trip length (min_validity_days) and data needs: results include single-country, regional and global plans, cheapest first, priced as at checkout. Hand the traveler get_buy_link's checkout link for the plan they choose; they pay on simabroad.com and get the eSIM QR code by email. No tool charges anything.",
      "tools": [
        {
          "name": "get_buy_link",
          "title": "Get a checkout link for a plan",
          "description": "Get a simabroad.com checkout link for one eSIM plan, by the id returned from search_esim_plans. Opening the link adds that exact plan to the cart and opens checkout; the traveler pays there (card, Apple Pay or Google Pay) and gets the eSIM QR code by email. Nothing is charged by calling this tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the checkout page (default 'en').",
                "enum": ["en", "es", "fr", "pt", "zh"],
                "type": "string"
              },
              "package_id": {
                "description": "Plan id from search_esim_plans (the 'id' field).",
                "pattern": "^[A-Za-z0-9+._-]{1,120}$",
                "type": "string"
              }
            },
            "required": ["package_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:600ee0488196acac052b813f8851dfc3de4a63b4dfad2d03d3e85e0b998dd8da"
        },
        {
          "name": "list_destinations",
          "title": "List destinations covered",
          "description": "List countries and regions where SimAbroad sells eSIM plans right now, with the country_code to pass to search_esim_plans. Search accepts names, common aliases ('USA', 'UK') and codes. Countries marked multi_country_only are covered by regional or global plans only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the shop_url pages (default 'en').",
                "enum": ["en", "es", "fr", "pt", "zh"],
                "type": "string"
              },
              "search": {
                "description": "Filter by destination name, alias or country code.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a57f972a5a79f032c480ec30ab1a1074378b8b6c5e110209fbc98aa959192eef"
        },
        {
          "name": "search_esim_plans",
          "title": "Search eSIM plans",
          "description": "Search SimAbroad eSIM plans for a trip. Pass country_code (ISO 2-letter, e.g. 'JP', or a code from list_destinations such as 'USPR') to get every plan that works there: single-country plans plus regional and global plans that cover it (see the coverage field). Or pass region for multi-country plans. Use min_validity_days with the trip length and min_data_gb or unlimited to match the traveler's needs. Returns only plans on sale now, cheapest first, with the USD price charged at checkout and a buy_url that opens checkout for that exact plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country_code": {
                "description": "Destination code from list_destinations: ISO 3166-1 alpha-2 (e.g. 'US', 'ES', 'JP') or a catalogue code like 'USPR'.",
                "maxLength": 6,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "description": "Language of the checkout page the buy_url opens (default 'en').",
                "enum": ["en", "es", "fr", "pt", "zh"],
                "type": "string"
              },
              "limit": {
                "description": "Max plans to return (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Only return plans at or below this USD price.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_data_gb": {
                "description": "Minimum data in GB. Unlimited plans always qualify.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "min_validity_days": {
                "description": "Trip length in days; plans valid for fewer days are left out.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "Region for multi-country plans: 'europe', 'eu-uk', 'asia', 'africa', 'africa-safari', 'americas', 'north-america', 'latin-america', 'caribbean', 'middle-east', 'oceania' or 'global'. Don't combine with country_code.",
                "type": "string"
              },
              "unlimited": {
                "description": "true for unlimited-data plans only.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a1952737591679e5c86385472a31771d13d2e9fcfdfdb7b85bb6cac0435173a4"
        }
      ],
      "digest": "sha256:91bacfbe6f11e7c33bcd0788f2fec82efd9fb91c07b8eb93ab1af81ff6abda9a"
    }
  }
}
