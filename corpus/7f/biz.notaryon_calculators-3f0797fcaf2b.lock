        {
          "name": "delivery_delay_compensation",
          "title": "delivery delay compensation",
          "description": "Statutory compensation for late delivery of a new apartment by a developer under section 5A of the Israeli Sale (Apartments) Law: grace period and multipliers of the rent of a similar apartment. Runs the official calculator of dira-law.co.il.",
