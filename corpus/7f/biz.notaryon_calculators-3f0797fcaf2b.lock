        {
          "name": "apartment_transfer_to_relative",
          "title": "Transferring an apartment to a relative",
          "description": "Transferring an apartment to a relative in Israel: compares a gift, a sale and inheritance, with purchase tax (one third or one quarter for relatives without consideration), land appreciation tax, the 4-year cooling period (s.49B(5) and 49H) and the points to check. Runs the official calculator of dira-law.co.il.",
          "inputSchema": {
            "properties": {
              "appreciation_tax": {
                "description": "If the sale is taxable: estimated land appreciation tax, ILS",
                "type": "number"
              },
              "date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "giver_single_apartment": {
                "description": "Does the giver own only one residential apartment",
                "enum": ["unk", "yes", "no"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "recipient_birth_date": {
                "description": "Recipient's date of birth, if under 18, YYYY-MM-DD",
                "type": "string"
              },
              "recipient_lives_there": {
                "description": "The recipient will live in the apartment permanently",
                "type": "boolean"
              },
              "recipient_status": {
                "description": "single = it will be the recipient's only apartment; add = the recipient already owns an apartment",
                "enum": ["single", "add"],
                "type": "string"
              },
              "relation": {
                "description": "Recipient in relation to the giver: desc = child or grandchild; dspouse = spouse of a child or grandchild; spouselive = spouse living with the giver; spouse = spouse not living together; parent; gparent = grandparent; step = child or grandchild of the spouse; sibpar = sibling where the parents gave; sib = sibling; other",
                "enum": ["desc", "dspouse", "spouselive", "spouse", "parent", "gparent", "step", "sibpar", "sib", "other"],
                "type": "string"
              },
              "sale_exempt": {
                "description": "If sold: is the sale exempt from land appreciation tax (sole residential apartment)",
                "enum": ["unk", "yes", "no"],
                "type": "string"
              },
              "sale_price": {
                "description": "Sale price, if different from the value, ILS",
                "type": "number"
              },
              "value": {
                "description": "Market value of the apartment, ILS",
                "type": "number"
              }
            },
            "required": ["relation", "value"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator_url": {
                "description": "The calculator page on the office website, to cite",
                "format": "uri",
                "type": "string"
