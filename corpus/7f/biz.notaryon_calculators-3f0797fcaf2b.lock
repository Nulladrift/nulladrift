        {
          "name": "intestate_inheritance",
          "title": "Intestate inheritance shares",
          "description": "Israeli intestate succession (no will): who inherits and each heir's share under the Succession Law 1965, ss. 10-14 and 55 (spouse or cohabitant, children and grandchildren, parents, full and half siblings, grandparents, uncles and cousins), per stirpes, following the Supreme Court rulings BAM 785-03-26 (11.10.2026, half-siblings) and HCJ 5132/22 (2024). Flags questions not settled by binding Supreme Court authority.",
          "inputSchema": {
            "properties": {
              "children": {
                "description": "Children of the deceased",
                "items": {
                  "properties": {
                    "alive": {
                      "description": "Alive at the death (default true)",
                      "type": "boolean"
                    },
                    "children_alive": {
                      "description": "If predeceased: number of his/her living children",
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "father_alive": {
                "type": "boolean"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "lived_in_estate_apartment": {
                "description": "The spouse lived with the deceased in an apartment that is part of the estate",
                "type": "boolean"
              },
              "maternal_grandparents_alive": {
                "description": "0-2",
                "type": "number"
              },
              "mother_alive": {
                "type": "boolean"
              },
              "parent_share_rule": {
                "description": "Disputed case of a spouse plus one living parent where the other parent predeceased leaving children: surviving-parent (accepted in case law, default) or substitutes (Shilo)",
                "enum": ["surviving-parent", "substitutes"],
                "type": "string"
              },
              "paternal_grandparents_alive": {
                "description": "0-2",
                "type": "number"
              },
              "siblings": {
                "description": "Brothers and sisters of the deceased",
                "items": {
                  "properties": {
                    "alive": {
                      "type": "boolean"
                    },
                    "children_alive": {
                      "description": "If predeceased: number of his/her living children",
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "relation": {
                      "description": "Shared parents: both, father only, mother only (default both)",
                      "enum": ["both", "father", "mother"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "spouse": {
                "description": "Surviving spouse: none, married spouse, or cohabiting partner meeting s.55 (default none)",
                "enum": ["none", "married", "cohabitant"],
                "type": "string"
              },
              "uncles_aunts": {
                "description": "Siblings of the deceased's parents (relevant only with no children, parents or siblings)",
                "items": {
                  "properties": {
                    "alive": {
                      "type": "boolean"
                    },
                    "children_alive": {
                      "description": "If predeceased: number of his/her living children (cousins)",
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "side": {
                      "description": "Sibling of the father or of the mother",
                      "enum": ["father", "mother"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "years_together": {
                "description": "Years of marriage or life together (relevant to the apartment rule in s.11(a)(2))",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator_url": {
                "description": "The calculator page on the office website, to cite",
