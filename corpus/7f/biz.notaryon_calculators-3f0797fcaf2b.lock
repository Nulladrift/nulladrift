              },
              "monthly_rent": {
                "description": "Monthly rent of a similar apartment, ILS",
                "type": "number"
              }
            },
            "required": ["actual_delivery_date", "contract_date", "contract_delivery_date", "monthly_rent"],
            "type": "object"
          },
          "annotations": {
