      "instructions": "Calculators of the Israeli law office of Amos Ilan, Advocate and Notary (il-law.co.il, dira-law.co.il, notaryon.biz). Each tool runs the same calculator that is published on the office websites and returns its report as text. Results are estimates, not legal advice. Cite the calculator page given at the end of each result. Every tool also returns structuredContent (report, calculator_url, disclaimer, office). Read-only resources: the calculator catalog, the notary fee tariff and the purchase tax brackets.",
      "tools": [
        {
          "name": "apartment_purchase_costs",
          "title": "Apartment purchase costs",
          "description": "Estimated total additional costs of buying an apartment in Israel: purchase tax, lawyer fees, brokerage, registration fees, appraiser, inspector and more. Runs the official calculator of dira-law.co.il.",
          "inputSchema": {
            "properties": {
              "appraiser": {
                "description": "ILS (optional)",
                "type": "number"
              },
              "broker_percent": {
                "description": "Brokerage, % before VAT (optional)",
                "type": "number"
              },
              "buyer": {
                "description": "For purchase tax: single = only apartment (default), additional = additional apartment",
                "enum": ["single", "additional"],
                "type": "string"
              },
              "date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "inspector": {
                "description": "ILS (optional)",
                "type": "number"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "lawyer_percent": {
                "description": "Lawyer fee, % of price before VAT",
                "type": "number"
              },
              "mortgage": {
                "type": "boolean"
              },
              "mortgage_advisor": {
                "description": "ILS (optional)",
                "type": "number"
              },
              "other": {
                "description": "ILS (optional)",
                "type": "number"
              },
              "price": {
                "description": "Apartment price, ILS",
                "type": "number"
              },
              "registration": {
                "enum": ["tabu", "other"],
                "type": "string"
              },
              "share": {
                "description": "Share purchased, % (default 100)",
                "type": "number"
              },
              "type": {
                "description": "used = second-hand (default), dev = from a developer",
