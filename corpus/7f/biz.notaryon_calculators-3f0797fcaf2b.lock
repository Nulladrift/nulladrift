        },
        {
          "name": "apostille_country_check",
          "title": "apostille country check",
          "description": "Is a country (or territory) party to the Hague Apostille Convention in relation to Israel? Returns whether an Israeli document needs only an apostille or consular legalisation, based on the HCCH status table, including objections and territorial extensions.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name in English or Hebrew",
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9c60460987fb5eed2a3921af923016d3c39d1e7790d9253f3dabff5561aa8d1"
        },
        {
          "name": "capital_gains_tax",
          "title": "capital gains tax",
          "description": "Israeli land appreciation tax (mas shevach) on selling real estate: real gain, linear tax calculation, deductions indexed to the CPI, and the residential exemptions (single apartment s.49B(2), inherited apartment s.49B(5), one-time exemption for two apartments s.49H). Runs the official calculator of dira-law.co.il.",
          "inputSchema": {
            "properties": {
              "deductions": {
                "description": "Deductible expenses (purchase tax, lawyer fees, brokerage, improvements...)",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "ILS",
                      "type": "number"
                    },
                    "date": {
                      "description": "Date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "type": {
                      "description": "exp = expense (fees, brokerage, purchase tax), impr = improvement (date = completion), tax = property tax, int = real interest, after = expense paid after the sale",
                      "enum": ["exp", "impr", "tax", "int", "after"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "depreciation": {
                "description": "Depreciation deducted or allowed, ILS (optional)",
                "type": "number"
              },
              "kind": {
                "description": "dwell = residential apartment (default), other = other real estate right, igud = right in a real estate association",
                "enum": ["dwell", "other", "igud"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "purchase_cost": {
                "description": "Purchase value of the whole property, ILS",
                "type": "number"
              },
              "purchase_date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "qualified_dwelling": {
                "description": "The apartment served mainly for residence during 4/5 of the gain period or the 4 years before the sale (default true for dwell)",
                "type": "boolean"
              },
              "sale_date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "sale_value": {
                "description": "Sale value of the whole property, ILS",
                "type": "number"
              },
              "sellers": {
                "description": "Sellers (default: one Israeli resident individual with 100%)",
                "items": {
                  "properties": {
                    "exemption": {
                      "description": "none, b2 = single apartment s.49B(2), b5 = inherited apartment s.49B(5), h = one-time two-apartment exemption s.49H",
                      "enum": ["none", "b2", "b5", "h"],
                      "type": "string"
                    },
                    "exemption_conditions_met": {
                      "description": "The seller declares that all the statutory conditions of the requested exemption are met (default true)",
                      "type": "boolean"
                    },
                    "share": {
                      "description": "Share in the property, %",
                      "type": "number"
                    },
                    "type": {
                      "enum": ["res", "foreign", "corp"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["purchase_cost", "purchase_date", "sale_date", "sale_value"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e590101a52a50ee4267a60acf1c7c5086220f1248518be3d2b96f7c66ad7db4"
        },
        {
          "name": "combination_vs_cash",
          "title": "combination vs cash",
          "description": "Compares selling land for cash with a combination deal (land for apartments) with a developer, in present-value terms. Runs the official calculator of dira-law.co.il.",
          "inputSchema": {
            "properties": {
              "cash_costs": {
                "description": "Costs in the cash sale, ILS",
                "type": "number"
              },
              "cash_from_developer": {
                "description": "Cash payment from the developer, ILS",
                "type": "number"
              },
              "cash_tax": {
                "description": "Land appreciation tax in the cash sale, ILS",
                "type": "number"
              },
              "combo_costs": {
                "description": "Costs in the combination deal, ILS",
                "type": "number"
              },
              "combo_tax": {
                "description": "Tax in the combination deal, ILS",
                "type": "number"
              },
              "discount_rate": {
                "description": "Annual discount rate, %",
                "type": "number"
              },
              "land_share_sold": {
                "description": "Share of the land sold to the developer, %",
                "type": "number"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "months": {
                "description": "Months to delivery",
                "type": "number"
              },
              "months_to_balance": {
                "description": "Months to the balance payment",
                "type": "number"
              },
              "pay_now_percent": {
                "description": "% paid at signing",
                "type": "number"
              },
              "price": {
                "description": "Cash price offered, ILS",
                "type": "number"
              },
              "purchase_cost": {
                "description": "Cost of acquiring the property, ILS",
                "type": "number"
              },
              "qualified_residence_exempt": {
                "type": "boolean"
              },
              "rent": {
                "description": "Rent from the developer during construction, ILS per month",
                "type": "number"
              },
              "unit_value": {
                "description": "Estimated value of each apartment at delivery, ILS",
                "type": "number"
              },
              "units": {
                "description": "Number of apartments received",
                "type": "number"
              }
            },
            "required": ["months", "price", "unit_value", "units"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3437672260f9bf69d2d379148f1976651db6a2ce3b6d899e683b98a307f17afd"
        },
        {
          "name": "construction_index_linkage",
          "title": "construction index linkage",
          "description": "Linkage of payments to a developer to the Israeli construction inputs index (madad tsumot habniya) under the Sale (Apartments) Law amendment: only 50% of each payment is linked, the cap at the contractual delivery date. Runs the official calculator of dira-law.co.il.",
          "inputSchema": {
            "properties": {
              "base_index": {
                "description": "Base index (optional)",
                "type": "number"
              },
              "contract_date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "delivery_date": {
                "description": "Contractual delivery date, YYYY-MM-DD",
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "linked_share_percent": {
                "description": "Linked share of each payment under the contract, % (0-50, default 50)",
                "type": "number"
              },
              "payments": {
                "items": {
                  "properties": {
                    "amount": {
                      "description": "ILS",
                      "type": "number"
                    },
                    "date": {
                      "description": "Date, YYYY-MM-DD",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date"],
                  "type": "object"
                },
                "type": "array"
              },
              "price": {
                "description": "Apartment price in the contract, ILS",
                "type": "number"
              }
            },
            "required": ["contract_date", "delivery_date", "payments", "price"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:286d11fa66b3ad939cba322653db83f6537d471f0fb44c147c559839cb45334a"
        },
        {
          "name": "court_deadline",
          "title": "court deadline",
          "description": "Last day for filing a pleading, motion or appeal in Israeli civil courts under the Civil Procedure Regulations 2018: counts from service, excludes court recess (Sukkot, Passover, summer), moves a last day falling on Friday, Saturday or a holiday, and applies reg. 161 for late electronic service. Runs the official deadlines calculator of il-law.co.il.",
          "inputSchema": {
            "properties": {
              "act": {
                "description": "defense = statement of defence; defmed = defence in a medical malpractice claim; deffast = defence in expedited procedure; defevict = defence in an eviction claim; reply = reply to defence; third = third-party notice; thirdfast = third-party notice in expedited procedure; amend = amended pleading; motion = response to a motion; reqlist = response to request for documents/interrogatories; setaside = motion to set aside a judgment; appeal = appeal; crossapp = cross-appeal; appresp = response/reply in appeal; medcounter = counter expert opinion (medical)",
                "enum": ["defense", "defmed", "deffast", "defevict", "reply", "third", "thirdfast", "amend", "motion", "reqlist", "setaside", "appeal", "crossapp", "appresp", "medcounter"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "service_date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "service_method": {
                "description": "elec = electronic (Net Hamishpat/e-mail), mail = registered mail, personal = personal delivery, fax, court = given in court",
                "enum": ["elec", "mail", "personal", "fax", "court"],
                "type": "string"
              },
              "service_time": {
                "description": "HH:MM, for electronic or fax service (optional)",
                "type": "string"
              }
            },
            "required": ["act", "service_date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2e74905d50841b34944c5ac9777981004b114a343f463cbbd14127a2e579a2fe"
        },
        {
          "name": "court_fees",
          "title": "court fees",
          "description": "Israeli court filing fees (agra) for a civil claim by type of proceeding, court and claim amount, under the Courts Regulations (Fees). Runs the official calculator of il-law.co.il.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Claim amount, ILS",
                "type": "number"
              },
              "court": {
                "description": "mag = Magistrates, dist = District",
                "enum": ["mag", "dist"],
                "type": "string"
              },
              "filed": {
                "description": "Filing date (only together with second_half_paid, for linkage of the second half), YYYY-MM-DD",
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "second_half_paid": {
                "description": "Date the second half of the fee was paid, YYYY-MM-DD",
                "type": "string"
              },
              "type": {
                "description": "money = monetary claim; reg3 = claim under reg. 3; other = non-monetary; body = bodily injury; sex = sexual offence damages; amend = amended claim; rent = eviction; insolv = insolvency; cc = counterclaim/third party; small = small claims; fam = family court; exec = execution office; appeal = appeal",
                "enum": ["money", "reg3", "other", "body", "sex", "amend", "rent", "insolv", "cc", "small", "fam", "exec", "appeal"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
