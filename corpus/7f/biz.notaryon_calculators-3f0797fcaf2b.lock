        {
          "name": "interest_and_linkage",
          "title": "interest and linkage",
          "description": "Linkage differentials and interest on a judgment debt under the Israeli Adjudication of Interest and Linkage Law (including the 2026 amendment rules): CPI linkage and statutory interest per period. Runs the official calculator of il-law.co.il.",
          "inputSchema": {
            "properties": {
              "amounts": {
                "items": {
                  "properties": {
                    "amount": {
                      "description": "ILS",
                      "type": "number"
                    },
                    "description": {
                      "type": "string"
                    },
                    "due": {
                      "description": "Date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "end": {
                      "description": "Date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "kind": {
                      "description": "award = principal (default), costs = costs and fees",
                      "enum": ["award", "costs"],
                      "type": "string"
                    },
                    "start": {
                      "description": "Date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "track": {
                      "description": "What was awarded: shekel = nominal amount with statutory interest and linkage (default), link = linkage only, linkint = linkage and interest",
                      "enum": ["shekel", "link", "linkint"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "decision_date": {
                "description": "Date of the judgment/decision that set the debt, YYYY-MM-DD",
                "type": "string"
              },
              "end_date": {
                "description": "Common end date (default: today), YYYY-MM-DD",
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              }
            },
            "required": ["amounts", "decision_date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
