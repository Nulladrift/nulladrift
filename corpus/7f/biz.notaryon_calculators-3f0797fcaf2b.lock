        {
          "name": "interest_and_linkage",
          "title": "Interest and CPI linkage",
          "description": "Linkage differentials and interest on a judgment debt under the Israeli Adjudication of Interest and Linkage Law (including the 2026 amendment rules): CPI linkage and statutory interest per period. Runs the official calculator of il-law.co.il.",
          "inputSchema": {
            "properties": {
