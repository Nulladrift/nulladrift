        {
          "name": "capital_gains_tax",
          "title": "Israeli land appreciation tax (mas shevach)",
          "description": "Israeli land appreciation tax (mas shevach) on selling real estate: real gain, linear tax calculation, deductions indexed to the CPI, and the residential exemptions (single apartment s.49B(2), inherited apartment s.49B(5), one-time exemption for two apartments s.49H). Runs the official calculator of dira-law.co.il.",
          "inputSchema": {
            "properties": {
              "deductions": {
                "description": "Deductible expenses (purchase tax, lawyer fees, brokerage, improvements...)",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "ILS",
                      "type": "number"
                    },
                    "date": {
                      "description": "Date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "type": {
                      "description": "exp = expense (fees, brokerage, purchase tax), impr = improvement (date = completion), tax = property tax, int = real interest, after = expense paid after the sale",
                      "enum": ["exp", "impr", "tax", "int", "after"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "depreciation": {
                "description": "Depreciation deducted or allowed, ILS (optional)",
                "type": "number"
              },
              "kind": {
                "description": "dwell = residential apartment (default), other = other real estate right, igud = right in a real estate association",
                "enum": ["dwell", "other", "igud"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "purchase_cost": {
                "description": "Purchase value of the whole property, ILS",
                "type": "number"
              },
              "purchase_date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "qualified_dwelling": {
                "description": "The apartment served mainly for residence during 4/5 of the gain period or the 4 years before the sale (default true for dwell)",
                "type": "boolean"
              },
              "sale_date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "sale_value": {
                "description": "Sale value of the whole property, ILS",
                "type": "number"
              },
              "sellers": {
                "description": "Sellers (default: one Israeli resident individual with 100%)",
                "items": {
                  "properties": {
                    "exemption": {
                      "description": "none, b2 = single apartment s.49B(2), b5 = inherited apartment s.49B(5), h = one-time two-apartment exemption s.49H",
                      "enum": ["none", "b2", "b5", "h"],
                      "type": "string"
                    },
                    "exemption_conditions_met": {
                      "description": "The seller declares that all the statutory conditions of the requested exemption are met (default true)",
                      "type": "boolean"
                    },
                    "share": {
                      "description": "Share in the property, %",
                      "type": "number"
                    },
                    "type": {
                      "enum": ["res", "foreign", "corp"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["purchase_cost", "purchase_date", "sale_date", "sale_value"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator_url": {
                "description": "The calculator page on the office website, to cite",
                "format": "uri",
                "type": "string"
              },
              "disclaimer": {
                "type": "string"
              },
              "office": {
                "type": "string"
              },
              "report": {
                "description": "The calculator report (same text as the content block, without the footer)",
                "type": "string"
              }
            },
            "required": ["calculator_url", "disclaimer", "office", "report"],
            "type": "object"
