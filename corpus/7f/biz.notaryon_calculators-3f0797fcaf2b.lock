        {
          "name": "notary_fee",
          "title": "Israeli notary fee",
          "description": "Israeli notary fees: the maximum fee a notary may charge under the Notaries Regulations (Service Fees), for signature certification, true copy, translation certification, will, affidavit, prenuptial agreement, life certificate, revocation of a power of attorney, noting of a bill, or any other act; with the after-hours surcharge, service outside the office and VAT. Uses the fee table of the official calculator of notaryon.biz (2026 amounts).",
          "inputSchema": {
            "properties": {
              "after_hours": {
                "description": "Service outside regular hours (50% surcharge; not for service outside the office)",
                "type": "boolean"
              },
              "amount": {
                "description": "bill: amount of the instrument, ILS",
                "type": "number"
              },
              "copies": {
                "description": "sig: copies certified at the same time; revoke: certified copies bearing the revocation note",
                "type": "number"
              },
              "extra_certificates": {
                "description": "copy/trans/will/aff/mamon: additional certificates of the same document at the same time",
                "type": "number"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "notary_translates": {
                "description": "sig/will/aff/mamon: the notary also translates the document (adds half the translation fee)",
                "type": "boolean"
              },
              "on_behalf": {
                "description": "sig: how many of them sign on behalf of another (company or power of attorney)",
                "type": "number"
              },
              "other_language": {
                "description": "The document is drawn up in a language other than Hebrew, Arabic or English",
                "type": "boolean"
              },
              "outside_minutes": {
                "description": "Minutes spent outside the office (default 60)",
                "type": "number"
              },
              "outside_office": {
                "description": "Service outside the notary office",
                "type": "boolean"
              },
              "pages": {
                "description": "copy: number of pages (default 1)",
                "type": "number"
              },
              "persons": {
                "description": "will: number of testators; aff: number of deponents (default 1)",
                "type": "number"
              },
              "service": {
                "description": "sig = signature certification; copy = certified true copy; trans = certification of a translation; will = will made before a notary; aff = affidavit/declaration; mamon = certification of a prenuptial (property) agreement; alive = life certificate; revoke = revocation of a power of attorney; bill = noting/protest of a negotiable instrument; other = an act with no fee set in the regulations",
                "enum": ["sig", "copy", "trans", "will", "aff", "mamon", "alive", "revoke", "bill", "other"],
                "type": "string"
              },
              "signers": {
                "description": "sig: number of signatories (default 1)",
                "type": "number"
              },
              "travel_costs": {
                "description": "Travel expenses, ILS (not set by the regulations)",
                "type": "number"
              },
              "words": {
                "description": "trans: number of words in the translation; for sig/will/aff/mamon with notary_translates: words of the translation made by the notary",
                "type": "number"
              }
            },
            "required": ["service"],
            "type": "object"
