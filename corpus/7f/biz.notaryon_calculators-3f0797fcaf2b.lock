        {
          "name": "purchase_tax",
          "title": "purchase tax",
          "description": "Israeli purchase tax (mas rechisha) on buying real estate: apartment, land, business property or farm. Uses the brackets in force on the transaction date (Land Taxation Law s.9 and the Tax Authority instructions). Runs the official calculator of dira-law.co.il.",
