        {
          "name": "court_deadline",
          "title": "Civil court deadline",
          "description": "Last day for filing a pleading, motion or appeal in Israeli civil courts under the Civil Procedure Regulations 2018: counts from service, excludes court recess (Sukkot, Passover, summer), moves a last day falling on Friday, Saturday or a holiday, and applies reg. 161 for late electronic service. Runs the official deadlines calculator of il-law.co.il.",
          "inputSchema": {
            "properties": {
              "act": {
                "description": "defense = statement of defence; defmed = defence in a medical malpractice claim; deffast = defence in expedited procedure; defevict = defence in an eviction claim; reply = reply to defence; third = third-party notice; thirdfast = third-party notice in expedited procedure; amend = amended pleading; motion = response to a motion; reqlist = response to request for documents/interrogatories; setaside = motion to set aside a judgment; appeal = appeal; crossapp = cross-appeal; appresp = response/reply in appeal; medcounter = counter expert opinion (medical)",
                "enum": ["defense", "defmed", "deffast", "defevict", "reply", "third", "thirdfast", "amend", "motion", "reqlist", "setaside", "appeal", "crossapp", "appresp", "medcounter"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "service_date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "service_method": {
                "description": "elec = electronic (Net Hamishpat/e-mail), mail = registered mail, personal = personal delivery, fax, court = given in court",
                "enum": ["elec", "mail", "personal", "fax", "court"],
                "type": "string"
              },
              "service_time": {
                "description": "HH:MM, for electronic or fax service (optional)",
                "type": "string"
              }
            },
            "required": ["act", "service_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator_url": {
                "description": "The calculator page on the office website, to cite",
