        {
          "name": "construction_defects_check",
          "title": "Construction defects check",
          "description": "Construction defects check for an apartment in Israel: for each defect, whether it is still within the inspection (bedek) or warranty period under the Sale (Apartments) Law, notice deadlines, the contractor's right to repair, limitation, and which documents to gather. Runs the official defects diagnoser of il-law.co.il.",
          "inputSchema": {
            "properties": {
              "bought_from": {
                "description": "dev = from the contractor/developer; sub = from the first buyer of a new apartment; old = second-hand apartment; self = self-build with a building contractor",
                "enum": ["dev", "sub", "old", "self"],
                "type": "string"
              },
              "building_completed": {
                "description": "Date construction of the building was completed (optional), YYYY-MM-DD",
                "type": "string"
              },
              "contract_date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "defects": {
                "description": "The defects (up to 10)",
                "items": {
                  "properties": {
                    "category": {
                      "description": "0 damp/waterproofing, 1 piping, 2 flooring/cladding, 3 windows/doors/aluminium, 4 machinery/boilers, 5 yard works, 6 thermal insulation, 7 cracks over 1.5 mm in non-load-bearing elements, 8 external cladding, 9 other (plaster, paint, electrical), 10 stability/load-bearing, 11 non-conformity with specification or standard",
                      "type": "number"
                    },
                    "contractor_response": {
                      "description": "none = not approached yet; wait = approached, awaiting repair; refused = refused or did not repair; again = repaired and the defect recurred; urgent = urgent defect not repaired; done = repaired",
                      "enum": ["none", "wait", "refused", "again", "urgent", "done"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "discovered": {
                      "description": "Date, YYYY-MM-DD",
                      "type": "string"
                    },
                    "notified": {
                      "description": "Date the contractor was notified in writing, YYYY-MM-DD",
                      "type": "string"
                    },
                    "visible": {
                      "description": "Could it be found on reasonable inspection at delivery: hidden = no; open = yes; unk = not sure",
                      "enum": ["hidden", "open", "unk"],
                      "type": "string"
                    }
                  },
                  "required": ["category", "discovered"],
                  "type": "object"
                },
                "type": "array"
              },
              "delivery_date": {
                "description": "Date the apartment was delivered to the first buyer, YYYY-MM-DD",
                "type": "string"
              },
              "documents": {
                "description": "Documents already held: sale contract and specification, delivery protocol, maintenance instructions, dated photos, notices and replies, repair records, engineer's opinion",
                "items": {
                  "enum": ["contract", "protocol", "manual", "photos", "letters", "repairs", "expert"],
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "location": {
                "description": "Where the defects are: apt = in the apartment; common = common property; both",
                "enum": ["apt", "common", "both"],
                "type": "string"
              },
              "self_build_clause": {
                "description": "self: the contract with the contractor applies the inspection and warranty periods of the Sale Law",
                "type": "boolean"
              }
            },
            "required": ["bought_from", "defects", "delivery_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator_url": {
                "description": "The calculator page on the office website, to cite",
                "format": "uri",
                "type": "string"
              },
              "disclaimer": {
                "type": "string"
              },
              "office": {
                "type": "string"
              },
              "report": {
                "description": "The calculator report (same text as the content block, without the footer)",
                "type": "string"
              }
            },
            "required": ["calculator_url", "disclaimer", "office", "report"],
            "type": "object"
          },
