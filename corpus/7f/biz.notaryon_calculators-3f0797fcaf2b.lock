                "enum": ["single", "additional", "oleh", "foreign", "disabled"],
                "type": "string"
              },
              "date": {
                "description": "Date, YYYY-MM-DD",
                "type": "string"
              },
              "deal": {
                "description": "sale = purchase for consideration (default), gift = transfer without consideration from a relative, spouse = transfer of a residential apartment without consideration to a spouse living in it",
                "enum": ["sale", "gift", "spouse"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the result (default he)",
                "enum": ["he", "en"],
                "type": "string"
              },
              "replacement_apartment": {
                "description": "Single apartment bought as a replacement while still owning the previous one (to be sold within the statutory period)",
                "type": "boolean"
              },
              "value": {
                "description": "Value of the property / consideration in ILS (from a developer: including VAT)",
                "type": "number"
              }
            },
