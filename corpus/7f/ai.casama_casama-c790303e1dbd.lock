{
  "lockfileVersion": 2,
  "subjects": {
    "ai.casama/casama": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.casama.ai/mcp/docs"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "casama-docs",
        "version": "0.2.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "gallery_search",
          "title": "Search the Casama gallery",
          "description": "Search the Casama gallery (gallery.casama.ai) for ready-made skills, apps, routines, bots, plugins, starter sets and looks before writing a new one. Returns the best matches with what each can access, what it needs and its page. Add one in Casama from its page, or start from it with `casama init --from-gallery bot/<id>` or `plugin/<id>`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "types": {
                "items": {
                  "enum": ["skill", "app", "routine", "bot", "plugin", "set", "theme", "scheme", "wallpaper"],
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9e43bfe98c2360f8d7360faa62f4d4abf4c49d6f6cc07044aeb7cab8742aac78"
        },
        {
          "name": "get_api_operation",
          "title": "Look up the Casama API",
          "description": "Find operations in the Casama HTTP API (OpenAPI 3.1) and show their parameters, request body and responses as types. Query by operationId (\"createBot\"), \"METHOD /path\" (\"POST /v1/conversations/{id}/messages\", concrete ids work too) or keywords (\"cancel run\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ae65be391282f28431bbe74b4364b57f9621c4da0d2dace34a03e7f331b293e9"
        },
        {
          "name": "list_doc_pages",
          "title": "List docs pages",
          "description": "Every page on docs.casama.ai with its title and address.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:33f6339863ac7f4ede9a05d8bcf4caca2b83eb39cb2c7bc8a8634ba202e4d1fe"
        },
        {
          "name": "read_doc",
          "title": "Read a docs page",
          "description": "One docs page as markdown, by path or address: \"/develop/plugins\", \"develop/api.md\" or \"https://docs.casama.ai/guide/skills\". Pass section to get one ## section only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "page": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "description": "A ## heading on the page, e.g. \"Secrets\"",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:935a07ff20ef012c071983c69f0b8fede2358c61a450061becdb08ef145e0847"
        },
        {
          "name": "search_docs",
          "title": "Search the Casama docs",
          "description": "Keyword search over docs.casama.ai (guides, self-hosting, the API, CLI, SDKs, plugins, webhooks, A2A, bot templates, contributing). Returns the best-matching sections with their address; read a whole page with read_doc.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
