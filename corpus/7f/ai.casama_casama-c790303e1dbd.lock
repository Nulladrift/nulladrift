{
  "lockfileVersion": 2,
  "subjects": {
    "ai.casama/casama": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.casama.ai/mcp/docs"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "casama-docs",
        "version": "0.2.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "gallery_search",
          "title": "Search the Casama gallery",
          "description": "Search the Casama gallery (gallery.casama.ai) for ready-made skills, apps, routines, bots, plugins, starter sets and looks before writing a new one. Returns the best matches with what each can access, what it needs and its page. Add one in Casama from its page, or start from it with `casama init --from-gallery bot/<id>` or `plugin/<id>`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "types": {
                "items": {
                  "enum": ["skill", "app", "routine", "bot", "plugin", "set", "theme", "scheme", "wallpaper"],
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Casama gallery"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8830ec09e6e2b2cadca05cb65c61b0e3275fcf5072c7dbaf2a15470ccf98e871"
        },
        {
          "name": "get_api_operation",
          "title": "Look up the Casama API",
          "description": "Find operations in the Casama HTTP API (OpenAPI 3.1) and show their parameters, request body and responses as types. Query by operationId (\"createBot\"), \"METHOD /path\" (\"POST /v1/conversations/{id}/messages\", concrete ids work too) or keywords (\"cancel run\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up the Casama API"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:827c65ae1ac18a7a01d980dcce83e1dfa711279f0ef3ab420a5633d263238803"
        },
        {
          "name": "list_doc_pages",
          "title": "List docs pages",
          "description": "Every page on docs.casama.ai with its title and address.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List docs pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:421a6de056ce04a366b58c435e5c1a7086b6ebd7fa5741373493e82922e1fce3"
        },
        {
          "name": "read_doc",
          "title": "Read a docs page",
          "description": "One docs page as markdown, by path or address: \"/develop/plugins\", \"develop/api.md\" or \"https://docs.casama.ai/guide/skills\". Pass section to get one ## section only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "page": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "description": "A ## heading on the page, e.g. \"Secrets\"",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a docs page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
