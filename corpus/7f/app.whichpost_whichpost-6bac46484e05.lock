        {
          "name": "check_fit",
          "title": "Is WhichPost a fit?",
          "description": "A quick, fixed questionnaire: from the revenue source, creators per month, new sign-ups or installs a day and a few yes/no answers, it says whether WhichPost is a good fit now, which plan suits, and the next step. The same answers always give the same result; answers are not stored. Needs no sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apps": {
                "description": "How many apps or products.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "creators_per_month": {
                "description": "How many creators the team pays for posts in a typical month.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "has_paying_customers": {
                "description": "Whether the product already has paying customers.",
                "type": "boolean"
              },
              "history_days_before_campaign": {
                "description": "Days of sales history before the campaign's first post.",
                "maximum": 3650,
                "minimum": 0,
                "type": "integer"
              },
              "is_agency": {
                "description": "Whether this is an agency running creators for clients.",
                "type": "boolean"
              },
              "new_signups_per_day": {
                "description": "New sign-ups, trials or installs on a typical day.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "revenue_source": {
                "description": "Where the product's payments are recorded. 'none' if it has no payments yet.",
                "enum": ["stripe", "revenuecat", "superwall", "other", "none"],
                "type": "string"
              },
              "spark_ads_only": {
                "description": "Whether the campaign runs only as TikTok Spark Ads.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "next_step": {
                "type": "string"
              },
              "reasons": {
                "type": "array"
              },
              "verdict": {
                "enum": ["good_fit", "possible_fit", "not_yet"],
                "type": "string"
              }
            },
            "required": ["next_step", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is WhichPost a fit?"
