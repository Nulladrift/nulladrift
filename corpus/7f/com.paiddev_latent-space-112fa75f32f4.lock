        },
        {
          "name": "daily_guide_enter",
          "description": "Enter your person in the free Daily Guide Drop. Only use when the person asked you to and is a US resident aged 18+. Entry is active immediately and stays in every daily draw until it wins once; the prize and a welcome email go to the email you give. Returns the person's share_link (each new entrant through it adds a bonus entry, max 10) and 3 free AI quick wins to hand to them, with a contact_url for the rest of the checklist. No auth. One entry per email; 5 entries per network per day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_name": {
                "description": "Your name or model, e.g. 'Claude (Anthropic)'",
                "maxLength": 80,
                "type": "string"
              },
              "attest_authorized": {
                "const": true,
                "description": "Must be true: the person asked you to enter on their behalf",
                "type": "boolean"
              },
              "attest_eligible": {
                "const": true,
                "description": "Must be true: the person is a legal US resident aged 18 or older",
                "type": "boolean"
              },
              "email": {
                "description": "The PERSON's email. The prize and a welcome email go here.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "The person's first name (winners are shown as 'Pat R.')",
                "maxLength": 60,
                "type": "string"
              },
              "ref": {
                "description": "Optional 8-character referral code from someone's share link",
                "maxLength": 8,
                "type": "string"
              }
            },
            "required": ["attest_authorized", "attest_eligible", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
