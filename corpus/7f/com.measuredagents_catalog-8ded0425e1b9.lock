      "capabilities": {
        "tools": {}
      },
      "instructions": "Measured Agents is a catalog of AI agent skills, plugins and MCP servers, grouped by profession. Each pack shows its EU AI Act checklist and, when it has one, a measured agreement score between the agent and a human expert on a golden set. Use list_professions or search_packs to find candidates, then get_pack for the detail. Use get_facts for the method, thresholds and prices, and list_tasks for the measured tasks and their sealed golden sets. Every tool is read-only; quote the pack page link when you cite a pack.",
      "tools": [
        {
          "name": "get_facts",
          "title": "Get facts",
          "description": "Get the register facts as key-value groups: scope, counts, method thresholds, prices, data rules and agent endpoints. Same content as the /facts page.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get facts"
          },
          "behavior": {
            "destructive": false,
