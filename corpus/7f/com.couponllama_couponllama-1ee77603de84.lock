{
  "lockfileVersion": 2,
  "subjects": {
    "com.couponllama/couponllama": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://couponllama.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "couponllama",
        "title": "CouponLlama",
        "version": "1.0.0",
        "websiteUrl": "https://couponllama.com/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CouponLlama lists promo codes and coupon codes for online stores. Every code is added by hand and rated by shoppers who tried it.\n\nUse find_promo_codes whenever the user is about to buy from an online store, asks for a discount, coupon or promo code, or is at a checkout. Pass the store's name, website or a product URL. The best offer comes first.\n\n- Only offer codes this server returns. If it finds no store or no live code, say so; never make a code up.\n- Pass on the conditions that come with a code (minimum spend, end date, what it covers) and the shopper vote tally.\n- Link the store_page so the user can check the code and see newer ones.\n- After the user (or you, at a checkout) has tried a code, call report_code_result with whether it worked. Those reports rate the code for the next shopper.",
      "tools": [
        {
          "name": "find_promo_codes",
          "title": "Find promo codes for a store",
          "description": "Live promo codes for one online store, best offer first. Accepts the store's name, its website (“store.com”) or any URL on it. Each code comes with what it gives, its conditions, how many shoppers said it worked and when it last worked. When no store matches, it says so and suggests close matches instead of guessing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "store": {
                "description": "Store name, domain or any URL on the store's site, for example “Huega House”, “huegahouse.com” or a link to a product page.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["store"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8dfc5f7e9e9555fec546fe3b0102b51cde69266d67567a0a35c58ebb5595a672"
        },
        {
          "name": "latest_promo_codes",
          "title": "Latest promo codes",
          "description": "The newest live codes across every store, optionally within one category. Good for “any new deals on…” questions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category slug from list_categories.",
                "enum": ["automotive", "beauty", "business", "education", "electronics", "entertainment", "fashion", "food-restaurants", "health", "hobbies-toys", "home-garden", "money", "pets", "software", "sports-outdoors", "travel"],
                "type": "string"
              },
              "limit": {
                "description": "How many codes to return, 1 to 50. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc9dd2bdb0ddf2d145f2f96d0bb4b2cba91e7004d362232f1906d43a6474b4ca"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Every store category, with its slug, what it covers and how many stores in it have a live code.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7e908991183f8038bb5359f5c0abbe11d63983b8a7ed49d52b820883cb4506f"
        },
        {
          "name": "report_code_result",
          "title": "Report whether a code worked",
          "description": "Tell CouponLlama whether a code worked at checkout. The report joins the shopper vote tally, so the next person (or agent) knows which codes to trust. Call it once per code you tried.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code_id": {
                "description": "The id of the code, as returned by find_promo_codes.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "worked": {
                "description": "true if the store accepted the code, false if it was rejected.",
                "type": "boolean"
              }
            },
            "required": ["code_id", "worked"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:bb0af765b103478c13fff9e5f284966cc039f657f0c02106f654b48c72d4620b"
        },
        {
          "name": "search_stores",
          "title": "Search stores",
          "description": "Stores CouponLlama covers that match a name or a category, with how many live codes each has and its best offer. Use it to browse (“which pet stores have codes?”) or when the user isn't sure of a store's exact name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category slug from list_categories, such as “pets” or “home-garden”.",
                "enum": ["automotive", "beauty", "business", "education", "electronics", "entertainment", "fashion", "food-restaurants", "health", "hobbies-toys", "home-garden", "money", "pets", "software", "sports-outdoors", "travel"],
                "type": "string"
              },
              "limit": {
                "description": "How many stores to return, 1 to 50. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a store's name, or words about what it sells.",
                "maxLength": 200,
                "type": "string"
              },
              "with_codes_only": {
                "description": "Leave out stores with no live code. Defaults to true.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c49f921176a838f5ca85c4345ccb009da1401853c774ccc670d5d9db75b15b8"
        }
      ],
      "digest": "sha256:51a3ca8f81be8f58f5a74ffd62173002dafc4ecfd9300294e0b807785db5cfe4"
    }
  }
}
