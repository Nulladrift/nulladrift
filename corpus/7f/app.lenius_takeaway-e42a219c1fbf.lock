        {
          "name": "find_shops",
          "title": "Find shops",
          "description": "Find Lenius takeaway restaurants and shops in a Danish city or postal code. Optional: what the customer wants (query, e.g. \"pizza\"), pickup or delivery, and a date/time to check availability (returns the nearest available times).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City, e.g. \"Frederikshavn\"",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, default today (Danish time)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fulfillment": {
                "description": "pickup or delivery",
                "enum": ["pickup", "delivery"],
                "type": "string"
              },
              "postal_code": {
                "description": "Danish postal code, e.g. \"9900\"",
                "maxLength": 10,
                "minLength": 3,
                "type": "string"
              },
              "query": {
                "description": "What to eat or buy, e.g. \"pizza\" or \"sushi\", or the shop's name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "time": {
                "description": "HH:MM, e.g. \"19:00\"",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              }
            },
            "type": "object"
          },
