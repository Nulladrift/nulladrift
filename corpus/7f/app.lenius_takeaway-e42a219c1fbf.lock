          "title": "Validate cart",
          "description": "Check a cart before quoting: every item is checked against the shop catalogue (exists, available, current price, required and valid options) and all problems are returned at once, with the price per item. With fulfillment, date and time (and address for delivery) the time, address and minimum order are checked too. Saves nothing.",
