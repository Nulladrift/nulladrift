        {
          "name": "place_order",
          "title": "Place order",
          "description": "Place the order with the shop (like the checkout). Only after the customer confirmed the quoted order and accepted the terms (terms_url). Paid by card in advance on the shop's order page: returns the order number and order_url (with \"Betal nu\"; the shop gets the order when paid). The customer gets a confirmation e-mail when paid. With products with an age limit and no approved age_check_id, nothing is ordered: returns status age_check_required with the AltID card; call again with age_check_id when the age is confirmed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accepted_terms": {
                "description": "true when the customer has accepted the shop's terms (terms_url)",
                "type": "boolean"
              },
              "address": {
                "description": "Required for delivery",
                "properties": {
                  "city": {
                    "maxLength": 60,
                    "minLength": 2,
                    "type": "string"
                  },
                  "postal_code": {
                    "maxLength": 10,
                    "minLength": 3,
                    "type": "string"
                  },
                  "street": {
                    "description": "Street and number",
                    "maxLength": 120,
                    "minLength": 2,
                    "type": "string"
                  }
                },
                "required": ["city", "postal_code", "street"],
                "type": "object"
              },
              "age_check_id": {
                "description": "Products with an age limit: the approved age check (from start_age_check or the age_check_required card); one age check can be reused for 30 minutes across shops",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "comment": {
                "description": "A note for the shop, e.g. \"no onions\"",
                "maxLength": 500,
                "type": "string"
              },
              "customer": {
                "description": "Required unless the customer is logged in on this shop (then taken from the account; my_profile shows it)",
                "properties": {
                  "email": {
                    "format": "email",
                    "maxLength": 200,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "minLength": 2,
                    "type": "string"
                  },
                  "phone": {
                    "description": "Danish phone number, e.g. \"12 34 56 78\"",
                    "maxLength": 20,
                    "minLength": 8,
                    "type": "string"
                  }
                },
                "required": ["email", "name", "phone"],
                "type": "object"
              },
              "date": {
                "description": "YYYY-MM-DD (from available_times)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fulfillment": {
                "enum": ["pickup", "delivery"],
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "options": {
                      "description": "Answers to the product's options from get_menu (option_id + choice_id, option_id + text, or option_id + choices for choose_many). Required options must be answered; ask the customer, never pick for them.",
                      "items": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "choice_id": {
                                "description": "choice_id from get_menu",
                                "maxLength": 32,
                                "minLength": 1,
                                "type": "string"
                              },
                              "option_id": {
                                "maxLength": 32,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["choice_id", "option_id"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "option_id": {
                                "maxLength": 32,
                                "minLength": 1,
                                "type": "string"
                              },
                              "text": {
                                "description": "The customer's own words, e.g. \"uden løg\"",
                                "maxLength": 500,
                                "type": "string"
                              }
                            },
                            "required": ["option_id", "text"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "choices": {
                                "description": "choose_many: the chosen choices; the total must be between min_total and max_total",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "choice_id": {
                                      "maxLength": 32,
                                      "minLength": 1,
                                      "type": "string"
                                    },
                                    "quantity": {
                                      "description": "1 unless the option has quantities",
                                      "maximum": 100,
                                      "minimum": 1,
                                      "type": "integer"
                                    }
                                  },
                                  "required": ["choice_id", "quantity"],
                                  "type": "object"
                                },
                                "maxItems": 100,
                                "type": "array"
                              },
                              "option_id": {
                                "maxLength": 32,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["choices", "option_id"],
                            "type": "object"
                          }
                        ]
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "product_id": {
                      "description": "Product id from get_menu",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 99,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["product_id", "quantity"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "other_stops": {
                "description": "The other orders you are placing for the customer in this conversation (other shops, same day): used only to warn when they are too far apart in time (trip_warnings). Nothing is looked up about the customer.",
                "items": {
                  "properties": {
                    "address": {
                      "description": "Required for delivery",
                      "properties": {
                        "city": {
                          "maxLength": 60,
                          "minLength": 2,
                          "type": "string"
                        },
                        "postal_code": {
                          "maxLength": 10,
                          "minLength": 3,
                          "type": "string"
                        },
                        "street": {
                          "description": "Street and number",
                          "maxLength": 120,
                          "minLength": 2,
                          "type": "string"
                        }
                      },
                      "required": ["city", "postal_code", "street"],
                      "type": "object"
                    },
                    "date": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "fulfillment": {
                      "enum": ["pickup", "delivery"],
                      "type": "string"
                    },
                    "shop": {
                      "description": "The \"shop\" value from find_shops",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "time": {
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    }
                  },
                  "required": ["date", "fulfillment", "shop", "time"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "shop": {
                "description": "The \"shop\" value from find_shops (not needed on a shop's own address <shop>.lenius.app/mcp)",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "time": {
                "description": "HH:MM (from available_times)",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              }
            },
            "required": ["accepted_terms", "date", "fulfillment", "items", "time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Place order"
          },
          "behavior": {
