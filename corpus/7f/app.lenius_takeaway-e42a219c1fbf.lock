      "instructions": "Lenius (lenius.dk) is a platform for local Danish takeaway restaurants and shops. The tools find shops, show menus and available pickup or delivery times, quote prices and create orders that the customer pays by card on the shop's order page.\nTimes are local Danish time (Europe/Copenhagen). Prices are in DKK including VAT.\nfind_shops takes a city, postal code or shop name and returns up to 10 shops. Shops with can_order: false do not take card payment, so orders cannot be placed for them with these tools.\nProduct ids come from get_menu. Required options have no default, so the customer chooses them, and the answers go in items[].options. For a product with a size option (is_size), the customer chooses the size first. The price is price_dkk for that size, and options with price_depends_on_size cost price_change_dkk_by_size[<size choice_id>] (null = not available in that size).\nquote_order returns the lines, fees, total and terms (terms_url) without saving anything. place_order is for after the customer has confirmed the quote, accepted the terms and given the name, e-mail and phone needed for the order.\nFor orders from several shops the same day, the other orders in the conversation go in other_stops. trip_warnings means two stops are too close in time to travel between (straight-line distance at 30 km/h plus 10 minutes per shop). earliest_time and latest_time from available_times are alternatives the customer can choose; the customer may also keep the time.\nAfter place_order the order waits for card payment on the order page (order_url). The shop receives the order when it is paid and may adjust the time. order_status returns the current status.\nProducts with min_age require an age check with AltID, the Danish government's age verification app. It shares only whether the customer is above the age limit, not their identity. The check runs on altid.lenius.ai, operated by Lenius.\nplace_order without an approved age_check_id returns age_check_required with the AltID card. After approval, place_order is called again with age_check_id. For several shops, one start_age_check with the highest age limit covers all orders for 30 minutes. The QR code for AltID is the one in the card and at qr_url.",
