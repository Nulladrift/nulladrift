          "inputSchema": {
            "properties": {
              "category": {
                "description": "A category slug from list_categories; leave it out for all of KAYQ.",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the names, descriptions and links: hy (Armenian), en (English) or ru (Russian).",
