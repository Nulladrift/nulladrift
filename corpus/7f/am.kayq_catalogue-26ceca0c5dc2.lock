      },
      "instructions": "KAYQ (kayq.am) is a catalogue of Armenian websites - stores, banks, services, restaurants, travel, health,\neducation, IT, media and more - in Armenian, English and Russian. A moderator reviews every website before it\nis listed, and KAYQ checks regularly that each one still answers.\n\nUse it to find real Armenian websites for a need (\"where can I rent a car in Armenia\", \"Armenian job sites\"),\nto learn what a given Armenian website is, or to see whether it is down. Start with search_websites; use\nlist_categories for the categories and topics. Every answer holds the website's own address and its page on\nKAYQ: give the user those links rather than guessing addresses.",
      "tools": [
        {
          "name": "get_website",
          "title": "One Armenian website",
          "description": "Everything KAYQ knows about one listed website: its name, address, category and topics, its full description and keywords, the phone, address and social profiles it publishes, when it was listed, whether it answered KAYQ's last check, and its trust report (domain age and expiry, HTTPS certificate, 30-day uptime, site check problems, platform, languages, verified owner). Give its domain (\"list.am\"), its address or its KAYQ slug.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the names, descriptions and links: hy (Armenian), en (English) or ru (Russian).",
                "enum": ["hy", "en", "ru"],
                "type": "string"
              },
              "website": {
                "description": "The domain (\"list.am\"), the address (\"https://www.list.am/\") or the KAYQ slug (\"list-am\").",
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One Armenian website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:757a285c652073845de8d135fa495995d6721f3950b10742fab209e3ce5b1a41"
        },
        {
          "name": "list_categories",
          "title": "Categories and topics",
          "description": "The categories of KAYQ (banks, stores, travel, IT, health...) and the topics inside each (car rental, job sites, hotels...), with how many websites each holds and its page. Use the slugs with search_websites and most_visited.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the names, descriptions and links: hy (Armenian), en (English) or ru (Russian).",
                "enum": ["hy", "en", "ru"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
