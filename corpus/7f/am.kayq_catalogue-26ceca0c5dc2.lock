          },
          "digest": "sha256:09449192df6b0f2167fffbfc2d277c42f772f9230a5ed104e7f98824b695ded6"
        },
        {
          "name": "search_websites",
          "title": "Search Armenian websites",
          "description": "Finds websites in KAYQ, the reviewed catalogue of Armenian websites (kayq.am): shops, banks, services, media, travel, education and more. Give words in Armenian, English or Russian (Armenian may be typed in Latin letters), a category or a topic, or any of them together. Every word must be found in a website's name, address, description or keywords, or in its category or topic; a word found nowhere is ignored. Returns real listings only, most visited first, each with its own address and its KAYQ page. Use list_categories for the category and topic slugs.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "A category slug from list_categories, e.g. \"banks\", \"travel\".",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the names, descriptions and links: hy (Armenian), en (English) or ru (Russian).",
                "enum": ["hy", "en", "ru"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many websites to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "The page of results, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"car rental\", \"ավտոմեքենաների վարձույթ\", \"доставка цветов\", \"list.am\".",
                "type": "string"
              },
              "topic": {
                "description": "A topic slug from list_categories, e.g. \"car-rental\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
