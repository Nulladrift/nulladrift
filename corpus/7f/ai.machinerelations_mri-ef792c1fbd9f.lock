          "digest": "sha256:f1b2c7220a15d85c1285703543222f643c4dff786bdece15c6a2337c1b4ab883"
        },
        {
          "name": "mri_get_cited_sources",
          "title": "Which sources AI engines cite",
          "description": "Ranked source domains that AI answer engines cite, pooled across engines, for one category and question shape, with citation rate (share of monitored answer runs citing the domain), rank, percentile and source role (editorial publication, vendor-owned, analyst research, community, academic/government, market database, wire distribution). This rate is not split by engine. For one engine, use mri_get_engine.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category key, e.g. cybersecurity.",
                "type": "string"
              },
              "cursor": {
                "description": "Page token from the previous response's next.cursor. When set, offset is ignored.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "question_shape": {
                "description": "Buyer question pattern: best_x (best X tools), how_choose (how to choose), is_x_worth (is it worth it), news_topic (recent news), problem_first (how to solve a problem), top_list (top platforms), x_vs_y (A vs B).",
                "enum": ["best_x", "how_choose", "is_x_worth", "news_topic", "problem_first", "top_list", "x_vs_y"],
                "type": "string"
              },
              "source_role": {
                "description": "Optional filter, e.g. editorial_media for publications only, vendor_owned, analyst_research, community_social.",
                "type": "string"
              }
            },
            "required": ["category", "question_shape"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which sources AI engines cite"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:daf0eb843cb0d12cb39a96fa729e5f17b2da48d6b8c6c4c5acb86d0d5e6a4b67"
        },
        {
          "name": "mri_get_domain",
