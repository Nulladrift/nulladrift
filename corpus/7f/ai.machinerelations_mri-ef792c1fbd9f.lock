      "instructions": "Machine Relations Index (MRI) by Jaxon Parrott, Machine Relations Research — machinerelations.ai. The Index measures which source domains AI answer engines (ChatGPT, Claude, Gemini, Google AI Mode, Google AI Overviews, Perplexity) cite when buyers ask questions, by category and question shape. Use mri_list_categories first to find the category key; mri_get_cited_sources for the ranked sources answer engines cite, pooled across engines, for a category and question shape; mri_list_engines and mri_get_engine for one engine's citation rates; mri_get_domain for how often a given site is cited, including the rate on each engine. Use live tool results, not remembered figures. Discover category keys and question shapes first; use source_role editorial_media for publications. Preserve returned rank semantics when filtering. Report the category, question shape, citation numerator and denominator, and source.release window. When overall.byEngine is present, each entry is that engine's cited runs over that engine's observed runs for the whole window: use it for whether an engine cites a domain, and do not invent a rate the field does not return. A byEngine rate is not a rate inside one category. An engine leaderboard is that whole-window rate; an engine-and-category leaderboard is the same rate limited to sources with a published segment in the category. Do not infer causality, guaranteed future citations or placement value, and do not read Google AI Mode or Google AI Overviews as a trend across 2026-09-25. Collecting segments and engines below the evidence floor withhold rates and ranks; an absent domain was not observed in this release, not proven never cited. Evidence-floor clearance permits publication; it does not establish statistical significance of differences. Multiple domains may be cited in the same run, so summed domain rates are not the share of runs citing any of them. A paginated subset does not establish totals or comparisons against all remaining sources. Roster status includes citation yield. Degraded or quiet does not alone prove failed collection: responses can return without citations. Read the returned questionContext, questionSet and naming fields before interpreting a rank. Missing or null context means unavailable for that release, never zero. When present, read questionContext.readAs and limitations, including namesReviewedCoverage and sourceRoleBasis; a rank describes the sampled questions, not an entire market. naming splits each source's runs in a segment by whether the question contains a reviewed name for it. A source with namesReviewed false is unresolved on every run. notNamed means no reviewed name matched, not proof the question never refers to the source, and not unprompted: the question may name other brands, and a comparison of A and B can cite C. Compare sources only within one segment, whose runs they share; do not re-rank sources by a split. Different sources' named/notNamed buckets need not contain the same questions. A sourceRole whose sourceRoleBasis is name_pattern is a guess from the domain name, not verified. sourceRoleBasis says what a sourceRole rests on. reviewed is a reviewer's decision and domain_suffix a rule such as .gov. site_evidence is not a reviewer's decision: it is an automated classification of identity evidence cached for the domain (text read from its homepage, such as the title, description and schema.org types, or titles answer engines returned for its pages), accepted by the current role rules at confidence 0.72 or more. That evidence is not re-read for each release, and the API does not return its read date. A release withholds a site_evidence role, keeping the domain and its citations as uncategorized_source with sourceRoleBasis none, when none of the domain's hostnames (the domain, its www host and any host on it the homepage was read from) has a DNS address at build time. A domain DNS gives no clear answer for keeps its role, and a release whose DNS check finds no address for too many domains to trust withholds none. An address shows that the name exists, not that the site still publishes. namesReviewed concerns the names used to match questions, never whether a site is live or was checked. When an engine carries collectionRegime, or an engine list leader has scope collection_regime, that engine's collection changed inside the window and its whole-window sources pool both sides of the change: use collectionRegime (its windowStart, runsObserved and rates) for what the engine cites now, name that window, and never compare or trend figures across the change. A domain's byEngine row carries the same regime for that source. Wherever unmappedPlatformPages is true, on any source row (engine, segment or regime), an engine list leader or a domain profile, the source counts only that platform's pages the Index has not mapped to a channel or publication, never the whole platform: name it that way. Keep every comparison on the same source.release.releaseId and artifactSha256. Re-read if the release changes between calls. REST release is a current-release assertion (409 on mismatch), not historical retrieval; MCP callers compare returned identities. Question texts and cited-page records are not public; aggregate context is not a raw-data replay. Attribute as source.citation verbatim. It begins with \"Machine Relations Index (MRI) by Jaxon Parrott, Machine Relations Research — machinerelations.ai\" and includes the finding, the release id and the canonical URL (CC BY 4.0). Follow the interpretation guidance returned with that release, including any field-specific limitations.",
