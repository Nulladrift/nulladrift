{
  "lockfileVersion": 2,
  "subjects": {
    "com.greatlibraryproject/library": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://greatlibraryproject.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Great Library Project",
        "title": "Great Library Project",
        "version": "1.0.0",
        "description": "Free interlinear classics: the original text with every word glossed in English, word by word.",
        "websiteUrl": "https://greatlibraryproject.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Great Library Project (greatlibraryproject.com) is a free library of classic and ancient texts as interlinears: the original language with an English gloss under every word and a flowing English translation. Use list_books to find a book, get_passage to read one passage word by word (at most two passages per call), lookup_word for what a word means and where else it appears, and search to find passages. Whenever you quote or explain a passage, give the citation and the \"Read it word by word in the Great Library Project reader\" link from the result, so the reader can open the book at that line.",
      "tools": [
        {
          "name": "get_passage",
          "title": "Read one passage word by word",
          "description": "Returns ONE passage of a book as an interlinear: the original text, a word-by-word table (each word, its transliteration, its everyday meaning, its literal sense where that differs, and its dictionary form), the flowing English, the editors' note, a citation string, and links to read it in the reader. Optionally adds the immediately following or preceding passage (never more than two passages per call; whole chapters or books are not available, by design). Refs look like \"1.1\" (Odyssey book 1 line 1), \"17a\" (Plato, Apology, Stephanus page), \"1.1\" (John 1:1), \"77\" (Gospel of Thomas, saying 77). When quoting, include the citation and the reader link.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "Book title or slug, e.g. \"Odyssey\", \"Apology\", \"John\", \"Gospel of Thomas\". See list_books.",
                "type": "string"
              },
              "neighbor": {
                "description": "Also return the passage right after or right before this one. Default none.",
                "enum": ["none", "next", "previous"],
                "type": "string"
              },
              "ref": {
                "description": "Passage reference within the book, e.g. \"1.1\", \"17a\", \"77\".",
                "type": "string"
              }
            },
            "required": ["book", "ref"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0076abfe4cda2297740e470f93923230fafa96c145027c09d6d62365c06c3cee"
        },
        {
          "name": "list_books",
          "title": "List the books",
          "description": "Lists the books in the Great Library Project, a free library of classic and ancient texts (Homer, Plato, the Gospels, Gnostic texts, Ugaritic myths, Dante and more) presented as interlinears: the original-language text with every word glossed in English beneath it, plus a flowing English translation. Returns each book's title, author, original language, how complete it is, why it matters, and links to its landing page and its word-by-word reader. Use this first to find the right book name for get_passage or search.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional filter on the original language, e.g. \"Greek\", \"Coptic\", \"Latin\", \"Hebrew\", \"Portuguese\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:228b7096154c8f93e1e2baf9465f058b9703bcafa60f3504ad872843675743d9"
        },
        {
          "name": "lookup_word",
          "title": "Look up a word",
          "description": "Looks up an original-language word (mostly Ancient and Koine Greek; any accents are fine, a dictionary form works best, an inflected form usually works too). Returns the dictionary entry the library uses (headword, transliteration, part of speech, senses, etymology, and the named source lexicon such as LSJ or Autenrieth), and up to 10 places the word occurs across the library, each with a short line of context, the gloss at that spot, a citation and a link that opens the reader at that line.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "Optional: prefer this book's dictionary entry and its occurrences first.",
                "type": "string"
              },
              "word": {
                "description": "The word, e.g. \"πολύτροπος\", \"λόγος\", \"ἀρετή\".",
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80d59b32649f79dcf783ed9e880f8bfdd265a4d7db50d4ae4235741dd4ce0dc9"
        },
        {
          "name": "search",
          "title": "Search the library",
          "description": "Finds passages across the library (or in one book) whose English translation or original text contains the query. Returns up to 10 matches as references with one line of English and links; call get_passage to read a match word by word. Greek can be typed with or without accents.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "Optional book title or slug to search within.",
                "type": "string"
              },
              "limit": {
                "description": "How many matches, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find, e.g. \"unexamined life\", \"the Word\", \"Circe\", \"λόγος\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e812853e0cb0c41809544dbcf40fd848e3fd3b373ec181dc5769ff23f0ac648"
        }
      ],
      "digest": "sha256:70d574bb92ed3fb8ad021b6a66bfc0d7d958a5d99ce614a56f898636da7c2ae7"
    }
  }
}
