    "co.bidcatch/bidcatch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bidcatch.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bidcatch",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "WHAT THIS SERVER IS. BidCatch tracks US government contracting end to end: open and past bids from federal, state, county, city, school district, and port authority portals; federal award history; contracts nearing expiration (recompetes); agency procurement forecasts; and GAO bid-protest decisions. Every record links back to the official government posting — cite that link, not BidCatch, when the user needs a source. Paid tools add prime–subcontractor teaming networks and structured award filtering.\n\nHOW TO SEARCH WELL. (1) Search by classification codes, not just keywords: NAICS classifies the work (541512 = computer systems design, 237310 = highway/street/bridge, 561720 = janitorial); FSC/PSC codes classify federal supplies and services. Ask the user for their codes, or infer them from their trade and confirm. (2) Match the buyer level: a paving crew bids county and city work, not SAM.gov — use the state and level filters rather than scanning federal-only. (3) Check deadlines before presenting anything: a bid with a past response deadline is a dead end; say so. (4) Award history is intelligence: before a user bids, run get_award_history on the buyer or incumbent to see who wins this work and for how much. (5) Read the recompete clock: get_recompete_radar shows contracts expiring soon — the strongest opportunities are the ones not yet posted. (6) Check the fight record: get_protest_record reveals whether a buyer's awards get challenged and overturned.\n\nTOOL MAP. search_bids = current and past opportunities. get_award_history = who won what, from which agency, for how much. get_recompete_radar = contracts nearing expiration, ranked by recompete signals with the counts behind them. get_agency_forecast = purchases agencies have announced but not yet posted. get_protest_record = GAO protest rulings (sustained = the agency had to back down; denied = the award stood). check_exclusions = SAM.gov's debarment list — run it on any company before the user teams with or subcontracts to them; one excluded partner can poison a bid. find_teaming_partners = who a company teams with — the primes it subs for and the subs under it, from prime-reported subcontract records. search_awards = structured award filtering by recipient, agency, NAICS, state, and single-bid awards — use it when the user knows exactly which slice they want; get_award_history when they're searching by topic.\n\nHONEST LIMITS. Ceiling values are maximums, not spending — never sum them into market-size claims; record counts are the honest aggregate. A posted forecast or an expiring contract is a signal, not a guarantee — agencies slip and cancel. Teaming relationships are reported by primes to USAspending/FSRS — counts are reported records and amounts are per-record, never summed; subcontract reporting is known to undercount small subs. Classified work is not visible in public data. If a search returns nothing, widen the keywords or drop a filter before concluding no work exists.",
      "tools": [
        {
          "name": "check_exclusions",
          "description": "Check SAM.gov's exclusion (debarment) list for a company or person — entities the government has barred from receiving federal contracts or subcontracts. Run this before teaming with or subcontracting to anyone: one excluded partner can poison a bid. Match by exact company name or UEI; a state filter disambiguates common names. Records come from SAM.gov's published exclusions extract, refreshed weekly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Company or person name, e.g. 'Acme Paving LLC'",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. TX",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "uei": {
                "description": "SAM.gov Unique Entity ID — the strongest match key",
                "maxLength": 32,
                "minLength": 4,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0060591d64deab44e73aed41516c402a4e23ec8ad3beca67c2a4da50c72a50e9"
        },
        {
          "name": "find_teaming_partners",
          "description": "Find who a company teams with on federal contracts — the primes it subcontracts for and the subcontractors under it. Built from prime-reported subcontract records (USAspending/FSRS): real reported relationships, not guesses. Use it before a recompete to map an incumbent's bench, or to find primes a subcontractor already works with. Requires a BidCatch intel key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "Company name, e.g. 'Booz Allen Hamilton' — resolved to the strongest match",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "role": {
                "description": "prime = only partners they sub FOR; sub = only subs UNDER them; omit for both",
                "enum": ["prime", "sub"],
                "type": "string"
              },
              "uei": {
                "description": "SAM.gov Unique Entity ID — the strongest match key",
                "maxLength": 32,
                "minLength": 4,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:396c87447c8b2849c747069fbc67cf6a6b48343e3685868fc1491ffd30676644"
        },
        {
          "name": "get_agency_forecast",
          "description": "List an agency's published procurement forecast — planned contract actions with estimated values and timelines, in the agency's own words. Planning-grade data; entries can be revised or cancelled. Requires a BidCatch intel key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Agency name or distinctive fragment, e.g. 'Interior' or 'Veterans'",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["agency"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3597f4cd17316a15280328eff17112f8a7b23539c60f680d51a6ba5ea9ce0e51"
        },
        {
          "name": "get_award_history",
          "description": "Search federal contract award history — who won what, for how much, and when. Use it to size up incumbents, price work, or find buyers. amount: the award's current value; null = no current value reported (never the ceiling). Requires a BidCatch intel key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Keywords matched against description, recipient, and agency",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "default": "recent",
                "enum": ["recent", "amount"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. TX",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f906522d080db2376f6957d48d535fdb7620efdbef8149d9ee13444a984c012e"
        },
        {
          "name": "get_protest_record",
          "description": "Search Government Accountability Office (GAO) bid protest decisions — who challenged an award, and whether the referee sustained or denied it. Requires a BidCatch intel key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Keywords matched against agency and case matter",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:33391b2ca2713ff7083c0baff390f285b42bb071168654f952432626a8c45e8e"
        },
        {
          "name": "get_recompete_radar",
          "description": "List federal contracts nearing expiration — each one a competition about to reopen. Filter by keyword, NAICS code, or state. Requires a BidCatch intel key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "naics": {
                "description": "NAICS industry code, e.g. 541512",
                "pattern": "^\\d{2,6}$",
                "type": "string"
              },
              "query": {
                "description": "Keywords matched against description, recipient, and agency",
                "maxLength": 120,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. TX",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b23e1c7744336d118cd40bdf4728ff8826295b1111e4579e761298a5223ba30"
        },
        {
          "name": "search_awards",
          "description": "Filter federal contract awards by exact fields — recipient, awarding agency, NAICS code, state — instead of keyword search. Includes a single-bid filter for awards that drew exactly one offer. Use this when you know the slice you want; use get_award_history for topic/keyword search. Can filter by set-aside program (set_asides). amount: the award's current value; null = no current value reported (never the ceiling). Requires a BidCatch intel key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Awarding agency (partial match), e.g. 'Veterans Affairs'",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "naics": {
                "description": "NAICS code, e.g. 541512",
                "pattern": "^\\d{2,6}$",
                "type": "string"
              },
              "one_bid_only": {
                "default": false,
                "description": "true = only awards that received exactly one offer",
                "type": "boolean"
              },
              "recipient": {
                "description": "Recipient name (partial match), e.g. 'Lockheed'",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "set_asides": {
                "description": "Set-aside programs, any of which matches: SDVOSB, VOSB, HUBZone, 8(a), EDWOSB, WOSB, DVBE, DBE, MBE, WBE, SBE, HUB, SDB, SBS; 'none' = the record says no set-aside was used (unrestricted). Many records are not marked either way, so a set-aside search never returns them.",
                "items": {
                  "enum": ["SDVOSB", "VOSB", "HUBZone", "8(a)", "EDWOSB", "WOSB", "DVBE", "DBE", "MBE", "WBE", "SBE", "HUB", "SDB", "SBS", "none"],
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "sort": {
                "default": "recent",
                "enum": ["recent", "amount"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. TX",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb24daac532abd0cdc60a77a4fe2a16635fc7afe79742ea75c3ab5aa1ff8ce0b"
        },
        {
          "name": "search_bids",
          "description": "Search government bid opportunities (open and past) by keyword, state, and buyer level. Results are relevance-ranked; keyword matches in the title outrank passing mentions in the description. Optionally filter by set-aside program (set_asides).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "open_only": {
                "default": true,
                "description": "true = only bids whose deadline has not passed",
                "type": "boolean"
              },
              "query": {
                "description": "Keywords, e.g. 'fiber optic' or 'cyber'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "set_asides": {
                "description": "Set-aside programs, any of which matches: SDVOSB, VOSB, HUBZone, 8(a), EDWOSB, WOSB, DVBE, DBE, MBE, WBE, SBE, HUB, SDB, SBS; 'none' = the record says no set-aside was used (unrestricted). Many records are not marked either way, so a set-aside search never returns them.",
                "items": {
                  "enum": ["SDVOSB", "VOSB", "HUBZone", "8(a)", "EDWOSB", "WOSB", "DVBE", "DBE", "MBE", "WBE", "SBE", "HUB", "SDB", "SBS", "none"],
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "state": {
                "description": "Two-letter US state code, e.g. TX",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "tier": {
                "description": "Level of government buyer",
                "enum": ["federal", "state", "local"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1249877049bb80fd6d13bf3112b4247a8ea6f47f970f3dfa027f6fc0358012e4"
        }
      ],
      "digest": "sha256:451a2fbc756218a6624b5bc95e316a39410e9d5a7cf9cbf6bdbdf8e0bd2b588a"
    }
  }
}
