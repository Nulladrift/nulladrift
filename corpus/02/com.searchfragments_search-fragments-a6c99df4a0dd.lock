  "subjects": {
    "com.searchfragments/search-fragments": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://searchfragments.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "search-fragments-mcp",
        "version": "0.2.6",
        "description": "Search Fragments is an MCP server with three tools for queries an agent can't place. resolve_fragment: resolves half-remembered, cross-source queries â€” returns a named answer with confidence justified by evidence (resolved), ranked web sources to confirm by eye (shortlist), or an explicit no-resolution. verify_claim: checks a specific factual assertion against current web sources â€” returns supported, partially_supported, insufficient_evidence, or unsupported, with cited evidence and stated limits. submit_resolution_feedback: reports whether a resolve_fragment result was accepted, partial or rejected, using its resolution_id. Built to decline rather than guess."
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search Fragments is the gate before your agent answers. resolve_fragment: use when a user half-remembers something (a film, song, book, person, place, event, quote) and you cannot confidently place it. Every result carries a verdict: ORIGIN_OF_TRUTH (answer, and cite the sources), PARTIAL_ORIGIN (follow or show the leads; do not assert them), NOT_REACHABLE (say you cannot place it; do not fill the gap - it is not a claim the thing cannot be found). submit_resolution_feedback: return the user's reaction using the resolution_id. verify_claim: check a specific factual assertion against current web sources; its verdict is decide-by-eye, not asserted fact.",
      "tools": [
        {
          "name": "resolve_fragment",
          "title": "Resolve Fragment",
          "description": "Returns a verdict first, so your agent knows whether to answer, keep looking or say it can't place it: ORIGIN_OF_TRUTH (found, evidence checked, with sources), PARTIAL_ORIGIN (leads to follow, not an answer) or NOT_REACHABLE (SF's search reached nothing; not a claim the thing can't be found). Pieces together the name of a film, TV or radio show, song, book, game, quote, person, place, event or research study from the fragments a user remembers: a scene, a line, a face, roughly when. Pass every fragment in the user's own words, even uncertain ones. It searches many sources and fits them together. A shortlist or an honest \"can't place it\" is still useful. Use it when your own search couldn't place it. Not for known titles, trivia, recommendations or checking claims (use verify_claim). When the user says whether this helped, report it with submit_resolution_feedback.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fragment": {
                "description": "The half-remembered or fragment-shaped query, in the user's own words. Must be at least 5 characters and describe the thing being recalled by premise, plot, relationship, or context.",
                "maxLength": 500,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["fragment"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidate": {
                "oneOf": [
                  {
                    "type": "null"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "confidence": {
                        "enum": ["high", "possible"],
                        "type": "string"
                      },
                      "creator": {
                        "type": ["string", "null"]
                      },
                      "snippet": {
                        "anyOf": [
                          {
                            "type": "null"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "text": {
                                "type": "string"
                              },
                              "title": {
                                "type": "string"
                              },
                              "url": {
                                "type": "string"
                              }
                            },
                            "required": ["text", "title", "url"],
                            "type": "object"
                          }
                        ],
                        "description": "Optional verbatim excerpt from a fetched text source, for display. Null when no readable source text was retrieved. Not a model summary."
                      },
                      "title": {
                        "type": "string"
                      }
                    },
                    "required": ["confidence", "creator", "title"],
                    "type": "object"
                  }
                ]
              },
              "evidence": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quote": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["quote", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "is_sf_question": {
                "type": "boolean"
              },
              "leads": {
                "description": "Only on no_resolution for a Search Fragments question: up to 3 unconfirmed leads, best first. Not verified answers.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "basis": {
                      "enum": ["reviewer_territory", "model_guess", "retrieved_page"],
                      "type": "string"
                    },
                    "confidence": {
                      "enum": ["possible"],
                      "type": "string"
                    },
                    "creator": {
                      "type": ["string", "null"]
                    },
                    "matched_clues": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "status": {
                      "enum": ["unconfirmed"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "unmatched_clues": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "url": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["basis", "confidence", "creator", "matched_clues", "status", "title", "unmatched_clues", "url"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "narrow_it": {
                "description": "Only on no_resolution for a Search Fragments question: up to 3 details that would narrow the search.",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "outcome": {
                "enum": ["resolved", "ranked_stalls", "no_resolution"],
                "type": "string"
              },
              "pool": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "domain": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["domain", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "reject_reason": {
                "type": ["string", "null"]
              },
              "resolution_id": {
                "description": "Stable ID for this stored resolution.",
                "type": ["number", "null"]
              },
              "summary": {
                "type": "string"
              },
              "territory": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "evidence": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "quote": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["quote", "title", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "snippet": {
                      "anyOf": [
                        {
                          "type": "null"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "text": {
                              "type": "string"
                            },
                            "title": {
                              "type": "string"
                            },
                            "url": {
                              "type": "string"
                            }
                          },
                          "required": ["text", "title", "url"],
                          "type": "object"
                        }
                      ],
                      "description": "Optional verbatim excerpt from a fetched text source for this lead. Null when no readable source text was retrieved. Not a model summary."
                    },
                    "title": {
                      "type": "string"
                    },
                    "unresolved": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["evidence", "reason", "title", "unresolved"],
                  "type": "object"
                },
                "type": "array"
              },
              "verdict": {
                "additionalProperties": false,
                "description": "What SF's own search reached for this fragment, relabelled from what it already holds (no extra search). It reports SF's reach, not whether the thing exists or can be found elsewhere. ORIGIN_OF_TRUTH: SF's evidence gate passed. PARTIAL_ORIGIN: SF reached leads it could not confirm; continue from them; not an answer. NOT_REACHABLE: SF's search reached nothing to continue from; the thing may still be findable by other means.",
                "properties": {
                  "basis": {
                    "type": "string"
                  },
                  "leads": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 5,
                    "type": "array"
                  },
                  "verdict": {
                    "enum": ["ORIGIN_OF_TRUTH", "PARTIAL_ORIGIN", "NOT_REACHABLE"],
                    "type": "string"
                  }
                },
                "required": ["basis", "leads", "verdict"],
                "type": "object"
              },
              "verdict_basis": {
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "enum": ["NOT_SF_QUESTION", "EMPTY_POOL", "POOL_NOT_CREDIBLE", "BLOCKED_MUSICBRAINZ_ONLY", "BLOCKED_EXCLUDE_MATCH", "BLOCKED_NO_EVIDENCE_GATE", "BLOCKED_LOW_CONFIDENCE", "RESOLVED_TWO_HOST", null],
                    "type": ["string", "null"]
                  },
                  "gates": {
                    "additionalProperties": false,
                    "properties": {
                      "credible_pool_match": {
                        "type": ["boolean", "null"]
                      },
                      "evidence_gate": {
                        "type": "boolean"
                      },
                      "exclude_match": {
                        "type": "boolean"
                      },
                      "has_confident_title": {
                        "type": "boolean"
                      },
                      "musicbrainz_only_pool": {
                        "type": "boolean"
                      },
                      "pool_size": {
                        "type": "number"
                      },
                      "semantic_confidence": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["credible_pool_match", "evidence_gate", "exclude_match", "has_confident_title", "musicbrainz_only_pool", "pool_size", "semantic_confidence"],
                    "type": "object"
                  },
                  "what_would_change_it": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["code", "gates", "what_would_change_it"],
                "type": "object"
              },
              "verification_state": {
                "enum": ["SUPPORTED_RELATION", "PARTIAL_EVIDENCE", "INSUFFICIENT_EVIDENCE", "VERIFICATION_FAILED"],
                "type": "string"
              }
            },
            "required": ["candidate", "evidence", "is_sf_question", "outcome", "pool", "reject_reason", "resolution_id", "summary", "territory", "verdict", "verdict_basis", "verification_state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Resolve Fragment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b944df0f20471b9b3cb154312100674955494f10fb90280f18b5500c5768f19c"
        },
        {
          "name": "submit_resolution_feedback",
          "title": "Submit Resolution Feedback",
          "description": "After the user reacts to a resolve_fragment result, call this with its resolution_id. accepted: it is what they meant. partial: it helped but is not quite it. rejected: it is not what they meant. If they recognised an item in the shortlist or leads, send picked_rank (1 = first item) or picked_url; if nothing fitted, send none_fitted: true. corrected_target and new_clue are optional and are stored as feedback only; they never change graph facts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "corrected_target": {
                "description": "Optional. What the user was actually thinking of, if they know it. Max 300 characters.",
                "type": ["string", "null"]
              },
              "new_clue": {
                "description": "Optional. An extra detail the user remembered after seeing the result. Max 500 characters.",
                "type": ["string", "null"]
              },
              "none_fitted": {
                "description": "True if the user looked and nothing fitted.",
                "type": "boolean"
              },
              "note": {
                "description": "Optional free-text note. Max 1000 characters. No personal data.",
                "type": ["string", "null"]
              },
              "picked_rank": {
                "description": "Position of the shortlist or lead item the user recognised.",
                "minimum": 1,
                "type": "integer"
              },
              "picked_url": {
                "description": "URL of the item the user recognised.",
                "type": "string"
              },
              "resolution_id": {
                "description": "The resolution_id returned by the resolve_fragment call this feedback is about.",
                "type": "number"
              },
              "status": {
                "description": "accepted: the result is what the user meant. partial: it helped but is not quite it. rejected: it is not what the user meant.",
                "enum": ["accepted", "rejected", "partial"],
                "type": "string"
              }
            },
            "required": ["resolution_id", "status"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "recorded": {
                "type": "boolean"
              },
              "resolution_id": {
                "type": "number"
              },
              "status": {
                "enum": ["accepted", "rejected", "partial"],
                "type": "string"
              }
            },
            "required": ["recorded", "resolution_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Submit Resolution Feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b0f4afff2596d935a4c596ff59f35dd5b00debaa38103172089793b137271bc1"
        },
        {
          "name": "verify_claim",
          "title": "Verify Claim",
          "description": "Checks whether current web sources support a specific factual assertion. Takes a claim as a natural-language statement; returns a verdict with cited evidence and stated limits.\n\nVerdict set:\n- \"supported\" â€” multiple independent sources directly confirm the specific claimed detail\n- \"partially_supported\" â€” sources confirm the entity and domain; specific detail is pointed to but not directly stated\n- \"insufficient_evidence\" â€” sources don't address the specific claim; fires freely, including when the entity is well-known but the specific detail is undocumented\n- \"unsupported\" â€” a credible source explicitly contradicts the claim\n\nAll verdicts are DECIDE-BY-EYE. A \"supported\" verdict means current web sources confirm it â€” not that it is true. Evidence may be incomplete, biased, or outdated. The stated_limits field is always present and identifies what the evidence cannot confirm.\n\nGood input shape (specific, checkable assertions):\n- \"Werner Herzog dragged a full-size steamship over a hill during the filming of Fitzcarraldo\"\n- \"Glenn Gould stopped giving live concerts in 1964\"\n- \"The Backrooms photograph originated on 4chan\"\n\nChecks one specific factual statement. Not for identifying half-remembered works.\n\nNot this shape:\n- \"there's a documentary about a filmmaker dragging a boat over a mountain\"\n- \"a musician famous for stopping performing\"",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim": {
                "description": "A specific factual assertion to check against current web sources. Should be a concrete, checkable statement â€” not a question or a half-remembered fragment.",
                "maxLength": 500,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "evidence": {
                "description": "Web sources retrieved. Always DECIDE-BY-EYE â€” human must verify before acting.",
                "items": {
                  "properties": {
                    "domain": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "stated_limits": {
                "description": "What the evidence cannot confirm, even when verdict is supported. Always present.",
                "type": "string"
              },
              "verdict": {
                "description": "'supported' = multiple independent sources directly confirm the specific claimed detail. 'partially_supported' = sources confirm entity + domain; detail pointed to but not directly stated. 'unsupported' = a credible source explicitly contradicts the claim. 'insufficient_evidence' = pool doesn't address the specific claim; fires freely.",
                "enum": ["supported", "partially_supported", "unsupported", "insufficient_evidence"],
                "type": "string"
              }
            },
            "required": ["evidence", "stated_limits", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify Claim"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:891c960a1a4e252215cbe1cb50d9c3612bf4cef2bf507ccc2be629850db3bc3c"
        }
      ],
      "digest": "sha256:9f3f6358db44c6a4c7a2b97a6d719a06fa770323197d54847bfed1ed2675016c"
    }
  }
