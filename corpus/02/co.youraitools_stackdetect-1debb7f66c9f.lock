      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/stackdetect/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stackdetect",
        "title": "StackDetect",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call detect_stack with a URL or domain to see what the site is built with (CMS, framework, hosting, analytics, payments). Useful for lead research, competitor analysis and choosing how to integrate with or scrape a site.",
      "tools": [
        {
          "name": "detect_stack",
          "title": "What is this website built with?",
          "description": "Detects the technologies a website uses (CMS, ecommerce platform, JS framework, web server, CDN/hosting, analytics, ad pixels, chat, payments, consent tools) from one page load. Free preview tier: technology names and categories. The paid x402 endpoint /v1/detect adds versions, confidence and evidence plus email / DNS / hosting providers and verified SaaS from public DNS.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Absolute http(s) URL or a bare domain, e.g. https://laravel.com or shopify.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
