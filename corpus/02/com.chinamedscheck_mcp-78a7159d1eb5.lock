      "serverInfo": {
        "name": "com.chinamedscheck/mcp",
        "title": "ChinaMedsCheck — China Customs GACC Medication Legality & Airport Red-Channel Engine",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Screen prescription drugs and OTC remedies against China Customs GACC Decree 442, CAAC syringe/cold-chain aviation limits, 4 airport Red Channel desks (PVG, PEK, CAN, PKX), bilingual pharmacist show cards, and legal domestic substitutes. Source: https://chinamedscheck.com",
      "tools": [
        {
          "name": "audit_multi_medication_travel_bag_manifest",
          "title": "Multi-Drug Luggage Manifest Risk & Border Channel Consolidator",
          "description": "Evaluate an entire packed toiletry or travel bag containing multiple medications simultaneously to pinpoint any single banned trigger, aggregate Red Channel duties, and prepare a customs manifest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bagItems": {
                "description": "List of medications inside traveler luggage along with packed day quantities.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "carriedSupplyDays": {
                      "description": "Number of daily doses packed in luggage for this item.",
                      "type": "number"
                    },
                    "medicationQuery": {
                      "description": "Brand name, generic ingredient, or slug of a packed medication.",
                      "type": "string"
                    }
                  },
                  "required": ["carriedSupplyDays", "medicationQuery"],
                  "type": "object"
                },
                "type": "array"
              },
              "stayDurationDays": {
                "description": "Planned Mainland China visit duration in days used to cross-check long-stay refills.",
                "type": "number"
              }
            },
            "required": ["bagItems"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Multi-Drug Luggage Manifest Risk & Border Channel Consolidator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b1ab1b86d6f18820557c58d2ad16c86d9c2ea9ba77e538db7f9a301bb427651"
        },
        {
          "name": "calculate_medication_supply_allowance",
          "title": "GACC Decree 442 Personal Supply Day-Limit & Channel Evaluator",
          "description": "Compute whether carried medication quantities fall within legal Class I psychotropic (7-day), Class II (15-day), or maintenance prescription (90-day) caps relative to trip length.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carriedSupplyDays": {
                "description": "Total days of medication dosage the traveler intends to pack across China Customs.",
                "type": "number"
              },
              "medicationQuery": {
                "description": "Drug brand, slug, generic name, or fallback class (\"GENERIC_BANNED\", \"GENERIC_CAT1\", \"GENERIC_CAT2\", \"GENERIC_MAINTENANCE_RX\", \"GENERIC_OTC\").",
                "type": "string"
              },
              "stayDurationDays": {
                "description": "Total planned stay length inside Mainland China in calendar days.",
                "type": "number"
              }
            },
            "required": ["carriedSupplyDays", "medicationQuery"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GACC Decree 442 Personal Supply Day-Limit & Channel Evaluator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88f77e2cfb3c1551dcbf50332eb1821b906b31931b06ed4df8e43af54641e0e0"
        },
        {
          "name": "check_china_hospital_refill_and_clinic_pathway",
          "title": "In-China Hospital Refill Viability & Specialist Clinic Advisor",
          "description": "Determine if a foreign prescription can be legally re-prescribed inside Chinese Tier-3 hospitals or expat clinics, listing required department specialists, max refill days, and documentation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "medicationQuery": {
                "description": "Drug brand, generic substance, or slug (e.g., \"Concerta\", \"Xanax\", \"Metformin\", \"Prozac\") or pass \"refillable_only\".",
                "type": "string"
              }
            },
            "required": ["medicationQuery"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "In-China Hospital Refill Viability & Specialist Clinic Advisor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87f0ab7381ca055a786856f45d763d42fa824c58312460b842f164e61d40e205"
        },
        {
          "name": "evaluate_caac_cabin_sharps_and_cold_chain",
          "title": "CAAC Aviation Carry-On Syringes, Auto-Injectors & Cold-Chain Gate",
          "description": "Inspect Civil Aviation Administration of China cabin rules for insulin pens, EpiPen auto-injectors, medical needles, refrigerated cold packs, and doctor certificate requirements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filterMode": {
                "description": "Filter dataset by syringe/needle involvement, cold-chain refrigeration, or mandatory airline medical certificate.",
                "enum": ["all", "sharps_only", "cold_chain_only", "certificate_required"],
                "type": "string"
              },
              "medicationQuery": {
                "description": "Specific injectable or biologic medication name/slug (e.g., \"Ozempic\", \"Insulin\", \"EpiPen\") or pass \"all\" to filter by equipment flag.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CAAC Aviation Carry-On Syringes, Auto-Injectors & Cold-Chain Gate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22f8babdf19217561a80c5260f14dd2cbe5a8594431e08a5b9b7c84ac3d4023f"
        },
        {
          "name": "generate_bilingual_china_pharmacy_card",
          "title": "Chinese Pharmacist Show Card, Pinyin & Local OTC Brand Equivalent",
          "description": "Produce printable simplified Mandarin doctor/pharmacist consultation notes, Pinyin pronunciation, domestic brand equivalents, and customs officer show-card fields for travelers in China.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "daysOfSupply": {
                "description": "Optional declared supply duration in days for customs paperwork formatting.",
                "type": "number"
              },
              "medicationQuery": {
                "description": "Medication brand name, generic drug, or slug (e.g., \"Ibuprofen\", \"Tylenol\", \"Adderall\", \"Concerta\", \"Claritin\").",
                "type": "string"
              },
              "passengerName": {
                "description": "Optional traveler full passport name to prefill the English/Chinese declaration slip header.",
                "type": "string"
              }
            },
            "required": ["medicationQuery"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chinese Pharmacist Show Card, Pinyin & Local OTC Brand Equivalent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da434a8c9a0e0086f8f399c0460570f5a0c12a9b7e866fc191edc8de68f6b7cb"
        },
        {
          "name": "lookup_therapeutic_substitute_mesh",
          "title": "Therapeutic Alternative Graph & Safer Border Substitute Finder",
          "description": "Traverse the curated 38-drug therapeutic similarity graph to surface legal Chinese-approved substitutes and side-by-side risk comparisons when a traveler’s primary prescription is prohibited or heavily restricted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "medicationQuery": {
                "description": "Target banned or restricted medication (e.g., \"Adderall\", \"CBD oil\", \"Codeine\", \"Modafinil\") to find safer clinical alternatives.",
                "type": "string"
              }
            },
            "required": ["medicationQuery"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Therapeutic Alternative Graph & Safer Border Substitute Finder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de554f7cebf1e50648d4d5d42cd3839df864ea9f436d9e59e2995edef895b896"
        },
        {
          "name": "query_airport_red_channel_meds_walkthrough",
          "title": "China Airport Red Channel Desk & CT Pre-Screen Lock Walkthrough",
          "description": "Look up customs pre-inspection CT lock procedures, exact Red Channel declaration counters, operating hours, and arrival baggage steps across PVG, PEK, CAN, and PKX international airports.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airportQuery": {
                "description": "Airport IATA code (PVG, PEK, CAN, PKX), city name (Shanghai, Beijing, Guangzhou), terminal slug, or \"all\".",
                "type": "string"
              },
              "locale": {
                "description": "Language code for localized arrival instructions (defaults to English).",
                "enum": ["en", "ja", "ko", "ru", "vi"],
                "type": "string"
              }
            },
            "required": ["airportQuery"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "China Airport Red Channel Desk & CT Pre-Screen Lock Walkthrough"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0255689b32632d89e111e4e7b5e8711f658f98537a47e4589974b486f64b89a9"
        },
        {
          "name": "screen_medication_gacc_customs_legality",
          "title": "China Customs GACC Narcotic & Psychotropic Drug Border Screener",
          "description": "Match prescription brands, active ingredients, CAS numbers, RxNorm CUIs, Chinese names, or Russian/Japanese/Korean/Vietnamese aliases against 38 regulated entries under GACC Decree 442.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "medicationQuery": {
                "description": "Brand name, generic ingredient, Chinese name, CAS number, or slug (e.g., \"Adderall\", \"Concerta\", \"Xanax\", \"CBD oil\", \"Ozempic\", or \"all\").",
                "type": "string"
              },
              "statusFilter": {
                "description": "Optional severity filter when listing or narrowing results (RED banned, YELLOW controlled, GREEN allowed).",
                "enum": ["all", "RED", "YELLOW", "GREEN"],
                "type": "string"
              }
            },
            "required": ["medicationQuery"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "China Customs GACC Narcotic & Psychotropic Drug Border Screener"
          },
          "behavior": {
            "destructive": false,
