{
  "lockfileVersion": 2,
  "subjects": {
    "com.podlexicon/podlexicon": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://podlexicon.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "PodLexicon",
        "version": "1.28.1"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and read AI-generated summaries of 88,000+ podcast episodes across 150+ shows — mostly long-form interviews, narrative and analysis rather than daily news. Use `search_episodes` to find episodes on a topic, `get_episode_summary` to read one, and `find_similar_episodes` to go deeper. Every result includes a podlexicon.com link the user can open.",
      "tools": [
        {
          "name": "browse_catalogue",
          "description": "List what PodLexicon covers.\n\n    `kind` is \"podcasts\", \"topics\", or \"guests\". `query` filters by name.\n    ",
          "inputSchema": {
            "properties": {
              "kind": {
                "title": "Kind",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query"
              }
            },
            "required": ["kind"],
            "title": "browse_catalogueArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef9c1c35d1aea3e7ba583618a21cdf4e2b3f600bd61523edde1c048622d402da"
        },
        {
          "name": "find_similar_episodes",
          "description": "Find episodes covering similar ground to a given one.\n\n    Nearest-neighbour over the episodes' summary embeddings.\n    ",
          "inputSchema": {
            "properties": {
              "episode_id": {
                "title": "Episode Id",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              }
            },
            "required": ["episode_id"],
            "title": "find_similar_episodesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b2c3ab64e23a8e72c9ae0b3965cd0bddc941d0b09d7f92675251143c86d3b60"
        },
        {
          "name": "get_episode",
          "description": "Get an episode's metadata: title, show, date, duration, audio URL.",
          "inputSchema": {
            "properties": {
              "episode_id": {
                "title": "Episode Id",
                "type": "string"
              }
            },
            "required": ["episode_id"],
            "title": "get_episodeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19e1a8f7900096e5274eb0553c5a3832ce047c09ae14a05718f2379ab989f722"
        },
        {
          "name": "get_episode_summary",
          "description": "Read an AI-generated summary of one episode.\n\n    `detail` is \"brief\" (~400 tokens), \"detailed\" (~2,500 tokens), or \"topics\".\n    ",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "detailed",
                "title": "Detail",
                "type": "string"
              },
              "episode_id": {
                "title": "Episode Id",
                "type": "string"
              }
            },
            "required": ["episode_id"],
            "title": "get_episode_summaryArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e74fe85bdddef6906c6ecdcdeb54a8ebd7567948aa27e4249d3675cd0ce42c6"
        },
        {
          "name": "get_episodes_by",
          "description": "List the episodes belonging to one podcast, topic, or guest.\n\n    `kind` is \"podcast\", \"topic\", or \"guest\"; `slug` comes from\n    `browse_catalogue`.\n    ",
          "inputSchema": {
            "properties": {
              "kind": {
                "title": "Kind",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "title": "get_episodes_byArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b73cdf51c251d15e1b0946c9b172c11836156a9a980b3ab2289371488e063532"
        },
        {
          "name": "search_episodes",
          "description": "Find podcast episodes about a topic.\n\n    Returns a ranked shortlist with a one-line hook per episode - call\n    `get_episode_summary` to read one in full.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_episodesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4cca5840d9f6b9957e32d2a44e53b7236446780612277098c0c945e2909fe77c"
        }
      ],
      "digest": "sha256:e54c0d511220b04f91238d70af2d38e2b3a2a369f3eea0d260603b3dc3277783"
    }
  }
}
