{
  "lockfileVersion": 2,
  "subjects": {
    "com.peptency/research": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://peptency.com/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "peptency-research",
        "title": "Peptency research library",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Peptency research library: chemistry checked against PubChem, mechanism statements from the published literature with PMIDs, FDA, EMA, MHRA and WADA records, and PubMed-verified studies. Research-use reference only. Cite the PMID or DOI for each claim and the record's citeAs string for the library. The library gives no amounts, schedules or methods of use and no statement of what a compound does for a person; do not present its content as guidance for use or medical advice. Start with list_compounds or search_library, then get_compound for a full record.",
      "tools": [
        {
          "name": "compare_compounds",
          "title": "Compare two compounds",
          "description": "Side by side chemistry, class, mechanism statements, regulator records and study counts for two compounds, with the comparison page when one exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "First compound",
                "type": "string"
              },
              "b": {
                "description": "Second compound",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d2f253e4987fbf27cb85791a925a7658ef79ad863cf471214bf704b123964360"
        },
        {
          "name": "get_compound",
          "title": "Get a compound record",
          "description": "Full record for one compound or blend: chemistry (sequence, formula, weight, CAS, PubChem), mechanism as described in the literature with PMIDs, regulator records, evidence counts and every cited study.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Slug, name or alias, for example 'retatrutide', 'CJC-1295 no DAC' or 'ghk-cu'",
                "type": "string"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3f0acc86c5b2ad8578903156b45dce9107ee962bd3ef82a9ca07dac811220b6"
        },
        {
          "name": "get_regulatory_status",
          "title": "Get regulator records",
          "description": "FDA, EMA, MHRA and WADA database records for one compound on the check date, with the source of each. Information, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Slug, name or alias",
                "type": "string"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3dff2753c7f12a3b3fbc2254e140bea41756326490c6d18f82c2ce13bc8840c"
        },
        {
          "name": "get_studies",
          "title": "Get cited studies",
          "description": "Studies cited in the library with PMID, DOI, design and what each measured. Filter by compound, by words in the title, or both.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Optional slug, name or alias",
                "type": "string"
              },
              "query": {
                "description": "Optional words to match in the title or what was measured",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c102fcb9230ee706f66573d39390230c19aa578879a5f2b11fd3601386f2f6d"
        },
        {
          "name": "list_compounds",
          "title": "List compounds",
          "description": "Every compound and catalog blend in the library with formula, molecular weight, study count, plus the mechanism and comparison pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32f0af5a25f9e4ebf2700dc8ab441e06e2d74693a13555341481a6470c2ab2a4"
        },
        {
          "name": "search_library",
          "title": "Search the library",
          "description": "Search compounds (name, aliases, class), mechanisms, comparisons and cited study titles. Returns slugs to pass to get_compound.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Free text, for example 'GLP-1', 'BPC-157' or 'growth hormone secretagogue'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89a38158d7a017959d2b7820717d75681f44f9e1ea1b1aa53cde795bf9a1c3d1"
        }
      ],
      "digest": "sha256:0bb7d18f23a8a01f8bf3e860e9caa4fa9e5f4947110e803706a78b3f7a1c1e85"
    }
  }
}
