{
  "lockfileVersion": 2,
  "subjects": {
    "ai.gomain/domains": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gomain.hottub.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gomain",
        "title": "GoMain domains",
        "version": "0.1.0",
        "websiteUrl": "https://gomain.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GoMain helps pick and price domain names. check_availability asks each TLD's registry whether names are taken; suggest_names turns keywords into names and checks them; compare_prices lists every tracked registrar's price for a TLD, sorted by what the domain costs over three years, because first-year prices often hide expensive renewals; tld_info and price_history give background. Prices are US dollars per year, refreshed daily. When recommending where to register, mention the renewal price, not just the first year. Availability is not a reservation, and the registrar's checkout has the final price.",
      "tools": [
        {
          "name": "acquisition_report",
          "title": "How to get a taken domain",
          "description": "For a domain someone already owns: whether it's listed for sale and where (with the asking price when the sale page shows one), when it could drop, its estimated value, the realistic chance of buying it, the options in order (buy now, make an offer, backorder, have GoMain broker it, watch it) and available alternatives with prices.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:caa77bf14598b88fe5629b9b5f1f8455f8eecce263376b8b94a92c17eae8654b"
        },
        {
          "name": "appraise_domain",
          "title": "Estimate a domain's value",
          "description": "A rough value range for a domain, from its length, how easy it is to say, its TLD, its age and how many popular TLDs have the same name registered. Use it to set a realistic budget before trying to buy a taken name. Not a comparable-sales appraisal.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:edf35c75865d981e64af7cdf345d3490ed7c158dc6e6ac5ab8f468ff36672f0f"
        },
        {
          "name": "broker_status",
          "title": "Deal or watch status",
          "description": "The status and history of a brokerage deal (id d_…) or a watch (id w_…), given the id and status key returned when it was created.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "status_key": {
                "type": "string"
              }
            },
            "required": ["id", "status_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fa85524ebacf81ec3e8884b2ce680ac4fa972b368c63d47c309787f84d420710"
        },
        {
          "name": "check_availability",
          "title": "Check domain availability",
          "description": "Check whether domain names are registered, asking each TLD's registry directly (RDAP). Returns registered, available, likely_available (no registry lookup service, but no DNS records either) or unknown, plus the registrar and dates for taken names and the cheapest prices for open ones. Up to 20 names per call. A lookup is not a reservation: names can be taken at any moment, and premium or reserved names may still be priced higher or blocked at checkout.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "Domain names, like \"example.com\" or \"münchen.de\"",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8a7011f25df552e587a279b1a7489d35c82b61c6fb976bc5e11080814d190b1a"
        },
        {
          "name": "check_name",
          "title": "Check a name everywhere",
          "description": "Is a project name usable everywhere it'll be needed? Checks the domain across TLDs (with prices), GitHub, npm, PyPI and crates.io, and gives links for trademark and social-handle checks that can't be automated.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The name, like \"tidepool\"",
                "type": "string"
              },
              "tlds": {
                "description": "TLDs to check. Default: com, ai, io, dev, app, co",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6cbea10adb8f718c719f690a43379c5687e5733cc36cef0ae418bf5bfdded7ef"
        },
        {
          "name": "compare_prices",
          "title": "Compare registrar prices for a TLD",
          "description": "Every tracked registrar's price for one TLD, in US dollars per year, refreshed daily from 40+ registrars. Sorted by 3-year cost (first year plus two renewals) by default, because a cheap first year often hides an expensive renewal. Each offer links to where to buy.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "three_year",
                "enum": ["three_year", "registration", "renewal", "transfer"],
                "type": "string"
              },
              "tld": {
                "description": "A TLD (\"ai\", \".co.uk\") or a domain to take it from (\"example.ai\")",
                "type": "string"
              }
            },
            "required": ["tld"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb6767567e99ff83b5731943120b237b0cb6e774834d178fe36cb398c9cf973b"
        },
        {
          "name": "dns_setup",
          "title": "DNS records for a website and email",
          "description": "The exact DNS records to add so a domain serves a website (Vercel, Netlify, GitHub Pages, Cloudflare Pages) and receives email (Google Workspace, Microsoft 365, Fastmail, Zoho, Proton), plus a starting DMARC policy. Checks live DNS to show which records are already in place and warns about clashes such as two SPF records. Values a provider generates per account are marked as such.",
          "inputSchema": {
            "properties": {
              "account": {
                "description": "GitHub user, Netlify site or Cloudflare Pages project name, when the website host needs one",
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "email": {
                "enum": ["google-workspace", "microsoft-365", "fastmail", "zoho", "proton"],
                "type": "string"
              },
              "website": {
                "enum": ["vercel", "netlify", "github-pages", "cloudflare-pages"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2693e4922960c03e5673b8d27f7b7fb3fe679d82cd6049e60c706e683b8f63d"
        },
        {
          "name": "list_domain_for_sale",
          "title": "Sell a domain through GoMain",
          "description": "List a domain the user owns for sale. The first call returns a DNS TXT record that proves ownership; once it's added, calling again with the same domain and email activates the listing. asking_price is shown to buyers; floor_price, the lowest offer accepted automatically, never is. Sales close through Escrow.com.",
          "inputSchema": {
            "properties": {
              "asking_price": {
                "minimum": 1,
                "type": "integer"
              },
              "domain": {
                "type": "string"
              },
              "email": {
                "description": "The owner's email",
                "type": "string"
              },
              "floor_price": {
                "minimum": 1,
                "type": "integer"
              },
              "listing_key": {
                "description": "Needed to change an active listing",
                "type": "string"
              },
              "withdraw": {
                "type": "boolean"
              }
            },
            "required": ["domain", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f49d849e240fd8798552a6b76a7a7af84472f14c8ea64019622fcdfaf652c551"
        },
        {
          "name": "make_offer",
          "title": "Make an offer on a GoMain listing",
          "description": "Offer to buy a domain listed with GoMain. Offers at or above the asking price buy it outright; lower offers are negotiated automatically with a counter-offer, for up to three rounds, then the seller decides. An accepted offer opens an Escrow.com transaction, so the money is only released once the domain arrives. Confirm the amount and email with the user before calling; to answer a counter-offer, pass the deal_id and status_key from the last answer.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "US dollars",
                "minimum": 1,
                "type": "integer"
              },
              "deal_id": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "email": {
                "description": "The buyer's email",
                "type": "string"
              },
              "status_key": {
                "type": "string"
              }
            },
            "required": ["amount", "domain", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f15f089a9cc17c71737a115e1d61c53f9e7f00919c0bbe3a1cac59b8480954e0"
        },
        {
          "name": "price_history",
          "title": "Price history for a TLD",
          "description": "Every recorded price change for one TLD, oldest first, from GoMain's daily archive. A registrar's first entry is its price when the archive began (or when it started selling the TLD); later entries are changes. Prices are per year, in US dollars unless `currency` says otherwise.",
          "inputSchema": {
            "properties": {
              "registrar": {
                "description": "Only this registrar's changes, by id (\"porkbun\")",
                "type": "string"
              },
              "tld": {
                "description": "A TLD (\"ai\", \".co.uk\") or a domain to take it from (\"example.ai\")",
                "type": "string"
              }
            },
            "required": ["tld"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6d36b3f718c83c4783d1d589f3c8bd42e830e32d0c616e9fa11f1a896dd63b02"
        },
        {
          "name": "request_acquisition",
          "title": "Have GoMain buy a taken domain",
          "description": "Ask GoMain's brokerage to acquire a domain someone else owns. GoMain researches it, approaches the owner without naming the buyer, negotiates within the budget (which the owner never sees), and closes through Escrow.com. Confirm the buyer's email and budget with the user before calling. Returns a deal id and status key for broker_status.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              },
              "email": {
                "description": "The buyer's email, for progress reports and the escrow invitation",
                "type": "string"
              },
              "max_budget": {
                "description": "The most the buyer will pay, in US dollars",
                "minimum": 1,
                "type": "integer"
              },
              "notes": {
                "description": "Anything the broker should know, like a deadline",
                "type": "string"
              }
            },
            "required": ["domain", "email", "max_budget"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:acc6ea0e37f6dee99a751797dab9137bc1208d9767fe47ea411726dd99eb6452"
        },
        {
          "name": "search_domains_for_sale",
          "title": "Search names for sale on GoMain",
          "description": "Search domains their owners have listed for sale with GoMain (each owner proved control of the name). Returns asking prices where set; make_offer buys or negotiates.",
          "inputSchema": {
            "properties": {
              "keywords": {
                "description": "Words the name should contain; empty lists everything",
                "type": "string"
              },
              "max_price": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7eba7d12eb2a93bc3a9bbadbaf62b997bb952fce716411d1dbca801816fadad7"
        },
        {
          "name": "suggest_names",
          "title": "Suggest available domain names",
          "description": "Turn a few keywords into domain name candidates (the words joined, with common prefixes and suffixes, across several TLDs), check each with its registry, and return the available ones with prices. For your own name ideas, use check_availability.",
          "inputSchema": {
            "properties": {
              "keywords": {
                "description": "A few words about the project, like \"coffee map\"",
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "How many candidates to check",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "tlds": {
                "description": "TLDs to try, first one preferred. Default: com, ai, io, dev, app, co",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["keywords"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5fc8a2cc44ec770d0aa53ca1067abffcc58a62df77958f03de04b83088e5042d"
        },
        {
          "name": "tld_info",
          "title": "TLD facts",
          "description": "Who runs a TLD, its type (generic, country-code, ...), when it was delegated, its registry's website and lookup servers (from IANA), and its cheapest first-year, renewal and 3-year prices.",
          "inputSchema": {
            "properties": {
              "tld": {
                "description": "A TLD (\"ai\", \".co.uk\") or a domain to take it from (\"example.ai\")",
                "type": "string"
              }
            },
            "required": ["tld"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:18cd61cad2c7005bd3ff4a0e8129809499e46e81fbc2c3da0556621cb6a3ce4d"
        },
        {
          "name": "watch_domain",
          "title": "Watch a domain",
          "description": "GoMain checks a domain daily and emails when it drops (or is about to), changes hands, or is listed for sale. Returns a watch id and status key for broker_status.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              },
              "email": {
                "type": "string"
              }
            },
            "required": ["domain", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bcede9735768608b4fc3fcc758a10331769ea0029ec63f49ad2b6248672165a9"
        }
      ],
      "digest": "sha256:3dfd97ae4e65d9157e25833e384d06756d02146d18cb1da36e0fe32849c3098e"
    }
  }
