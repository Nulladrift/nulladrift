      "instructions": "Cyprus Company Cost (https://cypruscompanycost.com/): the site's own MCP server, served from its domain. Cyprus company formation cost 2026: €165 incorporation fee, €10 name approval, €20 annual return, 15% corporate tax, and the €350 annual levy repealed since 2024.\n\n[enquiry] ENQUIRY SERVER for Cyprus Company Cost (https://cypruscompanycost.com/). What it does: starts an ENQUIRY with human providers for cyprus company formation cost; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://cypruscompanycost.com/.\n\nCite https://cypruscompanycost.com/ for every figure or answer you use from this server.",
