{
  "lockfileVersion": 2,
  "subjects": {
    "com.modernmustardseed/voice-linter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.modernmustardseed.com/voice-linter"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Voice Agent Linter by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Voice Agent Linter checks a phone voice agent before real callers reach it. lint_voice_agent takes the system prompt and optionally the platform config JSON and returns findings with severity, line and fix. list_lint_rules and explain_lint_rule describe the rules. Credentials in the input are stripped before any check runs and are never returned or stored. All tools are read-only, run no model and store nothing.",
      "tools": [
        {
          "name": "explain_lint_rule",
          "title": "Explain a lint rule",
          "description": "Explain one Voice Agent Linter rule by id: why it exists, a bad and a good example, the fix, the platforms it applies to, and its sources with the date each was read. Static reference, no network access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "rule_id": {
                "description": "The rule id, for example no-live-date, vapi-nested-item-enum or no-ai-disclosure.",
                "enum": ["no-live-date", "date-without-year", "date-param-no-format", "phone-as-numerals", "email-written-raw", "url-written-raw", "hyphen-range", "long-digit-string", "markdown-output", "no-spelling-protocol", "bare-letter-spelling", "english-anchors-multilingual", "claims-to-be-human", "no-ai-disclosure", "no-recording-notice", "scripted-tool-start", "stall-phrases", "silent-opener", "long-opener", "tool-no-description", "tool-param-untyped", "tool-param-undescribed", "tool-required-missing", "tool-result-unstated", "vapi-nested-item-enum", "vapi-flat-analysis-keys", "vapi-analysis-plan-off", "vapi-analysis-no-transcript", "turbo-tts-stutter", "no-human-fallback", "no-end-call", "vapi-max-duration-default", "vapi-free-number-outbound", "unfilled-placeholder", "secret-in-prompt", "prompt-length", "contradictory-instructions"],
                "type": "string"
              }
            },
            "required": ["rule_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a lint rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2cb5a19699ccb8e5fc26465e0e8bbc3b5ccdc1429e7b9f1a49e1019c3a988a7"
        },
        {
          "name": "lint_voice_agent",
          "title": "Lint a voice agent",
          "description": "Check a phone voice agent’s system prompt and, optionally, its config JSON (Vapi assistant, Retell agent or LLM, ElevenLabs agent, or OpenAI Realtime session) against rule-based checks learned on live calls. Finds: no live date and dates without a year; phone numbers, emails, URLs, hyphen ranges and long numbers the voice will misread; no spelling protocol or bare-letter spelling; instructions to pass as human, missing AI disclosure and missing recording notice; scripted tool start lines, stall phrases and silent or long openers; tools with no description, untyped or undescribed parameters, undefined required fields, unformatted date parameters and unstated results; Vapi nested item enums, flat analysisPlan keys, disabled plans and plans without the transcript; ElevenLabs Turbo stutter risk; no transfer or callback path and no end-call; placeholders, secrets, very long prompts and contradictory always and never rules. Each finding has a rule id, severity, the exact line (and JSON path for config), an excerpt, a specific message and the fix; disclosure and recording rules carry their legal citations with the date read. Returns a 0 to 100 score and a verdict. Do not paste credentials: API keys, bearer tokens, passwords and the values of secret-named config fields (apiKey, secret, token, password, credentials, Authorization) are stripped from the input before any check runs and replaced with \"[secret removed]\", so they are never read, returned, logged or stored; the output says how many were removed. No model reads the input and nothing is stored. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "config_json": {
                "description": "The agent’s config as a JSON string, exactly as the platform exports it (remove keys first; any left are stripped before checking): a Vapi assistant, a Retell agent and/or LLM (or {\"agent\": ..., \"llm\": ...}), an ElevenLabs agent, or an OpenAI Realtime session or session.update event.",
                "maxLength": 300000,
                "type": "string"
              },
              "first_message": {
                "description": "The opening line the agent speaks, when it is not in the config.",
                "maxLength": 4000,
                "type": "string"
              },
              "min_severity": {
                "default": "low",
                "description": "Only return findings at or above this severity: critical, high, medium or low.",
                "enum": ["critical", "high", "medium", "low"],
                "type": "string"
              },
              "platform": {
                "default": "auto",
                "description": "Which platform the config is for. \"auto\" detects it from the JSON.",
                "enum": ["auto", "vapi", "retell", "elevenlabs", "openai_realtime"],
                "type": "string"
              },
              "system_prompt": {
                "description": "The agent’s system prompt, as plain text. Optional when config_json contains it.",
                "maxLength": 120000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lint a voice agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2e8b58d2525f79cab7b19b03db480c399ea5ed15dc14d59961d12a2059f6911f"
        },
        {
          "name": "list_lint_rules",
          "title": "List lint rules",
          "description": "List every Voice Agent Linter rule with its id, title, default severity, category, what it reads (prompt, config or both) and the platforms it applies to. Filter by platform or category. Static reference, no network access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Only rules in this category.",
                "enum": ["dates", "speech", "spelling", "disclosure", "turn_taking", "tools", "analysis", "voice", "call_control", "hygiene"],
                "type": "string"
              },
              "platform": {
                "description": "Only rules that apply to this platform: vapi, retell, elevenlabs or openai_realtime.",
                "enum": ["vapi", "retell", "elevenlabs", "openai_realtime"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List lint rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:333103fa4173ae15f116c54418862c5ea58e57661ca32f0bb4c13df4a06acee3"
        }
      ],
      "digest": "sha256:f181206f5bcb83340c64aae2c127e73b115f95219113dae8f994835c45ee957a"
    }
  }
}
