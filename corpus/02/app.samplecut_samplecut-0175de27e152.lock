            }
          },
          "digest": "sha256:30384d0079617c2a81c617f26b779ca0a216fd54d92619ec06fb52509e1b00c0"
        },
        {
          "name": "send_feedback",
          "description": "Tell Samplecut's developers how the user's task went. Call it once after you finish or give up on a task where you used these tools, with task_completed set to whether the user got what they wanted. Use feedback_type \"missing_capability\" when the goal needed something these tools do not do (for example naming a song or separating vocals), even if you finished it another way; \"issue\" when a tool failed, or its result was wrong or confusing; \"praise\" when it went well. This only records feedback. No links, names or personal details.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "Pass the exact conversation_id from the server's previous response, unchanged. The server provides it on the first call — never invent one, and do not issue parallel tool calls until you have it. Keep passing the same conversation_id for the rest of the conversation, including after later user messages or on a different task; do not reset it when the user starts a new request.",
                "type": "string"
              },
              "details": {
                "description": "Optional longer context: what you tried, exact parameter values, the error text you saw, and any workaround you used. Omit when the summary says it all.",
                "type": "string"
              },
              "feedback_type": {
                "description": "What kind of feedback this is. Use 'missing_capability' when the tool you needed does not exist in the tool list - nothing failed, the capability is absent (this is the most valuable report; send it even if you found a workaround). Use 'issue' when an existing tool behaved badly: it failed, returned a confusing error, or its description or schema misled you. Use 'praise' when something worked notably well. Use 'other' for anything else.",
                "enum": ["missing_capability", "issue", "praise", "other"],
                "type": "string"
              },
              "friction_points": {
                "description": "Optional: the specific moments that slowed you down, as short bullet-like sentences, quoting exact tool names, parameters, or error text.",
                "type": "string"
              },
              "llm_model": {
                "description": "The exact model identifier you (the assistant) are running as, taken from your system prompt or environment (e.g. \"claude-opus-4-8\", \"gpt-5.2\"). Used for analytics only. If you do not know your model identifier with certainty, pass \"unknown\" — never guess.",
                "type": "string"
              },
              "sentiment": {
                "description": "Optional: how the experience felt overall.",
                "enum": ["positive", "neutral", "negative", "mixed"],
                "type": "string"
              },
              "suggested_improvement": {
                "description": "Optional: the concrete change that would have helped, e.g. the tool to add, the description to reword, or the error message to improve.",
                "type": "string"
              },
              "summary": {
                "description": "One self-contained sentence. For 'missing_capability': the capability you needed, e.g. 'No tool to delete multiple cohorts in one call.' For 'issue': the tool and the problem, e.g. 'query-trends rejects relative date ranges with an unclear error.'",
                "type": "string"
              },
              "task_completed": {
                "description": "Optional: whether you still completed the user's task despite the problem.",
                "type": "boolean"
              },
              "tool_name": {
                "description": "Optional: the existing tool this feedback is about (for 'issue' or 'praise'). Leave empty for 'missing_capability' - the point is that no tool fits.",
                "type": "string"
              }
            },
            "required": ["feedback_type", "llm_model", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Send feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d9734e3280deff82a3f377fe190694251f6f61c863d1f12175ef4a074582a55a"
