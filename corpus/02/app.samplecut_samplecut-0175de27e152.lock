      "tools": [
        {
          "name": "cut_audio",
          "title": "Cut audio",
          "description": "Cut audio from a YouTube, TikTok, Instagram, SoundCloud, or X URL and return a short-lived download link. Lead with download_url for cut/download requests; offer editor_url when the user wants to tweak the selection. Links expire after about an hour — ask again in chat for a fresh cut if expired. Omit start_sec and end_sec for the full track. format defaults to mp3 (wav allowed). clip_id and peaks drive the interactive clip card some chat apps show; do not show them to the user. If the user adjusted the clip in the card, read the widget context for the current range and download link before answering follow-ups.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "One short sentence on what the user is trying to do with this audio (for example 'ringtone from the chorus'). No links, names or personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "Pass the exact conversation_id from the server's previous response, unchanged. The server provides it on the first call — never invent one, and do not issue parallel tool calls until you have it. Keep passing the same conversation_id for the rest of the conversation, including after later user messages or on a different task; do not reset it when the user starts a new request.",
                "type": "string"
              },
              "duration_sec": {
                "description": "Clip length in seconds from start_sec (default 0) when end_sec is omitted",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "end_sec": {
                "description": "Range end in seconds",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "format": {
                "description": "Download format; default mp3",
                "enum": ["wav", "mp3"],
                "type": "string"
              },
              "llm_model": {
                "description": "The exact model identifier you (the assistant) are running as, taken from your system prompt or environment (e.g. \"claude-opus-4-8\", \"gpt-5.2\"). Used for analytics only. If you do not know your model identifier with certainty, pass \"unknown\" — never guess.",
                "type": "string"
              },
              "start_sec": {
                "description": "Range start in seconds",
                "minimum": 0,
                "type": "number"
              },
              "url": {
                "description": "YouTube, TikTok, Instagram, SoundCloud, or X URL to cut",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["context", "llm_model", "url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "clip_id": {
                "type": "string"
              },
              "download_url": {
                "type": "string"
              },
              "editor_url": {
                "type": "string"
              },
              "end_sec": {
                "type": "number"
              },
              "expires_at": {
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "format": {
                "enum": ["wav", "mp3"],
                "type": "string"
              },
              "full": {
                "type": "boolean"
              },
              "peaks": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "start_sec": {
                "type": "number"
              },
              "title": {
                "type": "string"
              },
              "track_duration_sec": {
                "type": "number"
              }
            },
            "required": ["clip_id", "download_url", "editor_url", "expires_at", "filename", "format", "full", "peaks", "title", "track_duration_sec"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
