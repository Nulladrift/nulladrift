            "ui": {
              "resourceUri": "ui://samplecut/clip-card-v2.html"
            },
            "ui/resourceUri": "ui://samplecut/clip-card-v2.html"
          },
          "digest": "sha256:8b390dc94ecb2c74abb2816219cff06c21719cf029827e1ee02d7bc348869c3e"
        },
        {
          "name": "get_transcript",
          "title": "Get transcript",
          "description": "Fetch timestamped captions for a YouTube, TikTok, Instagram, SoundCloud, or X URL when the platform provides them. Use segment start_sec/end_sec (or the flat text) to choose a cut range, then call cut_audio with the same URL and those times. When available is false there are no captions — do not invent lyrics or timestamps; tell the user to pick times another way. Optional lang is a BCP-47 code (default en). No job_id is returned.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "One short sentence on what the user is trying to do with this audio (for example 'ringtone from the chorus'). No links, names or personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "Pass the exact conversation_id from the server's previous response, unchanged. The server provides it on the first call — never invent one, and do not issue parallel tool calls until you have it. Keep passing the same conversation_id for the rest of the conversation, including after later user messages or on a different task; do not reset it when the user starts a new request.",
                "type": "string"
              },
              "lang": {
                "description": "Optional BCP-47 caption language (default en)",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "llm_model": {
                "description": "The exact model identifier you (the assistant) are running as, taken from your system prompt or environment (e.g. \"claude-opus-4-8\", \"gpt-5.2\"). Used for analytics only. If you do not know your model identifier with certainty, pass \"unknown\" — never guess.",
                "type": "string"
              },
              "url": {
                "description": "YouTube, TikTok, Instagram, SoundCloud, or X URL to fetch captions for",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["context", "llm_model", "url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "available": {
                "type": "boolean"
              },
              "lang": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "segments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "end_sec": {
                      "type": "number"
                    },
                    "start_sec": {
                      "type": "number"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["end_sec", "start_sec", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "anyOf": [
                  {
                    "enum": ["youtube_captions"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["available", "lang", "segments", "source", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a40e037b51197a07c308f96055a66dd9c5a46ebb996f8f42ca419bff1cb28e3f"
        },
        {
          "name": "retrim_clip",
          "title": "Adjust clip",
          "description": "Re-cut a clip from Samplecut's clip card to a new start/end, reusing the audio already extracted for it. Called by the interactive card; to cut something new, use cut_audio.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clip_id": {
                "description": "clip_id from a cut_audio result",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "context": {
                "description": "Optional: why the clip is being re-cut",
                "type": "string"
              },
              "conversation_id": {
                "description": "Pass the exact conversation_id from the server's previous response, unchanged. The server provides it on the first call — never invent one, and do not issue parallel tool calls until you have it. Keep passing the same conversation_id for the rest of the conversation, including after later user messages or on a different task; do not reset it when the user starts a new request.",
                "type": "string"
              },
              "end_sec": {
                "description": "New range end in seconds",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "format": {
                "description": "Download format; default the clip's current format",
                "enum": ["wav", "mp3"],
                "type": "string"
              },
              "llm_model": {
                "description": "Optional: the model making this call",
                "type": "string"
              },
              "start_sec": {
                "description": "New range start in seconds",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["clip_id", "end_sec", "start_sec"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "clip_id": {
                "type": "string"
              },
              "download_url": {
                "type": "string"
              },
              "editor_url": {
                "type": "string"
              },
              "end_sec": {
                "type": "number"
              },
              "expires_at": {
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "format": {
                "enum": ["wav", "mp3"],
                "type": "string"
              },
              "full": {
                "type": "boolean"
              },
              "peaks": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "start_sec": {
                "type": "number"
              },
              "title": {
                "type": "string"
              },
              "track_duration_sec": {
                "type": "number"
              }
            },
            "required": ["clip_id", "download_url", "editor_url", "expires_at", "filename", "format", "full", "peaks", "title", "track_duration_sec"],
            "type": "object"
          },
          "annotations": {
