      "serverInfo": {
        "name": "com.clawhard/vouch",
        "title": "Vouch",
        "version": "1.0.0",
        "description": "Vouch checks links and quotes against the live web: which links load, redirect, 404, soft-404 or point to a missing #anchor (with the closest real page from the site's sitemap), and whether a page really contains a quote, word for word or with changed words and numbers. No account.",
        "websiteUrl": "https://vouch.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Vouch: Vouch checks links and quotes against the live web: which links load, redirect, 404, soft-404 or point to a missing #anchor (with the closest real page from the site's sitemap), and whether a page really contains a quote, word for word or with changed words and numbers. No account. Use it when links, sources or quotes are about to go into an answer, README, report or article, or the user asks whether a link works or a page really says something. Tools: vouch_check_links (Check that links load, where they redirect and whether #anchors exist); vouch_check_quote (Check whether a web page really contains a quote). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "vouch_check_links",
          "title": "Check that links load, where they redirect and whether #anchors exist",
          "description": "Use when the user asks whether links work, or before links, sources or doc URLs go into an answer, README, report, email or code comment (signals: \"are these links dead\", \"check the links in this README\", \"does this URL exist\", \"404\", \"broken link\", \"where does this redirect\", \"is this docs page still there\"). Fetches each URL live (GET, redirects followed hop by hop) and returns per link a status: ok, redirected (link the final_url), soft_404 (answers 200 but the title says not found, or a deep link lands on the front page), anchor_missing (the #section id is not on the page), broken (404, 410 or other 4xx), server_error (5xx), blocked (401, 403, 429 or a bot challenge: not proof the page is missing), unreachable (DNS, connection or timeout) or invalid. Each result has http_status, every hop, final_url, page title and canonical; for broken pages it lists the closest real pages from the site's own sitemap (suggestions, the top one re-checked). Give urls (up to 15) or text (Markdown, HTML or plain text; its http and https links are extracted, first 15 checked). Example: {\"urls\":[\"https://docs.stripe.com/api/charge\",\"https://developer.mozilla.org/en-US/docs/Web/HTML/Element/a#attributes\"]}. Limits: a page can work in a browser and still be blocked here; pages built by JavaScript may hide anchors; one call makes at most 45 requests.",
          "inputSchema": {
            "properties": {
              "suggest": {
                "description": "true (default): for broken pages, look up the closest pages in the site's sitemap.xml. false: skip that lookup.",
                "type": "boolean"
              },
              "text": {
                "description": "Markdown, HTML or plain text (a README, an answer, a doc); every http/https link in it is extracted and the first 15 unique ones are checked. Give urls or text, not both.",
                "maxLength": 200000,
                "minLength": 10,
                "type": "string"
              },
              "urls": {
                "description": "Up to 15 http or https addresses. A #fragment is checked as an anchor on the page. Give urls or text, not both.",
                "items": {
                  "maxLength": 2000,
                  "minLength": 4,
                  "type": "string"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check that links load, where they redirect and whether #anchors exist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/vouch/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/vouch/result"
          },
          "digest": "sha256:f32f218950e2a957d83b5b6868474b88129e0d8e0b49fec5ee2849b95a733fc1"
        },
        {
          "name": "vouch_check_quote",
          "title": "Check whether a web page really contains a quote",
          "description": "Use when a quote, a statistic or a claim is attributed to a web page and the user asks whether the source says it, or before a citation goes into an answer, report, article or essay (signals: \"does this article actually say\", \"verify this quote\", \"is this citation real\", \"check the source\", \"did they really write that\", \"fact-check this quote against the link\"). Fetches the page once, extracts its visible text and returns per quote a verdict: exact (word for word), normalized (same words in order; only punctuation, capitals, spacing or curly quotes differ), close (similarity 0.85 or more, wording differs), partial (0.5 to 0.85) or not_found, with the matching passage, surrounding context, the words that differ and numbers_differ when a number changed (for example 1914 in the quote, 1912 on the page). Quotes with \"...\" are checked part by part. Example: {\"url\":\"https://en.wikipedia.org/wiki/Alan_Turing\",\"quotes\":[\"widely regarded as the father of theoretical computer science\"]}. Limits: a match shows the words are on the page, not that the claim is true; pages built by JavaScript may have little text in their HTML; PDFs and paywalled or bot-blocked pages cannot be read; up to 10 quotes of 1000 characters, at least 3 words each.",
          "inputSchema": {
            "properties": {
              "quotes": {
                "description": "1 to 10 quotes or claims to look for, as written in the draft (at least 3 words each).",
                "items": {
                  "maxLength": 1000,
                  "minLength": 8,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "url": {
                "description": "The http or https address of the source page (an article, doc, blog post, Wikipedia page or plain-text file).",
                "maxLength": 2000,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["quotes", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check whether a web page really contains a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/vouch/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/vouch/result"
          },
          "digest": "sha256:e7c49effe7a281b80c0dbdd5e5ef6e5ab4cf34ee3bcda88091cc0de04e201060"
        }
