{
  "lockfileVersion": 2,
  "subjects": {
    "com.langfuse/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://langfuse.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mcp-typescript server on vercel",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this server for Langfuse documentation, product concepts, SDK/API usage, instrumentation guidance, migration help, and current docs pages.\nFor project-scoped Langfuse data or actions such as prompts, datasets, scores, comments, metrics, observations, models, or project-specific feedback, prefer the authenticated Langfuse app MCP server when it is available.\nWhen Langfuse agent skills are installed, use them for end-to-end workflows, repo-specific guidance, and agent setup patterns; use this docs server to fetch or verify current documentation.\nInspect the available tools and their schemas dynamically; do not assume a fixed tool list.\nIf the user wants to provide feedback about Langfuse docs or something is not working well, ask permission and show the exact payload; if they want a reply, include only an email address they explicitly provide in the feedback text; exclude secrets, customer/project data, trace payloads, and unrelated context, then use submitFeedback.",
      "tools": [
        {
          "name": "getLangfuseDocsPage",
          "description": "Fetch the raw Markdown for a single Langfuse docs page. Accepts a docs path (e.g., /docs/observability/overview) or a full https://langfuse.com URL. Returns the exact Markdown (may include front matter). Use when you need a specific page content (Integration, Features, API, etc.) or code samples. Prefer searchLangfuseDocs for broader questions where there is not one specific page about it. Changelog pages (/changelog/...) are historical release notes: use them only to confirm that a feature exists or when it shipped, not as an implementation reference. Their code samples reflect the SDK/API at release time and may be outdated, so for implementation follow the current docs and the API/SDK reference instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "pathOrUrl": {
                "description": "Docs path starting with \"/\" (e.g., /docs/observability/overview) or a full URL on https://langfuse.com. Do not include anchors (#...) or queries (?foo=bar) — they will be ignored.",
                "type": "string"
              }
            },
            "required": ["pathOrUrl"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f557e1852b9a44f921fd4e02f9fda02b084b189616a80eb456f0b5e55c9981e"
        },
        {
          "name": "getLangfuseOverview",
          "description": "Get a high-level, machine-readable index by downloading https://langfuse.com/llms.txt. Use this at the start of a session when needed to discover key docs endpoints or to seed follow-up calls to searchLangfuseDocs or getLangfuseDocsPage. Returns the plain text contents of llms.txt. Avoid repeated calls within the same session.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:457541a8b323985b2a4c06ca8e8cab8ae88d1b1211946e9bba1a43893d58d933"
        },
        {
          "name": "searchLangfuseDocs",
          "description": "Semantic search (RAG) over the Langfuse documentation. Use this whenever the user asks a broader question that cannot be answered by a specific single page. Returns the text of the most relevant docs pages, with their URLs. For prices, call getLangfuseDocsPage with /pricing or /pricing-self-host. Prefer this before guessing. If a specific page is needed call getLangfuseDocsPage first. The raw provider response is included in _meta.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "The user's question in natural language. Include helpful context like SDK/language (e.g., Python v3, JS v4), self-hosted vs cloud, and short error messages (trim long stack traces). Keep under ~600 characters.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dbf897d6b2f93481b8edf3965209ea29d4eab44970599477de19d23294496d19"
        },
        {
          "name": "submitFeedback",
          "description": "Submit explicit user-approved feedback to the Langfuse team.\nBefore calling, ask permission and show the exact payload.\nIf the user wants a reply, ask them to include their email address in the feedback text; only use an address they explicitly provide and show it in the exact payload preview.\nDo not include secrets, credentials, customer/project data, trace payloads, or unrelated context; the only contact detail to include is an explicitly provided reply email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "feedback": {
                "maxLength": 3000,
                "minLength": 1,
                "type": "string"
              },
              "goal": {
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              },
              "referenceUrl": {
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "target": {
                "description": "The specific instance within targetType: the skill name, MCP tool name, CLI command, API endpoint path, or docs page path (e.g. 'queryMetrics', '/docs/mcp'). An identifier, not a sentence.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "targetType": {
                "description": "Category of the thing the feedback is about.",
                "enum": ["skill", "mcp-tool", "cli", "docs", "public-api", "other"],
                "type": "string"
              }
            },
            "required": ["feedback", "target", "targetType"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6b3e2f95a26cc2fb81eb2975f7afe6a86245ea630c2abc9caf3fa8b66a65f03d"
        }
      ],
      "digest": "sha256:a1f84dc6bd273253774e991e6ef1cbb18430e36134181e5229f1d14580040520"
    }
  }
}
