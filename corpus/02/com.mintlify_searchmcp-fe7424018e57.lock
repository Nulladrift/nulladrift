        },
        {
          "name": "search_mintlify",
          "title": "Search documentation",
          "description": "Search across the Mintlify knowledge base to find relevant information, code examples, API references, and guides. Use this tool when you need to answer questions about Mintlify, find specific documentation, understand how features work, or locate implementation details. The search returns contextual content with titles and direct links to the documentation pages. If you need the full content of a specific page, use the query_docs_filesystem tool to `head` or `cat` the page path (append `.mdx` to the path returned from search — e.g. a result at `/some/page` is read with `head -200 /some/page.mdx`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Filter to specific language code (e.g., 'zh', 'es'). Defaults to 'en'",
                "type": "string"
              },
              "query": {
                "description": "Search query",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search documentation"
          },
