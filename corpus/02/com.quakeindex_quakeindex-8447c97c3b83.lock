      "serverInfo": {
        "name": "quakeindex",
        "title": "QuakeIndex",
        "version": "1.0.0",
        "websiteUrl": "https://quakeindex.com/mcp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "QuakeIndex answers questions about earthquakes from USGS data: what just happened, what happened near a place, whether shaking someone felt was an earthquake, whether activity is normal for a US state or county, and the largest events on record. QuakeIndex reports what USGS has recorded. It does not predict earthquakes and does not issue warnings: for early warning use ShakeAlert (https://www.shakealert.org/) and the MyShake app (https://myshake.berkeley.edu/). Every value carries its source and its age; when data is stale the result says so. The data is USGS's: results carry the time of the data and the QuakeIndex and USGS page for each event, for citing, an `attribution` line, and a `see_live` link to the QuakeIndex page that keeps the answer current. A not_yet_reported answer from was_that_an_earthquake is not a no: small earthquakes take minutes to be catalogued.",
      "tools": [
        {
          "name": "earthquake_details",
          "title": "Earthquake details and revisions",
          "description": "Everything QuakeIndex holds about one earthquake by USGS event id (or a QuakeIndex/USGS event URL), including every revision it observed — e.g. 'magnitude revised from 4.1 to 3.9'. An automatic solution is a first estimate and says so. Data: USGS, as held by QuakeIndex. Each result includes its source, when the data was last confirmed, and links to the QuakeIndex and USGS event pages. No predictions and no warnings: results name ShakeAlert and MyShake as the sources of earthquake early warning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "USGS event id, e.g. 'ci41234567', or a QuakeIndex or USGS event page URL.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Earthquake details and revisions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:073ba83879f3e5de92052c174a352898effb53152e8506d5877d50a0d618066f"
        },
        {
          "name": "earthquakes_near",
          "title": "Earthquakes near a place",
          "description": "Earthquakes within a radius of coordinates, a US ZIP code or a US town, over the last 1-365 days, newest first, each with its distance, plus the largest in the window. Data: USGS, as held by QuakeIndex. Each result includes its source, when the data was last confirmed, and links to the QuakeIndex and USGS event pages. No predictions and no warnings: results name ShakeAlert and MyShake as the sources of earthquake early warning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "US town or city, e.g. 'Ridgecrest'. Add state.",
                "type": "string"
              },
              "days": {
                "default": 30,
                "maximum": 365,
                "minimum": 1,
                "type": "number"
              },
              "latitude": {
                "description": "Decimal degrees. Give with longitude, OR use zip, OR city.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "min_magnitude": {
                "maximum": 10,
                "minimum": -2,
                "type": "number"
              },
              "radius_km": {
                "default": 50,
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "state": {
                "description": "Two-letter code or name, with city.",
                "type": "string"
              },
              "zip": {
                "description": "US 5-digit ZIP code, e.g. '93555'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Earthquakes near a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9baf5daa7792d1e4644aaa66f4b39dc6195e53d72374cbbec7561556518f34d9"
        },
        {
          "name": "largest_on_record",
          "title": "Largest earthquakes on record",
          "description": "The largest earthquakes in QuakeIndex's copy of the USGS catalogue for a US state, county ('Kern County, CA'), town ('Ridgecrest, CA') or ZIP code, with the catalogue span it covers. Data: USGS, as held by QuakeIndex. Each result includes its source, when the data was last confirmed, and links to the QuakeIndex and USGS event pages. No predictions and no warnings: results name ShakeAlert and MyShake as the sources of earthquake early warning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "State, 'County, ST', 'Town, ST' or ZIP.",
                "type": "string"
              },
              "radius_km": {
                "default": 50,
                "description": "For a town or ZIP only.",
                "maximum": 300,
                "minimum": 5,
                "type": "number"
              },
              "state": {
                "description": "Optional state to disambiguate.",
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Largest earthquakes on record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1c93b1a7948b682ac45747a024ed6e02ec93f62aef9183e95c16ee41740a27b"
        },
        {
          "name": "latest_earthquakes",
          "title": "Latest earthquakes",
          "description": "The most recent earthquakes recorded by USGS worldwide or only in the United States, newest first, filtered by minimum magnitude and hours back (up to 7 days). Use for 'any earthquakes today?' questions. Data: USGS, as held by QuakeIndex. Each result includes its source, when the data was last confirmed, and links to the QuakeIndex and USGS event pages. No predictions and no warnings: results name ShakeAlert and MyShake as the sources of earthquake early warning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hours": {
                "default": 24,
                "description": "How far back to look.",
                "maximum": 168,
                "minimum": 1,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_magnitude": {
                "default": 2.5,
                "maximum": 10,
                "minimum": -2,
                "type": "number"
              },
              "us_only": {
                "default": false,
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest earthquakes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba4661f7a7681739a01cdace745a962af2ef9ac14cbf2bb262a218bc59489ac1"
        },
        {
          "name": "place_activity",
          "title": "Is this normal for here?",
          "description": "The QuakeIndex score for a US state or county: the last 7 days' earthquake activity ranked 0-100 against that place's own 10-year history, its label (quiet / typical / elevated / unusual) and the normal band for a week. It describes observed activity and is NOT a forecast or a risk rating. A missing score is never zero. Data: USGS, as held by QuakeIndex. Each result includes its source, when the data was last confirmed, and links to the QuakeIndex and USGS event pages. No predictions and no warnings: results name ShakeAlert and MyShake as the sources of earthquake early warning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "Optional county within state, e.g. 'Kern'.",
                "type": "string"
              },
              "place": {
                "description": "Alternative free text: 'Nevada' or 'Washoe County, NV'.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter code or name, e.g. 'CA'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is this normal for here?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9c62a31b1bdd96f1e578ae7b06f3f01b072b5a89d2d450c4135d4e32f555336"
        },
        {
          "name": "was_that_an_earthquake",
          "title": "Was that an earthquake?",
          "description": "Checks whether USGS has recorded an earthquake that someone who just felt shaking a few minutes ago could have felt: large and close enough for an estimated intensity of MMI 2+ at their location (Atkinson & Wald 2007, the equation USGS Did You Feel It? uses). Answers yes (with the event), not_yet_reported (nothing yet, but small quakes take minutes to be catalogued, so this is not a no), or no; smaller quakes recorded nearby are listed as too small to feel. The result links USGS Did You Feel It? for reporting shaking. Data: USGS, as held by QuakeIndex. Each result includes its source, when the data was last confirmed, and links to the QuakeIndex and USGS event pages. No predictions and no warnings: results name ShakeAlert and MyShake as the sources of earthquake early warning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "US town or city, e.g. 'Ridgecrest'. Add state.",
                "type": "string"
              },
              "latitude": {
                "description": "Decimal degrees. Give with longitude, OR use zip, OR city.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "minutes_ago": {
                "default": 5,
                "description": "Roughly how long ago the shaking was felt.",
                "maximum": 175,
                "minimum": 0,
                "type": "number"
              },
              "radius_km": {
                "default": 150,
                "maximum": 500,
                "minimum": 10,
                "type": "number"
              },
              "state": {
                "description": "Two-letter code or name, with city.",
                "type": "string"
              },
              "zip": {
                "description": "US 5-digit ZIP code, e.g. '93555'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Was that an earthquake?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b9bde7b6ded08c91feaf7e78b1a5a74ddf29d3e687c6e9d399dc81c33d11fe9d"
        }
      ],
