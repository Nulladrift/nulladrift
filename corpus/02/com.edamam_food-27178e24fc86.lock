        {
          "name": "analyze_food_image",
          "title": "Analyze Food Image",
          "description": "Identify food in a photograph and return a full nutritional breakdown.\n\nUses Edamam's AI Vision API (beta) to detect each dish on the plate, estimate\nits ingredients, and calculate nutrition. Every dish is analyzed independently,\nso multi-dish plates return one entry per dish. Works best with clear, well-lit\nphotos.\n\nThe image is supplied as base64-encoded bytes (the API accepts only a raw image\nupload, not a URL), most conveniently as a data URI:\n\"data:image/jpeg;base64,...\". A caller with a remote URL must download the\nimage itself and base64-encode the bytes.\n\nTo look up nutrition from a text description instead, use get_food_nutrition.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image": {
                "description": "A base64 data URI (e.g. \"data:image/jpeg;base64,...\") — or a bare\n   base64 string — of a food photograph.",
                "type": "string"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Result of analyze_food_image: one nutrition summary per detected dish.",
