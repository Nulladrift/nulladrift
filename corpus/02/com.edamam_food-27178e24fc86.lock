        {
          "name": "get_food_nutrition",
          "title": "Get Food Nutrition",
          "description": "Look up nutrition facts for one or more foods described in plain text.\n\nUse this tool for any question about calories, macros, or nutrients for a named\nfood or meal. Each query is a natural-language phrase describing one food item;\nthe API identifies the food, resolves the quantity and unit, and returns a full\nnutrient breakdown. If the user provides a food photograph rather than a text\ndescription, use analyze_food_image instead.\n\nReturns a list of dicts, one per query. Each dict has: `food` (name,\nfood_id, amount, unit, weight_g, ingredients), `macronutrients` (calories,\nprotein, carbs, fat, etc.), `micronutrients` (vitamins and minerals),\n`diet_flags`, `health_flags`, and `status`.\nReturns {\"error\": ..., \"query\": ...} for any item that cannot be identified.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "queries": {
                "description": "One natural-language phrase per food item. Supported formats:\n     plain name (\"cheddar cheese\", defaults to 100 g), quantity + unit\n     (\"1 cup rice\", \"200g chicken breast\"), or UPC/EAN barcode\n     (\"049000042566\", 8-14 digits). Keep compound food names as a\n     single entry — \"carrot cake\", \"chicken noodle soup\", and\n     \"grilled cheese sandwich\" are each one food, not multiple.\n     Only split into separate entries when the user is clearly\n     listing multiple distinct foods —\n     e.g. \"1 croissant and 1 egg\" → [\"1 croissant\", \"1 egg\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["queries"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "anyOf": [
                    {
                      "properties": {
                        "diet_flags": {
                          "description": "Edamam diet labels (e.g. 'HIGH_PROTEIN', 'LOW_CARB'); empty if none apply.",
