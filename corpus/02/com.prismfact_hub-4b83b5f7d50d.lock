            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "io.modelcontextprotocol/representativeQueries": ["чего не хватает в этом источнике", "что чаще всего спрашивают и не находят"]
          },
          "digest": "sha256:ae671f6fb0c4835066ed30a08dc4f92464ae91f74da22283fb9cb09f6e135a1d"
        }
      ],
      "digest": "sha256:748da81af0bd4047edac3425af4260a23c80b8a4d6371566e19f7639a8dfc2e6"
    }
