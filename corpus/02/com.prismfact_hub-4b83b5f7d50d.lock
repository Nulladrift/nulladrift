      "serverInfo": {
        "name": "prismfact",
        "title": "Prism Hub",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Реестровые факты о субъектах МСП Томской области. Якорь — ИНН. У каждого значения источник, дата и способ перепроверить. Состояния между вызовами нет: каждый ответ полон сам по себе.",
      "tools": [
        {
          "name": "prism_answer",
          "title": "Ответ на вопрос — как человеку",
          "description": "Единый порядок слоёв: реестр, вывеска, учреждение, карточки людей, списки города, карта, справочник контактов. Один вопрос — один ответ, тот же самый, что получает человек в боте и на сайте. Списком не отдаётся: карточки людей (что предлагают, что ищут) отвечают только на прямой вопрос, обход закрыт даже здесь — это единственный наш актив, ценность которого мы сами ещё не измерили. Объявления досок в этот инструмент не входят — право на переотдачу не оформлено.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "по умолчанию Асино",
                "type": "string"
              },
              "q": {
                "description": "вопрос словами, как человеку",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "io.modelcontextprotocol/representativeQueries": ["нужен электрик в асино", "школа номер 2", "сдам гараж"]
          },
          "digest": "sha256:6b4b5b29fb381b08ba684c4635381c9dc999c46669deaf90d047780de616348d"
        },
        {
          "name": "prism_ask",
          "title": "Факты о субъекте по ИНН",
          "description": "Всё, что известно про ИНН, с источником и датой у каждого значения. Отсутствие размечено пятью способами: found, none, unknown, not_provided, withheld — так видно, повторять ли вопрос и куда идти дальше. Принимает до ста ИНН через запятую.",
          "inputSchema": {
            "properties": {
              "inn": {
                "description": "ИНН, можно несколько через запятую",
                "type": "string"
              },
              "want": {
                "description": "необязательный список полей через запятую",
                "type": "string"
              }
            },
            "required": ["inn"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "io.modelcontextprotocol/representativeQueries": ["что известно про ИНН 700200793701", "проверить контрагента по ИНН", "есть ли у компании налоговая задолженность"]
          },
          "digest": "sha256:0146ec1b7b3d969a5573990913a86509909e42e7de61d976c2bd921abc916c98"
        },
        {
          "name": "prism_find",
          "title": "Обнаружение субъектов на территории",
          "description": "Кто есть на территории по виду деятельности, размеру, налоговому режиму, выручке, задолженности. В каждом ответе знаменатель — сколько всего субъектов на этой территории, без него доля бессмысленна. Проверку продают все, обнаружение не продаёт никто.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "1 микро, 2 малое, 3 среднее; принимаются и слова",
                "type": "string"
              },
              "changed_since": {
                "description": "дата среза, только изменившиеся",
                "type": "string"
              },
              "district": {
                "description": "муниципальный район",
                "type": "string"
              },
              "has_tax_debt": {
                "description": "true или false",
                "type": "string"
              },
              "headcount_min": {
                "type": "string"
              },
              "limit": {
                "type": "string"
              },
              "offset": {
                "type": "string"
              },
              "okved": {
                "description": "код или его начало",
                "type": "string"
              },
              "q": {
                "description": "подстрока в названии",
                "type": "string"
              },
              "regime": {
                "description": "налоговый режим",
                "type": "string"
              },
              "revenue_min": {
                "type": "string"
              },
              "settlement": {
                "description": "населённый пункт",
                "type": "string"
              },
              "sort": {
                "description": "name, okved, since, headcount, revenue, tax_debt",
                "type": "string"
              },
              "type": {
                "description": "UL или IP",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "io.modelcontextprotocol/representativeQueries": ["сколько предприятий в Асино", "кто из компаний области с налоговой задолженностью", "какие лесопилки есть в Асиновском районе"]
          },
          "digest": "sha256:fb2e8933048e1572442b8e915e398e98f7b4ddd65e5ec417f8211aa63d144433"
        },
        {
          "name": "prism_nearby",
          "title": "Что стоит вокруг точки",
          "description": "Слой карты, а не реестр: заведения с вывесками и координатами. Связь вывески с ИНН нигде не установлена и отдаётся как гипотеза с указанием, чем её подтвердить. Реестр на этот вопрос ответить не может — координат в нём нет.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "type": "string"
              },
              "lon": {
                "type": "number"
              },
              "q": {
                "type": "string"
              },
              "radius_m": {
                "description": "по умолчанию 500",
                "type": "string"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "io.modelcontextprotocol/representativeQueries": ["что находится рядом с этой точкой", "аптеки в радиусе километра"]
          },
          "digest": "sha256:76e1fe9d5831de92ad846dea03b1e1b18054edd157896cd278538f600754fc7f"
        },
        {
          "name": "prism_needs",
          "title": "Чего у нас нет, а спрашивают",
          "description": "Список дыр, нарисованный чужими вопросами: что спрашивали и на что мы не ответили. Показывается то, о чём спросили не меньше трёх разных сторон. Дыру можно закрыть, принеся факт — он проходит те же ворота записи, что и наши собственные данные.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "окно, по умолчанию 30",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
