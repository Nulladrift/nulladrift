        {
          "name": "getmattered_update_automatic_apply_settings",
          "title": "Update Auto Apply Settings",
          "description": "Turns Auto Apply on or off and sets its default mode, daily limit and lowest match. While on, applications start without asking per job. Turning it on needs the Hired Yesterday plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "daily_limit": {
                "description": "Most applications Auto Apply starts in a day, 1 to 50. The plan's own daily cap can lower it. Left out, it stays as it is.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "default_apply_mode": {
                "description": "\"auto\": applications go to the employer without asking first. \"review\": each one waits for the user's approval. Also the mode getmattered_apply uses when its mode is omitted. Left out, it stays as it is.",
                "enum": ["auto", "review"],
                "type": "string"
              },
              "enabled": {
                "description": "true turns Auto Apply on, false turns it off. Left out, it stays as it is.",
                "type": "boolean"
              },
              "match_level": {
                "description": "Lowest match Auto Apply applies to: \"excellent\" (90+), \"strong\" (80+), \"good\" (70+) or \"stretch\" (60+). Left out, it stays as it is.",
                "enum": ["excellent", "strong", "good", "stretch"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changed": {
                "description": "The settings this call asked to change.",
                "items": {
                  "enum": ["enabled", "defaultApplyMode", "dailyLimit", "matchLevel"],
                  "type": "string"
                },
                "type": "array"
              },
              "notConfirmed": {
                "description": "True when the user declined the confirmation and nothing changed.",
                "type": "boolean"
              },
              "settings": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "access": {
                        "description": "included or grace: the plan may run Auto Apply. Otherwise turning it on needs the top plan.",
                        "enum": ["included", "grace", "upgrade_required", "plan_required"],
                        "type": "string"
                      },
                      "dailyLimit": {
                        "description": "Most applications Auto Apply starts in a day.",
                        "type": "number"
                      },
                      "defaultApplyMode": {
                        "description": "auto: applications go to the employer without asking. review: each one waits for approval.",
                        "enum": ["auto", "review"],
                        "type": "string"
                      },
                      "enabled": {
                        "description": "Auto Apply is on: GetMattered starts applications for the user every day, up to dailyLimit.",
                        "type": "boolean"
                      },
                      "graceUntil": {
                        "description": "When access is grace: the moment Auto Apply stops on this plan.",
                        "type": ["string", "null"]
                      },
                      "matchLevel": {
                        "description": "Lowest match Auto Apply applies to: excellent 90+, strong 80+, good 70+, stretch 60+.",
                        "enum": ["excellent", "strong", "good", "stretch"],
                        "type": "string"
                      },
                      "planDailyMax": {
                        "description": "The plan's own daily cap. dailyLimit never exceeds it.",
                        "type": "number"
                      },
                      "sentLastDay": {
                        "description": "Applications Auto Apply started in the last 24 hours.",
                        "type": "number"
                      }
                    },
                    "required": ["access", "dailyLimit", "defaultApplyMode", "enabled", "graceUntil", "matchLevel", "planDailyMax", "sentLastDay"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The settings after the change. Null when the user declined the confirmation."
              },
              "setupStep": {
                "description": "Present while account setup is open: the first setup step.",
                "type": "string"
              }
            },
            "required": ["changed", "notConfirmed", "settings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Update Auto Apply Settings"
          },
          "behavior": {
