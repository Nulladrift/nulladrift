          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "The operation that ran, one of list, save, update or delete.",
                "enum": ["list", "save", "update", "delete"],
                "type": "string"
              },
              "deletedId": {
                "description": "From getmattered_delete_saved_search: the search that was deleted.",
                "type": ["number", "null"]
              },
              "saved": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "alertsEnabled": {
                        "description": "True when new matches for this search are emailed to the user.",
                        "type": "boolean"
                      },
                      "createdAt": {
                        "type": "string"
                      },
                      "lastAlertedAt": {
                        "type": ["string", "null"]
                      },
                      "locations": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "name": {
                        "type": "string"
                      },
                      "savedSearchId": {
                        "description": "The saved_search_id getmattered_update_saved_search and getmattered_delete_saved_search take.",
                        "type": "number"
                      },
                      "targetRoles": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["alertsEnabled", "createdAt", "lastAlertedAt", "locations", "name", "savedSearchId", "targetRoles"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "From getmattered_create_saved_search or getmattered_update_saved_search: the search after the change."
              },
              "searches": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "alertsEnabled": {
                          "description": "True when new matches for this search are emailed to the user.",
                          "type": "boolean"
                        },
                        "createdAt": {
                          "type": "string"
                        },
                        "lastAlertedAt": {
                          "type": ["string", "null"]
                        },
                        "locations": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "name": {
                          "type": "string"
                        },
                        "savedSearchId": {
                          "description": "The saved_search_id getmattered_update_saved_search and getmattered_delete_saved_search take.",
                          "type": "number"
                        },
                        "targetRoles": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["alertsEnabled", "createdAt", "lastAlertedAt", "locations", "name", "savedSearchId", "targetRoles"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "From getmattered_list_saved_searches: every saved search."
              },
              "setupStep": {
                "description": "Present while account setup is open: the first setup step.",
                "type": "string"
              }
            },
            "required": ["action", "deletedId", "saved", "searches"],
            "type": "object"
          },
