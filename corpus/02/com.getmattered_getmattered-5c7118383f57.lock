                          {
                            "type": "null"
                          }
                        ],
                        "description": "Drafted replies for the user to review and edit. Not sent automatically. Null when not requested or unavailable."
                      },
                      "subject": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["accountPlumbing", "applicationId", "company", "jobTitle", "messageId", "messages", "replySuggestions", "subject"],
                    "type": "object"
