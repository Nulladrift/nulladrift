        {
          "name": "getmattered_get_matches",
          "title": "Get Job Matches",
          "description": "Lists the user's matched jobs, best fit first and mixed across companies, so scores are not in strict order. Also reads full postings by job_match_ids or job_url. On a new account, nextStep names the first step. Changes nothing and spends nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "after_job_match_id": {
                "description": "Limits the list to matches newer than this job_match_id, such as the newestJobMatchId of an earlier answer.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "job_match_ids": {
                "description": "Matches to read in full: up to 10 job_match_ids (e.g. [48213]). Returns the full posting, skills, benefits and work arrangement.",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 9007199254740991,
                  "type": "integer"
                },
                "type": "array"
              },
              "job_url": {
                "description": "Link to any job posting, read without saving it, one link per call. The answer also says whether GetMattered can apply there. getmattered_apply reads a posting itself, and every read counts toward the same limit.",
                "format": "uri",
                "type": "string"
              },
              "limit": {
                "description": "Matches per page, 1 to 50 (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Location to search in (e.g. \"San Francisco, CA\", \"New York\", \"Remote\")",
                "maxLength": 200,
                "type": "string"
              },
              "page": {
                "description": "Page number, starting at 1 (e.g. 2 for the next page)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "query": {
                "description": "Narrows the list to titles containing this text (e.g. \"Product Designer\").",
                "maxLength": 200,
                "type": "string"
              },
              "remote_only": {
                "description": "If true, the list holds only remote-friendly positions",
                "type": "boolean"
              },
              "saved_only": {
                "description": "If true, the list holds only the matches the user saved",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "askUserFor": {
                "anyOf": [
                  {
                    "enum": ["resume", "target_roles"],
                    "type": "string"
                  },
                  {
