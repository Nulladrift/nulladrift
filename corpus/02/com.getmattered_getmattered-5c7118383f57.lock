              },
              "name": {
                "description": "The new name of the search, up to 120 characters.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "saved_search_id": {
                "description": "The saved search, from getmattered_list_saved_searches.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["saved_search_id"],
