        {
          "name": "getmattered_update_saved_search",
          "title": "Update Saved Search",
          "description": "Renames a saved search or switches its alerts. Its roles and locations stay.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
