                      }
                    },
                    "required": ["applicationId", "autoRetryStopped", "confirmationScreenshotAttached", "contentLocked", "coverLetter", "documentsUrl", "errorCode", "errorMessage", "jobListingId", "nextAutoRetryAt", "queueEtaMinutes", "queuePosition", "screeningAnswers", "statusCode", "statusLabel", "tailoredResume"],
                    "type": "object"
