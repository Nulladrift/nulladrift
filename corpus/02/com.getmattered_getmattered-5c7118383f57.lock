        {
          "name": "getmattered_get_applications",
          "title": "Get Applications",
          "description": "Lists the user's applications and where each stands, or reads one by application_id. status \"waiting_for_review\" is the review queue. employerConfirmed is the only proof an application landed. Changes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "application_id": {
                "description": "One application to read, by its id (e.g. 1550). Left out, the tool lists applications.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "page": {
                "description": "Page number, starting at 1 (e.g. 2 for the next page)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "status": {
                "description": "Filters the list: waiting_for_review (the review queue), queued_to_apply, submitted, verified, not_landed or taken_down. Left out, all are listed.",
                "enum": ["waiting_for_review", "queued_to_apply", "verified", "submitted", "not_landed", "taken_down"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applications": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "applicationId": {
                      "description": "The id getmattered_approve_applications, getmattered_reject_applications and getmattered_get_applications take.",
                      "type": "number"
                    },
                    "appliedAt": {
                      "type": ["string", "null"]
                    },
                    "applyMode": {
                      "type": ["string", "null"]
                    },
                    "company": {
                      "type": ["string", "null"]
                    },
                    "confirmationProofs": {
                      "description": "What proves employerConfirmed: \"receipt\" and/or \"screenshot\".",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "createdAt": {
                      "type": ["string", "null"]
                    },
                    "employerConfirmed": {
                      "description": "True ONLY when the employer sent a receipt or showed its confirmation page.",
                      "type": "boolean"
                    },
                    "jobMatchId": {
                      "type": ["number", "null"]
                    },
                    "jobTitle": {
                      "type": ["string", "null"]
                    },
                    "jobUrl": {
                      "type": "string"
                    },
                    "status": {
                      "description": "Our own record of the application, which is not proof the employer received it. employerConfirmed holds that proof.",
                      "type": "string"
                    },
                    "trackingUrl": {
                      "type": "string"
                    },
                    "waitingForReview": {
                      "description": "True when the application waits for the user's approval.",
                      "type": "boolean"
                    }
                  },
                  "required": ["applicationId", "appliedAt", "applyMode", "company", "confirmationProofs", "createdAt", "employerConfirmed", "jobMatchId", "jobTitle", "jobUrl", "status", "trackingUrl", "waitingForReview"],
                  "type": "object"
                },
                "type": "array"
              },
              "detail": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "applicationId": {
                        "type": "number"
                      },
