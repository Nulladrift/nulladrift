        {
          "name": "getmattered_update_job_preferences",
          "title": "Update Job Preferences",
          "description": "Changes what GetMattered looks for and searches again. Lists replace what is saved.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "application_answers": {
                "description": "Answers employer forms ask for, saved to the user's application profile: phone, city, state, zip_code, country, linkedin_url, work_authorization, willing_to_relocate, available_start_date, notice_period. Each holds a value the user stated, never a guess.",
                "properties": {
                  "available_start_date": {
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "linkedin_url": {
                    "type": "string"
                  },
                  "notice_period": {
                    "enum": ["immediately", "two_weeks", "one_month", "two_months", "three_months", "flexible"],
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "state": {
                    "type": "string"
                  },
                  "willing_to_relocate": {
                    "type": "boolean"
                  },
                  "work_authorization": {
                    "enum": ["us_citizen", "permanent_resident", "visa_holder", "require_sponsorship", "other"],
                    "type": "string"
                  },
                  "zip_code": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "description": {
                "description": "What the user wants, in their own words (e.g. \"remote only, 120k+, senior, no crypto\"). Fields passed explicitly win over it. Uses AI credits.",
                "maxLength": 2000,
                "type": "string"
              },
              "exclude_industries": {
                "description": "Industries to never match (e.g. [\"Crypto\"]). REPLACES the saved list.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "experience_levels": {
                "description": "Seniority to match: intern, entry, junior, mid, senior, lead, executive. REPLACES the saved list.",
                "items": {
                  "enum": ["intern", "entry", "junior", "mid", "senior", "lead", "executive"],
                  "type": "string"
                },
                "type": "array"
              },
              "include_remote": {
                "description": "Whether remote jobs in the user's region are included alongside their locations.",
                "type": "boolean"
              },
              "job_types": {
                "description": "Job types to match: full_time, part_time, contract, internship, freelance, temporary. REPLACES the saved list.",
                "items": {
                  "enum": ["full_time", "part_time", "contract", "internship", "freelance", "temporary"],
                  "type": "string"
                },
                "type": "array"
              },
              "locations": {
                "description": "Full list of locations to search in. REPLACES the saved list.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "needs_visa_sponsorship": {
                "description": "True when the user needs visa sponsorship to take the job.",
                "type": "boolean"
              },
              "paused": {
                "description": "True pauses new matches for the user; false resumes them. It never changes auto-apply.",
                "type": "boolean"
              },
              "remote_only": {
                "description": "Deprecated name of include_remote, with the same meaning.",
                "type": "boolean"
              },
              "salary_currency": {
                "description": "Currency of the salary band (default usd).",
                "enum": ["usd", "eur", "gbp", "cad", "aud", "inr"],
                "type": "string"
              },
              "salary_max": {
                "description": "Highest yearly salary to target, in salary_currency.",
                "minimum": 0,
                "type": "number"
              },
              "salary_min": {
                "description": "Lowest yearly salary the user accepts, in salary_currency (e.g. 120000).",
                "minimum": 0,
                "type": "number"
              },
              "target_roles": {
                "description": "Full list of job titles to hunt for. REPLACES the saved list.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "work_styles": {
                "description": "Work styles to match: onsite, hybrid, remote. REPLACES the saved list.",
                "items": {
                  "enum": ["onsite", "hybrid", "remote"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicationAnswersSaved": {
                "description": "The application_answers fields written to the application profile.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "describedSummary": {
                "description": "How GetMattered understood `description`, when one was given.",
                "type": ["string", "null"]
              },
              "excludeIndustries": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "experienceLevels": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "includeRemote": {
                "type": ["boolean", "null"]
              },
              "jobTypes": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "locations": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "onboardingCompleted": {
                "description": "True when this call finished the account setup, so GetMattered starts searching for these roles.",
                "type": "boolean"
              },
              "paused": {
                "type": ["boolean", "null"]
              },
              "remoteWorldwide": {
                "type": "boolean"
              },
              "salaryCurrency": {
                "type": ["string", "null"]
              },
              "salaryMax": {
                "type": ["number", "null"]
              },
              "salaryMin": {
                "type": ["number", "null"]
              },
              "targetRoles": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "visaSponsorship": {
                "type": ["string", "null"]
              },
              "workStyles": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["applicationAnswersSaved", "describedSummary", "excludeIndustries", "experienceLevels", "includeRemote", "jobTypes", "locations", "onboardingCompleted", "paused", "remoteWorldwide", "salaryCurrency", "salaryMax", "salaryMin", "targetRoles", "visaSponsorship", "workStyles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
