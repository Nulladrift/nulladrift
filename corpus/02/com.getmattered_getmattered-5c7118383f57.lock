        {
          "name": "getmattered_send_follow_up",
          "title": "Send a Follow-up Email",
          "description": "Sends a follow-up from the user's connected Gmail or Outlook. It cannot be undone.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "application_id": {
                "description": "The application, from getmattered_list_due_follow_ups or getmattered_get_applications.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "body": {
                "description": "The message text, 20 to 4,000 characters: the exact text the user approved.",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "confirm_token": {
                "description": "The token from a previous call that returned confirmation_required, valid once the user said yes to that exact email, with the same arguments. It works once, for 10 minutes.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "subject": {
                "description": "The subject line the user approved.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "The recipient's email address, exactly as the user gave it.",
                "format": "email",
                "maxLength": 320,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "required": ["application_id", "body", "subject", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "The operation that ran, one of list, history, draft, send or record_sent.",
                "enum": ["list", "history", "draft", "send", "record_sent"],
                "type": "string"
              },
              "confirmToken": {
                "description": "From getmattered_send_follow_up when nothing was sent yet: the confirm_token value that sends this email, with the same arguments, after the user's yes. Works once, for 10 minutes.",
                "type": ["string", "null"]
              },
              "draft": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "applicationId": {
                        "type": "number"
                      },
                      "attemptNumber": {
                        "type": "number"
                      },
                      "body": {
                        "type": "string"
                      },
                      "channel": {
                        "description": "email, linkedin or other: where the message should go.",
                        "type": "string"
                      },
                      "recipientLinkedinUrl": {
                        "type": ["string", "null"]
                      },
                      "subject": {
                        "type": "string"
                      }
                    },
                    "required": ["applicationId", "attemptNumber", "body", "channel", "recipientLinkedinUrl", "subject"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "From getmattered_draft_follow_up: the drafted message. Nothing was sent."
              },
              "followUps": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "applicationId": {
                          "description": "The application_id getmattered_draft_follow_up, getmattered_send_follow_up and getmattered_record_follow_up take.",
                          "type": "number"
                        },
                        "company": {
                          "type": ["string", "null"]
                        },
                        "followUpCount": {
                          "type": "number"
                        },
                        "jobTitle": {
                          "type": ["string", "null"]
                        },
                        "lastFollowUpAt": {
                          "type": ["string", "null"]
                        },
                        "nextFollowUpDueAt": {
                          "type": ["string", "null"]
                        },
                        "urgency": {
                          "type": "string"
                        }
                      },
                      "required": ["applicationId", "company", "followUpCount", "jobTitle", "lastFollowUpAt", "nextFollowUpDueAt", "urgency"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "From getmattered_list_due_follow_ups: applications whose follow-up is due, most urgent first."
              },
              "history": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "applicationId": {
                          "type": "number"
                        },
                        "attemptNumber": {
                          "type": "number"
                        },
                        "channel": {
                          "type": "string"
                        },
                        "company": {
                          "type": ["string", "null"]
                        },
                        "jobTitle": {
                          "type": ["string", "null"]
                        },
                        "recipient": {
                          "type": ["string", "null"]
                        },
                        "sentAt": {
                          "type": "string"
                        },
                        "subject": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["applicationId", "attemptNumber", "channel", "company", "jobTitle", "recipient", "sentAt", "subject"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "From getmattered_list_sent_follow_ups: follow-ups already sent, newest first."
              },
              "nextCursor": {
                "description": "From getmattered_list_sent_follow_ups: the cursor value for the next page. Null on the last page.",
                "type": ["number", "null"]
              },
              "notConfirmed": {
                "description": "True when the user declined the confirmation and nothing was sent.",
                "type": "boolean"
              },
              "recorded": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "applicationId": {
                        "type": "number"
                      },
                      "followUpCount": {
                        "type": "number"
                      },
                      "nextFollowUpDueAt": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["applicationId", "followUpCount", "nextFollowUpDueAt"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "From getmattered_send_follow_up or getmattered_record_follow_up: the follow-up count after it was recorded."
              },
              "setupStep": {
                "description": "Present while account setup is open: the first setup step.",
                "type": "string"
              }
            },
            "required": ["action", "confirmToken", "draft", "followUps", "history", "nextCursor", "notConfirmed", "recorded"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
