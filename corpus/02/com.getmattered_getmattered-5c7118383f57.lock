                        "type": ["boolean", "null"]
                      },
                      "confirmationScreenshotAttached": {
                        "description": "True when the employer's verified confirmation page is attached as an image.",
                        "type": "boolean"
                      },
                      "contentLocked": {
                        "description": "True when the resume and cover letter are a preview and the full text needs a plan.",
                        "type": "boolean"
                      },
                      "coverLetter": {
                        "type": ["string", "null"]
                      },
                      "documentsUrl": {
                        "description": "Dashboard page where the user downloads the tailored resume and cover letter as PDF files. Null when neither document is ready, or when the full text needs a plan.",
                        "type": ["string", "null"]
                      },
                      "errorCode": {
                        "type": ["string", "null"]
                      },
                      "errorMessage": {
                        "description": "Why it stopped, in plain words. Filled whenever the row records a failure.",
                        "type": ["string", "null"]
                      },
                      "jobListingId": {
                        "type": ["number", "null"]
                      },
                      "nextAutoRetryAt": {
                        "type": ["string", "null"]
                      },
                      "queueEtaMinutes": {
                        "type": ["number", "null"]
                      },
                      "queuePosition": {
                        "type": ["number", "null"]
                      },
                      "screeningAnswers": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "answer": {
                              "type": "string"
                            },
                            "question": {
                              "type": "string"
                            }
