          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Analyze Job Description"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0f2e97e94fda9b75788d4a1520ba3bca28d559d91dc82c5775a43a8455f81013"
        },
        {
          "name": "getmattered_apply",
          "title": "Apply to Job",
          "description": "Applies to one job by job_match_id or job_url, on the employer's own hiring system. mode \"auto\" submits, \"review\" holds for approval, and no mode follows the account setting. A sent application cannot be withdrawn. When GetMattered cannot apply, nothing is sent and the answer says why.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_match_id": {
                "description": "The job_match_id of a match from getmattered_get_matches (e.g. 48213). Either this or job_url.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "job_url": {
                "description": "Link to any job posting to apply to. Either this or job_match_id, which identifies a job from getmattered_get_matches.",
                "format": "uri",
                "type": "string"
              },
              "mode": {
                "description": "\"auto\" submits with no review step. \"review\" holds the prepared application for the user's approval. Left out, the user's account setting decides. Applies to this application only.",
                "enum": ["auto", "review"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alreadyExisted": {
                "description": "True when this job already had an application. The answer holds that application, and no second one starts.",
                "type": "boolean"
              },
              "applicationId": {
                "description": "The application to follow with getmattered_get_applications. Null only when nothing was started.",
                "type": ["number", "null"]
              },
              "company": {
                "type": ["string", "null"]
              },
              "employerConfirmed": {
                "description": "True ONLY when the employer sent a receipt or showed its confirmation page. False right after an apply.",
                "type": "boolean"
              },
              "host": {
                "description": "The host of the job_url, when one was given.",
                "type": ["string", "null"]
              },
              "jobMatchId": {
                "type": ["number", "null"]
              },
              "jobTitle": {
                "type": ["string", "null"]
              },
              "jobUrl": {
                "type": ["string", "null"]
              },
              "notice": {
                "description": "Present when the confirmation form got no answer: the application is held for approval and nothing was sent.",
                "type": "string"
              },
              "outcome": {
                "description": "started: a new application; already_in_progress: this job already had one (alreadyExisted); not_confirmed: the user declined, nothing was sent; not_applied: nothing was sent, see reason and userAction.",
                "enum": ["started", "already_in_progress", "not_confirmed", "not_applied"],
                "type": "string"
              },
              "preparationStatus": {
                "type": ["string", "null"]
              },
              "preparedUnderFreeWatch": {
                "type": "boolean"
              },
              "reason": {
                "anyOf": [
                  {
                    "enum": ["unsupported_host", "posting_not_found", "import_failed", "already_applied"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null when a new application started. unsupported_host: GetMattered does not submit on that hiring system, and nothing was saved. posting_not_found: the employer has no posting at that link. import_failed: the posting could not be read or saved. already_applied: this job already has an application."
              },
              "reasonDetail": {
                "description": "Why the posting could not be read, in words ready for the user. Present with import_failed.",
                "type": "string"
              },
              "recordedMode": {
                "type": ["string", "null"]
              },
              "requestedMode": {
                "anyOf": [
                  {
                    "enum": ["auto_approve", "copilot", "review", "auto"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "setupStep": {
                "description": "Present while account setup is open: the first setup step.",
                "type": "string"
              },
              "status": {
                "description": "Our own record, which is not proof the employer received it.",
                "type": ["string", "null"]
              },
              "trackingUrl": {
                "type": ["string", "null"]
              },
              "userAction": {
                "description": "What the user can do next, in words ready for the user. Null when a new application started.",
                "type": ["string", "null"]
              }
            },
            "required": ["alreadyExisted", "applicationId", "company", "employerConfirmed", "host", "jobMatchId", "jobTitle", "jobUrl", "outcome", "preparationStatus", "preparedUnderFreeWatch", "reason", "recordedMode", "requestedMode", "status", "trackingUrl", "userAction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply to Job"
          },
          "behavior": {
            "destructive": true,
