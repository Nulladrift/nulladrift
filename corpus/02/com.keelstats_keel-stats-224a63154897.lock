        {
          "name": "line_shop",
          "title": "Prop Line Shopper: Every Book Side by Side (Pro)",
          "description": "Use this when the user asks where a player prop's line or price differs between sportsbooks today, which book has the best over or under price, or which props the books disagree on. Returns one stat's props of the day (NBA) or the week ahead (NFL): per player every book's main line with its over and under prices, the best price on each side, the lowest and highest line and whether the books split on it, with the books on the board in `vendors`. Requires Keel Stats Pro; the answer says so when the account has none. A research table: no book is recommended. Not for a player's history against the line: use line_history.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional NBA game day (YYYY-MM-DD). Default: the next day with props.",
                "type": "string"
              },
              "game_id": {
                "description": "Optional numeric game ID: that game's props only.",
                "type": "integer"
              },
              "league": {
                "description": "League (\"nba\" or \"nfl\").",
                "enum": ["nba", "nfl"],
                "type": "string"
              },
              "limit": {
                "description": "Rows to return (default 20, at most 30).",
                "type": "integer"
              },
              "player_id": {
                "description": "Optional numeric player ID: his row only.",
                "type": "integer"
              },
              "split_only": {
                "description": "Optional: only the props where the books' lines differ.",
                "type": "boolean"
              },
              "stat": {
                "description": "Optional stat code (NBA: \"pts\", \"reb\", \"ast\", \"tpm\", \"pra\"…; NFL: \"passing_yards\", \"receiving_yards\"…). Default: the board's first.",
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "annotations": {
