      "instructions": "Keel Stats is an advanced NBA and NFL analytics engine (Keel Impact ratings, RAPM, box priors, EPA per play, on/off & lineup splits, defense vs position, head-to-head history, pre-game projections, injury consequences, and player props research). Resolve names to ids with `search` when you have none; game ids come from `tonight_slate` or `find_game`. Each answer carries a `url` on keelstats.com: cite it. Without an account a call answers this season and last. An answer the caller's plan cut carries `account`: `held` names the keys left out, `next` the plan that adds them, `message` says it in one line, with `sign_in_url` or `pro_url` to read more; a whole answer has no `account`. Keel Stats is a research tool: it takes no bets and gives no picks.",
      "tools": [
        {
          "name": "correlations",
          "title": "Prop Correlations: What Moves Together",
          "description": "Use this when the user asks which players' stat lines tend to go over or under together in a game, or who a player's outcomes move with (teammates and opponents). Returns, for a game_id, its typical role pairs (`typical`: the phi and lifts of the players' roles, pooled over earlier seasons) and the game-script splits (`script`: the roles' over rates on tonight's side of the spread and total); for a player_id, his partners in his next game (`partners`). Counted over the games both played, before the game asked. With Keel Stats Pro also each pair's own sample (joint counts, lift, phi shrunk to its role pair) and the pairs ranked on their samples (`pairs`); `account.held` says when they were left out. A pair's past season does not predict its next well. Not for a player's own lines: use props_research.",
          "inputSchema": {
            "properties": {
              "game_id": {
                "description": "Numeric game ID (from tonight_slate or find_game): the game's pairs.",
                "type": "integer"
              },
              "league": {
                "description": "League (\"nba\" or \"nfl\").",
                "enum": ["nba", "nfl"],
                "type": "string"
              },
              "player_id": {
                "description": "Numeric player ID (from search): his partners. Ignored with a game_id.",
                "type": "integer"
              },
              "stat": {
                "description": "Optional, with a player_id: his stat to pair (NBA: \"pts\", \"reb\", \"ast\", \"tpm\"…; NFL: \"receiving_yards\", \"rushing_yards\"…).",
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prop Correlations: What Moves Together"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
