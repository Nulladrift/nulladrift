        {
          "name": "prop_screener",
          "title": "Player Props Screener (Pro)",
          "description": "Use this when the user wants the day's player props filtered or ranked across games and stats in one call: who cleared today's line most often over his last 5 or 10 games or the season, whose last-ten median sits furthest from it, where the model's chance differs most from the market's, or the most widely offered lines. Returns the matching rows (player, team, opponent, stat, consensus line and book count, hit rates `l5`, `l10`, NBA `l20` and `season` as shares of his games, `l10_median` and `median_diff`, `model_over`, `market_over` and `edge`), sorted by `sort`, with how many matched; players ruled out are left out. With `side` \"under\" every rate, gap and edge reads for the under. Requires Keel Stats Pro; the answer says so when the account has none. Not for one player's full props: use props_research.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional NBA game day (YYYY-MM-DD). Default: today, or the next day with props. The NFL reads the week ahead.",
                "type": "string"
              },
              "game_id": {
                "description": "Optional numeric game ID: one game's props only.",
                "type": "integer"
              },
              "league": {
                "description": "League (\"nba\" or \"nfl\").",
                "enum": ["nba", "nfl"],
                "type": "string"
              },
              "limit": {
                "description": "Rows to return (default 25, at most 50).",
                "type": "integer"
              },
              "min_books": {
                "description": "Optional: books offering the line, at least this many.",
                "type": "integer"
              },
              "min_edge": {
                "description": "Optional: the model's chance minus the market's on the side asked, at least this (e.g. 0.05). Rows without a model reading drop out.",
                "type": "number"
              },
              "min_games": {
                "description": "Optional: games behind his rates, at least this many (default 3).",
                "type": "integer"
              },
              "min_l10": {
                "description": "Optional: keep the rows whose last-10 hit rate on the side asked is at least this share (0–1, e.g. 0.7).",
                "type": "number"
              },
              "min_l5": {
                "description": "Optional: keep the rows whose last-5 hit rate on the side asked is at least this share (0–1, e.g. 0.7).",
                "type": "number"
              },
              "min_median_diff": {
                "description": "Optional: his last-ten median minus the line on the side asked, at least this many units.",
                "type": "number"
              },
              "min_season": {
                "description": "Optional: keep the rows whose season hit rate on the side asked is at least this share (0–1, e.g. 0.7).",
                "type": "number"
              },
              "side": {
                "description": "Which side the rates, gaps and edges read for (default \"over\").",
                "enum": ["over", "under"],
                "type": "string"
              },
              "sort": {
                "description": "Order, highest first (default \"l10\").",
                "enum": ["l10", "l5", "season", "edge", "median_diff", "books"],
                "type": "string"
              },
              "stat": {
                "description": "Optional stat code or comma-separated codes (NBA: \"pts\", \"reb\", \"ast\", \"tpm\", \"pra\", \"pr\", \"pa\", \"ra\", \"stocks\"; NFL: \"passing_yards\", \"rushing_yards\", \"receiving_yards\", \"receptions\"…). Default: every stat.",
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Player Props Screener (Pro)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
