        {
          "name": "props_research",
          "title": "Player Props Research, Model & Cheat Sheet",
          "description": "Use this when the user asks about a player's prop lines, how often he clears a line, or today's prop board. Returns, for a player_id, one compact row per stat with a line for his next game: the consensus line and book count, his last five games against it (`l5`, values newest first) and his season average; signed in, the last ten (`l10`, newest first) and his record against the closing line; with Keel Stats Pro also L20 and season hit rates, the opening line and move, the model's probability against the market's, the best price at the consensus line (`best_over`/`best_under` name their line; a better line at another book follows as `other_line`) and the matchup, and with `detail` the book-by-book odds, closing lines, game log, history and alternate ladders. Without a player_id, today's prop board: `recent` is the last five values newest first, `status` the injury report's (questionable, doubtful…), `minutes_l5` and `fga_l5`/`tpa_l5` the last five games' minutes and attempts; players ruled out are listed in `ruled_out`, not in the rows (Pro: model edge, the daily cheat sheet and the `consistent` filter). The answer's `account.held` names what the caller's plan left out. Not for picks: it is research only and never gives a pick.",
          "inputSchema": {
            "properties": {
              "consistent": {
                "description": "Optional, the board only (Keel Stats Pro): true keeps the players whose last 5 and last 10 games both went one way against today's line (70%+ over, or 70%+ under), read over the whole board before it is cut to its rows.",
                "type": "boolean"
              },
              "date": {
                "description": "Optional date (YYYY-MM-DD) for the NBA daily prop board.",
                "type": "string"
              },
              "detail": {
                "description": "With a player_id (Keel Stats Pro): \"compact\" (default), \"full\" (every section, the long answer), or a comma-separated list of sections: \"books\" (book-by-book odds and history), \"ladders\" (alternate lines graded), \"closes\" (closing lines per game), \"games\" (the game log with closes), \"history\" (record against the close by season).",
                "type": "string"
              },
              "game_id": {
                "description": "Optional numeric game ID to filter the daily prop board to a single game.",
                "type": "integer"
              },
              "league": {
                "description": "League (\"nba\" or \"nfl\").",
                "enum": ["nba", "nfl"],
                "type": "string"
              },
              "player_id": {
                "description": "Optional numeric player ID to inspect his lines for the next game. Omit for the daily prop board.",
                "type": "integer"
              },
              "stat": {
                "description": "Optional stat code: narrows a player's rows and sections, or picks the board's stat (e.g. NBA: \"pts\", \"reb\", \"ast\", \"tpm\", \"pra\"; NFL: \"passing_yards\", \"rushing_yards\", \"receiving_yards\", \"receptions\").",
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
