        {
          "name": "find_game",
          "title": "Find a Team’s Game",
          "description": "Use this when the user asks about one team's game on a date, its next or last game, or a specific meeting ('Lakers next game', 'Cowboys vs Eagles on November 23') and you need its game_id. Returns the team's game on that date, or its last three finished and next three games, with game_id, start time, state, week (NFL), each side's team (id and abbreviation) and score, and the pair's matchup page; each game's page is `game_url` with its id in place of {id}. Not for the whole slate (tonight_slate) or the history of a pair (head_to_head).",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional US Eastern game day, YYYY-MM-DD (e.g. \"2026-11-23\"). Omit for the last three and next three games.",
                "type": "string"
              },
              "league": {
                "description": "League (\"nba\" or \"nfl\").",
                "enum": ["nba", "nfl"],
                "type": "string"
              },
              "opponent_id": {
                "description": "Optional numeric team ID of the opponent, from search: only the games between the two.",
                "type": "integer"
              },
              "team_id": {
                "description": "Numeric team ID from search.",
                "type": "integer"
              }
            },
            "required": ["league", "team_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a Team’s Game"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:e609e11bd222d4b27332ba8835a565692621f210a3c246c4193763c49bedf608"
        },
        {
          "name": "game_projection",
          "title": "Game Projection & Matchup Breakdown",
          "description": "Use this when the user asks who is favoured in one game, by how much, or how the two sides compare for it. Returns the pre-game win probability (NBA: our projection, blended with the market while the model learns; `prediction.blended` says when) and projected margin, the consensus spread and total, the teams compared, leaders, recent form and who is out; signed in, also the market's vig-free chance, the model against it and the line, and the head-to-head; with Keel Stats Pro the absence costs, position matchups, records against the close and key players, and with `detail` \"full\" the model's factor weights. The answer's `account.held` names what the caller's plan left out. Needs a game_id from tonight_slate or find_game. Not for picks or betting advice: Keel Stats gives neither.",
          "inputSchema": {
            "properties": {
              "detail": {
                "description": "\"compact\" (default) or \"full\" (Keel Stats Pro): adds the model's factor weights and strengths.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "game_id": {
                "description": "Numeric game ID (from tonight_slate, find_game or team_profile).",
                "type": "integer"
              },
              "include_breakdown": {
                "description": "Older form of detail \"full\": true adds the model factor weights (requires Keel Stats Pro).",
                "type": "boolean"
              },
              "league": {
                "description": "League (\"nba\" or \"nfl\").",
                "enum": ["nba", "nfl"],
                "type": "string"
              }
            },
            "required": ["game_id", "league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Game Projection & Matchup Breakdown"
          },
          "behavior": {
