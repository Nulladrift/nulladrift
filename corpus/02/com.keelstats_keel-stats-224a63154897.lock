            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fb6f36ffaa3d925717d60101d4e4901d0a447454449f350d2cca86d31e9faf43"
        },
        {
          "name": "defense_vs_position",
          "title": "Defense vs Position & Pace",
          "description": "Use this when the user asks which teams allow the most or fewest to a position ('best matchups for centers', 'defenses vs TE'). Returns what each NBA or NFL team allows per game to a position group (NBA: G, F, C, with pace rank; NFL: QB, RB, WR, TE), each number as [value, league rank] (1 = allows the most). Without `position` the NBA answer lists each group's ten softest teams (`data_more` counts the rest) and the NFL's the softest half: pass `position` for every team, as for the fewest allowed. Window 'recent' (last 10 games) needs Pro. Not for one player's matchup (player_profile's next game).",
          "inputSchema": {
            "properties": {
              "league": {
                "description": "League (\"nba\" or \"nfl\").",
                "enum": ["nba", "nfl"],
                "type": "string"
              },
              "player_id": {
                "description": "Optional numeric player ID: adds `player_matchup`, his next game's opponent and, per stat, his percentile in his position group beside what that defense allows the group (the first stat for every caller, every stat with Pro).",
                "type": "integer"
              },
              "position": {
                "description": "Optional position group filter (NBA: \"G\", \"F\", \"C\"; NFL: \"QB\", \"RB\", \"WR\", \"TE\").",
                "type": "string"
              },
              "season": {
                "description": "Optional season year. Defaults to the current season.",
                "type": "integer"
              },
              "window": {
                "default": "season",
                "description": "Sample window: \"season\" (free) or \"recent\" (last 10 games, requires Pro).",
                "enum": ["season", "recent"],
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Defense vs Position & Pace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
