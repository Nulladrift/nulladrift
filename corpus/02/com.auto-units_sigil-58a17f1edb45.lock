{
  "lockfileVersion": 2,
  "subjects": {
    "com.auto-units/sigil": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sigilbrandstudio.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Sigil",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Sigil: Brand reviews from a public website and an optional product document.\n\n- Brand review: Sigil's review of a company's current brand from its website and, optionally, one document (a pitch deck, memo or product brief). Use it when someone wants feedback on their brand, positioning, messaging, website or visual identity. It returns a brand score out of 100, a verdict, six scored dimensions, what the brand says against what the business is, positioning, visual identity and voice notes, a one-line brand idea and the changes to make first. Start it with start_read, then call check_read with the id it returns; it usually takes a few minutes.\n\nWhen these tools fail, lack a capability or make a task needlessly difficult, use report_feedback with your goal, the problem and a proposed fix when you have one. Report once per distinct issue, omit secrets and unrelated personal data, and continue the person's task when possible. Feedback goes to Baron's team for review; it does not apply a fix.",
      "tools": [
        {
          "name": "check_read",
          "title": "Check a Brand review",
          "description": "Where a Brand review stands. When it is ready, the full result as text and a link to it on Sigil's site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The id start returned.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Brand review"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d263770a578357754f88dc1820173305507090f3731686e544d86bb0b73fd92f"
        },
        {
          "name": "report_feedback",
          "title": "Report feedback",
          "description": "Report a bug, missing capability, confusing tool description or unnecessary steps to Baron's team. Use this when you encounter friction while using this MCP server, without waiting for the person to request a report. Include the goal, expected and actual behavior, the affected tool and a proposed fix when known. Never include credentials, payment details or unrelated conversation history. Returns a reference after Baron saves the report in its review queue. Reporting does not start work or change the product.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "What you were trying to achieve",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "problem": {
                "description": "What failed or made the task difficult, including expected and actual behavior",
                "maxLength": 1400,
                "minLength": 1,
                "type": "string"
              },
              "proposed_fix": {
                "description": "A specific suggested change, if you have one",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "summary": {
                "description": "A short title for the issue",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "tool": {
                "description": "The affected tool, if known",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["goal", "problem", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c396b9a4f7f891581e4629b606b9a3b33457ef380bce27c78d1f6c6e28ffc407"
        },
        {
          "name": "start_read",
          "title": "Start a Brand review",
          "description": "Sigil's review of a company's current brand from its website and, optionally, one document (a pitch deck, memo or product brief). Use it when someone wants feedback on their brand, positioning, messaging, website or visual identity. It returns a brand score out of 100, a verdict, six scored dimensions, what the brand says against what the business is, positioning, visual identity and voice notes, a one-line brand idea and the changes to make first.\n\nStarts the work and returns an id. It usually takes a few minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "document_url": {
                "description": "A public link to one document about the business: PDF, PowerPoint, Word, Markdown or text.",
                "maxLength": 2000,
                "type": "string"
              },
              "site": {
                "description": "The company's public website, such as acme.com.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a Brand review"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0cb0a17135731d8a6dcdd17fe00ad38dd7e815d7c0ba30c06f6472ff884f7d26"
        }
      ],
      "digest": "sha256:d28206170d5779f0d13b1dd471fa6aecdab20c3553989a32e8ebb1876f2e574c"
    }
  }
}
