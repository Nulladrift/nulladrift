      },
      "instructions": "Sigil: Brand reviews from a public website and an optional product document.\n\n- Brand review: Sigil's review of a company's current brand from its website and, optionally, one document (a pitch deck, memo or product brief). Use it when someone wants feedback on their brand, positioning, messaging, website or visual identity. It returns a brand score out of 100, a verdict, six scored dimensions, what the brand says against what the business is, positioning, visual identity and voice notes, a one-line brand idea and the changes to make first. Start it with start_read, then call check_read with the id it returns; it usually takes a few minutes.",
      "tools": [
        {
          "name": "check_read",
          "title": "Check a Brand review",
          "description": "Where a Brand review stands. When it is ready, the full result as text and a link to it on Sigil's site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The id start returned.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Brand review"
          },
