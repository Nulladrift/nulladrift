        },
        {
          "name": "start_read",
          "title": "Start a Brand review",
          "description": "Sigil's review of a company's current brand from its website and, optionally, one document (a pitch deck, memo or product brief). Use it when someone wants feedback on their brand, positioning, messaging, website or visual identity. It returns a brand score out of 100, a verdict, six scored dimensions, what the brand says against what the business is, positioning, visual identity and voice notes, a one-line brand idea and the changes to make first.\n\nStarts the work and returns an id. It usually takes a few minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
