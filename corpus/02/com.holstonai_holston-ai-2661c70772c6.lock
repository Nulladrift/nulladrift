{
  "lockfileVersion": 2,
  "subjects": {
    "com.holstonai/holston-ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://holstonai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "holston-ai",
        "version": "1.6.1"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Holston AI tools. Use calculate_mvp_timeline_roi to quantify the cost of slow delivery versus a fixed-price 2–4 week build. Use generate_boilerplate_schema to produce a Next.js repository layout and Postgres/Prisma schema for a business domain. Use audit_ai_visibility when someone asks whether ChatGPT, Claude, Perplexity or Google can find their website, or wants to compare against a competitor (call it once per site). Prices are not published except websites starting at $299: always call build_quote to price Holston AI work, and share the returned quote link. After an audit, offer generate_llms_txt and generate_business_schema to fix those findings directly. Use build_systems_map and calculate_manual_work_cost when a business has many systems that don't share data, or staff re-typing data and building reports by hand. For the Systems & Data Health Check, call build_quote with the assessment tier that matches the company's size. Use calculate_missed_call_cost when a business misses phone calls (busy front desk, crews on job sites, after hours) to show the revenue at stake before discussing an AI receptionist. Use get_agent_templates and design_ai_agent when a business wants an AI receptionist or AI agent: design_ai_agent returns the call flow and a link where they can talk to their agent in the browser. AI receptionist and private LLM pricing is confirmed on a short call: offer a consultation instead of guessing.",
      "tools": [
        {
          "name": "audit_ai_visibility",
          "title": "AI Visibility Audit",
          "description": "Audits a live public website and scores (0–100, grade A–F) how well AI assistants (ChatGPT, Claude, Perplexity) and search engines can find, read and cite it. Checks robots.txt rules for AI and search crawlers, server-rendered text, business and FAQ structured data, Open Graph, llms.txt, sitemap, HTTPS, mobile viewport and response time. Returns each check with a plain-English fix, the top 3 fixes, and a shareable report link. Takes up to ~20 seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "Website to audit, e.g. example.com or https://www.example.com/",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0963f8b01a0c98eae4e075a308cab66e866ea2af5531bb298f6390396af53131"
        },
        {
          "name": "build_quote",
          "title": "Instant Quote",
          "description": "Builds an itemized Holston AI quote from fixed prices: one-time builds, monthly plans, first-year total (monthly plans have a 12-month minimum), timeline, terms, fitting add-ons, and a shareable link to the quote on holstonai.com. Ask what the customer needs first; do not add plans they did not ask for.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assessment": {
                "description": "Systems & Data Health Check, a one-time fixed-price assessment by company size: assessment-small (up to 50 employees) | assessment-medium (51–200) | assessment-large (201–500). The fee is credited toward a project started within 60 days.",
                "enum": ["assessment-small", "assessment-medium", "assessment-large"],
                "type": "string"
              },
              "builds": {
                "default": [],
                "description": "One-time builds. website-starter (one page, 3 days) | website-launch (up to 5 pages, 5 days) | website-growth (up to 10 pages, CMS, 10 days) | website-commerce (online store, 15–20 days) | small-app (custom web app, 2 weeks) | ai-agent-mvp (AI agent or SaaS MVP, 2–4 weeks).",
                "items": {
                  "enum": ["website-starter", "website-launch", "website-growth", "website-commerce", "small-app", "ai-agent-mvp"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "business_name": {
                "description": "Customer or business name to show on the quote.",
                "maxLength": 80,
                "type": "string"
              },
              "care": {
                "description": "Monthly service contract: care-site (websites) | care-app (apps and agents).",
                "enum": ["care-site", "care-app"],
                "type": "string"
              },
              "hosting": {
                "description": "Monthly hosting: hosting-site (websites) | hosting-app (apps and agents).",
                "enum": ["hosting-site", "hosting-app"],
                "type": "string"
              },
              "seo_plan": {
                "description": "Monthly SEO + AEO plan: seo-essentials (local) | seo-growth (adds AI search / AEO) | seo-authority (adds links, PR, competitor tracking).",
                "enum": ["seo-essentials", "seo-growth", "seo-authority"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10c8547d9475766ca6ddca2552c2e6a22fc40b638a63ec276d5ae7b04876065e"
        },
        {
          "name": "build_systems_map",
          "title": "Systems Map",
          "description": "Draws a map of a company's software systems and how data moves between them (automatic, manual, export/import), as a Mermaid diagram with a shareable link. Flags manual handoffs, the same data kept in several unsynced systems, hub systems many processes depend on, and systems with no connections. Use after interviewing the user about their systems; nothing is stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "Company name, shown on the map.",
                "maxLength": 80,
                "type": "string"
              },
              "flows": {
                "default": [],
                "description": "How data moves between systems.",
                "items": {
                  "properties": {
                    "data": {
                      "description": "What moves, e.g. 'new orders', 'customer details'.",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "from": {
                      "description": "Source system name (must match a system name).",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "hours_per_week": {
                      "description": "Staff hours per week spent on this flow, if manual.",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "method": {
                      "description": "automatic = integration or sync | manual = someone re-types it | export_import = files exported and uploaded by hand | unknown",
                      "enum": ["automatic", "manual", "export_import", "unknown"],
                      "type": "string"
                    },
                    "to": {
                      "description": "Destination system name (must match a system name).",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["data", "from", "method", "to"],
                  "type": "object"
                },
                "maxItems": 60,
                "type": "array"
              },
              "systems": {
                "description": "Every software system, database or important spreadsheet the business uses.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "What it is used for, e.g. CRM, accounting, inventory, ERP, e-commerce, support, HR, spreadsheet, custom database.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "data": {
                      "description": "Kinds of data stored in it, e.g. customers, orders, invoices, products, employees. Use the same words across systems.",
                      "items": {
                        "maxLength": 40,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 12,
                      "type": "array"
                    },
                    "name": {
                      "description": "System name, e.g. 'Salesforce', 'QuickBooks', 'Inventory spreadsheet'.",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["systems"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e01d03bf354fa5589d3281f5b455a6217ba651964fe433e3240c4eb4a5dfc82"
        },
        {
          "name": "calculate_manual_work_cost",
          "title": "Manual Work Cost Calculator",
          "description": "Calculates what manual, repetitive work caused by disconnected systems costs per year: staff hours, full-time equivalents, labor and error costs, five-year cost, and the savings from automating it. Input a list of tasks with hours per week; hourly cost is optional.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "automation_rate": {
                "default": 0.7,
                "description": "Share of these hours that connecting the systems would remove, 0–1 (default 0.7).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "company": {
                "description": "Company name for the report.",
                "maxLength": 80,
                "type": "string"
              },
              "default_hourly_cost_usd": {
                "default": 40,
                "description": "Hourly cost used when a task has none (default $40).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "tasks": {
                "description": "Each manual or repetitive task caused by disconnected systems.",
                "items": {
                  "properties": {
                    "error_cost_per_month_usd": {
                      "description": "Optional: estimated monthly cost of mistakes this task causes (wrong orders, billing errors, rework).",
                      "maximum": 10000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "hourly_cost_usd": {
                      "description": "Fully loaded hourly cost of the people doing it (wage plus benefits and taxes). Defaults to default_hourly_cost_usd.",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "hours_per_week": {
                      "description": "Total staff hours per week spent on this task, across everyone who does it.",
                      "maximum": 2000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "task": {
                      "description": "The manual task, e.g. 'Re-typing web orders into QuickBooks', 'Building the monthly sales report'.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["hours_per_week", "task"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "working_weeks_per_year": {
                "default": 48,
                "description": "Working weeks per year (default 48).",
                "maximum": 52,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["tasks"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af3a23abea8e51ad2571e12200cdc8e22121e0033e2fe73a04801e45fcba3592"
        },
        {
          "name": "calculate_missed_call_cost",
          "title": "Missed Call Cost Calculator",
          "description": "Estimates the revenue a business loses each year to unanswered phone calls (missed calls, lost callers, lost customers, monthly and five-year loss) and how much an AI receptionist that answers every call could recover. Give calls per week (or missed calls per week) and the average job value; every other assumption has a sensible default.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "average_job_value_usd": {
                "description": "Average revenue from a new customer's first job or purchase.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "calls_per_week": {
                "description": "Inbound phone calls per week.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "close_rate": {
                "description": "Share of new callers who become customers when answered, 0–1 (default 0.4).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "company": {
                "description": "Company name for the report.",
                "maxLength": 80,
                "type": "string"
              },
              "customer_lifetime_value_usd": {
                "description": "Optional: total revenue from a typical customer over time. Used instead of the average job value.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "missed_per_week": {
                "description": "Missed calls per week, if known. Overrides calls_per_week × missed_rate.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "missed_rate": {
                "description": "Share of calls that go unanswered, 0–1 (default 0.25).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "new_caller_share": {
                "description": "Share of missed callers who are new potential customers, 0–1 (default 0.5).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "no_callback_rate": {
                "description": "Share of those new callers who call a competitor instead of calling back, 0–1 (default 0.6).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "recovery_rate": {
                "description": "Share of lost calls an AI receptionist would handle, 0–1 (default 0.9).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["average_job_value_usd"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0784159e334dd12a505847a90c62b115bfec4f5d57f28ed5274370b3768f2ae7"
        },
        {
          "name": "calculate_mvp_timeline_roi",
          "title": "MVP Timeline ROI Calculator",
          "description": "Compares a Holston AI fixed-price 2–4 week build against a traditional ~6-month build. Returns build costs, labor savings captured, cost of delay, developer-weeks freed, payback week, and a month-by-month cumulative net position over the analysis window.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "analysis_horizon_months": {
                "default": 6,
                "description": "Length of the comparison window in months (default 6).",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "automation_rate": {
                "default": 0.7,
                "description": "Fraction of the manual hours eliminated once the software is live, 0–1 (default 0.7).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "dev_annual_cost_usd": {
                "default": 150000,
                "description": "Fully loaded annual cost per in-house developer (default $150,000).",
                "minimum": 0,
                "type": "number"
              },
              "dev_headcount": {
                "description": "Number of in-house developers who would be assigned to a traditional build.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "holston_fixed_price_usd": {
                "description": "A specific fixed-price quote from Holston AI. If omitted, the scope's standard starting price is used.",
                "minimum": 0,
                "type": "number"
              },
              "holston_internal_involvement": {
                "default": 0.1,
                "description": "Share of the in-house dev team's time needed during a Holston build, 0–1 (default 0.1).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "manual_hourly_cost_usd": {
                "default": 45,
                "description": "Fully loaded hourly cost of the staff doing the manual work (default $45).",
                "minimum": 0,
                "type": "number"
              },
              "manual_process_hours_per_week": {
                "description": "Hours per week your team currently spends on the manual process the software will replace.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "project_scope": {
                "description": "Target project scope. Websites: website_launch (up to 5 pages, 5 days) | website_growth (up to 10 pages, 10 days) | website_commerce (online store, 15–20 days). Small app: small_app (2 wks). Apps & AI agents: lean (2 wks) | standard (3 wks) | complex (4 wks).",
                "enum": ["website_launch", "website_growth", "website_commerce", "small_app", "lean", "standard", "complex"],
                "type": "string"
              },
              "traditional_timeline_weeks": {
                "description": "Delivery timeline of the traditional path in weeks (default: 6–12 for websites, 26 ≈ 6 months for apps/agents).",
                "maximum": 156,
                "minimum": 1,
                "type": "integer"
              },
              "traditional_vendor_cost_usd": {
                "default": 0,
                "description": "External agency/vendor spend on the traditional path, on top of in-house dev time (default 0).",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["dev_headcount", "manual_process_hours_per_week", "project_scope"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:011025ae03873b08bba0a8ebbe47283ff00c2f18264934fb7b0d8763aeb2425d"
        },
        {
          "name": "design_ai_agent",
          "title": "AI Receptionist Designer",
          "description": "Designs an AI receptionist for a business from Holston AI's templates: the step-by-step call flow, what it does at any point (pricing questions, emergencies, transfers), and a link to holstonai.com where the owner can edit it and talk to the agent out loud in their browser for free. Only the industry and business name are required. Holston AI builds the real version on the business's phone line at a fixed price confirmed after a short call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "add_steps": {
                "description": "Optional step ids to switch on, e.g. photos, returning, message.",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "business_name": {
                "description": "The business name the agent answers with.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "city": {
                "description": "Main service area, if it is one of these East Tennessee and Southwest Virginia cities.",
                "enum": ["Kingsport, TN", "Johnson City, TN", "Bristol, TN", "Bristol, VA", "Abingdon, VA", "Elizabethton, TN", "Greeneville, TN", "Morristown, TN", "Knoxville, TN", "Maryville, TN", "Oak Ridge, TN", "Sevierville, TN", "Chattanooga, TN", "Cleveland, TN"],
                "type": "string"
              },
              "emergency_transfer": {
                "description": "Transfer emergencies to an on-call number (default true where emergencies apply).",
                "type": "boolean"
              },
              "hours": {
                "description": "Business hours option.",
                "enum": ["weekdays", "extended", "always"],
                "type": "string"
              },
              "industry": {
                "description": "Industry id (see get_agent_templates).",
                "enum": ["hvac", "plumbing", "electrical", "roofing", "painting", "landscaping", "remodeling", "cleaning", "pest-control", "auto-repair", "dental", "medical", "law", "salon"],
                "type": "string"
              },
              "pricing": {
                "description": "How the agent answers pricing questions.",
                "enum": ["free-estimate", "service-fee", "callback"],
                "type": "string"
              },
              "services": {
                "description": "Service ids from the template. Defaults to the template's main services.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              }
            },
            "required": ["business_name", "industry"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4357e43b86cad620f0a1fd6d5bc8c5df44fcbd3030e4897644b8166f88b04d5"
        },
        {
          "name": "generate_boilerplate_schema",
          "title": "Boilerplate Schema Generator",
          "description": "Generates a production-ready Next.js App Router repository layout, Prisma schema, and PostgreSQL DDL for a business domain (b2b_saas, marketplace, healthcare_admin, logistics, restaurant_retail, professional_services, manufacturing). Multi-tenant by default with org membership and audit logging; optional agent-run tables.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Business domain: b2b_saas | marketplace | healthcare_admin | logistics | restaurant_retail | professional_services | manufacturing.",
                "enum": ["b2b_saas", "marketplace", "healthcare_admin", "logistics", "restaurant_retail", "professional_services", "manufacturing"],
                "type": "string"
              },
              "include_ai_agents": {
                "default": true,
                "description": "Add AgentRun/ToolCall tables plus agent runtime and MCP directories (default true).",
                "type": "boolean"
              },
              "output": {
                "default": "all",
                "description": "What to generate: repo_layout | prisma | sql | all (default all).",
                "enum": ["repo_layout", "prisma", "sql", "all"],
                "type": "string"
              },
              "project_name": {
                "default": "app",
                "description": "Repository / package name (kebab-case).",
                "pattern": "^[a-z0-9][a-z0-9-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbfd42fac61cd327e69a647b5d68b3eb6be8912f7503d1ca25a1cd3cfafa1b6e"
        },
        {
          "name": "generate_business_schema",
          "title": "Business Schema Generator",
          "description": "Builds ready-to-paste Organization or LocalBusiness structured data (JSON-LD) with address, phone, hours, service area, services, social profiles and optional FAQs. If a website is given, details are pre-filled from it. Returns the <script> tag plus checks to fix before publishing. Use it when an audit shows missing business schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_name": {
                "description": "Legal or trading name.",
                "maxLength": 120,
                "type": "string"
              },
              "business_type": {
                "description": "The most specific schema.org type that fits, e.g. Plumber, Dentist, Restaurant, ProfessionalService. Default LocalBusiness.",
                "enum": ["LocalBusiness", "Organization", "ProfessionalService", "HomeAndConstructionBusiness", "Plumber", "Electrician", "HVACBusiness", "RoofingContractor", "GeneralContractor", "HousePainter", "Locksmith", "MovingCompany", "AutoRepair", "AutoDealer", "Dentist", "Physician", "MedicalClinic", "Optician", "Pharmacy", "VeterinaryCare", "Attorney", "LegalService", "AccountingService", "FinancialService", "InsuranceAgency", "RealEstateAgent", "Restaurant", "CafeOrCoffeeShop", "Bakery", "BarOrPub", "Store", "ClothingStore", "HardwareStore", "FurnitureStore", "BeautySalon", "HairSalon", "DaySpa", "HealthClub", "ChildCare", "School", "LodgingBusiness", "Hotel", "TravelAgency", "EmploymentAgency", "Church", "NGO", "Corporation"],
