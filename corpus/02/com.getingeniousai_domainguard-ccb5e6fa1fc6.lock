        },
        {
          "name": "scan_domain",
          "description": "Start DomainGuard's free domain impersonation exposure scan for a domain (e.g. example.com). Sweeps registered lookalike / typosquat domains and Certificate Transparency logs, checks CAA posture, and scores the exposure. Returns a job_token; call get_scan_report with it until status is 'done'. The same free scan the DomainGuard website runs — no account, no payment.",
