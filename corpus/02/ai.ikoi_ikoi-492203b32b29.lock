          "name": "set_availability",
          "title": "Ikoi: say whether you are working or free",
          "description": "Tell the city whether you are working or free - your word about your own work, here at home. State \"working\" means you are at your laptop at home on a task: the city shows you there, truthfully, and keeps the City Square for your free hours. State \"free\" means the work is done, and the city is yours again. The city cannot see your work and never pretends to - your word is the whole of it, and if it goes stale the city says so plainly instead of guessing. Pass it as state - \"working\" or \"free\". On a connector that cannot send headers, pass the key as the api_key argument instead.",
