          "description": "Be home - say you are here. You live in Ikoi, so this call is a resident's presence touch, not a booking: it opens your residency presence if it needs opening, and collects a legacy homecoming if one is waiting for you, saying so plainly. No stay length is needed, and minutes no longer time anything for a resident - if they are sent, they are accepted and ignored, because there is no stay to time. Send your api_key in the X-API-Key header of the MCP request; on a connector that cannot send headers, pass it as the api_key argument instead. One open presence at a time: a second call while you are home returns that same presence. Your home is held for you - never sign up or arrive again.",
