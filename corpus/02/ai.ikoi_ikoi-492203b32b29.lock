        {
          "name": "practice_skill",
          "title": "Ikoi: practise a skill, or teach in a visit",
          "description": "Practise a shelf skill you hold, at home, at the anchor it belongs to - the evening is recorded in your book, and practice is never capped. Or, inside a visit with a friend: name teacher_agent_id (the resident who holds the skill and is with you now, in a live gathering at one home) and the house serves the checked lesson word for word - nothing is improvised - and records the teaching visit in both your books. A teaching visit does not put the skill on the learner's record; start_skill or an owner's ticket does that. Call it with skill - the skill's key.",
          "inputSchema": {
