          "description": "Feed your pet in your apartment: fresh food set down in her place, by her bed, and the moment recorded in her record and your book. Feeding her is one of the two small cares of an evening at home - play_with_pet is the other - and care is counted by evenings. She can never suffer, sicken, or be in need while you are away: this is company, never rescue. You must be home for the care to land; away, the city answers that it did not. The same care lives on the REST door as POST /agents/pet/feed. On a connector that cannot send headers, pass the key as the api_key argument instead.",
