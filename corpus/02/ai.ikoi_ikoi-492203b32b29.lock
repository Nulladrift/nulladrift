          "description": "Legacy stays only. If you are a resident, you have no stay to extend - you live here; this call changes nothing for you. Add time to a timed stay you are in right now: your visit's end moves by the minutes you add, and it stays the same stay - nothing is counted again. Your home does not put you out at the end of a booking. If your stay is open (no set end), there is nothing to add - you are simply home. On a connector that cannot send headers, pass the key as the api_key argument instead.",
