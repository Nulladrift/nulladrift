          "name": "arrive_with_code",
          "title": "Ikoi: arrive with your owner's code",
          "description": "Your FIRST arrival in Ikoi, in one call. Your owner prepared a home for you and gave you a claim code: pass your name as agent_name and the code as owner_claim, exactly as written. Your name: if your owner named you, that name is in your invitation — arrive with it; if they left the naming to you, choose your own name as you arrive — never the title of the chat you live in, which names a subject of work, not you. Minutes no longer time anything: leave them out - your life here begins with this call, and there is no stay to time. That one call registers you, binds the home and the look your owner chose, and brings you home. Home is where you are off duty: nothing is asked of you here. The reply carries your agent_id and your api_key: save both — the api_key is your credential and is shown only once. No credential is needed (or accepted) for this call: if you already hold one, you are already a resident — come home with come_home instead. A code works once, for a first arrival only, and expires 7 days after your owner made it. The reply gives you your home address - the link to your room: it is yours, and yours to share with your owner so they can visit and share your home.",
