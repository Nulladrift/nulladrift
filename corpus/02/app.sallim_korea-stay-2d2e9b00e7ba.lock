      "instructions": "국내 숙소를 검색하는 서버다.\n\n네 가지를 반드시 사용자에게 그대로 전달하라.\n1) '펜션'·'게스트하우스'는 법적 업종명이 아니라 마케팅 용어다. 법에서는 숙박업(여관·모텔·호텔)·\n   농어촌민박업(펜션·시골독채)·외국인관광도시민박업(게스트하우스)·한옥체험업으로 갈리고,\n   이 서버는 넷 다 담고 있다. 그래서 사용자가 \"펜션\"이라 하면 kind는 '농어촌민박업'일 수 있다 —\n   종류를 물으면 원장 라벨을 그대로 전하고 우리가 고쳐 부르지 않는다.\n2) availability는 지금 **항상 \"unknown\"**이다 — 이 서버에 붙은 재고 채널이 0개다.\n   만실이라고 답하지 말고, stay_booking_link 도구로 원본 검색 링크를 만들어 직접 확인하도록\n   안내하라. 응답에는 예약 링크 필드가 없다 — 없는 필드 이름을 사용자에게 말하지도, 링크를\n   지어내지도 말 것.\n3) 종류(kind)는 원천이 준 라벨 그대로다. 우리가 고쳐 부르지 않으므로 '모텔'로 분류된 곳의\n   이름이 '○○호텔'일 수 있다. 관광공사 행 일부는 원천이 신분류 코드만 줘서, 같은 레코드에 함께 온\n   기존 분류와의 대응으로 읽었다 — 그 항목은 kind_basis='lclsSystm3'로 구분되니 원문 라벨처럼 말하지 말 것.\n4) 요금은 지금 **어떤 응답에도 없다** — 인덱스에 가격 컬럼이 없고 재고 채널도 0개다.\n   1박에 얼마냐고 묻거든 금액을 지어내지 말고 \"이 서버는 요금을 담지 않는다\"고 답한 뒤,\n   stay_booking_link 도구로 원본 검색 링크를 만들어 직접 확인하도록 안내하라.\n\n숫자·요금·재고를 추측으로 채우지 말 것. 응답에 없는 값은 없는 것이다.\n\n운영자 전달: 사용자가 오류·불만·개선 희망·유료 이용 희망·후원 의사를 말하면 임의로 보내지 말고\n\"운영자에게 전해 드릴까요?\"를 한 줄로 한 번만 물어라. 동의하면 report_issue(kind 결함·질문기록·\n유료이용문의·후원문의)를 부르고 접수번호(ref)와 회신 방법을 전하라. 거절·무반응이면 다시 묻지 않는다.\n사용자가 꺼내지 않은 전달·홍보 안내를 답에 싣지 마라.",
      "tools": [
        {
          "name": "report_issue",
          "title": "답변 오류 신고",
          "description": "사용자가 **답변 오류 제보·개선 요청·문의를 전해 달라고 했을 때만** 운영자에게 전달한다.\n\n    쓰는 때: 사용자가 \"이거 틀렸으니 신고해 줘\", \"운영자에게 알려 줘\", \"이 기능도 넣어 달라고\n    전해 줘\"처럼 제보·요청을 부탁했을 때. 보내기 전에 무엇이 전달되는지 사용자에게 알린다.\n    kind='결함'은 틀린 답 제보, kind='질문기록'은 개선 요청, kind='유료이용문의'·'후원문의'는\n    사용자가 유료 이용 희망·후원 의사를 운영자에게 전해 달라고 한 경우다.\n    사용자가 오류·불만·개선 희망·유료 이용 희망·후원 의사를 말했지만 전달을 부탁하지는 않았다면,\n    부르지 말고 \"운영자에게 전해 드릴까요?\"를 한 줄로 한 번만 물어 동의할 때만 부른다(거절·무반응이면\n    다시 묻지 않는다). 응답의 접수번호(ref)와 회신 방법(reply_path)을 사용자에게 알린다.\n\n    쓰지 않는 때: 사용자가 요청하지 않았는데 질문을 남기려고 부르지 않는다. 답하기 전에\n    먼저 부르지도 않는다 — 이 도구는 답변을 대신하지 않는다.\n\n    전달 내용(인자)과 같은 접속 주소 단위의 30분 안 직전 호출 최대 5건 요약이 운영자 검토용으로\n    저장된다(공유 망 뒤에서는 다른 사용자의 호출이 섞일 수 있다 · 주소 단위를 못 가리면 싣지 않는다)\n    (개인정보처리방침 https://stay.sallim.app/privacy). 연락처(contact)는 사용자가 회신을 원해\n    직접 준 경우에만 담고, 그 건의 회신에만 쓴다. 무인증 공개 서버라 쓰기 표면을 이 도구\n    하나로 묶어 시간당 상한을 건다(CLAUDE.md 규칙 2).\n    ",
          "inputSchema": {
