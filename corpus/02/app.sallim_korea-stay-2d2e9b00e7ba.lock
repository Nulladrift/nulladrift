        {
          "name": "stay_search",
          "title": "숙소 검색",
          "description": "조건에 맞는 국내 숙소를 찾는다.\n\n    **재고를 확인하지 못한 숙소를 결과에서 지우지 않는다.** availability가 unknown이면\n    빈방 여부를 모른다는 뜻이고, 만실이라는 뜻이 아니다. 사용자에게 그렇게 전달하라.\n    ",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "enum": ["관광호텔", "콘도미니엄", "유스호스텔", "펜션", "모텔", "민박", "게스트하우스", "홈스테이", "서비스드레지던스", "한옥", "여관업", "숙박업(생활)", "여인숙업", "일반호텔", "숙박업 기타", "휴양콘도미니엄업", "농어촌민박업", "외국인관광 도시민박업", "한옥체험업"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
