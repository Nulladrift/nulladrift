        {
          "name": "stay_booking_link",
          "title": "원본 플랫폼 검색 링크",
          "description": "원본 플랫폼(네이버·구글·관광공사)의 검색 결과로 가는 링크를 만든다.\n\n    이 서버는 예약을 처리하지 않는다 — 사용자를 원본 플랫폼으로 보낸다. 링크는 **검색 링크**이며\n    특정 객실·예약 페이지가 아니고 예약 가능 여부도 확인하지 않는다. 검색어는 naver·google이\n    숙소명+주소, tour는 숙소명만이다(주소가 안 들어가 같은 이름의 다른 숙소가 섞일 수 있다).\n    관광공사 행이 인허가 원장에서 폐업으로 공시되면(stay_detail의 ledger_closure가 closed_in_ledger*)\n    응답에 ledger_closure(status·close_date·같은 주소 영업 등록)와 note 한 문장을 함께 싣는다.\n    ",
