        {
          "name": "get_new_arrivals",
          "title": "New arrivals",
          "description": "List the newest wholesale items uploaded by Dongdaemun (Seoul) stalls on apMZoomAI (앱엠줌AI) within the last N hours (default 24, up to 168), newest first, at most 3 per stall. Optional filters: building key (see list_buildings) and category (e.g. dress, knit, jeans, outer, shoes, bags). Returns item name, photos, category, stall location and an apMZoomAI link. No prices are provided; the link shows price and ordering details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "building": {
                "description": "Only this building, e.g. \"apM\", \"THEOT\", \"NUZZON\". Use a building key returned by list_buildings.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "category": {
                "description": "Only this category, e.g. dress, knit, jeans, outer, shoes, bags.",
                "enum": ["tee", "shirt", "knit", "cardigan", "hoodie", "sweater", "vest", "jacket", "coat", "trench", "padding", "suit", "jeans", "shorts", "jumpsuit", "dress", "skirt", "set", "top", "outer", "pants", "accessories", "shoes", "bags", "men"],
                "type": "string"
              },
              "hours": {
                "default": 24,
                "description": "Look back this many hours (1-168, default 24).",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Language for item names, labels and links: en, zh, ko, ja, vi, th, id or ms. Default en.",
