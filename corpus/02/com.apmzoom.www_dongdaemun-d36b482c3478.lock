                  {
                    "type": "null"
                  }
                ]
              },
              "lang": {
                "enum": ["en", "zh", "ko", "ja", "vi", "th", "id", "ms"],
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
