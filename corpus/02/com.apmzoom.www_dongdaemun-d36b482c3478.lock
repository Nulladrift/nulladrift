      "serverInfo": {
        "name": "apMZoomAI",
        "title": "apMZoomAI · Dongdaemun wholesale",
        "version": "1.0.0",
        "description": "apMZoomAI (앱엠줌AI): read-only guide to wholesale fashion items and stalls in the Dongdaemun market, Seoul.",
        "websiteUrl": "https://www.apmzoom.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "apMZoomAI (앱엠줌AI) is a sourcing guide to the Dongdaemun wholesale fashion market in Seoul, Korea.\nThese read-only tools search items listed by market stalls, show new arrivals, find stalls (building, floor, stall number) and list the market buildings.\nWhen answering buyers:\n- Prices, discounts and stock levels are not available here. Never state or guess a price or currency amount; send the buyer to the apMZoomAI link of the item or stall, where prices and wholesale ordering details are shown.\n- Merchant contact details are not provided. Buyers reach a stall through its apMZoomAI store page.\n- Only stalls currently in business are returned. Item names and photos come from the stalls themselves; do not describe any stall or brand as endorsed by or affiliated with apMZoomAI.\n- Pass lang (en, zh, ko, ja, vi, th, id, ms) to get names, labels and links in the buyer's language.\n- Give one link per item (its details link) and the store link when useful. Do not add purchase prompts.",
      "tools": [
        {
          "name": "find_stalls",
          "title": "Find stalls",
          "description": "Find stalls (shops) in the Dongdaemun wholesale market, Seoul, on apMZoomAI (앱엠줌AI) by stall name or stall number, and/or by building and floor. Returns each stall's building, floor and stall number, how many items it lists, how many are new in the last 7 days, and its apMZoomAI store page. Contact details are never provided; buyers reach a stall through its store page. With no filters, returns stalls that uploaded new items in the last 7 days.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "building": {
                "description": "Only this building, e.g. \"apM\", \"THEOT\", \"NUZZON\". Use a building key returned by list_buildings.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "floor": {
                "description": "Floor, e.g. \"1F\", \"B1\", \"3\".",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language for item names, labels and links: en, zh, ko, ja, vi, th, id or ms. Default en.",
                "enum": ["en", "zh", "ko", "ja", "vi", "th", "id", "ms"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many stalls to return (1-20, default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Stall name or stall number, e.g. \"FRANC\", \"엣코너\", \"B-21\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "building": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "count": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "floor": {
                "anyOf": [
                  {
