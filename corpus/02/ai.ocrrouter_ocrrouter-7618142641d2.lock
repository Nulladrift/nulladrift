        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.ocrrouter.ai/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ocrrouter",
        "title": "OCRRouter",
        "version": "0.2.0",
        "websiteUrl": "https://ocrrouter.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OCR for agents: turn PDFs and images into Markdown or JSON through one API that routes across OCR models. Create a free API key at https://ocrrouter.ai/keys (free models: 50,000 pages a month), then send it as \"Authorization: Bearer <key>\".",
      "tools": [
        {
          "name": "list_models",
          "title": "List OCR models",
          "description": "List the OCR models you can route to, with credits per page (0 = free) and whether each is available.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a9698eb6651b817be6d5d205f053f14a56fef70000746e22edd2b05432beac8a"
        },
        {
          "name": "ocr",
          "title": "OCR a PDF or image",
          "description": "Read a PDF or image and return its text as Markdown (tables kept as tables) or JSON blocks. Pass file_url for a public link, or file_base64 for file contents. Models jina/jina-ocr and deepseek/deepseek-ocr are free; auto picks the best model for the document.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64 file contents, instead of file_url.",
                "type": "string"
              },
              "file_url": {
                "description": "Public http(s) URL of a PDF, PNG, JPG, WebP or GIF.",
                "type": "string"
              },
              "filename": {
                "description": "File name with extension, recommended with file_base64.",
                "type": "string"
              },
              "format": {
                "description": "Output format. Default markdown.",
                "enum": ["markdown", "json", "text"],
                "type": "string"
              },
              "model": {
                "description": "Model ID from list_models, or auto (default).",
                "type": "string"
              },
              "pages": {
                "description": "Page range such as 1-5,8. Default all pages.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b7a6970b1baec0d8a82c1cbefae5a0c322290b651275c97aecb4e48eebb827d2"
        }
      ],
      "digest": "sha256:822749812054745a931f17b11fc5c22131b70c170c1359342481bc999d9fa440"
    }
  }
