{
  "lockfileVersion": 2,
  "subjects": {
    "ai.ocrrouter/ocrrouter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.ocrrouter.ai/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ocrrouter",
        "title": "OCRRouter",
        "version": "0.2.0",
        "websiteUrl": "https://ocrrouter.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OCR for agents: turn PDFs and images into Markdown or JSON through one API that routes across OCR models. Create a free API key at https://ocrrouter.ai/keys (free model tesseract/tesseract: 50,000 pages a month), then send it as \"Authorization: Bearer <key>\".",
      "tools": [
        {
          "name": "list_models",
          "title": "List OCR models",
          "description": "List the OCR models you can route to, with credits per page (0 = free) and whether each is available.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a9698eb6651b817be6d5d205f053f14a56fef70000746e22edd2b05432beac8a"
        },
        {
          "name": "ocr",
          "title": "OCR a PDF or image",
          "description": "Read a PDF or image and return its text as Markdown (tables kept as tables) or JSON blocks. Pass file_url for a public link, or file_base64 for file contents. Model tesseract/tesseract is free (other models use credits or a plan); auto picks the best model for the document.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64 file contents, instead of file_url.",
                "type": "string"
              },
              "file_url": {
                "description": "Public http(s) URL of a PDF, PNG, JPG, WebP or GIF.",
                "type": "string"
              },
              "filename": {
                "description": "File name with extension, recommended with file_base64.",
                "type": "string"
              },
              "format": {
                "description": "Output format. Default markdown.",
                "enum": ["markdown", "json", "text"],
                "type": "string"
              },
              "model": {
                "description": "Model ID from list_models, or auto (default).",
                "type": "string"
              },
              "pages": {
                "description": "Page range such as 1-5,8. Default all pages.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7151381e94ea3d22ee34fd3b30a605941ea4d3aab1417b8d8026261645437d6d"
        }
      ],
      "digest": "sha256:6f77bcd0da9b7a40e8db2a13ceba654a62abe2fa9232cd2b3255cf972844b3b7"
    }
  }
}
