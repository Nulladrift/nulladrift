{
  "lockfileVersion": 2,
  "subjects": {
    "com.actionbattery/product-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.actionbattery.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "actionbattery.com",
        "title": "Action Battery Wholesalers product catalogue",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the public website of Action Battery Wholesalers (https://www.actionbattery.com/): stationary batteries from BAE, Deka and NorthStar, chargers, DC power systems and UPS equipment, with the manufacturers' datasheets and a few product flyers. The website publishes no safety data sheets, discharge tables, manuals, certificates or warranty documents; if asked for one, say the website does not publish it and suggest asking Action Battery Wholesalers. The catalogue is rebuilt from the website every night. Link the source of every fact you give. Where a datasheet has a table of figures, point to the PDF and page, and give the page with any figure quoted from it. Action Battery Wholesalers has no online sizing tool; its engineers size systems from a quote request. For prices or a quote, quote_request says what to send and where. This connector only reads the website: it cannot send a message, place a request or run a calculation for anyone.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page or document",
          "description": "Read the full text of one result from search, find_series or get_documents (a web page, a PDF, or a product series) with its link.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "An id returned by search, find_series or get_documents.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page or document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5eb149daaa38cc7ffd6f059ef02cbdd47f5071b05371f9047f657c7a532a0e8a"
        },
        {
          "name": "find_series",
          "title": "Find a battery series",
          "description": "Find a battery or product series that Action Battery Wholesalers offers by chemistry (VRLA AGM, VRLA gel, flooded, pure lead), nominal voltage (2 V, 6 V, 12 V, 48 V) or application (telecom, utility, UPS, solar, switchgear). Returns each series with its product page and documents.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "e.g. telecom, utility, UPS, solar, switchgear",
                "type": "string"
              },
              "chemistry": {
                "description": "e.g. VRLA AGM, VRLA gel, flooded, pure lead",
                "type": "string"
              },
              "include_discontinued": {
                "description": "Include series the site marks as discontinued (default false).",
                "type": "boolean"
              },
              "text": {
                "description": "Words from the series name or model, e.g. \"OPzV\" or \"NSB 190FT\"",
                "type": "string"
              },
              "voltage": {
                "description": "Nominal voltage, e.g. \"2 V\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a battery series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c564604cec41e722e3ed319008d773927197b8fa1a4b1b9521b8f489deff3948"
        },
        {
          "name": "get_documents",
          "title": "List datasheets and product flyers",
          "description": "List the documents Action Battery Wholesalers links for a series, or of one type across the site. Almost all are manufacturers' datasheets (type datasheet); a few are product flyers (type brochure). The website publishes no SDS, discharge tables, manuals, certificates or warranty documents.",
          "inputSchema": {
            "properties": {
              "series": {
                "description": "A series id from find_series, or its name",
                "type": "string"
              },
              "type": {
                "enum": ["datasheet", "brochure", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List datasheets and product flyers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:707ffa1c0e59a5bd0d3b6eee38ae9acc6298b7787676656a411ff08ef681af2b"
        },
        {
          "name": "quote_request",
          "title": "How to request a quote",
          "description": "How to ask Action Battery Wholesalers for a quote or price: the address to write to, and what to include so the engineers can answer without a round of questions. It sends nothing; the customer sends the request themselves.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "Optional: what it is for",
                "type": "string"
              },
              "series": {
                "description": "Optional: the series or product the quote is for",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbef10670dbb7f085566935dc48239ee78b3e5d6c3bbff6ce38394cf79c40bb6"
        },
        {
          "name": "search",
          "title": "Search Action Battery Wholesalers",
          "description": "Search the Action Battery Wholesalers website for stationary batteries from BAE, Deka and NorthStar, chargers, DC power systems and UPS equipment: its pages and the manufacturers' datasheets and a few product flyers. Ask in plain words, e.g. \"12 V AGM battery for telecom\" or \"Deka Unigy I 12AVR100 datasheet\". Returns ids, titles and source links; read one with fetch.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What to look for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Action Battery Wholesalers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:044cdf3374e9fb45903b6d814d7678946dc0eba0e764c9a424cbbc1b81cd68ee"
        },
        {
          "name": "sizing_tool",
          "title": "How to get a system sized",
          "description": "Action Battery Wholesalers has NO online sizing tool, and this connector cannot size a system. This says how to get one sized: the customer sends the load, runtime and voltage with a quote request and the engineers size it.",
