{
  "lockfileVersion": 2,
  "subjects": {
    "com.actionbattery/product-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.actionbattery.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "actionbattery.com",
        "title": "Action Battery Wholesalers product catalogue",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the public website of Action Battery Wholesalers (https://www.actionbattery.com/): stationary batteries, chargers, DC power and their datasheets, discharge tables, manuals and SDS. The catalogue is rebuilt from the website every night. Link the source of every fact you give. Discharge-table figures are given only for tables checked against their datasheet; give the table, page and end voltage with each figure. For any other table, point to the PDF and page. Action Battery Wholesalers has no online sizing tool; its engineers size systems from a quote request. For prices or a quote, quote_request says what to send and where. This connector only reads the website: it cannot send a message, place a request or run a calculation for anyone.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page or document",
          "description": "Read the full text of one result from search (a web page, a PDF, or a product series) with its link. A discharge table returns its figures once it has been checked against its datasheet, otherwise the link and page.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "An id returned by search, find_series or get_documents.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page or document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c79270ec5357a20b8b412ceb0c4da48a6c865f84f183627c3716c5a4cbe9cae"
        },
        {
          "name": "find_series",
          "title": "Find a battery series",
          "description": "Find a stationary battery or product series that Action Battery Wholesalers offers by chemistry (VRLA gel, AGM, flooded, pure lead, lithium), nominal voltage (2 V, 6 V, 12 V, 48 V ...) or application (telecom, utility, solar, UPS, switchgear). Returns each series with its product page and documents.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "e.g. telecom, utility, solar, UPS, switchgear",
                "type": "string"
              },
              "chemistry": {
                "description": "e.g. gel, AGM, flooded, pure lead, lithium",
                "type": "string"
              },
              "include_discontinued": {
                "description": "Include series the site marks as discontinued (default false).",
                "type": "boolean"
              },
              "text": {
                "description": "Words from the series name or model, e.g. \"OPzV\" or \"NSB 190FT\"",
                "type": "string"
              },
              "voltage": {
                "description": "Nominal voltage, e.g. \"12 V\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a battery series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab0fc1e715aef9b6b2f68ddb08dc9398e5acd51c2861b64c5468a7fabd130227"
        },
        {
          "name": "get_documents",
          "title": "List datasheets, manuals and SDS",
          "description": "List the documents Action Battery Wholesalers publishes for a series, or of one type across the site: datasheet, discharge_table, manual, sds, certificate, standard, brochure, technical_paper, warranty. Third-party documents are linked at their source.",
          "inputSchema": {
            "properties": {
              "series": {
                "description": "A series id from find_series, or its name",
                "type": "string"
              },
              "type": {
                "enum": ["datasheet", "discharge_table", "manual", "sds", "certificate", "standard", "brochure", "technical_paper", "warranty", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List datasheets, manuals and SDS"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59a7849bbc78b605effd2827e61d92e3c81a4af294b09b6361e6c89ca4774d77"
        },
        {
          "name": "quote_request",
          "title": "How to request a quote",
          "description": "How to ask Action Battery Wholesalers for a quote or price: the address to write to, and what to include so the engineers can answer without a round of questions. It sends nothing; the customer sends the request themselves.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "Optional: what it is for",
                "type": "string"
              },
              "series": {
                "description": "Optional: the series or product the quote is for",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbef10670dbb7f085566935dc48239ee78b3e5d6c3bbff6ce38394cf79c40bb6"
        },
        {
          "name": "search",
          "title": "Search Action Battery Wholesalers",
          "description": "Search the Action Battery Wholesalers website for stationary batteries, chargers and DC power: product pages, datasheets, discharge tables, manuals, SDS and technical articles. Ask in plain words, e.g. \"12 V gel battery for solar\" or \"OPzS 2V cell SDS\". Returns ids, titles and source links; read one with fetch.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What to look for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Action Battery Wholesalers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c97e0ecefe2c00886cd4c860b3297fdc57c3279a8839ad3fa9ab113a3e53567"
        },
        {
          "name": "sizing_tool",
          "title": "How to get a system sized",
          "description": "Action Battery Wholesalers has NO online sizing tool, and this connector cannot size a system. This says how to get one sized: the customer sends the load, runtime and voltage with a quote request and the engineers size it.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
