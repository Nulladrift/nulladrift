{
  "lockfileVersion": 2,
  "subjects": {
    "com.bestsaaswebdesigns/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bestsaaswebdesigns.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "bestsaaswebdesigns",
        "title": "BestSaaSWebDesigns",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_site",
          "title": "Get one site",
          "description": "Get one SaaS website from the catalog by slug (from search_sites): website URL, category, style, stack, colour palette, fonts, captured sections, a link to its screenshots, and links to similar sites by category, style, stack and section.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Site slug, e.g. \"linear\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d89b00e213f743823b552a965fb3442763530cadcc65d588e46c2108790019c"
        },
        {
          "name": "list_filters",
          "title": "List categories, sections, styles and stacks",
          "description": "List every category, page section, visual style, tech stack and display font in the BestSaaSWebDesigns catalog of real SaaS marketing websites, with how many sites match each and a link to the gallery page for it. Call this first to learn valid filter values for search_sites.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47750ff9cc0738c75d5dacf593e80901adf50652af1b39472be75c4effa9fed9"
        },
        {
          "name": "list_site_links",
          "title": "List website links",
          "description": "List real SaaS marketing websites as plain links: name and homepage URL only. Same filters as search_sites, up to 50 at a time. Use it when you want a batch of live sites to open and study yourself in a browser; this server never fetches them. Use search_sites or get_site for palettes, fonts, stacks and sections.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Product category, e.g. \"AI\", \"Engineering & Infrastructure\". See list_filters.",
                "type": "string"
              },
              "color": {
                "description": "Hex colour; matches sites with a close colour in their palette, e.g. \"#5e6ad2\".",
                "type": "string"
              },
              "font": {
                "description": "Font family used on the site, e.g. \"Inter\".",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of links to return, 1–50 (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text, e.g. \"developer tools\", \"linear\", \"video editing\".",
                "maxLength": 200,
                "type": "string"
              },
              "section": {
                "description": "Only sites with this section captured, e.g. \"pricing\", \"heroes\", \"faq\", \"footers\".",
                "type": "string"
              },
              "stack": {
                "description": "Tech stack of the marketing site, e.g. \"Next.js\", \"Webflow\", \"Framer\".",
                "type": "string"
              },
              "style": {
                "description": "Visual style: \"dark\", \"light\", \"colorful\" or \"minimal\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c86d8c47b7ade48da8ee2fb024244f1bf263c6c347c8b5b91a10336aacc1fdad"
        },
        {
          "name": "search_sites",
          "title": "Find SaaS websites",
          "description": "Find real SaaS marketing websites to use as design references. Filter by category, page section (e.g. sites with a captured pricing page), visual style, tech stack, font or brand colour, and/or a free-text query (product name or industry). Returns each site's website URL, category, style, stack, colour palette, fonts, captured sections, and a link to its screenshots.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Product category, e.g. \"AI\", \"Engineering & Infrastructure\". See list_filters.",
                "type": "string"
              },
              "color": {
                "description": "Hex colour; matches sites with a close colour in their palette, e.g. \"#5e6ad2\".",
                "type": "string"
              },
              "font": {
                "description": "Font family used on the site, e.g. \"Inter\".",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Maximum number of sites to return, 1–20 (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text, e.g. \"developer tools\", \"linear\", \"video editing\".",
                "maxLength": 200,
                "type": "string"
              },
              "section": {
                "description": "Only sites with this section captured, e.g. \"pricing\", \"heroes\", \"faq\", \"footers\".",
                "type": "string"
              },
              "stack": {
                "description": "Tech stack of the marketing site, e.g. \"Next.js\", \"Webflow\", \"Framer\".",
                "type": "string"
              },
              "style": {
                "description": "Visual style: \"dark\", \"light\", \"colorful\" or \"minimal\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8678e9fa988ac238a4e0354504fa2bbfcac483c3b2c747955c50b823a44780a4"
        }
      ],
      "digest": "sha256:28f4d67668d4ddef03d1564fd3647a78fd8818f3a81096e08a3cbc937e426c78"
    }
  }
}
