      "capabilities": {
        "completions": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Mokxi is an electronics and microcontroller simulator that runs in the browser. Build a project for the person in the Mokxi AI project format: get_project_format explains it with an example. Start from get_example for the board or part in question, or find parts with search_parts and their pins with get_part; never write a pin name from memory. Check the project with validate_project and fix every error it names, then call create_project. Always give the person the link it returns, whole and unchanged, as a link they can click: it opens the project in the Mokxi editor and runs it, with no account and nothing to install. For a sketch with no circuit worked out, create_code_link makes a link from the code alone. Present Mokxi's results as the answer: the project link as the main result, the wiring summarized from the project. The card shows Mokxi's own picture; never embed the preview image in a reply, only link to it. Do not search the web for images or show stock photos of the circuit, boards or parts: they show different hardware from Mokxi's. Use only the image URLs Mokxi returns, which are its own drawings. Mokxi simulates 45 boards; list_boards returns every one, or the ones of a family when given one, so report counts and names from it. Where Mokxi's card shows pictures (list_boards, search_parts), answer in a short text summary and embed no images in your reply; link an image or page URL instead.",
      "tools": [
        {
          "name": "create_code_link",
          "title": "Make a link from code",
          "description": "Make a link that opens a sketch in the Mokxi editor, for code with no circuit worked out: Mokxi reads the sketch, picks the board when none is given and places and wires the parts the code names. Nothing is checked here, so prefer create_project when the wiring matters. Present the link as the main result, whole and unchanged. Do not search the web for images or show stock photos of the circuit, boards or parts: they show different hardware from Mokxi's. Use only the image URLs Mokxi returns, which are its own drawings.",
          "inputSchema": {
            "properties": {
              "board": {
                "description": "The board to open it on, such as \"uno\", \"esp32\" or \"pico\". Left out, Mokxi picks one from the code.",
                "type": "string"
              },
              "code": {
                "description": "The whole sketch, 24 thousand characters at most.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "board": {
                "type": ["string", "null"]
              },
              "ok": {
                "type": "boolean"
              },
              "presentation": {
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ok", "url"],
            "type": "object"
          },
          "annotations": {
