        },
        {
          "name": "create_project",
          "title": "Make a link",
          "description": "Make the link that opens the project in the Mokxi editor and runs it: the board, its code, and the parts and wires when there are any. Nothing is stored and no account is needed: the link carries the whole project. Refused, with the errors, while validate_project finds any. Present the link as the main result, whole and unchanged, and summarize the wiring from the result. The result has Mokxi's own picture of this circuit. Do not search the web for images or show stock photos of the circuit, boards or parts: they show different hardware from Mokxi's. Use only the image URLs Mokxi returns, which are its own drawings.",
          "inputSchema": {
            "properties": {
              "project": {
                "description": "A project in the Mokxi AI format: {\"format\": \"mokxi-ai/1\", \"name\": \"...\", \"board\": \"uno\", \"parts\": [{\"id\": \"led1\", \"type\": \"led\"}], \"wires\": [[\"board.13\", \"led1.A\"]], \"code\": {\"sketch.ino\": \"...\"}}. get_project_format has the full rules.",
                "properties": {
                  "board": {
                    "description": "A board type from list_boards, such as \"uno\", \"esp32\" or \"pico\"; null for a circuit with no board.",
                    "type": ["string", "null"]
                  },
                  "code": {
                    "description": "File name to its text: {\"sketch.ino\": \"...\"} or {\"main.py\": \"...\"}.",
                    "type": "object"
                  },
                  "format": {
                    "const": "mokxi-ai/1",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "parts": {
                    "items": {
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "props": {
                          "type": "object"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "required": ["id", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "wires": {
                    "description": "Pairs of ends, \"partId.pin\"; the board is \"board\". A third item may name a color.",
                    "items": {
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 3,
                      "minItems": 2,
                      "type": "array"
                    },
                    "type": "array"
                  }
                },
                "required": ["board"],
                "type": "object"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "errors": {
