        {
          "name": "validate_project",
          "title": "Check a project",
          "description": "Check a project the way the Mokxi editor does: every unknown part, wrong pin, bad setting and code problem, in plain words naming the part and pin. Fix every error, then call create_project: its link is the result to give the person. Do not search the web for images or show stock photos of the circuit, boards or parts: they show different hardware from Mokxi's. Use only the image URLs Mokxi returns, which are its own drawings.",
