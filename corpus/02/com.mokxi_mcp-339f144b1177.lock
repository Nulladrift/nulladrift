      "serverInfo": {
        "name": "mokxi",
        "title": "Mokxi",
        "version": "1.1.0",
        "description": "Build electronics projects (board, parts, wires and code), check them, and get a link that opens and runs them in the Mokxi simulator.",
        "websiteUrl": "https://mokxi.com/docs/ai",
        "icons": [
          {
            "src": "https://mokxi.com/brand/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
