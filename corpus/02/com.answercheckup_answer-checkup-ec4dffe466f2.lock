      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_report",
          "title": "Paid AI visibility report (x402)",
          "description": "Paid: the Lite report for 29 USDC (default) or the Full report for 49 USDC (tier \"full\"), via x402 (scheme exact). The same reports as the $29 Lite and $49 Full reports on the website. Returns the full report as JSON plus a private report link. Call once without `payment` to get the x402 payment requirements, then call again with the same arguments plus `payment` set to the base64 PAYMENT-SIGNATURE value. Payment is settled only if the report is delivered. If the call fails or times out after you pay, call get_report again with the same arguments and the same payment to get the result; you are never charged twice. If your x402 client caps payments, raise the cap to at least 49 USDC to buy the Full report.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Business name (default: derived from the domain)",
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "competitors": {
                "description": "Up to 5 competitor names",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "payment": {
                "description": "x402 v2 PAYMENT-SIGNATURE header value (base64 JSON payment payload)",
                "type": "string"
              },
              "prompts": {
                "description": "Your prompts are answered first. We add generated questions to fill the rest, up to 25.",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              },
              "tier": {
                "description": "\"lite\" (default, 29 USDC) or \"full\" (49 USDC)",
                "enum": ["lite", "full"],
                "type": "string"
              },
              "url": {
                "description": "Website URL, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Paid AI visibility report (x402)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca7b590c7fe1a13a5ae2f385189c21b57d42b72fc04a761250f7a161790f3ce6"
        },
        {
          "name": "get_scan_details",
          "title": "Paid scan details (x402)",
          "description": "Paid: 2.99 USDC via x402 (scheme exact), the same $2.99 scan details as on the website. Runs the AI readiness scan for one website and returns every check, the score breakdown and the prioritized fixes as JSON. Call once without `payment` to get the x402 payment requirements, then again with `payment`. Payment is settled only if the scan completes. If the call fails or times out after you pay, call get_scan_details again with the same arguments and the same payment to get the result; you are never charged twice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "payment": {
                "description": "x402 v2 PAYMENT-SIGNATURE header value (base64 JSON payment payload)",
                "type": "string"
              },
              "url": {
                "description": "Website URL, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Paid scan details (x402)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:74b419337ef661504a3c5a52a0f9f6612ec6c4ff90f9656e24a178bc7f6fe748"
        },
        {
          "name": "scan_site",
          "title": "Free AI readiness scan",
          "description": "Free. Checks a website's robots.txt rules for AI crawlers (GPTBot, OAI-SearchBot, ChatGPT-User, PerplexityBot, ClaudeBot, Google-Extended, CCBot), llms.txt, schema.org JSON-LD, title and meta description, content in raw HTML, and sitemap. Returns a 0 to 100 score and grade, plus a link to unlock the checks and prioritized fixes for $2.99.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "Website URL, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Free AI readiness scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b84670b5b95e95448e7315b85d2d23e792c1e407c87fa90f95444c9a7a8ffd9b"
        }
      ],
