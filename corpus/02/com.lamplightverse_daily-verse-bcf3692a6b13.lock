{
  "lockfileVersion": 2,
  "subjects": {
    "com.lamplightverse/daily-verse": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lamplightverse.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "lamplight",
        "title": "Lamplight daily verse",
        "version": "1.0.0",
        "description": "The Bible verse of the day, any verse or short passage in the KJV or WEB, and the day’s short reflection and prayer, from Lamplight. Read-only and free.",
        "websiteUrl": "https://lamplightverse.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Lamplight (lamplightverse.com) is a daily Bible verse site, and these tools return the verse of the day, any verse or short passage in the KJV or WEB, and the day’s short reflection and prayer. Scripture is the text stored on the site, word for word (KJV: Public domain outside the United Kingdom; WEB: Dedicated to the public domain), and the verse of the day turns over at midnight US Eastern. Free to use; please cite Lamplight (lamplightverse.com) and link the source_url in each result.",
      "tools": [
        {
          "name": "lookup_verse",
          "title": "Look up a Bible verse",
          "description": "Look up a Bible verse, a range inside one chapter, or a whole chapter in the KJV or the World English Bible, from Lamplight (https://lamplightverse.com). At most 50 verses per call; split longer passages. References like \"John 3:16\", \"1 Cor 13:4-7\" and \"Psalm 23\" work. The text is the scripture stored on the site, word for word, and it does not change. License: KJV: Public domain outside the United Kingdom; WEB: Dedicated to the public domain. To find verses by theme (anxiety, hope, forgiveness, marriage and more), the topic pages at https://lamplightverse.com/bible-verses-about print 8 to 15 verses each, in full, with a short note on each. Look up any single verse from them here.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "reference": {
                "description": "A verse, a range in one chapter, or a whole chapter: \"John 3:16\", \"1 Cor 13:4-7\", \"Psalm 23\". At most 50 verses.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "translation": {
                "description": "Bible translation: KJV or WEB (World English Bible). Default KJV.",
                "enum": ["KJV", "WEB"],
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b54c610b5de6df57632bb8d8ca4c4f77f4ff0921ae96f4924a5c7654d20d7d0a"
        },
        {
          "name": "todays_reflection",
          "title": "Reflection and prayer for the verse of the day",
          "description": "Get the short reflection and one-line prayer Lamplight (https://lamplightverse.com) shows for a day’s verse, with the verse in the KJV (license: Public domain outside the United Kingdom). Reflections are written with help from AI tools and checked against each verse; the scripture itself is never AI-written. They change once a day, at midnight US Eastern. Pass date (YYYY-MM-DD) for yesterday, today or tomorrow. data_updated_at is the date of the verse.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Day to get, as YYYY-MM-DD. Only yesterday, today or tomorrow (US Eastern) are accepted, so a reader in any time zone can ask for their own day. Default: today, US Eastern.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1e5c8c6b138136c06aa4b85012ef64ebb573132801f0dce0b9bf0959465f39d"
        },
        {
          "name": "verse_of_the_day",
          "title": "Bible verse of the day",
          "description": "Get the Bible verse of the day from Lamplight (https://lamplightverse.com), in the King James Version (KJV) or the World English Bible (WEB). Verses come from a fixed list of daily verses, one per calendar day, and the day turns over at midnight US Eastern. Pass date (YYYY-MM-DD) for yesterday, today or tomorrow to match the reader’s own day. The text is the scripture stored on the site, word for word. License: KJV: Public domain outside the United Kingdom; WEB: Dedicated to the public domain. data_updated_at is the date of the verse.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Day to get, as YYYY-MM-DD. Only yesterday, today or tomorrow (US Eastern) are accepted, so a reader in any time zone can ask for their own day. Default: today, US Eastern.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "translation": {
                "description": "Bible translation: KJV or WEB (World English Bible). Default KJV.",
                "enum": ["KJV", "WEB"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86d9dfc97b245b79d2f2d600bed55b69b1f542599e41168e7e9d0f5b849ce2b1"
        }
      ],
      "digest": "sha256:7e2c6b24988a272c0d6ca57e7b0dddafed726a4d70a5e6495bd8221179522d69"
    }
  }
}
