        {
          "name": "devices",
          "title": "Find devices by model",
          "description": "Return the list of individual physical devices matching one or more (brand, model) pairs\nfor which we have battery statistics. Each entry in the returned list describes ONE specific\ndevice (identified by its own `device_uid`) and the metrics on that entry are aggregates\ncomputed only from THAT device's own snapshot history — they are not aggregated across\ndevices. Two devices of the same brand and model will appear as two separate entries with\ntheir own independent metrics.\n\nPer-device fields include: brand, resolved model (street name), raw Android model, snapshot\ncount, activity window (first / last seen), average battery level, average / min / max\nbattery temperature in Celsius, awake-ratio, discharge speed and AC / USB / wireless charge\nspeed (hours per full 100% swing), Android SDK level, and a `url` pointing at the\npublic BatterySnap web page for the device's interactive battery history\n(https://www.battery-snap.com/device_history?device=<uid>).\n\nEach pair's model is matched case-insensitively against either the resolved street name\n(e.g. 'Galaxy S23') or the raw Android model identifier (e.g. 'SM-S911B').\nPass `fields` to keep only specific attributes per device and avoid bloated responses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional whitelist of attribute names to keep in each returned entry, used to shrink the response. When omitted or empty, all attributes documented in the output schema are returned. Unknown names are silently ignored."
              },
              "pairs": {
                "description": "One or more {brand, model} pairs to look up. Each pair fetches devices matching that brand and model.",
                "items": {
                  "properties": {
                    "brand": {
                      "description": "Lowercase Android device brand identifier (e.g. 'samsung', 'xiaomi'), matched case-insensitively against the device's brand.",
                      "type": "string"
                    },
                    "model": {
                      "description": "Model name matched case-insensitively against either the resolved street name (e.g. 'Galaxy S23') or the raw Android model identifier (e.g. 'SM-S911B').",
                      "type": "string"
                    }
                  },
                  "required": ["brand", "model"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["pairs"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "properties": {
                    "android_api_level": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Android SDK API level reported by the device (e.g. 28 = Pie, 34 = Android 14)."
                    },
                    "avg_ac_charge_hours_per_full_charge": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Average hours to charge a full 100% on an AC wall charger. Lower is faster."
                    },
                    "avg_battery_level_percent": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Mean battery charge level across all snapshots, in percent (normally 0-100; may be outside that range for corrupted samples). Null if no level samples."
                    },
                    "avg_battery_temperature_celsius": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Mean battery temperature in Celsius, across all snapshots. Null if no temperature samples."
                    },
                    "avg_discharge_hours_per_full_charge": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
