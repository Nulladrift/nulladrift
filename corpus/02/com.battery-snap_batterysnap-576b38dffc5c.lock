        {
          "name": "devices",
          "title": "Find devices by model",
          "description": "Return the list of individual physical devices matching one or more (brand, model) pairs\nfor which we have battery statistics. Each entry in the returned list describes ONE specific\ndevice (identified by its own `device_uid`) and the metrics on that entry are aggregates\ncomputed only from THAT device's own snapshot history — they are not aggregated across\ndevices. Two devices of the same brand and model will appear as two separate entries with\ntheir own independent metrics.\n\nEach entry has: brand (lowercase brand, e.g. 'samsung'), device_uid (this device's id, for device_summary / device_ranking), url (public page with the device's battery history), model (model name, e.g. 'Galaxy S23'), raw_model (Build.MODEL code, e.g. 'SM-S911B'), snapshot_count (number of battery readings, more = more reliable), battery_level_pct (average charge level, %), temperature_c (average battery temperature, C), min_temperature_c (coldest battery temperature, C), max_temperature_c (hottest battery temperature, C), awake_ratio (fraction of time awake / screen-on, 0..1), discharge_hours (discharge time / battery life, hours per 100%, higher = longer), ac_charge_hours (AC charge time, hours per 100%, lower = faster), usb_charge_hours (USB charge time, hours per 100%, lower = faster), wireless_charge_hours (wireless charge time, hours per 100%, lower = faster), android_api_level (Android SDK level, e.g. 34 = Android 14).\n\nEach pair's model is matched case-insensitively against either the resolved street name\n(e.g. 'Galaxy S23') or the raw Android model identifier (e.g. 'SM-S911B').\nPass `fields` to keep only specific attributes per device and avoid bloated responses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Attributes to keep in each returned entry, to shrink the response. Omit (or pass an empty list) for all of them. Names: brand (lowercase brand, e.g. 'samsung'), device_uid (this device's id, for device_summary / device_ranking), url (public page with the device's battery history), model (model name, e.g. 'Galaxy S23'), raw_model (Build.MODEL code, e.g. 'SM-S911B'), snapshot_count (number of battery readings, more = more reliable), battery_level_pct (average charge level, %), temperature_c (average battery temperature, C), min_temperature_c (coldest battery temperature, C), max_temperature_c (hottest battery temperature, C), awake_ratio (fraction of time awake / screen-on, 0..1), discharge_hours (discharge time / battery life, hours per 100%, higher = longer), ac_charge_hours (AC charge time, hours per 100%, lower = faster), usb_charge_hours (USB charge time, hours per 100%, lower = faster), wireless_charge_hours (wireless charge time, hours per 100%, lower = faster), android_api_level (Android SDK level, e.g. 34 = Android 14).",
                "items": {
                  "enum": ["brand", "device_uid", "url", "model", "raw_model", "snapshot_count", "battery_level_pct", "temperature_c", "min_temperature_c", "max_temperature_c", "awake_ratio", "discharge_hours", "ac_charge_hours", "usb_charge_hours", "wireless_charge_hours", "android_api_level"],
                  "type": "string"
                },
                "type": "array"
              },
              "pairs": {
                "description": "One or more {brand, model} pairs to look up. Each pair fetches devices matching that brand and model.",
                "items": {
                  "properties": {
                    "brand": {
                      "description": "Lowercase Android device brand identifier (e.g. 'samsung', 'xiaomi'), matched case-insensitively against the device's brand.",
                      "type": "string"
                    },
                    "model": {
                      "description": "Model name matched case-insensitively against either the resolved street name (e.g. 'Galaxy S23') or the raw Android model identifier (e.g. 'SM-S911B').",
                      "type": "string"
                    }
                  },
                  "required": ["brand", "model"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["pairs"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "properties": {
                    "ac_charge_hours": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Average hours to charge a full 100% on an AC wall charger. Lower is faster."
                    },
                    "android_api_level": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Android SDK API level reported by the device (e.g. 28 = Pie, 34 = Android 14)."
                    },
                    "awake_ratio": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Fraction of observed time the device was awake / screen-on (normally between 0 and 1)."
                    },
                    "battery_level_pct": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Mean battery charge level across all snapshots, in percent (normally 0-100; may be outside that range for corrupted samples). Null if no level samples."
                    },
                    "brand": {
                      "description": "Lowercase Android device brand identifier this device belongs to (e.g. 'samsung', 'xiaomi').",
                      "type": "string"
                    },
                    "device_uid": {
                      "description": "Stable UUID identifying this device across snapshots.",
                      "type": "string"
                    },
                    "discharge_hours": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Average hours to discharge a full 100% while running on battery (e.g. 40 means the battery lasts ~40 h from full to empty at this device's usage). Higher is better battery life."
                    },
                    "max_temperature_c": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Hottest battery temperature in Celsius observed across all snapshots for this device. Sustained high values are a battery-health concern. Null if no temperature samples."
                    },
                    "min_temperature_c": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Coldest battery temperature in Celsius observed across all snapshots for this device. Null if no temperature samples."
                    },
                    "model": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Human-readable model name resolved for this device (e.g. 'Galaxy S23', 'Pixel 7a'). Null when the model could not be resolved from the raw Android identifiers."
                    },
                    "raw_model": {
                      "description": "Raw Android model identifier reported by the device (e.g. 'SM-G960F'). This is the value the device sends in Build.MODEL.",
                      "type": "string"
                    },
                    "snapshot_count": {
                      "description": "Number of battery snapshots recorded for this device. Higher values mean the per-device aggregates are based on more samples and are more reliable.",
                      "type": "integer"
                    },
                    "temperature_c": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Mean battery temperature in Celsius, across all snapshots. Null if no temperature samples."
                    },
                    "url": {
                      "description": "Public BatterySnap web page showing this device's interactive battery history, e.g. https://www.battery-snap.com/device_history?device=<uid>. Locale-agnostic — server 301-redirects to the visitor's locale.",
                      "type": "string"
                    },
                    "usb_charge_hours": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Average hours to charge a full 100% over USB (e.g. a computer port). Typically slower than AC."
                    },
                    "wireless_charge_hours": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Average hours to charge a full 100% wirelessly. Null if the device never charged wirelessly."
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find devices by model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
