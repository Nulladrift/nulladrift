        {
          "name": "top_devices",
          "title": "Rank devices by metric",
          "description": "Rank INDIVIDUAL devices by any battery metric — the general-purpose\nleaderboard. Use it for 'which phones run hottest / last longest / charge\nfastest', optionally narrowed to one brand and/or model. Returns at most\n`limit` rows, so it answers superlative questions in a single small call\ninstead of enumerating the fleet.\n\nRanking is over each device's own lifetime aggregate. Pair the metric with\nthe right `order`: e.g. hottest = temperature_c + desc, fastest AC charging\n= ac_charge_hours + asc, best battery life = discharge_hours + desc.\nThere is no region filter here: regional questions go to the aggregates\n(`region_summary`, `top_models`, `fleet_summary`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional lowercase brand filter. When omitted, devices from any brand are ranked together."
              },
              "limit": {
                "default": 10,
                "description": "Number of devices to return, 1..100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "description": "Which battery metric to rank on. One of: 'temperature_c' (mean battery temperature, C), 'max_temperature_c' / 'min_temperature_c' (hottest / coldest ever seen, C), 'battery_level_pct' (mean charge level, 0-100), 'discharge_hours' (hours to drain a full 100% - HIGHER means longer battery life), 'ac_charge_hours' / 'usb_charge_hours' / 'wireless_charge_hours' (hours to charge a full 100% on that source - LOWER means faster charging), 'awake_ratio' (fraction of time awake / screen-on, 0..1), 'snapshot_count' (how much data the device contributed), 'uptime_hours' (longest single uptime between reboots).",
                "type": "string"
              },
              "min_snapshots": {
                "default": 100,
                "description": "Ignore devices with fewer snapshots than this, rounded down to a power of ten. Defaults to 100, which filters out barely-sampled devices whose averages are meaningless. Lower it only when a query returns too few rows.",
                "minimum": 0,
                "type": "integer"
              },
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional model filter — matches resolved street name or raw Build.MODEL, case-insensitive. When omitted, no model filter applies."
              },
              "order": {
                "default": "desc",
                "description": "'desc' (default) ranks the highest values first, 'asc' the lowest. Pick the direction that matches the question: fastest charging is ac_charge_hours + asc; longest battery life is discharge_hours + desc.",
                "pattern": "^(asc|desc)$",
                "type": "string"
              }
            },
            "required": ["metric"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "properties": {
                    "brand": {
                      "description": "Lowercase Android brand identifier.",
                      "type": "string"
                    },
                    "device_uid": {
                      "description": "Stable UUID identifying this device; feed it to `device_summary` or `device_ranking`.",
                      "type": "string"
                    },
                    "model": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Resolved model name (street name), e.g. 'Galaxy S23'."
                    },
                    "raw_model": {
                      "description": "Raw Build.MODEL identifier reported by the device.",
                      "type": "string"
                    },
                    "snapshot_count": {
                      "description": "Snapshots behind this device's aggregate — low counts mean a noisy value.",
                      "type": "integer"
                    },
                    "url": {
                      "description": "Public BatterySnap page with this device's interactive battery history.",
                      "type": "string"
                    },
                    "value": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The requested metric's value for this device, in the unit documented for that metric."
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rank devices by metric"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:61c261f5369accd669dbd7fd7c79573920e641ba8fb5d82da3277de7adb870bd"
