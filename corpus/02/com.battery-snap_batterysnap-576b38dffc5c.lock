{
  "lockfileVersion": 2,
  "subjects": {
    "com.battery-snap/batterysnap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.battery-snap.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "BatterySnap",
        "version": "1.0.2",
        "websiteUrl": "https://www.battery-snap.com/en/mcp"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "\nRead-only battery usage statistics for Android devices, aggregated from the\nbattery snapshots uploaded by devices running the BatterySnap app.\n\nWhich tool answers what:\n* A phone named in free text -> `search` resolves it to the canonical brand /\n  model identifiers. Every other tool matches exactly, so a guessed spelling\n  returns an empty list rather than an error.\n* Superlatives (\"which phone lasts longest / runs hottest / charges fastest\")\n  -> `top_models` (per model, outlier-resistant) or `top_devices` (per physical\n  device), in one call rather than `models` + one `model_summary` per model.\n* \"Is my phone normal / better than others?\" -> `device_ranking`, which returns\n  the device's percentile against its own model AND against the whole fleet in\n  one call.\n* Baselines and distributions -> `device_summary`, `model_summary`,\n  `fleet_summary`. Dataset size and ingest rate -> `fleet_totals`.\n* Regional questions (\"battery life in India vs Germany\", \"which continent\n  runs hottest\") -> `region_summary` (one row per continent or country), or\n  the `country` / `continent` filter on `fleet_summary`, `model_summary` and\n  `top_models`. The region is derived from the time zone the phone is set to\n  (not GPS / IP); scopes under 5 devices are refused. Regions exist only as\n  aggregates: per-device outputs carry no time zone, country or continent.\n* `brands` and `models` are catalogue listings and can be very long: pass\n  `limit` (and `offset` to page) and use `fields` to keep responses small.\n\nUnits: charge and discharge times are HOURS PER FULL 100% swing (discharge 40 =\nthe battery lasts about 40 h from full to empty; ac charge 2 = about 2 h from\nempty to full). Temperatures are Celsius. awake_ratio is a 0..1 fraction.\nAggregates backed by few snapshots or few devices are noisy — check\n`snapshot_count` / `device_count` before making a strong claim.\n",
      "tools": [
        {
          "name": "brands",
          "title": "List brands",
          "description": "Return the mobile devices brands for which we have battery statistics,\nalong with the number of distinct models, the number of devices recorded per brand,\nand the largest single-model device count within the brand (`max_devices_per_model`).\nEach entry also includes a `url` to the public BatterySnap web page for the brand\n(e.g. https://www.battery-snap.com/brands/samsung).\nPass `min_device_count` / `max_device_count` and `min_model_count` / `max_model_count`\nto filter brands by recorded-device and distinct-model counts.\nPass `fields` to keep only specific attributes in each entry.\nThe full list is long: pass `limit` (and `offset` to page) unless you really\nneed every brand, and prefer `search` when resolving one brand by name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional whitelist of attribute names to keep in each returned entry, used to shrink the response. When omitted or empty, all attributes documented in the output schema are returned. Unknown names are silently ignored."
              },
              "limit": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Return at most this many entries. Omit for no cap — but the unbounded list can be very large, so prefer a limit."
              },
              "max_device_count": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Drop entries with more than this many recorded devices. Use to skip very common entries. Omit for no upper bound."
              },
              "max_model_count": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Drop brands with more than this many distinct models. Omit for no upper bound."
              },
              "min_device_count": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Drop entries with fewer than this many recorded devices. Defaults to 1 (keep all)."
              },
              "min_model_count": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Drop brands with fewer than this many distinct models. Defaults to 0 (keep all)."
              },
              "offset": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Skip this many entries before returning results — use with `limit` to page through a long list. Defaults to 0."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "properties": {
                    "brand": {
                      "description": "Lowercase Android device brand identifier (e.g. 'samsung', 'xiaomi').",
                      "type": "string"
                    },
                    "device_count": {
                      "description": "Number of individual devices of this brand that reported battery snapshots.",
                      "type": "integer"
                    },
                    "max_devices_per_model": {
                      "description": "Largest number of devices recorded for a single model within this brand (the most popular model's device count). 0 when the brand has no device with a known model.",
                      "type": "integer"
                    },
                    "model_count": {
                      "description": "Number of distinct device models recorded for this brand.",
                      "type": "integer"
                    },
                    "url": {
                      "description": "Public BatterySnap web page listing this brand's models and devices. Locale-agnostic — the server 301-redirects to the visitor's detected locale.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List brands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:959260434dcf1d35a54b0d5ff189b284f584967a262360e1067786cddf23dc35"
        },
        {
          "name": "device_ranking",
          "title": "Compare a device to its peers",
          "description": "Answer 'is MY phone normal?' — rank one device's metric against other\ndevices of the same model AND against the whole fleet, in one call. Returns\nthe device's value, its 1-based rank, its percentile, and the cohort\nmedian / mean / min / max for both cohorts.\n\nPrefer this over fetching `device_summary` + `model_summary` and comparing\nby hand: it is a single call and gives the percentile directly. The model\ncohort is the meaningful one for 'is this device degraded'; the fleet cohort\nputs the model itself in context.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "device_uid": {
                "description": "Stable device UUID returned by `devices`, `top_devices` or the share flow.",
                "type": "string"
              },
              "metric": {
                "default": "discharge_hours",
                "description": "Which battery metric to rank on. One of: 'temperature_c' (mean battery temperature, C), 'max_temperature_c' / 'min_temperature_c' (hottest / coldest ever seen, C), 'battery_level_pct' (mean charge level, 0-100), 'discharge_hours' (hours to drain a full 100% - HIGHER means longer battery life), 'ac_charge_hours' / 'usb_charge_hours' / 'wireless_charge_hours' (hours to charge a full 100% on that source - LOWER means faster charging), 'awake_ratio' (fraction of time awake / screen-on, 0..1), 'snapshot_count' (how much data the device contributed), 'uptime_hours' (longest single uptime between reboots).",
                "type": "string"
              }
            },
            "required": ["device_uid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brand": {
                "description": "Lowercase Android brand identifier.",
                "type": "string"
              },
              "device_uid": {
                "description": "The device that was ranked.",
                "type": "string"
              },
              "fleet": {
                "description": "Rank against every device in the fleet, all models mixed.",
                "properties": {
                  "cohort_size": {
                    "description": "Number of devices in this cohort that have a value for the metric.",
                    "type": "integer"
                  },
                  "max": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Highest value in the cohort."
                  },
                  "mean": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cohort arithmetic mean."
                  },
                  "median": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cohort median — the fair 'typical' value to compare against."
                  },
                  "min": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Lowest value in the cohort."
                  },
                  "percentile": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Fraction of the cohort scoring strictly BELOW this device (0..1). 0.9 means it is higher than 90% of the cohort — whether that is good or bad depends on the metric."
                  },
                  "rank": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "1-based rank of this device within the cohort, 1 = highest value. Null when the device has no value."
                  },
                  "value": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "This device's value for the metric. Null when the device has no value recorded."
                  }
                },
                "type": "object"
              },
              "metric": {
                "description": "The metric that was ranked.",
                "type": "string"
              },
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Resolved model name (street name)."
              },
              "model_cohort": {
                "description": "Rank against other devices of the SAME brand + model — the fair like-for-like comparison.",
                "properties": {
                  "cohort_size": {
                    "description": "Number of devices in this cohort that have a value for the metric.",
                    "type": "integer"
                  },
                  "max": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Highest value in the cohort."
                  },
                  "mean": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cohort arithmetic mean."
                  },
                  "median": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cohort median — the fair 'typical' value to compare against."
                  },
                  "min": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Lowest value in the cohort."
                  },
                  "percentile": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Fraction of the cohort scoring strictly BELOW this device (0..1). 0.9 means it is higher than 90% of the cohort — whether that is good or bad depends on the metric."
                  },
                  "rank": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "1-based rank of this device within the cohort, 1 = highest value. Null when the device has no value."
                  },
                  "value": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "This device's value for the metric. Null when the device has no value recorded."
                  }
                },
                "type": "object"
              },
              "raw_model": {
                "description": "Raw Build.MODEL identifier.",
                "type": "string"
              },
              "snapshot_count": {
                "description": "Snapshots behind this device's aggregate.",
                "type": "integer"
              },
              "url": {
                "description": "Public BatterySnap page with this device's interactive battery history.",
                "type": "string"
              },
              "value": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "This device's value for the metric."
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare a device to its peers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
