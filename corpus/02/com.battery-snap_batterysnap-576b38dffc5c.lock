        {
          "name": "models",
          "title": "List models",
          "description": "Return the mobile devices models of the given brands for which we have battery statistics,\nalong with the brand each model belongs to, the number of devices recorded, the average\nbattery temperature in Celsius, and the min/max Android SDK level per model.\n\nEach entry is grouped by the resolved street name (e.g. 'Galaxy S23'), which may cover\nseveral raw Android Build.MODEL identifiers (carrier variants, regional SKUs, …). For\nURL building, every entry also exposes:\n  * `raw_model_code`: a representative raw Build.MODEL identifier (the lexicographically\n    smallest one among devices grouped under this street name), or null if no device\n    reported a non-empty model code.\n  * `url`: the public BatterySnap web page for the model, e.g.\n    https://www.battery-snap.com/brands/samsung/models/SM-S911B. Built from `brand` + `raw_model_code`; null when either is null;\n    `raw_model_code` is null. The page lists all devices reporting that exact raw model.\n\nPass `min_device_count` / `max_device_count` to filter models by how many devices were recorded.\nFor 'which models have the most devices' questions, pass sort='device_count' with a small\n`limit` (and typically fields=['brand', 'model', 'device_count', 'url']) instead of fetching\nand sorting the full list.\nPass `fields` to keep only specific attributes in each entry.\nOmit `brands` (or pass an empty list) to return models across every brand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brands": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "One or more lowercase Android device brand identifiers (e.g. ['samsung', 'xiaomi']) to fetch models for. Matched case-insensitively. Omit (or pass an empty list) to return models across all brands."
              },
              "fields": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional whitelist of attribute names to keep in each returned entry, used to shrink the response. When omitted or empty, all attributes documented in the output schema are returned. Unknown names are silently ignored."
              },
              "limit": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Return at most this many models (applied after filtering and sorting). Omit for no cap."
              },
              "max_device_count": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Drop entries with more than this many recorded devices. Use to skip very common entries. Omit for no upper bound."
              },
              "min_device_count": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Drop entries with fewer than this many recorded devices. Defaults to 1 (keep all)."
              },
              "offset": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Skip this many entries before returning results — use with `limit` to page through a long list. Defaults to 0."
              },
              "sort": {
                "default": "name",
                "description": "Sort order of the returned models: 'name' (default, alphabetical by brand then model) or 'device_count' (most recorded devices first). Combine sort='device_count' with `limit` to answer 'most popular models' questions in one small call.",
                "pattern": "^(name|device_count)$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "properties": {
                    "avg_battery_temperature_celsius": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Average battery temperature in Celsius, weighted across all snapshots of all devices of this model. Null when no temperature samples were recorded."
                    },
                    "brand": {
                      "description": "Lowercase Android device brand identifier this model belongs to (e.g. 'samsung', 'xiaomi').",
                      "type": "string"
                    },
                    "device_count": {
                      "description": "Number of individual devices of this model that reported battery snapshots.",
                      "type": "integer"
                    },
                    "max_android_api_level": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Highest Android API level reported by any device of this model."
                    },
                    "min_android_api_level": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Lowest Android API level reported by any device of this model (e.g. 28 = Android 9 Pie)."
                    },
                    "model": {
                      "description": "Human-readable model name (e.g. 'Galaxy S23', 'Pixel 7a'). Resolved from the device's street_name column.",
                      "type": "string"
                    },
                    "raw_model_code": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Representative raw Android Build.MODEL identifier (e.g. 'SM-S911B') for this model — the lexicographically smallest model code among all devices grouped under this street name. Multiple raw codes can map to one street name (e.g. carrier variants); this picks one as canonical for URL construction. Null when no device has a non-empty model code."
                    },
                    "url": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Public BatterySnap web page for this model, e.g. https://www.battery-snap.com/brands/samsung/models/SM-S911B. Built from `brand` + `raw_model_code`; null when either is null. Locale-agnostic (server picks locale via redirect)."
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:ea6348b9d8832e71bce0888721f19e7e38f701b147eceaa6e30d5c89291b65d5"
