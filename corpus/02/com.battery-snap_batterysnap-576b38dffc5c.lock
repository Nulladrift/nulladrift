        {
          "name": "models",
          "title": "List models",
          "description": "List the phone models BatterySnap has battery statistics for (of one `brand`, several `brands` or all),\nmost devices first, with each model's number of devices, average battery temperature in Celsius, median awake\nratio, median discharge and charge hours per 100% and Android SDK range (50 models unless `limit` says\notherwise; `offset` pages).\n\nEach entry is grouped by the resolved street name (e.g. 'Galaxy S23'), which may cover\nseveral raw Android Build.MODEL identifiers (carrier variants, regional SKUs, …). For\nURL building, every entry also exposes:\n  * `raw_model_code`: a representative raw Build.MODEL identifier (the most common one\n    among devices grouped under this street name, the smallest on a tie), or null if no\n    device reported a non-empty model code.\n  * `url`: the public BatterySnap web page for the model, e.g.\n    https://www.battery-snap.com/brands/samsung/models/SM-S911B. Built from `brand` + `raw_model_code`; null when either is null.\n    The page lists the devices reporting that exact raw model and links to the other variants.\n\nPass `min_device_count` / `max_device_count` to filter models by how many devices were recorded.\nPass `sort` to order by another value (temperature, awake ratio, discharge / charge hours, API levels) or by\nname, e.g. sort=[{\"by\": \"model\"}]. Models with no value sort last either way.\nFor battery life or charging rankings, `top_models` is still the better tool: it skips models backed by too\nfew devices (`min_devices`).\nPass `fields` to keep only specific attributes in each entry\n(typically fields=['brand', 'model', 'device_count', 'url']).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "One lowercase brand identifier (e.g. 'samsung'), as in the other tools. Use `brands` for several.",
                "type": "string"
              },
              "brands": {
                "description": "Several lowercase brand identifiers (e.g. ['samsung', 'xiaomi']) to fetch models for. Matched case-insensitively. Omit `brand` and `brands` to list models across all brands.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fields": {
                "description": "Attributes to keep in each returned entry, to shrink the response. Omit (or pass an empty list) for all of them.",
                "items": {
                  "enum": ["brand", "model", "raw_model_code", "url", "device_count", "temperature_c", "awake_ratio", "discharge_hours", "ac_charge_hours", "usb_charge_hours", "wireless_charge_hours", "min_android_api_level", "max_android_api_level"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Return at most this many models, after filtering and sorting (50 when omitted).",
                "minimum": 1,
                "type": "integer"
              },
              "max_device_count": {
                "description": "Drop entries with more than this many recorded devices. Use to skip very common entries. Omit for no upper bound.",
                "minimum": 0,
                "type": "integer"
              },
              "min_device_count": {
                "description": "Drop entries with fewer than this many recorded devices. Defaults to 1 (keep all).",
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many entries before returning results — use with `limit` to page through a long list. Defaults to 0.",
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "description": "Sort keys, applied in list order: each next key only orders entries the keys before it tie, e.g. [{\"by\": \"device_count\"}] = most devices first, [{\"by\": \"temperature_c\", \"order\": \"desc\"}, {\"by\": \"device_count\"}]. Missing values go last. Sorting runs before `limit` / `offset`, so [{\"by\": \"device_count\"}] with limit=10 is the 10 with the most devices. Omit for most devices first; brand then model always breaks the ties left.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "by": {
                      "description": "Value to sort on.",
                      "enum": ["brand", "model", "device_count", "temperature_c", "awake_ratio", "discharge_hours", "ac_charge_hours", "usb_charge_hours", "wireless_charge_hours", "min_android_api_level", "max_android_api_level"],
                      "type": "string"
                    },
                    "order": {
                      "description": "'asc' (smallest / A first) or 'desc' (largest / Z first). When omitted: 'desc' for counts and other numbers, 'asc' for names.",
                      "enum": ["asc", "desc"],
                      "type": "string"
                    }
                  },
                  "required": ["by"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "properties": {
                    "ac_charge_hours": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Median across this model's devices of the hours to charge a full 100% on an AC wall charger. Lower is faster."
                    },
                    "awake_ratio": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Median across this model's devices of the fraction of time awake / screen-on (0..1). Null when no device has a value."
                    },
                    "brand": {
                      "description": "Lowercase Android device brand identifier this model belongs to (e.g. 'samsung', 'xiaomi').",
                      "type": "string"
                    },
                    "device_count": {
                      "description": "Number of individual devices of this model that reported battery snapshots.",
                      "type": "integer"
                    },
                    "discharge_hours": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
