        {
          "name": "search",
          "title": "Search brands and models",
          "description": "Resolve free-form user text into the canonical brand / model identifiers\nthe other tools expect. Meant for phones named in free text: the other tools\nmatch brands and models exactly, so a guessed spelling returns an empty\nlist.\n\nMatching is substring-based and case-insensitive over brand, resolved model\nname and raw Build.MODEL, ranked by exact match then popularity.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum brand hits and model hits to return (each list is capped separately).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text: a brand ('samsug'), a model name ('pixel 8'), a raw Build.MODEL code ('SM-S911B'), or both ('samsung galaxy s23').",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brands": {
                "description": "Matching brands, best match first.",
                "items": {
                  "properties": {
                    "brand": {
                      "description": "Canonical lowercase brand identifier to pass to the other tools.",
                      "type": "string"
                    },
                    "device_count": {
                      "description": "Devices recorded for this brand.",
                      "type": "integer"
                    },
                    "url": {
                      "description": "Public BatterySnap page for the brand.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "models": {
                "description": "Matching models, best match first.",
                "items": {
                  "properties": {
                    "brand": {
                      "description": "Canonical lowercase brand identifier.",
                      "type": "string"
                    },
                    "device_count": {
                      "description": "Devices recorded for this model.",
                      "type": "integer"
                    },
                    "model": {
                      "description": "Canonical resolved model name (street name) to pass to the other tools.",
                      "type": "string"
                    },
                    "raw_model_code": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Representative raw Build.MODEL identifier."
                    },
                    "url": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Public BatterySnap page for the model; null when raw_model_code is null."
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "description": "The query that was resolved.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search brands and models"
          },
