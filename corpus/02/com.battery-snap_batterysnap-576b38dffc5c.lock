        {
          "name": "top_devices",
          "title": "Rank devices by metric",
          "description": "Rank INDIVIDUAL devices by any battery metric — the general-purpose\nleaderboard. Use it for 'which phones run hottest / last longest / charge\nfastest', optionally narrowed to one brand and/or model. Returns at most\n`limit` rows, so it answers superlative questions in a single small call\ninstead of enumerating the fleet. Pair the metric with the right `order`:\nhottest = temperature_c + desc, fastest AC charging = ac_charge_hours + asc,\nbest battery life = discharge_hours + desc. To compare phones the user\nnames, call `model_summary` for each of them instead.\n\nRanking is over each device's own lifetime aggregate.\nThere is no region filter here: regional questions go to the aggregates\n(`region_summary`, `top_models`, `fleet_summary`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Optional lowercase brand filter. When omitted, devices from any brand are ranked together.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of devices to return, 1..100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
