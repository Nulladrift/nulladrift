        },
        {
          "name": "device_summary",
          "title": "Device battery summary",
          "description": "Return aggregated battery metrics for ONE specific device: average / min / max\ntemperature, average battery level, mean charge time per power source (AC, USB,\nwireless) and mean discharge time over a recent (~2 weeks) and a long (~2 months)\nwindow, plus awake ratio and basic device info. Also includes `url`: the public\nBatterySnap web page for this device's interactive battery history\n(https://www.battery-snap.com/device_history?device=<uid>). All values are pre-computed\nfrom the device's full snapshot history — no raw timeseries is returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "device_uid": {
                "description": "Stable device UUID returned by the `devices` tool.",
                "type": "string"
              }
            },
            "required": ["device_uid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "android_api_level": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Android SDK level (e.g. 34 = Android 14)."
              },
              "avg_battery_level_pct": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Mean battery charge level across all snapshots (0-100)."
              },
              "avg_temperature_c": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Mean battery temperature in Celsius across all snapshots."
              },
              "awake_ratio": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Fraction of observed time the device was awake / screen-on (0..1)."
              },
              "brand": {
                "description": "Lowercase Android brand identifier.",
                "type": "string"
              },
              "device_uid": {
                "description": "Stable UUID identifying this device.",
                "type": "string"
              },
