        {
          "name": "region_summary",
          "title": "Battery stats by region",
          "description": "Compare battery behaviour across regions in one call: one entry per\ncontinent or per country, each with the same mean / median / p25 / p75 /\nmin / max blocks as `fleet_summary` (temperature, level, discharge and\ncharge hours, awake ratio). Narrow with `brand` / `model` (e.g. how one\nmodel fares per continent) or with `continent` (e.g. group_by='country'\nwithin 'Africa').\n\nThe region is derived from the time zone the phone is set to (not GPS / IP),\nso travellers and manual settings blur it. Regions with fewer than 5 devices\nare left out and only counted (`suppressed_*`), as are devices whose time\nzone names no place (`unlocated_device_count`); check each group's\n`device_count` before comparing — small groups are noisy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional lowercase brand filter."
              },
              "continent": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional continent, case-insensitive: 'Africa', 'Antarctica', 'Asia', 'Europe', 'North America', 'Oceania' or 'South America'. Keeps only devices whose time zone lies there. Combine with `country` for an intersection."
              },
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional ISO 3166 alpha-2 country code (e.g. 'FR', 'IN', 'US'), case-insensitive. Keeps only devices whose time zone belongs to that country. The region comes from the phone's time-zone setting, not GPS / IP."
              },
              "group_by": {
                "default": "continent",
                "description": "'continent' (default) or 'country' (ISO 3166 alpha-2).",
                "pattern": "^(continent|country)$",
                "type": "string"
              },
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional model filter — matches resolved street name or raw Build.MODEL, case-insensitive."
              }
            },
            "type": "object"
          },
