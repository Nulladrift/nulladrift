        {
          "name": "compare_models",
          "title": "Compare phone models",
          "description": "Compare phone models or brands side by side in one call: resolves each name like `search`, then returns each\none's median battery life, charge times per charger, temperature and awake ratio, with its device count. Use it\nfor any question comparing two or more phones or brands, or one against the typical phone (`include_fleet`).\n\nThe closest model is used for each name (exact name first, then the most devices); `other_matches` lists the\nrest so the answer can say which one was used. Durations are hours per full 100 %.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_fleet": {
                "default": false,
                "description": "Also return the typical phone (all devices) as a reference, for 'better than average' questions.",
                "type": "boolean"
              },
              "queries": {
                "description": "The phone models or brands named in free text, e.g. ['galaxy s23', 'pixel 8'] or ['tecno', 'samsung']: two to four, or one with include_fleet.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["queries"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "fleet": {
                "description": "The typical phone (median of all devices); only with include_fleet.",
                "properties": {
                  "ac_charge_hours": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Median AC charge time, hours per 100 %; fewer = charges faster."
                  },
                  "awake_ratio": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Median share of time awake, 0..1."
                  },
                  "battery_level_pct": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Median battery level, %."
                  },
                  "brand": {
                    "description": "Canonical lowercase brand identifier.",
                    "type": "string"
                  },
                  "device_count": {
                    "description": "Devices behind the figures; under 5 = uncertain.",
                    "type": "integer"
                  },
                  "discharge_hours": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Median battery life on one charge, hours per 100 %; more = lasts longer."
                  },
                  "error": {
                    "description": "Why this phone has no figures (no match, no data).",
                    "type": "string"
                  },
                  "model": {
                    "description": "Resolved model name (street name) the figures are for; 'all <brand> phones' for a brand.",
                    "type": "string"
                  },
                  "other_matches": {
                    "description": "Other models the name also matched, with their device counts.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "query": {
                    "description": "The phone name as asked.",
                    "type": "string"
                  },
                  "scope": {
                    "description": "'model': one model's devices; 'brand': all the brand's devices (a name with a brand and no model number, e.g. 'TECNO phones').",
                    "enum": ["model", "brand"],
                    "type": "string"
                  },
                  "temperature_c": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Median battery temperature, °C; lower = runs cooler."
                  },
                  "url": {
                    "anyOf": [
                      {
                        "type": "string"
