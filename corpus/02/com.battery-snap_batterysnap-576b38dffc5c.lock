        {
          "name": "top_models",
          "title": "Rank models by metric",
          "description": "Rank device MODELS by any battery metric, aggregating across every device\nof that model. This is the tool for 'which phone model has the best battery\nlife', 'which models charge fastest', 'which run hottest' — questions that\nwould otherwise need one `model_summary` call per model.\n\nOrdering is by the per-model MEDIAN of the metric (outlier-resistant); the\nmean is returned alongside. Use `brand` to rank within one manufacturer and\n`min_devices` to require a minimum sample size. `country` / `continent` rank\nthe models as they behave in one region (e.g. heat in hot climates).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional lowercase brand filter. When omitted, devices from any brand are ranked together."
              },
              "continent": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
