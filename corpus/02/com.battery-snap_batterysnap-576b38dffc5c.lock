        {
          "name": "top_models",
          "title": "Rank models by metric",
          "description": "Rank device MODELS by any battery metric, aggregating across every device\nof that model. This is the tool for 'which phone model has the best battery\nlife', 'which models charge fastest', 'which run hottest' — questions that\nwould otherwise need one `model_summary` call per model. Pair the metric\nwith the right `order`: hottest = temperature_c + desc, fastest AC charging\n= ac_charge_hours + asc, best battery life = discharge_hours + desc. To\ncompare phones the user names, call `model_summary` for each of them instead.\n\nOrdering is by the per-model MEDIAN of the metric (outlier-resistant); the\nmean is returned alongside. Use `brand` to rank within one manufacturer and\n`min_devices` to require a minimum sample size. `country` / `continent` rank\nthe models as they behave in one region (e.g. heat in hot climates).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Optional lowercase brand filter. When omitted, devices from any brand are ranked together.",
                "type": "string"
              },
              "continent": {
                "description": "Optional continent. Keeps only devices whose time zone lies there. Combine with `country` for an intersection.",
                "enum": ["Africa", "Antarctica", "Asia", "Europe", "North America", "Oceania", "South America"],
                "type": "string"
              },
              "country": {
                "description": "Optional ISO 3166 alpha-2 country code (e.g. 'FR', 'IN', 'US'), case-insensitive. Keeps only devices whose time zone belongs to that country. The region comes from the phone's time-zone setting, not GPS / IP.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of devices to return, 1..100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "description": "Which battery metric to rank on. One of: 'temperature_c' (mean battery temperature, C), 'max_temperature_c' / 'min_temperature_c' (hottest / coldest ever seen, C), 'battery_level_pct' (mean charge level, 0-100), 'discharge_hours' (hours to drain a full 100% - HIGHER means longer battery life), 'ac_charge_hours' / 'usb_charge_hours' / 'wireless_charge_hours' (hours to charge a full 100% on that source - LOWER means faster charging), 'awake_ratio' (fraction of time awake / screen-on, 0..1), 'snapshot_count' (how much data the device contributed), 'uptime_hours' (longest single uptime between reboots).",
                "enum": ["temperature_c", "max_temperature_c", "min_temperature_c", "battery_level_pct", "discharge_hours", "ac_charge_hours", "usb_charge_hours", "wireless_charge_hours", "awake_ratio", "snapshot_count", "uptime_hours"],
                "type": "string"
              },
              "min_devices": {
                "default": 3,
                "description": "Ignore models backed by fewer devices than this. Defaults to 3 so a single outlier phone cannot win a ranking. Raise it for more robust comparisons. Raised to at least 5 when a region filter is set.",
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "default": "desc",
                "description": "'desc' (default) ranks the highest values first, 'asc' the lowest. Pick the direction that matches the question: fastest charging is ac_charge_hours + asc; longest battery life is discharge_hours + desc.",
                "enum": ["asc", "desc"],
                "type": "string"
              }
            },
            "required": ["metric"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "properties": {
                    "brand": {
                      "description": "Lowercase Android brand identifier.",
                      "type": "string"
                    },
                    "device_count": {
                      "description": "Distinct devices of this model contributing a value.",
                      "type": "integer"
                    },
                    "mean_value": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Mean of the metric across the model's devices."
                    },
                    "median_value": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Median of the metric across the model's devices — the value the ranking is ordered by, as it resists outliers."
                    },
                    "model": {
                      "description": "Resolved model name (street name).",
                      "type": "string"
                    },
                    "raw_model_code": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Representative raw Build.MODEL identifier for URL building."
                    },
                    "snapshot_count": {
                      "description": "Total snapshots behind this model's devices.",
                      "type": "integer"
                    },
                    "url": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Public BatterySnap page for this model; null when raw_model_code is null."
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
