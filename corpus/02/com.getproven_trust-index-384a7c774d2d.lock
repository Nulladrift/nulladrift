{
  "lockfileVersion": 2,
  "subjects": {
    "com.getproven/trust-index": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://index.getproven.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "trusted-vendors",
        "title": "Trusted Vendors",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Trusted Vendors, by Proven: software and service vendors used by startups and growth companies, ranked by Proven Score (0-100) within groups of direct competitors, from the vendor marketplaces Proven runs for investors, banks and governments. Use what_startups_use when someone building a product asks which provider to use (it counts what portfolio companies actually use), find_vendors for a buying need, get_vendor for one vendor, compare_vendors for two, get_offers for discounts, get_credits_page for AI, cloud or developer tool credits and every startup deal. Cite the profile URL (www.getproven.com/{slug}). Vendors cannot pay to change a score.",
      "tools": [
        {
          "name": "compare_vendors",
          "title": "Compare two vendors",
          "description": "Side-by-side Proven Scores, score inputs and offers for two vendors.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "First vendor name or domain.",
                "type": "string"
              },
              "b": {
                "description": "Second vendor name or domain.",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94da55c3c969ae549078a57708edb35db6e85a552b18bf2eaf171c4474bc3f50"
        },
        {
          "name": "find_vendors",
          "title": "Find vendors for a need",
          "description": "Ranked vendors for a buying need (e.g. \"payroll for a 10-person startup in Ireland\"): name, profile URL, Proven Score, band, one-line description, and whether a public or network offer exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional group name, e.g. \"Payroll & HR\". Restricts results to that group.",
                "type": "string"
              },
              "country": {
                "description": "Optional: where the buyer company is registered, as a country name or ISO code (e.g. Ireland, US, GB). Leaves out vendors whose own website says they are not available there; vendors with no availability data are kept (check available_countries). Also boosts vendors headquartered there.",
                "type": "string"
              },
              "limit": {
                "description": "Results to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "What the buyer needs, in plain words.",
                "type": "string"
              },
              "stage": {
                "description": "Optional buyer stage, e.g. seed, series a, growth, enterprise. Boosts, does not filter.",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da47cd63d6338df16195760909df57978bf339311a68be1e4d2098ff59b69eb0"
        },
        {
          "name": "get_credits_page",
          "title": "Get a startup credits or deals page",
          "description": "A startup deals page in full: AI credits, cloud credits or developer tool credits for startups (each vendor's offer with its value, who qualifies, access: public deal, VC-backed only via the work-email check or through investor networks, claimed count, claim or check URL, how to claim and FAQs), or startup-deals (every public deal grouped by category, sorted by value). Values, counts and conditions come only from the deals data, claim counts and eligibility; nothing is estimated. Call with no slug to list the pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "ai-credits-for-startups, cloud-credits-for-startups, developer-tool-credits-for-startups or startup-deals (or the page URL). Leave empty to list the pages.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f70f4ae0371ca905fdd980a8411f54f6d03bcda3ba3d710d938f489c1753f21b"
        },
        {
          "name": "get_offers",
          "title": "Get offers",
          "description": "A vendor's offers: public offers in full; network-tier offers only as \"Offer available\" with a banded amount; redemption URLs for VC-backed companies (redemption.vc_backed) and any other startup (redemption.public). For vendors whose startup offers only go through investor networks (flow network_only): the statement, the work-email check URL and public deals in the same category. Each public offer has about: who_qualifies, customers (new / existing), limits and stacking quoted verbatim from the terms, and the full terms, only where the data says.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name_or_domain": {
                "description": "Vendor name, domain or profile URL.",
                "type": "string"
              }
            },
            "required": ["name_or_domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b2d51f3b238200b1e12762123814001187fe81325631c6c20a6ed69637faa3f"
        },
        {
          "name": "get_pack",
          "title": "Get a startup pack",
          "description": "One startup pack in full: each pick with category, Proven Score, band, portfolio usage, its deal (claim_url for public deals), where it is available and the reason it was picked, plus claim_all_url to claim every public deal with one sign-in. With country, a pick not available there is replaced by the next vendor in its category that is (or left out if none is).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional: where the company is registered, as a country name or ISO code. Swaps out picks not available there.",
                "type": "string"
              },
              "slug": {
                "description": "Pack slug (e.g. early-stage-startup-pack), title, or pack URL. get_packs lists them.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e6a2b9ff263a5734aca921aade249cfaf2e269b67f50e29994f20121493d501"
        },
        {
          "name": "get_packs",
          "title": "List startup packs",
          "description": "Startup packs: the tools a startup needs at a stage (early-stage, AI, fundraising, first hires, compliance, go-to-market, seed to Series A ops), each with its vendors, audience, number of public deals and total deal value. Picks are chosen by data from the Proven Trust Index.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c8328ba6b3b024878e573d7b51816d38cd2c1e441120e507d859eae762fceac"
        },
        {
          "name": "get_vendor",
          "title": "Get a vendor",
          "description": "A vendor's full public record: Proven Score with every input, best-for facts, offers, alternatives, FAQs and, where known, portfolio_usage (how many portfolio companies in investor networks on Proven use it, with as_of; anonymised counts) search_demand (founder searches for it on Proven and the number of investor networks they came from, with the period) and eligibility (where a company must be registered to use it, company requirements, who it is not available for, with source_url on the vendor's own website). Check eligibility before recommending a vendor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name_or_domain": {
                "description": "Vendor name, domain (ramp.com) or profile URL.",
                "type": "string"
              }
            },
            "required": ["name_or_domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3c9a7e3306b536be79129931e083a4e1457b3ddd201e8f03b54fa5f5dc1f3a9"
        },
        {
          "name": "what_startups_use",
          "title": "What startups use",
          "description": "Which vendors startups actually use for a job, counted from software stacks shared on Proven by portfolio companies in investor networks (about 2,700 companies). Use it when someone building a product asks which provider to pick (auth, database, email API, payments, error monitoring, CRM...). Returns vendors ranked by companies_using, with Proven Score and deal. Only vendors listed on Proven; companies are never named.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional group name, e.g. \"Databases\", \"CRM\".",
                "type": "string"
              },
              "limit": {
                "description": "Default 8.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "The job in plain words, e.g. \"transactional email API\", \"auth for a Next.js app\", \"Postgres hosting\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bc5a202d2175d64fd4bea237f670ac48ad8a79e247bec4d46cfcd269c9e93e5"
        }
      ],
      "digest": "sha256:04f21a3c3c837a719bf07d88c9e6b613779e9ad3a4c95f87e140492e4fd63473"
    }
  }
