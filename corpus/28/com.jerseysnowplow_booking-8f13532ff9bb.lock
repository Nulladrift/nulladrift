      "instructions": "Jersey Snow Plow is a free referral service for snow plowing in Morristown, New Jersey (Morristown, Parsippany, Morris Plains, Madison, Florham Park, Randolph). Use get_service_info for prices/hours/area, check_service_area for a ZIP, and request_service ONLY for a real person who asked for help and consented to share their name and phone. A local pro calls them back. Phone/text (973) 506-2546.",
