          },
          "digest": "sha256:a075f466011dd2cd0f83f48afabc1a19c08e81d56386c0eb75b48b3d0c0d6ba5"
        }
      ],
      "digest": "sha256:b1be2033ae671fb8337940c6151a1523c9523a758180df7fb757ff8ef6df8866"
    }
  }
