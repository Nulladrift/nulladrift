{
  "lockfileVersion": 2,
  "subjects": {
    "com.frameanyphoto/prints": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://frameanyphoto.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "frameanyphoto",
        "title": "FrameAnyPhoto",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Framed prints of public-domain art. search_works finds a work; get_print_options, quote_order, and create_checkout price and sell it (the buyer pays on Stripe). No sign-in.",
      "tools": [
        {
          "name": "create_checkout",
          "title": "Create checkout link",
          "description": "Create a Stripe Checkout pay link for this order. Returns message_for_user (one ready-to-send line with the link, price, and delivery time), payment_url, order_ref, and the store policies. Send message_for_user to your user in your reply: they open payment_url, enter the address, and pay on Stripe. This never charges a card. Rate-limited.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Optional buyer email to prefill",
                "maxLength": 254,
                "type": "string"
              },
              "frame": {
                "description": "frame_id from get_print_options. Default: the work's default frame",
                "maxLength": 120,
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "size": {
                "description": "size_id from get_print_options, or Small, Medium, Large. Default: the site default (Large when the scan allows)",
                "maxLength": 40,
                "type": "string"
              },
              "work": {
                "description": "Prefer ascii_id (the slug) from search_works or get_work; the id with or without its en dash, a /w/ URL, exact title, accession, or NASA ID also work",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["work"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b97425a2ef24b74d48086787a32d97212904e775e1234191a36d1a0aff93e24d"
        },
        {
          "name": "get_order_status",
          "title": "Order status",
          "description": "Checkout, payment, and shipping status for an order_ref from create_checkout. Returns no personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "order_ref": {
                "description": "order_ref from create_checkout",
                "maxLength": 255,
                "type": "string"
              }
            },
            "required": ["order_ref"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4bda75dfc399ab55328048e0bcc86399721ce8ff0df2dc3e2bb65bdaf267f92d"
        },
        {
          "name": "get_policies",
          "title": "Store policies",
          "description": "Store policies as JSON: shipping (free, US only, 14–21 days), returns (30-day money back by mail; buyer pays return shipping), payment (Stripe Checkout), sales tax, and contact.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Store policies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7491ed02c1e8ed27e79e0de332b078760e3454ef7d218d8a93b83aeb2c5c5f0"
        },
        {
          "name": "get_print_options",
          "title": "Print options",
          "description": "Sizes, frames, and prices the site offers for one work. Sizes respect the scan's resolution (100 PPI minimum). Prices include the frame and shipping; tax is added at checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "work": {
                "description": "Prefer ascii_id (the slug) from search_works or get_work; the id with or without its en dash, a /w/ URL, exact title, accession, or NASA ID also work",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["work"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Print options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e9ee21aaabe3852f5e325a3de318922f49681840ff13676254f2b399a1bbda7"
        },
        {
          "name": "get_work",
          "title": "Get work",
          "description": "Return one work by id, title, accession number, or NASA ID.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Exact id, title, accession, or NASA ID",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get work"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ceb60f714d8b167199c9f2335a658408ac24dd76b68b4d5306e4e17d004b902e"
        },
        {
          "name": "list_series",
          "title": "List series",
          "description": "List collection rows and how many works each contains.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce8c5efee447fd6423b1e61456cbc99f3707e715c621585df0c1fca4d5437e44"
        },
        {
          "name": "quote_order",
          "title": "Quote order",
          "description": "Price a framed print: unit price, subtotal, shipping, and total before tax, with a summary of the store policies. Ships to the US only; tax is calculated by Stripe at checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "frame": {
                "description": "frame_id from get_print_options. Default: the work's default frame",
                "maxLength": 120,
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "ship_to": {
                "additionalProperties": false,
                "description": "Optional. Checks that we ship there.",
                "properties": {
                  "country": {
                    "description": "ISO country code. Only US is accepted.",
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter state code",
                    "type": "string"
                  },
                  "zip": {
                    "description": "US ZIP code",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "size": {
                "description": "size_id from get_print_options, or Small, Medium, Large. Default: the site default (Large when the scan allows)",
                "maxLength": 40,
                "type": "string"
              },
              "work": {
                "description": "Prefer ascii_id (the slug) from search_works or get_work; the id with or without its en dash, a /w/ URL, exact title, accession, or NASA ID also work",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["work"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f31570a880f04f67506bca320bb1a314de8276c1b3ebc9433cf831eae44c1f6d"
        },
        {
          "name": "search_works",
          "title": "Search works",
          "description": "Search works by title, artist, series, NASA ID, or keywords. Returns compact records sorted by PPI.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 12,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search text, for example Bierstadt or Earthrise",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search works"
          },
