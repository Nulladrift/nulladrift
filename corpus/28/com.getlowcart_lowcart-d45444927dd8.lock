      "serverInfo": {
        "name": "lowcart",
        "title": "Lowcart delivered prices",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use find_delivered_price to compare what a shopper really pays for a product delivered to their country, and whether import duties are paid at checkout or billed at the door.",
      "tools": [
        {
          "name": "find_delivered_price",
          "title": "Find the cheapest delivered price",
          "description": "Finds the Shopify stores that deliver a product to a country and ranks them by the final total a shopper pays: item price, shipping to that country, the best confirmed code, sales tax or VAT, and import fees. Each total is read from the store's own checkout for that country (no order is placed), and every offer says where import duties are paid: none (ships locally), included in the price, paid at checkout, billed at the door (estimate added), may be billed at the door (not included), or unknown origin. Final totals rank first. Works for any product sold by Shopify stores: electronics, kitchen appliances, drinkware, shoes, clothing, fitness gear, toys, home goods, supplements, beauty and more. Amazon, Daraz, Sephora and other marketplace links are read for the product name only. Amounts are in US dollars with the local currency alongside. Use for questions like \"where is a Ninja CREAMi cheapest delivered to the US\", \"what will a Stanley Quencher 40 oz really cost delivered to Australia\" or \"cheapest UGG Tasman slippers delivered to the UK\".",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two letter delivery country code, for example US, GB, AU, DE.",
                "type": "string"
              },
              "postal_code": {
                "description": "Optional delivery ZIP or postcode, for shipping (and US and Canadian sales tax) to that exact area. Works for the US, Canada, the UK, Australia, the EU and most other supported countries.",
                "type": "string"
              },
              "product": {
                "description": "Brand plus product name, for example \"Ninja CREAMi Deluxe\", \"Stanley Quencher 40 oz\" or \"Beauty of Joseon Relief Sun\", or a product link (Shopify stores are read; Amazon and other marketplace links are read for the name only). A bare type (\"toner\", \"headphones\") or a brand alone (\"COSRX\") is refused with a message asking for both.",
                "type": "string"
              },
              "state": {
                "description": "US only: two letter state code, for sales tax.",
                "type": "string"
              }
            },
            "required": ["country", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0834255351bcc2dcadb831a639d4b814286cb335d73c41edf6fb239353386a84"
        },
        {
          "name": "import_fee_rules",
          "title": "Import fee rules for a country",
          "description": "Explains the sales tax, VAT, GST and import duty a shopper pays on goods ordered from abroad to a country, and how Lowcart counts them in totals. Covers the US, UK, Australia, New Zealand and every EU country. US duty depends on the product and where it was made: Lowcart estimates it for beauty products only.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two letter country code.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
