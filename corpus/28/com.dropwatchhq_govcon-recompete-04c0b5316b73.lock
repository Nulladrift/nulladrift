{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/govcon-recompete": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://recompete.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "govcon-recompete",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "expiring_recompetes",
          "description": "List federal contracts EXPIRING in a horizon window (period-of-performance end), with a winner prediction for each. Filter by NAICS and agency. This is the recompete pipeline feed.",
          "inputSchema": {
            "properties": {
              "agency": {
                "type": "string"
              },
              "limit": {
                "description": "Max contracts (default 20).",
                "type": "number"
              },
              "maxDays": {
                "description": "Window ceiling in days (default 180).",
                "type": "number"
              },
              "minAmount": {
                "description": "Minimum award $ (default 1,000,000).",
                "type": "number"
              },
              "minDays": {
                "description": "Window floor in days (default 90).",
                "type": "number"
              },
              "naics": {
                "description": "6-digit NAICS.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:09922916ae488f0a7bc48a7940adecbd6c76b4052167b19113979939ddf5fa01"
        },
        {
          "name": "lane_competitors",
          "description": "Return the firms with the most recent award velocity in a NAICS (and optional agency) lane — i.e. the likely bidders on any recompete in that lane, ranked by recent wins and dollars.",
          "inputSchema": {
            "properties": {
              "agency": {
                "type": "string"
              },
              "limit": {
                "description": "Default 15.",
                "type": "number"
              },
              "naics": {
                "type": "string"
              }
            },
            "required": ["naics"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd6510482ddff13f49a4bfaf8071173b307f12c4f05c6e07083b1d191ec7bc4d"
        },
        {
          "name": "predict_recompete",
          "description": "Predict WHO will win an expiring federal contract recompete. Pass a contract identifier (USAspending generated_internal_id / award gid) OR a NAICS+incumbent pair. Returns the incumbent with an adjusted incumbent-advantage probability plus top likely competitors ranked by recent award velocity in the NAICS/agency lane, the BASE RATES used, sample size, and an honest confidence band. Probabilistic estimate from PUBLIC USAspending data — not insider info.",
          "inputSchema": {
            "properties": {
              "agency": {
                "description": "Awarding agency name (optional, sharpens the lane).",
                "type": "string"
              },
              "gid": {
                "description": "USAspending generated_internal_id (award gid). Best input.",
                "type": "string"
              },
              "incumbent": {
                "description": "Incumbent contractor name (required if no gid).",
                "type": "string"
              },
              "naics": {
                "description": "6-digit NAICS, used to build the competitor field (required if no gid).",
                "type": "string"
              },
              "topN": {
                "description": "Number of competitors to return (default 5).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:52b15ae38fd3798ce48878a11a2b67a004302ff0b42307d8a2528095ee268557"
        }
      ],
      "digest": "sha256:579c67c5cb23c97b9bf427982cf932eff715e91265a619d4dce088fac26ac329"
    }
  }
}
