        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.dominickprevete/instant-fix-and-flip-term-sheet",
        "title": "Dominick Prevete: Instant Fix-and-Flip Term Sheet",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for requesting a written fix-and-flip term sheet from National Loan Provider, a mortgage brokerage, on a business-purpose loan to buy and renovate a non-owner-occupied 1–4 unit investment property. Read fix_and_flip_term_sheet_requirements first: it lists every field request_fix_and_flip_term_sheet needs and what the investor gets back. Every fix-and-flip loan closes in an LLC or corporation, which can be formed before closing: ask whether the investor has one or will form one, and never request a term sheet in the borrower's own name. Before calling request_fix_and_flip_term_sheet, collect the purchase price, the rehab budget, the rehab scope and the after-repair value (ARV) from the investor. Every request, purchase or refinance, needs the property's full street address: number, street, city, state and ZIP. Where the answer is custom pricing, relay its message as written. Once the investor has their term sheet or custom pricing, offer the applicationUrl in the response: it continues to the fix-and-flip loan application with the deal already filled in. Every response carries a \"disclosure\" field; include it with any figure you relay. National Loan Provider (NLPI LLC) is a mortgage brokerage. It arranges, structures and places business-purpose financing across 100+ third-party lenders; it is not a lender and does not make credit decisions. Every figure in this response is indicative and published for reference only: it is not a quote, a commitment, or an offer of credit, and it is not an assessment of any borrower, property or transaction. Financing is business-purpose investor financing only; National Loan Provider does not arrange financing on owner-occupied residential properties or primary residences. The source and as-of date of the underlying data are stated in the source field.",
      "tools": [
        {
          "name": "fix_and_flip_term_sheet_requirements",
          "title": "Fix-and-flip term sheet requirements",
          "description": "What a fix-and-flip term sheet request needs, before you make one: every field, which are required, and the accepted values; the scope (a business-purpose fix-and-flip loan to buy and renovate a non-owner-occupied 1–4 unit investment property); and what the investor gets back. Read-only: nothing is priced, stored or sent. Fix-and-flip loans close in an LLC or corporation; it can be formed before closing. Every request, purchase or refinance, needs the property's full street address: number, street, city, state and ZIP. Reviewer mode: a request whose email address is at example.com, example.org or example.net, or at a .test or .invalid domain, is priced and answered in full with a download link, but nothing is emailed and no lead is recorded.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fix-and-flip term sheet requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1eb5a83a47722a7a4bf86d6444d8ff7b89561cf8aca9f41278d4e72320822e7b"
        },
        {
          "name": "request_fix_and_flip_term_sheet",
          "title": "Request a fix-and-flip term sheet",
          "description": "Request a written fix-and-flip term sheet for a business-purpose loan to buy and renovate a non-owner-occupied 1–4 unit investment property, emailed to the investor with a private download link. Instant where the deal fits the programs; otherwise an answer within 24 hours. A term sheet is indicative and not a commitment to lend. Fix-and-flip loans close in an LLC or corporation; it can be formed before closing. Every request, purchase or refinance, needs the property's full street address: number, street, city, state and ZIP. Each option in the answer carries the label the term sheet prints for it (for example \"Option A, Lowest rate\"); refer to options by that label. Read fix_and_flip_term_sheet_requirements first for the fields.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attestations": {
                "additionalProperties": false,
                "description": "The investor's three representations. A request that does not make all three is answered as out of scope and not priced.",
                "properties": {
                  "businessPurpose": {
                    "description": "true only if the investor confirms the loan is for a business purpose.",
                    "type": "boolean"
                  },
                  "nonOwnerOccupied": {
                    "description": "true only if the investor confirms the property is a non-owner-occupied investment property: not the borrower's residence.",
                    "type": "boolean"
                  },
                  "vestingAsStated": {
                    "description": "true only if the investor confirms title will vest as the vesting field says.",
                    "type": "boolean"
                  }
                },
                "required": ["businessPurpose", "nonOwnerOccupied", "vestingAsStated"],
                "type": "object"
              },
              "borrower": {
                "additionalProperties": false,
                "description": "The borrower.",
                "properties": {
                  "citizenship": {
                    "description": "The borrower's citizenship or residency: us_citizen, permanent_resident, non_permanent_resident, foreign_national or itin.",
                    "enum": ["us_citizen", "permanent_resident", "non_permanent_resident", "foreign_national", "itin"],
                    "type": "string"
                  },
                  "creditEvents": {
                    "additionalProperties": false,
                    "description": "The borrower's credit events: bankruptcy, foreclosure, short sale or deed in lieu. Never empty: none: true, alone, where there have been none; otherwise the months since the most recent event of any kind, and since the latest bankruptcy and foreclosure where there has been one.",
                    "properties": {
                      "bankruptcyMonths": {
                        "anyOf": [
                          {
                            "minimum": 0,
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Months since the latest bankruptcy was discharged or dismissed; null for none."
                      },
                      "foreclosureBailout": {
                        "description": "Whether the loan refinances this property out of a pending foreclosure.",
                        "type": "boolean"
                      },
                      "foreclosureMonths": {
                        "anyOf": [
                          {
                            "minimum": 0,
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Months since the latest foreclosure completed; null for none."
                      },
                      "foreclosureOnSubject": {
                        "description": "Whether a foreclosure was on this property.",
                        "type": "boolean"
                      },
                      "mostRecentMonths": {
                        "anyOf": [
                          {
                            "minimum": 0,
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Months since the most recent credit event of any kind (bankruptcy, foreclosure, short sale, deed in lieu); null for none."
                      },
                      "none": {
                        "const": true,
                        "description": "true where the borrower has had no bankruptcy, foreclosure, short sale or deed in lieu, and no foreclosure is pending on this property. Given alone, with no other credit event field.",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "experienceCount": {
                    "description": "How many investment properties (flips or rentals) the borrower has bought or sold in the last 3 years; 0 for a first project.",
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "fico": {
                    "description": "The borrower's representative credit score: the lowest middle score among everyone guaranteeing the loan. Where there is none, leave it out and set noScore to true.",
                    "maximum": 850,
                    "minimum": 300,
                    "type": "integer"
                  },
                  "housingHistory": {
                    "description": "The borrower's mortgage payment history over the last 12 months: clean (no late payments), 1x30x12, 0x60x12 or 0x90x12, or no_history where the borrower has had no mortgage.",
                    "enum": ["clean", "1x30x12", "0x60x12", "0x90x12", "no_history"],
                    "type": "string"
                  },
                  "largestRehabCompleted": {
                    "description": "Where experienceCount is 1 or more: the largest rehab budget the borrower has completed, in dollars.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "licensed": {
                    "description": "true where the borrower holds an active real estate or general contractor license.",
                    "type": "boolean"
                  },
                  "noScore": {
                    "const": true,
                    "description": "true where the borrower does not have a credit score. Never given with fico.",
                    "type": "boolean"
                  },
                  "vesting": {
                    "description": "How title will vest: entity (an existing LLC or corporation) or entity_to_be_formed (one formed before closing). Fix-and-flip loans close in an LLC or corporation; it can be formed before closing.",
                    "enum": ["entity", "entity_to_be_formed"],
                    "type": "string"
                  }
                },
                "required": ["citizenship", "creditEvents", "experienceCount", "housingHistory", "licensed", "vesting"],
                "type": "object"
              },
              "contact": {
                "additionalProperties": false,
                "description": "The investor: who the term sheet is for and where it is emailed.",
                "properties": {
                  "email": {
                    "description": "Where the term sheet is emailed: a permanent address at a domain that receives email.",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "name": {
                    "description": "The investor's full name.",
                    "type": "string"
                  },
                  "phone": {
                    "description": "Optional: the investor's phone number. Accepted only with phoneConsent true.",
                    "pattern": "^\\+?[0-9 ().-]{7,24}$",
                    "type": "string"
                  },
                  "phoneConsent": {
                    "description": "Required with a phone number: true only when the investor agrees to be contacted, recorded with the number as National Loan Provider's form words it: \"By checking this box, I expressly consent to being contacted by National Loan Provider & Dominick Prevete.\"",
                    "type": "boolean"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "deal": {
                "additionalProperties": false,
                "description": "The deal: the purchase, the rehab and the after-repair value.",
                "properties": {
                  "arv": {
                    "description": "The after-repair value (ARV): what the property is expected to be worth once the rehab is done, in dollars.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "assignmentFee": {
                    "default": 0,
                    "description": "Optional: the assignment fee inside the purchase price, in dollars, where the contract is assigned; 0 for none.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "purchasePrice": {
                    "description": "The contract price the investor pays, in dollars, any assignment fee included.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "rehabBudget": {
                    "description": "The rehab budget, in dollars.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "rehabScope": {
                    "description": "The rehab scope: cosmetic (cosmetic or interior work), systems_layout (systems and layout) or adds_sqft_or_units (adding square footage or units).",
                    "enum": ["cosmetic", "systems_layout", "adds_sqft_or_units"],
                    "type": "string"
                  },
                  "sellerCredits": {
                    "default": 0,
                    "description": "Optional: seller credits, in dollars; 0 for none.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "transaction": {
                    "description": "purchase (buying the property with this loan), delayed_purchase (bought already, financed after the purchase) or refinance.",
                    "enum": ["purchase", "delayed_purchase", "refinance"],
                    "type": "string"
                  }
                },
                "required": ["arv", "purchasePrice", "rehabBudget", "rehabScope", "transaction"],
                "type": "object"
              },
              "property": {
                "additionalProperties": false,
                "description": "The property.",
                "properties": {
                  "address": {
                    "description": "Required on every request, purchase or refinance: the property's full street address on one line, with the number, street, city, state and ZIP, for example \"12 Example Street, Columbus, OH 43215\". A partial address, a county in place of the city, or a placeholder such as TBD is refused.",
                    "type": "string"
                  },
                  "county": {
                    "description": "Optional: the property's county, as its five-digit FIPS code. Left out, it is read from the address's ZIP code.",
                    "pattern": "^\\d{5}$",
                    "type": "string"
                  },
                  "propertyType": {
                    "description": "The property type: sfr (a detached single-family home), townhome, pud (a home in a planned unit development), two_to_four (a 2–4 unit residential building) or condo.",
                    "enum": ["sfr", "townhome", "pud", "two_to_four", "condo"],
                    "type": "string"
                  },
                  "soldInLast3Years": {
                    "description": "Whether the property has sold in the last 3 years: yes, no or not_sure.",
                    "enum": ["yes", "no", "not_sure"],
                    "type": "string"
                  },
                  "state": {
                    "description": "The property's state, as a two-letter code.",
                    "enum": ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY", "DC", "AS", "GU", "MP", "PR", "VI"],
                    "type": "string"
                  }
                },
                "required": ["address", "propertyType", "soldInLast3Years", "state"],
                "type": "object"
              }
            },
            "required": ["attestations", "borrower", "contact", "deal", "property"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a fix-and-flip term sheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf62d5e5d883e35c85bce71422860112490b71e091673c745f10eaebafa9a239"
        }
      ],
      "digest": "sha256:4b9ca34926a66c91cb7b68f73957ceb8c4dc2fbd5adcedc912cfb794ea43a86a"
    }
  }
