              "latitude": {
                "description": "Latitude where the question is judged, decimal degrees. The house cusps are Placidus and therefore latitude dependent, so this is the place of judgment, not the querent birthplace. The latitude must lie below 66.56 degrees north or south, inside the polar circles: KP cusps are Placidus, which has no solution beyond them, so a polar latitude returns 400.",
                "example": 19.076,
                "maximum": 90,
                "minimum": -90,
                "type": "number"
