        {
          "name": "post_vedic_astrology_panchang_choghadiya",
          "title": "Get Choghadiya - 8 Muhurta divisions of day and night",
          "description": "Calculate Choghadiya (Chaughadia) muhurta timings for any date and location. Divides day (sunrise to sunset) and night (sunset to next sunrise) into 8 equal auspicious/inauspicious periods. Each period ruled by a planet: Udveg (Sun, bad), Amrit (Moon, good), Rog (Mars, bad), Labh (Mercury, good), Shubh (Jupiter, good), Char (Venus, good), Kaal (Saturn, bad). Essential for muhurta selection, daily planning, and traditional Hindu timekeeping. Choghadiya calculator API, daily muhurat timings, auspicious time finder.",
          "inputSchema": {
            "examples": [
              {
                "date": "2026-02-03",
                "latitude": 17.385044,
                "longitude": 78.486671
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "date": {
                "description": "Date in YYYY-MM-DD format. A single-digit month or day is accepted and zero-padded (2026-3-5 becomes 2026-03-05). Impossible calendar dates are rejected. Calculations that read planetary positions support 1550-01-02 to 2650-01-22; outside that span they answer 400 with code date_out_of_range, and a calculation that reads a window around the date (a sunrise search, a run of days) may answer the same 400 for a date within a few days of either end.",
                "example": "2026-02-03",
                "format": "date",
                "type": "string"
              },
              "latitude": {
                "description": "Observer latitude in decimal degrees. Determines sunrise and sunset times which define day/night boundaries for muhurta calculations.",
                "example": 17.385044,
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Observer longitude in decimal degrees. Affects local time calculations for sunrise, sunset, and muhurta period boundaries.",
                "example": 78.486671,
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "timezone": {
                "anyOf": [
                  {
                    "maximum": 14,
                    "minimum": -14,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "default": 5.5,
                "description": "Timezone: an IANA name (e.g. \"America/New_York\", \"Europe/London\", or `cities[0].timezone` from /location/search) or decimal hours from UTC (e.g. -5 for EST, 5.5 for IST). An IANA name is resolved to the offset in force at the given date and time. Used for accurate sunrise/sunset calculation and output time formatting. Essential for correct Choghadiya periods outside IST. Defaults to 5.5 (IST).",
                "example": 5.5
              }
            },
            "required": ["date", "latitude", "longitude"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "date": {
                "type": "string"
              },
              "dayChoghadiya": {
                "items": {
                  "properties": {
                    "effect": {
                      "enum": ["Good", "Bad"],
                      "type": "string"
                    },
                    "end": {
                      "type": "string"
                    },
                    "lord": {
                      "type": "string"
                    },
                    "name": {
                      "enum": ["Udveg", "Amrit", "Rog", "Labh", "Shubh", "Char", "Kaal"],
                      "type": "string"
                    },
                    "start": {
                      "type": "string"
                    }
                  },
                  "required": ["effect", "end", "lord", "name", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "nightChoghadiya": {
                "items": {
                  "properties": {
                    "effect": {
                      "enum": ["Good", "Bad"],
                      "type": "string"
                    },
                    "end": {
                      "type": "string"
