          "name": "post_vedic_astrology_dasha_sub_mahadasha_antardasha",
          "title": "Get all Pratyantardashas (antara periods) for a Mahadasha and Antardasha",
          "description": "Pratyantardasha calculator API for Vedic astrology. Returns the 9 Pratyantardasha (antara) periods inside a chosen Antardasha, the third level of the Vimshottari dasha hierarchy. Use it to drill from a Mahadasha into month level timing for event prediction, muhurta selection, and dasha timeline UIs. Each period is proportional to the Vimshottari years of its lord.",
