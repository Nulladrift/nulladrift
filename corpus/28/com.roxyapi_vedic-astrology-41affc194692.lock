          "name": "get_vedic_astrology_yoga",
          "title": "List all planetary yogas - 301 entry Vedic Yoga Glossary",
          "description": "Browse the 301-entry Vedic planetary-yoga glossary. Returns id and name for every cataloged yoga (Raja, Dhana, Pancha Mahapurusha, Nabhasa, Chandra-Mangala, and more). This is a dictionary lookup, not chart-driven detection: it does not inspect a birth chart. Use GET /yoga/{id} for the full glossary entry, or POST /yoga/detect to run all 48 detection rules against a specific kundli. Ideal for yoga-browser UIs, search, and progressive data loading.",
          "inputSchema": {
            "examples": [
              {}
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "family": {
                "description": "Filter the catalog to one Nabhasa family: asraya (3), dala (2), akriti (20) or sankhya (7). Omit for the full catalog. `classical` is accepted but matches nothing here, because it is a detection-verdict value for single-combination yogas rather than a catalog grouping.",
                "enum": ["classical", "asraya", "dala", "akriti", "sankhya"],
                "example": "akriti",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              }
            },
            "type": "object"
          },
