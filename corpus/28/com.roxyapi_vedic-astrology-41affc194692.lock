        {
          "name": "post_vedic_astrology_kp_daily_finance",
          "title": "Daily finance score from four KP sub lord layers - KP Daily Finance API",
          "description": "A Krishnamurti Paddhati daily finance reading for one native on one date. Four KP layers are each scored against the money houses and weighed into one number: the cusp sub lords of the gain and loss houses (structural promise), the four running Vimshottari lords at the reading moment (timing), the ruling planets of that moment (the pulse), and the sub lord windows the Moon passes through across the civil day (the hour hand), with the best and worst windows named. Weights cusps 30, dasha 40, rulingPlanets 15, moonWindows 15. Every input is the shipped KP arithmetic: Placidus cusps, the 249 sub lord table, the four tier significator rule, the Vimshottari chain to the sookshma level, all in the one ayanamsa you choose. Every row prints its planet, its standing against the two sets and its score, so the number can be audited rather than trusted. The house groups, the classification, the inversion on the loss cusps, the retrograde penalty, the level weights and the layer weights are a KP practitioner convention adopted as the published convention of this route: no classical KP text weighs these four layers against each other, and every table behind the number is printed so the result can be checked line by line rather than trusted. The score measures what the method outputs for the day, never the probability of a gain or a loss. Override the two house groups to run your own school. The latitude must lie below 66.56 degrees north or south, inside the polar circles: KP cusps are Placidus, which has no solution beyond them, so a polar latitude returns 400.",
          "inputSchema": {
            "examples": [
              {
                "birthDate": "1990-06-15",
                "birthTime": "07:30:00",
                "latitude": 28.6139,
                "longitude": 77.209
              }
            ],
            "properties": {
              "ayanamsa": {
                "default": "kp-newcomb",
                "description": "Ayanamsa system for sidereal conversion. \"kp-newcomb\" uses the KP-Newcomb dynamic formula, the most common choice for KP astrology. \"kp-old\" uses the Krishnamurti original table from KP Reader-1 with constant precession rate. \"lahiri\" uses Lahiri/Chitrapaksha ayanamsa, matching most traditional Vedic software. \"raman\" uses the B.V. Raman ayanamsa from Hindu Predictive Astrology, a recognised traditional school that sits about 1.45 degrees below Lahiri. Defaults to \"kp-newcomb\".",
                "enum": ["kp-newcomb", "kp-old", "lahiri", "raman"],
                "example": "kp-newcomb",
                "type": "string"
              },
              "birthDate": {
                "description": "Birth date, YYYY-MM-DD. Fixes the Placidus cusps, the four tier significators and the Vimshottari balance every layer reads.",
                "example": "1990-06-15",
                "format": "date",
                "type": "string"
              },
              "birthTime": {
                "description": "Birth time, HH:MM:SS, 24 hour, local to the birth place. The cusp sub lords move about one sub every four minutes of clock time, so this is the input the whole reading is most sensitive to.",
                "example": "07:30:00",
                "format": "time",
                "type": "string"
              },
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "date": {
                "description": "Civil date to read, YYYY-MM-DD in the request timezone. Defaults to today (UTC). The Moon windows cover this date from midnight to midnight.",
                "example": "2026-09-14",
                "format": "date",
                "type": "string"
              },
              "gainHouses": {
                "default": [2, 11],
                "description": "Houses whose significators count as gain, 1 to 12. Defaults to the convention, 2 and 11. Override it to run your own school: the two lists may not share a house.",
                "example": [2, 11],
                "items": {
                  "maximum": 12,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "latitude": {
                "description": "Birth latitude in decimal degrees. Sets the Placidus cusps; also the place the ruling planets and the Moon windows are read at. The latitude must lie below 66.56 degrees north or south, inside the polar circles: KP cusps are Placidus, which has no solution beyond them, so a polar latitude returns 400.",
                "example": 28.6139,
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Birth longitude in decimal degrees, east positive.",
                "example": 77.209,
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "lossHouses": {
                "default": [6, 8, 12],
                "description": "Houses whose significators count as loss, 1 to 12. Defaults to the convention, 6 and 8 and 12. Override it to run your own school: the two lists may not share a house.",
                "example": [6, 8, 12],
                "items": {
                  "maximum": 12,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "nodeType": {
                "default": "mean",
                "description": "Lunar node convention. \"mean\" is the smoothed average node, which always moves retrograde; \"true\" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the Rahu and Ketu positions. Mean is the traditional Vedic default and what printed panchangs use; the choice can move a KP sub-lord in narrow boundary cases, where a span can be as small as 0.5 degrees. Defaults to \"mean\".",
                "enum": ["mean", "true"],
                "example": "mean",
                "type": "string"
              },
              "time": {
                "description": "Reading moment on that date, HH:MM:SS local. The ruling planets and the running sookshma lord are read at this instant. Defaults to 12:00:00; pass a market open or any hour for an intraday read.",
                "example": "12:00:00",
                "format": "time",
                "type": "string"
