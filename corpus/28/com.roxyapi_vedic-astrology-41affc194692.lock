        {
          "name": "post_vedic_astrology_compatibility",
          "title": "Calculate compatibility score - Gun Milan API (Ashtakoot Matching)",
          "description": "Calculate detailed Ashtakoot compatibility (Gun Milan) for kundli matching between two people. Returns accurate 36-point Guna Milan scale with breakdown across all 8 kootas (Varna, Vashya, Tara, Yoni, Graha Maitri, Gana, Bhakoot, Nadi), Nadi and Bhakoot dosha detection with classical cancellation analysis per Muhurta Martanda and BPHS rules, and marriage recommendation. Perfect for kundli matching for marriage, matrimonial platforms, horoscope compatibility, and Vedic matchmaking services.",
          "inputSchema": {
            "examples": [
              {
                "person1": {
                  "date": "1990-07-04",
                  "latitude": 28.6139,
                  "longitude": 77.209,
                  "time": "10:12:00"
                },
                "person2": {
                  "date": "1990-07-04",
                  "latitude": 28.6139,
                  "longitude": 77.209,
