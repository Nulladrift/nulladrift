        {
          "name": "get_vedic_astrology_kp_ayanamsa",
          "title": "Get KP-Newcomb ayanamsa - Dynamic daily calculation",
          "description": "Get the KP-Newcomb (Krishnamurti) ayanamsa for any instant, computed continuously from Newcomb precession theory rather than looked up in a preset table, so it tracks the exact moment you ask for instead of the calendar year. Supply date alone for midnight UTC, or add time and timezone to pin a birth moment exactly. This is the precession offset subtracted from a tropical longitude to obtain the sidereal one, and it is what makes a KP chart reproduce the reference software your practitioners already use. Returns the same value every KP endpoint applies internally. Use it as a dynamic KP Newcomb ayanamsa calculator when you need the Krishnamurti ayanamsa for today, for a birth moment, or for any instant a chart is being rectified against.",
          "inputSchema": {
            "examples": [
              {}
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "date": {
                "description": "Date for ayanamsa calculation in YYYY-MM-DD format. Defaults to today if not provided. Ayanamsa changes by ~0.01 degrees per month due to the precession of Earth.",
                "example": "2025-12-26",
                "format": "date",
                "type": "string"
              },
              "time": {
                "description": "Time of day in 24-hour HH:MM:SS format, interpreted in the timezone below. Omit for midnight UTC. The ayanamsa moves about 0.14 arcseconds across a day, so supplying the time matters only when reconciling a chart against reference software to the arcsecond.",
                "example": "09:00:00",
                "format": "time",
                "type": "string"
              },
              "timezone": {
                "description": "IANA name (e.g. \"Asia/Kolkata\", \"America/New_York\"), decimal hours (e.g. 5.5 for IST, -5 for EST), or a fixed UTC offset (e.g. \"+05:30\"). IANA resolved to the offset in force at the given date and the time field above. Defaults to 0 (UTC).",
                "example": "Asia/Kolkata",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ayanamsa": {
                "type": "number"
              },
              "calculated": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "formula": {
                "type": "string"
              },
              "instant": {
                "type": "string"
              },
              "type": {
                "type": "string"
              }
            },
            "required": ["ayanamsa", "calculated", "date", "formula", "instant", "type"],
            "type": "object"
          },
