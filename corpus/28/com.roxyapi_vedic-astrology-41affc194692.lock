        {
          "name": "post_vedic_astrology_kp_sublord_changes",
          "title": "Find KP sublord changes",
          "description": "Track when planets cross KP sublord boundaries (1-249 divisions) for precise Krishnamurti Paddhati event timing. Returns exact timestamps when a planet transitions between sublords, essential for prashna kundali analysis and dasha predictions. Use this to find favorable windows when benefic sublords are active. Supports Sun, Moon, Mars, Mercury, Jupiter, Venus, and Saturn tracking over any window up to 365 days.",
          "inputSchema": {
            "examples": [
              {
                "endDate": "2025-01-31",
                "planet": "Moon",
                "startDate": "2025-01-01"
              }
            ],
            "properties": {
              "ayanamsa": {
                "default": "kp-newcomb",
                "description": "Ayanamsa system for sidereal conversion. \"kp-newcomb\" uses the KP-Newcomb dynamic formula, the most common choice for KP astrology. \"kp-old\" uses the Krishnamurti original table from KP Reader-1 with constant precession rate. \"lahiri\" uses Lahiri/Chitrapaksha ayanamsa, matching most traditional Vedic software. \"raman\" uses the B.V. Raman ayanamsa from Hindu Predictive Astrology, a recognised traditional school that sits about 1.45 degrees below Lahiri. Defaults to \"kp-newcomb\".",
                "enum": ["kp-newcomb", "kp-old", "lahiri", "raman"],
                "example": "kp-newcomb",
                "type": "string"
              },
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "endDate": {
                "description": "Last day of the search, inclusive (YYYY-MM-DD), a calendar day in `timezone`. Not before startDate, at most 365 days after it.",
                "example": "2025-01-31",
                "format": "date",
                "type": "string"
              },
              "nodeType": {
                "default": "mean",
                "description": "Lunar node convention. \"mean\" is the smoothed average node, which always moves retrograde; \"true\" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the Rahu and Ketu positions. Mean is the traditional Vedic default and what printed panchangs use; the choice can move a KP sub-lord in narrow boundary cases, where a span can be as small as 0.5 degrees. Defaults to \"mean\".",
                "enum": ["mean", "true"],
                "example": "mean",
                "type": "string"
              },
              "planet": {
                "description": "Planet to track (case-insensitive). Valid values: Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn",
                "enum": ["Sun", "Moon", "Mars", "Mercury", "Jupiter", "Venus", "Saturn"],
                "example": "Moon",
                "type": "string"
              },
              "startDate": {
                "description": "First day of the search (YYYY-MM-DD), a calendar day in `timezone`.",
                "example": "2025-01-01",
                "format": "date",
                "type": "string"
              },
              "timezone": {
                "anyOf": [
                  {
                    "maximum": 14,
                    "minimum": -14,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "default": 0,
                "description": "IANA name (e.g. \"America/New_York\", \"Europe/London\"), a fixed offset like \"+05:30\", OR decimal hours from UTC. One offset is taken from startDate (DST-correct for that date) and used for the whole range, so a window crossing a daylight-saving change is read on the earlier offset throughout; send a fixed offset if you need that explicit. The two dates are read as calendar days in this timezone and output times are converted to it, so one date with 5.5 is that whole Indian day. Defaults to 0 (UTC).",
                "example": 5.5
              }
            },
            "required": ["endDate", "planet", "startDate"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "changes": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "datetime": {
                      "type": "string"
                    },
                    "fromKp": {
                      "type": "number"
                    },
                    "fromNakshatraLord": {
                      "type": "string"
                    },
                    "fromSublord": {
                      "type": "string"
                    },
                    "time": {
                      "type": "string"
                    },
                    "toKp": {
                      "type": "number"
                    },
                    "toNakshatraLord": {
                      "type": "string"
                    },
                    "toSublord": {
                      "type": "string"
                    }
                  },
                  "required": ["date", "datetime", "fromKp", "fromNakshatraLord", "fromSublord", "time", "toKp", "toNakshatraLord", "toSublord"],
                  "type": "object"
                },
                "type": "array"
              },
              "endDate": {
                "type": "string"
              },
              "planet": {
                "type": "string"
              },
              "startDate": {
                "type": "string"
              },
              "totalChanges": {
                "type": "number"
              }
            },
            "required": ["changes", "endDate", "planet", "startDate", "totalChanges"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
