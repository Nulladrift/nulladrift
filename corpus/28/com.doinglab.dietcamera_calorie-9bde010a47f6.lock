      "serverInfo": {
        "name": "dietcamera-calorie",
        "title": "다이어트카메라 칼로리 사전",
        "version": "0.1.2",
        "websiteUrl": "https://dietcamera.doinglab.com/ai/",
        "icons": [
          {
            "src": "https://dietcamera.doinglab.com/icon-192.png",
