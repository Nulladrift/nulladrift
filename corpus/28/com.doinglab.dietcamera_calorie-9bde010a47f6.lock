{
  "lockfileVersion": 2,
  "subjects": {
    "com.doinglab.dietcamera/calorie": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.dietcamera.doinglab.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dietcamera-calorie",
        "title": "DietCamera Calorie Dictionary",
        "version": "0.1.3",
        "websiteUrl": "https://dietcamera.doinglab.com/ai/",
        "icons": [
          {
            "src": "https://dietcamera.doinglab.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server provides calorie and nutrition data from the DietCamera calorie dictionary: 50,000+ Korean dishes, Korean franchise menus and packaged foods. All nutrient values are per serving, with per-100 g/ml values where useful. Every result includes the URL of its source page on dietcamera.doinglab.com. Values estimated by AI are marked \"AI 추정치, 참고용\" (AI estimate, for reference only) and nutrients a manufacturer has not disclosed are marked \"제조사 미공개\" (not disclosed). Results contain nutrition facts only; they do not contain health or weight-loss claims. Food names are matched in Korean.",
      "tools": [
        {
          "name": "compare_foods",
          "title": "Compare foods",
          "description": "Compare 2 to 10 foods side by side: serving size, kcal per serving and per 100 g/ml, carbohydrate, protein, fat, sugars and sodium, sorted by calories. Each row links to its source page and carries the AI estimate flag where applicable. Names that cannot be found are reported. Example input: [\"짜장면\", \"짬뽕\"], [\"빅맥\", \"와퍼\"].",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "foods": {
                "description": "2 to 10 Korean food names, foodNumbers or page URLs",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["foods"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare foods"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b4fc5754f9037867a2b01dba03d30fed915b691ad21017a80e7b7108f9debd49"
        },
        {
          "name": "franchise_menu",
          "title": "Franchise menu calories",
          "description": "List menu items of one Korean franchise brand (e.g. 스타벅스, 맥도날드, 교촌치킨, 배스킨라빈스), sorted by kcal_asc (default), kcal_desc, protein_desc, sugar_asc or sodium_asc. Returns up to 20 items with serving size, calories and macros, the AI estimate flag where applicable, and the URL of the brand page that lists the full menu. Use query to narrow by part of the menu name. If the brand name is ambiguous, the matching brands are listed instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Brand name as written in Korea, e.g. \"스타벅스\", \"BBQ\", \"맘스터치\"",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Number of results (default 10, max 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the menu name in Korean, e.g. \"라떼\", \"버거\"",
                "type": "string"
              },
              "sort": {
                "description": "Sort order (default kcal_asc: lowest calories first)",
                "enum": ["kcal_asc", "kcal_desc", "protein_desc", "sugar_asc", "sodium_asc"],
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Franchise menu calories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1fe7370cb0ea2ce1ed5e4041ee3babd179e78dcc9fac363c6936f13bb7b6740b"
        },
        {
          "name": "get_nutrition",
          "title": "Get nutrition facts",
          "description": "Get the full nutrition facts of one food: energy, carbohydrate, sugars, dietary fiber, protein, fat, saturated fat, trans fat, cholesterol and sodium, per serving and per 100 g/ml, with % of the Korean daily reference values. Nutrients the manufacturer has not disclosed are marked \"제조사 미공개\" (not disclosed), and estimated values carry an \"AI 추정치, 참고용\" flag. Includes the source page URL. If no exact name match exists, the closest match is returned and similar names are listed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "food": {
                "description": "Korean food name, a foodNumber, or a https://dietcamera.doinglab.com/food/... page URL returned by search_food",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["food"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get nutrition facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:269066ab9f349561e45e45e4ff88ab868e059e034c4a4c530fe2a7b721d294ea"
        },
        {
          "name": "new_menus",
          "title": "New franchise menu calories",
          "description": "List new menu items that Korean franchise brands published official nutrition information for in a given month, sorted by calories (up to 20). Leave month empty for the latest month. Returns the brands of that month and the URL of the monthly guide page with the full list. Use brand to narrow the list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Narrow to one brand, e.g. \"파리바게뜨\"",
                "type": "string"
              },
              "limit": {
                "description": "Number of results (default 20, max 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "Month as YYYY-MM. Empty = latest month",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "New franchise menu calories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0fd9ceba7fd37c566a85c166a82a958bd7588586e1eb546f6d4b7c7c1089b7dd"
        },
        {
          "name": "search_food",
          "title": "Search Korean food calories",
          "description": "Search the DietCamera calorie dictionary (50,000+ Korean dishes, Korean franchise menus and packaged foods) by name. Use it when the user asks for the calories or nutrition of a food and you need to find matching items. Returns up to 20 items, each with serving size, kcal per serving and per 100 g/ml, carbohydrate, protein, fat, sugars, sodium, an \"AI 추정치, 참고용\" (AI estimate) flag when values are estimated, and the URL of the source page. Names are matched in Korean, e.g. \"김치찌개\", \"스타벅스 라떼\", \"불닭볶음면\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Limit to one type: food = general dishes, franchise = restaurant/cafe chain menus, processed = packaged foods",
                "enum": ["food", "franchise", "processed"],
                "type": "string"
              },
              "limit": {
                "description": "Number of results (default 10, max 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Food name in Korean, optionally with the brand, e.g. \"교촌 허니콤보\", \"김치찌개\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Korean food calories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c2db31ae33b06f3a162b7a00c6e0c6d95dbe12a4868555b7857095e6731d6052"
        }
      ],
      "digest": "sha256:76b206195830a3e19b7ea2a6cb4e6040583321f3c7993c67aa8ee3c84cacb2f8"
    }
  }
}
