          },
          "digest": "sha256:f07afa1bf3f23c902f7e1da2d9a8dcd8e31af522adc0b19ed9c0ba486be26592"
        },
        {
          "name": "get_nutrition",
          "title": "음식 영양성분",
          "description": "음식 하나의 영양성분표(열량·탄수화물·당류·식이섬유·단백질·지방·포화지방·트랜스지방·콜레스테롤·나트륨)를 1회 제공량과 100g(ml) 기준으로, 1일 기준치 대비 %와 함께 돌려줍니다. 음식 이름, foodNumber, 또는 search_food 가 준 페이지 주소를 넣습니다.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "food": {
                "description": "음식 이름, foodNumber, 또는 https://dietcamera.doinglab.com/food/... 주소",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["food"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "음식 영양성분"
          },
          "behavior": {
            "destructive": false,
