      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "다이어트카메라 칼로리 사전(한국 음식·프랜차이즈·가공식품 5만여 개)의 칼로리와 영양성분을 찾습니다. 영양소 값은 1회 제공량 기준입니다. 답할 때 도구가 준 페이지 링크를 출처로 함께 보여 주세요. \"AI 추정치, 참고용\" 표시가 있는 값은 그 표시를 그대로 전해 주세요. 효능(살이 빠진다 등)은 말하지 마세요.",
      "tools": [
        {
          "name": "compare_foods",
          "title": "음식 칼로리 비교",
          "description": "음식 2~10개의 칼로리와 탄수화물·단백질·지방·당류·나트륨을 1회 제공량과 100g(ml) 기준으로 비교합니다(열량 낮은 순). 예: [\"짜장면\", \"짬뽕\"], [\"빅맥\", \"와퍼\"].",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "foods": {
                "description": "음식 이름, foodNumber 또는 페이지 주소 목록",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["foods"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "음식 칼로리 비교"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3463fd2d20cf91080ddd329221b50a9a39bfdf2377dd558f28cf487199c704d9"
        },
        {
          "name": "franchise_menu",
          "title": "프랜차이즈 메뉴 칼로리",
          "description": "프랜차이즈 브랜드(스타벅스, 맥도날드, 교촌치킨, 배스킨라빈스 등)의 메뉴 칼로리를 정렬해 최대 20개 돌려줍니다. 정렬: kcal_asc(낮은 순, 기본), kcal_desc, protein_desc, sugar_asc, sodium_asc. query 로 메뉴 이름을 좁힐 수 있습니다. 전체 메뉴는 링크된 브랜드 페이지에 있습니다.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "브랜드 이름. 예: \"스타벅스\", \"BBQ\", \"맘스터치\"",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "결과 수(기본 10, 최대 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "메뉴 이름 일부. 예: \"라떼\", \"버거\"",
                "type": "string"
              },
              "sort": {
                "enum": ["kcal_asc", "kcal_desc", "protein_desc", "sugar_asc", "sodium_asc"],
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "프랜차이즈 메뉴 칼로리"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
