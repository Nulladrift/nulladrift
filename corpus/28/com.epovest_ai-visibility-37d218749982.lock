        {
          "name": "archive_tracker",
          "title": "File a tracker away",
          "description": "File a finished tracker away: a campaign that ended, a brand that was sold, a trial that is over. It moves to the end of list_trackers with archived true, stops asking for anything, and its measurement pauses in the same call if it was still running, so the spending stops there. Bring it back with archived false: the tracker returns to the list as it was, and start_tracker restarts the measurement when the user asks for it. The sheet and the score series are kept and stay readable throughout (get_results answers as usual). Filing away an already filed tracker answers the same.",
          "inputSchema": {
            "properties": {
              "archived": {
                "description": "true files the tracker away and pauses its measurement, false brings it back. Omitted, it files it away.",
                "type": "boolean"
              },
              "tracker_id": {
                "description": "The UUID of the tracker: call list_trackers to find it.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["tracker_id"],
            "type": "object"
          },
