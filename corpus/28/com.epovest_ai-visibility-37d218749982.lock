        {
          "name": "list_surfaces",
          "title": "List the surfaces of a project",
          "description": "The surface registry of a project: the pages about the brand where the customer has the FINAL SAY (website, GitHub, LinkedIn, X, YouTube, Wikidata, directories, app stores...). The split with corroborations is control, never who wrote the page: a page the customer can change is a surface, a page where someone else has the final say is a corroboration (list_corroborations). Each surface carries its type, url, label, languages, notes, its checklist and a status DERIVED from the checklist CELLS that hold it: checklist.required lists exactly those, the canon items of the template plus every check the customer added of their own. checklist.kinds answers a different question, what PERISHES a tick: \"canon\" items restate the canon, so their verification perishes when the wording moves; \"presence\" ones, such as site_link, hold. A check of the customer holds the status whatever its kind, so read checklist.required and deduce nothing from checklist.kinds. checklist.custom lists those checks, each with its key, label, scope and restates_canon, and the ones taken out with deleted true, which restore_surface_check brings back; add_surface_check is how a new one is posed. Each cell is verified (dated, stamped with the canon version whose WORDING it restated: it stays fresh until the wording moves, and a revision that touches no wording, such as declaring the canonical language, perishes nothing) or set aside with its reason (the item does not apply on THIS surface). Three statuses, never a fourth: aligned when every required cell not set aside is verified at the current wording; needs_update when some verification is missing or stale; never_aligned when none exists. There is no state for a page the canon does not apply to, because setting aside the LAST canon cell is refused with not_a_surface, because a page that carries none of the canon is not a surface: turn it into a corroboration if someone else has the final say on it, or take it out of the registry. checklist.state keeps the flat view of verified items; checklist.progress counts done, total and dismissed, the set-aside cells out of the denominator but never hidden. Each surface also carries domain_authority, what the AIs grant the DOMAIN the page sits on, read from the Atlas: domain is the registrable domain that was measured, engines its AI Authority on each AI over the last 30 days, source_id its entry on the map (read it with get_source). The unit is the domain, so the figure says that PLACE is read, and list_sources reads the very same one. An engine absent from engines has not cited the domain lately, which is not a zero, and a source_id of null means the domain is not on the map of this account, which carries the sources the surveys of this account surfaced and grows as it measures more. Start here to find a surface id. Set deleted to \"only\" to read the trash of the registry instead of it.",
          "inputSchema": {
            "properties": {
              "deleted": {
                "description": "Set to \"only\" for the surfaces taken out of the registry (delete_surface), most recently taken out first, each with its deleted_at. Omitted, the registry is listed.",
                "enum": ["only"],
                "type": "string"
              },
              "project_id": {
                "description": "UUID of the project: call list_projects to find it.",
                "format": "uuid",
