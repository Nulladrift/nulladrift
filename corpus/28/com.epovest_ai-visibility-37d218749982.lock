        {
          "name": "complete_quest",
          "title": "Complete a quest",
          "description": "Mark a quest done: the move happened. Sets the state and the closing date; calling it again leaves it done, so a retry is safe, and a dismissed quest that was done after all becomes done (the last move is what the file remembers). The quest stays readable in the closed history of list_quests, and reopen_quest puts it back in the file.",
          "inputSchema": {
            "properties": {
              "quest_id": {
                "description": "The UUID of the quest: call list_quests to find it.",
                "format": "uuid",
                "type": "string"
