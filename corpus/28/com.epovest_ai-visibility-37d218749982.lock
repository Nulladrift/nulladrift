        {
          "name": "convert_corroboration_to_surface",
          "title": "Move a corroboration to the surface registry",
          "description": "Move the page to the surface registry: the customer has, or takes, the final say on it (their own profile or listing recorded on the wrong side, or a source that became a reliable channel). Nothing is retyped: url, label and notes travel, the publication date is copied into the notes, the type derives from the address and the canon (a host that is neither the canon website nor a known place lands on other, with the generic checklist). The corroboration is taken down, sheet intact, and the reverse move exists (convert_surface_to_corroboration): nothing is lost, and replaying the move finds the same line instead of duplicating it. It moves a line the customer declared: confirm with the user first.",
          "inputSchema": {
            "properties": {
              "corroboration_id": {
                "description": "The UUID of the corroboration: call list_corroborations to find it.",
                "format": "uuid",
