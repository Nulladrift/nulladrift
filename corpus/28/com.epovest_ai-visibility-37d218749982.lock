        {
          "name": "update_surface",
          "title": "Update a surface",
          "description": "Update the registry sheet of a surface: only the fields you send change (a sent languages list replaces the previous one; an empty label or notes clears it). No journal line is ever written here: an alignment is earned with tick_surface_checklist, cell by cell. Languages ARE the columns of the checklist, so declaring the language of a single-language page renames its column and carries its verified cells along. When the change leaves no single destination (a language dropped from a page that keeps others, one column split into several), the columns that leave the model come back in dropped_checklist_columns with what they held; their cells stay stored, and declaring the language again brings them back. The status of the answer is derived from the cells that read NOW, so read it back rather than assuming it held.",
          "inputSchema": {
            "properties": {
              "label": {
                "description": "Display name of the surface. OMIT IT on creation: it is derived from the url (the handle on a known place, the host and path on a website).",
                "type": "string"
              },
              "languages": {
                "description": "Languages of the surface, as short codes like \"en\" or \"pt-br\". A sent list replaces the previous one.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "description": "Free registry notes: who owns the account, access, context.",
                "type": "string"
              },
              "surface_id": {
                "description": "The UUID of the surface: call list_surfaces to find it.",
                "format": "uuid",
                "type": "string"
              },
              "type": {
                "description": "What kind of surface this is; it picks the checklist to come. OMIT IT on creation: the type is derived from the url by the catalogue of places (github.com is GitHub, an unknown host is the brand website). Send it only to correct a derivation. \"other\" covers anything else and carries the generic checklist.",
                "enum": ["website", "github", "linkedin", "x", "youtube", "wikidata", "directory", "app_store", "other"],
                "type": "string"
              },
              "url": {
                "description": "Absolute http(s) address of the surface.",
                "type": "string"
              }
            },
            "required": ["surface_id"],
            "type": "object"
          },
          "annotations": {
