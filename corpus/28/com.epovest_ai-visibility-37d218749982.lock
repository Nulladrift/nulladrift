        {
          "name": "contact_support",
          "title": "Write to the Epovest support team",
          "description": "Send a message to the humans behind Epovest: report a problem, suggest an improvement, ask a question. Use it when a tool refuses what should work, when the product is missing something the user needs, or when the user asks you to tell us something. The message lands in the support threads of the account, which the members also see in the app, and a human answers there. Reply to an ongoing thread with thread_id, and read the answer with get_support_thread.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "What this message is: sorts it on arrival.",
                "enum": ["problem", "suggestion", "question"],
                "type": "string"
              },
              "message": {
                "description": "What you want to tell the support team, in the words of the user when they dictated it. Include what you tried and what happened.",
                "type": "string"
              },
              "subject": {
                "description": "Title of the thread. Derived from the message when omitted; ignored when replying.",
                "type": "string"
              },
              "thread_id": {
                "description": "Reply to this thread instead of opening a new one: call list_support_threads to find it.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
