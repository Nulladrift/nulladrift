        {
          "name": "tick_surface_checklist",
          "title": "Verify or set aside checklist cells of a surface",
          "description": "Record what a surface actually carries, cell by cell, as many moves as you want in one call. The items are listed by list_surfaces as checklist.items: the template of the surface type (stable keys such as title_tag or llms_txt), then the checks the customer added of their own (add_surface_check), which tick here exactly like the rest, at their key. Most of them are yours to check (a title tag, JSON-LD, an llms.txt all read with a simple fetch). Three moves per cell. VERIFY (done true, or nothing): the item is constated on the page; an item of canon kind (checklist.kinds) is stamped with the current canon version and wording, so its verification stays fresh until the wording moves, and needs the canon set first. SET ASIDE (dismissed true plus a short reason): the item does not apply on THIS surface (an author bio, a field the platform does not offer); durable across canon revisions, reversible, never hidden from the counts. CLEAR (done false, or dismissed false): the cell returns to blank. A site-wide item (checklist.site_items: the llms.txt, one file at the root of the site, written in the canonical language of the project) is one cell for the whole site, without a language. Only the cells you send change; an unknown item or language, a set-aside without reason or a contradictory move refuses the whole batch and says what exists. The ALIGNED status derives from the cells listed in checklist.required, the canon items plus the checks of the customer: verifying the last one aligns the surface and dates it in the journal. The goal is a surface with no required cell left undecided: work every one of them to a verdict, verified when the page carries it or set aside with a reason when the item does not apply here. Leaving a cell untouched is not a neutral skip, it holds the surface in needs_update and hides whether the page was ever checked, so go through the whole checklist and not only the cells easy to confirm. And setting aside the LAST canon cell is refused, because a page that carries none of the canon is not a surface: turn it into a corroboration if someone else has the final say on it, or take it out of the registry.",
          "inputSchema": {
            "properties": {
              "surface_id": {
                "description": "The UUID of the surface: call list_surfaces to find it.",
                "format": "uuid",
                "type": "string"
              },
              "ticks": {
                "description": "The cell moves. Nothing else on the checklist changes.",
                "items": {
                  "properties": {
                    "dismissed": {
                      "description": "true sets the cell aside (a \"reason\" is due), false brings it back to blank. Never combined with done.",
                      "type": "boolean"
                    },
                    "done": {
                      "description": "true verifies the cell, false clears it. Omitted (and no dismissed), it verifies.",
