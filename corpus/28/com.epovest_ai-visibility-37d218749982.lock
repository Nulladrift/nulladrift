        {
          "name": "update_account_settings",
          "title": "Update the account settings",
          "description": "Change the settings of the account. Send only what the user is changing: every setting you leave out keeps its value. `billing_country`, `billing_address` and `intra_eu_vat_number` clear when you send null; `name`, `language` and `timezone` keep their value on null, so name the language or the time zone you want. A postal address and a VAT number travel with `billing_country`: send the country in the same call. What you write here goes on the next invoices of the account, and the invoices already issued keep the details they carry.",
          "inputSchema": {
            "properties": {
              "billing_address": {
                "description": "Postal address of the account, one string per line, like [\"12 Example Street\", \"75001 Paris\"]. The list replaces the previous address; [] or null clears it. Three lines at most, so the address block of an invoice stays readable.",
                "items": {
                  "type": "string"
