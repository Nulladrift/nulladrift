        },
        {
          "name": "archive_project",
          "title": "File a project away",
          "description": "File a project away once the folder has served its purpose: a client that left, a brand that was sold. It moves to the end of list_projects with archived true, and stops being offered when filing a tracker. Bring it back with archived false. Nothing is deleted and nothing cascades: the trackers filed under it keep their status, keep measuring and keep showing up in list_trackers, and the answer carries tracker_count, how many are still filed under it, so you can go on with archive_tracker on each one when that is what the user meant. Filing away an already filed project answers the same. Default is where trackers without a folder live: it has no id, so this tool always takes the UUID of a project of the account.",
          "inputSchema": {
            "properties": {
              "archived": {
                "description": "true files the project away, false brings it back. Omitted, it files it away.",
                "type": "boolean"
              },
              "project_id": {
                "description": "UUID of the project: call list_projects to find it.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
