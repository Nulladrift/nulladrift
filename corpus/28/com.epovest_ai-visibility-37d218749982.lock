      "serverInfo": {
        "name": "epovest",
        "title": "Epovest",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Epovest is an AI visibility platform: it measures how AI assistants answer the questions your market asks, how often each keyword is cited and from which sources, and gives the levers to shape those answers. The tools act on the trackers of the account that owns the API key. Typical flow: list_trackers, then get_results for the score series or get_responses for raw engine answers. create_tracker prepares a new tracker in draft and start_tracker launches its measurement against the prepaid credit balance; both need the write scope, like update_tracker, which edits an existing tracker (only the fields you send change). get_credits reads that balance, with the amounts reserved by surveys in progress. A failed tool call returns the JSON error envelope of the REST API v1: same codes, same meaning. When a tool refuses what should work, when something is missing, or when the user asks you to tell us something, write to us with contact_support: a human answers in the thread, which you read back with get_support_thread. Full reference: https://epovest.com/docs/api.md",
      "tools": [
        {
          "name": "accept_keyword_discovery",
          "title": "Accept discovered suggestions",
          "description": "Accept one discovered suggestion (domain) or a batch (domains): each becomes a tracked keyword of the tracker, in place, and its series starts at the next survey. Refused with keyword_cap_reached when the batch would exceed the keyword cap, and with not_found when a domain is not currently suggested (the batch is all-or-nothing, nothing is added then). The answer carries keyword for a single domain, keywords for a batch. Accept on behalf of the user only when they said yes.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "One domain to act on, exactly as listed by list_keyword_discoveries. Send this OR domains, never both.",
                "type": "string"
              },
              "domains": {
                "description": "Several domains to act on in one call, each exactly as listed by list_keyword_discoveries. Send this OR domain, never both. ALL-OR-NOTHING: one invalid domain refuses the whole batch, so you never have to guess which half took.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tracker_id": {
                "description": "The UUID of the tracker: call list_trackers to find it.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["tracker_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:aad970cfeb86559772235366b5c377f8326a5e69935b4625043ebeb1a724a03a"
        },
        {
          "name": "add_surface_check",
          "title": "Add a check of your own to the checklist of a surface",
          "description": "Add a check of your own to the checklist of one surface: a requirement the person holds on THAT page, in their words. It becomes REQUIRED for the page to count as aligned, exactly like the canon items of the template, and it is ticked with tick_surface_checklist at the key returned here. Reach for it whenever the person states something a page must carry that is theirs to decide: the pricing block quotes the canon boilerplate, the OG image is the current one, the footer carries the legal name, the pinned post links to the launch page. restates_canon is the one judgement to make, and the question is simple: does the tick become FALSE when the wording of the canon changes? True for a check that restates the canon, and its verification then perishes with the wording, putting the page back in the queue; false, the default, for a check that constates anything else, and the tick then stands until someone clears it. Sending the same label again returns the check already there, and brings it back from the trash if it was in it, so a replay never duplicates. Up to 20 checks on a surface.",
          "inputSchema": {
            "properties": {
              "label": {
                "description": "What the check says, as the person would read it on their checklist: one line, up to 120 characters (\"The FAQ block quotes the canon boilerplate\").",
                "type": "string"
              },
              "restates_canon": {
                "description": "true when the check restates the WORDING of the canon, so its verification perishes when the wording moves. false by default, for a check that constates something else.",
                "type": "boolean"
              },
              "scope": {
                "description": "How many cells the check gets: \"language\" by default, one per language of the surface; \"site\" for what exists once for the whole site whatever the number of languages.",
                "enum": ["site", "language"],
                "type": "string"
              },
              "surface_id": {
                "description": "The UUID of the surface: call list_surfaces to find it.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["label", "surface_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:29f79ce597d4eaf525e3c2b257996356d8e60c6872b1fd92d3119c4b66f1b8af"
        },
        {
          "name": "archive_corroboration",
          "title": "Take a corroboration down, or put it back live",
          "description": "Record that the page is no longer there (article unpublished, link dead), or put it back live with archived false. Nothing is deleted: the line stays, and so does the history, because \"they talked about us from March to July\" is information. A page taken down stops counting as a presence on that source. Only take down after actually re-reading the address and finding it gone.",
          "inputSchema": {
            "properties": {
              "archived": {
                "description": "true takes the page down, false puts it back live. Omitted, it takes it down.",
                "type": "boolean"
              },
              "corroboration_id": {
                "description": "The UUID of the corroboration: call list_corroborations to find it.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["corroboration_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
