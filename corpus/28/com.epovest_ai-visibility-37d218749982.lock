        {
          "name": "update_competitor_scan",
          "title": "Correct the questions, set the rescan cadence",
          "description": "Correct a scan still in draft, and set the cadence of one already armed. `questions` is where the measurement is won: send the questions to KEEP, with the wording you want asked. A question of the scan left out of the list is removed, and the amount announced by `estimated_cost_minor` follows, so this is also how the person spends less. Nothing is charged until start_competitor_scan, so rewriting costs nothing; a scan already measured keeps its questions (409) and a new one asks something else. `rescan_cadence` sets how often an armed scan runs again: \"weekly\" or \"monthly\" sets it, null stops it. Weekly widens the list faster and spends as often; monthly follows the pace a corpus of third-party pages moves at. Each pass widens the list rather than refreshing it, because two checks of the same question do not cite the same pages, and what one check found the next one keeps. SPENDS on every pass, the same amount as the first one, so name it to the person before setting a cadence. It states a STATE and replays safely both ways: setting the cadence already in place moves nothing, and stopping it leaves the accumulated list intact.",
          "inputSchema": {
            "properties": {
              "competitor_scan_id": {
                "description": "The UUID of the competitor scan: call list_competitor_scans to find it.",
                "format": "uuid",
                "type": "string"
              },
              "questions": {
                "description": "The questions to KEEP, in the order to ask them. A sent list REPLACES the questions of the scan: one left out is removed. Draft only.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "UUID of one of the questions of this scan, as get_competitor_scan gives it.",
                      "format": "uuid",
                      "type": "string"
                    },
                    "text": {
                      "description": "The wording to ask. Omitted, the question keeps the one it has.",
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              },
              "rescan_cadence": {
                "description": "How often the scan runs again: \"weekly\", \"monthly\", or null to stop it.",
                "enum": ["weekly", "monthly", null],
                "type": ["string", "null"]
              }
            },
            "required": ["competitor_scan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
