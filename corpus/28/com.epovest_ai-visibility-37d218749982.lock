        {
          "name": "get_canon",
          "title": "Read the canon of a project and its history",
          "description": "The brand canon of a project and every revision it went through. canon is the CURRENT wording, under the same keys update_project_canon writes (one_liner, short, long, category, language, perks, website, legal_name, address, phone, whatsapp, email), and canon_version its number. history carries each version newest first, with its author, its date, and changes, the fields that version touched with their before and after values. Reach for it to RE-PROPAGATE a revision: get_logbook says a canon moved to a version and which keys it touched, this says what the old wording was, which is the string to find on a page and replace, and what the new one is. Values come back raw, so perks is the ordered list and language the short code. On a project whose canon is not posted yet, history is empty and canon_version is null.",
