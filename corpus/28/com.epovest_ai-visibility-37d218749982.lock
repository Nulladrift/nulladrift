          "digest": "sha256:de73ddc2cf58f2f1dede053159f19f6a6e7ff717ef986fdbb356ff9a222a9c2a"
        },
        {
          "name": "create_corroboration",
          "title": "Record a corroboration",
          "description": "Record a page about the brand where someone else has the final say. URL-FIRST: the exact address of the page is the only thing needed, the source on the map and the display name are derived from it. It is a statement of fact: only record a page you have actually read, and confirm with the user. A page the customer controls (their own profile, their own listing) belongs to Surfaces instead: use create_surface. The test that settles it: if the customer changes the page, does the change stay? No means someone else has the final say, so it is a corroboration; yes means they have it, so it is a surface. Being able to edit a page is not the test, a wiki anyone can edit is a corroboration, and a directory listing they hold is a surface even though a third party runs the site. Three refusals answer with their own slug: unplaceable_url (the address has no registrable domain), own_domain (this is the own site of the brand, where they have the final say: use create_surface), duplicate (the page is already in the registry, 409).",
          "inputSchema": {
            "properties": {
              "label": {
                "description": "Display name of the page. OMIT IT: it is derived from the address (domain and path). Send an empty string to go back to the derived one.",
                "type": "string"
              },
              "notes": {
                "description": "Free notes: the passage that mentions the brand, the contact, how the page came about.",
                "type": "string"
              },
              "project_id": {
                "description": "UUID of the project: call list_projects to find it.",
                "format": "uuid",
                "type": "string"
              },
              "published_on": {
                "description": "The day the page was PUBLISHED, as YYYY-MM-DD. Distinct from the recording day, and the one that means something against the citation curves. Omit it when unknown: it is never guessed.",
                "type": "string"
              },
              "request_channel": {
                "description": "Whether someone can be asked to change the page: \"available\" (a contact or a process exists), \"none\" (nobody to ask), \"unknown\" (not filled in, the default). It gates the refresh suggestions of the quest file; the contact itself belongs in the notes.",
                "enum": ["available", "none", "unknown"],
                "type": "string"
              },
              "url": {
                "description": "Absolute http(s) address of the EXACT page where the third party talks about the brand, never the home page of the site.",
                "type": "string"
              }
            },
            "required": ["project_id", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4beb62a32a4927c47364035a625762af1baa31708a41fcfb5a72bd1859f2dedd"
        },
        {
          "name": "create_logbook_entry",
          "title": "Record an action in the logbook",
          "description": "Record an action in the logbook of a project: what was done, and WHEN it was done. occurred_at is the date of the ACTION itself, not of the recording: recording after the fact is the normal case (\"record: site translated into Spanish yesterday\" means occurred_at is yesterday). The entry joins the tool events in the logbook and lands as an annotation on the citation curves of the trackers of the project, so the action can be read against the measures. Recording is idempotent on the project, the label and occurred_at: calling again with the same three returns the entry already recorded instead of a second copy, so a retry is safe. The same move recorded in two languages has two labels, so it stays two entries. Pass quest_id when the action moves a quest forward: that entry then also reads as the dated trail of that quest, through get_logbook with the same quest_id, and the same label on two quests stays two entries.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "What kind of action this is; it files the entry for filtering. \"other\" covers anything else.",
                "enum": ["content", "technical", "translation", "canon", "press", "other"],
                "type": "string"
              },
              "label": {
                "description": "Short wording of the action, e.g. \"Site translated into Spanish\": it is what the annotation shows next to the citation curves.",
                "type": "string"
              },
              "notes": {
                "description": "Free notes: context, links, details of the action.",
                "type": "string"
              },
              "occurred_at": {
                "description": "When the action HAPPENED, ISO 8601 date or datetime, read as UTC without an offset. Distinct from the recording time: when the user says \"yesterday\" or \"last week\", compute and pass that date. Omitted on creation, now is used.",
                "type": "string"
              },
              "project_id": {
                "description": "UUID of the project: call list_projects to find it.",
                "format": "uuid",
                "type": "string"
              },
              "quest_id": {
                "description": "The quest of the same project this action moves forward, which is how a quest gets its own dated trail: call list_quests to find it. The entry stays an entry of the logbook of the project, it just says what it serves. Omitted on creation, the entry belongs to the project alone; sent as null on an edit, it goes back to the project alone.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["category", "label", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
