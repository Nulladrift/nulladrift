        {
          "name": "create_surface",
          "title": "Register a surface",
          "description": "Register a surface of a project: one page about the brand where the customer has the final say (their site, their profiles, their listings, wherever they can change the content). The test that settles which registry a page belongs to: if the customer changes the page, does the change stay? Yes means they have the final say, so it is a surface; no means someone else has it, so it is a corroboration (create_corroboration), even on a page they can edit, as on a wiki. URL-FIRST: the url is the only thing needed, type and label are derived from it; pass them only to correct a derivation. The type derives from the address and the canon: a page on the canon website is a website, a known place carries its own kind, and any other host is other, with the generic checklist. It is born never_aligned: bring the page in phase with the canon, then record what it carries with tick_surface_checklist, cell by cell. The aligned status DERIVES from those verifications and is never declared: verifying the last canon cell aligns the surface on its own.",
          "inputSchema": {
            "properties": {
              "label": {
                "description": "Display name of the surface. OMIT IT on creation: it is derived from the url (the handle on a known place, the host and path on a website).",
                "type": "string"
              },
              "languages": {
                "description": "Languages of the surface, as short codes like \"en\" or \"pt-br\". A sent list replaces the previous one.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "description": "Free registry notes: who owns the account, access, context.",
                "type": "string"
              },
              "project_id": {
                "description": "UUID of the project: call list_projects to find it.",
                "format": "uuid",
                "type": "string"
              },
              "type": {
                "description": "What kind of surface this is; it picks the checklist to come. OMIT IT on creation: the type is derived from the url by the catalogue of places (github.com is GitHub, an unknown host is the brand website). Send it only to correct a derivation. \"other\" covers anything else and carries the generic checklist.",
                "enum": ["website", "github", "linkedin", "x", "youtube", "wikidata", "directory", "app_store", "other"],
                "type": "string"
              },
              "url": {
                "description": "Absolute http(s) address of the surface.",
                "type": "string"
              }
            },
            "required": ["project_id", "url"],
