          "description": "Add a quest to the file of a project: a next move the customer decided, kept where the work resumes (\"get our MCP server listed on the AI tool directories\"). title says the move; notes carry context and links. Adding is idempotent on the project and title while the quest is open: calling again returns the quest already in the file instead of a second copy, so a retry is safe. A closed quest with the same title does not block: doing the move again later is a new quest, with its own history.",
