          "description": "One scan and its list of PLACES: the domains the engine cited while answering about the basket, ranked by how many of its companies each place covers (`subjects`, the number that carries the tool) then by AI Authority. Each place carries `reach`, the way in: self_serve (open your own page there), participate (a forum or a community), ask (a third-party editorial site, the most frequent), registry (the page follows an official filing). `client_present` says whether the account already has a corroboration recorded there. The list ACCUMULATES over every check of the scan, deduplicated by URL, so `seen_in_checks` counts checks and never citations: a place every pass brings back is a steady one. `controlled` is what each company publishes on its own site, and `rivals` the competitive set. To act on a place, add a quest with create_quest carrying its URL.",
