          "description": "The channels behind one source of the Atlas: who published the videos the AIs cited when answering the questions of this account, with their videos and the questions that surfaced each one. The unit of the Atlas is the registrable domain, so a video host is one source however many people publish on it; this reads the level below, the one where the work happens, since a channel is what you contact. Ranked by how many of your questions each channel came back on, then by videos, then by citations: a channel that answers two of your questions with one well-titled video sits above a busy channel cited twice on the same one. Each channel carries you_are_there, read from the corroborations this account has recorded. The answer also carries what it is drawn from: videos cited on your questions, how many have a known channel, and how many are still to be established.",
