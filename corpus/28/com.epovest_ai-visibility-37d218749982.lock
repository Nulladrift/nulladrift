              "name": {
                "description": "Legal name of the account, the one printed on its invoices.",
                "type": "string"
              },
              "timezone": {
                "description": "The time zone the hours of the account are shown in, as an IANA identifier: \"Europe/Paris\", \"America/New_York\", \"UTC\".",
                "type": "string"
              }
            },
            "type": "object"
