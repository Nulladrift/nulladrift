        {
          "name": "create_competitor_scan",
          "title": "Prepare a competitor scan",
          "description": "Prepare a competitor scan on a basket of up to 5 companies of the same market. Three or more is what the scan is built for: from there the places rank by RECURRENCE, that is by how many companies of the basket each one covers. It is created as a DRAFT: nothing is charged, and the questions it derives come back in the answer for you to read before arming it with start_competitor_scan. Each subject needs a `website`: a whole domain found in a page is what tells two companies with the same name apart. `category` qualifies each company in the questions (\"welding equipment manufacturer\") and `usage` says what buyers use it for (\"hobby welding\"); both shape the questions, so name them from the market you are measuring. `language` is the language the questions are asked in and `country` the market they name; leave country out for a global one. One engine per scan, ChatGPT by default: a second engine is a second scan.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "What qualifies each company in the questions, for example \"welding equipment manufacturer\".",
                "type": "string"
              },
              "country": {
                "description": "The market the questions name, as an ISO 3166-1 alpha-2 code (\"US\"). Omitted, the questions name no country.",
                "type": "string"
              },
              "engine": {
                "description": "The engine asked, ChatGPT by default. One per scan.",
                "enum": ["chatgpt", "claude", "gemini", "perplexity", "mistral", "grok"],
                "type": "string"
              },
              "language": {
                "description": "The language the questions are asked in, written in en, fr, es, de, it, pt, ar, bg, cs, da, el, fi, he, hi, hu, id, ja, ko, ms, nl, no, pl, ro, ru, sk, sv, th, tr, uk, vi, zh, zh-hant. Omitted, the canonical language of the project. For another language, write to us with contact_support and we add it.",
                "type": "string"
              },
              "project_id": {
                "description": "UUID of the project the scan belongs to: call list_projects to find it. Its brand is the one the list answers \"you are not there\" about.",
                "format": "uuid",
                "type": "string"
              },
              "subjects": {
                "description": "The basket: up to 5 companies of the same market, 3 or more being what the ranking by recurrence needs.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "The company as the market names it, for example \"Lincoln Electric\".",
                      "type": "string"
                    },
                    "website": {
                      "description": "Its site, for example \"lincolnelectric.com\". Required: it is what identifies the company exactly.",
                      "type": "string"
                    }
                  },
                  "required": ["name", "website"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "templates": {
                "description": "Which questions to ask about each company, the four of them by default: `about_reputation` what is said about it, `about_price` whether it is worth its price, `about_customers` which companies use it and what they report, `compared_alternatives` what it is compared to. A sent list REPLACES that default, and the amount follows it: three companies and two templates make six questions.",
                "items": {
                  "enum": ["about_reputation", "about_price", "about_customers", "compared_alternatives"],
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "A name for the scan. Omitted, the category serves.",
                "type": "string"
              },
              "usage": {
                "description": "What buyers use it for, for example \"hobby welding\". Omitted, the category serves.",
                "type": "string"
              }
            },
            "required": ["category", "project_id", "subjects"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
