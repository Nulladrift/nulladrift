                      "type": "string"
                    },
                    "reason": {
                      "description": "Why the item does not apply on this surface, short: the exception must be readable without its author. Due when dismissed is true.",
                      "type": "string"
                    }
                  },
                  "required": ["item"],
                  "type": "object"
                },
                "type": "array"
              }
            },
