{
  "lockfileVersion": 2,
  "subjects": {
    "com.bonissystems/knox-anchor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bonissystems.com/api/knox/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "knox-anchor",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Knox Anchor — audit record layer for AI agents. Call get_descriptor for full server metadata, list_event_types for the canonical taxonomy, anchor_event to record an agent action, return_agent_trip to have Knox compare an agent's report with what its door recorded, verify_agent_trip to read a sealed verdict back.",
      "tools": [
        {
          "name": "anchor_event",
          "description": "Anchor a generic agent action to the Knox chain. Accepts any event_type from the canonical taxonomy plus a payload object. Returns the anchor sequence, payload hash, predecessor hash, timestamp, and verify URL. Requires a Knox Bearer API key on the Authorization header — unauthenticated calls are rejected. Provision a key by contacting Bonis Systems.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "event_type": {
                "description": "Canonical event type (call list_event_types to enumerate). Free-form strings are accepted but not federal-citation-grade.",
                "type": "string"
              },
              "payload": {
                "description": "JSON-serializable payload describing the agent action. Hashed verbatim into the chain; do not include secrets — the payload is recoverable on verify.",
                "type": "object"
              }
            },
            "required": ["event_type", "payload"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06f7935d3a422993ed418747f79a8c39aea8ee755cd9afb5c6f56a977893aa03"
        },
        {
          "name": "anchor_file_hash",
          "description": "Anchor a SHA-256 file digest to Knox and return an affidavit architected for FRE 902(13)/(14) self-authentication. The file itself is not transmitted — the caller computes the hash and only the digest + filename + size + MIME type are anchored. Admissibility in any matter remains a determination of the presiding court. Requires a Knox Bearer API key on the Authorization header — unauthenticated calls are rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "Original filename (max 256 chars).",
                "type": "string"
              },
              "hash": {
                "description": "SHA-256 file digest (64 lowercase hex chars).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "mime_type": {
                "description": "MIME type (max 128 chars).",
                "type": "string"
              },
              "size_bytes": {
                "description": "File size in bytes.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e9f0f08c9589cf7888209952e6787513c9f2477ace3c48ca01b164a7eba445b"
        },
        {
          "name": "anchor_mcp_tool_call",
          "description": "Convenience anchor for the AAM Model Context Protocol theater. Records an `agent_mcp_tool_call` event with structured tool-call metadata (server URL, tool name, argument digest, asserted agent identity, response digest). The record is sealed with a commitment to the authenticated principal that made the assertion, so a reader can tell WHO claimed it. Knox does not authenticate the named agent: this makes an assertion about an agent's actions independently checkable, not the agent itself independently identified.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_identity": {
                "description": "Stable identifier the CALLER asserts for the agent (e.g., agent ID, principal, did:knox:agent-X). Recorded as an assertion attributed to your API key, never as an authenticated subject; the anchored payload carries agentIdentityVerified:false and a commitment to the asserting principal.",
                "maxLength": 256,
                "type": "string"
              },
              "arguments_digest": {
                "description": "Caller-computed SHA-256 of the JSON-stringified arguments (64 hex chars).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "outcome": {
                "description": "Outcome of the tool call.",
                "enum": ["success", "error", "timeout", "rejected"],
                "type": "string"
              },
              "response_digest": {
                "description": "Caller-computed SHA-256 of the JSON-stringified response (64 hex chars).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "server_url": {
                "description": "MCP server endpoint the agent invoked.",
                "type": "string"
              },
              "tool_name": {
                "description": "Name of the tool invoked.",
                "type": "string"
              }
            },
            "required": ["agent_identity", "arguments_digest", "outcome", "server_url", "tool_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7f5586b4a0a00c0447a8cc094af5ad0a7e5c8c0a0fa8fedb08797b85e3ade98"
        },
        {
          "name": "get_chain_health",
          "description": "Return Knox service status (operational or degraded), total anchors written, the latest anchor timestamp, and the Bitcoin anchoring cadence (OpenTimestamps, 1-6 hour confirmation window). Mirrors the public /api/knox/health endpoint under the MCP envelope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:71445305966af5320eb04243977eb409ed847b636de4d2e1235b14d81abd9be1"
        },
        {
          "name": "get_descriptor",
          "description": "Return the Knox MCP server self-description: operator, USPTO patent reference, jurisdiction, available tools, and links to the public AAM (Agent Audit and Management) documentation surface.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3438151458e76ed5153e82c74dcb0b4839978bd30c10f2abe01996e11d35a384"
        },
        {
          "name": "list_event_types",
          "description": "Return the canonical Knox event-type taxonomy. Each event type is a citation token for federal-grade audit; the registry expands monotonically and is itself anchored on every expansion.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a65d472b83406221d2c43b94da3bf655b6fbf02022ab502c62a25416e786dda2"
        },
        {
          "name": "return_agent_trip",
          "description": "THE TICK. Your own door posts a returned trip: the plan, the door's record (targets and keyed commitments, never content), its head, the trip nonce and the agent's report. The trip's departure must already be sealed under the same key as agent_trip_departed. Knox checks the plan and nonce against that departure, recomputes the record's hash chain, compares plan, record and report, and seals the verdict as agent_trip_returned: one stamp on your plan. A second return of the same trip is refused as REPLAY and not sealed. Knox never holds your trip key; check the MACs yourself with verify-agent-trip.mjs. Requires a Knox Bearer API key on the Authorization header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "departure_seal": {
                "description": "The stamp code of the trip's agent_trip_departed, sealed under your key before the agent's first action.",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "door_head": {
                "description": "The hash of the door's last observation (64 zeros for an empty record).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "flow": {
                "description": "Optional. \"bsa\" when the trip ran in a BSA flow; the departure must say the same. Only such trips can enter the examiner pack.",
                "enum": ["bsa"],
                "type": "string"
              },
              "folders": {
                "description": "Optional. For each work folder the departure sealed ({label, root, files}): {label, before: [{path, size, sha256}], after: [...]}, made on your own machine (public/legal-kit/knox-folder-manifest.mjs). Knox checks the before list rebuilds the sealed root and flags every change the report does not name. Knox never reads a file.",
                "maxItems": 8,
                "type": "array"
              },
              "nonce": {
                "description": "The trip nonce held by your door. Knox checks it against the nonce hash sealed at departure; it is not stored.",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "observations": {
                "description": "The door's record, in order: [{seq, tool, kind, ref, argsCommit, resultCommit, outcome, reason, at, prevHash, hash, mac}]. Targets and keyed commitments, never content.",
                "maxItems": 5000,
                "type": "array"
              },
              "plan": {
                "description": "The flight plan, as sealed at departure: [{tool, ref, max?, optional?}].",
                "maxItems": 200,
                "type": "array"
              },
              "report": {
                "description": "What the agent says it did: {actions?: [{tool, ref}], claimedKinds?: [kind], effects?: [{kind, ref, hash}], files?: [{folder, path, change: added|changed|removed}]}, or null when it never reported back.",
                "type": ["object", "null"]
              }
            },
            "required": ["departure_seal", "door_head", "nonce", "observations", "plan", "report"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90707d0eb1dd341be2601c4d157b8c6cf7ed872941208757fc8df1359673d75d"
        },
        {
          "name": "verify_agent_trip",
          "description": "THE TICK. Given the returned seal (64 hex) or the trip id of a customer agent trip, return what Knox sealed when the trip came back: the verdict (LINES_UP or MISMATCH), the finding classes, the door head, when it was sealed, and the Bitcoin status of its hourly batch. Public, no key. The witness is door_observed: the door ran in the agent's own process. The comparison is the agent's report against what the door recorded, not against the outside system's answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hash": {
                "description": "The returned seal: the stamp code of the trip's agent_trip_returned (64 hex chars).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "trip_id": {
                "description": "The trip id the door minted at departure.",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b4ce1b51bd86e0ccbfbb46645bfcf8ca0bf44c8064a6ca1b7fd03f0c35bb544"
        },
        {
          "name": "verify_anchor",
          "description": "Given a SHA-256 anchor hash (64 hex chars), return the anchor record, chain link validity (predecessor present and matched), event type, sequence number, and verify URL. Public — no authentication required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hash": {
                "description": "SHA-256 anchor hash (64 lowercase hex chars).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9854621a906db626f76ab9d814eee9a52f19f26ff0d56e38b8966b57f8d575e5"
        }
      ],
      "digest": "sha256:33538616f8a72bcf2342f73ec5764939072d49ae146d5cc3f387fa1c4668eee8"
    }
  }
}
