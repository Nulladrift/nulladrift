      "tools": [
        {
          "name": "get_drug_overdose_deaths",
          "description": "Get provisional drug overdose death data by state.\n\n    Returns provisional counts and rates of drug overdose deaths from the\n    National Vital Statistics System (NVSS). Includes data on opioid,\n    synthetic opioid, and other drug-involved deaths. Updated monthly.\n\n    Args:\n        state: Filter by state name (e.g. 'West Virginia', 'Ohio').\n            Case-insensitive. Returns all states if not specified.\n        year: Filter by year. Returns all available years if not specified.\n        limit: Maximum number of records to return (default 25, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_drug_overdose_deathsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_drug_overdose_deathsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0bb78eecc1b4614db4b53e21c2dfadc8a17bd8889936ca95cab62dc808c3763c"
        },
        {
          "name": "get_infant_mortality",
          "description": "Get infant mortality rates by state and race/ethnicity.\n\n    Returns infant mortality data including rates per 1,000 live births,\n    broken down by state and race/ethnicity. Infant mortality is a key\n    indicator of community health status used in CHNAs.\n\n    Args:\n        state: Filter by state name (e.g. 'Ohio', 'Georgia'). Case-insensitive.\n            Returns all states if not specified.\n        year: Filter by year. Returns all available years if not specified.\n    ",
          "inputSchema": {
            "properties": {
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_infant_mortalityArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_infant_mortalityOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53da083495662e063669afdb406de5bc74157d985a12122b7217da3ec39ba838"
        },
        {
          "name": "get_leading_causes_of_death",
          "description": "Get leading causes of death with death counts and age-adjusted rates.\n\n    Returns data from the NCHS Leading Causes of Death dataset, which provides\n    national and state-level mortality statistics by cause of death, year, and\n    age-adjusted death rate per 100,000 population. Data spans 1999-2017.\n\n    Args:\n        state: Filter by state name (e.g. 'California', 'Texas'). Case-insensitive.\n            Returns all states if not specified.\n        year: Filter by year (e.g. 2017). Returns all available years if not specified.\n        limit: Maximum number of records to return (default 25, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_leading_causes_of_deathArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_leading_causes_of_deathOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9af45dfb136bec22817be17b58b90dfeffe812545d2b115836e2be9fc4b394c1"
        },
        {
          "name": "get_mortality_by_state",
          "description": "Compare mortality rates across states for a specific cause or all causes.\n\n    Returns age-adjusted death rates by state, useful for comparing mortality\n    burdens across geographies. Data from NCHS Leading Causes of Death.\n\n    Args:\n        cause: Cause of death to filter by (e.g. 'Heart disease', 'Cancer',\n            'Unintentional injuries', 'Alzheimer\\'s disease'). Partial match\n            supported. Returns all causes if not specified.\n        year: Filter by year (e.g. 2017). Defaults to most recent available year\n            if not specified.\n    ",
          "inputSchema": {
            "properties": {
              "cause": {
                "default": null,
                "title": "Cause",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_mortality_by_stateArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_mortality_by_stateOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d96b9713e9e5d2f3098eaa291a0d24454b48fd571610029a618e7988b743dea4"
        },
        {
          "name": "get_provisional_mortality",
          "description": "Get most recent provisional mortality data including COVID and other causes.\n\n    Returns provisional death counts from the NVSS, covering major cause\n    groups including COVID-19, respiratory diseases, circulatory diseases,\n    and more. Data is updated weekly and covers the most recent periods.\n\n    Args:\n        state: Filter by state/jurisdiction name (e.g. 'New York', 'Florida').\n            Case-insensitive. Returns all jurisdictions if not specified.\n        cause_group: Filter by cause group (e.g. 'COVID-19', 'Respiratory',\n            'Circulatory', 'Malignant neoplasms'). Partial match supported.\n            Returns all cause groups if not specified.\n        limit: Maximum number of records to return (default 50, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "cause_group": {
                "default": null,
                "title": "Cause Group",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              }
            },
            "title": "get_provisional_mortalityArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_provisional_mortalityOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:92794f992b7a75e107d8fb8e9f413556a1c31d38a9dfdda1efbcc50c65e923f4"
        }
      ],
