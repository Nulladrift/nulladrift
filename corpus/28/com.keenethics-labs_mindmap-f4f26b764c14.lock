      "tools": [
        {
          "name": "render_mindmap",
          "title": "Mind Map",
          "description": "Render an interactive MCP app mind map when the user needs hierarchical structure shown visually instead of as prose. Use it for breaking down ideas, plans, study material, or systems into a root topic with nested branches; do not use it for tables, flowcharts, Mermaid/Graphviz diagrams, or plain text lists. Input `mindmap_markdown` must be a clean markdown tree with one `#` root heading and 2-space-indented bullet nesting. If the user gives prose, first reshape it into that hierarchy, then call this tool.",
          "inputSchema": {
            "properties": {
              "mindmap_markdown": {
                "description": "Markdown tree for a mind map. Preferred structure: one top-level heading for the root topic, then nested bullet points for branches and leaves using consistent 2-space indentation. Example: `# Product Launch Strategy\n\n- Marketing\n  - Social Media\n    - Twitter\n    - LinkedIn\n  - Email Campaign\n    - Newsletter\n    - Promo Codes\n- Engineering\n  - QA Testing\n  - Server Scaling\n  - Final Deployment\n- Customer Support\n  - Help Docs Updated\n  - Support Training`. When the topic is suitable for emojis (e.g., marketing, events, social media, holidays, categories like food/travel), use relevant emojis in node names to make the diagram more appealing — like 📱 for Social Media or 🚀 for Launch. Avoid prose paragraphs, tables, fenced code blocks, and mixed list styles.",
                "type": "string"
              },
              "title": {
                "description": "Optional short title for the mind map",
                "type": "string"
              }
            },
            "required": ["mindmap_markdown"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/mindmap-widget.html",
            "openai/resultCanProduceWidget": true,
            "openai/toolInvocation/invoked": "Mind map ready",
            "openai/toolInvocation/invoking": "Rendering mind map...",
            "openai/widgetAccessible": true,
            "openai/widgetDescription": "An interactive mind map viewer for markdown-based mind maps. IMPORTANT AI INSTRUCTIONS: 1. MINIMIZE TEXT OUTPUT. The widget is the primary response. 2. NO SPAGHETTI TEXT. Do not summarize or repeat what is visible in the UI. 3. Be extremely concise (1 sentence max). 4. Only provide next steps or ask for missing critical info.",
            "ui": {
              "resourceUri": "ui://widget/mindmap-widget.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://widget/mindmap-widget.html"
          },
