          "name": "send_feedback",
          "description": "Message the Grabblist team: bug, parsing failure, feature request or feedback. Only when the user asks or agrees; show them the text first. Example: type=\"parsing_failure\", tool=\"add_item\", url, message=\"price not found\".",
