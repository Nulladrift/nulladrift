      "serverInfo": {
        "name": "Grabblist",
        "version": "2.2.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Grabblist is a personal Grabblist for things you find online — products, services, rentals, courses, listings, videos — anything with a title and URL, usually with a price. Each saved item is a static snapshot of info at save time. Data does not auto-update.\n\nTerminology: each record is an \"item\", the collection of items is a \"Grabblist\" or \"saved items\".\n\nItem types: product, rental, service, course, listing, event, video, other. Detect from context — a hotel is \"rental\", an online class is \"course\", a Facebook listing is \"listing\", a concert ticket is \"event\", a YouTube link is \"video\". Videos and free content have no price: leave price out rather than inventing one.\n\nItems have a source field (extension, mcp, manual) and a decision status flow: considering → shortlisted → decided → bought | rejected.\n\nItems can have a target_price (what the user wants to pay) and can be linked with relations: alternative, complement, upgrade, duplicate, same_seller.\n\nCollections are folders for organizing items. They can have a budget. Deleting a collection does not delete items inside.\n\nAll mutation tools accept an optional \"reason\" parameter for change history. Every mutation is logged — use get_item_history and get_collection_activity to see changes.\n\nWorkflow: use add_item to save (set item_type, or leave it out to let the server infer it from the site). Use update_item to edit. Use get_wishlist/search_saved to browse. Use list_collections to discover collection IDs before using them. Use set_pinned_items to highlight up to 3 \"Top Picks\" on the share page.\n\nFEEDBACK: send_feedback sends a message to the Grabblist team. Use it only when the user asks to report a bug or request a feature, or agrees after you offer to report a problem you hit (price not extracted, wrong platform name, site blocked). Show the user the message before sending, and be specific: the URL that failed and the tool you were using.",
      "tools": [
        {
          "name": "add_item",
          "description": "Save a page as an item: a static snapshot, nothing is monitored afterwards. Send only values present on the page; price is optional (omit for videos and free content); og:image is fetched when image is omitted. Example: url, title=\"Sony WH-1000XM5\", price=349, currency=\"NZD\", platform=\"noelleeming\".",
          "inputSchema": {
            "properties": {
              "attributes": {
                "additionalProperties": {
                  "oneOf": [
                    {
                      "maxLength": 500,
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    }
                  ]
                },
                "description": "Specs as key/value",
                "type": "object"
              },
              "category": {
                "description": "Best-matching category",
                "enum": ["electronics", "furniture", "home", "clothing", "vehicles", "kids", "sports", "collectibles", "tools", "other"],
                "type": "string"
              },
              "condition": {
                "description": "New, Used, Refurbished, Used - Like New…",
                "maxLength": 100,
                "type": "string"
              },
              "currency": {
                "description": "Currency code: USD, NZD, EUR…",
                "maxLength": 10,
                "type": "string"
              },
              "description": {
                "description": "Page description",
                "maxLength": 2000,
                "type": "string"
              },
              "image": {
                "description": "Main image URL",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              },
              "images": {
                "description": "All image URLs",
                "items": {
                  "format": "uri",
                  "maxLength": 2000,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "item_type": {
                "description": "product, rental (Airbnb), service, course, listing (classified), event (ticket), video, other; inferred from the site when omitted",
                "enum": ["product", "rental", "service", "course", "listing", "event", "video", "other"],
                "type": "string"
              },
              "location": {
                "description": "Seller or pickup location",
                "maxLength": 500,
                "type": "string"
              },
              "original_price": {
                "description": "Pre-discount price",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "platform": {
                "description": "Site name without TLD: amazon.com → \"amazon\"",
                "maxLength": 100,
                "type": "string"
              },
              "posted_at": {
                "description": "Listing date, ISO 8601",
                "maxLength": 64,
                "type": "string"
              },
              "price": {
                "description": "Price as a number, e.g. 99.99; omit if the page has none",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "quantity": {
                "description": "Quantity wanted",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "reason": {
                "description": "Why, for the change history",
                "maxLength": 1000,
                "type": "string"
              },
              "seller_name": {
                "description": "Seller or store",
                "maxLength": 200,
                "type": "string"
              },
              "seller_rating": {
                "description": "Seller rating 0–5",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "seller_reviews": {
                "description": "Seller review count",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "integer"
              },
              "tags": {
                "description": "Tags",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "title": {
                "description": "Title as shown on the page",
                "maxLength": 500,
                "type": "string"
              },
              "url": {
                "description": "Public page URL",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["platform", "title", "url"],
            "type": "object"
          },
