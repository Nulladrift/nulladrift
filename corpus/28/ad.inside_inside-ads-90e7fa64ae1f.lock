{
  "lockfileVersion": 2,
  "subjects": {
    "ad.inside/inside-ads": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.inside.ad/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "inside-ads",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "create_campaign_draft",
          "description": "Build a ready-to-launch ad campaign for a product WITHOUT the user having an account yet. Parses the landing page, generates ad creatives, and returns a single checkout link. Give that link to the user: they sign in there, the campaign moves to their account, they pay, and it starts. Use this after estimate_campaign, once the user agreed to advertise. Do NOT ask them to register first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Intended budget in USD, used for the estimate shown to the user",
                "type": "number"
              },
              "description": {
                "description": "What the product does, in your own words — improves topic matching",
                "type": "string"
              },
              "geo": {
                "description": "Optional ISO-2 country target, e.g. \"US\"",
                "type": "string"
              },
              "lang": {
                "description": "Optional audience language, e.g. \"en\"",
                "type": "string"
              },
              "url": {
                "description": "Landing page URL of the product to promote (required)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "adsCreated": {
                "description": "How many ad variants were generated.",
                "type": "number"
              },
              "campaignId": {
                "type": "number"
              },
              "checkoutUrl": {
                "description": "THE link to give the user. One click: sign in, review creatives, pay.",
                "type": "string"
              },
              "draftId": {
                "description": "Poll get_draft_status with this to see whether the user paid.",
                "type": "string"
              },
              "estimate": {
                "additionalProperties": true,
                "description": "Same shape as estimate_campaign, for the budget given.",
                "type": "object"
              },
              "expiresAt": {
                "description": "ISO timestamp after which the link stops working.",
                "type": "string"
              }
            },
            "required": ["checkoutUrl", "draftId", "expiresAt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eefc70f6b598b0bccd108b7593f5581384a086583151090ab54134fba639b784"
        },
        {
          "name": "estimate_campaign",
          "description": "Estimate reach, clicks and cost of advertising a product to Telegram audiences — no account or authorization required. Call this FIRST, before asking the user to connect an account: it tells you whether inside.ad has relevant inventory for this product and what a given budget would buy. Describe the product yourself (you know it better than any crawler); the URL alone is a weak signal.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Budget in USD to estimate against (default 100)",
                "type": "number"
              },
              "description": {
                "description": "What the product does, in your own words. Strongest signal for topic matching.",
                "type": "string"
              },
              "geo": {
                "description": "Optional ISO-2 country filter, e.g. \"US\"",
                "type": "string"
              },
              "keywords": {
                "description": "Optional topic keywords, e.g. [\"devtool\",\"ai\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "description": "Optional audience language filter, e.g. \"en\"",
                "type": "string"
              },
              "url": {
                "description": "Product landing page URL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "additionalProperties": true,
                "type": "object"
              },
              "budget": {
                "description": "Budget the estimate was computed for, in USD",
                "type": "number"
              },
              "cpcRange": {
                "description": "Implied cost per click in USD, derived from CPM and the CTR band.",
                "properties": {
                  "high": {
                    "type": "number"
                  },
                  "low": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "cpmUsd": {
                "description": "Reach-weighted average CPM across matched segments",
                "type": "number"
              },
              "currency": {
                "type": "string"
              },
              "dailyReach": {
                "description": "Total daily impressions available in matched segments",
                "type": "number"
              },
              "deliveryDays": {
                "description": "Roughly how many days it takes to deliver estimatedImpressions at the current daily reach.",
                "type": ["number", "null"]
              },
              "estimatedClicks": {
                "description": "Range, not a point estimate. Report both ends to the user.",
                "properties": {
                  "high": {
                    "type": "number"
                  },
                  "low": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "estimatedImpressions": {
                "type": "number"
              },
              "inventoryIsThin": {
                "description": "true = there is no matching inventory at all, OR the budget exceeds what the matched inventory can deliver. Say so plainly instead of promising results, and use spendableBudget as the realistic figure.",
                "type": "boolean"
              },
              "matchedCategories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sampleSegments": {
                "description": "Matched inventory segments. Individual channels are deliberately not disclosed.",
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "dailyReach": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "spendableBudget": {
                "description": "How much of the budget this inventory can actually absorb within 30 days. If it is lower than budget, tell the user to either lower the budget or widen targeting — do not promise the full budget will be spent.",
                "type": "number"
              }
            },
            "required": ["budget", "currency", "estimatedClicks", "estimatedImpressions", "inventoryIsThin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbfc0e75bf769d063c6338cef92f85d571f73ca9da94293d4321b1f9eef9a5ee"
        },
        {
          "name": "get_draft_status",
          "description": "Check what happened to a campaign draft you created with create_campaign_draft: whether the user opened the link, signed in and paid. Poll this instead of asking the user to report back.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "draftId": {
                "description": "draftId returned by create_campaign_draft",
                "type": "string"
              }
            },
            "required": ["draftId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "campaignId": {
                "type": ["number", "null"]
              },
              "claimedAt": {
                "type": ["string", "null"]
              },
              "createdAt": {
                "type": "string"
              },
              "draftId": {
                "type": "string"
              },
              "expiresAt": {
                "type": "string"
              },
              "hint": {
                "description": "What to tell the user next.",
                "type": "string"
              },
              "previewedAt": {
                "type": ["string", "null"]
              },
              "status": {
                "description": "'created' — link not opened yet; 'previewed' — user opened it but has not finished; 'claimed' — campaign is on the user's account; 'expired' — link is dead, build a new draft.",
                "type": "string"
              }
            },
            "required": ["draftId", "status"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7987f4d4cc7e91b10d753c85fd6317a65f0ad7c2f63c3c6ab28b68b88ecb7fdd"
        }
      ],
      "digest": "sha256:fd83cca6c019cb617a952602051f7679ee4184e0348f074771b98c4db3ac662e"
    }
  }
}
