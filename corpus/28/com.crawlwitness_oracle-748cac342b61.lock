      "transport": {
        "type": "http",
        "url": "https://api.crawlwitness.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "crawlwitness",
        "title": "CrawlWitness — AI consent & licensing oracle",
        "version": "0.1.0",
        "websiteUrl": "https://api.crawlwitness.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CrawlWitness: AI consent and licensing oracle. Before crawling a site, training on its content or ingesting it into RAG, call `check_ai_consent` with its domain: it returns what the site allows per AI bot and use (robots.txt, RSL license, IETF AIPREF, W3C TDMRep, noai meta tags, llms.txt, C2PA), a 0-100 score and a signed receipt (EAS attestation anchored on Base) proving what was checked and when. It costs a micro-fee in USDC via x402 (Base or Solana, no account). Free tools: `ai_consent_score` (quick score), `signal_history` (what robots.txt and other signals said on any past date, with on-chain proof) and `verify_receipt`. For crawlers and RAG pipelines, `can_ai_use` gives a cheap signed yes/no per domain, AI bot and use (train, rag, search). Resources: crawlwitness://guide and crawlwitness://pricing. Prompts: audit_domain, before_crawling, robots_on_date.",
      "tools": [
        {
          "name": "ai_consent_score",
          "title": "AI consent score (free)",
          "description": "Free summary for a domain: 0-100 signal score and AI-training stance (reservado = reserved, permitido = allowed, sin_senal = no signal), from cache when available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain to check, without scheme or path (e.g. nytimes.com)",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analizado_en": {
                "type": "string"
              },
              "dominio": {
                "type": "string"
              },
              "entrenamiento": {
                "type": ["string", "null"]
              },
              "page": {
                "type": "string"
              },
              "puntuacion": {
                "type": ["integer", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AI consent score"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/score.html",
            "openai/toolInvocation/invoked": "AI consent checked",
            "openai/toolInvocation/invoking": "Checking AI consent…",
            "openai/widgetAccessible": false
          },
          "digest": "sha256:0c9282c71dabfe5554b434d3833a8a1f3cd373febb72a4d791a2cfbdcdd86146"
        },
        {
          "name": "can_ai_use",
          "title": "Can this AI bot use this site? (paid yes/no, signed)",
          "description": "Fast yes/no verdict for one domain, one AI bot and one use (train, rag or search), from robots.txt, IETF AIPREF, W3C TDMRep, noai directives and RSL licenses, with the reasons and a signed receipt. Use it in a crawler or RAG pipeline before fetching each new domain. Costs 0.001 USD on Base (0.002 on Solana) via x402. Invalid domain or unknown bot is never charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bot": {
                "description": "AI user-agent token (e.g. GPTBot, ClaudeBot, Google-Extended, CCBot, PerplexityBot)",
                "enum": ["GPTBot", "ClaudeBot", "anthropic-ai", "Google-Extended", "GoogleOther", "CloudVertexBot", "Applebot-Extended", "meta-externalagent", "Amazonbot", "amazon-kendra-", "Bytespider", "CCBot", "cohere-training-data-crawler", "AI2Bot", "Diffbot", "Timpibot", "ImagesiftBot", "omgili", "PetalBot", "KimiBot", "ICC-Crawler", "Cotoyogi", "Reflectionbot", "CloudflareBrowserRenderingCrawler", "LinerBot", "FishBot", "Novellum", "bigsur.ai", "NavuBot", "QualifiedBot", "atlassian-bot", "make.com", "magpie-crawler", "Awario", "w4mwnpbXf3MFAbxOkJRw", "SemrushBot-OCOB", "SemrushBot-SWA", "BorderxBot", "SelectikaScraper", "CitibotSiteCrawler", "AdpResearchBot", "WARDBot", "ygs-scraper-bot", "OAI-SearchBot", "Claude-SearchBot", "PerplexityBot", "Applebot", "Amzn-SearchBot", "Bravebot", "Cloudflare-AI-Search", "Cloudflare-AI-Search-External", "DuckAssistBot", "YouBot", "KernelSearchBot", "ShapBot", "alphalens-bot", "Anomura", "Element451Bot", "ChatGPT-User", "Claude-User", "Perplexity-User", "meta-externalfetcher", "meta-externaltest", "muse-", "MistralAI-User", "cohere-ai", "Google-Agent", "GrokAgent", "Devin", "ApifyWebsiteContentCrawler", "Instapaper", "Retool", "QATechBot", "TwinAgent", "CledaraBot", "HarkBot", "HIFIBot", "ChathiveCrawler", "EasyScan", "Nava", "ZipchatBot"],
                "type": "string"
              },
              "domain": {
                "description": "Domain to check, without scheme or path (e.g. nytimes.com)",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "use": {
                "default": "train",
                "enum": ["train", "rag", "search"],
                "type": "string"
              }
            },
            "required": ["bot", "domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "allowed": {
                "type": ["boolean", "null"]
              },
              "bot": {
                "type": "string"
              },
              "decision": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "pago": {
                "type": "object"
              },
              "reasons": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "use": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Can AI use"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b7b2b4777f404b4ea5487f102618ceed0b0ceba74389f8730aca679e092af2df"
        },
        {
          "name": "check_ai_consent",
          "title": "Check AI consent & licensing (paid, with signed receipt)",
          "description": "Full AI-consent report for a domain: robots.txt rules for each AI bot (training, search and user-agent crawlers), RSL license, IETF AIPREF Content-Usage, W3C TDMRep, noai meta tags, llms.txt and C2PA, combined into a 0-100 score and a training stance, plus a verifiable receipt (EAS attestation anchored on Base). Use it before crawling, training on or ingesting a site. Costs 0.005 USD in USDC via x402 (Base or Solana); without a payment it returns the x402 payment options. Unreachable sites are not charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain to check, without scheme or path (e.g. nytimes.com)",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "fresh": {
                "default": false,
                "description": "Force a fresh analysis instead of the cached one (<24 h)",
                "type": "boolean"
              },
              "pay": {
                "default": false,
                "description": "Pay directly instead of using the small daily free quota",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analizado_en": {
                "format": "date-time",
                "type": "string"
              },
              "dominio": {
                "type": "string"
              },
              "informe": {
                "description": "Full report: resumen (score, training stance, reasons), robots (per-bot access), rsl, aipref, tdm, html, llms_txt",
                "type": "object"
              },
              "origen": {
                "description": "cache or fresco (fresh)",
                "type": "string"
              },
              "pago": {
                "description": "When paid: network, transaction, signed receipt and EAS attestation",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI consent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e3dad1178212b129f73eafb41b743fc69a3ea7bcb36ab87097bff919a5f7cc93"
        },
        {
          "name": "check_wallet",
          "title": "Is this crypto wallet sanctioned? (paid, signed)",
          "description": "Sanctions screening of a crypto address against the US OFAC SDN list (all its digital-currency addresses: EVM, BTC, TRX, SOL, USDT, USDC…). Use it before an agent pays, receives from or interacts with a wallet. Returns sanctioned true/false, the listed entity and programs, the exact list version used and a signed receipt. Costs 0.005 USD via x402. Screening aid, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Crypto address (EVM 0x…, BTC, TRX, SOL…)",
                "maxLength": 110,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "address_type": {
                "type": "string"
              },
              "decision": {
                "enum": ["blocked", "clear"],
                "type": "string"
              },
              "lists": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "matches": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "pago": {
                "type": "object"
              },
              "sanctioned": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check wallet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:220f10a3c84c1cf513bb769b212c469efe97f975603cc9555ed8a6a4e2f4c9ad"
        },
        {
          "name": "signal_history",
          "title": "Signal history on any date (free)",
          "description": "What a domain's robots.txt (or llms.txt, tdmrep.json, RSL license, homepage headers) said at a given instant, with the SHA-256 of each version and its EAS attestation anchored on Base. Without `source` it returns the index of versions; with `source` (and optional `at`, RFC 3339) the document in force at that instant. Covers only domains already analysed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "at": {
                "description": "Instant (RFC 3339); default now",
                "format": "date-time",
                "type": "string"
              },
              "domain": {
                "description": "Domain to check, without scheme or path (e.g. nytimes.com)",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "source": {
                "description": "portada = homepage headers",
                "enum": ["robots", "llms", "tdmrep", "rsl", "portada"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Signal history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:320cdab2ab460fb6aa2c38aae602956728f750cd0392f883394c31a36c978474"
        },
        {
          "name": "verify_receipt",
          "title": "Verify a receipt (free)",
          "description": "Returns the signed EAS attestation of a paid query and, once anchored, its Merkle proof (OpenZeppelin format) and the on-chain attestation on Base that contains it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "uid": {
                "description": "Attestation UID (0x + 64 hex)",
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              }
            },
            "required": ["uid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "anclaje": {
                "type": "object"
              },
              "paquete": {
                "type": "object"
              },
              "uid": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify receipt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83ef9939ca3d4571194d29b251c8d858060145d4452b5648f2a972675831ffcb"
        }
