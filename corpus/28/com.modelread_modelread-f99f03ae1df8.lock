      },
      "instructions": "Use modelread whenever the user asks whether a Hugging Face / open-weights model will run on a GPU, Mac, phone, multi-GPU node or cloud instance; how many tokens/sec to expect; which GGUF/MLX/AWQ/FP8 quant fits in VRAM; how much context fits; what to run on a given machine; or needs a llama.cpp / vLLM / MLX / Ollama launch command (also before downloading, quantizing or serving a model).\nmodelread: will a Hugging Face model run on given hardware, how fast, which quant, with what command. Numbers come from real repo file sizes, GGUF/safetensors tensor headers and configs (nothing is downloaded), plus calibration measured on real devices. Pick the tool by the question:\n- a specific repo + one device -> estimate_fit\n- a specific repo + several devices ('which of my machines') -> compare_hardware\n- 'what should I run on X for task Y' -> find_models\n- anything else (runtimes, KV cache, why it OOMs) -> ask\n- just listing/searching models -> search_models; device ids -> list_hardware (use a filter).\nHardware can be a preset id (rtx4090, m4max-128, 8x-h100-sxm, iphone-17pro-12, rpi5-8, vps-4vcpu-8gb), any '<N>x-<id>' spec (2x-rtx3090; 2x-jetson-thor = two boxes pooled), free text ('two RTX 3090s', 'MacBook Pro M3 Max 128GB', 'Galaxy S25 Ultra'), or 'gpu=24,ram=64,bw=936' / 'unified=1,ram=96,bw=256' (add usable=90 when you know the GPU-usable GiB). Speeds are bands (lo/mid/hi) with their basis; decode_tps.aggregate gives concurrent-serving throughput at 1-32 parallel sequences. Respect 'verdict', 'unknowns' and 'confidence': never present an 'unknown' verdict as a fit, and quote the band, not just mid. A result with an 'error' field has no estimate in it (model_not_found: the repo does not exist on the Hub): relay its 'message' instead of estimating from the model's name.\nA model's license and native context length are in estimate_fit's model.license and model.native_ctx; best.max_ctx_fit is what fits in this device's memory.\nLeave response_format unset: the default already holds the verdict, every unknown, speed bands, the memory split, the launch command, license and alternatives ('answer' is the key line; 'omitted' counts what was left out). 'detailed' only adds files, notes and source URLs of the best candidate, not better numbers.",
      "tools": [
        {
          "name": "ask",
          "title": "Ask about running models",
          "description": "Free-form question about running Hugging Face models locally or self-hosted (runtimes, quant choice, KV cache, why something OOMs, MoE offload); returns markdown plus the parsed query and notes.",
          "inputSchema": {
            "properties": {
              "question": {
                "title": "Question",
                "type": "string"
              }
            },
            "required": ["question"],
            "title": "askArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask about running models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e699084089e693d822d99395e224106c168bc1f7db6a6d11c3a6e42c4722a145"
        },
        {
          "name": "compare_hardware",
          "title": "Compare one model across devices",
          "description": "Run one repo against several devices and return the best candidate per device (verdict, quant, decode band, max context, launch command), sorted best first. Use for 'which of my machines should run X' or 'is a 4090 or an M4 Max better for X'. hardware: comma-separated list of presets / free text / custom specs, e.g. 'rtx3090, unified=1,ram=96,bw=256' is two devices; ';' also separates devices (max 8).",
          "inputSchema": {
            "properties": {
              "ctx": {
                "default": 8192,
                "title": "Ctx",
                "type": "integer"
              },
              "hardware": {
                "title": "Hardware",
                "type": "string"
              },
              "repo": {
                "title": "Repo",
                "type": "string"
              }
            },
            "required": ["hardware", "repo"],
            "title": "compare_hardwareArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare one model across devices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:86eb4279b8e9d5504464c34b20941ebd6e2d52c0cc791c1952c5a601a4bbed3b"
        },
        {
          "name": "estimate_fit",
          "title": "Estimate model fit and speed",
          "description": "Will this Hugging Face repo run on this hardware? Checks the repo and its quantized derivatives (GGUF/MLX/AWQ...) and returns, per candidate: verdict (fits | fits-tight | offload | no | unknown), memory placement (VRAM / RAM / SSD), longest context that fits, decode and prefill tok/s bands with basis, concurrent-serving aggregate, runtime support (llama.cpp / vLLM / MLX registries) and an exact launch command. repo: 'org/name' (base model or a GGUF repo). hardware: preset id, '<N>x-<id>', free text, or 'gpu=..,ram=..,bw=..'. ctx in tokens. If the repo is not on the Hub the result is error 'model_not_found' with a message and no estimate. model.license and model.native_ctx (the model's own context limit) come with it. response_format: leave unset; the default has every decision field in <2k tokens. 'detailed' adds only the best candidate's files, notes and source URLs.",
          "inputSchema": {
            "properties": {
              "check_quantized_derivatives": {
                "default": true,
                "title": "Check Quantized Derivatives",
                "type": "boolean"
              },
              "ctx": {
                "default": 8192,
                "title": "Ctx",
                "type": "integer"
              },
              "hardware": {
                "title": "Hardware",
                "type": "string"
              },
              "include_vision": {
                "default": false,
                "title": "Include Vision",
                "type": "boolean"
              },
              "kv_cache_dtype": {
                "default": "f16",
                "title": "Kv Cache Dtype",
                "type": "string"
              },
              "ram_gb": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Ram Gb"
              },
              "repo": {
                "title": "Repo",
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "title": "Response Format",
                "type": "string"
              }
            },
            "required": ["hardware", "repo"],
            "title": "estimate_fitArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
