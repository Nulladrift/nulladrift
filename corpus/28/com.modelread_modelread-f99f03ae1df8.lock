        {
          "name": "search_models",
          "title": "Search the model index",
          "description": "Search the model index by name without estimating (fast): ids, task, library, params, downloads, likes, license, created date, gated. query: words that must all appear in the repo id, any order, case-insensitive, '-_.' optional; family, uploader, quant method or org/name all work ('qwen3', 'gemma-4', 'ubergarm', 'qwen3.8 nvfp4', 'Flash-Next-GGUF'), quantized derivatives included. Only matching repos are returned: an empty list means no indexed repo has that name (drop a word to widen; a repo missing here may still exist on the Hub). task: any|chat|coding|vision|ocr|embedding|speech-to-text|tts|image-generation|video-generation|robotics or a Hub pipeline tag (default: any with a query, chat without); max_params_billion filters by size. About 40 rows fit one result; offset pages.",
