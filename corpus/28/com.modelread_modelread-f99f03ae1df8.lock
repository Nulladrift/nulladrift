        {
          "name": "find_models",
          "title": "Find the best models for a device",
          "description": "Recommend models for a task on given hardware, written as a natural question, e.g. 'best coding model for an RTX 4090 + 64GB RAM at 32k context', 'Japanese chat on a Galaxy S25 Ultra', 'serve 8 users on 2x RTX 3090'. Ranks indexed Hub models (~20k, refreshed nightly) by fit, task benchmark percentile (provenance-tagged, vendor vs independent), speed and adoption; each result carries a fit estimate (response_format: leave unset). Tasks understood: chat, coding, agentic, vision, ocr, math, reasoning, multilingual, function-calling, embedding, reranking, speech-to-text, tts, image-generation, video-generation.",
