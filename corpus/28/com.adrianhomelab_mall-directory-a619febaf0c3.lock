          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "list_malls",
          "description": "List the malls in the directory with store counts.\n\n    Each entry: mall_id, mall_name, city, country, operator, store_count.\n    Useful first call for discovery — feed mall_id to mall_stores().\n\n    Args:\n        country: Optional country filter: ro, us, gb, hu.\n        max_results: Maximum number of malls to return (1-100).\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "",
                "title": "Country",
                "type": "string"
              },
              "max_results": {
                "default": 50,
                "title": "Max Results",
                "type": "integer"
              }
            },
            "title": "list_mallsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d541e278940b2bc1e7e7db164e657ba6996b9f0d16b296da812f9de1978cda03"
        },
        {
          "name": "mall_stores",
          "description": "List every store in a specific mall by mall_id.\n\n    mall_id is the slug from list_malls() (e.g. 'mega-mall-bucuresti',\n    'king-of-prussia'). Also accepts a mall name fragment.\n\n    Args:\n        mall_id: Mall id or name fragment (e.g. 'mega-mall-bucuresti').\n        max_results: Maximum number of stores to return (1-500).\n    ",
          "inputSchema": {
            "properties": {
              "mall_id": {
                "title": "Mall Id",
                "type": "string"
              },
              "max_results": {
                "default": 200,
                "title": "Max Results",
                "type": "integer"
              }
            },
            "required": ["mall_id"],
            "title": "mall_storesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53aa786a2f0707263c24497b0aab16a332fc71d6fbfd874b23bd942d52680c5a"
        },
        {
          "name": "search_stores",
          "description": "Search mall stores across the whole directory (store, brand, mall, city, operator, category).\n\n    Free-text, diacritic-insensitive, AND-of-tokens. 'zara bucuresti' finds\n    Zara stores in Bucharest-area malls; 'samsung' finds stores/brands named\n    Samsung. Returns full store records (20 fields).\n\n    Args:\n        query: Free-text search terms.\n        max_results: Maximum number of stores to return (1-100).\n    ",
          "inputSchema": {
            "properties": {
              "max_results": {
                "default": 25,
                "title": "Max Results",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_storesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3cdebbc9625c23f3d40376273e1dec5c424468be393b5165dd6512483504a863"
        },
        {
          "name": "stores_by_category",
          "description": "List stores by category, optionally filtered by country.\n\n    Categories are multilingual (RO/EN) and hierarchical\n    ('Fashion' matches 'Women's Fashions' and 'Shopping / Modă').\n    Diacritic-insensitive substring match.\n\n    Args:\n        category: Category name or fragment (e.g. 'Fashion', 'Food Court', 'Telecom').\n        country: Optional country filter: ro, us, gb, hu.\n        max_results: Maximum number of stores to return (1-100).\n    ",
          "inputSchema": {
            "properties": {
              "category": {
                "title": "Category",
                "type": "string"
              },
              "country": {
                "default": "",
                "title": "Country",
                "type": "string"
              },
              "max_results": {
                "default": 50,
                "title": "Max Results",
                "type": "integer"
              }
            },
            "required": ["category"],
            "title": "stores_by_categoryArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bcecd1bc420028d6c2bce6de1d70b746d3d0ab5500782a5a9ebd2499b23ee0dd"
        },
        {
          "name": "stores_by_city",
          "description": "List stores in a city, optionally filtered by country.\n\n    City match is diacritic-insensitive and substring-tolerant ('bucuresti'\n    matches 'București'). Country accepts ro/us/gb/hu (or full names).\n\n    Args:\n        city: City name (e.g. 'Bucharest', 'Timisoara', 'London').\n        country: Optional country filter: ro, us, gb, hu.\n        max_results: Maximum number of stores to return (1-100).\n    ",
          "inputSchema": {
            "properties": {
              "city": {
                "title": "City",
                "type": "string"
              },
              "country": {
                "default": "",
                "title": "Country",
                "type": "string"
              },
              "max_results": {
                "default": 50,
                "title": "Max Results",
                "type": "integer"
              }
            },
            "required": ["city"],
            "title": "stores_by_cityArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5609838e738cb4c6c26cc09c6a2dde74700f340c698b959639cb4a547ae5f88"
        },
        {
          "name": "stores_by_operator",
          "description": "List stores by mall operator.\n\n    Diacritic-insensitive substring match on the operator name\n    ('nepi' matches 'NEPI Rockcastle', 'simon' matches 'Simon Property Group').\n\n    Args:\n        operator: Operator name or fragment (e.g. 'NEPI', 'Simon', 'Westfield').\n        max_results: Maximum number of stores to return (1-100).\n    ",
          "inputSchema": {
            "properties": {
              "max_results": {
                "default": 50,
                "title": "Max Results",
                "type": "integer"
              },
              "operator": {
                "title": "Operator",
                "type": "string"
              }
            },
            "required": ["operator"],
            "title": "stores_by_operatorArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b068125e98551d05587be1e6a270c8bc40ed83397e0a79396e4d98d82b7af7c"
        }
      ],
      "digest": "sha256:decfd2788b298c696114978482cdbe67e1d705ffd1c4408916f93c280b5b64f4"
