{
  "lockfileVersion": 2,
  "subjects": {
    "com.stylelooklab/hairstyle-recommender": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stylelooklab.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Style Look Lab",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "recommend_hairstyles",
          "title": "Recommend hairstyles for a face shape",
          "description": "Recommend up to 4 curated hairstyles that suit a face shape, from the Style Look Lab hairstyle library. Each result has a name, a short description, a link to try the hairstyle on your own photo, and (when available) a link to the full hairstyle guide. face_shape: oval, round, square, heart, diamond, oblong or triangle. gender: female or male (selects the hairstyle catalog). length: optional filter, short, medium or long.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "face_shape": {
                "description": "Face shape",
                "enum": ["oval", "round", "square", "heart", "diamond", "oblong", "triangle"],
                "type": "string"
              },
              "gender": {
                "description": "Hairstyle catalog to pick from",
                "enum": ["female", "male"],
                "type": "string"
              },
              "length": {
                "description": "Optional hair length filter",
                "enum": ["short", "medium", "long"],
                "type": "string"
              }
            },
            "required": ["face_shape", "gender"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:227bb2a9228a02471f9bcd538ec981a40cbf96e6c58b6441c0bbd9cc77402faa"
        }
      ],
      "digest": "sha256:bb697b7c35f55b66044d26bc56167b86e0583ac4c67674c8bd21199c9350ec78"
    }
  }
}
