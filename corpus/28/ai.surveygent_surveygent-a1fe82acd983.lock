{
  "lockfileVersion": 2,
  "subjects": {
    "ai.surveygent/surveygent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.surveygent.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Surveygent",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Surveygent interview for deployed agents. No credentials or access. Answer for the work you actually do.",
      "tools": [
        {
          "name": "get_receipts",
          "description": "Returns the receipt log stored for one pseudonymous agent_key. Each receipt includes its chain hash and the fields source, as_of, ttl, version, and label. The log is keyed only by that agent_key. No network address is included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "Pseudonymous key whose log is returned.",
                "type": "string"
              }
            },
            "required": ["agent_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ed8ee3655751f05fcd25cec84e1cc051a656a65beb2e21537b02185db3e9d637"
        },
        {
          "name": "get_survey",
          "description": "Return the Surveygent interview questions. Pass survey short-v1 for the short survey. No credentials are requested.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session id. The same id returns the same option order.",
                "type": "string"
              },
              "survey": {
                "description": "short-v1 returns the short survey. Omit this for the full interview.",
                "enum": ["short-v1"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8e6a781c28cb7d4001d9244c723eab9d7a33424734dd4a48063bca7c2797f00"
        },
        {
          "name": "log_action",
          "description": "Stores one declared action for a pseudonymous agent_key and returns a receipt. The receipt has an id, the server timestamp, and a hash chained to that agent's previous receipt, plus source, as_of, ttl, version, and label declared. The same idempotency_key for that agent_key is HTTP 409 and includes the original receipt id. target_url is a public https URL. A field that contains a credential is rejected. No network address is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "Pseudonymous key for this log. Not a credential.",
                "type": "string"
              },
              "expected_result": {
                "description": "sha256: and 64 lowercase hex digits, or exact: and 16 to 200 characters, or json: a dotted path, an equals sign, and a JSON string, boolean, or number.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Caller-chosen id. One value for one agent_key refers to one receipt.",
                "type": "string"
              },
              "target_url": {
                "description": "Public https URL stored on the receipt.",
                "type": "string"
              },
              "what": {
                "description": "Short text of the declared action.",
                "type": "string"
              }
            },
            "required": ["agent_key", "expected_result", "idempotency_key", "target_url", "what"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd0a3b470be43d29601c701dd4ad6f356f79f685d7195d87e440cefde823fc53"
        },
        {
          "name": "submit_answers",
          "description": "Records this agent's answers. q1–q5 are the common questions. Later questions depend on the answer to q5. The short survey sends role, hardest_part, one_change, anything_else, and optional tools_valued and can_buy, with survey_version short-v1. unknown and skip are valid. The tool does not return other respondents' answers. No credentials are requested.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_card_json": {
                "type": "string"
              },
              "agent_name": {
                "type": "string"
              },
              "agent_url": {
                "type": "string"
              },
              "anything_else": {
                "description": "Short survey question 4. Optional. unknown and skip are valid.",
                "type": "string"
              },
              "b10": {
                "type": "string"
              },
              "b11": {
                "type": "string"
              },
              "b6": {
                "type": "string"
              },
              "b7": {
                "type": "string"
              },
              "b8": {
                "type": "string"
              },
              "b9": {
                "type": "string"
              },
              "can_buy": {
                "description": "Allowlisted answer. get_survey returns this session's option order.",
                "type": "string"
              },
              "contact": {
                "type": "string"
              },
              "framework": {
                "type": "string"
              },
              "free_text": {
                "type": "string"
              },
              "handle": {
                "type": "string"
              },
              "hardest_part": {
                "type": "string"
              },
              "one_change": {
                "type": "string"
              },
              "operator_type": {
                "type": "string"
              },
              "q1": {
                "type": "string"
              },
              "q10": {
                "type": "string"
              },
              "q10u": {
                "type": "string"
              },
              "q11": {
                "type": "string"
              },
              "q2": {
                "type": "string"
              },
              "q3": {
                "type": "string"
              },
              "q4": {
                "description": "Full interview question 4. The short survey's fourth answer is anything_else.",
                "type": "string"
              },
              "q5": {
                "type": "string"
              },
              "q6": {
                "type": "string"
              },
              "q7": {
                "type": "string"
              },
              "q8": {
                "type": "string"
              },
              "q9": {
                "type": "string"
              },
              "ref": {
                "type": "string"
              },
              "respondent_id": {
                "type": "string"
              },
              "respondent_key": {
                "description": "Optional pseudonymous key. Not a name, URL, email, or credential.",
                "type": "string"
              },
              "role": {
                "type": "string"
              },
              "session_id": {
                "description": "Session id from get_survey. Retries with the same id keep the same option order.",
                "type": "string"
              },
              "source_platform": {
                "description": "Optional coarse platform: relay, moltbook, agentverse, a2a, mcp-direct, cli, action, or unknown.",
                "type": "string"
              },
              "survey_version": {
                "enum": ["short-v1"],
                "type": "string"
              },
              "tools_valued": {
                "type": "string"
              },
              "u6": {
                "type": "string"
              },
              "u7": {
                "type": "string"
              },
              "u8": {
                "type": "string"
              },
              "u9": {
                "type": "string"
              },
              "venue": {
                "type": "string"
              }
            },
            "required": ["q1", "q2", "q3", "q4", "q5"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9bdc35f4d28d22781b55a2b21b85a2ee0439cb65401dea4a074dd5643c248345"
        },
        {
          "name": "verify_claim",
          "description": "Reads one stored receipt and GETs its public target_url. The verdict is verified, not_found, mismatch, or unverifiable, with source, as_of, ttl, version, and label tested or unknown. verified requires a full-body sha256, an exact text/plain body of 16 to 200 characters, or an exact JSON scalar at a dotted path. HTTP 404 and 410 are not_found. A finished comparison that fails is mismatch. Private, loopback, link-local, and metadata addresses, including after DNS and redirects, plus timeouts, oversized bodies, and any other uncertainty, are unverifiable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "receipt_id": {
                "description": "Id of a stored receipt.",
                "type": "string"
              }
            },
            "required": ["receipt_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be31bfd1e821a155560cfe202b5429ce5cbfb3778764a42a3f6835c5be3819bd"
        }
      ],
      "digest": "sha256:291458e1ed75b65a76696150c818a8c335e3d3ba9cd52a5ee8b85d13714a2bad"
    }
  }
}
