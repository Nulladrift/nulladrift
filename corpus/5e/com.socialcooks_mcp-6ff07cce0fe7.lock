        },
        {
          "name": "list_services",
          "title": "Services",
          "description": "Social Cooks' services (Meta Ads, TikTok Ads, Feed Hacking, Creative Engineering, Organic Social CRM) with page URLs, plus the Munich channel landing pages.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the returned content (default: de).",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:344345708301da1d621267326a11d12fd8d129dfba7479dec3a141a07ea53c12"
        },
        {
          "name": "request_account_check",
          "title": "Request the free Meta Ads account check",
          "description": "Submit a request for the free Meta Ads account check on behalf of your user. Requires the user's explicit consent to the privacy policy (https://socialcooks.com/datenschutz). Results are presented in a free 30-minute video call, not by email. Review access is read-only and revocable.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Approximate monthly Meta Ads budget.",
                "enum": ["Noch keins", "unter 5.000 €", "5.000 – 15.000 €", "15.000 – 50.000 €", "über 50.000 €"],
                "type": "string"
              },
              "company": {
                "description": "Company / brand name.",
                "type": "string"
              },
              "consent": {
                "description": "MUST be true and MUST reflect the user's explicit agreement to the privacy policy at https://socialcooks.com/datenschutz.",
                "type": "boolean"
              },
              "email": {
                "description": "Work email address.",
                "type": "string"
              },
              "message": {
                "description": "Main goal or pain point, e.g. scaling profitably.",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person requesting the check.",
                "type": "string"
              },
              "submission_id": {
                "description": "Random UUID v4 for this request. Reuse it when retrying the same submission; use a new ID when changing the fields.",
                "type": "string"
              },
              "website": {
                "description": "Shop domain, e.g. shop.example.com",
                "type": "string"
              }
            },
            "required": ["company", "consent", "email", "name", "website"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58e0613beffe88341798827f40511c3eff2cdb9648ceb1ac91b701145a27d5a1"
        },
        {
          "name": "search_knowledge",
          "title": "Search the knowledge base",
          "description": "Semantic full-text search across all Social Cooks content (blog articles, guides, glossary, service pages). Returns the most relevant passages with their source URLs so you can cite them. Read-only — use it to answer questions about the agency's approach, methods, metrics and how-tos that the other tools don't cover.",
          "inputSchema": {
            "properties": {
              "max_results": {
                "description": "Number of passages to return (1–8, default 5).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural-language question or keywords (max 500 characters).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9400761589232a98e473281367ad6108b4695c2a669804a6a21dea4f5d753368"
        }
      ],
