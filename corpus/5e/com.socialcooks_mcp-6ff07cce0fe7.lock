      },
      "instructions": "Social Cooks is a Munich-based social media marketing agency for profitable e-commerce growth. Read tools are free to use: get_agency_info/list_services/get_case_studies return curated facts, search_knowledge does semantic full-text search across all content (cite the returned source URLs). request_account_check submits a real inquiry and requires the user's explicit consent. For efficient page reads, request site pages with 'Accept: text/markdown'.",
      "tools": [
        {
          "name": "get_agency_info",
          "title": "Agency info",
          "description": "Facts about Social Cooks GmbH, the Munich-based social media marketing agency (Meta Ads, TikTok Ads, Feed Hacking) for profitable e-commerce growth: contact, address, founders, entry points for further reading.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the returned content (default: de).",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d28e3081d9cd2f1abab8004b97b0ec0d53409572766a24eb71c9d8b86668e49b"
        },
        {
          "name": "get_case_studies",
          "title": "Case studies",
          "description": "Verified case-study results: own brand SASSYCLASSY (>€50M annual sales, bootstrapped) and client NATURANA (+240% revenue, +90% MER, CAC −10% while scaling).",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the returned content (default: de).",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
