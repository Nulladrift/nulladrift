  "lockfileVersion": 2,
  "subjects": {
    "ai.reevi/find-buyers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://reevi.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "reevi",
        "title": "Reevi: find buyers for exporters",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Reevi finds companies that already buy a product, for exporters and manufacturers. Call find_buyers with the product and target countries. Share the report link with the user: contacts and introductions are on reevi.ai and need a free account.",
      "tools": [
        {
          "name": "find_buyers",
          "title": "Find buyers for an exporter",
          "description": "Find real companies that already buy a product, for an exporter or manufacturer. Give the product and the countries to sell to; returns named buyer companies (name, website, country, fit grade A/B/C and the reason each one fits) from trade records and the public web, plus a link to the saved report on reevi.ai where the exporter can unlock contacts and send introductions. Takes 30 to 75 seconds. Free: 5 searches a day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_country": {
                "description": "Where the exporter is based. Buyers in that country are left out.",
                "maxLength": 80,
                "type": "string"
              },
              "company_name": {
                "description": "The exporter's company name, when known. Improves the fit.",
                "maxLength": 200,
                "type": "string"
              },
              "company_website": {
                "description": "The exporter's website, when known.",
                "maxLength": 200,
                "type": "string"
              },
              "customer_types": {
                "description": "Which kind of buyer the exporter sells to.",
                "items": {
                  "enum": ["retailers", "wholesalers_distributors", "brands", "direct_b2b"],
                  "type": "string"
                },
                "type": "array"
              },
              "exclude_domains": {
                "description": "Websites of buyers already found, to get new ones on a second search.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "product": {
                "description": "What the exporter sells, in plain words, e.g. 'organic turmeric powder' or 'stainless steel kitchen sinks'.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "target_markets": {
                "description": "Countries to find buyers in, as full English names (e.g. 'Germany', 'United States'). Defaults to the US, UK and Germany.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find buyers for an exporter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2727e386e1b721de18ad05ae24890cb8fccf35d1b75a93c5c8fdf856dfeac52"
        }
      ],
      "digest": "sha256:bf9942de1ed62c58871b52b6fb2f22eec61ec3fe42f8f41abce27c25d477c982"
    }
  }
