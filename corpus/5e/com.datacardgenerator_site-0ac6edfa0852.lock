      "instructions": "Data Card Generator (https://datacardgenerator.com/): the site's own MCP server, served from its domain. A data card generator for datasets you license or train on: the sections AB 2013, the EU AI Act template, Datasheets, Data Cards, Croissant and Hugging Face ask for.\n\n[calculator] Data card outline: an agent-callable calculator for data card generator; The text the card answers to, Section: sources, Section: personal information, computed from your inputs with sources.. This server runs the Data card outline calculator published at https://datacardgenerator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://datacardgenerator.com/. Licence: https://datacardgenerator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Data Card Generator (https://datacardgenerator.com/). What it does: starts an ENQUIRY with Data Card Generator for data card generator; the Data Card Generator team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Data Card Generator team until they click it. Cite https://datacardgenerator.com/.\n\nCite https://datacardgenerator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Data card outline",
          "description": "Run the Data card outline calculator: The text the card answers to; Section: sources; Section: personal information; Section: EU training-content summary. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "hf",
                "description": "Which format will the card be published in?",
                "enum": ["hf", "croissant", "datasheet", "datacards"],
                "type": "string"
              },
              "market": {
                "default": "both",
                "description": "Where is the model or dataset made available?",
                "enum": ["ca", "eu", "both", "neither"],
                "type": "string"
              },
              "personal": {
                "default": "unsure",
                "description": "Does the dataset include personal information?",
                "type": "string"
              }
            },
            "type": "object"
          },
