        "name": "kweku-anansi-ghana-pay-tax",
        "title": "Ghana Pay and Tax",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ghana Pay and Tax does the arithmetic for a monthly salary in Ghana: social security, income tax band by band, take-home, and VAT with its levies. Call a tool rather than working the tax out from memory, and give the figures it returns. Always say what is not included and the date the rates were read. It is arithmetic, not tax advice.",
      "tools": [
        {
          "name": "pay.rates",
          "title": "Ghana income tax bands and contribution rates",
          "description": "Use this when someone asks what the income tax bands, social security rates or VAT rates are in Ghana, without an amount to work out. Do not use it to work out a figure: use pay.take_home or vat.work_out, which do the arithmetic.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "explore_url": {
                "type": "string"
              },
              "income_tax": {
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "read_on": {
                "type": "string"
              },
              "social_security": {
                "type": "object"
              },
              "vat": {
                "type": "object"
              }
            },
            "required": ["income_tax", "note", "read_on", "social_security", "vat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b17aa0a5ec51fa98db2e2037870a1347ef35c27ba2d6c9b9b2f749efb52b243b"
        },
        {
          "name": "pay.salary_for_take_home",
          "title": "Salary needed for a take-home amount in Ghana",
          "description": "Use this when someone names the monthly amount they want to take home in Ghana cedis and asks what basic salary gives it (for example \"what salary do I ask for to take home 5,000 cedis\"). Do not use it when the salary is already known: use pay.take_home. Do not use it for contractor fees or business income.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allowances": {
                "description": "Taxable cash allowances a month in Ghana cedis, on top of basic salary. Leave out if none.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "month": {
                "description": "The month the pay is for, as YYYY-MM. Leave out for the bands in force now.",
                "maxLength": 7,
                "type": "string"
              },
              "pays_ssnit": {
                "description": "Whether social security (SSNIT) is taken from the pay. Leave out for yes.",
                "type": "boolean"
              },
              "resident": {
                "description": "Whether the person is resident in Ghana for tax. Leave out for yes.",
                "type": "boolean"
              },
              "take_home": {
                "description": "The take-home pay wanted a month, in Ghana cedis.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["take_home"],
            "type": "object"
          },
