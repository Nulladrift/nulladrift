        {
          "name": "pay.take_home",
          "title": "Take-home pay from a monthly salary in Ghana",
          "description": "Use this when someone gives a monthly salary in Ghana cedis and asks what they take home, how much income tax (PAYE) or social security (SSNIT) comes off it, or what an employee costs an employer. It works the tax out band by band; do not estimate it first. Do not use it for a business's tax, for a year-end return with reliefs, for overtime or bonus alone, or for pay in another country.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allowances": {
                "description": "Taxable cash allowances a month in Ghana cedis, on top of basic salary. Leave out if none.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "basic_salary": {
                "description": "Basic salary a month in Ghana cedis, before anything is taken off.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "month": {
                "description": "The month the pay is for, as YYYY-MM. Leave out for the bands in force now.",
                "maxLength": 7,
                "type": "string"
              },
              "pays_ssnit": {
                "description": "Whether social security (SSNIT) is taken from the pay. Leave out for yes.",
                "type": "boolean"
              },
              "resident": {
                "description": "Whether the person is resident in Ghana for tax. Leave out for yes.",
                "type": "boolean"
              }
            },
