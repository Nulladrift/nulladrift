        {
          "name": "vat.work_out",
          "title": "VAT and levies on an amount in Ghana",
          "description": "Use this when someone asks to add VAT to an amount in Ghana cedis, or to find the VAT and levies inside a total that already includes them. It applies the standard rate with the NHIL and GETFund levies, all on the same amount. Do not use it for supplies that are exempt or zero-rated, for import duty, for withholding tax, or for a business that is not registered for VAT.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount in Ghana cedis.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "amount_includes_tax": {
                "description": "True when the amount already has VAT and the levies in it. Leave out when they are to be added on top.",
