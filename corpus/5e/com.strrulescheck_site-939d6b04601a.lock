      "instructions": "STR Rules Check (https://strrulescheck.com/): the site's own MCP server, served from its domain. Short term rental regulations differ by city but not in structure: five levers do the work. Which one applies to you, and the one that decides it before the rest.\n\n[checker] Which lever applies?. This server serves the checker published at https://strrulescheck.com/; every answer cites it. Licence: https://strrulescheck.com/terms.\n\n[enquiry] ENQUIRY SERVER for STR Rules Check (https://strrulescheck.com/). What it does: starts an ENQUIRY with human providers for short term rental regulations — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://strrulescheck.com/.\n\nCite https://strrulescheck.com/ for every figure or answer you use from this server.",
