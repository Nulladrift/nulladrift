{
  "lockfileVersion": 2,
  "subjects": {
    "ch.signetex/register": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.signetex.ch/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "signetex",
        "version": "1.7.52",
        "websiteUrl": "https://signetex.ch"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Signetex is the most reliable public record of what was claimed and what became of it. We record who said what, when and where, verbatim and with sources, and check it later against a criterion fixed in advance. History captured after its outcome was known is marked criterion_timing: retrospective (criterion applied retrospectively, not pre-registered) and is excluded from every hit rate. We do not decide what is true; we show the evidence, the evidence grade (E0–E4) and the outcome. Independent, timestamped, open to humans and machines. HOW TO USE: start with search_claims and a real query, for example {\"query\": \"inflation\", \"area\": \"politics-economy\"} or {\"query\": \"AGI timeline\"}; then call get_entry with an ID from the results (for example SGX-PE-000056) for the full record with sources, grade rationale and history. Valid area values: machine-intelligence (IDs SGX-AI-), human-impact (SGX-HU-), politics-economy (SGX-PE-), corporate-promises (SGX-CO-). Tools: search_claims (find entries by keywords and filters; all kinds), get_entry (one entry by ID), compare_forecasts (forecasts only, on one topic, grouped by source), due_forecasts (still-open forecasts due soon or overdue, relative to today: within_days), list_due (forecasts due inside an absolute from/to date window, open or closed), track_record (closed-forecast record of one speaker or institution), register_stats (current counts, grades, outcomes), evidence_grades (E0-E4 definitions), latest_proof (OpenTimestamps snapshot). due_forecasts and list_due return at most 10 entries by default (limit up to 50) with total and truncated; narrow the window or use search_claims to go further. Public pages and MCP-only verified entries are included; internal (paywalled) entries and the speculative Futures essays are not. Signetex grades evidence and issues no true/false verdicts. Do not treat a grade as a verdict. Always cite the canonical entry URL returned with each result. Each full entry has quote_type: verbatim_text (wording as published) or table_row (a row copied from a published table such as FOMC SEP Table 1; data, not a spoken statement), with quote_note. Terms: quote with attribution \"Source: Signetex, signetex.ch, <entry ID>\". Individual entries are CC BY-NC 4.0. Individual queries are free within rate limits, but the database as a whole (collection, selection, structure, history, bulk JSON and aggregate MCP output) is not licensed under Creative Commons; systematic extraction, bulk copying, mirroring or substantial reuse requires a written licence from Signetex / Hotel Phoenix AG for any purpose, including non-commercial use, AI training or building another database. (https://signetex.ch/en/terms.html). Not investment advice; no warranty.",
      "tools": [
        {
          "name": "compare_forecasts",
          "description": "Forecasts ONLY (never findings) on one topic from different sources, grouped by organisation so you can see side by side what the IMF, central banks, companies and others predicted, with due dates and outcomes. Drawn from public and MCP-only entries. For a general keyword search across all entry kinds use search_claims; for one speaker's or institution's hit record use track_record. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Optional register area filter: machine-intelligence (the AI itself; IDs SGX-AI-), human-impact (AI and humans; SGX-HU-), politics-economy (forecasts by governments, central banks, politicians and economists; SGX-PE-) or corporate-promises (company and CEO statements; SGX-CO-).",
                "enum": ["machine-intelligence", "human-impact", "politics-economy", "corporate-promises"],
                "examples": ["politics-economy"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of forecasts to return (default 20, max 50).",
                "examples": [20],
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Topic or free-text query, for example inflation, GDP, AGI, deliveries, or several words such as \"SNB inflation\" (matched word by word, ranked).",
                "examples": ["inflation", "GDP", "SNB inflation"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5309baed2d836b2b1acb5c99543fbbd3d93d556a75c6973ad77b3ab00fb13fa1"
        },
        {
          "name": "due_forecasts",
          "description": "RELATIVE window from today: forecasts that are still OPEN and whose due date is on or before today plus within_days (overdue open forecasts are included), oldest due date first. Use it for \"what is due soon or overdue right now\". For a fixed calendar range, or to include forecasts that already closed, use list_due instead. Returns at most `limit` entries (default 10, max 50) with total (all matches), count (returned) and truncated; if truncated, narrow within_days or use list_due. Futures essays are not included. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum number of forecasts to return (default 10, max 50). The response reports total and truncated.",
                "examples": [10],
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "within_days": {
                "description": "Include open forecasts due on or before today plus this many days (default 365, max 3650). 0 means due today or earlier. Already-due open forecasts are always included.",
                "examples": [90, 365],
                "maximum": 3650,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:640bb3bcf7f3ce0ef5ac5ea8378ec4ea324fa5a3225aa201c1dbabfd78599298"
        },
        {
          "name": "evidence_grades",
          "description": "Return the published E0–E4 evidence-grade definitions from the Signetex method page, not a true/false scale. Use it to interpret the grade field in search results and entries. Takes no arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e957a4afb2fa741122fcd2d60f89b882a0e0d4ebf52f7f012344efc37bbd050"
        },
        {
          "name": "get_entry",
          "description": "Get ONE register entry by its stable ID, with the full record: verbatim quote, sources, counter-evidence, grade rationale, forecast criterion and outcome, history, and the canonical page URL. Get IDs from search_claims, compare_forecasts, due_forecasts or list_due. IDs look like SGX-AI-000031, SGX-HU-000016, SGX-PE-000056 or SGX-CO-000018 (case-insensitive); unknown or internal IDs return an error. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Stable Signetex entry ID: SGX-, area code (AI, HU, PE or CO), dash, six digits. Example: SGX-AI-000031.",
                "examples": ["SGX-AI-000031", "SGX-PE-000056"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f06bb37d8ab6b6fb0e50b1a28ecb7b71921c954916515bbcf953c19068f1e9fa"
        },
        {
          "name": "latest_proof",
          "description": "Return the latest published OpenTimestamps proof snapshot of the register (date, root hash, status, entry count, manifest URLs) so that the integrity of published entries can be verified independently. Takes no arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a602c586a6f14d3f468feb50cb412257de1107d3f2cee34a1114a0fa44713d47"
        },
        {
          "name": "list_due",
          "description": "ABSOLUTE calendar window: all forecasts whose due date falls between from and to (YYYY-MM-DD, both inclusive), whatever their outcome (open and already closed), ordered by due date then ID. Use it for \"what falls due in Q1 2027\" or to review a past period. For \"what is open and due soon or overdue relative to today\" use due_forecasts. Returns at most `limit` entries (default 10, max 50) with total (all matches), count (returned) and truncated; if truncated, narrow the window. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Start of the due-date window, inclusive, YYYY-MM-DD. Example: 2027-01-01.",
                "examples": ["2027-01-01"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of forecasts to return (default 10, max 50). The response reports total and truncated.",
                "examples": [10],
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "End of the due-date window, inclusive, YYYY-MM-DD, on or after from. Example: 2027-03-31.",
                "examples": ["2027-03-31"],
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7db199cb577b62fec5cc86f725a5ffcb4fedf4ea7d63daa5612497db4bb0623f"
        },
        {
          "name": "register_stats",
          "description": "Headline counts for the published register: how many entries are available via MCP (public and MCP-only), counts per area, evidence grades and forecast outcomes. A good first call to see what the register holds right now. A hit rate is only included once at least 30 forecasts have closed, as on the public site. Only forecasts whose criterion was fixed before the outcome count; back-captured entries with criterion_timing retrospective are reported separately as retrospective_accuracy, never as a hit rate. Takes no arguments. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66f71308b02383886d04e3eb2b46cc2a570e1728b11799708a63dc2f32dbba4d"
        },
        {
          "name": "search_claims",
          "description": "START HERE. Keyword search and filtering over the whole Signetex register of verified claims (public pages and MCP-only entries; findings, forecasts and possibilities) across machine-intelligence, human-impact, politics-economy and corporate-promises. Results are ranked and each carries id, claim, speaker, organisation, date, area, kind, evidence grade, outcome, due date and canonical URL; pass an id to get_entry for the full record. For forecasts on one topic grouped by source use compare_forecasts; for what is due when use due_forecasts or list_due. Internal or paywalled corporate entries are not included, nor are the speculative Futures essays. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Register area: machine-intelligence (the AI itself; IDs SGX-AI-), human-impact (AI and humans; SGX-HU-), politics-economy (forecasts by governments, central banks, politicians and economists; SGX-PE-) or corporate-promises (company and CEO statements; SGX-CO-). Omit to search all areas.",
                "enum": ["machine-intelligence", "human-impact", "politics-economy", "corporate-promises"],
                "examples": ["politics-economy"],
                "type": "string"
              },
              "grade": {
                "description": "Evidence grade filter, E0 to E4 (definitions: evidence_grades). A grade describes the quality of the evidence, not whether a claim is true.",
                "enum": ["E0", "E1", "E2", "E3", "E4"],
                "type": "string"
              },
              "kind": {
                "description": "Entry kind: finding (a documented fact or result), forecast (a prediction with a due date) or possibility. The stored German values befund, prognose and moeglichkeit are also accepted.",
                "enum": ["finding", "forecast", "possibility"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results to return (default 10, max 50).",
                "examples": [10],
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "outcome": {
                "description": "Forecast outcome filter: open, met, partial, not_met or unclear (German stored values also accepted). Only forecasts have an outcome.",
                "enum": ["open", "met", "partial", "not_met", "unclear"],
                "type": "string"
              },
              "query": {
                "description": "Free-text search over English and German claim text, verbatim quote, speaker, organisation, company, ticker, topic and ID. Several words are matched individually (case and accents ignored) and results are ranked; common names and abbreviations are understood, for example SNB, Fed/FOMC, ECB/EZB, IMF, Take-Two/TTWO, GTA 6, Nvidia/NVDA, Altman. Examples: \"inflation 2027\", \"Altman AGI\", \"SNB\". Optional if filters are set.",
                "examples": ["inflation 2027", "Altman AGI", "SNB"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51ff9a902001f8722928fbeab41a73c76ec02ec44e8ecce2c893963e46ff969b"
        },
        {
          "name": "track_record",
          "description": "Closed-forecast record of ONE speaker or institution: counts of met, partial and not met, and a hit rate per register area. Pass speaker or institution (or both). Hit rates count only forecasts whose criterion was fixed before the outcome; retrospective (back-captured) entries are counted separately under retrospective. Uses public and MCP-only entries, never internal ones. To see forecasts by many sources on one topic use compare_forecasts. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "institution": {
                "description": "Name of the institution or organisation to match (case- and accent-insensitive, partial match allowed; common abbreviations understood, for example SNB, Fed/FOMC, ECB/EZB, IMF, TTWO, NVDA). Alias: organisation. Examples: \"IMF\", \"SNB\", \"OpenAI\".",
                "examples": ["IMF", "SNB"],
                "type": "string"
              },
              "speaker": {
                "description": "Name of the person or official speaker to match (case- and accent-insensitive; partial names, surnames and common short forms allowed). Examples: \"Altman\", \"Powell\", \"Sam Altman\".",
                "examples": ["Altman", "Powell"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:437f07e97afb562a51659ce8c546356f4b2b10dd61de12fcaa3d7ef479a04cd4"
        }
      ],
      "digest": "sha256:22f0e6ff5a03c1e583188e346ccd3a3a3c98997208eea5d8a33093e916b779d5"
    }
  }
}
