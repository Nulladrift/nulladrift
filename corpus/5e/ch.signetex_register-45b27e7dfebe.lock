{
  "lockfileVersion": 2,
  "subjects": {
    "ch.signetex/register": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.signetex.ch/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "signetex",
        "version": "1.7.50",
        "websiteUrl": "https://signetex.ch"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Signetex is the most reliable public record of what was claimed and what became of it. We record who said what, when and where, verbatim and with sources, and check it later against a criterion fixed in advance. History captured after its outcome was known is marked criterion_timing: retrospective (criterion applied retrospectively, not pre-registered) and is excluded from every hit rate. We do not decide what is true; we show the evidence, the evidence grade (E0–E4) and the outcome. Independent, timestamped, open to humans and machines. Query the register with search_claims, get_entry, due_forecasts, list_due, track_record, compare_forecasts, register_stats, evidence_grades and latest_proof. Public pages and MCP-only verified entries are included; internal (paywalled) entries and the speculative Futures essays are not. Signetex grades evidence and issues no true/false verdicts. Do not treat a grade as a verdict. Always cite the canonical entry URL returned with each result. Each full entry has quote_type: verbatim_text (wording as published) or table_row (a row copied from a published table such as FOMC SEP Table 1; data, not a spoken statement), with quote_note. Terms: quote with attribution \"Source: Signetex, signetex.ch, <entry ID>\". Individual entries are CC BY-NC 4.0. Individual queries are free within rate limits, but the database as a whole (collection, selection, structure, history, bulk JSON and aggregate MCP output) is not licensed under Creative Commons; systematic extraction, bulk copying, mirroring or substantial reuse requires a written licence from Signetex / Hotel Phoenix AG for any purpose, including non-commercial use, AI training or building another database. (https://signetex.ch/en/terms.html). Not investment advice; no warranty.",
      "tools": [
        {
          "name": "compare_forecasts",
          "description": "Show forecasts by different sources on one topic, drawn from public and MCP-only entries. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Optional register area filter.",
                "enum": ["machine-intelligence", "human-impact", "politics-economy", "corporate-promises"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of forecasts to return (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Topic or free-text query, for example inflation, GDP, AGI, deliveries, or several words such as \"SNB inflation\" (matched word by word, ranked).",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8dfac21c325013a97487e20195cfc4764708c5ce4e5a12bf5f971af86d85bbfe"
        },
        {
          "name": "due_forecasts",
          "description": "List register forecasts whose due date falls within the given number of days (including those already due and still open). Futures essays are not included. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "within_days": {
                "description": "Include forecasts due on or before today plus this many days (default 365, max 3650). Already-due open forecasts are included.",
                "maximum": 3650,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25fc90bf98a40d69f0c667b3f368c5676657d31a5f2298686855ee82187cf734"
        },
        {
          "name": "evidence_grades",
          "description": "Return the published E0–E4 evidence-grade definitions from the Signetex method page, not a true/false scale.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a6325ce8ccf5af77865059b5a407538ed7c64b0114c1f54eddd1cddd77e6eb5"
        },
        {
          "name": "get_entry",
          "description": "Get one register entry by its stable ID (for example SGX-AI-000031 or SGX-HU-000016), including sources, counter-evidence, grade rationale and history, with the canonical page URL. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Stable Signetex entry ID, for example SGX-AI-000031.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2fb93aade74e27b8aaba51b4b3569af26b50699c7665fe0ecb428fc58e30f1d2"
        },
        {
          "name": "latest_proof",
          "description": "Return the latest published OpenTimestamps proof snapshot of the register (root hash, status, manifest URLs).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eed8492d1acb3569cf0a0f59698d540d7ee4febbafb18e31a67fb0f673f63e5e"
        },
        {
          "name": "list_due",
          "description": "List forecasts whose due date falls in the inclusive window from…to (YYYY-MM-DD). Returns public and MCP-only entries, including already closed ones in that window. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Start of the due-date window, inclusive, YYYY-MM-DD.",
                "type": "string"
              },
              "to": {
                "description": "End of the due-date window, inclusive, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a838902f9ce26fc6a3289e4c2d720294552c9a6bb8a7a58f19d9aa85da3ed4d"
        },
        {
          "name": "register_stats",
          "description": "Headline counts for the published register: totals, areas, grades, forecast outcomes. A hit rate is only included once at least 30 forecasts have closed, as on the public site. Only forecasts whose criterion was fixed before the outcome count; back-captured entries with criterion_timing retrospective are reported separately as retrospective_accuracy, never as a hit rate. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25e3fb48b465a04b1eab64578372720f78aa5e0c5592e0abeda1a9262eeaa40d"
        },
        {
          "name": "search_claims",
          "description": "Search the Signetex register of verified claims (public pages and MCP-only entries) across machine-intelligence, human-impact, politics-economy and corporate-promises. Internal or paywalled corporate entries are not included, nor are the speculative Futures essays. Returns matching entries with canonical URLs. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Register area: machine-intelligence (the AI itself), human-impact (AI and humans) politics-economy (forecasts by governments, central banks, politicians and economists) or corporate-promises (company and CEO statements).",
                "enum": ["machine-intelligence", "human-impact", "politics-economy", "corporate-promises"],
                "type": "string"
              },
              "grade": {
                "description": "Evidence grade: E0, E1, E2, E3 or E4.",
                "type": "string"
              },
              "kind": {
                "description": "Entry kind: finding, forecast or possibility (also accepts the stored values befund, prognose, moeglichkeit).",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results to return (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "outcome": {
                "description": "Forecast outcome: open, met, partial, not_met, unclear (German stored values also accepted).",
                "type": "string"
              },
              "query": {
                "description": "Free-text search over English and German claim text, verbatim quote, speaker, organisation, company, ticker, topic and ID. Several words are matched individually (case and accents ignored) and results are ranked; common names and abbreviations are understood, for example SNB, Fed/FOMC, ECB/EZB, IMF, Take-Two/TTWO, GTA 6, Nvidia/NVDA, Altman. Optional if filters are set.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fdf1622bb2f820a682a26dc7e0f974651871062d60cc6383efa9d0dcaad3c9c5"
        },
        {
          "name": "track_record",
          "description": "Return the closed-forecast record of a speaker or institution: counts of met, partial and not met, and a hit rate per register area. Hit rates count only forecasts whose criterion was fixed before the outcome; retrospective (back-captured) entries are counted separately under retrospective. Uses public and MCP-only entries, never internal ones. Signetex grades evidence and issues no true/false verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "institution": {
                "description": "Name of the institution or organisation to match (case- and accent-insensitive, partial match allowed; common abbreviations understood, for example SNB, Fed/FOMC, ECB/EZB, IMF, TTWO, NVDA). Alias: organisation.",
                "type": "string"
              },
              "speaker": {
                "description": "Name of the person or official speaker to match (case- and accent-insensitive; partial names, surnames and common short forms allowed, for example Altman or Powell).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d8c9f94e8711e4984916eba8a0a54f79fe7dc91e1bc26426c6a0e5dd0162c1f"
        }
      ],
      "digest": "sha256:38c4c2d1605d5ec6ed0894e652fb5b46a0b60e6a9e647e802fead23eb646de55"
    }
  }
}
