        {
          "name": "get_unique_visitors_report",
          "description": "Get unique visitor counts (distinct viewers of viewable impressions) per publisher, zone, advertiser or campaign. Daily or monthly periods return one count per period per entity; do NOT add daily or monthly counts together to get a range total, since the same visitor is counted in every period they were seen. Likewise, counts for different entities cannot be summed into an account total, since one visitor can appear under several. Use period \"summary\" for true unique visitors across the whole range. Returns data: [{type, id, name, visitors, entry_date}], where entry_date is the day, the first of the month (monthly), or the earliest date with visitors (summary); name is null if the entity could not be found (e.g. archived). Only available to accounts with the daily unique visitors feature (built for MyHealthTeams); other accounts receive a 404 / endpoint-not-found error.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Start date: YYYY-MM-DD for daily/summary, YYYY-MM for monthly. At most 400 days before \"to\"",
                "type": "string"
              },
              "id": {
                "description": "Limit to these entity IDs of the chosen type (comma-separated); omit for all entities of that type",
                "type": "string"
              },
              "include_names": {
                "description": "Add each entity's name to every row (default true); set false to skip the extra lookups",
                "type": "boolean"
              },
              "period": {
                "description": "daily = per day, monthly = per calendar month, summary = one distinct count for the whole range",
                "enum": ["daily", "monthly", "summary"],
                "type": "string"
              },
              "to": {
                "description": "End date (inclusive): YYYY-MM-DD for daily/summary, YYYY-MM for monthly",
                "type": "string"
              },
              "type": {
                "description": "Entity to group unique visitors by",
                "enum": ["publisher", "zone", "advertiser", "campaign"],
                "type": "string"
              }
            },
            "required": ["from", "period", "to", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:478da1e2c97a8124218876cd059d4ad71b5bb2b73db7a50af9d95d8d796bddb4"
        },
