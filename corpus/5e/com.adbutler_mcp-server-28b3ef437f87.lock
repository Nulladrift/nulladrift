        {
          "name": "call_adbutler_api",
          "title": "Call AdButler API",
          "description": "Call any AdButler API endpoint directly. Use this only when no specific tool wraps the endpoint you need. The session's configured API key is used automatically — do NOT pass an api_key argument. Substitute path placeholders via path_params: e.g. path=\"/campaigns/{id}\", path_params={ \"id\": 123 } → /campaigns/123.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "body": {
                "additionalProperties": {},
                "description": "JSON request body (for POST/PUT/PATCH).",
                "type": "object"
              },
              "method": {
                "description": "HTTP method, e.g. \"GET\", \"POST\", \"PUT\", \"DELETE\".",
                "type": "string"
              },
              "path": {
                "description": "Endpoint path with `{placeholder}` syntax for path params, exactly as returned by search_adbutler_api (e.g. \"/campaigns/{id}\").",
                "type": "string"
              },
              "path_params": {
                "additionalProperties": {
                  "type": ["string", "number"]
                },
                "description": "Map of path placeholder names to values, e.g. { \"id\": 123 }.",
                "type": "object"
              },
              "query_params": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query string parameters appended to the URL.",
                "type": "object"
              }
            },
            "required": ["method", "path"],
            "type": "object"
          },
