        {
          "name": "pay_and_access",
          "title": "Pay and access",
          "description": "Use this only after the person agrees to pay. It is the only tool that spends on Sepolia. prepare_checkout never pays, and get_receipt never charges. Input: offer_id, the confirmation from prepare_checkout, and confirm=true. Pass confirm=false to decline. Pass method pix for the test-only Pix option. Pass simulate true with method pix to mark that test paid and deliver the test content in this call. That path does not sign a chain transaction and does not spend USDC. Omit method, or pass x402, for Sepolia. Public callers get x402 payment requirements instead of a charge. The server wallet signs only for the owner key on Sepolia testnet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirm": {
                "description": "True only after the person agrees to pay. False declines and spends nothing.",
                "type": "boolean"
              },
              "confirmation": {
                "description": "Single-use confirmation returned by prepare_checkout. Required when confirm is true.",
                "maxLength": 512,
                "type": "string"
              },
              "method": {
                "description": "Optional. Pass pix for the test-only Pix option from prepare_checkout. Omit it, or pass x402, for the Sepolia test payment.",
                "enum": ["x402", "pix"],
                "type": "string"
              },
              "offer_id": {
                "description": "Accepted offer id from negotiate_price or prepare_checkout.",
                "maxLength": 80,
                "type": "string"
              },
              "simulate": {
                "description": "Optional. With method pix in test mode, true marks the Pix test paid and delivers the test content in this call. Ignored for x402. Defaults to false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
