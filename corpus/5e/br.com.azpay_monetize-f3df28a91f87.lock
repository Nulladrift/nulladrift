            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "quantity": {
                "description": "Optional number of paid accesses, from 1 to 100. Defaults to 1. The unit price includes the volume discount.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "resource_id": {
                "description": "Required. Resource id returned by search_resources.",
                "maxLength": 120,
