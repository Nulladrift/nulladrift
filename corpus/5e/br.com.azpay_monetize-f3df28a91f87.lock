        {
          "name": "get_checkout_status",
          "title": "Get checkout status",
          "description": "Use this to read whether a checkout is pending, paid, consumed, expired, or cancelled. When the checkout has a Pix test option, the result also includes pix.status of pending, paid, expired, or consumed. Use get_receipt to deliver a Sepolia purchase, and cancel_checkout to invalidate an unused confirmation. Input: confirmation or offer_id. It does not pay or cancel.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirmation": {
                "description": "Single-use confirmation from prepare_checkout. Pass this or offer_id.",
                "maxLength": 512,
                "type": "string"
              },
              "offer_id": {
                "description": "Accepted offer id. Pass this or confirmation.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "type": "string"
              },
              "amount_atomic": {
                "type": "string"
              },
              "expires_at": {
                "type": ["string", "null"]
              },
              "network": {
                "const": "eip155:11155111",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "offer_id": {
                "type": "string"
              },
              "pix": {
                "additionalProperties": false,
                "properties": {
                  "amountBrl": {
                    "type": "string"
                  },
                  "currency": {
                    "const": "BRL",
                    "type": "string"
                  },
                  "expiresAt": {
                    "type": "string"
                  },
                  "isTestOnly": {
                    "const": true,
                    "type": "boolean"
                  },
                  "method": {
                    "const": "pix",
                    "type": "string"
                  },
                  "mode": {
                    "const": "test",
                    "type": "string"
                  },
                  "status": {
                    "enum": ["pending", "paid", "expired", "consumed"],
                    "type": "string"
                  },
                  "txid": {
                    "type": "string"
                  },
                  "warning": {
                    "type": "string"
                  }
                },
                "required": ["amountBrl", "currency", "expiresAt", "isTestOnly", "method", "mode", "status", "txid", "warning"],
                "type": "object"
              },
              "schema_version": {
                "const": "azpay.checkout_status.v1",
                "type": "string"
              },
              "state": {
                "enum": ["pending", "paid", "consumed", "expired", "cancelled"],
                "type": "string"
              },
              "testnet": {
                "const": true,
                "type": "boolean"
              },
              "units_remaining": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["amount", "amount_atomic", "expires_at", "network", "note", "offer_id", "schema_version", "state", "testnet", "units_remaining"],
            "type": "object"
