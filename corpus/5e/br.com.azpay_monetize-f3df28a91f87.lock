        {
          "name": "cancel_checkout",
          "title": "Cancel checkout",
          "description": "Use this to invalidate an unused confirmation so pay_and_access cannot spend it. Use get_checkout_status to read the state first. Required input: confirmation from prepare_checkout. Returns the cancelled checkout. It cannot cancel a payment that has already settled.",
