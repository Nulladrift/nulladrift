        {
          "name": "pay_and_access",
          "title": "Pay and access",
          "description": "To deliver a paid origin tool, pass origin_tool with origin_arguments and idempotency_key; that call does not charge again. If the client schema has no origin_tool, pass method tool:<origin_tool> on an already-paid offer and put the origin arguments as a JSON object in confirmation. Use this only after the person agrees to pay. It is the only tool that spends on Sepolia. prepare_checkout never pays, and get_receipt never charges. Input: offer_id, the confirmation from prepare_checkout, and confirm=true. Pass confirm=false to decline. Pass method pix for the test-only Pix option. Pass simulate true with method pix to mark that test paid and deliver the test content in this call. That path does not sign a chain transaction and does not spend USDC. Omit method, or pass x402, for Sepolia. A caller with a wallet can pay with a direct x402 HTTP POST to the seller resource, JSON-RPC tools/call, headers x-azpay-offer-id and payment-signature. GET is not priced. The same response also includes next_action with the hosted checkout URL. After you give that link, tell the person to come back and say \"I paid\". When they do, call get_checkout_status with offer_id and, if checkout_state is paid, immediately call pay_and_access or get_receipt with origin_tool and origin_arguments to deliver the tool result. Optional origin_tool and origin_arguments run one paid origin tool after payment and consume one unit only when the origin succeeds. Optional idempotency_key repeats a successful delivery without consuming again. A failed origin call does not consume a unit, and the same key can be tried again. Optional list_origin_tools lists origin tools, including inputSchema, and does not consume a unit. Public callers get x402 payment requirements and the hosted checkout together. Sponsored signing runs only for the owner key on Sepolia testnet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "confirm": {
                "description": "True only after the person agrees to pay. False declines and spends nothing.",
                "type": "boolean"
              },
              "confirmation": {
                "description": "Single-use confirmation returned by prepare_checkout. Required when confirm is true. When method is tool:<origin_tool>, a JSON object in this string is the origin arguments. Any other value means empty arguments. Values are not logged.",
                "maxLength": 8000,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Repeat the same origin_tool delivery without consuming another unit.",
                "maxLength": 80,
                "type": "string"
              },
              "list_origin_tools": {
                "description": "Optional. When true and origin_tool is omitted, list the origin tools and do not consume a unit.",
                "type": "boolean"
              },
              "method": {
                "description": "Optional. Pass pix for the test-only Pix option. Pass hosted_checkout to receive the browser checkout URL. Omit it, or pass x402, for the Sepolia test payment. On an already-paid offer, pass tool:<origin_tool> to deliver that origin tool. This does not charge again.",
                "maxLength": 160,
                "type": "string"
              },
              "offer_id": {
                "description": "Accepted offer id from negotiate_price or prepare_checkout.",
                "maxLength": 80,
                "type": "string"
              },
              "origin_arguments": {
                "additionalProperties": {},
                "description": "Optional object of arguments for origin_tool. Values are not logged.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "origin_tool": {
                "description": "Optional. After the order is paid, call this origin tool and consume one unit.",
                "maxLength": 120,
                "type": "string"
              },
              "simulate": {
                "description": "Optional. With method pix in test mode, true marks the Pix test paid and delivers the test content in this call. Ignored for x402. Defaults to false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "available_tools": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "inputSchema": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "confirmation": {
                "type": ["string", "null"]
              },
              "example": {
                "additionalProperties": false,
                "properties": {
                  "arguments": {
                    "required": ["idempotency_key", "offer_id", "origin_arguments", "origin_tool"],
                    "additionalProperties": false,
                    "properties": {
                      "idempotency_key": {
                        "type": "string"
                      },
                      "offer_id": {
                        "type": "string"
                      },
                      "origin_arguments": {
                        "additionalProperties": {},
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "origin_tool": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "legacy": {
                    "additionalProperties": false,
                    "properties": {
                      "arguments": {
                        "required": ["method", "offer_id"],
                        "additionalProperties": false,
                        "properties": {
                          "confirmation": {
                            "type": "string"
                          },
                          "method": {
                            "type": "string"
                          },
                          "offer_id": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "name": {
                        "const": "pay_and_access",
                        "type": "string"
