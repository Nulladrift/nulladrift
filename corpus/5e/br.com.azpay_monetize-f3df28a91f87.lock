        {
          "name": "get_receipt",
          "title": "Get receipt",
          "description": "To deliver a paid origin tool, pass origin_tool with origin_arguments and idempotency_key; a call without origin_tool reads the receipt and does not consume a unit. Use this to read an already-paid resource, or to finish a payment that is still confirming. A call without origin_tool returns the receipt and does not consume a unit. Pass origin_tool and optional origin_arguments to run one paid origin tool. Only a successful origin result consumes one unit. A JSON-RPC error or isError result does not consume a unit. Pass the same idempotency_key to repeat a successful delivery without consuming another unit. The same key can be tried again after a failed delivery. Pass list_origin_tools true to list origin tools and their inputSchema without consuming a unit. Input: tx_hash, or offer_id, or intent_id. It never charges.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "idempotency_key": {
                "description": "Optional. Repeating the same key returns the same origin result and does not consume another unit.",
                "maxLength": 80,
                "type": "string"
              },
              "intent_id": {
                "description": "Payment intent id, when you have one instead of a transaction hash.",
                "maxLength": 80,
                "type": "string"
              },
              "list_origin_tools": {
                "description": "Optional. When true and origin_tool is omitted, list origin tools and do not consume a unit.",
                "type": "boolean"
              },
              "offer_id": {
                "description": "Offer id, to finish a payment that is still confirming or to redeem remaining units.",
                "maxLength": 80,
                "type": "string"
              },
              "origin_arguments": {
                "additionalProperties": {},
                "description": "Optional object of arguments for origin_tool. Values are not logged.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "origin_tool": {
                "description": "Optional. Run this paid origin tool and consume one unit. Omit it to read the receipt without consuming a unit.",
                "maxLength": 120,
                "type": "string"
              },
              "tx_hash": {
                "description": "Sepolia transaction hash from pay_and_access or from your own settled x402 payment.",
                "maxLength": 80,
                "type": "string"
