        {
          "name": "get_checkout_status",
          "title": "Get checkout status",
          "description": "Use this when the person says they paid, and to read whether a checkout is pending, paid, consumed, expired, or cancelled. If checkout_state is paid, immediately call pay_and_access or get_receipt with origin_tool and origin_arguments to deliver the tool result. The result also reports checkout_state of awaiting_payer, payment_submitted, confirming, paid, failed, or expired, and tx_hash when the payment has settled. It does not consume a unit. Pass list_origin_tools true to include available_tools and each inputSchema from the origin. When the checkout has a Pix test option, the result also includes pix.status of pending, paid, expired, or consumed. Use get_receipt without origin_tool to read a receipt for free, and cancel_checkout to invalidate an unused confirmation. Input: confirmation or offer_id. It does not pay or cancel.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirmation": {
                "description": "Single-use confirmation from prepare_checkout. Pass this or offer_id.",
                "maxLength": 512,
                "type": "string"
              },
              "list_origin_tools": {
                "description": "Optional. When true, include available_tools from the origin. This does not consume a unit.",
                "type": "boolean"
              },
              "offer_id": {
                "description": "Accepted offer id. Pass this or confirmation.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "type": "string"
              },
              "amount_atomic": {
                "type": "string"
              },
              "available_tools": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "inputSchema": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "checkout_state": {
                "enum": ["awaiting_payer", "payment_submitted", "confirming", "paid", "failed", "expired"],
                "type": "string"
              },
              "example": {
                "additionalProperties": false,
                "properties": {
                  "arguments": {
                    "required": ["idempotency_key", "offer_id", "origin_arguments", "origin_tool"],
                    "additionalProperties": false,
                    "properties": {
                      "idempotency_key": {
                        "type": "string"
                      },
                      "offer_id": {
                        "type": "string"
                      },
                      "origin_arguments": {
                        "additionalProperties": {},
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "origin_tool": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "legacy": {
                    "additionalProperties": false,
                    "properties": {
                      "arguments": {
                        "required": ["method", "offer_id"],
                        "additionalProperties": false,
                        "properties": {
                          "confirmation": {
                            "type": "string"
                          },
                          "method": {
                            "type": "string"
                          },
                          "offer_id": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "name": {
                        "const": "pay_and_access",
                        "type": "string"
                      }
                    },
                    "required": ["arguments", "name"],
                    "type": "object"
                  },
                  "name": {
                    "const": "get_receipt",
                    "type": "string"
                  }
                },
                "required": ["arguments", "name"],
                "type": "object"
              },
              "expires_at": {
                "type": ["string", "null"]
              },
              "network": {
                "const": "eip155:11155111",
                "type": "string"
              },
              "nextStep": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "offer_id": {
                "type": "string"
              },
              "pix": {
                "additionalProperties": false,
                "properties": {
                  "amountBrl": {
                    "type": "string"
                  },
                  "currency": {
                    "const": "BRL",
                    "type": "string"
                  },
                  "expiresAt": {
                    "type": "string"
                  },
                  "isTestOnly": {
                    "const": true,
                    "type": "boolean"
                  },
                  "method": {
                    "const": "pix",
                    "type": "string"
                  },
                  "mode": {
                    "const": "test",
                    "type": "string"
                  },
                  "status": {
                    "enum": ["pending", "paid", "expired", "consumed"],
                    "type": "string"
                  },
                  "txid": {
                    "type": "string"
                  },
                  "warning": {
                    "type": "string"
                  }
                },
                "required": ["amountBrl", "currency", "expiresAt", "isTestOnly", "method", "mode", "status", "txid", "warning"],
                "type": "object"
              },
              "schema_version": {
                "const": "azpay.checkout_status.v1",
                "type": "string"
              },
              "state": {
                "enum": ["pending", "paid", "consumed", "expired", "cancelled"],
