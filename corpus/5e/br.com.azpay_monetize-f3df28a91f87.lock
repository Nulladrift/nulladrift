        {
          "name": "prepare_checkout",
          "title": "Prepare checkout",
          "description": "Use this after an accepted offer to review the amount and get a single-use confirmation. Use pay_and_access to spend; this tool never pays. Input: offer_id, or resource_id with optional quantity for the list price. Returns the checkout summary, confirmation, total, expiry, and paymentOptions. When the seller wrote one, the summary includes Seller description. Options are listed together. x402 is an HTTP POST to the seller resource with a JSON-RPC tools/call body and headers x-azpay-offer-id and payment-signature. GET is not priced. hosted_checkout is a short-lived browser page where the payer signs the Sepolia USDC authorization. After you give that link, tell the person to come back and say \"I paid\". When they do, call get_checkout_status with offer_id and, if checkout_state is paid, immediately call pay_and_access or get_receipt with origin_tool and origin_arguments to deliver the tool result. Pix, when present, is a test-only simulation with a fake key and a QR. The Pix option cannot pay a real bank. Ask the person which option to use.",
