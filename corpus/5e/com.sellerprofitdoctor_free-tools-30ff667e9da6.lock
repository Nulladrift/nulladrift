                "maximum": 10,
                "type": "number"
              },
              "adSales": {
                "description": "Sales the ads brought, last 30 days, US dollars (Campaign Manager). Send with adSpend; the ACoS is adSpend ÷ adSales.",
                "maximum": 10000000,
                "minimum": 0.01,
                "type": "number"
              },
              "adSpend": {
                "description": "Sponsored Products spend, last 30 days, US dollars (Campaign Manager). With acos or adSales it gives the monthly gain or loss.",
                "maximum": 300000,
                "minimum": 0.01,
                "type": "number"
              },
              "category": {
                "description": "The Amazon category, which sets the referral fee, or not-sure (Everything Else, 15%, flagged).",
                "enum": ["beauty-health", "baby", "grocery", "clothing", "home-kitchen", "toys", "sports-outdoors", "pet", "electronics-accessories", "media", "jewelry", "furniture", "everything-else", "amazon-device-accessories", "compact-appliances", "full-size-appliances", "automotive", "base-power-tools", "backpacks-handbags-luggage", "business-industrial-scientific", "computers", "consumer-electronics", "eyewear", "footwear", "gift-cards", "lawn-garden", "lawn-mowers-snow-throwers", "mattresses", "musical-instruments", "office", "tires", "tools", "video-games", "video-game-consoles", "watches", "not-sure"],
                "type": "string"
              },
              "conversionRate": {
                "description": "Orders ÷ clicks on the ads, last 30 days (Campaign Manager), as a fraction (0.1 is 10%). Adds the highest cost per click that still pays.",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "fulfillment": {
                "description": "fba (Amazon ships; adds the FBA fee estimate) or fbm (the seller ships).",
                "enum": ["fba", "fbm"],
                "type": "string"
              },
              "labelCost": {
                "description": "FBM: what the shipping label costs, US dollars. Left out: shipping is treated as breaking even (label = shipping charged − packaging), flagged.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "landedCost": {
