        {
          "name": "sellerprofit_etsy_fees",
          "title": "Fees on one Etsy sale",
          "description": "Works out Etsy's fees on one sale, line by line: the $0.20 listing fee, the 6.5% transaction fee, the 3% + $0.25 payment processing fee (also charged on sales tax), the 2.5% currency conversion when it applies, and the Offsite Ads fee (12% or 15%, at most $100) when the sale came from an Offsite Ad. It fits a seller who asks what Etsy takes from a sale, or what they keep from it before costs. Takes the item price and shipping charged; optionally the sales tax rate, whether it was an Offsite Ads sale and at which rate, and a currency mismatch. Returns each fee, the total, its share of the order and what's left, in US dollars, with the dated Etsy rules and their sources. Free, no sign-in. Takes numbers only; nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currencyMismatch": {
                "default": false,
                "description": "True when the listing's currency differs from the payment account's (Etsy adds 2.5%). Default false.",
                "type": "boolean"
              },
              "itemPrice": {
                "description": "The item price on this sale, US dollars, before shipping.",
                "maximum": 100000,
                "minimum": 0.01,
                "type": "number"
              },
              "offsiteAds": {
                "default": "none",
                "description": "Did this sale come from an Offsite Ad? none, or the rate the shop pays: 12-percent (the shop has sold $10,000 or more in any 12 months) or 15-percent (under $10,000). Default none; off is taken as none.",
                "enum": ["none", "12-percent", "15-percent", "off"],
                "type": "string"
              },
              "salesTaxRate": {
                "default": 0,
                "description": "The sales tax rate the buyer paid, as a fraction (0.07 is 7%). Etsy charges its 3% processing fee on the tax too. Default 0.",
                "maximum": 0.2,
                "minimum": 0,
                "type": "number"
              },
              "shippingCharged": {
                "default": 0,
                "description": "What the buyer paid for shipping, US dollars (0 if free).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["itemPrice"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "afterFees": {
                "description": "Order total minus every fee: what's left before materials, packaging, the label and ads.",
                "type": "number"
              },
              "feeShareOfOrder": {
                "description": "Total fees ÷ order total.",
                "type": "number"
              },
              "fees": {
                "additionalProperties": false,
                "properties": {
                  "currencyConversion": {
                    "type": "number"
                  },
                  "etsyTotal": {
                    "description": "Every Etsy fee above, before Offsite Ads.",
                    "type": "number"
                  },
                  "listing": {
                    "type": "number"
                  },
                  "processing": {
                    "type": "number"
                  },
                  "processingOnSalesTax": {
                    "type": "number"
                  },
                  "transaction": {
                    "type": "number"
                  }
                },
                "required": ["currencyConversion", "etsyTotal", "listing", "processing", "processingOnSalesTax", "transaction"],
                "type": "object"
              },
              "link": {
                "description": "Opens the matching page on sellerprofitdoctor.com. Carries none of the figures sent.",
                "type": "string"
              },
              "offsiteAds": {
                "additionalProperties": false,
                "properties": {
                  "applies": {
                    "type": "boolean"
                  },
                  "capApplied": {
                    "description": "True when Etsy's $100 cap per order cut the fee.",
                    "type": "boolean"
                  },
                  "fee": {
                    "type": "number"
                  },
                  "rate": {
                    "description": "0.12, 0.15, or 0.",
                    "type": "number"
                  }
                },
                "required": ["applies", "capApplied", "fee", "rate"],
                "type": "object"
              },
              "orderTotal": {
                "description": "Item + shipping the buyer paid, before tax, US dollars.",
                "type": "number"
              },
              "platform": {
                "const": "etsy",
                "type": "string"
              },
              "rates": {
                "additionalProperties": false,
                "description": "Which rules the numbers use, as of when, and where they come from.",
                "properties": {
                  "asOf": {
                    "description": "The day the platform's fee table was last checked against its sources (YYYY-MM-DD).",
                    "type": "string"
                  },
                  "estimatesLine": {
                    "description": "Amazon only: which figures are estimates (FBA, storage, returns and the rest depend on the size and stock Amazon measures). Say so when citing them.",
                    "type": "string"
