                "type": "string"
              },
              "freightToAmazon": {
                "description": "both: the seller's own freight per unit to send stock to Amazon, US dollars. Left out: not counted (said).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "fulfillment": {
                "description": "fba (Amazon ships; adds the FBA fee estimate), fbm (the seller ships), or both (the two side by side for the same item: send packed and labelCost).",
