        {
          "name": "sellerprofit_compare_fees",
          "title": "Fees compared: one sale on Etsy, Shopify and Amazon",
          "description": "Works out the fees on one sale on Etsy (listing, transaction, processing; Offsite Ads optional), on a Shopify store (card fee by plan through Shopify Payments) and on Amazon (referral fee by category, the Individual plan's per-item fee, an optional FBA fee the seller types), side by side, each column equal to that platform's single fee tool; with orders a month, Shopify's plan and Amazon's Professional plan are spread over each order. It fits a seller who asks which platform takes less of a sale, Etsy vs Shopify vs Amazon fees, or which is cheaper to sell on. Takes the item price and shipping charged; optionally orders a month, the Offsite Ads rate, the Shopify plan, the Amazon category, plan and FBA fee. Returns each platform's fee lines, fixed cost per order, total, what's left and its share of the sale, and which costs least at these numbers, with the caveat that fees are one part of the choice. US dollars; dated rates with sources. Free, no sign-in. Takes numbers only; nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amazonCategory": {
                "description": "Amazon: the category, which sets the referral fee. Left out: Everything Else (15%), flagged.",
                "enum": ["beauty-health", "baby", "grocery", "clothing", "home-kitchen", "toys", "sports-outdoors", "pet", "electronics-accessories", "media", "jewelry", "furniture", "everything-else", "amazon-device-accessories", "compact-appliances", "full-size-appliances", "automotive", "base-power-tools", "backpacks-handbags-luggage", "business-industrial-scientific", "computers", "consumer-electronics", "eyewear", "footwear", "gift-cards", "lawn-garden", "lawn-mowers-snow-throwers", "mattresses", "musical-instruments", "office", "tires", "tools", "video-games", "video-game-consoles", "watches", "not-sure"],
                "type": "string"
              },
              "amazonFulfillmentFee": {
                "description": "Amazon: the FBA fee per unit (Fee Preview in Seller Central) when Amazon ships it. The Amazon sale is then the item price alone (no shipping charged), and the fee replaces the label. Left out: the seller ships, and the buyer pays shippingCharged.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "amazonPlan": {
                "description": "Amazon: professional ($39.99 a month) or individual ($0.99 an item). Left out: professional, flagged.",
                "enum": ["professional", "individual"],
                "type": "string"
              },
              "etsyOffsiteAds": {
                "description": "Etsy: did the sale come from an Offsite Ad? none, 12-percent (shops past $10,000 a year) or 15-percent. Left out: none, flagged. off is taken as none.",
                "enum": ["none", "12-percent", "15-percent", "off"],
                "type": "string"
              },
              "itemPrice": {
                "description": "The item price on the sale, US dollars, before shipping and tax.",
                "maximum": 100000,
                "minimum": 0.01,
                "type": "number"
              },
              "ordersPerMonth": {
                "description": "Orders a month, 1 to 100,000: spreads the fixed monthly costs (Shopify's plan, Amazon's Professional plan) over each order. Left out: fees on the sale only, before monthly plans (plansCounted false).",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "shippingCharged": {
                "default": 0,
                "description": "What the buyer pays for shipping, US dollars (0 if free).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "shopifyBilling": {
                "description": "Shopify: how the plan is billed, used with ordersPerMonth. Left out: monthly.",
                "enum": ["monthly", "yearly"],
                "type": "string"
              },
              "shopifyPlan": {
                "description": "Shopify: the plan, paid through Shopify Payments. Left out: basic, flagged.",
                "enum": ["basic", "grow", "advanced"],
                "type": "string"
              }
            },
            "required": ["itemPrice"],
            "type": "object"
          },
