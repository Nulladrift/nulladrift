        {
          "name": "sellerprofit_shopify_plan_fit",
          "title": "Which Shopify plan and billing fit your sales",
          "description": "Works out which Shopify plan (Basic, Grow, Advanced) costs least at a store's card sales: each plan's price plus the card fees that change with the plan (or Shopify's third-party fee on sales through another processor), the card sales above which each move up pays for itself, on monthly and yearly billing, and what yearly billing takes off the price. It fits a seller who asks whether to upgrade or downgrade their Shopify plan, whether yearly billing is worth it, or why a bigger plan costs them more. Takes monthly card sales (US dollars), the current plan, billing and processor; with both processors, the share Shopify Payments handles. Returns every plan's cost, the cheapest plan on the current billing and on either billing, the break-even sales, and the yearly-billing difference, with the dated Shopify rates and sources. A move's value holds at these sales; below the break-even the bigger plan costs more. Free, no sign-in. Takes numbers only; nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "billing": {
                "description": "How the plan is paid now.",
                "enum": ["monthly", "yearly"],
                "type": "string"
              },
              "currentPlan": {
                "description": "The store's plan (Settings > Plan). Plus is priced per store and Starter's figures aren't on Shopify's pricing page, so neither is compared here.",
                "enum": ["basic", "grow", "advanced"],
                "type": "string"
              },
              "monthlyCardSales": {
                "description": "Online card sales a month, US dollars (order totals with shipping): what the card fees are charged on.",
                "maximum": 10000000,
                "minimum": 0.01,
                "type": "number"
              },
              "premiumCardShare": {
                "description": "Share of card sales on premium cards (Amex, business cards), which pay a higher rate on every plan. Default 0.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "processor": {
                "description": "How card payments arrive (Settings > Payments): shopify-payments, another (Stripe, Square and others; Shopify then adds its third-party fee), or both.",
                "enum": ["shopify-payments", "another", "both"],
                "type": "string"
              },
              "shopifyPaymentsShare": {
                "description": "With both: the share of sales Shopify Payments handles, a fraction. Left out: half, flagged.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["billing", "currentPlan", "monthlyCardSales", "processor"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assumedNoPremium": {
                "description": "True when premiumCardShare was left out and some sales go through Shopify Payments: none were counted as premium cards; the seller's own share would change the answer.",
                "type": "boolean"
              },
              "billing": {
                "enum": ["monthly", "yearly"],
                "type": "string"
              },
              "breakEvens": {
                "description": "Price gap ÷ rate gap, for each move up, on both billings.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "billing": {
                      "enum": ["monthly", "yearly"],
                      "type": "string"
                    },
                    "from": {
                      "enum": ["basic", "grow", "advanced"],
                      "type": "string"
                    },
                    "sales": {
                      "description": "Card sales a month above which `to` costs less than `from`, US dollars; null when `to` has no lower rate.",
                      "type": ["number", "null"]
                    },
                    "to": {
                      "enum": ["basic", "grow", "advanced"],
                      "type": "string"
                    }
                  },
                  "required": ["billing", "from", "sales", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "cheapest": {
                "additionalProperties": false,
                "description": "The cheapest plan on the store's current billing.",
                "properties": {
                  "billing": {
                    "enum": ["monthly", "yearly"],
                    "type": "string"
