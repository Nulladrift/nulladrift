        {
          "name": "sellerprofit_rates",
          "title": "Fee tables (dated, sourced): Etsy, Shopify, Amazon",
          "description": "Returns one platform's fee table, the one this server's numbers use: every fee and rule with its value, a plain label, its source link and the day it was checked, whether it's official or a third-party estimate, and both values where sources disagree, plus when the table is due for its next check. Etsy: listing, transaction, processing, Offsite Ads, Etsy Ads minimums, shipping lines, Etsy Plus, tax facts. Shopify: plan prices on both billings, card rates, the third-party processor fee, currency, chargebacks, Shopify Tax. Amazon: plans, referral by category, the media closing fee, FBA, size tiers, storage, aged stock, removal, returns, placement, low-inventory and peak fees (official, from Amazon's own pages), and coupon fees (third-party). It serves to cite a platform's fees, to answer what a fee is, or to check how current the numbers are. Takes no figures; platform defaults to etsy. Free, no sign-in. Nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "platform": {
                "default": "etsy",
                "description": "Whose fee table. Default etsy.",
                "enum": ["etsy", "shopify", "amazon"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "link": {
                "description": "Opens the matching page on sellerprofitdoctor.com. Carries none of the figures sent.",
                "type": "string"
              },
