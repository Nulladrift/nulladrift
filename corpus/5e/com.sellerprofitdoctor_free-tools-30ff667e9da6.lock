      "serverInfo": {
        "name": "sellerprofitdoctor-free-tools",
        "title": "Seller Profit Doctor free profit tools",
        "version": "1.5.0",
        "description": "Free profit tools for online sellers on Etsy, Shopify and Amazon: a full check-up with a grade word and the top 3 losses (each with its fix and dollar value), Etsy's fees on a sale, one Etsy sale's profit after fees and costs (with pay per hour), Offsite Ads, the shipping gap, Etsy Ads break-even ROAS, the price for a target profit, whether a sale or coupon pays, one sale's fees compared across Etsy, Shopify and Amazon, break-even ROAS for Meta and Google ads, what a box bills at with USPS, UPS and FedEx, Shopify plan fit, the fees on one Shopify order, Amazon's fees on a unit, Amazon ads break-even ACoS, and each platform's dated, sourced fee table.",
        "websiteUrl": "https://sellerprofitdoctor.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Seller Profit Doctor's free tools work out where an online seller's money goes on Etsy, Shopify or Amazon (platform_supported: etsy, shopify, amazon). sellerprofit_checkup runs the full check-up for any of the three (set platform; etsy is the default) from a few Quiz v1 answers. The grade is a word such as Watch, with level 1 (Healthy) to 5 (Losing money); with too few answers there's no grade yet, and grade.missing lists what to ask. The other tools each answer one question: sellerprofit_etsy_fees (one Etsy sale's fees), sellerprofit_etsy_profit (one Etsy sale's profit after fees, materials, packaging and the label, with pay per hour), sellerprofit_offsite_ads, sellerprofit_shipping_gap, sellerprofit_ads_breakeven, sellerprofit_price_for_margin (Etsy), sellerprofit_sale_breakeven (any of the three), sellerprofit_compare_fees (all three side by side), sellerprofit_ads_roas_breakeven (Meta and Google ads), sellerprofit_box_billing (dimensional weight), sellerprofit_shopify_plan_fit, sellerprofit_shopify_order_fees, sellerprofit_amazon_fees, sellerprofit_amazon_ads_breakeven, and sellerprofit_rates (any platform's fee table with sources). Money is US dollars; shares are fractions (0.1 is 10%). Bands and not-sure answers are fine: every result lists the defaults it used, so ask the seller for their real numbers and call again. Amazon's fulfillment, storage and returns fees use Amazon's 2026 rates but depend on the size and stock Amazon measures: those figures carry estimate: true and sit apart from the loss total. Say \"about\" and \"estimated\", and point the seller to Fee Preview. Every fix's dollar value holds at the seller's numbers if orders hold; say it that way, never as a promise. Each result carries the date of the rates and their sources: cite them. Fixed formulas; no AI computes a number. Free, no sign-in, numbers only; nothing you send is stored.",
      "tools": [
        {
          "name": "sellerprofit_ads_breakeven",
          "title": "Break-even ROAS for Etsy Ads",
          "description": "Works out the ROAS at which an Etsy shop's Etsy Ads pay for themselves (break-even ROAS = order ÷ what an ad order keeps after Etsy's fees and costs), the most an ad can cost per sale, and, with the shop's ROAS, what the ads gain or lose a month. It fits a seller who asks whether Etsy Ads are worth it, what ROAS they need, or whether to turn ads off. Takes the item price, shipping charged, materials, label cost, and the daily budget or exact monthly spend; packaging is optional ($1 typical, flagged) and ROAS from the Etsy Ads page adds the monthly gain or loss and the fix. Returns the margin, break-even ROAS, ad sales and earnings, the monthly gain or loss and, when the ads lose money, the fix and what it's worth. US dollars; dated Etsy rules with sources. Free, no sign-in. Takes numbers only; nothing is stored.",
