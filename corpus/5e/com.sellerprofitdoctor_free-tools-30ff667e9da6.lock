        {
          "name": "sellerprofit_etsy_profit",
          "title": "Profit on one Etsy sale",
          "description": "Works out what one Etsy sale leaves the seller: the order total, minus Etsy's listing, transaction and payment processing fees, the Offsite Ads fee when the sale came from one, materials, packaging and the shipping label. With the minutes the item takes, it also says what that comes to an hour, and with an hourly rate, the item price that pays it. It fits a seller who asks whether a sale makes money, what their margin is, or what they earn an hour. Takes the item price, shipping charged, materials and label cost; optionally packaging, whether it was an Offsite Ads sale, the sales tax rate, minutes per item and hourly pay. Returns each fee and cost, the profit, the margin and the break-even item price, in US dollars, with the dated Etsy rules and their sources. Free, no sign-in. Takes numbers only; nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hourlyPay": {
                "description": "What the seller wants to earn an hour, US dollars. Send with minutesPerItem.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "itemPrice": {
                "description": "The item price on this sale, US dollars, before shipping.",
                "maximum": 100000,
                "minimum": 0.01,
                "type": "number"
              },
              "labelCost": {
                "description": "What the shipping label cost, US dollars (0 if the buyer collected it).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "materials": {
                "description": "Materials and supplies for the item, US dollars.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "minutesPerItem": {
                "description": "Minutes the seller spends making, listing and packing one item. Left out: the seller's time isn't counted.",
                "maximum": 1440,
                "minimum": 1,
                "type": "number"
              },
              "offsiteAds": {
                "default": "none",
                "description": "Did this sale come from an Offsite Ad? none, or the shop's rate: 12-percent or 15-percent. Default none; off is taken as none.",
                "enum": ["none", "12-percent", "15-percent", "off"],
                "type": "string"
              },
              "packaging": {
                "anyOf": [
                  {
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "enum": ["mailer", "box", "not-sure"],
                    "type": "string"
                  }
                ],
                "description": "Packaging per order in US dollars, or mailer (about $1), box (about $3) or not-sure. Left out: $1, a weakly sourced typical figure, flagged as a default."
              },
              "salesTaxRate": {
                "default": 0,
                "description": "The sales tax rate the buyer paid, as a fraction (0.07 is 7%). Etsy charges its 3% processing fee on the tax too. Default 0.",
                "maximum": 0.2,
                "minimum": 0,
                "type": "number"
              },
              "shippingCharged": {
                "default": 0,
                "description": "What the buyer paid for shipping, US dollars (0 if free).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["itemPrice", "labelCost", "materials"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from": {
                      "enum": ["typed", "band", "default", "estimated"],
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "isDefault": {
                      "description": "True when the value isn't the seller's own number or tap: a default their own figure would replace.",
                      "type": "boolean"
