        {
          "name": "sellerprofit_shopify_order_fees",
          "title": "Fees on one Shopify order",
          "description": "Works out every fee on one order of a US Shopify store, line by line: the Shopify Payments card fee by plan (premium cards optional), the international card and currency conversion fees, the 1.25% for mixing Shopify Payments with another card processor, another processor's own fee and Shopify's third-party fee on top (2%, 1% or 0.6% by plan), and the PayPal exemption from that fee when Shopify Payments is the main processor. It fits a seller who asks how much Shopify takes per sale, what one order costs in fees, or what's left of an order. Takes the item price, shipping charged, the plan (basic, grow, advanced) and how the order was paid; orders a month, billing and the app bill put the plan price and apps on each order. Returns each fee with its working, the total, its share of the order and what's left, and with orders the plan and apps per order. US dollars; dated Shopify rates with sources. Free, no sign-in. Takes numbers only; nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "appsMonthly": {
                "description": "The monthly app bill, US dollars. Needs ordersPerMonth. Default 0.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "billing": {
                "description": "How the plan is paid (price per month). Needs ordersPerMonth. Default monthly.",
                "enum": ["monthly", "yearly"],
                "type": "string"
              },
              "foreignShare": {
                "description": "With shopify-payments or both only: the share of Shopify Payments sales paid by buyers abroad in another currency (1% international card fee + 1.5% conversion); 1 when this order was. Default 0.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "itemPrice": {
                "description": "What the buyer pays for the items on this order, US dollars, before shipping and tax.",
                "maximum": 100000,
                "minimum": 0.01,
                "type": "number"
              },
              "ordersPerMonth": {
                "description": "Orders a month, a whole number from 1 to 100,000. Spreads the plan price and the app bill over each order. Left out: per-order fees only.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "otherProcessorCents": {
                "description": "That company's fixed fee per sale, in cents (30 is 30¢). Send with otherProcessorPercent.",
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "otherProcessorPercent": {
                "description": "With another, both or paypal: that company's rate as a percent (2.9 is 2.9%). Send with otherProcessorCents. Left out: 2.9% + 30¢ (Stripe's standard rate), or 3.49% + 49¢ for paypal (the PayPal Wallet starting rate on Shopify's pricing page), flagged.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "plan": {
                "description": "The store's plan (Settings > Plan). Plus is priced per store and Starter's rates aren't on Shopify's pricing page.",
                "enum": ["basic", "grow", "advanced"],
                "type": "string"
              },
              "premiumCardShare": {
                "description": "With shopify-payments or both only: the share of Shopify Payments card sales on premium cards (Amex, business cards), which pay a higher rate; 1 when this order was on one. Default 0.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "processor": {
                "description": "How this order was paid: shopify-payments (the store's only card processor); another (Stripe, Square and others, or PayPal on a store without Shopify Payments: Shopify adds its third-party fee); both (the store runs Shopify Payments beside another card processor: the 1.25% applies to what Shopify Payments handles); paypal (paid with PayPal on a store whose primary provider is Shopify Payments: no third-party fee).",
                "enum": ["shopify-payments", "another", "both", "paypal"],
                "type": "string"
              },
              "shippingCharged": {
                "default": 0,
                "description": "What the buyer pays for shipping, US dollars (0 if free).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "shopifyPaymentsShare": {
                "description": "With both: the share of orders Shopify Payments handles, a fraction (1 when this order went through Shopify Payments, 0 when through the other one). Left out: half, flagged.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["itemPrice", "plan", "processor"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "afterFees": {
                "description": "orderTotal − totalFees: what's left before product cost, the label, packaging, ads, the plan and apps.",
                "type": "number"
              },
              "assumptions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from": {
                      "enum": ["typed", "band", "default", "estimated"],
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "isDefault": {
                      "description": "True when the value isn't the seller's own number or tap: a default their own figure would replace.",
                      "type": "boolean"
                    },
                    "label": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "valueText": {
                      "type": "string"
                    }
                  },
                  "required": ["from", "id", "isDefault", "label", "note", "valueText"],
                  "type": "object"
                },
                "type": "array"
              },
              "feeShareOfOrder": {
                "description": "totalFees ÷ orderTotal.",
                "type": "number"
              },
              "itemPrice": {
                "type": "number"
              },
              "lines": {
                "description": "Each fee on the order, each rounded to the cent. A PayPal order shows the third-party fee at 0, exempt.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fee": {
                      "type": "number"
                    },
                    "id": {
                      "enum": ["card", "international", "conversion", "mixing", "otherProcessor", "thirdPartyFee"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "working": {
                      "description": "How the line is worked out, in words a person can redo.",
                      "type": "string"
                    }
                  },
                  "required": ["fee", "id", "label", "working"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "description": "Opens the matching page on sellerprofitdoctor.com. Carries none of the figures sent.",
                "type": "string"
              },
              "monthly": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "afterAll": {
                        "description": "orderTotal − totalPerOrder: what's left before product cost, the label, packaging and ads.",
                        "type": "number"
                      },
                      "appsMonthly": {
                        "type": "number"
                      },
                      "appsPerOrder": {
                        "description": "appsMonthly ÷ orders, rounded to the cent.",
                        "type": "number"
                      },
                      "billing": {
                        "enum": ["monthly", "yearly"],
                        "type": "string"
                      },
                      "ordersPerMonth": {
                        "type": "number"
                      },
                      "planPerOrder": {
                        "description": "planPrice ÷ orders, rounded to the cent.",
                        "type": "number"
                      },
                      "planPrice": {
                        "description": "The plan's price a month on this billing, US dollars.",
                        "type": "number"
                      },
                      "shareOfOrder": {
                        "description": "totalPerOrder ÷ orderTotal.",
                        "type": "number"
                      },
                      "totalPerOrder": {
                        "description": "totalFees + planPerOrder + appsPerOrder.",
                        "type": "number"
                      }
                    },
                    "required": ["afterAll", "appsMonthly", "appsPerOrder", "billing", "ordersPerMonth", "planPerOrder", "planPrice", "shareOfOrder", "totalPerOrder"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null without ordersPerMonth: the plan price and app bill are monthly, so they can't be put on one order."
              },
              "notes": {
                "description": "Rules the numbers rest on (shipping in the fee base, US rates, the PayPal exemption).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "orderTotal": {
                "description": "Items + shipping, before tax, US dollars: what the card fees are worked on.",
                "type": "number"
              },
              "paypalExempt": {
                "description": "True for processor paypal: no third-party fee, as Shopify Payments is the primary provider.",
                "type": "boolean"
              },
              "plan": {
                "enum": ["basic", "grow", "advanced"],
                "type": "string"
              },
              "planName": {
                "type": "string"
              },
              "platform": {
                "const": "shopify",
                "type": "string"
              },
              "processor": {
                "enum": ["shopify-payments", "another", "both", "paypal"],
                "type": "string"
              },
              "rates": {
                "additionalProperties": false,
                "description": "Which rules the numbers use, as of when, and where they come from.",
                "properties": {
                  "asOf": {
                    "description": "The day the platform's fee table was last checked against its sources (YYYY-MM-DD).",
                    "type": "string"
                  },
                  "estimatesLine": {
                    "description": "Amazon only: which figures are estimates (FBA, storage, returns and the rest depend on the size and stock Amazon measures). Say so when citing them.",
                    "type": "string"
                  },
                  "line": {
                    "type": "string"
                  },
                  "method": {
                    "type": "string"
                  },
                  "platform": {
                    "enum": ["etsy", "shopify", "amazon"],
                    "type": "string"
                  },
                  "recheckBy": {
                    "description": "The day the table is due for its next check.",
                    "type": "string"
                  },
                  "sources": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "sourceDate": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["name", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["asOf", "line", "method", "platform", "recheckBy", "sources"],
                "type": "object"
              },
              "shareIsDefault": {
                "type": "boolean"
              },
              "shippingCharged": {
                "type": "number"
              },
              "shopifyPaymentsShare": {
                "description": "The share Shopify Payments handles: 1, 0, or the split.",
                "type": "number"
              },
              "text": {
                "type": "string"
              },
              "totalFees": {
                "description": "The lines added up, US dollars.",
                "type": "number"
              }
            },
            "required": ["afterFees", "assumptions", "feeShareOfOrder", "itemPrice", "lines", "link", "monthly", "notes", "orderTotal", "paypalExempt", "plan", "planName", "platform", "processor", "rates", "shareIsDefault", "shippingCharged", "shopifyPaymentsShare", "text", "totalFees"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
