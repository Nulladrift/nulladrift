                "minimum": 1,
                "type": "number"
              },
              "adsMonthlySpend": {
                "description": "Exact Etsy Ads spend last 30 days, US dollars. Or send adsDailyBudget.",
                "maximum": 300000,
                "minimum": 0.01,
                "type": "number"
              },
              "itemPrice": {
                "description": "Typical item price, US dollars, before shipping.",
                "maximum": 100000,
                "minimum": 0.01,
                "type": "number"
              },
              "labelCost": {
                "description": "The shipping label, US dollars.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "materials": {
                "description": "Materials and supplies per item, US dollars.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "packaging": {
                "anyOf": [
                  {
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "enum": ["mailer", "box", "not-sure"],
                    "type": "string"
