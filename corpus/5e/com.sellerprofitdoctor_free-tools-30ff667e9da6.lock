                "type": "string"
              },
              "hourlyValue": {
                "description": "both: what an hour of the seller's time is worth, US dollars. Send with minutesPerOrder.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "inboundSplit": {
                "description": "both: how stock goes to Amazon: minimal (one location; Amazon charges a placement fee), partial (2–3 locations, offered only for bulky sizes; a standard-size unit is priced as minimal), or optimized (Amazon's split, no placement fee). Extra-large pays none. Left out: placement isn't counted (said).",
                "enum": ["minimal", "partial", "optimized"],
                "type": "string"
              },
              "labelCost": {
                "description": "both (required): what the seller's shipping label costs per order, US dollars.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "minutesPerOrder": {
