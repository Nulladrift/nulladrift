          "name": "anbieter_vergleich",
          "title": "Anbietervergleich Klickbetrug-Software",
          "description": "Gibt die öffentliche Vergleichstabelle von adfraudit.com zu Software gegen Klickbetrug zurück (ganz oder gefiltert), mit Quelle. Enthält nur belegte Tabellendaten, keine Bewertungen.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filter": {
                "description": "Optional: Anbietername oder Stichwort, um Zeilen zu filtern (max. 80 Zeichen)",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
