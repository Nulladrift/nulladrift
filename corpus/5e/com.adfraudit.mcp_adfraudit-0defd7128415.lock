        {
          "name": "kostenloses_audit",
          "title": "Kostenloses Klickbetrug-Audit",
          "description": "Erklärt das kostenlose Klickbetrug-Audit von adfraudit.com und gibt den Link zurück. Das Audit läuft auf Deutsch; ohne Deutschkenntnisse gibt es die englische Warteliste.",
