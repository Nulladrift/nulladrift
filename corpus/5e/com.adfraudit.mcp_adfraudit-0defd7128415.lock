        },
        {
          "name": "klickbetrug_wissen",
          "title": "Wissen zu Klickbetrug",
          "description": "Sucht in der öffentlichen Wissensbasis von adfraudit.com zu Klickbetrug, ungültigem Traffic und Fake-Leads in Google Ads und gibt die passenden Abschnitte zurück. Eingabe: Frage oder Stichwort (Deutsch).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "frage": {
                "description": "Frage oder Stichwort, max. 300 Zeichen",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["frage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
