{
  "lockfileVersion": 2,
  "subjects": {
    "com.ricursor/ricursor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.ricursor.com/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ricursor-elastic-memory",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Sync modules with ricursor_snapshot. Call ricursor_context and ricursor_check before each write; stop on block or errors. After a block, save the lesson with ricursor_correct. Report afterwards. Checks cover tracked imports and accepted boundaries only.",
      "tools": [
        {
          "name": "ricursor_action_check",
          "title": "Propose action",
          "description": "Metadata-only decision for a JS/TS write or delete. Returns allow or block (with reasons to fix) plus a one-use receipt. Never send source.",
          "inputSchema": {
            "properties": {
              "action_id": {
                "description": "Unique per proposed action, 8-80 characters.",
                "type": "string"
              },
              "baseline_hash": {
                "anyOf": [
                  {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "dependencies": {
                "type": "array"
              },
              "expected_version": {
                "minimum": 0,
                "type": "integer"
              },
              "kind": {
                "enum": ["write", "delete"],
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "path": {
                "type": "string"
              },
              "project": {
                "type": "string"
              },
              "result_hash": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["action_id", "baseline_hash", "kind", "path", "project"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1ebe564b1581227c9a6f74662bcf3decf574a065e8989f1fcbd16dbc33e3d2d6"
        },
        {
          "name": "ricursor_action_consume",
          "title": "Consume receipt",
          "description": "Atomically consumes a receipt immediately before the broker executes. Fails if anything changed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_id": {
                "description": "Unique per proposed action, 8-80 characters.",
                "type": "string"
              },
              "baseline_hash": {
                "anyOf": [
                  {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "receipt": {
                "type": "string"
              },
              "result_hash": {
                "anyOf": [
                  {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["action_id", "baseline_hash", "receipt", "result_hash"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:bc72eab15732e30adc1c27c93ee92d783cb5019613b6da3b39e3794df85b314a"
        },
        {
          "name": "ricursor_action_group_check",
          "title": "Propose related changes",
          "description": "Metadata-only decision for up to 20 related JS/TS writes/deletes judged on their combined end state (moves, renames).",
          "inputSchema": {
            "properties": {
              "actions": {
                "items": {
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "group_id": {
                "description": "Unique per proposed action, 8-80 characters.",
                "type": "string"
              },
              "project": {
                "type": "string"
              }
            },
            "required": ["actions", "group_id", "project"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:525f733af70602baa509e4028179a7fc3a55078559f65ea5a0951c84651e6ee1"
        },
        {
          "name": "ricursor_action_group_consume",
          "title": "Consume group receipt",
          "description": "All-or-nothing consumption before the broker writes the group.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "group_id": {
                "description": "Unique per proposed action, 8-80 characters.",
                "type": "string"
              },
              "receipt": {
                "type": "string"
              }
            },
            "required": ["group_id", "receipt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:91899b60c901e4e325243ed78911fba15a85f13d65b75c37f43afea4de9ff4fb"
        },
        {
          "name": "ricursor_check",
          "title": "Check planned write",
          "description": "Stop on block or errors. Checks tracked versions, exports and accepted import boundaries; never writes code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dependencies": {
                "items": {
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "version": {
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["path", "version"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "expected_version": {
                "minimum": 0,
                "type": "integer"
              },
              "hash": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "metadata": {
                "additionalProperties": false,
                "properties": {
                  "exports": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "imports": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "names": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "source": {
                          "type": "string"
                        }
                      },
                      "required": ["names", "source"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["exports", "imports"],
                "type": "object"
              },
              "path": {
                "type": "string"
              },
              "project": {
                "description": "Project name inside the workspace.",
                "type": "string"
              }
            },
            "required": ["dependencies", "expected_version", "hash", "metadata", "path", "project"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d08248549577936a8c14406cfb43905b4f81430667071f55ee83253eac9e34c"
        },
        {
          "name": "ricursor_context",
          "title": "Serve context",
          "description": "The verified corrections and recent file changes an agent must respect before it writes code.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "project": {
                "description": "Project name inside the workspace.",
                "type": "string"
              },
              "since": {
                "description": "Previous cursor for this same key, project and task; returns changed rules and removed IDs.",
                "type": "string"
              },
              "task": {
                "description": "Task to retrieve relevant rules for.",
                "type": "string"
              },
              "workspace": {
                "description": "Ignored: the key already selects its workspace.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42ea36cd234282aa60e4004df369202a9df4450f89cdb2585704ea7bed794ce7"
        },
        {
          "name": "ricursor_correct",
          "title": "Save verified correction",
          "description": "After Ricursor blocks a check, save the one-sentence lesson so every agent on this project gets it. Only accepted for your own blocked action from the last 24 hours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_id": {
                "description": "action_id or group_id of the blocked check.",
                "type": "string"
              },
              "project": {
                "description": "Project name inside the workspace.",
                "type": "string"
              },
              "rule": {
                "maxLength": 500,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["action_id", "project", "rule"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c7a924fe0cc9b1861ecff4c2ee94854a3032fd8c09fdb01290949b24c1400b78"
        },
        {
          "name": "ricursor_handoff",
          "title": "Save model handoff",
          "description": "Save structured task IDs and versioned rule decisions; never include prompts or source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expected_version": {
                "minimum": 0,
                "type": "integer"
              },
              "project": {
                "description": "Project name inside the workspace.",
                "type": "string"
              },
              "state": {
                "additionalProperties": false,
                "properties": {
                  "completed": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "decisions": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "constraint_id": {
                          "type": "string"
                        },
                        "status": {
                          "enum": ["accepted", "conflict"],
                          "type": "string"
                        },
                        "version": {
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["constraint_id", "status", "version"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "pending": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["completed", "decisions", "pending"],
                "type": "object"
              },
              "task_id": {
                "type": "string"
              }
            },
            "required": ["expected_version", "project", "state", "task_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ba350417a0523139a43ad0634ba7296660ea57af78c170efd56ed8ef0bc1c0e0"
        },
        {
          "name": "ricursor_ledger",
          "title": "Read model alignment",
          "description": "Read scoped metadata and rule versions before switching models. Observe only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "project": {
                "description": "Project name inside the workspace.",
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c9b7fda949f973e87e2726557f09d07c3e9f06c6259a743d397cb691b2f8d212"
        },
        {
          "name": "ricursor_report",
          "title": "Report activity",
          "description": "Record what an agent spent (usage) and what it changed (state).",
          "inputSchema": {
            "properties": {
              "project": {
                "description": "Project name inside the workspace.",
                "type": "string"
              },
              "request_id": {
                "description": "Unique ID per logical report; reuse unchanged when retrying.",
                "type": "string"
              },
              "state": {
                "properties": {
                  "detail": {
                    "enum": ["file_added", "file_updated", "file_deleted", "exports_changed", "imports_changed", "stale_baseline", "policy_conflict"],
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["file_change", "delta", "alert"],
                    "type": "string"
                  },
                  "path": {
                    "type": "string"
                  }
                },
                "required": ["detail", "kind", "path"],
                "type": "object"
              },
              "usage": {
                "properties": {
                  "baseline_tokens": {
                    "type": "integer"
                  },
                  "day": {
                    "description": "YYYY-MM-DD",
                    "type": "string"
                  },
                  "model": {
                    "type": "string"
                  },
                  "served_tokens": {
                    "type": "integer"
                  }
                },
                "required": ["baseline_tokens", "day", "model", "served_tokens"],
                "type": "object"
              },
              "workspace": {
                "description": "Ignored: the key already selects its workspace.",
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1e9525f224441b196f30ab956557f7c9e1edb53dae1053696cbe61347f862baa"
        },
        {
          "name": "ricursor_snapshot",
          "title": "Sync repository",
          "description": "Sync locally extracted JS/TS structural metadata only; never transmit source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expected_version": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "hash": {
                      "anyOf": [
                        {
                          "pattern": "^[a-f0-9]{64}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "metadata": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "exports": {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "imports": {
                              "items": {
                                "additionalProperties": false,
                                "properties": {
                                  "names": {
                                    "items": {
                                      "type": "string"
                                    },
                                    "type": "array"
                                  },
                                  "source": {
                                    "type": "string"
                                  }
                                },
                                "required": ["names", "source"],
                                "type": "object"
                              },
                              "type": "array"
                            }
                          },
                          "required": ["exports", "imports"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "path": {
                      "type": "string"
                    }
                  },
                  "required": ["expected_version", "hash", "metadata", "path"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "project": {
                "description": "Project name inside the workspace.",
                "type": "string"
              }
            },
            "required": ["files", "project"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9ddaac2c385382e4596e5c6eb8699b5feb197ad2ba12e9288dfd7b109a633d35"
        },
        {
          "name": "ricursor_workspaces",
          "title": "List workspaces",
          "description": "The workspace this key can reach.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9b9072489015fadebfc2ef615d950010aa873f02c29d6b2a32ae8aded50ff288"
        }
      ],
      "digest": "sha256:f131327d8b712aec92687478ce3211b66b835ddb10393c6d754324c6caed54b0"
    }
  }
}
