{
  "lockfileVersion": 2,
  "subjects": {
    "co.bricktable/bricktable": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bricktable.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bricktable",
        "title": "BrickTable",
        "version": "1.0.1",
        "websiteUrl": "https://bricktable.co/data",
        "icons": [
          {
            "src": "https://bricktable.co/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://bricktable.co/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BrickTable tracks tokenized real estate on four platforms (RealT, Lofty, Binaryx, Reental): about 1,000 listings and every executed secondary-market trade we have recorded since 2022.\n\nRules for using this data:\n- Always pass on the \"caveats\" of any result you use. They say when a figure must not be read at face value.\n- A yield is {value, basis}. Never compare yields with different bases, and never present a \"projected\" or \"platform_stated\" yield as income being paid.\n- RealT stopped paying rental distributions in February 2026 and announced a voluntary liquidation in July 2026. Its listed yields are the issuer's pre-suspension figures.\n- Prices are the last executed trade, not an ask or an appraisal. A listing that has not traded recently may not be sellable at that price.\n- Nothing here is investment advice. Link the BrickTable page (the \"url\" field) when citing a listing.\n\nMethodology: https://bricktable.co/methodology · Bulk data for research: https://bricktable.co/data",
      "tools": [
        {
          "name": "get_platform_overview",
          "title": "Platform overview",
          "description": "Per-platform summary: listing counts, how many are paying distributions, traded volume over 30 and 90 days, and the median last traded price as a share of issue price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "Limit to one platform. Omit for all four.",
                "enum": ["RealT", "Lofty", "Binaryx", "Reental"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:700a0aed5753ddaf92c1c22d04088551e4efdabca234337984d2f385dfba7802"
        },
        {
          "name": "get_property",
          "title": "Get one tokenized property",
          "description": "Full profile of one listing by its BrickTable id (from search_properties): price and issue price, yield with basis, payout status, tokens, holders and concentration, rent, ZIP-level home value and rent (US), recent trading, and caveats.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "BrickTable property id, e.g. 'lofty-01JGMSZ4NEGCFF8T8CEE5XXYQ7'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61aab0e8afa48fed9a108902a306bbe29ca3ba1a04542f7edb9c7c5a9fe9ebc4"
        },
        {
          "name": "get_property_trades",
          "title": "Executed trades for one property",
          "description": "Recorded secondary-market fills for one listing over the last 90 days, newest first, with quantity, price, settlement currency, USD value and a block-explorer link. Includes a summary (fill count, USD volume, volume-weighted price). The full history back to 2022 is available as a data license at bricktable.co/data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Look-back window, up to 90 days on the free server. Default 90.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Max fills returned (newest first). Default 50. The summary covers the whole window.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "property_id": {
                "description": "BrickTable property id from search_properties, e.g. 'realt-...' or 'lofty-...'.",
                "type": "string"
              }
            },
            "required": ["property_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:41c6dee07e68c469dcf577680206f368562d804ca8f99218421ed6727c4e416d"
        },
        {
          "name": "get_recent_trades",
          "title": "Latest trades across platforms",
          "description": "The most recent executed fills across all four platforms (or one), newest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 20.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Limit to one platform. Omit for all four.",
                "enum": ["RealT", "Lofty", "Binaryx", "Reental"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9c09c2a48fa08d37530aa8c0ed3f245fe0c829abceddb0b20cd96fe458a16bd"
        },
        {
          "name": "search_properties",
          "title": "Search tokenized properties",
          "description": "Find tokenized real-estate listings across RealT, Lofty, Binaryx and Reental. Filter by platform, country, text, payout status or recent trading. Each row has the last traded price, issue price, yield with its basis, payout status and caveats.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name, e.g. 'United States', 'Spain'. Case-insensitive.",
                "type": "string"
              },
              "include_exited": {
                "description": "Include sold/redeemed and unlisted listings. Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "payout_status": {
                "description": "regular = distributions arriving on schedule; stalled = overdue; not_started = not yet paying (e.g. under construction).",
                "enum": ["regular", "stalled", "not_started"],
                "type": "string"
              },
              "platform": {
                "description": "Limit to one platform. Omit for all four.",
                "enum": ["RealT", "Lofty", "Binaryx", "Reental"],
                "type": "string"
              },
              "query": {
                "description": "Text matched against the address/title and location, e.g. 'Detroit' or 'Chase St'.",
                "type": "string"
              },
              "sort": {
                "description": "Default last_trade (most recently traded first). 'yield' ranks listings whose distributions are being paid first, then those that are not, then off-plan projections.",
                "enum": ["last_trade", "yield", "price_vs_issue", "holders"],
                "type": "string"
              },
              "traded_within_days": {
                "description": "Only listings with an executed trade in this many days.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:befe8dc87c023a4a251c4e6b9af9c3b4b3c0fbe606d29202038c4d6bc30b19f6"
        }
      ],
      "digest": "sha256:b03f629eddb92a3ac3a7a695e3bc9c0237b7a2c4f0b1b2c616297b874e87669c"
    }
  }
}
