      "instructions": "Real Alpha (https://realalpha.app) has listened to long interviews and podcasts with the people building AI (founders, CEOs and researchers on Lenny's Podcast, Dwarkesh Podcast, No Priors, BG2 and more). Use it to summarize an episode from its YouTube link or name, since you can't watch it, or to find what a named person actually said, with the show and date. When you use a moment, quote its `quote`, name the speaker, show and date, and link its `url` (`cite` has a ready line).\n\nEach moment is a few minutes of one episode, with the speaker's own words, a summary and its page. Results are short excerpts and links: for the full context, send people to the moment's page, which plays the episode from that minute, or the episode's page.",
      "tools": [
        {
          "name": "answers_to",
          "title": "How AI leaders answer a big question",
          "description": "How the people building AI answer one of the big questions people ask about it, from the moments Real Alpha cut: grouped by which way they answer, the biggest group first, each with what the speaker says, who they are, the show and date. Use it when someone asks where AI leaders stand on one of these questions; for any other question, search_moments. The questions: is-ai-a-bubble (Is AI a bubble?); which-jobs-will-ai-replace (Which jobs will AI replace, and which are safe?); will-ai-replace-software-engineers (Will AI replace software engineers?); will-ai-replace-doctors (Will AI replace doctors?); will-ai-replace-lawyers (Will AI replace lawyers?); is-saas-dead (Is SaaS dead?); when-will-we-get-agi (When will we get AGI?); is-openai-profitable (How does OpenAI make money, and is it profitable?); ai-predictions (What will AI look like in the next few years?); are-ai-agents-ready (Are AI agents ready for real work?); is-ai-paying-off (Is AI paying off for companies?); is-ai-dangerous (Is AI dangerous?); will-ai-make-cyberattacks-worse (Will AI make cyberattacks worse?); can-anyone-compete-with-nvidia (Can anyone compete with Nvidia?); is-there-a-gpu-shortage (Is there still a GPU shortage?); is-there-enough-power-for-ai (Is there enough power for AI?); is-moores-law-dead (Is Moore’s law dead?); is-ai-progress-slowing (Is AI progress slowing down?); is-open-source-ai-catching-up (Is open-source AI catching up?); is-china-catching-up-in-ai (Is China catching up in AI?); is-ai-overhyped (Is AI overhyped?); will-ai-replace-google-search (Will AI replace Google search?); is-vibe-coding-the-future (Is vibe coding the future?); is-a-computer-science-degree-worth-it (Is a computer science degree still worth it?); are-ai-wrappers-a-real-business (Are AI wrappers a real business?); how-do-ai-companies-make-money (How do AI companies make money?); should-ai-be-regulated (Should AI be regulated?); will-ai-cure-diseases (Will AI cure diseases?); when-will-humanoid-robots-be-useful (When will humanoid robots be useful?); are-self-driving-cars-safe (Are self-driving cars safe?); will-ai-boost-economic-growth (Will AI boost economic growth?); will-ai-replace-accountants (Will AI replace accountants?); will-ai-replace-teachers (Will AI replace teachers?); will-ai-replace-customer-service (Will AI replace customer service jobs?).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
