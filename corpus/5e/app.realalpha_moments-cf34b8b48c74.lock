                "minLength": 2,
                "type": "string"
              },
              "show": {
                "description": "Only episodes of this show: \"No Priors\"",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["episode"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
