        {
          "name": "search_moments",
          "title": "Search what AI leaders said",
          "description": "Search the moments Real Alpha cut from long interviews with the people building AI. Use it when someone asks what AI founders, CEOs or researchers have said about a subject, or wants sources, quotes or expert views on an AI question. Matches the words of `query` against what each moment is about, the speaker's quote and its takeaways, best match first. Filter by who is talking (`person`), a company (someone from it talking, or it being discussed), a show, or how recent. Each result has the speaker, what they do, the show, the date, their quote, and the moment's page to cite. It only covers the episodes Real Alpha has cut, so no match doesn't mean nobody said it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Only moments from someone at this company, or about it: \"Anthropic\", \"Nvidia\"",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "How many moments to return, 8 if not given, 20 at most",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "person": {
                "description": "Only moments where this person is talking, by name: \"Sam Altman\", \"Dario Amodei\"",
                "maxLength": 100,
                "type": "string"
              },
              "query": {
                "description": "What to look for, in a few words: \"AI bubble\", \"coding agents replacing engineers\", \"scaling laws\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "show": {
                "description": "Only moments from this show: \"Lenny's Podcast\", \"Dwarkesh Podcast\", \"No Priors\"",
                "maxLength": 100,
                "type": "string"
              },
              "since": {
                "description": "Only episodes out on or after this date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
