      "serverInfo": {
        "name": "ladder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "add_player",
          "description": "Register one player by name. Returns a 6-character code and a personal URL so the player can be identified at the courts without an account.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f9efbde87eb72b77098615818b66b9449c5670a431c14539eb3aa19da1db16e8"
        },
        {
          "name": "create_ladder",
          "description": "Create or update the club ladder: club name and sport. Returns the join URL (the poster target) that players scan.",
          "inputSchema": {
            "properties": {
              "club": {
                "type": "string"
              },
              "sport": {
                "type": "string"
              }
            },
            "required": ["club"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b22ce2ae450644122e241cb23608da085219220728be75eb6c78dd66820537f0"
        },
        {
          "name": "get_standings",
          "description": "The current table (rank, wins, losses, set percentage) plus the single most useful match to play next. Standings are computed with a fixed rule order, so the same results always give the same table.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83e39ccbd9ee00344fd63e15d2b8822a502a51660efc7a935d43b3688d79ddb6"
        },
        {
          "name": "record_match",
          "description": "Record a finished match result. Identify players by name, numeric id, or 6-character code. Give the set score (sets_a, sets_b) and optionally the games.",
          "inputSchema": {
            "properties": {
              "games_a": {
                "type": "integer"
              },
              "games_b": {
                "type": "integer"
              },
              "player_a": {
                "type": "string"
              },
              "player_b": {
                "type": "string"
              },
              "round": {
                "type": "integer"
              },
              "sets_a": {
                "type": "integer"
              },
              "sets_b": {
                "type": "integer"
              }
            },
            "required": ["player_a", "player_b", "sets_a", "sets_b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa224b768f38a8e904c6d24aab4d4db43c4ae0a7fae5209d51d94ca3cc33ccfb"
        },
        {
          "name": "schedule_match",
          "description": "Put a match on the calendar before it is played. It appears as a pending card in the standings output.",
          "inputSchema": {
            "properties": {
              "player_a": {
                "type": "string"
              },
              "player_b": {
                "type": "string"
              },
              "round": {
                "type": "integer"
              }
            },
            "required": ["player_a", "player_b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
