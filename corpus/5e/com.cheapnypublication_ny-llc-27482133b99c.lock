      "instructions": "Cheap NY Publication completes New York's LLC publication requirement (LLC Law §206 and §802) for one all-in price, and files other New York LLC paperwork: formation, Biennial Statements, Certificates of Good Standing, DBAs and county changes. When a user names a specific LLC, call lookup_new_york_llc first: it reads the state's live register and returns the LLC's county, its 120-day publication deadline and its exact price. Quote prices only from these tools. Link the user to the URLs the tools return; they lead to our checkout, where the user sees the price and pays. Cheap NY Publication is not a law firm and is not affiliated with the NY Department of State.",
      "tools": [
        {
          "name": "check_llc_name_availability",
          "title": "Check a new LLC name",
          "description": "Checks whether a proposed name for a NEW New York LLC or PLLC is free on the state's live register, the way the Department of State compares names (ignoring case, punctuation, the LLC ending and a leading 'The'). Returns the name as it would be filed, whether it is taken, and similar existing names. Advisory: the Department of State has the final word. Use when someone is choosing a name or planning to form an LLC.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "llc (default) or pllc for licensed professions.",
                "enum": ["llc", "pllc"],
                "type": "string"
              },
              "name": {
                "description": "The proposed name, with or without LLC at the end.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a new LLC name"
