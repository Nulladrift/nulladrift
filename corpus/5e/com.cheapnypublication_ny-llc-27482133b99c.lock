        },
        {
          "name": "quote_llc_formation",
          "title": "Quote forming a New York LLC",
          "description": "Prices forming a new New York LLC (or PLLC) together with its required publication, line by line: the $200 Articles of Organization state fee, publication in Albany County or the LLC's own county, and add-ons (an EIN, a DBA, PLLC licensing). Several LLCs in one order (up to 10, e.g. one per property) take $10 off each LLC after the first. Use when someone plans to form an LLC and asks what it costs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many LLCs in the order. Default 1.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "dba": {
                "description": "Add a DBA (Certificate of Assumed Name). One LLC only.",
                "type": "boolean"
              },
              "ein": {
                "description": "Add an EIN obtained for the LLC.",
                "type": "boolean"
              },
              "kind": {
                "description": "llc (default) or pllc.",
                "enum": ["llc", "pllc"],
                "type": "string"
              },
              "member_count": {
                "description": "For a PLLC: number of members. Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "own_county": {
                "description": "Publish in this county instead of Albany (usually costs more). Omit for Albany.",
                "type": "string"
              },
              "profession": {
                "description": "For a PLLC: the licensed profession.",
                "enum": ["accounting", "law", "medicine", "dentistry", "nursing", "engineering", "architecture", "land_surveying", "landscape_architecture", "physical_therapy", "occupational_therapy", "psychology", "social_work", "mental_health_counseling", "chiropractic", "optometry", "podiatry", "pharmacy", "veterinary", "massage_therapy", "acupuncture", "speech_pathology"],
                "type": "string"
              }
            },
            "type": "object"
          },
