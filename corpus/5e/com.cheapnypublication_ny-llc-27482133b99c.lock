        {
          "name": "get_publication_price",
          "title": "NY LLC publication price by county",
          "description": "Returns Cheap NY Publication's all-in price to complete New York LLC publication for an LLC in a given county, for a New York LLC or an out-of-state (foreign) LLC, with what the price includes. Two ways are priced: the LLC's county changed to a lower-cost county, where the designated newspapers cost far less (the change is filed for the customer and included), or publishing directly in the LLC's own county. Optionally compares a second county. Accepts borough names (Manhattan, Brooklyn, Staten Island). Use for any cost question. If the user names a specific LLC, use lookup_new_york_llc instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compare_to": {
                "description": "Optional second county to compare.",
                "type": "string"
              },
              "county": {
                "description": "The New York county or NYC borough where the LLC's office is on file, e.g. Kings, Manhattan, Westchester.",
                "type": "string"
              },
              "llc_type": {
                "description": "domestic = formed in New York; foreign = formed in another state and registered in New York. Default domestic.",
                "enum": ["domestic", "foreign"],
                "type": "string"
              }
            },
            "required": ["county"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "NY LLC publication price by county"
          },
          "behavior": {
            "destructive": false,
