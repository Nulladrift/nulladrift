        },
        {
          "name": "explain_publication_requirement",
          "title": "New York LLC publication requirement",
          "description": "Explains New York's LLC publication requirement (LLC Law §206 for New York LLCs, §802 for out-of-state LLCs registered in New York): who must publish, how (two newspapers designated by the county clerk, one daily and one weekly, once a week for six weeks), the 120-day deadline and when it starts, what happens if it is missed (authority suspended, no fine, curable by publishing late), and whether it repeats (it does not). Use for 'do I have to publish', 'what happens if I don't', 'I missed the deadline' and similar. Do NOT use for prices (get_publication_price) or a specific LLC (lookup_new_york_llc).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "situation": {
                "description": "What the user is asking about. Default general.",
                "enum": ["new_llc", "foreign_llc", "pllc", "missed_deadline", "close_to_deadline", "general"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "New York LLC publication requirement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Here are the rules",
            "openai/toolInvocation/invoking": "Checking the rules",
            "openai/widgetAccessible": false
          },
          "digest": "sha256:bc3c838e7b164e366e87ecc249b3e47c4830fb0ee08e6f5fdf6f883d16c09a2e"
        },
        {
          "name": "get_filing_service",
          "title": "Other New York LLC filings",
          "description": "Prices and explains Cheap NY Publication's other New York LLC filings, all in with the state fee: the Biennial Statement (New York's every-two-years report; there is no annual report), a Certificate of Good Standing (Certificate of Status), a DBA (Certificate of Assumed Name) for an LLC, and a county change (Certificate of Change). The Biennial Statement and the Certificate of Good Standing are for business corporations too. For a Biennial Statement, pass the company's filing date to get the month it is due. Use for any of these four.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assumed_name": {
                "description": "DBA only: the name to trade under, to check it is allowed.",
                "type": "string"
              },
              "filing_date": {
                "description": "Biennial only: the LLC's or corporation's original filing date (YYYY-MM-DD), to find the due month.",
                "type": "string"
              },
              "service": {
                "enum": ["biennial_statement", "certificate_of_good_standing", "dba", "county_change"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
