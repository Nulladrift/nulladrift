        {
          "name": "jp_era_convert",
          "title": "和暦と西暦の変換（令和・平成・昭和）",
          "description": "Convert between Gregorian dates and Japanese era dates (和暦: 昭和 Showa, 平成 Heisei, 令和 Reiwa), handling the exact switch days (昭和 began 1926-12-25, 平成 began 1989-01-08, 令和 began 2019-05-01) and 元年 (first year). Use it when filling Japanese forms, contracts or documents that require 和暦, or when reading a 和暦 date. Modes: {to:\"wareki\", date:\"YYYY-MM-DD\"}; {to:\"seireki\", era, year, month, day}; {to:\"wareki\", year_only} (lists every era in that year). A 平成 date after 2019-04-30 (e.g. 平成31年5月1日) is read as that day and the correct 令和 form is returned with a note; a Showa date from 1989-01-08 on (e.g. 昭和64年1月8日, Showa 64-01-08), dates that do not exist, and dates before 1926-12-25 return an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "to が wareki の時の西暦の日（YYYY-MM-DD）",
                "maxLength": 10,
                "type": "string"
              },
              "day": {
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "era": {
                "description": "to が seireki の時の元号",
                "enum": ["showa", "heisei", "reiwa", "昭和", "平成", "令和"],
                "type": "string"
              },
              "month": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "wareki＝西暦から和暦へ、seireki＝和暦から西暦へ",
                "enum": ["wareki", "seireki"],
                "type": "string"
              },
              "year": {
                "description": "元号の年（元年は 1）",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "year_only": {
                "description": "to が wareki で、年だけ変える時の西暦の年",
                "maximum": 2100,
                "minimum": 1926,
                "type": "integer"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checked_on": {
                "description": "Cyclix Agents が出所を最後に確かめた日",
                "type": "string"
              },
              "disclaimer": {
                "type": "string"
              },
              "doc_url": {
                "description": "人が読む説明のページ（式・出所・例）。利用者に次に読んでもらう先",
                "type": "string"
              },
              "law_as_of": {
                "description": "出所が書く法令の基準日（例：2026-04-01＝令和8年4月1日現在法令等）",
                "type": "string"
              },
              "notes": {
                "description": "この答えに効いた決まり・前提（日本語）",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "result": {
                "additionalProperties": false,
                "properties": {
                  "after_era_change": {
                    "type": "boolean"
                  },
                  "day": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "era": {
                    "type": "string"
                  },
                  "era_kanji": {
                    "type": "string"
                  },
                  "era_year": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "eras": {
                    "description": "year_only の時、その年にかかる元号の全部",
                    "items": {
