          "title": "源泉徴収税額（原稿料・講演料・デザイン料など）",
          "description": "Calculate Japanese withholding income tax (源泉徴収税額, including the special reconstruction surtax / from 2027 the defense surtax) on fees paid to a RESIDENT INDIVIDUAL for manuscripts, lectures, design, illustration, photos for print, translation and similar work (所得税法 第204条第1項第1号 fees). Formula: up to ¥1,000,000 → 10.21%; above → (amount − 1,000,000) × 20.42% + 102,100; yen fractions are dropped. Use it when drafting or checking a Japanese freelance invoice or payment (請求書の源泉徴収・手取り). Handles consumption tax shown separately on the invoice. Does NOT cover lawyers, tax accountants, judicial scriveners (司法書士) and other item-2 professionals, sales agents (外交員), hostesses, prizes, corporations or non-residents — corporations and non-residents return an error. It does not judge whether a payment is such a fee.",
