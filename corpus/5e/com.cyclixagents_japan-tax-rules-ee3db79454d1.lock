                          "type": "integer"
                        },
                        "from": {
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "to": {
                          "type": "string"
                        }
                      },
                      "required": ["era", "era_kanji", "era_year", "from", "label", "to"],
