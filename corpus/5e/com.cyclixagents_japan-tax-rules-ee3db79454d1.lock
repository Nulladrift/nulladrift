        {
          "name": "jp_business_days_between",
          "title": "2つの日の間の営業日の数",
          "description": "Count Japanese business days (営業日) between two dates, skipping Saturdays, Sundays and the official Japanese holidays from the Cabinet Office CSV. Calendar \"bank\" also skips Dec 31–Jan 3 (銀行の休日, 銀行法施行令 第5条). By default the start date is not counted and the end date is counted. It is meant for deadlines, payment terms (支払期日), delivery dates and \"how many 営業日\" questions. At most 1,100 days apart; dates outside the holiday data (currently up to 2027-12-31) return an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "calendar": {
                "description": "national＝土日と国民の祝日・休日を休み（既定）。bank＝それに加えて 12/31〜1/3 も休み（銀行の休日）",
                "enum": ["national", "bank"],
                "type": "string"
              },
              "count_end": {
                "description": "終わりの日を数えるか（既定 true）",
                "type": "boolean"
              },
              "count_start": {
                "description": "始めの日を数えるか（既定 false）",
                "type": "boolean"
              },
              "end": {
                "description": "終わりの日（YYYY-MM-DD）",
                "maxLength": 10,
                "type": "string"
              },
              "start": {
                "description": "始めの日（YYYY-MM-DD）",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["end", "start"],
            "type": "object"
          },
