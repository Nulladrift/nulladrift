                "description": "出所が書く法令の基準日（例：2026-04-01＝令和8年4月1日現在法令等）",
                "type": "string"
              },
              "notes": {
                "description": "この答えに効いた決まり・前提（日本語）",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "result": {
