        {
          "name": "jp_tax_small_business_special",
          "title": "2割特例・3割特例の期間（課税期間が入るか）",
          "description": "Japanese consumption tax special rules for small businesses that became taxable because they registered for invoices: the 2割特例 (pay 20% of output tax) applies to each taxable period that contains any day from 2023-10-01 to 2026-09-30, and the new 3割特例 (pay 30% of output tax, individuals only) applies to the 2027 and 2028 calendar years. Give a date and the taxpayer type (individual = calendar year; corporation = give the business year start and end) and it says whether that taxable period is inside each window. It only checks the period; whether the other conditions are met (base-period sales of ¥10 million or less, not taxable anyway, etc.) is for the caller to decide. From the 2026 tax reform law enacted 2026-03-31 (NTA invoice Q&A 問114, 114-2).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "課税期間に含まれる日 YYYY-MM-DD（2023-10-01〜2031-12-31。法人の課税期間が 2023-10-01 より前に始まる時はその初日から）。省くと今日（日本時間）",
                "maxLength": 10,
