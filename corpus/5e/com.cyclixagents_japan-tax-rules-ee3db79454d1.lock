        {
          "name": "jp_payment_due_date",
          "title": "支払期日の計算（取適法の60日・締め日と支払日）",
          "description": "Compute payment-term dates under Japan's 中小受託取引適正化法 (取適法, in force from 2026-01-01, formerly the 下請法) Article 3, using the JFTC text: the 60th day counted with the receipt date as day 1, the deemed due dates (receipt date if no due date was set; the 60th day if it was set later), and for an agreed due date or a monthly cut-off rule (締め日・支払月・支払日) the payment date, its day number and whether it is within 60 days. For a monthly rule only (the two-month treatment applies to monthly cut-off rules, not to an agreed due date) it also gives the last day of the JFTC's two-month treatment (受領後２か月以内) and whether the payment is within it, and whether the payment date is a bank holiday and the postponement fits the JFTC's conditions. Special cut-off rules for continuously provided services are not covered. It does not decide whether the act applies to a transaction. Dates must be within the holiday data (currently up to 2027-12-31).",
