                "type": "boolean"
              },
              "created_on": {
                "description": "書類を作った日（YYYY-MM-DD）。無ければ今日（日本の日付）",
                "maxLength": 10,
                "type": "string"
              },
              "document_type": {
                "description": "呼ぶ側（利用者）が選ぶ書類の種類。receipt＝売上代金の領収書（第17号の1）、real_estate_transfer_contract＝不動産の譲渡の契約書（第1号の1）、construction_contract＝建設工事の請負（第2号。建設工事の契約に基づく書類なら、設計など建設工事以外の事を一緒に書いていても全体がこれ）、other_work_contract＝建設工事以外の請負（第2号）",
                "enum": ["receipt", "real_estate_transfer_contract", "construction_contract", "other_work_contract"],
                "type": "string"
              }
            },
            "required": ["document_type"],
            "type": "object"
          },
