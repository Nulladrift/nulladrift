          "description": "Japanese invoice system (インボイス) transitional measure (経過措置): how much of the deemed input consumption tax on a purchase from a tax-exempt business or a consumer (免税事業者等からの課税仕入れ) may still be credited on a given purchase date — 80% until 2026-09-30, 70% from 2026-10-01 to 2028-09-30, 50% to 2030-09-30, 30% to 2031-09-30, then 0% (2割控除・7割控除 いつから). The percentage follows the date of the purchase (services: the day the whole service is completed; goods: the day of delivery). With an optional tax-included amount it also computes the deemed creditable amount: amount × 7.8/110 (reduced rate: 6.24/108) × percent, rounded once (NTA invoice Q&A 問130). Amended by the 2026 tax reform law enacted 2026-03-31. Dates from 2023-10-01 to 2031-12-31.",
