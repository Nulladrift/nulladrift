              },
              "amount_excluding_consumption_tax": {
                "description": "税抜の額（円）を amount の代わりに渡す時。消費税額等を区分して書いているか、税込と税抜の両方を書いている書類だけで、consumption_tax_separately_stated: true も要る。この額で表を引き、consumption_tax_amount は使わない",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "integer"
              },
              "business_related": {
                "description": "領収書だけ。営業に関しない受取書なら false（非課税）。既定 true",
