                      "type": "string"
                    },
                    "sceneId": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "source": {
                      "enum": ["auto", "stock", "generate"],
                      "type": "string"
                    },
                    "style": {
                      "additionalProperties": false,
                      "properties": {
                        "fit": {
                          "enum": ["cover", "contain"],
                          "type": "string"
                        },
                        "opacity": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "z": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "timing": {
                      "additionalProperties": false,
                      "properties": {
                        "fromPct": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "toPct": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "intent", "kind", "region", "role", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "audioLayers": {
                "description": "Optional typed music, Foley, transition, and effect layers.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "durationInFrames": {
                      "exclusiveMinimum": 0,
