        {
          "name": "inspect_endpoint",
          "title": "Inspect MCP endpoint",
          "description": "Connects to a remote MCP endpoint (Streamable HTTP, then legacy SSE), lists its tools, and classifies each tool's side effects from its MCP hints. Never calls a tool on the target. agent_readiness lists what is wrong with the tool definitions and protocol compliance of the target, each with a fix, and a grade A-F. A target problem is status=failed with a stable failure code (e.g. TARGET_UNAVAILABLE, TARGET_AUTH_FAILED, MCP_PROTOCOL_ERROR). Private and loopback addresses are rejected. Set website (not url) to inspect a web page whose JavaScript registers WebMCP tools: the page is opened in a browser; the result has transport=webmcp.",
          "inputSchema": {
            "properties": {
              "headers": {
                "additionalProperties": {
                  "type": ["string", "null"]
                },
                "default": null,
                "description": "Optional HTTP headers for the target, e.g. Authorization. Sent to the target only, never stored. Not with website.",
                "type": ["object", "null"]
              },
              "url": {
                "default": null,
                "description": "Absolute http or https URL of the MCP endpoint, e.g. https://mcp.deepwiki.com/mcp. Set url or website.",
                "type": ["string", "null"]
              },
              "website": {
                "default": null,
                "description": "Absolute http or https URL of a web page with WebMCP tools, e.g. a Shopify storefront. Set url or website.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_readiness": {
                "default": null,
