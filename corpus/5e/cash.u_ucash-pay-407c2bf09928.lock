{
  "lockfileVersion": 2,
  "subjects": {
    "cash.u/ucash-pay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.u.cash/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ucash-pay",
        "version": "0.10.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Keyless buyer tools for the u.cash 402 payment network: uxc_view_door shows what to pay for any resource (https://agents.u.cash/r/{res_id}), pay on-chain from your own wallet, then uxc_verify_payment with the challengeId + tx hash to settle. Catalogs + UCP checkout sessions included; list tools accept an optional fields projection; uxc_discover_servers/uxc_discover_tools search the whole u.cash MCP fleet. Docs: https://agents.u.cash/mcp",
      "tools": [
        {
          "name": "uxc_cancel_checkout",
          "description": "Cancel a UCP checkout session. No key; pass cloud for a hosted merchant.",
          "inputSchema": {
            "properties": {
              "cloud": {
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c60933df33610f33c0bdee44c85e8f176ab4ce35d54164faec8262117a03198e"
        },
        {
          "name": "uxc_complete_checkout",
          "description": "Mint payment challenges for a checkout session -> ready_for_complete. Optional ap2 (AP2 checkout mandate). No key; pass cloud for a hosted merchant.",
          "inputSchema": {
            "properties": {
              "ap2": {
                "description": "optional AP2 checkout mandate",
                "type": "string"
              },
              "cloud": {
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5979bb201cf8fa852498d4025dccde70391703bf4ff68454c21d57cce316f5d6"
        },
        {
          "name": "uxc_create_checkout",
          "description": "Create a UCP checkout session (multi-item, mixed-currency cart) for a merchant catalog. No key. Returns {id, status, currency, line_items, totals, ap2}.",
          "inputSchema": {
            "properties": {
              "buyer": {
                "type": "string"
              },
              "cloud": {
                "description": "merchant token when buying from a hosted merchant",
                "type": "string"
              },
              "context": {
                "type": "string"
              },
              "currency": {
                "description": "optional cart display currency",
                "type": "string"
              },
              "line_items": {
                "description": "each: {item:{id}, quantity}",
                "type": "array"
              }
            },
            "required": ["line_items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5456a8aba22af398b15751090e51befe01700ec9f8bdae53960ec9aba0d5bd47"
        },
        {
          "name": "uxc_discover_servers",
          "description": "List every u.cash MCP server in the fleet (buyer, seller, prime, legacy): product surface, auth model, transports with install coordinates, docs URL. Optional q filters by name/product/summary. Discovery only - connect to each server directly with your own credentials; no call is ever proxied.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "case-insensitive substring over name/product/summary",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bff697e72f58b50096f996c8667b57aad751db404aca511e5d2fbe4b6b0cfcb2"
        },
        {
          "name": "uxc_discover_tools",
          "description": "Search tools across every u.cash MCP server by name or description (case-insensitive substring), optionally scoped to one server. Returns the tool, a one-liner, its server, and how to connect. Discovery only - connect to that server directly; no call is ever proxied.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "substring matched over tool name + description",
                "type": "string"
              },
              "server": {
                "description": "optional: restrict to one fleet server name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b4b0ba0de4eb2a6d9c9f5efe9be9559260ba685a112434ebfc4edbd3ba568114"
        },
        {
          "name": "uxc_get_checkout",
          "description": "Fetch a UCP checkout session by id (status: incomplete -> ready_for_complete -> completed). No key; pass cloud for a hosted merchant.",
          "inputSchema": {
            "properties": {
              "cloud": {
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7956934d918183c819d7add1a061afafb23730aafe7c78546b4485f77767f250"
        },
        {
          "name": "uxc_get_market",
          "description": "The PUBLIC cross-merchant market catalog: every published checkout across merchants (id, title, price, currency, merchant, domain, payable url). No key. q filters by title/merchant/description.",
          "inputSchema": {
            "properties": {
              "fields": {
                "description": "Optional response projection: dot paths to keep, e.g. [\"items.title\",\"items.price\"] or row-level [\"title\",\"price\"]. Envelope/meta keys (ok, success, total, count, pagination) are always kept; unknown paths are ignored; empty/absent = full response.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "type": "integer"
              },
              "q": {
                "description": "filter by title/merchant/description",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b2f20a8b9d71b2390362915d1beda19d62893481d07a3a0e959c05538321ccfd"
        },
        {
          "name": "uxc_get_order",
          "description": "View a UCP checkout session as an order (per-item fulfillment status + fulfillment events). No key; pass cloud for a hosted merchant.",
          "inputSchema": {
            "properties": {
              "cloud": {
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0421523f410d980e9e18ee79bbea8fc965a689917a0f9db1caa10d456cdac306"
        },
        {
          "name": "uxc_get_product",
          "description": "Fetch a single catalog product by id. Public (no key); pair with uxc_search_catalog to find ids.",
          "inputSchema": {
            "properties": {
              "cloud": {
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8301cfe90370dd5aa90000257a3d4f87bd5fff1686067d0f9315941eb5360735"
        },
        {
          "name": "uxc_get_services",
          "description": "The PUBLIC cross-provider services catalog (eSend rail: each row carries the provider contact email, a sendable asset code and a price). No key.",
          "inputSchema": {
            "properties": {
              "fields": {
                "description": "Optional response projection: dot paths to keep, e.g. [\"items.asset\",\"items.price\"] or row-level [\"asset\",\"price\"]. Envelope/meta keys (ok, success, total, count, pagination) are always kept; unknown paths are ignored; empty/absent = full response.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4db50f2dc68d433b44782d14552475fa8355ed4feed6317dc3327f9dc1df925b"
        },
        {
          "name": "uxc_lookup_products",
          "description": "Batch catalog lookup by ids. Public (no key).",
          "inputSchema": {
            "properties": {
              "cloud": {
                "type": "string"
              },
              "fields": {
                "description": "Optional response projection: dot paths to keep, e.g. row-level [\"id\",\"title\",\"price\"]. Envelope/meta keys (ok, success, total, count, pagination) are always kept; unknown paths are ignored; empty/absent = full response.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "ids": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57a3334749bfb9c286f475d06a6a772abca853aed12f636991e4c1f65ac8ed04"
        },
        {
          "name": "uxc_search_catalog",
          "description": "Search a merchant catalog (text query + price filters + pagination). The merchant is resolved from a cloud token (the \"cloud\" argument) or the platform default. No key.",
          "inputSchema": {
            "properties": {
              "cloud": {
                "type": "string"
              },
              "filters": {
                "type": "string"
              },
              "pagination": {
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7efba291f9199e57b47fe01b9ffc02c4cb2d69861fe2f366507dc9fa1193d31a"
        },
        {
          "name": "uxc_verify_payment",
          "description": "BUYER-SIDE. After paying a resource (from uxc_view_door) on-chain from your own wallet, submit the transaction hash to settle it. Pass the challengeId from the accepts[] entry you paid and the on-chain transaction hash. Returns settled (confirmed) or pending (awaiting confirmations). No seller key needed - the challengeId identifies the resource, and settlement is gated by on-chain confirmation.",
          "inputSchema": {
            "properties": {
              "challengeId": {
                "type": "string"
              },
              "hash": {
                "type": "string"
              }
            },
            "required": ["challengeId", "hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7998984880f4e14820d5e75cfcce74924f1656a8e91ac5aad11396592b334f8b"
        },
        {
          "name": "uxc_view_door",
          "description": "Fetch the public 402 payment door for a resource (what a buyer sees at https://agents.u.cash/r/{res_id}): the price + the multi-coin accepts[] (each asset, the seller receive address, and the exact amount to pay). No key. Use as a BUYER to see what to pay, then uxc_verify_payment after paying. status=true polls settlement without minting a new challenge.",
          "inputSchema": {
            "properties": {
              "res_id": {
                "type": "string"
              },
              "status": {
                "description": "poll mode: GET /r/{id}?status=1 - no-mint settlement check",
                "type": "boolean"
              }
            },
            "required": ["res_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:753c4d8f32a14367761ac730679538774b3bfc879a1bedf1315caae4a2a6ae6c"
        }
      ],
      "digest": "sha256:c2bb532c00fd6f77b067d39d8f72ad795a8663f2cdb24f729f15d190e24b9fb2"
    }
  }
}
