{
  "lockfileVersion": 2,
  "subjects": {
    "com.israelflower/flowers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://israelflower.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "israelflower",
        "title": "Israel Flower: flower delivery in Israel",
        "version": "1.0.0",
        "websiteUrl": "https://israelflower.com",
        "icons": [
          {
            "src": "https://israelflower.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Israel Flower (https://israelflower.com) delivers flowers in Israel for people abroad: bouquets made by hand by a florist in Tel Aviv, priced and paid in US dollars. Typical flow: search_bouquets, delivery_options, quote, then create_order, which returns a payment link for the person to open and pay. Times and dates are Israel time. There are no deliveries on Shabbat (Friday sundown to Saturday nightfall) or Jewish festival days; orders can still be placed then. Ask the person for anything you do not know rather than guessing, especially the recipient's phone and address.",
      "tools": [
        {
          "name": "create_order",
          "title": "Place an order",
          "description": "Place an order and get its payment link. The order is held but not taken until the person pays at that link (card, in US dollars, on AllPay's secure page); give them the link and the total. Never pay on their behalf unless they asked you to and gave you the means. Confirm the recipient, address, phone, date and card message with the person first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Street, number, apartment, floor, entrance code.",
                "maxLength": 300,
                "minLength": 5,
                "type": "string"
              },
              "buyer_email": {
                "description": "Where the receipt and any questions go.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "buyer_name": {
                "description": "The person paying.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "buyer_phone": {
                "type": "string"
              },
              "card_message": {
                "description": "Printed on the card with the flowers.",
                "maxLength": 250,
                "type": "string"
              },
              "city": {
                "enum": ["Tel Aviv", "Ramat Gan", "Kiryat Ono", "Petah Tikva", "Holon", "Bat Yam", "Azur", "Rishon LeZion", "Rehovot", "Lod", "Ramat HaSharon", "Herzliya", "Ra'anana", "Kfar Saba", "Netanya", "Haifa"],
                "type": "string"
              },
              "coupon": {
                "maxLength": 40,
                "type": "string"
              },
              "delivery_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "delivery_notes": {
                "description": "Notes for the team: the florist and the courier.",
                "maxLength": 250,
                "type": "string"
              },
              "recipient_name": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "recipient_phone": {
                "description": "Israeli or international number, digits only.",
                "type": "string"
              },
              "slug": {
                "minLength": 1,
                "type": "string"
              },
              "surprise": {
                "description": "True: do not contact the recipient before delivery.",
                "type": "boolean"
              }
            },
            "required": ["address", "buyer_email", "buyer_name", "city", "delivery_date", "recipient_name", "recipient_phone", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Place an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:78be09d19cae74468c5668442fd30bc07a347364b89fc233556bee7226f0c017"
        },
        {
          "name": "delivery_options",
          "title": "Check delivery cities and days",
          "description": "Where and when we deliver: the cities, the delivery price, the next delivery dates with any day surcharge, and the rules (no Shabbat or Jewish festival days, 11:00-19:00 Israel time). Pass a date to check that day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "enum": ["Tel Aviv", "Ramat Gan", "Kiryat Ono", "Petah Tikva", "Holon", "Bat Yam", "Azur", "Rishon LeZion", "Rehovot", "Lod", "Ramat HaSharon", "Herzliya", "Ra'anana", "Kfar Saba", "Netanya", "Haifa"],
                "type": "string"
              },
              "date": {
                "description": "A date to check, in Israel.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check delivery cities and days"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:384075d28464b56b6a0553ffd925fa678f68ddec0c704cb0c3692ff7714a64d7"
        },
        {
          "name": "get_bouquet",
          "title": "Get bouquet details",
          "description": "Everything about one bouquet: description, flowers, colours, occasions, price, all photos.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "From search_bouquets.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get bouquet details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6576b07ac31084d2e07a36e7db03866c89ea6034593b19244cb8bacbbf69e45e"
        },
        {
          "name": "order_status",
          "title": "Check order status",
          "description": "The status of an order (awaiting payment, paid, delivered, cancelled), by order number and the buyer's email.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buyer_email": {
                "description": "The email the order was placed with.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "order_number": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["buyer_email", "order_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf3ec75cc0918d115c80925d08946364da79d3df5fc7e79064b84341b659709c"
        },
        {
          "name": "quote",
          "title": "Quote an order",
          "description": "The exact total for a bouquet delivered to a city on a date, with any coupon, before placing the order.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "enum": ["Tel Aviv", "Ramat Gan", "Kiryat Ono", "Petah Tikva", "Holon", "Bat Yam", "Azur", "Rishon LeZion", "Rehovot", "Lod", "Ramat HaSharon", "Herzliya", "Ra'anana", "Kfar Saba", "Netanya", "Haifa"],
                "type": "string"
              },
              "coupon": {
                "maxLength": 40,
                "type": "string"
              },
              "delivery_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "slug": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["city", "delivery_date", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:afb4f89ddff8dbcf730d4d6ee5663e1094e949a71bc504897c16f262571c7088"
        },
        {
          "name": "search_bouquets",
          "title": "Search bouquets",
          "description": "List the bouquets for sale, with price in US dollars, photo and page link. Filter by occasion, colour, budget or words. Every bouquet is made by hand by a florist in Tel Aviv.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "color": {
                "enum": ["white", "cream", "pink", "red", "burgundy", "purple", "yellow", "orange", "blue", "green"],
                "type": "string"
              },
              "max_price_usd": {
                "description": "Bouquet price, before delivery.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "occasion": {
                "description": "For example birthday, shabbat, anniversary.",
                "enum": ["birthday", "love", "anniversary", "thank-you", "congratulations", "new-baby", "get-well", "just-because", "shabbat", "hanukkah", "rosh-hashanah", "passover", "mothers-day", "new-year", "womens-day", "purim", "independence-day", "shavuot", "fathers-day", "sukkot", "bar-mitzvah", "funeral", "shiva", "valentines-day"],
                "type": "string"
              },
              "text": {
                "description": "Words to look for in the name, description or flowers.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search bouquets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9194100c4389a45bb4ea28085cecffeb98fb68665341d3a683ba6997a37f315"
        }
      ],
      "digest": "sha256:315ccd3d6d585f40d7f8a12c43fe3a794800c52d1b0e3bae577861dca2c096d0"
    }
  }
}
