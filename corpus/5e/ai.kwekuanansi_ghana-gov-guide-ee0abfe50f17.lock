{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/ghana-gov-guide": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/ghana-gov-guide"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-ghana-gov-guide",
        "title": "Ghana Gov Guide",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ghana Gov Guide gives the steps, documents, fees and the agencies' own web addresses for public services in Ghana, each from the agency's own pages with the date. Use ghana_gov.how_to for a service and ghana_gov.check_website for a web address someone was given. Give the source and date, say what the pages did not give, and never say a site is safe.",
      "tools": [
        {
          "name": "ghana_gov.check_website",
          "title": "Check a web address against Ghana agencies' own",
          "description": "Use this when someone has a web address for a Ghana government service (a link in a message, a site that asks for payment, a \"portal\" for the Ghana Card, a licence, a passport, NHIS or a TIN) and asks whether it belongs to the agency. It says whether the address is one an agency on its list gives on its own pages, is under that agency's own domain, or is neither, and points out an address built to look like an agency's without being under it. It never says a site is safe. Do not use it for addresses outside Ghana's public services, or to open or test a site: it reads nothing from the address given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The web address as given, for example \"https://nia.gov.gh/faqs/\", \"dvla.gov.gh\" or \"nia-ghanacard-portal.com\".",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agency": {
                "type": "string"
              },
              "caution": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "host": {
                "type": "string"
              },
              "looks_like": {
                "type": "string"
              },
              "other_alphabet": {
                "type": "boolean"
              },
              "read_on": {
                "type": "string"
              },
              "text_before_at": {
                "type": "boolean"
              },
              "under": {
                "type": "string"
              },
              "uses_name": {
                "type": "string"
              },
              "verdict": {
                "enum": ["published", "agency_domain", "not_listed"],
                "type": "string"
              }
            },
            "required": ["caution", "host", "read_on", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2332411f70a69a1c468d39c8161732df3d866735cd64810b0a20c6b473e2a151"
        },
        {
          "name": "ghana_gov.how_to",
          "title": "How to get a public service in Ghana",
          "description": "Use this when someone asks how to get, renew or replace a public document or registration in Ghana, what it costs, which documents to bring, or where to apply online (for example \"how do I get a Ghana Card\", \"how much is a passport\", \"how do I renew my driver's licence\" or \"how do I register for NHIS\"). It returns the steps, documents, fees and the agency's own web addresses as read on that agency's own pages, with each page and the date, and says what those pages did not give. Give those rather than steps or fees from memory. It covers the Ghana Card, passports, driver's licences and vehicles (DVLA), NHIS, the TIN, business and company registration, SSNIT, voter registration and police clearance; ghana_gov.list_services names them all. It does not cover birth certificate (registering a birth) or death certificate (registering a death): the agency's own site could not be read, so say that rather than giving steps or a fee from elsewhere. Do not use it for services outside Ghana, for services run by private companies, or to apply, book or pay: it does none of those.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service": {
                "description": "Which service: ghana-card, ghana-card-replacement, ghana-card-update, non-citizen-card, passport, learners-licence, drivers-licence, licence-renewal, licence-lost, licence-replacement, international-driving-permit, foreign-licence-conversion, vehicle-registration, roadworthy, change-of-ownership, nhis, tin, business-name, company-registration, ssnit, voter-registration, police-clearance.",
                "enum": ["ghana-card", "ghana-card-replacement", "ghana-card-update", "non-citizen-card", "passport", "learners-licence", "drivers-licence", "licence-renewal", "licence-lost", "licence-replacement", "international-driving-permit", "foreign-licence-conversion", "vehicle-registration", "roadworthy", "change-of-ownership", "nhis", "tin", "business-name", "company-registration", "ssnit", "voter-registration", "police-clearance"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "caution": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "guide": {
                "type": "object"
              },
              "read_on": {
                "type": "string"
              }
            },
            "required": ["caution", "guide", "read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc2f113551a0e7e699fc2ffe973637e9a3e488935b4b1599ad919ecfe8d7bada"
        },
        {
          "name": "ghana_gov.list_services",
          "title": "Ghana public services this guide covers",
          "description": "Use this when someone asks which Ghana public services this tool can explain, or which agencies' web addresses it knows. It also names the services it looked for and could not read on the agency's own pages, with the reason. Do not use it for one named service: use ghana_gov.how_to.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agencies": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "explore_url": {
                "type": "string"
              },
              "not_covered": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              },
              "services": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["agencies", "not_covered", "read_on", "services"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c9c34b14bd2d9e752a4ba450610b0a4bad596d0805ee9e2d048bb99ca27c7fe"
        }
      ],
      "digest": "sha256:af09f26687ec0559c1727eb22e704f95211a1ead04acb60bae71a1fd64feb533"
    }
  }
}
