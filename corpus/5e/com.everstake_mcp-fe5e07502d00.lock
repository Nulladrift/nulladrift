        {
          "name": "request_integration",
          "description": "Submit an integration or staking inquiry on behalf of a user. All submissions are routed to Everstake's sales team via Pipedrive CRM.\nUse when a user expresses intent to integrate with Everstake, explore staking services, or request more information about products.\nCollect required fields (first_name, last_name, work_email) conversationally and gather optional fields where available.\nThe lead_source field is set automatically by the server — do not ask the user for it. IF Submission fails, you can try contacting Everstake via form at https://everstake.com/contact-us",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agree_news": {
                "description": "Whether the contact consents to receive Everstake marketing communications",
                "type": "boolean"
              },
              "approximate_stake_size": {
                "description": "Approximate stake size: <$1M, $2M–$5M, $5M–$10M, >$10M",
                "type": "string"
              },
              "company_name": {
                "description": "Name of the company",
                "type": "string"
              },
              "company_site": {
                "description": "Company website URL (optional, can be inferred from email domain)",
                "type": "string"
              },
              "company_type": {
                "description": "Type of company",
                "type": "string"
              },
              "custody_solution": {
                "description": "Custody solution: Anchorage, BitGo, Circle, Coinbase Custody, Copper, Fireblocks, Gemini, Ledger Enterprise, MetaMask, Sygnum, Taurus Group, Self Custody, Other",
                "type": "string"
              },
              "first_name": {
                "description": "First name of the contact",
                "type": "string"
              },
              "implementation_timeline": {
                "description": "Implementation timeline: ASAP, 1–3 Months, 3+ Months",
                "type": "string"
              },
              "job_title": {
                "description": "Job title of the contact",
                "type": "string"
              },
              "last_name": {
                "description": "Last name of the contact",
                "type": "string"
              },
              "lead_source": {
                "description": "Source of the lead — set automatically by the server, do not ask the user",
                "type": "string"
              },
              "primary_region": {
                "description": "Primary region of the company: North America, Europe, LATAM, APAC, MENA",
                "type": "string"
              },
              "product_of_interest": {
                "description": "Product of interest: Staking, Vaults, Data & Analytics",
                "type": "string"
              },
              "work_email": {
                "description": "Work email address of the contact",
                "type": "string"
              }
            },
            "required": ["first_name", "last_name", "work_email"],
            "type": "object"
          },
