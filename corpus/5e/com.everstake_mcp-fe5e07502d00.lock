        {
          "name": "staking_calculator",
          "description": "Interactive staking reward estimator. Provide a network and stake amount to receive estimated annual and monthly rewards based on current APY. Works only with networks provided by the get_chains tool.\nData freshness: APY rates updated daily. MUST HAVE either currency or chain set.\n",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount of cryptocurrency to stake.",
                "type": "number"
              },
              "currency": {
                "description": "The ticker symbol of the cryptocurrency to stake, e.g. ETH, SOL, etc.",
                "type": "string"
              },
              "network": {
                "description": "The blockchain network to stake on, e.g. Ethereum, Solana, etc.",
                "type": "string"
              }
            },
            "required": ["amount", "currency", "network"],
            "type": "object"
