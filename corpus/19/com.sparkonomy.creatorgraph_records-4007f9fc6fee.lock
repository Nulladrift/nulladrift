{
  "lockfileVersion": 2,
  "subjects": {
    "com.sparkonomy.creatorgraph/records": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://creatorgraph.sparkonomy.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.sparkonomy.creatorgraph/records",
        "title": "Open Creator Graph",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use these tools to identify and profile a digital Creator: their accounts, audience size on each platform, what they make, where they are based, who represents them, and what they allow AI to do with their identity. Search first, then read the record by its SPRK ID. Every value carries a confidence label (Verified, Sourced or Stated): keep it, and link the record URL when you repeat anything. A record with no AI declaration has set no terms, which is not permission. Removed records are gone: drop what you hold.",
      "tools": [
        {
          "name": "get_ai_consent",
          "title": "Read a Creator's AI consent",
          "description": "What a Creator allows AI to do with their name, image, likeness, voice, movement and signature, in words, with links to the machine-readable HCS 1.0 declaration. A record with no declaration has set no terms: treat that as unknown, never as permission.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sprk_id": {
                "description": "The record's SPRK ID, e.g. SPRK-00000001. The number alone is accepted.",
                "pattern": "^([Ss][Pp][Rr][Kk]-)?[0-9]{1,8}$",
                "type": "string"
              }
            },
            "required": ["sprk_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Creator's AI consent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74859f4172ca4b6cf728bfa5a6d0f74dd602d9a8d29d7669e1ea7fbdaf20ac2e"
        },
        {
          "name": "get_creator_record",
          "title": "Read a Creator record",
          "description": "Read one Creator's full public record as Markdown: their accounts on each platform with follower or subscriber counts (as ranges) and the date seen, content topics, location, languages, how long they have been active, and, where published, occupation, representation, website, credentials and notable work. Also their AI-use terms, claim state, sources and provenance. Every value carries a confidence label (Verified, Sourced, Stated): keep it with any value you repeat, and cite the record URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sprk_id": {
                "description": "The record's SPRK ID, e.g. SPRK-00000001. The number alone is accepted.",
                "pattern": "^([Ss][Pp][Rr][Kk]-)?[0-9]{1,8}$",
                "type": "string"
              }
            },
            "required": ["sprk_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Creator record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46ed6e0a69e018bad0ad31848f3d6eb0c8a83305f3b16077db170f524591dcf2"
        },
        {
          "name": "search_creators",
          "title": "Search Creator records",
          "description": "Find Creator records on the Open Creator Graph by name, handle, SPRK ID or profile URL. Returns each match's SPRK ID, name, handle, platforms, claim state and record URL. Use it before get_creator_record when you only know a name or handle.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name, handle or URL",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Creator records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15261d4737de756968a56bb46d66f2bbbe6019f1a1633b192989a8a5b850e53b"
        }
      ],
      "digest": "sha256:70c4b6e749850a2d9f955cf9b7b99eb369dc5ae6d998f622aab3c2722055212f"
    }
  }
}
