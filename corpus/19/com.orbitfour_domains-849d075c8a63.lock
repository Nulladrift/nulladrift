        {
          "name": "search_domains",
          "title": "Search for available domain names",
          "description": "Find domain names from a free-text idea, brand or phrase; a phrase yields short combinations of its words. top_picks answers \"how does my name look\": the name as typed (when its extension isn't .com/.net/.org) and the name on .com, .net and .org, or on each extension in tlds, with its real status, taken and unknown included, as check_domain reports it. suggestions are up to `limit` ranked names a live check found available, never repeating a top pick, with per-year prices in USD, premium names included unless include_premium is false; match is exact_sld or variation, and hack is true for a domain hack such as danger.zone. unchecked_names lists names whose check came back unknown, left_out counts why other names checked aren't suggested, and with tlds, each extension says why it found nothing. Search is advisory: confirm the chosen name with check_domain before quoting it, and a purchase checks again. Read-only, no side effects.",
          "inputSchema": {
            "properties": {
              "include_premium": {
                "description": "false leaves premium names out of the suggestions (default true).",
                "type": "boolean"
              },
              "limit": {
                "description": "Target number of suggestions (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Leave out suggestions whose first_term.total, the first term's price with the ICANN fee (what buying it costs), is above this USD amount, e.g. \"25.00\".",
                "type": "string"
              },
              "query": {
                "description": "Free-text seed, e.g. \"learning studio app\", a bare SLD, or a full domain.",
                "type": "string"
              },
              "tlds": {
                "description": "Optional TLDs to restrict the search to, e.g. [\"com\", \"app\", \"io\"]. The name on each becomes a top pick.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "years": {
                "description": "Registration term in years (default 1).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "left_out": {
                "description": "How many checked candidates aren't suggestions, by reason, so a short list explains itself: over_limit (past limit), over_max_price, premium (include_premium is false), premium_over_cap (above the purchase cap), price_unconfirmed (the registry's price didn't arrive), unchecked (no answer) and unavailable (taken or reserved).",
                "properties": {
                  "over_limit": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "over_max_price": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "premium": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "premium_over_cap": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "price_unconfirmed": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "unavailable": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "unchecked": {
                    "minimum": 0,
