      },
      "serverInfo": {
        "name": "orbitfour-domain-check",
        "title": "OrbitFour",
        "version": "1.6.0",
        "description": "Domain availability and live registry pricing from OrbitFour, an ICANN-accredited registrar.",
        "websiteUrl": "https://www.orbitfour.com/developers/mcp",
        "icons": [
          {
            "src": "https://www.orbitfour.com/android-chrome-256x256.png",
            "mimeType": "image/png",
            "sizes": ["256x256"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "OrbitFour is an ICANN-accredited domain registrar. Every answer here comes from a live registry check (EPP domain:check plus the registry's fee check) made at call time. Use check_domain for names you already have, search_domains to find names from an idea, get_tld_requirements for an extension's terms and what registering it requires, and check_transfer for whether a name held elsewhere can move here and at what price. Search results are suggestions: check a name with check_domain before quoting it, because availability can change within minutes, and a purchase checks again. available: null means the registry could not be asked just now; it does not mean taken. first_term.total is what the shortest term costs. This server cannot register, reserve or hold a domain. Requests are rate limited per client IP; on HTTP 429, wait for Retry-After.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check domain availability and price",
          "description": "Look up exact domain names: whether each can be registered now, and its per-year registration, renewal and transfer price in USD, premium names included, from a live registry check. Use it for names you already have and to confirm a search_domains suggestion. Up to 10 names per call; read-only. available is true, false, or null (the registry could not be asked; not the same as taken). An unavailable name says why in reason: taken, reserved, unavailable or unknown. purchasable is false for an available name OrbitFour can't sell now, and for a null one, and purchase_blocker says why. first_term is the shortest term (min_years: .ai is 2) and its total with the ICANN fee. A malformed name or an extension OrbitFour doesn't sell comes back with an error field. pricing_source says where the registration price came from: \"registry\" is a live quote for that name, \"baseline\" is the extension's standard rate and final for the name (the extension has no premium names, or the registry quoted none for it), and \"unconfirmed\" means the registry lookup did not finish, so the price is not final for a name that may be premium. pricing_sources breaks this out per action.",
          "inputSchema": {
            "properties": {
              "names": {
                "description": "Domain names to check, e.g. [\"example.com\", \"example.net\"]. Max 10.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "years": {
                "description": "Registration term in years (default 1).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "domains": {
                "items": {
                  "oneOf": [
                    {
                      "description": "One name's availability and per-year price, shared by GET /domains/check and GET /domains/search. `rank`, `hack` and `match` appear on search suggestions only; `reason` only when the name isn't available.",
                      "properties": {
                        "available": {
                          "description": "null when the registry could not be asked (degraded availability).",
                          "type": ["boolean", "null"]
                        },
                        "currency": {
                          "type": "string"
                        },
                        "first_term": {
                          "description": "Available names: the shortest term the request allows (years or min_years) and its total, the ICANN fee included. A purchase's max_price taken from it always covers it.",
                          "properties": {
                            "total": {
                              "description": "An amount as a decimal string, never a float, with its ISO 4217 currency. Ledger amounts are signed.",
                              "properties": {
                                "amount": {
                                  "type": "string"
                                },
                                "currency": {
                                  "type": "string"
                                }
                              },
                              "required": ["amount", "currency"],
                              "type": "object"
                            },
                            "years": {
                              "type": "integer"
                            }
                          },
                          "required": ["total", "years"],
                          "type": ["object", "null"]
                        },
                        "hack": {
                          "description": "True when the name is a domain hack, e.g. danger.zone (search only).",
                          "type": "boolean"
                        },
                        "icann_fee": {
                          "description": "Same shape as Money, or null when there is no amount.",
                          "properties": {
                            "amount": {
                              "type": "string"
                            },
                            "currency": {
                              "type": "string"
                            }
                          },
                          "required": ["amount", "currency"],
                          "type": ["object", "null"]
                        },
                        "match": {
                          "description": "exact_sld: the SLD as searched; variation: a stem or a hack (search only).",
                          "enum": ["exact_sld", "variation"],
                          "type": "string"
                        },
                        "min_years": {
                          "description": "Smallest purchase term; prices are per year.",
                          "type": "integer"
                        },
                        "name": {
                          "type": "string"
                        },
                        "premium": {
                          "type": "boolean"
                        },
                        "pricing_source": {
                          "description": "registry: priced live for this name. baseline: the extension's standard rate, and final for this name: the extension has no premium names (premium_possible is false in GET /pricing/{tld}), or the registry's live check returned no premium price for it. unconfirmed: the registry lookup didn't finish, so on an extension with premium names the price isn't final. A purchase checks the price again either way. Describes REGISTRATION only; see pricing_sources for the others.",
                          "enum": ["registry", "baseline", "unconfirmed"],
                          "type": "string"
                        },
                        "pricing_sources": {
                          "properties": {
                            "registration": {
                              "description": "registry: priced live for this name. baseline: the extension's standard rate, and final for this name: the extension has no premium names (premium_possible is false in GET /pricing/{tld}), or the registry's live check returned no premium price for it. unconfirmed: the registry lookup didn't finish, so on an extension with premium names the price isn't final. A purchase checks the price again either way.",
                              "enum": ["registry", "baseline", "unconfirmed"],
                              "type": "string"
                            },
                            "renewal": {
                              "description": "registry: priced live for this name. baseline: the extension's standard rate, and final for this name: the extension has no premium names (premium_possible is false in GET /pricing/{tld}), or the registry's live check returned no premium price for it. unconfirmed: the registry lookup didn't finish, so on an extension with premium names the price isn't final. A purchase checks the price again either way.",
                              "enum": ["registry", "baseline", "unconfirmed"],
                              "type": "string"
                            },
                            "transfer": {
                              "description": "registry: priced live for this name. baseline: the extension's standard rate, and final for this name: the extension has no premium names (premium_possible is false in GET /pricing/{tld}), or the registry's live check returned no premium price for it. unconfirmed: the registry lookup didn't finish, so on an extension with premium names the price isn't final. A purchase checks the price again either way.",
                              "enum": ["registry", "baseline", "unconfirmed"],
                              "type": "string"
                            }
                          },
                          "required": ["registration", "renewal", "transfer"],
                          "type": "object"
                        },
                        "purchasable": {
                          "description": "Available and buyable here now; a purchase still re-checks.",
                          "type": "boolean"
                        },
                        "purchase_blocker": {
                          "description": "Why a name isn't purchasable: premium_over_cap (a premium above the $10,000 cap), price_unconfirmed (the registry didn't confirm the price), availability_unknown (available is null: the registry couldn't be asked, so check again). null when purchasable, and when available is false, where reason says why.",
                          "enum": ["premium_over_cap", "price_unconfirmed", "availability_unknown", null],
                          "type": ["string", "null"]
                        },
                        "rank": {
                          "description": "1-based relevance ordinal (search only).",
                          "type": "integer"
                        },
                        "reason": {
                          "description": "Only when available is false or null. unavailable: the registry won't offer it (or said why in words we don't map); unknown: the check failed or was shed, so try again. This set won't grow.",
                          "enum": ["taken", "reserved", "unavailable", "unknown"],
                          "type": "string"
                        },
                        "registration": {
                          "description": "An amount as a decimal string, never a float, with its ISO 4217 currency. Ledger amounts are signed.",
                          "properties": {
                            "amount": {
                              "type": "string"
                            },
                            "currency": {
                              "type": "string"
                            }
                          },
                          "required": ["amount", "currency"],
                          "type": "object"
                        },
                        "renewal": {
                          "description": "Same shape as Money, or null when there is no amount.",
                          "properties": {
                            "amount": {
                              "type": "string"
                            },
                            "currency": {
                              "type": "string"
                            }
                          },
                          "required": ["amount", "currency"],
                          "type": ["object", "null"]
                        },
                        "transfer": {
                          "description": "Same shape as Money, or null when there is no amount.",
                          "properties": {
                            "amount": {
                              "type": "string"
                            },
                            "currency": {
                              "type": "string"
                            }
                          },
                          "required": ["amount", "currency"],
                          "type": ["object", "null"]
                        }
                      },
                      "required": ["available", "currency", "first_term", "icann_fee", "min_years", "name", "premium", "pricing_source", "pricing_sources", "purchasable", "purchase_blocker", "registration", "renewal", "transfer"],
                      "type": "object"
                    },
                    {
                      "description": "A GET /domains/check entry for a name that could not be evaluated: malformed, or an unsupported TLD.",
                      "properties": {
                        "error": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["error", "name"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3d6d5b303c7ccfbc87952bff0e76e9ae6d347054bfc2524cf1e239a856d8b968"
