        {
          "name": "check_transfer",
          "title": "Check whether domains can be transferred in",
          "description": "Ask each name's registry whether it can be transferred to OrbitFour now (not locked, no transfer or delete pending) and quote the full first-term transfer price in USD: the per-year price plus the ICANN fee for the registry's transfer term. Up to 5 names per call; read-only. transferable is true, false, or null (the registry could not be asked just now; not the same as locked), and reasons says why: invalid_name, unsupported_tld, already_here, not_registered (nobody holds it, so register it instead), locked, pending_transfer, pending_delete, premium_over_cap, price_unconfirmed, unknown. The price is what the transfer would cost if it goes ahead. Never send a transfer authorization code here: the transfer itself asks for it.",
          "inputSchema": {
            "properties": {
              "names": {
                "description": "Domain names, e.g. [\"example.com\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "items": {
                  "description": "Whether a name can be transferred to OrbitFour now, and the full first-term price. Prices are null when no price can be quoted.",
                  "properties": {
                    "domain_name": {
                      "type": "string"
                    },
                    "icann_fee": {
                      "description": "Same shape as Money, or null when there is no amount.",
                      "properties": {
                        "amount": {
                          "type": "string"
                        },
                        "currency": {
                          "type": "string"
                        }
                      },
                      "required": ["amount", "currency"],
                      "type": ["object", "null"]
                    },
                    "is_premium": {
                      "type": ["boolean", "null"]
                    },
                    "reasons": {
                      "items": {
                        "enum": ["invalid_name", "unsupported_tld", "already_here", "not_registered", "locked", "pending_transfer", "pending_delete", "premium_over_cap", "price_unconfirmed", "unknown"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "total": {
                      "description": "Same shape as Money, or null when there is no amount.",
                      "properties": {
                        "amount": {
                          "type": "string"
                        },
                        "currency": {
                          "type": "string"
                        }
                      },
                      "required": ["amount", "currency"],
                      "type": ["object", "null"]
                    },
                    "transfer_price": {
                      "description": "Same shape as Money, or null when there is no amount.",
                      "properties": {
                        "amount": {
                          "type": "string"
                        },
                        "currency": {
                          "type": "string"
                        }
                      },
                      "required": ["amount", "currency"],
                      "type": ["object", "null"]
                    },
                    "transfer_years": {
                      "description": "The registry's transfer term (PIR's .org is fixed at 1).",
                      "type": ["integer", "null"]
                    },
                    "transferable": {
                      "description": "true or false from the registry; null when it couldn't be asked just now (never read as locked).",
                      "type": ["boolean", "null"]
                    }
                  },
                  "required": ["domain_name", "reasons", "transferable"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2f556b9afc7911fcffb8ed5a805d9871deec3f1b0f544c6a6eb138f6c744feef"
        },
        {
          "name": "get_tld_requirements",
          "title": "Get an extension's prices and registration rules",
          "description": "Look up what OrbitFour charges and requires for domain extensions (TLDs): standard per-year registration, renewal, transfer and restore prices in USD plus the ICANN fee, the shortest and longest term, the fixed transfer term, whether WHOIS privacy is allowed, any eligibility or use restriction, whether browsers require HTTPS for its websites (https_required: .app, .dev), and JSON Schemas for what a registration must include (.us, for example, needs Nexus data on the registrant contact). Up to 10 extensions per call; read-only. These are standard prices: when premium_possible is true a particular name can cost more, so quote it with check_domain. An extension OrbitFour does not sell comes back as tld_not_found.",
          "inputSchema": {
            "properties": {
              "tlds": {
                "description": "Extensions without the dot, e.g. [\"us\", \"ai\", \"com\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tlds"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "constraints": {
                "description": "Account-wide rules that apply to every TLD.",
                "properties": {
                  "balance_currency": {
                    "type": "string"
                  },
                  "docs": {
                    "format": "uri",
                    "type": "string"
                  },
                  "grace_period_days": {
                    "type": "integer"
                  },
                  "min_deposit": {
                    "type": "string"
                  },
                  "premium_max_retail": {
                    "type": "string"
                  },
                  "redemption_period_days": {
                    "type": "integer"
                  },
                  "transfer_lock_days": {
                    "description": "Days after a registration or a completed transfer in during which ICANN's Transfer Policy forbids moving a domain to another registrar (60). One domain's countdown is transfer_lock.days_until_transferable on GET /domains/{id} (get_domain).",
                    "type": "integer"
                  }
                },
                "required": ["balance_currency", "docs", "grace_period_days", "min_deposit", "premium_max_retail", "redemption_period_days", "transfer_lock_days"],
                "type": "object"
              },
              "tlds": {
                "items": {
                  "oneOf": [
                    {
                      "description": "One TLD's catalog entry plus what a registration of it must carry: `registration_schema` for the TLD-specific part of the POST /domains body, `registrant_schema` for the fields the registrant contact needs.",
                      "properties": {
                        "categories": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "eligibility": {
                          "description": "Who may register a name on this extension, and any registry rule on how a name may be used.",
                          "properties": {
                            "policy": {
                              "description": "The registry policy the rule comes from, when it publishes one.",
                              "type": "string"
                            },
                            "restricted": {
                              "description": "true when the registry limits who may register or how a name may be used: a community or profession, a connection to a place, or a use policy (summary says which). Every requires_nexus TLD is restricted, and registrant_schema says what its registrant contact must carry. false: no special eligibility or use policy; the registry's standard terms still apply.",
                              "type": "boolean"
                            },
                            "summary": {
                              "description": "The rule in words, when restricted: who qualifies, or how a name may be used.",
                              "type": "string"
                            }
                          },
                          "required": ["restricted"],
                          "type": "object"
                        },
                        "https_required": {
                          "description": "true when browsers load websites on this extension over HTTPS only, because the whole extension is on the HSTS preload list (.app, .dev, .page and others): a site needs a valid TLS certificate before it loads, and http:// links are upgraded. Email and other non-web services are unaffected.",
                          "type": "boolean"
                        },
                        "icann_fee": {
                          "description": "Per-year ICANN fee, added on top of each price; \"0.00\" on a ccTLD, which owes none. check_domain reports the same amount.",
                          "type": "string"
                        },
                        "max_years": {
                          "type": "integer"
                        },
                        "min_years": {
                          "type": "integer"
                        },
                        "name": {
                          "type": ["string", "null"]
                        },
                        "period_years": {
                          "description": "The term each price covers: always 1, so every price is per year. A purchase costs it times its years (at least min_years).",
                          "type": "integer"
                        },
                        "premium_possible": {
                          "description": "Whether the registry can price a name above these standard prices; when true, check_domain quotes the name.",
                          "type": "boolean"
                        },
                        "registrant_schema": {
                          "description": "A JSON Schema (2020-12); {} when the TLD adds no requirement.",
                          "type": "object"
                        },
                        "registration": {
                          "description": "Per-year retail price in the catalog's currency, as a decimal string.",
                          "type": ["string", "null"]
                        },
                        "registration_schema": {
                          "description": "A JSON Schema (2020-12); {} when the TLD adds no requirement.",
                          "type": "object"
                        },
                        "renewal": {
                          "description": "Per-year retail price in the catalog's currency, as a decimal string.",
                          "type": ["string", "null"]
                        },
                        "requires_nexus": {
                          "type": "boolean"
                        },
                        "restore": {
                          "description": "Per-year retail price in the catalog's currency, as a decimal string.",
                          "type": ["string", "null"]
                        },
                        "tld": {
                          "type": "string"
                        },
                        "transfer": {
                          "description": "Per-year retail price in the catalog's currency, as a decimal string.",
                          "type": ["string", "null"]
                        },
                        "transfer_years": {
                          "description": "Years a transfer in buys and is charged for, added to the expiry date. A transfer request takes no years: it's always this.",
                          "type": "integer"
                        },
                        "transfer_years_fixed": {
                          "description": "true when the registry accepts exactly transfer_years on a transfer and no other period (PIR's .org: 1); false when transfer_years is this extension's shortest term (min_years).",
                          "type": "boolean"
                        },
                        "url": {
                          "format": "uri",
                          "type": "string"
                        },
                        "whois_privacy": {
                          "properties": {
                            "price": {
                              "type": "string"
                            },
                            "supported": {
                              "type": "boolean"
                            }
                          },
                          "required": ["supported"],
                          "type": "object"
                        }
                      },
                      "required": ["categories", "eligibility", "https_required", "icann_fee", "max_years", "min_years", "name", "period_years", "premium_possible", "registrant_schema", "registration", "registration_schema", "renewal", "requires_nexus", "restore", "tld", "transfer", "transfer_years", "transfer_years_fixed", "url", "whois_privacy"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "error": {
                          "enum": ["tld_not_found"],
                          "type": "string"
                        },
                        "tld": {
                          "type": "string"
                        }
                      },
                      "required": ["error", "tld"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              }
            },
            "required": ["constraints", "tlds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
