        {
          "name": "availability_get_slots",
          "description": "Query available time slots within a date range. Agenda-aware: without clientId, filters by the org default public agenda — each org decides which services to expose. With clientId, resolves the client titular provider and returns their full service catalog. Five modes: (1) orgSlug only — slots from the public agenda grouped by service, provider auto-assigned at booking; (2) orgSlug + clientId — resolves titular provider if set, falls back to agenda; (3) orgSlug + agendaId — slots for a specific agenda; (4) serviceId — slots for all providers assigned to that service; (5) providerId — slots for a specific provider. Modes 1–3 hide provider details. Use before booking_create.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agendaId": {
                "type": "string"
              },
              "apiKey": {
                "type": "string"
              },
              "clientId": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "dateFrom": {
                "type": "string"
              },
              "dateTo": {
                "type": "string"
              },
              "duration": {
                "maximum": 480,
                "minimum": 5,
                "type": "integer"
              },
              "orgSlug": {
                "type": "string"
              },
              "providerId": {
                "type": "string"
              },
              "serviceId": {
                "type": "string"
              },
              "timezone": {
                "type": "string"
              }
            },
            "required": ["orgSlug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:77f6093882b96a4747bbb94e3ed470c1af9f22e974c13350188984145f14c2ab"
        },
