                "type": "string"
              },
              "retroactive": {
                "type": "boolean"
              },
              "retroactiveStatus": {
                "enum": ["completed", "no_show"],
                "type": "string"
              },
              "scheduledAt": {
                "type": "string"
              },
              "serviceId": {
                "type": "string"
              }
            },
            "required": ["clientId", "orgSlug", "scheduledAt", "serviceId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
