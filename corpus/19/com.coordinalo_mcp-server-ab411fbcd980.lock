      "instructions": "Coordinalo — SaaS platform for managing organizations that offer appointment-based professional services (therapy, consulting, education, fitness, legal).\n\n## New Organization Setup (4 MCP steps + 1 human step before public discovery)\n1. admin_create_organization → returns admin API key for all subsequent calls. Orgs are born PRIVATE (not in the public registry).\n2. admin_create_service → add at least one bookable service (auto-assigns if single provider)\n3. admin_list_providers → get provider IDs (org owner is auto-provisioned as provider)\n4. admin_set_availability → set weekly schedule for each provider\n5. (HUMAN STEP, not MCP) The org owner signs in to coordinalo.com and turns on \"Publicar en Servicialo\" from the org admin panel. This is a deliberate, authenticated consent action — required for the org to appear in the Servicialo public registry and be discoverable by AI agents. Cannot be done from MCP.\n\nOptional: service_assign_provider (if multiple providers), agendas_create (public self-booking page).\nWithout steps 1-4, the org cannot receive bookings. Without step 5, the org will not appear in agents.json / public discovery, even if admin_toggle_discoverable is called (that tool only flips lifecycle flags now).\n\n## Existing Organization\nCall org_summary first — it returns services, providers, schedules, and an onboarding_status checklist showing what is configured vs missing.\n\n## Day-to-Day\n- Book (new client): availability_get_slots(orgSlug, date) → shows only services from the public agenda, provider auto-assigned → client_create → booking_create (no providerId needed)\n- Book (existing client): availability_get_slots(orgSlug, date, clientId) → resolves titular provider if set, opens full catalog → booking_create\n- Book (explicit): availability_get_slots(providerId or serviceId) → booking_create with explicit providerId\n- Session lifecycle: booking_update_status (confirm → start → complete; no_show for exceptions). \"deliver\" is NOT available via MCP (ref PDC-SEC-001): MCP auth cannot validate actor-as-Proveedor. Delivery happens outside MCP via PATCH /api/organizations/{orgSlug}/coordinalo/sessions/{sessionId}/deliver, which requires an authenticated platform user session (the assigned provider, or an org admin/owner), not an org API key.\n- Finance: finance_create_venta → finance_create_cobro → finance_register_payment\n- Monthly closing: cierre_evaluar_org → cierre_crear_cliente (each) → cierre_cerrar_org\n\n## Auth (in order of precedence)\n- Session (Authorization: Bearer token or cookies): authenticated platform users — full access to their orgs\n- X-Bootstrap-Key header: only for admin_create_organization (external integrators)\n- X-Org-Api-Key header (or apiKey param): external agent access",
      "tools": [
        {
          "name": "admin_create_service",
