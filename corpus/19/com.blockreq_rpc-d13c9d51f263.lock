            "readOnly": true
          },
          "digest": "sha256:1db516d6e1b2731634b4be221110fe40e0aa135df88daaf68b1128f539596c54"
        },
        {
          "name": "list_pool_trades",
          "title": "List a pool's recent trades",
          "description": "A pool's trades, newest first, with block number, time, transaction hash, trader, token amounts and USD value. amount0 and amount1 are raw amounts of the pool's token0 and token1 from the pool's point of view: positive means the pool received that token (the trader sold it), negative means the pool paid it out (the trader bought it). trader_bought and trader_sold name which of token0 or token1 the trader got and gave; the trades do not name the tokens, so read them from the pool (search_tokens or the pool's own answer) before saying buy or sell of a particular token. price is whole token1 per whole token0. A full page returns next_cursor; pass it as cursor for older trades.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain: ethereum, base, arbitrum",
                "enum": ["ethereum", "base", "arbitrum"],
                "type": "string"
              },
              "cursor": {
                "description": "The next_cursor of the previous page",
                "pattern": "^[0-9]{1,15}\\.[0-9]{1,12}\\.[0-9]{1,7}$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Most trades to return (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "pool": {
                "description": "Pool address (0x and 40 hex digits), or a Uniswap v4 pool id (0x and 64 hex digits)",
                "pattern": "^0x([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$",
                "type": "string"
              }
            },
            "required": ["chain", "pool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:399b0913f9db2bcc8d2f3166e7f255b3622581c4b61298a947c5a667d8120055"
        },
        {
          "name": "list_token_pools",
          "title": "List a token's pools",
          "description": "Indexed DEX pools that hold a token, deepest first, with protocol, fee, pair, liquidity, price, 24h volume and trades. The pool id feeds list_pool_trades.",
          "inputSchema": {
            "additionalProperties": false,
