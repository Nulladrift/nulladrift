{
  "lockfileVersion": 2,
  "subjects": {
    "com.blockreq/rpc": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.blockreq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "blockreq",
        "title": "BlockReq",
        "version": "1.2.0",
        "description": "Read-only BlockReq docs, network catalog, JSON-RPC calls, and on-chain DEX and wallet data: anonymous within a per-IP limit, or on the caller's own endpoint and Data API key",
        "websiteUrl": "https://blockreq.com/docs/build/ai-assistants/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "BlockReq MCP is public, free, and read-only. Use list_chains or get_chain to find a network's host and capabilities, search_docs and get_doc_page for documentation, get_method_reference for a method's parameters and example on one network, and call_rpc for read-only JSON-RPC calls. Without credentials call_rpc uses the rate-limited public trial endpoint, which does not serve deep history, debug, or trace; when this connection sends Authorization: Bearer <BlockReq API key>, or is signed in through https://mcp.blockreq.com/mcp/account, call_rpc uses the caller's own endpoint, metered to their account. For DEX and wallet data use search_tokens, get_token, get_token_prices, get_token_candles, list_token_pools, list_pool_trades, get_token_holders and get_account_portfolio; each result carries as_of (block and time), the public source request, and access. They answer anonymously within a per-IP limit shared with other callers on the same address; when this connection sends X-Data-Api-Key: <Data API key>, or is signed in through https://mcp.blockreq.com/mcp/account, they use the caller's own key and limits instead; when signed in, call the data tools one at a time (the Free plan allows 1 request per second, burst 1). Production code should call a private endpoint with an API key from https://blockreq.com/dashboard.",
      "tools": [
        {
          "name": "call_rpc",
          "title": "Call a read-only JSON-RPC method",
          "description": "Call one read-only JSON-RPC method on an EVM network. Without credentials it uses the public trial endpoint (rate-limited, recent state only); when this MCP connection sends a BlockReq API key or is signed in to a BlockReq account, it uses the caller's own endpoint, metered to their account with their plan's limits and history. eth_getLogs needs numeric fromBlock/toBlock at most 1000 blocks apart, or a blockHash. Responses above 256 KB are refused. It cannot sign or send transactions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Network slug (for example ethereum, base, arbitrum-sepolia), catalog id, hostname, name, or EVM chain ID (1 or 0x1)",
                "type": "string"
              },
              "method": {
                "enum": ["eth_blockNumber", "eth_chainId", "eth_getBalance", "eth_call", "eth_getLogs", "eth_getTransactionByHash", "eth_getTransactionReceipt", "eth_getCode", "eth_getStorageAt", "eth_getBlockByNumber"],
                "type": "string"
              },
              "params": {
                "description": "Positional JSON-RPC params; a missing block parameter means latest",
                "type": "array"
              }
            },
            "required": ["chain", "method"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5367792bb3f17f2945f7e4b6ff0757b4c0617ee1f2d23af1019c6fcc71d3279c"
        },
        {
          "name": "get_account_portfolio",
          "title": "Get an address's token holdings",
          "description": "An address's token holdings on one chain with USD values, largest first. Holdings come from BlockReq's holder rankings; list ERC-20 addresses in tokens (up to 50) to read those balances directly from a node.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Account address (0x and 40 hex digits, any case)",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "chain": {
                "description": "Chain: ethereum, base, arbitrum",
                "enum": ["ethereum", "base", "arbitrum"],
                "type": "string"
              },
              "tokens": {
                "description": "ERC-20 token addresses to read balances of directly (up to 50)",
                "items": {
                  "description": "ERC-20 token address",
                  "pattern": "^0x[0-9a-fA-F]{40}$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01667278dfd60c5c3104d7b34ad761ed2442ba29e89285da125d5e8e288ff504"
        },
        {
