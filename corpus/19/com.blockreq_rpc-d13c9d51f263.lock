{
  "lockfileVersion": 2,
  "subjects": {
    "com.blockreq/rpc": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.blockreq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "blockreq",
        "title": "BlockReq",
        "version": "1.0.0",
        "description": "Read-only BlockReq docs, network catalog, and JSON-RPC calls on the public trial endpoint, or on the caller's own endpoint with an API key or a signed-in account",
        "websiteUrl": "https://blockreq.com/docs/build/ai-assistants/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "BlockReq MCP is public, free, and read-only. Use list_chains or get_chain to find a network's host and capabilities, search_docs and get_doc_page for documentation, get_method_reference for a method's parameters and example on one network, and call_rpc for read-only JSON-RPC calls. Without credentials call_rpc uses the rate-limited public trial endpoint, which does not serve deep history, debug, or trace; when this connection sends Authorization: Bearer <BlockReq API key>, or is signed in through https://mcp.blockreq.com/mcp/account, call_rpc uses the caller's own endpoint, metered to their account. Production code should call a private endpoint with an API key from https://blockreq.com/dashboard.",
      "tools": [
        {
          "name": "call_rpc",
          "title": "Call a read-only JSON-RPC method",
          "description": "Call one read-only JSON-RPC method on an EVM network. Without credentials it uses the public trial endpoint (rate-limited, recent state only); when this MCP connection sends a BlockReq API key or is signed in to a BlockReq account, it uses the caller's own endpoint, metered to their account with their plan's limits and history. eth_getLogs needs numeric fromBlock/toBlock at most 1000 blocks apart, or a blockHash. Responses above 256 KB are refused. It cannot sign or send transactions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Network slug (for example ethereum, base, arbitrum-sepolia), catalog id, hostname, name, or EVM chain ID (1 or 0x1)",
                "type": "string"
              },
              "method": {
                "enum": ["eth_blockNumber", "eth_chainId", "eth_getBalance", "eth_call", "eth_getLogs", "eth_getTransactionByHash", "eth_getTransactionReceipt", "eth_getCode", "eth_getStorageAt", "eth_getBlockByNumber"],
                "type": "string"
              },
              "params": {
                "description": "Positional JSON-RPC params; a missing block parameter means latest",
                "type": "array"
              }
            },
            "required": ["chain", "method"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5367792bb3f17f2945f7e4b6ff0757b4c0617ee1f2d23af1019c6fcc71d3279c"
        },
        {
          "name": "get_chain",
          "title": "Get one BlockReq network",
          "description": "Get one network's URLs and capability flags, its API reference page, and (for EVM networks) the JSON-RPC methods documented for it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Network slug (for example ethereum, base, arbitrum-sepolia), catalog id, hostname, name, or EVM chain ID (1 or 0x1)",
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5cdde7cda86266f3122ea22966c9c1d3f18aef1063e41924c24b03db32a1dff9"
        },
        {
          "name": "get_doc_page",
          "title": "Read a BlockReq docs page",
          "description": "Read one BlockReq docs page as Markdown. Accepts a https://blockreq.com/docs/... URL (HTML or index.md) or a path such as /docs/getting-started/.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Docs page URL or path",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61f2cec250fb2acb2fc867a582f678ee2d50e38df76e7c79f11e98175634bc35"
        },
        {
          "name": "get_method_reference",
          "title": "Get a JSON-RPC method reference",
          "description": "Get the documented parameters, result, example, and endpoints of one JSON-RPC method on one EVM network, from BlockReq's OpenRPC document.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Network slug (for example ethereum, base, arbitrum-sepolia), catalog id, hostname, name, or EVM chain ID (1 or 0x1)",
                "type": "string"
              },
              "method": {
                "description": "JSON-RPC method, for example eth_getLogs",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["chain", "method"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cfc24f5c7e089f965849afaf4f6159a61299207ab76a8bf30cfdad070a6576f1"
        },
        {
          "name": "list_chains",
          "title": "List BlockReq networks",
          "description": "List every published BlockReq network with its host, public trial URL, private URL pattern ({API_KEY} placeholder), WSS support, and archive and proof/debug/trace flags.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "network_type": {
                "description": "Only this network type",
                "enum": ["mainnet", "testnet", "beacon"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1db516d6e1b2731634b4be221110fe40e0aa135df88daaf68b1128f539596c54"
        },
        {
          "name": "search_docs",
          "title": "Search BlockReq docs",
          "description": "Search the BlockReq docs (setup, API keys, endpoints, Request Counting, plans, networks, support). Returns page titles, URLs, Markdown URLs for get_doc_page, and snippets. Chinese queries search the Chinese pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most results to return (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Docs language; defaults to the query's language",
                "enum": ["en", "zh-cn"],
                "type": "string"
              },
              "query": {
                "description": "Words to search for",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d416ebcbc8008a61e5ff63fd37c5426d22d13e983c0ef9382b7999c2e32b977b"
        }
      ],
      "digest": "sha256:7087e3e416a3e2f655cc4742be7d16192aeb1a7c2072822b5ffe989a27905d24"
    }
  }
}
