            "readOnly": true
          },
          "digest": "sha256:9b8fd8bf2044c65b7fa6a3e36bbd9d8604f86c16b03f7ffff07fde0095fc2f58"
        },
        {
          "name": "list_chains",
          "title": "List BlockReq networks",
          "description": "List every published BlockReq network with its host, public trial URL, private URL pattern ({API_KEY} placeholder), WSS support, and archive and proof/debug/trace flags.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "network_type": {
                "description": "Only this network type",
                "enum": ["mainnet", "testnet", "beacon"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
