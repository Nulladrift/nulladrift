              "method": {
                "description": "JSON-RPC method, for example eth_getLogs",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["chain", "method"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cfc24f5c7e089f965849afaf4f6159a61299207ab76a8bf30cfdad070a6576f1"
        },
        {
          "name": "get_token",
          "title": "Get a token's price",
          "description": "One token's USD price with the block and time it was read at, 24h change and volume, the pool the price comes from, and whether liquidity is low. price_time is when the price last changed, age_seconds is how old that is now, and indexed_time and indexed_block say how far the chain's indexing has got. When stale is true the price must not be presented as the current price; say how old it is instead. Use search_tokens first when you only know the symbol.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Token contract address (0x and 40 hex digits, any case)",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "chain": {
                "description": "Chain: ethereum, base, arbitrum",
                "enum": ["ethereum", "base", "arbitrum"],
                "type": "string"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e14b2f0e1eea2d914887fdad641349ba5a736ff6f1305b7d24b623548c89673"
        },
        {
          "name": "get_token_candles",
          "title": "Get a token's USD candles",
          "description": "A token's USD candles (open, high, low, close, USD volume, trades), oldest first, the latest 32 by default. Use from and to (Unix seconds) for a past range.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Token contract address (0x and 40 hex digits, any case)",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "chain": {
                "description": "Chain: ethereum, base, arbitrum",
                "enum": ["ethereum", "base", "arbitrum"],
                "type": "string"
              },
              "from": {
                "description": "Range start in Unix seconds, inclusive",
                "minimum": 0,
                "type": "integer"
              },
              "interval": {
                "description": "Candle interval (default 1h)",
                "enum": ["1m", "5m", "15m", "1h", "4h", "1d"],
                "type": "string"
              },
              "limit": {
                "default": 32,
                "description": "Most candles to return (default 32)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Range end in Unix seconds (default now)",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ee82a6cdfe3fd8d5f87222bbe9486e33484ced7f4267168a740f9be9f262ed98"
        },
        {
          "name": "get_token_holders",
          "title": "Get a token's largest holders",
          "description": "A token's largest holders with balance and share of the known supply, as of a block. Only tokens BlockReq tracks have a ranking; others answer not found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Token contract address (0x and 40 hex digits, any case)",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "chain": {
                "description": "Chain: ethereum, base, arbitrum",
                "enum": ["ethereum", "base", "arbitrum"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Most holders to return (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a7a0c1aa4038d4ba96b205b4f41923c40296675198073b2591107d089e70abad"
        },
        {
          "name": "get_token_prices",
          "title": "Get prices of several tokens",
          "description": "Current USD prices of up to 50 tokens in one call, across chains, in the order asked. A token without a price comes back with null price_usd. Each row carries price_time (when the price last changed), age_seconds (how old that is now), indexed_time and indexed_block (how far the chain's indexing has got); a row with stale true must not be presented as a current price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tokens": {
                "description": "Tokens to price, each {chain, address}",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "description": "Token contract address (0x and 40 hex digits, any case)",
                      "pattern": "^0x[0-9a-fA-F]{40}$",
                      "type": "string"
                    },
                    "chain": {
                      "description": "Chain: ethereum, base, arbitrum",
                      "enum": ["ethereum", "base", "arbitrum"],
                      "type": "string"
                    }
                  },
                  "required": ["address", "chain"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tokens"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
