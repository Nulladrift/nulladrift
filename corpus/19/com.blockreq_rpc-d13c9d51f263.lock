          "title": "Get one BlockReq network",
          "description": "Get one network's URLs and capability flags, its API reference page, and (for EVM networks) the JSON-RPC methods documented for it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Network slug (for example ethereum, base, arbitrum-sepolia), catalog id, hostname, name, or EVM chain ID (1 or 0x1)",
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5cdde7cda86266f3122ea22966c9c1d3f18aef1063e41924c24b03db32a1dff9"
        },
        {
          "name": "get_doc_page",
          "title": "Read a BlockReq docs page",
          "description": "Read one BlockReq docs page as Markdown. Accepts a https://blockreq.com/docs/... URL (HTML or index.md) or a path such as /docs/getting-started/.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Docs page URL or path",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61f2cec250fb2acb2fc867a582f678ee2d50e38df76e7c79f11e98175634bc35"
        },
        {
          "name": "get_method_reference",
          "title": "Get a JSON-RPC method reference",
          "description": "Get the documented parameters, result, example, and endpoints of one JSON-RPC method on one EVM network, from BlockReq's OpenRPC document.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
