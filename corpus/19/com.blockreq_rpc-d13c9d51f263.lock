            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4fc6e7547ad8d2bebf443b9eb6445fd3fdf5fc08ce36ecbbfa8cc8c9d3bdbfe5"
        },
        {
          "name": "search_docs",
          "title": "Search BlockReq docs",
          "description": "Search the BlockReq docs (setup, API keys, endpoints, Request Counting, plans, networks, support). Returns page titles, URLs, Markdown URLs for get_doc_page, and snippets. Chinese queries search the Chinese pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most results to return (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Docs language; defaults to the query's language",
                "enum": ["en", "zh-cn"],
                "type": "string"
              },
              "query": {
                "description": "Words to search for",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
