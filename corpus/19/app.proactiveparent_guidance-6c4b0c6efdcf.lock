      "serverInfo": {
        "name": "proactive-parent-guidance",
        "title": "Proactive Parent guidance",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "General pregnancy and baby guidance written by Proactive Parent, for families in any country, one region at a time: the UK, the US, Türkiye, or general guidance (INTL) everywhere else. Always know where the family lives before calling: ask, never assume. Pass the text on with its disclosure. It is general information, not medical advice: for anything about a parent's or a child's health, send them to their midwife, health visitor or doctor.",
      "tools": [
        {
          "name": "age_guidance",
          "title": "Baby and child age guidance",
          "description": "What to expect at one age of a baby or young child (birth to 6 years), for a family in any country (the UK, the US and Türkiye have their own guidance; every other country gets general guidance): the week-by-week guide for the first year, the check-ups and things to do around that age where the region has them, and reading for it. Our own written guidance, with the pages it drew on.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "The child's age, in the unit given (up to 6 years).",
                "maximum": 2200,
                "minimum": 0,
                "type": "number"
              },
              "born_at_week": {
                "description": "Only for a baby born before 37 weeks of pregnancy: the week they were born. The guide then follows their corrected age, as their care team does, until two years.",
                "maximum": 42,
                "minimum": 22,
                "type": "integer"
              },
              "language": {
                "description": "The language to answer in. If the region's guidance is not written in it, the region's own language is used (GB and US: en; TR: tr; INTL: en, tr, es, fr).",
                "enum": ["en", "tr", "es", "fr"],
                "type": "string"
              },
              "region": {
                "description": "Where the family lives and gets care. GB: the United Kingdom. US: the United States. TR: Türkiye. INTL: general guidance for every other country, such as Germany, India or Brazil. Required, with no default, because care differs between countries: guidance is never taken from another region.",
                "enum": ["US", "GB", "TR", "INTL"],
                "type": "string"
              },
              "unit": {
                "description": "The unit of the age.",
                "enum": ["days", "weeks", "months", "years"],
                "type": "string"
              }
            },
            "required": ["age", "region", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Baby and child age guidance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6309bd7d306410e6fad0472a20fd0d6c1e1afec97a2810314f92ffb5b7359e30"
        },
        {
          "name": "week_guidance",
          "title": "Pregnancy week guidance",
          "description": "What happens in one week of pregnancy, for a family in any country (the UK, the US and Türkiye have their own guidance; every other country gets general guidance): the baby, the body, tips, and, where the region has them, the appointments and things to do that week. Our own written guidance, with the pages it drew on and links to official pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "The language to answer in. If the region's guidance is not written in it, the region's own language is used (GB and US: en; TR: tr; INTL: en, tr, es, fr).",
                "enum": ["en", "tr", "es", "fr"],
                "type": "string"
              },
              "multiples": {
                "description": "True for twins or more.",
                "type": "boolean"
              },
              "region": {
                "description": "Where the family lives and gets care. GB: the United Kingdom. US: the United States. TR: Türkiye. INTL: general guidance for every other country, such as Germany, India or Brazil. Required, with no default, because care differs between countries: guidance is never taken from another region.",
                "enum": ["US", "GB", "TR", "INTL"],
                "type": "string"
              },
              "week": {
                "description": "The week of pregnancy, counted from the first day of the last period (4 to 42).",
                "maximum": 42,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["region", "week"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
