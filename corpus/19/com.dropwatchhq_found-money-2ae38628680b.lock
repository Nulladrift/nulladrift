      "serverInfo": {
        "name": "found-money",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "search_settlements",
          "description": "Search currently-open US class-action settlements you may be able to claim for free. Filter by keyword (company/brand), category (e.g. data-breach, privacy, junk-fees), and whether proof is required. Returns each settlement's payout, claim deadline, days-left, proof requirement, category, and official claim URL. Sorted by soonest deadline. Use to find money a user may be owed.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug filter, e.g. 'data-breach', 'privacy', 'junk-fees', 'auto-vehicle'.",
                "type": "string"
              },
              "keyword": {
                "description": "Company/brand or topic to match, e.g. 'Equifax' or 'breach'.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 20, max 100).",
                "type": "number"
              },
              "noProofOnly": {
                "description": "If true, only return settlements that appear to need no purchase proof.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d90f46ce7d8ae62dccec5cf1e949e2cabbb70e33ffad6de2366d08d2d447a6a0"
        },
        {
          "name": "unclaimed_money_portal",
          "description": "Get the official, free unclaimed-property (unclaimed money) search portal for a US state plus the national NAUPA/missingmoney.com link. Use to direct someone to where they can search for forgotten bank accounts, refunds, etc.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "State name or 2-letter code, e.g. 'Texas' or 'TX'.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0092abee21a65846b73d86d32332001a19ee2b354e565e0b89b5f6db8641afb"
        }
      ],
