      "instructions": "Tools for managing Emailchaser cold email campaigns, leads and prospect sourcing, the Lead Finder contact database, replies and AI reply drafts, sender email accounts, inbox placement and deliverability, ICPs and audience sizing, autopilot runs, credits and spend reports, done-for-you infrastructure, blocklist, webhooks, and workspaces with their API keys. All calls act on the workspace that owns the API key. confirm_connection records the connection, so the user can see in the app that the assistant is connected. Scope enforcement happens in the Emailchaser backend, not in this server: a read-only key can use the read (list and get) tools plus confirm_connection, get_audience_size and search_lead_finder, and the backend answers HTTP 403 when it is used on any other write tool; write tools need a read & write key. A few tools spend real money or credits (purchase_credits, create_dfy_order, approve_autopilot_run, source_prospects, add_lead_finder_prospects, create_email_verification_job) and say so in their descriptions - read them before calling. send_reply_draft and send_reply email a prospect and cannot be recalled.",
      "tools": [
        {
          "name": "add_blocklist_entries",
          "title": "Add blocklist entries",
          "description": "Adds up to 1,000 suppression entries in one call so no campaign ever emails them. Each value is either a full email address (contains @) or a bare domain; the type is inferred per value. Existing entries and invalid values are skipped, so the call is safe to retry and suited to carrying over a suppression list from another sending platform. Scope defaults to \"workspace\"; \"global\" blocks across every workspace on the account and only works from the main workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "scope": {
                "description": "\"workspace\" (default) blocks for this workspace only; \"global\" blocks for every workspace on the account",
                "enum": ["workspace", "global"],
                "type": "string"
              },
              "values": {
                "description": "Email addresses and/or domains to block, e.g. [\"competitor.com\", \"jane@acme.com\"] (1 to 1,000 per request)",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["values"],
