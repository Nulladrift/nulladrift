        {
          "name": "copilot_launch",
          "title": "Copilot: launch a draft campaign",
          "description": "Creates a DRAFT campaign from a sequence. With a LinkedIn Sales Navigator search it also starts finding + verifying leads for it; without one the draft holds the emails and leads can be added from Lead Finder or a CSV upload. Nothing sends — the campaign stays a draft until you review and launch it. Returns the new campaign id, plus a lead-finding job id when lead finding started.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "icp": {
                "additionalProperties": {},
                "description": "Optional ICP object as returned by copilot_plan, stored with the campaign for reference only",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "name": {
                "description": "Campaign name",
                "minLength": 1,
                "type": "string"
              },
              "salesNavData": {
                "description": "Optional base64 LinkedIn session payload from the browser extension; required for lead-finding to actually run",
                "type": "string"
              },
              "salesNavSearchUrl": {
                "description": "Optional LinkedIn Sales Navigator people-search URL to source leads from. Leave it out to create the draft with its emails only. Required when salesNavData is given.",
                "type": "string"
              },
              "sequence": {
                "description": "The email sequence: the first step is the initial email, the rest are follow-ups",
                "items": {
                  "properties": {
                    "body": {
                      "description": "Email body",
                      "type": "string"
                    },
                    "followUpAfter": {
                      "description": "Days to wait after the previous step (0 for the first email)",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "subject": {
                      "description": "Email subject (supports {firstName}, {companyName}, etc.)",
                      "type": "string"
                    }
                  },
                  "required": ["body", "subject"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
