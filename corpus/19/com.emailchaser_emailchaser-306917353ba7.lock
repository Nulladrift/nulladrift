        {
          "name": "start_autopilot_run",
          "title": "Autopilot: start a run",
          "description": "Starts an autopilot run for a company website: the AI builds an ICP, writes a sequence and checks that prospects match, then STOPS at an approval gate. Nothing is revealed, charged or sent and no sending accounts are bought until approve_autopilot_run is called; approval then reveals the first batch at 1 credit ($0.033 at list) per prospect, up to targetProspects and at most 2,000. The call is refused when the wallet cannot cover that batch. When budgetUsd is given, the sized budget plan is snapshotted on the run and returned in this response, the only response that carries it, with credits valued at list, and targetProspects defaults to the plan's monthly prospects. Without budgetUsd the run can never buy sending accounts, so the workspace needs one connected before approval or the run fails. Requires an active subscription (any plan).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "budgetUsd": {
                "description": "Monthly budget in US dollars; sizes a plan that is snapshotted on the run",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "maxMailboxes": {
                "description": "Cap on the budget plan's mailboxes. 0 means no cap",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "replyMode": {
