        {
          "name": "send_reply",
          "title": "Send your own reply",
          "description": "Answers an inbound reply with your own message, in the same email thread and from the mailbox the conversation runs through (in a conversation the prospect started, your mailbox they wrote to). It works for every inbound reply, including the ones Emailchaser writes no AI draft for (wrong_person, uncategorized), and it is how you send a second message in a conversation that went quiet: answer the prospect's latest reply again. The message is scheduled at once, goes out within about a minute and cannot be recalled; get_lead_conversation then shows its status move from scheduled to sent. Only id and body are required. Leave to out to Reply All: the person who wrote goes in To and everyone else they addressed in Cc, never one of your own mailboxes. Set to to choose the recipients yourself: then to, cc and bcc are used exactly as given (cc is only read together with to; bcc works either way), at most 20 addresses in all. There is no subject: the answer keeps the thread's subject with \"Re: \" in front, so the thread never breaks. contentType is \"text\" by default; use \"html\" only when body is HTML (paragraphs, line breaks, bold, italics, links, lists and headings are kept; images, tables and inline styles are removed). Merge tags such as {first_name} and spintax such as {Hi|Hello} are filled in when it sends. No signature is added: put yours in body. attachments takes at most 5 files, 10 MB in total. Refused with 409 when the id is not an inbound reply or an identical body went to it less than 60 seconds ago (so a retry after a timeout never sends twice), 422 when there is no connected sender mailbox or recipient, the lead has unsubscribed or an earlier email to the recipient hard-bounced, and 429 after 20 answers to one reply in an hour. Needs a read & write key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attachments": {
                "description": "At most 5 files, 10 MB in total",
                "items": {
                  "properties": {
                    "contentBase64": {
                      "description": "The file's bytes, base64-encoded",
                      "minLength": 1,
                      "type": "string"
                    },
                    "fileName": {
                      "description": "File name, e.g. proposal.pdf",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["contentBase64", "fileName"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "bcc": {
                "description": "Bcc recipients, with or without to",
                "items": {
                  "format": "email",
                  "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                  "type": "string"
                },
                "type": "array"
              },
              "body": {
                "description": "Your message: plain text, or HTML when contentType is \"html\"",
                "minLength": 1,
                "type": "string"
              },
              "cc": {
                "description": "Cc recipients; only read together with to",
                "items": {
                  "format": "email",
                  "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                  "type": "string"
                },
                "type": "array"
              },
              "contentType": {
                "description": "\"text\" (default) or \"html\"",
                "enum": ["text", "html"],
                "type": "string"
              },
              "id": {
                "description": "The numeric ID of the inbound reply to answer (from list_replies, or an inbound item of get_lead_conversation)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "to": {
                "description": "Recipients. Leave out to Reply All",
                "items": {
                  "format": "email",
                  "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["body", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
