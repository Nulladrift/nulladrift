        {
          "name": "cancel_lead_finder_import",
          "title": "Lead Finder: stop an add",
          "description": "Stops a running Lead Finder add. It reads canceled at once. A batch the worker is already writing is still added and charged; a batch still being screened or verified is dropped, though verification checks already made are billed. Credits held for the rest are released. Until finishedAt is set, added, creditsSpent and even status can still change: if that batch was the add's last, it ends completed or failed instead. People already added stay in the campaign. A stopped add cannot be resumed: start a new add_lead_finder_prospects instead. Stopping one that already finished changes nothing.",
