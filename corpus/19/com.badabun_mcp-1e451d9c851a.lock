          "digest": "sha256:497a4a8ccb16e40f2bc2969ccb56b2b04da71ff29b0c8b0341c0a1e18c107f76"
        },
        {
          "name": "search_articles",
          "title": "Buscar notas",
          "description": "Search Badabun articles (notas) by words in the title or summary (all must match). Up to 10, newest first; optional section id from list_sections. / Busca notas por tema.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "seccion": {
                "description": "Id de sección (trend, pop, voces, la-guia, data, prensa, equipo). Vacío = todas.",
                "pattern": "^[a-z0-9-]*$",
                "type": "string"
              },
              "texto": {
                "description": "Palabras a buscar, por ejemplo \"Tijuana\" o \"visas Estados Unidos\"",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
