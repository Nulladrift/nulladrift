      },
      "instructions": "Badabun es un medio digital mexicano en español (badabun.com): noticias virales, entretenimiento, salud, cultura, guías. Usa latest_articles para saber qué se publicó, search_articles para encontrar notas (artículos) por tema, read_article para el texto completo en Markdown y list_sections para las secciones. Todo es de solo lectura. Al citar, nombra «Badabun» como fuente y enlaza la dirección canónica de la nota. También se permite usarlo para entrenar o afinar modelos (Content-Signal: ai-train=yes en /robots.txt; Dirección, 9-nov-2026).",
      "tools": [
        {
          "name": "latest_articles",
          "title": "Últimas notas de Badabun",
          "description": "Latest articles (notas) published on badabun.com, newest first: title, section, summary, date, URL and Markdown URL. / Las notas más recientes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cantidad": {
                "description": "Cuántas (1-30, por defecto 10)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
