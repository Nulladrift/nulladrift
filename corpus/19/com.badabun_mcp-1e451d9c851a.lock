        {
          "name": "read_article",
          "title": "Leer una nota completa",
          "description": "Read one Badabun article (nota) as Markdown: full text with title, description, dates, section and author in the frontmatter. Takes the article URL (https://badabun.com/seccion/nota/). / Lee una nota completa.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
