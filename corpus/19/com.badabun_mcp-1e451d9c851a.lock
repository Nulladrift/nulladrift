          },
          "digest": "sha256:4541141be2304a7dff347f686ed9523734e73463d09f326250594b6d84bf0fc8"
        },
        {
          "name": "list_sections",
          "title": "Secciones de Badabun",
          "description": "List the site sections with description, URL and agent index (llms.txt). / Secciones de Badabun.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
