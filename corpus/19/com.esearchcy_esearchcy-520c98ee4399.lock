      },
      "transport": {
        "type": "http",
        "url": "https://esearchcy.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "esearchcy",
        "title": "ESearchCy — Cyprus company search",
        "version": "1.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ESearchCy is an independent Cyprus company search service (not the Registrar of Companies). Use search_companies to find a Cyprus company or partnership by name or registration number (HE / ΗΕ for companies, S / Σ for partnerships), get_company for its registry details, and get_documents_and_prices for what can be ordered (complete company file, official certificates) and the price. Data comes from the Registrar of Companies' monthly open data. Directors' and shareholders' names are not shown here: the user can see them free with an ESearchCy account. Ordering happens on esearchcy.com — give the user the order link.",
      "tools": [
        {
          "name": "get_company",
          "title": "Cyprus company details",
          "description": "Registry details of one Cyprus company or partnership: name, type, status and its date, registration date, registered office address, number and roles of current officers (no names), previous officers count, the date of the open data, and links to the company page and to order its documents.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "number": {
                "description": "Registration number, e.g. \"HE 123456\" or \"S 1817\". A bare number means a company (HE).",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/esearchcy-company-v1.html",
            "openai/toolInvocation/invoked": "Company found",
            "openai/toolInvocation/invoking": "Looking up the company…",
            "openai/widgetAccessible": true
          },
          "digest": "sha256:9115b36c90a1d6ccce62432b1e29d86e16f71f1ad17f399b613474aee579d7f8"
        },
        {
          "name": "get_documents_and_prices",
          "title": "Documents and prices",
          "description": "What ESearchCy can order from the Cyprus Registrar of Companies — the complete company file (every scanned document as PDF) and official certificates (incorporation, shareholders, directors and secretary, registered office, good standing, share capital, no winding-up, memorandum and articles) — with prices, delivery times and how to order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f9e5a93f7da9c860d38b02583f8f44d7eea96633247359a5e4f960aa30fbc21"
        },
        {
          "name": "search_companies",
          "title": "Search Cyprus companies",
          "description": "Find Cyprus companies and partnerships registered with the Registrar of Companies, by registration number (e.g. \"HE 123456\", \"ΗΕ 123456\", \"S 1817\") or by the start of the registered name (e.g. \"BANK OF CYPRUS\"). Returns name, number, status, registration date and the company page link. Includes struck-off and dissolved companies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Registration number, or the beginning of the company name (Latin or Greek).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/esearchcy-company-v1.html",
            "openai/toolInvocation/invoked": "Search done",
            "openai/toolInvocation/invoking": "Searching the Cyprus register…",
            "openai/widgetAccessible": true
          },
          "digest": "sha256:1a227e087988b9a6d2a73fdd7376ecfcee14dfa491c5fc445eefbca27df96c77"
        }
      ],
      "resources": [
        {
          "uri": "ui://widget/esearchcy-company-v1.html",
          "name": "ESearchCy company card",
          "mimeType": "text/html+skybridge",
          "meta": {
            "openai/widgetCSP": {
