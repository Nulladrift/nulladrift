      "serverInfo": {
        "name": "com.clawhard/sieve",
        "title": "Sieve",
        "version": "1.0.0",
        "description": "Sieve runs a regular expression for real, on JavaScript's engine or on RE2 (Go), against strings that should and should not match, and shows each pass or fail with the matched text and groups. It also proves whether the pattern can backtrack catastrophically (ReDoS) and gives the input that would hang it. No account.",
        "websiteUrl": "https://sieve.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
