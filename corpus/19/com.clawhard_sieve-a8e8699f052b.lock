          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sieve: Sieve runs a regular expression for real, on JavaScript's engine or on RE2 (Go), against strings that should and should not match, and shows each pass or fail with the matched text and groups. It also proves whether the pattern can backtrack catastrophically (ReDoS) and gives the input that would hang it. No account. Use it when someone writes, tests, debugs or ports a regular expression, or needs to know whether a regex is safe from ReDoS (catastrophic backtracking). Tools: sieve_test_regex (Run a regular expression on test strings (JavaScript or RE2/Go) and check it for ReDoS); sieve_check_redos (Check regular expressions for ReDoS (catastrophic backtracking)). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "sieve_check_redos",
          "title": "Check regular expressions for ReDoS (catastrophic backtracking)",
          "description": "Use when a regular expression will run on user input or untrusted data (form validation, request routing, log parsing, WAF or search rules) and must not hang the server, or when reviewing a codebase's regexes for ReDoS (signals: \"is this regex safe\", \"ReDoS\", \"catastrophic backtracking\", \"regex hangs\", \"CPU spike on validation\", \"security review of regexes\", \"(a+)+\"). Analyzes 1 to 20 patterns with recheck (automaton analysis with a fuzzing fallback) for backtracking engines with JavaScript syntax, and returns per pattern: safe (proven linear, or no attack found when backreferences or lookarounds force fuzzing), or vulnerable with the complexity (exponential, or polynomial with its degree), a concrete attack string (repr like 'a'.repeat(31) + '\\\\x00', plus the string itself when short), the hot part of the pattern and a fix hint. Example: {\"patterns\":[\"^(a+)+$\",\"/^([a-z]+\\\\s)*$/\",\"^[\\\\w.+-]+@[\\\\w-]+\\\\.[\\\\w.-]+$\"]}. Python re, PCRE, Java, .NET and Ruby backtrack the same way on these constructs; RE2, Go regexp and Rust regex are linear-time and not affected. To also run the pattern on test strings, use sieve_test_regex.",
          "inputSchema": {
            "properties": {
              "flags": {
                "description": "Flags for every pattern given as a raw source (literals keep their own). JavaScript flags d g i m s u v y.",
                "maxLength": 8,
                "type": "string"
              },
              "patterns": {
                "description": "Regex sources (\"^(a+)+$\") or JavaScript literals (\"/^(a+)+$/i\").",
                "items": {
                  "maxLength": 5000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["patterns"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check regular expressions for ReDoS (catastrophic backtracking)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/sieve/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/sieve/result"
          },
          "digest": "sha256:d26eef91f9de3f4428230124349922319e29aa87e83b8e430ce3be539ed88726"
        },
        {
          "name": "sieve_test_regex",
          "title": "Run a regular expression on test strings (JavaScript or RE2/Go) and check it for ReDoS",
          "description": "Use when you have written, been given or are about to commit a regular expression and need to know what it really matches, instead of predicting it (signals: \"write a regex for\", \"does this regex match\", \"validate emails/phone numbers/dates/slugs/URLs with a regex\", \"why doesn't my regex match\", \"test this pattern\", \"regex for Go\", \"is this regex safe\", \"catastrophic backtracking\", \"convert this Python regex to JavaScript\"). Executes the pattern on the real engine: JavaScript (V8 RegExp, the engine in Chrome, Node.js and Cloudflare Workers; flags d g i m s u v y) or RE2 (re2js, with Go regexp parity: Go, RE2, Google Sheets and BigQuery syntax; flags i m s). Give strings that must match and strings that must not; each case comes back pass/fail with the matched text, index and capture groups (numbered and named), and why a \"should not match\" string matched (usually a missing ^...$). match: \"full\" tests the whole string. texts lists every match, replace_with shows the replacement ($1/$<name> in JavaScript, $1/${name} in Go). For JavaScript it also runs a ReDoS analysis (recheck): proven linear, or exponential/polynomial backtracking with a concrete attack string and the hot part of the pattern. Flags patterns that compile but mislead: ^a|b$ anchoring, \\A/\\Z/\\h read as letters, [[:alpha:]], {,3}, [A-z], unescaped dots before extensions. Invalid patterns return the engine's error and a hint (Python (?P<name>), (?i), possessive and atomic groups; lookarounds and backreferences in RE2). Example: {\"pattern\":\"[\\\\w.+-]+@[\\\\w-]+\\\\.[a-z]{2,}\",\"should_match\":[\"ann@example.com\"],\"should_not_match\":[\"ann@example\",\"see ann@x.io now\"]}. Does not run Python, PCRE, Java or .NET engines; it reports what differs for common constructs. Up to 100 strings of 20000 characters; on a ReDoS-vulnerable pattern, long strings are skipped instead of hanging. Returns {valid, verdict: ok|warnings|redos|fails|invalid, summary, engine, engine_name, pattern, flags, match_mode, counts:{should_match, should_not_match, texts, passed, failed, skipped}, group_count, cases:[{text, length, expect: match|no_match|any, matched, pass (null = skipped), match_count, match:{text, index, end, groups?, named?}, matches? (texts only), why?, replaced?, skipped?}], warnings:[{rule, message, fix?, index?}], redos:{status: safe|vulnerable|unknown, complexity: linear|polynomial (degree n)|exponential|no attack found|unknown, attack?:{repr, length, string|null, sample}, hotspots?:[{start, end, text}], explanation?, fix_hint?, note?}|null, fix_message (ready-to-apply list, null when clean), error? and hint? (invalid patterns), notes, checked_at, open_url}.",
          "inputSchema": {
            "properties": {
              "check_redos": {
                "description": "Run the ReDoS analysis (JavaScript engine). Default true.",
                "type": "boolean"
              },
              "engine": {
                "description": "\"javascript\" (default; also TypeScript, Node.js, browsers, Deno, Bun) or \"re2\" (Go regexp, RE2, Google Sheets REGEXMATCH, BigQuery).",
                "enum": ["javascript", "re2"],
                "type": "string"
              },
              "flags": {
                "description": "JavaScript: any of d g i m s u v y. RE2: i m s. Default none.",
                "maxLength": 8,
                "type": "string"
              },
              "match": {
                "description": "\"search\" (default): a match anywhere counts, like RegExp.test, re.search or Go MatchString. \"full\": the whole string must match, like Python re.fullmatch.",
                "enum": ["search", "full"],
                "type": "string"
              },
              "max_matches": {
                "description": "Most matches listed per text (default 10). match_count is always the full count.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pattern": {
                "description": "The regex source, e.g. \"^\\\\d{4}-\\\\d{2}$\" (JSON-escaped), or a JavaScript literal \"/^\\\\d+$/i\" (flags then come from the literal).",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "replace_with": {
                "description": "Optional replacement; each case also returns the string with every match replaced.",
                "maxLength": 2000,
                "type": "string"
              },
              "should_match": {
                "description": "Strings the pattern must match (in match mode).",
                "items": {
                  "maxLength": 20000,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "should_not_match": {
                "description": "Strings the pattern must not match.",
                "items": {
                  "maxLength": 20000,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "texts": {
                "description": "Strings to search; every match is listed with its groups (no pass/fail).",
                "items": {
                  "maxLength": 20000,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              }
            },
            "required": ["pattern"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run a regular expression on test strings (JavaScript or RE2/Go) and check it for ReDoS"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/sieve/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/sieve/result"
          },
          "digest": "sha256:74f1b44f9e035aa00d0f2bf14b596e721e473fbd7d2ed5900ccdcdf8dabffbef"
        }
