          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "intent": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
