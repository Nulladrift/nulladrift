{
  "lockfileVersion": 2,
  "subjects": {
    "cc.heatpulse/heatpulse": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://heatpulse.cc/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "heatpulse",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "daily_digest",
          "description": "The daily editorial digest for a date (YYYY-MM-DD) or the latest one: intro paragraph, stats, and the day's featured events.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD, default latest",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51e4d96f6228f53c23748e41bab5faecb9cd14eea8fa848055e68714c63274a1"
        },
        {
          "name": "get_event",
          "description": "One AI-news event by slug: full editorial summary plus its outbound coverage list (outlet name, link, language, time — no publisher headlines).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:40d5307980b2c49f599322283e5bb8c1ec95106542276bbb4023e71834b63679"
        },
        {
          "name": "list_datasets",
          "description": "Bulk JSONL dataset manifest (events corpus, entities, leaderboard history, digests) for RAG/fine-tune pulls.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38e5d931df7e4a1cf41f56a0598713cf5bacd16e178981f5afe0f31b0654e9c7"
        },
        {
          "name": "list_topics",
          "description": "Extracted entities (companies, models, people, themes) ranked by coverage count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:402fc0fd16f9c6ddd3768c1d64704b51bb44d14330be8eac14fdbeda90b290d0"
        },
        {
          "name": "llm_leaderboard",
          "description": "Live LLM arena leaderboards (text/code/agent/document/vision/search). Rows carry arena score+votes, rank delta vs the previous daily snapshot, OpenRouter context length and USD-per-1M-token pricing. Agent board: score = net-improvement %, votes = sessions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board": {
                "enum": ["text", "code", "agent", "document", "vision", "search"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8e0c28cfe91730107033b2999b2329603db58412e60e0329d45b9cab78be962"
        },
        {
          "name": "related_stories",
          "description": "Events most similar to a given event (centroid cosine KNN, max 5).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25f87d8b11d0091a4a56c2752957c9421a7393ff54b0ae0f73212f10766a8b01"
        },
        {
          "name": "route_intent",
          "description": "Describe what knowledge you need in natural language; get back the right HeatPulse endpoint(s) and authoritative external sources, each with a \"why\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "intent": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0902df35e01b675c970276aa8ce23dc1973f249c7b9261f7c1af28a598ef8f27"
        },
        {
          "name": "search_news",
          "description": "Search or list AI news events. Pass `query` for semantic search, or omit it for the heat-ranked feed. Returns editorial summaries (safe to quote) with canonical /event/{slug} URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category slug, one of: models, products, industry, papers, benchmarks, policy, tips",
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "enum": ["heat", "recent"],
                "type": "string"
              },
              "query": {
                "description": "Natural-language search query",
                "maxLength": 200,
                "type": "string"
              },
              "region": {
                "description": "Region key, one of: europe, dach",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a502279cc98f7c7cdea150f9e6073fca41558cf737c69deef397cc33cf6ee58"
        }
      ],
      "resources": [
        {
          "uri": "heatpulse://benchmarks",
          "name": "benchmarks",
          "description": "All six LLM arena boards as JSON (current snapshot)",
          "mimeType": "application/json",
          "digest": "sha256:33dacd848bfb25138c5010280019ad524c2637b094d0fd5f8dfa087c20adfd2a"
        },
        {
          "uri": "heatpulse://knowledge-map",
          "name": "knowledge-map",
          "description": "Curated intent → route table (internal endpoints + external authoritative sources)",
          "mimeType": "application/json",
          "digest": "sha256:f45a2066d598e751af40afd09edc6cfb8297d1e1e84896f8b8e28e90f56ab858"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "heatpulse://benchmarks/{board}",
          "name": "benchmark-board",
          "description": "One arena board as JSON — board ∈ text | code | agent | document | vision | search",
          "mimeType": "application/json",
          "digest": "sha256:e5da1ea5dae65040eef3242617af7c9971de8bae413bc415f0f1a05033b06558"
        }
      ],
      "prompts": [
        {
          "name": "daily_briefing",
          "description": "Summarize today's AI landscape: digest + top events + leaderboard movers",
          "digest": "sha256:eb9819230b77b5aa073f003f4482d233635810f7878fcc1d2559795987a9e9d7"
        },
        {
          "name": "research_ai_model",
          "description": "Guided workflow: everything HeatPulse knows about an AI model — news, rankings, pricing, related coverage",
          "arguments": [
            {
              "name": "name",
              "description": "Model name, e.g. \"claude-opus-4.5\"",
              "required": true
            }
          ],
          "digest": "sha256:7e177fea10b8335f77c46139e01b497ba98aa0722045d97e5f386d2fb56bded3"
        }
      ],
      "digest": "sha256:79b807022fdab6c7055aeed376ec1dbd740785f5a973842cc2031e244d059c28"
    }
  }
}
