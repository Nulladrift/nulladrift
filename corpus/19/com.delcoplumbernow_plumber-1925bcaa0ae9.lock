{
  "lockfileVersion": 2,
  "subjects": {
    "com.delcoplumbernow/plumber": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://delcoplumbernow.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "delco-plumber-now",
        "title": "Delco Plumber Now",
        "version": "1.1.0",
        "websiteUrl": "https://delcoplumbernow.com/ai-assistants",
        "icons": [
          {
            "src": "https://delcoplumbernow.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Delco Plumber Now is a plumber referral service for Delaware County, PA. get_price_range gives a typical range (not a quote) and check_coverage checks a town or ZIP. To be contacted, the person can call or text (610) 362-5950, or share a phone number or email: use request_contact only after they explicitly agree to the consent text, with details they provided. Plumber availability varies, and same-day service is not guaranteed. Include the disclaimer when sharing a price range.",
      "tools": [
        {
          "name": "chat_with_delco_plumber_now",
          "description": "Multi-turn chat with the Delco Plumber Now assistant in plain language: ask questions, get a typical price range, and get the person connected with a local plumber. Pass the conversation_id from the previous reply to continue. When the person agrees to be contacted and shares a phone or email, the reply includes ready_to_submit with their details; submitting is done separately with request_contact. Use this for open-ended questions; use the single-purpose tools when you only need coverage, a price range or the phone number. Returns JSON with the reply, the conversation_id and call/text links; up to 30 messages per conversation.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "From the previous reply (c_ plus 16 hex characters); omit to start a new conversation",
                "type": "string"
              },
              "message": {
                "description": "What the person (or you, on their behalf) wants to say or ask, in plain words, up to 2000 characters",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Chat with Delco Plumber Now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b79c5e0bb4f03c1decfe79f792ad7a021038565ae67c967f21ea0c345679fd80"
        },
        {
          "name": "check_coverage",
          "description": "Check whether Delco Plumber Now (a plumber referral service) covers a town or ZIP in Delaware County, Pennsylvania. Returns whether it is covered and the town page.",
          "inputSchema": {
            "properties": {
              "location": {
                "description": "Town name or 5-digit ZIP, e.g. \"Havertown\" or \"19083\"",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e6c0da6a0ac7a6e4cca42b5dc38f478fd34fe7aad5285ef1b6e2a9c606f18b6"
        },
        {
          "name": "get_contact_info",
          "description": "Delco Plumber Now contact details: the phone number to call or text, email and website.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Contact info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ee22126caa6324a37ea862d743981c13b33794941f85f6be531cfc74060e56f"
        },
        {
          "name": "get_price_range",
          "description": "Typical price range for a common plumbing problem in Delaware County, PA, from a fixed table (not a quote; the plumber confirms the price), with the disclaimer and how to reach Delco Plumber Now. Returns no number for jobs outside the table.",
          "inputSchema": {
            "properties": {
              "location": {
                "description": "Optional town or ZIP",
                "type": "string"
              },
              "problem": {
                "description": "The plumbing problem in plain words, e.g. \"toilet keeps running\"",
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Typical price range"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f0843497f80427eed4193731e5833512fd10649d6b831e654bf77461fd0e03c"
        },
        {
          "name": "request_contact",
          "description": "Send Delco Plumber Now a request to contact the person about a plumbing problem in Delaware County, PA: their phone number and/or email, the problem and their town. Use only after the person has explicitly agreed to the consent text and provided their own details. Side effects: stores the request, emails Delco Plumber Now, and emails the person a confirmation if they gave an email; Delco Plumber Now may call them back (it texts only people who text it first). Not idempotent; limited to 3 requests per phone or email per day.",
          "inputSchema": {
            "properties": {
              "consent": {
                "description": "Must be true, meaning the person agreed to: \"I ask Delco Plumber Now (Andrew Furman, Aifurman LLC) to contact me about this plumbing request at the phone number and/or email I provided.\"",
                "type": "boolean"
              },
              "email": {
                "description": "Email address (phone or email is required)",
                "type": "string"
              },
              "location": {
                "description": "Town or ZIP in Delaware County, PA",
                "type": "string"
              },
              "name": {
                "description": "Optional first name",
                "type": "string"
              },
              "phone": {
                "description": "US phone number (phone or email is required)",
                "type": "string"
              },
              "preferred_contact": {
                "description": "How they prefer to hear back; text needs a phone number",
                "enum": ["text", "call", "email"],
                "type": "string"
              },
              "problem": {
                "description": "The plumbing problem in plain words",
                "type": "string"
              }
            },
            "required": ["consent", "location", "problem"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a plumber contact"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76d70389ca654e1c429b6046cf86d49524049a169ea63e13959aa6b35c89845f"
        }
      ],
      "digest": "sha256:e9dace2bc82d42e1e0ec2d9c966b1c99582b56c1b4498a04f1c98f10b49a38c9"
    }
