{
  "lockfileVersion": 2,
  "subjects": {
    "com.rovvafrica/ride-booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rovvafrica.com/api/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "rovv-ride-booking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Rovv is a ride-hailing service. Use these tools to help users search for locations, get fare estimates, book rides, check ride status, and view ride history. Always confirm the pickup and dropoff locations with the user before booking. Present fare options clearly and let the user choose their preferred vehicle type. For bookings, default to cash payment unless the user specifies otherwise.",
      "tools": [
        {
          "name": "book_ride",
          "description": "Book a Rovv ride. Requires pickup/dropoff coordinates, a vehicle_type ID (from get_fare_estimate), and payment method. Returns booking confirmation with ride number.",
          "inputSchema": {
            "properties": {
              "drop_address": {
                "description": "Dropoff address text",
                "type": "string"
              },
              "drop_lat": {
                "description": "Dropoff latitude",
                "type": "number"
              },
              "drop_lng": {
                "description": "Dropoff longitude",
                "type": "number"
              },
              "is_later": {
                "default": false,
                "description": "Set to true for scheduled rides",
                "type": "boolean"
              },
              "payment_opt": {
                "default": 1,
                "description": "Payment method: 0 = card, 1 = cash, 2 = wallet",
                "type": "integer"
              },
              "pick_address": {
                "description": "Pickup address text",
                "type": "string"
              },
              "pick_lat": {
                "description": "Pickup latitude",
                "type": "number"
              },
              "pick_lng": {
                "description": "Pickup longitude",
                "type": "number"
              },
              "trip_start_time": {
                "description": "For scheduled rides: datetime in Y-m-d H:i:s format",
                "type": "string"
              },
              "vehicle_type": {
                "description": "The zone_type_id from get_fare_estimate results",
                "type": "string"
              }
            },
            "required": ["drop_address", "drop_lat", "drop_lng", "pick_address", "pick_lat", "pick_lng", "vehicle_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:532600a2ad45e8d93556111a0a82a54da64f98779afe7f892e0b810141a5a553"
        },
        {
          "name": "cancel_ride",
          "description": "Cancel an active ride. Optionally provide a reason.",
          "inputSchema": {
            "properties": {
              "reason": {
                "description": "Optional cancellation reason",
                "type": "string"
              },
              "request_id": {
                "description": "The ride request ID to cancel. If not provided, cancels the current active ride.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43a0332bf3c9485bb8e17b0ce6ee67eda9342aaa253f8d63006dc0d2b4d33241"
        },
        {
          "name": "get_current_ride",
          "description": "Get the status of the user's current active ride, including driver details, ETA, and ride status.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2ad6ebca89e9c1b55867e187bd8da7a88faaea5119cb16a73ad91f5a436f243"
        },
        {
          "name": "get_fare_estimate",
          "description": "Get available vehicle types and fare estimates for a trip. Returns a list of vehicle options with prices, ETAs, and vehicle type IDs needed for booking.",
          "inputSchema": {
            "properties": {
              "drop_address": {
                "description": "Dropoff address text",
                "type": "string"
              },
              "drop_lat": {
                "description": "Dropoff latitude",
                "type": "number"
              },
              "drop_lng": {
                "description": "Dropoff longitude",
                "type": "number"
              },
              "pick_address": {
                "description": "Pickup address text",
                "type": "string"
              },
              "pick_lat": {
                "description": "Pickup latitude",
                "type": "number"
              },
              "pick_lng": {
                "description": "Pickup longitude",
                "type": "number"
              }
            },
            "required": ["drop_lat", "drop_lng", "pick_lat", "pick_lng"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c3851ed50ff832d6c1d789c8957e99de5d092b4e75ddc125eaf593e1db670ea"
        },
        {
          "name": "get_place_details",
          "description": "Get the exact coordinates and full address for a place using its place_id (returned from search_places). Call this after search_places to get lat/lng needed for fare estimates and booking.",
          "inputSchema": {
            "properties": {
              "place_id": {
                "description": "The Google place_id from a search_places result",
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48428c341811fd8a7315ad79420ac41307a0fb7376d2f428758c00230402f44b"
        },
        {
          "name": "get_ride_history",
          "description": "Get the user's past ride history. Returns recent completed and cancelled rides.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Number of rides to return (default 5, max 20)",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8a898bee22a881d1830ceec16d7ba1fb02b2ea0d477c2bc2b4afea2dc250588"
        },
        {
          "name": "get_route_info",
          "description": "Get driving route information between two points including distance, duration, and polyline.",
          "inputSchema": {
            "properties": {
              "drop_lat": {
                "description": "Dropoff latitude",
                "type": "number"
              },
              "drop_lng": {
                "description": "Dropoff longitude",
                "type": "number"
              },
              "pickup_lat": {
                "description": "Pickup latitude",
                "type": "number"
              },
              "pickup_lng": {
                "description": "Pickup longitude",
                "type": "number"
              }
            },
            "required": ["drop_lat", "drop_lng", "pickup_lat", "pickup_lng"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51dd9b5de828d705a1bcf3261be453aa5c7a3c4f7cd53d51143787951bbfe055"
        },
        {
          "name": "get_wallet_balance",
          "description": "Get the user's Rovv wallet balance, total added, total spent, and recent transactions.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5db80fe8029cbbadcae749c745a8106cc2a8f64746383f32ae550aa0c28685aa"
        },
        {
          "name": "search_places",
          "description": "Search for a location by name. Returns a list of matching places with addresses. Use this to find the pickup or dropoff location before booking a ride.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Optional latitude to bias results toward the user's area",
                "type": "number"
              },
              "lng": {
                "description": "Optional longitude to bias results toward the user's area",
                "type": "number"
              },
              "query": {
                "description": "The place name or address to search for, e.g. \"Lekki Phase 1\" or \"Murtala Muhammed Airport\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8dbaedb425f500b8cbea043f68e1dd9286ac433809230b18f260ceb3e157caac"
        }
      ],
      "digest": "sha256:140c1c756eb8a1229a100824cd112e5be5f396dcd4467a83d3af885ba9e87be9"
    }
  }
}
