{
  "lockfileVersion": 2,
  "subjects": {
    "app.cyberboon/hearthlog-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://homemaintain-mcp.cyberboon.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "hearthlog-planner",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HearthLog turns a short home profile into a free 12-month maintenance plan. Use generate_home_plan, then get_plan with the code. No account or private data is needed.",
      "tools": [
        {
          "name": "generate_home_plan",
          "title": "Generate a 12-month home plan",
          "description": "Create a free, anonymous 12-month home maintenance plan and get a shareable plan code. No account, email or address is collected. Plans expire after 30 days.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "age_band": {
                "default": "unknown",
                "description": "new, recent, older or unknown",
                "enum": ["new", "recent", "older", "unknown"],
                "type": "string"
              },
              "climate": {
                "default": "temperate",
                "description": "cold, temperate, hot_dry or hot_humid; ignored for office/school/other",
                "enum": ["cold", "temperate", "hot_dry", "hot_humid"],
                "type": "string"
              },
              "country": {
                "description": "Optional ISO 3166-1 alpha-2 country code",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "heating": {
                "default": "unknown",
                "description": "gas, oil, electric, heat_pump, none or unknown",
                "enum": ["gas", "oil", "electric", "heat_pump", "none", "unknown"],
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "One of the 13 supported locales",
                "enum": ["en", "tr", "de", "es", "fr", "it", "pt-BR", "pt-PT", "nl", "pl", "sv", "ja", "ko"],
                "type": "string"
              },
              "name": {
                "description": "Optional plan title shown only in the immediate response; never stored",
                "maxLength": 60,
                "type": "string"
              },
              "place_type": {
                "default": "detached",
                "description": "detached, townhouse, apartment, office, school or other",
                "enum": ["detached", "townhouse", "apartment", "office", "school", "other"],
                "type": "string"
              },
              "tenure": {
                "default": "owner",
                "description": "owner or renter",
                "enum": ["owner", "renter"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:474df9a6803ef73d0cf5b1ac8997d8bbdd1002ea923c48f1cb13b90421ed25e8"
        },
        {
          "name": "get_plan",
          "title": "Get a saved home plan",
          "description": "Read a plan by its 8-character code, optionally in any supported locale. Unknown or expired codes return a tool error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "The 8-character plan code",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "description": "Optional response locale; defaults to the plan's stored locale",
                "enum": ["en", "tr", "de", "es", "fr", "it", "pt-BR", "pt-PT", "nl", "pl", "sv", "ja", "ko"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09dbb37fa2bec56bf517fe59beb25a3fd3c0a1a4e4bdb9ec65570068b43207d5"
        },
        {
          "name": "get_planner_info",
          "title": "About the HearthLog planner",
          "description": "List supported place types, climates, locales, tools and the public plan URL pattern.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51d11c6beab4b4425bef12559c44fddab97a2254a9be619dcad190a59e5caa89"
        }
      ],
      "prompts": [
        {
          "name": "plan_my_home",
          "title": "Plan my home",
          "description": "Collect the home profile and generate a 12-month maintenance plan.",
          "arguments": [
            {
              "name": "locale",
              "description": "Preferred response locale",
              "required": false
            }
          ],
          "digest": "sha256:62627d0dda025741c5fdf45cd8a7dc16cacbe03d1600f089cdc8f63121828bec"
        }
      ],
      "digest": "sha256:1515af717524b01a692bb86d02813861a030d46ade6610f2239fff566217c687"
    }
  }
}
