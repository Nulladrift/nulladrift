{
  "lockfileVersion": 2,
  "subjects": {
    "com.catchui/ui-patterns": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://catchui.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "catchui",
        "title": "CatchUI",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CatchUI (https://catchui.com) is a curated bilingual (English / 简体中文) catalog of 98 UI design patterns, including the phone and computer system UI around apps: conventional names, definitions, aliases, real search questions with answers, component names per platform, and implementation prompts.\nsearch_ui_patterns finds patterns from a plain-language description or question; get_ui_pattern returns one full entry by id; list_ui_patterns lists the catalog; compare_ui_patterns explains how two to four patterns differ; get_ui_component_names maps a pattern or a framework component (e.g. UISegmentedControl) to its names in SwiftUI, UIKit, Jetpack Compose, Android Views, Flutter and HTML; get_implementation_prompt returns ready-to-use build instructions for one or more patterns.\nEvery result carries the canonical catalog URL of each entry (https://catchui.com/catalog/<id>). All tools are read-only lookups of public data.",
      "tools": [
        {
          "name": "compare_ui_patterns",
          "title": "Compare UI patterns",
          "description": "Explains how 2 to 4 easily confused UI patterns differ — e.g. toast vs snackbar, modal vs popover vs bottom sheet, tabs vs segmented control, Dynamic Island vs notch. Returns each definition side by side plus the catalog's written comparison when one exists. Accepts ids, names or short descriptions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "patterns": {
                "description": "2 to 4 CatchUI pattern ids, names or short descriptions, e.g. [\"modal\", \"popover\"] or [\"tabs\", \"segmented control\"].",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["patterns"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare UI patterns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7dc7452f7618bc5643514bc946427751e187d54823d5d3811139b7f02a77fc5"
        },
        {
          "name": "get_implementation_prompt",
          "title": "Get implementation prompts",
          "description": "Returns CatchUI's ready-to-use implementation instructions for 1 to 6 UI patterns — what to build, where it sits, its states and the accessibility it needs — in English or Chinese, for pasting into an AI coding tool such as Claude Code or Cursor. Accepts ids, names or short descriptions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the prompts: \"en\" (English) or \"zh\" (简体中文).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "patterns": {
                "description": "1 to 6 CatchUI pattern ids, names or short descriptions, e.g. [\"tabs\"] or [\"search field\", \"filter chips\", \"pagination\"].",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["patterns"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get implementation prompts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:44cf6299ed2849a6069cad393f7baab936fc639b7873674cfc9b6397926f1844"
        },
        {
          "name": "get_ui_component_names",
          "title": "Get component names across platforms",
          "description": "Returns what a UI pattern is called in code on each platform — SwiftUI, UIKit, Jetpack Compose, Android Views, Flutter, HTML/ARIA and, for system UI, AppKit, Win32 and Electron — or works backwards from a framework component (e.g. \"UISegmentedControl\", \"ModalBottomSheet\", \"role=tablist\") to the pattern and its equivalents elsewhere. Optionally filtered to one platform. Platforms without a native component say so instead of naming one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "Optional platform filter, matched against the platform label: e.g. \"SwiftUI\", \"UIKit\", \"Compose\", \"Android\", \"Flutter\", \"Web\".",
                "type": "string"
              },
              "query": {
                "description": "A pattern id, name or description (\"segmented control\"), or a framework component name (\"UISegmentedControl\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get component names across platforms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:990283e7130f85ab5a9084991d45865f8fbb9a8c1e22e2cfbe76dc94797ebd0d"
        },
        {
          "name": "get_ui_pattern",
          "title": "Get one UI pattern entry",
          "description": "Returns the full CatchUI entry for one UI pattern by id (e.g. \"tabbar\", \"bottomsheet\"): definition in English and Chinese, pronunciation, aliases, how people describe it, component names per platform, an implementation prompt, real search questions with answers, related patterns and the catalog URL. Takes an id; search_ui_patterns finds ids from descriptions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "CatchUI pattern id, e.g. \"tabbar\". list_ui_patterns lists every id.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one UI pattern entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17c6a0418a94478469a9702b421e226d563aae61eb74108e0dd2eb365a59119f"
        },
        {
          "name": "list_ui_patterns",
          "title": "List the UI pattern catalog",
          "description": "Lists the 98 UI patterns in CatchUI's curated catalog — ids, English and Chinese names and one-line definitions — grouped by family, optionally filtered to one family (NAV, INPUT, ACTION, OVERLAY, FEEDBACK, CONTENT, DATA, SYSTEM).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "Only list patterns in this family.",
                "enum": ["NAV", "INPUT", "ACTION", "OVERLAY", "FEEDBACK", "CONTENT", "DATA", "SYSTEM"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the UI pattern catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50bb24dd9b99a78d3e956c64ce86cd074c9971ef57526097c1e87d255ffd89a0"
        },
        {
          "name": "search_ui_patterns",
          "title": "Search UI patterns by description",
          "description": "Finds the conventional name of a UI element or design pattern from a plain-language description, question or term — e.g. \"the bar at the bottom of an app\", \"three horizontal lines icon\", \"the black bar at the top of iPhone\", \"汉堡菜单\". Searches CatchUI's curated catalog of 98 patterns and returns names in English and Chinese, definitions, the best-matching Q&A and each entry's catalog URL. Use when someone asks what a UI element is called or what a UI/UX term means.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of matches to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Description, question, or name of a UI element, in English or Chinese.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search UI patterns by description"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07292c9efb446cfe475efce444a4cfc3d12752b9c514e412f9d4c02ca0c4a33f"
        }
      ],
      "digest": "sha256:dcbf7916fbf60f51017a1ee520897a6422194928073800b7a4808a29e235becd"
    }
  }
}
