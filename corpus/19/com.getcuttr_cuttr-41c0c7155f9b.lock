      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "cuttr",
        "title": "Cuttr AI Video Editing",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cuttr AI Video Editing: video editors for reels, YouTube and carousels. When the user asks for any video, reel, caption, YouTube or carousel work in their own words, call get_skill with {\"slug\": \"director\"} and follow it: it picks the right editor. If they name an editor, call get_skill with its slug directly. Follow the returned instructions exactly, including the \"Cuttr memory\" steps at the end (get_profile before, log_video after). Call list_skills to see every editor. When something is not installed or fails, call doctor; if it still fails, call report_problem. When the user says \"Run the Cuttr test\" (or \"cuttr test\"), call get_skill with {\"slug\": \"cuttr-test\"} and follow it.",
      "tools": [
        {
          "name": "add_video_link",
          "title": "Add a posted video's link",
          "description": "When the member pastes the Instagram, TikTok or YouTube link of a video they posted, record it. Cuttr reads its public view count after 1, 7 and 30 days. Without video_id it attaches to their latest video that has no link yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "type": "string"
              },
              "video_id": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5aeb188ab858e231deb79459b7eac91f6fdbb2ffd33667d18a8fab879c309a1"
        },
        {
          "name": "doctor",
          "title": "Check the setup",
          "description": "A checklist to run on this computer for Cuttr skills (ffmpeg, Python, Node, Whisper, connectors), with the fix for each missing piece. Pass a slug to check only what that skill needs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:88b6d62d495baa6223ac3e535927503ff0232dc27c0f3363a2259938f0e34af2"
        },
        {
          "name": "forget",
          "title": "Forget a style preference",
          "description": "Deletes one saved style note by its id (ids are in get_profile). Use when the member says a preference no longer applies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdcd52bd968303b6161a8a211a01554aa810f6b4bd934955054ae173b50bf455"
        },
        {
          "name": "get_bundle",
          "title": "Get a skill's scripts",
          "description": "A download link (valid 15 minutes) for a skill's scripts and templates as a zip. Only call it when the skill's instructions say to. Download with curl and unzip where the instructions say.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:997516d561fc7fdb1ab18680993de13486c1f75ffbd07dab5204801c606aee37"
        },
        {
          "name": "get_profile",
          "title": "What Cuttr has learned about this member",
          "description": "This member's saved style notes, how their own posted videos did against their usual views (winners and misses), and their niche. Call it before planning any edit and apply it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25aab0941055908386b06e675abc03966c7a2da711b1cf6bf605464b1d0d1ea9"
        },
        {
          "name": "get_skill",
          "title": "Get a skill's instructions",
          "description": "The current full instructions for one Cuttr skill. Follow them exactly, as if they were the skill file. Call this every time the skill runs: it is always the latest version.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The skill's slug, e.g. remake-any-reel",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3cf4f32ddeec718568bedc09e896af295c5aee1fef7b30aaa4bd668e315353c8"
        },
        {
          "name": "list_skills",
          "title": "List Cuttr skills",
          "description": "Every editor in Cuttr AI Video Editing: slug, name, what it makes, what it needs, and whether this member has it unlocked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:70a7f687f92966bfbf53e29561d66a7723e26f94249a19593aecbec8e1c41ab4"
        },
        {
          "name": "log_video",
          "title": "Log a finished video",
          "description": "Call once after handing over a finished video. Records which editor made it, its hook and look, so Cuttr can learn from how it does once it is posted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hook": {
                "description": "The opening line or on-screen hook",
                "type": "string"
              },
              "length_s": {
                "description": "Length in seconds",
                "type": "number"
              },
              "platform": {
                "enum": ["instagram", "tiktok", "youtube", "facebook", "other"],
                "type": "string"
              },
              "run_id": {
                "description": "The run_id given at the end of the editor's instructions",
                "type": "string"
              },
              "slug": {
                "description": "The editor's slug",
                "type": "string"
              },
              "style": {
                "description": "The look in a few words, e.g. bold captions, punch-ins, animated lists",
                "type": "string"
              },
              "title": {
                "description": "What the video is about, a few words",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5da21927a5f05863df13ac44a7886ab7353bf93dbf3fb115e419196e62cb0977"
        },
        {
          "name": "rate_video",
          "title": "Record how a video turned out",
          "description": "When log_video asks you to: the member's 1 to 5 answer to \"How did this video turn out?\", with their words. A low score reaches the Cuttr team, who help them the same day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "comment": {
                "description": "What they said about it, in their words",
                "type": "string"
              },
              "score": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "video_id": {
                "type": "string"
              }
            },
            "required": ["score", "video_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fdcfb143dd1a90a1c665cce16af77fe973646a084bb87ec334bddd84d4032a7d"
        },
        {
          "name": "remember",
          "title": "Remember a style preference",
          "description": "Saves one lasting preference of this member (e.g. \"captions always bigger\", \"never black and white\") so every future edit applies it. One short line. Not for one-off notes about a single video.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "note": {
                "description": "The preference in one short line, in plain words",
                "type": "string"
              },
              "slug": {
                "description": "The editor it came from, if any",
                "type": "string"
              },
              "source": {
                "description": "import = copied from ~/.cuttr/BRAND.md",
                "enum": ["editor", "import"],
                "type": "string"
              }
            },
            "required": ["note"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b6b190d6576ed9a2358d99770aaa4dc8a299ed5fc440b9c538ca4f1b0a5120c"
        },
        {
          "name": "report_problem",
          "title": "Report a problem to Cuttr AI",
          "description": "Sends a problem to the Cuttr AI team, who reply by email. Include the exact error text and the step that failed. Never include API keys, passwords or tokens.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "error": {
                "description": "The exact error text",
                "type": "string"
              },
              "run_id": {
                "description": "The run_id given at the end of the editor's instructions, if any",
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "step": {
                "description": "Which step of the skill failed",
                "type": "string"
              },
              "summary": {
                "description": "One line: what went wrong",
                "type": "string"
              },
              "system": {
                "description": "OS, tool (Claude Code, Codex, Claude app) and versions",
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:202f752173b957b9fc3cbf1350772a2a2af0579fc00a69292125ceb0821ac44e"
        },
        {
          "name": "set_niche",
          "title": "Set what their videos are about",
          "description": "Saves the member's niche. One of: business (Business and marketing), ai-tech (AI and tech), coaching (Coaching and personal growth), health (Health and wellness), fitness (Fitness), beauty-fashion (Beauty and fashion), food (Food and cooking), parenting (Parenting and family), money (Money and finance), travel-lifestyle (Travel and lifestyle), education (Education and how-to), entertainment (Comedy and entertainment), other (Something else).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "niche": {
                "enum": ["business", "ai-tech", "coaching", "health", "fitness", "beauty-fashion", "food", "parenting", "money", "travel-lifestyle", "education", "entertainment", "other"],
                "type": "string"
              }
