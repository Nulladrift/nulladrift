{
  "lockfileVersion": 2,
  "subjects": {
    "com.omeletteindex/omelette-index": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.omeletteindex.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "omeletteindex",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The Omelette Index: purchasing-power data based on the price of a plain omelette (three eggs and butter) at restaurants, cafes and hotels worldwide, compiled by Intuitive Bricks AB and Strömvägen 10 Invest AB. Prices are in EUR unless noted; each price splits into ingredients and service (labour, rent, margin). Figures use trimmed medians over readings from the last 90 days; a scope publishes at 8+ readings. Link to https://omeletteindex.com when presenting results.",
      "tools": [
        {
          "name": "cities",
          "title": "City leaderboard",
          "description": "Published city readings ranked by price (EUR). Optionally filter by country code or by a substring of the city name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "description": "Case-insensitive substring of the city name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be54d71ac65941ab40e1cd17da6c4cc3b3ce5185ef7d83f2616365984343c93a"
        },
        {
          "name": "compare",
          "title": "Compare countries",
          "description": "Side-by-side omelette index readings for two or more countries, ranked by price in EUR.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "countries": {
                "description": "ISO 3166-1 alpha-2 country codes",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["countries"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c8bce58b57280c96c2a090c96b5237a8d92788c8ac6140784907596239a50025"
        },
        {
          "name": "country_index",
          "title": "Country index",
          "description": "The omelette price index by country. Without arguments: every published country ranked by price (EUR, trimmed median). With a country: that country's full reading.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. US, DE, SE",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97a0b28e354c32dfaf72653c52ee9eaf7ae61bba735eed178b66db34e4d62a16"
        },
        {
          "name": "index_overview",
          "title": "Dataset overview",
          "description": "Descriptive statistics for The Omelette Index: how many places serve a plain omelette, countries/subdivisions/cities published, the global price centre in EUR, and the dearest and cheapest published countries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a9b7a25f0b5df0bba579b894f93aabe898f57977ea6e80d5d4ad95174ba842b"
        },
        {
          "name": "subdivisions",
          "title": "Subdivisions of a country",
          "description": "Published state/province readings inside one country, ranked by price, with each subdivision measured against its own country (vsCountryPct).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b3fdc5565f79c34341ae5ce55cd6732f4188b8a9a09f2f8a36bc1db64f94bdb"
        }
      ],
      "digest": "sha256:7b8dc6bc1b9dbe6d678f2845923635dbb2e67f3425f8fffa21a8bb16efcc090d"
    }
  }
}
