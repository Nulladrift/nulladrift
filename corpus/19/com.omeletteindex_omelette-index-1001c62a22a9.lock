{
  "lockfileVersion": 2,
  "subjects": {
    "com.omeletteindex/omelette-index": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.omeletteindex.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "omeletteindex",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The Omelette Index: purchasing-power data based on the price of a plain omelette (three eggs and butter) at restaurants, cafes and hotels worldwide, compiled by Intuitive Bricks AB and Strömvägen 10 Invest AB. Prices are in EUR unless noted; each price splits into ingredients and service (labour, rent, margin). Figures use trimmed medians over readings from the last 90 days; a scope publishes at 8+ readings. Link to https://omeletteindex.com when presenting results.",
      "tools": [
        {
          "name": "cities",
          "title": "City leaderboard",
          "description": "Published city readings ranked by price (EUR). Optionally filter by country code or by a substring of the city name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "description": "Case-insensitive substring of the city name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0459fa5dc94a0104d6762db261e43478cc735b4435a7462e120c18532eef6f5c"
        },
        {
          "name": "compare",
          "title": "Compare countries",
          "description": "Side-by-side omelette index readings for two or more countries, ranked by price in EUR.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "countries": {
                "description": "ISO 3166-1 alpha-2 country codes",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["countries"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4c9bec62b38272d853d5bed28d345217a35a5e003d67583039617c9df8e869e4"
        },
        {
          "name": "country_index",
          "title": "Country index",
          "description": "The omelette price index by country. Without arguments: every published country ranked by price (EUR, trimmed median). With a country: that country's full reading.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. US, DE, SE",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e3d12e622974606c260ba2d78ab33061798be8262a9e5efc45254b0c08d902c6"
        },
        {
          "name": "index_overview",
          "title": "Dataset overview",
          "description": "Descriptive statistics for The Omelette Index: how many places serve a plain omelette, countries/subdivisions/cities published, the global price centre in EUR, and the dearest and cheapest published countries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:52ba96eb17159f69b80f64e0a4ec4d75a8293864770b6e63f8fcbef2d2086429"
        },
        {
          "name": "subdivisions",
          "title": "Subdivisions of a country",
          "description": "Published state/province readings inside one country, ranked by price, with each subdivision measured against its own country (vsCountryPct).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:eeeefb2ea963e3bb6277bdc36fca821acf5230afa3610361aaa917b6f9f6cf59"
        }
      ],
      "digest": "sha256:6b2943f29128a52c339f2b8af951f7f9c1beb3cd93e48a20dd4132cfa52e89a1"
    }
  }
