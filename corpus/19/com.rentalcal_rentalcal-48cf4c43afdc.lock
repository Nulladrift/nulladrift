{
  "lockfileVersion": 2,
  "subjects": {
    "com.rentalcal/rentalcal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.rentalcal.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rentalcal",
        "title": "RentalCal",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RentalCal hosts are independent vacation-rental owners who take bookings on their own booking sites, or through the RentalCal booking widget on a website they already have. Start with find_property using the address the traveller gives: a booking site (for example beach-house.rentalcal.com or the host's own domain) or the page on the host's website that has the booking widget. If find_property returns candidates, one website hosts several properties: ask the traveller which, then use get_property with that propertyId. Use check_availability for open dates and get_quote to price a specific stay. Babies and young children: where get_property returns infants as an object, children under its freeUnderAge go in get_quote's infants and stay free; where infants is null, count them in guests. Amounts are integer minor units (cents) in the property's currency. These tools never make a booking. To book, give the traveller the bookingUrl from get_quote; they review the stay and pay on the host's page.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Booked nights and the open date ranges a stay can actually be booked in, with minimum-stay rules applied. bookableFrom is the first check-in a request made now may ask for (later than today when the host requires notice before check-in). bookableUntil is the first night the host's booking window has not opened yet (24 months from today when the host has not set one); nights after it are not open rather than taken. The listing's maxNights is the longest stay a quote accepts. Defaults to the next 90 days; at most 365 days per call. Ranges are check-in inclusive, check-out exclusive.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First date to check, YYYY-MM-DD. Defaults to today.",
                "type": "string"
              },
              "propertyId": {
                "description": "A RentalCal property id.",
                "type": "string"
              },
              "to": {
                "description": "Day after the last date to check, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["propertyId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03e64f91a949471380abd96c28746d0bb92d1e992ed00b0daf77afe7c5be1a0c"
        },
        {
          "name": "find_property",
          "title": "Find a RentalCal property",
          "description": "Look up a vacation rental by its RentalCal booking site, or by the page on the host's own website where their RentalCal booking widget is installed. Accepts a site address such as beach-house.rentalcal.com, a full URL, the bare site name, or the host's own domain. Returns the listing: description, location, capacity, amenities, house rules, photos, nightly pricing, cancellation policy, payment schedule, damage deposit, the host's FAQ, and the property id. When one website hosts several properties, returns those candidates instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "site": {
                "description": "The booking site's address or URL, e.g. beach-house.rentalcal.com, or the address of the host's own page with the booking widget on it.",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a RentalCal property"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bbb6cb7377e753561bd999d0f585f5a37f1b8f9d0582f0977db08e426451b94b"
        },
        {
          "name": "get_property",
          "title": "Get property details",
          "description": "The full listing for a property id: description, location, check-in and check-out times, capacity, pets, amenities, house rules, photos, nightly pricing and fees, cancellation policy, payment schedule, damage deposit, and the host's FAQ. Amounts are integer cents in the property's currency.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "propertyId": {
                "description": "A RentalCal property id.",
                "type": "string"
              }
            },
            "required": ["propertyId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get property details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5bf4976a1dd04594d61cc11b556a8d3bb3d750d1dae63ca531327c165c24aaf5"
        },
        {
          "name": "get_quote",
          "title": "Price a stay",
          "description": "The exact price of a stay: nightly rates, discounts, cleaning and other fees, taxes and total, in integer cents, plus any refundable damage deposit the host requires and whether it is held at booking. Returns a bookingUrl that opens the host's booking page with these dates and guests filled in, where the traveller completes the booking. If the stay is not allowed (dates taken, below the minimum stay, too many guests) the reason is returned instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkIn": {
                "description": "Arrival date, YYYY-MM-DD.",
                "type": "string"
              },
              "checkOut": {
                "description": "Departure date, YYYY-MM-DD.",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests, not counting pets or infants. Where the listing's infants is null, count babies here.",
                "minimum": 1,
                "type": "integer"
              },
              "infants": {
                "description": "Children under the listing's infants.freeUnderAge. Free, and outside maxGuests. Only where the listing's infants is not null; leave out otherwise.",
                "minimum": 0,
                "type": "integer"
              },
              "pets": {
                "description": "Number of pets.",
                "minimum": 0,
                "type": "integer"
              },
              "propertyId": {
                "description": "A RentalCal property id.",
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "guests", "propertyId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price a stay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0071178d43b91c782850ea6a7a977056f7f391a44d844885db2e0a6d34574536"
        }
      ],
      "digest": "sha256:1e6c3b5b43f4b473c851fd84cb2087bda789cc13289015a0e6618e5cf59705cc"
    }
  }
}
