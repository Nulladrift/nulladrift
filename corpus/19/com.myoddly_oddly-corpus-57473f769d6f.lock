{
  "lockfileVersion": 2,
  "subjects": {
    "com.myoddly/oddly-corpus": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://myoddly.com/api/public/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "oddly",
        "title": "oddly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "oddly is the world, on the record. The record_* tools read the record: a subject's history with both clocks (when the source says it was true and when oddly looked), one question answered with its receipt, and any receipt verified end to end. The benchmark_* and store_audit tools read the observed commerce corpus: real listing prices and assortment shape crawled from public storefronts, aggregated by category and market. Every figure is a MARKET REFERENCE with its sample size and scope attached, never a target, a forecast, or advice. Quote the scope with the number. The corpus holds observed public listing data only: it does not contain conversion rates, revenue, or any store's private analytics.",
      "tools": [
        {
          "name": "benchmark_categories",
          "title": "List covered categories",
          "description": "List the product categories the oddly corpus currently covers, with how many observations and metrics back each one. Call this FIRST to discover valid category paths before calling benchmark_lookup, rather than guessing a path.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List covered categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e56fc813257fbe98b6e7e677c491f139e6acd81ad18c581f1cd987d8c109ee89"
        },
        {
          "name": "benchmark_lookup",
          "title": "Look up observed category benchmarks",
          "description": "Observed price and assortment benchmarks for a product category: the median and the p25-p75 band across real public storefront listings, with the sample size, the currency, and the exact scope of each figure. Figures are observed market reference, not targets or advice. Returns an honest empty answer when a category has too little data to serve; it never estimates or fills a gap. This corpus does NOT hold conversion rates, revenue, or AOV, so do not ask it for those.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category path, e.g. 'commerce/baby/clothing'. Use benchmark_categories to list valid paths.",
                "type": "string"
              },
              "market": {
                "description": "Optional ISO 3166-1 alpha-2 market filter, e.g. 'NZ', 'US'. Omit for the all-markets aggregate.",
                "type": "string"
              },
              "metric": {
                "description": "Optional metric filter, e.g. 'price.romper'. Omit to get every servable metric for the category.",
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up observed category benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa63ce4a378f97a78445b527c5db5b52bd15125f194b7d5083706eefa51efe49"
        },
        {
          "name": "record_answer",
          "title": "One question answered from the record",
          "description": "Answer one question from oddly's record: the newest observed value of one attribute of one subject, with its figure, both clocks, its source, its receipt and its scope. The figure is what the source published when oddly looked, not an estimate, a forecast or advice. Rate: meter data.answer, US$0.001 per answer, first 100 per month free. An unanswered question (a subject or attribute the record has not observed) is never metered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attribute": {
                "description": "The attribute to answer, exactly as record_subject_history lists it.",
                "type": "string"
              },
              "subject_key": {
                "description": "The subject key exactly as the record prints it on /record/subject?key=..., e.g. 'benchmark-cell:commerce/baby/clothing|SG|*|local|*|*'.",
                "type": "string"
              }
            },
            "required": ["attribute", "subject_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One question answered from the record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f81ac306ea43d9cdfe4a93c2cd0fc1e364d5be5d9cbad65910e007bb6f2ebf5a"
        },
        {
          "name": "record_subject_history",
          "title": "A subject's history on the record",
          "description": "One subject's change history and current state from oddly's record, with both clocks on every row: observed_at (when the source says it was true) and fetched_at (when oddly looked), and the receipt hash of each row so any value can be checked with record_verify_receipt. Rate: meter data.history, US$0, attribution required (cite oddly and the subject). Returns an honest empty answer for a subject the record has never observed, which is never metered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "subject_key": {
                "description": "The subject key exactly as the record prints it on /record/subject?key=..., e.g. 'benchmark-cell:commerce/baby/clothing|SG|*|local|*|*'.",
                "type": "string"
              }
            },
            "required": ["subject_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A subject's history on the record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3700d413993392713cc82cc8067ddf4cae6b07591c648c66e889eb05a6e1566"
        },
        {
          "name": "record_verify_receipt",
          "title": "Verify a receipt against the record",
          "description": "Recompute and check one receipt end to end: the row's receipt hash recomputed from its own sealed document, the link to the row before it, the day root its day folds into, and that root's anchor state (confirmed with a block height, or pending). Every check is named in the verdict, and a check that could not run says so rather than passing. Rate: never metered (verification is on the price book's never_metered list).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "receipt_hash": {
                "description": "The 64-character hex receipt hash, as printed on a receipt or returned by the other record tools.",
                "type": "string"
              }
            },
            "required": ["receipt_hash"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a receipt against the record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c797b8272071bdf7d48e39efa21005dae2e949e5b2da5c2ce71de95d0e79ace"
        },
        {
          "name": "store_audit",
          "title": "Audit a public storefront",
          "description": "Run oddly's free storefront audit against a public ecommerce domain and return the findings: detected platform, the checks that failed, and how the store's catalogue compares to observed category norms where the corpus can say. Reads the store's own public pages only, obeys robots.txt, and is rate limited. Use the bare domain (example.com). Never pass an internal host or an IP address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The storefront domain or URL to audit, e.g. 'example.com'.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit a public storefront"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:38d25d1e3f24bb7102792aabe86bc3bb1c077fa846c20b3cc954da19fd6fe0f9"
        }
      ],
      "digest": "sha256:f973679bc70469f3ddaa69c9b97aa99abe21b04b51042c0ffcdc49ce2a191890"
    }
  }
}
