      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "PayPerFax",
        "version": "1.0.0",
        "icons": [
          {
            "src": "https://fax.payperfax.com/mcp-icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PayPerFax sends one fax for one payment: no account and no subscription. Use create_fax to prepare a fax. It returns a link, and the person pays in the browser before anything is sent. Use get_fax_status to read where a fax is. Use list_supported_formats for the input types and the limits. A common use is a fax to the IRS: take the fax number from irs.gov, and show the person the source.",
      "tools": [
        {
          "name": "create_fax",
          "title": "Create a fax",
          "description": "Prepare a fax for a person to send with PayPerFax, the pay-per-fax service: no account, no subscription, one payment for one fax. A common use is a letter or a form for the IRS, a doctor, a court, an insurer or a landlord.\n\nThe tool does not send the fax and does not charge. It returns a link for the person. The person opens the link, sees the preview and the price, and pays in the browser. Then the fax is sent.\n\nRules:\n1. Email: ask the person for their email address. Do not guess it. The confirmation and the receipt go there.\n2. A document that the person has as a file (a PDF, a scan, a signed form): do not retype it as text. A typed copy of a signed form is not the form. Set file_expected to true, and tell the person that they add the file on the page of the link.\n3. The fax number of an agency or a company: take it from its official website (for the IRS: irs.gov), and show the person the source. A number from memory can send private papers to a stranger.\n4. A letter that you write goes in markdown. With no cover page, the letter must have its own date, names and address block. With a cover page, keep cover_message short: a long message is cut off.\n5. Limits: the markdown text can be at most 100 KB. Headings, lists, bold text and tables are printed. An image is printed as its alt text, a link as its text, and raw HTML as text.\n6. If you can run shell commands and the document is a local file, send it with the HTTP call: curl -F \"to=+14155550101\" -F \"email=person@example.com\" -F \"documents[]=@/path/to/file.pdf\" https://fax.payperfax.com/api/fax\n7. After the call, give the person the link, and say that nothing is sent and nothing is charged before they pay. The confirmation email comes after the payment. If the status of the fax is later \"failed\", the person is not charged, and can send the fax again.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "The person's country as a two-letter code (ISO 3166-1 alpha-2), for example US, DE, GB or JP. It sets the currency of the price, and the date format on the cover page and in the emails. Without it, the price is in US dollars, and the dates have the US format.",
                "type": "string"
              },
              "cover_message": {
                "description": "A short note on the cover page, as plain text, at most 5000 characters. Only with cover_page.",
                "type": "string"
              },
              "cover_page": {
                "description": "true to put a cover page before the document. The default is no cover page.",
                "type": "boolean"
              },
              "email": {
                "description": "The person's email address, for the confirmation and the receipt. Ask the person; do not guess. Required when you send markdown or a cover page.",
                "type": "string"
              },
              "file_expected": {
                "description": "true when the person must still add a file (a PDF, a scan, a signed form). Then the link opens a form with what you sent, and the person adds the file there.",
                "type": "boolean"
              },
              "language": {
                "description": "The language of the pages that the person sees, and of the emails. The default is en.",
                "enum": ["en", "es", "de", "ja", "ko", "fr", "it", "zh-tw"],
                "type": "string"
              },
              "markdown": {
                "description": "The document as Markdown text that you wrote, for example a letter. Leave it out when the person has the document as a file.",
                "type": "string"
              },
              "recipient_company": {
                "description": "The recipient's company or agency on the cover page. Only with cover_page. At most 100 characters.",
                "type": "string"
              },
              "recipient_name": {
                "description": "The recipient's name on the cover page. Only with cover_page. At most 100 characters.",
                "type": "string"
              },
              "sender_name": {
                "description": "The sender's name on the cover page. Only with cover_page. At most 100 characters.",
                "type": "string"
              },
              "show_sender_email": {
                "description": "true to show the person's email address on the cover page, so the recipient can reply. Only with cover_page.",
                "type": "boolean"
              },
              "timezone": {
                "description": "The person's time zone as an IANA name, for example America/New_York. Without it, times are shown in UTC.",
                "type": "string"
              },
              "to": {
                "description": "The fax number in international format: \"+\", the country code, the number. Example: +14155550101.",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Create a fax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:146b6fbe1aad346be0e48b40e394acec3caac6ae2b3bee77a6744004e935f730"
        },
        {
          "name": "get_fax_status",
          "title": "Get the status of a fax",
          "description": "Read where a fax is. Give the id from create_fax, or an address of the fax: the status address from the tracking prompt of the person, or the address of a page of the fax. \"status\" is pending, delivered, failed or expired. While it is pending, \"stage\" says more: rendering (we prepare the pages), awaiting_payment (the person did not pay yet; \"pages\" and \"price\" are given, and they can still change), sending (paid, on its way). delivered: the fax arrived. failed: the fax was not delivered, the person is not charged, and can send it again; with \"render_failed\", the document could not be prepared, and the person opens the link to change it. expired: the fax was not paid in time, or it is no longer available. Do not call this in a loop: read the status when the person asks.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The id of the fax, or an address of the fax: its status address (https://.../api/fax/{id}/status), or the address of its preview, payment or confirmation page.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get the status of a fax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:71a725501ab2ae8dfef6dfa1a077619a1ae9499f28018814793e6e0e69289295"
        },
        {
          "name": "list_supported_formats",
          "title": "List the supported formats",
          "description": "List what PayPerFax can fax, and the limits: the text that create_fax takes, the file types that a person can add on the form or that a shell can send to the HTTP call, the sizes, and the languages.",
          "inputSchema": {
