{
  "lockfileVersion": 2,
  "subjects": {
    "com.manifoldbt/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.manifoldbt.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "manifoldbt_docs",
        "version": "1.29.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Reference documentation for the manifoldbt backtesting library. CONSULT THIS BEFORE WRITING ANY manifoldbt CODE OR DSL EXPRESSION, and whenever the engine returns an error: the DSL has its own rules, and code written from memory breaks on them one compiler error at a time. Call list_topics FIRST: it returns a complete runnable script to adapt, which answers most questions before they are asked; search_docs for the rest. Everything here documents manifoldbt 0.34.0; if the user has an older version installed, tell them to upgrade rather than working around it. This server only reads documentation -- it holds no engine and no market data, so it cannot compile, validate or backtest anything. Backtests run on your own machine: pip install manifoldbt, against the user's own data store.",
      "tools": [
        {
          "name": "explain_error",
          "description": "Explain an error returned by the manifoldbt engine: what it means, what caused it, and how to fix it. Paste the message verbatim. Use this before changing code in response to an engine error -- these messages name a rule rather than the mistake, and guessing wastes a round trip.",
          "inputSchema": {
            "properties": {
              "message": {
                "title": "Message",
                "type": "string"
              }
            },
            "required": ["message"],
            "title": "explain_errorArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "explain_errorDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e113458aa51625182aa9cab4f5e28288d2149c1348febcdf2bd9fe7cdf52f79"
        },
        {
          "name": "get_capabilities",
          "description": "Which manifoldbt version this documentation covers, and which of the THREE licence tiers each feature needs. Check before writing code around sweeps, walk-forward, cross-exchange, the GPU or the tick layer: the first three refuse on Community, the last two on anything below Researcher -- and the two Researcher gates raise different exception types.",
          "inputSchema": {
            "properties": {},
            "title": "get_capabilitiesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_capabilitiesDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f5defbef59653dfb96c57d634ff9bb26660cc778e80fdc45d8eb96c5f939d9a4"
        },
        {
          "name": "list_topics",
          "description": "START HERE. Returns a complete, runnable backtest script (open a store, strategy, config, fees, run, read the metrics) plus the stateful-band, bracket-exit, higher-timeframe and cross-asset variants -- then the list of rules the engine enforces and of what a fill actually does (which fee a stop pays, where a gapped bracket fills, what a reversal counts as). One call replaces the eight searches every first script otherwise needs.",
          "inputSchema": {
            "properties": {},
            "title": "list_topicsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "list_topicsDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43d41bcd36f15d98d96f9ee43b959a2045af5bcc1b032ddf41b3227a8dc73be1"
        },
        {
          "name": "search_docs",
          "description": "Search the manifoldbt documentation: DSL rules and pitfalls, indicator and API signatures, config fields, execution semantics (which price a stop or target fills at, which fee each fill pays, what a reversal counts as, which ddof an indicator uses), how to read result metrics honestly, and worked examples. Ask in natural language ('how do I reference another symbol', 'what happens when a bar gaps through my stop', 'is this Sharpe meaningful') or by name ('symbol_ref', 'warmup_bars'). Pass a result's exact title to read that chunk again. A chunk already sent in this session is not sent again.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_docsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_docsDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86ed6889834baf933313e116c8d6a52ee279fcd03d12708d2380a468a5cca0b7"
        }
      ],
      "resources": [
        {
          "uri": "manifoldbt://reference/pitfalls",
          "name": "pitfalls_doc",
          "description": "Every DSL and config rule whose violation the engine refuses.",
          "mimeType": "text/plain",
          "digest": "sha256:d28236d1e0db8130531e7d22aa7bc67b435415a5e7515c6749d60403301cdfd2"
