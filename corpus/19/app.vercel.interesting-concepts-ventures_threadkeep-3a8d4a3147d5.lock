          },
          "digest": "sha256:97a580191f491e8f562bf371913405e086057ab1e2e2446125fbbade3e02704f"
        },
        {
          "name": "threadkeep_plans",
          "title": "Compare Threadkeep plans",
          "description": "Public Free and Pro pricing and allowances. No account or purchase. Use to explain whether durable task memory fits the user’s work.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62345c5da1bf98247224900ade26c65be1e89f40689db220cebed654eeb0bee1"
        },
        {
          "name": "threadkeep_register",
          "title": "Start a free agent workspace",
          "description": "Create a free workspace only when the user has authorized external storage and the published terms. Generate and securely persist both keys before this call; reuse them on retries. Does not buy anything. Configure the returned header in the host and reconnect. Never store keys in checkpoints.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "accept_terms": {
                "const": true,
                "type": "boolean"
              },
              "agent_key": {
                "pattern": "^ta_[a-f0-9]{64}$",
                "type": "string"
              },
              "label": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "owner_key": {
                "pattern": "^tk_[a-f0-9]{64}$",
                "type": "string"
              },
              "task_scope": {
                "pattern": "^[a-z0-9][a-z0-9_-]{0,79}$",
                "type": "string"
              }
            },
            "required": ["accept_terms", "agent_key", "owner_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:645bcf4daf50d799a0e2906f575d3ac4d69eb4ce897a1e16ebeb9ebde4c306bd"
        },
        {
          "name": "threadkeep_request_upgrade",
          "title": "Prepare a Pro approval link",
          "description": "After discussing need and the $12/month recurring cost with the user, create a private, two-hour payment approval link for this workspace. No charge or subscription occurs. Share the link only with the owner. They review the price, confirm recovery access and pay in Stripe. Never repeatedly prompt after a refusal.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
