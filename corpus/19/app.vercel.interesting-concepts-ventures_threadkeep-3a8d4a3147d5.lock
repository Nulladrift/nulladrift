          },
          "digest": "sha256:ae72976cebd8dc6c4937b89c81af1534b4964d583add798f96e73bf98fa0a90f"
        },
        {
          "name": "threadkeep_usage",
          "title": "Check plan and remaining capacity",
          "description": "Read actual plan and checkpoint usage. Does not consume a checkpoint write. Verify plan=pro after the user pays before resuming a blocked save.",
          "inputSchema": {
