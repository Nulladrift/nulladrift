      "serverInfo": {
        "name": "pawmultiverse-poison-directory",
        "title": "Paw Multiverse veterinary poison service directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "A directory of veterinary poison control services by country, read from each operating body's own website on 11 August 2026. Use it to give someone the right phone number, hours and fee for their country. Several national poison centres state in writing that they do NOT answer questions about animals; for those countries this returns the refusal, and the correct advice is to contact a veterinarian. This server contains contact details only: no veterinary advice, no doses, no toxicity thresholds and no treatment guidance. Do not use it to answer whether a substance is dangerous or in what quantity. If someone describes a poisoned animal, give them the number and tell them to call a vet.",
      "tools": [
        {
          "name": "find_pet_poison_service",
          "title": "Find the veterinary poison service for a country",
          "description": "Return the veterinary poison control service for a given country: the phone number, the hours, the fee as the operator publishes it, and whether the service will speak to the public or only to a veterinarian. Every number was read from the operating body's own website. IMPORTANT: several countries have a national poison centre that states in writing that it will NOT answer questions about animals; for those this tool returns that refusal rather than a number, and the correct advice is to contact a veterinarian. This tool returns contact details only. It contains no veterinary advice, no doses, no treatment guidance and no toxicity thresholds. Do not infer any of those from it.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name or ISO 3166-1 alpha-2 code, for example Germany or DE.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d7ca9318c0a59aa78b40abfa347ce95f8942eb8a3654e42c05401dc356aa8f5"
        },
        {
          "name": "list_pet_poison_countries",
          "title": "List every country covered",
          "description": "List the countries for which a veterinary poison service has been recorded, and which of them have a poison centre that refuses animal calls. Use this to check coverage before calling find_pet_poison_service.",
