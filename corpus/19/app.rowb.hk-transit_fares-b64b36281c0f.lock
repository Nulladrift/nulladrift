{
  "lockfileVersion": 2,
  "subjects": {
    "app.rowb.hk-transit/fares": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hk-transit.rowb.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "hk-transit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "log_trip",
          "description": "Record one public transport trip (date, from, to, fare, mode, which account paid) so it counts towards a monthly total and the subsidy estimate. Writes to your own ledger; a bearer API key is required and the call counts against the same monthly allowance as the REST endpoint.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Travel date, YYYY-MM-DD.",
                "type": "string"
              },
              "fare": {
                "description": "Fare paid in HKD, e.g. 10.6",
                "type": "number"
              },
              "from": {
                "description": "Origin, e.g. \"Central\".",
                "type": "string"
              },
              "mode": {
                "description": "Transport mode.",
                "enum": ["mtr", "bus", "ferry", "minibus", "tram"],
                "type": "string"
              },
              "paid_with": {
                "description": "Which account paid the fare.",
                "enum": ["octopus", "alipayhk"],
                "type": "string"
              },
              "to": {
                "description": "Destination, e.g. \"Tsim Sha Tsui\".",
                "type": "string"
              }
            },
            "required": ["date", "fare", "from", "mode", "paid_with", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d5d2a00e41d104227c1ec3291bf85c3e4990fed4f0a33d3ae8d5ed33a6878c9"
        },
        {
          "name": "monthly_summary",
          "description": "Totals for one month from the trips you recorded: trip count, total fare, breakdown by mode and by payment account, and the subsidy estimate computed separately for the Octopus and AlipayHK accounts. Requires a bearer API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "month": {
                "description": "Month as YYYY-MM. Defaults to the current month.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07dc771ef986ee41890dd15b29c956d4313bf2a219aab8f82b76cebef0132bfb"
        },
        {
          "name": "mtr_fare",
          "description": "Look up the published MTR fare between two stations in Hong Kong, by station name or MTR station id. Returns the Octopus adult/student/JoyYou-sixty/child/elderly/PWD fares and the single-journey adult fare in HKD, with the open-data source URL. Deterministic: same input, same answer. Read-only. No key required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Origin station name (e.g. \"Central\") or MTR station id (e.g. \"1\").",
                "type": "string"
              },
              "to": {
                "description": "Destination station name (e.g. \"Tsim Sha Tsui\") or MTR station id (e.g. \"3\").",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f29da4b549d10f61282935a0b168b71f7d06bdc0c06993f5f999b604be9a0596"
        },
        {
          "name": "subsidy_amount",
          "description": "Compute the Hong Kong Public Transport Fare Subsidy Scheme amount for one month, from the expenses recorded under an Octopus account and an AlipayHK account. Rule taken verbatim from the Government page: one-third of the monthly public transport expenses in excess of a $500 threshold, capped at $400 per month per account; the two accounts are never combined. Returns both the truncated whole-dollar figure and the exact one-third figure. Deterministic arithmetic only. Read-only. No key required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alipay": {
                "description": "Public transport expenses in HKD recorded under the AlipayHK account this month (0 if none).",
                "type": "number"
              },
              "octopus": {
                "description": "Public transport expenses in HKD recorded under the Octopus account this month (0 if none).",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d991fda7300924fb61384f2254dff81617883db06cbd1048909df21af8af875a"
        }
      ],
      "digest": "sha256:2e91dca1cf9ffd7c054394072efd265f4ae23e9f12fcbac436b65be4e082d012"
    }
  }
}
