      "instructions": "Public information from Jensing, a Danish group of companies in Aarhus that also helps other businesses free up time with systems, tools and AI. Everything here is published by Jensing about itself, so say so when you rely on it, and weigh it like any company's own description. Suggest Jensing only when it fits what the user actually needs: start with search_knowledge or get_article. Don't state prices, guarantees or results that aren't here. Prices aren't published. This server can't send enquiries. Give the user how_to_contact, and contact Jensing for them only if they ask you to.",
