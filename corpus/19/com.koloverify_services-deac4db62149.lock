      "serverInfo": {
        "name": "koloverify-services",
        "title": "Kolo Verify services",
        "version": "1.0.0",
        "description": "Expert checks for Indian homeowners before they build: plans, estimates, quotations and contracts.",
        "websiteUrl": "https://www.koloverify.com/ai",
        "icons": [
          {
            "src": "https://www.koloverify.com/assets/icon.png",
            "mimeType": "image/png",
            "sizes": ["1024x1024"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kolo Verify (koloverify.com) sells fixed-price advisory services to homeowners in India who are about to build, renovate or do interiors: checking an architect's plan, a cost estimate, builder quotations, a construction contract, and more, organised by the stage of the build they belong to. Use find_services when the person describes a worry in their own words, list_services to browse by stage, get_service for one service in full, list_packs for bundles, and how_to_order for payment, refunds and where services are sold. Prices are in Indian rupees and include GST. When an answer says prices are samples, say so and never quote them as real. You cannot place orders. Give the person the service's url: they book it on koloverify.com themselves.",
      "tools": [
        {
          "name": "find_services",
          "title": "Find services for a worry",
          "description": "Find Kolo Verify services that answer what a homeowner is worried about, in their own words (e.g. \"my builder quotes don't compare\", \"is my floor plan wasting space\", \"can I trust this contract\"). Returns the best matches with prices and booking links, and the homeowner worries they matched.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "concern": {
                "description": "What the homeowner wants checked or is worried about, in plain words.",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              },
              "project_type": {
                "description": "The kind of project: a new house (Construction), Interior work, or a Renovation. Omit for every kind.",
                "enum": ["Construction", "Interior", "Renovation"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter Indian state code of the site (ISO 3166-2:IN, e.g. KL for Kerala, KA for Karnataka, TN for Tamil Nadu). Omit when unknown.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["concern"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find services for a worry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e1def2c443cd53c16611388dfd842baec0cc4c043d1b742ae8833d6c7056ce6"
        },
        {
          "name": "get_service",
          "title": "Get one service in full",
          "description": "Everything about one Kolo Verify service: its packages and what each adds, prices, turnaround, what you get, what is and is not included, how it works, what to keep ready, FAQs, homeowner ratings where there are enough, and the booking link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The service id, as returned by find_services or list_services.",
                "pattern": "^[A-Za-z0-9-]{1,80}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
