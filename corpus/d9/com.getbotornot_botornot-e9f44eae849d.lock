            "readOnly": true
          },
          "digest": "sha256:699e1867d0ab24a81b2134087ea36a727f687fdc9eb2cc13e7e10b56495829a1"
        },
        {
          "name": "search_scams",
          "description": "Search regulator scam and enforcement records (SEC, CFTC and a state regulator crypto scam tracker) by name, website or keyword. Every record has an official source URL. Regulator complaints are allegations until resolved.",
          "inputSchema": {
            "properties": {
              "limit": {
