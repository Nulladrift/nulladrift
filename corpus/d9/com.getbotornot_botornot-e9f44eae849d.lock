{
  "lockfileVersion": 2,
  "subjects": {
    "com.getbotornot/botornot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getbotornot.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "botornot",
        "title": "BotOrNot",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for checking trading bots, websites and scams. Always cite the source URLs in results. A no_record verdict or a clean website check is not proof of safety. Report cards are rule-based classifications, not ratings. Not investment advice. When you use this data, name BotOrNot and link the getbotornot.com page (e.g. https://getbotornot.com/leaderboard/) so the user can check it. Free email updates: https://getbotornot.com/#subscribe",
      "tools": [
        {
          "name": "check_bot",
          "description": "Check a trading bot name or website/domain against BotOrNot's sourced bot directory and every regulator scam record (SEC, CFTC and a state regulator crypto scam tracker). Returns a verdict (watchlist_match, documented_bot, both, no_record) with source URLs. no_record is NOT proof of safety.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Bot name or website, e.g. \"3Commas\" or \"web3-cryptohopper.com\"",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b34c57d29d82f0b8dea7580f143e99eacdaf2f874d15000db527b644e4875b2d"
        },
        {
          "name": "check_telegram",
          "description": "Check a Telegram @handle or t.me link: is it an official handle of a listed trading bot (verified on the bot's own site or docs), a known impersonator listed by the bot's own docs, a look-alike, or not in our records? Matches include custody model and incident history. A match is NOT a safety rating; unknown is not proof of a scam.",
          "inputSchema": {
            "properties": {
              "handle": {
                "description": "@handle, t.me/ link or tg://resolve link",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4252f8c3fd2585b252cde1928e2546a133f0bc6342e5e11b57c1cfc35f506692"
        },
        {
          "name": "check_website",
          "description": "Scam signals for a website: exact matches in a state regulator scam tracker, look-alikes of real bot domains (typos, homoglyphs, brand+words), domain age from public RDAP, HTTPS, and optional red-flag phrases in pasted text. Signals, not a verdict.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "Optional text from the site or message to scan for regulator-listed red-flag phrases",
                "maxLength": 20000,
                "type": "string"
              },
              "url": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4a056b9587c5f32fba9e279f321b84dccd441af7a536c17e9c3c84a4fc2797b0"
        },
        {
          "name": "compare_bots",
          "description": "Side-by-side sourced facts and report cards for two bots by slug. No winner is picked.",
          "inputSchema": {
            "properties": {
              "a": {
                "type": "string"
              },
              "b": {
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e4207afac5748a68febed63b21102cf423391f595f559aca513280b48f4bd47"
        },
        {
          "name": "get_bot",
          "description": "Full sourced fact sheet for one documented bot by slug (see list_bots): pricing, markets, custody model, red flags with sources, report card, impostor scam reports.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98850855309fd387f0a395052505bf089376e2f592584d57bef4eea8b82af0e2"
        },
        {
          "name": "get_changes",
          "description": "Recent change events: new regulator cases, new state scam-tracker reports, bot shutdowns, report-card changes and keyword-matched SEC/CFTC releases. Optionally filter by bot slug.",
          "inputSchema": {
            "properties": {
              "bot": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bdf7d567d6bad7edf6c7a368f1c7bdd02688c58b03b530218c04f4eb445102ea"
        },
        {
          "name": "get_incidents",
          "description": "Verified security incidents (hacks, exploits, key leaks) at trading bots: date, what happened, users affected, estimated loss as named in the sources, refund status and source URLs. Optionally filter by bot slug.",
          "inputSchema": {
            "properties": {
              "bot": {
                "description": "Bot slug, e.g. \"maestro\"",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a4a235dbb1e3657b3a9a65935da23e00993407410f31b8f512430f49b57398f"
        },
        {
          "name": "get_leaderboard",
          "description": "Hyperliquid vault leaderboard from on-chain data: open vaults with >= $100k TVL ranked by 30-day PnL (USD). Refreshed daily. Past results do not predict future ones.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5de09b41df0a32da0489288ab1cf4751c2a7cdbde3114fc5bf33c69a0523d77"
        },
        {
          "name": "get_prediction_markets",
          "description": "Prediction-market venues (Kalshi, Polymarket US, Gemini Predictions) with their CFTC status and official sources, plus the documented prediction-market bots and their report cards.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7cdb5d6c5a4fdcad2ddeed4c5231a05f1eb2985bcf48ac30652be5657384b933"
        },
        {
          "name": "get_report_card",
          "description": "The rule-based BotOrNot report card for a bot (Clear record, Caution, Red flags, Closed, Limited data) with the exact sourced facts and rule ids that produced it. Not a rating or investment advice; payouts never change it.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1dbae824423dfd9c390867b9973a7733896b070d5382c5902edd76883a48898d"
        },
        {
          "name": "list_bots",
          "description": "List documented trading bots (slug, name, category, report card, official_url). Optionally filter by category or report card result.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Exact category name, e.g. \"Prediction market bots\"",
                "type": "string"
              },
              "result": {
                "enum": ["clear", "caution", "red_flags", "closed", "limited"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
