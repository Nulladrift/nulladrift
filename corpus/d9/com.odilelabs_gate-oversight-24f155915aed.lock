            "readOnly": false
          },
          "digest": "sha256:7e199e3a63196bcb3eabb7f8fe7ac7e7db119108a5dcd7ed4c6ca4e0f6f35ec8"
        },
        {
          "name": "gate_get_metrics",
          "title": "Read Gate operational metrics",
          "description": "What are the project call trends and current usage? Returns project-wide 24-hour call aggregates, anomaly scores, idle apps and current-month usage; use it for operational trends rather than individual calls in gate_read_audit or one run in gate_get_run_timeline. Includes stored call counts by HTTP status and reason, measured duration through response headers (including upstream wait), per-app anomaly scores and 24-hour anomaly counts, idle apps (active apps whose key made no allowed call in the project's idle_days, default 14; a flag only, never a revoke), and separate current-month gateway usage: plan, used, allowed, plus upgrade URL and checkout path on Free at 80% or above. Only POST the checkout path when the admin asks to upgrade; reading metrics never starts checkout. Requires the project owner key or an active member key. Audit may be partial: invalid-key sampling and audit-off periods are disclosed. No upstream requests, quota use or policy changes; not a health certificate or performance guarantee. For individual calls use gate_read_audit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "project_id": {
                "description": "The project id from project creation on the setup endpoint (/mcp/setup), e.g. p1a2b3...",
                "type": "string"
              }
            },
            "required": ["admin_key", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea9f3c027fa60e146da80827d2312258dd044dd65561d4974187b5868486dd42"
        },
