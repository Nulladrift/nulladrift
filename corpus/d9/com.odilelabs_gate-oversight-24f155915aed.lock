      "serverInfo": {
        "name": "com.odilelabs/gate/oversight",
        "title": "Odile Gate — Oversight",
        "version": "1.8.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Watch and manage an existing Gate project here. Obtain its project_id and authorized key from the setup endpoint, /mcp/setup. Use gate_list_apps to select an existing app and gate_list_approvers to check dedicated human approvers before gate_create_run; create apps and approval keys on the setup endpoint, /mcp/setup. Read held actions with gate_list_actions. Approving or rejecting a held action is done by a person with an approver key in the dashboard, by design. No MCP tool can approve actions. gate_read_audit shows recent calls, gate_export_audit_proof exports signed rows, and gate_verify_audit_proof checks an export. gate_get_run_tree shows delegation state; gate_get_run_timeline shows events. Review gate_learn_suggestions before gate_update_app applies them with explicit confirmation. /mcp retains the full compatibility catalog; old names remain callable here for the same capabilities.",
      "tools": [
        {
          "name": "gate_create_run",
          "title": "Grant one agent run",
          "description": "Gate Actions: give one agent session narrow, expiring permission. Actions are rules with {placeholders} bound by scope (e.g. \"PATCH /customers/{customer}/tickets/:id\" with scope {\"customer\":\"A\"}), each with an optional max and approval. Check gate_list_approvers for an active human approver before granting approval:true actions; create one on the setup endpoint, /mcp/setup if needed; without an active approver the grant is refused. Returns a run token (shown once) the agent sends as x-odile-run with its app key. Writes in a run need an Idempotency-Key. Give a write a check (\"GET /bookings?idempotency_key={key}\") and the agent can settle a lost answer with POST /g/<id>/_gate/recover.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actions": {
                "description": "Rules, or {rule, max, approval, check}",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "approval": {
                          "type": "boolean"
                        },
                        "check": {
                          "description": "For a write: the GET that finds it by key, e.g. \"GET /customers/{customer}/bookings?idempotency_key={key}\"; it must also be a GET action of the run",
                          "type": "string"
                        },
                        "idempotent": {
                          "description": "With check: the API dedupes on Idempotency-Key, so a not-found write may be retried",
                          "type": "boolean"
                        },
                        "max": {
                          "minimum": 1,
                          "type": "integer"
                        },
                        "rule": {
                          "type": "string"
                        }
                      },
                      "required": ["rule"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "app": {
                "description": "The app id (app_...) this run is for",
                "type": "string"
              },
              "label": {
                "description": "Optional: what the run is for, e.g. \"triage ticket 4411\"",
                "type": "string"
              },
              "max_calls": {
                "description": "Optional: calls allowed in the whole run",
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project id from project creation on the setup endpoint (/mcp/setup), e.g. p1a2b3...",
                "type": "string"
              },
              "scope": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Values for the {placeholders}, e.g. {\"customer\":\"A\"}",
                "type": "object"
              },
              "ttl_seconds": {
                "description": "How long the run lasts (default 3600)",
                "maximum": 86400,
                "minimum": 60,
                "type": "integer"
              }
            },
            "required": ["actions", "admin_key", "app", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0b8f89022b1df2774af89a9a0b5774b020cd3d3a2992ddaecbdb70f9a98fad7"
        },
