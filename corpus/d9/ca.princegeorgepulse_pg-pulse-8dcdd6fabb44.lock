        {
          "name": "find_events",
          "title": "Find events",
          "description": "Find upcoming events from the automated local calendar, soonest first: title, start and end, venue and address, category, short summary, image, organizer link and source, plus free (the listing says so) and ticketUrl when the link is a ticketing page. Filter by text, category, venue, source, a date range or a month; past: true searches past events. Long-running exhibitions and open calls that started earlier and run into the range come first; check start and end. Use pageUrl for the local detail page and url for the organizer. Verify changing times and availability with the organizer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug, e.g. music-nightlife.",
                "pattern": "^[\\w-]{1,120}$",
                "type": "string"
              },
              "free": {
                "description": "Only events whose listing says they are free; others may be free too.",
                "type": "boolean"
              },
              "from": {
                "description": "Events running on or after this date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Items to return (1-20, default 10). Follow continuation, or pass offset, for more.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "One local month (YYYY-MM), instead of from/to.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "offset": {
                "description": "Items to skip, for the next page (meta.total says how many match).",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "past": {
                "description": "Include events that already ended (history is kept about two years).",
                "type": "boolean"
              },
              "q": {
                "description": "Words in the title, summary or venue.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "source": {
                "description": "Calendar source id (see /events/sources via query_api).",
                "pattern": "^[\\w-]{1,120}$",
                "type": "string"
              },
              "to": {
                "description": "Events starting on or before this date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "venue": {
                "description": "Venue name contains.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
