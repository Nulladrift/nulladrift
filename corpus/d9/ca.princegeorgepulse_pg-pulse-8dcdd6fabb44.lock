        {
          "name": "find_jobs",
          "title": "Find job postings",
          "description": "Search open local job postings (best title match first when searching, else newest): title, employer, location, term, hours, wage when published, posting and closing dates, category and source. Filter by keyword, category, employer, term, hours, workplace, age or minimum wage. Link to the employer’s posting (url) and note the posting dates; postings close without notice.",
