        {
          "name": "find_council_votes",
          "title": "Council votes and meetings",
          "description": "How city council voted: each recorded resolution with the result and every member’s vote. Filter by words, member, topic, result, split votes or dates. Votes are per council term: by default the current one, or, while a new council has no recorded vote yet, the previous one (meta.term and meta.termNote say which). Pass term (ids in /council/votes/summary via query_api, data.terms) to choose. For upcoming meetings, agendas and video use query_api path /civic/meetings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Items to return (1-20, default 10). Follow continuation, or pass offset, for more.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "member": {
                "description": "Member slug (see /council/votes/summary via query_api).",
                "pattern": "^[\\w-]{1,120}$",
                "type": "string"
              },
              "offset": {
                "description": "Items to skip, for the next page (meta.total says how many match).",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words in the item or resolution.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "result": {
                "enum": ["carried", "defeated"],
                "type": "string"
              },
              "split": {
                "description": "true: only votes with someone against.",
                "type": "boolean"
              },
              "term": {
                "description": "Council term id, e.g. 2022-2026. Default: the current term, or the latest with votes.",
                "pattern": "^\\d{4}-\\d{4}$",
                "type": "string"
              },
              "to": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "topic": {
                "enum": ["procedure", "land-use", "budget", "safety", "infrastructure", "recreation", "environment", "grants", "governance", "other"],
                "type": "string"
              },
              "vote": {
