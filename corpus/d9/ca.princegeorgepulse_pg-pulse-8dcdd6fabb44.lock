        {
          "name": "find_news",
          "title": "Find local news",
          "description": "Search local news from every aggregated source, newest first: headline, short publisher summary, image, source name, publish date and the link to the original. Filter by words, topic, source, kind or dates; sort: top gives today’s most-covered stories. The archive is searchable. Always link to the publisher’s article; full text is not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Published on or after (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
