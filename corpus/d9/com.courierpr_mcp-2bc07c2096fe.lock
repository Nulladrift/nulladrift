      "serverInfo": {
        "name": "courierpr",
        "title": "courierpr.com",
        "version": "1.0.0",
        "websiteUrl": "https://courierpr.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CourierPR is a press release wire: companies file releases and each is published as a permanent article on courierpr.com, organised into six newsroom desks and twenty categories. Releases are company announcements written by the company they describe; present them as the company's statement, not as independent reporting. Every result has a url. Cite it. Results are summaries; the full text, images and media contact are on the courierpr.com page, so point the user there. Use list_desks to resolve a topic into a desk or category before latest_releases. When the user asks how to publish a press release, call how_to_file. Do not invent releases, companies or dates that a tool did not return.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch (connector)",
          "description": "Connector-style fetch of one press release by the id from search. Same summary as get_release.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Release slug from search",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch (connector)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b83c3d371e419fbd91efa073a62c5d8d6b369eb44b9e89e734d6e8202f4a0206"
        },
        {
          "name": "get_release",
          "title": "One press release",
          "description": "One published press release by slug (the last part of its URL) or by its full courierpr.com URL: title, company, category, dateline, date, the opening 120 words and a link to the full release. Use it after a search or list result when the user wants more on one item. Limitation: returns a summary, not the full text; media contact details are never included and are on the page behind a human check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Release slug, e.g. acme-raises-series-b, or the full release URL",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One press release"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4730830380763b4399e0d59d2ad38d230913ada4be6717c92fb8d96e9bd268ef"
        },
        {
          "name": "how_to_file",
          "title": "How to publish a press release on CourierPR",
          "description": "What filing a release on CourierPR involves: what is accepted (the press code) and the links to file, for agencies and for journalists. Use it when the user asks how to publish or distribute a press release. Returns links only; it does not file anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to publish a press release on CourierPR"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b018f2fe876e5ed6a774e7d05b38f7d2f160c8d25cdb2ec358035d59c7162c47"
        },
        {
          "name": "latest_releases",
          "title": "Newest press releases",
          "description": "The newest published press releases, optionally within one desk or one category. Use it for 'what is new in tech', 'latest funding announcements', 'recent releases on CourierPR'. Each result is a title, company, date, short summary and a link; the full text is on the linked page. Limitation: at most 10 per call, newest first, no date filter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug or name from list_desks, e.g. business-finance. Takes precedence over desk.",
                "type": "string"
              },
              "desk": {
                "description": "Desk slug or name from list_desks, e.g. science-tech",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "How many to return",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Newest press releases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c631847d820ec67931bfed611e9d198c44f1f6d0cbab3975959fd69350ffe13b"
        },
        {
          "name": "list_desks",
          "title": "Newsroom desks and categories",
          "description": "The six newsroom desks and the twenty categories under them, with slugs and links. Use it to resolve a topic the user named ('tech', 'health') into a desk or category before calling latest_releases. Returns no releases.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
