        {
          "name": "cotal_submit_feedback",
          "title": "Send feedback to the Cotal team",
          "description": "Files feedback (bug, idea, friction, praise or other) with the Cotal team on the user's behalf, into the same log the site's feedback widget writes to. Use when the user reports a problem with Cotal or wants to suggest something. Returns ok, the record id and whether it was handed to the team's tracker.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Which part of Cotal it concerns (CLI, connector, docs, site…).",
                "maxLength": 200,
                "type": "string"
              },
              "details": {
                "description": "Longer description, steps, context.",
                "maxLength": 10000,
                "type": "string"
              },
              "email": {
                "description": "The user's email address. Required so the record has a traceable origin.",
                "format": "email",
                "maxLength": 320,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Opaque key (a UUID is ideal). Reuse it when retrying so the same record is returned instead of a duplicate.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "The user's name, if they want it attached.",
                "maxLength": 100,
                "type": "string"
              },
              "sandbox": {
                "description": "Dry run: validate the call, apply rate limits, store nothing. Use it to test the integration.",
                "type": "boolean"
              },
              "severity": {
                "description": "For bugs and friction.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "source": {
                "description": "Where it came from: agent name, page, or CLI.",
                "maxLength": 500,
                "type": "string"
              },
              "summary": {
                "description": "One line: what happened, or what should.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Kind of feedback.",
                "enum": ["bug", "idea", "friction", "praise", "other"],
                "type": "string"
              }
            },
            "required": ["email", "summary", "type"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "http_status": {
                "description": "HTTP status of the underlying /v1 request (200, 201 or 202).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Id of the stored record, when one was created or found."
              },
              "ok": {
                "description": "true when the call was accepted.",
                "type": "boolean"
              },
              "published": {
                "description": "Whether the hand-off to the team's tracker was accepted; a stored report is never lost.",
                "type": "boolean"
              },
              "rate_limit_remaining": {
                "description": "Calls left in the current rate-limit window.",
                "type": "number"
              },
              "replayed": {
                "description": "true when an Idempotency-Key retry returned the original record.",
                "type": "boolean"
              },
              "sandbox": {
                "description": "true when this was a sandbox (dry-run) call and nothing was stored.",
                "type": "boolean"
              },
              "status_url": {
                "description": "Where to poll the report's status.",
                "type": "string"
