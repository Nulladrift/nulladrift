        {
          "name": "cotal_request_call",
          "title": "Request a call with the founders",
          "description": "Sends a discovery-call request to the Cotal founders for a company evaluating agent coordination. The team replies by email. Requires the user's work email and company.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agents": {
                "description": "How many agents the company runs in production.",
                "enum": ["1", "exploring", "2-5", "6-20", "20+"],
                "type": "string"
              },
              "company": {
                "description": "Company name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "coordinating": {
                "description": "One line: what they are coordinating.",
                "maxLength": 2000,
                "type": "string"
              },
              "email": {
                "description": "The user's email address. Required so the record has a traceable origin.",
                "format": "email",
                "maxLength": 320,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "frameworks": {
                "description": "Agent frameworks or harnesses in use (Claude Code, LangGraph, custom…).",
                "items": {
                  "maxLength": 60,
                  "type": "string"
