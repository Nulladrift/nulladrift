        {
          "name": "cotal_join_waitlist",
          "title": "Join the Cotal Cloud waitlist",
          "description": "Reserves a seat on the waitlist for Cotal Cloud, the hosted Cotal mesh (closed alpha), for the user's email. Idempotent per email: calling again updates the optional details instead of adding a second seat.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "The user's email address. Required so the record has a traceable origin.",
                "format": "email",
                "maxLength": 320,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "linkedin": {
                "description": "The user's LinkedIn profile URL, optional.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              },
              "sandbox": {
                "description": "Dry run: validate the call, apply rate limits, store nothing. Use it to test the integration.",
                "type": "boolean"
              },
              "use_case": {
                "description": "What the user wants the hosted mesh for.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
