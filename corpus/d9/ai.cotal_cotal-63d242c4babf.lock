                "type": "string"
              },
              "note": {
                "description": "One line on what this revision changes; shown in the revision history.",
                "maxLength": 500,
                "type": "string"
              },
              "restore": {
                "description": "Make an earlier revision current again instead of sending new text.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The post slug, e.g. 'mesh-in-production'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "description": "pending submits it for human review.",
                "enum": ["draft", "pending"],
                "type": "string"
              },
              "tag": {
                "maxLength": 40,
