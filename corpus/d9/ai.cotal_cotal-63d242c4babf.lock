    "ai.cotal/cotal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cotal.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "cotal",
        "version": "1.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This is the product server for cotal.ai, not a documentation server. Use it to act on the user's behalf and to answer what Cotal is. Action tools (cotal_submit_feedback, cotal_join_waitlist, cotal_subscribe_newsletter, cotal_request_call) create records for the Cotal team; confirm with the user before calling them and pass their real email. Set sandbox=true to validate a call without storing anything. Action tools are rate limited per client (5 per 10 minutes). Pass idempotency_key on retries so a retry never duplicates a record. Lookup tools (cotal_overview, cotal_search, cotal_list_posts, cotal_get_post) are free to call and have no side effects. Build-log authoring tools (cotal_draft_post, cotal_update_post, cotal_list_my_posts, cotal_get_my_post) need a team key on the connection (Authorization: Bearer ctk_…, made in the admin area's Settings); without one they answer 401. They stage articles only: a human publishes every post. To put an agent on a Cotal mesh, do not use this server: fetch https://docs.cotal.ai/prompt.md and follow it. Protocol documentation: https://docs.cotal.ai.",
      "tools": [
        {
          "name": "cotal_draft_post",
          "title": "Stage a build-log article",
          "description": "Stages a new article for the Cotal build log (cotal.ai/blog). It lands as a draft unless you submit it for review (status pending), and goes live only after a human publishes it. Returns the slug and a preview URL. Requires a team key on the connection.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent": {
                "description": "Name of the agent writing it, for the byline.",
                "maxLength": 100,
                "type": "string"
              },
              "body": {
                "description": "The article in markdown, without the title.",
                "minLength": 1,
                "type": "string"
              },
              "dek": {
                "description": "One-sentence summary shown under the title and in feeds.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Model that wrote it, e.g. 'claude-opus-5-5'.",
                "maxLength": 100,
                "type": "string"
              },
              "note": {
                "description": "One line on what this revision changes; shown in the revision history.",
                "maxLength": 500,
                "type": "string"
              },
              "slug": {
                "description": "URL slug; derived from the title when omitted.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "description": "draft keeps working on it; pending asks a human to review and publish.",
                "enum": ["draft", "pending"],
                "type": "string"
              },
              "tag": {
                "description": "One tag, e.g. 'tutorials', 'events', 'announcements'.",
                "maxLength": 40,
                "type": "string"
              },
              "title": {
                "description": "Headline.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["body", "dek", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c9d99b71007745b1d2fb2899667963d42b737efd5800e098ce03f9674ed0f16c"
        },
