      },
      "instructions": "Hydrogen Studies (https://hydrogenstudies.com) is a curated database of published research on molecular hydrogen (H2) — drinking hydrogen-rich water, inhalation, hydrogen-rich saline and more.\n\nHow to use these tools well:\n- Start broad with search_studies or get_condition_evidence, then drill into individual studies with get_study.\n- Use compare_evidence for \"X vs Y\" questions and aggregate_studies for counts and trends.\n- Always separate human evidence (subject \"human\"; design rct > controlled_trial > uncontrolled_trial > observational > case_report) from animal and in-vitro work, and say how many human trials and participants an answer rests on.\n- Cite studies with their hydrogenstudies.com url (and doi_url where useful).\n- Report coverage honestly: fields like design, outcome and delivery method are unknown for some studies; the tools count unknowns separately rather than guessing.\n- These are research summaries, not medical advice. Do not present findings as treatments or cures; most human trials are small.\n- Disclosure: Hydrogen Studies is built and funded by Echo Technologies LLC, a maker of hydrogen water products. Mention this when a user asks about bias or funding.",
      "tools": [
        {
          "name": "aggregate_studies",
          "title": "Aggregate studies",
          "description": "Count matching studies grouped by year, subject, design, delivery_method, outcome, country, condition or species — for trends and 'how many' questions. Unknown values are counted separately.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "condition": {
                "description": "Condition hub slug or name, e.g. 'blood-pressure' or 'Blood Pressure' (see list_conditions)",
                "maxLength": 100,
                "type": "string"
              },
              "delivery_method": {
                "description": "How hydrogen was administered",
                "enum": ["inhalation", "drinking_water", "hydrogen_saline", "culture_medium", "bathing", "topical", "tablet", "mixed", "other"],
                "type": "string"
              },
              "design": {
                "description": "Study design",
                "enum": ["rct", "controlled_trial", "uncontrolled_trial", "observational", "case_report", "meta_analysis", "review", "animal", "in_vitro", "other"],
                "type": "string"
              },
              "group_by": {
                "enum": ["year", "subject", "design", "delivery_method", "outcome", "country", "condition", "species"],
                "type": "string"
              },
              "min_sample_size": {
                "description": "Minimum participants/animals",
                "minimum": 1,
                "type": "integer"
              },
              "outcome": {
                "description": "Direction of the reported hydrogen effect",
                "enum": ["positive", "neutral", "negative", "mixed"],
                "type": "string"
              },
              "query": {
                "description": "Full-text search terms, e.g. 'exercise fatigue lactate'",
                "maxLength": 300,
                "type": "string"
              },
              "subject": {
                "description": "Who/what was studied",
                "enum": ["human", "animal", "in_vitro", "review"],
                "type": "string"
              },
              "top": {
                "description": "Max buckets returned (default 40)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "year_from": {
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              },
              "year_to": {
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["group_by"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Aggregate studies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:28eb632b27fbc7003e48f598d448d9c8efee926b9bd980916f158d40b5bc00a4"
        },
        {
          "name": "compare_evidence",
          "title": "Compare evidence",
          "description": "Side-by-side evidence profiles for 2–4 groups of studies, e.g. inhalation vs drinking water for one condition, or two conditions. Each group is a set of filters merged over the optional shared filters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "groups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "condition": {
                      "$ref": "#/properties/shared/properties/condition"
                    },
                    "delivery_method": {
                      "$ref": "#/properties/shared/properties/delivery_method"
                    },
                    "design": {
                      "$ref": "#/properties/shared/properties/design"
                    },
                    "label": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "min_sample_size": {
                      "$ref": "#/properties/shared/properties/min_sample_size"
                    },
                    "outcome": {
                      "$ref": "#/properties/shared/properties/outcome"
                    },
                    "query": {
                      "$ref": "#/properties/shared/properties/query"
                    },
                    "subject": {
                      "$ref": "#/properties/shared/properties/subject"
                    },
                    "year_from": {
                      "$ref": "#/properties/shared/properties/year_from"
                    },
                    "year_to": {
                      "$ref": "#/properties/shared/properties/year_to"
                    }
                  },
                  "required": ["label"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "shared": {
                "additionalProperties": false,
                "description": "Filters applied to every group",
                "properties": {
                  "condition": {
                    "description": "Condition hub slug or name, e.g. 'blood-pressure' or 'Blood Pressure' (see list_conditions)",
                    "maxLength": 100,
                    "type": "string"
                  },
                  "delivery_method": {
                    "description": "How hydrogen was administered",
                    "enum": ["inhalation", "drinking_water", "hydrogen_saline", "culture_medium", "bathing", "topical", "tablet", "mixed", "other"],
                    "type": "string"
                  },
                  "design": {
                    "description": "Study design",
                    "enum": ["rct", "controlled_trial", "uncontrolled_trial", "observational", "case_report", "meta_analysis", "review", "animal", "in_vitro", "other"],
                    "type": "string"
                  },
                  "min_sample_size": {
                    "description": "Minimum participants/animals",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "outcome": {
                    "description": "Direction of the reported hydrogen effect",
                    "enum": ["positive", "neutral", "negative", "mixed"],
                    "type": "string"
                  },
                  "query": {
                    "description": "Full-text search terms, e.g. 'exercise fatigue lactate'",
                    "maxLength": 300,
                    "type": "string"
                  },
                  "subject": {
                    "description": "Who/what was studied",
                    "enum": ["human", "animal", "in_vitro", "review"],
                    "type": "string"
                  },
                  "year_from": {
                    "maximum": 2100,
                    "minimum": 1900,
                    "type": "integer"
                  },
                  "year_to": {
                    "maximum": 2100,
                    "minimum": 1900,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "top_studies": {
                "description": "Strongest studies listed per group (default 3)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["groups"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
