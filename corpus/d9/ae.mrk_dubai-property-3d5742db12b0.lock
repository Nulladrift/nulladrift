        {
          "name": "search_projects",
          "title": "Search Dubai projects",
          "description": "Search ~2,400 Dubai residential projects (DLD-registered plus MRK-researched new launches). Filter by community, developer, stage, handover year, starting-price range, bedrooms and type. Returns compact summaries with canonical URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bedrooms": {
                "description": "Bedroom count offered (0 = studio)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "community": {
                "description": "Community name or slug, e.g. 'Dubai Hills Estate' or 'business-bay'",
                "type": "string"
              },
              "developer": {
                "description": "Developer name or slug, e.g. 'Emaar' or 'sobha-realty'",
                "type": "string"
              },
              "handoverYear": {
                "description": "Handover / completion year, e.g. 2027",
                "maximum": 2040,
                "minimum": 1990,
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1-50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceAed": {
                "description": "Maximum developer starting price in AED",
                "minimum": 0,
                "type": "number"
              },
              "minPriceAed": {
                "description": "Minimum developer starting price in AED (projects without a price are excluded when set)",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Free text matched against name, developer, community and summary",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "description": "Sort order",
                "enum": ["relevance", "price_asc", "price_desc", "handover_asc", "handover_desc", "name"],
                "type": "string"
              },
              "status": {
                "description": "Construction stage",
                "enum": ["off-plan", "ready"],
                "type": "string"
              },
              "type": {
                "description": "Property type",
                "enum": ["apartment", "villa", "townhouse", "penthouse"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
