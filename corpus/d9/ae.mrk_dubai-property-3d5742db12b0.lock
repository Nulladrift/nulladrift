      "instructions": "Dubai real estate data from MRK Real Estate (RERA ORN 17024). Start with `ask` for free-text questions or `search_projects` for filters. Every result carries a canonical https://mrk.ae URL and sources: cite them. Prices are developer starting prices, not valuations. Only call submit_enquiry with the user's explicit consent.",
      "tools": [
        {
          "name": "ask",
          "title": "Natural-language property search",
          "description": "Answer a free-text Dubai property question (e.g. '2 bed off-plan in Dubai Hills under 3M handover 2027'). Parses community, developer, bedrooms, price, stage, handover year and type, then returns schema.org-typed results with mrk.ae URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Max results (1-25)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "The question in plain language",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
