              "years": {
                "default": 25,
                "description": "Term in years (default 25, UAE max 25)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["annualRatePct", "priceAed"],
            "type": "object"
          },
