          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualRatePct": {
                "description": "Annual interest rate in % (e.g. 4.25)",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "downPaymentPct": {
                "default": 20,
                "description": "Down payment as % of price (default 20)",
                "maximum": 100,
