                "description": "Mortgage amount in AED, if financed",
                "minimum": 0,
                "type": "number"
              },
              "offPlan": {
                "description": "True for an off-plan (Oqood) purchase from the developer: no trustee fee, admin charge set by developer, no agency fee by default",
