      },
      "instructions": "Tools for learning about Cymosoft JSC (AI-first software development company, Hanoi) and Japanese text utilities (character count, 全角/半角, 和暦/西暦). Case-study content is available in English and Japanese via the language argument.",
      "tools": [
        {
          "name": "convert_fullwidth_halfwidth",
          "title": "Convert 全角⇔半角",
          "description": "Convert Japanese text between fullwidth (全角) and halfwidth (半角) forms for ASCII letters, digits, punctuation and spaces.",
          "inputSchema": {
            "properties": {
              "direction": {
                "enum": ["to_halfwidth", "to_fullwidth"],
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["direction", "text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cb589e9f198f4b13e9f3e0a68baf9e364a2ac9909d9c613b891c429b71ea4d5d"
        },
        {
          "name": "convert_japanese_era",
          "title": "Convert 和暦⇔西暦",
          "description": "Convert between Japanese era years (和暦: Reiwa/Heisei/Showa/Taisho/Meiji) and Western calendar years (西暦). Provide `year` for 西暦→和暦, or `era` + `era_year` for 和暦→西暦.",
          "inputSchema": {
            "properties": {
              "era": {
                "description": "Era name, e.g. 令和 or Reiwa",
                "type": "string"
              },
              "era_year": {
                "description": "Year within the era",
                "type": "integer"
              },
              "year": {
                "description": "Western year, e.g. 2026",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6281b65dbf3a1f6efd32b7ca349e30c58717aeb6032044bb14b1ede1cc958c69"
        },
        {
          "name": "count_japanese_characters",
          "title": "Count Japanese characters (文字数カウント)",
          "description": "Count characters in Japanese (or any) text: total, excluding whitespace, and 原稿用紙 pages (400 chars/page).",
          "inputSchema": {
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0c5fb7124f6a7a1843c721c583f86e2bdf42d47a44385c6530b417d715f787f6"
        },
        {
          "name": "get_case_study",
          "title": "Get one Cymosoft case study",
          "description": "Full case study text by id (ids come from list_case_studies).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Case study id, e.g. project1",
                "type": "string"
              },
              "language": {
                "description": "Response language (default: en)",
                "enum": ["en", "ja"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9d7cc92b4c884003598fc01dbc511beca067ca2a5d653d2bdb069f311a72d340"
        },
        {
          "name": "get_company_profile",
          "title": "Get Cymosoft company profile",
          "description": "Company profile of Cymosoft JSC (株式会社サイモソフト), an AI-first software development company in Hanoi, Vietnam serving international clients including the Japanese market.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Response language (default: en)",
                "enum": ["en", "ja"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e34d4f8071e5a3dad6a6f891bb8e5b85252c0e572b47f3add3a9c4b5df771dcf"
        },
        {
          "name": "list_case_studies",
          "title": "List Cymosoft case studies",
          "description": "List Cymosoft's client project case studies (industry, engagement model, team size, tech stack). Use get_case_study for the full write-up.",
          "inputSchema": {
