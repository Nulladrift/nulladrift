            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use Parky for supported Disney and Universal park planning: rides and ride facts, live posted waits, Lightning Lane return times and Universal Express prices, best times to ride, ride reliability and outages, showtimes, operating hours, ticket prices, park reservation availability, Walt Disney World bus times, ticketed event nights, current weather and crowd forecasts. When someone asks about wait times at a Disney or Universal park, call parky_get_waits straight away with the park name, such as EPCOT. When data_status is unavailable, say live waits are unavailable rather than guessing. Always cite Parky source URLs. Parky is independent of park operators and cannot book tickets, buy Lightning Lane, or access private Pass data.",
      "tools": [
        {
          "name": "parky_find_experience",
          "title": "Find a Parky park or ride",
          "description": "Use this when a visitor names or describes a ride and you need its Parky ID, or to check which parks Parky covers. Park tools take a park name directly, so skip this for them. Searches only parks in Parky's current Disney and Universal release scope. It does not retrieve current wait times.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "park_id": {
                "description": "Optional canonical Parky park ID to narrow ride search.",
                "maxLength": 200,
                "type": "string"
              },
              "query": {
                "description": "Park or ride name, such as EPCOT or Hagrid's.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a Parky park or ride"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
