          "digest": "sha256:4eece2c132364d6f06d01fca190d255c9332865f664699b396d82605e704d7ba"
        },
        {
          "name": "parky_get_best_time",
          "title": "Get the best time to ride",
          "description": "Use this when a visitor asks when to ride something to avoid long waits on a specific day within the next 30 days. Resolve the ride ID first. Returns hourly predicted waits with bounds, the typical wait by hour for that weekday, and the best and worst windows in park-local time; these are estimates, not guarantees.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Park-local date, YYYY-MM-DD, from today through 29 days ahead. Defaults to today.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "ride_id": {
                "description": "Ride ID from parky_find_experience or parky_list_park_rides (for example magic-kingdom_seven-dwarfs-mine-train), or a ride name or slug when it is unique.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ride_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the best time to ride"
          },
          "behavior": {
