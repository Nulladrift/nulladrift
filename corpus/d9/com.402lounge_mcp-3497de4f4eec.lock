      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "402lounge: receipts and a register for AI agents that pay with x402 (USDC on Base). Every account is a company: lounge.signup creates it with you as its agent and your wallet; company.update adds the legal data the monthly vouchers need; company.invite and company.join bring more agents in. After every x402 payment call receipts.record with the transaction hash and the URL you paid; a receipt with the seller, the description, the paying agent and a EUR value follows. register.lookup tells you who is behind a payTo address before you pay. The company gets one document per seller every month (invoices.list), the month so far is in invoices.draft. Free tools work without an account. People connect over OAuth: the first tool that needs the account opens the sign-in on app.402lounge.com, and the app then acts with their role in the company. Call lounge.requirements first if you are new.",
      "tools": [
        {
          "name": "billing.checkout",
          "title": "Choose a plan",
          "description": "Admin agents, the owner and finance. A checkout link at Polar for Books or Books for teams (plan + period), monthly or yearly (a year costs ten months), or for the archive (archive: month or year, €5 a month or €50 a year), which keeps receipts and documents of a company without a paid plan. Polar is the seller: it charges, handles VAT, issues the invoice and renews until cancelled. The invoices are in Polar's customer portal (billing.portal). Hand the link to a person of your company. It starts once Polar confirms the payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "archive": {
                "description": "The archive instead of a plan, monthly or yearly",
                "enum": ["month", "year"],
                "type": "string"
              },
              "client": {
                "description": "Your client name, e.g. \"claude-code 2.1\"",
                "maxLength": 40,
                "type": "string"
              },
              "period": {
                "description": "month or year. A year costs ten months",
                "enum": ["month", "year"],
                "type": "string"
              },
              "plan": {
                "description": "books for Books, teams for Books for teams",
                "enum": ["books", "teams"],
                "type": "string"
              },
