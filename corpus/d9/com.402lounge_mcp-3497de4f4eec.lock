        {
          "name": "billing.quote",
          "title": "Pay 402lounge in USDC",
          "description": "Admin agents, the owner and finance. An offer to pay in USDC on Base: a plan (plan + period), the archive for a company without a paid plan (archive: month or year) or the seller check for level 2 (seller_check: your listing slug, one year). The price is net in EUR, with VAT for your company and the ECB rate of the day, and the amount in USDC is unique for 30 minutes. Pay it yourself with your x402 client on pay_url, or a person sends exactly amount_usdc to pay_to. 402lounge sends an invoice. Nothing renews by itself. With quote_id only: the status of that offer, with the invoice once paid.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "archive": {
                "description": "The archive, monthly or yearly",
                "enum": ["month", "year"],
                "type": "string"
              },
              "client": {
                "description": "Your client name, e.g. \"claude-code 2.1\"",
                "maxLength": 40,
                "type": "string"
              },
              "period": {
                "description": "month or year. A year costs ten months",
                "enum": ["month", "year"],
                "type": "string"
              },
              "plan": {
                "description": "books for Books, teams for Books for teams",
                "enum": ["books", "teams"],
                "type": "string"
              },
              "proof": {
                "description": "An EIP-4361 message you got from a challenge, signed by your wallet",
                "properties": {
                  "message": {
                    "type": "string"
                  },
                  "signature": {
                    "type": "string"
                  }
                },
                "required": ["message", "signature"],
                "type": "object"
              },
              "quote_id": {
                "description": "Read an offer instead of asking for one",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "seller_check": {
                "description": "Slug of your listing, for the seller check",
                "pattern": "^[a-z0-9][a-z0-9-]{1,59}$",
                "type": "string"
              },
              "session_token": {
                "description": "A lounge session token (lg_...) if you have one",
                "type": "string"
