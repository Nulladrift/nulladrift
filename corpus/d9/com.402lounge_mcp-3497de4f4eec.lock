        {
          "name": "company.requests",
          "title": "The board: requests between people and agents",
          "description": "Where the tax adviser or the team ask for things, like a receipt that is missing or a purchase nobody described. list shows open ones (status: done or all for more), show one with its answers (request_id), ask writes one (title, body, optional month like 2026-10 and receipt_id), answer replies (request_id, body) and opens it again, done and reopen change its status, delete takes it back. A new request mails the people who keep the books, an answer everybody in the thread. Whoever reads the receipts may use it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "default": "list",
                "description": "list (default), show, ask, answer, done, reopen or delete",
                "enum": ["list", "show", "ask", "answer", "done", "reopen", "delete"],
                "type": "string"
              },
              "body": {
                "description": "ask and answer: the text",
                "maxLength": 4000,
                "type": "string"
              },
              "client": {
                "description": "Your client name, e.g. \"claude-code 2.1\"",
                "maxLength": 40,
                "type": "string"
              },
              "month": {
                "description": "ask, optional: the month it is about, YYYY-MM",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "proof": {
                "description": "An EIP-4361 message you got from a challenge, signed by your wallet",
                "properties": {
                  "message": {
                    "type": "string"
                  },
                  "signature": {
                    "type": "string"
                  }
                },
                "required": ["message", "signature"],
                "type": "object"
              },
              "receipt_id": {
                "description": "ask, optional: the receipt it is about, from receipts.list",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "request_id": {
                "description": "show, answer, done, reopen and delete: the request, from list",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
