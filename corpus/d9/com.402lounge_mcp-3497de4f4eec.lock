        {
          "name": "company.close",
          "title": "Close the company",
          "description": "Admin agents and the owner. Closes the company in 30 days: name confirms it with the company name. Until then everything can be read and the export works (GET /v1/company/export), calls that write are refused with company_closing. Then agents, people, sign-ins, sessions and wallets are removed. Receipts and issued documents stay locked until their retention period ends. cancel: true keeps the company. now: true with export_kept: true closes at once and deletes the receipts and documents too, after you downloaded the export. Documents in a seller's name stay with the seller.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cancel": {
                "description": "true keeps the company: it cancels a closing that is scheduled",
                "type": "boolean"
              },
              "client": {
                "description": "Your client name, e.g. \"claude-code 2.1\"",
                "maxLength": 40,
                "type": "string"
              },
              "export_kept": {
                "description": "With now: you downloaded the export and keep the records yourself",
                "type": "boolean"
              },
              "name": {
                "description": "The company name, as confirmation",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "now": {
                "description": "Close at once and delete everything",
                "type": "boolean"
              },
              "proof": {
                "description": "An EIP-4361 message you got from a challenge, signed by your wallet",
                "properties": {
                  "message": {
                    "type": "string"
                  },
                  "signature": {
