        {
          "name": "company.update",
          "title": "Fill in or change the company data",
          "description": "Admins only. Your account starts as a company named after you. A company is ready for invoices (tier invoice_ready) once it has name, legal_form (or sole_proprietor), owner_name for a sole proprietor, address_line1, postal_code, city, country, a confirmed email and its VAT status with the number: in the EU a VAT id VIES confirms (checked at once), or the tax_number for small businesses and VAT-exempt companies. Until then it gets receipts and a preview of its monthly documents, and buying a plan waits. Any subset works, and the answer lists what is still missing (missing_for_company).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address_line1": {
                "description": "Street and number of the registered address",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "address_line2": {
                "description": "Optional second line of the address",
                "maxLength": 120,
                "type": "string"
              },
              "address_state": {
                "description": "State or province, written after the city in the USA, Canada and Australia (TX, ON, NSW)",
                "maxLength": 40,
                "type": "string"
              },
              "city": {
                "description": "City of the registered address",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "client": {
                "description": "Your client name, e.g. \"claude-code 2.1\"",
                "maxLength": 40,
                "type": "string"
              },
              "country": {
                "description": "ISO 3166 two-letter code, e.g. DE",
                "type": "string"
              },
              "currency": {
                "description": "The currency amounts are shown in, next to USDC: EUR (default, the currency of the documents), USD, or any currency with an ECB reference rate",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "email": {
                "description": "Where documents and notices go. A code confirms it",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "fx_method": {
                "description": "How USDC becomes EUR on documents. Today only ecb_daily (ECB reference rate of the payment day)",
                "enum": ["ecb_daily"],
                "type": "string"
              },
              "language": {
                "description": "Language of documents and mails: en, de, fr, it, es, nl, pt, sv, da, fi or nb. Null takes the language of the country",
                "type": ["string", "null"]
              },
              "legal_form": {
                "description": "GmbH, UG, AG, e.K., Inc., ...",
                "maxLength": 40,
                "type": "string"
              },
              "name": {
                "description": "Legal name of the company, without the legal form",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "own_accounts": {
                "anyOf": [
                  {
                    "properties": {
                      "clearing": {
                        "pattern": "^\\d{4,8}$",
                        "type": "string"
                      },
                      "expense": {
                        "pattern": "^\\d{4,8}$",
                        "type": "string"
                      },
                      "gift_cards": {
                        "pattern": "^\\d{4,8}$",
                        "type": "string"
                      },
                      "usdc": {
                        "pattern": "^\\d{4,8}$",
                        "type": "string"
                      }
                    },
                    "required": ["clearing", "expense", "usdc"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "With skr OWN: the expense, clearing and USDC holding accounts of your chart, 4 to 8 digits, and optionally gift_cards for gift card purchases (the expense account otherwise)"
              },
              "owner_name": {
                "description": "A sole proprietorship (Einzelunternehmen, e.K., sole trader ...): the first and last name of the owner. It stands on every document, never in the register or on a listing. Empty removes it",
                "maxLength": 120,
                "type": "string"
              },
              "postal_code": {
                "description": "Postal code of the registered address",
                "maxLength": 12,
                "minLength": 3,
                "type": "string"
              },
              "proof": {
                "description": "An EIP-4361 message you got from a challenge, signed by your wallet",
                "properties": {
                  "message": {
                    "type": "string"
                  },
                  "signature": {
                    "type": "string"
                  }
                },
                "required": ["message", "signature"],
                "type": "object"
              },
              "session_token": {
                "description": "A lounge session token (lg_...) if you have one",
                "type": "string"
              },
              "skr": {
                "description": "Chart of accounts for exports. OWN takes own_accounts",
                "enum": ["SKR03", "SKR04", "OWN"],
                "type": "string"
              },
              "sole_proprietor": {
                "description": "True for one person without a legal form of its own where the country has none to choose. Then owner_name is required",
                "type": "boolean"
              },
              "tax_number": {
                "description": "The national tax number, for vat_status tax_number or where the country asks for it",
                "maxLength": 30,
                "type": "string"
              },
              "vat_id": {
                "description": "VAT id in the format of its country, like DE123456789 or ATU12345678 (GET /v1/countries). EU numbers are checked against VIES",
                "maxLength": 30,
                "type": "string"
              },
              "vat_status": {
                "anyOf": [
                  {
                    "enum": ["vat_id", "tax_number", "small_business", "exempt", "not_registered"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "How the company stands with VAT: vat_id, tax_number (registered, VAT id still to come), small_business (§ 19 UStG) exempt (only VAT-exempt sales) or not_registered (no VAT registration, the USA or another country without VAT). Decides the tax note on its documents"
              }
            },
            "type": "object"
          },
