        {
          "name": "kz_maternity_benefits",
          "title": "Kazakhstan maternity and childcare benefits (2026)",
          "description": "Maternity benefits / декретные пособия / декрет төлемдері. Estimates the Kazakhstan state benefits around a birth in 2026: the one-off birth payment, the maternity leave payment (126 days, or 140 days for a complicated or multiple birth), and the monthly childcare allowance until the child is 1.5 years old. For an employed mother it needs two incomes: the average monthly insured income for the last 12 months (leave) and for the last 24 months (childcare). For a mother who is not employed, only the fixed amounts by child rank apply and incomes are ignored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "average_monthly_income_12m_kzt": {
                "description": "Average monthly insured income for the last 12 months (maternity leave base), in tenge (KZT) per month. Required when is_employed is true.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "average_monthly_income_24m_kzt": {
                "description": "Average monthly insured income for the last 24 months (childcare allowance base), in tenge (KZT) per month. Required when is_employed is true.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "child_rank": {
                "description": "Birth order of this child: 1, 2, 3, or 4 for the fourth and any later child.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "is_employed": {
                "description": "True if the mother has insured employment income; false for a mother who is not employed.",
                "type": "boolean"
              },
              "lang": {
                "default": "ru",
                "description": "Language of source titles, limitation notes and page links: \"ru\" (Russian) or \"kk\" (Kazakh). Default \"ru\".",
                "enum": ["ru", "kk"],
                "type": "string"
              },
              "leave_type": {
                "default": "standard",
                "description": "\"standard\" (126 days, single birth) or \"complicated\" (140 days: complicated or multiple birth).",
                "enum": ["standard", "complicated"],
                "type": "string"
              }
            },
            "required": ["child_rank", "is_employed"],
            "type": "object"
          },
          "annotations": {
