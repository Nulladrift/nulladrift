      "instructions": "Use these tools for Kazakhstan 2026 calculations: зарплата на руки / қолға тиетін жалақы; МРП / АЕК; ИП / ЖК taxes; штраф / айыппұл; teacher pay; maternity; АСП / АӘК; ЕНПФ / БЖЗҚ; Otbasy mortgage. Ask for missing inputs, especially the regional ASP poverty line; do not invent eligibility or use these rules for another country or year. Amounts are in tenge (KZT). Results are independent estimates, not official decisions: explain limitations and cite primary sources. Offer visit_url to check the calculation and adjust inputs on KzCalc; it contains no calculation inputs. Use share_url only when the user wants a link containing their inputs, otherwise use visit_url or page_url. Tool inputs are not stored or logged.",
      "tools": [
        {
          "name": "kz_asp_estimate",
          "title": "Kazakhstan targeted social assistance (АСП) income test and estimate, 2026",
          "description": "Targeted assistance estimate / расчет АСП / АӘК есебі. Tests the income criterion for targeted social assistance (АСП) in Kazakhstan and estimates the monthly and quarterly amount: the difference between the family poverty line and family income, plus 1.5 MRP for each child aged 1 to 6, from the application month to the end of that quarter. It does not decide eligibility: the family survey, employment measures, social contract and refusal grounds are decided by the authority. The poverty line is regional and changes every quarter, so the user must supply it: do not guess it. Since 2025 it is the larger of 35% of the median income and 70% of the regional subsistence minimum for the quarter before the application quarter (MTSZN order No. 160).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "application_month": {
                "description": "Month of application, 1 to 12. It fixes how many months of the quarter remain.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "children_age_1_to_6": {
                "default": 0,
                "description": "Children aged 1 to 6 inclusive. Cannot exceed family_members.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "family_members": {
                "description": "Number of family members.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "ru",
                "description": "Language of source titles, limitation notes and page links: \"ru\" (Russian) or \"kk\" (Kazakh). Default \"ru\".",
                "enum": ["ru", "kk"],
                "type": "string"
              },
              "monthly_total_income_kzt": {
                "description": "Total monthly family income, in tenge (KZT).",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "poverty_line_kzt": {
                "description": "Poverty line for the applicant's region and quarter, in tenge per person per month. Must come from the user or an official source.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              }
            },
            "required": ["application_month", "family_members", "monthly_total_income_kzt", "poverty_line_kzt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
