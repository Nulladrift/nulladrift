        {
          "name": "kz_enpf_threshold",
          "title": "ENPF pension savings: amount available above the sufficiency threshold (2026)",
          "description": "Pension savings threshold / порог ЕНПФ / БЖЗҚ жеткіліктілік шегі. Compares a person's mandatory pension savings (OPV) in ENPF with the 2026 minimum sufficiency threshold for their age (the table covers ages 20–62) and returns the amount above it that may be used for housing or treatment, or the shortfall. Ages below the table give no available amount; ages above it are treated as retirement age. The actual right to withdraw and the balance are confirmed by ENPF and the operators when applying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age": {
                "description": "Age in full years, 18 to 80.",
                "maximum": 80,
                "minimum": 18,
                "type": "integer"
              },
              "lang": {
                "default": "ru",
                "description": "Language of source titles, limitation notes and page links: \"ru\" (Russian) or \"kk\" (Kazakh). Default \"ru\".",
                "enum": ["ru", "kk"],
                "type": "string"
              },
              "opv_savings_kzt": {
                "description": "Mandatory pension contribution (OPV) savings in ENPF, in tenge (KZT). Rounded down to whole tenge.",
                "maximum": 500000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["age", "opv_savings_kzt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
