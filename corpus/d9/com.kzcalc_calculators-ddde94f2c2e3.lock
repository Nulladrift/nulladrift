        {
          "name": "kz_otbasy_mortgage",
          "title": "Otbasy Bank \"Nauryz\" / \"Otau\" two-stage housing loan (2026)",
          "description": "Otbasy mortgage estimate / ипотека Отбасы банк / Отбасы банк ипотекасы. Estimates the two-stage housing loan of Otbasy Bank under the \"Nauryz\" and \"Otau\" programs: the checks on deposit, down payment and loan limit, the monthly payment of stage 1 (preliminary loan, 8 years: interest plus savings), and the stage 2 payment range (housing loan, 11 years, 3.5%–5.0%). It is a formula estimate, not the bank's schedule: the stage 2 rate depends on the bank's accumulated score, the 20% state premium and the deposit term. Loan limits depend on the region: 36 million KZT for Astana and Almaty, 30 million KZT for other regions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "down_payment_kzt": {
                "description": "Own down payment and savings (housing savings deposit and ENPF funds included), in whole tenge. Must be below the property value.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "is_susn": {
                "default": false,
                "description": "Socially vulnerable category (СУСН): stage 1 rate 7% instead of 9%.",
                "type": "boolean"
              },
              "lang": {
                "default": "ru",
                "description": "Language of source titles, limitation notes and page links: \"ru\" (Russian) or \"kk\" (Kazakh). Default \"ru\".",
                "enum": ["ru", "kk"],
                "type": "string"
              },
              "program": {
                "description": "\"nauryz\" or \"otau\".",
                "enum": ["nauryz", "otau"],
                "type": "string"
              },
              "property_type": {
                "description": "\"primary_raw\": new build with rough finish or share construction (down payment 20%). \"primary_finished\": new build with finish (10% under \"Nauryz\"; 20% under \"Otau\"). \"secondary\": resale home, allowed only in certain locations.",
                "enum": ["primary_raw", "primary_finished", "secondary"],
                "type": "string"
              },
              "property_value_kzt": {
                "description": "Price of the home, in whole tenge (KZT).",
                "maximum": 1000000000,
                "minimum": 1000000,
                "type": "integer"
              },
              "region": {
                "description": "\"major\": Astana or Almaty (loan limit 36 million KZT). \"other\": any other region (30 million KZT).",
                "enum": ["major", "other"],
                "type": "string"
              }
            },
            "required": ["down_payment_kzt", "program", "property_type", "property_value_kzt", "region"],
            "type": "object"
          },
