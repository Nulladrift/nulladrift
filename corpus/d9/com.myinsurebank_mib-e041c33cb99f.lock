  "subjects": {
    "com.myinsurebank/mib": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.myinsurebank.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mib",
        "title": "My Insure Bank (MIB) — Nigerian insurance",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "My Insure Bank (MIB) is a NAICOM-licensed Nigerian insurance marketplace (a product of PRA Insurance Brokers).\nFull flow: 1) get_quote_requirements → ask the customer, 2) compare_insurance_quotes with their answers, 3) once they pick an offer (or you recommend one), IMMEDIATELY ask the customer in chat for the purchase details — do not wait for them to offer, and do not present it as optional. For motor that is: vehicle colour, plate number, chassis/VIN, engine number, street address + city + state, and a next of kin (name, phone, relationship) — get_purchase_requirements lists the exact questions. Ask conversationally in ONE short message. 4) get_buy_link with everything → the customer gets a link where they only sign in, review a summary of what you collected, and pay (Paystack); the policy is issued instantly. Motor has NO direct buy link without these details — collecting them in chat IS the checkout. Never ask for DOB or NIN in chat — identity comes from the customer's verified MIB account.\nUse policy_checkup to tell someone if they are overpaying on an existing policy (requires their name + phone; MIB's licensed brokers may follow up).\nAll amounts are Nigerian Naira (NGN).",
      "tools": [
        {
          "name": "about_mib_for_developers",
          "title": "About MIB + how to integrate",
          "description": "What My Insure Bank is, what this MCP server can do, and how developers get their own MIB partner API key (sandbox instantly, live after business verification).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4ee0bf1f5cd101ea494879d4855c8005eee83d605bb48ba7fb911e4a6e8286a"
        },
        {
          "name": "compare_insurance_quotes",
          "title": "Compare live insurance quotes",
          "description": "Get real-time premiums across MIB's partner insurers (NSIA, Heirs, Tangerine, Cornerstone, NEM, WellaHealth, emPLE…) in NGN. Health/travel/gadget offers include a buy_url. MOTOR offers deliberately have no link: after presenting motor quotes you MUST ask the customer in chat for their vehicle + address + next-of-kin details (each offer's to_buy field lists them) and then call get_buy_link — that is the only way to a motor checkout. Rating inputs: auto → sum_insured (vehicle value) + cover_type; health → plan_code + lives; travel → travellers + travel_class + travel_scope; gadget → sum_insured (device value) + device_type.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Applicant age in years — some insurers rate on it.",
                "type": "number"
              },
              "cover_type": {
                "description": "Auto: 'comprehensive' or 'third party'. Default comprehensive.",
                "type": "string"
              },
              "device_type": {
                "description": "Gadget: what the device is, e.g. Phone, Laptop.",
                "type": "string"
              },
              "lives": {
                "description": "Health: number of people covered. Default 1.",
                "type": "number"
              },
              "plan_code": {
                "description": "Health: plan tier — AWRS (Standard), AWGD (Gold) or AWPL (Platinum).",
                "type": "string"
              },
              "product_type": {
                "description": "The line of insurance to quote.",
                "enum": ["auto", "health", "travel", "gadget"],
                "type": "string"
              },
              "sum_insured": {
                "description": "Value being covered in NGN (vehicle value for auto, device value for gadget). Required for auto and gadget.",
                "type": "number"
              },
              "travel_class": {
                "description": "Travel: 'economy' or 'executive'.",
                "type": "string"
              },
              "travel_scope": {
                "description": "Travel: 'local' (within Nigeria) or 'foreign' (international).",
                "type": "string"
              },
              "travellers": {
                "description": "Travel: number of travellers. Default 1.",
                "type": "number"
              }
            },
            "required": ["product_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cb7b6863a1a7c2c957720672fc2b74116c24a4570509beb1dd1d70f8cf23e274"
        },
        {
          "name": "get_buy_link",
          "title": "Get a hosted checkout link",
          "description": "Build the MIB hosted-checkout link for a chosen offer (from compare_insurance_quotes). MOTOR REQUIRES the full details collected via get_purchase_requirements (vehicle + insured + next_of_kin) — without them this tool returns an error telling you what to collect. With them, the customer lands on a review summary of everything gathered in chat and only signs in and pays with Paystack — the agent never handles payment.",
          "inputSchema": {
            "properties": {
              "attributes": {
                "description": "Other lines: the quote inputs to carry to checkout (plan_code, lives, travellers, device_type…).",
                "type": "object"
              },
              "cover_type": {
                "description": "Auto: 'comprehensive' or 'third party'.",
                "type": "string"
              },
              "insured": {
                "description": "Auto: insured details — title, gender, address, city, state (2-letter code).",
                "type": "object"
              },
              "insurer": {
                "description": "Insurer code from the compare results (e.g. nsia, uic, heirs, emple).",
                "type": "string"
              },
              "next_of_kin": {
                "description": "Auto: next of kin — first_name, last_name, gender, phone, relationship.",
                "type": "object"
              },
              "plan_code": {
                "description": "Plan code from the offer, when present.",
                "type": "string"
              },
              "premium": {
                "description": "The quoted annual premium in NGN.",
                "type": "number"
              },
              "product_type": {
                "enum": ["auto", "health", "travel", "gadget"],
                "type": "string"
              },
              "sum_insured": {
                "description": "The value quoted on (vehicle/device value in NGN).",
                "type": "number"
              },
              "vehicle": {
                "description": "Auto: the vehicle details from get_purchase_requirements (make, model, year, body_type, color, use, plate_number, chassis_number, engine_number, seats).",
                "type": "object"
              }
            },
            "required": ["insurer", "premium", "product_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd780c5e075f8c29f8408397a6880bedaf668d9417b2563a0ab6208f6a85667c"
        },
        {
          "name": "get_purchase_requirements",
          "title": "What to collect before checkout",
          "description": "Everything MIB's own purchase forms collect before payment, per line — for motor that is the full vehicle (make, model, year, body type, colour, usage, plate, chassis/VIN, engine number, seats), the insured's address details, and a next of kin. Collect it all in chat, then call get_buy_link with it: the checkout page arrives prefilled and the customer only signs in, reviews and pays. Identity (DOB/NIN) is never collected in chat.",
          "inputSchema": {
            "properties": {
              "product_type": {
                "enum": ["auto", "health", "travel", "gadget"],
                "type": "string"
              }
            },
            "required": ["product_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b9be29455539cbe0824613a610ad0b53875c5b7b114c6291edfa41c6c27c7e9"
        },
        {
          "name": "get_quote_requirements",
          "title": "What to ask the customer before quoting",
          "description": "Returns the exact details to collect from the customer for a line of insurance — the same rating inputs MIB's own quote forms use. Call this FIRST, ask the customer the questions, then call compare_insurance_quotes with their answers. Omit product_type to see every line.",
          "inputSchema": {
            "properties": {
              "product_type": {
                "description": "The line of insurance. Omit to get the requirements for all lines.",
                "enum": ["auto", "health", "travel", "gadget"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a3092a044a428325ee808843775d5f5079079805e10109e3c65838e13ca0696"
        },
        {
          "name": "list_insurance_products",
          "title": "List an insurer's products on MIB",
          "description": "Browse the live product catalogue MIB carries for one insurer. insurer: 'universal', 'nsia', 'heirs' or 'emple'. For emPLE you can filter line to 'general' or 'life'.",
          "inputSchema": {
            "properties": {
              "insurer": {
                "enum": ["universal", "nsia", "heirs", "emple"],
                "type": "string"
              },
              "line": {
                "description": "emPLE only.",
                "enum": ["general", "life"],
                "type": "string"
              }
            },
            "required": ["insurer"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:819869363ecd410efb2383a47543779a11d893be1faa151dc511e20e628b0bab"
        },
        {
          "name": "policy_checkup",
          "title": "Free policy check-up (am I overpaying?)",
          "description": "MIB's free second opinion on an insurance policy the customer already holds (with any insurer). Compares their current premium against live market rates and reports the estimated annual saving. Requires the customer's name and phone number — MIB's licensed brokers may follow up to help them switch. Ask the customer for consent before calling this.",
          "inputSchema": {
            "properties": {
              "cover_type": {
                "description": "e.g. comprehensive, third-party.",
                "type": "string"
              },
              "current_premium": {
                "description": "What they currently pay per year, NGN.",
                "type": "number"
              },
              "email": {
                "description": "Customer's email (optional).",
                "type": "string"
              },
              "insurer_name": {
                "description": "Insurer they hold the policy with.",
                "type": "string"
              },
              "name": {
                "description": "Customer's full name (required).",
                "type": "string"
              },
              "phone": {
                "description": "Customer's phone number (required).",
                "type": "string"
              },
              "product_type": {
                "description": "e.g. auto, health, travel, gadget",
                "type": "string"
              },
              "sum_insured": {
                "description": "Current cover amount in NGN, if known.",
                "type": "number"
              }
            },
            "required": ["name", "phone", "product_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48b08531a2feeddd90f58c3f5140314c6289a8d93d39334258b15f84a7cfef11"
        }
      ],
      "digest": "sha256:ac19bcf091d5df4ab603035779be06713c7a28df2a13e9257e05b1f2ab11f142"
    }
  }
}
