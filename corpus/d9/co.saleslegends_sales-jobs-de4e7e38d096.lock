{
  "lockfileVersion": 2,
  "subjects": {
    "co.saleslegends/sales-jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://saleslegends.co/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "sales-legends",
        "title": "Sales Legends",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sales Legends is a board of open sales jobs (SDR and BDR, account executive, account manager, customer success, sales engineering, sales leadership, sales operations and more), read every hour from the careers systems of the companies hiring, each role listed once with the pay its posting states. search_sales_jobs finds roles, get_sales_pay gives the posted pay for each kind of sales work, and get_sales_market counts the open roles by kind and by company. Give the user the role links: each opens the role on Sales Legends, where they apply. For investors and analysts, get_hiring_radar describes the sales hiring dataset.",
      "tools": [
        {
          "name": "get_hiring_radar",
          "title": "Sales hiring data for investors",
          "description": "Hiring radar, the dataset Sales Legends keeps on sales hiring for investors and analysts: each sales opening read from employers' careers boards since the board started, a row per role with its posted pay, kind, countries and the days it opened and closed, with every employer day by day and a change log. The answer gives today's coverage, the files, who they are for, the price and how to request a sample. Call it only for someone buying or evaluating the full history. Today's counts come from get_sales_market and single roles from search_sales_jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Sales hiring data for investors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:18423f12a3a10e1138f7735691f4e895d6df5a8a2b86721261d1e0204745becf"
        },
        {
          "name": "get_sales_market",
          "title": "Open sales roles by kind and employer",
          "description": "How many sales roles are open today and how many went up in the past 7 days, broken down by kind of sales role and by employer (with the slug search_sales_jobs accepts). Give a country to count only roles open to people there. Call it to size the market for salespeople, to see which employers are hiring most, or to look up an employer's slug before search_sales_jobs with platform. The roles themselves come from search_sales_jobs and the pay from get_sales_pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "An ISO 3166-1 two-letter country code ('US', 'DE' and so on); the counts cover only roles open to people in that country.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Open sales roles by kind and employer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:61a0e03b2de58c9951e520f7aae008d61dfb8ec6e265e6796466a1dc6172cb56"
        },
        {
          "name": "get_sales_pay",
          "title": "Posted pay for each kind of sales role",
          "description": "Today's posted pay for every kind of sales role: the median and the 25th to 75th percentile of the figures employers state, with the number of figures and employers behind each. A kind is included only when at least three employers state pay for it. Call it when the user asks what a sales role pays, such as a first-line sales manager or a VP of sales. It returns no roles; to find roles above a pay figure, call search_sales_jobs with min_pay_usd.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Posted pay for each kind of sales role"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:12ae5dc2aa3c7aecd7646eb59ddce48868b12247c6c852e2581a8eeb34ae47ba"
        },
        {
          "name": "search_sales_jobs",
          "title": "Search sales jobs",
          "description": "Searches the open sales roles (sales and SDR managers, directors and heads of sales, every level of sales. A result carries the title, the employer, the kind of sales role, the posted pay, the location and a link to the role on Sales Legends, where the application starts. No filter is required. Call it when the user wants real openings to read or apply to, a pay floor included (min_pay_usd). For what a kind of sales role pays across the market call get_sales_pay; for counts of open roles by kind or employer call get_sales_market.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "An ISO 3166-1 two-letter country code ('US', 'GB', 'CA' and so on); returns only roles that people in that country can take.",
                "type": "string"
              },
              "kind": {
                "description": "One kind of sales role, as one of the slugs listed.",
                "enum": ["sales-development", "account-executive", "account-management", "customer-success", "sales-engineering", "partner-sales", "revenue-operations", "sales-leadership", "retail-sales"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many roles come back, 1 to 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_hourly_usd": {
                "description": "The floor as an hourly figure, turned into a year at 2,080 hours. Use min_pay_usd unless the user named an hourly rate.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "min_pay_usd": {
                "description": "Returns roles whose posted range tops out at this many US dollars a year or more, for example 250000 for a $250k base or OTE. Pay quoted by the hour is counted at 2,080 hours a year.",
                "maximum": 4160000,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "A single employer, by slug; get_sales_market returns each employer with open roles and the slug to pass here.",
                "type": "string"
              },
              "query": {
                "description": "Words matched against role titles, such as 'VP of sales', 'SDR manager', 'EMEA', 'healthcare' or 'renewals'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search sales jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:629969e0e4ef54b30b7531894687ad301e4d82d30bd352fb0e63b3222f5d17e9"
        }
      ],
      "digest": "sha256:785bae6643d6b3815cb6a22f6e78b69266733af84b0d9d6263c5940625a16694"
    }
  }
}
