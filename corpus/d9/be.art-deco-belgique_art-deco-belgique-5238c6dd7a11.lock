      },
      "instructions": "Corpus vérifié de bâtiments Art déco et de l’entre-deux-guerres en Belgique (Bruxelles, Wallonie, Flandre) et dans les Hauts-de-France : fiches, architectes, communes, parcours. Chaque fiche est vérifiée à la source (inventaires officiels, base Mérimée) ; le statut « classé » renvoie au registre officiel. Les institutions (musées, centres culturels…) sont distinctes des bâtiments qu’elles occupent : search_institutions. Commencer par search_buildings ou buildings_near, puis get_building pour le détail et les sources. Le français fait foi. Chaque entité a une adresse stable qui renvoie son JSON-LD (https://art-deco-belgique.be/id/batiment/<id>, /id/architecte/<id>…) ; schéma du corpus : https://art-deco-belgique.be/schema/v1/ (voir corpus_info). Citer « Art Déco Belgique (art-deco-belgique.be) » avec l’identifiant de la fiche ; licence CC BY 4.0.",
      "tools": [
        {
          "name": "buildings_near",
          "title": "Bâtiments à proximité",
          "description": "Bâtiments autour d’un point, triés par distance. Les fiches à position approximative sont exclues.",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "fr",
                "description": "Langue des textes renvoyés (fr fait foi)",
                "enum": ["fr", "en", "nl"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude WGS84",
                "type": "number"
              },
              "limit": {
                "default": 20,
                "description": "1-100",
                "type": "integer"
              },
              "lon": {
                "description": "Longitude WGS84",
                "type": "number"
              },
              "radius_km": {
                "default": 2,
                "description": "Rayon en km (0,1-50)",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
