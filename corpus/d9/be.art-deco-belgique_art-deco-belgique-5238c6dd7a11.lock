            "properties": {
              "architect": {
                "description": "Architecte ou auteur (nom ou identifiant)",
                "type": "string"
              },
              "city": {
                "description": "Commune (nom ou identifiant, ex. « Ixelles », « liege ») ; « Bruxelles » couvre les 19 communes de la Région",
                "type": "string"
              },
              "lang": {
                "default": "fr",
                "description": "Langue des textes renvoyés (fr fait foi)",
                "enum": ["fr", "en", "nl"],
                "type": "string"
              },
              "limit": {
