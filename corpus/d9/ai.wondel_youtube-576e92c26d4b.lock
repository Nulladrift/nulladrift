{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/youtube": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/youtube/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "YouTube",
        "title": "YouTube MCP",
        "version": "1.0.0",
        "description": "YouTube search: find videos, fetch details and comments, pull full transcripts.",
        "websiteUrl": "https://mcps.wondel.ai/servers/youtube/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from YouTube (https://www.youtube.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "youtube_search",
          "title": "Search YouTube (SerpAPI)",
          "description": "Search YouTube live via SerpAPI. Returns video_results (videos), plus channels, playlists, movies and related searches. Each video result's id is the YouTube video id — feed it as `v` to youtube_video (details, related videos, comments) and to youtube_transcript. `sp` carries SerpAPI filter and next-page tokens from a prior result for pagination / refined filtering.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "gl": {
                "description": "Country code for the search, e.g. 'us', 'uk', 'de'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'pt-br'.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "search_query": {
                "description": "Search query for YouTube (required). Same syntax as the YouTube search box.",
                "type": "string"
              },
              "sp": {
                "description": "Filter / pagination token from a prior result: carries YouTube search filters and the next-page token.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["search_query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7bf3ffe261bb8f47ec6e79c9e5071743536d11444af6b11e58b660d703aae55d"
        },
        {
          "name": "youtube_transcript",
          "title": "Get YouTube Transcript (SerpAPI)",
          "description": "Fetch a YouTube video's transcript via SerpAPI. `v` is the video id from a youtube_search result. Pick a track with language_code (default 'en' — use the video's own language), and optionally title and type ('asr' for auto-generated captions). When the requested track doesn't exist the tool falls back once to an available track (same language first, manual before auto-generated) and says so in `note`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language_code": {
                "description": "Transcript language code, e.g. 'en', 'pl'. Default 'en' — pass the video's own language. If that track doesn't exist, an available one is used instead and `note` says which.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "title": {
                "description": "Transcript track title to select when multiple tracks exist.",
                "type": "string"
              },
              "type": {
                "description": "Transcript track type: 'asr' for auto-generated captions; omit for manual captions. If that track doesn't exist, an available one is used instead and `note` says which.",
                "type": "string"
              },
              "v": {
                "description": "YouTube video id (required) — the id from a youtube_search result.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["v"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51b6eb22d4a62228abc28beccd71997b18c6d0212f47e111a35c433b613a8fbd"
        },
        {
          "name": "youtube_video",
          "title": "Get YouTube Video (SerpAPI)",
          "description": "Fetch a single YouTube video by id via SerpAPI: details, related videos, comments and replies. `v` is the video id from a youtube_search video_results entry. Page related videos / comments / replies with next_page_token from a prior result.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "gl": {
                "description": "Country code for the search, e.g. 'us', 'uk', 'de'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'pt-br'.",
                "type": "string"
              },
              "next_page_token": {
                "description": "Token from a prior result to page through related videos, comments, or replies.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "v": {
                "description": "YouTube video id (required), e.g. the id from a youtube_search video_results entry.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["v"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97e1e57ce290e846cc033b4a5020f32a9f9eea155e0d0c71f41dda819a71cb15"
        }
      ],
      "digest": "sha256:0e5c8e641490758199f6871a8c7b208e8104f9eb555d4db7410345fe8270540e"
    }
  }
}
