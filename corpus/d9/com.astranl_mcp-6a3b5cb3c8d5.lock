        {
          "name": "ground_citation",
          "description": "Check one scientific reference before you reuse or cite it, with ONE call. Give a DOI. AstraNL reads the Crossref work record and every Crossref notice that updates it, the OpenAlex retraction flag and the Europe PMC publication types and retraction, erratum and concern links, and returns a status: RETRACTION_NOTICE_FOUND, EXPRESSION_OF_CONCERN_FOUND, CORRECTION_NOTICE_FOUND, NO_NOTICE_IN_CHECKED_SOURCES or NOT_FOUND_IN_CHECKED_SOURCES, with each notice DOI, type and date, the source URLs and the observation time. Every fresh answer carries a SHA-256 digest sealed with the AstraNL moment seal and an AstraLock event id you can check later with verify_astranl. Limits: registry data at the observed time, never a judgement of the science; NO_NOTICE_IN_CHECKED_SOURCES means only these three registries; answers are cached for 24 hours. Never contacts authors or publishers. Writes (why the tool is not read-only): each fresh answer, not one served from the 24 hour cache, appends one event to the public AstraLock log with the DOI, the digest and the status, so the answer can be verified later, and stores the answer in an AstraNL database table (citation_groundings) that serves the cache and counts the budget; the row names only the door (mcp), nothing about the caller. Live budget: 300 fresh reads a day across all MCP callers; after that only cached answers, status DAILY_LIVE_BUDGET_SPENT. Logging: every MCP call is journaled with the tool name, outcome, argument length, caller class (external, probe, crawler, self), a SHA-256 hash of the caller network /24 and the client family; for demand statistics also the first 160 characters of a query, question, title or id argument and the user-agent; never the address itself, other arguments or an account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "doi": {
                "description": "the DOI of the work, bare or as a doi.org link, e.g. 10.1038/s41593-021-00895-5",
                "maxLength": 300,
                "minLength": 7,
                "type": "string"
              }
            },
            "required": ["doi"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check a scientific reference for retraction and correction notices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "free",
              "do_not_use_when": "you have no DOI, or you need an opinion on whether the science holds",
              "example_intent": "Has 10.1016/S0140-6736(97)11096-0 been retracted, and where is the notice?",
              "next_possible_action": "verify_astranl with the astralock_event id; open the notice DOIs; a coordination case for anything beyond a registry check",
              "proof_level": "public registry data at observation time, digest sealed by AstraNL; not a judgement of the work",
              "required_inputs": ["doi"],
              "returns": "status, notices with DOI, type and date, OpenAlex retraction flag, Europe PMC types and links, per-source status and URLs, proof with digest, moment seal and AstraLock event",
              "side_effect_class": "writes_public_log_event_and_db_row_on_fresh_answer",
              "use_when": "you are about to cite, reuse or rely on a paper and need to know whether a retraction, correction or expression of concern is on record, with sources and a proof"
            }
          },
          "digest": "sha256:879eb9354f2a374803f9671a8717b82459b572f875703bbbe602c1022736a73e"
        },
        {
          "name": "ground_component",
          "description": "Ground a machine, robot or industrial automation component in live market reality with ONE call. Give a manufacturer part number and optionally the maker. AstraNL queries its verified distributor connections (Nexar/Octopart, Mouser, element14/Farnell NL, OEMsecrets) in parallel, keeps only offers whose part number matches exactly after normalisation, screens maker and sellers against the EU consolidated sanctions list and the US Consolidated Screening List, and returns availability, stock seen, authorized sellers, lowest unit price seen in EUR, lifecycle values and per-source status. When AstraNL holds the manufacturer own lifecycle or discontinuation page for the part, the answer also carries manufacturer_lifecycle: status, date, the successor the manufacturer names and the page SHA-256, kept separate from seller-reported values; asking for a successor also shows which discontinued part it replaces. Every fresh answer carries a SHA-256 digest sealed with the AstraNL moment seal and an AstraLock event id you can check later with verify_astranl. Limits: distributor data is seller-reported at the observed time, not a quote and not a delivery promise; NOT_FOUND_IN_CHECKED_SOURCES means only these sources; answers are cached for 24 hours. Never orders, contacts or pays anyone. To record an agreement made with a seller, use commitment_attest with based_on holding proof.astralock_event. Writes (why the tool is not read-only): each fresh answer, not one served from the 24 hour cache, appends one event to the public AstraLock log with the part number, the maker, the digest, the availability and the number of exact offers, so the answer can be verified later, and stores the answer in an AstraNL database table (component_groundings) that serves the cache and counts the budget; the row names only the door (mcp), nothing about the caller. Live budget: 40 fresh reads a day across all MCP callers; after that only cached answers, status DAILY_LIVE_BUDGET_SPENT. Logging: every MCP call is journaled with the tool name, outcome, argument length, caller class (external, probe, crawler, self), a SHA-256 hash of the caller network /24 and the client family; for demand statistics also the first 160 characters of a query, question, title or id argument and the user-agent; never the address itself, other arguments or an account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "manufacturer": {
                "description": "optional maker name, e.g. Allen-Bradley; offers from other makers are then dropped",
                "maxLength": 80,
                "type": "string"
              },
              "mpn": {
                "description": "manufacturer part number, exactly as printed by the maker, e.g. 1756-L85E",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["mpn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ground a component in live market reality"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "free",
              "do_not_use_when": "you only have a generic description without a part number (use ask_astranl), or you need a binding quote or delivery date",
              "example_intent": "Mitsubishi says Q03UDCPU ends production; is any still in stock and what is the successor?",
              "next_possible_action": "verify_astranl with the astralock_event id; check_counterparty_nl before paying a seller; create_task when a physical step is needed in the Netherlands; commitment_attest with based_on holding proof.astralock_event to record an agreement made with a seller; the other party will see the grounded facts",
              "proof_level": "seller-reported structured data at observation time, digest sealed by AstraNL; not a quote",
              "required_inputs": ["mpn", "optional manufacturer"],
              "returns": "summary with availability, stock, sellers, authorized sellers, lowest EUR price seen, lifecycle; manufacturer_lifecycle with status, date, named successor and page sha256 where held; exact offers; per-source status; sanctions screening; proof with digest, moment seal and AstraLock event",
              "side_effect_class": "writes_public_log_event_and_db_row_on_fresh_answer",
              "use_when": "you need to know whether a specific machine, robot, PLC, drive, servo, gearbox, sensor or electronic part is really obtainable now, from whom, at roughly what price, with proof"
            }
