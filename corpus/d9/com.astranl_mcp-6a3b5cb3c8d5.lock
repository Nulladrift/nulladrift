          },
          "meta": {
            "astranl": {
              "auth_requirement": "project agent key (X-Agent-Key, agk_...)",
              "cost_or_fee_if_any": "free",
              "do_not_use_when": "you need approval, checkout, payment, dispatch, receipt confirmation, or a store order",
              "next_possible_action": "a project administrator reviews and approves the exact list",
              "required_inputs": ["action", "project agent key on the connection"],
              "side_effect_class": "creates_draft_lists_only",
              "use_when": "you hold an estimate token and a project agent key and need to import, inspect or finish a purchase-list draft"
