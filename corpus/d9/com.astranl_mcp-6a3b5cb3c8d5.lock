        {
          "name": "construction_leadtimes",
          "description": "Permit lead times (application to decision, median and quartiles) from official pairs. Currently CLOSED: the answer says CLOSED with the reason until validation gate C passes; no lead time is estimated before that. Permit aggregates only: no permit rows, publication identifiers, titles, addresses, points or names; permit counts below 5 per authority per kind are shown as <5 and totals that would reveal one are lower bounds (>=n). Read-only. Every answer carries source provenance (source, source_url, licence, as_of, retrieved_at = when AstraNL last read the source, served_at, method, status) and an exposure block.",
