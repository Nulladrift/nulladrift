              "returns": "summary with availability, stock, sellers, authorized sellers, lowest EUR price seen, lifecycle; manufacturer_lifecycle with status, date, named successor and page sha256 where held; exact offers; per-source status; sanctions screening; proof with digest, moment seal and AstraLock event",
              "side_effect_class": "writes_public_log_event_and_db_row_on_fresh_answer",
              "use_when": "you need to know whether a specific machine, robot, PLC, drive, servo, gearbox, sensor or electronic part is really obtainable now, from whom, at roughly what price, with proof"
            }
