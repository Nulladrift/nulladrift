                "type": "string"
              },
              "project_id": {
                "description": "the project case id, PRJ-...",
                "pattern": "^PRJ-[A-Z0-9-]{1,80}$",
                "type": "string"
              },
              "version": {
                "description": "the current_version of the list as read",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare project materials for administrator approval"
          },
          "behavior": {
