        {
          "name": "check_counterparty_nl",
          "description": "Contractor check and counterparty check for the Netherlands and the EU. Call it BEFORE paying an advance, a deposit or an invoice to a Dutch contractor, builder or other supplier, before signing a quote or order, and before onboarding a customer. Give the KvK number (8 digits, as text) from the quote, invoice or contract, and the company name and EU VAT number if you have them. Without a KvK number or VAT number only the sanctions screening of the name can run: AstraNL does not search the Dutch register by name or website, so read the number from the document or ask the counterparty. Returns verdicts, not register data: whether the KvK number has an active registration, whether the name matches a registered name, whether the VAT number is valid in VIES and its VIES name matches the register, EU sanctions list candidates, whether an insolvency case is published under the KvK number, open questions and a check_id. Read-only. PAID: AstraNL pays for every KvK register query, so any call with a kvk_number answers status payment_required and reads nothing unless it is paid; the paid route for agents is GET https://astranl.com/api/contractor-check/sealed?q=<KvK number> with header X-Agent-Key, 0.25 EUR per sealed call from the prepaid AstraNL agent wallet, and people pay on https://astranl.com/nl/contractor-check/ at 4.95 EUR per check or 9.95 EUR for three. Without a kvk_number only VIES and the sanctions screening run, and they do not read the KvK register. For a firm whose main registered activity is construction or construction related (architects, engineering offices and a few trade codes) it also returns contractor_report, facts with source and observed_at: registration age, legal form, SBI activity fit, registered address in Kadaster BAG, insolvency, VIES, EU public contract awards and attention points such as younger than 1 year or a name similar but not identical to a registered name. For a firm whose main activity is a holding company or is neither construction nor construction related the report is not attached here. Limits: 8 calls a minute and 60 a day per calling network; calls the server cannot attribute to a network share one pool of 30 a minute and 300 a day; beyond that the answer is status rate_limited with retry_after_seconds, a polling hint of 60 after a minute burst and 3600 after the daily limit. AstraNL internal calls are not subject to the per-network limits or the payment rule, but one service-wide daily capacity of 600 calls applies to all callers. Paid route: the contractor facts as a signed report with an ed25519 receipt, 0.25 EUR per sealed call from the prepaid AstraNL agent wallet, GET https://astranl.com/api/contractor-check/sealed?q=<KvK number> with header X-Agent-Key; without a key or balance it answers 402 with how to pay. The check_id identifies this result for 48 hours. It does not prove who may sign for the company, who owns a bank account, solvency or reliability.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "city": {
                "description": "not used; kept for compatibility, AstraNL does not search the register by name",
                "maxLength": 80,
                "type": "string"
              },
              "company_name": {
                "description": "the company name exactly as your document or contact states it",
                "maxLength": 200,
                "type": "string"
              },
              "kvk_number": {
                "description": "Dutch KvK number, exactly 8 digits, sent as text so a leading zero is kept, as printed on the invoice, quote, contract or website imprint",
                "maxLength": 12,
                "type": "string"
              },
              "purpose": {
                "description": "optional: the next action you are about to take, for example approve supplier or pay invoice",
                "maxLength": 200,
                "type": "string"
              },
              "vat_number": {
                "description": "EU VAT number with country prefix, for example NL810433941B01",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Contractor check before paying: Dutch or EU counterparty"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none to call; a KvK read needs the prepaid agent wallet, header X-Agent-Key, on the sealed route",
              "cost_or_fee_if_any": "a check with a kvk_number is paid first: 0.25 EUR per sealed call from the prepaid agent wallet at GET /api/contractor-check/sealed; unpaid it answers payment_required and reads nothing. VIES and sanctions screening without a kvk_number read no KvK data",
              "do_not_use_when": "you need to know who may legally sign for the company, whether an IBAN belongs to it, its credit risk or solvency; this tool cannot tell you that",
              "example_intent": "Before we pay invoice 2026-114 from SUPPLIER B.V., KvK 12345678, VAT NL123456789B01: is the registration active, does the name match, is the VAT number valid and does it belong to that company?",
              "next_possible_action": "record_counterparty_check with the check_id when someone else must verify it later; attach check_id and the result to your own approval or payment record; stop and ask a human when any source is UNKNOWN, a name does not match, a sanctions candidate appears or an establishment is inactive",
              "proof_level": "observation of official sources at observed_at; verifiable by others after record_counterparty_check; never a statement that the counterparty is trustworthy",
              "required_inputs": ["kvk_number for the register verdicts", "company_name for the name verdict", "vat_number for VIES"],
              "returns": "verdicts derived from the sources, not the register data: KvK registration found and active or not, supplied name against the register EXACT or NORMALIZED_MATCH or NO_MATCH, VAT valid in VIES, VIES name against the register, EU sanctions list candidates, open questions, a check_id and a link to the KVK source; record_counterparty_check turns it into a public verifiable record; access_basis names the evidence class, accountable holder, terms and recheck rule of each source",
              "side_effect_class": "read_only; the digest of the result is kept 48 hours so it can be recorded on request",
              "use_when": "you are about to act on a counterparty you know only from a document, email or website: approve a supplier, pay an invoice, sign an order, onboard a customer, and you need the official register facts and a record you can attach to your approval; in particular before a person pays an advance or signs with a Dutch construction firm, where it adds contractor_report"
            }
          },
          "digest": "sha256:69379dda68799ceec7e88fbc7cdd58cbc3012b0bc61780992db9d5836e5942c8"
