        {
          "name": "ground_astranl",
          "description": "Get compact, source-linked real-world context for an LLM in ONE read-only call. Searches AstraNL public materials or tender records, or its protocol identity. Use source=public_tenders for tenders, materials for products; auto keeps domains separate. Returns record update times, fresh/stale/unknown labels, record disagreements, coverage gaps and ready-to-use context_text. Never books, contacts or pays anyone. Not a general web search: no match is not proof of absence. Optional astranl.reality-link.v2 profile checks exact source-record claims. It does not promote registry records to independently verified real-world facts. official.deadline on tender:TED-* records is checked live at the EU publisher (TED), budgeted and cached; unavailable means UNKNOWN.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_ms": {
                "default": 750,
                "maximum": 1500,
                "minimum": 50,
                "type": "integer"
              },
              "claims": {
                "description": "v2 only. Each claim names a record id from a previous result, a predicate and the expected value.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expected": {
                      "anyOf": [
                        {
                          "maxLength": 600,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "amount": {
                              "pattern": "^\\d{1,10}(\\.\\d{1,2})?$",
                              "type": "string"
                            },
                            "currency": {
                              "pattern": "^[A-Z]{3}$",
                              "type": "string"
                            }
                          },
                          "required": ["amount", "currency"],
                          "type": "object"
                        }
                      ]
                    },
                    "id": {
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "predicate": {
                      "enum": ["record.title", "record.brand", "record.listed_price", "record.stock_reported", "record.closing_date", "reality.stock_available", "reality.delivery_by", "reality.suitable_for", "official.deadline"],
                      "type": "string"
                    },
                    "record_id": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["expected", "id", "predicate", "record_id"],
                  "type": "object"
                },
                "maxItems": 16,
                "minItems": 1,
                "type": "array"
              },
              "max_age_seconds": {
                "default": 86400,
                "maximum": 604800,
                "minimum": 60,
                "type": "integer"
              },
              "max_items": {
                "default": 6,
                "description": "v1 only; v2 looks up at most 12 records and refuses max_items.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "protocol": {
                "description": "Omit for the v1 context call. Set to astranl.reality-link.v2 together with claims to check typed claims against source records.",
                "enum": ["astranl.reality-link.v2"],
                "type": "string"
              },
              "query": {
                "description": "Short subject, product keywords or identifier; all product keyword groups must match.",
                "maxLength": 1600,
                "minLength": 2,
                "type": "string"
              },
              "source": {
                "default": "auto",
                "description": "v1: auto, materials, public_tenders, protocol_identity or all. v2 requires an explicit materials, public_tenders or protocol_identity.",
                "enum": ["auto", "materials", "public_tenders", "protocol_identity", "all"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Source-linked context for an answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you need a quote, a booking, a web search, or proof about a specific AstraNL task",
              "example_intent": "Current Dutch public tenders for ventilation cleaning, with sources and closing dates",
              "next_possible_action": "fetch a record id for detail; ask_astranl to turn a need into a task",
              "proof_level": "source-attributed records with observation time; not signed",
              "required_inputs": ["query", "optional source: auto, materials, public_tenders, protocol_identity, all"],
              "returns": "records with update times and fresh/stale/unknown labels, disagreements, coverage gaps, ready context_text; a cached price is not a quote",
              "side_effect_class": "read_only",
              "use_when": "you want source-linked real-world context for an answer: Dutch public tenders, building material products and prices, or AstraNL protocol identity"
            }
          },
