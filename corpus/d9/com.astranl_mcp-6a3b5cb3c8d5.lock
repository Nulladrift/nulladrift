{
  "lockfileVersion": 2,
  "subjects": {
    "com.astranl/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://astranl.com/mcp/streamable"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "astranl-mcp",
        "version": "1.37.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AstraNL connects a real task to a verified real-world outcome in the Netherlands and returns evidence another system can check. If you do not know which tool fits, call ask_astranl with your task in plain words: it returns which tool to call, what to supply, what can and cannot be verified, and whether AstraNL can help at all. To have a task executed use create_task; to follow it use check_task; for signed evidence use get_evidence; to check a reference someone gave you use verify_astranl; for source-linked context on tenders or products use ground_astranl. To know whether a machine, robot or automation component is really obtainable now, from whom and with a sealed proof, call ground_component with its manufacturer part number. Before citing or reusing a paper, call ground_citation with its DOI for retraction, correction and concern notices. For a renovation or building job in the Netherlands, call nl_municipal_build_rules with the municipality and the bouwkosten for the sourced permit fee and the skip-on-the-street rule. Before paying, onboarding or signing with a Dutch or EU company, use check_counterparty_nl: official register, VAT and sanctions facts, read-only; record_counterparty_check makes one result verifiable by a colleague. Reading, asking and verifying need no key and cost nothing; AstraNL charges 1 percent only on a completed paid coordination. Every tool states in meta.astranl when to use it, what it returns and what it does not verify. For Dutch construction facts (permit aggregates with measured accuracy, open public works tenders, law calendar, CBS economy, emission zones, Natura 2000, a CloudEvents feed) use the read-only construction_* tools.",
      "tools": [
        {
          "name": "ask_astranl",
          "description": "Turn a real-world task or question into a routing decision: whether AstraNL can help, which one tool to call, what to supply, what can and cannot be verified. No commitment, nothing created, no key. Also answers whether a physical task is feasible in the Netherlands.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "your task or question in plain words, any language",
                "maxLength": 400,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Route a task to the right AstraNL tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you already hold an AstraNL reference id (use verify_astranl or get_evidence) or you are ready to have a task executed (use create_task)",
              "example_intent": "I need someone to inspect a used car in Haarlem before Friday, budget 150 euro; can you do that and what proof would I get?",
              "next_possible_action": "call the recommended_tool with the required_inputs",
              "proof_level": "none; this call verifies nothing and commits nobody",
              "required_inputs": ["question: your task or need in plain words, any language"],
              "returns": "routing: can_astranl_help, recommended_tool, required_inputs, what_can_be_verified, what_cannot_be_verified, next_action, reason; plus feasibility or public opportunities when relevant",
              "side_effect_class": "read_only",
              "use_when": "you have a real-world task or question and do not yet know which AstraNL tool applies; or you want a no-commitment answer whether AstraNL can get something done in the Netherlands"
            }
          },
          "digest": "sha256:8c0a593f1ad24fc566c069aebd74c8e41a3e7f9655022f3efbbba3f983ca0876"
        },
        {
          "name": "check_counterparty_nl",
          "description": "Check a Dutch or EU counterparty against official sources before your own next step, such as onboarding a supplier, paying an invoice or signing an order. Give the KvK number, the company name and the EU VAT number as your document states them. Returns verdicts, not register data: whether the KvK number has an active registration, whether the name matches a registered name, whether the VAT number is valid in VIES and whether its VIES name matches the register, EU sanctions list candidates, whether an insolvency case is published under the KvK number in the Dutch insolvency register, open questions and a check_id. Read-only, no key, no cost. AstraNL does not search the Dutch register by name; look a number up at kvk.nl. When a colleague or auditor must verify it later, call record_counterparty_check with the check_id. It does not prove who may sign for the company, who owns a bank account, solvency or reliability.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "city": {
                "description": "not used; kept for compatibility, AstraNL does not search the register by name",
                "maxLength": 80,
                "type": "string"
              },
              "company_name": {
                "description": "the company name exactly as your document or contact states it",
                "maxLength": 200,
                "type": "string"
              },
              "kvk_number": {
                "description": "Dutch KvK number, 8 digits, as printed on the invoice, quote or website",
                "maxLength": 12,
                "type": "string"
              },
              "purpose": {
                "description": "optional: the next action you are about to take, for example approve supplier or pay invoice",
                "maxLength": 200,
                "type": "string"
              },
              "vat_number": {
                "description": "EU VAT number with country prefix, for example NL810433941B01",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a Dutch or EU counterparty"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0; AstraNL pays the register subscription",
              "do_not_use_when": "you need to know who may legally sign for the company, whether an IBAN belongs to it, its credit risk or solvency; this tool cannot tell you that",
              "example_intent": "Before we pay invoice 2026-114 from SUPPLIER B.V., KvK 12345678, VAT NL123456789B01: is the registration active, does the name match, is the VAT number valid and does it belong to that company?",
              "next_possible_action": "record_counterparty_check with the check_id when someone else must verify it later; attach check_id and the result to your own approval or payment record; stop and ask a human when any source is UNKNOWN, a name does not match, a sanctions candidate appears or an establishment is inactive",
              "proof_level": "observation of official sources at observed_at; verifiable by others after record_counterparty_check; never a statement that the counterparty is trustworthy",
              "required_inputs": ["kvk_number for the register verdicts", "company_name for the name verdict", "vat_number for VIES"],
              "returns": "verdicts derived from the sources, not the register data: KvK registration found and active or not, supplied name against the register EXACT or NORMALIZED_MATCH or NO_MATCH, VAT valid in VIES, VIES name against the register, EU sanctions list candidates, open questions, a check_id and a link to the KVK source; record_counterparty_check turns it into a public verifiable record; access_basis names the evidence class, accountable holder, terms and recheck rule of each source",
              "side_effect_class": "read_only; the digest of the result is kept 48 hours so it can be recorded on request",
              "use_when": "you are about to act on a counterparty you know only from a document, email or website: approve a supplier, pay an invoice, sign an order, onboard a customer, and you need the official register facts and a record you can attach to your approval"
            }
          },
          "digest": "sha256:ccda424b26f009598c4ba9b3f71fefeef6dfbb7db5ab119904cf6320213906ca"
        },
        {
          "name": "check_estimate_materials",
          "description": "Check every material line of an AstraNL estimate case you hold the token of (from estimate_case_create) against the current offer of the same product: PRICE_UP or PRICE_DOWN beyond 5 percent, UNAVAILABLE, NOT_FOUND_IN_CHECKED_SOURCES, CHEAPER_SAME_GTIN at another store, each with source and read time, plus the open findings of the daily monitor for that case. Read-only; an estimate is re-read live at most once in 6 hours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_id": {
                "pattern": "^ESTREQ-[0-9]{8}-[0-9a-f]{8}$",
                "type": "string"
              },
              "token": {
                "maxLength": 256,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["case_id", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check the materials of an estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "the estimate case token",
              "cost_or_fee_if_any": "free",
              "required_inputs": ["case_id", "token"],
              "side_effect_class": "read_only",
              "use_when": "an estimate you created has materials and you want to know whether their prices or stock changed before ordering"
            }
          },
          "digest": "sha256:686a45e0dd17d5e114283db0095df6dd046010a23309757fac556a377e1ffdeb"
        },
        {
          "name": "check_material",
          "description": "Check one building material in live Dutch store reality with ONE read-only call. Exact identity only: a GTIN with valid check digit, a store variant or the exact partner feed link; plain words return candidates you can check exactly next. Returns every offer of the same trade item with price incl. VAT, stock and read time per store (Bouwmaat, Hubo, Houtdirect through UCP search; partner shop feeds), the identical GTIN at other stores (verdict DIRECT_SUBSTITUTE, the only substitute named), the cheapest available offer, per source status and a sha256 digest. Limits: seller prices at read time, not a quote or delivery promise; delivery costs not included; NOT_FOUND covers only the sources listed. Never orders, pays or contacts anyone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ref": {
                "description": "a GTIN or EAN with valid check digit (e.g. 8710839100056), a Bouwmaat, Hubo or Houtdirect product link with ?variant=, a partner shop product link, store:variant (e.g. hubo:48564194312444), or plain words for candidates",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a building material in live store reality"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "free",
              "do_not_use_when": "you need a binding quote, a reservation or an order; or the part is a machine or robot component with a manufacturer part number (use ground_component)",
              "example_intent": "Is Alabastine Muurvuller 8710839100056 cheaper elsewhere right now?",
              "next_possible_action": "estimate_case_create to price a whole job; check_estimate_materials to watch its materials",
              "required_inputs": ["ref"],
              "side_effect_class": "read_only",
              "use_when": "you need the current price and stock of a specific building material, or want to know whether the identical trade item is cheaper at another Dutch store, with proof of where and when it was read"
            }
          },
          "digest": "sha256:80c9cab334463fc4d921ca23285ea0b06ca85ed3bbedd2aeabf4c0953b1afe63"
        },
        {
          "name": "check_task",
