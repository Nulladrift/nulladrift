        {
          "name": "get_app",
          "title": "Get app details",
          "description": "Use this when someone asks about one of their AppSkyline apps, such as which stores it is on or which languages it supports. Returns the app's name, default and supported locales, App Store, Mac App Store, Google Play and Microsoft Store ids, and creation and edit times. Not for the live public store page or ratings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "AppSkyline app id (uuid)",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "app": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "creationTime": {
                        "anyOf": [
                          {
                            "maxLength": 64,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "defaultLocale": {
                        "anyOf": [
                          {
                            "maxLength": 32,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "googlePlayStorePackage": {
                        "$ref": "#/properties/app/anyOf/0/properties/name"
                      },
                      "id": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "iosAppStoreId": {
                        "$ref": "#/properties/app/anyOf/0/properties/name"
                      },
                      "lastEditTime": {
                        "anyOf": [
                          {
                            "maxLength": 64,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "locales": {
                        "items": {
                          "maxLength": 32,
                          "type": "string"
                        },
                        "maxItems": 100,
                        "type": "array"
                      },
                      "macosAppStoreId": {
                        "$ref": "#/properties/app/anyOf/0/properties/name"
                      },
                      "name": {
                        "anyOf": [
                          {
                            "maxLength": 200,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "windowsStoreProductId": {
                        "$ref": "#/properties/app/anyOf/0/properties/name"
                      }
                    },
                    "required": ["creationTime", "defaultLocale", "googlePlayStorePackage", "id", "iosAppStoreId", "lastEditTime", "locales", "macosAppStoreId", "name", "windowsStoreProductId"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null when the app is not in the signed-in account"
              },
              "status": {
                "enum": ["found", "not-found"],
                "type": "string"
              }
            },
            "required": ["app", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get app details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["appskyline:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:88ee1078b6373b942987a81154f5551b3376cef7242d59b30dbe8821bc2aa77a"
