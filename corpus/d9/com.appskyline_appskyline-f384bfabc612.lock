        {
          "name": "get_app_engagement_summary",
          "title": "Get downloads and installs",
          "description": "Use this when someone asks how many downloads, installs, uninstalls or crashes their app had over a period. Returns store-reported totals, the latest 30 daily rows and top countries for one app and store; metric names differ by store. Not for keyword rankings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "AppSkyline app id (uuid)",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "days": {
                "description": "Rolling window of the last 1 to 365 days, used when no dates are given; omit dates and days for every synced day",
                "exclusiveMinimum": 0,
                "maximum": 365,
                "type": "integer"
              },
              "endDate": {
                "description": "Last day of the window as YYYY-MM-DD; applies only together with startDate",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "startDate": {
                "description": "First day of the window as YYYY-MM-DD; applies only together with endDate",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "store": {
                "description": "Store to summarize: ios-app-store, macos-app-store, google-play or microsoft-store",
                "enum": ["ios-app-store", "macos-app-store", "google-play", "microsoft-store"],
                "type": "string"
              }
            },
            "required": ["appId", "store"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appId": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "dailySeries": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "name": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "rows": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "date": {
                              "anyOf": [
                                {
                                  "maxLength": 32,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "metrics": {
                              "items": {
                                "$ref": "#/properties/totals/items"
                              },
                              "maxItems": 6,
                              "type": "array"
                            }
                          },
                          "required": ["date", "metrics"],
                          "type": "object"
                        },
                        "maxItems": 30,
                        "type": "array"
                      },
                      "totalRows": {
                        "maximum": 1000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "totalRowsIsLowerBound": {
                        "type": "boolean"
                      },
                      "truncated": {
                        "type": "boolean"
                      }
                    },
                    "required": ["name", "rows", "totalRows", "totalRowsIsLowerBound", "truncated"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The most recent 30 days of one daily metric series"
              },
              "dataThrough": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "lastSyncedAt": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "status": {
                "enum": ["found", "empty"],
                "type": "string"
              },
              "store": {
                "enum": ["ios-app-store", "macos-app-store", "google-play", "microsoft-store"],
                "type": "string"
              },
              "topTerritories": {
                "description": "Up to 8 leading countries or territories by downloads or installs",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "totals": {
                "description": "Store-reported totals for the window; metric names differ by store",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "value": {
                      "maximum": 1000000000000000,
                      "minimum": -1000000000000000,
                      "type": "number"
                    }
                  },
                  "required": ["name", "value"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "totalsTruncated": {
                "type": "boolean"
              }
            },
            "required": ["appId", "dailySeries", "dataThrough", "lastSyncedAt", "status", "store", "topTerritories", "totals", "totalsTruncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get downloads and installs"
          },
          "behavior": {
            "destructive": false,
