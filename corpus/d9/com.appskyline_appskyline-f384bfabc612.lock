                        {
                          "type": "null"
                        }
                      ]
                    },
                    "fetchedAt": {
                      "anyOf": [
                        {
                          "maxLength": 64,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "keyword": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "keywordDifficulty": {
                      "anyOf": [
                        {
                          "maximum": 100,
