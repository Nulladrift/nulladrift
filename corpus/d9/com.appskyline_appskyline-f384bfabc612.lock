                              "maxLength": 600,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        }
                      },
                      "required": ["keywords", "shortDescription", "subtitle", "title"],
                      "type": "object"
                    },
                    "issues": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "code": {
                            "maxLength": 100,
                            "type": "string"
                          },
                          "message": {
                            "maxLength": 600,
                            "type": "string"
                          },
                          "severity": {
                            "maxLength": 20,
                            "type": "string"
                          },
                          "words": {
                            "$ref": "#/properties/results/items/properties/suggested/anyOf/0/properties/title/anyOf/0/properties/covers"
                          }
                        },
                        "required": ["code", "message", "severity", "words"],
                        "type": "object"
                      },
                      "maxItems": 6,
                      "type": "array"
                    },
                    "market": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "country": {
                              "maxLength": 10,
                              "type": "string"
                            },
                            "language": {
                              "anyOf": [
                                {
                                  "maxLength": 32,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "required": ["country", "language"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "opportunities": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "coverage": {
                            "maxLength": 40,
                            "type": "string"
                          },
                          "missingWords": {
