        {
          "name": "suggest_store_metadata",
          "title": "Suggest title, subtitle and keywords",
          "description": "Use this when someone asks which keywords to put in their app's title, subtitle, keyword field or short description, or how to improve their store listing's ASO. Without appId it covers every app in its main market, so one call answers 'for each app'. Compares each listing (synced metadata, or the live public listing in that country) with the app's tracked keywords, their latest stored rank and cached Google demand, and returns drafts that already fit each store's limits, the coverage they reach, the top opportunities and issues. Pass appId, store and a proposed title, subtitle, keywords or shortDescription to check your own wording. Read-only; never changes a store listing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "AppSkyline app id (uuid); omit to cover every app",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Two-letter market such as ES; defaults to the country with most tracked keywords",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "keywords": {
                "description": "Proposed App Store keyword field, or Microsoft Store search terms one per line, to check",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Listing language such as es; defaults to the market's keywords",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "shortDescription": {
                "description": "Proposed Google Play short description to check",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "store": {
                "description": "Only this store; every configured store when absent",
                "enum": ["ios-app-store", "macos-app-store", "google-play", "microsoft-store"],
                "type": "string"
              },
              "subtitle": {
                "description": "Proposed App Store subtitle to check; needs appId and store",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "Proposed title to check; needs appId and store",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "description": "One entry per app and store. Drafts already fit the store limits; competitorWords are unvetted words from competitor titles.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "appId": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "appName": {
                      "anyOf": [
                        {
                          "maxLength": 300,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "competitorWords": {
                      "$ref": "#/properties/results/items/properties/suggested/anyOf/0/properties/title/anyOf/0/properties/covers"
                    },
                    "coverage": {
                      "additionalProperties": false,
                      "properties": {
                        "coveredAfter": {
                          "$ref": "#/properties/totalApps"
                        },
                        "coveredNow": {
                          "$ref": "#/properties/totalApps"
                        },
                        "tracked": {
                          "$ref": "#/properties/totalApps"
                        }
                      },
                      "required": ["coveredAfter", "coveredNow", "tracked"],
                      "type": "object"
                    },
                    "current": {
                      "additionalProperties": false,
                      "properties": {
                        "keywords": {
                          "anyOf": [
                            {
                              "maxLength": 600,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "shortDescription": {
                          "anyOf": [
                            {
                              "maxLength": 600,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "subtitle": {
                          "anyOf": [
