                        "required": ["country", "keywords", "language"],
                        "type": "object"
                      },
                      "maxItems": 50,
                      "type": "array"
                    },
                    "proposal": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "covered": {
                              "$ref": "#/properties/totalApps"
                            },
                            "gained": {
                              "items": {
                                "additionalProperties": false,
                                "properties": {
                                  "from": {
                                    "maxLength": 40,
                                    "type": "string"
                                  },
                                  "term": {
                                    "maxLength": 200,
                                    "type": "string"
                                  },
                                  "to": {
                                    "maxLength": 40,
                                    "type": "string"
                                  }
                                },
                                "required": ["from", "term", "to"],
                                "type": "object"
                              },
                              "maxItems": 60,
                              "type": "array"
                            },
                            "issues": {
                              "items": {
                                "$ref": "#/properties/results/items/properties/issues/items"
                              },
                              "maxItems": 20,
                              "type": "array"
                            },
