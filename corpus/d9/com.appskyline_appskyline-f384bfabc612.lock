                              "items": {
                                "$ref": "#/properties/results/items/properties/proposal/anyOf/0/properties/gained/items"
                              },
                              "maxItems": 60,
                              "type": "array"
                            },
                            "tracked": {
                              "$ref": "#/properties/totalApps"
                            }
                          },
                          "required": ["covered", "gained", "issues", "lost", "tracked"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "source": {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "maxLength": 20,
                          "type": "string"
                        },
                        "lastSyncedAt": {
                          "anyOf": [
                            {
                              "maxLength": 64,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "locale": {
                          "anyOf": [
                            {
                              "maxLength": 32,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        }
                      },
                      "required": ["kind", "lastSyncedAt", "locale"],
                      "type": "object"
                    },
