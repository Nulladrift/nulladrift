            "readOnly": true
          },
          "digest": "sha256:04d9b72622877af4ae28c7687cc7c06206ca64a67c23ebcaa2dc0b49280d882a"
        },
        {
          "name": "get_instrument",
          "title": "Instrument specifications and trading hours",
          "description": "Trading specifications for one GCC Brokers instrument as clients trade it on the Standard account: contract size, minimum/maximum lot and lot step, margin, swap long/short and multi-night rollover days, and weekly trading hours in UTC. Accepts names like \"EUR/USD\", \"XAUUSD\", \"gold\", \"Nasdaq\", \"bitcoin\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "instrument": {
                "description": "Instrument name or symbol, e.g. \"EURUSD\", \"gold\", \"US30\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for page links and translated text. One of: en, ar, fr, th, tr, fa, id, es, de, ru, vi, ms, zh-CN, ja, ko, hi, pt, sv, no, da, fi, nl, it, pl, uk, tl, zh-TW, bn, ur, ro, bg. Default en.",
                "enum": ["en", "ar", "fr", "th", "tr", "fa", "id", "es", "de", "ru", "vi", "ms", "zh-CN", "ja", "ko", "hi", "pt", "sv", "no", "da", "fi", "nl", "it", "pl", "uk", "tl", "zh-TW", "bn", "ur", "ro", "bg"],
                "type": "string"
              }
            },
            "required": ["instrument", "language"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
