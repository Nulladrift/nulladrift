        },
        {
          "name": "get_economic_calendar",
          "title": "Economic calendar",
          "description": "Scheduled macroeconomic releases (CPI, payrolls, central-bank decisions, PMIs…) with time in UTC, currency, forecast, previous and actual values. Defaults to the next 7 days at medium and high importance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currencies": {
                "description": "Only these currencies, e.g. [\"USD\",\"EUR\"].",
                "items": {
                  "maxLength": 3,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "from": {
                "description": "First day (UTC), YYYY-MM-DD. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for page links and translated text. One of: en, ar, fr, th, tr, fa, id, es, de, ru, vi, ms, zh-CN, ja, ko, hi, pt, sv, no, da, fi, nl, it, pl, uk, tl, zh-TW, bn, ur, ro, bg. Default en.",
                "enum": ["en", "ar", "fr", "th", "tr", "fa", "id", "es", "de", "ru", "vi", "ms", "zh-CN", "ja", "ko", "hi", "pt", "sv", "no", "da", "fi", "nl", "it", "pl", "uk", "tl", "zh-TW", "bn", "ur", "ro", "bg"],
                "type": "string"
              },
              "min_importance": {
                "default": 2,
                "description": "1 low, 2 medium, 3 high. Default 2.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Last day (UTC), inclusive, YYYY-MM-DD. Default from + 6 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["language", "min_importance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Economic calendar"
          },
          "behavior": {
            "destructive": false,
