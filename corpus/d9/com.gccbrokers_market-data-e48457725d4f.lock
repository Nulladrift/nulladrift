          "title": "List tradable instruments",
          "description": "Lists the instruments GCC Brokers offers (forex pairs, metals, indices, commodities, crypto CFDs, futures, perpetuals), each with its gccbrokers.com page. Filter by category.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
