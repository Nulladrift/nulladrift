        },
        {
          "name": "get_prices",
          "title": "Latest bid/ask quotes",
          "description": "Latest bid and ask quotes for up to 10 GCC Brokers instruments as streamed on the Standard account, with the quote time in UTC. Outside trading hours the last quote before the close is returned and marked as not live.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "instruments": {
                "description": "Instrument names or symbols, e.g. [\"EURUSD\", \"gold\", \"BTCUSD\"].",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Language for page links and translated text. One of: en, ar, fr, th, tr, fa, id, es, de, ru, vi, ms, zh-CN, ja, ko, hi, pt, sv, no, da, fi, nl, it, pl, uk, tl, zh-TW, bn, ur, ro, bg. Default en.",
                "enum": ["en", "ar", "fr", "th", "tr", "fa", "id", "es", "de", "ru", "vi", "ms", "zh-CN", "ja", "ko", "hi", "pt", "sv", "no", "da", "fi", "nl", "it", "pl", "uk", "tl", "zh-TW", "bn", "ur", "ro", "bg"],
                "type": "string"
              }
            },
            "required": ["instruments", "language"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest bid/ask quotes"
