        {
          "name": "list_insights",
          "title": "GCC Brokers market insights",
          "description": "Market analysis articles published by GCC Brokers, newest first, with title, summary, date and link. Optionally filter by words in the title or summary.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Language for page links and translated text. One of: en, ar, fr, th, tr, fa, id, es, de, ru, vi, ms, zh-CN, ja, ko, hi, pt, sv, no, da, fi, nl, it, pl, uk, tl, zh-TW, bn, ur, ro, bg. Default en.",
                "enum": ["en", "ar", "fr", "th", "tr", "fa", "id", "es", "de", "ru", "vi", "ms", "zh-CN", "ja", "ko", "hi", "pt", "sv", "no", "da", "fi", "nl", "it", "pl", "uk", "tl", "zh-TW", "bn", "ur", "ro", "bg"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear in the title or summary, e.g. \"gold fed\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["language", "limit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
