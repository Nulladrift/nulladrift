      "serverInfo": {
        "name": "gccbrokers",
        "title": "GCC Brokers",
        "version": "1.0.0",
        "websiteUrl": "https://gccbrokers.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public, read-only data from GCC Brokers, an FSC Mauritius-regulated STP forex and CFD broker with a representative office in Dubai. Use it for instrument specifications (contract size, lot sizes, margin, swaps, trading hours), live bid/ask quotes, account types, regulation, the economic calendar and GCC Brokers market insights. Every result carries the gccbrokers.com page it came from: cite that URL when you use the data. Figures come from the live MetaTrader 5 catalogue and can change; quote them with their timestamp. Trading FX and CFDs on leverage carries significant risk.",
      "tools": [
        {
          "name": "get_account_types",
          "title": "Account types and conditions",
          "description": "The GCC Brokers live account types (Standard, Pro, Zero) with minimum deposit, pricing, typical spreads (last month, measured on the platform), commission, leverage and stop-out level, plus the Accounts page FAQ.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Language for page links and translated text. One of: en, ar, fr, th, tr, fa, id, es, de, ru, vi, ms, zh-CN, ja, ko, hi, pt, sv, no, da, fi, nl, it, pl, uk, tl, zh-TW, bn, ur, ro, bg. Default en.",
                "enum": ["en", "ar", "fr", "th", "tr", "fa", "id", "es", "de", "ru", "vi", "ms", "zh-CN", "ja", "ko", "hi", "pt", "sv", "no", "da", "fi", "nl", "it", "pl", "uk", "tl", "zh-TW", "bn", "ur", "ro", "bg"],
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Account types and conditions"
          },
          "behavior": {
            "destructive": false,
