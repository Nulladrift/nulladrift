          "title": "About GCC Brokers and its regulation",
          "description": "Who GCC Brokers is: the licensed entity, regulator and licence number (with the public register to verify it), the other companies behind the brand, the Dubai representative office, client protections and their limits, and contact pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
