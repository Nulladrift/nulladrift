        {
          "name": "generate_dieline",
          "title": "Make a dieline",
          "description": "Give the size of a box, label, pouch, sack or pillow pack in millimetres and get its print-ready dieline (cut and fold lines, bleed) as PDF and SVG links, ready for the printer or any design software. Same engine as the free dieline generator on creadal.com. Free, no account needed. Sizes: box = length, width, height; label (wraps a bottle or jar) = diameter, height; pouch = width, height, optional gusset; sack = width, height, optional gusset; pillow = width, height, optional depth.",
          "inputSchema": {
            "properties": {
              "depth": {
                "description": "Depth of a pillow pack, mm.",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "diameter": {
                "description": "Container diameter for a label, mm.",
                "maximum": 400,
                "minimum": 10,
                "type": "number"
              },
              "gusset": {
                "description": "Bottom gusset of a pouch, or side gusset of a sack, mm.",
                "maximum": 400,
                "minimum": 0,
                "type": "number"
              },
              "height": {
                "description": "Height, mm.",
                "maximum": 1600,
                "minimum": 10,
                "type": "number"
              },
              "kind": {
                "description": "What to make the dieline of.",
                "enum": ["box", "label", "pouch", "sack", "pillow"],
                "type": "string"
              },
              "length": {
                "description": "Box length (front width), mm.",
                "maximum": 600,
                "minimum": 10,
                "type": "number"
              },
              "overlap": {
                "description": "Label overlap, mm (default 8).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "width": {
                "description": "Box depth, or the width of a pouch, sack or pillow pack, mm.",
                "maximum": 1200,
                "minimum": 10,
                "type": "number"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a dieline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11736bc7c70fdd9e6a5f05cf4c3264998d585a9935a8d60d19ad942d0bc467b4"
        },
        {
          "name": "generate_presentation",
          "title": "Generate a presentation",
          "description": "Generate a complete, editable presentation or document from a prompt (for a social post, story or ad use create_social_design instead: it starts from a designed template and places the member's own picture and logo). Waits for the result when generation is quick; otherwise returns a job to poll with get_job. The composed deck contains laid-out text, a theme, and speaker notes; per-slide images are generated in the creadal editor. Requires the 'generate' scope.",
          "inputSchema": {
            "properties": {
              "brandPalette": {
                "description": "Brand hex colors to ground the theme in.",
                "items": {
                  "pattern": "^#[0-9a-fA-F]{6}$",
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "designType": {
                "description": "Defaults to deck.",
                "enum": ["deck", "doc", "poster", "social"],
                "type": "string"
              },
              "language": {
                "description": "Write all text in this language, e.g. 'Spanish'.",
                "type": "string"
              },
              "motion": {
                "description": "Entrance motion on the slides; defaults to subtle.",
                "enum": ["subtle", "none"],
                "type": "string"
              },
              "pageCount": {
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "prompt": {
                "description": "The brief, e.g. 'a 6-slide pitch deck for an eco water bottle'.",
                "type": "string"
              },
              "sources": {
                "description": "Grounding material the outline is based on.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "Source name.",
                      "type": "string"
                    },
                    "text": {
                      "description": "Source text (untrusted reference material).",
                      "type": "string"
                    }
                  },
                  "required": ["name", "text"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "templateId": {
                "description": "A template id from list_templates: the deck is composed on that template's layout system and theme.",
                "type": "string"
              },
              "themeId": {
                "description": "A built-in theme id from list_themes (e.g. 'theme-slate'); omit for an auto-picked look.",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate a presentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22a5bcff50e95c875d4bf1745df1ea54f09e91aace5ce1610b3032b70230e85c"
        },
