      },
      "transport": {
        "type": "http",
        "url": "https://creadal.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "creadal",
        "title": "Creadal",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Creadal makes packaging: list_packaging_models finds the model (box, pouch, label, can, cup, bag...), generate_dieline gives a print-ready dieline from a size (both free, no sign-in), create_packaging_design makes a finished design in the member's account with a preview, 3D look, print PDF and editor link. Other tools read the member's designs and plan. generate_presentation makes decks; poll get_job when it returns status \"active\".",
      "tools": [
        {
          "name": "create_packaging_design",
          "title": "Design packaging",
          "description": "Tell it the product and the packaging, and get a finished packaging design in the member's Creadal account: a professionally laid-out ready design for that model with the brand, product name and label facts filled in, a preview picture, the 3D look, a print PDF link and a link to open it in the Creadal editor. Optionally makes a product photo with AI for the label (that uses one AI image from the member's plan). Pick the model with list_packaging_models (id or slug).",
          "inputSchema": {
            "properties": {
              "best_before": {
                "description": "Best before or expiry text.",
                "type": "string"
              },
              "brand_name": {
                "description": "The brand.",
                "type": "string"
              },
              "description": {
                "description": "What the product is, in a sentence: helps pick the best ready design.",
                "type": "string"
              },
              "directions": {
                "description": "How to use or prepare.",
                "type": "string"
              },
              "ingredients": {
                "description": "Ingredients or materials.",
                "type": "string"
              },
              "language": {
                "description": "Language of the names and label texts: en (default), tr or ar.",
                "enum": ["en", "tr", "ar"],
                "type": "string"
              },
              "manufacturer": {
                "description": "Maker or distributor name and address.",
                "type": "string"
              },
              "model": {
                "description": "The packaging model's id or slug, e.g. 'pouch-stand-up' or 'tuck-end-box'.",
                "type": "string"
              },
              "net_quantity": {
                "description": "Net weight or volume, e.g. '250 g' or '500 ml'.",
                "type": "string"
              },
              "product_name": {
                "description": "The product's name as it should read on the pack.",
                "type": "string"
              },
              "product_photo": {
                "description": "Optional: describe a product photo to make with AI for the label (uses one AI image from the plan).",
                "type": "string"
              },
              "ready_design": {
                "description": "Optional: a ready design id to start from instead of the best match.",
                "type": "string"
              },
              "storage": {
                "description": "Storage note.",
                "type": "string"
              },
              "tagline": {
                "description": "A short line under the name.",
                "type": "string"
              },
              "website": {
                "description": "Website or social handle.",
                "type": "string"
              }
            },
            "required": ["model", "product_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Design packaging"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:137a153969b43696ce9446bfbe7ca94b17036780bb58332d3b0e2926f4b761fb"
        },
        {
          "name": "create_share_link",
          "title": "Create a share link",
          "description": "Create a share link for a design (view/comment/edit, optional password, expiry, and audience label for per-link analytics). Returns the share URL and the ?embed=1 iframe URL. Requires the 'export' scope.",
          "inputSchema": {
            "properties": {
              "designId": {
                "description": "The design id.",
                "type": "string"
              },
              "expiresAt": {
                "description": "Optional RFC3339 expiry.",
                "type": "string"
              },
              "label": {
                "description": "Audience name for per-link analytics, e.g. 'Investors'.",
                "type": "string"
              },
              "mode": {
                "description": "Defaults to view.",
                "enum": ["view", "comment", "edit"],
                "type": "string"
              },
              "password": {
                "description": "Optional passcode viewers must enter.",
                "type": "string"
              }
            },
            "required": ["designId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a share link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:489882b44c710012271db76702def8ca86f1fb59929e9bcc2ea68a512833fa5f"
        },
        {
          "name": "create_social_design",
          "title": "Design a social post or ad",
          "description": "Make a social media post or ad in the member's Creadal account from a professionally designed ready template: headline, supporting line, offer, call-to-action button, brand and website filled in, the member's own picture (a product photo or an app or website screenshot, given as a public https link) placed in the template's picture frame, and their logo (a public https link, PNG with transparency is best) in place of the brand name. Returns a preview picture and a link to open and edit it in the Creadal editor. Use this, not generate_presentation, for posts, stories and ads. Optionally makes the picture with AI instead (uses one AI image from the member's plan).",
          "inputSchema": {
            "properties": {
              "brand_name": {
                "description": "The brand, shown where the template has its brand name (and under the logo when there is no logo).",
                "type": "string"
              },
              "cta": {
                "description": "The button text, e.g. 'Start free'.",
                "type": "string"
              },
              "description": {
                "description": "What is advertised and for whom, in a sentence: helps pick the best template.",
                "type": "string"
              },
              "format": {
                "description": "square 1080x1080 (default), portrait 1080x1350, story 1080x1920, landscape 1200x628 (link ads), wide 1280x720.",
                "enum": ["square", "portrait", "story", "landscape", "wide"],
                "type": "string"
              },
              "headline": {
                "description": "The main line, short (2 to 6 words reads best).",
                "type": "string"
              },
              "image_fit": {
                "description": "cover fills the frame (photos, default); contain shows the whole picture (screenshots).",
                "enum": ["cover", "contain"],
                "type": "string"
              },
              "image_prompt": {
                "description": "Optional: describe a picture to make with AI when there is no image_url (uses one AI image from the plan).",
                "type": "string"
              },
              "image_url": {
                "description": "Optional: a public https link to the picture to show (product photo or screenshot).",
                "type": "string"
              },
              "kicker": {
                "description": "A small line above the headline, e.g. 'New' or the product category.",
                "type": "string"
              },
              "language": {
                "description": "Language of the template texts left as they are: en (default) or tr.",
                "type": "string"
              },
              "logo_url": {
                "description": "Optional: a public https link to the logo (PNG with transparency is best).",
                "type": "string"
              },
              "offer": {
                "description": "An offer, price or detail line, e.g. 'Free for 14 days'.",
                "type": "string"
              },
              "subheadline": {
                "description": "A supporting line under the headline.",
                "type": "string"
              },
              "template_id": {
                "description": "Optional: a template id to use instead of the best match.",
                "type": "string"
              },
              "website": {
                "description": "Website or social handle.",
                "type": "string"
              }
            },
            "required": ["headline"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Design a social post or ad"
          },
          "behavior": {
            "destructive": false,
