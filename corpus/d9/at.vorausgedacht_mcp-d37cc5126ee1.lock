          "title": "Rückruf vorbereiten",
          "description": "Bereitet eine kostenlose, unverbindliche Rückruf-Anfrage vor: Edelmetalle (ein Ansprechpartner für die Region meldet sich), Versicherungs-Check (durch konzessionierte Versicherungsvermittler), Energiecheck (durch die we-energiecheck OG). Nur Angaben verwenden, die die Person selbst gemacht hat – nichts erfinden. Es wird dabei nichts gesendet: Die Person bestätigt selbst über den zurückgegebenen Link auf vorausgedacht.at (Einwilligung, Volljährigkeit, SMS-Code). Erst danach wird die Anfrage zugestellt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aktuellerAnbieter": {
                "description": "Aktueller Anbieter (optional). Gilt für: Energiecheck. Hilft der Person, die zurückruft, sich auf das Gespräch vorzubereiten.",
                "maxLength": 200,
                "type": "string"
              },
              "alter": {
                "description": "Alter in Jahren (optional). Ersetzt nicht die Bestätigung der Volljährigkeit, die die Person selbst gibt.",
                "maximum": 120,
                "minimum": 18,
                "type": "integer"
              },
              "energieart": {
                "description": "Energieart (optional). Gilt für: Energiecheck. Hilft der Person, die zurückruft, sich auf das Gespräch vorzubereiten.",
                "enum": ["Strom", "Gas", "Strom & Gas"],
                "type": "string"
              },
              "erreichbarkeit": {
                "description": "Erreichbarkeit (optional). Gilt für: alle Themen. Hilft der Person, die zurückruft, sich auf das Gespräch vorzubereiten.",
                "items": {
                  "enum": ["Vormittags", "Mittags", "Nachmittags", "Abends", "Am Wochenende", "Egal"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "interesse": {
                "description": "Metall-Interesse (optional). Gilt für: Edelmetalle. Hilft der Person, die zurückruft, sich auf das Gespräch vorzubereiten.",
                "items": {
                  "enum": ["Gold", "Silber", "Platin", "Palladium", "Mehrere Metalle"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
