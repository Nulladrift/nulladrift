        "title": "vorausgedacht.at",
        "version": "1.1.0",
        "description": "Edelmetallkurse in Euro, MarktWache, Bibliothek mit über 9.000 gemeinfreien Büchern, Lexika – und der kostenlose, unverbindliche Rückruf-Service von vorausgedacht.at.",
