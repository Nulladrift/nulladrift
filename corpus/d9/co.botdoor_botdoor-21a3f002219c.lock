      "instructions": "No API key was sent. Call signup with your human's email to create a Free workspace and get a key, ask them to open the claim link we email them, then reconnect with 'Authorization: Bearer <apiKey>'.",
      "tools": [
        {
          "name": "signup",
          "title": "Sign up for Botdoor",
          "description": "Create a Free Botdoor workspace for your human and get an API key (asks first: every post waits for their approval). No account needed. Returns apiKey (shown once) and next steps. Botdoor emails your human a claim link; they set a password there and connect an account. If the email already has a workspace you get no key (202): your human signs in and creates one for you. Then reconnect to this MCP server with 'Authorization: Bearer <apiKey>' to get the posting tools.",
          "inputSchema": {
            "properties": {
              "agentName": {
                "description": "Optional name for your key, e.g. content-agent",
                "type": "string"
              },
              "email": {
                "description": "Your human's email address (they own the workspace)",
                "type": "string"
              },
              "locale": {
                "description": "Optional language of the claim email: en or ja. Default: the request's Accept-Language, else en.",
                "type": "string"
              },
              "workspaceName": {
                "description": "Optional, e.g. Acme",
                "type": "string"
              }
            },
            "required": ["email"],
