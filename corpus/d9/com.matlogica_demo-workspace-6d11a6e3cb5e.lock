              "Fixing": {
                "additionalProperties": false,
                "properties": {
                  "asset_id": {
                    "pattern": "^[A-Za-z][A-Za-z0-9_.:-]{0,79}$",
                    "title": "Asset Id",
                    "type": "string"
                  },
                  "fixing_date": {
                    "title": "Fixing Date",
                    "type": "string"
                  },
                  "value": {
                    "exclusiveMinimum": 0,
                    "title": "Value",
                    "type": "number"
                  }
                },
                "required": ["asset_id", "fixing_date", "value"],
                "title": "Fixing",
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "dated_case": {
                "$ref": "#/$defs/DateCase"
