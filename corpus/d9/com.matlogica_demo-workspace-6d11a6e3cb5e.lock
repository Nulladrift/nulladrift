      "instructions": "Start each new conversation with demo_start_session, then retain its guest_session and include it in every subsequent tool call. No account or login is required. Never reuse a workspace from another conversation. Workspaces expire after 30 minutes without a tool call. Use synthetic demo trades and market data. If guest_session_invalid occurs, explain that the temporary portfolio has expired and start a new workspace. One calculation runs at a time, with at most four outstanding jobs and one per workspace. queue_limit means try later; never create extra sessions to bypass a limit. Jobs have a 40-second submission-to-result deadline including queue wait. Kernel reuse is measured per result; another visitor or Tracer can make the next calculation record again. For gas, read gas_storage_context in capabilities, prepared_case, get_job or inspect_result. Quantity one means one whole storage facility. Explain its capacity, starting inventory and contract period before comparing dollar value with gas prices per MMBtu. Different trade sizes can dominate a sample portfolio without indicating a pricing error. Keep numerical checks, sampling uncertainty and economic/model assumptions distinct. A missing joint standard error limits portfolio confidence intervals; it does not itself invalidate the computed expected portfolio value. demo_get_job and demo_inspect_result answers for AADC results carry aadc_measured (timings measured when that result was calculated) and aadc_on_your_models; pass both on to the user as given. Use ordinary text tools. Start with demo_capabilities and demo_list_entities. Read demo_prepared_case when available, save exact book/market versions, then use advertised pricing, inspection, P&L and trace tools. Trace execution closes pricing workers to keep pricing and diagnostics in separate serial phases. Obtain a warm timing pair before tracing; subsequent pricing may correctly record again. No custom screen is required. Use the advertised tools and immutable version IDs. Start with demo_workbench. Do not invent a numerical result or an unadvertised calculation method. Portfolio changes are sandbox versions, not production bookings. Read demo_capabilities for admitted methods and kernel_cache_policy. Use exact saved versions with demo_price_book, then demo_get_job. demo_replay_job submits the saved numerical recipe as a new job; demo_export_result preserves its execution and replay-source provenance. Use saved trades[].result.kernel and timings from demo_get_job or demo_inspect_result to answer replay/timing questions without recalculating. recording_count=1 is cumulative for one kernel, not one new recording in each job. Verify warm reuse from kind=kernel_replay, unchanged worker_instance, structure_sha256 and generation, incremented replay_count, and this job recording.value=0 and workspace_setup.value=0. Follow the configured route/RSS retention policy; product/backend switches or eviction can make a recipe resubmission cold. For a same-work timing pair, match contract, market, method and sampling; use consecutive single-product jobs if needed. Compare engine_wall measurements only with the same scope; report server_round_trip separately as private process RPC including startup, not HTTP or queue latency. AADC gas complete engine_wall is unavailable, but its forward/reverse/aggregation phases and process RPC are measured; do not relabel their sum as complete gas engine time. Report observed measurements and their scope; no speedup is guaranteed. Use demo_inspect_result for saved book/group/trade values, first Greeks and phase/memory measurements. For the same book and date, demo_explain_market_change uses actual AADC risks and reports the full-revaluation residual. Use demo_revaluation_waterfall for ordered market/quantity stages. Cross-date gas requires the separately admitted day1 state and demo_explain_gas_date_change; cash and financing stay explicit. After an admitted AADC price, use demo_trace_trade with its explicit saved pricing_job_id and trade_id, then demo_get_trace. This explains one saved path through a separately reconciled diagnostic. Use demo_compare_traces only when the separately composed comparison tool is listed; mismatched draw grids or model/source identities are refused. Use demo_compare_traces with two explicit owned reconciled trace-job IDs. It compares selected-path outputs, derived fixing/day events and bounded recorded-expression text where captured. Draw or model mismatches are refused; run-local entry IDs do not align across recordings. Use demo_inspect_trace with an owned trace_job_id first: it reads saved diagnostic forward values, economic stages and the exact saved SDK-query catalogue. When available, these values come from the diagnostic tape forward walk with bound inputs; they are not captured intermediate values of the original pricing run. Use only listed queries; missing evidence never triggers another recording. SDK inspector G-leaf question marks remain unknown; use the valued report for captured evaluated operations. #N entries and R/RD/D/c locations are separate coordinates of one recording. For matched market/trade/date traces use demo_compare_trace_values, which checks the existing source/model/draw compatibility before comparing qualified stages or source-site occurrences. The legacy demo_compare_traces intermediate-value availability flag describes its older expression-comparison output; it does not describe rich saved values. Single-path agreement and expression text do not prove algebraic equivalence or aggregate derivative correctness.",
