                "type": "string"
              },
              "ids": {
                "description": "Comma-separated product ids for product_info.",
                "type": "string"
              },
              "offset": {
                "description": "Result offset for search.",
                "type": "integer"
              },
              "q": {
                "description": "Search keyword for suggest and search.",
                "type": "string"
              },
              "size": {
                "description": "Page or result size.",
                "type": "integer"
              },
              "url": {
                "description": "Product url from suggest or search. Supplies the category for detail.",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
