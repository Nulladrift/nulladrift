        {
          "name": "kieskeurig_get_product",
          "title": "Get a Kieskeurig product with shop offers",
          "description": "Get one Kieskeurig product by numeric id from kieskeurig_search_products. Returns the price in EUR, offer count, full-size image, clean specifications (litre and kilogram) and current shop offers (shop id, shop, price, delivery cost, delivery, availability). Rating and review count appear only when public. Pass path from search to read offers in one lookup. Returns PRODUCT_OFFERS_NOT_PUBLIC when no public offers or positive price exist. Reads public data only.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Numeric Kieskeurig product id, e.g. \"52156666\".",
                "type": "string"
              },
              "path": {
                "description": "Optional source_url from search or suggestions. Use it to read the public shop offers in one lookup.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
