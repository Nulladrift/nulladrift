        {
          "name": "kieskeurig_search_products",
          "title": "Search Kieskeurig products by category",
          "description": "List products in a Kieskeurig category (Dutch price comparison) by category slug from kieskeurig_get_categories, e.g. \"koelkast\". Only products of that category are returned. Returns per product the id, name, brand, numeric EUR price, offer count, full-size image and current shop offers; rating and review count appear only when public. Unknown slugs return INVALID_CATEGORY. Brand matching applies to the returned set; sorting is not supported. Use kieskeurig_get_product with an id for full details. Reads public data only.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name to keep from the returned set, case-insensitive.",
                "type": "string"
              },
              "category": {
                "description": "Category slug, e.g. \"koelkast\".",
                "type": "string"
              },
              "limit": {
                "description": "Products per page, 1 to 48. Default: 10.",
                "type": "integer"
              },
              "max_price": {
                "description": "Highest price in EUR.",
                "type": "number"
              },
              "min_price": {
                "description": "Lowest price in EUR.",
                "type": "number"
              },
              "score": {
                "description": "Minimum review score from 1 to 10.",
                "type": "number"
              },
              "skip": {
                "description": "Products to skip. Default: 0.",
