{
  "lockfileVersion": 2,
  "subjects": {
    "co.scrappa/scrappa": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scrappa.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Scrappa",
        "version": "2.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Scrappa provides live data endpoints for Google Maps, Google Search, Google Flights, Google Hotels,\nGoogle Jobs, Google Translate, Google Images, Google Videos, Google News, YouTube, LinkedIn,\nVinted, Trustpilot, Geizhals, Kununu, TrustedShops, Indeed, Jameda, ImmobilienScout24, Immowelt,\nIdealista, Rentalia, Hemnet and many more sites.\n\nFor common tasks use the dedicated tools: google_search, google_maps_search_places,\ngoogle_maps_get_reviews, google_flights_search, youtube_get_transcript,\ntrustpilot_get_company_reviews, geizhals_search_products, geizhals_get_product and\ngeizhals_get_price_history.\n\nFor every other source use Find API endpoints (search-endpoints) to look up available endpoints\nand their parameters. Then use Call an API endpoint (call-endpoint) with a returned endpoint name\nand the parameters you need. Requests can use credits on the connected Scrappa account.",
      "tools": [
        {
          "name": "call-endpoint",
          "title": "Call an API endpoint",
          "description": "Fetch data from a Scrappa API endpoint, including data from third-party sites. Use Find API endpoints to discover an endpoint and its parameters. Requests may use credits on your Scrappa account.",
          "inputSchema": {
            "properties": {
              "endpoint": {
                "description": "The endpoint name from search-endpoints results (e.g. \"kununu-search\", \"simple-search\")",
                "type": "string"
              },
              "params": {
                "description": "JSON object of parameters to pass to the endpoint (e.g. {\"query\": \"pizza berlin\", \"page\": \"1\"})",
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fd0589469dd6c048d8333c721ae916d9e4f720c804e63cf32fe610d8c14c663e"
        },
        {
          "name": "geizhals_get_price_history",
          "title": "Get Geizhals price history",
          "description": "Get the best-price history of one Geizhals product by its product_id. Returns the current best price, the all-time lowest and highest best price, and the dates on which the best price changed within the chosen window (each entry is valid until the next one). Reads public data only.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "History window in days, 1 to 3650. Default: 90.",
                "type": "integer"
              },
              "market": {
                "description": "Geizhals market: de (Germany), at (Austria) or eu (EU). Default: de.",
                "enum": ["de", "at", "eu"],
                "type": "string"
              },
              "product_id": {
                "description": "Geizhals product id, e.g. \"2795961\", or a Geizhals product link.",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6d3621657f7f4f77441871fd30cc3ae236d2a01ab4f16b39ce1fd655771674f5"
        },
        {
          "name": "geizhals_get_product",
          "title": "Get Geizhals product with shop prices",
          "description": "Get one Geizhals product by its product_id (from geizhals_search_products or a Geizhals link like \"...-a2795961.html\"). Returns the best and average price, the number of offers, current shop offers (shop, price, availability, shipping), full specifications, test review scores and the Geizhals link. Shop owner names and contact data are never returned. Reads public data only.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of names and specifications. Default: de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "market": {
                "description": "Geizhals market: de (Germany), at (Austria) or eu (EU). Default: de.",
                "enum": ["de", "at", "eu"],
                "type": "string"
              },
              "offers": {
                "description": "Number of shop offers to return, cheapest first, 1 to 20. Default: 10.",
                "type": "integer"
              },
              "product_id": {
                "description": "Geizhals product id, e.g. \"2795961\", or a Geizhals product link.",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f3980fded2ec03673129ac9f72ffd7e89310ee76d6a0e35af20e64871d480f6c"
        },
        {
          "name": "geizhals_search_products",
          "title": "Search products on Geizhals",
          "description": "Search the Geizhals price comparison (Germany, Austria, EU) by keyword, e.g. \"samsung 990 pro 2tb\". Returns per product: product_id, name, manufacturer, all-time lowest and highest best price, user rating, test score, key specifications and the Geizhals link. Use geizhals_get_product with a product_id for current shop prices and geizhals_get_price_history for the price trend. Reads public data only.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of names and specifications. Default: de.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Number of products to return, 1 to 20. Default: 10.",
                "type": "integer"
              },
              "market": {
                "description": "Geizhals market: de (Germany), at (Austria) or eu (EU). Default: de.",
                "enum": ["de", "at", "eu"],
                "type": "string"
              },
              "page": {
                "description": "Result page, starting at 1. Default: 1.",
                "type": "integer"
              },
              "query": {
                "description": "Product search words, e.g. \"samsung 990 pro 2tb\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3cd1dfbdfb0adc85bbd6258f83d1569d6f918402a9305266de07757643a6a033"
        },
        {
          "name": "google_flights_search",
          "title": "Search flights on Google Flights",
          "description": "Search public one-way flight offers on Google Flights between two airports on one date. For a round trip, search each direction separately. Returns per flight: price, airlines, flight numbers, departure and arrival times, duration and stops. It does not book or buy anything. Reads public data only.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of adult passengers, 1 to 9. Default: 1.",
                "type": "integer"
              },
              "cabin_class": {
                "description": "Cabin class. Default: economy.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "currency": {
                "description": "Currency code for prices, e.g. \"EUR\" or \"USD\". Default: USD.",
                "type": "string"
              },
              "departure_date": {
                "description": "Departure date as YYYY-MM-DD.",
                "type": "string"
              },
              "destination": {
                "description": "Arrival airport IATA code, e.g. \"LIS\".",
                "type": "string"
              },
              "max_stops": {
                "description": "Maximum number of stops. Default: any.",
                "enum": ["any", "nonstop", "one_or_fewer", "two_or_fewer"],
                "type": "string"
              },
              "origin": {
                "description": "Departure airport IATA code, e.g. \"BER\".",
                "type": "string"
              },
              "sort_by": {
                "description": "Sort order. Default: top_flights.",
                "enum": ["top_flights", "cheapest", "departure_time", "arrival_time", "duration"],
                "type": "string"
              }
            },
            "required": ["departure_date", "destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7749221714ea320f6a5e5de5b562f01af11be02386cda5d37a85730c1b5f4d14"
        },
        {
          "name": "google_maps_get_reviews",
          "title": "Read Google Maps reviews of a place",
          "description": "Read public Google Maps reviews of one place. Needs the business_id from google_maps_search_places. Returns per review: star rating, date, review text, review language and the owner reply. By default only reviews with text are returned. Reviewer names and profiles are never returned. Reads public data only.",
          "inputSchema": {
            "properties": {
              "business_id": {
                "description": "The business_id of the place, from google_maps_search_places, e.g. \"0x47a851c655f20989:0x26bbfb4e84674c63\".",
                "type": "string"
              },
              "include_rating_only": {
                "description": "Also return reviews that only have a star rating and no text. Default: false.",
                "type": "boolean"
              },
              "language": {
                "description": "Two-letter language code, e.g. \"en\" or \"de\". Default: en.",
                "type": "string"
              },
              "limit": {
                "description": "Number of reviews to return, 1 to 20. Default: 10.",
                "type": "integer"
              },
              "sort": {
                "description": "Order of the reviews. Default: newest.",
                "enum": ["most_relevant", "newest", "highest", "lowest"],
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:267b59a86c457c055f48b7e3cd6f1fc6ef3cc6a74342d4219d908145d84fbcf1"
        },
        {
          "name": "google_maps_search_places",
          "title": "Search places on Google Maps",
          "description": "Search Google Maps for businesses and places, for example \"pizza in Berlin Mitte\" or \"dentist near Alexanderplatz\". Returns public business data: name, rating, number of reviews, category, address, website, phone, coordinates and a business_id. Use the business_id with google_maps_get_reviews to read reviews. Reads public data only.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code to focus the search, e.g. \"de\" or \"us\".",
                "type": "string"
              },
              "language": {
                "description": "Two-letter language code for the results, e.g. \"en\" or \"de\". Default: en.",
                "type": "string"
              },
              "limit": {
                "description": "Number of places to return, 1 to 20. Default: 10.",
                "type": "integer"
              },
              "query": {
                "description": "What and where to search, e.g. \"pizza in Berlin Mitte\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c04212c756a71a351af972bef7c03723736a2ce9986f78cf27a600043675197b"
        },
        {
          "name": "google_search",
          "title": "Search the web with Google",
          "description": "Search Google and get the organic web results for a query. Returns per result: position, title, link and snippet. Use it for current information from the web. Reads public data only.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code for local results, e.g. \"us\" or \"de\". Default: us.",
                "type": "string"
              },
              "language": {
                "description": "Two-letter language code, e.g. \"en\" or \"de\". Default: en.",
                "type": "string"
              },
              "num": {
                "description": "Number of results, 1 to 10. Default: 10.",
                "type": "integer"
              },
              "query": {
                "description": "The search query, e.g. \"best coffee grinder 2026\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b19b1a08c536b8cbe9248e14b7c1710f773c3b1aeeb43d5ca1dfe096cbb3e2f7"
        },
        {
          "name": "search-endpoints",
          "title": "Find API endpoints",
          "description": "Find Scrappa API endpoints by keyword. Returns matching endpoint names, descriptions, and parameters. Use a returned endpoint name with Call an API endpoint.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum number of endpoints to return (default 25, max 50)",
                "type": "integer"
              },
              "offset": {
                "description": "Number of matching endpoints to skip, to read the next page (default 0)",
                "type": "integer"
              },
              "query": {
                "description": "Search term to find endpoints (e.g. \"google maps reviews\", \"flights\", \"linkedin profile\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5e8e37c81c4c757b5b73790291e827e650be2cab00f8a6d19f157b9c92130df"
        },
        {
          "name": "trustpilot_get_company_reviews",
          "title": "Read Trustpilot reviews of a company",
          "description": "Read the public Trustpilot rating and reviews of a company by its website domain, e.g. \"zalando.de\". Returns the TrustScore, star rating, total review count and per review: rating, title, text, date and the company reply. Reviewer names and profiles are never returned. Reads public data only.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Company website domain, e.g. \"zalando.de\".",
                "type": "string"
              },
              "language": {
                "description": "Two-letter review language, e.g. \"en\" or \"de\". Default: all languages.",
                "type": "string"
              },
              "limit": {
                "description": "Number of reviews to return, 1 to 20. Default: 10.",
                "type": "integer"
              },
              "sort": {
                "description": "Order of the reviews. Default: recent.",
                "enum": ["recent", "relevant"],
                "type": "string"
              },
              "stars": {
                "description": "Only reviews with these star ratings, comma separated, e.g. \"1,2\".",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6bdafdd1f97d53ee90f95d5559f9a8ad2feb6cd3082433578b556cc6c376af35"
        },
        {
          "name": "youtube_get_transcript",
          "title": "Get a YouTube video transcript",
          "description": "Get the public transcript (captions) of a YouTube video. Accepts a video URL or video id. Returns English when available, otherwise the video language, unless you ask for a language. Returns the language and the full transcript text, cut at 40,000 characters for very long videos. Reads public data only.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Preferred transcript language code, e.g. \"en\" or \"de\". Default: English, or the video language when there is no English transcript.",
                "type": "string"
              },
              "video": {
                "description": "YouTube video URL or 11-character video id, e.g. \"https://www.youtube.com/watch?v=dQw4w9WgXcQ\".",
                "type": "string"
              }
            },
            "required": ["video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2324aa39b58d24a79d264d78ba59a37faa20998e58564a6305cc3589a77450a1"
        }
      ],
      "resources": [
        {
          "uri": "scrappa://docs",
          "name": "api-documentation",
          "title": "Scrappa API Documentation",
          "description": "Complete documentation for all Scrappa API endpoints",
          "mimeType": "text/markdown",
          "digest": "sha256:52d23ec37fe2e14cfaaba1561e3ce8c8783b248bdbfb58205a02cf54622b27b1"
        }
      ],
      "digest": "sha256:c8382c90e10824fd6fe3744e2a8430dbb8e92a2d59820d39f9192f477c5e2ba7"
    }
  }
}
