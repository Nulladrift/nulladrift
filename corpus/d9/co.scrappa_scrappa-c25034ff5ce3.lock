        {
          "name": "pricerunner_data",
          "title": "Get public PriceRunner price-comparison data",
          "description": "Read public PriceRunner data by action: suggest, search, category, category_filters, offers, price_history, reviews, product_info, navigation, sitemap, similar or detail. Detail needs the category id from search or the product url. Prices are numbers with currency and ids feed the next action. Public data only.",
