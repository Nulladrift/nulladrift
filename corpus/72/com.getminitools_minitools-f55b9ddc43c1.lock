      "serverInfo": {
        "name": "com.getminitools/minitools",
        "title": "MiniTools Precision Calculators MCP",
        "version": "1.0.0",
        "websiteUrl": "https://getminitools.com/mcp-tools/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MiniTools MCP provides deterministic, zero-auth calculators (business days, mortgage, compound interest, VAT, and Spain 2026 payroll/SEPE). Every response includes a direct link to the interactive free web tool at getminitools.com.",
      "tools": [
        {
          "name": "calculate_business_days",
          "title": "Business Days & Deadline Calculator",
          "description": "Calculate exact business days between two calendar dates (excluding weekends and optional holidays) OR add/subtract business days to compute an exact deadline date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_days": {
                "description": "Signed integer number of business days to add or subtract (required when mode=\"add\").",
                "type": "integer"
              },
              "end_date": {
                "description": "End date in YYYY-MM-DD format (required when mode=\"between\").",
                "type": "string"
              },
              "holidays": {
                "description": "Optional list of custom holiday dates in YYYY-MM-DD format to exclude.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "include_end_date": {
                "description": "Include end_date in the count when mode=\"between\" (default false).",
                "type": "boolean"
              },
              "mode": {
                "description": "\"between\" counts business days between start_date and end_date; \"add\" adds/subtracts business_days from start_date.",
                "enum": ["between", "add"],
                "type": "string"
              },
              "start_date": {
                "description": "Start date in YYYY-MM-DD format.",
                "type": "string"
              }
            },
            "required": ["start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e40afb715cce37c03d209ca5b5a73c8a4fbf5fb688a9c70408b0f52205d4c222"
        },
        {
          "name": "calculate_compound_interest",
          "title": "Compound Interest & Investment Growth Calculator",
          "description": "Calculate exact compound interest final balance, effective APY, total contributions, and growth milestones with optional monthly contributions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_rate_pct": {
                "description": "Annual nominal interest rate in percent (e.g., 7 for 7%).",
                "type": "number"
              },
              "compounding": {
                "description": "Compounding frequency (default \"monthly\").",
                "enum": ["monthly", "quarterly", "semiannually", "annually"],
                "type": "string"
              },
              "currency": {
                "description": "Currency code (default \"USD\").",
                "type": "string"
              },
              "monthly_contribution": {
                "description": "Optional recurring monthly contribution (default 0).",
                "type": "number"
              },
              "principal": {
                "description": "Initial investment amount (>= 0).",
                "type": "number"
              },
              "years": {
                "description": "Investment horizon in years (1 to 100).",
                "type": "number"
              }
            },
            "required": ["annual_rate_pct", "principal", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2cd80d9a996ac07b9db4969301c9c75814ed155bed94967c9bbf190550e6e71"
        },
        {
          "name": "calculate_mortgage",
          "title": "Exact Mortgage & Amortization Calculator",
          "description": "Compute exact monthly mortgage payment, total interest, total cost, payoff acceleration from extra monthly payments, and yearly amortization summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_interest_rate_pct": {
                "description": "Annual nominal interest rate in percent (e.g., 3.5 for 3.5%).",
                "type": "number"
              },
              "currency": {
                "description": "Currency code (default \"USD\", e.g., \"EUR\", \"GBP\").",
                "type": "string"
              },
              "down_payment": {
                "description": "Optional down payment subtracted from loan_amount (default 0).",
                "type": "number"
              },
              "extra_monthly_payment": {
                "description": "Optional extra principal paid each month (default 0).",
                "type": "number"
              },
              "loan_amount": {
                "description": "Property price or loan principal amount (> 0).",
                "type": "number"
              },
              "term_years": {
                "description": "Loan duration in years (1 to 50).",
                "type": "number"
              }
            },
            "required": ["annual_interest_rate_pct", "loan_amount", "term_years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:febb2ae362231cd388a68e18a3b5cf1e05e673c6cf6137d26f6e54be8c8baf6c"
        },
        {
          "name": "calculate_spain_net_salary",
          "title": "Spain 2026 Net Salary & IRPF Calculator",
          "description": "Calculate exact 2026 net salary in Spain across 12 or 14 payments with employee Social Security + MEI (capped at max contribution base), Art. 19/20 LIRPF deductions, personal/family allowances, and progressive IRPF bracket breakdown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age_group": {
                "description": "Taxpayer age bracket for personal allowance (default \"under_65\").",
                "enum": ["under_65", "65_to_74", "75_plus"],
                "type": "string"
              },
              "children": {
                "description": "Number of dependent children under 25 (default 0).",
                "type": "integer"
              },
              "contract_type": {
                "description": "Contract type for Social Security rate: \"indefinite\" (6.50%) or \"temporary\" (6.55%).",
                "enum": ["indefinite", "temporary"],
                "type": "string"
              },
              "gross_annual_eur": {
                "description": "Annual gross salary in EUR.",
                "type": "number"
              },
              "payments": {
                "description": "Number of annual paychecks: 12 (prorated) or 14 (2 extra pays, default 14).",
                "enum": [12, 14],
                "type": "integer"
              },
              "ss_max_base_annual_eur": {
                "description": "Optional annual Social Security max contribution base cap in EUR (default 61214).",
                "type": "number"
              }
            },
            "required": ["gross_annual_eur"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b87f770e2e03f8e7c088b837cf77ef29c35da10d63172e6ca08662931cc9b17"
        },
        {
          "name": "calculate_spain_paro_sepe",
          "title": "Spain 2026 SEPE Unemployment Benefit (Paro) Calculator",
          "description": "Calculate exact 2026 Spain SEPE contributory unemployment entitlement duration (4-24 months), 70%/60% monthly gross benefit, and official IPREM minimum/maximum caps adjusted by children and workday percentage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contributed_days_last_6_years": {
                "description": "Total contributed days over the last 6 years (minimum 360 for contributory benefit).",
                "type": "integer"
              },
              "dependent_children": {
                "description": "Number of dependent children (0, 1, or 2+ for IPREM cap tiers, default 0).",
                "type": "integer"
              },
              "regulatory_base_monthly_eur": {
                "description": "Average monthly contribution base over the last 180 days in EUR.",
                "type": "number"
              },
              "workday_pct": {
                "description": "Average workday percentage from 10 to 100 (default 100).",
                "type": "number"
              }
            },
            "required": ["contributed_days_last_6_years", "regulatory_base_monthly_eur"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4327eb84e5990c61ba19ea9993861eec33ce3036b742b9889b4c3912d857b15"
        },
        {
          "name": "calculate_vat",
          "title": "Exact VAT / Sales Tax Calculator",
          "description": "Add VAT to a net price or extract the exact net base and VAT amount from a VAT-inclusive gross price rounded cleanly to 2 decimal places.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Input monetary amount (>= 0).",
                "type": "number"
              },
              "currency": {
                "description": "Currency code (default \"EUR\").",
                "type": "string"
              },
              "mode": {
                "description": "\"add\" adds VAT to a net amount; \"remove\" extracts net and VAT from a gross VAT-inclusive amount (default \"add\").",
                "enum": ["add", "remove"],
                "type": "string"
              },
              "vat_rate_pct": {
                "description": "VAT/tax rate percentage (e.g., 21 for Spain, 20 for UK/France, 19 for Germany, 23 for Portugal).",
                "type": "number"
              }
            },
            "required": ["amount", "vat_rate_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e185126d5205b8ab7f6c1e92f64b9a2b56febea021823f513fae1715b587174f"
        }
      ],
      "digest": "sha256:240f9c95be0515103ed7f2ac6cfceb38a7f02c8f6085003f6dfe1b6308b75f9e"
    }
  }
