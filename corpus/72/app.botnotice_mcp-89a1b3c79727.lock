{
  "lockfileVersion": 2,
  "subjects": {
    "app.botnotice/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://botnotice.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "botnotice",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_website",
          "title": "Check a website for AI chat tools and an AI notice",
          "description": "Reads a public website: which chat or voice-AI tools it runs, whether an AI disclosure is already shown, and, for the business described, which laws that leaves unmet. The same check as the free scan at botnotice.app/scan, without the browser pass. Not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "all_us": {
                "description": "Customers anywhere in the U.S. The default when no place is given.",
                "type": "boolean"
              },
              "big_platform": {
                "description": "10 million or more unique monthly U.S. visitors.",
                "type": "boolean"
              },
              "eu": {
                "description": "People in the European Union can use the AI.",
                "type": "boolean"
              },
              "licensed_profession": {
                "description": "A state-licensed profession: health, legal, accounting.",
                "type": "boolean"
              },
              "memory": {
                "description": "The bot remembers people or builds rapport (companion-style).",
                "type": "boolean"
              },
              "minors": {
                "description": "Whether minors may use it: no, possible (default), or directed (aimed at them).",
                "enum": ["no", "possible", "directed"],
                "type": "string"
              },
              "states": {
                "description": "Two-letter U.S. state codes where the customers are, e.g. [\"CA\",\"NY\"]. Leave out with all_us.",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "uk": {
                "description": "People in the United Kingdom can use the AI.",
                "type": "boolean"
              },
              "url": {
                "description": "The website's address, e.g. https://example.com.",
                "format": "uri",
                "type": "string"
              },
              "use_cases": {
                "description": "How the business uses AI. Codes: support_chatbot (Customer-service / FAQ chatbot); sales_chatbot (Sales, lead-capture, or booking chatbot); companion_chatbot (Chatbot with memory, persona, or relationship features); voice_agent (AI phone / voice agent); ai_content (AI-generated marketing text, images, or video); synthetic_performers (AI-generated 'people' in ads); ai_hiring (AI in hiring, screening, or HR decisions); healthcare (AI in patient diagnosis, treatment, or care); mental_health (AI offering emotional support or therapy-like help); advice (AI giving financial, legal, or medical guidance); automated_decisions (AI deciding eligibility (credit, housing, insurance, benefits)). Default: support_chatbot.",
                "items": {
                  "enum": ["support_chatbot", "sales_chatbot", "companion_chatbot", "voice_agent", "ai_content", "synthetic_performers", "ai_hiring", "healthcare", "mental_health", "advice", "automated_decisions"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1343919b70cdeb8d53c2aea552462000511ca64f76f4a9b94bf595da4542464e"
        },
        {
          "name": "get_law",
          "title": "One AI disclosure law in full",
          "description": "The full record for one law: who must comply, what to disclose, timing, duties, exemptions, penalties, enforcement, sources and the last-verified date. Slugs come from list_laws or the dataset at https://botnotice.app/datasets/ai-disclosure-laws.json.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "The law's slug, e.g. california-sb-243 or eu-ai-act-article-50.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57343c0537ec6012d6e33108fc32c378e7b6a12a29f7f4c21fef6ada4a732acf"
        },
        {
          "name": "laws_for_business",
          "title": "Which AI disclosure laws apply to a business",
          "description": "Given how a business uses AI and where its customers are, returns the laws in force and the ones coming, each with what must be disclosed, when, the penalties and the sources, plus the notice rules that satisfy all of them. Free, no account. Not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "all_us": {
                "description": "Customers anywhere in the U.S. The default when no place is given.",
                "type": "boolean"
              },
              "big_platform": {
                "description": "10 million or more unique monthly U.S. visitors.",
                "type": "boolean"
              },
              "eu": {
                "description": "People in the European Union can use the AI.",
                "type": "boolean"
              },
              "licensed_profession": {
                "description": "A state-licensed profession: health, legal, accounting.",
                "type": "boolean"
              },
              "memory": {
                "description": "The bot remembers people or builds rapport (companion-style).",
                "type": "boolean"
              },
              "minors": {
                "description": "Whether minors may use it: no, possible (default), or directed (aimed at them).",
                "enum": ["no", "possible", "directed"],
                "type": "string"
              },
              "states": {
                "description": "Two-letter U.S. state codes where the customers are, e.g. [\"CA\",\"NY\"]. Leave out with all_us.",
                "items": {
                  "maxLength": 2,
                  "minLength": 2,
                  "type": "string"
                },
                "type": "array"
              },
              "uk": {
                "description": "People in the United Kingdom can use the AI.",
                "type": "boolean"
              },
              "use_cases": {
                "description": "How the business uses AI. Codes: support_chatbot (Customer-service / FAQ chatbot); sales_chatbot (Sales, lead-capture, or booking chatbot); companion_chatbot (Chatbot with memory, persona, or relationship features); voice_agent (AI phone / voice agent); ai_content (AI-generated marketing text, images, or video); synthetic_performers (AI-generated 'people' in ads); ai_hiring (AI in hiring, screening, or HR decisions); healthcare (AI in patient diagnosis, treatment, or care); mental_health (AI offering emotional support or therapy-like help); advice (AI giving financial, legal, or medical guidance); automated_decisions (AI deciding eligibility (credit, housing, insurance, benefits)). Default: support_chatbot.",
                "items": {
                  "enum": ["support_chatbot", "sales_chatbot", "companion_chatbot", "voice_agent", "ai_content", "synthetic_performers", "ai_hiring", "healthcare", "mental_health", "advice", "automated_decisions"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8208b962db934909d977dc85a5d7f57ef5f0f01f66abc80bef897d0c9786b41d"
        },
        {
          "name": "list_laws",
          "title": "List the tracked AI disclosure laws",
          "description": "Every AI disclosure law BotNotice tracks (U.S. states, federal, EU, UK), with status and effective date, optionally filtered. Also the pending bills.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "applies_to": {
                "description": "Only laws triggered by this kind of AI use.",
                "enum": ["support_chatbot", "sales_chatbot", "companion_chatbot", "voice_agent", "ai_content", "synthetic_performers", "ai_hiring", "healthcare", "mental_health", "advice", "automated_decisions"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "A code (CA, NY, US-FED, EU, UK) or a name.",
                "type": "string"
              },
              "status": {
                "enum": ["in_force", "enacted_future", "pending", "enjoined"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52acb1f8c54cfd421ddf336d0986cc0d67a18515d4f534ce07c16ede011bc9e0"
        }
      ],
      "digest": "sha256:5a713e106926022f4e5fcbf3b78e2ef37d685e6726b8eac89394f454337396d7"
    }
  }
}
