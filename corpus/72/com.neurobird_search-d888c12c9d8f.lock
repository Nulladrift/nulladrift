{
  "lockfileVersion": 2,
  "subjects": {
    "com.neurobird/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://search.neurobird.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "neurobird-search",
        "title": "Neurobird Search",
        "version": "1.0.0",
        "description": "Web search for AI agents. Ranked results with page passages already extracted, plus clean markdown extraction of any URL. $2 per 1,000 searches, 1,000 free credits a month, no signup.",
        "websiteUrl": "https://search.neurobird.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use web_search for anything that needs current information from the web. It returns ranked sources with page passages already extracted, so a follow up fetch is usually unnecessary. Use extract_url when you already know which pages to read.",
      "tools": [
        {
          "name": "extract_url",
          "title": "Read a URL as markdown",
          "description": "Fetch one or more URLs and return their main content as clean markdown, with navigation, ads and boilerplate removed. Pass a query to get only the passages of each page relevant to it.",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "markdown",
                "enum": ["markdown", "text"],
                "type": "string"
              },
              "query": {
                "description": "Optional. Trims each page to its relevant passages.",
                "type": "string"
              },
              "urls": {
                "description": "URLs to read.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a URL as markdown"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b4463fef521eb6bed27c6026734e15070d48775f0b541a54cfe0a00c8617df2b"
        },
        {
          "name": "web_search",
          "title": "Web search",
          "description": "Search the live web and get ranked results with the relevant passages already extracted from each page. Use search_depth 'advanced' for research questions, 'basic' for a quick lookup. Set include_answer to get a grounded summary whose quotes are checked against their sources.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Restrict to the last N days.",
                "type": "integer"
              },
              "exclude_domains": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "include_answer": {
                "default": true,
                "type": "boolean"
              },
              "include_domains": {
                "description": "Only return results from these domains.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_results": {
                "default": 6,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The search query.",
                "type": "string"
              },
              "search_depth": {
                "default": "standard",
                "description": "How much work to do. advanced expands the query and reads more pages.",
                "enum": ["basic", "standard", "advanced"],
                "type": "string"
              },
              "topic": {
                "default": "general",
                "enum": ["general", "news", "code", "science", "finance"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Web search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e93c73b894e78990983598f54df630355768b96ade58a36f1139ba99f1c2ff7d"
        }
      ],
      "digest": "sha256:7eecfed9f46e15f9acf57552ef6124340b38e648d2c9091ddf80e5b2835a62a5"
    }
  }
}
