        },
        {
          "name": "get_app_reviews",
          "title": "Get App Store and Google Play reviews",
          "description": "Fetch app metadata and recent user reviews for a Google Play or iOS App Store app by store URL, Apple numeric id or Google Play package name, filtered by country, language, date and sort order. Use when the user wants to know what customers complain about or praise. Returns one app row (title, developer, rating, rating count, version) followed by review rows (rating, text, date, app version, helpful votes, developer reply). Google Play review rows also carry the review link and the public reviewer name and picture URL as Google Play shows them; Apple review rows carry no reviewer details. Apple's public reviews feed is sometimes empty; the app then returns its metadata plus an error row with code \"unavailable\" instead of reviews.",
          "inputSchema": {
            "properties": {
              "apps": {
                "description": "App Store or Google Play URLs, Apple numeric ids (id310633997) or Play package names (com.spotify.music)",
                "items": {
                  "maxLength": 300,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "countries": {
                "description": "Two-letter country codes. Defaults to [\"us\"]",
                "items": {
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "languages": {
                "description": "Google Play language codes. Defaults to [\"en\"]",
                "items": {
                  "maxLength": 12,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "maxReviewsPerApp": {
                "description": "Reviews per app, country and language. Default 100, 0 returns app metadata only",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "sinceDate": {
                "description": "ISO date; only reviews on or after it",
                "maxLength": 40,
                "type": "string"
              },
              "sort": {
                "description": "Review order. Defaults to newest",
                "enum": ["newest", "relevant"],
                "type": "string"
              }
            },
            "required": ["apps"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cache": {
                "description": "How the result was served: HIT or STALE from a cache tier, MISS or BYPASS when it was fetched now.",
                "properties": {
                  "ageSeconds": {
                    "type": "number"
                  },
                  "source": {
                    "enum": ["worker", "origin", "coalesced"],
                    "type": "string"
                  },
                  "status": {
                    "enum": ["HIT", "STALE", "MISS", "BYPASS"],
                    "type": "string"
                  },
                  "tier": {
                    "type": "string"
                  },
                  "ttlSeconds": {
                    "type": "number"
                  }
                },
                "required": ["ageSeconds", "status", "tier", "ttlSeconds"],
                "type": "object"
              },
              "results": {
                "description": "One app row per app with its rating summary, then its review rows, and an error row per app that could not be read.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": true,
                      "properties": {
                        "appId": {
                          "type": "string"
                        },
                        "country": {
                          "type": "string"
                        },
                        "developer": {
                          "type": "string"
                        },
                        "ratingAverage": {
                          "type": ["number", "null"]
                        },
                        "ratingCount": {
                          "type": ["number", "null"]
                        },
                        "store": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "type": {
                          "const": "app"
                        },
                        "url": {
                          "type": "string"
                        },
                        "version": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["appId", "country", "developer", "store", "title", "type", "url"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": true,
                      "properties": {
                        "appId": {
                          "type": "string"
                        },
                        "appVersion": {
                          "type": ["string", "null"]
                        },
                        "country": {
                          "type": "string"
                        },
                        "date": {
                          "type": "string"
                        },
                        "rating": {
                          "type": "number"
                        },
                        "reviewId": {
                          "type": "string"
                        },
                        "reviewUrl": {
                          "type": "string"
                        },
                        "reviewerName": {
                          "type": ["string", "null"]
                        },
