                          "type": ["boolean", "null"]
                        },
                        "sourceUrl": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "type": {
                          "const": "job"
                        },
                        "workplaceType": {
                          "enum": ["remote", "hybrid", "onsite", null],
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["ats", "companySlug", "id", "locations", "sourceUrl", "title", "type"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": true,
                      "properties": {
                        "ats": {
                          "type": ["string", "null"]
                        },
                        "code": {
                          "type": "string"
                        },
                        "companySlug": {
                          "type": ["string", "null"]
                        },
                        "input": {
                          "type": "string"
                        },
                        "message": {
                          "type": "string"
                        },
                        "retryable": {
                          "type": "boolean"
                        },
                        "type": {
                          "const": "error"
                        }
                      },
                      "required": ["code", "input", "message", "retryable", "type"],
