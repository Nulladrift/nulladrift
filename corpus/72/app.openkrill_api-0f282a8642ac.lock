        {
          "name": "data_get_series",
          "title": "Get a metric or rate series",
          "description": "Get a time series: World Bank indicators (filters country and indicator, from and to as years), ECB euro reference rates (filter quote, from and to as dates; values exactly as the ECB publishes) or GDELT news coverage (q, measure volume or tone, timespan). Costs 1 credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filters": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Collection filters as data_list_sources lists them, such as {\"country\": \"VNM\", \"indicator\": \"NY.GDP.MKTP.CD\"}.",
                "type": "object"
              },
              "page_size": {
                "description": "Rows per page, 1 to 50 (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page_token": {
                "description": "next_page_token from the previous answer, for the next page.",
                "type": "string"
              },
              "platform": {
                "enum": ["worldbank", "ecb", "gdelt"],
                "type": "string"
              },
              "q": {
                "description": "GDELT only: the news query.",
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
