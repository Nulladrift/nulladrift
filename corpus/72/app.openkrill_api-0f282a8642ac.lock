              },
              "results": {
                "description": "One row per requested post, read through X's oEmbed endpoint, or an error row with a code.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": true,
                      "properties": {
                        "author": {
                          "additionalProperties": true,
                          "type": "object"
                        },
                        "createdAt": {
                          "type": ["string", "null"]
                        },
                        "hasMedia": {
                          "type": "boolean"
                        },
