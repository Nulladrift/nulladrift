        {
          "name": "data_search",
          "title": "Search open data by kind",
          "description": "Search every licence-clean source of one kind at once (jobs, papers and books as work, posts, apps, media, entities, metrics) and get de-duplicated rows. Costs 1 credit per source searched, at most 8. Every row has name (platform/collection/id), kind, its fields and source {platform, url, license, attribution, fetched_at, terms_url}; quote source.attribution when you show a row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["post", "author", "comment", "metric", "media", "job", "app", "market", "work", "entity"],
                "type": "string"
              },
              "page_size": {
                "description": "Rows per page, 1 to 50 (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "platforms": {
                "description": "Optional: only these platforms, such as [\"arxiv\", \"openalex\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "q": {
                "description": "The words to search for.",
                "type": "string"
              }
            },
            "required": ["kind", "q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
