        {
          "name": "list_jobs",
          "title": "List jobs from company job boards",
          "description": "List open jobs at companies on 58 hiring systems (ATS) or 7 open job feeds, from a careers URL, \"ats:slug\" (for example \"greenhouse:airbnb\", \"workday:nvidia.wd5/NVIDIAExternalCareerSite\") or a company name or domain. A name or domain is looked up on Greenhouse, Lever, Ashby, Workable and SmartRecruiters; a domain such as \"arthurcox.com\" also finds the board on most supported systems that the company's own website links. Use when the user asks who is hiring, what roles a company has open, or to find remote or engineering roles at a named company. Optional filters: keyword, titleKeywords, excludeTitleKeywords, location, remote, department, employmentTypes, postedSince, postedWithinDays, withSalary. Returns normalized jobs (title, department, locations with ISO country codes, remote, workplace type, compensation, description, apply URL, dates); a board that cannot be read comes back as a type \"error\" record. Hiring systems: Greenhouse, Lever, Ashby, Workable, SmartRecruiters, Workday, BambooHR, Personio, Recruitee, Breezy HR, Teamtailor, Pinpoint, Rippling, Gem, Manatal, Polymer, Homerun, Trakstar Hire, softgarden, Paylocity, Oracle Recruiting Cloud, Eightfold, JobScore, ADP Workforce Now, Gupy, Keka, Beisen, SAP SuccessFactors, Phenom, Cornerstone OnDemand, JazzHR, iCIMS, Jobvite, InHire, Quickin, Recrutei, Solides Vagas, HRMOS, HERP Hire, Comeet, Recruiterflow, Dayforce, Hireology, ApplicantPro (isolved), ApplicantStack, Loxo, Firefish, Bullhorn career portal, d.vinci, Varbi, Betterteam, HRMDirect (ClearCompany), isolved Hire, Apploi, Avature, PageUp, Paradox and Frontline (AppliTrack).",
          "inputSchema": {
            "properties": {
              "companies": {
                "description": "Careers page URLs, \"ats:slug\" tokens (ats is a lowercase system id such as personio or pinpoint) or company names and domains, e.g. [\"greenhouse:airbnb\", \"https://jobs.lever.co/spotify\", \"https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite\", \"stripe.com\"]",
                "items": {
                  "maxLength": 300,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "department": {
                "description": "Keep jobs in a department matching this text",
                "maxLength": 200,
                "type": "string"
              },
              "employmentTypes": {
                "description": "Keep jobs of these employment types",
                "items": {
                  "enum": ["full_time", "part_time", "contract", "intern", "temporary", "other"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "excludeTitleKeywords": {
                "description": "Drop jobs whose title contains any of these phrases, e.g. [\"senior\", \"intern\"]",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "includeDescription": {
                "description": "Workday, SmartRecruiters and BambooHR need one extra request per job for the full text; false skips it for a faster list",
                "type": "boolean"
              },
              "keyword": {
                "description": "Keep jobs whose title or description mentions every word of this text",
                "maxLength": 200,
                "type": "string"
              },
              "location": {
                "description": "Keep jobs whose location text or city contains this, or whose country matches this name or ISO code",
                "maxLength": 200,
                "type": "string"
              },
              "maxItems": {
                "description": "Cap on jobs returned in total across all companies",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "maxJobsPerCompany": {
                "description": "Cap on jobs returned per company after filtering (default 1000)",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "postedSince": {
                "description": "ISO date; keep jobs posted or updated on or after it",
                "maxLength": 40,
                "type": "string"
              },
              "postedWithinDays": {
                "description": "Keep jobs posted or updated in the last N days",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "remote": {
                "description": "Keep only remote jobs when true",
                "type": "boolean"
              },
              "titleKeywords": {
                "description": "Keep jobs whose title contains any of these phrases, e.g. [\"engineer\", \"developer\"]",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "withSalary": {
                "description": "Keep only jobs that publish a salary figure when true",
                "type": "boolean"
              }
            },
            "required": ["companies"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cache": {
                "description": "How the result was served: HIT or STALE from a cache tier, MISS or BYPASS when it was fetched now.",
                "properties": {
                  "ageSeconds": {
                    "type": "number"
                  },
                  "source": {
                    "enum": ["worker", "origin", "coalesced"],
                    "type": "string"
                  },
                  "status": {
                    "enum": ["HIT", "STALE", "MISS", "BYPASS"],
                    "type": "string"
                  },
                  "tier": {
                    "type": "string"
                  },
                  "ttlSeconds": {
                    "type": "number"
                  }
                },
                "required": ["ageSeconds", "status", "tier", "ttlSeconds"],
                "type": "object"
              },
              "results": {
                "description": "One row per open job, then one error row per company board that could not be read.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": true,
                      "properties": {
                        "applyUrl": {
                          "type": ["string", "null"]
                        },
                        "ats": {
                          "type": "string"
                        },
                        "companyName": {
                          "type": ["string", "null"]
                        },
                        "companySlug": {
                          "type": "string"
                        },
                        "compensation": {
                          "additionalProperties": true,
                          "type": ["object", "null"]
                        },
                        "department": {
                          "type": ["string", "null"]
                        },
                        "id": {
                          "type": "string"
                        },
                        "locations": {
                          "items": {
                            "additionalProperties": true,
                            "properties": {
                              "country": {
