          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Collection id, such as jobs.",
                "type": "string"
              },
              "filters": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Collection filters as data_list_sources lists them, such as {\"country\": \"VNM\", \"indicator\": \"NY.GDP.MKTP.CD\"}.",
                "type": "object"
              },
              "page_size": {
                "description": "Rows per page, 1 to 50 (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page_token": {
                "description": "next_page_token from the previous answer, for the next page.",
                "type": "string"
              },
              "platform": {
                "description": "Platform id from data_list_sources, such as usajobs.",
                "type": "string"
              },
              "q": {
                "description": "Optional words.",
                "type": "string"
              }
