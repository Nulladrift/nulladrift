        {
          "name": "data_search_news",
          "title": "Search recent news articles",
          "description": "Find recent news articles about a topic, newest first: title, url, publisher, published_at, language and a short snippet where the publisher gives one. Reads GDELT's worldwide article list (published_at is the time GDELT first saw the article; no snippet) and open-licence publisher feeds (Global Voices, NASA; with snippet and author). Costs 1 credit per source read, at most 2. A source that fails is named in data.errors while the other still answers. Every row has name (platform/collection/id), kind, its fields and source {platform, url, license, attribution, fetched_at, terms_url}; quote source.attribution when you show a row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Optional ISO 639-1 language code, such as en, fr, es or vi (18 supported; the feeds cover en, fr and es).",
                "type": "string"
              },
              "page_size": {
                "description": "Rows per page, 1 to 50 (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "The words to find, such as \"electric cars\"; every word must appear.",
                "type": "string"
              },
              "timespan": {
                "description": "Optional window back from now, 1h to 90d, such as 24h or 3d (default 7d).",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Search recent news articles",
            "openai/toolInvocation/invoking": "Search recent news articles..."
