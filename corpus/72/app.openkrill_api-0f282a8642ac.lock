        {
          "name": "data_company_discover",
          "title": "Find companies by industry and country",
          "description": "List companies of one industry in one country from two open registers: Wikidata (companies whose industry or business type matches, the best known first, with website, founding date, head count and LEI) and GLEIF's LEI index (active legal entities in the country whose legal name holds the industry word, as found_in gleif). industries lists the Wikidata items the words were read as; send a Wikidata item id such as Q880371 (software industry) for an exact industry. Wikidata rows with a LEI carry the GLEIF legal entity. Coverage follows what Wikidata and GLEIF hold, so small firms are often missing. No person is named. Costs 1 credit. Every row has name (platform/collection/id), kind, its fields and source {platform, url, license, attribution, fetched_at, terms_url}; quote source.attribution when you show a row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO 3166-1 code (DE, US, VN) or an English country name (Germany).",
                "type": "string"
              },
              "industry": {
                "description": "Industry words, such as software, bank or car manufacturer, or a Wikidata item id such as Q880371.",
                "type": "string"
              },
              "page_size": {
                "description": "Wikidata companies to return, 1 to 50 (default 20); up to 10 GLEIF entities are added.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["country", "industry"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Find companies by industry and country",
            "openai/toolInvocation/invoking": "Find companies by industry and country..."
          },
          "digest": "sha256:712831ea256d1c950c23c1fc8ad5d59c240352e3013e1ca37582e4cf3e9292a9"
        },
        {
          "name": "data_company_funding",
          "title": "List a company's funding rounds",
          "description": "List a US company's private funding rounds from its SEC Form D filings: for the newest five, the offering size, the amount sold, the first sale date, the number of investors and the security type, with the filing link; older filings are listed by date. Send name (such as Stripe; the best EDGAR match is used and other_matches lists other companies it matched; a filer with no Form D is not found), domain (such as stripe.com, through the SEC number on its Wikidata item) or cik. Many rounds are never filed on Form D, and companies outside the US rarely file. No investor or officer is named. Costs 1 credit. Every row has name (platform/collection/id), kind, its fields and source {platform, url, license, attribution, fetched_at, terms_url}; quote source.attribution when you show a row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
                "description": "The SEC Central Index Key, such as 1691342.",
                "type": "string"
              },
              "domain": {
                "description": "The company's domain, such as stripe.com.",
                "type": "string"
              },
              "name": {
                "description": "The company's name, such as Stripe.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: List a company's funding rounds",
            "openai/toolInvocation/invoking": "List a company's funding rounds..."
          },
          "digest": "sha256:3c1cc356a43f08dbce91f5b4cc241bd8d9ce5ec7ae3aa8499cf6dc27cb099344"
        },
        {
          "name": "data_company_headcount",
