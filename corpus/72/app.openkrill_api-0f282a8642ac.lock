        {
          "name": "data_local_search",
          "title": "Search local businesses near a place",
          "description": "Find businesses and services near a place from OpenStreetMap: send what (a category such as cafe, pharmacy, hotel or dentist, or a name such as Starbucks) and near (a place such as \"Hoan Kiem, Hanoi\") or lat and lon, plus an optional radius_m (default 1500, at most 10000). Nominatim's best text matches in the box around the radius (at most 40), kept when they are a business inside the radius and sorted by distance, so a call can return fewer rows than page_size; each row has title, category, address, lat, lon, distance_m, phone, website and opening_hours where OpenStreetMap has them. Data © OpenStreetMap contributors, ODbL 1.0. Costs 1 credit. Every row has name (platform/collection/id), kind, its fields and source {platform, url, license, attribution, fetched_at, terms_url}; quote source.attribution when you show a row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude of the search center, with lon.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude of the search center, with lat.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "near": {
                "description": "A place to search around, such as \"Shibuya, Tokyo\" or \"10 Downing Street, London\"; or send lat and lon.",
                "type": "string"
              },
              "page_size": {
                "description": "Rows to return, 1 to 40 (default 10).",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "radius_m": {
                "description": "Search radius in metres (default 1500).",
                "maximum": 10000,
                "minimum": 100,
                "type": "integer"
              },
              "what": {
                "description": "A category (cafe, restaurant, pharmacy, hotel, supermarket, dentist...) or a business name.",
                "type": "string"
              }
            },
            "required": ["what"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Search local businesses near a place",
            "openai/toolInvocation/invoking": "Search local businesses near a place..."
          },
          "digest": "sha256:301b6c6652dbe3ddf44d2cea6b37082a394226e78aebf6225d2848d399e7a5c4"
        },
        {
