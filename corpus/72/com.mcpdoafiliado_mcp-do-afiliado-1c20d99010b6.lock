      "serverInfo": {
        "name": "mcp-do-afiliado",
        "title": "MCP do Afiliado",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MCP do Afiliado (mcpdoafiliado.com): ferramentas de leitura sobre as APIs de afiliado da\nShopee, AliExpress, Amazon, Mercado Livre, Magalu, Awin, Rakuten e CityAds, assinadas com as\ncredenciais que o próprio usuário cadastrou. Nenhuma ferramenta altera a conta.\n\n• convert_links: recebe um link de produto ou loja (\"url\") ou até 150 (\"urls\") e devolve\n  o link de afiliado do usuário em final_url.\n• search_products: busca por palavra-chave, com faixa de preço (price_min/price_max),\n  ordenação (sort) e marketplace (site). Cada item traz título, preço, image_url (a foto\n  do produto) e o link de afiliado.\n• get_product: dados de um produto a partir do link: título, preço, imagem, estoque e\n  comissão quando a loja informa, e o histórico de preço. No AliExpress, com\n  aliexpress_details:true, vêm também frete para o Brasil, nota, vendidos, marca, loja,\n  categoria e variações.\n• get_bot_info: quais marketplaces a conta configurou para busca e conversão. Responde\n  por que uma busca ou conversão falhou por site não configurado.\n\nSem login dá para ver a lista de ferramentas; ao chamar qualquer uma, o app abre o login\nde mcpdoafiliado.com (ou use uma API key gerada lá).",
      "tools": [
        {
          "name": "convert_links",
          "title": "Converter links de afiliado",
          "description": "Converte um ou vários links (URLs de produtos/lojas) em links de afiliado da conta, com as credenciais que o usuário cadastrou no painel. OBRIGATÓRIO informar \"url\" (um único link) ou \"urls\" (vários, até 150 por chamada). Link sem https:// e pontuação colada ao copiar de um texto são corrigidos; o que não for URL volta em \"invalid_urls\" e o resto do lote converte normalmente. Retorna JSON com affiliate_url e final_url por item (final_url é o link a publicar).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Um único link a converter (URL completa, com https://).",
                "format": "uri",
                "type": "string"
              },
              "urls": {
                "description": "Vários links a converter (até 150 por chamada; para mais, divida em lotes).",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 150,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "affiliate_url": {},
              "final_url": {
                "description": "Link a publicar (um link)."
              },
              "invalid_urls": {
                "description": "Itens de \"urls\" que não são link: index e value.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "items": {
                "description": "Um item por link no lote, com url_original, affiliate_url e final_url.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "success": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Converter links de afiliado"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0f7edde85f8c2f9af9160ae4b440aa74402b4cc5efe5f875a1a0b23ee5a67736"
        },
        {
          "name": "get_bot_info",
          "title": "Marketplaces configurados",
          "description": "Mostra o que esta conta suporta: marketplaces com busca ativa (search_sites, usados por search_products), catálogos públicos (Kabum/Magalu, com flag de monetização) e redes/domínios com conversão de link ativa (convertible_routes, agrupados por provider com amostra de domínios). Use quando uma busca/conversão falhar por site não configurado, ou quando o usuário perguntar o que dá para fazer. Para saber se um domínio específico converte, basta chamar convert_links com ele.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "success": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Marketplaces configurados"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3dfc5f1e87d18f58ab37c00d3350cb56b6024091db20e8c1245c49c61f1c90c3"
        },
        {
          "name": "get_product",
          "title": "Detalhes do produto",
          "description": "Dados de um produto a partir da URL: título, preço, moeda, imagem, o link de afiliado (affiliate_url), o link final (final_url) e o histórico de preços. Quando a loja informa, vêm também estoque (availability), preço \"de\" (original_price), descrição, URL canônica, loja (shop_name), faixa de preço (price_min/price_max) e comissão (commission_rate). No AliExpress vem também moedas_url, o link da promoção de moedas do mesmo produto; com aliexpress_details:true, vem ainda o bloco \"aliexpress\" com frete para o Brasil, nota, vendidos, marca, loja, categoria e variações. Kabum e Magalu têm catálogo público: sem credencial cadastrada, devolvem os dados com affiliate_url e final_url null e monetized:false. Fontes: Shopee Affiliate Open API (affiliate.shopee.com.br/open_api), AliExpress Affiliate API (openservice.aliexpress.com), o catálogo público da Kabum e da Magalu e, nas outras lojas, a página pública do produto; o histórico vem do banco deste serviço. Amazon: o link de afiliado sai com a Partner Tag; título, preço, imagem e estoque vêm da Creators API quando a conta cadastrou o Credential ID e o Secret dela (sem eles, só o link).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aliexpress_details": {
                "description": "Opcional, só AliExpress. true: devolve também \"aliexpress\" com o frete para o Brasil (shipping: free, amount, currency, ship_from, prazo), nota (rating), avaliações (rating_count), vendidos (sold), marca, loja, categoria (category_path) e variações (variants). Faz 2 a 3 chamadas a mais à API do AliExpress com a credencial da conta: peça só quando for usar.",
                "type": "boolean"
              },
              "history_limit": {
                "default": 10,
                "description": "Opcional. Limite do histórico de preços (1 a 50; padrão 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "URL do produto.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "affiliate_url": {},
              "final_url": {},
              "price_history": {
                "description": "Pontos do histórico: date, price (número), currency. Vazio quando a conexão é por chave de API (o histórico só vem pelo login no Claude ou no ChatGPT, com o módulo Histórico de Preços).",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "price_history_limit": {
                "description": "Só quando o limite do módulo Histórico de Preços foi atingido: window (minute ou day), limit, resets_at e message. O price_history traz então só os posts da vitrine.",
                "type": "object"
              },
              "product": {
                "description": "title, price (número), currency, image_url…",
                "type": "object"
              },
              "success": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Detalhes do produto"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2947dc75fe23c6bbb9d0702edac9853896328c4d1a04deadc4da86158f33bb63"
        },
        {
          "name": "search_products",
          "title": "Buscar produtos nos marketplaces",
          "description": "Busca produtos por palavra-chave nas APIs dos marketplaces que a conta configurou (Shopee, AliExpress e Amazon, esta com as chaves da Creators API; Kabum e Magalu quando informados em \"site\"). Filtre por faixa de preço (price_min/price_max) e ordene (sort: price_asc = mais barato primeiro). Cada item traz image_url, a URL da foto do produto, e price como número na moeda de \"currency\" (ex.: 274.99). Paginação: a resposta traz \"count\" e \"page\"; com count igual a limit, normalmente há mais resultados na página seguinte (com filtros ativos, count menor que limit não garante o fim do catálogo). Na busca multi-site, os marketplaces que falharam aparecem em \"sites_failed\"; a falha não quer dizer que o produto não exista neles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "commission_min": {
                "description": "Comissão mínima, em fração (0.05 = 5%). Filtra produtos que pagam pelo menos essa comissão de afiliado. Shopee e AliExpress retornam comissão; Amazon não.",
                "minimum": 0,
                "type": "number"
              },
              "key_seller_only": {
                "description": "Se true, filtra apenas \"key sellers\" da Shopee — vendedores de alto desempenho selecionados pela própria plataforma. Eles têm menos probabilidade de estar em férias ou com estoque inativo. Use quando a busca retornar muitos produtos de vendedores indisponíveis. Shopee: filtro nativo (isKeySeller). Outros sites: ignorado.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Máximo de resultados (1 a 50; padrão 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "official_only": {
                "description": "Se true, retorna só lojas oficiais (Shopee Mall / AliExpress TMALL). Onde o site não informa, o item é mantido.",
                "type": "boolean"
              },
              "page": {
                "default": 1,
                "description": "Página de resultados (padrão 1) — use para ver mais itens.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "Preço máximo (na moeda do site, geralmente BRL).",
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Preço mínimo (na moeda do site, geralmente BRL).",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Palavra-chave / título a buscar.",
                "minLength": 1,
                "type": "string"
              },
              "site": {
                "description": "Marketplace a consultar. Se omitido, busca em Shopee/AliExpress/Amazon (os que a conta configurou; veja get_bot_info) e junta os resultados (cada item traz \"site\"). \"kabum\" e \"magalu\" só entram quando informados aqui; o link de afiliado sai com a credencial da conta quando ela tem a loja cadastrada.",
                "enum": ["shopee", "aliexpress", "amazon", "kabum", "magalu"],
                "type": "string"
              },
              "site_filters": {
                "additionalProperties": true,
                "description": "Filtros ESPECÍFICOS do marketplace (use só com \"site\" fixado). Shopee: { isKeySeller: bool }. AliExpress: { category_ids: \"100,200\", ship_to_country: \"BR\", delivery_days: \"7\" }. Amazon: { searchIndex: \"Computers\", condition: \"New\", brand: \"Sony\", deliveryFlags: [\"Prime\"], minReviewsRating: 4, minSavingPercent: 20 }.",
                "type": "object"
              },
              "sort": {
                "description": "Ordenação: relevance (padrão), price_asc (mais barato), price_desc (mais caro), commission_desc (maior comissão de afiliado), sales_desc (mais vendidos), rating_desc (melhor avaliados), discount_desc (maior desconto).",
                "enum": ["relevance", "price_asc", "price_desc", "commission_desc", "sales_desc", "rating_desc", "discount_desc"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "count": {
                "type": "integer"
              },
              "items": {
                "description": "Produtos: title, price (número), currency, image_url, affiliate_url, site.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "page": {
                "type": "integer"
              },
              "sites_failed": {
                "type": "array"
              },
              "success": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Buscar produtos nos marketplaces"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c73030554caf86ead7918499391152c899346026770d24066c13675a73001ec3"
        }
      ],
      "prompts": [
        {
          "name": "cacar_por_comissao",
          "title": "Caçar oferta por comissão",
          "description": "Busca produtos de um tema numa faixa de preço, com comissão mínima, só loja oficial, os mais vendidos.",
          "arguments": [
            {
              "name": "tema",
              "description": "O que procurar (ex.: \"casa e cozinha\").",
              "required": true
            },
            {
              "name": "faixa_de_preco",
              "description": "Opcional. Ex.: \"entre R$ 50 e R$ 200\"."
            },
            {
              "name": "comissao_minima",
              "description": "Opcional. Ex.: \"10%\"."
            }
          ],
          "digest": "sha256:b6220afc4e550f2ffdb35cd96901ce9d4143c93b25fe85276b566a57b3c310e2"
        },
        {
          "name": "comparar_marketplaces",
          "title": "Comparar o mesmo produto entre marketplaces",
          "description": "Procura o produto do link nos outros marketplaces configurados e compara preço e comissão.",
          "arguments": [
            {
              "name": "link",
              "description": "Link do produto.",
              "required": true
            }
          ],
          "digest": "sha256:184c54d2effd4d5febdf60ada977db050d63b17e5f8a240e13af7b8c09c57bf1"
        },
        {
          "name": "converter_lote",
          "title": "Fila do dia: um lote de links",
          "description": "Converte uma lista de links (até 150) e devolve um por linha, na mesma ordem.",
          "arguments": [
            {
              "name": "links",
              "description": "Os links, um por linha, ou o texto de um post antigo.",
              "required": true
            }
          ],
          "digest": "sha256:9321fee6be0c33b6878ad7c217c23b72795a7f1ff3d1ffc2d01dfdd41711a9d1"
        },
        {
          "name": "curadoria",
          "title": "Curadoria por público e faixa de preço",
          "description": "Monta uma seleção de produtos para um público ou data, variando as categorias, com o link de afiliado.",
          "arguments": [
            {
              "name": "tema",
              "description": "Público ou data (ex.: \"presente de dia das mães\").",
              "required": true
            },
            {
              "name": "preco_maximo",
              "description": "Opcional. Ex.: \"R$ 150\"."
            },
            {
              "name": "quantidade",
              "description": "Opcional. Quantas sugestões (padrão 5)."
            }
          ],
          "digest": "sha256:74a4573033acdfe7b43cc0677fdd52a70e82eb4c6591b6d91316583e85ce330f"
        },
        {
          "name": "post_de_oferta",
          "title": "Post de oferta pronto pro grupo",
          "description": "Monta o post de uma oferta a partir do link, com preço, preço \"de\", desconto e o seu link de afiliado.",
          "arguments": [
            {
              "name": "link",
              "description": "Link do produto.",
              "required": true
            },
            {
              "name": "formato",
              "description": "Opcional. Como você quer o post (ex.: \"sem emoji\", \"curto pro Stories\", \"com o cupom XYZ\")."
            }
          ],
          "digest": "sha256:32434c3bca171d336f1e249f500bdf40004829abdc0bd041c0611121dab19a7f"
        },
        {
          "name": "preco_e_historico",
          "title": "O preço de agora e o que já foi registrado",
          "description": "O preço atual do produto e os preços que este servidor já registrou para ele.",
          "arguments": [
            {
              "name": "link",
              "description": "Link do produto.",
              "required": true
            }
          ],
          "digest": "sha256:c0dda5d452ade1262d865c1bdd97a1ecf40d618c9cb623c1095a7d61ede1502e"
        }
      ],
      "digest": "sha256:c37bc1be8768fed04c0d78cfb1030428c73c580991718c30d5dd9e9853db3391"
    }
  }
