      "serverInfo": {
        "name": "neurocompare",
        "title": "NeuroCompare",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only comparison of UK private ADHD & autism assessment providers. Returns facts (published prices, typical waits, locations, format, NHS shared care, CQC registration) plus provider availability (next available appointment date, days until available, and whether they are accepting new patients), which search_providers and match can also filter by. Not medical advice, triage, diagnosis or a recommendation. Rankings are objective and never paid for.",
      "tools": [
        {
          "name": "get_provider",
          "title": "Get provider",
          "description": "Get one provider's public details and pricing by provider id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Provider id, e.g. adhd-now",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5053af310504182c53883f0403f2774c5479d9f3e0dd829b85953e8bec2681a"
        },
        {
          "name": "list_services",
          "title": "List assessment services",
          "description": "List the ADHD & autism assessment types compared on NeuroCompare (adult/child, ADHD/autism) with the lowest published price and number of providers for each.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4cf532c4d1f50df7d6169b4736d0f1a79dada0ebca517da923a410bac4c9ffb"
        },
        {
          "name": "match",
          "title": "Rank matching providers",
          "description": "Rank suitable UK ADHD/autism assessment providers by an objective score (price, rating, verification/CQC, wait, shared-care). A comparison, not medical advice or a recommendation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accepting_new_patients": {
                "description": "only providers currently accepting new patients",
                "type": "boolean"
              },
              "available_within_days": {
                "description": "only providers whose next available appointment is within this many days (e.g. 1 = next-day, 7 = this week)",
                "type": "number"
              },
              "condition": {
                "description": "adhd | autism | combined",
                "type": "string"
              },
              "for_child": {
                "type": "boolean"
              },
              "format": {
                "description": "online | in-person | hybrid | any",
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "max_price_gbp": {
                "type": "number"
              },
              "nation": {
                "description": "England | Scotland | Wales | Northern Ireland",
                "type": "string"
              },
              "needs_shared_care": {
                "type": "boolean"
              }
            },
            "required": ["condition"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1cf15b1579dc4f5f54b39654b8cba9b43419efb3ccfb950c7bd0ed5e646d1d14"
        },
        {
          "name": "related_services",
          "title": "Related comparison sites",
          "description": "List the sibling Comparison Collective comparison sites (other conditions) and their MCP endpoints, so a user with a need spanning conditions can be routed correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbb3ad4779e9a5ac991e3790a7952693ee31002c11b35c369e1d0892c80638d4"
        },
        {
          "name": "search_providers",
          "title": "Search providers",
          "description": "Find UK private ADHD/autism assessment providers with the lowest published assessment price for each, including availability (next available appointment date, whether they are accepting new patients). Can filter by availability. Factual listing data, not a recommendation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accepting_new_patients": {
                "description": "only providers currently accepting new patients",
                "type": "boolean"
              },
              "available_within_days": {
                "description": "only providers whose next available appointment is within this many days (e.g. 1 = next-day, 7 = this week)",
                "type": "number"
              },
              "condition": {
                "description": "adhd | autism | combined",
                "type": "string"
              },
              "cqc_registered": {
                "type": "boolean"
              },
              "for_child": {
                "description": "true for a child / young person",
                "type": "boolean"
              },
              "format": {
                "description": "online | in-person | hybrid | any",
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "max_price_gbp": {
                "type": "number"
              },
              "nation": {
                "description": "England | Scotland | Wales | Northern Ireland (providers based there, plus UK-wide online)",
                "type": "string"
              },
              "needs_shared_care": {
                "type": "boolean"
              },
              "published_price_only": {
                "type": "boolean"
              }
            },
            "required": ["condition"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:31d79c1b63c39ab924759071f42067d8ce2a33c59959bf5bede90532af11aa7f"
        }
      ],
      "digest": "sha256:a0f21e6f82e031f466c8925745079424b534aba78d9659343be837fb4dd05218"
    }
  }
