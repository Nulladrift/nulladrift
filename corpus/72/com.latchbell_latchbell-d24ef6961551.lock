        {
          "name": "send_text",
          "title": "Have my AI agent text someone",
          "description": "Owners only (needs sign-in): Texts one number (a US one, or one with its country code like +44, through the paired phone’s carrier), or a list of up to 25 (the owner app’s Text for me rules: each list text ends with how to opt out, each number once a day from a list), from the business’s paired phone (text_phones; pair_phone first), as the business. Replies come back to the business: its AI agent answers them, and they show in inquiries and updates. Only people there is a real reason to text, never marketing or lists of strangers; never in the owner’s quiet hours (front_desk settings quietHours, by default only 12:00am to 12:05am the business’s time), at most 50 texts a day, never to a number that replied STOP or that the owner blocked. Plain words, 2 to 320 characters, no secrets or card numbers. sent lists who got it; skipped says why not (STOP, blocked, not a US number). In quiet hours, or past 50 today, it is refused with an error: try again later.",
