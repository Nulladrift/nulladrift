          "description": "Owners only (needs sign-in): Use when the owner wants to teach their AI agent (the AI receptionist that answers customers) something new, or change what it says. Change the business's AI receptionist: draft (the whole business brief, about 4,000 characters, which every AI answering for the business starts from; it goes live at once, without lines starting \"> Check:\", and is rebuilt from the sources when they change), instructions (the owner's additions to the AI's instructions, up to 4000 characters, live at once) and/or restore_version (an id from receptionist's versions goes live again, as a new version). publish and publish_when_ready are no longer needed: the brief is live as soon as it's written. Read receptionist first, and show the owner a brief you wrote before saving it: whatever is in it is what customers are quoted.",
