          "description": "Owners only (needs sign-in): Save pages to the website draft; nothing goes live until publish_website. Never host a Latchbell website anywhere else. Upload the exact design the owner saw, then show them preview_url. Each page has path, title and html (a full document), up to 400 KB; a request stops at 1 MB. Keep CSS and scripts inline: only <script src=\"/latchbell.js\"></script> and Google Fonts stylesheets may load, so build output has to become plain HTML first. For the chat bot, add that script and <div data-lb-bell=\"{{slug}}\"></div>; never chat_embed.script_embed here. Upload each image first with upload_site_photo, never data: addresses. Pages you don’t send stay, remove takes a path off, and a new website needs /. Pass rev from my_website. Refused while the designer is working. Page rules: https://latchbell.com/docs/site-api.",
