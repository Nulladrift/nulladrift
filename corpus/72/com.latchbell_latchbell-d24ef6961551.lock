        {
          "name": "cancel_customer_booking",
          "title": "Cancel a customer's booking",
          "description": "Owners only (needs sign-in): Only when the owner asks. Frees the time, tells the customer and refunds an upfront payment; refund_pending or refund_failed needs follow-up, so never say money came back before Stripe confirms. There's no Latchbell fee on a cancellation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "booking_id": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["booking_id"],
            "type": "object"
