        },
        {
          "name": "block_time",
          "title": "Block busy time",
          "description": "Owners only (needs sign-in): Time off, or time booked elsewhere so Latchbell never double-books. Give start and end (local HH:MM) for part of a day, or leave both out for the whole day. who is a team member's id, or leave it out for the whole business. The answer lists any booking it overlaps: those stay until moved.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "end": {
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "note": {
                "maxLength": 100,
                "type": "string"
              },
              "start": {
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "who": {
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4ccb58c90b960ea205449b94a09323a731026627ce05b85774f90eb7dfbf1a6e"
        },
        {
          "name": "book",
          "title": "Book a time",
          "description": "Use to complete a booking, only after the customer agrees to the exact services, price and time. start comes from find_times; catalog_revision and expected_estimate_cents from the estimate they saw. Needs a phone or email so the business can reach them, and an address for a service at their place. A retry with the same request_key returns the same booking. Only status confirmed means booked; otherwise next says what the customer still has to do. Repeat with repeat and visits, or dates. Keep reply_token private: it is how the customer sees, moves or cancels it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "The street address, for a service at the customer's place",
                "maxLength": 300,
                "type": "string"
              },
              "business": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "catalog_revision": {
                "description": "From quote or find_times",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "customer_authorized": {
                "type": "boolean"
              },
              "customer_email": {
                "maxLength": 200,
                "type": "string"
              },
              "customer_name": {
                "description": "Not needed when the sign-in or X-User-Name gives it, and likewise phone and email",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "customer_phone": {
                "maxLength": 30,
                "type": "string"
              },
              "dates": {
                "description": "Exact starts for several visits, e.g. one per guest checkout",
                "items": {
                  "maxLength": 50,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "expected_estimate_cents": {
                "description": "The total the customer agreed to",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "inquiry_id": {
                "description": "An open conversation to book in, with its reply_token",
                "maxLength": 60,
                "type": "string"
              },
              "note": {
                "maxLength": 500,
                "type": "string"
              },
              "only_who": {
                "description": "Only this person: fewer times, but it stays with them",
                "type": "boolean"
              },
              "repeat": {
                "enum": ["weekly", "biweekly", "monthly"],
                "type": "string"
              },
              "reply_token": {
                "maxLength": 100,
                "type": "string"
              },
              "request_key": {
                "description": "A private unique key: a retry with it never books twice",
                "maxLength": 100,
                "minLength": 20,
                "type": "string"
              },
              "selections": {
                "items": {
                  "properties": {
                    "fields": {
                      "additionalProperties": {
                        "maxLength": 500,
                        "type": "string"
                      },
                      "description": "Answers to the item's fields, by field id",
                      "propertyNames": {
                        "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "item_id": {
                      "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                      "type": "string"
                    },
                    "options": {
                      "additionalProperties": {
                        "items": {
                          "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      },
                      "description": "Choices by option group id: {\"bedrooms\": [\"bed-3\"], \"extras\": [\"fridge\"]}",
                      "propertyNames": {
                        "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "quantity": {
                      "description": "How many: the party size for a table or a class",
                      "maximum": 999,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["item_id"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "start": {
                "description": "An exact start from find_times",
                "maxLength": 50,
                "type": "string"
              },
              "visits": {
                "description": "With repeat: how many visits, including the first",
                "maximum": 10,
                "minimum": 2,
                "type": "integer"
              },
              "who": {
                "description": "Who they'd like, by name, from the catalog's team. A wish: someone else may take it, unless only_who",
                "maxLength": 80,
                "type": "string"
              },
              "zip": {
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["business", "catalog_revision", "customer_authorized", "expected_estimate_cents", "request_key", "selections", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
