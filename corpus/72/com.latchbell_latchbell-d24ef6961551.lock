          "description": "Only for house cleaning, plumbing or heating and air; for any other business or request use find_businesses. Who serves a ZIP or city for this service, each with a firm price for this job and its next open times. service is a shared tag: house_cleaning, plumbing or hvac. options are the same at every business of that kind: read catalog on any of them, e.g. house_cleaning takes bedrooms (bed-0 to bed-10), bathrooms (bath-1, bath-1-5 … bath-10), clean (standard, deep, move_out, turnover), extras (fridge, oven, windows, cabinets, laundry, restock, pets); plumbing and hvac take problem. To book, pass item_id with your options as selections to book. Prices include everything listed, with no fee to the customer.",
