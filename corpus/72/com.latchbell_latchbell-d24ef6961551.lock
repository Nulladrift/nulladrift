          "description": "Owners only (needs sign-in): Only when the owner explicitly asks to activate the plan: show its monthly price, included usage, overage rates and spending limit from receptionist_service first. With owner_approved true, return a Stripe-hosted checkout URL for the owner to complete. Creating a link does not complete payment, activate phone service or change the spending cap: once the plan is paid, the monthly limit becomes the plan's price (spending_cap_on_payment), so nothing past the price is charged until the owner tops up or raises the cap: tell the owner. plan is the id of one of receptionist_service plans (its name, like pro, works too), or agent for agent_plan (only for a business an AI agent signed up itself with register_business); without it, the plan marked default. An unpaid checkout is dropped with cancel_receptionist_checkout. With a plan already paid, naming another plan switches to it now and returns switched: true (no link): Stripe charges the difference today, or credits it to the next bill for a cheaper plan, and the switch happens only once paid; the cap keeps any room the owner added above the old price, and a plan without a phone line (phone_line false) stops call answering and gives back the number Latchbell provided (released_number; phone.included says whether there is one): tell the owner first. Without a plan named, a paid plan gets the Stripe billing portal link.",
