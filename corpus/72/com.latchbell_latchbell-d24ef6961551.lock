      "tools": [
        {
          "name": "activate_phone_number",
          "title": "Activate my chosen number",
          "description": "Owners only (needs sign-in): Only after the owner explicitly approves this exact number and has an active receptionist plan. Use a number from phone_numbers. Activation can remain pending with the carrier; Say active only when phone.status is active and routing_ready is true; connecting means the number is secured but receptionist routing is not ready. Retry receptionist_refresh without ordering again. Another number is allowed only when can_choose_another_number is true, after a fresh carrier check confirms the previous new-number order failed. Pending, uncertain, ported and routing-incomplete lines must not be replaced.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mode": {
                "enum": ["new", "forward"],
                "type": "string"
              },
              "number": {
                "maxLength": 30,
                "type": "string"
              },
              "owner_approved": {
                "type": "boolean"
              }
            },
            "required": ["mode", "number", "owner_approved"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:719686a988a05c8bc9c4e823784cf92518d2aa50f4bd6abf966e85e19ed50071"
        },
        {
          "name": "add_booking",
          "title": "Add a booking",
          "description": "Owners only (needs sign-in): Add a booking from a call, a walk-in or anywhere else. selections are from catalog. Any time works with any_time; otherwise it must be open. A customer with no phone or email is fine.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "maxLength": 300,
                "type": "string"
              },
              "any_time": {
                "type": "boolean"
              },
              "customer_email": {
                "maxLength": 200,
                "type": "string"
              },
              "customer_name": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "customer_phone": {
                "maxLength": 30,
                "type": "string"
              },
              "lead_id": {
                "type": "string"
              },
              "note": {
                "maxLength": 500,
                "type": "string"
              },
              "selections": {
                "items": {
                  "properties": {
                    "fields": {
                      "additionalProperties": {
                        "maxLength": 500,
                        "type": "string"
                      },
                      "propertyNames": {
                        "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "item_id": {
                      "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                      "type": "string"
                    },
                    "options": {
                      "additionalProperties": {
                        "items": {
                          "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      },
                      "propertyNames": {
                        "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "quantity": {
                      "maximum": 999,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["item_id"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "start": {
                "type": "string"
              },
              "who": {
                "maxLength": 80,
                "type": "string"
              },
              "zip": {
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["customer_name", "selections", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e9574fc19ace26c99a530f27bbf792ece5c3d1cba71872e59c785d2428aa2c99"
        },
        {
          "name": "add_receptionist_source",
          "title": "Add to my AI receptionist",
          "description": "Owners only (needs sign-in): Add one source the business's AI receptionist learns from: a photo or PDF of a price sheet, flyer or service list (file_url: a public https link to the image or PDF, or file_base64 with file_type; over REST, POST the file itself as the request body with its Content-Type and file_name in the query, up to 10 MB), a link (url: a site's home page brings in that whole site, any other page such as a Thumbtack, Yelp or Google listing is read on its own), or a note in the owner's words (note). Latchbell reads it in the background and rebuilds the business brief, which goes live by itself: everything shared is public, so leave out anything private. Pass exactly one of note, url, file_url or file_base64.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "file_base64": {
                "maxLength": 14000000,
                "type": "string"
              },
              "file_name": {
                "maxLength": 120,
                "type": "string"
              },
              "file_type": {
                "enum": ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "application/pdf"],
                "type": "string"
              },
              "file_url": {
                "description": "Public https link to a photo (PNG, JPEG, WebP, HEIC) or PDF, up to 10 MB",
                "maxLength": 2000,
                "type": "string"
              },
              "note": {
                "description": "Text in the owner's own words",
                "maxLength": 8000,
                "type": "string"
              },
              "title": {
                "description": "Short name, e.g. Holiday hours",
                "maxLength": 120,
                "type": "string"
              },
              "url": {
                "description": "A link: the business's website (its home page brings in the whole site) or a listing such as Thumbtack, Yelp or Google",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7eaad2a6dbef606258a1106ae4cc0769fe74a6937ba33b6bf54ff6c01ddf6404"
        },
        {
          "name": "approve_own_change",
          "title": "Approve a held change to my own business",
          "description": "Owners only (needs sign-in): Only for a business an AI agent signed up itself with register_business, using the key it got from confirm_business_email: that agent is the owner, so it decides changes Latchbell held for the owner’s OK (approval_id from the held answer, or pending_approvals in front_desk). Check the change is what you mean first. Any other assistant is refused: the owner decides in the Latchbell app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approval_id": {
                "maxLength": 40,
                "type": "string"
              },
              "approve": {
                "type": "boolean"
              }
            },
            "required": ["approval_id", "approve"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7a8c5ecbc465499ba6d334fccc3db78ad37ca76cacecd91315acc5816ec66ec0"
        },
        {
          "name": "ask_business",
          "title": "Ask a business",
          "description": "Ask a business something, or send it a request, and read its answer. To start, pass business (its id or slug) and message, with customer_name if the customer gave one; no account is needed. Keep the returned inquiry_id and reply_token private: pass both with a message to continue, or without one to read the replies. Send only what the customer asks you to. This is a conversation, not a confirmed booking, order or payment. Prices and open times Latchbell returned are firm: never use this to haggle. Neither side sees the other's email or phone until a booking. A business signed in to Latchbell can use it to message another business.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "customer_name": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "inquiry_id": {
                "maxLength": 60,
                "type": "string"
              },
              "message": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "reply_token": {
                "maxLength": 100,
                "type": "string"
              },
              "selections": {
                "description": "What the user is asking about, from their search or catalog",
                "items": {
                  "properties": {
                    "fields": {
                      "additionalProperties": {
                        "maxLength": 500,
                        "type": "string"
                      },
                      "propertyNames": {
                        "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "item_id": {
                      "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                      "type": "string"
                    },
                    "options": {
                      "additionalProperties": {
                        "items": {
                          "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array"
                      },
                      "propertyNames": {
                        "pattern": "^[a-zA-Z0-9_-]{1,64}$",
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "quantity": {
                      "maximum": 999,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["item_id"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "zip": {
                "description": "The user's ZIP, if known",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
