        {
          "name": "identity_matrix",
          "title": "Pairwise identity matrix",
          "description": "Percent identity between every pair in a multiple alignment. Takes ALIGNED sequences — the output of multiple_sequence_alignment — because inferring an alignment here would bury the aligner's parameters inside a number that reads as a property of the sequences. Two percentages come back per pair: over columns where both have a residue (the usual figure), and over all columns including gaps. The gap between them is the warning — two sequences overlapping in 50 of 2,000 columns read 100% by the first measure and 2.5% by the second.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "caseSensitive": {
                "default": false,
                "description": "Treat upper and lower case as different residues. Off by default — soft-masking is not a mismatch.",
                "type": "boolean"
              },
              "sequences": {
                "description": "Aligned FASTA (gaps as \"-\"), or an array of {id, sequence}. All rows must be the same length. Max 200 sequences.",
                "type": "string"
              }
            },
            "required": ["sequences"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
