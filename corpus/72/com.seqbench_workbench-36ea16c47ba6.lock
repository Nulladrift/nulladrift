        {
          "name": "primer_site_accessibility",
          "title": "Is the template folded over my primer site?",
          "description": "Fold the template around each place a primer binds, at the annealing temperature and under DNA parameters, and report how much of the primer's own footprint sits inside a helix. Primer design tools score the oligo — its Tm, its hairpin, its dimers — and leave the template unexamined, while a binding site buried in a stable stem is an ordinary reason a well-designed primer does not amplify. Returns the folded window, its free energy, the paired fraction of the footprint, and how many of the 3'-terminal five bases are paired.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annealingTemp": {
                "default": 60,
                "description": "The annealing temperature in Celsius. This is the whole reason the tool exists — structure at 37 C is not structure at 60 C, and the number changes the answer.",
                "maximum": 95,
                "minimum": 20,
                "type": "number"
              },
              "circular": {
                "default": false,
                "description": "Wrap the window across the origin instead of clipping it.",
                "type": "boolean"
              },
              "maxMismatches": {
                "description": "Mismatches allowed when locating the primer. Defaults to the binding scanner's own rate.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "primer": {
                "description": "The primer, 5'->3'.",
                "type": "string"
              },
              "template": {
                "description": "The template the primer has to bind — the region of interest, a plasmid, or an amplicon.",
                "type": "string"
              },
              "windowNt": {
                "default": 120,
                "description": "Template to fold around each site, centred on the footprint. 40-200 nt.",
                "maximum": 200,
                "minimum": 40,
                "type": "number"
              }
            },
            "required": ["primer", "template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
