        {
          "name": "multiplex_panel_design",
          "title": "Multiplex PCR panel design",
          "description": "Choose one primer pair per target so the whole panel works in one tube: no cross-dimer between any two of the primers, every amplicon resolvable from every other on the gel you will run, and one annealing temperature that serves all of them. Searches combinations rather than picking each target's best pair in isolation, which is what makes panels fail — and when no compatible panel exists it names the target pairs that cannot be multiplexed at all, so you know which one to redesign.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agarosePercent": {
                "description": "Gel the panel will be read on. Omit and the percentage whose resolving window contains the amplicons is chosen and reported — a panel of small products judged on a 1% gel reads as all-comigrating, which is about the gel rather than the primers.",
                "type": "number"
              },
              "ampliconMax": {
                "description": "Panel-wide default product size ceiling.",
                "type": "number"
              },
              "ampliconMin": {
                "description": "Panel-wide default product size floor, for targets that set none.",
                "type": "number"
              },
              "candidatesPerTarget": {
                "default": 4,
                "description": "Candidate pairs considered per target (max 6). More finds a panel where fewer cannot, at the cost of a larger search.",
                "type": "number"
              },
              "dimerThresholdDG": {
                "default": -6,
                "description": "ΔG (kcal/mol) at or below which a cross-dimer involving a primer's 3' END is a conflict. That end is where extension starts, so it matters at a weaker ΔG than an internal pairing.",
                "type": "number"
              },
              "internalDimerThresholdDG": {
                "default": -9,
                "description": "The looser bar for a cross-dimer that pairs internally and only sequesters primer.",
                "type": "number"
              },
              "maxTmSpread": {
                "default": 3,
                "description": "Widest Tm difference tolerated across every primer in the panel, in °C — one annealing temperature has to serve all of them.",
                "type": "number"
              },
              "targets": {
                "description": "2-8 targets to amplify in one reaction.",
                "items": {
                  "properties": {
                    "ampliconMax": {
                      "description": "Largest product for this target.",
                      "type": "number"
                    },
                    "ampliconMin": {
                      "description": "Smallest product for THIS target. Giving each target its own size band is how a panel is made readable — leaving them all on one range makes comigration the dominant conflict.",
                      "type": "number"
                    },
                    "label": {
                      "description": "Name for this target, used throughout the result.",
                      "type": "string"
                    },
                    "targetEnd": {
                      "description": "1-based inclusive end of that region.",
                      "type": "number"
                    },
                    "targetStart": {
                      "description": "1-based start of the region the product must span.",
                      "type": "number"
                    },
                    "template": {
                      "description": "Template sequence, raw or FASTA.",
                      "type": "string"
                    }
                  },
                  "required": ["template"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["targets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
