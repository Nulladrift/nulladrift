        {
          "name": "golden_gate_from_parts",
          "title": "Golden Gate from part plasmids",
          "description": "Golden Gate as the reaction runs: digest pre-domesticated part plasmids with a Type IIS enzyme and assemble them in the order their OVERHANGS dictate. The fragment released from each part is the one carrying no recognition site (the site goes out with the backbone, which is why a mis-ordered assembly is not re-cut), and the assembly order is an OUTPUT — a set whose overhangs do not close into a single cycle has no product, and the reason is the answer. Distinct from cloning_simulate's `goldengate` method, which does the other job: designing the primers that ADD the sites to BARE parts, assembled in the order you list them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "enzyme": {
                "default": "BsaI",
                "description": "Type IIS enzyme (BsaI, BsmBI, BbsI, SapI). NEB's variant names (BsaI-HFv2, BbsI-HF, BsmBI) fold to the parent enzyme; any other name is rejected rather than substituted, since site, spacer and overhang length are all enzyme-specific.",
                "enum": ["BsaI", "BsmBI", "BbsI", "SapI"],
                "type": "string"
              },
              "parts": {
                "description": "The part plasmids: [{ name, sequence, circular }]. Each needs two Type IIS sites facing INWARDS at the part. `circular` defaults to true, which is what a level-0 part plasmid is. 2-24 parts, each at most 30,000 bp and 200,000 bp in total.",
                "items": {
                  "type": "object"
                },
                "maxItems": 24,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["parts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Golden Gate from part plasmids"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51feab69211f5019f27a95aa4de347191d1eb159d0043ff20f0e451ef86196b6"
        },
        {
          "name": "golden_gate_library",
          "title": "Golden Gate combinatorial library",
          "description": "Every combination of interchangeable part plasmids, assembled. Give the alternatives at each position — three promoters, four coding sequences, two terminators, one backbone — and it builds all twenty-four, reporting which close into a plasmid, which do not and why, and whether two combinations built the same molecule (nearly always one part under two names, which makes the library smaller than it looks). Interchangeability is MEASURED rather than taken from a kit table: parts are alternatives at a position when the enzyme releases the same overhang pair from each, which is true of a published standard and of your own, and cannot disagree with the plasmid in the tube. Past 500 combinations it refuses with the number rather than building the first few.",
