        },
        {
          "name": "golden_gate_design",
          "title": "Golden Gate overhang set designer",
          "description": "CHOOSE a set of 4-base Golden Gate/MoClo junction overhangs, rather than scoring one you already have. Maximizes the fidelity of the set's WEAKEST junction against the same published T4-ligase ligation data golden_gate_fidelity scores with, subject to every member actually ligating well — an overhang can score a perfect ratio simply because nothing was ever measured cross-reacting with it, and 94% of the ligation matrix is zeros. Pin the overhangs your vector already commits you to with `fixed`, forbid others with `forbidden`, and give `junctions` when the junctions sit at real positions in real sequence and may only slide a few bases. Reports whether the search was exhaustive (provably the best available) or budget-limited (the best found).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many junctions the assembly has, INCLUDING any given in `fixed`.",
                "maximum": 40,
                "minimum": 2,
                "type": "integer"
              },
              "dataset": {
                "default": "generic-t4-37c-1h",
                "description": "Which real ligation dataset to optimize against.",
                "enum": ["generic-t4-37c-1h", "bsai-hfv2"],
                "type": "string"
              },
              "fixed": {
                "description": "Overhangs that must appear — typically the ones the destination vector already commits you to. Scored like any other member; simply not swappable.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "forbidden": {
                "description": "Overhangs the design may not use, whatever they score.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "junctions": {
                "description": "One entry per junction still to be chosen, as {sequence, position, slide}: the construct sequence, the 1-based first base of the preferred overhang, and how many bases either side the junction may move. Use this instead of a free design when the junctions are real places in real DNA — the candidates then come from bases that actually exist. Length must equal count minus fixed.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "minCorrectSignal": {
                "description": "Reject any overhang whose own correct-join signal is below this. Defaults to the chosen dataset's MEDIAN diagonal (2,694 for generic T4, 520 for BsaI-HFv2 — they differ five-fold, which is why this is derived rather than fixed). Set 0 to allow every overhang.",
                "type": "number"
              }
            },
            "required": ["count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Golden Gate overhang set designer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba8dc9603796c90349fe4b9b3d36ef44828a2ebad6d320fcd86f5caaf3647cae"
        },
        {
          "name": "golden_gate_fidelity",
          "title": "Golden Gate overhang fidelity",
          "description": "Score a candidate set of 4-base Golden Gate/MoClo junction overhangs against real published T4-ligase ligation-count data: per-overhang specificity, the weakest link in the set, and any risky cross-reacting pairs. Optionally compare against a named published overhang set. This is SeqBench's own transparent scoring methodology — it does not reproduce NEB's/Potapov's own published aggregate fidelity percentages for named sets (their exact formula isn't disclosed anywhere accessible).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compareToNamedSet": {
                "description": "Also score this published reference set (see namedSetsAvailable in the output) alongside your candidate set, for comparison.",
