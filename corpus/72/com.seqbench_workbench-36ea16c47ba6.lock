        {
          "name": "blast_submit",
          "title": "Search a sequence against GenBank (BLAST)",
          "description": "Submit a sequence to NCBI BLAST and get a request id back immediately — poll it with blast_poll. The program is inferred from the sequence (nucleotide to blastn, protein to blastp) unless you name one, and a query whose type does not match the named program is refused rather than silently returning nothing. Databases: blastn: nt, refseq_rna (default nt); blastx: nr (default nr); blastp: nr, swissprot (default nr); tblastn: nt (default nt). typeMaterial: true limits nt to sequences from type material (Entrez sequence_from_type) — what a 16S or ITS read should be identified against, since every hit is then a named species. Up to 20,000 residues per sequence. A multi-FASTA of up to 96 records is ONE search with each record reported separately (blast_poll's `queries`), never one concatenated query. Searches typically take 20-60 seconds; NCBI asks that a single search is polled no more than once a minute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "database": {
                "description": "Database to search. Omit for the program's default. blastn: nt, refseq_rna (default nt); blastx: nr (default nr); blastp: nr, swissprot (default nr); tblastn: nt (default nt).",
                "type": "string"
              },
              "evalue": {
                "description": "Report only hits at or below this expect value. NCBI's default is 10.",
                "type": "number"
              },
              "hitlistSize": {
                "default": 20,
                "description": "Most database sequences to report (1-100).",
                "type": "integer"
              },
              "megablast": {
                "default": true,
                "description": "blastn only. Megablast (the default) finds near-identical sequences and is what identifies a clone; set false for a slower search that also finds diverged ones. Left unset, a query shorter than megablast's 28-base seed runs as plain blastn, since megablast cannot seed it at all.",
                "type": "boolean"
              },
              "program": {
                "description": "BLAST program. Omit to infer from the sequence: blastn for nucleotide, blastp for protein. blastx translates a nucleotide query and searches proteins; tblastn searches translated nucleotide databases with a protein query.",
                "enum": ["blastn", "blastp", "blastx", "tblastn"],
                "type": "string"
              },
              "sequence": {
                "description": "DNA or protein to search, raw or FASTA. Up to 20,000 residues; several FASTA records are searched as separate queries in one request.",
                "type": "string"
              },
              "typeMaterial": {
                "default": false,
                "description": "Limit an nt search to sequences from type material — the strains species names are defined by. Use it to identify a 16S or ITS read: unfiltered nt ranks uncultured clones and misfiled isolates beside them.",
                "type": "boolean"
              }
            },
            "required": ["sequence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search a sequence against GenBank (BLAST)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
