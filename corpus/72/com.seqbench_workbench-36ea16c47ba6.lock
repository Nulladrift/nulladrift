        },
        {
          "name": "nonrepetitive_parts_design",
          "title": "Design new non-repetitive parts",
          "description": "Build a set of new genetic parts that match a degenerate (IUPAC) template and share more than a chosen length with nothing — not each other, not themselves, not a background sequence you supply. This is how a toolbox of promoters, RBSs, terminators or sgRNA handles is made large without making an assembly unstable. Honours a GC range and excluded motifs (restriction sites) during the search rather than filtering afterwards. Deterministic given a seed: the same inputs give the same toolbox. Returns fewer parts than asked, with a reason, when the constraints leave no room — it never invents a repetitive one to hit the count.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "background": {
                "description": "Sequences the new parts must also avoid sharing with — the host genome region, the vector, or a toolbox you already own.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bothStrands": {
                "default": true,
                "description": "Treat a stretch and its reverse complement as the same stretch.",
                "type": "boolean"
              },
              "constraint": {
                "description": "The IUPAC template every part must match, e.g. \"NNNNNNTTGACANNNNNNNNNNNNNNNNNTATAATNNNNNN\" for a sigma-70 promoter library. N is any base; fixed letters are held. Max 1,000 nt.",
                "type": "string"
              },
              "count": {
                "default": 20,
                "description": "How many parts to build (max 500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "exclude": {
                "description": "Motifs no part may contain, checked on both strands: restriction sites you clone with, a terminator you do not want. Literal ACGT only — an IUPAC code is refused rather than silently half-matched.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "gcMax": {
                "default": 100,
