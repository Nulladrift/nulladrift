                "enum": ["ecoli", "scerevisiae", "ppastoris"],
                "type": "string"
              },
              "pathLengthCm": {
                "default": 1,
                "description": "Optical path of the reading. A cuvette is 1 cm; 200 µL in a 96-well flat plate is about 0.58 cm.",
                "type": "number"
              },
              "targetOd": {
                "default": 0,
                "description": "Optional: plan a back-dilution to this OD. 0 = skip.",
