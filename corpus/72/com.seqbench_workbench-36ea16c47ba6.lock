        {
          "name": "outcome_deconvolve",
          "title": "Which product is in this tube (mixture from one Sanger read)",
          "description": "Decompose one Sanger trace into fractions over a set of candidate molecules — the intended construct, the empty backbone, a double insert, a flipped part — instead of onto a generic indel ladder. Non-negative least squares against the candidates' own sequences, so no molecule is ever assigned a negative share. Reports the R² of the fit, which is what says whether the tube holds anything outside the candidate set, and GROUPS candidates the read cannot tell apart rather than splitting their share between them. Feed it the alternatives from assembly_outcomes. PREDICTED, NOT MEASURED. Every run reports its own R²: how much of the observed per-position composition the candidate basis explains. That is a measured adequacy on YOUR trace, and a low value is a statement that the tube holds something the candidate set does not contain. No accuracy against a reference method is published for this implementation, and none is quoted. Exact recovery of synthetic mixtures is deliberately NOT offered as validation: it tests the arithmetic, not whether a real capillary trace behaves like the model. Valid for: One read, from one primer, over a set of candidate molecules that all contain that primer's site and differ from each other within the read. Fractions are reported per GROUP of candidates the read cannot tell apart, and that grouping is part of the answer. NOT valid when the read's anchor identity to a candidate is low (it does not share the primer region), nor when R² comes back low, nor for telling apart candidates that differ only outside the read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "description": "The molecules this reaction could have produced, as { id, label, sequence, circular? }. Between 2 and 24; assembly_outcomes' intended plus alternatives is the intended source.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "readBases": {
                "description": "Base calls of the read, e.g. from parse_sanger_trace.",
                "residues": "nt",
                "type": "string"
              },
              "readChannels": {
                "description": "Per-base [A, C, G, T] intensities, one row per called base, read at that base's peak location.",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "type": "array"
                },
                "type": "array"
              }
            },
            "required": ["candidates", "readBases", "readChannels"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which product is in this tube (mixture from one Sanger read)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
