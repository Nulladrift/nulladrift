        {
          "name": "crispr_offtarget_check",
          "title": "CRISPR guide off-target check",
          "description": "Screen a guide's protospacer for off-target sites (protospacer match + valid PAM, both strands) against a small curated set of common lab reference genomes (see genomesChecked) — NOT a whole human/mouse genome search. For SpCas9 with a 20 nt spacer each site also gets a Doench 2016 CFD score, so sites are ranked by predicted cut likelihood rather than by mismatch count alone, and the guide gets an aggregate specificity. Use this the same way primer_specificity is used: a useful sanity check within the covered organisms, not a clearance guarantee for a mammalian expression host. PREDICTED, NOT MEASURED. Best of the common off-target scores on the authors' GUIDE-Seq comparison, at Pearson r = 0.40 over 9 guides and 402 sites (vs CCTop 0.31, Hsu-Zhang 0.26) — a useful ranking, not a reliable magnitude. Weights were measured for SINGLE mismatches; multiple mismatches are multiplied, and Listgarten et al. 2018 note the training data never contained a mismatch and an alternative PAM together, so that combination is extrapolation. Valid for: SpCas9 with a 20 nt spacer, which is the only case scored — every other nuclease returns null rather than a number from the wrong enzyme's table. One locus, one cell line. Substitutions only: DNA/RNA bulges are neither searched nor scorable, and a low score is not a claim that a site is safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxMismatches": {
                "default": 2,
                "description": "Mismatches tolerated between the protospacer and a candidate genomic site. Max 4 — a complete search seeds on maxMismatches+1 non-overlapping blocks, and past that the blocks are too short to be selective against a multi-Mb genome (a site that mismatched more would not be cut anyway).",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "nuclease": {
                "default": "spcas9",
                "description": "Nuclease id — determines the PAM pattern/side required at each candidate site.",
                "enum": ["spcas9", "spcas9ng", "sacas9", "cas12a"],
                "type": "string"
              },
              "protospacer": {
                "description": "The guide's protospacer sequence, 5'→3' (no PAM). Max 32 nt — every supported nuclease uses a 20–23 nt guide.",
                "maxLength": 32,
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["protospacer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CRISPR guide off-target check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e55ad366da6852f9a69cfc18dcfd6c6fb4bedf33947914ad2623532b935ac508"
        },
        {
          "name": "crispr_ontarget",
          "title": "CRISPR on-target activity (Rule Set 3)",
          "description": "Score SpCas9 guides for on-target activity with Rule Set 3 (DeWeirdt et al., Nat Commun 2022) — the current successor to the Doench 2014 and CRISPRscan scores crispr_grna_design reports. Give a target sequence to find and score every NGG guide in it — on both strands unless `searchReverseStrand` says otherwise — or give 30-mer contexts directly. The tracrRNA MATTERS and is not cosmetic: Rule Set 3 models it as a feature, and the paper measures its accuracy dropping when the wrong one is specified. Returns a z-scored activity, which ranks guides against each other; it is not a percentage and not a probability of editing. PREDICTED, NOT MEASURED. Held out six datasets (23,629 context sequences) from training; Rule Set 3 (Sequence) had the highest Spearman correlation on three of the six. On a separate tiling library generated for the paper, with every spacer any model had seen removed, it significantly outperformed all other models (p < 0.002) when the correct tracrRNA was given. Calibration on that independent set: of the lowest-scoring guides, 87.7% / 74.9% / 82.0% landed in the bottom two activity quintiles (Hsu / Chen / DeWeirdt tracrRNA), and of the highest-scoring, 77.0% / 69.0% / 75.5% landed in the top two. No single held-out Spearman is quoted here because the paper reports it per gene as a distribution rather than as one figure, and inventing a headline number from a figure would be the fit-residual mistake in a different costume. Valid for: SpCas9 with an NGG PAM and a 20 nt spacer, scored over a 30-mer (4 nt upstream + spacer + PAM + 3 nt downstream) — nothing is padded, so a guide without that flank is skipped rather than estimated. Knockout activity in mammalian pooled screens with a U6/Pol III promoter; the authors expect it to generalize less well to Pol II-transcribed sgRNAs, and in vitro transcribed sgRNAs (as used in zebrafish) are known to be poorly predicted by models trained this way. The tracrRNA must be the one you will actually use. This is Rule Set 3 (Sequence) only: the Sequence+Target model, which adds 6.7% to the Spearman correlation on average, needs per-gene conservation and protein-domain lookups and is not implemented here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contexts": {
                "description": "30-mer contexts to score directly: 4 nt upstream + 20 nt spacer + PAM + 3 nt downstream. Give this OR `sequence`.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "searchReverseStrand": {
                "default": true,
                "description": "Also scan the reverse strand for guides. Applies to `sequence` only; a 30-mer in `contexts` is already written on its own guide's strand.",
                "type": "boolean"
              },
              "sequence": {
                "description": "Target DNA to find NGG guides in. Give this OR `contexts`.",
                "residues": "nt",
                "type": "string"
              },
              "tracr": {
                "default": "Hsu2013",
                "description": "Which tracrRNA the guides will be paired with. Hsu2013 is the one in lentiCRISPRv2 and most published libraries; Chen2013 is the sgRNA(F+E) scaffold used by the Sanger/Yusa libraries. If you use the DeWeirdt (2020) tracrRNA, the paper reports Chen2013 as the better proxy — there is no DeWeirdt option in the model itself.",
                "enum": ["Hsu2013", "Chen2013"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "CRISPR on-target activity (Rule Set 3)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
