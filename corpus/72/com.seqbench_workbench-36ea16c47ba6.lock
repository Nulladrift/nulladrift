        {
          "name": "rbs_design",
          "title": "Design a ribosome binding site (OSTIR)",
          "description": "Design a 5' UTR / ribosome binding site for a given CDS. Generates a spread of Shine-Dalgarno cores and SD-to-start spacings, scores every one with OSTIR in the context of your own CDS (which matters — the rate depends on how the RBS interacts with that CDS's 5' folding), and returns them ranked. Supply targetExpression to rank by closeness to a target rate instead of by maximum strength, and supply your existing 5' UTR to get a measured baseline and fold-change for each candidate. Runs ViennaRNA on a shared service and is therefore rate limited (see 429/503). PREDICTED, NOT MEASURED (Spearman ρ = 0.39 on two 5' UTR datasets it was not fitted to). Spearman ρ = 0.39 against measured expression on two 5' UTR datasets it was not fitted to (Gilliot & Gorochowski, Nucleic Acids Res 2024;52(13):e58); reproduced in this repo at ρ = 0.509 on an independent leave-one-context-out split over 194,636 measurements, and at a mean ρ = 0.62 over fifteen further measurement systems it was not fitted to — six species, four reporters, three readouts — on which every learned model tried here scored BELOW it (scripts/rbs-eval) — above the published figure because 65,841 rows of that compilation record no measurement at all (fluorescence mean and s.d. both exactly 0) and are excluded here rather than scored as the weakest expression observed. The widely quoted 53% within 2-fold / 91% within 10-fold are calibration residuals on the fitting set, not held-out validation. Valid for: translation INITIATION only, in E. coli-like Gram-negative hosts (the model is parameterized on the E. coli anti-Shine-Dalgarno sequence). Rankings within one construct context; the absolute value has no units and no meaning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "antiShineDalgarno": {
                "description": "Optional anti-Shine-Dalgarno sequence (the 16S rRNA 3' end) to model a non-E. coli host. Omit to use OSTIR's own E. coli default.",
                "type": "string"
              },
              "cds": {
                "description": "Coding sequence, raw or FASTA, starting at its start codon. Only the 5' end affects the prediction, so the first ~90 nt is enough. A, C, G, T/U only. Max 10,000 nt.",
                "type": "string"
              },
              "currentUtr": {
                "description": "Optional: your existing 5' UTR (everything upstream of the start codon). Scored as a baseline so each candidate gets a fold-change against it.",
                "type": "string"
              },
              "leader": {
                "description": "Optional 5' context upstream of the designed RBS — the transcribed leader from your promoter. Affects the standby-site term. Defaults to a 20 nt unstructured poly-A leader.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many ranked candidates to return. 1-60.",
                "type": "number"
              },
              "targetExpression": {
                "description": "Optional target rate on OSTIR's arbitrary scale. Candidates are then ranked by closeness to it (log-ratio) rather than by maximum strength. Only meaningful against a number produced by this same tool.",
                "type": "number"
              }
            },
            "required": ["cds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Design a ribosome binding site (OSTIR)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fe27ecafd9218a55c4e950be94a20188ff1918bad70fff88951904cdaeb3e977"
        },
        {
          "name": "rbs_library_design",
          "title": "Design an RBS library spanning a range of translation rates",
          "description": "Build a ladder of ribosome binding sites whose predicted translation initiation rates are evenly spread, in log space, across a range you choose — the standard way to titrate one enzyme's level in a pathway without guessing. Scores every SD-core/spacing/spacer-composition combination with OSTIR in your own CDS context, then picks one variant per rung. Rungs it cannot fill are reported as GAPS rather than filled with the nearest available variant, so a library that does not really span the range says so. PREDICTED, NOT MEASURED: the ordering comes from a model with ρ ≈ 0.39 against measured expression, which is what makes it usable for ranking a library you will screen and unusable for hitting an absolute number. PREDICTED, NOT MEASURED (Spearman ρ = 0.39 on two 5' UTR datasets it was not fitted to). Spearman ρ = 0.39 against measured expression on two 5' UTR datasets it was not fitted to (Gilliot & Gorochowski, Nucleic Acids Res 2024;52(13):e58); reproduced in this repo at ρ = 0.509 on an independent leave-one-context-out split over 194,636 measurements, and at a mean ρ = 0.62 over fifteen further measurement systems it was not fitted to — six species, four reporters, three readouts — on which every learned model tried here scored BELOW it (scripts/rbs-eval) — above the published figure because 65,841 rows of that compilation record no measurement at all (fluorescence mean and s.d. both exactly 0) and are excluded here rather than scored as the weakest expression observed. The widely quoted 53% within 2-fold / 91% within 10-fold are calibration residuals on the fitting set, not held-out validation. Valid for: translation INITIATION only, in E. coli-like Gram-negative hosts (the model is parameterized on the E. coli anti-Shine-Dalgarno sequence). Rankings within one construct context; the absolute value has no units and no meaning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "antiShineDalgarno": {
                "description": "Override the host's anti-Shine-Dalgarno sequence. Defaults to the E. coli one OSTIR is parameterised on.",
                "type": "string"
              },
              "cds": {
                "description": "The coding sequence, raw or FASTA, starting at its start codon. Only the 5' end affects the prediction, so the first ~90 nt is enough. Max 10,000 nt.",
                "residues": "nt",
                "type": "string"
              },
              "leader": {
                "description": "Sequence upstream of the RBS (the 5' end of the transcript). OSTIR needs some 5' context for its standby-site term; a 20 nt A-rich leader is assumed when none is given, which is an assumption and not a measurement.",
                "type": "string"
              },
              "librarySize": {
                "default": 8,
                "description": "How many variants the ladder should have (default 8).",
                "maximum": 24,
                "minimum": 2,
                "type": "integer"
              },
              "targetMax": {
                "description": "Strongest rung, in the same arbitrary units. Omit with targetMin to use the candidates' own range.",
                "type": "number"
              },
              "targetMin": {
                "description": "Weakest rung, in OSTIR's arbitrary units. OMIT THIS and the range is taken from what the candidates actually reach in your CDS context, which is usually what you want: the units have no absolute meaning, so a number carried over from a paper or a default describes nothing. Set it only when you are matching a value you measured yourself in the same context.",
                "type": "number"
              }
            },
            "required": ["cds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Design an RBS library spanning a range of translation rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db6882b30f3d0279a09a3dd43c98b743312042ae02c5ab76405aff20401d2093"
        },
        {
          "name": "rbs_occlusion",
          "title": "What can base-pair over the ribosome binding site",
          "description": "Find every stretch of a transcript that is reverse-complementary to the ribosome's footprint (-20 to +13 around the start codon), with the length and nearest-neighbour Tm of each duplex, and flag the ones that cover the Shine-Dalgarno core or the start codon. This is the mechanism every translational switch runs on — riboswitch, toehold switch, RNA thermometer, antisense repressor — and the first thing to look at when a switch does not switch or a construct is unexpectedly silent. Also reports where a sensor domain can be inserted without touching the site. Deterministic base-pairing, not a folding prediction: use rna_fold to ask whether a given stem actually wins at 37 °C. Reports no switching ratio — see this tool's notes for why.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxLoop": {
                "default": 100,
                "description": "Largest number of unpaired bases allowed between an arm and its target (default 100).",
                "minimum": 3,
                "type": "integer"
              },
              "minStem": {
                "default": 6,
                "description": "Shortest duplex to report, in bp (default 6). Below 4 bp every sequence pairs with everything; a stem that actually holds a site shut is usually 8 bp or more.",
                "maximum": 40,
                "minimum": 4,
                "type": "integer"
              },
              "sequence": {
                "description": "The transcript: the 5' UTR plus at least the start of the CDS. DNA or RNA. Max 20,000 nt.",
                "residues": "nt",
                "type": "string"
              },
              "startCodonAt": {
                "description": "1-based position of the start codon to anchor the footprint on. Omit to use the first ATG/GTG/TTG — pass it when the transcript has several, which is the usual case for a real 5' UTR.",
                "type": "integer"
              }
            },
            "required": ["sequence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What can base-pair over the ribosome binding site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
