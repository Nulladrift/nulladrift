        {
          "name": "oligo_cofold",
          "title": "Oligo cofold (ΔG)",
          "description": "Minimum-free-energy structure and ΔG for one oligo (hairpin) or two oligos together (homo/heterodimer), using ViennaRNA's published loop model at a temperature you choose — DNA parameters (Mathews 2004) by default, RNA (Turner 2004) on request. Reports each strand alone, the duplex, and the interaction ΔG the two gain by pairing with each other rather than folding alone, which is the number a primer-dimer screen wants. Unlike oligo_analysis's fast stack-sum screen this is a full loop model with bulge, internal-loop and dangling-end terms; the two are on different parameter sets and must not be compared. PREDICTED, NOT MEASURED. No skill statistic is claimed for predicting whether a PCR fails. Loop-model MFE folding reproduces measured structure well for short duplexes and progressively worse with length; the ΔG itself carries roughly kcal/mol-scale uncertainty and the MFE structure is one structure out of an ensemble — request `partition` for the ensemble free energy, which is the more honest single number when several structures compete. Valid for: short oligos, at most 200 nt per strand, at the temperature given. It models two strands in isolation at no particular concentration: it does not know your primer concentration, salt, or cycling program, so it cannot say whether a dimer will actually form in your tube.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "First oligo, 5'→3'. Max 200 nt.",
                "maxLength": 800,
                "type": "string"
              },
              "alphabet": {
                "default": "dna",
                "description": "Which measured parameter set to use. This is not cosmetic — the same 20-mer can differ by several kcal/mol between them.",
                "enum": ["dna", "rna"],
                "type": "string"
              },
              "b": {
                "description": "Second oligo. Omit to analyze hairpin structure in 'a' alone; pass the same sequence as 'a' for a homodimer.",
                "maxLength": 800,
                "type": "string"
              },
              "partition": {
                "default": false,
                "description": "Also compute the ensemble free energy over all structures, not just the MFE one. Costs a second pass.",
                "type": "boolean"
              },
              "temperature": {
                "default": 37,
                "description": "°C. Primer dimers matter at the annealing temperature, not at 37 °C.",
                "maximum": 120,
                "minimum": -20,
                "type": "number"
              }
            },
            "required": ["a"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Oligo cofold (ΔG)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a301d3edad61d73b058d741eca91acb118fde2f870930c338b872410d54096db"
        },
        {
          "name": "oligo_pool_screen",
          "title": "Oligo pool cross-dimer screen",
          "description": "Screen a whole set of oligos you already have — every pair for cross-dimers, every oligo for its own hairpin and self-dimer, and the set for duplicates and Tm spread — and get back the conflicts ranked rather than a table of every combination. This is the pool-level answer cross_dimer gives one pair at a time: 51 primers is 1,275 pairs, which is 1,275 separate calls done by hand and one call done here. Not to be confused with multiplex_panel_design, which DESIGNS primers from templates; this takes the primers you have already ordered. A pairing that involves an oligo's 3' END is judged at a weaker ΔG than one that only pairs internally, because that end is where extension starts — the same two-bar rule the multiplex panel designer uses. Every number is a nearest-neighbor calculation over the sequences supplied, not a prediction of what the reaction will do.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dntpMM": {
                "default": 0.2,
                "description": "Total [dNTP] (mM), chelates Mg2+.",
                "type": "number"
              },
              "fasta": {
                "description": "The pool as a FASTA paste (headers become the names), or as one sequence per line — which is what comes out of a spreadsheet column. An alternative to `oligos`.",
                "residues": "nt",
                "type": "string"
              },
              "internalThresholdDG": {
                "default": -9,
                "description": "The looser bar for a pairing that only sequesters primer internally, away from either 3' end.",
                "type": "number"
              },
              "maxConflicts": {
                "default": 200,
                "description": "Conflict rows returned, most stable first. The COUNTS are always complete.",
                "type": "integer"
              },
              "mgMM": {
                "default": 1.5,
                "description": "Divalent cation [Mg2+] (mM).",
                "type": "number"
              },
              "naMM": {
                "default": 50,
                "description": "Monovalent cation [Na+]/[K+] (mM).",
                "type": "number"
              },
              "oligoNM": {
                "default": 250,
                "description": "Total strand concentration (nM).",
                "type": "number"
              },
              "oligos": {
                "description": "The pool, as objects with a name and a sequence. Up to 384. Use this or `fasta`, not both.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "Label used throughout the result. Defaults to oligo_1, oligo_2, …",
                      "type": "string"
                    },
                    "sequence": {
                      "description": "The oligo, 5'→3'.",
                      "type": "string"
                    }
                  },
                  "required": ["sequence"],
                  "type": "object"
                },
                "type": "array"
              },
              "threePrimeThresholdDG": {
                "default": -6,
                "description": "ΔG (kcal/mol) at or below which a pairing that involves a 3' END counts as a conflict.",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Oligo pool cross-dimer screen"
          },
          "behavior": {
            "destructive": false,
