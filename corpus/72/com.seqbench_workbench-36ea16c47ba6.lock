        },
        {
          "name": "operon_scan",
          "title": "Find unwanted regulatory elements in a construct",
          "description": "Scan a multi-gene construct, on both strands, for the sequence that quietly breaks operons: promoter-like -35/-10 pairs (including ones pointing backwards, which make antisense RNA), Shine-Dalgarno sequences positioned in front of an internal start codon, terminator-shaped hairpins with a U-tract, out-of-frame start codons inside a declared CDS, and exact direct repeats. Reports what MATCHED and how far it sits from consensus — it does not score a match or claim it transcribes. For an estimated promoter strength use promoter_predict; for a translation rate use rbs_predict.",
          "inputSchema": {
