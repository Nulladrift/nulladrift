        },
        {
          "name": "cloning_diagnose",
          "title": "Cloning failure diagnosis (ranked causes from design + observation)",
          "description": "Work out why a cloning experiment failed: no colonies, every clone empty vector, or no PCR band. Takes your design (method, parts, enzymes, primers, host methylation state) plus what you actually observed (colony counts on the plate and on each control, screening tally, band sizes, whether the ladder ran) and returns causes ranked by evidence — each with the deterministic fact from the design or the observation that implicates it, the cheapest observation that would separate it from the next candidate, and the next experiment. Causes the observations eliminate are reported as eliminated, naming the observation that did it; causes the design makes impossible are not listed. No probability is computed anywhere — the ordering is of evidence, not of likelihood, and `ranking.evidenceBased` says so when the inputs separate nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agarosePercent": {
                "default": 1,
                "description": "Agarose percentage of the gel. Snapped to the nearest tabulated value; decides the resolving window a band is placed against.",
                "type": "number"
              },
              "annealingTempC": {
                "description": "Annealing temperature actually used, °C. Compared against each primer's own nearest-neighbor Tm.",
                "type": "number"
              },
              "colonies": {
                "description": "Colonies on the experimental plate. Omitting this is different from giving 0.",
                "type": "number"
              },
              "enzymes": {
                "description": "The Type IIS enzyme for Golden Gate (BsaI, BbsI, Esp3I (BsmBI)), or the one or two restriction enzymes the insert and vector were cut with. An unrecognized name is rejected rather than skipped: every methylation and site-geometry verdict here reads \"no site found\" when the enzyme is missing, so a typo would come back as a clean bill of health.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "gelBandsObservedBp": {
                "description": "Band sizes read off the lane, bp. An empty array (\"I looked and there was nothing\") is not the same as omitting the field.",
                "items": {
                  "type": "number"
                },
                "maxItems": 30,
                "type": "array"
              },
              "hostMethylation": {
                "default": "unknown",
                "description": "Dam/Dcm state of the DNA that was CUT — a property of the strain the plasmid was prepared from, not the one it was transformed into. Standard cloning strains are dam+/dcm+. \"dam_dcm_minus\" eliminates every methylation-blocking cause; \"unknown\" leaves the sequence overlap stated as a fact and the methylation as an open question.",
                "enum": ["dam_dcm_plus", "dam_dcm_minus", "unknown"],
                "type": "string"
              },
              "insertSource": {
                "description": "Where the insert came from. Only \"plasmid_pcr\" changes a verdict: a plasmid template replicates and selects on its own, so it can give colonies with no ligation at all.",
                "enum": ["plasmid_pcr", "genomic_pcr", "synthesis", "digest", "unknown"],
                "type": "string"
              },
              "ladderRan": {
                "description": "Was the ladder itself visible in the same gel? A true here eliminates the whole stain-and-imaging branch in one observation.",
                "type": "boolean"
              },
              "method": {
                "description": "How the construct was made. Decides which cause set applies and which design checks can run.",
                "enum": ["goldengate", "gibson", "restriction_ligation", "pcr"],
                "type": "string"
              },
              "noDnaControlColonies": {
                "description": "Colonies from the same cells and plate with NO DNA added. Non-zero means the plate is not selecting.",
                "type": "number"
              },
              "noInsertControlColonies": {
                "description": "Colonies from the identical reaction with the insert (or one part) left out.",
                "type": "number"
              },
              "overlapLen": {
                "default": 20,
                "description": "Gibson only — the homology arm length the assembly was designed with.",
                "type": "number"
              },
              "partNames": {
                "description": "Labels for the parts, in the same order (\"backbone\", \"promoter\", \"CDS\"). Used in every fact that names a part.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "parts": {
                "description": "Parts in assembly order (Golden Gate / Gibson), or [vector, insert] for a restriction ligation. Raw or FASTA. Up to 8; 300,000 bp total across parts and template.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "phosphataseTreated": {
                "description": "Was the cut vector dephosphorylated (rSAP/CIP) before ligation?",
                "type": "boolean"
              },
              "plateAntibiotic": {
                "description": "Antibiotic on the plate. amp and carbenicillin count as the same selection (both select bla).",
                "enum": ["amp", "ampicillin", "bla", "cam", "carb", "carbenicillin", "chlor", "chloramphenicol", "gent", "gentamicin", "hyg", "hygromycin", "kan", "kanamycin", "neo", "spec", "spectinomycin", "strep", "tet", "tetracycline", "zeo", "zeocin"],
                "type": "string"
              },
              "positiveControlColonies": {
                "description": "Colonies from an intact, uncut plasmid into the same cell aliquot. Non-zero eliminates \"the cells never took up DNA\".",
                "type": "number"
              },
              "positiveControlSameMarker": {
                "description": "Did that control plasmid carry the SAME selection marker? If not, it eliminates the cells but says nothing about the plate — the tool reports the difference.",
                "type": "boolean"
              },
              "primerForward": {
                "description": "Forward primer, up to 200 nt.",
                "residues": "nt",
                "type": "string"
              },
              "primerReverse": {
                "description": "Reverse primer, up to 200 nt.",
                "residues": "nt",
                "type": "string"
              },
              "screened": {
                "description": "Screening tally, up to 100,000 clones. The buckets must not add up to more than total — an inconsistent tally is rejected rather than reasoned over, because every verdict drawn from the screen compares a count against that total.",
                "properties": {
                  "correct": {
                    "description": "Clones that were the intended construct.",
                    "type": "number"
                  },
                  "emptyVector": {
                    "description": "Clones carrying no insert.",
                    "type": "number"
                  },
                  "originalTemplate": {
                    "description": "Clones that turned out to be the plasmid the insert was amplified from.",
                    "type": "number"
                  },
                  "rearranged": {
                    "description": "Clones that were a real plasmid but not the intended arrangement of parts.",
                    "type": "number"
                  },
                  "total": {
                    "description": "Clones screened.",
                    "type": "number"
                  }
                },
                "required": ["correct", "total"],
                "type": "object"
              },
              "symptom": {
                "description": "The complaint. \"no_colonies\" = the plate is blank; \"wrong_clones\" = colonies grew but the clones are empty vector / rearranged / the original template; \"no_pcr_band\" = the gel lane is empty or the band is the wrong size.",
                "enum": ["no_colonies", "wrong_clones", "no_pcr_band"],
                "type": "string"
              },
              "template": {
                "description": "PCR template, raw or FASTA.",
                "residues": "nt",
                "type": "string"
              },
              "templateCircular": {
                "default": false,
                "description": "Treat the template as a plasmid, so a product across the origin is found.",
                "type": "boolean"
              },
              "transformationEfficiencyCfuPerUg": {
                "description": "cfu/µg from a control transformation, where it was measured.",
                "type": "number"
              },
              "uncutVectorControlColonies": {
                "description": "Colonies from the digested but UNLIGATED vector. Measures intact vector that survived the digest, with no help from the ligase.",
                "type": "number"
              },
              "vectorMarker": {
                "description": "Selection marker on the vector. Compared against the plate's antibiotic by identity, not by guessing at free text.",
                "enum": ["amp", "ampicillin", "bla", "cam", "carb", "carbenicillin", "chlor", "chloramphenicol", "gent", "gentamicin", "hyg", "hygromycin", "kan", "kanamycin", "neo", "spec", "spectinomycin", "strep", "tet", "tetracycline", "zeo", "zeocin"],
                "type": "string"
              }
            },
            "required": ["method", "symptom"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cloning failure diagnosis (ranked causes from design + observation)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15be06266a2233011c2f2dffd19294921b83f1d19b34fd81034978a25270e5c9"
        },
