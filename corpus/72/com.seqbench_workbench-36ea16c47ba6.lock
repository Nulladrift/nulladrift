        {
          "name": "variant_annotate",
          "title": "Variant Annotator",
          "description": "One-box variant lookup against MyVariant.info: accepts an rsID, chrom:pos:ref:alt (colon- or hyphen-separated), genomic HGVS (\"chr17:g.7676154G>C\"), or transcript HGVS c. (\"NM_000546.6:c.215C>G\" / \"TP53:c.215C>G\", bridged via the hgvs_convert tool). Returns ClinVar's own classification of the variant with its review status and 0-4 stars (read live from ClinVar; a practice guideline or expert panel overrides individual submissions), a tally of the per-condition records under it, gnomAD exome/genome allele frequencies, and SIFT and AlphaMissense (CC BY 4.0) missense predictor scores, one per transcript — each section explicitly null when that source has no data, never silently omitted. The classification is the verdict; no single record is, so one Pathogenic record among nine Benign ones never becomes the headline. When ClinVar cannot be reached, classificationLookup is \"failed\" and no classification is invented. See the result's own \"caveats\" for data-freshness limits (frozen gnomAD snapshots; the per-condition records are a periodic snapshot).",
          "inputSchema": {
