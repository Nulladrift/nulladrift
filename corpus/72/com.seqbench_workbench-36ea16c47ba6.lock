        {
          "name": "sanger_plate_verify",
          "title": "Sanger plate clone verdicts",
          "description": "Judge a whole plate of Sanger reads against one construct and return one row per clone: PASS, POINT_MUTATION, INDEL, VECTOR_ONLY (the insert is absent), WRONG_INSERT (the backbone matches and the insert does not), LOW_COVERAGE, or AMBIGUOUS. Reads are grouped into clones from their FASTA/FASTQ record names (facility conventions like PlateA_A01_pXY-1_M13F, pXY-1_T7-F, 2026-08-01_pXY_clone3_R), and every read's assignment is reported with a confidence so a grouping can be corrected rather than trusted. Each clone's reads are piled up in reference coordinates, so a difference one read reports where other covering reads read the reference is reported as the sequencing error it is, not as a mutation — and a position no read covered is never PASS. Every verdict cites the positions it rests on. Give insertStart/insertEnd to have clones judged over the insert alone, which is also what VECTOR_ONLY and WRONG_INSERT need. Give the reference as an annotated GenBank record and every difference also says what it does to the feature it lands in (synonymous, missense with its p. change, nonsense, frameshift), with each clone's worst one. Whatever was not read comes back as `rereads`: per unread stretch, the primer to sequence it with — one the map carries, a universal one whose site is on the construct, or a new one designed for it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "circular": {
                "default": false,
                "description": "Treat the construct as a plasmid, so a read crossing its arbitrary linear start is aligned through the join instead of having its tail discarded.",
                "type": "boolean"
              },
              "grouping": {
                "default": "auto",
                "description": "How reads become clones. \"auto\" parses the record names; \"one-clone\" treats every read as being of one clone (use when the names carry nothing); \"per-read\" judges each read on its own.",
                "enum": ["auto", "one-clone", "per-read"],
                "type": "string"
              },
              "insertEnd": {
                "description": "1-based last base of that stretch.",
                "minimum": 1,
                "type": "integer"
              },
              "insertLabel": {
                "description": "What to call it in the verdicts. Default \"the insert\".",
                "type": "string"
              },
              "insertStart": {
                "description": "1-based first base of the stretch that has to be right (the insert). With insertEnd, every clone is judged over this span alone — the only honest framing when one 900 bp read cannot cover a 6 kb plasmid — and VECTOR_ONLY/WRONG_INSERT become reachable. May be greater than insertEnd on a circular construct, meaning the span crosses the origin.",
                "minimum": 1,
                "type": "integer"
              },
              "qualityOffset": {
                "default": 33,
                "description": "ASCII offset of the FASTQ quality string. 33 for anything modern, 64 for pre-1.8 Illumina.",
                "enum": [33, 64],
                "type": "integer"
              },
              "reads": {
                "description": "All the plate's reads as FASTA or FASTQ (auto-detected). The record name is what the clone grouping is read from. Up to 384 reads / 400,000 total bases, and (reference length x total read bases) must stay under 200,000,000 — split a 96-clone plate across calls.",
                "maxLength": 2000000,
                "type": "string"
              },
              "reference": {
                "description": "The intended construct: raw, FASTA, or a GenBank record — whose CDS features let each difference be placed in its gene, and whose primer_bind features are offered first for re-reading what was missed. Up to 20,000 bp.",
                "residues": "nt",
                "type": "string"
              },
              "trimThreshold": {
                "default": 20,
                "description": "Phred threshold for trimming both ends of a read (BWA's rule). Only applies to FASTQ input, which is the only input that carries quality.",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["reads", "reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sanger plate clone verdicts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
