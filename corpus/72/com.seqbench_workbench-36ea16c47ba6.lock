        },
        {
          "name": "sanger_indel_spectrum",
          "title": "Sanger indel spectrum (editing efficiency without NGS)",
          "description": "Quantify CRISPR editing from a pair of Sanger traces — an unedited control and the edited pool — by decomposing the edited trace onto shifted copies of the control. Returns the indel spectrum (how much of the pool carries each insertion or deletion size), the unedited fraction, and the R² of the decomposition, which is the number that says whether the model fits your traces at all. Non-negative least squares, so no allele is ever assigned a negative share. Does not work for base editing, which makes a mixed base rather than a shift. PREDICTED, NOT MEASURED. Every run reports its own R²: how much of the observed window the shifted-control basis actually explains. That is a measured adequacy of the model on YOUR traces, and a low value means the assumption is wrong here rather than that the edit is weak. On accuracy against a reference method for real samples, none is published for this implementation — the underlying decomposition is TIDE's, whose authors report their own concordance with amplicon sequencing, and that number does not transfer to this code so it is not quoted. This implementation's exact recovery of synthetic mixtures is deliberately not offered as validation either: it tests the arithmetic, not whether the model fits a real trace. Valid for: A pool of alleles that differ from one control read by simple insertions or deletions at a known cut site, where both reads come from the same amplicon and chemistry and both extend well past the cut. NOT valid for substitution-only edits — base editing produces a mixed base, not a shift, and this model cannot see it — nor for a knock-in whose insert is novel sequence rather than a frame shift of the control, nor for any run whose R² comes back low.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "controlBases": {
                "description": "Base calls of the UNEDITED control read.",
                "residues": "nt",
                "type": "string"
              },
              "controlChannels": {
                "description": "Per-base [A, C, G, T] intensities of the control read, one row per called base, read at that base's peak location (trace arrays are indexed by scan, not by base).",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "cutPosition": {
                "description": "1-based position of the expected cut, in CONTROL read coordinates.",
                "type": "number"
              },
              "editedBases": {
                "description": "Base calls of the edited pool's read.",
                "residues": "nt",
                "type": "string"
              },
              "editedChannels": {
                "description": "Per-base [A, C, G, T] intensities of the edited read, same convention.",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "guard": {
                "default": 3,
                "description": "Bases skipped immediately after the cut, where the trace is least reliable.",
                "type": "number"
              },
              "maxIndel": {
                "default": 10,
                "description": "Largest indel to include in the basis, in bp (max 20). Every shift from −maxIndel to +maxIndel is fitted.",
                "type": "number"
              },
              "offset": {
                "description": "Override the alignment offset between the reads. By default it is found from the base calls upstream of the cut, which is reported back along with the identity achieved.",
                "type": "number"
              },
              "windowLength": {
                "default": 70,
                "description": "Bases downstream of the cut used for the decomposition (20-300). Longer is better conditioned but needs more clean read.",
                "type": "number"
              }
            },
            "required": ["controlBases", "controlChannels", "cutPosition", "editedBases", "editedChannels"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sanger indel spectrum (editing efficiency without NGS)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a28cc8b52670ef79e3c503593a18813fcf7431b0caf4d90ef00d902efb1b7dfa"
        },
        {
          "name": "sanger_knockin_quant",
          "title": "Knock-in / prime-edit rate from Sanger traces",
          "description": "Measure the rate of a SPECIFIC intended edit from a pair of Sanger traces — an unedited control and the edited pool — by decomposing the edited trace onto three things at once: the wild-type allele, the intended edited allele, and the unintended indels. Serves both readouts that need this: HDR knock-in rate (what fraction of the pool carries the donor's edit, including an insert of novel sequence), and prime editing (the pegRNA's intended substitution, insertion, deletion or replacement as the intended column, and the indel byproducts at the nick as the shift columns). This is what sanger_indel_spectrum cannot do: that tool's basis is indexed by indel LENGTH, so an intended 6 bp knock-in and an accidental 6 bp NHEJ deletion are one column there. Returns knock-in / wild-type / unintended-indel percentages, the byproduct spectrum by shift, and the R² that says whether the model fits your traces at all. Non-negative least squares, so no allele is ever assigned a negative share. For a substitution or replacement the reference allele you name is checked against the control read before anything is fitted; an insertion and a deletion name no reference bases, so there only the position can be range-checked. PREDICTED, NOT MEASURED. Every run reports its own R²: how much of the observed window the basis actually explains, measured on YOUR traces, where a low value means the model is wrong here rather than that the edit is weak. On agreement with a reference method for real samples — amplicon sequencing or clonal genotyping — none is published for this implementation. The underlying decomposition is TIDE/TIDER's, whose authors report their own concordance, and that number does not transfer to this code so it is not quoted. This implementation's near-exact recovery of synthetic mixtures is deliberately not offered as validation: a synthetic mixture is built from the same idealised one-hot peaks the basis assumes, so recovering it tests the arithmetic and cannot test the assumption. Valid for: A pool whose intended edit is known EXACTLY, read against a control amplicon of the same locus and chemistry, with both reads extending well past the edit. The novel inserted bases of a knock-in carry an assumed peak shape rather than a measured one (returned as constructedPositions) — the more of the window they occupy, the more of the fit is testing that assumption. NOT valid when the reported R² is low; nor for separating an intended pure DELETION from an unintended indel of the same net length ANYWHERE in the window, not only one at the same site (the tool reports which case it is in `sameShiftByproduct`: when that column is not fitted, knockinPercent is the sum of the two); nor for telling an on-target knock-in from a random integration of the same donor; nor for resolving haplotypes, since a Sanger trace of a pool has no phase information.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "altAllele": {
                "description": "The bases the edit installs in their place (substitution and replacement).",
                "residues": "nt",
                "type": "string"
              },
              "controlBases": {
                "description": "Base calls of the UNEDITED control read.",
                "residues": "nt",
                "type": "string"
              },
              "controlChannels": {
                "description": "Per-base [A, C, G, T] intensities of the control read, one row per called base, read at that base's peak location (trace arrays are indexed by scan, not by base).",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "cutPosition": {
                "description": "1-based CONTROL position where UNINTENDED indels start — the nuclease cut or the PE nick. Defaults to the edit start. Separate from editPosition because a byproduct allele is wild-type up to the cut and shifted after it, so a wrong cut position makes those columns wrong over the first part of the window.",
                "type": "number"
              },
              "deletedLength": {
                "description": "How many bases are deleted (deletion only).",
                "type": "integer"
              },
              "editKind": {
                "description": "Shape of the intended edit, spelled as prime_editing_design spells it. \"substitution\" replaces bases one for one; \"insertion\" adds novel bases and replaces none; \"deletion\" removes bases and adds none; \"replacement\" is the general case where the two lengths differ.",
                "enum": ["substitution", "insertion", "deletion", "replacement"],
                "type": "string"
              },
              "editPosition": {
                "description": "1-based position of the edit in CONTROL read coordinates: the first base the edit replaces. An insertion replaces nothing, so there it is the base the insert lands immediately BEFORE — one MORE than the VCF/HGVS anchor, which names the base before an insertion. The rule is uniform across all four kinds on purpose; a spec transcribed from VCF needs +1 on an insertion.",
                "type": "number"
              },
              "editedBases": {
                "description": "Base calls of the edited pool's read.",
                "residues": "nt",
                "type": "string"
              },
              "editedChannels": {
                "description": "Per-base [A, C, G, T] intensities of the edited read, same convention.",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "insertedSeq": {
                "description": "The novel bases inserted (insertion only).",
                "residues": "nt",
                "type": "string"
              },
              "maxIndel": {
                "default": 10,
                "description": "Largest unintended indel to fit, in bp (1-20; out of range is rejected, not clamped). Every shift from −maxIndel to +maxIndel is included except 0, which is wild-type. The intended edit's OWN net shift is included too whenever its column is measurably different from the intended-edit column — it is dropped only when the two are the same vector, which happens for a pure deletion whose cut is at the edit. See sameShiftByproduct in the result for which of the two happened.",
                "type": "number"
              },
              "offset": {
                "description": "Override the alignment offset between the reads (whole number, −40 to 40). By default it is found from the base calls upstream of the edit. upstreamIdentity is always measured AT the offset used, so an override that is wrong shows up as a failed same-amplicon check rather than borrowing the auto-detected offset's score.",
                "type": "number"
              },
              "refAllele": {
