              },
              "mixedRatio": {
                "default": 0.35,
                "description": "A second peak at or above this fraction of the called peak counts as a mixed position. Lower it to catch a minor species, raise it if ordinary crosstalk on your instrument is firing it.",
                "maximum": 0.9,
                "minimum": 0.1,
                "type": "number"
              },
              "qualityCutoff": {
