          },
          "digest": "sha256:c394be0303dd9bc9f4962be648e895e3ca3511f08dc4d97a777fbb4577d33f73"
        },
        {
          "name": "rbs_predict",
          "title": "Predict translation initiation rate (OSTIR)",
          "description": "Predict the translation initiation rate at each start codon in a bacterial mRNA using OSTIR, the open-source continuation of the Salis lab RBS Calculator, with ViennaRNA free energies. Returns the predicted rate plus the full thermodynamic breakdown (16S rRNA:mRNA hybridization, mRNA unfolding, spacing, standby site, start-codon binding) for every start codon found. Rates are on an arbitrary scale — compare them as ratios, not as absolute expression levels. Runs ViennaRNA on a shared service and is therefore rate limited (see 429/503). PREDICTED, NOT MEASURED (Spearman ρ = 0.39 on two 5' UTR datasets it was not fitted to). Spearman ρ = 0.39 against measured expression on two 5' UTR datasets it was not fitted to (Gilliot & Gorochowski, Nucleic Acids Res 2024;52(13):e58); reproduced in this repo at ρ = 0.509 on an independent leave-one-context-out split over 194,636 measurements, and at a mean ρ = 0.62 over fifteen further measurement systems it was not fitted to — six species, four reporters, three readouts — on which every learned model tried here scored BELOW it (scripts/rbs-eval) — above the published figure because 65,841 rows of that compilation record no measurement at all (fluorescence mean and s.d. both exactly 0) and are excluded here rather than scored as the weakest expression observed. The widely quoted 53% within 2-fold / 91% within 10-fold are calibration residuals on the fitting set, not held-out validation. Valid for: translation INITIATION only, in E. coli-like Gram-negative hosts (the model is parameterized on the E. coli anti-Shine-Dalgarno sequence). Rankings within one construct context; the absolute value has no units and no meaning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "antiShineDalgarno": {
                "description": "Optional anti-Shine-Dalgarno sequence (the 16S rRNA 3' end) to model a non-E. coli host. Omit to use OSTIR's own E. coli default.",
                "type": "string"
              },
              "end": {
                "description": "Optional 1-based position; only consider start codons beginning at or before it.",
                "type": "number"
              },
              "sequence": {
