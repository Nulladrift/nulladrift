        },
        {
          "name": "primer_specificity",
          "title": "Primer specificity screen",
          "description": "Self-hosted e-PCR-style screen for off-target amplicons predicted by a primer pair against the background chosen with `background`: the bundled lab genomes (the default — E. coli K-12 MG1655, B. subtilis 168, human mitochondrion rCRS, Mycoplasma hyorhinis SK76), or the human or mouse TRANSCRIPTOME, one transcript per gene, where an off-target product means a different GENE. See genomesChecked in the response for what actually ran. No background covers the nuclear genome, so an off-target in an intron, a promoter, an intergenic region or genomic-DNA carry-over is out of scope in every mode. Amplicons are 1-based inclusive on the plus strand; a product across a circular genome's origin reports an end lower than its start and sets wraps: true. This checks background/host-genome specificity, NOT whether the primers hit your intended target — pair it with in_silico_pcr against your own template for that. Each off-target end reports its 3' ANCHOR — the primer's unbroken run of matched bases at the extending end — with that anchor's nearest-neighbor ΔG and a margin against the intended, fully matched reaction, so a site can be told apart by WHERE its mismatches fall rather than only how many there are: one mismatch at the 5' end leaves a site nearly as strong, and one at the 3' base leaves it unable to prime at all. Batchable over candidate REVERSE primers against one fixed forward primer (screen many candidates against a shared partner) — not independent primer-pair batching, which this tool doesn't support. A primer may carry a non-templated 5' tail (a restriction site, a Gibson arm, a tag): the screen looks for a 3'-anchored annealing region as well as a full-length match, so a tailed cloning primer is screened rather than silently matching nothing. Each end's `anchor` is the annealed run, which is the length that matters for extension, and `start`/`end` are measured on the ANNEALED footprints — the bases each primer actually pairs with on the genome — so `length` (the product, tails included) equals end - start + 1 only for untailed primers. Screening a TAILED primer without `intendedTemplate` inflates every margin by the tail's own free energy, because nothing about an oligo says where its non-templated part ends; `intended.basis` reports which footprint the margins rest on.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "background": {
                "default": "lab-genomes",
                "description": "What to screen against. \"lab-genomes\" (the default) is the bundled set of common lab reference genomes. \"human\" is MANE Select and \"mouse\" is RefSeq Select — ONE TRANSCRIPT PER GENE, so an off-target product means a DIFFERENT GENE rather than another isoform of the one you meant (the full RefSeq set holds ~190,000 transcripts, most of them isoforms of each other, and screening against it buries the one real finding under fifteen copies of your own gene). These are TRANSCRIPTOMES, so they cover spliced mRNA only: an off-target in an intron, a promoter, an intergenic region or an unannotated locus is NOT in scope, and neither is genomic DNA contamination — read a clean result as \"does not amplify another mRNA\", never as \"genome-wide specific\". Each is a pinned annotation release, named in genomesChecked.",
                "enum": ["lab-genomes", "human", "mouse"],
                "type": "string"
              },
              "forwardPrimer": {
                "description": "Forward primer, 5'→3'.",
                "residues": "nt",
                "type": "string"
              },
              "intendedTemplate": {
                "description": "The template these primers are meant to amplify. Only their annealing footprints are read from it, so an amplicon, a plasmid or a cassette is always enough (at most 1,000,000 bp). Passing it is what makes closestCompetitorMargin true for a primer carrying a 5' tail: a tail is non-templated by definition, so nothing about the oligo says where it ends, and without a template the screen has to assume the whole oligo anneals — which credits the intended reaction with a duplex the tail cannot form ANYWHERE and inflates every margin by that tail's own free energy. Searched on both strands as given; a primer that cannot be found on it is an error rather than a silent fall back to the whole oligo.",
                "residues": "nt",
                "type": "string"
              },
              "maxMismatches": {
                "default": 1,
                "description": "Mismatches tolerated per primer against a reference genome. Capped at 4 — past that a primer would not extend anyway. No primer length is refused for raising this: the pigeonhole seed just gets shorter and less selective, so more candidate sites are verified and the call takes longer (an 18-mer over the bundled genomes runs in ~0.1 s at 0 and ~1.5 s at 4). A short primer at a high setting can still exceed the binding-site pairing limit and come back \"unsupported\" — a 13-mer at 4 binds too many places to pair up, where an 18-mer screens fine — and either primer under 13 nt is not screened at all (ambiguousSeed: true, no amplicons).",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "maxProductLength": {
                "default": 5000,
                "description": "Ignore candidate off-target products longer than this (bp) — a search-window cap, not a biological claim.",
                "minimum": 1,
                "type": "integer"
              },
              "reversePrimer": {
                "description": "Reverse primer, 5'→3'.",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["forwardPrimer", "reversePrimer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Primer specificity screen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9907afb38f2463ba8ffc0f96b42ba5950aa9e4cf117e683613930bf6707085b"
        },
        {
          "name": "promoter_library_design",
          "title": "Design a non-repetitive promoter library spanning a strength range",
          "description": "Build a set of sigma-70 promoters that (a) share no more than a chosen length of sequence with each other, so the library does not recombine with itself once integrated, and (b) span a range of predicted transcription rates, picked as an evenly log-spaced ladder. Variants are constructed deterministically from an IUPAC template holding the -35 and -10 consensus; their strengths are then estimated by the Promoter Calculator model. Rungs with no variant near them are reported as gaps rather than filled with the nearest thing. PREDICTED, NOT MEASURED: strengths carry R^2 = 0.45-0.60 against independent in vivo data, so treat the ladder as a ranked set to screen, not as calibrated numbers. PREDICTED, NOT MEASURED. R^2 = 0.45 and 0.60 against the two INDEPENDENT in vivo datasets the authors tested (Hossain et al., 4,350 promoters, Spearman rho = 0.69; Urtecho et al., 10,898 promoters, rho = 0.67). The widely quoted R^2 = 0.80 is a held-out tenth of the authors' OWN in vitro transcription data and is not the number to plan against: a promoter in a cell is the in vivo case, where between a third and a half of the variance is unexplained. Valid for: sigma-70 (housekeeping) promoters in E. coli. NOT valid for another sigma factor, another organism, a promoter under activator or repressor control, or anything about mRNA stability or translation — rbs_predict is the translation half, and neither speaks to the other.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidatePool": {
                "default": 24,
                "description": "How many variants to build and score before selecting the ladder. A larger pool fills more rungs and costs one longer scan, not more round trips.",
                "maximum": 48,
                "minimum": 4,
                "type": "integer"
              },
              "exclude": {
                "description": "Motifs no variant may contain, both strands — the restriction sites you clone with. Literal ACGT only.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "gcMax": {
                "default": 100,
                "description": "Highest GC% a variant may have.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "gcMin": {
                "default": 0,
                "description": "Lowest GC% a variant may have.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "librarySize": {
                "description": "How many promoters the ladder should have (2 to 24). Required: every other argument has a defensible default, so this is the one statement of intent, and without it an empty call would build and score a library nobody asked for.",
                "maximum": 24,
                "minimum": 2,
                "type": "integer"
              },
              "lmax": {
                "default": 12,
                "description": "Longest stretch any two promoters in the library may share, in bp (default 12). This is the property that stops the library recombining with itself.",
                "maximum": 40,
                "minimum": 8,
                "type": "integer"
              },
              "seed": {
                "default": 1,
                "description": "Seeds variant construction; same seed, same variants.",
                "type": "integer"
              },
              "targetMax": {
                "description": "Strongest rung, same units. Omit with targetMin to use the variants' own range.",
                "type": "number"
              },
              "targetMin": {
                "description": "Weakest rung, in the model's arbitrary transcription-rate units. OMIT THIS and the range is taken from what the built variants actually score, which is usually right: the units have no absolute meaning, so a default would describe nothing. Set it only to match a promoter you measured yourself.",
                "type": "number"
              },
              "template": {
                "description": "IUPAC template every variant must match. Defaults to a sigma-70 layout holding TTGACA and TATAAT with a 17 nt spacer and randomised flanks. Change it to target a different architecture — but a template that randomises the boxes will produce members that are not promoters.",
                "type": "string"
              }
            },
            "required": ["librarySize"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Design a non-repetitive promoter library spanning a strength range"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ca85e3fc8c839b0c3737d1a960d5b3dcf064c043811e84ecb2989813b1fceeb"
        },
        {
          "name": "promoter_predict",
          "title": "Sigma-70 promoter strength",
          "description": "Scan DNA for E. coli sigma-70 promoters and estimate each one's transcription initiation rate, with the free-energy terms it is built from: the -35 and -10 boxes, the spacer, the discriminator, the extended -10 and the initial transcribed region. Pairs with rbs_predict — together they separate 'nothing is transcribed' from 'it is transcribed and not translated', which no single measurement on the sequence does. Both strands by default, because a promoter reading into your insert from the other strand is still a promoter. PREDICTED, NOT MEASURED. R^2 = 0.45 and 0.60 against the two INDEPENDENT in vivo datasets the authors tested (Hossain et al., 4,350 promoters, Spearman rho = 0.69; Urtecho et al., 10,898 promoters, rho = 0.67). The widely quoted R^2 = 0.80 is a held-out tenth of the authors' OWN in vitro transcription data and is not the number to plan against: a promoter in a cell is the in vivo case, where between a third and a half of the variance is unexplained. Valid for: sigma-70 (housekeeping) promoters in E. coli. NOT valid for another sigma factor, another organism, a promoter under activator or repressor control, or anything about mRNA stability or translation — rbs_predict is the translation half, and neither speaks to the other.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bothStrands": {
                "default": true,
                "description": "Scan the reverse strand too. Leave on unless you know the orientation — cryptic antisense promoters are a common and easily missed cause of trouble.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "How many of the strongest promoters to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "sequence": {
                "description": "DNA to scan, 80-30000 nt. A promoter region, a 5' UTR with its upstream context, a whole cassette, or a plasmid (past 10000 nt it is scanned in overlapping windows).",
                "type": "string"
              }
            },
            "required": ["sequence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sigma-70 promoter strength"
          },
          "behavior": {
