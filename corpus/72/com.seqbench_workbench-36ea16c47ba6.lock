        {
          "name": "gel_band_size",
          "title": "Band size from a gel, against a marked ladder",
          "description": "Calibrate a gel lane against a marked DNA ladder and read the size of any other band from how far it ran. Migration distance is approximately linear in log(size) over a gel's resolving range, so a least-squares line through the marked rungs interpolates between them — and NOT outside them, which is why a band beyond the marked span comes back flagged `extrapolated` rather than quietly clamped to the nearest rung. Reports R² and the per-rung residual, because one mis-marked rung (a doublet marked as one band, a mis-clicked centre) shifts every size on the gel and a single R² hides it. Distances may be in pixels, millimetres or anything else, as long as they are all measured the same way from the same reference line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bandDistances": {
                "description": "How far each band you want a size for ran, in the same unit from the same reference line. May be empty: the fit and its per-rung residuals are an answer on their own, and are how you find out the ladder was marked correctly before reading anything off it.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "ladder": {
                "description": "Which ladder is in the marked lane. One of: 1 kb, GeneRuler 1 kb, 1 kb Plus, 1 kb Plus (legacy), 100 bp.",
                "type": "string"
              },
              "ladderDistances": {
                "description": "How far each visible ladder band ran, in any consistent unit, measured from the same reference line (the well) as the query bands. Order does not matter — they are sorted and matched to the ladder's sizes largest-first, since a larger fragment runs less far. At least 3: two points fit a line exactly, so they cannot show whether the ladder was marked correctly.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["ladder", "ladderDistances"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Band size from a gel, against a marked ladder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0219d74da935187c1075516fc851b4a15c166b41388aebbcc7f9973420b109e1"
