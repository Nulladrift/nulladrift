        {
          "name": "site_directed_mutagenesis",
          "title": "Site-directed mutagenesis designer",
          "description": "Design site-directed mutagenesis primers (QuikChange overlapping or Q5 back-to-back) for a base substitution, an amino-acid codon swap, or an insertion/deletion/delins. The edit can be given as fields or, more simply, by NAME in `mutation`: \"E52K\", \"p.Glu52Lys\", \"c.155A>G\", \"c.76_78del\", \"c.76_77insGGA\", \"c.76_78dup\". A named mutation is checked against the template — if the reference allele it states is not what is actually at that position, the call is refused and the real base or residue is quoted back, because a coordinate belonging to a different transcript or the other strand yields perfectly well-formed primers for the wrong base. `interpretedAs` in the response says which reading was designed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "armTmTarget": {
                "default": 60,
                "description": "Target Tm (°C) for each template-binding arm.",
                "type": "number"
              },
              "deleteLength": {
                "description": "Template bases to remove, starting at `position` (delins edit). 0 with `insert` set is a pure insertion, placed immediately before `position`.",
                "type": "integer"
              },
              "dntpMM": {
                "default": 0.2,
                "description": "Total [dNTP] (mM), chelates Mg2+.",
                "type": "number"
              },
              "editKind": {
                "description": "Edit level. Normally omitted — it is inferred from the fields you send (newBase means nt, targetAa means aa, insert/deleteLength means delins).",
                "enum": ["nt", "aa", "delins"],
                "type": "string"
              },
              "frameStart": {
                "default": 1,
                "description": "1-based position of the first base of codon 1. Needed whenever the coding sequence does not start at base 1 of the template — a residue number means nothing without it.",
                "type": "integer"
              },
              "insert": {
                "description": "Bases to put in place of the deleted span (delins edit). Omit for a pure deletion. NOTE the convention when deleteLength is 0: the insert lands immediately BEFORE `position`, so position 101 + insert \"GGA\" is the same edit as mutation: \"c.100_101insGGA\" — HGVS names the two flanking bases, this names the base the insert sits in front of. `interpretedAs` states which bases the insert ended up between.",
                "residues": "nt",
                "type": "string"
              },
              "mgMM": {
                "default": 1.5,
                "description": "Divalent cation [Mg2+] (mM).",
                "type": "number"
              },
              "mutation": {
                "description": "The edit by name — \"E52K\", \"p.Glu52Lys\", \"Q100*\", \"c.155A>G\", \"A155G\", \"c.76_78del\", \"c.76_77insGGA\", \"c.76_78dup\", \"c.76delinsAA\". Replaces the field-by-field forms below. An unprefixed \"A123G\" is a legal reading at BOTH levels; it is resolved by which one matches the template, and refused if both do.",
                "type": "string"
              },
              "naMM": {
                "default": 50,
                "description": "Monovalent cation [Na+]/[K+] (mM).",
                "type": "number"
              },
              "newBase": {
                "description": "Replacement base (nt edit).",
                "enum": ["A", "C", "G", "T"],
                "type": "string"
              },
              "oligoNM": {
                "default": 250,
                "description": "Total strand concentration (nM).",
                "type": "number"
              },
              "organism": {
                "default": "ecoli",
                "description": "Codon-usage table for choosing the new codon (aa edit). Latin names and common strain/cell-line names are accepted.",
                "enum": ["ecoli", "human", "yeast", "cho", "pichia", "insect", "arabidopsis", "zebrafish"],
                "type": "string"
              },
              "position": {
                "description": "1-based position to substitute (nt), or the first base of the span to replace (delins). Required for those forms — it is never assumed. For a pure insertion (deleteLength 0) it is the base the insert goes in FRONT of.",
                "type": "integer"
              },
              "residue": {
                "description": "1-based residue number to change (aa edit).",
                "type": "integer"
              },
              "style": {
                "default": "quikchange",
                "description": "Mutagenic primer style.",
                "enum": ["quikchange", "q5"],
                "type": "string"
              },
              "targetAa": {
                "description": "Target amino acid, one-letter code incl '*' (aa edit).",
                "type": "string"
              },
              "template": {
                "description": "Nucleotide sequence (raw or FASTA; IUPAC accepted).",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Site-directed mutagenesis designer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d75b77947ab516bcc61c9c488cf2bbd0a587893aeabcb28fedd2ca817e4913d"
        },
