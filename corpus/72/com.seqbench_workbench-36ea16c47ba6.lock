        {
          "name": "kasp_primer_design",
          "title": "KASP / ARMS Allele-Specific Primers",
          "description": "Design KASP/ARMS allele-specific genotyping primers for a SNP: two allele-specific forward primers differing only at the 3' terminal base (one per allele), each with the standard KASP universal tail (FAM for allele A, HEX for allele B), a deliberate internal ARMS secondary mismatch near the 3' end whose strength complements that primer's own natural allele mismatch (strong↔weak), and one common downstream reverse primer sized to a chosen amplicon range. Because a forward primer reads the antisense strand, each primer's 3' base sits opposite the complement of the other allele, so the two primers get different mismatch classes and are reported separately (graded from the measured PCR yields in Kwok et al. 1990). Reuses the site's nearest-neighbor Tm engine.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "addSecondaryMismatch": {
                "default": true,
                "description": "Engineer the internal ARMS destabilizing mismatch near the 3' end.",
                "type": "boolean"
              },
              "alleleA": {
                "description": "First allele (single base) — gets the FAM tail. Not needed when the target marks the SNP as [A/G].",
                "residues": "nt",
                "type": "string"
              },
              "alleleB": {
                "description": "Second allele (single base) — gets the HEX tail. Not needed when the target marks the SNP as [A/G].",
                "residues": "nt",
                "type": "string"
              },
              "maxAmplicon": {
                "default": 150,
                "description": "Maximum amplicon length for the common reverse primer.",
                "type": "integer"
              },
              "minAmplicon": {
                "default": 60,
                "description": "Minimum amplicon length for the common reverse primer.",
                "type": "integer"
              },
              "snpPosition": {
                "description": "1-based position of the SNP on the forward strand — not needed when the target marks it as [A/G]. Must be 18 or greater: the allele-specific primers end on the SNP, so they need at least 17 bp of upstream template to build a core from.",
                "minimum": 18,
                "type": "integer"
              },
              "target": {
                "description": "Nucleotide sequence around the SNP, forward strand. Write the SNP as [A/G] and snpPosition, alleleA and alleleB are read from it (the first allele gets FAM).",
                "residues": "nt",
                "type": "string"
              },
              "targetCoreTm": {
                "default": 56,
                "description": "Target Tm (°C) for the allele-specific primer core (before the universal tail).",
                "type": "number"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "KASP / ARMS Allele-Specific Primers"
          },
