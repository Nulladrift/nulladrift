        {
          "name": "cloning_simulate",
          "title": "Cloning simulator",
          "description": "Assemble fragments by Gibson/overlap, Golden Gate (Type IIS), restriction–ligation (sticky or blunt), TOPO/TA, LIC or SLIC (T4-polymerase chew-back) or In-Fusion/CPEC, returning the product, the junctions and — for the primer-design methods — the junction primers. Each method is modeled as its own chemistry rather than as one product model with different labels: LIC's chew-back stops at the first occurrence of the single dNTP supplied, so a tail carrying that base stops it early and a tail without one lets it run past the junction, and both are refused with the offending base and position named.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "armLength": {
                "default": 18,
                "description": "homology method: homology-arm length in bp, clamped to 15-25 — the range the kit manuals specify (CE Design 15-20, In-Fusion 15, NEBuilder 15-25).",
                "maximum": 25,
                "minimum": 15,
                "type": "integer"
              },
              "armTmTarget": {
                "default": 60,
                "description": "Target annealing Tm (°C) for primer arms.",
                "type": "number"
              },
              "chewBackLen": {
                "default": 0,
                "description": "slic method: nucleotides removed from each 3′ end. A SLIC chew-back has no dNTP to arrest it and is stopped by time, so this is an input rather than a property of the sequence. 0 (default) models the intended reaction — chewed to the full homology and no further; any positive value is checked against each junction's own homology, and both overrunning it and falling short of meeting the chew-back coming the other way are reported.",
                "minimum": 0,
                "type": "integer"
              },
              "circular": {
                "default": true,
                "description": "Produce a circular product.",
                "type": "boolean"
              },
              "deleteTo": {
                "description": "homology method, inverse-pcr: delete openAt..deleteTo (inclusive, wrapping past the origin) instead of only opening.",
                "minimum": 1,
                "type": "integer"
              },
              "dephosphorylateVector": {
                "default": false,
                "description": "CIP/rSAP-dephosphorylate the vector to suppress self-ligation background (restriction method).",
                "type": "boolean"
              },
              "enzyme": {
                "default": "BsaI",
                "description": "Type IIS enzyme for Golden Gate — one of BsaI, BbsI, Esp3I (BsmBI); \"BsmBI\" also resolves to Esp3I. Any other name is rejected rather than substituted.",
                "type": "string"
              },
              "enzyme3": {
                "default": "BamHI",
                "description": "Insert 3′ enzyme (restriction method).",
                "type": "string"
              },
              "enzyme5": {
                "default": "EcoRI",
                "description": "Insert 5′ enzyme (restriction method).",
                "type": "string"
              },
              "fragments": {
                "description": "Fragments (5′→3′). Used by gibson/goldengate/slic/infusion. gibson and goldengate assemble them head-to-tail in the order given and add the junctions by primer; slic needs the homology already ON the fragments and keeps the order given; infusion needs it on the fragments too but derives the order from the homologies, so the order listed here is ignored. slic and infusion take at most 24.",
                "items": {
                  "type": "string"
                },
                "maxItems": 24,
                "type": "array"
              },
              "homologyLen": {
                "default": 15,
                "description": "infusion method: terminal homology required at every junction, in bp. At least 15 — the junction is annealed and extended by a polymerase with no exonuclease to widen it and no ligase to seal it, so a shorter overlap is a different chemistry rather than a weaker version of this one.",
                "minimum": 15,
                "type": "integer"
              },
              "insert": {
                "description": "Insert sequence (restriction, topo and lic methods).",
                "residues": "nt",
                "type": "string"
              },
              "insertNucleotide": {
                "description": "lic method: the single dNTP the INSERT's chew-back was run with. Normally the COMPLEMENT of vectorNucleotide (the classic pair is dTTP on the vector, dATP on the insert) — with the same base for both, each junction's shared block would have to avoid that base and its complement at once.",
                "enum": ["A", "C", "G", "T"],
                "type": "string"
              },
              "mergePreAddedArms": {
                "default": true,
                "description": "Gibson only. When two fragments already share terminal sequence, count that share ONCE (the default — it is a homology arm the fragments already carry) or set false to concatenate it twice. The second reading is the right one when the shared block is a genuine tandem repeat, e.g. a 2x tag or enhancer split between its copies: nothing in the two fragments can tell the two apart, so the choice belongs to the caller. Either way the share is reported in preAddedArms and both readings are returned in `readings`.",
                "type": "boolean"
              },
              "method": {
                "default": "gibson",
                "description": "Assembly method. gibson/goldengate design the junction primers for bare fragments; restriction and topo build a product from a vector and an insert; lic and slic model T4-polymerase chew-back (sequence-defined and time-stopped respectively); infusion is In-Fusion/CPEC, 15 bp terminal homology with no exonuclease, and works out the fragment ORDER for itself; gateway runs a BP or LR recombination between att sites (see `reaction`); homology starts from the CIRCULAR vector instead of a linear fragment — say how to open it with `openWith` and it designs the arm-carrying primers for the insert (NEBuilder/ClonExpress/In-Fusion kits).",
                "enum": ["gibson", "goldengate", "restriction", "topo", "lic", "slic", "infusion", "gateway", "homology"],
                "type": "string"
              },
              "names": {
                "description": "Optional labels for each fragment.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "openAt": {
                "description": "homology method, inverse-pcr: 1-based base the linearised vector starts at.",
                "minimum": 1,
                "type": "integer"
              },
              "openWith": {
                "default": "single",
                "description": "homology method: how the circular vector is opened. single uses vectorEnzyme5 and REFUSES if it does not cut exactly once; double removes the arc running forward from vectorEnzyme5's cut to vectorEnzyme3's; inverse-pcr opens at `openAt` and, with `deleteTo`, deletes that span.",
                "enum": ["single", "double", "inverse-pcr"],
                "type": "string"
              },
              "overlapLen": {
                "default": 20,
                "description": "Gibson homology-arm length (bp).",
                "type": "integer"
              },
              "reaction": {
                "default": "LR",
                "description": "gateway method: BP recombines ONE attB-flanked PCR product (`fragments[0]`, a bare sequence is fine) into an attP donor (`vector`) to make an attL entry clone; LR recombines one to four ORDERED attL/attR entry clones (`fragments`) into an attR destination (`vector`) to make the attB expression clone. Vectors and entry clones must be GenBank records with their att sites annotated — attP/attL/attR sites are found by label, then checked base by base at the crossover core.",
                "enum": ["BP", "LR"],
                "type": "string"
              },
              "topoMode": {
                "default": "ta",
                "description": "TOPO chemistry (topo method): TA (Taq 3′-A), blunt, or directional (pENTR/D-TOPO, needs 5′-CACC on the insert).",
                "enum": ["ta", "blunt", "directional"],
                "type": "string"
              },
              "vector": {
                "description": "Vector sequence (restriction, topo and lic methods; for lic, the LINEARIZED vector).",
                "residues": "nt",
                "type": "string"
              },
              "vectorEnzyme3": {
                "description": "Vector 3′ enzyme (restriction method); defaults to enzyme3.",
                "type": "string"
              },
              "vectorEnzyme5": {
                "description": "Vector 5′ enzyme (restriction method); defaults to enzyme5. Set a different, compatible enzyme (e.g. BglII for a BamHI insert) to model heterologous-overhang cloning.",
                "type": "string"
              },
              "vectorNucleotide": {
                "description": "lic method: the single dNTP the VECTOR's chew-back was run with (T for dTTP…). Required — T4 pol's exonuclease stops at the first occurrence of this base reading inward from each 3′ end, so there is no answer without it.",
                "enum": ["A", "C", "G", "T"],
                "type": "string"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cloning simulator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b18e8f0dda0926e06fb23a4cfcdb14d58175aac27a19ac19166dd88e4646090e"
        },
        {
          "name": "codon_adaptation_index",
          "title": "CAI analyzer",
          "description": "Codon Adaptation Index (CAI) and per-codon relative adaptiveness of a CDS against an expression host, with rare-codon and GC3 analysis.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "frameStart": {
