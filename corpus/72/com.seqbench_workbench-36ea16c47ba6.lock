        },
        {
          "name": "operon_design",
          "title": "Assemble a multi-gene operon and check it",
          "description": "Build a polycistronic operon from a promoter, a list of CDSs with their RBSs, spacers and a terminator — optionally recoding every CDS for a host — then scan the ASSEMBLED molecule for internal promoters, Shine-Dalgarno sequences, terminators, out-of-frame start codons and repeats. Scanning the product rather than the parts is the point: these elements are very often created BY THE JOIN between two parts, so checking each part alone finds nothing. Returns the sequence, an annotated GenBank file, and every element found. Assigns no translation rate — use rbs_library_design to choose RBSs, then rbs_predict to rank the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "genes": {
                "description": "The genes, in order (max 12).",
                "items": {
                  "properties": {
                    "cds": {
                      "description": "The coding sequence, as DNA.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Label for the CDS feature.",
                      "type": "string"
                    },
                    "rbs": {
                      "description": "Ribosome binding site placed in front of this gene. Omit for a consensus default, or pass \"\" for none.",
                      "type": "string"
                    }
                  },
                  "required": ["cds"],
                  "type": "object"
                },
                "type": "array"
              },
              "includeGenbank": {
                "default": true,
                "description": "Return the annotated GenBank file.",
                "type": "boolean"
              },
              "name": {
                "description": "LOCUS name for the GenBank output.",
                "type": "string"
              },
              "optimiseFor": {
                "description": "Recode every CDS with this host's most-frequent codons. The rewrite is checked to translate back to the same protein, and skipped for that gene if it does not. This is a determinate recoding, NOT a yield prediction — published codon-optimisation algorithms are close to a coin flip on whether they raise or lower real expression.",
                "enum": ["ecoli", "human", "yeast", "cho", "pichia", "insect", "arabidopsis", "zebrafish"],
                "type": "string"
              },
              "promoter": {
                "description": "Promoter placed at the 5' end.",
                "type": "string"
              },
              "spacer": {
                "description": "Sequence inserted between one CDS and the next gene's RBS.",
                "type": "string"
              },
              "terminator": {
                "description": "Terminator placed at the 3' end.",
                "type": "string"
              }
            },
            "required": ["genes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
