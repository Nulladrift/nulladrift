        {
          "name": "blast_poll",
          "title": "Collect a BLAST search",
          "description": "Check a BLAST search submitted with blast_submit. Returns {ready:false} while it is still running; once ready, returns each hit's accession, title, organism, best HSP (bit score, expect, percent identity, span on both query and subject) and the percentage of the QUERY it covers, with overlapping HSPs merged so coverage cannot exceed 100%. A search of several FASTA records also returns `queries`: each record's title, length and hits, in submission order (`hits` is the first record's). A request id NCBI no longer recognises is reported as either a typo or an expired search, which is the same answer it gives for both.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rid": {
                "description": "The request id returned by blast_submit.",
                "type": "string"
              }
            },
            "required": ["rid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Collect a BLAST search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e32c612637b82733c242e985ce80db2f6fcf40357ba1ca879f231886325fc290"
