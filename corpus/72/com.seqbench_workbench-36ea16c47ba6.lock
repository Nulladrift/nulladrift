        {
          "name": "ligation_setup",
          "title": "Ligation / assembly reaction setup",
          "description": "Work out how many microlitres of vector and insert to pipette to hit a target molar ratio, from each part's length and stock concentration. Handles one insert or several with independent equivalents (Gibson, Golden Gate, MoClo), reports pmol and ng per part alongside the volumes, and flags the two things that actually go wrong on a bench: a volume below what a pipette measures reliably, and a plan whose DNA does not leave room for buffer and enzyme. A molar ratio is about moles, so a shorter insert at 3 molar equivalents goes in at LESS mass than the vector — that conversion is the point.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "insertLengthBp": {
                "description": "Insert length in bp. Use `inserts` instead for a multi-fragment assembly.",
                "type": "integer"
              },
              "insertNgPerUl": {
                "description": "Insert stock concentration, ng/µL.",
                "type": "number"
              },
              "inserts": {
                "description": "Multi-fragment assembly: one entry per insert, each with its own length, stock and molar equivalents. Overrides insertLengthBp/insertNgPerUl/molarRatio when present.",
                "items": {
                  "properties": {
                    "equivalents": {
                      "default": 1,
                      "type": "number"
                    },
                    "label": {
                      "type": "string"
                    },
                    "lengthBp": {
                      "type": "integer"
                    },
                    "ngPerUl": {
                      "type": "number"
                    }
                  },
                  "required": ["lengthBp", "ngPerUl"],
                  "type": "object"
                },
                "type": "array"
              },
              "molarRatio": {
                "default": 3,
                "description": "Molar equivalents of insert per vector. 3 is the usual starting point for a sticky-end ligation; 1-2 is common for Gibson and Golden Gate.",
                "type": "number"
              },
              "reactionVolumeUl": {
                "default": 20,
                "description": "Total reaction volume, µL.",
                "type": "number"
              },
              "vectorLengthBp": {
                "description": "Backbone length in bp.",
                "type": "integer"
              },
              "vectorNg": {
                "default": 50,
                "description": "How much backbone to put in the reaction, ng. This is the quantity you fix; every insert mass follows from the ratio.",
                "type": "number"
              },
              "vectorNgPerUl": {
                "description": "Backbone stock concentration, ng/µL.",
                "type": "number"
              },
              "vectorSequence": {
                "description": "Optional backbone sequence — gives an exact molar mass from base composition instead of the 650 g/mol/bp average.",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["vectorLengthBp", "vectorNgPerUl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
