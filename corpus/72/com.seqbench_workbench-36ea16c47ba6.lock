        {
          "name": "prime_editing_twin_design",
          "title": "twinPE Studio (dual pegRNA)",
          "description": "Design a twinPE pegRNA pair (Anzalone et al. 2022) for a replacement too large for a single pegRNA's RTT: a left pegRNA nicks the + strand at/before the replacement window and a right pegRNA nicks the - strand at/after it, each synthesizing a new 3' flap; both flaps are truncated at a shared overlap in the middle of the new sequence so they anneal and resolve the edit without an HDR donor. Coordinates: both pegRNAs' protospacerStart/protospacerEnd/nickPosition are 1-based inclusive in the submitted PRE-EDIT target's frame (the PAM search runs on the unedited sequence, on both sides), while replaceSpan is the span of the new content in the returned editedSequence. Off-target activity is not evaluated (no in-browser reference genome).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "newSequence": {
                "description": "New sequence (forward strand) to install in place of [replaceStart, replaceEnd]. Needs >= 2 bp.",
                "residues": "nt",
                "type": "string"
              },
              "overlapLength": {
                "default": 15,
                "description": "Length (bp) of the shared overlap built into both pegRNAs' 3' flaps where they meet and anneal.",
                "type": "integer"
              },
              "pbsLength": {
                "description": "Optional preferred PBS length to highlight; a full 8-17 nt sweep is always returned.",
                "type": "integer"
              },
              "replaceEnd": {
                "description": "1-based inclusive end of the region being replaced/deleted. For a pure insertion, set replaceEnd = replaceStart - 1.",
                "type": "integer"
              },
              "replaceStart": {
                "description": "1-based inclusive start of the region being replaced/deleted.",
                "type": "integer"
              },
              "target": {
                "description": "Forward-strand target DNA (raw or FASTA), with flanking sequence on both sides of the replacement window.",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["newSequence", "replaceEnd", "replaceStart", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "twinPE Studio (dual pegRNA)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
