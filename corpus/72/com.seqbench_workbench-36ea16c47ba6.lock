        {
          "name": "cpg_islands",
          "title": "CpG island finder",
          "description": "Find CpG islands by either published definition: Gardiner-Garden & Frommer 1987 (GC > 50%, observed/expected CpG > 0.6, >= 200 bp — the original, which also calls many Alu repeats) or Takai & Jones 2002 (GC >= 55%, obs/exp >= 0.65, >= 500 bp — written to exclude them). Windows are merged only where the merged region STILL meets the criteria, so every island returned satisfies the definition it is reported under. Reports the CpG DINUCLEOTIDE count separately from GC content, because conflating the two is the usual way this number goes wrong.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mergeGap": {
                "default": 100,
                "description": "Join passing regions closer than this, when the joined region still passes. Takai & Jones use 100.",
                "type": "integer"
              },
              "minGcPct": {
                "description": "Override the preset's GC threshold, 0-100.",
                "type": "number"
              },
              "minLength": {
                "description": "Override the preset's minimum island length, bp.",
                "type": "integer"
              },
              "minObsExp": {
                "description": "Override the preset's observed/expected CpG threshold.",
                "type": "number"
              },
              "preset": {
                "default": "gardiner-garden",
                "description": "Which published criteria to apply. \"gardiner-garden\": Gardiner-Garden & Frommer 1987 (GC > 50%, obs/exp > 0.6, >= 200 bp; thresholds strict, as the paper states them) \"takai-jones\": Takai & Jones 2002 (GC >= 55%, obs/exp >= 0.65, >= 500 bp; excludes most Alu)",
                "enum": ["gardiner-garden", "takai-jones"],
                "type": "string"
              },
              "sequence": {
                "description": "DNA to scan (raw or FASTA). Max 5,000,000 bases.",
                "residues": "nt",
                "type": "string"
              },
              "windowSize": {
                "default": 200,
                "description": "Scanning window in bp. 200 is Takai & Jones' window, and it is used for both presets so the two differ only in their thresholds (Gardiner-Garden & Frommer's 1987 paper scanned 100 bp windows).",
                "type": "integer"
              }
            },
            "required": ["sequence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CpG island finder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
