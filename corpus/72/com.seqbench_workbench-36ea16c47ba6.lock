        {
          "name": "in_silico_pcr",
          "title": "In-silico PCR",
          "description": "Predict PCR products for a template and a pair of primers (IUPAC-aware, allows mismatches, handles circular templates). Primers may carry a non-templated 5' tail — a restriction site, a Gibson arm, a Kozak, a tag: a primer primes on its 3' end, and the tail is carried into the product rather than required to match. start/end are the TEMPLATE-derived span, `length` is the whole product including tails, and `features` marks which product bases came from the oligos (present only when there is a tail). Each end reports annealedLength and tailLength. When two primers make NO product on a template up to 60,000 bp, `diagnosis` says why: where each primer does prime (with the mismatched bases), which copying mistake explains one that primes nowhere (reversed but not complemented, complemented but not reversed, a base dropped or doubled, a mismatched 3' base) with the sequence that would bind, whether the two point the same way or away from each other, and the product a linear reading missed across the origin of a circle.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "circular": {
                "default": false,
                "description": "Treat the template as circular (plasmid).",
                "type": "boolean"
              },
              "forwardPrimer": {
                "description": "Primer 1, 5'→3'.",
                "residues": "nt",
                "type": "string"
              },
              "maxMismatches": {
                "default": 0,
                "description": "Mismatches tolerated per primer (0–10).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "maxProductLength": {
                "default": 50000,
                "description": "Ignore predicted products longer than this (bp). A SEARCH WINDOW, not a claim about what amplifies: whole-plasmid inverse PCR — the reaction a q5-style site_directed_mutagenesis design is run as — makes one product the size of the plasmid, so raise this for a construct over 50 kb. `suppressedByLength` in the response counts what the window discarded.",
                "maximum": 500000,
                "minimum": 1,
                "type": "integer"
              },
              "reversePrimer": {
                "description": "Primer 2, 5'→3' (order does not matter). Optional: one primer alone is accepted and reports the products it makes on its own — none, unless the template carries inverted sites it can prime from both ends.",
                "residues": "nt",
                "type": "string"
              },
              "template": {
                "description": "Nucleotide sequence (raw or FASTA; IUPAC accepted).",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "In-silico PCR"
