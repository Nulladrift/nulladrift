        {
          "name": "pairwise_alignment",
          "title": "Pairwise Alignment",
          "description": "Global (Needleman-Wunsch), local (Smith-Waterman) or semi-global/fitting pairwise alignment of two sequences, with match/mismatch scoring and affine gap costs (Gotoh).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gap": {
                "default": -2,
                "description": "Affine gap EXTEND penalty, charged per gap position (including the first).",
                "type": "number"
              },
              "gapOpen": {
                "description": "Extra one-off penalty charged on top of gap for a gap's first position. Defaults to 1.5 * gap, so a k-base gap costs gap * (k + 1.5) and one contiguous k-base indel is cheaper than k scattered 1-base gaps. Pass 0 for a purely linear penalty.",
                "type": "number"
              },
              "match": {
                "default": 1,
                "description": "Match score.",
                "type": "number"
              },
              "mismatch": {
                "default": -1,
                "description": "Mismatch penalty.",
                "type": "number"
              },
              "mode": {
                "default": "global",
                "description": "\"global\" penalizes end gaps in both sequences; \"local\" returns the best-scoring subalignment; \"semiglobal\" is a fitting alignment — seqB is consumed end to end while seqA's terminal overhangs are free and are not emitted, so a partial read placed on a longer reference is not smeared across it.",
                "enum": ["global", "local", "semiglobal"],
                "type": "string"
              },
              "seqA": {
                "description": "First sequence (raw or FASTA; nucleotide or protein).",
                "residues": "any",
                "type": "string"
              },
              "seqB": {
                "description": "Second sequence (raw or FASTA; nucleotide or protein).",
                "residues": "any",
                "type": "string"
