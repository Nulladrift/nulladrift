        {
          "name": "sirna_design",
          "title": "siRNA / shRNA Designer",
          "description": "Design siRNA duplexes against an mRNA target using the established Reynolds (2004) 8-criteria score and the Ui-Tei (2004) rules, plus the siDirect seed-duplex Tm off-target flag (≥21.5 °C, computed on siDirect's own RNA/RNA scale: Freier 1986 nearest-neighbor parameters, helix initiation A = −10.8, CT = 100 µM, 100 mM Na⁺). Returns ranked candidates with sense/guide oligos (with UU 3' overhangs) and, per candidate, a ready shRNA cassette (sense–loop–antisense–Pol III terminator). Heuristic sequence rules only — no RNA-folding accessibility model and no transcriptome-wide off-target search. PREDICTED, NOT MEASURED. These are rule counts, not a regression, and no skill statistic is claimed for the ranking. Target-site accessibility is not modeled (no folding) and no transcriptome-wide off-target search is performed, so a top-ranked candidate is a starting point for a knockdown panel, not a predicted knockdown level. Valid for: mRNA targets. The seed Tm is computed on siDirect's own RNA/RNA scale (Freier 1986 parameters, helix initiation A = -10.8, CT = 100 µM, 100 mM Na+) and is not comparable with the DNA/DNA Tm reported elsewhere in the toolkit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "minReynolds": {
                "default": 6,
                "description": "Minimum Reynolds score (0–8) to keep; falls back to best-ranked if none qualify.",
                "type": "integer"
              },
              "shRnaLoop": {
                "default": "TTCAAGAGA",
                "description": "Loop sequence used when assembling the shRNA cassette.",
                "residues": "nt",
                "type": "string"
              },
              "target": {
                "description": "Nucleotide sequence (raw or FASTA; IUPAC accepted).",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "siRNA / shRNA Designer"
          },
          "behavior": {
            "destructive": false,
