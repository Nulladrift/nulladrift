        {
          "name": "primer_design",
          "title": "Primer designer",
          "description": "De-novo PCR primer design (Primer3-style penalty picker): enumerate and score candidate primer pairs against length/Tm/GC/3'-clamp/structure constraints.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
