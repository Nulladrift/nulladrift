        {
          "name": "verify_assembly",
          "title": "Verify a full assembly recipe",
          "description": "Deterministic self-check: given the same method/parts cloning_simulate would use (restriction-ligation, Gibson, Golden Gate, LIC, SLIC or In-Fusion/CPEC — optionally deriving a part by in-silico PCR first), re-derive the expected WHOLE product and diff it against a claimed final sequence. Returns pass/fail plus the exact position and nature of any discrepancy — not an opinion, the same deterministic simulation SeqBench already runs, run a second time as a check. A recipe that can give more than one molecule is checked against ALL of them and `matchedCandidate` names the one the claim matched: a non-directional ligation really does put the insert in both ways round (half the plate carries each), a vector cut more than twice offers more than one backbone, and a Gibson junction whose fragments already share terminal sequence has two honest readings (one homology arm, or a tandem repeat present twice). See verify_construct for a narrower, insert-only check that doesn't require declaring the vector/enzymes/method.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "armTmTarget": {
                "default": 60,
                "description": "Target annealing Tm (°C) for primer arms.",
                "type": "number"
              },
              "chewBackLen": {
                "default": 0,
                "description": "slic method: nucleotides removed from each 3′ end. A SLIC chew-back has no dNTP to arrest it and is stopped by time, so this is an input rather than a property of the sequence. 0 (default) models the intended reaction — chewed to the full homology and no further.",
                "minimum": 0,
                "type": "integer"
              },
              "circular": {
                "default": true,
                "description": "Treat the product/claimed construct as circular (most plasmids are).",
                "type": "boolean"
              },
              "claimedConstruct": {
                "description": "The sequence you claim you ended up with.",
                "residues": "nt",
                "type": "string"
              },
              "coding": {
                "default": false,
                "description": "Report amino-acid effects of any mismatch, assuming claimedConstruct is (or contains) a coding sequence.",
                "type": "boolean"
              },
              "dephosphorylateVector": {
                "default": false,
                "description": "The linearized vector was CIP/rSAP-dephosphorylated (restriction method). Affects the self-ligation background warnings, not the product.",
                "type": "boolean"
              },
              "enzyme": {
                "default": "BsaI",
                "description": "Type IIS enzyme for Golden Gate — one of BsaI, BbsI, Esp3I (BsmBI); \"BsmBI\" also resolves to Esp3I, and NEB's variant names (BsaI-HFv2, BbsI-HF, BsmBI-v2) fold to the parent enzyme. Any other name fails the verification outright rather than being substituted.",
                "type": "string"
              },
              "enzyme3": {
                "default": "BamHI",
                "description": "Insert 3′ enzyme (restriction method).",
                "type": "string"
              },
              "enzyme5": {
                "default": "EcoRI",
                "description": "Insert 5′ enzyme (restriction method).",
                "type": "string"
              },
              "fragmentPcrs": {
                "description": "Parallel to fragments, same length: null (or omit) to use fragments[i] directly, or a PCR spec {template, forwardPrimer, reversePrimer, maxMismatches? (0-10), circular?} to derive that fragment instead.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "fragments": {
                "description": "Fragments (5′→3′), assembled head-to-tail (gibson/goldengate/slic/infusion). BARE parts only — for gibson do NOT include the homology arms, which are added by the assembly primers and merged (so the product is fragment1+…+fragmentN). The convention is the OPPOSITE for slic and infusion: there the homology must already BE on the fragments (it arrived on the PCR primer tails), and infusion derives the ORDER from those homologies, so the order listed here is ignored. Use \"\" as a placeholder for any fragment supplied instead via the matching fragmentPcrs[i].",
                "items": {
                  "type": "string"
                },
                "maxItems": 24,
                "type": "array"
              },
              "frameStart": {
                "default": 1,
                "description": "1-based reading-frame start on claimedConstruct, used when coding is true.",
                "type": "integer"
              },
              "homologyLen": {
                "default": 15,
                "description": "infusion method: terminal homology required at every junction, in bp. At least 15 — the junction is annealed and extended by a polymerase with no exonuclease to widen it and no ligase to seal it, so a shorter overlap is a different chemistry rather than a weaker version of this one.",
                "minimum": 15,
                "type": "integer"
              },
              "insert": {
                "description": "Insert sequence (restriction and lic methods). Omit if insertPcr is given.",
                "residues": "nt",
                "type": "string"
              },
              "insertNucleotide": {
                "description": "lic method: the single dNTP the INSERT's chew-back was run with. Normally the COMPLEMENT of vectorNucleotide (the classic pair is dTTP on the vector, dATP on the insert).",
                "enum": ["A", "C", "G", "T"],
                "type": "string"
              },
              "insertPcr": {
                "description": "Derive the insert by PCR instead: {template, forwardPrimer, reversePrimer, maxMismatches? (0-10), circular?}.",
                "type": "object"
              },
              "mergePreAddedArms": {
                "default": true,
                "description": "Gibson only. When two fragments already share terminal sequence, count that share ONCE (the default — the fragments already carry their arm) or set false to concatenate it twice, which is the right reading when the shared block is a genuine tandem repeat. You should rarely need this: the check tries BOTH readings and reports which one matched in `matchedCandidate`. Setting it restricts the check to one.",
                "type": "boolean"
              },
              "method": {
                "description": "Assembly method used. restriction/gibson/goldengate are the primer-and-enzyme methods; lic and slic re-run the T4-polymerase chew-back (sequence-defined and time-stopped respectively) and infusion is In-Fusion/CPEC. Anything else is refused rather than substituted — see the note on \"topo\".",
                "enum": ["restriction", "gibson", "goldengate", "lic", "slic", "infusion"],
                "type": "string"
              },
              "names": {
                "description": "Optional labels for each fragment.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "overlapLen": {
                "default": 20,
                "description": "Gibson homology-arm length (bp) that the assembly PRIMERS add at each junction. Since the fragments themselves must not carry their arms, this describes the junction/primer design only — it does not change the predicted product length or the verdict.",
                "type": "integer"
              },
              "vector": {
                "description": "Vector sequence (restriction and lic methods; for lic, the LINEARIZED vector). Omit if vectorPcr is given.",
                "residues": "nt",
                "type": "string"
              },
              "vectorEnzyme3": {
                "description": "Vector 3′ enzyme (restriction method); defaults to enzyme3.",
                "type": "string"
              },
              "vectorEnzyme5": {
                "description": "Vector 5′ enzyme (restriction method); defaults to enzyme5. Set a different, compatible enzyme (e.g. BglII for a BamHI insert) to verify heterologous-overhang cloning.",
                "type": "string"
              },
              "vectorNucleotide": {
                "description": "lic method: the single dNTP the VECTOR's chew-back was run with (T for dTTP…). Required — T4 pol's exonuclease stops at the first occurrence of this base reading inward from each 3′ end, so there is no product to check against without it.",
                "enum": ["A", "C", "G", "T"],
                "type": "string"
              },
              "vectorPcr": {
                "description": "Derive the vector by PCR instead: {template, forwardPrimer, reversePrimer, maxMismatches? (0-10), circular?}.",
                "type": "object"
              }
            },
            "required": ["claimedConstruct", "method"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a full assembly recipe"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:adce5f524f7a4050cfafe00ca39c6d75da5ac6b6ac7fa154209be87ad57caa26"
        },
        {
          "name": "verify_construct",
          "title": "Verify a claimed construct",
          "description": "Re-derive a construct's insert from the PCR (template + primers) claimed to have produced it, then check — independently of that claim — whether the expected insert actually appears (either orientation) in the claimed final construct, at what identity, and with exact mismatch positions if not. Optionally also checks for a premature stop in a declared reading frame. Primers may carry a non-templated 5' tail (a restriction site, a Gibson arm, a tag): a construct missing ONLY tail bases still passes, since that is exactly what digesting a tailed amplicon removes before ligation — see match.templateCoveragePct and match.unalignedIsTailOnly, and note the pass does not establish that the right enzyme made the cut. This re-derives from the claim's own stated inputs; it does not review the claim's prose.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claimedConstruct": {
                "description": "The final sequence claimed to have been built.",
                "residues": "nt",
                "type": "string"
              },
              "constructCircular": {
                "default": false,
                "description": "Treat claimedConstruct as a circular plasmid, so an insert that spans its arbitrary numbering origin is found whole. Without it the insert is looked for linearly and a wrapped one covers only its longer half.",
                "type": "boolean"
              },
              "expectedFrameStart": {
                "description": "1-based position in claimedConstruct where the intended reading frame begins. If given, flags a premature stop before the end of the aligned insert region.",
                "type": "integer"
              },
              "insertForwardPrimer": {
                "description": "Forward primer used to amplify the insert, 5'→3'.",
                "residues": "nt",
                "type": "string"
              },
              "insertReversePrimer": {
                "description": "Reverse primer used to amplify the insert, 5'→3'.",
                "residues": "nt",
                "type": "string"
              },
              "insertTemplate": {
                "description": "PCR template the insert was amplified from.",
                "residues": "nt",
                "type": "string"
              },
              "maxPrimerMismatches": {
                "default": 0,
                "description": "Mismatches tolerated per primer during PCR prediction (0–10).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "templateCircular": {
                "default": false,
                "description": "Treat insertTemplate as circular (e.g. amplifying from a plasmid).",
                "type": "boolean"
              }
            },
            "required": ["claimedConstruct", "insertForwardPrimer", "insertReversePrimer", "insertTemplate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a claimed construct"
          },
          "behavior": {
            "destructive": false,
