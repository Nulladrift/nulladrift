        },
        {
          "name": "rna_fold",
          "title": "RNA Secondary Structure (MFE)",
          "description": "Predict an RNA secondary structure by minimum free energy (MFE) with ViennaRNA's full Turner 2004 loop model at 37 °C (no pseudoknots). Returns the dot-bracket structure, the MFE (kcal/mol), the list of base pairs, and the engine that produced them. PREDICTED, NOT MEASURED. Benchmarks of MFE folding against known structures put single-sequence accuracy near 40-70% of base pairs recovered, falling as the sequence gets longer; no held-out statistic is measured here. The MFE structure is one structure out of an ensemble, and a second structure within a fraction of a kcal/mol of it is common. Valid for: a single strand up to 3,000 nt at a fixed 37 °C (600 nt when folded in the workbench, which runs the fallback engine in the browser). No pseudoknots, no two-strand hybridization — use oligo_cofold for that — and no temperature dependence, so a structure predicted here is not a structure at your annealing temperature.",
          "inputSchema": {
