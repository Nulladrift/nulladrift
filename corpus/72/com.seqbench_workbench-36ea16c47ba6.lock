        {
          "name": "riboswitch_states",
          "title": "Fold a riboswitch with and without its ligand",
          "description": "Fold a transcript twice — once freely, once with the aptamer held out of the secondary structure as a bound ligand would hold it — and report what changes at the ribosome binding site. Returns both structures, both free energies, the cost of occupying the aptamer, and whether the site becomes more or less accessible. This is the question a riboswitch design can be checked on before the bench: is the site sequestered in one state and free in the other. Returns NO activation ratio and no fold-change — see this tool's validation note for why that number is not offered. Pair with rbs_occlusion, which finds what can pair over the site in the first place. PREDICTED, NOT MEASURED. None is published for this combination, and none is claimed. The two folds are ViennaRNA MFE structures with its documented parameter set; what is NOT established is that the ligand-bound state is modelled correctly by holding the aptamer out of the secondary structure, which is an approximation of a three-dimensional binding event. No activation ratio is returned, because the only published validation set for predicting one (Espah Borujeni et al., NAR 2016;44(1):1) is CC BY-NC and unusable here. Valid for: single-strand RNA up to 1,000 nt at one temperature, with no pseudoknots and no tertiary structure. A translational riboswitch whose mechanism is sequestering the ribosome binding site — NOT transcriptional attenuators, NOT ribozymes, and NOT any switch whose aptamer overlaps the site it regulates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aptamerEnd": {
                "description": "1-based end of the aptamer.",
                "type": "integer"
              },
              "aptamerStart": {
                "description": "1-based start of the aptamer — the region the ligand occupies. Omit both ends to fold freely and only report the site's accessibility.",
                "type": "integer"
              },
              "sequence": {
                "description": "The transcript: aptamer, expression platform, and at least the start of the CDS. DNA or RNA. Max 1,000 nt, because it is folded twice.",
                "residues": "nt",
                "type": "string"
              },
              "siteEnd": {
                "description": "1-based end of that region.",
                "type": "integer"
              },
              "siteStart": {
                "description": "1-based start of the region whose accessibility is the answer. Omit both ends and the ribosome footprint is located automatically from the first start codon and its Shine-Dalgarno.",
                "type": "integer"
              },
              "temperature": {
                "default": 37,
                "description": "Folding temperature in °C. A switch characterised at 37 °C is not a switch at 30 °C.",
                "maximum": 120,
                "minimum": -20,
                "type": "number"
              }
            },
            "required": ["sequence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fold a riboswitch with and without its ligand"
