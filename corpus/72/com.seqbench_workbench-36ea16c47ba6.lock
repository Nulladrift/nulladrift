        },
        {
          "name": "centrifuge_conversion",
          "title": "RPM ↔ RCF converter",
          "description": "Convert between rotor speed (RPM) and relative centrifugal force (×g) for a given rotor radius, in either direction. The conversion is exact physics — RCF = ω²r/g — and the only judgement in it is which radius: a protocol's ×g conventionally means the rotor's MAXIMUM radius, and using the wrong one scales the force by the ratio of the two.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "radiusCm": {
                "description": "Rotor radius in cm — the maximum radius, from the rotor manual. Required: there is no typical rotor to assume.",
                "type": "number"
              },
              "rcf": {
                "description": "Relative centrifugal force in ×g. Give this OR rpm.",
                "type": "number"
              },
              "rpm": {
                "description": "Speed in revolutions per minute. Give this OR rcf.",
                "type": "number"
              }
            },
            "required": ["radiusCm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "RPM ↔ RCF converter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:944e4fdc0b1584f989df75576c8a7a622da2e7af4138efb4c97a8bfd1a574e2c"
        },
        {
          "name": "characterize_sequence",
          "title": "Characterize sequence",
          "description": "One-paste 'tell me everything': auto-detects DNA/RNA/protein, then reports composition, ORFs, single-cutter enzymes, end primers or protein properties, plus a BLAST link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "circular": {
                "default": false,
                "description": "Treat the molecule as a circle when scanning enzyme sites, so one that cuts across the origin is counted. Off by default because this tool is as often handed a PCR product as a plasmid.",
                "type": "boolean"
              },
              "endPrimerLength": {
                "default": 20,
                "description": "Length of the naive end primers taken from each end.",
                "type": "integer"
              },
              "maxOrfs": {
                "default": 8,
                "description": "Maximum number of ORFs to return, longest first.",
                "type": "integer"
              },
              "minOrfAa": {
                "default": 40,
                "description": "Minimum ORF length in amino acids (nucleotide input only).",
                "type": "integer"
              },
              "sequence": {
                "description": "Nucleotide or protein sequence (raw or FASTA; IUPAC accepted). The alphabet is detected.",
                "residues": "any",
                "type": "string"
              }
            },
            "required": ["sequence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Characterize sequence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
