                "enum": ["hg19", "hg38"],
                "type": "string"
              },
              "variant": {
                "description": "An rsID (\"rs1042522\"), chrom:pos:ref:alt with either separator (\"17:7676154:G:C\" or \"17-7676154-G-C\", single-base substitutions only), genomic HGVS (\"chr17:g.7676154G>C\" or \"17:g.7676154G>C\"), or transcript HGVS c. (\"NM_000546.6:c.215C>G\" or \"TP53:c.215C>G\").",
