        {
          "name": "crispr_grna_design",
          "title": "CRISPR gRNA designer",
          "description": "Find and score candidate guide RNAs (protospacer + PAM) in a target DNA for common nucleases (SpCas9, SpCas9-NG, SaCas9, Cas12a). PREDICTED, NOT MEASURED. No held-out skill statistic is claimed. Both are pre-2016 models, superseded by Rule Set 3 (DeWeirdt et al., Nat Commun 2022) and by DeepHF. Rule Set 3 IS now shipped here, as crispr_ontarget, and unlike these two it carries a held-out calibration: on an independent tiling library, 87.7% / 74.9% / 82.0% of its lowest-scoring guides landed in the bottom two activity quintiles. Prefer it for SpCas9 with an NGG PAM; DeepHF is still not shipped. Treat these two as a ranking aid, not an efficiency prediction. Valid for: SpCas9 with an NGG PAM and a 20 nt spacer, and only when enough genomic flanking context is present to build the model's 30-mer / 35-mer window — both scores are null rather than padded otherwise. Nothing is predicted for SaCas9, Cas12a or SpCas9-NG.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "minScore": {
                "default": 0,
                "description": "Only return guides with a heuristic score at least this high (0–100).",
                "type": "number"
              },
              "nuclease": {
                "default": "spcas9",
                "description": "Nuclease id. Omit to just list the available nucleases (no scan is performed).",
                "enum": ["spcas9", "spcas9ng", "sacas9", "cas12a"],
                "type": "string"
              },
              "searchReverseStrand": {
                "default": true,
                "description": "Also scan the reverse strand for guides.",
                "type": "boolean"
              },
              "sequence": {
                "description": "Nucleotide sequence (raw or FASTA; IUPAC accepted).",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["sequence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CRISPR gRNA designer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2eb10853d2a237f79407dc2b58b0b5d98637254ca3f2438a0aa503439bb8d89f"
        },
        {
          "name": "crispr_hdr_donor",
          "title": "HDR donor designer",
          "description": "Build an HDR donor (homology arms flanking an edit) from a target sequence and either an explicit edit window (editStart/editEnd) or a guide's cut site (guideStart/guideEnd/guideStrand/nuclease — SpCas9-family only; Cas12a's staggered cut needs an explicit editStart/editEnd). Also designs genotyping primers spanning the edit site on the original sequence (a real size-shift or sequencing target to confirm the edit), reusing the same primer-design engine as primer_design.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "armLength": {
                "default": 500,
                "description": "Homology arm length (bp) on each side. Use ~30–60 for an ssODN donor, ~500–1000 for a dsDNA donor plasmid.",
                "type": "integer"
              },
              "blockPam": {
                "default": true,
                "description": "When a SpCas9-family guide is supplied and the edit does not already disrupt its PAM, fold a PAM-blocking mutation (silent when a CDS frame is given) into the donor so the edited allele can't be re-cut.",
                "type": "boolean"
              },
              "designGenotypingPrimers": {
                "default": true,
                "description": "Also design a primer pair (on the original targetSequence) whose product spans the edit site.",
                "type": "boolean"
              },
              "editEnd": {
                "description": "1-based inclusive end of the region being replaced; editEnd = editStart-1 denotes a pure insertion with nothing removed. Omit to derive from the guide's cut site.",
                "type": "integer"
              },
              "editStart": {
                "description": "1-based start of the region being replaced. Omit to derive from guideStart/guideEnd/guideStrand instead.",
                "type": "integer"
              },
              "frameStart": {
                "description": "Optional 1-based CDS reading-frame start; makes the PAM-blocking mutation synonymous where possible.",
                "type": "integer"
              },
              "guideEnd": {
                "description": "1-based forward-strand end of the guide's protospacer.",
                "type": "integer"
              },
              "guideStart": {
                "description": "1-based forward-strand start of the guide's protospacer (alternative to editStart/editEnd, for an insertion exactly at the cut site).",
                "type": "integer"
              },
              "guideStrand": {
                "description": "Strand the guide's protospacer is on.",
                "enum": ["+", "-"],
                "type": "string"
              },
              "nuclease": {
                "default": "spcas9",
