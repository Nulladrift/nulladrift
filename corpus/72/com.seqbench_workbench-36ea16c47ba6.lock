        {
          "name": "plasmid_annotate",
          "title": "Plasmid annotator",
          "description": "Auto-detect common cloning features (promoters, tags, origins, resistance markers, MCS, primers) on both strands. Signatures under 20 bp must match exactly; longer ones tolerate up to ~10% mismatches so point mutants still annotate — each feature reports its own `mismatches` count and an `exact` flag. IMPORTANT: `start`, `end` and `length` are the span of the SIGNATURE that matched, not of the biological feature — this is a signature scan, not a gene finder, so AmpR on pUC19 comes back as the 36 bp that identify it and not as the 861 bp bla gene. Use the coordinates to locate a feature, never to measure one.",
