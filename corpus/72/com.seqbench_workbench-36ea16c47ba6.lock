            "properties": {
              "from": {
                "description": "Source id type: \"Gene_Name\", \"Ensembl\", \"GeneID\", \"RefSeq_Protein\", or \"UniProtKB_AC-ID\". UniProt's mapping graph is hub-and-spoke — see the \"to\" note.",
