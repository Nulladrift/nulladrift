        },
        {
          "name": "ortholog_map",
          "title": "Find orthologs/paralogs for gene symbols across species",
          "description": "Look up the orthologous (or paralogous) gene for up to 50 gene symbols in a target species. Orthologues between human, mouse, rat, zebrafish, chicken, cow, pig, dog, frog, macaque and chimp come from NCBI's ortholog set, with each ortholog's own symbol; paralogues, and orthologues involving any other species (fly, worm, yeast), from Ensembl's homology endpoint, which is slower. `source` says which answered. Symbols with no record are reported in `unmapped`, never silently dropped.",
