        {
          "name": "trace_secondary_peaks",
          "title": "Mixed bases and the uncalled tail of a Sanger trace",
          "description": "Read a chromatogram for what the basecaller did not report: positions where a second dye is present under the called base (a heterozygote, or a contaminating template), and bases still visible in the scan past where base calling stopped. Both are arithmetic on the channel intensities already in the file — a ratio, and a peak position extrapolated from the median spacing — not a model. Returns the called sequence rewritten with IUPAC ambiguity codes, the extra bases, and every threshold that produced the answer. Takes the SCAN arrays, because the tail lies past the last peak location.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "baseCalls": {
                "description": "Base calls, e.g. from parse_sanger_trace.",
