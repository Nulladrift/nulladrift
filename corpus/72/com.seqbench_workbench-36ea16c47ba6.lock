        {
          "name": "whole_plasmid_verify",
          "title": "Whole-plasmid sequencing: consensus vs design",
          "description": "Compare a whole-plasmid sequencing CONSENSUS (the single circular FASTA a nanopore plasmid service returns) against the design it was supposed to be, and say whether they are the same molecule. Finds the rotation and strand itself — an assembler starts the circle wherever it landed and half the time returns the reverse complement, so the two almost never line up as written — then reports every difference in the DESIGN's own coordinates. Each difference carries the length of the identical-base run it sits in, because a 1 bp indel inside a homopolymer is both the commonest long-read basecalling artefact and what a real slippage mutation looks like, and a bare difference list cannot tell them apart. Pass the design as an annotated GenBank record and every difference is also read against its features: silent, missense with the codon number, or a premature stop. Complements sequencing_readback_verify, which aligns raw READS through minimap2; this one needs no reads and no sidecar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "circular": {
                "default": true,
                "description": "Treat both as circular (the default, and right for a plasmid). The consensus is then rotated and, if needed, reverse-complemented into the design's frame before anything is compared. Turn it off only for a linear product, where the ends are meaningful.",
                "type": "boolean"
              },
              "consensus": {
                "description": "The assembled consensus from the sequencing service, raw or FASTA. One record.",
                "residues": "nt",
                "type": "string"
              },
              "design": {
                "description": "What you meant to build: raw bases, FASTA, or your annotated GenBank record. An annotated record is what turns a position into a consequence.",
                "type": "string"
              }
            },
            "required": ["consensus", "design"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Whole-plasmid sequencing: consensus vs design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f79bd89b16a479ff54be8e1c3ae3f6c2b2e015906859be8e6e39629f25d29451"
        },
        {
          "name": "workflow",
          "title": "Batch workflow (multi-tool pipeline)",
          "description": "Run an ordered multi-tool pipeline over many records. One sequence value can be chained between steps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "description": "Multi-FASTA or one sequence/identifier per line.",
