        {
          "name": "nonrepetitive_parts_find",
          "title": "Find a non-repetitive subset of existing parts",
          "description": "Given a toolbox of genetic parts, return the largest subset in which no two parts share more than a chosen length of sequence — on either strand. Parts that share a long stretch recombine into each other in a multi-part assembly and are the single largest cause of DNA synthesis failure, and neither shows up when the parts are checked one at a time. Reports every conflicting pair and why each dropped part was dropped. Deterministic: no model, no rate, no score. Use nonrepetitive_parts_design to build new parts instead of selecting from existing ones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bothStrands": {
                "default": true,
                "description": "Count a shared stretch even when one part carries it reverse-complemented. Recombination and synthesis both see both strands, so leaving this on is almost always right.",
                "type": "boolean"
              },
              "lmax": {
                "default": 15,
                "description": "Longest stretch two parts may share, in bp (default 15). Two parts conflict when they share MORE than this. Below 8 bp every pair of sequences matches by chance.",
                "maximum": 40,
                "minimum": 8,
                "type": "integer"
              },
              "parts": {
                "description": "The toolbox as (multi-)FASTA — each record's header becomes the part's name. Max 4,000 parts, 5,000 bp each.",
                "type": "string"
              },
              "strategy": {
                "default": "2apx",
                "description": "Which approximation picks the subset. Maximum independent set is NP-hard, so neither is guaranteed largest: '2apx' is the standard 2-approximation, 'greedy' repeatedly drops the most-conflicting part. Try both — they disagree on real toolboxes.",
                "enum": ["2apx", "greedy"],
                "type": "string"
              }
            },
            "required": ["parts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a non-repetitive subset of existing parts"
          },
          "behavior": {
            "destructive": false,
