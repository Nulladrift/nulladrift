              "channelA": {
                "description": "Full A channel, indexed by SCAN (not by base).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "channelC": {
                "description": "Full C channel, indexed by scan.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "channelG": {
                "description": "Full G channel, indexed by scan.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "channelT": {
                "description": "Full T channel, indexed by scan.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "maxExtension": {
                "default": 400,
                "description": "Most extra bases to call past the last called base (0-400). The cap is part of the method: peak positions are extrapolated and the extrapolation drifts.",
                "type": "number"
              },
              "mixedRatio": {
                "default": 0.25,
                "description": "Secondary/primary intensity ratio at which a position is reported as mixed (0-1 exclusive). A convention, not a measurement.",
                "type": "number"
              },
              "peakLocations": {
                "description": "Scan index of each called base's peak — one per base call.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "quality": {
                "description": "Optional per-base Phred scores; echoed beside each mixed position.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "skipLeading": {
                "default": 40,
                "description": "Bases at the read's start excluded from the mixed scan (0-1000). The dye blob lives here and lifts every channel; without this every read reports a wall of false heterozygotes at its start.",
                "type": "number"
              },
              "tailSignalToNoise": {
                "default": 3,
                "description": "How far above the measured noise floor a channel must sit before the tail extension calls it (1-100).",
