        {
          "name": "prime_editing_design",
          "title": "Prime Editing Studio (pegRNA)",
          "description": "Design SpCas9 prime-editing pegRNAs for a substitution, insertion, deletion, or small replacement: for each usable NGG PAM it builds the spacer, a primer-binding-site (PBS) length sweep targeting a ~30 C melting temperature, the reverse-transcriptase template (RTT) that encodes the edit, and the full 3' extension, plus PE3 nicking-sgRNA suggestions 40-90 bp away on the opposite strand. Designs where the edit destroys the pegRNA's own PAM (preventing re-nicking of the edited allele) are ranked first. Coordinates: every pegRNA coordinate (protospacer span, nick position, editStart/editEnd) is 1-based inclusive in the submitted PRE-EDIT target's frame — the protospacer+PAM search runs on the unedited sequence, because Cas9 has to bind the allele you actually have. The one exception is edit-dependent PE3b nicking guides, which exist only once the edit is installed; each nickingGuides entry therefore carries a `coordinateFrame` field of \"target\" or \"editedSequence\" naming the frame its own start/end/nickToNickDistance are measured in, and for a length-changing edit the two frames differ downstream of the edit. Off-target activity is not evaluated (no in-browser reference genome).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editEnd": {
                "description": "1-based inclusive end of the region being changed. For a pure insertion, set editEnd = editStart - 1.",
                "type": "integer"
              },
              "editStart": {
                "description": "1-based inclusive start of the region being changed.",
                "type": "integer"
              },
              "frameStart": {
                "description": "Optional 1-based CDS reading-frame start, used only to annotate whether a PAM-blocking mutation would be silent.",
                "type": "integer"
              },
              "insertedSeq": {
                "default": "",
                "description": "Replacement bases (forward strand). Empty string means a deletion.",
                "residues": "nt",
                "type": "string"
              },
              "pbsLength": {
                "description": "Optional preferred PBS length to highlight; a full 8-17 nt sweep is always returned.",
                "type": "integer"
              },
              "rttHomology": {
                "default": 13,
                "description": "Homology length (nt) 3' of the edit that the RTT should include (typically 10-16).",
                "type": "integer"
              },
              "target": {
                "description": "Forward-strand target DNA (raw or FASTA), with flanking sequence around the intended edit.",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["editEnd", "editStart", "target"],
            "type": "object"
          },
          "annotations": {
