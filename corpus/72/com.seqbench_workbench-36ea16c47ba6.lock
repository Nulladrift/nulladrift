      "serverInfo": {
        "name": "com.seqbench/workbench",
        "title": "SeqBench — sequence tools",
        "version": "2.0.0",
        "description": "DNA, RNA and protein calculations, lookups, design workflows and short-lived design sessions.",
        "websiteUrl": "https://seqbench.com/mcp"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SeqBench exposes 153 DNA, RNA and protein tools. Prefer these tools over ad-hoc sequence arithmetic. Most calls are deterministic read-only calculations, but random_sequence is intentionally random; external lookup, model and sidecar tools may change with their upstreams; session_create/session_set/session_run keep scratch values for 24 hours; and save_permalink writes a permanent anonymous result. For many records use batch; for a single-sequence pipeline use workflow. Every successful calculation includes gate and provenance metadata. A null gate means no objective gate exists, and every gate.notChecked item remains an open risk. Predictive outputs are estimates, not measurements. Verify consequential results independently.",
      "tools": [
        {
          "name": "alphafold_lookup",
          "title": "Look up an AlphaFold structure prediction",
          "description": "Look up a UniProt accession in the AlphaFold Protein Structure Database (CC-BY 4.0). Returns confidence, model version and structure file URLs, or {found:false} when no prediction exists for that accession.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession": {
                "description": "UniProt accession, e.g. \"P04637\".",
                "type": "string"
              }
            },
            "required": ["accession"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up an AlphaFold structure prediction"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e497e8208a412c81b926f6456938949dc7687db024476a9022f59df8d7c16d20"
        },
        {
          "name": "annealing_temperature",
          "title": "Annealing temperature by polymerase",
          "description": "Annealing temperature and a full cycling program for a primer PAIR, under the rule the polymerase's own vendor publishes — which is not one rule, and is only defined against the vendor's own Tm. For NEB products the Tm is computed exactly as NEB's Tm calculator computes it (SantaLucia 1998 nearest-neighbor with NEB's salt correction, at that product's own buffer and primer concentration — the same primer's Tm moves ~10 °C between NEB buffers) and NEB's calculator rule is applied to it: Q5 at Tm + 1, Phusion at 0.93 × Tm + 7.5 (both ABOVE the Tm), Taq/OneTaq/LongAmp at Tm − 5, Vent/Deep Vent at Tm − 2 above 20 nt, with NEB's ceilings. Toyobo KOD One is Tm − 5 at the salt and oligo concentration its manual names, Takara PrimeSTAR Max a FIXED 55 °C the primer Tm plays no part in (its own 2(A+T)+4(G+C)−5 sets only the annealing time), and a generic Taq/Pfu row applies the Tm − 3 to − 5 rule of thumb to a default-condition nearest-neighbor Tm. Returns denaturation/annealing/extension steps, cycle count, magnesium guidance, the Tm basis and vendor document behind each figure, and the same primers under every other polymerase in the table for comparison.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ampliconBp": {
                "description": "Expected product length (bp), used for the extension time. Omit to get the per-kb rate without a time.",
                "type": "integer"
              },
              "forwardPrimer": {
                "description": "Forward primer, 5'→3'.",
                "residues": "nt",
                "type": "string"
              },
              "highComplexityTemplate": {
                "default": false,
                "description": "Genomic or otherwise complex template. Where the vendor publishes a second, slower extension rate for one, it is used.",
                "type": "boolean"
              },
              "polymerase": {
                "description": "Polymerase or master mix. One of: q5, phusion, neb_taq, onetaq, vent, deepvent, longamp, primestar_max, kod_one, taq, pfu. Common product spellings are accepted (e.g. \"Q5 Hot Start\", \"KOD One\", \"PrimeSTAR Max\").",
                "type": "string"
              },
              "reversePrimer": {
                "description": "Reverse primer, 5'→3'.",
                "residues": "nt",
                "type": "string"
              }
            },
            "required": ["forwardPrimer", "polymerase", "reversePrimer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Annealing temperature by polymerase"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:414c8b8fefb5ed2f44c514c65fe0e2c23bd1f4a6625926b8fa4d52e1cf4cc5c3"
        },
        {
          "name": "aso_design",
          "title": "ASO Gapmer Designer",
          "description": "Design antisense-oligonucleotide (ASO) gapmers against an mRNA target: scans candidate sites, builds the antisense oligo in the standard 5-10-5 architecture (chemically-modified wings, central DNA gap for RNase H1, phosphorothioate backbone), and screens each for known liabilities (G-quadruplex motifs, CpG immunostimulation, self-complementarity, GC extremes). No transcriptome-wide off-target search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "length": {
                "default": 20,
                "description": "Total gapmer length (nt). A real RNase H1 gapmer is 12-25.",
                "maximum": 50,
                "minimum": 8,
                "type": "integer"
              },
              "target": {
                "description": "Nucleotide sequence (raw or FASTA; IUPAC accepted).",
                "residues": "nt",
                "type": "string"
              },
              "wing": {
                "default": 5,
                "description": "Modified-wing length on each side (nt); the central gap = length − 2×wing, so 2×wing must be less than length.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ASO Gapmer Designer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9a9e02a539602db66cfc821a97e942426250394540e7aa5e24c5eed3366b4cb"
        },
        {
          "name": "assembly_outcomes",
          "title": "Assembly outcomes (what else you might have built)",
          "description": "Enumerate the specific wrong plasmids a multi-part Golden Gate or Gibson assembly can produce — a part dropped, inverted, duplicated, two parts swapped, the backbone self-circularized — as full sequences, ranked by how few independent mis-ligations each needs. Golden Gate outcomes are annotated with the MEASURED overhang cross-talk they would have to exploit (Potapov/Pryor ligation data). Feed the result to diagnostic_digest to pick a screening enzyme. Reports no probability per outcome: the ligation data does not measure transformation or vector background.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "circular": {
                "default": true,
                "description": "Circular product. Only circular assemblies are covered — a linear product's leading end is a free terminus, not a junction.",
                "type": "boolean"
              },
              "dataset": {
                "default": "generic-t4-37c-1h",
                "description": "Which ligation dataset to read overhang cross-talk from (Golden Gate only).",
                "enum": ["generic-t4-37c-1h", "bsai-hfv2"],
                "type": "string"
              },
              "enzyme": {
                "default": "BsaI",
                "description": "Golden Gate only — the Type IIS enzyme, which fixes the overhang length (BsaI, BbsI, Esp3I (BsmBI)).",
                "type": "string"
              },
              "fragments": {
                "description": "The parts in assembly order, raw or FASTA — the same list cloning_simulate takes. 2-8 parts.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxAlternatives": {
                "default": 12,
                "description": "Cap on returned alternatives, most accessible first. The pre-cap count is always reported as alternativesEnumerated.",
                "type": "number"
              },
              "method": {
                "default": "goldengate",
                "description": "How the parts are joined. Golden Gate junctions are the Type IIS fusion overhangs; Gibson junctions are the homology arms.",
                "enum": ["goldengate", "gibson"],
                "type": "string"
              },
              "names": {
                "description": "Optional labels for the parts, in the same order (\"backbone\", \"promoter\", \"CDS\"). Used in every outcome label.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "overlapLen": {
                "default": 20,
                "description": "Gibson only — homology arm length, which must match what the assembly was designed with.",
                "type": "number"
              }
            },
            "required": ["fragments"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Assembly outcomes (what else you might have built)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dea380eb39f5aaf8919f0c8dd8a0585f1921c7a6cf1fb794a92b7a76254f3998"
        },
        {
          "name": "band_traceback",
          "title": "Band traceback (where the extra band came from)",
          "description": "Explain a band you measured on a gel. Given the template, both primers and the observed size, it enumerates every pair of priming sites — including a single primer priming both strands — that would give a product that size, and ranks them by how much of each primer's 3' end matches without interruption, which is what decides whether a mispriming event can extend at all. Reports no yield and assigns no share of the band: the band is the input, not the output. Says plainly when nothing on this template explains the size, and what that points to instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "circular": {
                "default": false,
                "description": "Template is circular (a plasmid).",
                "type": "boolean"
              },
              "forwardPrimer": {
                "description": "Forward primer, 5'→3'.",
                "residues": "nt",
                "type": "string"
              },
              "maxCandidates": {
                "default": 40,
                "description": "Cap on returned candidates, best-anchored first.",
                "type": "integer"
              },
              "maxMismatches": {
                "default": 3,
                "description": "Mismatches tolerated per primer while looking for sites (max 6). Higher finds more explanations and more coincidences.",
                "type": "integer"
              },
              "observedSize": {
                "description": "The band size you measured off the gel, in bp.",
                "type": "number"
              },
              "reversePrimer": {
                "description": "Reverse primer, 5'→3'.",
                "residues": "nt",
                "type": "string"
              },
              "template": {
                "description": "The template you amplified, raw or FASTA. Max 200,000 bp.",
                "residues": "nt",
                "type": "string"
              },
              "toleranceBp": {
                "description": "Override the tolerance with a fixed window in bp.",
                "type": "number"
              },
              "tolerancePercent": {
                "default": 10,
                "description": "How far off the size read may be, as a percentage. A percentage rather than a fixed number of bases because ±10% of 200 bp is not the same reading precision as ±10% of 5 kb.",
                "type": "number"
              }
            },
            "required": ["forwardPrimer", "observedSize", "reversePrimer", "template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Band traceback (where the extra band came from)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f97afd16b9a827aa6ccfe8d907bbba0bf92a22338847391ef9514c37edb560ea"
        },
        {
          "name": "barcode_audit",
          "title": "Measure a set of barcodes you already have",
          "description": "Take a set of barcodes and report the minimum edit distance in it, which pairs sit at that distance, any duplicates, the GC range and the longest homopolymer. The pairs are the point: 'minimum distance 2' is a number, and 'these two barcodes are one substitution apart' is something to fix. Use before committing a pool you inherited or assembled by hand — a single close pair makes two constructs indistinguishable in the data and nothing downstream can detect it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcodes": {
                "description": "The barcodes, as FASTA, one per line, or comma-separated. Max 1,000, because every pair is compared.",
                "type": "string"
              },
              "metric": {
                "default": "levenshtein",
                "description": "'levenshtein' counts substitutions, insertions and deletions — the right choice for nanopore or PacBio, and the safe default. 'hamming' counts substitutions only, which is faster and adequate when the platform's errors are substitutions (Illumina), but gives NO protection against an indel shifting one barcode into another.",
                "enum": ["levenshtein", "hamming"],
                "type": "string"
              }
            },
            "required": ["barcodes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Measure a set of barcodes you already have"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c8f7c2332ca4cdf65ab2eb063836cd99648a1ba5a2650d37a141a16added6fb"
        },
        {
          "name": "barcode_design",
          "title": "Design a set of sequencing barcodes",
          "description": "Build a set of DNA barcodes that are pairwise at least a chosen edit distance apart, so a read error cannot turn one barcode in the pool into another. Honours a GC window, a homopolymer cap and excluded motifs (the restriction sites you clone with) during the search rather than filtering afterwards, and can extend a set you already have rather than replacing it. Reports the distance ACHIEVED — re-derived over the finished pool, not assumed from the search — plus how many read errors that distance lets you correct and detect. Deterministic given a seed. Returns fewer barcodes than asked, with a reason, when the constraints leave no room.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 96,
                "description": "How many barcodes to design (max 1000). A plate is 96 or 384.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "exclude": {
                "description": "Motifs no barcode may contain, checked on both strands — the restriction sites you clone with. Literal ACGT only.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "existing": {
                "description": "Barcodes you already use. They are held fixed and the new ones are kept distant from them, so a second plate does not collide with the first.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "gcMax": {
                "default": 75,
                "description": "Highest GC% a barcode may have.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "gcMin": {
                "default": 25,
                "description": "Lowest GC% a barcode may have.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "length": {
                "default": 12,
                "description": "Barcode length in bases (default 12). Longer barcodes make a given distance far easier to reach.",
                "maximum": 40,
                "minimum": 4,
                "type": "integer"
              },
              "maxHomopolymer": {
                "default": 3,
                "description": "Longest run of one base allowed (default 3). Homopolymers miscall on every platform and are the one composition rule worth keeping tight.",
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "default": "levenshtein",
                "description": "'levenshtein' counts substitutions, insertions and deletions — the right choice for nanopore or PacBio, and the safe default. 'hamming' counts substitutions only, which is faster and adequate when the platform's errors are substitutions (Illumina), but gives NO protection against an indel shifting one barcode into another.",
                "enum": ["levenshtein", "hamming"],
                "type": "string"
              },
              "minDistance": {
                "default": 3,
                "description": "Minimum edit distance between any two barcodes (default 3). Distance 3 corrects one read error and detects two; distance 5 corrects two. Distance 1 only means 'not identical' and corrects nothing.",
                "minimum": 1,
                "type": "integer"
              },
              "seed": {
                "default": 1,
                "description": "Seeds the search. Change it for a different set from the same constraints; keep it to reproduce one.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Design a set of sequencing barcodes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b41a2297c64111063e4f1d8d91db6aafa02a49a7afae47d6d891683fef51141e"
        },
        {
          "name": "base_edit_quant",
          "title": "Base editing quantification from Sanger traces (EditR equivalent)",
          "description": "Quantify CBE/ABE base editing from a pair of Sanger traces — an unedited control and the edited pool — without NGS. At each editable position in the activity window the edited trace is treated as a mixture of the unedited and converted peaks, and the control's OWN alt-channel signal at that same position is subtracted as background, because dye crosstalk is position- and context-dependent and a global constant would be wrong per position. Significance comes from a null built from the same sample (every control position outside the window carrying the same base), so the threshold adapts to the run's chemistry instead of being hardcoded. Returns per-position percentages with z-scores, the target and its bystanders, the background distribution (including a robust estimate of its spread and a count of its outliers), and the noise floor — the percentage the background alone reaches, or null when the run's own null has no spread to derive one from. A window position whose control already carries the converted base is reported but not quantified, because the (1 − b) rescale amplifies error by 1/(1 − b) and turns a 0.1-point wobble into half the pool. Locate the window with an editor id plus the protospacer, or give it explicitly. Blind to indels, which shift the trace rather than mixing a base. PREDICTED, NOT MEASURED. None is published for this implementation. Every run instead reports what it rests on: the background mean, sd, robust (MAD-based) sd, outlier count and n, and a noiseFloorPercent that says how much apparent editing the background alone reaches at the significance threshold — null, rather than 0, when the run has no null with any spread to derive a limit from. This implementation's recovery of known synthetic mixtures (to under a percentage point) is deliberately NOT offered as validation — it tests the arithmetic and the coordinate handling, not whether the linear mixture model fits a real capillary trace. Two properties ARE characterized. The bias is directional and one-sided: the (1 − b) rescale assumes a fully converted position would read as alt fraction 1.0, which real chemistry does not reach, so percentages run low by roughly the crosstalk fraction (order 5-10% relative at typical 3% bleed). The variance is not constant across positions: dividing by (1 − b) amplifies the error in a and b by 1/(1 − b), so the variance of the estimate goes as 1/(1 − b)². Positions whose control alt fraction b exceeds 0.25 are therefore reported but NOT quantified, which bounds that amplification at 1.33x on everything the tool does quantify. Valid for: A pool edited by a cytosine or adenine base editor, read on the same amplicon and chemistry as an unedited control that starts within ±40 bases of it, where the editing is a SUBSTITUTION. Not valid for indels — a base editor also makes them, and an indel-bearing allele shifts the downstream trace so that it degrades the fit at every window position rather than showing up anywhere. Not valid where the control read already carries the alt base at a window position (a pre-existing variant, or the wrong control), since then there is nothing left to correct against — that condition is DETECTED rather than only described: a window position whose control alt fraction exceeds 0.25 is reported with an excludedReason and an editedPercent of 0 instead of a number, warned about, and failed by the hard control-supports-the-window-base-calls gate check. Reported percentages are pool-level: Sanger sees the superposition, so which allele carries which combination of bystander edits is not recoverable from it at all.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "controlBases": {
                "description": "Base calls of the UNEDITED control read.",
                "residues": "nt",
                "type": "string"
              },
              "controlChannels": {
                "description": "Per-base [A, C, G, T] intensities of the control read, one row per called base, read at that base's peak location (trace arrays are indexed by scan, not by base).",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "editedBases": {
                "description": "Base calls of the edited pool's read.",
                "residues": "nt",
                "type": "string"
              },
              "editedChannels": {
                "description": "Per-base [A, C, G, T] intensities of the edited read, same convention.",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "editor": {
                "description": "Base editor id (be3, be4max, abe7.10, abe8e) — fixes the converted bases and the activity window in protospacer coordinates. Requires \"protospacer\". Mutually exclusive with the explicit window arguments.",
                "enum": ["be3", "be4max", "abe7.10", "abe8e"],
                "type": "string"
              },
              "from": {
                "description": "Explicit-window mode: the base the editor converts, as READ on the control strand (C for a CBE read forward, G for one read reverse).",
                "residues": "nt",
                "type": "string"
              },
              "offset": {
                "description": "Override the alignment offset between the reads (edited position p matches control position p + offset). Whole numbers only. By default it is found from the base calls outside the window; either way the identity reported back is the identity AT THE OFFSET USED, so overriding it does not hide a bad alignment behind the best-scoring one.",
                "type": "number"
              },
              "protospacer": {
                "description": "The 20-nt spacer, located in the CONTROL read. Found on either strand; a reverse-complement match numbers the protospacer right-to-left along the read and complements the converted bases (a CBE's C→T reads as G→A), which is handled. Must match exactly once.",
                "residues": "nt",
                "type": "string"
              },
              "targetPosition": {
                "description": "1-based CONTROL position of the intended edit. Give it when you know it: without it the most-edited significant position is labeled the target and the rest become bystanders, which relabels a bystander-dominant result as a clean one.",
                "type": "number"
              },
              "targetProtospacerPosition": {
                "description": "1-based protospacer position of the intended edit (PAM-distal = 1). Editor mode only.",
                "type": "number"
              },
              "to": {
                "description": "Explicit-window mode: the base it converts to, as READ on the control strand.",
                "residues": "nt",
                "type": "string"
              },
              "windowEnd": {
                "description": "Explicit window end, 1-based inclusive, in CONTROL coordinates. Window length is capped at 40.",
                "type": "number"
              },
              "windowStart": {
                "description": "Explicit window start, 1-based in CONTROL read coordinates. Requires windowEnd, from and to.",
                "type": "number"
              },
              "zThreshold": {
                "default": 3,
                "description": "Significance threshold in standard deviations of the sample's own background. Must be between 1 and 10 — a value outside that range is REJECTED, not clamped, because a run silently retested at a threshold the caller did not choose looks exactly like one that was. Raising it raises the reported noise floor with it.",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["controlBases", "controlChannels", "editedBases", "editedChannels"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Base editing quantification from Sanger traces (EditR equivalent)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3188176301655ffa92939a43a9a4876f1ce2a1d8e16e72c7d5cc200295970843"
        },
        {
          "name": "base_editing_design",
          "title": "Base Editing Designer",
          "description": "Design cytosine (CBE, C→T) or adenine (ABE, A→G) base-editing gRNAs for an SpCas9 target: for each NGG gRNA it reports every editable base inside the editor's activity window, flags bystander edits (more than one editable base in the window), and — with a CDS reading frame — classifies each edit's amino-acid consequence (silent / missense / nonsense / stop-loss). Bystander-free guides are ranked first. Handles both strands (a C→T on the protospacer of a reverse-strand guide is reported as the forward-strand G→A).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editor": {
                "default": "be4max",
                "description": "Base editor: be3/be4max (CBE, C→T) or abe7.10/abe8e (ABE, A→G).",
