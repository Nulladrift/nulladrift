        {
          "name": "plasmid_dossier",
          "title": "Unknown plasmid: what is it and what do I plate on",
          "description": "Answer the question someone holding an unlabelled tube actually has, rather than returning another feature list: which antibiotic to select on, which host will carry it and at roughly what copy number, which curated backbone it resembles, and what on it will bite you later (duplicate markers, two origins for the same host, internal Type IIS sites that stop it being a Golden Gate part, long direct repeats a recA+ host can recombine out). Reads features from an annotated GenBank record when you paste one, otherwise runs the built-in signature scan. EVERY ABSENCE TRAVELS WITH THE VOCABULARY IT WAS DECIDED AGAINST: an empty marker list means nothing matched the families this screen knows, never that the plasmid cannot be selected — run plasmid_deep_annotate, whose library is far larger, before concluding that.",
          "inputSchema": {
