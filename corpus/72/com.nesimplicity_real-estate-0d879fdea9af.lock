{
  "lockfileVersion": 2,
  "subjects": {
    "com.nesimplicity/real-estate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hooks.nesimplicity.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "simplicity-real-estate-readonly",
        "title": "SimpliCity Real Estate (read-only)",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SimpliCity Real Estate (Lincoln, Nebraska). This gateway is read-only. Use search_listings for a link to the IDX home search and get_area_info for place names. Use get_public_agent_info for Wade's profile and get_booking_link to send the user to the contact page. Do not expect this server to create leads.",
      "tools": [
        {
          "name": "get_area_info",
          "title": "Towns and neighborhoods",
          "description": "Town and neighborhood names with county or city. Place names only, not a ranking.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Town or neighborhood name, e.g. Waverly or Near South",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:21ee93083489228e93c47a64e839c0515e3cb7c17d60a6bd72bc0d7ecb070fc4"
        },
        {
          "name": "get_booking_link",
          "title": "Schedule with Wade",
          "description": "Returns Wade's contact page URL where a user can request a planning conversation. Does not submit a lead from this gateway.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6b8a93ec394f528fd42111907f0e52120a7684cc08824394004667fb2187dfd"
        },
        {
          "name": "get_public_agent_info",
          "title": "Wade Bartels public profile",
          "description": "Public facts about Wade Bartels and SimpliCity Real Estate: service areas, specializations, license verification link, and the single published business phone number.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1714acbc635bb659160d9715aecad1ae60f18a6d409b2b39f349a26b983b045"
        },
        {
          "name": "search_listings",
          "title": "Link to IDX home search (no MLS records here)",
          "description": "Does not return MLS listing rows. Returns idx_search_url on nesimplicity.com/homes/search with the same query parameters as the IDX app (q, price, minPrice, beds), plus a short note.",
          "inputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "max_price": {
                "type": "integer"
              },
              "min_beds": {
                "type": "integer"
              },
              "min_price": {
                "type": "integer"
              },
              "postal_code": {
                "type": "string"
              },
              "zip": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6a999236411ba8a29bcb2aeddaafcb2697f448013ad0e2d4ba2b160becce76c4"
        }
      ],
      "digest": "sha256:406c3881444de8a5f48f448db4821cceb7f126f2eaa4adbdbadebf74122a25c5"
    }
  }
