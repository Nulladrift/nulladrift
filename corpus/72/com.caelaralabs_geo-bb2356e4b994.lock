{
  "lockfileVersion": 2,
  "subjects": {
    "com.caelaralabs/geo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://geo.caelaralabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "Caelara Labs Global Locale Suite",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "business_hours_calc",
          "description": "Is a location open right now (or at a given instant) and when does it next open or close",
          "inputSchema": {
            "properties": {
              "at": {
                "description": "ISO 8601 instant to evaluate (default now)",
                "type": "string"
              },
              "days": {
                "description": "Comma list of open weekdays, 0=Sunday..6=Saturday (default 1,2,3,4,5)",
                "type": "string"
              },
              "end": {
                "description": "Closing time HH:MM (default 17:00)",
                "type": "string"
              },
              "start": {
                "description": "Opening time HH:MM (default 09:00)",
                "type": "string"
              },
              "tz": {
                "description": "IANA timezone of the business",
                "type": "string"
              }
            },
            "required": ["tz"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:40539be5fa41662db9ef5417dc20d40231f25a510b451a387a4992274ea0bb83"
        },
        {
          "name": "country_iso_enricher",
          "description": "Resolve a country name or ISO code to alpha-2/alpha-3/numeric codes, currency, calling code, region, capital and primary timezone",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Country name, alpha-2, alpha-3 or numeric code",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fbd466d82683268c47b8577337b05ab49e3c4896e43fd019d4907342587e95f"
        },
        {
          "name": "cross_border_checkout_composite",
          "description": "Cross-border checkout quote: FX conversion into the destination currency, VAT/GST, postal-code validation and EU reverse-charge eligibility. Use when you need to quote a cross-border checkout: currency conversion, VAT or GST, postal-code validation and EU reverse-charge eligibility. Example input: ?amount=120&currency=USD&country=DE.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Order subtotal in the source currency",
                "type": "number"
              },
              "country": {
                "description": "Destination country (ISO alpha-2, e.g. DE)",
                "type": "string"
              },
              "currency": {
                "description": "Source currency ISO 4217 code, e.g. USD",
                "type": "string"
              },
              "origin_country": {
                "description": "Seller country (ISO alpha-2) for reverse-charge screening",
                "type": "string"
              },
              "postal_code": {
                "description": "Destination postal code to validate",
                "type": "string"
              },
              "prices_include_tax": {
                "description": "true when the amount already includes tax",
                "type": "string"
              },
              "vat_id": {
                "description": "Buyer VAT ID for B2B reverse-charge screening (format only, not VIES-verified)",
                "type": "string"
              }
            },
            "required": ["amount", "country", "currency"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5792864f707461414954ba83d9de80d4992332a7a88dea107af3e48f7db9475f"
        },
        {
          "name": "distance_haversine_calc",
          "description": "Great-circle distance, initial bearing and midpoint between two coordinates",
          "inputSchema": {
            "properties": {
              "lat1": {
                "description": "Latitude of point A",
                "type": "number"
              },
              "lat2": {
                "description": "Latitude of point B",
                "type": "number"
              },
              "lon1": {
                "description": "Longitude of point A",
                "type": "number"
              },
              "lon2": {
                "description": "Longitude of point B",
                "type": "number"
              }
            },
            "required": ["lat1", "lat2", "lon1", "lon2"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:822343dba81e442428dccf00efecf36b0b5795c99cba55efda8e35e7672c96c0"
        },
        {
          "name": "global_scheduling_composite",
          "description": "Find meeting slots that fall inside working hours for every participant timezone, skipping weekends and public holidays, with per-participant local times. Use when you need to find meeting times inside everyone's working hours across time zones, skipping weekends and public holidays. Example input: ?timezones=America/New_York,Europe/London&date=2026-11-24.",
          "inputSchema": {
            "properties": {
              "countries": {
                "description": "Comma list of ISO alpha-2 codes aligned with timezones, used to skip public holidays",
                "type": "string"
              },
              "date": {
                "description": "Organizer-local date YYYY-MM-DD (default today)",
                "type": "string"
              },
              "duration_minutes": {
                "description": "Meeting length in minutes (default 60)",
                "type": "integer"
              },
              "timezones": {
                "description": "Comma list of IANA timezones; the first is the organizer whose local day anchors the search",
                "type": "string"
              },
              "work_end": {
                "description": "Working day end HH:MM (default 17:00)",
                "type": "string"
              },
              "work_start": {
                "description": "Working day start HH:MM (default 09:00)",
                "type": "string"
              }
            },
            "required": ["timezones"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b2d296494d79bf8a0fe1c8d84e3cc4aa8faf7d16fd86e48b5d3bf600b47d841"
        },
        {
          "name": "live_fx_rates",
          "description": "Live currency (FX) rates for a base currency with optional amount conversion",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount of the base currency to convert",
                "type": "number"
              },
              "base": {
                "description": "Base currency ISO 4217 (default USD)",
                "type": "string"
              },
              "symbols": {
                "description": "Comma list of target currencies (default major set)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f68f1e44508ac3c3b4a4a9876c29e8616d7de6089a1b037e34cf03786c030b1"
        },
        {
          "name": "postal_code_validator",
          "description": "Validate and normalize a postal code for a country",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Postal code to validate",
                "type": "string"
              },
              "country": {
                "description": "ISO alpha-2 country code",
                "type": "string"
              }
            },
            "required": ["code", "country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e72c6fdfe95106455ca4795169371244db1cfbce226feed90afd8fe5fb3eb9b"
        },
        {
          "name": "public_holiday_lookup",
          "description": "Public holidays for a country and year, with an optional is-holiday check for one date",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO alpha-2 country code",
                "type": "string"
              },
              "date": {
                "description": "Optional YYYY-MM-DD to test",
                "type": "string"
              },
              "year": {
                "description": "Year (default current)",
                "type": "integer"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8afb9721625cb056de19bf304a137f19f182605a5d50d2978443c35fdeea88b3"
        },
        {
          "name": "timezone_converter",
          "description": "Convert a date-time between IANA timezones with offsets, abbreviations and DST flags",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Source IANA timezone, e.g. America/New_York",
                "type": "string"
              },
              "time": {
                "description": "ISO 8601 time; wall time is read in the source timezone (default now)",
                "type": "string"
              },
              "to": {
                "description": "Comma list of target IANA timezones",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a44296e6f72de93fd476f9f09a75afee2c1aef15f1702f935a47b1e435a957b"
        },
        {
          "name": "vat_gst_rate_lookup",
          "description": "Standard and reduced VAT/GST rates for a country with optional tax amount calculation",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Net amount to compute tax on",
                "type": "number"
              },
              "country": {
                "description": "ISO alpha-2 country code",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0934fc5bca9fa3ba44816ab7b311117027a3391c2629a37192dfec0952a47ace"
        }
      ],
      "digest": "sha256:c48bd53ce22faf30ee655e04d06c4558438885a42bcbcfa060c314cf2d80ba58"
    }
  }
