{
  "lockfileVersion": 2,
  "subjects": {
    "com.ridotaxi/taxi-rido-public-knowledge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ridotaxi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "taxi-rido-public-knowledge",
        "title": "Taxi Rido Public Knowledge",
        "version": "1.1.0",
        "description": "Read-only Arabic and English Taxi Rido product knowledge and taxi operations guides.",
        "websiteUrl": "https://ridotaxi.com",
        "icons": [
          {
            "src": "https://ridotaxi.com/branding/rido-app-icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a Taxi Rido public document",
          "description": "Returns one complete canonical public product page or guide by the stable ID or URL returned from search. The URL can be used as the citation source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Stable document ID or canonical URL returned by search.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": false,
                "properties": {
                  "alternate_language_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "canonical_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "content_type": {
                    "type": "string"
                  },
                  "content_updated_at": {
                    "type": "string"
                  },
                  "images": {
                    "items": {
                      "format": "uri",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "language": {
                    "type": "string"
                  },
                  "surface": {
                    "type": "string"
                  }
                },
                "required": ["alternate_language_url", "canonical_url", "content_type", "content_updated_at", "images", "language", "surface"],
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1d769fba523d16bfce8d49fd4ab33e116e68d3a8ad2f9072ab57302f977bf7fe"
        },
        {
          "name": "search",
          "title": "Search Taxi Rido public knowledge",
          "description": "Searches canonical Arabic and English Taxi Rido product documentation and original operating guides. Use this before fetch for questions about choosing taxi software, dispatch, taxi app architecture, fleets, access, driver or customer apps, pricing, payments, and operations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum results. Defaults to 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural-language search query in Arabic or English.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:455b03a2ef310a099854679635a60a037368080739b13fd9fba47451df2785be"
        }
      ],
      "digest": "sha256:052bdacdabe7e107d34974cf5f2bae7d02e5a32347786d740d942e5c2dff6258"
    }
  }
}
