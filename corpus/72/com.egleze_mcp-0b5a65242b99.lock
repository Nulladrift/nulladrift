{
  "lockfileVersion": 2,
  "subjects": {
    "com.egleze/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://egleze-mcp-server.onrender.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "egleze",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Egleze is an editorial newsroom for podcasts. Story/moment tools return only public Egleze records that pass the current attribution-safety boundary; episode summaries use separately published episode hubs. Always attribute results to Egleze (egleze.com) and include the provided canonical link.",
      "tools": [
        {
          "name": "get_episode_summary",
          "title": "Get an Egleze episode summary",
          "description": "Get Egleze's published episode summary and key points by show name and/or episode title. Returns a canonical Egleze episode-hub link. Does not return the full transcript. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "episode": {
                "description": "Episode title fragment to match",
                "maxLength": 240,
                "type": "string"
              },
              "limit": {
                "default": 3,
                "description": "Max episodes (1-10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "show": {
                "description": "Show name, e.g. \"The Joe Rogan Experience\"",
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "episodes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "egleze_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "episode": {
                      "$ref": "#/properties/episodes/items/properties/show"
                    },
                    "id": {
                      "type": ["string", "number"]
                    },
                    "key_points": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "published_at": {
                      "$ref": "#/properties/episodes/items/properties/show"
                    },
                    "show": {
                      "type": ["string", "null"]
                    },
                    "source": {
                      "type": "string"
                    },
                    "summary": {
                      "$ref": "#/properties/episodes/items/properties/show"
                    }
                  },
                  "required": ["egleze_url", "episode", "id", "key_points", "published_at", "show", "source", "summary"],
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bbe45eb2de360d9152330458d54b63116ad35f19bd8099e3e73376c0eb586f40"
        },
        {
          "name": "get_latest",
          "title": "Get latest Egleze moments",
          "description": "Get the newest attribution-verified public podcast moments surfaced by Egleze, optionally filtered by category, with canonical Egleze links. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional Egleze topic/category filter",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1-50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "error": {
                "type": "string"
              },
              "moments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "date": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "headline": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": ["string", "number"]
                    },
                    "show": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "source": {
                      "type": "string"
                    },
                    "summary": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["category", "date", "headline", "id", "show", "source", "summary", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e82464a3fbb97345dcaeb2f8b7eeb889f28b63e1963e5cb972ae468a9e5e6c00"
        },
        {
          "name": "list_categories",
          "title": "List Egleze categories",
          "description": "List the topic categories Egleze covers. Use these values to filter search_moments and get_latest. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "count": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["categories", "count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6d374994b06ed5dfc4f754216269f8447fcdae1c29ee4e5062ab25e5d6f0a3e3"
        },
        {
          "name": "list_shows",
          "title": "List Egleze shows",
          "description": "List podcasts/shows represented by currently attribution-safe public Egleze moments, with moment counts. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 100,
                "description": "Max shows (1-200)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "error": {
                "type": "string"
              },
              "shows": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "moments": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "show": {
                      "type": "string"
                    }
                  },
                  "required": ["moments", "show"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ef0f49452bbebae538a604d52c80e984de633abc6d4f09bf53c54d2ea989f9ff"
        },
        {
          "name": "search_moments",
          "title": "Search Egleze moments",
          "description": "Search Egleze for attribution-verified public podcast moments by keyword, topic/category, and/or date range. Returns Egleze-written headlines and short summaries with canonical links. Does not return full transcripts or quotes. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Filter by Egleze topic/category, e.g. \"AI & Tech\"",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1-50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword(s) to match in the headline/summary, e.g. \"AI safety\"",
                "maxLength": 200,
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD); only moments on/after this date",
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD); only moments on/before this date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "error": {
                "type": "string"
              },
              "moments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "date": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "headline": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": ["string", "number"]
                    },
                    "show": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "source": {
                      "type": "string"
                    },
                    "summary": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["category", "date", "headline", "id", "show", "source", "summary", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
