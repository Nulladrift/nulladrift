{
  "lockfileVersion": 2,
  "subjects": {
    "com.egleze/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://egleze-mcp-server.onrender.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "egleze",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Egleze is an editorial newsroom for podcasts. Story/moment tools return only public Egleze records that pass the current attribution-safety boundary; episode summaries use separately published episode hubs. Always attribute results to Egleze (egleze.com) and include the provided canonical link.",
      "tools": [
        {
          "name": "get_episode_summary",
          "title": "Get an Egleze episode summary",
          "description": "Get Egleze's published episode summary and key points by show name and/or episode title. Returns a canonical Egleze episode-hub link. Does not return the full transcript. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "episode": {
                "description": "Episode title fragment to match",
                "maxLength": 240,
                "type": "string"
              },
              "limit": {
                "default": 3,
                "description": "Max episodes (1-10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "show": {
                "description": "Show name, e.g. \"The Joe Rogan Experience\"",
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "episodes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "egleze_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "episode": {
                      "$ref": "#/properties/episodes/items/properties/show"
                    },
                    "id": {
                      "type": ["string", "number"]
                    },
                    "key_points": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "published_at": {
                      "$ref": "#/properties/episodes/items/properties/show"
                    },
                    "show": {
                      "type": ["string", "null"]
                    },
                    "source": {
                      "type": "string"
                    },
                    "summary": {
                      "$ref": "#/properties/episodes/items/properties/show"
                    }
                  },
                  "required": ["egleze_url", "episode", "id", "key_points", "published_at", "show", "source", "summary"],
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3a7f3215a171060159cda0af7b93859fdecbac5f2b2a0172886751a00cd9cc2d"
        },
        {
          "name": "get_latest",
          "title": "Get latest Egleze moments",
          "description": "Get the newest attribution-verified public podcast moments surfaced by Egleze, optionally filtered by category, with canonical Egleze links. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional Egleze topic/category filter",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1-50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "error": {
                "type": "string"
              },
              "moments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "date": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "headline": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": ["string", "number"]
                    },
                    "show": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "source": {
                      "type": "string"
                    },
                    "summary": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["category", "date", "headline", "id", "show", "source", "summary", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:35e46c3c04e54720fe6fc110596cd272722d6e43d6e8af99056c71e9ecd11653"
        },
        {
          "name": "list_categories",
          "title": "List Egleze categories",
          "description": "List the topic categories Egleze covers. Use these values to filter search_moments and get_latest. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "count": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["categories", "count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f151abaad7a338a0c229f509275fce2a2e7e0eae621166ddaa2173463e7de487"
        },
        {
          "name": "list_shows",
          "title": "List Egleze shows",
          "description": "List podcasts/shows represented by currently attribution-safe public Egleze moments, with moment counts. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 100,
                "description": "Max shows (1-200)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "error": {
                "type": "string"
              },
              "shows": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "moments": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "show": {
                      "type": "string"
                    }
                  },
                  "required": ["moments", "show"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3419f3513c0787c41721752590cb1bb51c10376cc589a094d809c0f5e6c3d2fc"
        },
        {
          "name": "search_moments",
          "title": "Search Egleze moments",
          "description": "Search Egleze for attribution-verified public podcast moments by keyword, topic/category, and/or date range. Returns Egleze-written headlines and short summaries with canonical links. Does not return full transcripts or quotes. Records privacy-safe operational telemetry for reliability and aggregate usage measurement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Filter by Egleze topic/category, e.g. \"AI & Tech\"",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1-50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword(s) to match in the headline/summary, e.g. \"AI safety\"",
                "maxLength": 200,
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD); only moments on/after this date",
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD); only moments on/before this date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "minimum": 0,
                "type": "integer"
              },
              "error": {
                "type": "string"
              },
              "moments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "date": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "headline": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": ["string", "number"]
                    },
                    "show": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "source": {
                      "type": "string"
                    },
                    "summary": {
                      "$ref": "#/properties/moments/items/properties/headline"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["category", "date", "headline", "id", "show", "source", "summary", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:42b442cb5ea9c52ad7b5c5e266075e415679718e916e9609c5410654918161a8"
        }
      ],
      "digest": "sha256:8419281d01e61fc2fb581ae0381e3de95119a446501b309b0f9b5bd6c812d0f1"
    }
  }
}
