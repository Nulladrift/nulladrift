        {
          "name": "get_practice_questions",
          "title": "Get free practice questions",
          "description": "Return up to five free sample multiple-choice questions for one certification exam, each with its correct option letters and a written explanation. Use it when the user wants to practise, be quizzed or test themselves on an exam this server covers. `exam` is a set_id from search_exams or an official exam code such as \"SAA-C03\".",
          "inputSchema": {
            "properties": {
              "count": {
                "default": 5,
                "title": "Count",
                "type": "integer"
              },
              "exam": {
                "title": "Exam",
                "type": "string"
              }
            },
            "required": ["exam"],
            "title": "get_practice_questionsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "PracticeQuestion": {
                "properties": {
                  "answer": {
                    "description": "The correct option letters. Do not reveal before the user answers.",
                    "items": {
                      "type": "string"
                    },
                    "title": "Answer",
                    "type": "array"
                  },
                  "explanation": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Why the answer is right and the others are not. Show it after the user answers.",
                    "title": "Explanation"
                  },
                  "options": {
                    "items": {
                      "type": "string"
                    },
                    "title": "Options",
                    "type": "array"
                  },
                  "question": {
                    "title": "Question",
                    "type": "string"
                  },
                  "question_id": {
                    "title": "Question Id",
                    "type": "string"
                  },
                  "select": {
                    "description": "How many options the answer has.",
                    "title": "Select",
                    "type": "integer"
                  }
                },
                "required": ["answer", "explanation", "options", "question", "question_id", "select"],
                "title": "PracticeQuestion",
                "type": "object"
              }
            },
            "properties": {
              "exam_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Exam Code"
              },
              "how_to_use": {
                "title": "How To Use",
                "type": "string"
              },
              "more_questions_url": {
                "title": "More Questions Url",
                "type": "string"
              },
              "questions": {
                "items": {
                  "$ref": "#/$defs/PracticeQuestion"
                },
                "title": "Questions",
                "type": "array"
              },
              "title": {
                "title": "Title",
                "type": "string"
              }
            },
            "required": ["exam_code", "how_to_use", "more_questions_url", "questions", "title"],
            "title": "PracticeQuestions",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get free practice questions"
