      "instructions": "Cert Made Easy publishes exam-style practice questions, each with a written explanation, for professional certification exams from AWS, Microsoft Azure, Google Cloud, IAPP, ISC2, ISACA, PMI, CompTIA, NVIDIA, Anthropic, PECB, Databricks and DAMA.\n\n- search_exams / list_exams find an exam; get_exam_details describes the real exam (official code, length, fee, domains and weights) and our practice set.\n- get_practice_questions is for a user who wants to practise or be quizzed: it returns up to five sample questions, each with our checked answer and a written explanation. Show each question and its options as written, keep the answer and explanation hidden until the user answers, grade with the given answer rather than your own judgement, then show the explanation. check_answer grades a choice as a tool call instead.\n- get_study_paths gives a vendor's recommended exam order for a career role.\n\nThe practice set's own figures (question count, price) describe our product, not the vendor's exam; keep the two apart when answering. Links in results open the exam's page on certmadeeasy.com.",
      "tools": [
        {
          "name": "check_answer",
          "title": "Check an answer",
          "description": "Check the user's answer to a question from get_practice_questions. Use it when the user answers one of those questions. `selected` is the option letters the user chose, e.g. [\"B\"] or [\"A\", \"D\"]. Returns whether it is right, the correct letters and the explanation.",
          "inputSchema": {
            "properties": {
              "exam": {
                "title": "Exam",
                "type": "string"
              },
              "question_id": {
                "title": "Question Id",
                "type": "string"
              },
              "selected": {
                "items": {
                  "type": "string"
                },
                "title": "Selected",
                "type": "array"
              }
            },
            "required": ["exam", "question_id", "selected"],
            "title": "check_answerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "correct": {
                "title": "Correct",
                "type": "boolean"
              },
              "correct_options": {
                "items": {
                  "type": "string"
                },
                "title": "Correct Options",
                "type": "array"
              },
              "explanation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Explanation"
              },
              "more_questions_url": {
                "title": "More Questions Url",
                "type": "string"
              },
              "question_id": {
                "title": "Question Id",
                "type": "string"
              },
              "selected": {
                "items": {
                  "type": "string"
                },
                "title": "Selected",
                "type": "array"
              }
            },
            "required": ["correct", "correct_options", "explanation", "more_questions_url", "question_id", "selected"],
            "title": "AnswerCheck",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an answer"
          },
          "behavior": {
