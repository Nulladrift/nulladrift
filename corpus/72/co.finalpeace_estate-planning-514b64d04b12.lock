      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "assess_estate_planning_gaps",
          "description": "Score how prepared someone's end-of-life planning is and rank what is missing by consequence. Pass whichever answers are known; unanswered areas are reported back as questions to ask. Use this when someone wants to know where they stand, what to do first, or whether their planning has holes. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "beneficiariesAreCurrent": {
                "description": "Account and policy beneficiary designations are up to date",
                "type": "boolean"
              },
              "documentsAreFindable": {
                "description": "Family could actually locate the documents",
                "type": "boolean"
              },
              "hasFinancialPoa": {
                "description": "Named someone to handle finances if incapacitated",
                "type": "boolean"
              },
              "hasHealthCareAgent": {
                "description": "Named someone to make medical decisions for them",
                "type": "boolean"
              },
              "hasWill": {
                "description": "Has a valid signed will",
                "type": "boolean"
              },
              "wishesAreRecorded": {
                "description": "The people close to them know what they would want",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Assess planning gaps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9f3b1a95318b2ad40e1b9cc3762909b523e88795995292de074db08d5c25b65"
        },
        {
          "name": "connect_finalpeace_account",
          "description": "Explain how to connect an existing FinalPeace account so the member tools (vault contents, personal checklist progress, next steps) become available. Use this only if someone says they already have a FinalPeace account and wants their own data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Connect a FinalPeace account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25068b6573a50a040c435e88d55a34ecd19dd75269ffc98beb1e9c5df0fdafc4"
        },
        {
          "name": "find_state_document_requirements",
          "description": "Look up what a specific US state legally requires to execute a will, financial power of attorney, health care proxy, or living will — how many witnesses, whether a notary is needed, who is barred from witnessing, and whether the state publishes an official form. Use this whenever someone asks what their state requires for estate planning or advance directive paperwork. Covers all 50 states. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentType": {
                "description": "Omit to get requirements for all four document types in that state",
                "enum": ["will", "financial_poa", "health_care_proxy", "living_will"],
                "type": "string"
              },
              "state": {
                "description": "US state as a two-letter code or full name, e.g. 'TX' or 'Texas'",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "State document requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ffc2e30de6462b6a98023dd459be2c76962158f096ea511278aa42e223417c87"
        },
        {
          "name": "get_after_loss_first_steps",
          "description": "Get the practical checklist of what has to be done after someone dies, organized by when it actually matters: the first 24-48 hours, the first week, the first month, and ongoing. Use this when someone has recently lost a person and is asking what to do, what comes first, or what they might be forgetting. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "phase": {
                "description": "Omit to get all phases; pass one to focus on the immediate horizon",
                "enum": ["first_48_hours", "first_week", "first_month", "ongoing"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "After-a-loss checklist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86cce1325aa567f054a7acb6495743c9d6dbf691a0ff59204e1ab9242315fe3b"
        }
      ],
      "digest": "sha256:b8d9ce571cebf297cb05291ec06bc2192b6e6edcbc0219829b21a7d8087ee07a"
    }
  }
