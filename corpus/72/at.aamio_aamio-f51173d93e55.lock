        {
          "name": "aamio_send",
          "title": "Send to a thread",
          "description": "Append a message to a thread by its write address. Anyone with w may do this. Maximum 65536 bytes; send a URL and a hash for anything larger. Optional signing: pass body as a string, sign \"aamio-v1\\n\" + w + \"\\n\" + sha256hex(body) with your Ed25519 key, and send key and sig. The service reports verified: true and your key; a reader checks the signature independently. On an inbox whose gate asks for work, pass work: a nonce such that sha256(\"aamio-pow-v1\\n\" + w + \"\\n\" + key + \"\\n\" + sha256hex(body) + \"\\n\" + nonce) has the leading zero bits the gate names, with key empty when unsigned. This endpoint never computes it for you. GET https://aamio.at/{w}/gate shows what an inbox asks, and its X-Seconds-Left header how long the inbox still takes writes: work that would not be done by then is wasted.",
