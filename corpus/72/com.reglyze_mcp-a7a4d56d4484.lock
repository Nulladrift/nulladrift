      "serverInfo": {
        "name": "reglyze",
        "version": "1.7.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compliance_status",
          "title": "My Reglyze compliance status",
          "description": "Requires a Reglyze API token. Returns YOUR organization's current compliance score, implementation/documentation sub-scores, open-task counts, and the national-framework per-objective view.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a18471c1aa1cecae86a99519562d8ed7d1b44e34a702e02b50395789f506bbe3"
        },
        {
          "name": "documents_list",
          "title": "My Reglyze compliance documents",
          "description": "Requires a Reglyze API token. Lists YOUR organization's compliance documents (title, type, status, current version). Metadata only, not document content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f94d35b7d5b4331fe369796f21c07811171a7662ebff45a7f70b496034d0e1a"
        },
        {
          "name": "incident_deadline_formats",
          "title": "Incident notification deadlines per country",
          "description": "NIS2 incident-notification deadlines for a country: the 24h/72h/1-month stages with their national legal basis, the competent authority/CSIRT and portal, the sector routing (a sector CSIRT or authority that receives instead of, or with, the national one; pass `sector` for the recipient of one organisation), and the national severity vocabulary (e.g. Italy's ACN IS-1..IS-4 typologies, with their entity-class applicability).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO-2 country code",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "default": "en",
                "enum": ["en", "fr", "it", "de", "pt", "nl", "pl", "es", "hr", "el", "sl", "cs", "ro", "sv", "et", "sk", "da", "fi", "bg"],
                "type": "string"
              },
              "sector": {
                "description": "NIS2 sector id of the organisation. When given, `recipients` names who receives its notification: some countries route a whole sector to another body, and a rule over part of a sector comes back as a condition to check.",
                "enum": ["energy", "transport", "banking", "financial_market_infrastructures", "health", "drinking_water", "waste_water", "digital_infrastructure", "ict_service_management", "public_administration", "space", "postal_and_courier", "waste_management", "chemicals", "food", "manufacturing", "digital_providers", "research"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:09c0d9d3e71794e4550d3dface3a268fc636ea3a14b1072036378f8c670411cd"
        },
        {
          "name": "incidents_list",
          "title": "My Reglyze incidents",
          "description": "Requires a Reglyze API token. Lists YOUR organization's recorded incidents (title, status, severity, detection date).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f021f59373d3cf023b3171f38e84fcabdc836cfa4b4bf90436017afd000925bf"
        },
        {
          "name": "open_tasks",
          "title": "My Reglyze open remediation tasks",
          "description": "Requires a Reglyze API token. Lists YOUR organization's open remediation tasks. Optional filters: status, severity, overdue.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "overdue": {
                "type": "boolean"
              },
              "severity": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aea760a9200451d30a9cb6041c8e5e278a859f68a4000c67ee82f3b6a5f54309"
        },
        {
          "name": "scope_check",
          "title": "NIS2 scope check",
          "description": "Determine whether NIS2 (and its national transposition) applies to an organization, and whether it is an essential or important entity. Inputs: EU/EEA country (ISO-2), primary NIS2 sector, headcount, turnover/balance sheet in M EUR, size-independent types (DNS, TLD, trust services, public electronic communications; cloud, data-centre and CDN providers follow the size test). Returns classification, reasoning, the national transposition law with its deviations, and next-step links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "additional_sectors": {
                "items": {
                  "enum": ["energy", "transport", "banking", "financial_market", "health", "drinking_water", "waste_water", "digital_infrastructure", "ict_service_management", "public_administration", "space", "postal", "waste_management", "chemicals", "food", "manufacturing", "digital_providers", "research"],
                  "type": "string"
                },
                "type": "array"
              },
              "annual_balance_sheet_meur": {
                "minimum": 0,
                "type": "number"
              },
              "annual_turnover_meur": {
                "description": "Annual turnover in millions of EUR",
                "minimum": 0,
                "type": "number"
              },
              "cloud_provider": {
                "description": "Cloud computing provider: Annex I digital infrastructure, size-tested like any other entity (not size-independent)",
                "type": "boolean"
              },
              "country": {
                "description": "ISO-2 country code of the organization (e.g. IT, PL, FR)",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "dns_provider": {
                "type": "boolean"
              },
              "employee_count": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "language": {
                "default": "en",
                "enum": ["en", "fr", "it", "de", "pt", "nl", "pl", "es", "hr", "el", "sl", "cs", "ro", "sv", "et", "sk", "da", "fi", "bg"],
                "type": "string"
              },
              "public_ecn_provider": {
                "description": "Provider of public electronic communications networks or services: in scope regardless of size, essential from medium size (Art. 3(1)(c))",
                "type": "boolean"
              },
              "qualified_trust_service_provider": {
                "type": "boolean"
              },
              "sector": {
                "description": "Primary NIS2 sector id (see the sector list in the tool description)",
                "enum": ["energy", "transport", "banking", "financial_market", "health", "drinking_water", "waste_water", "digital_infrastructure", "ict_service_management", "public_administration", "space", "postal", "waste_management", "chemicals", "food", "manufacturing", "digital_providers", "research"],
                "type": "string"
              },
              "sole_provider": {
                "description": "Sole provider of a service essential to society in its Member State",
                "type": "boolean"
              },
              "tld_registry": {
                "type": "boolean"
              },
              "trust_service_provider": {
                "description": "Trust service provider (eIDAS), qualified or not: in scope regardless of size; non-qualified ones are important unless large",
                "type": "boolean"
              }
            },
            "required": ["country", "employee_count", "sector"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f21f89e4a1778e580dc046d44ad5cf75fb74651f5fbc7ded1333affb237cc63"
        },
        {
          "name": "transposition_status",
          "title": "NIS2 transposition status",
          "description": "Current NIS2 transposition status per EU/EEA country (law, stage, competent authority, sources), from the Reglyze transposition tracker (curated + weekly auto-updated). Omit the country for the full map.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO-2 country code; omit for all tracked countries",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "default": "en",
                "enum": ["en", "fr", "it", "de", "pt", "nl", "pl", "es", "hr", "el", "sl", "cs", "ro", "sv", "et", "sk", "da", "fi", "bg"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b1644137fb94b736ee27462d1a9e5982acf8b0aae688d894f4bcc7290b11aba"
        }
      ],
      "digest": "sha256:9b4c3d785453c61779f07bb42505e669656b28de511d22ee3057e4c9676e6661"
    }
  }
