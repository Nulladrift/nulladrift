        },
        {
          "name": "elo_change",
          "title": "Elo rating change",
          "description": "Expected score and rating change for a win, draw or loss between two Elo ratings, at a chosen K-factor.",
          "inputSchema": {
            "properties": {
              "k_factor": {
                "description": "Default 32. FIDE: 40 new players, 20 below 2400, 10 from 2400.",
                "type": "number"
              },
              "opponent_rating": {
                "type": "number"
              },
              "rating": {
                "type": "number"
              }
            },
            "required": ["opponent_rating", "rating"],
            "type": "object"
          },
