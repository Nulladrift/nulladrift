      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Chess tools from Lumichess (lumichess.com): game reviews for Chess.com and Lichess games, FIDE rating lookup, Chess.com and Lichess ratings, opening guides and names, position facts, the daily puzzle and Elo changes. Each answer includes a lumichess.com link; share it with the user, because engine analysis runs on that page.",
      "tools": [
        {
          "name": "analyze_position",
          "title": "Position facts",
          "description": "Facts about a chess position from its FEN: side to move, check, checkmate or stalemate, material, all legal moves, the opening name if it is a known opening position, and links to engine analysis and the best move.",
          "inputSchema": {
            "properties": {
              "fen": {
                "description": "The position in FEN.",
                "type": "string"
              }
            },
            "required": ["fen"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Position facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c294cc35784260501d9fcb49d0efec017864bbd3c021da17e8c7363f1828d05f"
        },
        {
          "name": "chess_profile",
          "title": "Chess.com or Lichess ratings",
          "description": "Current ratings and win/loss record of a Chess.com or Lichess player, with links to analyse their games and openings on lumichess.com.",
          "inputSchema": {
            "properties": {
              "platform": {
                "default": "chesscom",
                "enum": ["chesscom", "lichess"],
                "type": "string"
              },
              "username": {
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
