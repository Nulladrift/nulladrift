          "title": "Name the opening",
          "description": "Name the opening (ECO code and variation) from a list of moves or a PGN, and say on which move the game left named theory.",
          "inputSchema": {
            "properties": {
              "moves": {
                "description": "Moves in SAN, e.g. \"1.e4 c6 2.d4 d5 3.e5\", or a full PGN.",
