        {
          "name": "fide_rating",
          "title": "FIDE rating lookup",
          "description": "Look up official FIDE ratings (standard, rapid, blitz), title, federation and birth year by player name or FIDE ID.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A surname, \"Surname, First name\", or a FIDE ID.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
