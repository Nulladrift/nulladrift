        {
          "name": "review_game",
          "title": "Review a chess game",
          "description": "Get a free move-by-move review of a Chess.com or Lichess game: accuracy, every move classified, the evaluation graph. Takes a game link or a PGN. Returns a lumichess.com review link; for a PGN also the players, result and opening.",
          "inputSchema": {
            "properties": {
              "game": {
                "description": "A Chess.com game link (chess.com/game/live/123... or chess.com/game/123...), a Lichess game link (lichess.org/abcd1234), or the full PGN text.",
