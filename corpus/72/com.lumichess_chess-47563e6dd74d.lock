        {
          "name": "opening_guide",
          "title": "Chess opening guide",
          "description": "Guide to a chess opening: first moves, ECO codes, how often it is played and how it scores, the main lines and the ideas behind them, from Lumichess opening pages. For other names, lists matching ECO lines.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Opening name, e.g. \"Caro-Kann\", \"Sicilian Defense\", \"London System\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
