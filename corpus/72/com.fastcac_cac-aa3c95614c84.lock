        {
          "name": "calculate_cac_fees",
          "title": "Calculate CAC registration fees",
          "description": "CAC's official registration fees, line by line, for a business name, a limited company (by authorised share capital, default ₦1,000,000) or an NGO (Incorporated Trustees). Use it for any question about what CAC charges to register. These are government fees, not FastCAC's price.",
