        {
          "name": "search_cac_register",
          "title": "Search CAC's public register",
          "description": "Search the Corporate Affairs Commission's (CAC) public register for businesses already registered in Nigeria, by name or by RC/BN number. Returns `results`: name, rc_number (the BN number for a business name), registration_date, classification, nature_of_business, status (e.g. ACTIVE or INACTIVE), company_id, classification_id and match (exact, close, similar or null), best match first; RC/BN numbers (\"RC 8911267\") are read as numbers. Lead with the result whose match is exact; when none is, say plainly that nothing is registered under that exact name before listing the closest. This lists what exists; it isn't an availability check (check_name_availability and check_business_name_compliance are). An `error` never means there's no match.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entity_type": {
                "description": "Limit to one kind of registration. Defaults to ALL.",
                "enum": ["ALL", "BUSINESS NAME", "COMPANY", "INCORPORATED TRUSTEE", "LIMITED PARTNERSHIP", "LIMITED LIABILITY PARTNERSHIP"],
                "type": "string"
              },
              "query": {
                "description": "A business name, or an RC/BN number such as '1234567'.",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "classification": {
                      "type": ["string", "null"]
                    },
                    "classification_id": {
                      "description": "For get_cac_tax_id.",
                      "type": ["integer", "null"]
                    },
                    "company_id": {
                      "description": "For get_cac_tax_id.",
                      "type": ["integer", "null"]
                    },
                    "match": {
                      "description": "How close the name is to the query; results come best first.",
                      "enum": ["exact", "close", "similar", null],
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "The registered name.",
                      "type": ["string", "null"]
                    },
                    "nature_of_business": {
                      "type": ["string", "null"]
                    },
                    "rc_number": {
                      "description": "RC number (BN number for a business name).",
                      "type": ["string", "null"]
                    },
                    "registration_date": {
                      "description": "ISO date-time CAC registered it.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "CAC status, e.g. ACTIVE or INACTIVE.",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search CAC's public register"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:2d81946b914846cb3d48295301e1edd1b3d4caa30e74c1fc785502279a2ab8c6"
        },
        {
          "name": "search_knowledge_base",
          "title": "Search FastCAC's knowledge base",
          "description": "Search FastCAC's knowledge base: the articles, policies, guides and how-tos FastCAC's team has written (pricing and what it includes, refunds, timelines, documents, what happens after payment, CAC rules and procedures, post-registration steps). Use it before answering a question about FastCAC's service or CAC process that the instructions above don't settle, and answer from the passages, not memory. Returns passages best first, each with its document title, heading, updated_at, a 0-1 rank score and a 0-1 similarity (how close in meaning; about 0.7 and up answers the question), plus total_matches and has_more. Weak or no results: try mode 'broad', reword the query, or page on with offset. If it still has nothing, say plainly that you don't have that information.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional: only this category.",
                "type": "string"
              },
              "document": {
                "description": "Optional: one document, by title (or part of it) or document_id.",
                "type": "string"
              },
              "include_context": {
                "description": "Include the text just before and after each passage.",
                "type": "boolean"
              },
              "limit": {
                "description": "Passages to return (default 8).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "min_score": {
                "description": "Optional: drop passages less similar than this (0-1).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "mode": {
                "description": "balanced (default); precise = only close matches; broad = looser matches, weighted to meaning, with each passage's neighbouring text.",
                "enum": ["precise", "balanced", "broad"],
                "type": "string"
              },
              "offset": {
                "description": "Skip this many (for the next page).",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "The question or keywords, in plain words.",
                "type": "string"
              },
              "tags": {
                "description": "Optional: documents with any of these tags.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer_style": {
                "type": "string"
              },
              "has_more": {
                "type": "boolean"
              },
              "hint": {
                "type": "string"
              },
              "mode": {
                "enum": ["precise", "balanced", "broad"],
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "offset": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "category": {
                      "type": ["string", "null"]
                    },
                    "context": {
                      "properties": {
                        "after": {
                          "type": ["string", "null"]
                        },
                        "before": {
                          "type": ["string", "null"]
                        }
                      },
                      "type": "object"
                    },
                    "document_id": {
                      "type": "string"
                    },
                    "heading": {
                      "type": ["string", "null"]
                    },
                    "matched": {
                      "items": {
                        "enum": ["meaning", "keywords"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "score": {
                      "description": "0-1 rank score, best first.",
                      "type": "number"
                    },
                    "similarity": {
                      "description": "0-1 closeness in meaning; null in a keyword-only search.",
                      "type": ["number", "null"]
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "updated_at": {
                      "format": "date",
                      "type": "string"
                    }
                  },
                  "required": ["score", "text", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "retrieval": {
                "description": "keyword_only when search by meaning was unavailable.",
                "enum": ["hybrid", "keyword_only"],
                "type": "string"
              },
              "total_matches": {
                "type": "integer"
              }
            },
            "required": ["has_more", "results", "total_matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search FastCAC's knowledge base"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:bd0e094308db698386a31db441c7c2123231d7814a4f2183b4e54ab11cf14ecb"
        },
