      "serverInfo": {
        "name": "fastcac",
        "title": "FastCAC",
        "version": "",
        "description": "CAC business name checks, name ideas, register search, fees and annual returns for Nigeria.",
        "websiteUrl": "https://fastcac.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FastCAC registers businesses with Nigeria's Corporate Affairs Commission (CAC). These tools check whether CAC would accept a business name, suggest names, find CAC's exact line of business, search CAC's public register (with each business's Tax ID), and work out CAC's registration fees and annual returns. They're free and need no account. The tools for the person's own businesses and registrations ask them to sign in to FastCAC (free) the first time one is called. Payments, uploads and changes that need the person's OK come back as status 'action_required' with a FastCAC link: the person finishes there, and get_action_status tells you the outcome. Amounts are in naira. A tool error never means a name is free or that the register has no match: say CAC didn't answer. Lead with an exact match (exact_match, or a result whose match is exact) and say plainly when there's none. A line of business must be one of CAC's entries: when a tool returns choices, ask, never guess. Offer a blocked name's alternatives as written; never invent a name that breaks CAC's rules.",
