        {
          "name": "check_business_name_compliance",
          "title": "Run CAC's name compliance check",
          "description": "CAC's verdict on a proposed name, the same check fastcac.com's name checker runs: CAC's naming rules first, then CAC's own compliance and similarity engine. Returns `tone` (ok, caveat = a certificate is needed, blocked), a plain `message`, `code` (CAC's 00-14; none when one of CAC's naming rules blocked it), `similar_names`/`most_similar_name`/`similarity_score`, and `alternatives`: names to offer, each already passing the rules (for a name missing its ending, the name with each accepted ending: Ventures, Enterprises, Services, Concepts, Hub, Fashion, Beauty, Biz, or Limited/Ltd for a company). `line_of_business` must be one of CAC's entries; anything else returns error line_of_business_invalid with `choices` to ask about, never a guess. A name ending in Limited/Ltd/PLC is checked as a company unless `name_type` says otherwise. An `error` is never a verdict: say CAC didn't answer.",
          "inputSchema": {
            "properties": {
              "line_of_business": {
                "description": "An exact entry from CAC's line-of-business picklist (search_line_of_business).",
                "type": "string"
              },
              "name_type": {
                "description": "Optional: business name or company (Ltd). Inferred from the name's ending when left out.",
                "enum": ["business_name", "company"],
                "type": "string"
              },
              "proposed_name": {
                "type": "string"
              }
            },
            "required": ["line_of_business", "proposed_name"],
            "type": "object"
          },
          "outputSchema": {
            "description": "CAC's verdict on the name, the same one fastcac.com's name checker gives.",
            "properties": {
              "alternatives": {
                "description": "Names to offer instead, each already passing CAC's rules.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "certificate_required": {
                "type": "boolean"
              },
              "code": {
                "description": "CAC's 00-14 code; null when one of CAC's naming rules blocked it.",
                "type": ["string", "null"]
              },
              "line_of_business": {
                "description": "The exact CAC entry the name was checked with.",
                "type": ["string", "null"]
              },
              "message": {
                "description": "The reason, in plain words, to show the person.",
                "type": "string"
              },
              "most_similar_name": {
                "type": ["string", "null"]
              },
              "name_type": {
                "enum": ["business_name", "company"],
                "type": "string"
              },
              "proposed_name": {
                "type": "string"
              },
              "similar_names": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "similarity_score": {
                "type": ["number", "null"]
              },
              "source": {
                "description": "heuristics (CAC's naming rules) or bulkupload (CAC's engine).",
                "type": "string"
              },
              "tone": {
                "description": "ok: CAC would accept it; caveat: accepted, but a certificate is needed; blocked: not accepted.",
                "enum": ["ok", "caveat", "blocked"],
                "type": "string"
              }
            },
            "required": ["alternatives", "message", "tone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Run CAC's name compliance check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:c5b916da41a54472de8f89fb06e1e5bef345b0c39ec7f1e742fbcf4d0ec5adf5"
        },
        {
          "name": "check_name_availability",
          "title": "Check a name against CAC's register",
          "description": "Search CAC's public register for names matching or similar to a name, across every registration type (business names, companies, LLPs, trustees), ranked like fastcac.com's public search. CAC rejects a new name that's too close to any of them, active or inactive. `exact_match` is the registered name that is this name (case, spacing and the legal form like Ltd ignored), or null. close_matches come best first, each with `match` (exact, close, similar, or null when it only shares a distinctive word); a close match is often the same name with another ending (ADAEZE ENTERPRISES for \"Adaeze Ventures\"), which CAC treats as a clash. Lead with exact_match when there is one; when it's null, say nothing is registered under this exact name and lead with the closest matches as the clash they are. Any close match means the name is at risk; CAC makes the final call (check_business_name_compliance asks it). For an RC/BN number use search_cac_register instead.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The business name to check.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "close_matches": {
                "description": "Names that put this one at risk, best first.",
                "items": {
                  "properties": {
                    "classification": {
                      "type": ["string", "null"]
                    },
                    "match": {
                      "description": "How close the name is to the one searched (exact: the same name, legal form like Ltd ignored); results come best first.",
                      "enum": ["exact", "close", "similar", null],
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "The registered name.",
                      "type": ["string", "null"]
                    },
                    "nature_of_business": {
                      "type": ["string", "null"]
                    },
                    "rc_number": {
                      "description": "RC number (BN number for a business name).",
                      "type": ["string", "null"]
                    },
                    "registration_date": {
                      "description": "ISO date-time CAC registered it.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "CAC status, e.g. ACTIVE or INACTIVE.",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "exact_match": {
                "description": "The registered name that IS this name (case, spacing and the legal form like Ltd ignored), or null. Lead with it when present; a close match is often the same name with another ending, which CAC treats as a clash.",
                "type": ["string", "null"]
              },
              "likely_available": {
                "description": "True when nothing on CAC's register is close (no exact, close or similar match, and none sharing a distinctive word). CAC still decides: check_business_name_compliance asks it.",
                "type": "boolean"
              },
              "other_match_count": {
                "type": "integer"
              },
              "other_matches": {
                "description": "Names sharing only generic words.",
                "items": {
                  "properties": {
                    "classification": {
                      "type": ["string", "null"]
                    },
                    "match": {
                      "description": "How close the name is to the one searched (exact: the same name, legal form like Ltd ignored); results come best first.",
                      "enum": ["exact", "close", "similar", null],
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "The registered name.",
                      "type": ["string", "null"]
                    },
                    "nature_of_business": {
                      "type": ["string", "null"]
                    },
                    "rc_number": {
                      "description": "RC number (BN number for a business name).",
                      "type": ["string", "null"]
                    },
                    "registration_date": {
                      "description": "ISO date-time CAC registered it.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "CAC status, e.g. ACTIVE or INACTIVE.",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "results_capped": {
                "description": "CAC's search hit its 50-result cap.",
                "type": "boolean"
              },
              "searched": {
                "type": "string"
              }
            },
            "required": ["close_matches", "likely_available"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a name against CAC's register"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:16b189b1e3e148aba54a87181753ed410361322d2db5b8e1d40cb7c56ccc9574"
        },
