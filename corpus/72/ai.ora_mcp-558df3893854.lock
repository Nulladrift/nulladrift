        {
          "name": "run_journey",
          "title": "Run Agent Journey",
          "description": "Send a real AI agent at a site on a task and get ora's verdict, step count and insight - how well an agent actually gets things done there, next to the scan_domain score. Pick a curated intent (no key needed) or, with an ora partner API key on the connection, a free-text task. Waits up to 50s for the agent; a longer run comes back with nextAction get_journey_run. Keyless callers get 100 runs per target and task per 24h, plus a small daily allowance per caller; a target at its cap answers with its most recent stored run instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
