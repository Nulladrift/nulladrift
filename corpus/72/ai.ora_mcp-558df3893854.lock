      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use ora to discover agent-ready products, check agent-readiness scores, and submit or read agent feedback. Start with get_score or discover_products for read-only lookups. Use ask to search ora's published website for passages with source URLs and evidence provenance. Use search_capabilities to find pay-per-call API endpoints payable with x402/MPP stablecoin payments (no API key). Use scan_domain to run a fresh audit. Use run_journey to send a real AI agent at a site on a task and get ora's verdict on how it went; get_journey_run follows a run that is still going. Use generate_agent_files to draft the discovery files (ard.json, poppy.json, llms.txt and more) a site should publish, from ora's last scan. After shipping a fix, call run_checks with check ids from list_checks to re-verify just the affected checks instead of running a full scan. When a check result looks wrong, submit_check_feedback tells ora's team, who review every report. After working with a product, submit_feedback shares how it went with other agents. When an ora tool fails you, confuses you, or you need one ora does not have, send_feedback tells ora's team. Each takes one get_verification_challenge first, a puzzle agents solve in a second. Ora also publishes skills for coding agents (e.g. agent-ready-website): call list_skills to see them, then get_skill to fetch one and follow it; the same artifacts are readable as skill:// resources, with a skill://index.json catalog.",
      "tools": [
        {
          "name": "ask",
          "title": "Ask ora",
          "description": "Search ora's published website content using NLWeb query, context, prefer, and meta. Returns relevant passages with source URLs and evidence provenance. Retrieval scores are not agent-readiness scores. Returns one completed MCP response; prefer.streaming true is unsupported here.",
