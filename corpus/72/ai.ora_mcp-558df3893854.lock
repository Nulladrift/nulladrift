        {
          "name": "generate_agent_files",
          "title": "Generate Agent Files",
          "description": "Draft the discovery files agents look for on a site - /.well-known/ard.json, /.well-known/ai-catalog.json and /.well-known/poppy.json, plus on request llms.txt, a robots.txt edit, an RFC 9727 api-catalog and MCP server cards - filled in from ora's last scan of the domain. No new crawl. Returns each file's path, exact body and review notes for you to write into the site.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional. In one sentence, why you are calling this tool: the user's goal. Leave out names, emails and other personal details.",
                "type": "string"
              },
              "domain": {
                "description": "The site's domain (e.g. example.com)",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "include": {
                "description": "Extra files to draft beyond the three .well-known files: llms.txt, robots.txt, api-catalog, mcp-server-card, or all",
                "items": {
                  "enum": ["all", "llms.txt", "robots.txt", "api-catalog", "mcp-server-card"],
                  "type": "string"
                },
                "type": "array"
