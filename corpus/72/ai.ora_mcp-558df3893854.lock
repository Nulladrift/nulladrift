            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "context": {
                "additionalProperties": {},
                "description": "NLWeb conversation or custom context",
                "type": "object"
              },
              "meta": {
                "additionalProperties": {},
                "description": "NLWeb request metadata, including version and session_context",
                "type": "object"
              },
              "prefer": {
                "additionalProperties": {},
                "description": "NLWeb preferences. prefer.limit is ora's maximum retrieved pages: integer 1-20, default 5. Defaults: mode list, response_format conversational_search, streaming false.",
                "type": "object"
              },
              "query": {
                "additionalProperties": true,
                "description": "NLWeb query.text plus optional site and filters",
                "properties": {
                  "text": {
                    "maxLength": 2000,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["text"],
                "type": "object"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
