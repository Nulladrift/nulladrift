        {
          "name": "run_checks",
          "title": "Run Checks",
          "description": "Run a selected subset of checks against a URL and get per-check results back - the re-verify step after shipping a fix, with check ids from list_checks. A run always executes live and spends one unit of the same daily scan budget as scan_domain.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkIds": {
                "description": "Array of check ids from GET /api/checks - one id minimum, up to the catalogued check count. Duplicate ids are deduplicated; ids the catalog does not list are rejected with error code UNKNOWN_CHECK_IDS.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 138,
                "minItems": 1,
                "type": "array"
              },
              "context": {
                "description": "Optional. In one sentence, why you are calling this tool: the user's goal. Leave out names, emails and other personal details.",
                "type": "string"
              },
              "mcpUrl": {
                "anyOf": [
                  {
                    "anyOf": [
                      {
                        "not": {}
                      },
                      {
                        "format": "uri",
                        "type": "string"
                      }
                    ]
                  },
                  {
                    "const": "",
                    "type": "string"
                  }
                ],
                "description": "Optional URL of the target's MCP server, matching the same field on POST /api/scan. It pins the MCP endpoint; a failed handshake never substitutes a discovered server. When omitted, ora auto-discovers MCP endpoints. An empty string is treated as absent."
              },
              "scoringVersion": {
                "description": "Optional. The published scoring version to use for this request. Omitted, the request uses the version pinned to your API key, else the public version. An unpublished or unknown version is refused, and the error lists the published versions.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "The website, MCP server, or API URL to run checks against. A bare domain like example.com is accepted.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["checkIds", "url"],
            "type": "object"
          },
