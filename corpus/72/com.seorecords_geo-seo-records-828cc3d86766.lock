        "type": "http",
        "url": "https://api.seorecords.com/mcp/geo"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "geo-seo-records",
        "title": "GEO SEO Records",
        "version": "1.1.0",
        "websiteUrl": "https://seorecords.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GEO SEO Records runs the engine of the GEO SEO Records module on a public website, from the outside. check_ai_readiness returns what stands between a page and AI assistants (robots.txt door, llms.txt map, answer-first text, citable facts, publisher identity, structure). open_robots_txt_to_ai returns the robots.txt corrected so that assistants reading for a person can enter. draft_llms_txt returns an llms.txt built from facts read on the site, and a review of the existing one. get_geo_offer returns the GEO SEO Records module, which applies this and measures assistant reads. The three checks require this connector's access key (access_key): without it they answer with the two ways to buy one (€9.90 for 24 hours, or €29 per month).",
      "tools": [
        {
          "name": "check_ai_readiness",
          "title": "GEO check of a page for AI assistants",
          "description": "Runs the GEO SEO Records engine on a public page and returns the gaps, weighted blocking / important / to decide, across six parts: the door (robots.txt rules for the robots that read for a person), the map (llms.txt present and verifiable), the answer (does the page answer under its title, declared questions), the citable (figures with a source or a date), the publisher identity, and the structure (blocks that stay true when quoted alone). Requires this connector's access pass (€9.90 for 24 hours, or €29 per month). Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_key": {
                "description": "Access key (pass_…) of this connector, shown after buying its 24-hour pass or monthly subscription. Required.",
                "maxLength": 600,
                "type": "string"
              },
              "url": {
                "description": "The page address, e.g. example.com or https://example.com/page",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "GEO check of a page for AI assistants"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3787a7b38ec17598c30be81bcba9c6a9741df9927fac642a8501b3c9d6926e0"
        },
        {
          "name": "draft_llms_txt",
          "title": "Draft the llms.txt of a website",
          "description": "Builds an llms.txt for a website from facts read on it — the site name and description from its home page, then pages from its sitemap with their titles and meta descriptions, grouped by section — and reviews the existing llms.txt if there is one (declared name, links, claims no machine can verify). The draft is ready to edit and publish at /llms.txt. Requires this connector's access pass (€9.90 for 24 hours, or €29 per month). Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_key": {
                "description": "Access key (pass_…) of this connector, shown after buying its 24-hour pass or monthly subscription. Required.",
                "maxLength": 600,
                "type": "string"
              },
              "url": {
                "description": "The website address, e.g. example.com",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Draft the llms.txt of a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b8f990354c0c72591931adc97cfd68d4756aaf770a85e7812e9b79ba099af4c1"
        },
        {
          "name": "get_geo_offer",
          "title": "GEO SEO Records: offer and payment links",
          "description": "Returns the GEO SEO Records module (WordPress, PrestaShop, network edge; from €490 for a year): what it applies (door, map, answer, publisher) and what it measures (assistant reads certified by IP range, demand read in the log, paying pages joined to revenue), with prices and secure Stripe payment links. Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Language of the product page (default en)",
                "enum": ["en", "fr", "de", "es", "it", "pt", "pl", "nl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GEO SEO Records: offer and payment links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be7d6c6d690ccb831de10cd7e403854aadbc7fba90e73fce3cee394198857247"
        },
        {
          "name": "open_robots_txt_to_ai",
          "title": "Open robots.txt to AI assistants",
          "description": "Reads the site's robots.txt and tells, robot by robot (GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, Claude-User, Claude-SearchBot, PerplexityBot, Perplexity-User, DuckAssistBot, Meta, Common Crawl, Google-Extended, Applebot-Extended), whether it may read the site, separating robots that read for a person (live) from robots that harvest for training. Returns the corrected robots.txt that lets the live readers in while keeping the site's existing rules, ready to paste. Requires this connector's access pass (€9.90 for 24 hours, or €29 per month). Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_key": {
                "description": "Access key (pass_…) of this connector, shown after buying its 24-hour pass or monthly subscription. Required.",
                "maxLength": 600,
                "type": "string"
              },
              "url": {
                "description": "The website address, e.g. example.com",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Open robots.txt to AI assistants"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e35efeea5301ba53425ca4a76f4eeea4e474bd43615d0ecc475c9342deae344c"
        }
      ],
