          "description": "Juegos que aun no han salido, con su fecha de lanzamiento y el precio de reserva sin y con tasas de pago (precio_base y precio_con_tasas) y su formato: cita los dos juntos, «X EUR (Y EUR con tasas)». Usalo cuando pregunten cuando sale un juego o que se puede reservar.",
