          "description": "Busca un juego por nombre y devuelve su id, las plataformas en las que existe y su ficha. Cada precio trae precio_base (sin tasas de pago) y precio_con_tasas: citalos juntos y con su formato, «X EUR (Y EUR con tasas)», o «X EUR (sin tasas)» si tasas es 0. Usalo cuando el usuario mencione un juego y necesites resolverlo antes de pedir precios.",
