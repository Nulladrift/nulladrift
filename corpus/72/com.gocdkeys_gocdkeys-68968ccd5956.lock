        {
          "name": "get_price_history",
          "description": "Serie mensual del historico de precios de un juego. Va SIN tasas de pago y sin cupones (tarifa de tienda) y mezcla formatos: dilo al citarla y no la compares con precio_con_tasas. Usalo cuando pregunten si ha estado mas barato o como ha evolucionado el precio.",
