      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "shipshape-data",
        "title": "Shipshape Data",
        "version": "1.0.0",
        "websiteUrl": "https://shipshapedata.com/developers/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for Shipshape Data, a London AI consultancy that builds data foundations for AI. Use search_resources to answer data/AI questions from their 210 guides, list_services and get_case_studies to describe what they do with real outcomes, and get_ai_readiness_questions + score_ai_readiness to run their AI readiness assessment for a user. Nothing here writes: enquiries go by email (get_contact_info).",
      "tools": [
        {
          "name": "get_ai_readiness_questions",
          "description": "The 16-question AI readiness assessment (four areas: strategy, people, data, change; 15 questions scored). Ask the user each question, then call score_ai_readiness with the answers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "section": {
                "description": "Optional: return just one section's questions",
                "enum": ["strategy", "people", "data", "change"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2aaa0844c043e0453098ffe9a59617ccf1cbf77c6b17136cb0d137d9b0cd4ba2"
        },
        {
          "name": "get_case_studies",
          "description": "The three published case studies with real, verifiable outcomes: Smarter Services (1.5 days of admin freed weekly), 1NCE (multilingual AI support assistant), Slimstock (AI chat on their own content).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Optional: return just this case study; one of \"smarter-services\", \"1nce\", \"slimstock\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9499abbbcd638d0d8810566082b116bd99023c5a538cd27b94355e8e7bd7dbd4"
        },
        {
          "name": "get_contact_info",
          "description": "How to contact the Shipshape Data team on a user's behalf (email; a person replies, usually within one working day). This server has no write tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd62000c13bfea9e1e2e3857ced2c6bcac72455955b2cefc5529be38865fbffc"
        },
        {
          "name": "list_services",
          "description": "List the 13 services of Shipshape Data (a London AI consultancy): AI strategy, data consultancy, AI development, data migration, and nine specialisms including MCP connections and RAG. Returns names, descriptions, and page URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Optional: return just this service, e.g. \"ai-strategy\" or \"mcp-connections\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57c1b196663af5a6b12835a609e08f2c2a7b5e633dd3a61587fef6a0930f8f85"
        },
        {
          "name": "score_ai_readiness",
          "description": "Score AI readiness answers with the same maths as shipshapedata.com/ai-readiness: returns a 0-100 score, one of five maturity bands with guidance, per-area averages, and the weakest area with advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "description": "Either 16 option indices (0-4, all questions in order) or 15 point values (1-5, scored questions only, in order)",
                "items": {
                  "maximum": 5,
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["answers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad0c04567064d41af029483cfcbf40c5632ff65b69e8d9924292a5dec00ad5b5"
        },
        {
          "name": "search_resources",
          "description": "Search Shipshape Data's library of 210 practical guides on data and AI. Each result includes the questions the guide answers and its URL (every page also serves a markdown twin at URL + index.md).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter; one of the names from resource categories",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 5",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search terms, e.g. \"data lineage\" or \"RAG architecture\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5a1d7b763c6d7e5c0d914d32ef56fe8e15dd2fd68b8a44ba41a7f826266e9f94"
        }
      ],
      "digest": "sha256:03841d4b3e79685c99770f1a5153dd062528b6f98a165abd93adbeeaa4ca3c7f"
    }
  }
