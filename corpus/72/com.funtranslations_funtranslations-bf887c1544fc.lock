{
  "lockfileVersion": 2,
  "subjects": {
    "com.funtranslations/funtranslations": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://funtranslations.com/ai/mcp/translate"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Translation Server",
        "version": "0.0.1"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This server provides translations to all the translation languages supported by funtranslations.com.",
      "tools": [
        {
          "name": "list-all-translations-tool",
          "title": "List All Translations Tool",
          "description": "List all the translators available in the system. Result is a paged structured response.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currentPage": {
                "description": "Current page number of this paged response",
                "type": "integer"
              },
              "perPage": {
                "description": "Number of translators returned in this paged response",
                "type": "integer"
              },
              "totalCount": {
                "description": "Total Translators available",
                "type": "integer"
              },
              "translators": {
                "description": "Translators List",
                "type": "array"
              }
            },
            "required": ["currentPage", "perPage", "totalCount", "translators"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dbd18aaf4e5445ace847e97c7281fcba603b5615cf740db53ef9b430c6db2cfc"
        },
        {
          "name": "translate-tool",
          "title": "Translate Tool",
          "description": "Translate the given text using the translator specified and return the result.",
          "inputSchema": {
            "properties": {
              "options": {
                "description": "Optional translator-specific settings, such as {\"style\": \"superscript\"} for small-text. Unknown keys and invalid values are ignored and fall back to the defaults.",
                "type": "object"
              },
              "slug": {
                "description": "The translator to use. Supply the translator slug.",
                "type": "string"
              },
              "text": {
                "description": "The text to translate.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "text": {
                "description": "Input Text",
                "type": "string"
              },
              "translated": {
                "description": "Translated Text",
                "type": "string"
              },
              "translator": {
                "description": "Translator used",
                "type": "string"
              }
            },
            "required": ["text", "translated", "translator"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:63579605f33125ac8e975cf0336f6c1a7608764b2e84125688575d0f67933f81"
        }
      ],
      "prompts": [
        {
          "name": "translate-and-explain-prompt",
          "title": "Translate And Explain Prompt",
          "description": "Translates text using a specific translator and explains the linguistic style and rules behind the translation.",
          "arguments": [
            {
              "name": "slug",
              "description": "The translator slug to use (e.g. \"yodish\", \"pirate-speak\", \"shakespeare-english\"). Use list-all-translations-tool to discover available slugs.",
              "required": true
            },
            {
              "name": "text",
              "description": "The text to translate and explain.",
              "required": true
            }
          ],
          "digest": "sha256:66058a8478d857e62948fd4edfc095fb9ba7e77ee5758dbdc1100510f0d13f8d"
        },
        {
          "name": "translator-picker-prompt",
          "title": "Translator Picker Prompt",
          "description": "Given a user's intent, recommends the best translator and translates the text.",
          "arguments": [
            {
              "name": "intent",
              "description": "Describe the translation style or theme you want (e.g. \"something from Star Wars\", \"old pirate speak\", \"a funny cartoon language\").",
              "required": true
            },
            {
              "name": "text",
              "description": "The text to translate.",
              "required": true
            }
          ],
          "digest": "sha256:d088984822fa40e3baa2e655169270ec95201cd08110067dc0d6d84da367d91a"
        }
      ],
      "digest": "sha256:d95535c762f3776d7e59bdb3d1106563fbbedb8ac16dff735a6a096e66daced8"
    }
  }
}
