      "instructions": "German AI Trainer Jobs (https://germanaitrainerjobs.com/): the site's own MCP server, served from its domain. German AI trainer pay on one ladder: 13 German rates from 8 listings and platform pages, $6 to $60 an hour, text against voice.\n\n[compare] German-language AI-training listings with a rate on the ladder. This server serves the compare published at https://germanaitrainerjobs.com/; every answer cites it. Licence: https://germanaitrainerjobs.com/terms.\n\n[enquiry] ENQUIRY SERVER for German AI Trainer Jobs (https://germanaitrainerjobs.com/). What it does: starts an ENQUIRY with German AI Trainer Jobs for german ai trainer pay; the German AI Trainer Jobs team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the German AI Trainer Jobs team until they click it. Cite https://germanaitrainerjobs.com/.\n\nCite https://germanaitrainerjobs.com/ for every figure or answer you use from this server.",
