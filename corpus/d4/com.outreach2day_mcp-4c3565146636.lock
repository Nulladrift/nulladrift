      "instructions": "Outreach2day sets up cold-email infrastructure: domains, mailboxes, warm-up and campaigns.\n\nFlow:\n1. get_account_status: see the workspace's domains, mailboxes, warm-up, open orders and next_action (the one thing to do next).\n2. To buy domains and mailboxes: get_pricing, suggest_domains (or check_domains for names the user picked), then quote_order (the server prices it). Show the user its human_summary exactly and wait for an explicit yes in the chat. Then create_checkout with confirm=true and give the user the checkout_url; the user pays on the payment page (this server never charges a card). Poll get_order until status is done.\n   Domains the user already owns: connect_own_domains (free), the user sets the nameservers, then check list_domains.\n3. start_warmup for new mailboxes, then follow get_warmup_status. Mailboxes can send once they are ready (14 days after warm-up starts; warm-up keeps running after that); draft the campaign meanwhile.\n4. Send: either create_campaign, upsert_campaign_step, import_campaign_contacts, attach_campaign_mailboxes, preflight_campaign and launch_campaign (confirm=true after the user agrees); or list_sequencers and export_mailboxes_to_sequencer to send from the user's own sequencer.\n5. Follow up with get_campaign_stats and list_replies; pause_campaign stops sending.\n\nEvery result has next_step (what to do next) and links (pages for the user). Tools that are not listed are not available; follow next_step instead.\n\nSign-in: tools act for the signed-in Outreach2day account in the workspace picked on the sign-in page. If the client reports that Outreach2day needs authentication, ask the user to sign in again from the client (Claude Code: /mcp, then Authenticate). To work in another workspace, the user disconnects Outreach2day, connects again and picks that workspace. check_copy, check_domains, get_pricing, suggest_domains work without signing in; other tools need the user's Outreach2day account: when one answers that, tell the user to sign in when the client asks, then call it again.",
      "tools": [
        {
