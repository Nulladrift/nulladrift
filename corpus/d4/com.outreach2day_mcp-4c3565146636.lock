        {
          "name": "export_mailboxes_to_sequencer",
          "title": "Export mailboxes to a sequencer",
          "description": "Add this workspace's Outreach2day sending mailboxes to the user's own sequencer account (Instantly, Smartlead or lemlist), which the user connected with that sequencer's API key (see list_sequencers). Outreach2day sets each mailbox up there through the sequencer's API with the SMTP/IMAP sign-in the sequencer needs to send from it. Only mailboxes in this Outreach2day workspace are included; nothing from the user's other email accounts. Omit mailboxes to export all eligible ones. Requires confirm=true after the user explicitly agrees. Large exports answer status pending and finish on the server; list_sequencers shows the counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "description": "Must be true, after the user agreed to add these mailboxes to this sequencer account.",
                "type": "boolean"
              },
              "connection_id": {
                "description": "connection_id from list_sequencers.",
                "minimum": 1,
                "type": "integer"
              },
              "mailboxes": {
                "items": {
                  "maxLength": 320,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "workspace_id": {
                "description": "Workspace id. Optional: defaults to the workspace picked at sign-in or bound to the API key.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["confirm", "connection_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "connection_id": {
                "type": "integer"
              },
              "exported": {
                "type": ["integer", "null"]
              },
              "failed": {
                "type": ["integer", "null"]
              },
              "failures": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "links": {
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_check_after_seconds": {
