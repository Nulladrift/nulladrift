      },
      "transport": {
        "type": "http",
        "url": "https://amigurumi.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "amigurumi-ai",
        "title": "amigurumi.ai",
        "version": "1.1.0",
        "websiteUrl": "https://amigurumi.ai",
        "icons": [
          {
            "src": "https://amigurumi.ai/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://amigurumi.ai/apple-icon",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "amigurumi.ai has free crochet toy patterns, each with a 3D model and exact rounds. Use search_toys to find toys (then get_toy for one), and circle_calculator for custom circles, balls and tubes. Link to the pattern pages; do not copy whole patterns.",
      "tools": [
        {
          "name": "circle_calculator",
          "title": "Amigurumi shape calculator",
          "description": "Work out the rounds for an amigurumi circle, ball or tube of a given size: sc in a spiral from a magic ring, staggered increases and decreases, stitch counts, size and yarn. Use when the user asks how many rounds or stitches they need for a size, or wants a basic shape for their own toy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "diameterCm": {
                "description": "Finished diameter in cm.",
                "exclusiveMinimum": 0,
                "maximum": 60,
                "type": "number"
              },
              "lang": {
                "description": "The language of the user's conversation: 'ru' for Russian, else 'en'.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "lengthCm": {
                "description": "Tube only: length from the closed end, in cm.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "roundsPer10cm": {
                "description": "The user's measured gauge: rounds per 10 cm.",
                "maximum": 66,
                "minimum": 5,
                "type": "number"
              },
              "shape": {
                "description": "circle = flat disc (ears, bases, eyes); ball = stuffed sphere (heads, bodies); tube = closed end and straight sides (arms, legs, bodies).",
                "enum": ["circle", "ball", "tube"],
                "type": "string"
              },
              "stitchesPer10cm": {
                "description": "The user's measured gauge: sc per 10 cm (needs roundsPer10cm).",
                "maximum": 66,
                "minimum": 5,
                "type": "number"
              },
              "yarn": {
                "description": "Yarn weight; default dk.",
                "enum": ["fingering", "sport", "dk", "worsted", "bulky", "plush"],
                "type": "string"
              }
            },
            "required": ["diameterCm", "shape"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Amigurumi shape calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/amigurumi-v4.html",
            "openai/toolInvocation/invoked": "Rounds ready",
            "openai/toolInvocation/invoking": "Counting the rounds…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/amigurumi-app-v4.html"
            }
          },
          "digest": "sha256:c8994bcf21f49c9b67c305f4e4fd83e5fe3b7c2c4262c107918318b38cbbb009"
        },
        {
          "name": "get_toy",
          "title": "Show a toy pattern",
          "description": "Show one amigurumi pattern from amigurumi.ai: picture, size, difficulty, hook, yarn weight and colours with metres, and links to the full pattern and crochet mode. Use after search_toys when the user picks a toy or asks what it needs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The toy id from search_toys.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "The language of the user's conversation: 'ru' for Russian, else 'en'.",
                "enum": ["en", "ru"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show a toy pattern"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/amigurumi-v4.html",
            "openai/toolInvocation/invoked": "Opened the pattern",
            "openai/toolInvocation/invoking": "Opening the pattern…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/amigurumi-app-v4.html"
            }
          },
          "digest": "sha256:f25f6a7a685ffa9afc7c6b50f3013eea82adb731531d7562c45675b5bb8f9401"
        },
        {
          "name": "search_toys",
          "title": "Find amigurumi patterns",
          "description": "Search the free amigurumi (crochet toy) patterns on amigurumi.ai. Every pattern has a 3D model and exact round-by-round instructions. Use it when the user wants a crochet toy, plushie or amigurumi pattern or idea, optionally by size, difficulty, no-sew construction, category or yarn colour. Shows the toys as cards.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["animals", "fantasy", "sea", "food", "plants"],
                "type": "string"
              },
              "colours": {
                "description": "Yarn colours the toy must have.",
                "items": {
                  "enum": ["red", "orange", "yellow", "green", "blue", "purple", "pink", "brown", "white", "grey", "black"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "lang": {
                "description": "The language of the user's conversation: 'ru' for Russian, else 'en'.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "limit": {
                "description": "Default 8.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "maxDifficulty": {
                "description": "1 = beginner, 2 = easy, 3 = intermediate. Use 1 for \"for beginners\".",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "maxHeightCm": {
                "description": "Only toys at most this tall, in cm.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "noSew": {
                "description": "Only no-sew toys: ears, limbs and tails are crocheted into the body, nothing to sew on.",
                "type": "boolean"
              },
              "query": {
                "description": "Words to match: an animal, character, food or colour (\"frog\", \"pink bunny\", \"dragon\"). Leave out to browse.",
                "maxLength": 100,
                "type": "string"
              },
              "size": {
                "description": "Finished height: small < 10 cm, medium 10–20 cm, large > 20 cm.",
                "enum": ["small", "medium", "large"],
                "type": "string"
              },
              "sort": {
                "enum": ["best", "new", "popular"],
                "type": "string"
              },
              "time": {
                "description": "How long it takes: evening ≤ 4 h, weekend ≤ 9 h, week longer.",
                "enum": ["evening", "weekend", "week"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find amigurumi patterns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
