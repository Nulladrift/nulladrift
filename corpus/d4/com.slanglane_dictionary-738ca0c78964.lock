        "websiteUrl": "https://slanglane.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only, published reference data. Preserve canonical URLs, source URLs, checked dates and release IDs. Some entries contain labeled non-graphic adult vocabulary. Do not infer speaker intent, diagnoses, or personal behavior from a dictionary match. Unknown terms are not generated.",
      "tools": [
        {
          "name": "compare_usage",
          "description": "Return documented regional, register, and disambiguation notes for an exact term. Missing regional evidence is not invented.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "Exact term or alias",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e7855e0f65ee1bd82c54f67492deb790fac6782f830438b763fa4aaba8e2f28"
        },
        {
          "name": "decode_phrase",
          "description": "Find documented slang in a phrase. Preserves ambiguity; not an interpretation of speaker intent. Text is sent to this reference server, never to an LLM.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_mature": {
                "default": true,
                "description": "Include non-graphic adult vocabulary. Default true.",
                "type": "boolean"
              },
              "text": {
                "description": "Phrase, maximum 1,000 characters",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
