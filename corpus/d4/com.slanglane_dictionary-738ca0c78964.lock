        },
        {
          "name": "lookup_term",
          "description": "Look up an exact published slang term, slug, or alias. Includes sources, maturity, canonical URL, and ambiguity. Never generates a meaning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "Exact term, slug, or alias",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
