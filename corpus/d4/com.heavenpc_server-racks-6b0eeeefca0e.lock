        {
          "name": "search_models",
          "title": "Search models",
          "description": "Search the server racks in HeavenPC's comparison, for the United States (Amazon.com, in English) or France (Amazon.fr, in French), by need (free text) and exact filters; returns name, brand, filter values, official data with its source and the link to the model's page on the site (today's price and ratings are there).",
          "inputSchema": {
            "properties": {
              "filters": {
                "description": "{key: [exact values]} or {key: {min, max}}, using the keys and values of the comparison's filters",
                "type": "object"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "default": "us",
                "description": "The market: us = the United States (Amazon.com, in English), fr = France (Amazon.fr, in French). Each market has its own catalog.",
                "enum": ["us", "fr"],
                "type": "string"
              },
              "query": {
                "description": "Need in plain words (e.g. \"quiet for a studio\")",
