        {
          "name": "fragrance_search",
          "description": "Search and filter the Noteboxd fragrance encyclopedia. Requires a query or at least one filter — the full catalogue cannot be listed.\n\nTip: The `q` parameter searches fragrance names OR brand names independently. For best results with a known brand, use the `brand` slug filter instead of including the brand name in `q`.\n\nExamples:\n- \"Find woody fragrances above 8/10\" → accord='woody' + minScore=8\n- \"Creed fragrances\" → brand='creed'\n- \"Bleu de Chanel\" → q='Bleu' + brand='chanel'\n\nSee also: `fragrance_get` for a single fragrance's full profile · `search` for universal cross-entity lookup (brands, notes, perfumers, collections in one call).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "accord": {
                "description": "Accord slug filter, e.g. 'woody', 'gourmand'",
                "minLength": 1,
                "type": "string"
              },
              "brand": {
                "description": "Brand slug filter, e.g. 'creed'",
                "minLength": 1,
                "type": "string"
              },
              "concentration": {
                "enum": ["EDP", "EDT", "Parfum"],
                "type": "string"
              },
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "gender": {
                "enum": ["MASCULINE", "FEMININE", "UNISEX"],
                "type": "string"
              },
              "limit": {
                "default": 24,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minScore": {
                "description": "Minimum community score (0-10)",
                "exclusiveMinimum": 0,
                "maximum": 10,
                "type": "number"
              },
              "note": {
                "description": "Note slug filter, e.g. 'oud', 'bergamot'",
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 9999,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search across fragrance and brand names",
