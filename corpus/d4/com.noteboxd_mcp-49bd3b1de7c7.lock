        {
          "name": "fragrance_search",
          "description": "Search and filter the Noteboxd fragrance encyclopedia. Requires a query or at least one filter — the full catalogue cannot be listed.\n\nTip: The `q` parameter searches fragrance names OR brand names independently. For best results with a known brand, use the `brand` slug filter instead of including the brand name in `q`.\n\nExamples:\n- \"Find woody fragrances above 8/10\" → accord='woody' + minScore=8\n- \"Creed fragrances\" → brand='creed'\n- \"Bleu de Chanel\" → q='Bleu' + brand='chanel'\n\nSee also: `fragrance_get` for a single fragrance's full profile · `search` for universal cross-entity lookup (brands, notes, perfumers, collections in one call).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accord": {
                "description": "Accord slug filter, e.g. 'woody', 'gourmand'",
                "minLength": 1,
                "type": "string"
              },
              "brand": {
