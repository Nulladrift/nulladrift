        {
          "name": "fragrance_similar",
          "description": "Find fragrances with similar accord profiles to a given fragrance. Returns ranked alternatives based on shared accords and character.\n\nSee also: `fragrance_get` for the source fragrance's full profile · `fragrance_search` with note/accord filters for manual exploration.",
