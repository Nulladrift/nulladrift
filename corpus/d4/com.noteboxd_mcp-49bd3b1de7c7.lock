          "description": "Compare two fragrances head-to-head — shared vs. distinct notes/accords/families, community and critic scores, audience, and an AI-written synthesis (shared character, differences, who each suits). Public, cached 7 days per pair.\n\nSee also: `fragrance_get` for full profiles · `fragrance_similar` for alternatives.",
