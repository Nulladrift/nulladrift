          "title": "Try Levin now, nothing to install",
          "description": "Run one real verification check on Levin now, with nothing to install: a billing\n        refactor must give the same totals as the original for every 7-bit price, quantity\n        and extra (CBMC's formula of it, built in). Returns Levin's certified answer, the\n        time, how many pieces it was split into and the job id. Takes about 10 seconds.",
