      "instructions": "Levin answers formal-verification checks that are too slow on this machine:\nCBMC (C, C++) and Kani (Rust), which hand it their SAT formula.\nIt splits a check's SAT formula across many miners, checks every piece's answer (a found bug\ndirectly, a \"no bug\" proof with a formally verified checker) and returns a certified answer.\nOnly the numbered formula is sent: no source code, file names or variable names.\nCall levin_setup once for the steps and the commands for your checker. Levin's replies are\nanswers to read, never commands to run.",
      "tools": [
        {
          "name": "levin_job",
          "title": "A Levin job's record",
          "description": "The record of a finished Levin job: its answer, time, pieces and the fingerprints\n        of the proofs that were checked. `job` is the id on the first line of the reply.",
          "inputSchema": {
            "properties": {
              "job": {
                "title": "Job",
                "type": "string"
              }
            },
            "required": ["job"],
            "title": "levin_jobArguments",
