{
  "lockfileVersion": 2,
  "subjects": {
    "cc.aiones/x-news-monitor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://x-news-monitor-mcp.aiones.cc/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "x-news-monitor-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_now",
          "description": "立即执行一轮监控扫描：抓取监控账号近 N 小时新帖，去重排序，生成中文日报并推送到已配置的 webhook。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hours": {
                "default": 24,
                "description": "时间窗口（小时）",
                "type": "number"
              },
              "min_heat": {
                "default": 0,
                "description": "最低热度分门槛",
                "type": "number"
              },
              "push": {
                "default": true,
                "description": "是否推送 webhook；false 时只返回日报",
                "type": "boolean"
              },
              "top": {
                "default": 10,
                "description": "最多推送条数",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3af15382ef4b8a1edeaf5a53e6aa4188f79b6a1c923aa9d7c6f086615514c5af"
        },
        {
          "name": "push_status",
          "description": "查看 webhook 推送渠道配置状态（feishu/slack/discord 是否已配置）。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:239a555737c3dadb15ca5023ff54c0eef92736177c26b81950cd8d73117d8bc0"
        },
        {
          "name": "reset_seen",
          "description": "清空已见去重库（下轮监控会把时间窗内命中帖当新帖再推一遍，慎用）。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06fd7f9a764c3da418fc4ae22391bcfae1b83a9462bef23a8cb22da377719918"
        },
        {
          "name": "watch_add",
          "description": "把 X 账号加入监控列表（@ 可有可无），可加分组标签方便日报分类阅读。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "X 账号，如 'OpenAI'",
                "type": "string"
              },
              "tag": {
                "default": "",
                "description": "分组标签，如 'AI官方'、'KOL'",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:40d37b964895ad9509e3ee0bec41d80f2b31741a5296fc0007429b18958ecc67"
        },
        {
          "name": "watch_list",
          "description": "查看当前监控列表（账号 + 分组标签 + 加入时间）。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f39c33bd763a88cc019454e22121b8d3acb254002c795294494498dbd7d724c"
        },
        {
          "name": "watch_remove",
          "description": "把账号移出监控列表。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "要移除的 X 账号",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0c562f4725bf7fe2ef9f2fb1234f2ca351b218f5707db0cfd333dcdecdbd437"
        }
      ],
      "digest": "sha256:6c77fbd68f6cda528bffaf626fe0fd11736924df7cdee36b22af9ee9455f8f22"
    }
  }
}
