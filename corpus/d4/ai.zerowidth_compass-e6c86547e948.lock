        {
          "name": "compass_change_effects_set",
          "title": "Say what a change does to steps",
          "description": "Replace a change's effects: for each step it reaches (workflowPageId + nodeId from compass_workflow_steps — a sub-workflow's steps included), one of eliminate, automate (reviewMinutes: what a person still spends checking), parallelize (its wait comes off the critical path), relax_gate (keepShare: share of the wait left, default 0.25), assist (keepShare: share of hands-on time left, default 0.5), reassign (toSubjectPageId). Eliminating or automating every step of a sub-workflow collapses the step that is that sub-workflow. Then project with compass_workflow_rollup changeIds. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response, after the user has approved. Omit on the first call.",
                "type": "string"
              },
              "effects": {
                "items": {
                  "properties": {
                    "effect": {
                      "enum": ["eliminate", "automate", "parallelize", "relax_gate", "assist", "reassign"],
                      "type": "string"
                    },
                    "keepShare": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "nodeId": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "note": {
                      "maxLength": 400,
                      "type": "string"
                    },
                    "reviewMinutes": {
                      "properties": {
                        "high": {
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "number"
                        },
                        "low": {
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["high", "low"],
                      "type": "object"
                    },
                    "toSubjectPageId": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "workflowPageId": {
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["effect", "nodeId", "workflowPageId"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "opportunityId": {
                "description": "The change's key (e.g. ACME-12) or id.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["effects", "opportunityId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Say what a change does to steps"
          },
          "behavior": {
            "destructive": true,
