        {
          "name": "comments_create",
          "title": "Comment on an entity",
          "description": "Posts a comment on a workspace entity — a new thread, or a reply when rootId is given. Use it to leave findings where the discussion already lives (an eval result on the flow being debated, a summary on a long thread). Mention people via mentionedUserIds (from workspace member ids) to ring their notification bell; never mention someone who didn't ask to be pulled in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "type": "string"
              },
              "body": {
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              },
              "entityId": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "entityKind": {
                "description": "What the thread hangs on.",
                "enum": ["workbench_flow", "compass_page", "compass_opportunity", "caliper_review", "caliper_dataset", "caliper_rubric", "caliper_eval", "caliper_spec", "napkin_board", "napkin_diagram", "napkin_doc", "napkin_sheet", "napkin_interface", "ledger_entry", "prism_field", "workspace_file"],
                "type": "string"
              },
              "mentionedUserIds": {
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "rootId": {
                "description": "Reply into this thread; omit to start a new one.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["body", "entityId", "entityKind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Comment on an entity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
