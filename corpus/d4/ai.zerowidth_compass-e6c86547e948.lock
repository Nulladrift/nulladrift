        {
          "name": "compass_gaps_resolve",
          "title": "Resolve a Compass open question (gap)",
          "description": "Closes a gap once you've learned the answer (ANSWERED, with the resolution) or decided it doesn't matter (DISMISSED). Keep the registry honest — resolve gaps as their answers land (from an interview, a doc, or the user) so it always reflects what's still unknown. The resolution alone isn't the map: when the answer says something about a page (who does a step, a tool they use, how a decision gets made), write it there too in the same turn, on the page it's about or as the step, person or system it names. Gaps you raised close without a card; a question a person wrote needs their approval.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Re-call with the approvalId from a needs_confirmation response after the user approves.",
                "type": "string"
              },
              "gapId": {
                "description": "Id of the gap (from compass_gaps_list).",
                "type": "string"
              },
              "resolution": {
                "description": "The answer / note, when marking ANSWERED.",
                "type": "string"
              },
              "status": {
                "description": "ANSWERED (you learned it) or DISMISSED (irrelevant).",
                "enum": ["ANSWERED", "DISMISSED"],
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["gapId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Resolve a Compass open question (gap)"
          },
          "behavior": {
            "destructive": true,
