        {
          "name": "compass_changes_upsert",
          "title": "Bring changes in from another tracker",
          "description": "Create or update up to 100 changes in one call, each matched by `url` — the GitHub issue, Linear or Jira ticket, PR or doc it mirrors. A url already linked to a change updates that change (label, description, status, tags, experiment, workflow — omitted fields are left alone); any other url creates a change with that link. Run it again with the same urls to keep Compass in step; nothing duplicates. Statuses are by name (compass_statuses_list). Returns one result per item — created / updated with the change's key, or failed with why; a failed item doesn't stop the rest. Summarize what you're about to bring in before calling. May return `needs_confirmation` — one approval covers the whole batch.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response, after the user has approved.",
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 5000,
                      "type": "string"
                    },
                    "experiment": {
                      "type": "boolean"
                    },
                    "label": {
                      "maxLength": 200,
                      "minLength": 2,
                      "type": "string"
                    },
                    "linkTitle": {
                      "maxLength": 300,
                      "type": "string"
                    },
                    "statusName": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "maxLength": 40,
                        "minLength": 1,
                        "pattern": "^[a-zA-Z0-9](?:[a-zA-Z0-9 -]*[a-zA-Z0-9])?$",
                        "type": "string"
                      },
                      "maxItems": 50,
                      "type": "array"
                    },
                    "url": {
                      "format": "uri",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "workflowPageId": {
                      "anyOf": [
                        {
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Bring changes in from another tracker"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9ca4edcc382e61d3543d156cc7d0a03594c988d63233f144c8b122ed3efe13fc"
        },
        {
          "name": "compass_gaps_create",
          "title": "Raise a Compass open question (gap)",
          "description": "Records something you don't yet know — the gap registry is your working memory, so use it liberally while mapping or interviewing. Give one clear question, WHY it matters (what answering it unblocks), and how you'd resolve it (ask the user / interview a specific person / connect a source). No approval needed — noting your own uncertainty isn't acting on the user's behalf. Attach it to a subject (subjectType/subjectId) when it's ABOUT a specific page or person.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "question": {
                "description": "The open question, plainly ('Who approves refunds over $500?').",
                "type": "string"
              },
              "rationale": {
                "description": "Why it matters / what answering it unblocks.",
                "type": "string"
              },
              "subjectId": {
                "description": "Id of the subject.",
                "type": "string"
              },
              "subjectType": {
                "description": "What it's about, e.g. compass_page.",
                "type": "string"
              },
              "suggestedResolution": {
                "description": "How to resolve it: 'ask the user', 'interview Dana', 'connect Drive'.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Raise a Compass open question (gap)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ebc4e7d6a4abba834492ebf82538b77447ee250102951eed4424d027809d5619"
        },
