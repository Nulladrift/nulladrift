                "enum": ["workbench_flow", "workbench_task", "workbench_kb", "compass_page", "compass_opportunity", "caliper_dataset", "caliper_rubric", "caliper_eval", "caliper_review", "caliper_spec", "caliper_source", "ledger_entry", "ledger_metric", "napkin_board", "napkin_deck", "napkin_doc", "napkin_sheet", "napkin_diagram", "prism_field", "prism_study"],
                "type": "string"
              },
              "tags": {
                "items": {
                  "maxLength": 40,
                  "pattern": "^[a-z0-9](?:[a-z0-9 -]*[a-z0-9])?$",
