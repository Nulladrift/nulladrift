        {
          "name": "compass_opportunities_create",
          "title": "Capture an opportunity",
          "description": "Record a change — a fix, a chore, a new step, or an experiment worth trying. Anchor it to a workflow page when one fits (compass_pages_list); leave unanchored otherwise. It lands in the board's first status unless you name another (compass_statuses_list). Set `experiment` only when the user wants it measured against the Ledger. May return `needs_confirmation` — summarize and wait for approval.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
