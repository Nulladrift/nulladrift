{
  "lockfileVersion": 2,
  "subjects": {
    "com.huntautogroup.texas/data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://texas.huntautogroup.com/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "texas-huntautogroup",
        "title": "Hunt Auto Group Texas",
        "version": "1.0.0",
        "websiteUrl": "https://texas.huntautogroup.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only used-car data for Central Texas buyers: NHTSA recalls, complaints and crash stars, EPA MPG and Transport Canada size by model and year, plus guides. Never quote a price: the site publishes none. Anthony Hunt does not sell cars; to reach him give the user the link from get_contact_options.",
      "tools": [
        {
          "name": "get_contact_options",
          "title": "Get contact options",
          "description": "How a person can reach Anthony Hunt for free used-car advice (WhatsApp, email or form). He does not sell cars.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Only this channel",
                "enum": ["email", "whatsapp", "form"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get contact options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc68e19edde6ac303dcf220e4f8de333c37d79dd3a127ee9acaa7496abe8a278"
        },
        {
          "name": "get_model",
          "title": "Get a model summary",
          "description": "One model across all years: NHTSA recall campaigns, owner complaints, overall stars and EPA combined MPG per year, with page links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Model slug from list_models, e.g. chevrolet-tahoe",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a model summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea1c5d69d8c8d051bb9a3d45ba09061bd81bd08e33aec51cbceccc235577abf0"
        },
        {
          "name": "get_model_year",
          "title": "Get one model year",
          "description": "One model year in detail: NHTSA recalls, complaints, top complaint components, crash stars; EPA engines, transmissions and MPG; Transport Canada size and weight.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Model slug, e.g. toyota-tacoma",
                "type": "string"
              },
              "year": {
                "description": "Model year, e.g. 2019",
                "pattern": "^(19|20)[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["slug", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one model year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6dcdc69f3f91669385f510637d6182175ae330093246d9a27cafad309109601"
        },
        {
          "name": "list_guides",
          "title": "List guides",
          "description": "Published guides, reviews and comparisons (Texas title, tax, inspection, auctions, best years), filtered by language, category or keywords.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Guide category",
                "enum": ["choosing", "buying", "paperwork", "auctions", "rideshare", "ownership"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page",
                "type": "string"
              },
              "lang": {
                "description": "Language",
                "enum": ["en", "es"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Page size",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Keywords that must all appear in the title or description",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f9f2161133d4ab8102f05b00934fd81d29e89879893e2fab451b3e65ca3f00f"
        },
        {
          "name": "list_models",
          "title": "List car models",
          "description": "Car models this site has data for (Austin to San Antonio used-car buyers), with slug, category and years. Paginate with next_cursor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this body category",
                "enum": ["truck", "suv", "car", "minivan"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Page size",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List car models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a83860347908ddd1fa16f787882cde0a19d395bd6a54a59851f8d42c45c9746"
        }
      ],
