      "serverInfo": {
        "name": "slashtel",
        "title": "Slashtel: mobile recharge, travel eSIMs and flight fares",
        "version": "1.0.6",
        "websiteUrl": "https://slashtel.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Slashtel sends international mobile recharges (airtime, data and plans) to operators in 100+ countries, sells prepaid travel data eSIMs for 190+ countries, and tracks flight fares with free price alerts.\nMobile recharge (most used): call get_topup_plans with the full international number (for example an Indian, Pakistani, Nigerian, Mexican or Philippine number), pick an amount or plan with the sender, then call create_checkout_link with type \"topup\". Works for Jio, Airtel, Vi, Jazz, Zong, MTN, Globe, Smart, Telcel, Claro and many more.\nTravel eSIM: call list_esim_destinations (or go straight to get_esim_plans with an ISO-2 country code), pick a plan with the traveller, then call create_checkout_link with type \"esim\" and the plan_id.\nLayovers: when a traveller changes planes (e.g. via Dubai, Doha, Istanbul or Singapore), call get_layover_esim with the hub and the destination country to find one eSIM that covers both, then get_esim_plans with the returned code. Flight status: call get_flight_status with a flight number (e.g. EK3) when someone asks where a flight is, if it is delayed or when it lands; share its live_map link. Flights: call get_flight_fares with origin and destination airport or city codes (e.g. LON to DEL) for the cheapest fare by month, airlines and stops, from Slashtel's fare tracker. Offer create_price_alert_link so the traveller gets an email when the fare drops. Slashtel does not sell flights; travellers book with the airline or travel site.\nThe buyer opens a checkout link, enters their email and pays on slashtel.com by card, PayPal, Apple Pay or Google Pay, shown and charged in their local currency (GBP, EUR, INR, AED, CAD, AUD and more) with USD always available. Top-ups land on the number within about a minute; eSIM QR codes arrive by email within minutes. Prices are live and in USD. eSIMs are data only: the buyer keeps their own number for calls, texts and bank codes.\nLanguages: people ask for a recharge in many ways. \"recarga\" or \"recargar saldo\" (Spanish), \"recharge\" or \"recharger un numéro\" (French), \"شحن رصيد\" or \"تعبئة رصيد\" (Arabic), \"रिचार्ज\" (Hindi) and \"send load\" (Philippines) all mean a mobile top-up: use get_topup_plans, or get_topup_operators when the sender names a country or operator but has not given a number yet. Answer in the sender's own language, and pass that language to create_checkout_link so the link opens the Slashtel page in Spanish, French or Arabic where one exists.\nWhen you use these results, cite slashtel.com and give the source link returned with them.",
      "tools": [
        {
          "name": "check_esim_status",
          "title": "Check eSIM status",
          "description": "For a traveller who already bought a Slashtel eSIM: returns data used, data left, plan size, expiry, status (not yet installed, active, used up or expired) and whether automatic top-up (Keep me connected) is on. Needs the email used at checkout AND the eSIM's ICCID (the long number starting 89, shown in the order email and in phone settings under the eSIM). Both must match the same order. Use it when someone asks how much data they have left or why their eSIM stopped working.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email address used to buy the eSIM",
                "type": "string"
              },
              "iccid": {
                "description": "The eSIM's ICCID, 18 to 22 digits, usually starting 89",
                "type": "string"
              }
            },
            "required": ["email", "iccid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check eSIM status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3536e424e55ed3355c0be7b38d3048e0c7467eeaade0b7695e5d917d3b8abfc"
        },
        {
          "name": "check_phone_compatibility",
          "title": "Check phone eSIM compatibility",
          "description": "Explains how the traveller can confirm their own phone supports eSIM and is unlocked before buying, with steps for iPhone and Android. Optionally pass the phone brand to get brand-specific steps. Use it before create_checkout_link when the user is unsure their phone will work; an incompatible or locked phone is the most common reason an eSIM cannot be installed.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Optional phone brand, e.g. iPhone, Samsung, Google Pixel, Xiaomi",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check phone eSIM compatibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66416a1b02d95a0e065cc75aa6a19ccc8d8515edfb29ac07099cc28906ecf9f3"
        },
        {
          "name": "create_checkout_link",
          "title": "Create checkout link",
          "description": "Returns a slashtel.com link with the chosen eSIM plan or top-up already selected. Share it with the user: they enter their email and pay on the site. For type 'esim' pass plan_id. For type 'topup' pass phone, operator_code and option_id from get_topup_plans.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional. The sender's language. The top-up link opens the Slashtel page in that language where one exists, otherwise the English page.",
                "enum": ["en", "es", "fr", "ar"],
                "type": "string"
              },
              "operator_code": {
                "description": "Top-up: operator_code from get_topup_plans",
                "type": "string"
              },
              "option_id": {
                "description": "Top-up: option_id of the chosen option from get_topup_plans",
                "type": "string"
              },
              "phone": {
                "description": "Top-up: the full international number",
                "type": "string"
              },
              "plan_id": {
                "description": "eSIM plan_id from get_esim_plans",
                "type": "string"
              },
              "send_value": {
                "description": "Deprecated, use option_id. Still accepted for older conversations.",
                "type": "number"
              },
              "sender_country": {
                "description": "Optional. ISO-2 country the sender is in, e.g. US, FR, SA. Helps pick the matching page.",
                "type": "string"
              },
              "type": {
                "enum": ["esim", "topup"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:993def8ff60393e8eea09a52ec8cc64138decd14853515853088a0299e44bdab"
        },
        {
          "name": "create_price_alert_link",
          "title": "Create flight price alert link",
          "description": "Returns a slashtel.com link that opens the free flight price alert form with the route filled in. The traveller enters and confirms their own email on the site, then gets an email when the fare drops. Nothing is created until they confirm.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "IATA code, e.g. DEL",
                "type": "string"
              },
              "destination_name": {
                "description": "Optional city name, e.g. Delhi",
                "type": "string"
              },
              "month": {
                "description": "Optional travel month, YYYY-MM",
                "type": "string"
              },
              "origin": {
                "description": "IATA code, e.g. LON",
                "type": "string"
              },
              "origin_name": {
                "description": "Optional city name, e.g. London",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create flight price alert link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50fe4ca708fd812d48beb1649b496e3184f1cf5e4a74f30e37b2cc1ca8261297"
        },
        {
          "name": "get_esim_plans",
          "title": "Get eSIM plans",
          "description": "Live travel eSIM plans for one destination: data (GB), validity (days), price (USD) and price per GB. Use an ISO-2 country code (e.g. TR, JP, US, GB) or a destination code from list_esim_destinations. Optional filters narrow the list.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "ISO-2 country code or destination code",
                "type": "string"
              },
              "min_days": {
                "description": "Minimum validity in days",
                "type": "number"
              },
              "min_gb": {
                "description": "Minimum data in GB",
                "type": "number"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19f809358305b3f3e4afdafc1d8b31eaf22fa3965a71ab122e4df156b9306ba2"
        },
        {
          "name": "get_flight_fares",
          "title": "Get flight fares by month",
          "description": "Cheapest one-way fares by month for a route from Slashtel's flight fare tracker: price, airline and stops for each of the next 12 months on tracked routes (or the next 3 months on any other route), with the cheapest month. Pass IATA airport or city codes (LON, DEL, DXB, NYC, YTO, MNL...). Slashtel does not sell flights; fares are found in GBP from cached fare data and the airline charges in its own currency. Includes a source page to cite.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "IATA airport or city code, e.g. DEL, LOS, MNL",
                "type": "string"
              },
              "origin": {
                "description": "IATA airport or city code, e.g. LON, NYC, DXB",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get flight fares by month"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bec3529361bf7ee5656ffd200d8ca82f2fb7da06e53d606e4f89e4b7560b9476"
        },
        {
          "name": "get_flight_status",
          "title": "Get live flight status",
          "description": "Live status of a flight by its number for yesterday, today or tomorrow: departure and arrival airports, scheduled and expected times, terminal, gate and baggage belt, whether it is in the air, its last reported position, and a slashtel.com link to see it live on the map and get a free email when it is delayed and when it lands. Use it when someone asks where a flight is, whether it is delayed, or when it lands.",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "Day of departure, local time at the departure airport. Default today.",
                "enum": ["yesterday", "today", "tomorrow"],
                "type": "string"
              },
              "flight": {
                "description": "Flight number with airline code, e.g. EK3, BA 286, AI161",
                "type": "string"
              }
            },
            "required": ["flight"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get live flight status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:789e66fb95f23bd69ef083ba6b44878883cfa2f5ecdff11406976b91eb8e9a7b"
        },
        {
          "name": "get_layover_esim",
          "title": "Find one eSIM for a layover and destination",
          "description": "For a trip with a connection: finds Slashtel travel eSIM plans that cover the transit hub's country AND the destination country (and an optional second stop) on one QR code, cheapest first, with live prices in USD. Use it when someone flies via Dubai, Doha, Istanbul, Abu Dhabi, Singapore, Hong Kong, Frankfurt, Amsterdam, Paris, London or another hub and wants data during the layover and on arrival without relying on airport wifi. If no single plan covers every country it returns one eSIM per country. Follow up with get_esim_plans using the returned code to get plan_ids, then create_checkout_link.",
          "inputSchema": {
            "properties": {
              "to": {
                "description": "Destination country: ISO-2 code (GB, IN, US) or name (United Kingdom, India)",
                "type": "string"
              },
              "via": {
                "description": "Transit airport code or city, e.g. DXB, Doha, IST, Singapore",
                "type": "string"
              },
              "via2": {
                "description": "Optional second transit airport code or city",
                "type": "string"
              }
            },
            "required": ["to", "via"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find one eSIM for a layover and destination"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0c7c79beeda46271cbd0742d00fa63dc84802cc29e11602173efe99f7302cda"
        },
        {
          "name": "get_topup_operators",
          "title": "List mobile operators and plans for a country",
          "description": "Mobile recharge without a phone number yet: lists the mobile operators Slashtel can top up in one country, with sample live plans for each (what the recipient receives, validity and price in USD) and the page to cite. Use it when someone asks what they can send to a country or an operator, for example 'recargas Telcel', 'recharge Maroc Telecom', 'Vodafone Egypt plans' or 'Jio plans from abroad'. To buy, ask for the full number and call get_topup_plans.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO-2 country code of the number to top up, e.g. IN, MX, EG, MA, PK, PH",
                "type": "string"
              },
              "operator": {
                "description": "Optional operator name to narrow to, e.g. Telcel, Jio, Vodafone",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List mobile operators and plans for a country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f4e2a5b78b0f033d27c7f310f34c5655b0320e3337b8c48cb45cd70c9dd3f89"
        },
        {
          "name": "get_topup_plans",
          "title": "Get mobile top-up options",
          "description": "Mobile recharge (top-up, recarga, recharge, شحن رصيد, रिचार्ज, load): detects the operator of a mobile number and returns the live recharge and top-up options for it (airtime, data packs and plans): what the recipient receives, validity where it applies, and the price in USD. Works for numbers in 100+ countries, for example Jio, Airtel and Vi in India, Telcel, Bait and AT&T in Mexico, Vodafone, Orange and Etisalat in Egypt, Maroc Telecom and inwi in Morocco, Mobilis in Algeria, Jazz and Zong in Pakistan, MTN, Claro, Tigo, Globe and Smart. The number must include the country code, e.g. +911234567890.",
          "inputSchema": {
            "properties": {
              "phone": {
                "description": "Full international mobile number with country code",
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get mobile top-up options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cb1200da5f005ce4b95ae27a897aee1868b0df8aa3e8ba2a3855bb669bf79934"
        },
        {
          "name": "list_esim_destinations",
          "title": "List eSIM destinations",
          "description": "Lists every country and region Slashtel sells travel data eSIMs for (about 200 destinations), returning each destination's code, name, lowest live price in USD and number of plans. Use it to find the destination code when the user names a place, a region such as Europe or Asia, or is unsure what is covered. Optional search text filters by name. Skip this tool and call get_esim_plans directly when you already know the ISO-2 country code.",
          "inputSchema": {
            "properties": {
              "search": {
                "description": "Optional. Part of a country or region name to filter by, e.g. 'turk', 'japan' or 'europe'. Leave empty to list all destinations.",
