{
  "lockfileVersion": 2,
  "subjects": {
    "com.empryo/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://empryo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "empryo-docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "current_release",
          "description": "Read the current published Empryo version and available release artifacts. Never assumes the installed client matches this version.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d8925840e4fd1df889a7a818e82b69827ee390d7a7ed3a9045efecc421ec857"
        },
        {
          "name": "list_docs",
          "description": "List Empryo documentation pages, or the sections and export URLs of one page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page": {
                "maxLength": 200,
                "pattern": "^[a-zA-Z0-9_-]+(?:\\/[a-zA-Z0-9_-]+)*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7616502a4673cd87f5799da9579b64627d51b990c2e2364ddf8b7ca5bcbf27f"
        },
        {
          "name": "read_docs",
          "description": "Read a full Empryo docs page or an exact section as Markdown or plain text. Use selectors returned by search_docs/list_docs; empty anchor means introduction.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "anchor": {
                "maxLength": 300,
                "type": "string"
              },
              "format": {
                "enum": ["markdown", "text"],
                "type": "string"
              },
              "page": {
                "maxLength": 200,
                "pattern": "^[a-zA-Z0-9_-]+(?:\\/[a-zA-Z0-9_-]+)*$",
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1945042dd6ac49691490bbc72de20b9872820b5accbf95f0911f8b1ca9ab640d"
        },
        {
          "name": "search_docs",
          "description": "Search current Empryo documentation. Returns exact page and section selectors and citation URLs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ff80c10d53131043582983311787b70e246a592d8cb23d456210bd1dafa713c"
        }
      ],
      "digest": "sha256:b19ee1733e6d5f11284397f980ad4e2d78736bae5d3af492327dc6679ff9c398"
    }
  }
}
