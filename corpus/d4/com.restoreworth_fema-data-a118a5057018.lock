{
  "lockfileVersion": 2,
  "subjects": {
    "com.restoreworth/fema-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://restoreworth.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "restoreworth-fema-data",
        "title": "RestoreWorth FEMA Data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only FEMA open data (NFIP claims, water depth, county profiles) as computed for https://restoreworth.com. Every amount is from FEMA files: amounts paid by NFIP, not repair cost. No repair-cost estimate is served.",
      "tools": [
        {
          "name": "county_profile",
          "title": "County FEMA profile",
          "description": "FEMA open-data profile of one county by 5-digit FIPS: NFIP paid claims summary, disaster declarations since 2000, FEMA inspections of owner applicants (Individuals and Households Program), NFIP Community Status Book and CRS classes. A value the source does not give is returned as \"not in source\", never 0.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fips": {
                "description": "5-digit county FIPS code, e.g. 48201",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["fips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "County FEMA profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74aa650d0bc2a411d7be85f538699c8560d2e78d29efad807973510cb8430564"
        },
        {
          "name": "flood_damage_by_water_depth",
          "title": "NFIP flood damage by interior water depth",
          "description": "Median damage ratio (FEMA actual cash value of the damage / actual cash value of the building) on NFIP paid claims 2015-2024, by interior water depth band and single-family one-floor segment. With building_value_usd, returns ratio x value: the median ratio of the band, not an estimate for this home.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "building_value_usd": {
                "description": "Optional building value in dollars",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "depth_inches": {
                "description": "Interior water depth in inches (1-240)",
                "maximum": 240,
                "minimum": 1,
                "type": "integer"
              },
              "segment": {
                "description": "Building segment (default single_family_one_floor_no_basement)",
                "enum": ["single_family_one_floor_no_basement", "single_family_one_floor_slab_not_elevated", "single_family_one_floor_not_elevated"],
                "type": "string"
              }
            },
            "required": ["depth_inches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "NFIP flood damage by interior water depth"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf15ba56281b4e8fcb0025af785cf1069b0b2c70f26f81dddebde7bcffde4593"
        },
        {
          "name": "list_sources",
          "title": "Sources and refresh dates",
          "description": "Lists every source file this server reads, with publisher, dataset page, terms, as-of and retrieval dates, and the RestoreWorth page that publishes it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sources and refresh dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11e37a6bd667271a3e500d88ffdb7d4032e8015af48fc2b37418ed1ae1dbf2e2"
        },
        {
          "name": "nfip_claims_by_county",
          "title": "NFIP paid building claims by county",
          "description": "NFIP paid building claims for one county, 2015-2024 and 2020-2024. Give a 5-digit FIPS code, or a county name and its state. A county absent from the table (it keeps counties with at least 100 paid claims) gets the state row, and the answer says so. These are amounts paid by NFIP, not repair cost.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "County name, e.g. Harris County (needs state)",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "fips": {
                "description": "5-digit county FIPS code, e.g. 48201",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              },
              "state": {
                "description": "Two-letter code or state name, with county",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "NFIP paid building claims by county"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b7f0acc90881520a472ca4320464f6e22f28c891b1760c9c13c38352bcdd8a2"
        },
        {
          "name": "nfip_claims_by_state",
          "title": "NFIP paid building claims by state",
          "description": "NFIP paid building claims for one US state or DC, 2020-2024 (FEMA OpenFEMA, NFIP Redacted Claims v3): number of paid claims, quartiles and median of the amount paid, dominant flood event and its share. These are amounts paid by NFIP, not repair cost.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter USPS code (TX) or state name (Texas)",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "NFIP paid building claims by state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bfdf371a8413515bfb1566fb9cc6a0734e42499ab0de52d4c653e33501a8c546"
        }
      ],
      "digest": "sha256:a9a8ec179ef2627b7fbce2d8cb91e7d5c1c04337811f9f09a26d8aca3121fc06"
    }
  }
}
