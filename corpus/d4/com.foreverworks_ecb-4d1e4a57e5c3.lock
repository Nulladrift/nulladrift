  "subjects": {
    "com.foreverworks/ecb": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.foreverworks.com/ecb"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ecb",
        "title": "ECB exchange rates",
        "version": "0.1.1",
        "websiteUrl": "https://foreverworks.github.io/mcps/servers/ecb/",
        "icons": [
          {
            "src": "data:image/png;base64,",
            "mimeType": "image/png"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The European Central Bank's euro foreign exchange reference rates (units of a currency per 1 EUR), read from the ECB's own XML: the rate in force on a day since 1999, every currency or a window of fixings, and exact conversions between any two currencies, cross rates through the euro included. A day without a fixing takes the last working day's, and every answer names the fixing's date. Rates are exact text: never round them again.",
      "tools": [
        {
          "name": "convert",
          "title": "Convert between currencies at the ECB rate",
          "description": "An amount converted between any two currencies the ECB lists, at its fixing in force on a day, computed exactly and rounded once. The euro to a currency is amount x rate, a currency to the euro is amount / rate, and two currencies go through the euro as amount x rate(to) / rate(from), both rates from the same fixing; no rate is rounded on the way. Answers the result with the rate or rates used and the fixing's date, and a sentence stating the rule, so the conversion can be quoted and checked. The ECB's rates are reference rates, not rates a bank or card will give.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount, as a decimal string: \"1250.50\", \"-75\". Never a number.",
                "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "date": {
                "description": "The day of the conversion, YYYY-MM-DD in Frankfurt (an invoice's date, a payment's); default today.",
                "type": "string"
              },
              "from": {
                "description": "The amount's currency, or EUR. ISO 4217; case ignored.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "places": {
                "default": 2,
                "description": "Digits after the point in the result.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "rounding": {
                "default": "half-up",
                "description": "How the result is rounded, once: half-up (halves away from zero, as invoices round) or half-even (banker's).",
                "enum": ["half-up", "half-even"],
                "type": "string"
              },
              "to": {
                "description": "The currency wanted, or EUR. ISO 4217; case ignored.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount converted, as given",
                "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "date": {
                "description": "The day asked for",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fixing_date": {
                "description": "The date of the ECB fixing the conversion used",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "meaning": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "places": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "rates": {
                "description": "The rate of each non-euro currency in the conversion, units per 1 EUR, from the one fixing: one for a euro conversion, two for a cross rate",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "currency": {
                      "type": "string"
                    },
                    "rate": {
                      "description": "The ECB's exact value, units of the currency per 1 EUR",
                      "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                      "type": "string"
                    }
                  },
                  "required": ["currency", "rate"],
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "description": "The converted amount, computed exactly and rounded once",
                "pattern": "^-?\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "rounding": {
                "enum": ["half-up", "half-even"],
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["amount", "date", "fixing_date", "from", "meaning", "ok", "places", "rates", "result", "rounding", "source", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "foreverworks.com/access": "read"
          },
          "digest": "sha256:0eff30e25bb8a062130aa7d6c17e4703799c453d470416f2157154b6cd252620"
        },
        {
          "name": "health",
          "title": "Health",
          "description": "Whether the ECB's reference rates can be read now: the date of its latest fixing and how many currencies it carries against the euro.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currencies": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "latest_fixing": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "source": {
                "type": "string"
              },
              "today": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "warning": {
                "type": "string"
              }
            },
            "required": ["currencies", "ok", "source", "today"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "foreverworks.com/access": "read"
          },
          "digest": "sha256:b9306ecaeac4c8213250207276c39fab9ecc4e5a84a3a64e9ac571ffebf9a117"
        },
        {
          "name": "rate",
          "title": "ECB rate on a day",
          "description": "The European Central Bank's euro foreign exchange reference rate in force on a day: units of the currency per 1 EUR, as the exact value the ECB published (1 EUR = 1.1052 USD), with fixing_date, the date of the fixing it is. The ECB fixes rates on TARGET working days around 16:00 CET; a weekend, a TARGET holiday, or today before 16:00 CET takes the last working day's fixing, so the answer always says which one it used. Covers every day since 1999-01-04, including currencies the ECB has since dropped (HRK, RUB, BGN, ...) on the days it published them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 code: USD, GBP, JPY, CHF, ...; EUR where the tool allows it; case ignored.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "date": {
                "description": "The day, YYYY-MM-DD in Frankfurt; default today.",
                "type": "string"
              }
            },
            "required": ["currency"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "type": "string"
              },
              "date": {
                "description": "The day asked for",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fixing_date": {
                "description": "The date of the ECB fixing this rate is",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "meaning": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "rate": {
                "description": "The ECB's exact value, units of the currency per 1 EUR",
                "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["currency", "date", "fixing_date", "meaning", "ok", "rate", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "foreverworks.com/access": "read"
          },
          "digest": "sha256:fde333ab53eae6b6a94d314fdf8e5a449dacd19fbe876c7101720789b0b229eb"
        },
        {
          "name": "rates",
          "title": "ECB rates: every currency on a day, or a window",
          "description": "The ECB's reference rates as fixings, oldest first, each currency in units per 1 EUR as the ECB published it. With date (default today): every currency's rate in force that day, all from one fixing, whose date the answer gives. With from (and to, default today): every fixing the ECB published in the window, as many as fit in 2000 rates a call (a year of seven currencies, or all of them for about three months). Name currencies to narrow either; leave them out for all. Use it for a chart, an average or a check across several days.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currencies": {
                "description": "ISO 4217 codes, e.g. [\"USD\", \"GBP\"], without EUR; default every currency the ECB published.",
                "items": {
                  "description": "ISO 4217 code: USD, GBP, JPY, CHF, ...; EUR where the tool allows it; case ignored.",
                  "maxLength": 3,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "date": {
                "description": "One day, YYYY-MM-DD in Frankfurt: the rates in force on it. Not with from.",
                "type": "string"
              },
              "from": {
                "description": "A window's first day, YYYY-MM-DD: every fixing from it to `to`.",
                "type": "string"
              },
              "to": {
                "description": "A window's last day, included; default today. Only with from.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "absent": {
                "description": "Currencies asked for that the ECB published no rate of in the window",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "count": {
                "description": "How many rates the fixings hold",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "date": {
                "description": "The day asked for: fixings holds the one in force on it",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fixing_date": {
                "description": "With date: the date of the fixing that was in force",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fixings": {
                "description": "Oldest first; a currency the ECB did not publish on a fixing is missing from that fixing's rates",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "The fixing's date",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "rates": {
                      "additionalProperties": {
                        "description": "The ECB's exact value, units of the currency per 1 EUR",
                        "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                        "type": "string"
                      },
                      "description": "Units of each currency per 1 EUR on that fixing",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["date", "rates"],
                  "type": "object"
                },
                "type": "array"
              },
              "from": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "source": {
                "type": "string"
              },
              "to": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["count", "fixings", "ok", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
