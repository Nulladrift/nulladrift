        {
          "name": "rayana_ai_complete_setup",
          "title": "Redeem a pairing code",
          "description": "For clients that connect with an API key rather than OAuth: exchanges a\npairing code from the user's account page for an API key. Destructive: it\nissues a new key and immediately revokes the account's previous one, so\nany other client still using the old key stops working. OAuth connections\nare not affected.\n\nThe key is returned once and cannot be retrieved later; only a hash of it\nis stored. It is sent as the `X-API-Key` header on MCP and REST\nrequests. Codes are single-use, expire after 15 minutes, and are\ninvalidated after a few wrong attempts.",
          "inputSchema": {
            "properties": {
              "code": {
