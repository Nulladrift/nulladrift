      "instructions": "Read-only access to Rayana AI's market-research engine: model-portfolio rankings, per-ticker scores, aggregator signals, cluster rotation, attention trends, daily briefs, the business-cycle read, and the broadcast model portfolios. All content is impersonal — computed once and served identically to every caller, same as the Rayana AI REST API this mirrors. The research tools require a Pro-tier or higher subscription: sign in with OAuth when the client offers it, or pass an API key as the X-API-Key header on the MCP connection. Three tools work without either: rayana_ai_plans, rayana_ai_start_checkout and rayana_ai_complete_setup, which are how an agent whose principal has no subscription yet can read the pricing, hand them a checkout link, and configure itself afterwards. Opening an AI analyst read counts against the subscription's monthly read allowance, and every response reports the reads remaining.",
