        {
          "name": "rayana_ai_rotation",
          "title": "Cluster rotation",
          "description": "Cluster-rotation layer. `summary`: latest per-cluster RRG\nquadrant/rank rows with deltas, plus the most recent quadrant-crossing\nevents (`days` controls the window both are computed over).\n`laggards`: members trailing a firing cluster's leader. `discovered`:\nunsupervised cluster-discovery cohorts the structural taxonomy misses.\n`members`: structural cluster membership.\n\nOn `summary`, two blocks are trimmed because together they are 80% of\nthe response while answering a narrower question than the rows do.\n`include_trajectory` adds each cluster's full rank series — a chart\npayload, off by default. `events` returns the newest 25 crossings; if\nexactly 25 come back there are probably older ones, and a wider `days`\nis not what returns them.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 45,
                "description": "Window in days, from 2 to 365, for summary only; other views ignore it.",
                "title": "Days",
                "type": "integer"
              },
              "include_trajectory": {
                "default": false,
                "description": "Add each cluster's full rank series (a chart payload), for summary only.",
                "title": "Include Trajectory",
                "type": "boolean"
              },
              "view": {
                "default": "summary",
                "description": "Which part of the rotation layer to return; the tool description says what each holds.",
                "enum": ["summary", "laggards", "discovered", "members"],
                "title": "View",
                "type": "string"
              }
            },
            "title": "rayana_ai_rotationArguments",
            "type": "object"
