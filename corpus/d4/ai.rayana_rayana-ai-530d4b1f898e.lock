        {
          "name": "rayana_ai_start_checkout",
          "title": "Start a subscription",
          "description": "Returns a subscription link for a tier, which the user opens in a\nbrowser. Works without signing in or an API key. The tool itself takes no\npayment: the user signs in, accepts the Terms of Service and pays on\nStripe's hosted checkout page.\n\nStandard does not include access to this server's research tools; Pro and\nElite do. After payment, a connection that signs in with OAuth (as\nClaude's connectors do) reaches the research tools once the user signs in\nwith the same account. A client that connects with an API key instead gets\none through a pairing code on the account page (see\n`rayana_ai_complete_setup`).",
          "inputSchema": {
            "properties": {
              "interval": {
                "default": "month",
                "description": "Billing interval; a year costs ten months' price.",
                "enum": ["month", "year"],
                "title": "Interval",
                "type": "string"
              },
              "tier": {
                "default": "pro",
                "description": "Tier to subscribe to; only pro and elite unlock this server's research tools.",
                "enum": ["standard", "pro", "elite"],
                "title": "Tier",
                "type": "string"
              }
            },
            "title": "rayana_ai_start_checkoutArguments",
            "type": "object"
          },
          "outputSchema": {
            "description": "What an agent hands its human to subscribe. Deliberately NOT a Stripe\nCheckout URL: this link lands on a Rayana page that signs the human in,\ntakes their assent to the Terms, and only then starts Stripe's own hosted\nCheckout. See api/mcp_server.py's `rayana_ai_start_checkout` for why the\nindirection is the point rather than an extra hop.",
            "properties": {
              "interval": {
                "title": "Interval",
                "type": "string"
              },
              "next_steps": {
                "items": {
                  "type": "string"
                },
                "title": "Next Steps",
                "type": "array"
              },
              "pairing_note": {
                "title": "Pairing Note",
                "type": "string"
              },
              "price_usd": {
                "title": "Price Usd",
                "type": "integer"
              },
              "tier": {
                "title": "Tier",
                "type": "string"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["interval", "next_steps", "pairing_note", "price_usd", "tier", "url"],
            "title": "CheckoutHandoff",
            "type": "object"
