{
  "lockfileVersion": 2,
  "subjects": {
    "co.pixelcove/citation-tracker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://citation-tracker.pixelcove.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "citation-tracker",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free Perplexity citation checks for your target domains, plus management of existing monitors.",
      "tools": [
        {
          "name": "citation_tracker_check_perplexity",
          "title": "Check Perplexity citations",
          "description": "Sends one prompt to Perplexity (sonar) and reports whether it cites your target domains, with citation count and cited domains. Free: 5 calls per caller and 200 calls total per UTC day; both limits fail closed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "prompt": {
                "description": "The prompt to send to the search assistant(s), verbatim. 1 to 4000 characters.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "targets": {
                "description": "1 to 10 target domains to check for a citation.",
                "items": {
                  "description": "A normalized domain, e.g. example.com (no scheme, no path, no whitespace, lowercase).",
                  "maxLength": 253,
                  "minLength": 1,
                  "pattern": "^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["prompt", "targets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Perplexity citations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agent-stack/costClass": "cheap",
            "agent-stack/freeTier": true,
            "agent-stack/price": 0
          },
          "digest": "sha256:9f3b3055e73cdf0058372267aaa017a0e336f7ef165aba535a1775fa47e43750"
        },
        {
          "name": "citation_tracker_monitor_cancel",
          "title": "Cancel monitor",
          "description": "Stops an existing monitor and deletes its prompt, domains and results. Needs the monitor_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "monitor_id": {
                "description": "The existing monitor id. It is the only credential; keep it.",
                "maxLength": 64,
                "minLength": 8,
                "pattern": "^ctm_[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["monitor_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel monitor"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "agent-stack/costClass": "cheap",
            "agent-stack/freeTier": true,
            "agent-stack/price": null
          },
          "digest": "sha256:5e686c614d70ee50eb043d6a6f5243052138cabbe428eda5a0c15cc8576d753d"
        },
        {
          "name": "citation_tracker_monitor_status",
          "title": "Check monitor status",
          "description": "Reads an existing monitor: remaining runs, next run time, and runs so far with changes per target domain. Needs the monitor_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "monitor_id": {
                "description": "The existing monitor id. It is the only credential; keep it.",
                "maxLength": 64,
                "minLength": 8,
                "pattern": "^ctm_[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["monitor_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check monitor status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "agent-stack/costClass": "cheap",
            "agent-stack/freeTier": true,
            "agent-stack/price": null
          },
          "digest": "sha256:98136642b78a47de667980b893c02b07fbc6a7417ba9afcdbc7863fbc86fe416"
        }
      ],
      "digest": "sha256:4edcde29e5377269faf4f5b566c3296ee853e53ec37a4ae72bd05af4467a2473"
    }
  }
}
