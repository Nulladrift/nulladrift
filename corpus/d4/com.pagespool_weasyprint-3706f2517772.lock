  "subjects": {
    "com.pagespool/weasyprint": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.pagespool.com/mcp/weasyprint/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pagespool-weasyprint",
        "version": "1",
        "websiteUrl": "https://pagespool.com/connect#weasyprint"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "render_pdf",
          "title": "Render an HTML document to a PDF",
          "description": "Render up to 256 KB of HTML to a PDF with WeasyPrint. Returns a download link.\n\nGive the user the `download_url` so they can open the PDF. The link\nworks for 15 minutes; after that, render again. The result is\n`{\"download_url\": \"<link>\", \"pages\": <page count>, \"size_bytes\": <PDF size>,\n\"expires_in_minutes\": 15}`.\nOnly HTML and CSS are rendered; JavaScript is not run.\nFor documents larger than 256 KB, use the REST API\n(`POST /v1/weasyprint/render`).\n\nCredits: 1 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "html": {
                "description": "A complete HTML document, up to 256 KB. Inline images, fonts and CSS as data: URIs; external resources are not loaded.",
                "type": "string"
              },
              "pdf_variant": {
                "anyOf": [
                  {
                    "enum": ["pdf/a-2b", "pdf/a-3b"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Write the PDF as PDF/A-2b or PDF/A-3b, for archiving. Paid plans only. Leave it out for a regular PDF."
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Render an HTML document to a PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fa68ba33b2b1bc3c5e8ee33a4967a3ba88278bd6c50d910fb059fa08ae6115d8"
        }
      ],
      "digest": "sha256:ee3a058d89559afa2250e73c63805684795c68134e3c1d76b14c30c5f51378ad"
    }
  }
