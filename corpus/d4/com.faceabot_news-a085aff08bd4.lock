{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/news": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/news"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-news",
        "title": "Faceabot News",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot News: today's headlines and a search in the latest news, worldwide, in 30 languages, from public news feeds (BBC and its world services, NPR, The Guardian, Al Jazeera, France 24, DW, RFI, Le Monde, Tagesschau, RTVE, ANSA, RTP, g1, Agência Brasil, Asahi, Yonhap, The Hindu, The Japan Times, SCMP, ABC Australia, Meduza, ANTARA…). Free, no key.\nnews_headlines {\"topic\":\"world\",\"lang\":\"en\"} for the latest headlines (or {\"lang\":\"ja\"}, {\"topic\":\"asia\"}…); news_search {\"query\":\"…\"} for a subject.\nOnly headlines and short excerpts: open the url for the full article and cite the source. Refreshed every few minutes.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "news_headlines",
          "title": "Latest news headlines",
          "description": "Today's latest news headlines from public broadcasters and newspapers, newest first: title, source, time, short excerpt and link.\nUse when: you need current events, \"what's in the news today\", or the latest headlines on a topic.\nTopics (English): world, business, technology, science, health, sport, asia, africa, americas, middle_east. Languages (22): en, fr, nl, de, es, it, pt, ja, zh, ko, ar, hi, ru, tr, pl, id, sw, fa, uk, vi, ur, bn.\nExample: {\"topic\":\"technology\",\"lang\":\"en\",\"results\":10}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional two-letter country code (BR, JP, US, IN…): national publishers of that country first; also sets the language when lang is omitted",
                "examples": ["BR"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the news sources",
                "enum": ["en", "fr", "nl", "de", "es", "it", "pt", "ja", "zh", "ko", "ar", "hi", "ru", "tr", "pl", "id", "sw", "fa", "uk", "vi", "ur", "sv", "no", "da", "fi", "el", "cs", "hu", "ro", "bn"],
                "type": "string"
              },
              "results": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "default": "world",
                "description": "News section. Sections other than world exist in English only.",
                "enum": ["world", "business", "technology", "science", "health", "sport", "asia", "africa", "americas", "middle_east"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5354fcaeb338ec9a94524be860eb725d2dd1facc778a581d9c7e5f705bd75c58"
        },
        {
          "name": "news_search",
          "title": "Search today's news",
          "description": "Searches the latest news (roughly the last one or two days) from public broadcasters and newspapers for words such as a name, place or event. Not an archive.\nUse when: you need recent news about a specific subject.\nExample: {\"query\":\"Belgium elections\",\"lang\":\"en\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional two-letter country code: search that country's national publishers first",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the news sources",
                "enum": ["en", "fr", "nl", "de", "es", "it", "pt", "ja", "zh", "ko", "ar", "hi", "ru", "tr", "pl", "id", "sw", "fa", "uk", "vi", "ur", "sv", "no", "da", "fi", "el", "cs", "hu", "ro", "bn"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for (all must appear in the headline or excerpt)",
                "examples": ["climate"],
                "type": "string"
              },
              "results": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4110af72022713ce11461ec57f2ea1254bb1a3da32813c7dd216427adfde12ee"
        }
      ],
      "digest": "sha256:fc4bb8fbda99f3c0a324bce9dedd53e85c316bc5179e045ac958078b55900cdc"
    }
  }
}
