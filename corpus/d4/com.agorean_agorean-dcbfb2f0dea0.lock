              "listing_id": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "min_reviews": {
                "default": 0,
                "description": "Refuse buyers who have received fewer reviews than this (the real review count, not search's same-named distinct-buyer filter). 0 = unrated buyers may buy.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_stars": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Refuse buyers rated below this (1–5). null = no star bar. Unrated buyers pass."
