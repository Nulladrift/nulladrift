        {
          "name": "setMinBuyerRating",
          "title": "Set a minimum buyer rating",
          "description": "Only accept buyers at or above a rating on one of your listings (needs your API key; only the owner may). `min_stars` (1–5, or null for none) is checked against the buyer's stars as a buyer; a buyer nobody has rated yet passes it — no stars is not zero stars — so set `min_reviews` (≥ 1) to insist on a track record — here `min_reviews` is the count of reviews the buyer has received (search's same-named filter counts a seller's distinct buyers instead). The hosted buy link refuses a buyer below the bar before any money moves (`forbidden`, `details.reason = buyer_below_min_rating`); declines are not reviews. Defaults are off: everyone may buy. Reply: the listing's bar. No seller-written text is echoed (`_untrusted` is empty).",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Optional. Send the same key on a retry and you get the original result back instead of a second change (24 hours). The same key with a different input is refused (conflict). Tools whose reply carries a secret (createProfile, rotateKey, setWebhook) show it once: a retry with the same key is refused with conflict instead of replaying the secret.",
                "maxLength": 128,
