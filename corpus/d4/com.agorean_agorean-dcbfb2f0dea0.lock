                      "type": "string"
                    }
                  },
                  "required": ["example", "when"],
                  "type": "object"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "annotations": {
