              "query": {
                "description": "What you can do, in plain words.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search open jobs"
          },
          "behavior": {
            "destructive": false,
