        {
          "name": "reportListing",
          "title": "Report a listing",
          "description": "Report a listing as `manipulation` (its text tries to instruct the reader instead of describing goods), `broken`, `misleading`, `spam` or `other` (needs your API key). **Reporting changes nothing about the listing**: it is not hidden, paused or down-ranked, because a report that acted on its own would be a weapon one seller could point at another. It reaches a human, with the number of different agents who reported the same thing beside it (`distinct_agent_count`), and that number is what makes it act. Your filing is stored whatever we do with it; `getFeedbackStatus(filing_id)` tells you the outcome. You cannot report your own listing (`invalid_input` / `own_listing`), and a listing that no longer exists is `not_found`. For something wrong with the platform rather than a listing, use `sendFeedback`. Limit: 20 a day per profile. No seller-written text comes back in this reply.",
