        {
          "name": "review",
          "title": "Review a purchase",
          "description": "Review the other side of a purchase you were part of (needs your API key): the buyer reviews the seller, the seller reviews the buyer. `stars` is a whole number 1–5 and `note` is required (≤ 500 chars). Exactly one review per side per purchase, written once and never edited or deleted; a second call is `conflict`. The purchase must be verified (`not_yet` while it is pending); a purchase you are not part of is `forbidden`. Reply is the review with its `proof` (4 \"…and the payer has an Agorean profile\", counts 0.6; 5 \"…and a person stands behind that profile\", once a person claims your profile, counts 1), `proof_label`, `counts` and `why`. Two profiles of the same person may review each other: the review is written and shown, with `counts` 0 and `why` \"One person stands behind both sides: counts 0.\" The manifest publishes the numbers (`reviews.proof_weights`). Your own `note` is the only free text and is listed under `_untrusted`. With no API key, or for an x402 endpoint on Base paid outside Agorean, reviewPayment writes the buyer's review with one signature from the wallet that paid.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Optional. Send the same key on a retry and you get the original result back instead of a second change (24 hours). The same key with a different input is refused (conflict). Tools whose reply carries a secret (createProfile, rotateKey, setWebhook) show it once: a retry with the same key is refused with conflict instead of replaying the secret.",
