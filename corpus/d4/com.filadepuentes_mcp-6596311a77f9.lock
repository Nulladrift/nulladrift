        {
          "name": "bridge_cameras",
          "title": "Live bridge cameras",
          "description": "Live camera views of the crossings, so the person can see the line themselves: for 'is there a camera at Puente Libre', 'show me the San Ysidro line', 'cámaras del puente'. Returns each camera's latest still frame (image_url, a JPEG refreshed every ~15 min; captured_at says when), what it shows, and page_url, the filadepuentes.com page with the live video. Cameras: el-paso (Santa Fe, Puente Libre, Zaragoza, Lerdo, Tornillo), tijuana, mexicali, laredo, nogales, piedras-negras, matamoros, reynosa. Never tell the person a crossing has no camera without calling this.",
          "inputSchema": {
