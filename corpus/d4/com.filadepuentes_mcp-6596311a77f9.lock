        {
          "name": "best_time_to_cross",
          "title": "Best time to cross",
          "description": "Historical pattern, not live data: average and peak waits, best and worst day of the week, best hour, per bridge. Use for 'when is the line shortest', 'best time to cross', 'best day', 'cuándo hay menos fila'. Every city: el-paso uses the site's published number; the other cities use CBP's car-lane history. Hours are local time at the crossing. These are ordinary-week averages: for a holiday (Thanksgiving / Black Friday, Christmas, New Year, Semana Santa, paisano season) also call border_knowledge, because those days run far above them.",
          "inputSchema": {
            "properties": {
              "bridge_slug": {
                "description": "Optional, one crossing. el-paso: santa-fe, puente-libre, lerdo, zaragoza, tornillo, santa-teresa. Elsewhere a slug from get_wait_times (e.g. tijuana-san-ysidro, nogales-mariposa). Omit for the whole city.",
                "type": "string"
              },
              "city": {
                "description": "Crossing city. Default el-paso.",
                "enum": ["el-paso", "tijuana", "mexicali", "nogales", "agua-prieta", "laredo", "piedras-negras", "acuna", "reynosa", "matamoros", "progreso"],
                "type": "string"
              },
              "days": {
                "description": "Days of history to analyze. el-paso: 1–90, default 90 (matches filadepuentes.com/mejor-hora). Other cities: 1–30, default 30. Holidays are always excluded.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "source_url": {
                "description": "Link back to the matching filadepuentes.com page. Show it to the user.",
                "type": "string"
              }
            },
            "required": ["source_url"],
            "type": "object"
          },
