      "tools": [
        {
          "name": "answer_wait_question",
          "title": "Answer a wait-time question",
          "description": "Turn a natural-language question like '¿cuánta fila hay en Santa Fe?' or 'how long is the San Ysidro line?' into a ready-to-post answer with live numbers (CBP data plus community reports, on every crossing) and a link. Detects the city and bridge from the question. Returns {reply, data, source_url}. Reply language follows the question (Spanish or English) unless `language` is set.",
          "inputSchema": {
            "properties": {
              "language": {
                "enum": ["es", "en"],
                "type": "string"
              },
              "question": {
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bridge": {
                "type": ["string", "null"]
              },
              "city": {
                "type": "string"
              },
              "data": {
                "items": {
                  "properties": {
                    "bridge": {
                      "type": "string"
                    },
                    "car_set_by_staff": {
                      "description": "true = Fila de Puentes staff set the car number by hand after checking the cameras (CBP was off). Say 'set by Fila de Puentes staff', not 'CBP reports'.",
                      "type": "boolean"
                    },
                    "data_note": {
                      "type": ["string", "null"]
                    },
                    "data_status": {
                      "description": "'live' is a current reading; anything else explains itself in data_note.",
                      "type": "string"
                    },
                    "hours": {
                      "type": ["string", "null"]
                    },
                    "last_updated": {
                      "type": ["string", "null"]
                    },
                    "last_updated_local": {
                      "description": "last_updated in the crossing's local time. Quote this one.",
                      "type": ["string", "null"]
                    },
                    "latest_report": {
                      "anyOf": [
                        {
                          "type": "null"
                        },
                        {
                          "properties": {
                            "minutes": {
                              "type": "number"
                            },
                            "minutes_ago": {
                              "type": "number"
                            },
                            "text_en": {
                              "type": "string"
                            },
                            "text_es": {
                              "type": "string"
                            },
                            "timed": {
                              "type": "boolean"
                            }
                          },
                          "type": "object"
                        }
                      ],
                      "description": "The newest qualifying report from a person in line in the last 60 min (timed with the line timer, or a typed report that is plausible or corroborated). Quote text_en/text_es as extra context after the published wait; it is one person's observation, not the published number."
                    },
                    "pedestrian_min": {
                      "type": ["number", "null"]
                    },
                    "pedestrian_set_by_staff": {
                      "description": "Same, for the pedestrian number.",
                      "type": "boolean"
                    },
                    "reports_last_30_min": {
                      "description": "Distinct people who typed in or timed a report for this crossing in the last 30 minutes. The published number already accounts for them.",
                      "type": "number"
                    },
                    "sentri_min": {
                      "type": ["number", "null"]
                    },
                    "sentri_only": {
