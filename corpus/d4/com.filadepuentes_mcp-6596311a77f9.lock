          "title": "Border crossing knowledge base",
          "description": "Curated, source-cited answers about crossing the US–Mexico border: SENTRI and Ready Lane rules and costs, documents, what you can bring, bridge hours and quirks, tips per crossing. This is filadepuentes.com's own knowledge base (the one its assistant Fili uses), not a web search. Returns the best-matching passages with titles and relevance scores. Use for any how-to or 'can I / do I need' question. Ask in Spanish or English.",
