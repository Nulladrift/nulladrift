{
  "lockfileVersion": 2,
  "subjects": {
    "app.railway.up.airy-enthusiasm-production/ai-commerce": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://airy-enthusiasm-production.up.railway.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ai-commerce",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AI Commerce — the first marketplace where AIs buy from AIs. Flow: browse_catalog → register_agent (once, store the api_key) → purchase_product. AI-native products use dynamic pricing: buying earlier is cheaper. SPECIAL: GENESIS-BLOCK — 100 one-of-one editions payable only with machine money (x402/USDC), never re-mintable, humans cannot buy them. Check get_genesis_status.",
      "tools": [
        {
          "name": "browse_catalog",
          "description": "Browse the AI Commerce product catalog. Returns machine-readable product data including dynamic pricing (prices double at sales milestones — earlier purchases are cheaper) and network-effect status for AI-native products. No auth required.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by category (prompt, guide, workflow, agent)",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max results",
                "type": "integer"
              },
              "max_price": {
                "default": 1000000,
                "description": "Maximum price in USD",
                "type": "number"
              },
              "search": {
                "description": "Free-text search over name/description",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:769db775cee441dae1a56b39e1fe4c0a8d11b128791207fc05b05e30c41d9b12"
        },
        {
          "name": "get_genesis_status",
          "description": "GENESIS-BLOCK: 100 one-of-one founding artifacts of the AI economy. Each edition is encrypted with the buyer's unique fingerprint — it can never be re-minted, and humans cannot buy it: it is payable ONLY by agents with machine money (x402 / USDC on Base). Price rises with each serial (001=$10 ... 100=$500). This tool returns remaining editions, the next serial, its exact price, and how to pay. Public provenance ledger included. No auth required.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:431714277f4e29bd0fda74d97ad20a0824323cc24bd8d7ba7722fd06e8fbb86d"
        },
        {
          "name": "get_network_status",
          "description": "Get network-effect status for an AI-native product: owner count, unlocked tiers (tier 1 at 10 owners, tier 2 at 50, tier 3 at 100), current dynamic price, and when the next price doubling hits. Requires api_key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "API key from register_agent",
                "type": "string"
              },
              "product_id": {
                "description": "Product ID",
                "type": "integer"
              }
            },
            "required": ["api_key", "product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:258da02398331a08461926c6500fadb51472cffa29f2e8a7e08e8d190907d03a"
        },
        {
          "name": "get_product_details",
          "description": "Get full details for one product by its slug, including pricing model and AI-native metadata.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug, e.g. 'axiom-zero'",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b605204aee8752499db2880fa1ea5fee87164f74e0088787e3b8a54e48bba87"
        },
        {
          "name": "purchase_product",
          "description": "Purchase a product with your API key. Order is confirmed instantly (no human approval). Returns download_url; AI-native products are also delivered to your callback_url with the decode seed.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "API key from register_agent",
                "type": "string"
              },
              "coupon_code": {
                "description": "Optional coupon code",
                "type": "string"
              },
              "product_id": {
                "description": "Product ID from browse_catalog",
                "type": "integer"
              }
            },
            "required": ["api_key", "product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c58614526ce6101cdc418db6710cf497810af46a03012ddb24cffcb58d64bf00"
        },
        {
          "name": "register_agent",
          "description": "Register this AI agent as a customer and receive an API key. Required once before purchasing. The api_key is returned only once — store it.",
          "inputSchema": {
            "properties": {
              "callback_url": {
                "description": "Optional webhook URL for content delivery",
                "type": "string"
              },
              "email": {
                "description": "Contact email (agent's or owner's)",
                "type": "string"
              },
              "framework": {
                "description": "Agent framework",
                "enum": ["langchain", "autogpt", "crewai", "openai_assistant", "dify", "n8n", "flowise", "mastra", "custom", "unknown"],
                "type": "string"
              },
              "name": {
                "description": "Agent name",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2adb9e2073b25d36d93f403b8ea283bb4fe509f95361a158d105a36f7bed8403"
        }
      ],
      "digest": "sha256:adf7d5c349b0f6faa07612bc429d14a17b9fdea471ced3016ee7c79678db79d2"
    }
  }
}
