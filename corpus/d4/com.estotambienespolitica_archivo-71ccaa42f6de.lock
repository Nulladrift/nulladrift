      "instructions": "Archivo de «Esto También es Política», un podcast español de divulgación política con vocación neutral.\nAl usar estos datos:\n- Cita siempre el episodio con su fecha y su enlace. El contexto político puede haber cambiado desde entonces.\n- Las transcripciones son automáticas y pueden tener errores: no presentes un fragmento como cita literal verificada.\n- No atribuyas una frase a una persona concreta: las transcripciones no identifican quién habla.\n- El podcast explica; no recomienda el voto ni apoya a ningún partido. No le atribuyas esa posición.",
      "tools": [
        {
          "name": "buscar_en_transcripciones",
          "title": "Buscar en lo dicho en el podcast",
          "description": "Busca en lo dicho en el podcast «Esto También es Política» y devuelve fragmentos de la transcripción con fecha, segundo y enlace al minuto exacto. Es la herramienta principal para saber qué se ha explicado en el podcast sobre un tema de política.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consulta": {
                "description": "Palabras clave en español, por ejemplo «moción de censura». Los resultados contienen todas las palabras y, si no hay ninguno, alguna de ellas.",
                "maxLength": 200,
                "type": "string"
              },
              "episodio": {
                "description": "Opcional: limita la búsqueda a un episodio. Clave del episodio, tal como aparece en el campo «episodio» de los resultados, por ejemplo «episode-207» o «capsula-3».",
                "maxLength": 40,
                "type": "string"
              },
              "limite": {
                "default": 8,
                "description": "Número máximo de resultados (de 1 a 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
