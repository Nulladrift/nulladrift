            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:701865cf97e05c8a0d1a038e4ead599734d40bbb4ffcc1c2fcbf02d43890f22f"
        },
        {
          "name": "search_providers",
          "title": "Search providers",
          "description": "Literal, case-insensitive search of published provider IDs, names and descriptions in alphabetical order. Empty query lists providers. Returns dated summaries with source links and limits; at most 20 per page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Exact category ID from list_categories, e.g. browser or sandboxes.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of items to return, from 1 to 20. Defaults to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of items to skip before the page. Defaults to 0.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Literal, case-insensitive text to match against provider IDs, names and descriptions. An empty string lists providers.",
                "maxLength": 160,
                "minLength": 0,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search providers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2482e9334de21619b7dc43a12d1b7d707a3ff7bbbefb4a0e160b573467a9e70e"
        }
      ],
      "digest": "sha256:2b4b2ac071924f815933bdc3b1a9f7356101f198067ba3590cc72b3d9335b08b"
    }
