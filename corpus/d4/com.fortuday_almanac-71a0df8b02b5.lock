      "serverInfo": {
        "name": "com.fortuday/almanac",
        "title": "Fortuday — Chinese Almanac, Lunar Calendar & Moon Phase",
        "version": "1.0.0",
        "websiteUrl": "https://fortuday.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use get_almanac_day with a Gregorian date (YYYY-MM-DD) and optional IANA timeZone to retrieve Chinese almanac Yi/Ji activities, Ganzhi pillars, zodiac clash, auspicious hours, Moon sign & phase, Japanese Rokuyo (2026-2030), and Korean lunar data; or convert_solar_to_lunar to convert a Gregorian date into Chinese and Korean lunar dates.",
      "tools": [
        {
          "name": "convert_solar_to_lunar",
          "title": "Convert a Gregorian (solar) date to Chinese and Korean lunar dates",
          "description": "Convert any Gregorian calendar date (YYYY-MM-DD, 1900-2100) into Chinese Lunar calendar date (year, month, day, leap month flag, Ganzhi year/month/day pillars, zodiac animal, solar term, festival) and Korean KASI Lunar calendar date (1900-2049, with Son-eomneun-nal spirit-free day flag).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Gregorian calendar date in YYYY-MM-DD format (1900-01-01 to 2100-12-31), e.g. '2026-11-27'.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d606770932a35b8ac7e4d5f5aed7ab971fec53d579c204751b78ada2d09c9ce"
        },
        {
          "name": "get_almanac_day",
          "title": "Get Chinese almanac, lunar date, Rokuyo, and moon phase for a date",
          "description": "Compute pure-algorithm almanac details for any Gregorian date (1900-2100): Chinese Lunar calendar date, Sexagenary (Ganzhi) year/month/day pillars, auspicious (Yi) and inauspicious (Ji) activities in Traditional Chinese and English, daily zodiac clash & Sha direction, Twelve Duty Officer (Jianchu), auspicious daytime hours, solar term & festival, astronomical Moon sign & phase, Japanese Rokuyo & Koyomi notes (2026-2030), and Korean lunar Son-eomneun-nal status (1900-2049).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional Gregorian calendar date in YYYY-MM-DD format (1900-01-01 to 2100-12-31), e.g. '2026-11-27'. Defaults to today in the selected timeZone.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "timeZone": {
                "description": "Optional IANA time zone name for Moon noon snapshot and default date, e.g. 'Asia/Taipei', 'Asia/Tokyo', 'America/New_York', or 'UTC'. Defaults to 'Asia/Taipei'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
