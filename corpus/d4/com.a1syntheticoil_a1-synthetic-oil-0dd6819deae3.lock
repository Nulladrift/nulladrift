        {
          "name": "suggest_for_vehicle",
          "title": "Suggest AMSOIL products for a vehicle",
          "description": "Matches the viscosity grade and specification a vehicle's owner's manual lists to AMSOIL products, with shopping links carrying dealer referral zo=30734402 and the official AMSOIL lookup link for confirming the exact fit. It does not look up vehicles: give the requirements from the manual. Without them it returns questions to ask (needs) instead of guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "component": {
                "default": "engine",
                "description": "What is being serviced.",
                "enum": ["engine", "transmission", "differential"],
                "type": "string"
              },
              "country": {
                "default": "US",
                "description": "Storefront country: US (amsoil.com) or CA (amsoil.ca).",
                "enum": ["US", "CA"],
                "type": "string"
              },
              "description": {
                "description": "The vehicle or machine, for example \"2020 Chevy Silverado 5.3L\" or \"Polaris RZR 1000 transmission\". Viscosity and specification may be included here.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "from_owners_manual": {
                "default": false,
                "description": "True only when the user read the viscosity and specification from the owner's manual.",
                "type": "boolean"
              },
              "specifications": {
                "description": "Specifications from the owner's manual, for example \"API SP, dexos1 Gen 3\" or \"Dexron VI\".",
                "maxLength": 200,
                "type": "string"
              },
              "vehicle_type": {
                "description": "Optional; detected from the description when omitted (car = car, SUV, or gasoline light truck).",
                "enum": ["car", "diesel", "motorcycle", "powersports", "marine", "small_engine", "tractor"],
                "type": "string"
              },
              "viscosity": {
                "description": "Viscosity grade from the owner's manual, for example 0W-20.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
