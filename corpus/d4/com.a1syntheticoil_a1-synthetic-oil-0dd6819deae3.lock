        {
          "name": "search_products",
          "title": "Search AMSOIL products",
          "description": "Search the AMSOIL catalog by product name, product code, viscosity grade (for example 5W-30), product type, or category, with the same ranking and typo tolerance as the a1syntheticoil.com catalog search. Returns product codes, the A1 product page, the AMSOIL shopping link with dealer referral zo=30734402, matching categories, and related A1 guides. Does not return prices or stock.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category name from list_categories, for example \"Diesel oil\".",
                "maxLength": 100,
                "type": "string"
              },
              "country": {
                "default": "US",
                "description": "Storefront country: US (amsoil.com) or CA (amsoil.ca).",
                "enum": ["US", "CA"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, for example \"0W-20 motor oil\", \"diesel 15W-40\", \"ATF\", or \"EA15K13\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AMSOIL products"
