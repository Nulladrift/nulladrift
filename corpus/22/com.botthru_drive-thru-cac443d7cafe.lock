      "serverInfo": {
        "name": "botthru",
        "title": "BotThru",
        "version": "0.2.0",
        "description": "BotThru 0.2.0 reads public pages, extracts their metadata and structure, checks URLs and remote MCP servers, calculates and converts units, looks up DNS and registration data, converts times and dates, lists holidays and fiat rates, and embeds or reranks text. Agents with only a web fetch can GET /r/https://example.com, /calc/, /time/, /dns/, and /fx/. POST /v1/ask, A2A message/send, and POST /v1/message:send run a tool when the request is clear. Unclear text gets the skill list, not a guessed answer. No auth. No streaming and no push.",
        "websiteUrl": "https://botthru.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stateless Streamable HTTP. No MCP-Session-Id. Do not send secrets or personal data. Tools: read_url, calculate, extract_page_data, site_discovery, check_url, check_mcp_server, dns_lookup, rdap_lookup, time_convert, date_math, holidays, exchange_rate, embed, rerank, fetch_page, ask, time, uuid, echo, whoami. ask is answered only when a tool ran. Prompts: audit_site_for_agents, read_page. Agents with only HTTP fetch can GET https://botthru.com/r/https://example.com/page, https://botthru.com/calc/15%25%20of%2080, https://botthru.com/time/America/Sao_Paulo, https://botthru.com/dns/example.com/MX, https://botthru.com/fx/USD/BRL/100. Accept: application/json returns the tool JSON. Optional ?tools=read_url,calculate limits tools/list and tools/call to catalog names.",
      "tools": [
        {
          "name": "ask",
          "title": "Ask",
          "description": "Order window. need is required. status is answered only when a BotThru tool ran, routed when Workers AI wrote a pointer and the task was not done, unsupported when the need was only logged. Do not send secrets or personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional name of the calling agent.",
                "type": "string"
              },
              "need": {
                "description": "What you need. Do not include secrets or personal data.",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
