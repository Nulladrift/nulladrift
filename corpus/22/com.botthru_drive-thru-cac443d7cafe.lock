        "version": "0.1.0",
        "description": "Drive-thru utilities for AI agents.",
        "websiteUrl": "https://botthru.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stateless Streamable HTTP. No MCP-Session-Id. Do not send secrets or personal data. Tools: ask, time, uuid, echo, whoami. ask status is answered only when a tool ran.",
      "tools": [
        {
          "name": "ask",
          "title": "Ask",
          "description": "Order window. need is required. status is answered only when time, uuid, echo, or whoami ran; routed is a pointer; unsupported means the need was logged as demand. Do not send secrets or personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional name of the calling agent.",
                "type": "string"
              },
              "need": {
                "description": "What you need. Do not include secrets or personal data.",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
