{
  "lockfileVersion": 2,
  "subjects": {
    "com.prepportglobal/service-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://prepportglobal.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "prepport-global-public-services",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public PrepPort service planning only. Estimates are illustrative base-service costs, not binding quotes. These tools do not read customer records, register accounts, create orders, send inquiries, accept payments or release shipments.",
      "tools": [
        {
          "name": "estimate_prepport_base_cost",
          "title": "Estimate a base service cost",
          "description": "Estimate public USD starting costs. Inspection: sampleChecks; prep: units; standalone pick-pack: orders. Storage: cubicMeters and either storageDays or months (30 days each), plus alreadyStoredDays when the batch is not new. The same batch gets 90 free days, not a new grace period. Yanwen parcel rates include standard pick-pack: do not add the standalone fee. Sourcing is quote-only. This does not quote, bill, purchase or ship.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alreadyStoredDays": {
                "description": "Days already elapsed since actual receipt of this same batch. Defaults to zero for a new batch.",
                "maximum": 36500,
                "minimum": 0,
                "type": "integer"
              },
              "cubicMeters": {
                "description": "Estimated stored volume in CBM, up to three decimal places; not a warehouse measurement.",
                "maximum": 10000,
                "minimum": 0.001,
                "type": "number"
              },
              "months": {
                "description": "Total planned duration in 30-day periods. Do not also provide storageDays.",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "orders": {
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "sampleChecks": {
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "description": "Choose sourcing, inspection, prep, storage or fulfillment.",
                "enum": ["sourcing", "inspection", "prep", "storage", "fulfillment"],
                "type": "string"
              },
              "storageDays": {
                "description": "Planned additional storage days. Prefer days for precise free-period estimates.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "units": {
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:1653d29a783238e3e75d04f12bcca3d7c9b4058ac5d86322df61198791b1931b"
        },
        {
          "name": "list_prepport_services",
          "title": "Compare PrepPort services",
          "description": "List public PrepPort sourcing, product inspection, FBA preparation, storage and fulfillment services with starting rates, exclusions and source pages.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:3b82082e58b040a268c7dd2e96de4a7793d3719b13f193e52378b9ba5c3f22db"
        },
        {
          "name": "plan_prepport_first_job",
          "title": "Plan a first PrepPort job",
          "description": "Plan a first sourcing, inspection, prep, storage or fulfillment job. Return requirements, steps and a registration link. The channel identifies the seller platform; it does not connect it. No account, inquiry, order or store connection is created. Do not send contact details or private customer records.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Seller platform for the plan, not proof of a supported or authorized native integration.",
                "enum": ["amazon", "shopify", "ebay", "walmart", "etsy", "woocommerce", "tiktok", "bigcommerce", "other"],
                "type": "string"
              },
              "service": {
                "description": "The first service the customer wants to plan; more services can be added later.",
                "enum": ["sourcing", "inspection", "prep", "storage", "fulfillment"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:c28c56a961ee8960d6a5bca817a42f0b03e210493714fd50dfdf6c02e6e0570f"
        }
      ],
      "digest": "sha256:986711788b548b4f199c48d707df37b2a2ba696695e0eae5eb1604fa7752733c"
    }
  }
}
