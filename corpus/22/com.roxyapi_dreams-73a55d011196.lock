      "tools": [
        {
          "name": "get_dreams_symbols",
          "title": "List and search dream symbols - Dream dictionary API",
          "description": "Browse and search our complete dream interpretation dictionary containing 2,200+ dream symbols with psychological meanings. Find dream meanings for animals (snake dreams, spider dreams, dog dreams), common scenarios (falling dreams, flying dreams, being chased, drowning), people (dreams about mother, father, baby, ex), objects (car, house, water, fire), emotions (fear, anxiety, love), body parts (teeth falling out, hair, eyes), colors, numbers, and abstract concepts. Filter by starting letter for A-Z navigation or search by keyword to find what your dreams mean.",
          "inputSchema": {
            "examples": [
              {}
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "letter": {
                "description": "Filter symbols by starting letter (a-z). Case-insensitive.",
                "example": "a",
                "maxLength": 1,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum items to return per page. Range: 1-50, default 20.",
                "example": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of items to skip for pagination. Default 0.",
                "example": 0,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Search query to match against symbol names and meanings. Case-insensitive.",
                "example": "water",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limit": {
                "type": "number"
              },
              "offset": {
                "type": "number"
              },
              "symbols": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "letter": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "letter", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["limit", "offset", "symbols", "total"],
            "type": "object"
          },
