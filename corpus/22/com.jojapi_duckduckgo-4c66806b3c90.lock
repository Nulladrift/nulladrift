      },
      "transport": {
        "type": "http",
        "url": "https://mcp.jojapi.com/duckduckgo"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jojapi-duckduckgo",
        "title": "DuckDuckGo API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of DuckDuckGo on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/duckduckgo/pricing · Docs: https://jojapi.com/hub/api/duckduckgo",
      "tools": [
        {
          "name": "get",
          "title": "Search",
          "description": "DuckDuckGo web search: the organic results (url, title, plain and HTML snippet, result types, host, sublinks, date, site name, rating) and the other blocks of the same answer: ads, related searches, the knowledge panel, the AI answer when DuckDuckGo gives it inline, and the news, image and video strips. Blocks DuckDuckGo did not send are empty lists or null. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page": {
                "description": "The results page, from 1. The first page holds 10 results, every later page 15; positions continue across pages.",
                "example": 2,
                "title": "Page",
                "type": "integer"
              },
              "q": {
                "description": "The search query.",
                "example": "nikola tesla",
                "title": "Search Query",
                "type": "string"
              },
              "region": {
                "description": "A DuckDuckGo region code such as us-en, de-de or uk-en; wt-wt is no region.",
                "example": "us-en",
                "title": "Region",
                "type": "string"
              },
              "safe_search": {
                "description": "DuckDuckGo's default is moderate.",
                "enum": ["strict", "moderate", "off"],
                "title": "Safe Search",
                "type": "string"
              },
              "time": {
                "description": "Only results from the past day, week, month or year, or from a date range YYYY-MM-DD..YYYY-MM-DD.",
                "example": "week",
                "title": "Time",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4feed6235f278af6a54d2950879452bc04fff1416503482be4f6bc863f312dee"
        },
        {
          "name": "get_autocomplete",
          "title": "Autocomplete",
          "description": "DuckDuckGo's search suggestions for a partial query. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "q": {
                "description": "The search query.",
                "example": "nikola tesla",
                "title": "Search Query",
                "type": "string"
              },
              "region": {
                "description": "A DuckDuckGo region code such as us-en, de-de or uk-en; wt-wt is no region.",
                "example": "us-en",
                "title": "Region",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bcee5320055114fcd563ee7d9439c33c1f37f46e5ebc4a5e0b0e87b2fe65bc09"
        },
        {
          "name": "get_images",
          "title": "Images",
          "description": "DuckDuckGo Images for a query (title, page url, image, thumbnail, width, height). Up to 100 images a page. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "enum": ["color_only", "monochrome", "red", "orange", "yellow", "green", "blue", "purple", "pink", "brown", "black", "gray", "teal", "white"],
                "title": "Color",
                "type": "string"
              },
              "layout": {
                "enum": ["square", "tall", "wide"],
                "title": "Layout",
                "type": "string"
              },
              "license": {
                "description": "creative_commons is any Creative Commons license.",
                "enum": ["creative_commons", "public_domain", "share", "share_commercially", "modify", "modify_commercially"],
                "title": "License",
                "type": "string"
              },
              "page": {
                "description": "The results page, from 1.",
                "title": "Page",
                "type": "integer"
              },
              "q": {
                "description": "The search query.",
                "example": "nikola tesla",
                "title": "Search Query",
                "type": "string"
              },
              "region": {
                "description": "A DuckDuckGo region code such as us-en, de-de or uk-en; wt-wt is no region.",
                "example": "us-en",
                "title": "Region",
                "type": "string"
              },
              "safe_search": {
                "description": "DuckDuckGo's default is moderate.",
                "enum": ["strict", "moderate", "off"],
                "title": "Safe Search",
                "type": "string"
              },
              "size": {
                "enum": ["small", "medium", "large", "wallpaper"],
                "title": "Size",
                "type": "string"
              },
              "time": {
                "description": "Only images from the past day, week or month.",
                "enum": ["day", "week", "month"],
                "title": "Time",
                "type": "string"
              },
              "type": {
                "enum": ["photo", "clipart", "gif", "transparent", "line"],
                "title": "Type",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8237cc0207cd66b066fbd7ba3f2954d3473120ce8ae6228d5e3d85f8428ddea8"
        },
        {
          "name": "get_news",
          "title": "News",
          "description": "DuckDuckGo News for a query, newest coverage first as DuckDuckGo orders it (title, url, excerpt, source, date, image). About 25 articles a page. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page": {
                "description": "The results page, from 1.",
                "title": "Page",
                "type": "integer"
              },
              "q": {
                "description": "The search query.",
                "example": "nikola tesla",
                "title": "Search Query",
                "type": "string"
              },
              "region": {
                "description": "A DuckDuckGo region code such as us-en, de-de or uk-en; wt-wt is no region.",
                "example": "us-en",
                "title": "Region",
                "type": "string"
              },
              "safe_search": {
                "description": "DuckDuckGo's default is moderate.",
                "enum": ["strict", "moderate", "off"],
                "title": "Safe Search",
                "type": "string"
              },
              "time": {
                "description": "Only articles from the past day, week or month.",
                "enum": ["day", "week", "month"],
                "title": "Time",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
