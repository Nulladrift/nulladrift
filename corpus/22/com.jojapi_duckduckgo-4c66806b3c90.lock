            "readOnly": false
          },
          "digest": "sha256:39f02a7a1031016776accce75d6dc541d61d0305fffbbca4d114f4d0a119ca8d"
        },
        {
          "name": "get_places",
          "title": "Places",
          "description": "DuckDuckGo's local results (its Places module and Maps tab): businesses and places with category, address, coordinates, phone, website, rating, review count, price level, opening hours, open now, amenities, photos, menu and sample reviews (rating, text, date). DuckDuckGo takes the listings from Tripadvisor or Yelp depending on the area; `source` names it. Name the place in the query (\"coffee in berlin germany\") or pass latitude and longitude; with neither, DuckDuckGo searches around the address the request leaves from, and a place name several countries share can resolve to the one nearest that address, so add the country. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "latitude": {
                "description": "Search around this point; give longitude with it. Results then carry their distance from it.",
                "example": 48.8566,
                "title": "Latitude",
                "type": "number"
              },
              "longitude": {
                "description": "Search around this point; give latitude with it.",
                "example": 2.3522,
                "title": "Longitude",
                "type": "number"
              },
              "q": {
                "description": "The search query.",
                "example": "nikola tesla",
                "title": "Search Query",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee90690616f31f4758dcefc0cfbdc4db4e8cf3df68e3f0813c23ffb8f65c25da"
        },
        {
          "name": "get_videos",
          "title": "Videos",
          "description": "DuckDuckGo Videos for a query (title, url, description, duration, published, publisher, uploader, views, thumbnail). Up to 60 videos a page. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "short is under 5 minutes, medium 5 to 20, long over 20.",
