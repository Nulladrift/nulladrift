{
  "lockfileVersion": 2,
  "subjects": {
    "app.vercel.warstwa-omega/docs-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://warstwa-omega.vercel.app/docs/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "warstwa-docs",
        "title": "Warstwa: dokumenty i pomoc",
        "version": "1.0.0",
        "icons": [
          {
            "src": "https://warstwa-omega.vercel.app/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only documentation of Warstwa: legal documents (terms, privacy, returns, complaints, delivery and payment) and the help answers, in Polish. Use search_docs, then get_doc before quoting. Products and prices: the catalogue server at https://warstwa-omega.vercel.app/mcp.",
      "tools": [
        {
          "name": "get_doc",
          "title": "Treść dokumentu",
          "description": "Use after search_docs or list_docs to read one document in full before quoting it. Returns the title, the full Polish text (unfilled seller data appears as DO UZUPEŁNIENIA) and its public URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Document id from search_docs or list_docs, e.g. 'prawne/regulamin'",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "body": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["body", "id", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69d9969ec63cf103aee7d86628830bd4bebf833f675dacffdee8e6b814b2f41c"
        },
        {
          "name": "list_docs",
          "title": "Lista dokumentów",
          "description": "Use to see every document this server can return: the shop's legal documents and answered help questions, with ids for get_doc and public URLs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "documents": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "documents"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac275699aa7ac1eced6693f0e134f988bbccfae3c3ba5b73eededb910d6d748e"
        },
        {
          "name": "search_docs",
          "title": "Szukaj w dokumentach",
          "description": "Use to answer questions about Warstwa's rules: returns and 14-day withdrawal, complaints, delivery and payment, privacy, terms, personalisation and care. Searches the legal documents and help answers (Polish) and returns matching documents.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Keywords, e.g. 'zwrot', 'reklamacja', 'dostawa', 'napis'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "documents": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "documents"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e8260df0b1c6144b0fadd78dc139a6419610a9da962df41362424dd988f01ee"
        }
      ],
      "digest": "sha256:e8e1c37400c03716c7c9910a6bec4e5613fd7177664bb07c295dcc7ccf944e6c"
    }
  }
}
