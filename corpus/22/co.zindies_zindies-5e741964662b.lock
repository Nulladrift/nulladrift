        {
          "name": "list_events_by_creator",
          "description": "List upcoming and ongoing Zindies events a creator (author/artist) is\ninvolved in, identified by the creator's public token. A creator relates\nto an event in two ways: as the host (events the creator itself hosts;\nrelation \"organized\") or as a participant (a reserved booth, being listed\nas a participating creator, or hosting/speaking in one of the event's\nprograms such as a workshop or talk). Use `relation` to choose which to\ninclude. Each event carries a `relations` array describing how this\ncreator relates to it. Note that the `organizer` field is a different\nthing: it is the organizing body (a festival committee or group) that\nhosts some events, not this creator. Same response shape as list_events\notherwise. Default range: today through 60 days ahead.\n\nThe response also carries `calendar`: a subscribable iCal feed of the\ncreator's upcoming events (`ics_url`, `webcal_url`, `google_calendar_url`\n— same shape as list_events_by_place). Hand these to the user when they\nwant to follow a creator's events in their calendar app.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "creator_token": {
                "description": "Public token of the creator.",
                "type": "string"
              },
              "event_type": {
                "default": "all",
                "description": "Restrict by event type.",
                "enum": ["day", "period", "all"],
                "type": "string"
              },
              "from": {
                "description": "Range start (YYYY-MM-DD). Default: today.",
                "format": "date",
                "type": "string"
              },
