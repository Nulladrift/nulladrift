        {
          "name": "list_followable_zones",
          "description": "List the event lists (nationwide / each region / each kind) and the\nnew-arrivals list that a user can follow. Following a list delivers\nnotifications of new events in it. Pass an entry's `type` and `slug`\nto toggle_favorite (target_type = type, token = slug) to follow or\nunfollow it.\n\nCoverage: a wider list includes narrower ones. Following nationwide\n(`all/all`) already covers every region and kind, so do not also\nfollow a region on top of it. `all/<area>` covers every kind in that\nregion, `<kind>/all` covers that kind in every region.\n\nBy default only single-axis lists are returned. Pass `kind` and/or\n`area` to also get the combinations for them (e.g. kind=book_club\nreturns book clubs nationwide and in each region, plus the wider lists\nthat cover them), or `combinations: true` for every combination.\n\nFiltering by kind or area leaves out the new-arrivals (creation_zone)\nentry.\n\nWith a Bearer token that has favorites:read, each entry also carries\n`following` (true/false) and `covered_by` (the slug of a wider list the\nuser already follows that includes it, or null). `covered_by` is set\neven when `following` is true, which means the follow is redundant.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Return the lists for this region of Japan (lowercase slug, e.g. \"kanto\", \"kansai\"): every kind in that region plus the wider lists covering it. Combine with `kind` to narrow further. Omit for every region.",
                "enum": ["hokkaido", "tohoku", "kanto", "koshinetsu", "hokuriku", "chubu", "kansai", "chugoku", "shikoku", "kyushu", "okinawa"],
                "type": "string"
              },
              "combinations": {
                "description": "true = also return every kind x region combination (about a hundred entries); false (default) = only the single-axis lists: nationwide, each region, each kind. Prefer `kind` / `area` to get just the combinations you need.",
                "type": "boolean"
              },
              "kind": {
                "description": "Return the lists for this event kind: that kind nationwide and in each region, plus the wider lists covering them (non_genre = general ZINE event, zine_making = ZINE-making workshop, author = author event (talk, signing), festival_style = fair / market with many booths, zine_cafe = ZINE cafe, book_club = book club, utakai = tanka poetry gathering, period_event = multi-day exhibitions / fairs). Omit for every kind. An unknown value returns an error result with `error: \"invalid_argument\"`.",
                "enum": ["non_genre", "zine_making", "author", "festival_style", "book_club", "utakai", "period_event"],
                "type": "string"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              }
            },
            "type": "object"
          },
