          "digest": "sha256:5d2c217327bf9dd3b16278889d90dadf083a4266a7378188c8e4f8fb2311b9f3"
        },
        {
          "name": "get_place",
          "title": "Get shop details",
          "description": "Get a single Zindies place (shop/venue) by token, with address, geo\ncoordinates, place type, zines available there, and business hours.\nNeeds the place's `token`: when the user gives a shop name, call search\n(type: \"place\") first; for shops near a point use find_places_nearby.\nFor the place's event list use list_events_by_place. Pass `locale` for\nthe user's language and `month` only when asking about a specific month.\n`creations` lists up to 24 zines the place carries. Each has\n`carried_since`: when the place added that zine to its shelf on Zindies\n(ISO 8601 with UTC offset, e.g. \"2026-10-03T14:30:00+09:00\"). Use it to\nanswer \"since when does this shop carry it?\" or \"what did this shop\nstart carrying recently?\"; it is not the zine's release date (see\nget_creation `released_at`).\n`stock_status` is the shop's stock state for that zine, the same badge as on the\nweb page, never a count: \"in_stock\", \"low_stock\" (only a few left), \"out_of_stock\",\n\"new_release\" (in stock and released within the last 7 days), \"upcoming\" (the\nzine's release date is still ahead) or \"untracked\" (the shop carries it but does\nnot publish its stock; do not read it as out of stock). It reflects what the shop\nlast entered, not a live inventory, so suggest confirming with the shop before a\nlong trip.\n`area` is the JP region slug of the place (null when unknown) and `zones`\nthe event lists for that region and nationwide (empty when the region is\nunknown): where to look for ZINE events around this shop.\n`business_hours` (null when the place has published nothing about its\nhours) carries `status_now` (open / closed / unknown, same judgement as\nthe web page badge), `regular` (free-text hours / holidays / special\nnotes as written by the place) and `calendar` (the place's day-by-day\ncalendar for this month and next: `days` lists only dates the place has\nset, each with state open / open2 / closed, a `symbol` (○ / ◎ / ✕),\nopening times and `is_open`; `months[].legend` explains the symbols,\n`months[].note` carries the month's remark and `ics_url` is an iCal\nfeed of the same calendar for subscribing). A date missing from\n`calendar.days` has no day-specific setting: fall back to `regular`,\ndo not treat it as closed. Use this to answer \"is this shop open on\n(date)?\" without fetching the web page.\n\nWith `month` (\"YYYY-MM\", past months too) `calendar` covers that one\nmonth instead of this month and next, in the same shape; it is null\nwhen the place set no day for that month. Nothing else changes.\n\n`events` points at the place's events: `url` (the upcoming-events page)\nand `calendar`, a subscribable iCal feed of upcoming events (`ics_url`,\n`webcal_url` for Apple Calendar / Outlook, `google_calendar_url`). Give\nthis one when the user wants a shop's events in their calendar; the\nopening-days feed is `business_hours.calendar.ics_url`.\n\n`event_proposals` is non-null only when the place has said it is open\nto people proposing an event to hold there: `terms` (what the place\nwrote about its space and conditions; may be null) and `contact_url`\n(the page where a creator or another shop starts that conversation).\nnull means the place has not said so on Zindies — it is not a refusal;\ndo not tell the user the place rejects events.\nEach entry in `zones` is an event list on Zindies (`name`, `url`) where the user can find more events like these. To follow a list, pass its `type` and `slug` to toggle_favorite (target_type = type, token = slug); new events in it are then delivered to the user, so follow only when the user asks. list_followable_zones lists every list and whether the user already follows it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "month": {
                "description": "Optional. A month as \"YYYY-MM\" in Japan time (e.g. \"2026-10\"). When given, `business_hours.calendar` covers only that month, past or future, instead of this month and next. Omit for the default (this month and next). A malformed value returns an error result with `error: \"invalid_argument\"`.",
                "type": "string"
              },
              "token": {
                "description": "Public token of the place: a short lowercase string such as \"fqpi\", taken as-is from the `token` field of a place in search, find_places_nearby, get_creation (`places[].token`) or an event's `place.token`. Not the numeric `id`, the shop name, or the @handle shown in a page URL. Exact match; an unknown or non-public token returns an error result with `error: \"not_found\"`.",
                "type": "string"
              }
