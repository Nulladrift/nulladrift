        {
          "name": "list_followable_zones",
          "title": "List followable event lists",
          "description": "List the event lists (nationwide / each region / each kind) and the\nnew-arrivals list that a user can follow. Following a list delivers\nnotifications of new events in it. Pass an entry's `type` and `slug`\nto toggle_favorite (target_type = type, token = slug) to follow or\nunfollow it.\n\nCoverage: a wider list includes narrower ones. Following nationwide\n(`all/all`) already covers every region and kind, so do not also\nfollow a region on top of it. `all/<area>` covers every kind in that\nregion, `<kind>/all` covers that kind in every region.\n\nBy default only single-axis lists are returned. Pass `kind` and/or\n`area` to also get the combinations for them (e.g. kind=book_club\nreturns book clubs nationwide and in each region, plus the wider lists\nthat cover them), or `combinations: true` for every combination.\n\nFiltering by kind or area leaves out the new-arrivals (creation_zone)\nentry.\n\nWith a Bearer token that has favorites:read, each entry also carries\n`following` (true/false) and `covered_by` (the slug of a wider list the\nuser already follows that includes it, or null). `covered_by` is set\neven when `following` is true, which means the follow is redundant.\nFor everything the user follows (creators, shops and events too), use\nlist_my_favorites.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Return the lists for this region of Japan (lowercase slug, e.g. \"kanto\", \"kansai\"): every kind in that region plus the wider lists covering it. Combine with `kind` to narrow further. Omit for every region.",
                "enum": ["hokkaido", "tohoku", "kanto", "koshinetsu", "hokuriku", "chubu", "kansai", "chugoku", "shikoku", "kyushu", "okinawa"],
                "type": "string"
              },
              "combinations": {
                "description": "true = also return every kind x region combination (about a hundred entries); false (default) = only the single-axis lists: nationwide, each region, each kind. Prefer `kind` / `area` to get just the combinations you need.",
                "type": "boolean"
              },
              "kind": {
                "description": "Return the lists for this event kind: that kind nationwide and in each region, plus the wider lists covering them (non_genre = general ZINE event, zine_making = ZINE-making workshop, author = author event (talk, signing), festival_style = fair / market with many booths, zine_cafe = ZINE cafe, book_club = book club, utakai = tanka poetry gathering, period_event = multi-day exhibitions / fairs). Omit for every kind. An unknown value returns an error result with `error: \"invalid_argument\"`.",
                "enum": ["non_genre", "zine_making", "author", "festival_style", "book_club", "utakai", "period_event"],
                "type": "string"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List followable event lists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["favorites:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:cb51c0c124552363a2b78933e28ff958406fb2ab756e952a306d7a969a4f8077"
        },
        {
          "name": "list_my_favorites",
          "title": "List what you follow",
          "description": "List what the authenticated user follows on Zindies — their own\nfavorites only: creators, creations (ZINEs), places (shops), events, and\nthe event lists / new-arrivals list they follow — most recently followed\nfirst. Use it for \"what am I following?\" or \"which shops did I save?\",\nand to learn whether something is already followed before calling\ntoggle_favorite (which flips the state). It never returns other\npeople's follows or how many people follow something.\n\nTo change a follow use toggle_favorite. For the catalog of every list\nthat can be followed, with coverage between lists, use\nlist_followable_zones. For events the user said they will attend use\nlist_my_participations. Public data (search, list_events, get_*) needs\nno token.\n\nRequires a Bearer token (a User API token, or an OAuth token with the\nfavorites:read scope). Without one the server answers HTTP 401\n(\"unauthorized\"), and with a token lacking the scope HTTP 403\n(\"insufficient_scope\"); both carry a WWW-Authenticate header that\nstarts the OAuth sign-in.\n\nReturns `favorites`, `count` (entries in this response) and `has_more`.\nEach entry has `type`, `followed_at`, `url` and the same summary fields\nas a search hit: `id`, `token`, `name`, `title` for a creator; `id`,\n`token`, `title`, `released_year` for a creation; `id`, `token`,\n`name`, `latitude`, `longitude`, `area` for a place; `id`,\n`event_type`, `title`, `kind`, `area` and its dates for an event;\n`id`, `slug`, `name`, `kind`, `area` for a list. Pass `token` to\nget_creator / get_creation / get_place and an event's `id` to\nget_event. To unfollow, pass `type` as target_type to toggle_favorite\nwith the `token` (an event's `id` as a string, a list's `slug`).\n\nNothing followed returns `favorites: []`, not an error. Entries that\nare no longer public (made private, or an event whose announcement\ndate was moved to the future) are left out.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 50,
                "description": "Maximum number of entries to return. When `has_more` is true, call again with `offset` raised by this many.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of entries to skip from the most recently followed, for the next page: 0 (default) for the first page, then `offset` + `limit` while `has_more` is true.",
                "minimum": 0,
                "type": "integer"
              },
              "type": {
                "description": "Return only follows of this kind: `creator`, `creation` (ZINEs and other works), `place` (shops / venues), `event`, `event_zone` (event lists such as \"every event in Kanto\") or `creation_zone` (the new-arrivals list). The values are those of toggle_favorite's `target_type`. Omit for every kind mixed in one list.",
                "enum": ["creator", "creation", "place", "event", "event_zone", "creation_zone"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List what you follow"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["favorites:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6492a8bc01123e8c75ed67e58e95a3c4a1ea6c58fc65188025ad062f7976190d"
        },
        {
          "name": "list_my_participations",
          "title": "List events you joined",
          "description": "List the events the authenticated user has registered to attend on\nZindies — their own RSVPs only (made with rsvp_event or the \"join\"\nbutton on an event page). Use it for \"which events am I going to?\",\n\"what did I sign up for next month?\" or \"which events did I attend?\".\nIt never returns other participants or how many people joined.\n\nTo join or cancel use rsvp_event. For events the user only follows\n(bookmarked without joining) use list_my_favorites with type: \"event\".\nFor public events to choose from use list_events; for one event's\nvenue, booths and programs pass an `id` from here to get_event.\n\nRequires a Bearer token (a User API token, or an OAuth token with the\nparticipations:read scope). Without one the server answers HTTP 401\n(\"unauthorized\"), and with a token lacking the scope HTTP 403\n(\"insufficient_scope\"); both carry a WWW-Authenticate header that\nstarts the OAuth sign-in.\n\nReturns `events`, `count` (events in this response), `when` and\n`has_more`. Each event has the fields list_events returns (`id`,\n`event_type` with its dates, `title`, `location`, `kind`, `area`,\n`url`, `place` / `facility`, `organizer`, `created_at`, `listed_at`)\nplus `cancelled` (true when the organizer called the event off; the\nRSVP itself is still listed), `comment` (the user's own public comment\non their participation, or null) and `joined_at`.\n\nNo matching RSVP returns `events: []`, not an error. An event whose\nannouncement date was moved to the future is left out until then.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of events to return. When `has_more` is true, call again with `offset` raised by this many.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of events to skip from the start of the order `when` gives, for the next page: 0 (default) for the first page, then `offset` + `limit` while `has_more` is true.",
                "minimum": 0,
                "type": "integer"
              },
              "when": {
                "default": "upcoming",
                "description": "`upcoming` (default) = events that have not ended yet, including ones under way now, soonest first; `past` = events that have ended, most recent first. There is no date-range filter: read each event's dates to narrow further.",
                "enum": ["upcoming", "past"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List events you joined"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["participations:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:e7287be155c05e1bc00652039c0f57fe716c966c94a07f00e1ef9b77fe9d235c"
        },
        {
          "name": "rsvp_event",
          "title": "Join or cancel an event",
          "description": "Register (\"join\") or withdraw (\"cancel\") the authenticated user's\nintention to attend a Zindies event. This is a free RSVP shown on the\nevent page; it is not a ticket purchase or a paid booking. Requires a\nBearer token (a User API token, or an OAuth token with the\nparticipations:write scope). Act only when the user asked to; to just\nbookmark an event without attending, use toggle_favorite instead. To\nsee what the user has already joined, use list_my_participations.\n\nUnlike toggle_favorite this is not a toggle: `action` states the\noutcome you want, and repeating a call is safe.\n- join: adds the user to the event's participants (the public\n  participant count goes up by one and, when the event has a capacity,\n  one place is taken) and also favorites the event. Joining again when\n  already joined creates no duplicate: it succeeds and only replaces\n  the comment if `comment` is given. A new join is refused with\n  `error: \"full\"` when the capacity is reached and `error: \"cancelled\"`\n  when the event has been called off.\n- cancel: removes the participation and deletes its comment for good\n  (the place is freed at once and the count goes down), and also\n  removes the user's favorite on the event, even one made before\n  joining. Cancelling when not joined succeeds and changes nothing\n  else. Joining again later is allowed while places remain.\n\nThe comment is public: it appears with the participation on the event\npage. Returns `joined` (the state after the call), `comment` (the\nstored comment, null when none or after cancel) and `event` (`id`,\n`title`, `url`). Errors come back as an error result with `error`:\n\"unauthorized\", \"insufficient_scope\", \"not_found\" (unknown or not yet\nannounced event), \"full\", \"cancelled\" or \"unprocessable_entity\".\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "default": "join",
                "description": "`join` (default) = make the user a participant; `cancel` = withdraw. It names the resulting state, not a toggle: `join` on an already joined event keeps the participation, `cancel` on a not-joined event is a no-op.",
                "enum": ["join", "cancel"],
                "type": "string"
              },
              "comment": {
                "description": "Optional short message from the user shown publicly with their participation on the event page, e.g. \"午後から伺います\". Plain text in the user's own words; do not invent one. Only used with `join`: omitted on a first join stores no comment, omitted when already joined keeps the existing one, and an empty string clears it. Ignored for `cancel`.",
                "type": "string"
              },
              "event_id": {
                "description": "Numeric id of the event, e.g. 1234: the `id` field of an event from list_events, list_events_by_place, list_events_by_creator, search or get_event.",
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Join or cancel an event"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["participations:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fff08eea73bdeb010d8a40d2080e183b9c4d801bd86203c269dce17406c91951"
        },
        {
          "name": "search",
          "title": "Search Zindies",
          "description": "Search across Zindies creators, creations (zines), places (shops/venues),\nand events by keyword. Use `query` for the keyword and optional `type`\nto restrict to one resource. The response is always an object keyed by\nresource (`creators` / `creations` / `places` / `events`); with a single\n`type`, only that key is present. `limit_per_type` caps each list.\n\nUse it when you have a name or a keyword and need the `token` (creators,\ncreations, places) or `id` (events) that the get_* tools take. It matches\ntext only: for shops around a location use find_places_nearby, and for\nevents by date, region or kind use list_events. Hits are summaries; pass\na hit's `token` / `id` to get_creator / get_creation / get_place /\nget_event for the details. No match returns empty arrays, not an error.\n\nPlaces and events carry `area` (the JP region slug, null when unknown) and\nevents `kind`. To go from one hit to the wider list, pass them to\nlist_events (`area`, `kind`); get_event / get_place return the event\nlists a hit appears in (`zones`), and list_followable_zones every list.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit_per_type": {
                "description": "Max items per resource type. Default 6 (max 24) when type=all; default 20 (max 50) for a single type.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "query": {
                "description": "Keyword(s), at least 2 characters, e.g. \"リソグラフ\" or \"risograph tokyo\". Full-text match against names, titles and descriptions in every language (the original and its translations). Partial names work, and upper / lower case, full / half width and hiragana / katakana are treated as the same. Several words separated by spaces must all match (AND); there are no operators, quoting or wildcards. Prefer one or two distinctive words: a long phrase rarely matches.",
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "default": "all",
                "description": "Which resource to search: `creator` (authors / artists), `creation` (ZINEs and other works), `place` (shops / venues), `event`, or `all` (default) for the four at once. Use a single type when you know what the user is looking for: it allows more results per call.",
                "enum": ["all", "creator", "creation", "place", "event"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Zindies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:6b4ef2879a57c6787d9a56f9e568fe7ec1f06a627095f5078ed5770ad9804136"
        },
        {
          "name": "toggle_favorite",
          "title": "Follow or unfollow on Zindies",
          "description": "Toggle the authenticated user's favorite (shown to them as \"follow\") on\na creator, creation, place, or event, or on an event list (event_zone) /\nthe new-arrivals list of creations (creation_zone). Requires a Bearer\ntoken (a User API token, or an OAuth token with the favorites:write\nscope). Act only when the user asked to.\n\nIt flips the current state: not favorited becomes favorited, favorited\nbecomes not favorited. There is no separate add / remove, so do not\ncall it twice to \"make sure\" — the second call undoes the first. Read\nthe result to learn the state you ended in; to check beforehand, use\nlist_my_favorites (everything the user follows) or, for lists,\nlist_followable_zones (`following`).\n\nEffects: favoriting a creator, creation, place or event adds it to what\nthe user follows on Zindies. Following a list also subscribes the user\nto notifications of new entries in it. Unfavoriting removes only that\nfollow (and, for a list, stops its notifications); nothing else of the\nuser's is deleted, and calling again restores it. That removal is why\nthe tool is annotated as destructive. To attend an event use\nrsvp_event, which favorites the event by itself.\n\nReturns `favorited` (true / false: the state after this call) and\n`target`, the record acted on: `type`, `id`, `token` (null for events)\nand `name` for a creator / creation / place / event; `type`, `id`,\n`slug`, `name`, `kind`, `area` and `url` for a list.\n\nErrors come back as an error result (`isError: true`) with `error`:\n\"unauthorized\" (no or invalid token), \"insufficient_scope\", or\n\"not_found\" — an unknown or non-public token, an event not yet\nannounced, or a list slug that is malformed or names an unknown kind /\narea. Nothing changes on error.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "target_type": {
                "description": "What `token` refers to: `creator`, `creation`, `place` or `event` for a single record; `event_zone` for an event list (the page /events/<kind>/<area>); `creation_zone` for the new-arrivals list (/creations). Use the `type` value from a `zone` / `zones` entry or list_followable_zones as-is.",
                "enum": ["creator", "creation", "place", "event", "event_zone", "creation_zone"],
                "type": "string"
              },
              "token": {
                "description": "Identifier of the target; its form depends on `target_type`. creator / creation / place: the public `token` (short lowercase string, e.g. \"fqpi\"). event: the numeric event id as a string (e.g. \"1234\"). event_zone: the slug \"<kind>/<area>\", where kind is \"all\", an event kind (e.g. \"book_club\") or \"period_event\", and area is \"all\" (nationwide) or a region slug — e.g. \"all/all\" = every event nationwide, \"all/kanto\" = every event in Kanto, \"book_club/all\" = book clubs nationwide. A wider list covers narrower ones, so do not follow a region on top of \"all/all\". creation_zone: always \"all/all\". Take slugs from the `slug` field of list_followable_zones or of a `zone` / `zones` entry rather than composing them.",
                "type": "string"
              }
            },
            "required": ["target_type", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Follow or unfollow on Zindies"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["favorites:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a134fa38a0f03f48f9761f40433d101ebf722fc0b24fba422583d2d0085b3959"
        }
