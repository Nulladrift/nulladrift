        {
          "name": "list_events",
          "title": "List upcoming ZINE events",
          "description": "List upcoming and ongoing Zindies events (festivals, fairs, exhibitions,\nworkshops) across Japan, soonest first. Use it for \"what ZINE events are\nthere in Kanto this month?\" or \"anything new since yesterday?\". For one\nshop's or one creator's events use list_events_by_place /\nlist_events_by_creator; to find an event by name use search; for one\nevent's booths, participants and programs use get_event with its `id`.\n\nAll arguments are optional filters combined by AND. With none: events\nnationwide from today through 60 days ahead. For \"this weekend in Tokyo\"\npass area: \"kanto\" with `from` / `to` set to Saturday and Sunday. For\n\"what is new since my last check\" pass `since` with the time of that\ncheck (it compares against `listed_at`, below).\n\nEach event has `id`, `event_type` (\"day\" with `started_at` / `ended_at`\n/ `time_undecided`, or \"period\" with `start_date` / `end_date`),\n`title`, `location`, `kind`, `area`, `url` (the public page), the venue\nas `place` (a shop, with `token`) or `facility`, `organizer`,\n`created_at` (registered) and `listed_at` (when it appeared publicly:\nthe organizer's later publication date, otherwise `created_at`).\n\nThe response carries `zone`: the event list on Zindies that matches the\n`area` / `kind` filters used (`type`, `slug`, `name`, `url`), where the\nuser can find more events like these. It reflects those two filters\nonly, not the date range.\nTo follow a list, pass its `type` and `slug` to toggle_favorite (target_type = type, token = slug); new events in it are then delivered to the user, so follow only when the user asks. list_followable_zones lists every list and whether the user already follows it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Return only events held in this region of Japan (lowercase slug, e.g. \"kanto\" covers Tokyo, \"kansai\" Osaka / Kyoto). There is no prefecture or city filter: pick the region containing the place the user named, then narrow by each event's `location`. Omit for nationwide. Events with no known region (e.g. online-only) appear only when `area` is omitted.",
                "enum": ["chubu", "chugoku", "hokkaido", "hokuriku", "kansai", "kanto", "koshinetsu", "kyushu", "okinawa", "shikoku", "tohoku"],
                "type": "string"
              },
              "event_type": {
                "default": "all",
                "description": "`day` = single-day events (they have `started_at` / `ended_at`), `period` = multi-day exhibitions and fairs (`start_date` / `end_date`), `all` = both (default). Combined with the other filters by AND.",
                "enum": ["day", "period", "all"],
                "type": "string"
              },
              "from": {
                "description": "First day of the range, as an ISO 8601 calendar date in Japan time (YYYY-MM-DD, e.g. \"2026-12-05\"; no time or timezone part). Default: today. A multi-day event already under way on this day is included. A past date returns past events. An unparseable value falls back to the default.",
                "format": "date",
                "type": "string"
              },
              "kind": {
                "description": "Return only events of this kind (non_genre = general ZINE event, zine_making = ZINE-making workshop, author = author event (talk, signing), festival_style = fair / market with many booths, zine_cafe = ZINE cafe, book_club = book club, utakai = tanka poetry gathering). `period_event` means multi-day exhibitions / fairs: the same as event_type: \"period\", and the value search returns as `kind` for them. Omit for every kind. Combined with `event_type` by AND, so kind: \"period_event\" with event_type: \"day\" returns nothing.",
                "enum": ["non_genre", "zine_making", "author", "festival_style", "zine_cafe", "book_club", "utakai", "period_event"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of events to return, soonest first. Default 20, max 50. There is no cursor: when `count` equals `limit` there may be more, so call again with `from` set to the start date of the last event returned.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "since": {
                "description": "Optional. Return only events that appeared on Zindies at or after this moment (ISO 8601, e.g. \"2026-11-27T07:00:00+09:00\"; a bare date means 00:00 Japan time, a time without offset is read as Japan time). An event appears when it is registered, or on its publication date when the organizer set one later (`listed_at` in each event). Use it for \"what is new since I last checked\": pass the time of the previous check instead of paging through every event and diffing ids. Combined with the date range and the other filters by AND, so widen `to` (e.g. to the end of next year) to see new events held far ahead. An unparseable value returns an error result with `error: \"invalid_argument\"`.",
                "format": "date-time",
                "type": "string"
              },
              "to": {
                "description": "Last day of the range, inclusive (YYYY-MM-DD, e.g. \"2026-12-31\"). Default: `from` + 60 days. For one specific day pass the same date as `from`. A value earlier than `from` returns no events.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List upcoming ZINE events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:cc4f8145ed6ac1c5196de41fd121b8de9bf3b57a121bbbef1cc7f391d2c13b00"
        },
        {
          "name": "list_events_by_creator",
          "title": "List events of a creator",
          "description": "List upcoming and ongoing Zindies events that one creator (author /\nartist) hosts or takes part in, soonest first, by the creator's public\ntoken. Use it for \"where can I meet this creator?\" or \"what is this\ncreator organizing?\". Needs the creator's `token`: when the user gives\na name, call search (type: \"creator\") first. For the creator's profile\nand works use get_creator; for events across a region use list_events;\nfor one event's booths and programs use get_event.\n\nA creator relates to an event as its host (\"organized\") or as a\nparticipant (\"participating\": a reserved booth, a listing as\nparticipating creator, or a role in one of its programs such as a\nworkshop or talk). Each event carries `relations`, an array with one\nor both of these values. The event's `organizer` field is something\nelse: the organizing body (a festival committee or group), not this\ncreator.\n\nReturns `events` (each shaped as in list_events, plus `relations`),\n`count` (the number returned, not the total), the `from` / `to`\nactually applied (default: today through 60 days ahead) and\n`calendar`. Only publicly announced events are included. A creator\nwith no matching events returns `events: []`, not an error; an unknown\nor non-public token returns an error result (`isError: true`) with\n`error: \"not_found\"`. There is no cursor: when `count` equals `limit`,\ncall again with `from` set to the last event's start date.\n\n`calendar` is a subscribable iCal feed of the creator's upcoming\nevents (`ics_url`, `webcal_url` for Apple Calendar / Outlook,\n`google_calendar_url`). Give it to the user when they want the\ncreator's events in their calendar app: it stays up to date, unlike\nevents copied one by one.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "creator_token": {
                "description": "Public token of the creator: a short lowercase string such as \"fqpi\", the `token` field of a creator from search, get_creator, get_creation or get_event. Not the numeric `id` or the name. An unknown or non-public token returns an error result with `error: \"not_found\"` (a creator with no matching events returns `events: []`, not an error).",
                "type": "string"
              },
              "event_type": {
                "default": "all",
                "description": "`day` = single-day events (they have `started_at` / `ended_at`), `period` = multi-day exhibitions and fairs (`start_date` / `end_date`), `all` = both (default). Combined with the other filters by AND.",
                "enum": ["day", "period", "all"],
                "type": "string"
              },
              "from": {
                "description": "First day of the range, as an ISO 8601 calendar date in Japan time (YYYY-MM-DD, e.g. \"2026-12-05\"; no time or timezone part). Default: today. A multi-day event already under way on this day is included. A past date returns past events. An unparseable value falls back to the default.",
                "format": "date",
                "type": "string"
              },
              "kind": {
                "description": "Return only events of this kind (non_genre = general ZINE event, zine_making = ZINE-making workshop, author = author event (talk, signing), festival_style = fair / market with many booths, zine_cafe = ZINE cafe, book_club = book club, utakai = tanka poetry gathering). Omit for every kind. Combined with `event_type` and the date range by AND.",
                "enum": ["non_genre", "zine_making", "author", "festival_style", "zine_cafe", "book_club", "utakai"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of events to return, soonest first. Default 20, max 50. There is no cursor: when `count` equals `limit` there may be more, so call again with `from` set to the start date of the last event returned.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "relation": {
                "default": "all",
                "description": "Which events to include: `organized` = events the creator itself hosts, `participating` = events they join through a reserved booth, a listing as participating creator, or a program (workshop / talk), `all` = both (default). An event matching both ways is returned once, with both values in its `relations`. Use `participating` for \"where can I meet this creator?\".",
                "enum": ["organized", "participating", "all"],
                "type": "string"
              },
              "to": {
                "description": "Last day of the range, inclusive (YYYY-MM-DD, e.g. \"2026-12-31\"). Default: `from` + 60 days. For one specific day pass the same date as `from`. A value earlier than `from` returns no events.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["creator_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List events of a creator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:f9325eae55d8e2e2b4c03de497ef5f48d34defd744f59a748a482eac6629cca7"
        },
        {
          "name": "list_events_by_place",
          "title": "List events at a shop",
          "description": "List upcoming and ongoing Zindies events held at a specific place\n(shop/venue), identified by its public token. Same semantics and\nresponse shape as list_events, but scoped to one place. Default range:\ntoday through 60 days ahead. Needs the place's `token`: when the user\ngives a shop name, call search (type: \"place\") first. For events across\na region use list_events; for the shop's address, opening days and\nstocked ZINEs use get_place.\n\nReturns `events` soonest first, `count` (the number returned, not the\ntotal), the `from` / `to` actually applied and `calendar`. A place with\nno matching events returns `events: []`, not an error; an unknown or\nnon-public token returns an error result (`isError: true`) with\n`error: \"not_found\"`.\n\n`calendar` is a subscribable iCal feed of this\nplace's upcoming events (`ics_url`, plus `webcal_url` for Apple\nCalendar / Outlook and `google_calendar_url` to add it to Google\nCalendar). When the user wants to import, subscribe to, or sync a\nplace's events into their calendar app, hand them these URLs instead\nof copying events one by one — the feed stays up to date as the place\nadds events. Note this is distinct from the place's opening-days\ncalendar (`business_hours.calendar.ics_url` on get_place).\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "event_type": {
                "default": "all",
                "description": "`day` = single-day events (they have `started_at` / `ended_at`), `period` = multi-day exhibitions and fairs (`start_date` / `end_date`), `all` = both (default). Combined with the other filters by AND.",
                "enum": ["day", "period", "all"],
