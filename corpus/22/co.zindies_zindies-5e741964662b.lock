        },
        {
          "name": "list_apps",
          "description": "List the free, no-sign-up tools Zindies offers under zindies.co/apps/\n(not data Zindies holds about creators / shops / events). Use this when\nthe user wants to make a small ZINE by hand (a printable fold-up\ntemplate) or wants an image of a shop's monthly opening days for\nInstagram.\n\n- `orizine`: a printable template that turns one A4 sheet, cut and\n  folded, into an 8-page A7 mini book. `files` lists every public PDF\n  (pattern / page numbers / binding) with a direct `pdf_url`, and\n  `netprint` when a Japanese convenience-store \"Network Print\" code is\n  available for it (`user_code`, `expires_at`, `qr_url`; null when\n  there is none right now). Codes are shared by everyone and are\n  renewed before they expire, so always read them from this tool rather\n  than reusing an old one. Print single-sided at 100% scale. The\n  template is CC BY 4.0: credit Zindies; printing, handing out, adapting\n  and selling the ZINEs made with it are free.\n- `calendar`: a web page that draws a month of opening days / closed\n  days as a 1080x1350 PNG in the browser. It cannot be run through MCP:\n  give the user `url`. If the shop is already registered on Zindies,\n  its opening days are public data — use get_place (`business_hours`)\n  instead of asking the user to re-enter them.\n\nEach app carries `next_step`: how its output connects to Zindies\n(the signature printed on the output, registering as a creator /\nshop). Mention it once, quietly; do not push it.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app": {
                "description": "Return only this app. Default: all apps.",
                "enum": ["orizine", "calendar"],
                "type": "string"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions). Pass the language the user is conversing in when it is one of the supported locales. Fields without a translation fall back to their source language. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
