        {
          "name": "rsvp_event",
          "description": "Register (\"join\") or withdraw (\"cancel\") the authenticated user's\nintention to attend a Zindies event. This is a free RSVP shown on the\nevent page; it is not a ticket purchase or a paid booking. Requires a\nBearer token (a User API token, or an OAuth token with the\nparticipations:write scope). Act only when the user asked to; to just\nbookmark an event without attending, use toggle_favorite instead.\n\nUnlike toggle_favorite this is not a toggle: `action` states the\noutcome you want, and repeating a call is safe.\n- join: adds the user to the event's participants (the public\n  participant count goes up by one and, when the event has a capacity,\n  one place is taken) and also favorites the event. Joining again when\n  already joined creates no duplicate: it succeeds and only replaces\n  the comment if `comment` is given. A new join is refused with\n  `error: \"full\"` when the capacity is reached and `error: \"cancelled\"`\n  when the event has been called off.\n- cancel: removes the participation and deletes its comment for good\n  (the place is freed at once and the count goes down), and also\n  removes the user's favorite on the event, even one made before\n  joining. Cancelling when not joined succeeds and changes nothing\n  else. Joining again later is allowed while places remain.\n\nThe comment is public: it appears with the participation on the event\npage. Returns `joined` (the state after the call), `comment` (the\nstored comment, null when none or after cancel) and `event` (`id`,\n`title`, `url`). Errors come back as an error result with `error`:\n\"unauthorized\", \"insufficient_scope\", \"not_found\" (unknown or not yet\nannounced event), \"full\", \"cancelled\" or \"unprocessable_entity\".\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "default": "join",
                "description": "`join` (default) = make the user a participant; `cancel` = withdraw. It names the resulting state, not a toggle: `join` on an already joined event keeps the participation, `cancel` on a not-joined event is a no-op.",
                "enum": ["join", "cancel"],
                "type": "string"
              },
              "comment": {
                "description": "Optional short message from the user shown publicly with their participation on the event page, e.g. \"午後から伺います\". Plain text in the user's own words; do not invent one. Only used with `join`: omitted on a first join stores no comment, omitted when already joined keeps the existing one, and an empty string clears it. Ignored for `cancel`.",
                "type": "string"
              },
              "event_id": {
                "description": "Numeric id of the event, e.g. 1234: the `id` field of an event from list_events, list_events_by_place, list_events_by_creator, search or get_event.",
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f44d1c957a132efd0f34f877ed0f0c17f459749b0267de548000c353b5579490"
        },
        {
          "name": "search",
          "description": "Search across Zindies creators, creations (zines), places (shops/venues),\nand events by keyword. Use `query` for the keyword and optional `type`\nto restrict to one resource. The response is always an object keyed by\nresource (`creators` / `creations` / `places` / `events`); with a single\n`type`, only that key is present. `limit_per_type` caps each list.\n\nPlaces and events carry `area` (the JP region slug, null when unknown) and\nevents `kind`. To go from one hit to the wider list, pass them to\nlist_events (`area`, `kind`); get_event / get_place return the event\nlists a hit appears in (`zones`), and list_followable_zones every list.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit_per_type": {
                "description": "Max items per resource type. Default 6 (max 24) when type=all; default 20 (max 50) for a single type.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "query": {
                "description": "Keyword(s), at least 2 characters, e.g. \"リソグラフ\" or \"risograph tokyo\". Full-text match against names, titles and descriptions in every language (the original and its translations). Partial names work, and upper / lower case, full / half width and hiragana / katakana are treated as the same. Several words separated by spaces must all match (AND); there are no operators, quoting or wildcards. Prefer one or two distinctive words: a long phrase rarely matches.",
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "default": "all",
                "description": "Which resource to search: `creator` (authors / artists), `creation` (ZINEs and other works), `place` (shops / venues), `event`, or `all` (default) for the four at once. Use a single type when you know what the user is looking for: it allows more results per call.",
                "enum": ["all", "creator", "creation", "place", "event"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
