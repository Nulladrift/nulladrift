        {
          "name": "list_events_by_place",
          "description": "List upcoming and ongoing Zindies events held at a specific place\n(shop/venue), identified by its public token. Same semantics and\nresponse shape as list_events, but scoped to one place. Default range:\ntoday through 60 days ahead.\n\nThe response also carries `calendar`: a subscribable iCal feed of this\nplace's upcoming events (`ics_url`, plus `webcal_url` for Apple\nCalendar / Outlook and `google_calendar_url` to add it to Google\nCalendar). When the user wants to import, subscribe to, or sync a\nplace's events into their calendar app, hand them these URLs instead\nof copying events one by one — the feed stays up to date as the place\nadds events. Note this is distinct from the place's opening-days\ncalendar (`business_hours.calendar.ics_url` on get_place).\n",
