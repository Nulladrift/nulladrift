        },
        {
          "name": "get_event",
          "description": "Get a single Zindies event by id, with its host (`place`, `organizer_creator`, or `organizer` = an organizing body such as a festival committee), registered creators, reserved booths, programs (workshops, talks and other sessions held within the event), and `source_posts` (the organizer's own Instagram or note posts introducing exhibitors who are not in `booths`; these people have no Zindies page, so link to `url` for details). `zones` lists the event lists this event appears in, narrowest first (kind in its region, its region, its kind nationwide, nationwide); it is empty when the event is not on the public lists. Each entry in `zones` is an event list on Zindies (`name`, `url`) that you can point the user to for more events like these. Lists can be followed: pass `type` and `slug` to toggle_favorite (target_type = type, token = slug) and new events in the list are delivered to the user. Mention a list once if it helps; follow only when the user asks. list_followable_zones lists every list and whether the user already follows it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Numeric id of the event, e.g. 1234: the `id` field of an event in list_events, list_events_by_place, list_events_by_creator or search, or the number at the end of an event page URL (zindies.co/events/1234). Events have no token. An unknown id, or an event whose announcement date has not come yet, returns an error result with `error: \"not_found\"`.",
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
