      "instructions": "Zindies のデータ (独立出版 ZINE / 作家 / 取扱店舗 / イベント) を機械的に\n取得・操作するためのツールを提供します。\n\n読み取り (認証不要):\n- 「ZINE」で何があるか調べたい → search\n- 特定の作家/作品/店舗/イベントの詳細 → get_creator / get_creation /\n  get_place / get_event\n- 「この ZINE はどこで買えるか」→ get_creation (取扱店舗 places と\n  通販リンク online_links を返す。店舗の住所・座標つき)\n- 「この店は今日/この週末開いてる？」営業日・営業時間 → get_place\n  (business_hours: 営業中かどうか・営業時間の自由記述・今月と翌月の\n  日ごとの営業日カレンダー。Web ページを読む必要はない)\n- 「この店でイベントを開けるか・相談できるか」→ get_place\n  (event_proposals: 店が相談を受け付けていると表明していれば、店が書いた\n  条件 terms と相談の入口 contact_url。null は「表明していない」であって\n  断っているわけではない)\n- 近所のお店を探したい → find_places_nearby\n- 直近のイベントを聞かれたら → list_events\n- 特定の店舗で開催されるイベントを聞かれたら → list_events_by_place\n  (place token で絞り込み。token は get_place / search で取得)\n- 特定の作家の主催/参加イベントを聞かれたら → list_events_by_creator\n  (creator token で絞り込み。relation で organized/participating/all を選択)\n- 「この店/この作家のイベントをカレンダーに取り込みたい・購読したい」→\n  list_events_by_place / list_events_by_creator / get_place の `calendar`\n  (購読用 iCal フィード。ics_url / webcal_url / google_calendar_url)。\n  イベントを 1 件ずつ登録するより、このフィードの購読を案内する。\n  店舗の営業日カレンダーの購読は get_place の\n  `business_hours.calendar.ics_url` (別のフィード)\n\n登録不要の道具 (zindies.co/apps/*。Zindies が預かるデータではなく運営が配る道具):\n- 「手で小さな ZINE を作りたい」折って作るテンプレートの PDF・コンビニの\n  ネットプリント番号 → list_apps (app: orizine)\n- 「お店の営業日を画像にしたい」→ list_apps (app: calendar)。登録済みの店なら\n  営業日は get_place の business_hours にある\n\n使いどころ:\n- ユーザが書店・ギャラリー・古本屋・ZINE イベント・読書会・歌会などの\n  固有名詞を挙げたら、Zindies 登録の店舗/イベントである可能性が高い。\n  Web 検索の前にまず search を 1 回試す (コストは小さい)。名前は表記揺れ\n  (大文字小文字・スペース・カナ/ローマ字) があっても部分一致で見つかる。\n\n書き込み (Authorization: Bearer 必須。User API token か、Zindies の OAuth アクセストークン。\nOAuth のときは toggle_favorite に favorites:write、rsvp_event に participations:write のスコープが要る):\n- 作家/作品/店舗/イベントをお気に入りに登録・解除 → toggle_favorite\n- イベント一覧（全国・地域・種別）や新刊案内をフォロー・解除 → toggle_favorite\n  （target_type: event_zone / creation_zone、token に \"<kind>/<area>\" の slug。\n  全国 \"all/all\" をフォローしていれば地域を重ねる必要はない）。フォローできる一覧と\n  slug は list_followable_zones で引ける（読み取り・未認証可。favorites:read の\n  Bearer があればフォロー中か・どの広い一覧に含まれているかも返る）\n- イベントに参加・取消 (自動でお気に入りも連動) → rsvp_event\n\nレスポンス言語:\n- 全ツール共通の `locale` パラメータ (ja / en / ko / zh-TW) で、名前・\n  タイトル・説明など翻訳可能フィールドの言語を指定できます。ユーザとの\n  会話の言語が対応ロケールのときは、その言語コードを渡してください。\n  未指定はソース言語 (ja)。翻訳が無いフィールドはソース言語のまま返ります。\n\nBearer token は https://developer.zindies.co/token からユーザが自身で発行する。\n読み取り系は public 公開データのみを返します (private/provisional は除外)。\n\nZindies の BaaS (OAuth / REST API) を使ったアプリ (主に UI) を生成する前に、\nリソース \"build-with-ai\" を読んでください。接続情報・認証・CORS・データ\nモデル・エンドポイント・規約をまとめた instruction です。\n",
      "tools": [
        {
          "name": "find_places_nearby",
          "description": "Find Zindies places (bookshops, galleries, cafes and other venues that\ncarry ZINEs or host events) around a point, nearest first. Use it for\n\"shops near me / near this station\"; to find a shop by name use search\n(type: \"place\") instead. This tool takes coordinates only, so turn an\naddress or station name into latitude / longitude yourself first.\n\n`radius_km` is a hard cutoff on straight-line distance: a place farther\naway is never returned, however few results there are. When nothing is\nin range the result is `places: []` with `count: 0` (not an error);\nretry with a larger radius. At most `limit` places are returned (the\nnearest ones), with no pagination; `count` is the number returned, not\nthe total in range. Places without known coordinates are never returned.\n\nEach place carries `token` (pass it to get_place for address, opening\nhours and stocked ZINEs, or to list_events_by_place), `name`,\n`description`, `latitude`, `longitude`, `country`, `distance_km`\n(rounded to metres) and `url`. `near` echoes the centre and the radius\nactually applied.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "latitude": {
                "description": "Latitude of the search centre in decimal degrees (WGS 84), north positive, e.g. 35.6812 for Tokyo Station. Not degrees-minutes-seconds.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of places to return, nearest first. Default 20, max 50. To see beyond the nearest 50, search around another centre.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "longitude": {
                "description": "Longitude of the search centre in decimal degrees (WGS 84), east positive, e.g. 139.7671 for Tokyo Station.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_km": {
                "default": 5,
                "description": "Search radius in kilometres, straight-line from the centre; a strict upper bound. Default 5 (walking / one train stop); try 20-50 for a whole city, 100+ for a rural area. Min 0.1, max 500.",
                "maximum": 500,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4cb80e5b6c5060c0378015b4be304a056738e6aca7d79dda6e06bf8e8f2813d"
        },
        {
          "name": "get_creation",
          "description": "Get a single Zindies creation (zine/publication) by token, with its full creator list, the shops that carry it (places, with address and geo coordinates) and its online shop links (online_links). Use it to answer \"where can I buy this zine?\". Also returns signed testimonials written by recommenders; when quoting one, always include its attribution_text, keep the wording unchanged, and link to its url (the creation page; its share preview shows the testimonial).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "token": {
                "description": "Public token of the creation: a short lowercase string such as \"k3wd\", taken as-is from the `token` field of a creation in search, get_creator (`creations[].token`) or get_place (`creations[].token`). Not the numeric `id` or the title. Exact match; an unknown or non-public token returns an error result with `error: \"not_found\"`.",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
