          "digest": "sha256:daaa904897388156d3fb19361017c22588770f7b598e8868829e83cfe4988479"
        },
        {
          "name": "get_event",
          "title": "Get event details",
          "description": "Get the full details of one Zindies event by id. Needs the numeric `id`: to find an event by name use search (type: \"event\"), and by date, region or kind use list_events. Those return summaries; this tool adds the description, booths, participants and programs. To attend, pass the same id to rsvp_event. Returns the event with its host (`place`, `organizer_creator`, or `organizer` = an organizing body such as a festival committee), registered creators, reserved booths, programs (workshops, talks and other sessions held within the event), and `source_posts` (the organizer's own Instagram or note posts introducing exhibitors who are not in `booths`; these people have no Zindies page, so link to `url` for details). `facility` is set instead of `place` when the venue is not a shop on Zindies but a facility such as a public hall or rental space: its name, address and `url` (a page listing the events held there; Zindies holds no opening hours or contact for facilities). When both are null the venue is the free text in `location`. `zones` lists the event lists this event appears in, narrowest first (kind in its region, its region, its kind nationwide, nationwide); it is empty when the event is not on the public lists. Each entry in `zones` is an event list on Zindies (`name`, `url`) where the user can find more events like these. To follow a list, pass its `type` and `slug` to toggle_favorite (target_type = type, token = slug); new events in it are then delivered to the user, so follow only when the user asks. list_followable_zones lists every list and whether the user already follows it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Numeric id of the event, e.g. 1234: the `id` field of an event in list_events, list_events_by_place, list_events_by_creator or search, or the number at the end of an event page URL (zindies.co/events/1234). Events have no token. An unknown id, or an event whose announcement date has not come yet, returns an error result with `error: \"not_found\"`.",
                "type": "integer"
              },
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get event details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
