        },
        {
          "name": "list_events",
          "description": "List upcoming and ongoing Zindies events (festivals, fairs, exhibitions).\nDayEvent (single-day) and PeriodEvent (multi-day) are unified, distinguished\nby event_type. Default range: today through 60 days ahead. All filters\nare optional and combine by AND; with none, events nationwide are returned.\n\nThe response carries `zone`: the event list on Zindies that matches the\n`area` / `kind` filters used (`type`, `slug`, `name`, `url`), where the\nuser can find more events like these. It reflects those two filters\nonly, not the date range.\nLists can be followed: pass `type` and `slug` to toggle_favorite (target_type = type, token = slug) and new events in the list are delivered to the user. Mention a list once if it helps; follow only when the user asks. list_followable_zones lists every list and whether the user already follows it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Return only events held in this region of Japan (lowercase slug, e.g. \"kanto\" covers Tokyo, \"kansai\" Osaka / Kyoto). There is no prefecture or city filter: pick the region containing the place the user named, then narrow by each event's `location`. Omit for nationwide. Events with no known region (e.g. online-only) appear only when `area` is omitted.",
                "enum": ["chubu", "chugoku", "hokkaido", "hokuriku", "kansai", "kanto", "koshinetsu", "kyushu", "okinawa", "shikoku", "tohoku"],
                "type": "string"
              },
              "event_type": {
                "default": "all",
                "description": "`day` = single-day events (they have `started_at` / `ended_at`), `period` = multi-day exhibitions and fairs (`start_date` / `end_date`), `all` = both (default). Combined with the other filters by AND.",
                "enum": ["day", "period", "all"],
                "type": "string"
              },
              "from": {
                "description": "First day of the range, as an ISO 8601 calendar date in Japan time (YYYY-MM-DD, e.g. \"2026-12-05\"; no time or timezone part). Default: today. A multi-day event already under way on this day is included. A past date returns past events. An unparseable value falls back to the default.",
                "format": "date",
                "type": "string"
