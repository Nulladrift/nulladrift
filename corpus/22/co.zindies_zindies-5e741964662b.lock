        },
        {
          "name": "toggle_favorite",
          "description": "Toggle the authenticated user's favorite (shown to them as \"follow\") on\na creator, creation, place, or event, or on an event list (event_zone) /\nthe new-arrivals list of creations (creation_zone). Requires a Bearer\ntoken (a User API token, or an OAuth token with the favorites:write\nscope). Act only when the user asked to.\n\nIt flips the current state: not favorited becomes favorited, favorited\nbecomes not favorited. There is no separate add / remove, so do not\ncall it twice to \"make sure\" — the second call undoes the first. Read\nthe result to learn the state you ended in; for lists you can check\nbeforehand with list_followable_zones (`following`).\n\nEffects: favoriting a creator, creation, place or event adds it to what\nthe user follows on Zindies. Following a list also subscribes the user\nto notifications of new entries in it. To attend an event use\nrsvp_event, which favorites the event by itself.\n\nReturns `favorited` (true / false: the state after this call) and\n`target`, the record acted on: `type`, `id`, `token` (null for events)\nand `name` for a creator / creation / place / event; `type`, `id`,\n`slug`, `name`, `kind`, `area` and `url` for a list.\n\nErrors come back as an error result (`isError: true`) with `error`:\n\"unauthorized\" (no or invalid token), \"insufficient_scope\", or\n\"not_found\" — an unknown or non-public token, an event not yet\nannounced, or a list slug that is malformed or names an unknown kind /\narea. Nothing changes on error.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language for translatable text fields (names, titles, descriptions): ja = Japanese, en = English, ko = Korean, zh-TW = Traditional Chinese. Pass the language the user is conversing in when it is one of these; otherwise omit it. Fields without a translation fall back to their source language (usually Japanese), so one response can mix languages. Tokens, ids, dates and URLs are the same in every locale. Default: ja.",
                "enum": ["ja", "en", "ko", "zh-TW"],
                "type": "string"
              },
              "target_type": {
                "description": "What `token` refers to: `creator`, `creation`, `place` or `event` for a single record; `event_zone` for an event list (the page /events/<kind>/<area>); `creation_zone` for the new-arrivals list (/creations). Use the `type` value from a `zone` / `zones` entry or list_followable_zones as-is.",
                "enum": ["creator", "creation", "place", "event", "event_zone", "creation_zone"],
                "type": "string"
              },
              "token": {
                "description": "Identifier of the target; its form depends on `target_type`. creator / creation / place: the public `token` (short lowercase string, e.g. \"fqpi\"). event: the numeric event id as a string (e.g. \"1234\"). event_zone: the slug \"<kind>/<area>\", where kind is \"all\", an event kind (e.g. \"book_club\") or \"period_event\", and area is \"all\" (nationwide) or a region slug — e.g. \"all/all\" = every event nationwide, \"all/kanto\" = every event in Kanto, \"book_club/all\" = book clubs nationwide. A wider list covers narrower ones, so do not follow a region on top of \"all/all\". creation_zone: always \"all/all\". Take slugs from the `slug` field of list_followable_zones or of a `zone` / `zones` entry rather than composing them.",
                "type": "string"
              }
            },
            "required": ["target_type", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
