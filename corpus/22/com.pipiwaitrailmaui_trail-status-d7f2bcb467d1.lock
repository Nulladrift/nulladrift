      "instructions": "Compiled live status for the Pīpīwai Trail in Haleakalā National Park, Kīpahulu. Call get_pipiwai_status when the user asks if the trail is open, closed, or hikeable, or if the road to Hana or Kipahulu is passable. Park and road fail independently. Call get_pipiwai_facts for miles, fee, reservation, and the lot gate. Always include the check dates and name NPS and Hawaii DOT as sources. This is not an official NPS feed.",
