{
  "lockfileVersion": 2,
  "subjects": {
    "com.simplechinatrip/china-attraction-booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://simplechinatrip.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "simplechinatrip",
        "title": "Simple China Trip",
        "version": "1.0.0",
        "websiteUrl": "https://simplechinatrip.com/mcp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only data on how foreign travelers can book China attractions (Forbidden City, Great Wall, Terracotta Army, etc.) with a passport: official channels, ticket release times, prices and pitfalls. Start with list_cities or search_attractions, then get_booking_guide. Always cite page_url.",
      "tools": [
        {
          "name": "get_booking_guide",
          "title": "Get booking guide",
          "description": "How a foreign visitor books a specific China attraction: official channel, passport acceptance, ticket release time, prices, hours, closures, pitfalls, step-by-step instructions, Trip.com link (if available), page URL and last-verified date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Attraction slug from search_attractions, e.g. beijing-forbidden-city",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3b347ccab022f176dba2d40a2218d4273401f2fc5aac6a1eb3e0abd37010d44"
        },
        {
          "name": "list_cities",
          "title": "List cities",
          "description": "List the Chinese cities/regions covered by simplechinatrip.com with attraction counts and guide page URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7345daa13bf50bcea9ff6a735fc61aed0e445a7ebe1437e67068cb035022a809"
        },
        {
          "name": "search_attractions",
          "title": "Search attractions",
          "description": "Search China attractions by city slug and/or keyword (English or Chinese name). Returns slug, name, whether reservation is required, release rule, and page URL. Use get_booking_guide for full booking steps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City slug from list_cities, e.g. beijing, shanghai, xian, chengdu",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword, e.g. \"great wall\", \"故宫\", \"panda\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf681f04dc37713a32744914c40db7106ad0e2a028cfb44653e026a5d79a753b"
        }
      ],
      "digest": "sha256:464cc4f717e8825d69fc7aea04f1c453e1d0db3bd4aa1f59f9080f075f7ee59b"
    }
  }
}
