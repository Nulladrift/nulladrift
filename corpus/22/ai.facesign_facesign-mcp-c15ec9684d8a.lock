              "landingHtml": {
                "description": "REQUIRED. Raw HTML/JS for the pre-session landing page. NO CDATA, NO markdown fences. Every visible string MUST come from `uiStrings` — reference them via {{KEY}} placeholders (interpolated at inject time) or via window.t('KEY') (dynamic at runtime). Contract: reads window.__FACESIGN_FLOW__ (the default flow, for display only). MUST call window.__startSession(input?) to launch the session. input may contain only a declared flowId and/or providedData collected by the form; never pass a flow graph from the browser.\n\nSTYLE GUIDE (Pre-Session Page):\nMatch this visual style for consistency with the FaceSign UI.\n\nBackground: Light gray #f5f7fa. Full-viewport centered layout (flexbox, min-height: 100vh; min-height: 100dvh — always use dvh with vh fallback for iOS compatibility).\n\nCard: White, border-radius 16px, box-shadow 0 4px 24px rgba(0,0,0,.08), padding 2.5-3rem, max-width 480-600px, centered.\n\nHeadings: Bold, 1.4-1.8rem, color #1a1a2e, centered in card.\n\nInputs: Full-width, padding 14px 16px, border 2px solid #d1d5db, border-radius 12px, font-size 1rem. Focus: border-color #5b7bab. Placeholder color #9ca3af.\n\nPrimary buttons: Background #7b8fb5 (steel-blue), color white, font-weight 600, font-size 1.05rem, border-radius 50px (pill shape), padding 14px, full-width in card. Hover: background #6a7fa5. Disabled: background #c5cdd8, cursor not-allowed.\n\nLinks: Color #4573b8, no underline, underline on hover. Back navigation: \"← Back\" at top-left of card, color #4573b8, font-size 0.95rem.\n\nProfile images: Circular (border-radius 50%), 120-150px diameter, centered, subtle box-shadow.\n\nSpacing: 2.5-3rem card padding, 1.5rem between form groups, 1rem between label and input, 2rem above primary button.\n\nFont: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif.\n\n\nCOMMON MISTAKES TO AVOID (UI/CSS):\n\n1. Never set padding or margin on body\nThe custom HTML is injected into a host page that controls its own layout. Setting padding, margin, or min-height on body will conflict with the host page styles and create unwanted spacing.\n\nWrong:\nbody { padding: 2rem; min-height: 100vh; }\n(Also wrong — using only 100vh without dvh fallback. Always add min-height: 100dvh after 100vh for iOS Safari.)\n\nRight — use a wrapper element instead:\nbody { margin: 0; padding: 0; }\n.wrap { max-width: 860px; margin: 0 auto; padding: 2rem; }\n\nThe same applies to background on body — avoid it unless you are certain the host page does not set its own background.\n\n2. Use HTML entities for emoji, not JS unicode escapes\nWhen building HTML strings in JavaScript (via innerHTML, string concatenation, etc.), JS unicode escapes like \\ud83c\\udfa5 will NOT render as emoji. They only work inside JS string literals that are directly displayed via textContent or similar APIs.\n\nWrong — renders as garbled text:\nh += '<div class=\"title\">\\ud83c\\udfa5 Video AI Analysis</div>';\n\nRight — use HTML numeric entities:\nh += '<div class=\"title\">&#127909; Video AI Analysis</div>';\n\nAlso right — use emoji directly in static HTML (outside of JS):\n<div class=\"title\">🎥 Video AI Analysis</div>\n\nCommon emoji HTML entities reference:\n&#128100; 👤 User/person\n&#127874; 🎂 Birthday cake\n&#128205; 📍 Pin/location\n&#128187; 💻 Computer\n&#10024;  ✨ Sparkles\n&#128269; 🔍 Search\n&#127909; 🎥 Camera\n&#127916; 🎬 Clapper board\n&#128203; 📋 Clipboard\n&#9895;   ⚧ Gender symbol\n&#10003;  ✓ Checkmark\n\n3. CSS class name collision between landingHtml and recapHtml\nCRITICAL: landingHtml and recapHtml are injected into the SAME host document. If both fragments use the same class names (e.g., .card, .container, .header), styles from one will leak into the other, causing layout breakage.\n\nALWAYS use unique prefixed class names:\n- landingHtml (pre-session/landing page): prefix all classes with .lp- (e.g., .lp-card, .lp-header, .lp-btn)\n- recapHtml (results page): prefix all classes with .r- (e.g., .r-card, .r-header, .r-wrap)\n\nWrong — causes collisions:\n/* in landingHtml */  .card { max-width: 460px; }\n/* in recapHtml */    .card { max-width: 900px; }\n\nRight — namespaced:\n/* in landingHtml */  .lp-card { max-width: 460px; }\n/* in recapHtml */    .r-card { max-width: 900px; }\n\n\nCOMMON MISTAKES TO AVOID (Code/API):\n\n4. window.__startSession race condition\nNEVER call window.__startSession() synchronously in a click handler. The host page may not have injected the function yet. ALWAYS use polling:\n\nfunction waitAndStart(input) {\n  var n = 0;\n  var iv = setInterval(function() {\n    n++;\n    if (typeof window.__startSession === 'function') {\n      clearInterval(iv);\n      window.__startSession(input);\n    } else if (n > 100) {\n      clearInterval(iv);\n      document.body.innerHTML = '<p style=\"text-align:center;padding:2rem;color:red;\">Failed to initialize session. Please refresh.</p>';\n    }\n  }, 100);\n}\n\nWrong:\nstartBtn.addEventListener('click', function() { window.__startSession(); });\n\nRight:\nstartBtn.addEventListener('click', function() { waitAndStart(); });\n\nFor exported apps, NEVER send window.__FACESIGN_FLOW__ or another graph back to\nthe server. To select a flow declared in export_app, pass its ID:\nwaitAndStart({ flowId: 'enhanced', providedData: { name: nameInput.value } });\n\n5. Permissions are automatic — do NOT add a permissions node by default\nFaceSign automatically requests camera and microphone permissions at session start. Most flows do NOT need a PERMISSIONS node. Only add one in these specific cases:\n(a) The user wants to request microphone and camera permissions separately at different times during the flow (instead of both at once at session start).\n(b) The user wants to move the permission request to the initial page (landingHtml), outside the FaceSign flow itself.\n\n6. nodeReport.type values are lowercase snake_case\nThe API returns nodeReport.type in lowercase snake_case: \"face_compare\", \"document_scan\", \"conversation\", \"permissions\", \"liveness_detection\", etc. — NOT uppercase like \"FACE_COMPARE\".\n\nALWAYS use case-insensitive comparison when looking up node reports:\n\nfunction getNode(r, type) {\n  var rr = (r && r.nodeReports) || [];\n  var tl = type.toLowerCase();\n  for (var i = 0; i < rr.length; i++) {\n    if (rr[i].type && rr[i].type.toLowerCase() === tl) return rr[i];\n  }\n  return null;\n}\n\n// Usage: getNode(report, 'face_compare'), getNode(report, 'document_scan')\n\n7. Microblink document report — nested field structure\nDOCUMENT_SCAN nodeReport.report fields are NOT plain strings. They use Microblink's nested structure:\n  firstName: { latin: { value: \"JANICE\" } }\n  dateOfBirth: { originalString: { latin: { value: \"04/30/1970\" } } }\n  — OR —\n  dateOfBirth: { day: 30, month: 4, year: 1970 }\n\nNEVER read fields directly as strings (e.g., dr.firstName will be an object, not \"JANICE\").\n\nALWAYS use this safe-value extractor:\n\nfunction sv(v) {\n  if (v == null) return '';\n  if (typeof v === 'string') return v;\n  if (v.latin && v.latin.value != null) return String(v.latin.value);\n  if (v.originalString) return sv(v.originalString);\n  if (v.day != null && v.month != null && v.year != null)\n    return v.month + '/' + v.day + '/' + v.year;\n  return '';\n}\n\n// Usage: sv(dr.firstName) → \"JANICE\", sv(dr.dateOfBirth) → \"04/30/1970\"\n\n8. videoAIAnalysis criterion is camelCase — format for display\nThe criterion field (e.g., \"facialExpressionAndMovement\", \"useOfExternalDevices\") comes in camelCase. Convert to human-readable format:\n\nfunction toStartCase(s) {\n  if (!s) return '';\n  return s.replace(/([A-Z]+)/g, function(m) { return ' ' + m.toLowerCase(); })\n    .trim().replace(/^./, function(c) { return c.toUpperCase(); });\n}\n// \"facialExpressionAndMovement\" → \"Facial expression and movement\"\n\n9. Conversation node: condition vs prompt\nIn CONVERSATION nodes:\n- \"condition\" (in outcomes) = ONLY describes the trigger event for transitioning to the next node (e.g., \"User explicitly agrees to proceed\")\n- \"prompt\" = ALL instructions for the avatar's behavior, including how to greet, how to respond to questions, how to handle objections, and how to persuade\n- User questions or objections during the conversation are handled within the SAME node (continued dialog), NOT via separate outcomes\n- Conversation nodes can have any number of outcomes depending on the use case:\n  * Branching nodes (e.g., \"what color?\") → one outcome per branch + a fallback\n  * Consent/agreement nodes → typically 2: agreement + fallback after N attempts\n- ALWAYS include a fallback outcome for when the conversation stalls (e.g., \"conversation exceeded N exchanges with no condition met\" or \"user does not want to reply\")\n\nWrong — putting behavior instructions in condition:\n\"condition\": \"User agrees. If they ask questions, answer warmly and ask again\"\n\nRight — behavior in prompt, condition is just the trigger:\n\"prompt\": \"Explain the process. If the user has questions, answer them warmly. Once they're ready, confirm.\"\n\"condition\": \"User explicitly agrees or says they are ready\"",
                "type": "string"
              },
              "langs": {
                "description": "Optional whitelist of BCP-47 language codes (from facesign://catalog) the exported session may use. DEFAULT BEHAVIOUR (recommended): OMIT this parameter entirely — the app then supports every language in the FaceSign catalog, and `uiStrings` must cover every catalog language. ONLY set `langs` when the user EXPLICITLY restricts the language set (e.g. 'Spanish-only demo', 'support English and Russian'). Do NOT narrow to `['en']` just because the user described the demo in English or did not mention languages. Example (explicit restriction): [\"en\", \"es\", \"ru\"]. The set of target languages for `uiStrings` is derived from this list (or the full catalog if omitted).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
