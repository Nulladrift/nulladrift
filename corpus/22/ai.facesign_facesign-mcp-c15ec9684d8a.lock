  "subjects": {
    "ai.facesign/facesign-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.facesign.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
