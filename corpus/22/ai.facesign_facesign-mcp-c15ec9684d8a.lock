              "recapHtml": {
                "description": "REQUIRED. Raw HTML/JS for the results/recap page. NO CDATA, NO markdown fences. Every visible string MUST come from `uiStrings` (via {{KEY}} or window.t('KEY')). Contract: reads window.__FACESIGN_SESSION__ (session data, re-populated on each poll), window.__FACESIGN_SESSION_ID__, window.__refetchSession() (returns Promise with updated data). The COMMON MISTAKES sections from the `landingHtml` field description apply here too — read them once and follow for both fields. For the complete session data shape (Session, SessionReport, NodeReport types, delayed vs immediate fields), read the `facesign://session-data-types` MCP resource.\n\nSTYLE GUIDE (Results/Recap Page):\nMatch this visual style for consistency with the FaceSign UI.\n\nBackground: Light gray #f5f7fa with subtle gradient to light blue at top.\n\nLayout: Single-column, max-width 900px, centered (margin 0 auto), padding 2rem.\n\nPage header: \"Session summary\" bold 1.6rem. Subtitle with date/time and duration in muted color #888, font-size 0.9rem.\n\nUser info card: White card with rounded photo (80-100px), grid of icon+text pairs for age, gender, location, device. Icons in muted blue #6b7faa.\n\nSection cards: White background, border-radius 12px, box-shadow 0 2px 12px rgba(0,0,0,.05), padding 1.5rem, margin-bottom 1.5rem.\n\nSection headings: Bold 1.15rem, color #1a1a2e, with small emoji/icon prefix (e.g. ✨ AI Analysis, 🔍 Detected Signals, 📋 Transcript). Margin-bottom 1rem.\n\nStatus banners (full-width within card, border-radius 12px, padding 1rem 1.5rem, white text, bold):\n- Verified/success: background #4a9d6e, shield ✓ icon\n- High-risk/warning: background #d97b30, ⚠ warning icon\n\nSignal items: Left border 4px solid, padding-left 1rem, margin-bottom 1rem, background white or tinted.\n- Normal: border-color #059669, light green tint background #f0fdf4\n- Suspicious: border-color #f59e0b, light yellow tint background #fefce8\n- High-risk: border-color #ef4444, light red tint background #fef2f2\n\nStatus badges (inline, pill): border-radius 6px, padding 2px 10px, font-weight 700, font-size 0.8rem, uppercase.\n- RECOGNIZED/NORMAL: background #d1fae5, color #065f46\n- SUSPICIOUS: background #fef3c7, color #92400e\n\nConfidence scores: Right-aligned, font-size 0.85rem, color #aaa.\n\nKey-value grid: Two-column layout. Label: small text, color #888, font-size 0.8rem, uppercase. Value: font-size 0.95rem, color #1a1a2e, below label.\n\nTranscript: Dark background #1e2a3a, border-radius 10px, padding 1.5rem, monospace font. \"CONVERSATION LOG\" header uppercase, small, muted. Each line: timestamp (gray #777), speaker label (FACESIGN: in teal #4db8a4, USER: in green #6bc96f), message text white. Line-height 1.8.\n\nVideo: Centered, border-radius 8px, max-width 100%, dark container background.\n\nFont: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif.\n\n\nBEST PRACTICES FOR STABLE RENDERING (recapHtml):\n\nSession data arrives in two stages: some fields are available immediately when the session ends (user info, AI analysis, transcript), while others require polling. Video AI analysis may take up to 60 seconds; media usually arrives sooner. Naive implementations cause layout jumping (DOM rebuild on each poll) and duplicate network requests.\n\nARCHITECTURE: Split Static vs Dynamic Rendering.\n\nrenderStatic(data) — called ONCE:\nRenders all sections that won't change: user info (age, sex, location, device), aiAnalysis.overallSummary, aiAnalysis.analysis list, transcript, documentImages.\n\nupdateDynamic(data) — called on each poll:\nUpdates ONLY sections whose data arrives asynchronously: nodeReports, videoAIAnalysis, deepfakeDetection, and media (avatarVideo, screenshots).\nIMPORTANT: nodeReports is DELAYED — do NOT render node report data (face compare results, document scan results, etc.) in renderStatic().\nEach dynamic section has its own wrapper element (e.g. <div id=\"video-ai-content\">, <div id=\"node-reports-content\">) so updates replace only that element's innerHTML, leaving the rest untouched.\nTrack completion with boolean flags (videoAIDone, recordingDone, nodeReportsDone). Once a section is populated, skip further updates.\nSet videoAIDone when videoAIAnalysisStatus is either `succeeded` or `failed`. A failed analysis is terminal: replace the spinner with an unavailable message and do not interpret the missing result as clean evidence. If the status is absent, analysis was not requested, so omit the section.\n\nHTML STRUCTURE:\n<!-- Static sections: rendered once -->\n<div id=\"userinfo-card\"></div>\n<div id=\"summary-card\"></div>\n<div id=\"analysis-card\"></div>\n\n<!-- Dynamic sections: inner content updated by polling -->\n<div id=\"video-ai-card\">\n  <div class=\"card\">\n    <div class=\"card-title\">Video AI Analysis</div>\n    <div id=\"video-ai-content\"><!-- spinner initially, replaced when data arrives --></div>\n  </div>\n</div>\n\n<div id=\"recording-card\">\n  <div class=\"card\">\n    <div class=\"card-title\">Session Recording</div>\n    <div id=\"recording-content\"><!-- spinner initially, replaced when data arrives --></div>\n  </div>\n</div>\n\n<!-- Static section: rendered once -->\n<div id=\"transcript-card\"></div>\n\nPOLLING: Single Entry Point with Guard (IIFE pattern):\nIMPORTANT: Polling MUST be limited — max 30 attempts, max 2 minutes total. Stop polling when limits are reached even if some data hasn't arrived.\n(function() {\n  var polling = false;\n  var pollCount = 0;\n  var MAX_POLLS = 30;\n  var startTime = Date.now();\n  var MAX_DURATION = 2 * 60 * 1000; // 2 minutes\n  var videoAIDone = false;\n  var recordingDone = false;\n  var nodeReportsDone = false;\n\n  function shouldStop() {\n    return pollCount >= MAX_POLLS || (Date.now() - startTime) >= MAX_DURATION;\n  }\n\n  function poll() {\n    if (polling) return;\n    if (shouldStop()) return;\n    polling = true;\n    pollCount++;\n    if (typeof window.__refetchSession !== 'function') {\n      polling = false;\n      setTimeout(poll, 2000);\n      return;\n    }\n    window.__refetchSession()\n      .then(function(data) {\n        polling = false;\n        updateDynamic(data);\n        if ((!videoAIDone || !recordingDone || !nodeReportsDone) && !shouldStop()) setTimeout(poll, 4000);\n      })\n      .catch(function() {\n        polling = false;\n        if (!shouldStop()) setTimeout(poll, 4000);\n      });\n  }\n\n  function init() {\n    var data = window.__FACESIGN_SESSION__;\n    if (!data) return;\n    renderStatic(data);\n    var needMore = updateDynamic(data);\n    if (needMore) setTimeout(poll, 4000);\n  }\n\n  if (window.__FACESIGN_SESSION__) {\n    init();\n  } else {\n    var chk = setInterval(function() {\n      if (window.__FACESIGN_SESSION__) { clearInterval(chk); init(); }\n    }, 500);\n  }\n})();\n\nKEY RULES:\n- Call renderStatic() exactly once — avoids DOM rebuild and layout jumps\n- updateDynamic() only touches dedicated container elements — no reflow outside the updated section\n- Use a polling boolean guard — prevents concurrent __refetchSession() calls\n- ALWAYS limit polling — max 30 attempts AND max 2 minutes total. Never poll indefinitely.\n- Use videoAIDone / recordingDone / nodeReportsDone flags — stops updating a section once its data has been rendered\n- For video AI, derive videoAIDone from videoAIAnalysisStatus, not from the presence of videoAIAnalysis alone\n- nodeReports is DELAYED — always render node report data (face compare, document scan, etc.) in updateDynamic(), never in renderStatic()\n- Single init() entry point via IIFE — eliminates duplicate initialization paths\n- Check typeof __refetchSession === 'function' before calling — handles the case where the API isn't injected yet\n- Use setTimeout not setInterval for polling — ensures the next poll starts only after the previous one completes\n- nodeReport.type is lowercase snake_case (\"face_compare\", \"document_scan\") — use case-insensitive comparison\n- Document scan report fields are Microblink nested objects — use a safe-value extractor function (see COMMON MISTAKES)\n- videoAIAnalysis criterion is camelCase — convert to human-readable with toStartCase() (see COMMON MISTAKES)\n\nSUMMARY: Render once, patch selectively, poll safely with limits. Static content is written to the DOM a single time. Dynamic content (nodeReports, videoAIAnalysis, media) targets specific container elements. Polling is serialized with a guard flag and stops as soon as all async data has arrived or limits are reached (max 30 attempts / 2 minutes).",
                "type": "string"
              },
