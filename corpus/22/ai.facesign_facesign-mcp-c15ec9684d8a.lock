                          "description": "Record mapping each outcome to a target node id. All four are required",
                          "properties": {
                            "deepfakeDetected": {
                              "description": "Node id when deepfake is detected",
                              "type": "string"
                            },
                            "inconclusive": {
                              "description": "Node id when the check produced no verdict — the detector could not decide, did not run, or there was nothing to analyse. This is our failure, not the user's: route it to a retry, a step-up or a manual review, never to the happy path by default",
                              "type": "string"
                            },
                            "livenessDetected": {
                              "description": "Node id when liveness is confirmed",
                              "type": "string"
                            },
