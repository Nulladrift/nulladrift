                  },
                  "type": "object"
                },
                "description": "REQUIRED. Per-language UI string dictionary: { langId: { key: translatedString } }. You invent the keys to match the {{KEY}} placeholders / window.t('KEY') calls in your landingHtml and recapHtml. Must contain an entry for `en` (ultimate runtime fallback) and for every language in `langs` (or every catalog language if `langs` is omitted). Every per-language dict must share the IDENTICAL set of keys. Example: { \"en\": { \"START\": \"Start\", \"LOADING\": \"Loading...\" }, \"fr\": { \"START\": \"Commencer\", \"LOADING\": \"Chargement...\" } }.",
                "type": "object"
