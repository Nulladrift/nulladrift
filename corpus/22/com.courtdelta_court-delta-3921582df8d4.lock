        {
          "name": "estimate_license_points",
          "title": "Estimate North Carolina (NC) driver's-licence points for traffic charges",
          "description": "Driver's-licence points under G.S. 20-16(c) — a COMPARATOR, not a lookup.\n\nReturns what each possible outcome would cost: convicted as charged, reduced to\nimproper equipment, prayer for judgment, or dismissed. That comparison is the useful\nanswer; a single number is not. Fast — no court-portal request.\n\nLICENCE POINTS ONLY. Insurance (SDIP) points are a SEPARATE system with different\nvalues, set by the Rate Bureau rather than statute, and are NOT included. If someone\nasks what a ticket will do to their premium, say this tool doesn't cover that.\n\nTHE PJC SCENARIO'S ZERO HAS TWO EXCEPTIONS and you must state them. Under\nG.S. 20-4.01(4a) a prayer for judgment counts as a CONVICTION — so it does carry\npoints — if it is the THIRD OR SUBSEQUENT PJC within any five-year period, or for ANY\nPJC where the driver holds a CDL or the offence was in a commercial vehicle. Prior PJC\nhistory is not in court records here, so the 0 assumes neither applies.\n\n`unmatched[]` LISTS CHARGES THAT COULD NOT BE SCORED — always mention them. The\nschedule has a real \"All other moving violations = 2\" row, so a charge that matched\nthe catch-all (`viaCatchAll: true`) and one we failed to classify are different\nthings; do not let a total silently omit either.\n\nNon-Chapter-20 charges score nothing at all — a drug or assault charge is not a\ntraffic offence and gets no points. Non-moving violations (improper equipment,\nparking, inspection, registration, adult seat belt) are 0, which is why \"reduce to\nimproper equipment\" is the standard outcome people seek.\n\nSPEEDING TURNS ON ABSOLUTE SPEED, not how far over the limit: the schedule row is\n\"speeding in excess of 55 mph = 3\". 50-in-a-45 is 2, not 3. Pass `actual_speed` when\nknown — without it a speeding charge cannot be scored and lands in `unmatched`.\n\nPOINTS ARE NOT THE WHOLE CONSEQUENCE OF A SPEEDING CONVICTION. Check\n`excessiveSpeedingSuspension` and report it whenever it applies. G.S. 20-16.1(a)\nmandates a 30-DAY LICENCE SUSPENSION, imposed by the Division without a preliminary\nhearing, on conviction of either (i) more than 15 mph over the limit while ALSO above\n55 mph, or (ii) any speed above 80 mph. This is separate from and additional to points.\nAn 85-in-a-65 is only 3 points but ALSO costs the licence for 30 days — reporting the 3\nalone is a true number that leaves a false impression. Pass `speed_limit` as well as\n`actual_speed`: without the limit, branch (i) cannot be assessed and the tool abstains\n(`determinable: false`) rather than implying there is no suspension.\n\nThat suspension attaches only ON CONVICTION, so a reduction, PJC or dismissal avoids it\n— which is usually the single biggest factor in the comparison, bigger than the points.\n\nG.S. 20-16.1(b)(1): on a FIRST conviction only, the trial judge \"may when feasible\"\nallow a limited driving privilege for purposes reasonably connected with the HEALTH,\nEDUCATION AND WELFARE of the person convicted and their family. There is no listed\n\"work\" privilege — employment is commonly argued under welfare, so do not describe it\nas a work privilege as though the statute named one. The permit is valid for 30 days\nfrom issuance and the judge may restrict days, hours, vehicle types and routes.\n\nTHIS TOOL CANNOT TELL WHETHER IT WOULD BE A FIRST CONVICTION — prior convictions are\nnot in the record, so the seven-year look-back cannot be applied. The privilege is\ndiscretionary and conditioned on feasibility. Answer \"you can ask the court\", never\n\"yes, you will get one\". Do NOT import limited-privilege rules from the DWI statute\n(G.S. 20-179.3); there is no \"hard suspension period\" concept in G.S. 20-16.1.\n\nSUSPENSION FOR ACCUMULATED POINTS is a different mechanism again, with TWO thresholds\n(G.S. 20-16(a)(5)): 12 points in three years, and 8 in\nthe three years after a licence is reinstated. Pass `priorPoints` and\n`recentlyReinstated` if the user knows them — neither is in any court record, so\nwithout them no suspension assessment is made.\n\nSet `commercialLicense` or `outOfStateLicense` and the tool REFUSES rather than\nguessing: a separate, higher schedule applies to CDL holders, and an out-of-state\nconviction is assessed by the licensing state under the Driver Licence Compact.\n\nInformational, not legal advice. Whether a reduction or PJC is actually available is\na decision for the District Attorney and the court.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
