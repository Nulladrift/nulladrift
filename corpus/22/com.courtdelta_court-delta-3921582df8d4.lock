        {
          "name": "search_cases_by_attorney",
          "title": "Find an attorney's cases by North Carolina (NC) State Bar number",
          "description": "Cases where an attorney is counsel of record — by bar number OR by name.\n\n\"What's on my docket?\" for a lawyer or firm. Returns the case number, caption,\nfiling date, case type and county for every case the register lists that attorney\non. Each `case_number` goes straight into `lookup_court_case`.\n\nEVERY ROW NOW CARRIES `case_status`, with no `enrich` needed — so do not call\n`lookup_court_case` merely to find out whether a case is open or closed.\nThe returned text is FINER-GRAINED than the four filter values: alongside \"Pending\"\nand \"Disposed\" you will see \"Disposed - Voluntary Dismissal\", \"Disposed - Dismissal\non Order of the Court\", \"Disposed - Clerk of Superior Court\" — i.e. HOW it ended, not\njust that it did. So never test it with equality against the filter vocabulary\n(`status == \"Disposed\"` misses most disposed rows); match on a prefix, and quote the\nportal's own wording when you report it.\n\nFAST — about 3-15 seconds. This uses the portal's own attorney-search mode, not\nthe slow WAF-and-CAPTCHA hearing scrape, so do NOT warn the user about a long\nwait here.\n\nPASS EITHER `bar` OR BOTH `last` AND `first` — a first name alone or a last name\nalone is rejected. Prefer the bar number when you have it: it resolves to exactly\none attorney, whereas a name can match several.\n\nWHEN A NAME MATCHES MORE THAN ONE ATTORNEY, `attorney_name` comes back NULL and\n`matched_attorneys` lists everyone matched — the results are then a MERGED docket\nspanning all of them. Say so and offer to narrow by bar number; do not present it\nas one lawyer's caseload. When exactly one attorney matched, `attorney_name` is\nset, and it is worth echoing so the user can confirm it resolved to who they meant.\n\n`case_status=\"Pending\"` is usually what someone means by \"my cases\" — without it\nyou get their entire history, which for a working attorney is mostly closed\nmatters and will hit the cap below. Old cases legitimately remain Pending, so a\n2016 case in a Pending list is not necessarily an error.\n\nTHE 200-CASE CAP IS REAL AND IT BITES HERE. `truncated: true` means matches are\nMISSING, not merely unshown — a busy defender or a large firm exceeds 200\nroutinely. `case_status` and `file_date_start`/`file_date_end` narrow SERVER-SIDE\nand genuinely recover cases; `county` does NOT — it filters after the cap, so a\ntruncated county-filtered count is a lower bound, not a county total. Say the\nlist is incomplete rather than presenting it as the attorney's full caseload.\n\nA DATE RANGE MAY NOT BE ENOUGH ON ITS OWN. Measured: bar 21262 restricted to\ncases filed in 2024 still returned 200 `truncated: true`, spanning only 20 Nov to\n31 Dec. Narrow to a few months and check `truncated` again rather than assuming\none year fixed it.\n\nDates: ISO `YYYY-MM-DD` or `MM/DD/YYYY` — both accepted. `file_date_*` is WHEN\nTHE CASE WAS FILED, not when a hearing is. For \"what's on my calendar today\",\nuse `get_attorney_hearing_calendar` — filtering by file date answers a\ndifferent question and will usually return nothing.\n\n\"OF RECORD\" IS NOT \"CURRENTLY REPRESENTING\". This is what the register records,\nso withdrawn, substituted and long-closed representations still appear. Do not\ndescribe the result as someone's active caseload.\n\nPublic record — the portal offers this same search to anyone, so this is not a\nprivate view of a firm's book of business.\n\nRead-only. North Carolina (NC) only. Informational, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bar": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "case_status": {
                "anyOf": [
                  {
                    "enum": ["Pending", "Disposed", "Closed", "Reopened"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "county": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "file_date_end": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "file_date_start": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "first": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "last": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "limit": {
                "default": 100,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
