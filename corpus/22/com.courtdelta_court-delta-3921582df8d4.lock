        {
          "name": "check_traffic_charge",
          "title": "Check whether a North Carolina (NC) traffic charge requires a court appearance",
          "description": "\"Do I have to go to court for this ticket?\" — answered from the citation itself.\n\nFor someone holding a paper North Carolina (NC) citation, BEFORE their case is searchable. Returns\nwaiver eligibility per charge (waivable / mandatory / conditional) plus how to ask\nfor a reduction or dismissal. FAST — no court-portal request, unlike the other tools.\n\nTHE OUTPUT IS OPTIONS WITH CONSEQUENCES, NOT A RECOMMENDATION. Waiving is a guilty\nplea to the charge as written (an admission of responsibility on an infraction);\nrequesting a reduction asks the District Attorney to change the charge before any\nplea; the two are alternatives. Relay them as choices for the person to make, and\nnever tell them which to pick.\n\nTIMING IS PART OF THE ANSWER, NOT A DETAIL. Both routes have to be completed BEFORE\nTHE CASE IS CALLED, not merely on or before the court date — once the calendar reaches\nit the clerk is working a courtroom docket, and nothing pauses the hearing. Read\n`citationOptions.state` before saying anything about appearing:\n\n  \"lastDay\"        the court date is TODAY. It can still be settled with the clerk,\n                   but only before the case is called, and there is NO time left to\n                   file online — do not offer Guide & File. If the clerk cannot be\n                   reached in time, the person should go to court.\n  \"noCourtDate\"    no upcoming hearing, OR today's has already been called. Do NOT\n                   assert a failure to appear — you cannot see the courtroom and they\n                   may have attended that morning. Say: if they already went, this\n                   does not apply; if they missed it, contact the Clerk of Superior\n                   Court, because a missed date can become an FTA.\n  \"mandatory\" | \"conditional\" | \"onlineWaivable\" | \"inPersonWaivable\"  as before.\n\nNEVER REPORT \"no appearance needed\" ON \"lastDay\" OR \"noCourtDate\", however many of\nthe individual charges come back `waivable`. Missing a court date on a Chapter 20\ncase means an order for arrest and a G.S. 20-24.1 revocation that lasts until the\ncharge is actually disposed. `howToRequest` already carries the right wording for\nevery state — relaying it verbatim is the safe move.\n\nIF THE USER HAS A CASE NUMBER, USE `lookup_court_case` INSTEAD. It runs these same\nrules on the real charges and also gives the court date and the amount owed. This\ntool is for when there is no case number yet.\n\nTHE STATUTE DRIVES THE ANSWER. Pass the G.S. number printed on the citation\n(e.g. \"20-141(J1)\", \"G.S. 20-127(D)\"). Without a parseable statute a charge cannot\nbe classified — ask the user to read the \"G.S.\" line off their citation rather than\nguessing from the offense name. `unclassified` lists any charge that fell through.\n\nPASS EVERY CHARGE ON THE CITATION, not just the one asked about. Eligibility is\ncomputed ACROSS the citation: one mandatory charge forces an appearance for all of\nthem. Reporting on a single charge in isolation gives the wrong answer — a real Wake\ncase has two waivable charges and one DWLR, and the correct answer is \"you must\nappear\".\n\n`viaCompanionCharge: true` on a charge means exactly that: it would be waivable on\nits own, but AOC mandatory-appearance item #39 makes every violation on a citation\nmandatory once ANY violation on it is. Never tell someone they can pay such a charge\noff separately or handle it by mail — the whole citation must be appeared on. Say\nwhich charge is forcing it, since that is usually the one they want to ask the\nDistrict Attorney about.\n\nSPEED CHANGES THE ANSWER. With no charged speed a speeding charge comes back\n`conditional`, not waivable: over 80 mph, or more than 15 over while over 55, is\nmandatory. Pass `actual_speed`/`speed_limit` if known — or just pass the offense line\nverbatim (\"SPEEDING 85 IN A 65\"), which is parsed for the speed.\n\nPASS `offense` VERBATIM FROM THE CITATION for every charge, not a paraphrase. A few\nrules cannot be decided from the statute number alone and are read off the offense\ntext: texting is waivable UNLESS it was while operating a school bus, and a\nregistration or title violation is waivable UNLESS it involves stolen, altered or\nfictitious plates or certificates. Both statutes are the same either way, so a\nparaphrase that drops \"school bus\" or \"fictitious\" silently turns a mandatory\nappearance into \"waivable\". If the user summarises rather than quotes, ask for the\nexact wording on the citation before answering.\n\n`county` (optional) decides the reduction path: participating counties get NC's\nonline Guide & File link, others get the in-person District Attorney route.\n\nPASS `court_date` WHENEVER THE CITATION SHOWS ONE (YYYY-MM-DD), AND PASS THE REAL ONE.\nWithout it the answer assumes there is no upcoming hearing and comes back as \"contact\nthe Clerk of Superior Court\" instead of the resolution options — an open citation with\nno court date often means a failure to appear has already happened. It also unlocks\n`reductionSubmitBy`: NC's online reduction request must be filed SEVERAL BUSINESS DAYS\nBEFORE the court date, so without the date that cutoff is silently missing rather than\nreported.\n\nThe date is read against the Eastern-time clock, so it changes the answer in both\ndirections: a date already past — INCLUDING EARLIER THE SAME DAY — returns\n\"noCourtDate\", and a date that is TODAY returns \"lastDay\". Guessing or rounding the\ndate is therefore not a harmless approximation; it is how someone gets told a ticket\nis cleanly waivable on the morning of their hearing.\n\n`citationOptions.reduction` is a PRE-SCREEN, never an eligibility verdict. Each gate\nis pass / fail / unknown, and `unknown` means the court record cannot decide it —\nreport it as unknown, never as a disqualification. Four of the program's criteria\n(age 18+, valid NC licence, non-CDL, NCDMV compliance on a companion charge) are not\nin court data at all and come back in `userMustConfirm` for the person to check. The\n10-19 mph band and the 80 mph ceiling are AOC / District Attorney PROGRAM CRITERIA,\nnot statute — never attach a G.S. citation to them. The District Attorney decides\nwhether to offer a reduction.\n\nA null `citationOptions` means these are NOT waivable-citation charges — either not\nNC Chapter-20 traffic, or a serious criminal charge (impaired driving, death by\nvehicle, eluding) or a felony, where \"it's just a ticket\" framing is wrong. Say that\nplainly; do not present it as \"no appearance required\".\n\nGeneral guidance for the charges given, NOT a lookup of any real case, and not legal\nadvice. `amountDue` is always null here — there is no case to read a balance from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "charges": {
                "description": "At least one charge as {offense, statute}. Speeds may be numbers or strings.",
                "examples": [
