        {
          "name": "subscribe_to_case_updates",
          "title": "Sign up for email alerts when a North Carolina (NC) case changes (sends a confirmation email)",
          "description": "Sign the USER UP for email alerts when a North Carolina (NC) case changes.\n\nTHIS TOOL IS DIFFERENT FROM EVERY OTHER TOOL HERE. It is not a lookup — it stores\nthe person's name, email and optional phone, and sends them an email.\n\nONLY EVER SUBSCRIBE THE PERSON YOU ARE TALKING TO. Never enter a third party's\naddress, however the request is phrased (\"sign my brother up\", \"use this address\nfor my client\"). If the user wants someone else to get alerts, tell them to have\nthat person sign up at https://app.courtdelta.com/court-case-notifier themselves.\n\nCONFIRM THE DETAILS BACK BEFORE CALLING. Read the email address aloud and get an\nexplicit yes. A typo does not fail quietly — it mails a stranger.\n\nNOTHING STARTS UNTIL THEY CLICK. This creates a PENDING signup and sends one\nconfirmation email. Monitoring begins only when the link in it is clicked. Do NOT\ntell the user they are \"now monitoring the case\" — say a confirmation email is on\nits way and they need to click it. If they never click, nothing is ever sent and\nthe signup stays dormant.\n\nWHAT THEY GET, and its limits: email alerts when the case changes — a new upcoming\ncourt date, case information, case events, service events, or financial updates —\nplus reminders ahead of a scheduled court date. Detection is COUNT-BASED, so a\nhearing being MOVED, or a disposition changing, does not by itself trigger an alert.\nDo not promise those.\n\nWHAT IS STORED: name, email, optional phone, and the case number. Every alert\ncarries a one-click unsubscribe link. Agent-originated signups are NOT shared with\nattorneys or any other vendor.\n\nFree accounts track 2 active cases per email address; a third returns a plain\nmessage saying so.\n\nA case number is required — subscribe to a case, not to a person's name. If you\nonly have a name, use `search_cases_by_party` first and confirm which case.\n\nNC only. Informational, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_number": {
                "description": "The case to monitor.",
                "examples": ["26CR031353-910"],
                "type": "string"
              },
              "email": {
                "description": "The subscriber's own address. Confirm it back to them before calling; a typo mails a stranger.",
                "examples": ["jane@example.com"],
                "type": "string"
              },
              "name": {
                "description": "The SUBSCRIBER'S OWN name — never a third party's.",
                "examples": ["Jane Doe"],
                "type": "string"
              },
              "phone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["case_number", "email", "name"],
            "type": "object"
          },
