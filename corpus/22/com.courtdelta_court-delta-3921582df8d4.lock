        {
          "name": "search_cases_by_party",
          "title": "Search North Carolina (NC) court cases by party (person) name",
          "description": "Search North Carolina (NC) court cases by a person's name.\n\nReturns (person, case) matches from the NC eCourts party-name search. Each row\ncarries a `case_number` (the stable id) and a `portal_session_ref` — a Tyler token\nwhose lifetime is UNSPECIFIED (it rotates every search; survives at least minutes;\nupper bound unmeasured). Pass it to `lookup_court_case` (as `portalSessionRef`) for a\nquick follow-up; for anything persisted or delayed use `case_number`. Never persist\nor reuse the ref. Each row also carries `portal_url` — the direct NC eCourts source\nrecord; it embeds the same short-lived token, so treat it like the ref (don't persist).\n`caseSummaryUrl` (from `lookup_court_case`) is the durable link.\nEVERY ROW NOW CARRIES `case_status`, with no `enrich` needed — so do not call\n`lookup_court_case` merely to find out whether a case is open or closed.\nThe returned text is FINER-GRAINED than the four filter values: alongside \"Pending\"\nand \"Disposed\" you will see \"Disposed - Voluntary Dismissal\", \"Disposed - Dismissal\non Order of the Court\", \"Disposed - Clerk of Superior Court\" — i.e. HOW it ended, not\njust that it did. So never test it with equality against the filter vocabulary\n(`status == \"Disposed\"` misses most disposed rows); match on a prefix, and quote the\nportal's own wording when you report it.\n\nRows carry `party_type` (the person's role) plus `party_role_source`: \"caption\"\n= surname confirmed in the case caption (trust it); \"portal_party_type\" = role\nfrom the portal's own PartyTypeKey but no caption to confirm (common on SP /\nforeclosure cases — usable, but corroborate for high-stakes use); null = no role\n(or a role dropped as suspect, e.g. a citing officer mislabeled \"Defendant\" on\nsomeone else's caption). For an AUTHORITATIVE role/roster, call `lookup_court_case`\nand read its `parties` list. `party_role_verified` (bool) = source == \"caption\".\nRead-only. NC only. Informational, not legal advice.\n\nRequired: `last`, `first`. Filters differ in where they apply:\n  - SERVER-SIDE narrowing (reduce the portal search — the ONLY way to clear the\n    200-case cap): `case_status` (\"Pending\"|\"Disposed\"|\"Closed\"|\"Reopened\"), the\n    filed-date range `file_date_start`/`file_date_end` (ISO YYYY-MM-DD or MM/DD/YYYY\n    — both accepted), and a more specific name.\n  - `soundex: true` is also server-side but BROADENS (phonetic surname matching →\n    MORE matches, more likely to truncate) — don't enable it to clear a cap.\n  - CLIENT-SIDE (filter the rows already returned; do NOT recover cases missed by\n    the cap): `county` (\"Wake\" or \"Wake County\") and `case_type` (pick a value\n    from the `narrowing.caseTypes` facet).\n\nSpeed: a search runs a live portal query and takes ~15-50s, with real run-to-run\nvariance — do NOT pick filters for speed. Narrow for COMPLETENESS: `case_status` and\na `file_date` range are server-side and are the only filters that recover cases past\nthe 200-cap; `county`/`case_type` only filter what was already returned.\n\nTwo different limits:\n  - `portal_truncated` true = the portal hit its statewide 200-case cap, so the\n    set is INCOMPLETE (real matches are missing). See `portal_truncated_note`;\n    when true, `narrowing` gives counties only (counts are lower bounds). Clear it\n    with `case_status` / date range / a more specific name.\n  - `results_truncated` true = the (complete) set exceeded `limit`, so not all\n    rows are shown. Pass a higher `limit` (up to 200) to show them all.\n\nBreadth (read `narrowing_hint`): the tool never asks you to withhold results, and it\ndistinguishes two cases with different remedies:\n  - INCOMPLETE (`portal_truncated` true): the shown cases are valid but some are\n    missing. Present them, and to recover the rest narrow with server-side filters\n    (a filed-date range or `case_status`) — or, if autonomous with no user to ask,\n    re-call `confirm_broad=true` to proceed as-is.\n  - COMPLETE but long (a large set with `portal_truncated` false): nothing is missing.\n    List or summarize the results; refining (county/case_type/date) is optional, not\n    required. A moderate complete set is a fine answer on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_status": {
                "anyOf": [
                  {
                    "enum": ["Pending", "Disposed", "Closed", "Reopened"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "case_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "confirm_broad": {
                "default": false,
                "type": "boolean"
              },
              "county": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "file_date_end": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "file_date_start": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "first": {
                "description": "Given name. Required: a surname alone is rejected.",
                "examples": ["JOHN", "MARIA"],
                "type": "string"
              },
              "last": {
                "description": "Surname. A company has none — use search_cases_by_business.",
                "examples": ["SMITH", "GARCIA"],
                "type": "string"
              },
              "limit": {
                "default": 100,
                "type": "integer"
              },
              "soundex": {
                "default": false,
                "type": "boolean"
              }
            },
            "required": ["first", "last"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search North Carolina (NC) court cases by party (person) name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
