        {
          "name": "search_cases_by_business",
          "title": "Find a company's court cases by business name",
          "description": "Cases with a COMPANY as a party — by business name.\n\nUse this, not `search_cases_by_party`, whenever the subject is an organization:\nan LLC, corporation, insurer, hospital, landlord, dealership or municipality.\nParty search requires a first AND last name, which a business does not have, so\nit cannot answer this at all.\n\nFAST — about 5-45 seconds. No CAPTCHA. Do not warn about a long wait.\n\nEVERY ROW NOW CARRIES `case_status`, with no `enrich` needed — so do not call\n`lookup_court_case` merely to find out whether a case is open or closed.\nThe returned text is FINER-GRAINED than the four filter values: alongside \"Pending\"\nand \"Disposed\" you will see \"Disposed - Voluntary Dismissal\", \"Disposed - Dismissal\non Order of the Court\", \"Disposed - Clerk of Superior Court\" — i.e. HOW it ended, not\njust that it did. So never test it with equality against the filter vocabulary\n(`status == \"Disposed\"` misses most disposed rows); match on a prefix, and quote the\nportal's own wording when you report it.\n\nTYPE THE NAME AS IT APPEARS, COMMA INCLUDED. The comma is significant and\nNARROWING: \"FOOD LION, LLC\" is a different, smaller search than \"FOOD LION\". Do\nnot strip it, and do not replace it with a wildcard — advice to do that appears in\nthe portal's help text but applies to a different search mode.\n\nWILDCARD: a trailing `*` is allowed and needs AT LEAST 4 characters before it.\n\"WALM*\" works; \"WAL*\" is rejected. Use it for a company whose exact registered\nname you do not know (\"CAROLINA TOWING*\").\n\nTHERE IS NO PARTY ROLE IN THIS RESULT, ON PURPOSE. The portal labels every row\n\"Defendant\" regardless of the truth — including cases the company FILED as\nplaintiff and criminal cases where it was the victim. NEVER say the business is\nthe defendant. Read the side from `case_name` (\"X VS Y\" — the company's position\nin the caption is the real signal), or call `lookup_court_case` for the actual\nparty list.\n\nTHE 200-CASE CAP BITES IMMEDIATELY FOR ANY CHAIN OR INSURER. `results_truncated:\ntrue` means real matches are MISSING. Worse, `county` filters AFTER that cap, so\na truncated county-filtered count is a LOWER BOUND, never a total — \"11 cases in\nWake\" may be 11 of the 200 statewide the portal was willing to show. Only\n`case_status` and the file-date range narrow server-side. Say the list is\nincomplete instead of reporting a count as if it were complete.\n\n`matched_businesses` lists the distinct entity names actually hit. More than one\nmeans legally separate entities are mixed together (\"FOOD LION, LLC\" alongside\n\"DELHAIZE AMERICA, LLC\") — surface that rather than treating them as one company.\n\nDates: ISO `YYYY-MM-DD` or `MM/DD/YYYY` — both accepted. These bound WHEN THE\nCASE WAS FILED, not when anything is scheduled. A year at a time is the most\neffective way to get a chain's cases under the 200-cap: 'FOOD LION' unfiltered\ncaps out, but restricted to 2023 it returns 42 complete rows.\n\nPublic record. Read-only. North Carolina (NC) only. Informational, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_status": {
                "anyOf": [
                  {
                    "enum": ["Pending", "Disposed", "Closed", "Reopened"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "county": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "file_date_end": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "file_date_start": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "limit": {
                "default": 100,
                "type": "integer"
              },
              "name": {
                "description": "The business name, written as the user wrote it — \"FOOD LION, LLC\" is a narrower search than \"FOOD LION\". For a PERSON use search_cases_by_party instead.",
                "examples": ["FOOD LION, LLC", "DUKE ENERGY"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a company's court cases by business name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
