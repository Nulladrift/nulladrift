        {
          "name": "list_templates",
          "title": "List templates",
          "description": "List templates visible to the caller: the curated makesPDF library and the caller's own saved templates. Returns metadata only (no DSL), one page at a time. Mirrors GET /api/v1/templates.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Document type to match exactly. Library templates use 'certificate', 'civic', 'form', 'invoice', 'letter', 'quote', 'receipt', 'report', 'resume', 'shipping-label' and 'statement'; your own templates may use others, shown in the `category` field of earlier results.",
                "maxLength": 64,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Page size: how many templates to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "How many matching templates to skip, for paging. Add `limit` to it to fetch the next page.",
                "minimum": 0,
                "type": "integer"
              },
              "owner": {
                "default": "all",
                "description": "Whose templates to list: 'mine' for templates you saved, 'library' for the curated makesPDF catalog, 'all' for both.",
                "enum": ["mine", "library", "all"],
                "type": "string"
              },
              "q": {
                "description": "Free text matched as a case-insensitive substring against template names and descriptions.",
                "maxLength": 128,
                "type": "string"
              },
              "tags": {
                "description": "Comma-separated tags; a template must carry every one to match, e.g. 'receipt,retail'. The `tags` field of earlier results shows the values in use.",
                "maxLength": 256,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limit": {
                "description": "Page size used.",
                "type": "integer"
              },
              "offset": {
                "description": "Offset used.",
                "type": "integer"
              },
              "templates": {
                "description": "One page of matching templates, metadata only.",
                "items": {
                  "properties": {
                    "category": {
                      "description": "Document type (e.g. 'invoice'); null when uncategorised.",
                      "type": ["string", "null"]
                    },
                    "createdAt": {
                      "description": "When the template was created, as a UTC 'YYYY-MM-DD HH:MM:SS' timestamp.",
                      "type": "string"
                    },
                    "description": {
                      "description": "One-sentence summary; empty when none is stored.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Display name.",
                      "type": "string"
                    },
                    "ownerUserId": {
                      "description": "Owner's user ID, or null for a curated library template.",
                      "type": ["string", "null"]
                    },
                    "tags": {
                      "description": "Tags for filtering.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "templateId": {
                      "description": "Template ID: a slug for library templates, a UUID for your own.",
                      "type": "string"
                    },
                    "updatedAt": {
                      "description": "When the template was last changed, as a UTC 'YYYY-MM-DD HH:MM:SS' timestamp.",
                      "type": "string"
                    }
                  },
                  "required": ["category", "createdAt", "description", "name", "ownerUserId", "tags", "templateId", "updatedAt"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Matching templates across all pages.",
                "type": "integer"
              }
            },
            "required": ["limit", "offset", "templates", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6391218bb973a40ae788efb3dbc87735d4f39dd8ff5502c2bd9595c14f66e48"
