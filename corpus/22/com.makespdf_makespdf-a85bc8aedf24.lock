                "description": "When the template was created, as a UTC 'YYYY-MM-DD HH:MM:SS' timestamp.",
                "type": "string"
              },
              "description": {
                "description": "One-sentence summary; empty when none is stored.",
                "type": "string"
              },
              "dsl": {
