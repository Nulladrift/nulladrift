      "serverInfo": {
        "name": "makespdf-mcp",
        "title": "makesPDF",
        "version": "0.1.0",
        "description": "Turn markdown or a template DSL into accessible, tagged PDFs (PDF/A-2A + PDF/UA-1). Validate and preview for free, save and reuse templates, browse a curated template library, then render the final PDF.",
        "websiteUrl": "https://makespdf.com/docs/mcp",
        "icons": [
          {
            "src": "https://makespdf.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://makespdf.com/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {
            "directoryRead": true
          }
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "makesPDF creates PDF documents.\n\nWhen the user wants a PDF of written content (notes, reports, summaries, letters, lists, checklists, flowcharts and other diagrams), compose it as markdown and call `render_markdown`. It supports GitHub-flavored markdown, tables, task lists, Mermaid diagrams, code highlighting and images, and produces a tagged, accessible PDF (PDF/UA-1 + PDF/A-2A). `validate_markdown` (free) checks headings and alt text first; there is no markdown preview.\n\nWhen the user wants a PDF invoice, receipt, quote, certificate or resume, `list_templates` finds a curated template (`owner: 'library'`, or filter by `category`, `tags`, `q`); call `render_template` with its `templateId` and the user's data. `get_template` returns a template's DSL and sampleData.\n\n`render_markdown` and `render_template` use the user's makesPDF credits: 1 credit per 10 pages (the Free plan includes 10 a month). `render_dsl_preview` is free but every page is stamped 'PREVIEW — NOT FOR USE': use it while designing a custom template, then deliver the document with `render_template`.\n\n**Saving a rendered PDF:** `render_markdown` and `render_template` return a `downloadUrl` that needs no credentials (`curl -o document.pdf '<downloadUrl>'`). Download it; do not rebuild the PDF from the embedded blob. It expires after 15 minutes; `get_render_download_url` with the `artifactId` mints a fresh one.\n\n**Custom templates:** before authoring DSL, read the resource `file:///skills/pdf-template-author.md` once per session. Loop: write DSL → `validate_dsl` → `render_dsl_preview` → `save_template` → `render_template`.\n\nStuck, or a description misled you? `report_feedback` (free) reaches the makesPDF team; never include the user's document text, markdown, DSL or data values.",
      "tools": [
        {
          "name": "delete_template",
          "title": "Delete template",
          "description": "Permanently delete a caller-owned template by ID. This cannot be undone. Library rows cannot be deleted. Returns JSON { templateId, deleted: true }. Mirrors DELETE /api/v1/templates/:id.",
          "inputSchema": {
            "properties": {
              "templateId": {
                "description": "Template ID — slug for library rows (e.g. 'invoice-classic') or UUID for user rows.",
                "type": "string"
              }
            },
            "required": ["templateId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "deleted": {
                "const": true,
                "description": "Always true; a failed delete is a tool error.",
                "type": "boolean"
              },
              "templateId": {
                "description": "Template ID: a slug for library templates, a UUID for your own.",
                "type": "string"
              }
            },
            "required": ["deleted", "templateId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete template"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8980ad6cc7d83651991debfcd288e0bd0711ac8d30c764a9ccb399ba743b518c"
        },
        {
          "name": "get_render_download_url",
          "title": "Get render download URL",
          "description": "Re-issue a short-lived signed download URL for a render artifact the caller owns, so a PDF rendered in an earlier turn can be downloaded without the embedded base64 bytes. Free (no credits). Returns JSON { artifactId, downloadUrl, downloadUrlExpiresAt } and a resource_link to the URL. Owner-scoped; links follow the artifact's normal retention. An unknown, unowned, failed or expired artifact returns the same 'Render not found' error.",
          "inputSchema": {
            "properties": {
              "artifactId": {
                "description": "UUID of the render artifact — the `artifactId` returned by a render tool, or the `X-Artifact-Id` response header on a REST render.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["artifactId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "artifactId": {
                "description": "The artifact the link downloads.",
                "type": "string"
              },
              "downloadUrl": {
                "description": "Short-lived signed URL that downloads the PDF with no credential of its own.",
                "type": "string"
              },
              "downloadUrlExpiresAt": {
                "description": "When `downloadUrl` stops working, as an ISO 8601 timestamp.",
                "type": "string"
              }
            },
            "required": ["artifactId", "downloadUrl", "downloadUrlExpiresAt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get render download URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2aaf6b12ce8037be3d49b90554f692a7a157e0a4231107267228ab78afa50832"
        },
        {
