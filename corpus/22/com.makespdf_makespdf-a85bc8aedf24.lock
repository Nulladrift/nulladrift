        {
          "name": "render_dsl_preview",
          "title": "Preview template PDF",
          "description": "Render a DSL template + data to a preview PDF. Free (no credits), always watermarked 'PREVIEW — NOT FOR USE'. Returns JSON metadata plus the PDF bytes as an embedded base64 resource. No artifact is recorded, so there is no download URL or resource link. Mirrors POST /api/v1/preview.",
          "inputSchema": {
            "properties": {
              "data": {
                "description": "Optional binding data. Falls back to the script's sampleData when omitted.",
                "type": "object"
              },
              "dsl": {
                "description": "The template source: a builder DSL script that assigns `const template = doc(...)` and optionally `const sampleData = {...}`.",
                "type": "string"
              },
              "title": {
                "description": "Document title written to the PDF metadata. PDF viewers show it in the window title instead of the file name. When omitted, the title is 'Document'; a title set in the DSL's doc() is not used.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["dsl"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Render metadata. The PDF itself is the embedded resource in `content`.",
            "properties": {
              "pageCount": {
                "description": "Pages in the rendered PDF.",
                "type": "integer"
              },
              "renderMs": {
                "description": "Server-side render time in milliseconds.",
                "type": "integer"
              },
              "sizeBytes": {
                "description": "Size of the PDF in bytes.",
                "type": "integer"
              },
              "templateWarnings": {
                "description": "Problems found while binding data (unsupported expressions, unknown filters, bad currency codes, invalid chart data, …). Unresolved expressions render as empty text and bad chart data affects the chart. Each originates in the DSL or the data.",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Warning kind, e.g. 'unknown-filter'.",
                      "type": "string"
                    },
                    "detail": {
                      "description": "Human-readable explanation, when available.",
                      "type": "string"
                    },
                    "expression": {
                      "description": "The expression source that failed.",
                      "type": "string"
                    }
                  },
                  "required": ["code", "expression"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["pageCount", "renderMs", "sizeBytes", "templateWarnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Preview template PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1acf3b3d59bd0b972ae2499b059ff0abc582f66ae273b694a02c2f1b4075061d"
        },
        {
          "name": "render_markdown",
          "title": "Render markdown",
          "description": "Create a PDF document from markdown text. Use when the user asks for a PDF of written content, such as notes, a report, a summary, a letter, a list, a checklist or a diagram. Supports GitHub-flavored markdown, tables, task lists, Mermaid diagrams (flowcharts, sequence and other diagram types), code highlighting and images; the output is a tagged, accessible PDF (PDF/A-2A + PDF/UA-1). Uses the user's makesPDF credits: 1 credit per 10 pages. Returns JSON metadata (pageCount, creditsDeducted, creditsRemaining, artifactId, downloadUrl) plus the PDF bytes as an embedded base64 resource and a resource_link to `downloadUrl`. On the Free and Hobbyist plans, unless the account holds Growth credits, each page carries a small makespdf.com link. Mirrors POST /api/v1/md.",
          "inputSchema": {
            "properties": {
              "markdown": {
                "description": "The GitHub-flavored markdown document to render. YAML frontmatter may set the same keys as `options`. Up to 200KB of text; inline data: image payloads do not count toward that.",
                "type": "string"
              },
              "options": {
                "description": "Optional render settings. Anything omitted falls back to YAML frontmatter in the markdown, then to the runtime default.",
                "properties": {
                  "author": {
                    "description": "Document author, written to the PDF metadata.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "fontFamily": {
                    "default": "Inter",
                    "description": "Body font: 'Inter' (geometric sans) or 'NotoSans' (humanist sans). Code blocks always use a monospace font.",
                    "enum": ["Inter", "NotoSans"],
                    "type": "string"
                  },
                  "fontSize": {
                    "default": 10,
                    "description": "Body text size in points. Headings, spacing and line height scale from it.",
                    "maximum": 24,
                    "minimum": 6,
                    "type": "number"
                  },
                  "keywords": {
                    "description": "Search keywords, written to the PDF metadata.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "margins": {
                    "description": "Page margins in points, [top, right, bottom, left]. When omitted, frontmatter `margins` applies, else 40 on every side.",
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  "pageNumberPosition": {
                    "default": "right",
                    "description": "Footer alignment of the page number. Ignored without pageNumbers.",
                    "enum": ["left", "center", "right"],
                    "type": "string"
                  },
                  "pageNumbers": {
                    "description": "Footer page-number format: 'page-n-of-total' (Page 3 of 12), 'n-of-total' (3 / 12), or 'n' (3). Omit for no page numbers.",
                    "enum": ["page-n-of-total", "n-of-total", "n"],
                    "type": "string"
                  },
                  "pageSize": {
                    "default": "A4",
                    "description": "Paper size for every page.",
                    "enum": ["A3", "A4", "A5", "Letter", "Legal"],
                    "type": "string"
                  },
                  "splitMode": {
                    "description": "How sections break across pages. 'default' keeps each section together where it can; 'balanced' splits large sections to fill pages and leave fewer gaps.",
                    "enum": ["default", "balanced"],
                    "type": "string"
                  },
                  "subject": {
                    "description": "One-line summary of the document, written to the PDF metadata.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "theme": {
                    "default": "github",
                    "description": "Visual style. 'github': lighter semibold headings, underlined h1/h2, zebra-striped bordered tables. 'default': heavier bold headings with no underlines or striping.",
                    "enum": ["default", "github"],
                    "type": "string"
                  },
                  "title": {
                    "description": "Document title written to the PDF metadata. PDF viewers show it in the window title instead of the file name. When omitted, frontmatter `title` applies, else 'Document'.",
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["markdown"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Render and billing metadata. The PDF itself is the embedded resource in `content`.",
            "properties": {
              "artifactId": {
                "description": "ID of the stored render artifact, also served at GET /api/v1/artifacts/{id}/pdf. Absent when the artifact could not be recorded.",
                "type": "string"
              },
              "creditsDeducted": {
                "description": "Credits charged for this render: 1 per 10 pages, rounded up; 0 when the caller is not billed.",
                "type": "integer"
              },
              "creditsRemaining": {
                "description": "Credit balance after the charge; null when the caller is not billed.",
                "type": ["number", "null"]
              },
              "downloadUrl": {
                "description": "Short-lived signed URL that downloads the rendered PDF with no credential of its own. Absent when the artifact could not be recorded.",
                "type": "string"
              },
              "downloadUrlExpiresAt": {
                "description": "When `downloadUrl` stops working, as an ISO 8601 timestamp.",
                "type": "string"
              },
              "pageCount": {
                "description": "Pages in the rendered PDF.",
                "type": "integer"
              },
              "renderMs": {
                "description": "Server-side render time in milliseconds.",
                "type": "integer"
              },
              "sizeBytes": {
                "description": "Size of the PDF in bytes.",
                "type": "integer"
              }
            },
            "required": ["creditsDeducted", "creditsRemaining", "pageCount", "renderMs", "sizeBytes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Render markdown"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ca552b0ac3e43ec4c3cc81b6bc07f7d77f5fc3b0c0bf0baccd66682db66b2ec"
        },
        {
          "name": "render_template",
          "title": "Render template",
          "description": "Create a PDF from a stored template (a curated makesPDF library template or one the user saved) filled with the user's data. Use when the user asks for a PDF of a structured document, such as an invoice, receipt, quote, certificate or resume, that a template covers. Uses the user's makesPDF credits: 1 credit per 10 pages. Returns JSON metadata (pageCount, creditsDeducted, creditsRemaining, artifactId, downloadUrl) plus the PDF bytes as an embedded base64 resource and a resource_link to `downloadUrl`. On the Free and Hobbyist plans, unless the account holds Growth credits, each page carries a small makespdf.com link. Mirrors POST /api/v1/render with the { templateId, data } body shape.",
          "inputSchema": {
            "properties": {
              "data": {
                "description": "Binding data substituted into {{var}} expressions. When omitted, the `const sampleData` declared inside the template's DSL is used; the separately stored sampleData field is not.",
                "type": "object"
              },
              "templateId": {
                "description": "Template ID — slug for library rows (e.g. 'invoice-classic') or UUID for user rows.",
                "type": "string"
              },
              "title": {
                "description": "Document title written to the PDF metadata. PDF viewers show it in the window title instead of the file name. When omitted, the template's saved name is used; a title set in the DSL's doc() is not.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["templateId"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Render and billing metadata. The PDF itself is the embedded resource in `content`.",
            "properties": {
              "artifactId": {
                "description": "ID of the stored render artifact, also served at GET /api/v1/artifacts/{id}/pdf. Absent when the artifact could not be recorded.",
                "type": "string"
              },
              "creditsDeducted": {
                "description": "Credits charged for this render: 1 per 10 pages, rounded up; 0 when the caller is not billed.",
                "type": "integer"
              },
              "creditsRemaining": {
                "description": "Credit balance after the charge; null when the caller is not billed.",
                "type": ["number", "null"]
              },
              "downloadUrl": {
                "description": "Short-lived signed URL that downloads the rendered PDF with no credential of its own. Absent when the artifact could not be recorded.",
                "type": "string"
              },
              "downloadUrlExpiresAt": {
                "description": "When `downloadUrl` stops working, as an ISO 8601 timestamp.",
                "type": "string"
              },
              "pageCount": {
                "description": "Pages in the rendered PDF.",
                "type": "integer"
              },
              "renderMs": {
                "description": "Server-side render time in milliseconds.",
                "type": "integer"
              },
              "sizeBytes": {
                "description": "Size of the PDF in bytes.",
                "type": "integer"
              },
              "templateId": {
                "description": "Template ID: a slug for library templates, a UUID for your own.",
                "type": "string"
              },
              "templateWarnings": {
                "description": "Problems found while binding data (unsupported expressions, unknown filters, bad currency codes, invalid chart data, …). Unresolved expressions render as empty text and bad chart data affects the chart. Each originates in the DSL or the data.",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Warning kind, e.g. 'unknown-filter'.",
                      "type": "string"
                    },
                    "detail": {
                      "description": "Human-readable explanation, when available.",
                      "type": "string"
                    },
                    "expression": {
                      "description": "The expression source that failed.",
                      "type": "string"
                    }
                  },
                  "required": ["code", "expression"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["creditsDeducted", "creditsRemaining", "pageCount", "renderMs", "sizeBytes", "templateId", "templateWarnings"],
