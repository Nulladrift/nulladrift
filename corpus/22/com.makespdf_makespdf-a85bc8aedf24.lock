        {
          "name": "validate_dsl",
          "title": "Validate template DSL",
          "description": "Validate a PDF template DSL script for structure, tag/style correctness, and accessibility issues. Runs catalog validation plus alt-text checks. Cheap — no rendering. Returns JSON { valid, issues: [{ severity, message, path, rule }], summary: { errors, warnings } }; `valid` is false when any issue has severity 'error', and a script that fails to execute comes back as a single 'dsl-execution' error rather than a tool error. Mirrors POST /api/v1/preview/validate.",
          "inputSchema": {
            "properties": {
              "data": {
                "description": "Optional binding data. Falls back to the script's sampleData when omitted.",
                "type": "object"
              },
              "dsl": {
                "description": "The builder DSL script to validate. Must assign `const template = doc(...)`.",
                "type": "string"
              }
            },
            "required": ["dsl"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "issues": {
                "description": "Every problem found, errors and warnings together.",
                "items": {
                  "properties": {
                    "message": {
                      "description": "What is wrong and, usually, how to fix it.",
                      "type": "string"
                    },
                    "path": {
                      "description": "Location in the document tree (e.g. 'kids[0].kids[2]'); empty when it applies to the whole document.",
                      "type": "string"
                    },
                    "rule": {
                      "description": "Identifier of the check that raised the issue.",
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning"],
                      "type": "string"
                    }
                  },
                  "required": ["message", "path", "rule", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "properties": {
                  "errors": {
                    "description": "Number of issues with severity 'error'.",
                    "type": "integer"
                  },
                  "warnings": {
                    "description": "Number of issues with severity 'warning'.",
                    "type": "integer"
                  }
                },
                "required": ["errors", "warnings"],
                "type": "object"
              },
              "valid": {
                "description": "False when any issue has severity 'error'; warnings alone leave it true.",
                "type": "boolean"
              }
            },
            "required": ["issues", "summary", "valid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate template DSL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c72194f408fc120ed86ade8ded49f07d0843721913239da78c080854db08a24c"
        },
