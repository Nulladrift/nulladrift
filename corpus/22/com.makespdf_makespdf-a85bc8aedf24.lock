        {
          "name": "update_template",
          "title": "Update template",
          "description": "Update a saved template's DSL, name, description, and/or sampleData. Revalidates the DSL when provided. A DSL that differs from the stored one is recorded in the template's revision history (History tab on /templates/:id); sending the same DSL again records nothing, and name, description and sampleData are overwritten without history. For `description` and `sampleData`: pass `null` to clear; omit to leave unchanged. Returns { templateId, name, updatedAt }. Mirrors PUT /api/v1/templates/:id.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "New one-sentence summary. Pass `null` to clear the stored value; omit the key entirely to leave it unchanged.",
                "maxLength": 280,
                "type": ["string", "null"]
              },
              "dsl": {
                "description": "Replacement builder DSL script; it is validated before saving. Omit to keep the current DSL. Up to 512KB.",
                "type": "string"
              },
              "name": {
                "description": "New display name. Omit to keep the current name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "sampleData": {
                "description": "Replacement sample binding data, stored alongside the template and returned by get_template (the web editor loads it into its Render data panel). It does not change what render_template uses without `data`: that is the DSL's own `const sampleData`. `null` clears the stored value; omit to leave it unchanged.",
                "type": ["object", "array", "string", "number", "boolean", "null"]
              },
              "templateId": {
                "description": "Template ID — slug for library rows (e.g. 'invoice-classic') or UUID for user rows.",
                "type": "string"
              }
            },
            "required": ["templateId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "name": {
                "description": "The display name after the update.",
                "type": "string"
              },
              "templateId": {
                "description": "Template ID: a slug for library templates, a UUID for your own.",
                "type": "string"
              },
              "updatedAt": {
                "description": "When the template was changed, as a UTC 'YYYY-MM-DD HH:MM:SS' timestamp.",
                "type": "string"
              }
            },
            "required": ["name", "templateId", "updatedAt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update template"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
