        {
          "name": "report_feedback",
          "title": "Send feedback to makesPDF",
          "description": "Send feedback about this MCP server to the makesPDF team: a tool failure you could not explain, an error message or tool description that was wrong or misleading, a capability that is missing, or a concrete suggestion. The summary is the problem in your own words (what you were trying to do, what you tried, what you expected); it must not contain the user's document text, markdown, DSL source or data values, and a specific render is identified by its artifactId instead. Read by the makesPDF team; nobody replies in real time. Free: no credits are used and the user's renders are unaffected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifactId": {
                "description": "Optional UUID of the render artifact this concerns (the `artifactId` returned by a render call or the `X-Artifact-Id` response header).",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "kind": {
                "description": "`stuck` — a tool failed and you could not work out why; `bug` — something behaved incorrectly (a misleading error/description counts); `suggestion` — a missing capability or a concrete improvement.",
                "enum": ["stuck", "bug", "suggestion"],
                "type": "string"
              },
              "summary": {
                "description": "The problem in your own words: what you were doing, what you tried, and what you expected. Describe it rather than pasting the user's document text, markdown, DSL or data.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "toolName": {
                "description": "Optional name of the tool this concerns (e.g. `render_template`).",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["kind", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "feedbackId": {
                "description": "UUID of the stored feedback row.",
                "type": "string"
              },
              "recorded": {
                "const": true,
                "description": "Always true; a failed submission is a tool error.",
                "type": "boolean"
              }
            },
            "required": ["feedbackId", "recorded"],
            "type": "object"
