        {
          "name": "save_template",
          "title": "Save template",
          "description": "Save a user-owned DSL template so it can be rendered later by ID. Validates the DSL with the catalog before persisting. Free (no credits). Optional `sampleData` (any JSON value) is stored with the template and returned whenever the template is fetched, preserving the template's binding shape. Optional `description` is a one-sentence summary surfaced on /templates. Returns { templateId, name, createdAt }.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "One-sentence summary of what the template is for. Shown on /templates list rows and matched by list_templates `q`.",
                "maxLength": 280,
                "type": "string"
              },
              "dsl": {
                "description": "The builder DSL script to store. It is validated before saving. Up to 512KB.",
                "type": "string"
              },
              "name": {
                "description": "Display name shown in list_templates results and on the /templates page.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "sampleData": {
                "description": "Optional JSON binding data to persist alongside the template. Returned by get_template.",
                "type": ["object", "array", "string", "number", "boolean", "null"]
              }
            },
            "required": ["dsl", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "createdAt": {
                "description": "When the template was created, as a UTC 'YYYY-MM-DD HH:MM:SS' timestamp.",
                "type": "string"
              },
              "name": {
                "description": "The display name as saved.",
                "type": "string"
              },
              "templateId": {
                "description": "UUID of the new template.",
                "type": "string"
              }
