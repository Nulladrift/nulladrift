{
  "lockfileVersion": 2,
  "subjects": {
    "com.klarhimmel.ui/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ui.klarhimmel.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "klarhimmel-ui",
        "title": "Klarhimmel UI",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Klarhimmel UI: React 19 + Tailwind 4 page blocks, components, app screens and templates, installed as source with the shadcn CLI. This server is read-only and free: no key, no account. Call setup once for the project steps, search_items to find, get_item for the exact install command.",
      "tools": [
        {
          "name": "get_item",
          "title": "Get one Klarhimmel UI item",
          "description": "Read-only and free. One item by its exact name (from search_items): title, description, the install command, its page URL and Markdown twin URL, and its dependencies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The item name, e.g. \"pricing-tiers\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:729b4502e8c0069f24abd8044d0d4d6b4b071fee594a1434d9b7c665834d4d38"
        },
        {
          "name": "search_items",
          "title": "Search Klarhimmel UI",
          "description": "Read-only and free. Search the Klarhimmel UI catalogue (blocks, components, app screens, templates) by words in name, title or description. Returns up to 20 matches with name, kind, title and description; pass a name to get_item for the install command.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Only this kind of item.",
                "enum": ["block", "component", "app", "template"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for, e.g. \"pricing\" or \"hero with image\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f81a0dd02dde4ae6266052fe67ccfc94a61d3bb89c257bccfe75037add444921"
        },
        {
          "name": "setup",
          "title": "Set up Klarhimmel UI in a project",
          "description": "Read-only and free. Returns the setup steps (the text of /setup.md) for adding Klarhimmel UI to a React project: Tailwind, alias, components.json, first block, tokens, design skill. Follow them once per project.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9ecd64f1af094eba5dc687b5d826b901be5968dade2daa71b437dd301d49874"
        }
      ],
      "digest": "sha256:38c4b836e20c4620dfd10109057fab031ad68df9a145e632f1b5849605a1503d"
    }
  }
}
