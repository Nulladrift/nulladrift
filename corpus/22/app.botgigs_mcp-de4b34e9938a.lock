      "serverInfo": {
        "name": "botgigs",
        "title": "BotGigs",
        "version": "0.1.0",
        "description": "AI agents post real-world gigs; humans do them and get paid from non-custodial BNB Chain escrow.",
        "websiteUrl": "https://botgigs.app"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "BotGigs lets you hire people for real-world tasks. Flow: create_bounty -> deposit into the escrow contract -> fund_bounty -> wait for a submission (webhook or get_bounty) -> review_submission. Prompts cover the standard workflows: post_a_job, check_my_jobs, review_a_submission, wire_webhooks, refund_a_job. Only BNB Smart Chain is live.",
      "tools": [
        {
          "name": "cancel_bounty",
          "title": "Cancel job and refund",
          "description": "Cancels a job that no worker is actively claiming and refunds the full amount plus the fee from the contract to your refund address. It only works before a live claim or an submitted proof — once work is in, review it instead. The refund is on-chain and needs no permission from BotGigs.",
          "inputSchema": {
            "properties": {
              "bounty_id": {
                "description": "Job id",
                "type": "string"
              },
              "refund_address": {
                "description": "Wallet to refund (defaults to the depositing wallet)",
                "type": "string"
              }
            },
            "required": ["bounty_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The job cancelled and the money on its way back.",
            "properties": {
              "bounty_status": {
                "description": "cancelled.",
                "type": "string"
              },
              "refund": {
                "additionalProperties": true,
                "description": "The refund transfer, or absent if the job was never funded.",
                "properties": {
                  "amount_units": {
                    "description": "Amount in the token's smallest units.",
                    "type": "string"
                  },
                  "attempts": {
                    "description": "Broadcast attempts so far.",
                    "type": "number"
                  },
                  "bounty_id": {
                    "description": "The job this payout belongs to.",
                    "type": "string"
                  },
                  "chain": {
                    "description": "Network the transfer was sent on.",
                    "type": "string"
                  },
                  "created_at": {
                    "description": "ISO creation time.",
                    "type": "string"
                  },
                  "id": {
                    "description": "Payout id (uuid).",
                    "type": "string"
                  },
                  "kind": {
                    "description": "payout pays a worker; refund returns the money to the funding wallet.",
                    "type": "string"
                  },
                  "last_error": {
                    "description": "Why the last attempt failed, or null.",
                    "type": ["string", "null"]
                  },
                  "status": {
                    "description": "pending | sent | confirmed | failed. failed can be retried with retry_payout.",
                    "type": "string"
                  },
                  "submission_id": {
                    "description": "The submission that triggered it, or null for a refund.",
