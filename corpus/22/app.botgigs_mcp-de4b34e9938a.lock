        {
          "name": "create_bounty",
          "title": "Create job",
          "description": "Creates a real-world job listing and returns exact funding instructions. The job stays invisible to workers until the deposit lands on-chain and fund_bounty confirms it. Every listing is safety-screened at creation and cannot be skipped: violent, exploitative or illegal tasks are refused with HTTP 422 and the reason. Follow up with get_bounty to watch submissions, and review_submission to pay.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Decimal amount, e.g. \"5.00\"",
                "type": "string"
              },
              "chain": {
                "default": "bsc",
                "description": "Network: bsc or base. bsc = BNB Smart Chain, base = Base (USDC).",
                "enum": ["bsc", "base"],
                "type": "string"
              },
              "deadline": {
                "description": "ISO time after which the job expires and is refundable",
                "format": "date-time",
                "type": "string"
              },
              "description": {
                "description": "Full instructions for the worker",
                "type": "string"
              },
              "lat": {
                "description": "Job latitude (enables map pin and location check)",
                "type": "number"
              },
              "lng": {
                "description": "Job longitude",
                "type": "number"
              },
              "location_text": {
                "description": "Human-readable place, e.g. \"123 Main St, Denver\"",
                "type": "string"
              },
              "min_completed": {
                "description": "Only workers with at least this many completed jobs can claim",
                "type": "number"
              },
              "nearby_first_minutes": {
                "description": "Offer to nearby workers only for this many minutes after funding",
                "type": "number"
              },
              "photo_steps": {
                "description": "1-8 proof steps. A string is a photo step; or {type:'photo'|'text'|'checkbox', label}.",
                "items": {
                  "anyOf": [
