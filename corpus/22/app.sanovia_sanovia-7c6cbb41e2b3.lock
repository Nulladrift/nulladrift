                "type": "boolean"
              },
              "slot_held": {
                "type": "boolean"
              },
              "status": {
                "type": "string"
              },
              "time": {
                "type": "string"
              },
              "visit_type": {
                "type": "string"
              }
            },
            "required": ["date", "expires_in_min", "location", "price_eur", "requires_approval", "requires_online_payment", "slot_held", "status", "time", "visit_type"],
            "type": "object"
          },
