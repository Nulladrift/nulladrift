      "serverInfo": {
        "name": "sanovia",
        "title": "Sanovia",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sanovia è un gestionale per studi e professionisti della salute in Italia. Questi strumenti leggono solo dati che i professionisti hanno scelto di rendere pubblici: chi sono, dove ricevono, cosa offrono, quanto costa e quando sono liberi. Con request_booking puoi inviare una richiesta di prenotazione per un orario libero: il paziente riceve un'email e conferma lui stesso dalla pagina Sanovia; senza la sua conferma non viene prenotato nulla. In alternativa dai al paziente il booking_url. Chiedi solo nome, cognome ed email; non chiedere né inviare mai dati sanitari del paziente. / Sanovia is practice-management software for practices and health professionals in Italy. These tools only read data practitioners chose to publish. With request_booking you can send a booking request for a free time: the patient receives an email and confirms on the Sanovia page themselves; nothing is booked without that confirmation. Otherwise give the patient the booking_url. Ask only for first name, last name and email; never ask for or send the patient's health data.",
      "tools": [
        {
          "name": "get_availability",
          "title": "Orari liberi / Free time slots",
          "description": "Orari di inizio liberi per la prenotazione online di un professionista, giorno per giorno (massimo 14 giorni). Mostra solo gli orari liberi, mai chi ha prenotato. Indica visit_type per avere solo gli orari in cui quella visita ci sta. Non prenota: per l'orario scelto dai al paziente il link di booking_urls di quel giorno (pagina di prenotazione con sede, giorno, orario e tipo di visita già scelti; il paziente inserisce i suoi dati e conferma), altrimenti booking_url. / Free start times for online booking, day by day (max 14 days). Shows free times only, never who booked. Pass visit_type to get only the times that visit fits. Does not book: for the chosen time give the patient that day's booking_urls link (the booking page with location, day, time and visit type preselected; the patient enters their details and confirms), otherwise booking_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Codice pubblico del medico restituito da search_doctors (campo `code`). / The doctor's public code from search_doctors (`code`).",
                "type": "string"
              },
              "days": {
                "description": "Numero di giorni (default 7, max 14). / Number of days.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "Primo giorno AAAA-MM-GG (default oggi, fuso Europe/Rome). / First day YYYY-MM-DD (default today, Europe/Rome).",
                "format": "date",
                "type": "string"
              },
              "location_ref": {
                "description": "Opzionale: numero della sede (location_ref) da get_doctor_profile. Senza, la sede principale. / Optional location number (location_ref) from get_doctor_profile; defaults to the primary location.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "visit_type": {
                "description": "Opzionale ma consigliato: il nome esatto di un tipo di visita da get_visit_types (stessa sede). Con il nome, solo gli orari in cui quella visita (con la sua durata) è prenotabile. / Optional but recommended: the exact visit type name from get_visit_types (same location); only start times where a visit of that length fits are returned.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booking_url": {
                "type": "string"
              },
              "days": {
                "type": "number"
              },
              "free_slots": {
                "items": {
                  "properties": {
                    "booking_urls": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "date": {
                      "type": "string"
                    },
                    "slots": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["booking_urls", "date", "slots"],
                  "type": "object"
                },
                "type": "array"
              },
              "from": {
                "type": "string"
              },
              "location": {
                "properties": {
                  "city": {
                    "type": ["string", "null"]
                  },
                  "location_ref": {
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["city", "location_ref", "name"],
                "type": "object"
              },
              "other_locations": {
                "items": {
                  "properties": {
                    "city": {
                      "type": ["string", "null"]
                    },
                    "location_ref": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["city", "location_ref", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "visit_type": {
                "properties": {
                  "duration_min": {
                    "type": ["number", "null"]
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["duration_min", "name"],
                "type": "object"
              }
            },
            "required": ["booking_url", "days", "free_slots", "from", "location", "other_locations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d375a9d9a39f4478a080bd186308812fb350f0be128482993f1e69543dd77c1"
        },
        {
