        {
          "name": "request_booking",
          "title": "Richiesta di prenotazione / Booking request",
          "description": "Invia una richiesta di prenotazione per un orario libero. Non prenota subito: Sanovia manda al paziente un'email con un link valido 30 minuti; la visita esiste solo quando il paziente la conferma dalla pagina Sanovia (accetta Termini e Privacy e, se previsto, paga online). L'orario non è bloccato fino alla conferma. Chiedi al paziente SOLO nome, cognome ed email: non inviare mai dati sanitari, sintomi, telefono o codice fiscale. Usa un time di free_slots da get_availability per la stessa sede e lo stesso visit_type. / Sends a booking request for a free time. It does not book: Sanovia emails the patient a link valid for 30 minutes; the visit exists only once the patient confirms on the Sanovia page (accepting Terms and Privacy and, when required, paying online). The time is not held until then. Ask the patient ONLY for first name, last name and email: never send health data, symptoms, phone number or tax code. Use a time from get_availability's free_slots for the same location and visit_type.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Codice pubblico del medico restituito da search_doctors (campo `code`). / The doctor's public code from search_doctors (`code`).",
                "type": "string"
              },
              "date": {
                "description": "Giorno AAAA-MM-GG (fuso Europe/Rome), come in free_slots. / Day YYYY-MM-DD (Europe/Rome), as in free_slots.",
                "format": "date",
                "type": "string"
              },
              "email": {
                "description": "Email del paziente: riceverà il link di conferma. / Patient's email: the confirmation link goes there.",
                "format": "email",
                "type": "string"
              },
              "first_name": {
                "description": "Nome del paziente (solo lettere). / Patient's first name (letters only).",
                "maxLength": 60,
                "type": "string"
              },
              "language": {
                "description": "Lingua dell'email (default it). / Email language (default it).",
                "enum": ["it", "en"],
                "type": "string"
              },
              "last_name": {
                "description": "Cognome del paziente (solo lettere). / Patient's last name (letters only).",
                "maxLength": 60,
                "type": "string"
              },
              "location_ref": {
                "description": "Opzionale: numero della sede (location_ref) da get_doctor_profile. Senza, la sede principale. / Optional location number (location_ref) from get_doctor_profile; defaults to the primary location.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Orario di inizio HH:MM, uno di free_slots per quel giorno. / Start time HH:MM, one of that day's free_slots.",
                "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                "type": "string"
              },
              "visit_type": {
                "description": "Il nome esatto di un tipo di visita da get_visit_types (stessa sede). Obbligatorio se il medico ne pubblica. / The exact visit type name from get_visit_types (same location). Required when the doctor publishes any.",
                "type": "string"
              }
            },
            "required": ["code", "date", "email", "first_name", "last_name", "time"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "date": {
                "type": "string"
              },
              "expires_in_min": {
                "type": "number"
              },
              "location": {
                "properties": {
                  "city": {
                    "type": ["string", "null"]
                  },
                  "location_ref": {
                    "type": "number"
                  },
                  "name": {
