        {
          "name": "search_doctors",
          "title": "Cerca professionisti / Search practitioners",
          "description": "Cerca medici e professionisti sanitari italiani iscritti a Sanovia per specialità e/o città. Elenca solo chi ha la pagina di prenotazione online e un sito pubblicato: il proprio, oppure quello della struttura (poliambulatorio, centro) in cui riceve — in quel caso site_url è il sito della struttura. Non prenota: restituisce il link di prenotazione. / Search Italian doctors and health practitioners on Sanovia by specialty and/or city. Lists only practitioners with an online booking page and a published website: their own, or that of the structure (clinic) they practise in — then site_url is the structure's site. Does not book; returns the booking link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Città della sede, es. «Bologna». / City of the practice.",
                "type": "string"
              },
              "limit": {
                "description": "Massimo risultati (default 10, max 20). / Max results.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "specialty": {
                "description": "Specialità o professione, in italiano: la disciplina («Cardiologia», «Odontoiatria», «Medicina Generale», «Fisioterapia», «Osteopatia») oppure il professionista («cardiologo», «dentista», «medico di base», «fisioterapista», «osteopata»). / Specialty or profession, in Italian: the discipline (e.g. «Cardiologia») or the practitioner noun (e.g. «cardiologo»).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "doctors": {
                "items": {
                  "properties": {
                    "booking_url": {
                      "type": ["string", "null"]
                    },
                    "cities": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "code": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "online_booking": {
                      "type": "boolean"
                    },
                    "practice_name": {
                      "type": ["string", "null"]
                    },
                    "profession_types": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "site_url": {
                      "type": ["string", "null"]
                    },
                    "specialty": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["booking_url", "cities", "code", "name", "online_booking", "practice_name", "profession_types", "site_url", "specialty"],
                  "type": "object"
                },
                "type": "array"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["doctors", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
