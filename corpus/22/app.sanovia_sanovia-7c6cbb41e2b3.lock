                    }
                  },
                  "required": ["description", "duration_min", "name", "price_eur", "remote"],
                  "type": "object"
                },
                "type": "array"
              },
              "site_url": {
                "type": ["string", "null"]
              },
              "specialty": {
                "type": ["string", "null"]
              }
