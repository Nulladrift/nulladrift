      "instructions": "Pick My Secret Santa (pickmysecretsanta.com) works like this, stated upfront: you configure the group here in chat - the names, any keep-apart pairs, and the budget - and plan_secret_santa_setup returns ONE pre-filled link; the organizer opens it with everything already in the form, and the zero-knowledge draw itself runs on pickmysecretsanta.com, in their browser. No server ever sees the matches; each match lives inside one person's private link - hidden from plain sight, not locked - so be honest that the seal is the organizer not peeking, never a lock. Names are accepted ONLY by plan_secret_santa_setup, ONLY to build that setup link; the server uses them once and stores nothing (it counts tool calls by day, as plain numbers). Never accept matches, draw results, or private draw links, and no tool here can run, see, decode, or re-issue a draw or a private link - if someone asks you to run the draw or reveal a match, decline and offer the setup link instead. It has three read-only tools. Call pick_secret_santa_gift when someone needs a Secret Santa gift idea: it filters Santa's 212 hand-checked ideas — the Secret Santa subset of the shared 255-idea bank it shares with The Present Picker by strict parameters - budget_band (required), recipient_type (kid or adult), one interest hint, and an avoid list of words it excludes - and returns up to three picks, each with why it fits and what to look for and avoid. No brands, no stores, no exact prices - budget bands are guides. Call explain_secret_santa_rules for how the game works, fairness and secrecy, what the organizer can and cannot see, keeping pairs apart, adding a late joiner, budgets, or white elephant vs Secret Santa - the answers are the site's own published text. Call plan_secret_santa_setup to set up a group of 3 to 30: with the names (and optionally a group name, a budget band, and keep-apart pairs as two-name lists) it configures the setup in chat and returns the pre-filled draw link plus the site's honest warnings; with only a headcount it returns the setup checklist the site prescribes. The draw on the site is free, needs no sign-up, and takes about 2 minutes.",
      "tools": [
        {
          "name": "explain_secret_santa_rules",
          "title": "Explain Secret Santa rules",
          "description": "The rules and fairness answers pickmysecretsanta.com itself publishes, worded the site's way. Topics: basics (the classic rules), fairness_and_secrecy (how the sealed draw works and its honest limits), organizer_view (the organizer sees names and links, never matches), keep_apart_pairs, late_joiner (the two honest ways to add someone after the draw), budget (the four bands), white_elephant (how it differs).",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Which rule to explain.",
                "enum": ["basics", "fairness_and_secrecy", "organizer_view", "keep_apart_pairs", "late_joiner", "budget", "white_elephant"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain Secret Santa rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df75932ef265195e7e99e474cae7e47a626df37b4498e98b42c7b9fb56bcc947"
        },
        {
          "name": "pick_secret_santa_gift",
          "title": "Pick a Secret Santa gift",
          "description": "Filters Santa's vetted 212 hand-checked gift ideas - the Secret Santa subset of the shared 255-idea bank it shares with its sister site The Present Picker, sorted here for Secret Santa by the budget band your group agreed for its draw - with strict parameters, and returns up to three picks. Parameters: budget_band (required: under_25, 25_to_50, 50_to_100, over_100); recipient_type (anyone, kid - only ideas from the bank's Kid shelf, or adult - everything except the Kid shelf); one interest hint (books, cooking, cozy, fitness, games, gardening, music, outdoors, science, tech, travel, or surprise) which ranks matches first; and avoid, a list of words - any idea whose name, blurb, or why mentions an avoid word is excluded, and the answer says how many ideas the filters set aside. Each pick names the kind of gift, why it fits, and what to look for and avoid. No brands, no stores, no exact prices: budget bands are guides, not exact prices. This tool never asks who the gift is for by name and knows nothing about any draw.",
          "inputSchema": {
            "properties": {
              "avoid": {
                "description": "Words to exclude: any idea whose name, blurb, or why mentions one of these words is filtered out (for example \"coffee\" or \"scented\").",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "budget": {
                "description": "Legacy alias for budget_band.",
                "enum": ["under_25", "25_to_50", "50_to_100", "over_100"],
                "type": "string"
              },
              "budget_band": {
                "description": "The group's budget band.",
                "enum": ["under_25", "25_to_50", "50_to_100", "over_100"],
                "type": "string"
              },
              "interest": {
                "description": "One interest hint for the person, or surprise for any.",
                "enum": ["books", "cooking", "cozy", "fitness", "games", "gardening", "music", "outdoors", "science", "tech", "travel", "surprise"],
                "type": "string"
              },
              "recipient_type": {
                "description": "Who the gift is for: kid returns only the bank's Kid-shelf ideas; adult excludes them; anyone (default) applies no recipient filter.",
                "enum": ["anyone", "kid", "adult"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pick a Secret Santa gift"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:efb03c2b5316d98251d63fc1bd896292ad023563740ebd77824407245c283218"
        },
        {
          "name": "plan_secret_santa_setup",
          "title": "Plan a Secret Santa setup",
          "description": "Configures a Secret Santa group of 3 to 30 right here in chat and hands the organizer one pre-filled link to pickmysecretsanta.com, where the zero-knowledge draw runs in their browser - no server sees the matches, and each match will live inside one private link - hidden from plain sight, not locked. Give it the group's names and, optionally, a group name, a budget band, and keep_apart pairs (two-name lists, like [[\"Ana\", \"Ben\"]], for people who must not draw each other): it validates the setup (3 to 30 people, no shared names - the site's draw cannot tell two same-named people apart) and checks that a valid draw exists under the keep-apart pairs before it returns the link with the group, names, budget, and pairs already in the form, plus the site's honest warnings; if the pairs leave no fair draw, it names the conflict plainly and returns no link. The link carries setup only - nobody has been assigned anyone. Names are used once to build the link and are never stored. With only a headcount (group_size) and no names, it instead returns the setup checklist the site prescribes: what to agree out loud first (buy-by date, what counts as a gift, the late-joiner rule, the reveal), the budget step, and how the browser draw works.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Legacy alias for budget_band.",
                "enum": ["under_25", "25_to_50", "50_to_100", "over_100"],
                "type": "string"
              },
              "budget_band": {
                "description": "The group's budget band, if already picked.",
                "enum": ["under_25", "25_to_50", "50_to_100", "over_100"],
                "type": "string"
              },
              "group_name": {
                "description": "Optional group name, up to 40 characters (for example \"The Office Crew\").",
                "type": "string"
              },
              "group_size": {
                "description": "How many people, 3 to 30 - for the checklist when no names are given.",
                "maximum": 30,
                "minimum": 3,
                "type": "integer"
              },
              "has_keep_apart_pairs": {
                "description": "Checklist mode only: true if some pairs must not draw each other.",
                "type": "boolean"
              },
              "keep_apart": {
                "description": "Pairs who must not draw each other, as two-name lists using names from the names list, e.g. [[\"Ana\", \"Ben\"]].",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "type": "array"
              },
              "names": {
                "description": "Every player's name, one per person (3 to 30). Names must be distinct - add a last initial where two people share a name. When names are given, the tool returns the pre-filled setup link.",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 3,
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
