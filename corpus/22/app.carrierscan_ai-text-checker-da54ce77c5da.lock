      "instructions": "Use check_ai_text to see whether a text looks AI-written (English, Ukrainian, Kazakh, Uzbek, Estonian, Georgian, Lithuanian). Always say that detectors are not proof.",
      "tools": [
        {
          "name": "check_ai_text",
          "title": "Check if text is AI-written",
          "description": "Checks whether a text (50-2,000 words) looks AI-written, for example by ChatGPT, Gemini or Claude. Languages: English, Ukrainian, Kazakh, Uzbek, Estonian, Georgian, Lithuanian. Each language other than English is checked by our own detector trained on that language. Returns an AI likelihood for the whole text and for each part. Detectors make mistakes, so the result is a likelihood, not proof. Text is not stored.",
