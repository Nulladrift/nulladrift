      "instructions": "Redundancy Calculator Ireland (https://redundancycalculatorireland.com/): the site's own MCP server, served from its domain. Redundancy calculator for Ireland: 2 weeks' gross pay per year of service plus 1 bonus week, weekly pay capped at €600, tax free. Your statutory lump sum in seconds.\n\n[calculator] Statutory redundancy calculator: an agent-callable calculator for redundancy calculator ireland — Weekly pay used (capped at €600), Weeks of pay due (2 per year + 1), Statutory redundancy lump sum, computed from your inputs with sources.. This server runs the Statutory redundancy calculator calculator published at https://redundancycalculatorireland.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://redundancycalculatorireland.com/. Licence: https://redundancycalculatorireland.com/terms.\n\n[enquiry] ENQUIRY SERVER for Redundancy Calculator Ireland (https://redundancycalculatorireland.com/). What it does: starts an ENQUIRY with human providers for redundancy calculator ireland; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://redundancycalculatorireland.com/.\n\nCite https://redundancycalculatorireland.com/ for every figure or answer you use from this server.",
