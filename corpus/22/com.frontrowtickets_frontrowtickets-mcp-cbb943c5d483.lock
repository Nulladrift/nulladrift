{
  "lockfileVersion": 2,
  "subjects": {
    "com.frontrowtickets/frontrowtickets-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.frontrowtickets.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "frontrowtickets",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "FrontRowTickets.com ticket inventory (via TicketNetwork). Read-only: search events, check availability and pricing. All data is cached; every response includes as_of. To buy, send the user to the event url — checkout happens on the website.",
      "tools": [
        {
          "name": "get_availability",
          "description": "Answers 'can I get tickets for this event?' for one event: refreshed from the live source at call time, returning current availability and starting price. max_price is a hard gate — the event is reported only if its starting price is at or below it (otherwise availability:null with a note); quantity is informational context only, not a reservation. Use get_event when you need the event's full record, get_deals to browse by budget instead. Note: the catalog API does not expose section-level price bands, so only totals and the starting price are returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "event_id": {
                "description": "Event ID from search_events",
                "type": "string"
              },
              "max_price": {
                "description": "Hard gate in USD: the event is reported only if its starting price is at or below this",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "quantity": {
                "description": "Desired ticket quantity (informational context only; does not reserve)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check ticket availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dc12853dcd47348de3619bd4cf1077f93e4a9f2a80af0ed55ca5cde3921ce3f4"
        },
        {
          "name": "get_deals",
          "description": "Use when budget is the primary filter: returns the cheapest available events under a required max_price cap (applied to each event's starting price), cheapest first, up to 25 results; events without pricing data are excluded. City and date range are optional additional filters. Use search_events for text- or category-driven discovery instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. Chicago",
                "type": "string"
              },
              "date_from": {
                "description": "Earliest event date (ISO)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "date_to": {
                "description": "Latest event date (ISO)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "max_price": {
                "description": "Required. Maximum starting price in USD — events above this are excluded",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["max_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find ticket deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:877cd8b3ee84ea263c119c93866269efcf15590130511df5092d139575603027"
        },
        {
          "name": "get_event",
          "description": "Full details for one event: venue, date, ticket count, price range, and sections. The record is live-refreshed from the catalog when called (cached copy otherwise), so this is the fullest picture of the event. Prefer get_availability when the only question is 'can I get N tickets at or under $X' — it answers that directly without the full record.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "event_id": {
                "description": "Event ID from search_events",
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get event details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d29834992121339ef848c260d407cecb432b5c05153e6d746135f8e36f500ecd"
        },
        {
          "name": "get_seat_options",
          "description": "Return actual seat listings for one event — section, row, quantity, seat range, base and all-in price per ticket, listing notes, and fee detail — cheapest all-in first. Use after search_events when the user wants seat options to choose from, not just a starting price. max_price caps the ALL-IN price per ticket (fees included); min_quantity keeps only listings with at least that many tickets together. quantity is a filter only, not a reservation or hold. IMPORTANT: always relay each option's notes to the buyer before recommending it — notes carry critical facts (obstructed or limited view, behind-stage seats, parking-only passes that do not include admission, mobile-entry requirements, and delivery dates). Notes pass through verbatim and must never be summarized away. Purchase still happens through the event page link (url) — this tool does not transact.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 5,
                "description": "Max seat options returned (default 5, max 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "event_id": {
                "description": "Event ID from search_events",
                "type": "string"
              },
              "max_price": {
                "description": "Hard cap in USD on the ALL-IN price per ticket (fees included)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_quantity": {
                "default": 1,
                "description": "Minimum tickets together in one listing (default 1)",
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Sort order: \"cheapest\" (default, lowest all-in first). \"best_value\" is not available yet.",
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get seat options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d92c4c04e3ec9b7f3a88850912138dfc4e52ad3d9eee5da8d1d15789dd006bed"
        },
        {
          "name": "search_events",
          "description": "Start here for discovery: search FrontRowTickets.com ticket inventory by free text, city, date range, and category (sports, concerts, theater, comedy). All filters are optional and combine freely; returns up to 'limit' events (default 10, max 50, no further pages), soonest first, with ticket counts and starting prices. Use get_event for one event's full record, get_deals when the user has a hard budget cap.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One of sports, concerts, theater, comedy",
                "enum": ["sports", "concerts", "theater", "comedy"],
                "type": "string"
              },
              "city": {
                "description": "City name, e.g. Chicago",
                "type": "string"
              },
              "date_from": {
                "description": "Earliest event date (ISO)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "date_to": {
                "description": "Latest event date (ISO)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results returned (default 10, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text: team, artist, show, or venue name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bc0551ac2c895d5cf8046e4ec620764277e7a80334e99daf2ece53205a278ff1"
        }
      ],
      "digest": "sha256:06536aadf2db990dedd345ca7b52a2142c559ba81d6d491a4b43d58abb0fc409"
    }
  }
}
