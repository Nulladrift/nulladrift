          },
          "digest": "sha256:c75309d392ef40cd45f3299c688b36ab031ddf0545a0900823bd2f78d6f967de"
        },
        {
          "name": "get_course_schedule",
          "title": "Get announced course start dates",
          "description": "Get the officially announced upcoming start dates of an Opendart course (live data from the site schedule): start date, weekly plan, session hours, total hours, group size and registration link. If no session is returned, say no date is announced yet and give the request form link; never guess a date. TR ipucu: eğitimin duyurulmuş başlangıç tarihleri; ör. course \"Flutter\", \"Java Spring Boot\". Tarih yoksa tahmin etmeyin.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "course": {
                "description": "Course name or keyword, e.g. \"Flutter\", \"Java\", \".NET Core\", \"DevOps\". / Eğitim adı.",
                "type": "string"
              }
            },
