        {
          "name": "search_articles",
          "title": "Search Opendart articles",
          "description": "Search Opendart's free technical articles and tutorials by keyword (Java, Spring Boot, .NET, Flutter, Android, iOS, React, Angular, Vue, DevOps, SQL, AI); returns up to 12 article titles and URLs. Most articles are in Turkish. TR ipucu: Opendart makalelerinde arama; ör. query \"spring security\", \"flutter bloc\".",
