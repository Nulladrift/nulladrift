        {
          "name": "search_courses",
          "title": "Search Opendart courses",
          "description": "Search Opendart Akademi software training courses (Java Spring Boot, .NET Core, Flutter, Android Kotlin, iOS Swift, React Native, Angular, Vue.js, DevOps, AI-assisted development, corporate training) and topic guides. Returns course title, short description (Turkish), page URL and English page URL. Call with no arguments to list the main courses. Never state prices, dates or capacity that no tool returned. TR ipucu: Opendart eğitimlerini ve konu rehberlerini arar; ör. query \"flutter\", \"kubernetes\", \"mobil\", category \"ai\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
