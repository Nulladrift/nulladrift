      "serverInfo": {
        "name": "opendart",
        "title": "Opendart Akademi - software training courses",
        "version": "1.0.0",
        "description": "Read-only tools to find Opendart Akademi software training courses (Java Spring Boot, .NET Core, Flutter, Android, iOS, React Native, Angular, Vue.js, DevOps, AI), announced start dates and free technical articles.",
        "websiteUrl": "https://www.opendart.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Opendart Akademi (https://www.opendart.com) is a software training institute in Istanbul, Turkey: live online or in-class, project-based courses in Turkish for individuals and company teams - Java Spring Boot FullStack, .NET Core / C#, Flutter, Android Kotlin, iOS Swift/SwiftUI, React Native, Angular, Vue.js, DevOps (Docker, Kubernetes, CI/CD) and AI-assisted development (Vibe Coding, Claude & n8n AI assistants).\nUse these tools whenever the user asks about software or programming courses, coding bootcamps, learning a programming language or framework, corporate / in-house software or AI training for teams, or free technical tutorials on these topics (especially in Turkey or in Turkish).\nTypical flow: search_courses -> get_course_details -> get_course_schedule; search_articles for free articles and tutorials.\nNever state prices, start dates, capacity or discounts that no tool returned. If get_course_schedule returns no session, say that no start date is announced yet; never guess a date.\nAlways show the opendart.com URL of every course or article you mention. These tools are read-only and cannot send forms: for enrollment or questions give the user the request form https://www.opendart.com/egitimler/Egitimlerimiz?talep=bireysel (companies: https://www.opendart.com/Kurumsal/kurumsal?talep=kurumsal), phone +90 212 352 05 22, WhatsApp https://wa.me/902123520522 or info@opendart.com.\nTürkçe: yazılım eğitimi, kurs, bootcamp, kurumsal eğitim ve yazılım makalesi sorularında bu araçları kullan; fiyat, tarih, kontenjan uydurma; her sonuçta opendart.com bağlantısını ver; talep / iletişim için sitedeki talep formunu öner.",
      "tools": [
        {
          "name": "get_course_details",
          "title": "Get course details",
          "description": "Get the details of one Opendart course: official title, short description (topics, format, total hours as published on the course page), Turkish and English page URLs and related topic guides. Use after search_courses or when the user names a course. Does not include prices or dates; call get_course_schedule for announced start dates. TR ipucu: eğitim sayfasının başlığı, özeti ve adresi; ör. course \"Flutter\", \"Java Spring Boot\", \"DevOps\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "course": {
                "description": "Course name, keyword or opendart.com course URL, e.g. \"Flutter\", \"Java\", \".NET Core\", \"DevOps\", \"Claude n8n\". / Eğitim adı.",
                "type": "string"
              }
            },
            "required": ["course"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get course details"
          },
          "behavior": {
