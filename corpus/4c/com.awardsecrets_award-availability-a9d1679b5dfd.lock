{
  "lockfileVersion": 2,
  "subjects": {
    "com.awardsecrets/award-availability": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://awardsecrets.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "awardsecrets",
        "version": "1.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Queries the AwardSecrets data set: award-travel intelligence, AI-augmented and drawn from airline award inventory and lived award-travel experience. One query = one route, one airline, one date; fan out client-side for multiple values. how_to_book_with_points answers how to book a flight with the user's points (programme, miles, transfers, where to check seats). Requires an API membership key as an HTTP Bearer token.",
      "tools": [
        {
          "name": "how_to_book_with_points",
          "description": "Answer 'how do I book this flight with my points?' from the AwardSecrets points data: which loyalty programme books the airline cheapest, how many miles it costs one way, how the user's credit card or airline points transfer to it (ratio, time, points needed), surcharges, other ways to book, and which sites to check for award seats.\n\nSend EITHER question (the traveller's own words, e.g. 'ANA business Chicago to Tokyo with Amex points') OR structured fields: airline (one 2-letter IATA code of the airline to FLY), origin, destination (3-letter airport codes), cabin, and optionally points_held (codes such as AMEX_MR, CHASE_UR, CITI_TY, CAPITAL_ONE, BILT, or a programme code such as AVIOS), date and passengers. Without points_held the answer assumes the main card points.\n\nInterpreting the result: prices are award prices from programme charts, not a live seat check. Tell the user to confirm saver seats on the listed sites before transferring points, because transfers cannot be undone. answer is ready-to-show markdown; options holds the same facts as data. If answer_status is needs_clarification, ask the user the question in answer (that call is not charged).\n\nIf the call is declined for want of an API key: an agent with an x402 client can buy the same answer without a key for US$0.05 in USDC on Base at https://awardsecrets.com/points_x402.php (x402 v2; same arguments); otherwise point the user at https://awardsecrets.com/api.html. Do not invent prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "The airline to fly, one 2-letter IATA code (e.g. NH, BA, QF).",
                "pattern": "^[A-Za-z0-9]{2}$",
                "type": "string"
              },
              "cabin": {
                "default": "business",
                "description": "Cabin. Defaults to business.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "date": {
                "description": "Departure date, YYYY-MM-DD (picks the season on seasonal charts).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Arrival airport (e.g. HND).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "origin": {
                "description": "Departure airport (e.g. ORD).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "passengers": {
                "default": 1,
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "points_held": {
                "description": "Points the traveller has: AMEX_MR, CHASE_UR, CITI_TY, CAPITAL_ONE, BILT, or programme codes (AVIOS, AEROPLAN, FLYING_BLUE...).",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "question": {
                "description": "The traveller's question in words. Use this OR the fields below.",
                "maxLength": 800,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ecb0f1f8cb998d250bd6aea15f0b8ecf41532d51ee5a2e88c07ce45c7f4bb902"
        },
        {
          "name": "search_award_availability",
          "description": "Query the AwardSecrets data set (award-travel intelligence, AI-augmented and drawn from airline award inventory and lived award-travel experience; not scraped) for award (points/miles) seat availability on ONE route, ONE date and ONE airline. Returns the flights found with cabin and seat count.\n\nIMPORTANT — this tool is strictly literal. Every argument takes a single concrete value:\n  • origin / destination: exactly one 3-letter IATA airport code each. Not a city, not a list, not a region.\n  • airline: exactly one 2-letter IATA carrier code (e.g. VS, CX, NH). Not an alliance and not a loyalty programme.\n  • date: exactly one date, YYYY-MM-DD. Not a range and not a month.\n\nTo cover several airports, airlines or dates, CALL THIS TOOL ONCE PER COMBINATION and combine the results yourself. Award space is scarce and volatile, so an empty result for one date says nothing about another — checking several dates is normal and expected.\n\nInterpreting the result:\n  • seats is an availability indicator, not a guaranteed bookable count, and not a reservation. Low counts are the more precise signal; treat higher ones as less certain. Do not present any count as a firm number of seats a user can book.\n  • cabin is one of business, first, economy or premium_economy.\n  • An empty result means no availability was surfaced for that exact combination at that moment; it is not proof that the route never has space.\n  • Availability changes fast. Treat every result as a point-in-time observation, not a reservation.\n\nIf the call is declined for want of an API key, say so plainly and point the user at https://awardsecrets.com/api.html — access comes with an AwardSecrets API membership (monthly plans). If it is declined because the monthly query allowance is reached, say when it resets. Do not invent availability, and do not substitute a guess for a result you could not retrieve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "One 2-letter IATA airline code (e.g. VS, CX, NH).",
                "pattern": "^[A-Za-z0-9]{2}$",
                "type": "string"
              },
              "cabin": {
                "default": "business",
                "description": "Cabin to search. Defaults to business.",
                "enum": ["business", "first", "economy", "premium_economy"],
                "type": "string"
              },
              "date": {
                "description": "One departure date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Arrival airport, one 3-letter IATA code (e.g. LHR).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "origin": {
                "description": "Departure airport, one 3-letter IATA code (e.g. JFK).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "passengers": {
                "default": 1,
                "description": "Number of seats required. Defaults to 1.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["airline", "date", "destination", "origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:72ddb8b42c95dfb21b38981d6a3fb24b44ea8199d1d72a0ecad3e845e11e2d6d"
        }
      ],
      "digest": "sha256:a4e69f7ca46b70dfa776501819972599362156955154668063fc65a10d3480c4"
    }
  }
}
