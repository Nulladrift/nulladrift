      "instructions": "AwardSecrets answers 'how do I book this flight with my points?': how_to_book_with_points gives the best way to book a flight the user has in mind (programme, miles, how their card or hotel points transfer, surcharges, where to check seats). It does not check live seats (availability_checked is always false). Try it without a key: a few answers a day per address are free. For more, send an API key as an HTTP Bearer token (self-serve monthly plans at https://awardsecrets.com/api.html#pricing), or pay US$0.05 an answer over x402 at https://awardsecrets.com/points_x402.php.",
      "tools": [
        {
          "name": "how_to_book_with_points",
          "title": "How to book a flight with points",
          "description": "Answer 'how do I book this flight with my points?' from the AwardSecrets points data: the best way to book the airline (fewest points once taxes and surcharges are counted), how many miles it costs one way, how the user's credit card or airline points transfer to it (ratio, time, points needed), surcharges, other ways to book, and which sites to check for award seats.\n\nSend EITHER question (the traveller's own words, e.g. 'ANA business Chicago to Tokyo with Amex points') OR structured fields: airline (one 2-letter IATA code of the airline to FLY), origin, destination (3-letter airport codes), cabin, and optionally points_held (codes such as AMEX_MR, CHASE_UR, CITI_TY, CAPITAL_ONE, BILT, or a programme code such as AVIOS), date and passengers. Without points_held the answer assumes the main card points.\n\nInterpreting the result: availability_checked is always false. These are award prices from programme charts, not a live seat check: tell the user to confirm saver seats on the listed sites before transferring points, because transfers cannot be undone. Each option's price_state says what kind of number it is (fixed_chart, published_starting_price, off_peak, seasonal); never present a starting or off-peak price as a quote. answer_status cabin_not_priced means we don't price the cabin asked for (premium economy): the options are ECONOMY, an alternative, and you must say so. A transfer of kind linked_account_move (Avios between the traveller's own linked accounts) is conditional: state its condition. listed_not_ranked programmes have no price we stand behind: send the user to their site. answer is ready-to-show markdown; options holds the same facts as data. If answer_status is needs_clarification or off_topic, ask the user the question in answer. Only ok is charged.\n\nNo key needed to try it: without one, 20 answers an hour and 60 a day per IP address are free (1,500 a day for everyone; over a limit: a tool error naming the paid ways). For more, an API key (self-serve monthly plans, https://awardsecrets.com/api.html#pricing) or US$0.05 an answer in USDC on Base over x402 at https://awardsecrets.com/points_x402.php (same arguments). Do not invent prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "The airline to fly, one 2-letter IATA code (e.g. NH, BA, QF).",
                "pattern": "^[A-Za-z0-9]{2}$",
                "type": "string"
              },
              "cabin": {
                "default": "business",
                "description": "Cabin. Defaults to business.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "date": {
                "description": "Departure date, YYYY-MM-DD (picks the season on seasonal charts).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Arrival airport (e.g. HND).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "origin": {
                "description": "Departure airport (e.g. ORD).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "passengers": {
                "default": 1,
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "points_held": {
                "description": "Points the traveller has: AMEX_MR, CHASE_UR, CITI_TY, CAPITAL_ONE, BILT, or programme codes (AVIOS, AEROPLAN, FLYING_BLUE...).",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "question": {
                "description": "The traveller's question in words. Use this OR the fields below.",
                "maxLength": 800,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "charged": {
                "description": "false for free answers and for any answer_status other than ok.",
                "type": "boolean"
              },
              "free": {
                "description": "true when answered without a key (free tier).",
                "type": "boolean"
              },
              "quota_remaining": {
                "type": ["integer", "null"]
              },
              "result": {
                "properties": {
                  "answer": {
                    "description": "Ready-to-show markdown.",
                    "type": "string"
                  },
                  "answer_status": {
                    "description": "ok: priced in the cabin asked for. cabin_not_priced: we don't price that cabin (premium economy); options are ECONOMY, offered as an alternative. needs_clarification / off_topic: answer is a question or a one-line reply. Only ok is charged.",
                    "enum": ["ok", "cabin_not_priced", "needs_clarification", "off_topic"],
                    "type": "string"
                  },
                  "availability_checked": {
                    "const": false,
                    "description": "Always false: award-chart prices, not a live seat check.",
                    "type": "boolean"
                  },
                  "basis": {
                    "type": "string"
