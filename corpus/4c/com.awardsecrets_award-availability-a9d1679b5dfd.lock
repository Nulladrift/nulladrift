{
  "lockfileVersion": 2,
  "subjects": {
    "com.awardsecrets/award-availability": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://awardsecrets.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "awardsecrets",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Queries the AwardSecrets data set: award-travel intelligence, AI-augmented and derived from GDS inventory and lived award-travel experience. One query = one route, one airline, one date; fan out client-side for multiple values. Requires an API membership key as an HTTP Bearer token.",
      "tools": [
        {
          "name": "search_award_availability",
          "description": "Query the AwardSecrets data set (award-travel intelligence, AI-augmented and derived from GDS inventory and lived award-travel experience; not scraped) for award (points/miles) seat availability on ONE route, ONE date and ONE airline. Returns the flights found with cabin and seat count.\n\nIMPORTANT — this tool is strictly literal. Every argument takes a single concrete value:\n  • origin / destination: exactly one 3-letter IATA airport code each. Not a city, not a list, not a region.\n  • airline: exactly one 2-letter IATA carrier code (e.g. VS, CX, NH). Not an alliance and not a loyalty programme.\n  • date: exactly one date, YYYY-MM-DD. Not a range and not a month.\n\nTo cover several airports, airlines or dates, CALL THIS TOOL ONCE PER COMBINATION and combine the results yourself. Award space is scarce and volatile, so an empty result for one date says nothing about another — checking several dates is normal and expected.\n\nInterpreting the result:\n  • seats is an availability indicator, not a guaranteed bookable count, and not a reservation. Low counts are the more precise signal; treat higher ones as less certain. Do not present any count as a firm number of seats a user can book.\n  • cabin is one of business, first, economy or premium_economy.\n  • An empty result means no availability was surfaced for that exact combination at that moment; it is not proof that the route never has space.\n  • Availability changes fast. Treat every result as a point-in-time observation, not a reservation.\n\nIf the call is declined for want of an API key, say so plainly and point the user at https://awardsecrets.com/api.html — access comes with an AwardSecrets API membership (monthly plans). If it is declined because the monthly query allowance is reached, say when it resets. Do not invent availability, and do not substitute a guess for a result you could not retrieve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "One 2-letter IATA airline code (e.g. VS, CX, NH).",
                "pattern": "^[A-Za-z0-9]{2}$",
                "type": "string"
              },
              "cabin": {
                "default": "business",
                "description": "Cabin to search. Defaults to business.",
                "enum": ["business", "first", "economy", "premium_economy"],
                "type": "string"
              },
              "date": {
                "description": "One departure date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Arrival airport, one 3-letter IATA code (e.g. LHR).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "origin": {
                "description": "Departure airport, one 3-letter IATA code (e.g. JFK).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "passengers": {
                "default": 1,
                "description": "Number of seats required. Defaults to 1.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["airline", "date", "destination", "origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69b442389251ef100921b48e229c548643bdb974ce25e31036bbb4862c8110f6"
        }
      ],
      "digest": "sha256:ee1896580de4bba1e137c021a7970fcfc1786b522f5fd41a0fd92916aff4f5d7"
    }
  }
}
