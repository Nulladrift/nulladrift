      "instructions": "This server exposes one Plutus account's cloud, AI and SaaS spend, plus its dashboards, budgets, alerts and cost-allocation setup. Every figure is for one account. Amounts are USD unless a field says otherwise. A row whose cost_basis is not invoiced is an estimate and must be called one. The newest days of cost data can be incomplete, so check coverage.complete_through before calling a recent drop real. A null ratio means missing data, never zero.\n\nThis credential is read only. It cannot create dashboards, budgets or alert subscriptions, so if the user asks for one, say so and describe what you would set up for them to create in the app. A read/write key can be minted on the Access page (MCP keys tab) in the app.\n\nTwo things cannot be done through this server. Connecting a cost source: the user does that on the Cost Sources page in the app, and data can take a while to arrive after connecting. Creating an alert channel (Slack, Teams, email or a webhook): the user does that on the Alerts page in the app, and alert subscriptions can only point at a channel that already exists.\n\nWhen the user is new, asks to get set up, or asks what to look at first, run the onboard-me prompt (or follow its steps): ask what they care about, check what is connected, propose a setup, confirm, then build it.",
      "tools": [
        {
          "name": "explain_cost_change",
          "description": "Explain a specific cost change: which timeline events line up with it, how strongly, and how much of the move Plutus could account for. Ask this about any point on a cost chart — it is not limited to anomalies the detector flagged (use list_anomalies for those; each already carries the same explanation).\n\nRENDER `explanation.sentences` AS WRITTEN. They are generated under a strict discipline and are the only phrasing this data supports: Plutus reports temporal and dimensional evidence, never causation. Each candidate carries a `claim` of \"coincides\" (temporal proximity only — the common case), \"consistent_with\" (proximity plus a confirmed link between that event source and this cost entity) or \"accounts_for\" (a known dollar amount that matches the move). Do not upgrade one to another, do not say an event \"caused\" or \"led to\" the change, and do not merge several candidates into a single narrative.\n\nThree separate numbers, never interchangeable: `change_evidence` is how sure we are a real change-point exists at all; `attribution_completeness` is what fraction of the move was localized to a specific part of the bill (a low value means \"we do not know what this spend is yet\", which is NOT the same as \"nothing explains it\"); `p_cause` is per candidate, and sums with `p_unknown` to 1. `tier: \"unknown\"` means we looked and found nothing that lines up — say that, rather than reaching for the top-ranked candidate anyway. Confidence is capped at 0.60 by design; there is no \"high\" tier today.\n\nBody: `dimension` + `value` name the slice (e.g. service=AmazonEC2), optional `cost_source_id` narrows it, and exactly one of `day` or `range` says when. A range is narrowed to the single biggest-moving day inside it, reported as `explained_day`. Mirrors POST /api/accounts/:accountId/cost-changes/explain.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cost_source_id": {
                "description": "Narrow to one cost source, e.g. \"aws\"",
                "type": "string"
              },
              "day": {
                "description": "YYYY-MM-DD — the day to explain",
                "type": "string"
              },
              "dimension": {
                "description": "Which dimension names the slice",
                "enum": ["service", "region", "linked_account", "usage_type", "resource_id"],
                "type": "string"
              },
              "range": {
                "description": "Half-open YYYY-MM-DD range; narrowed to its biggest-moving day",
                "properties": {
                  "end": {
                    "type": "string"
                  },
                  "start": {
                    "type": "string"
                  }
                },
                "required": ["end", "start"],
                "type": "object"
              },
              "value": {
                "description": "The dimension value that moved, e.g. \"AmazonEC2\"",
                "type": "string"
              }
            },
            "required": ["dimension", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain Cost Change"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2729f8776b2dc81c9f6557df1723de9bb643ee339d9b3fc6b6c457eea5553ff"
        },
        {
          "name": "get_cost_entries",
          "description": "Fetch raw per-service cost entries for this account over a date range (unaggregated). Prefer query_costs for time-bucketed/aggregated spend — this is for inspecting individual rows. Each row's `cost` is in USD (see the response's top-level `currency` field), like every other figure this server returns. A row also carries `native_cost`/`native_currency` — what the provider actually billed, for reconciling against their invoice. Those are the one exception to the USD rule here: never sum or compare `native_cost` across rows, and never quote it without naming the row's `native_currency`. Unlike query_costs, there is no cost_metric parameter here — `cost` is always billed cost, never amortized.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "endDate": {
                "type": "string"
              },
              "startDate": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Cost Entries"
          },
          "behavior": {
