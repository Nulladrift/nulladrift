        {
          "name": "list_savings_recommendations",
          "description": "List active cost-reduction recommendations for this account. Most come from each provider's own already-computed engine (AWS Cost Explorer, Azure Advisor, GCP Recommender); rows with `source` = `plutus` are computed by Plutus itself (rightsizing, and `misconfiguration` below). `type` is one of: `terminate` (an idle resource to shut down), `modify` (an overprovisioned one to downsize), `commitment_savings_plan` or `commitment_reservation` (a commitment worth *buying* — an AWS Savings Plan / Reserved Instance, Azure reservation or savings plan, or GCP committed use discount), or `misconfiguration`. Commitment rows have no `current_instance_type`/`recommended_instance_type` — they are a purchase, not an instance swap; their term, payment option, lookback window and hourly commitment are in `detail`. Only one term/payment/lookback variant per commitment is surfaced (AWS: 30-day lookback, 1-year, no upfront — Cost Explorer's own console default), so do not report these as the only commitment options available. Plutus also computes `misconfiguration` rows (`source` = `plutus`), the findings: a known costly setting found from billing lines (`detail.scope` = `account`) or an idle or orphaned resource found in the inventory (`detail.scope` = `resource`, with `provider_resource_id`). Their `detail` carries `reason`, `fix`, `reference_url`, `confidence`, `spend_usd`, `impact_basis` (`upper_bound` means the saving is a ceiling, at most that figure, not an estimate; say \"up to\". `resource_cost` means what the resource itself costs a month, not a saving from changing it; `price_difference` means an estimated saving from changing a setting, a share of the resource's own monthly cost, for example gp2 to gp3), `impact_unknown` (true means the saving cannot be estimated, so `estimated_monthly_savings_cents` of 0 is NOT a $0 saving), `where` (service, region, usage types) and `verify` (console links and manual steps to confirm and fix it). Triage them like any recommendation: dismiss, mark acted-on, or ticket. Mirrors GET /api/accounts/:accountId/savings-recommendations. Each recommendation carries the provider's own figure in its own `currency`; the total is in USD (stated in the response's `currency` field), since providers may bill in different ones. `total_estimated_monthly_savings_cents` is the firm total only: it leaves out `upper_bound` findings, which are reported separately as `upper_bound_findings` ({ count, max_monthly_cents }): say \"N findings, up to $X/month\", never add that into the total.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "type": {
                "description": "Only these recommendation types, comma-separated (for example \"misconfiguration\" for the findings)",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
