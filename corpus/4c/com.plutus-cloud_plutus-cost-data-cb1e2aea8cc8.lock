        {
          "name": "list_cost_tags",
          "description": "List the virtual cost-allocation tag_keys defined for this account (e.g. \"team\", \"product\"), each with the cost_entries grain it's locked to and how many rules map dimension values to a tag_value. Use a tag_key with query_costs (breakdown_by: \"tag\") to see spend broken down by it. redistribute_bucket, when non-null, names a bucket (often \"Untagged\") whose spend is dissolved into the other tag_values in proportion to their own attributed spend in the same period — so that bucket will not appear in a query_costs breakdown for this tag_key, and the other values include a proportional share of it. It reappears only in periods where there was no other spend to redistribute against. redistribute_basis says what \"proportional\" means: attributed_spend (their own spend) or usage_metric (a usage metric, named by redistribute_usage_metric, whose value per tag_value weights the split; days with no usage fall back to spend).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
