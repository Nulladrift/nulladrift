        {
          "name": "query_unit_costs",
          "description": "Compute one of this account's saved unit-economics metrics (see list_unit_metrics) over a date range — the cost of a slice of spend divided by the business units it produced. Each row carries `cost` (the numerator, in the USD base like every other figure this server returns), `quantity` (the denominator, a raw count with no currency), and `unit_cost`.\n\nCRITICAL: `unit_cost` is null whenever it could not be computed, and null does NOT mean zero. It means one half of the fraction is missing for that period — either no usage was ingested (a telemetry gap) or no cost data has landed yet. Do not describe a null unit cost as a cost of zero, and do not average nulls in as zeroes; the `coverage` block reports how many rows are affected and why. Always read `unit_cost` together with `denominator_label` (e.g. \"per 1k requests\"), which names what it is quoted against — a per-1k figure reported as a per-request figure is wrong by three orders of magnitude.\n\nThe series stops at `coverage.complete_through` rather than at the requested end_date whenever cost data for the newest periods has not arrived yet (it lands hours-to-a-day after the period it covers, while usage telemetry is pushed live). A short series is therefore normal and is NOT evidence that spend or usage stopped — say what it is complete through instead. `coverage.lagging_sources`, when non-empty, is the opposite case: a cost source that is behind or has stopped reporting, so recent periods are missing its spend and their unit costs read lower than the truth.\n\nIf `numerator_status.available` is false, the cost source this metric measured has been removed from the account and `rows` is empty. That is a broken definition, not a period of zero spend — never report it as costs having fallen.\n\nAmounts are billed cost unless cost_metric is \"amortized\", which spreads prepaid commitments across the term they cover (see query_costs). Budgets and the target_unit_cost alert stay billed either way. A tag-scoped metric inherits that tag_key's allocation policy, so its numerator may include a redistributed share of shared spend (see list_cost_tags' redistribute_bucket) and will not match a raw dimension total.\n\nA metric whose denominator_mode is \"per_customer\" returns one row per (period, customer) and a `customers` block splitting them into matched, cost_without_usage (spend attributed to a customer who is not sending telemetry) and usage_without_cost (telemetry from a customer whose spend is not being allocated). Those two lists are the honest caveat on any per-customer figure and are worth mentioning when either is non-empty. When the metric has a `denominator_dimension_key` (e.g. \"feature\") the \"customer\" in those rows is that dimension's value, matched against the tag values of the numerator's tag key.\n\nA metric with `revenue_source_ids` also returns `revenue` (billed revenue in the USD base, from connected revenue streams only) and `gross_margin_pct` on every row. Both are null when the period has no revenue rows; that is missing data, not a margin of zero.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cost_metric": {
                "description": "Which cost figure feeds the numerator (default: \"billed\"). Same meaning as on query_costs.",
                "enum": ["billed", "amortized"],
                "type": "string"
              },
              "end_date": {
                "description": "ISO-8601 end of the date range (exclusive)",
                "type": "string"
              },
              "group_by": {
                "description": "Time bucket size (default: day)",
                "enum": ["day", "week", "month", "quarter"],
                "type": "string"
              },
              "start_date": {
                "description": "ISO-8601 start of the date range (inclusive)",
                "type": "string"
              },
              "unit_metric_id": {
                "description": "id of a metric returned by list_unit_metrics",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["unit_metric_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query Unit Costs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29d7352bec71ba3fdeb7bd3d73c8468e6063250bf936f328f15661f1ef4175f1"
        },
        {
          "name": "query_usage",
          "description": "Query time-bucketed usage telemetry this account's own backend has pushed or synced in (e.g. API request counts, tokens processed) — the raw data unit-economics metrics divide cost by (see list_unit_metrics/query_unit_costs), inspected directly rather than through a pre-defined ratio. `quantity` is a raw count with no currency — never treat it as money. Optionally broken down by `external_customer_id` when the pushed rows carry one. Mirrors GET /api/usage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "breakdown_by": {
                "description": "\"external_customer_id\", or \"dimension:<key>\" to group by a key of the pushed dimensions map (e.g. \"dimension:feature\"; list the keys with list_usage_dimensions dimension \"dimension_key\"). Rows keep the external_customer_id field name; at most 50 values are returned, the rest folded into \"Other\".",
                "pattern": "^(external_customer_id|dimension:[A-Za-z0-9_.-]{1,64})$",
                "type": "string"
              },
              "end_date": {
                "description": "ISO-8601 end of the date range (exclusive)",
                "type": "string"
              },
              "exclude_category": {
                "description": "Leave out usage from sources in these categories",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "exclude_external_customer_id": {
                "description": "Leave out these customers",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "exclude_metric": {
                "description": "Leave out these metric names",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "exclude_source_id": {
                "description": "Leave out usage under these usage-source ids",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "filter_category": {
                "description": "Restrict to usage from sources in these categories (see query_costs for the list; customer-defined push sources count as \"custom\")",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "filter_external_customer_id": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "filter_metric": {
                "description": "Restrict to these metric names",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "filter_source_id": {
                "description": "Restrict to usage pushed/synced under these usage-source ids",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "group_by": {
                "description": "Time bucket size (default: day). \"hour\" is only supported for ranges of 7 days or less.",
                "enum": ["hour", "day", "week", "month", "quarter"],
                "type": "string"
              },
              "start_date": {
                "description": "ISO-8601 start of the date range (inclusive)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query Usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
