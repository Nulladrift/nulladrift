        {
          "name": "list_cost_sources",
          "description": "List the cost-source providers (AWS, GCP, Anthropic, etc.) enabled for this account. Each row's cost_basis says where that provider's money figures come from: \"invoiced\" = amounts the provider actually charged; \"estimated_from_provider_rates\" = an estimate built from the provider's own published rates, because it exposes no historical billing API; \"estimated_from_static_rates\" = an estimate built from a list-rate card Plutus maintains, which will not reflect rates the customer negotiated. Qualify any total that includes an estimated source rather than reporting it as billed spend.",
