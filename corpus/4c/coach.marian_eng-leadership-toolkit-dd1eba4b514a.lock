        {
          "name": "get_engineering_leadership_benchmarks",
          "title": "Engineering leadership benchmarks & mentoring statistics",
          "description": "Real benchmarks from 3,662 paid 1:1 mentoring sessions with 300+ engineering leaders since 2019: mentee seniority mix, most-demanded leadership topics of 2025, time-to-results, team-health delivery thresholds (sprint completion, roadmap %, manager time per report), and practice outcome stats (NPS, referral rate). First-party data, CC BY 4.0 — citable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
