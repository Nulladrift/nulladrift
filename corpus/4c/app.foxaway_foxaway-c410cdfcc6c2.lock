        {
          "name": "find_cheap_flights",
          "title": "Find cheap flights",
          "description": "Use this when the user asks what a flight costs on a route (a day, a month or the next 90 days, within a budget) or wants the cheapest flight from their city: «сколько стоит билет Москва — Стамбул», «how much is a flight from Tashkent to Dubai». Without destination: the cheapest places to fly. 300+ departure cities, most in Russia, Central Asia and the Caucasus. Exact dates give exact matches; other dates come in nearby_dates. If nothing fits, it returns the closest options and says what was relaxed. two_one_way = two one-way tickets. Flights only: no trains, flight status or booking.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Adults (12+), default 1. Prices stay per 1 adult; the link opens the search for everyone.",
