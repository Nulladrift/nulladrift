        {
          "name": "obm_get_price_history",
          "title": "Série de preço ou cota",
          "description": "Série diária de preço, cota ou pontos do índice. Bonds: PU sem arredondamento; bid é mercado comprador (Tesouro: Taxa Venda), ask é mercado vendedor (Tesouro: Taxa Compra); sem datas, última cotação; start/end até 366 dias inclusivos, sem paginação, ordem decrescente. Cite source e reference_date, nunca hoje se a referência for anterior. Demais classes: padrão 12 meses; até 100 linhas por página, em ordem cronológica. Use start e end para estreitar ou page para continuar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_type": {
                "enum": ["funds", "equities", "bdrs", "fiis", "etfs", "indices", "bonds"],
                "type": "string"
              },
              "end": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Fim (AAAA-MM-DD). Padrão: o dado mais recente."
              },
              "identifier": {
                "description": "Ticker, CNPJ ou código do título; Tesouro pode conter espaço, como NTN-B PRINCIPAL_2035-05-15.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._ -]+$",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Página; continue daqui se houver mais.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 100,
                "description": "Linhas por página (máximo 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "start": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Início (AAAA-MM-DD). Padrão: 12 meses; bonds sem start/end devolve só a última cotação."
              }
            },
            "required": ["asset_type", "identifier"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {},
            "properties": {
              "data": {
                "items": {
                  "if": {
                    "required": ["unit_price_brl"]
                  },
                  "then": {
                    "properties": {
                      "ask_rate_ratio": {
                        "type": ["number", "null"]
                      },
                      "bid_rate_ratio": {
                        "type": ["number", "null"]
                      },
                      "date": {
                        "format": "date",
                        "type": "string"
                      },
                      "duration_business_days": {
                        "type": ["number", "null"]
                      },
                      "indicative_rate_ratio": {
                        "type": ["number", "null"]
                      },
                      "indicative_unit_price_brl": {
                        "type": ["number", "null"]
                      },
                      "price_basis": {
                        "enum": ["published_curve", "calculated_curve", "indicative", "trade", "market_quote"],
                        "type": "string"
                      },
                      "price_source": {
                        "type": "string"
                      },
                      "unit_price_brl": {
                        "type": "number"
                      },
                      "updated_nominal_value_brl": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["date", "price_basis", "price_source", "unit_price_brl"],
                    "type": "object"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "type": ["object", "null"]
              },
              "reference_date": {
                "format": "date",
                "type": ["string", "null"]
              },
              "source": {
                "required": ["code", "name", "url"],
                "type": "object"
              }
            },
            "required": ["data", "meta", "reference_date", "source"],
            "type": "object"
          },
