                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "page_size": {
                "anyOf": [
                  {
                    "description": "Linhas por página (máximo 100).",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
