        {
          "name": "obm_get_asset",
          "title": "Ficha de um ativo",
          "description": "Identidade e indicadores principais de um ativo; para fundos, view=metrics traz os indicadores. Bonds cobre CRI, CRA, debêntures e Tesouro; o cadastro não traz preços, consulte obm_get_price_history para PU e taxas. Para descobrir Tesouro use obm_list_assets com asset_type=bonds e kind=tesouro; demais ativos podem usar obm_search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_type": {
                "enum": ["funds", "equities", "bdrs", "fiis", "etfs", "indices", "bonds"],
                "type": "string"
              },
              "identifier": {
                "description": "Ticker, CNPJ ou código do título; Tesouro pode conter espaço, como NTN-B PRINCIPAL_2035-05-15.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._ -]+$",
                "type": "string"
              },
              "view": {
                "default": "detail",
                "description": "detail: ficha; metrics: indicadores de fundo (só fundos).",
                "enum": ["detail", "metrics"],
                "type": "string"
              }
            },
            "required": ["asset_type", "identifier"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Source": {
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["code", "name", "url"],
                "type": "object"
              }
            },
            "properties": {
              "data": {
                "if": {
                  "required": ["maturity_date", "type"]
                },
                "then": {
                  "properties": {
                    "accrual_start_date": {
                      "anyOf": [
                        {
                          "format": "date",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "code": {
                      "type": "string"
                    },
                    "collateral_type": {
                      "type": ["string", "null"]
                    },
                    "day_count": {
                      "type": ["string", "null"]
                    },
                    "debtor_name": {
                      "type": ["string", "null"]
                    },
                    "fixed_rate_ratio": {
                      "type": ["number", "null"]
                    },
                    "guarantee_type": {
                      "type": ["string", "null"]
                    },
                    "incentivized": {
                      "type": ["boolean", "null"]
                    },
                    "indexer": {
                      "type": ["string", "null"]
                    },
                    "isin": {
                      "type": ["string", "null"]
                    },
                    "issue_date": {
                      "anyOf": [
                        {
                          "format": "date",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "issue_number": {
                      "type": ["string", "null"]
                    },
                    "issued_quantity": {
                      "type": ["number", "null"]
                    },
                    "issued_volume_brl": {
                      "type": ["number", "null"]
                    },
                    "issuer_cnpj": {
                      "type": ["string", "null"]
                    },
                    "issuer_name": {
                      "type": ["string", "null"]
                    },
                    "maturity_date": {
                      "anyOf": [
                        {
                          "format": "date",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "type": ["string", "null"]
                    },
                    "nominal_value_at_issue_brl": {
                      "type": ["number", "null"]
                    },
                    "reference_date": {
                      "anyOf": [
                        {
                          "format": "date",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "sector": {
                      "type": ["string", "null"]
                    },
                    "series": {
                      "type": ["string", "null"]
                    },
                    "source": {
                      "anyOf": [
                        {
                          "$ref": "#/$defs/Source"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "spread_ratio": {
                      "type": ["number", "null"]
                    },
                    "status": {
                      "enum": ["active", "matured", "redeemed", "defaulted", "suspended", "cancelled"],
                      "type": "string"
                    },
                    "trustee_name": {
                      "type": ["string", "null"]
                    },
                    "type": {
                      "enum": ["cri", "cra", "debenture", "tesouro"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "status", "type", "url"],
                  "type": "object"
                },
                "type": "object"
              },
              "meta": {
                "type": ["object", "null"]
              },
              "reference_date": {
                "format": "date",
