        {
          "name": "assess_property",
          "title": "Buy a property assessment",
          "description": "Costs 10 prepaid credits. Purchase the cited, dated licensing assessment for one property and its household. Run preflight_property first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acceptNationalOnly": {
                "description": "Set true only when the user accepts national-only coverage.",
                "type": "boolean"
              },
              "facts": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "maxLength": 220,
                    "minLength": 1,
                    "type": "string"
                  },
                  "building": {
                    "enum": ["ordinary_house", "flat", "unknown"],
                    "type": "string"
                  },
                  "evidence": {
                    "additionalProperties": false,
                    "properties": {
                      "address": {
                        "maxLength": 220,
                        "minLength": 1,
                        "type": "string"
                      },
                      "expiresOn": {
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                        "type": "string"
                      },
                      "schemeType": {
                        "enum": ["selective", "additional", "mandatory_hmo"],
                        "type": "string"
                      },
                      "startsOn": {
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                        "type": "string"
                      }
                    },
                    "required": ["address", "expiresOn", "schemeType", "startsOn"],
                    "type": "object"
                  },
                  "exemption": {
                    "enum": ["none_known", "possible"],
                    "type": "string"
                  },
                  "household": {
                    "description": "Private rent, as occupants’ main home. Single is one household; two_sharers is two people from different households; small_hmo is 3–4 people from two or more households; large_hmo is 5+ from two or more households.",
                    "enum": ["single", "two_sharers", "small_hmo", "large_hmo"],
                    "type": "string"
                  },
                  "postcode": {
                    "maxLength": 10,
                    "type": "string"
                  },
                  "sharedFacilities": {
                    "type": "boolean"
                  },
                  "ward": {
                    "description": "Ward confirmed for this exact address on the council's own checker. Omit when unknown.",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["postcode"],
                "type": "object"
              },
              "requestId": {
                "description": "Purchase UUID. Reuse only for a retry with identical arguments.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["facts", "requestId"],
            "type": "object"
          },
