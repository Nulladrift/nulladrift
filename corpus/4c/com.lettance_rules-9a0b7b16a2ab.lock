              "requestId": {
                "description": "Purchase UUID. Reuse only for a retry with identical arguments.",
                "format": "uuid",
                "type": "string"
              },
              "schemeType": {
                "enum": ["mandatory_hmo", "additional_hmo", "selective"],
                "type": "string"
              }
            },
            "required": ["councilGss", "requestId", "schemeType"],
            "type": "object"
