        {
          "name": "council_reviews",
          "title": "Council evidence and independent reviews",
          "description": "Free. Use when someone asks when an English council’s rental licensing evidence was checked, which official sources changed, or where coverage is incomplete. Read-only. With a council slug, returns source links, comparison dates and independent field decisions. Omit the slug for national coverage and a paged council list. A publisher change is a research lead.",
