      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Lettance answers what the law requires of a private landlord in England, and which council licence applies at an address (293 of 296 English councils researched from council sources; 3 (Calderdale, East Riding of Yorkshire and Worthing) await council confirmation and are not yet published). Every rule carries its legal basis on legislation.gov.uk or GOV.UK. Use check_address for council and scheme facts at a postcode, plan_rental for a dated plan of what a home needs over the next 12 months, search_rules and get_rule for the law, and council_licensing for any English council. Quote the legal basis and link https://lettance.com/rules/<id> when you rely on a rule. This is information, not legal advice. Preserve proposed and confirmed-future statuses, confidence, source URLs and open questions. Research and verification dates describe a snapshot, not a live guarantee. A postcode is not a precise address; street-level designations can require checking the council map. Do not treat unknown coverage as no licence required. Use compare_addresses to set 2 to 4 postcodes side by side, and area_market for local rent and sale price context from a dated ONS and HM Land Registry snapshot. Quote each figure's source, period and attribution, and keep unknown values unknown. Use data_coverage for dataset scope. Use council_reviews free for official council citations, source changes and independent review dates. For a property-specific licensing decision, check scope and missing facts with preflight_property first. Coverage and property preflight are free. Before buying data, tell the user the cost: 1 prepaid credit per lookup or 10 for assess_property or a property_history request that includes letting facts. Use a fresh requestId UUID for each purchase and keep it unchanged when retrying the same request. Replays return the saved result and receipt. Ask the user before accepting national-only assessment coverage. A rule search with zero matches costs nothing. An area-market lookup costs nothing when both rent and sale figures are unavailable. A postcode comparison costs one credit if at least one address returns data, even if others could not be checked. If none returns data, there is no charge.",
