      },
      "instructions": "Lettance answers what the law requires of a private landlord in England, and which council licence applies at an address (293 of 296 English councils researched from council sources; 3 (Calderdale, East Riding of Yorkshire and Worthing) await council confirmation and are not yet published). Every rule carries its legal basis on legislation.gov.uk or GOV.UK. Use check_address for a specific property, plan_rental for a dated plan of what a home needs over the next 12 months, search_rules and get_rule for the law, and council_licensing for any English council. Quote the legal basis and link https://lettance.com/rules/<id> when you rely on a rule. This is information, not legal advice. Preserve proposed and confirmed-future statuses, confidence, source URLs and open questions. Research and verification dates describe a snapshot, not a live guarantee. A postcode is not a precise address; street-level designations can require checking the council map. Do not treat unknown coverage as no licence required. Use compare_addresses to set 2 to 4 postcodes side by side, and area_market for local rent and sale price context from a dated ONS and HM Land Registry snapshot. Quote each figure's source, period and attribution, and keep unknown values unknown.",
      "tools": [
        {
          "name": "area_market",
          "title": "Local rents and sale prices",
          "description": "Use when someone asks about typical rents or house prices around a postcode in England. Returns the ONS average monthly private rent for the local authority (with bedroom breakdown and annual change) and the HM Land Registry median sale price and number of sales for the postcode district, from a dated snapshot. Each figure carries its source, release and obtained dates, period and the required attribution. Read-only. Area figures only, never a valuation of one home. Information, not financial advice.",
          "inputSchema": {
            "properties": {
              "postcode": {
                "description": "Full postcode in England, at most 16 characters, e.g. SE15 5BA",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Local rents and sale prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:56dc7017d2d2062d26f5f8ff61a39c08e2a1f21ebd54dec4d4de86698d0d1e06"
        },
        {
          "name": "check_address",
          "title": "Rules for a rental address",
          "description": "Use when someone asks what applies to a rented home at a postcode in England. Returns whether a council property licence is needed for the household type, the council's licensing schemes, the planned landlord register window, flood zone and conservation area, each with its source, and councilPage, Lettance's page for that council. Read-only. England only; a council we have not researched yet says so instead of guessing. Information, not legal advice.",
          "inputSchema": {
            "properties": {
              "household": {
                "description": "single: one household; small_hmo: 3-4 people from 2+ households; large_hmo: 5+ people from 2+ households",
                "enum": ["single", "small_hmo", "large_hmo"],
                "type": "string"
              },
              "postcode": {
                "description": "Full postcode of the rented property, not the user's own location, e.g. SE15 5BA",
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Rules for a rental address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lettance/licensing/claude-v1.html"
            }
          },
          "digest": "sha256:28baafe153dc21a240840b993084bda19feb231a5dbdf0d8858a5f949f304243"
        },
        {
          "name": "compare_addresses",
          "title": "Compare rental addresses",
          "description": "Use when someone wants to compare 2 to 4 rented homes or areas in England by postcode. Returns each postcode's check_address answer and area market figures, plus a side-by-side table of licence need, landlord register window, flood zone, conservation areas, Article 4 directions, average local rent and median sale price. Every field names its source, licence and dates; anything the sources cannot settle is unknown, never no. Read-only. Each postcode counts as one request against the rate limit. Information, not legal advice.",
          "inputSchema": {
            "properties": {
              "household": {
                "description": "single: one household; small_hmo: 3-4 people from 2+ households; large_hmo: 5+ people from 2+ households",
                "enum": ["single", "small_hmo", "large_hmo"],
                "type": "string"
              },
              "postcodes": {
                "description": "Full postcodes of the rented properties, at most 16 characters each, e.g. [\"SE15 5BA\", \"SW6 1HS\"]",
                "items": {
                  "maxLength": 16,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["postcodes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare rental addresses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a00ee426179e8842c8403ba5497f54f3abaa03a771ed8533f4a8f59ae41505a4"
        },
        {
          "name": "council_licensing",
          "title": "Council licensing",
          "description": "Use when someone asks about a council's licensing schemes in England. Returns every scheme for the council with its wards, dates, fees and council sources. Pass a slug such as 'southwark' or a name such as 'Birmingham'. Read-only. A council we have not researched yet returns researched: false with its region and landlord register window.",
          "inputSchema": {
            "properties": {
              "council": {
                "description": "Council slug or name, e.g. 'southwark' or 'Tower Hamlets'",
                "type": "string"
              }
            },
            "required": ["council"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Council licensing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b2a8778b93327b0c9e0da448a68dda65673201f6c554128f473f546dacccfcb"
        },
        {
          "name": "get_rule",
          "title": "Get a landlord rule",
          "description": "Use when you have a rule id from search_rules and need its full detail: the requirement, deadline, evidence to keep, penalty, legal basis and official guidance links. Read-only. Unknown ids return an error rather than a guess.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Rule id, e.g. 'gas-safety-annual-check'",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a landlord rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:44fb6781bd0612a8392ce8f475032978aa0fba8bc8a35224454711163bf69aff"
        },
        {
          "name": "plan_rental",
          "title": "Plan a rental's year",
          "description": "Use when a landlord in England asks what is due for a rented home and when, or wants a plan or calendar for it. Give the postcode and whatever the landlord knows: every other argument is optional. Returns each duty with its status, date, plain explanation and cited rules for the next 12 months, the questions still worth asking (as argument names), and links to an interactive plan and a calendar file. Statuses rely on the landlord's own answers, not documents. Read-only. Nothing is stored. Information, not legal advice.",
          "inputSchema": {
            "properties": {
              "alarms_tested_at_start": {
                "description": "Whether the smoke and carbon monoxide alarms were tested on the day the tenancy started",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "deposit_protected_in_time": {
                "description": "Whether the deposit was protected and the prescribed information given within 30 days of receiving it",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "deposit_received": {
                "description": "The date the deposit was received, often before the tenancy starts, as YYYY-MM-DD",
                "maxLength": 40,
                "type": "string"
              },
              "deposit_taken": {
                "description": "Whether a tenancy deposit was (or will be) taken",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "epc_expiry": {
                "description": "The date the EPC expires, as YYYY-MM-DD",
                "maxLength": 40,
                "type": "string"
              },
              "epc_rating": {
                "description": "The EPC's current energy rating, A to G",
                "enum": ["A", "B", "C", "D", "E", "F", "G"],
                "type": "string"
              },
              "furnished": {
                "description": "Whether the landlord supplies any furniture",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "has_gas": {
                "description": "Whether the home has any gas appliance, such as a boiler, hob or gas fire",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "holds_licence": {
                "description": "Whether the landlord holds the kind of council licence the address needs for this household (the plan's licence question names it); only matters where one is needed",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "household": {
                "description": "single: one household; small_hmo: 3-4 people from 2+ households; large_hmo: 5+ people from 2+ households. Defaults to single.",
                "enum": ["single", "small_hmo", "large_hmo"],
                "type": "string"
              },
              "last_electrical_inspection": {
                "description": "The inspection date on the last electrical installation condition report (EICR), as YYYY-MM-DD",
                "maxLength": 40,
                "type": "string"
              },
              "last_gas_check": {
                "description": "The date of the last gas safety check, from the gas safety record, as YYYY-MM-DD",
                "maxLength": 40,
                "type": "string"
              },
              "last_rent_increase": {
                "description": "The date the last rent increase took effect, if there was one during this tenancy, as YYYY-MM-DD",
                "maxLength": 40,
                "type": "string"
              },
              "letting": {
                "description": "now: tenants live there; next: a tenancy is starting, or the home is being got ready to let",
                "enum": ["now", "next"],
                "type": "string"
              },
              "licence_end": {
                "description": "The date the council licence ends, as YYYY-MM-DD",
                "maxLength": 40,
                "type": "string"
              },
              "next_electrical_inspection": {
                "description": "The next inspection date the last EICR sets, which can be sooner than 5 years, as YYYY-MM-DD",
                "maxLength": 40,
                "type": "string"
              },
              "postcode": {
                "description": "Full postcode of the rented property, not the landlord's own, e.g. SW9 7AA",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              },
              "rent_period": {
                "description": "How often the rent is due",
                "enum": ["month", "four_weeks", "fortnight", "week"],
                "type": "string"
              },
              "right_to_rent_checked": {
                "description": "Whether every adult's right to rent was checked before the tenancy was agreed",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "tenancy_document_given": {
                "description": "Tenancies from before 1 May 2026: whether the government information sheet (or written terms, for an oral tenancy) was given by 31 May 2026. Later tenancies: whether the written statement of terms was given before the tenancy was agreed. late: given, but after that",
                "enum": ["yes", "late", "no"],
                "type": "string"
              },
              "tenancy_start": {
                "description": "The current tenancy's start (letting now) or the next tenancy's planned start (letting next), as YYYY-MM-DD",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Plan a rental's year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3c0ba215835024ed9588c300cf3847e0df517e28a7aa7ee49d1bda102eed2a5a"
        },
        {
          "name": "search_rules",
          "title": "Search landlord rules",
          "description": "Use for general questions about what private landlords in England must do, such as gas safety, deposits, EPC ratings, smoke alarms or notices. Searches Lettance's catalogue of rules, each cited to legislation.gov.uk or GOV.UK, and returns matching rule ids with summaries. Use get_rule for one rule's full detail. Read-only.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Keywords, e.g. 'gas safety certificate' or 'deposit protection'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search landlord rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f413876a7f6fa223b5045b693a22685d0dff3fe4536f8aac09f790e941b6e77e"
        }
      ],
