{
  "lockfileVersion": 2,
  "subjects": {
    "com.headlesson/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.headlesson.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "headlesson",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "headlesson is a catalog of command-line tools, MCP servers and APIs for agents. Most records include steps an agent actually ran, the dated test result, and known failure conditions. It is useful when you are choosing, comparing or recommending a tool, before installing or connecting one, when a tool exits 0 but its output is empty or looks wrong, and when you need to know what changed after your training data. Start with headlesson_search, then headlesson_get with the returned ID.",
      "tools": [
        {
          "name": "headlesson_feedback",
          "title": "Send feedback to headlesson",
          "description": "This content is sent to the headlesson operator. Feedback about headlesson itself is sufficient. Do not include personal information or conversation contents.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "Optional record ID that the feedback concerns; feedback about headlesson itself needs no product ID.",
                "examples": ["app:postiz"],
                "type": "string"
              },
              "client": {
                "description": "Optional client name only; do not include full User-Agent, account IDs or credentials.",
                "examples": ["MCP Inspector"],
                "type": "string"
              },
              "kind": {
                "default": "comment",
                "description": "Report type: comment, worked, failed, missing or tip; receipt does not verify the claim.",
                "enum": ["comment", "worked", "failed", "missing", "tip"],
                "examples": ["missing"],
                "type": "string"
              },
              "model": {
                "description": "Optional model name associated with the report, without conversation content.",
                "examples": ["model-name"],
                "type": "string"
              },
              "text": {
                "description": "Feedback to the headlesson operator, 1–2000 Unicode characters; exclude personal information and conversation text.",
                "examples": ["The lesson needs a clearer owner-login prerequisite."],
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send feedback to headlesson"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:886331bc11c3f10bf775335c9918c93122c2e6d5d984e4432526f43c881544bd"
        },
        {
          "name": "headlesson_get",
          "title": "Get tried steps, test results and pitfalls",
          "description": "Get one record by an ID from headlesson_search: an app, usecase, feature, concept or change. For an app, sections [\"lesson\",\"gotchas\"] return the install, check and first-task steps with the recorded test result (a dated observation by the headlesson operator) and known failure conditions; \"relations\" lists alternatives and what it wraps or depends on; \"axes\" returns every compared fact. Without sections you get the description, interfaces and six main axes. Each fact carries its source and check date; private sources appear as labels, not links. Official MCP Registry listing IDs are fetched live and are unverified; a failed lookup does not prove the ID absent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Record ID or the special axes/search-guide ID; missing records return nearby ID suggestions.",
                "examples": ["app:postiz", "feature:since-2025", "axes", "search-guide"],
                "minLength": 1,
                "type": "string"
              },
              "sections": {
                "description": "App sections to return in text and structuredContent; omitted means description, interfaces and six major axes.",
                "examples": [
                  ["lesson", "gotchas"],
                  ["axes", "relations", "changes"]
                ],
                "items": {
                  "enum": ["lesson", "relations", "gotchas", "changes", "axes"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get tried steps, test results and pitfalls"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f411c2dcf7d40410039b2211f3b64ffd4b1a976c7bcf4834b440f25b173742ee"
        },
        {
          "name": "headlesson_search",
          "title": "Find tested tools for a task",
          "description": "Find command-line tools, MCP servers and APIs for a task, and compare them. Ask in plain English or Japanese (\"extract text from scanned PDFs\") or by product name. Each result gives an ID, a one-line reason it matches, and when it was checked. Pass the ID to headlesson_get with sections [\"lesson\",\"gotchas\"] to get the steps (install, check, first task) with their recorded test result (most were run by an agent; a few are untested) and known failure conditions, such as a tool that exits 0 with empty or wrong output. Filter or compare with axes such as auth, pricing, license and remote_mcp (where, axes, ids). Curated records come first. If none match, or include:[\"registry\"] is set, one public word from the query is looked up in the Official MCP Registry; those listings are unverified (what is sent is described on the query field).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "axes": {
                "description": "Axes to compare: auth, pricing, license, cli, local_mcp, remote_mcp are useful starting points; licence is normalized to license.",
                "examples": [
                  ["auth", "pricing", "remote_mcp"],
                  ["licence"]
                ],
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ids": {
                "description": "Up to 20 explicit app IDs to compare; any missing ID produces an error instead of being silently omitted.",
                "examples": [
                  ["app:postiz", "app:typefully"]
                ],
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "include": {
                "description": "Explicitly request the supplemental Official Registry name lookup alongside curated results. Otherwise it is attempted only when curated matches are absent. At most five unverified listings; one-page comparison only.",
                "examples": [
                  ["registry"]
                ],
                "items": {
                  "const": "registry",
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 5,
                "description": "Maximum app results, from 1 to 20; default is 5.",
                "examples": [5],
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Task or product name in English or Japanese. External Registry lookup sends only one ASCII public name fragment (longest significant ASCII word from free text, or a supplied namespace; max 200 chars) when curated matches are absent or include registry is requested; the full free text is not sent. Recognized credential/URL/PII patterns are skipped; this is not a complete secret filter. Do not include secrets.",
                "examples": ["schedule social media posts", "SNS に予約投稿したい", "Postiz"],
                "type": "string"
              },
              "sort": {
                "additionalProperties": false,
                "description": "Optional axis ordering before relevance; unknown values remain last.",
                "examples": [
                  {
                    "axis": "last_release",
                    "order": "desc"
                  }
                ],
                "properties": {
                  "axis": {
                    "description": "Axis used for ordering; spelling aliases such as licence are normalized.",
                    "examples": ["last_release", "pricing"],
                    "type": "string"
                  },
                  "order": {
                    "description": "Ascending or descending order; unknown is last in either direction.",
                    "enum": ["asc", "desc"],
                    "examples": ["desc"],
                    "type": "string"
                  }
                },
                "required": ["axis", "order"],
                "type": "object"
              },
              "where": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "boolean"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "items": {
                        "type": ["string", "boolean", "number"]
                      },
                      "minItems": 1,
                      "type": "array"
                    }
                  ],
                  "description": "One confirmed value or an OR-list for an axis; unknown is never a confirmed match.",
                  "examples": [
                    true,
                    ["paid", "freemium"]
                  ]
                },
                "description": "Confirmed axis filters: AND across axes, OR inside a value array; known spelling aliases are normalized.",
                "examples": [
                  {
                    "pricing": ["paid", "freemium"],
                    "remote_mcp": true
                  }
                ],
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find tested tools for a task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6d154788e641caeea0c67e622eb4bf883c2d730d67ab7d23211b5bc03684afbe"
        },
        {
          "name": "headlesson_whats_new",
          "title": "Changes in agent tools since a date",
          "description": "List dated changes in agent tools and standards (new tools, renames, deprecations, breaking changes, new standards) since a date, optionally by kind or affected record. Useful for checking what changed after your training data. Public source URLs are kept; private sources appear as labels.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "Affected record ID to filter changes, such as an app or protocol.",
                "examples": ["proto:mcp"],
                "type": "string"
              },
              "kinds": {
                "description": "Change kinds to include; the array is an OR-list.",
                "examples": [
                  ["breaking", "deprecation"]
                ],
                "items": {
                  "enum": ["new", "rename", "deprecation", "breaking", "standard", "acquisition"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 20,
                "description": "Maximum changes, from 1 to 100; default is 20.",
                "examples": [20],
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Inclusive event-date lower bound in YYYY-MM-DD; omitted uses the previous 90 days, not source confirmation dates.",
                "examples": ["2026-01-01"],
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Changes in agent tools since a date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:852d846a6715af0817df15c7bb52367b505267cf9827e2e2feae825738657415"
        }
      ],
      "digest": "sha256:d778f98d9172e69725a3d44a91d98fa76a1664e958b10991207e1dd313e02967"
    }
  }
}
