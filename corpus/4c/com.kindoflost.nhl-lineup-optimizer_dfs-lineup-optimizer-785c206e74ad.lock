            "properties": {
              "example": {
                "description": "Use a bundled sample slate instead of players (names from list_lineup_examples, or just the sport). Live lookups are skipped.",
                "type": "string"
              },
              "exclude_out_players": {
                "description": "Drop players the file marks OUT/IL (default true, as the web page does).",
                "type": "boolean"
              },
              "exclude_players": {
                "description": "Players (name or id) to leave out.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "live_lookups": {
                "description": "NHL line combos / starting goalies and MLB batting orders / probable pitchers from the public sites the web page uses (default false: skipped; sample slates always skip). Can fail or be slow; a failure is reported, the solve still runs.",
                "type": "boolean"
              },
              "lock_players": {
                "description": "Players (name or id) that must be in every lineup.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_exposure_pct": {
                "description": "Any one player may appear in at most this % of the lineups (100 = no cap).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_salary": {
                "description": "Lineups must spend at least this much.",
                "minimum": 0,
                "type": "integer"
              },
              "n_lineups": {
                "description": "Lineups to build (default 10, max 20: diversity cuts make each extra lineup slower and the free server is small).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "players": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "properties": {
                        "id": {
                          "description": "Site player id (the number in 'Name (id)'). Default: name.",
                          "type": "string"
                        },
