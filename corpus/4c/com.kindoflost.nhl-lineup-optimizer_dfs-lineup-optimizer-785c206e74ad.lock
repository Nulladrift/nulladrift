                        },
                        "pp": {
                          "description": "NHL only: power-play unit 1-2.",
                          "type": "integer"
                        },
                        "projection": {
                          "description": "Your projected fantasy points. A player list has no site AvgPointsPerGame to fall back on, so every player needs this unless the top-level `projections` map covers them.",
                          "type": "number"
                        },
                        "salary": {
                          "type": "integer"
                        },
                        "status": {
                          "description": "Injury status code as the site shows it (Q, O, IL...). 'O'/'OUT'/'IL' players are excluded.",
                          "type": "string"
                        },
                        "team": {
                          "description": "Team abbreviation.",
                          "type": "string"
                        }
                      },
                      "required": ["name", "position", "salary", "team"],
                      "type": "object"
                    },
                    "type": "array"
                  }
