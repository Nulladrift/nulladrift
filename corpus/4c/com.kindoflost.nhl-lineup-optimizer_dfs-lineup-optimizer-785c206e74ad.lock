                        "name": {
                          "type": "string"
                        },
                        "opponent": {
                          "description": "Opponent team abbreviation. Needed for rules that look at the opponent (goalie-vs-skater, bring-back, pitcher-vs-hitters, game counts).",
                          "type": "string"
