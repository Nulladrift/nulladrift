          "listChanged": false
        }
      },
      "instructions": "Builds DFS (daily fantasy) lineups for MLB, NFL, NHL and NBA with a real optimizer (mixed-integer / CP-SAT programming): the best lineups under the site's salary cap, roster slots and your rules (stacks, exposure caps, locks, exclusions, goalie-vs-skater and so on), returned with an upload-ready CSV. Same engine as the web tools at mlb-/nfl-/nhl-/nba-lineup-optimizer.kindoflost.com. Typical flow: get_lineup_example (sport) -> build_lineups with example, or with the user's own DraftKings/FanDuel/Yahoo salary CSV text (players) -> if status is 'running', call get_lineup_result with the job_id. check_request validates a request without solving. Lineups maximize PROJECTED points; if the user gives no projections the site's season-average AvgPointsPerGame is used, which is not a forecast for tonight, so say so and offer to apply their own projections. Limits: 20 lineups per call, 1200 players, Classic contests only (not Showdown/Captain). A full site file is often 500+ rows (~60 KB), which is slow to send: unless the user gave projections for them, drop the rows the optimizer would never pick (zero or very low AvgPointsPerGame, e.g. NHL skaters under 7 and goalies under 5), keep the header and columns exactly as exported, and tell the user you trimmed. Live lookups (line combos, batting orders, Vegas lines) are OFF unless live_lookups is true. Send calls one at a time: this free server solves one problem at a time. For entertainment; no result is guaranteed. Free, no sign-up.",
      "tools": [
        {
          "name": "build_lineups",
          "title": "Build DFS lineups",
          "description": "Build up to 20 lineups for a Classic contest. Pass `example` (a sample slate) or `players` (the site's salary CSV text, or a list of player objects for DraftKings). Returns each lineup with its players, slots, salary and projected points, player exposure, notes about what defaults were applied, and `upload_csv`: a DraftKings/FanDuel/Yahoo upload-ready CSV string. Takes 2-60 s; if the result has status 'running', call get_lineup_result with the job_id. Lineups are optimal for the PROJECTIONS used, not predictions of results.",
