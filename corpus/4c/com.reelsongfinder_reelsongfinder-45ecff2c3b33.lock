    "com.reelsongfinder/reelsongfinder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://reelsongfinder.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "ReelSongFinder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ReelSongFinder looks up an ISRC or a song title in the public catalog, and reads free public info for an Instagram Reel, TikTok, YouTube Shorts, or X link. isrc_lookup takes an ISRC. search_track takes a title and an optional artist. reel_song_info returns a saved public match when one exists, otherwise the title published on the post. It does not run audio recognition. The site runs an audio check for Instagram, TikTok and X at https://reelsongfinder.com/. The catalog lookup page is https://reelsongfinder.com/isrc-lookup.",
      "tools": [
        {
          "name": "isrc_lookup",
          "description": "Look up a recording by its ISRC. Returns the title, artist, release, and links from the same public catalog as the ISRC lookup page.",
          "inputSchema": {
            "properties": {
              "isrc": {
                "description": "ISRC, with or without hyphens. Example: USUG11904206 or US-UG1-19-04206.",
                "type": "string"
              }
            },
            "required": ["isrc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cf9c53706c339117e548f5a96a792e3dd5af55709bf4f9f3ec23855013945018"
        },
        {
          "name": "reel_song_info",
          "description": "Read free public info for an Instagram Reel, TikTok, YouTube Shorts, or X link. Returns a saved public match when one exists, otherwise the title published on the post. Does not run audio recognition. The site runs an audio check for Instagram, TikTok and X at https://reelsongfinder.com/.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Public http or https link to an Instagram Reel, TikTok video, YouTube Short, or X post.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ab4aef8286b258702dfbc236614d012f397c6b8c7ebe90e8f92c5823736380ba"
        },
        {
          "name": "search_track",
          "description": "Search the public music catalog by song title and artist. Returns the closest recordings and their ISRC codes.",
          "inputSchema": {
            "properties": {
              "artist": {
                "description": "Artist name. Optional.",
                "type": "string"
              },
              "query": {
                "description": "Song title, or \"title by artist\". You can pass title and artist instead.",
                "type": "string"
              },
              "title": {
                "description": "Song title.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
