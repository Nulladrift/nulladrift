          "description": "Counterparty check before paying a platform or crypto provider: French AMF blacklists, ESMA MiCA register (authorised and non-compliant CASPs), sanctions lists (EU, UN Security Council, US OFAC SDN). Official public data, refreshed daily. Price: $0.015 USDC per call, paid with x402.",
