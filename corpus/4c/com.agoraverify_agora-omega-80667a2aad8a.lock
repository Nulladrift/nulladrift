        {
          "name": "agora_pay_guard",
          "description": "Pre-payment guard for AI agents: before paying an x402 endpoint, checks its payment request (official USDC contract, network, price vs your spending policy, payTo address against US OFAC sanctioned crypto addresses and the Chainalysis on-chain oracle, domain age via RDAP, AMF/ESMA blacklists, HTTPS). Returns ALLOW / REVIEW / HALT with the safest payment option and an Ed25519-signed receipt for your audit trail. Price: $0.01 USDC per call, paid with x402.",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "GET or POST (default GET)",
                "type": "string"
              },
              "payment_required": {
                "description": "Optional: the 402 PAYMENT-REQUIRED header (base64) or JSON body the agent already received",
                "type": "string"
              },
              "policy": {
                "description": "Optional spending policy: max_price_usd, budget_remaining_usd, allowed_domains[], allowed_networks[] (CAIP-2), expected_pay_to",
                "type": "object"
              },
              "url": {
                "description": "The x402 endpoint the agent is about to pay (https)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cfef17c02285ca9b6ade896a27cec58e74cede3e671e4557c1070917a77406d2"
        },
        {
          "name": "agora_stablecoin_depeg",
          "description": "AGORA Sentinel: stablecoin depeg risk indicator. Reads the Chainlink price feed on-chain and returns the deviation from 1 USD in basis points, a 0-100 score, a level (calme / tendu / alerte), data age and staleness. A risk indicator, not investment advice and not a forecast. Price: $0.01 USDC per call, paid with x402.",
          "inputSchema": {
            "properties": {
              "network": {
                "description": "EVM network, e.g. base, ethereum, polygon, arbitrum",
                "type": "string"
              },
              "symbol": {
                "description": "Stablecoin symbol, e.g. USDC",
                "type": "string"
