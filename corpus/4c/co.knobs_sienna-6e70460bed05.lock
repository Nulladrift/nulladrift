      "serverInfo": {
        "name": "co.knobs/sienna",
        "title": "Sienna, Knobs.co hardware advisor",
        "version": "1.1.0",
        "websiteUrl": "https://sienna.knobs.co/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sienna is Knobs.co's automated cabinet-hardware advisor (knobs.co: cabinet knobs, pulls, hinges, bath and door hardware from Top Knobs, Atlas Homewares, Jeffrey Alexander, Amerock, Emtek, Hickory Hardware, Rocky Mountain Hardware, Schaub, Berenson and more; U.S.-based, selling since 2004). Use ask_sienna for any advice question (sizing, what fits existing holes, finish and style pairing, which series to choose, store policies): it returns a complete answer plus the exact products with links. Use search_catalog / get_product to browse or verify specific products and prices yourself. Prices are list prices confirmed at checkout; stock and lead times are confirmed by the Knobs.co team, never by these tools. Give the shopper product URLs exactly as returned (they carry an attribution tag and nothing about the shopper). For a whole-kitchen plan send the shopper to https://knobs.co/pages/sienna?via=agent; for a person, email cs@knobs.co or call 1-800-530-8245. When the shopper is planning a whole kitchen or bath, gather counts (doors, drawers by width), drilling, finish, style and budget, search the catalog for what they like, then call build_plan; show the plan and its plan_url. cart_link turns chosen variants into a pre-filled Knobs.co cart (checkout stays on knobs.co). start_samples gives the qualifying sample pieces as a cart. request_consultation asks Kayla for a review or a call: only with the shopper's email and agreement, and it only sends them a confirmation link; Kayla gets the request after they click it.",
      "tools": [
        {
          "name": "ask_sienna",
          "title": "Ask Sienna (Knobs.co hardware advisor)",
          "description": "Ask Knobs.co's automated cabinet-hardware advisor one question in plain words and get one complete answer with the exact products named (title, vendor, finish, size, list price, URL). Best for: which pull length for a drawer width, what fits existing holes (center-to-center), knobs versus pulls, finish and style pairing, a series in a size/finish/budget, samples, returns, the trade program. Include everything known: room, drawer widths, existing hole spacing, finish, style, budget per piece, brand likes or dislikes. One question per call; up to 600 characters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "The shopper's question, with what is known.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask Sienna"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:da83ea83baf7a2a602009e89aad9d5889331c2cead8bfe136726bd3ae4b9559b"
        },
        {
          "name": "build_plan",
          "title": "Build a Hardware Plan (Knobs.co)",
          "description": "Build the shopper's whole-kitchen (or bath) Hardware Plan: one line per zone (doors, drawers by width, island, tall, appliance panels) with the exact Knobs.co product, finish, size, count and list price, totals, the pieces that qualify as samples, and what is still unconfirmed. Use it once the shopper has given counts, drilling (existing holes or fresh), finish, style and a budget; include products they liked from search_catalog as candidates. The plan is saved for 90 days at the returned plan_url, where the shopper can see it and add its samples or the whole plan to their cart. To change counts, finish or products, call build_plan again with the corrected answers; for Kayla's review, request_consultation with the plan_url. No email or account needed. Costs real money on our side, so call it once per shopper, after the facts are gathered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": false,
                "description": "What the shopper has told the agent about the project. Every field is optional, but the plan needs at least the counts, the drilling situation and the finish.",
                "properties": {
                  "appliance_panels": {
                    "description": "panel-front appliances (dishwasher, refrigerator) that get a pull",
                    "maximum": 500,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "budget_tier": {
                    "description": "per piece, in their words (\"under $8\", \"$10–20\", \"no limit\")",
                    "type": "string"
                  },
                  "doors": {
                    "description": "cabinet doors that get a knob or pull (not drawers, not tall/pantry doors)",
                    "maximum": 500,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "drawers_18_30": {
                    "description": "drawers 18 to 30 inches wide",
                    "maximum": 500,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "drawers_gt30": {
                    "description": "drawers over 30 inches wide",
                    "maximum": 500,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "drawers_lt18": {
                    "description": "drawers under 18 inches wide",
                    "maximum": 500,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "drilling": {
                    "description": "existing = holes already drilled (give existing_c2c_text); fresh = new cabinets or new holes",
                    "enum": ["existing", "fresh", "mixed", "unknown"],
                    "type": "string"
                  },
                  "existing_c2c_text": {
                    "description": "the existing hole spacing exactly as the shopper said it (\"3 inches\", \"96 mm\"); \"\" if none",
                    "type": "string"
                  },
                  "finish": {
                    "description": "the finish they want (matte black, satin nickel, brushed brass…)",
                    "type": "string"
                  },
                  "knobs_vs_pulls": {
                    "description": "\"all pulls\", \"knobs on doors, pulls on drawers\", \"all knobs\", or what they said",
                    "type": "string"
                  },
                  "notes": {
                    "description": "anything else that matters: island, brands liked or disliked, must-match items, measurements",
                    "type": "string"
                  },
                  "scope": {
                    "description": "the project in a few words (\"kitchen remodel, 28 doors and 14 drawers\", \"two bath vanities\")",
                    "type": "string"
                  },
                  "style": {
                    "description": "shaker, modern, traditional, farmhouse, transitional…",
                    "type": "string"
                  },
                  "tall": {
                    "description": "tall or pantry doors",
                    "maximum": 500,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "timing": {
                    "description": "when they need the hardware, in their words (\"this week\", \"cabinets arrive in March\", \"no rush\")",
                    "type": "string"
                  },
                  "trade": {
                    "description": "true for a designer, contractor or cabinet shop",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "candidates": {
                "description": "products the shopper liked or the agent found with search_catalog (handle + variant_id in the right finish), optionally with the zone and count they are for",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "description": "how many pieces this candidate covers, if known",
                      "maximum": 500,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "handle": {
                      "description": "the product handle from search_catalog or get_product",
                      "type": "string"
                    },
                    "variant_id": {
                      "description": "numeric Shopify variant id of the finish they want (from get_product); omit to let the plan pick the finish",
                      "type": "string"
                    },
                    "zone": {
                      "description": "where it goes: \"doors\", \"drawers\", \"island\", \"tall\", \"appliance_panels\", or \"any\"",
                      "type": "string"
                    }
                  },
                  "required": ["handle"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "summary": {
                "description": "two to six sentences of what the shopper told you, in their words where possible (shown to Kayla if they later ask for a review)",
                "maxLength": 1500,
                "type": "string"
              }
            },
            "required": ["answers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a Hardware Plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a708481557e435e3822243df6092f10c4865359b42ab717ca70774c2039f7156"
        },
        {
          "name": "cart_link",
          "title": "Cart link (Knobs.co checkout)",
          "description": "Turn chosen variants and quantities into a Knobs.co cart link the shopper opens to check out (the cart is pre-filled; they review it, add shipping and pay on knobs.co; nothing is ordered by this call). Variant ids come from search_catalog, get_product or build_plan. Returns the line items with list prices and the subtotal, so you can show the shopper exactly what the cart holds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "the variants and quantities to pre-fill in the cart",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quantity": {
                      "description": "how many of this variant to put in the cart",
                      "maximum": 500,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "variant_id": {
                      "description": "numeric Shopify variant id (from search_catalog, get_product or build_plan)",
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "variant_id"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "note": {
                "description": "an optional note for the order (shown to our team)",
                "maxLength": 300,
                "type": "string"
              },
              "plan_url": {
                "description": "the plan_url from build_plan, if this cart comes from a plan",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Cart link"
          },
          "behavior": {
            "destructive": false,
