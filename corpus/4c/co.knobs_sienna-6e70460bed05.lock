        {
          "name": "request_consultation",
          "title": "Ask Kayla to review or call (Knobs.co)",
          "description": "Ask Kayla, Knobs.co's Trade Manager (twenty years in cabinet hardware), to review the shopper's plan by email within one business day, or to set up a call. Only with the shopper's email and their clear agreement to be contacted. This sends the shopper ONE email with a confirmation link; Kayla receives the request only after they click it (within 7 days), so tell the shopper to look for an email from cs@knobs.co and confirm. Include the plan_url from build_plan when there is one, and say in message what they want Kayla to do.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "the shopper's email, given by them for this purpose",
                "type": "string"
              },
              "kind": {
                "description": "review = Kayla reviews the plan and emails back; call = Kayla sets up a call (the confirmation page opens her calendar)",
                "enum": ["review", "call"],
                "type": "string"
              },
              "message": {
                "description": "what the shopper wants from Kayla, in their words, plus anything she needs to know (no links)",
                "maxLength": 1500,
                "type": "string"
              },
              "name": {
                "description": "the shopper's name as they gave it (first name is enough)",
                "maxLength": 80,
                "type": "string"
              },
              "phone": {
                "description": "phone number, only if the shopper offered it (useful when kind is \"call\")",
                "maxLength": 40,
                "type": "string"
              },
              "plan_url": {
                "description": "the plan_url from build_plan, when there is a plan",
                "type": "string"
              }
            },
            "required": ["email", "message"],
            "type": "object"
          },
          "annotations": {
