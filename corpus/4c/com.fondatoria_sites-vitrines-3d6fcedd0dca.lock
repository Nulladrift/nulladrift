        {
          "name": "orienter_statut",
          "title": "Choisir son statut",
          "description": "Classe les quatre statuts les plus courants pour créer son entreprise en France (micro-entreprise, entreprise individuelle au réel, EURL ou SARL, SASU ou SAS) selon six réponses, avec ce qui joue pour et contre chacun, ce qui l'exclut, et ce qu'il faut faire ensuite. Renvoie aussi le lien de la feuille de route du créateur, où ces réponses sont déjà reprises. Règles de 2026, sources officielles citées. Demandez à l'utilisateur les réponses qui manquent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "associes": {
                "description": "Vous lancez-vous seul ou à plusieurs ? (seul : Seul ; plusieurs : Avec un ou plusieurs associés)",
                "enum": ["seul", "plusieurs"],
                "type": "string"
              },
              "chiffre_affaires": {
                "description": "Votre chiffre d'affaires annuel restera-t-il sous les plafonds de la micro-entreprise ? 83 600 € HT pour des prestations de services, 203 100 € HT pour de la vente. (sous_les_plafonds : Oui, sans doute ; au_dessus : Non, il sera plus élevé ; inconnu : Je ne sais pas encore)",
                "enum": ["sous_les_plafonds", "au_dessus", "inconnu"],
                "type": "string"
              },
              "chomage": {
                "description": "Touchez-vous l'allocation chômage ? (oui : Oui ; non : Non)",
                "enum": ["oui", "non"],
                "type": "string"
              },
              "frais": {
                "description": "Aurez-vous des frais importants ? Stock, matériel, véhicule, local, sous-traitance. (faibles : Peu de frais ; importants : Des frais importants)",
                "enum": ["faibles", "importants"],
                "type": "string"
              },
              "investisseurs": {
                "description": "Voulez-vous pouvoir faire entrer des associés ou des investisseurs plus tard ? (non : Non, pas prévu ; oui : Oui, c'est possible)",
                "enum": ["non", "oui"],
                "type": "string"
              },
              "priorite": {
                "description": "Qu'est-ce qui compte le plus pour vous ? (moins_de_cotisations : Payer le moins de cotisations ; protection_sociale : Une protection sociale proche des salariés)",
                "enum": ["moins_de_cotisations", "protection_sociale"],
                "type": "string"
              }
            },
            "required": ["associes", "chiffre_affaires", "chomage", "frais", "investisseurs", "priorite"],
            "type": "object"
          },
