        {
          "name": "importer_site",
          "title": "Mettre en ligne le site écrit",
          "description": "À utiliser quand l'utilisateur veut publier, mettre en ligne, héberger, déployer ou partager le site que vous avez écrit (code HTML, Canvas, artefact), ou demande comment le faire. Met en ligne, au même design, le site vitrine que vous venez d'écrire en HTML pour une entreprise : Fondatoria fait de la page un vrai site, l'héberge, ajoute le formulaire de contact, les mentions légales et le référencement, et le propriétaire le modifie ensuite sans code. Envoyez la page complète telle que vous l'avez écrite : Tailwind par CDN, polices Google, scripts et styles sont acceptés, les images en liens. Renvoie le lien où le propriétaire découvre son site, vérifie ses coordonnées et le crée. Les avis, chiffres et labels que la page invente restent de côté tant qu'il ne les confirme pas.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activite": {
                "description": "Activité, par exemple « Plombier chauffagiste ».",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "E-mail donné par l'utilisateur, jamais une adresse d'exemple.",
                "maxLength": 120,
                "type": "string"
              },
              "html": {
                "description": "Le code HTML complet de la page, du <!doctype html> à </html>, tel que vous l'avez écrit. Un fichier HTML, pas un composant React (JSX).",
                "maxLength": 400000,
                "minLength": 50,
                "type": "string"
              },
              "nom": {
                "description": "Nom de l'entreprise, s'il est connu.",
                "maxLength": 120,
                "type": "string"
              },
              "remarques": {
                "description": "Ce que l'utilisateur a précisé d'autre et que la page ne dit pas.",
                "maxLength": 1000,
                "type": "string"
              },
              "telephone": {
                "description": "Téléphone donné par l'utilisateur, jamais un numéro d'exemple.",
                "maxLength": 30,
                "type": "string"
              },
              "ville": {
                "description": "Ville de l'entreprise.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
