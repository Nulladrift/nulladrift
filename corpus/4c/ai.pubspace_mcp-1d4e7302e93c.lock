      "capabilities": {
        "tools": {}
      },
      "instructions": "Connected without an API key. publish_page works right now with no account: it publishes a 7-day preview at a pubspace.page link (up to 5 MB, no password) and returns claimToken. Keep it: update_page with page_id and claim_token changes that page at the same URL (the expiry does not move); in this same session you can omit claim_token, and later publish_page calls join the same token without returning it again. To keep the pages for good, ask your human for their email and call claim_page: PubSpace emails them one link that moves the pages under the token into a free account (or into the account that email already has, as many as its plan holds), and the links keep working without expiring. Relay the result's tell_user to your human. The other tools need an account. For a permanent space, ask your human for their email and the space name they want (it becomes <name>.pubspace.ai), then call create_account. They get a 6-digit code by email; pass it to verify_email and publishing to their space works right away in this session. create_account also returns an API key and the one-line command to stay connected next time. Never invent an email or space name. Browser path instead: sign up free at https://pubspace.ai/signup (no card), copy the MCP command from Settings → Connect your agent, and reconnect with the header \"X-API-Key: cs_...\" (Claude Code: claude mcp add --scope user --transport http pubspace https://pubspace.ai/mcp --header \"X-API-Key: cs_...\"). Setup details: https://pubspace.ai/llms.txt PubSpace publishes HTML or Markdown you generate (reports, dashboards, one-pagers) as a shareable link for your human, with an optional password wall, and lets you update it in place at the same URL. If the human wants feedback, turn on comments (set_comments): viewers pin comments on the page, and list_comments / resolve_comment let you act on them. Publishes that contain live credentials are refused (secrets_detected); never put keys, passwords or .env contents on a page. Working sign-in or payment lookalikes that send what people type elsewhere can be refused (unsafe_page_detected). Pages are unlisted by default — indexed by search engines only if the maker turns that on later (Pro); anyone with the link can view. Full reference: https://pubspace.ai/llms.txt",
      "tools": [
        {
          "name": "claim_page",
          "title": "Keep a preview with an email link",
          "description": "For pages published without an API key (previews): ask PubSpace to email your human one link that keeps every page under a claim token. Callable without an API key. Only call it after the human has told you their email; never invent or guess one. Opening the link shows a Keep button; pressing it, or one bare POST to the link (do that if the human pastes it to you), moves the pages into a free PubSpace space at <name>.pubspace.ai (or into the account they already have, as many pages as its plan holds): the preview links redirect there and stop expiring, even after the 7 days. Pass claim_token from publish_page, or omit it in the session that published the preview. Returns { ok, sent, email, expiresInHours, tell_user }: relay tell_user. The answer is the same whether or not the address already has an account. Once the human clicks, the pages that moved answer preview_already_claimed: ask them for their API key to keep updating those. Pages that did not fit an existing account's plan stay previews; the claim token still updates them, and calling claim_page again keeps them once there is room. When every page has moved, the claim token stops working. Fails with invalid_email, disposable_email_not_allowed, email_opted_out, invalid_claim_token, preview_already_claimed or rate_limited.",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "description": "The claimToken publish_page returned. Optional in the MCP session that published the preview.",
                "type": "string"
              },
              "email": {
                "description": "The human's real email address, as they gave it to you. The claim link goes here.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf7c2046be3bf83139f331f9bd4cdf862543bc53e565b923dca9bbba655f0204"
        },
        {
          "name": "create_account",
          "title": "Create a PubSpace account for your human",
          "description": "Sign your human up for a free PubSpace space (no card) without leaving this session. Callable without an API key. Only call it after the human has told you their email and chosen a space name; never invent or guess either. Their pages will live at <subdomain>.pubspace.ai, so treat the name as permanent (renames are limited). A 6-digit verification code is emailed to them: ask them to read it to you, then call verify_email. Once verified, publish_page works in this same session. Returns { subdomain, email, apiKey, verificationRequired, connectHint }; persist the key with the connectHint command so future sessions start connected. Fails with email_taken (they already have an account: have them sign in and copy their key from Settings → Connect your agent), subdomain_taken, invalid_subdomain, invalid_email or rate_limited. If this session is already connected with a key, it fails with already_connected.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The human's real email address, as they gave it to you. The verification code goes here.",
                "type": "string"
              },
              "subdomain": {
                "description": "The space name the human chose: lowercase letters, numbers and hyphens. Becomes <subdomain>.pubspace.ai.",
                "type": "string"
              }
            },
            "required": ["email", "subdomain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:75b97cc372e66096a4d2559b850724e20f5d1a35c4a844c905a2bef7687a64ec"
        },
        {
          "name": "delete_page",
          "title": "Delete a page",
          "description": "Delete a page: its URL stops working at once. The maker gets only a brief undo in the dashboard, then it is purged for good (there is no restore tool). Only use it when the human asked for deletion; to hide a page reversibly, use unpublish_page instead. Returns { ok, id, deleted }; fails with page_not_found if the id is not in this space or is already deleted.",
          "inputSchema": {
            "properties": {
              "page_id": {
                "description": "The page id: the `id` field from publish_page or list_pages (also the last path segment of the page URL, …/docs/<page_id>). Only pages in the connected maker's space are visible.",
                "type": "string"
              }
            },
            "required": ["page_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0bc7ee83744f4b5291b3d3d27f00e1ec42da12b8256208ec2cdd5f1e820d8ab6"
        },
        {
          "name": "get_page",
          "title": "Get one page",
          "description": "Fetch one page by id: metadata always ({ id, title, url, project, views, live, workEmailGated, hasDraft, comments: { total, open }, createdAt, updatedAt, visibility }), plus the stored HTML when include_html is true. Read-only. Use it to read a page before editing it with update_page; use list_pages to find ids or browse. Fails with page_not_found if the id is not in this space or the page was deleted.",
          "inputSchema": {
            "properties": {
              "include_html": {
                "description": "Default false. true adds `html`: the document exactly as stored (the source you or the maker published, before serve-time injections). Can be large; only ask for it when you need the content.",
                "type": "boolean"
              },
              "page_id": {
                "description": "The page id: the `id` field from publish_page or list_pages (also the last path segment of the page URL, …/docs/<page_id>). Only pages in the connected maker's space are visible.",
                "type": "string"
              }
            },
            "required": ["page_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4c84f7461aa2921534d4f6974b8f38bc86fa5494c05c0bfb0b0156e7f67ade1"
        },
        {
          "name": "list_comments",
          "title": "Read comments on a page",
          "description": "Read the comments people left on a page: { page_id, url, commentsEnabled, threads: [{ id, resolved, on, comments: [{ id, author, body, createdAt }] }] }. Each thread is a pin someone dropped on the page; `on` is the text of the element they clicked, so you can tell what the comment is about without seeing the page. author is the commenter's full email. Read-only. Typical loop: list_comments → update_page with the fixes → resolve_comment on each thread you addressed. Open threads only unless include_resolved is true. Fails with page_not_found if the id is not in this space.",
          "inputSchema": {
            "properties": {
              "include_resolved": {
                "description": "Default false. true also returns resolved threads.",
                "type": "boolean"
              },
              "page_id": {
                "description": "The page id: the `id` field from publish_page or list_pages (also the last path segment of the page URL, …/docs/<page_id>). Only pages in the connected maker's space are visible.",
                "type": "string"
              }
            },
            "required": ["page_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:adb320c88ef0944987ec07c78c7475079364befd46f96c5a98b2224aae4ee9bb"
        },
        {
          "name": "list_pages",
          "title": "List pages",
          "description": "List every page in the maker's space, newest first, with no paging: { total, pages: [{ id, title, url, project, views, live, workEmailGated, hasDraft, comments: { total, open }, createdAt, updatedAt }] }. Read-only. Use it to find a page_id before update_page / get_page / unpublish_page / delete_page, or to reuse an existing project name. Offline pages are included (live: false); deleted pages are not. Pass q to search instead of scanning the full list; use get_page when you need one page's HTML.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Optional case-insensitive search over page titles and content. Omit to list everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c01072f16e953d8f8023f3c9a972011650c31d092725eff0063312560df4cef"
        },
        {
          "name": "publish_page",
          "title": "Publish a new page",
          "description": "Publish a new HTML (or Markdown) page to the maker's PubSpace space and get back a live, shareable URL to hand to the human. Pages are unlisted by default — indexed by search engines only if the maker turns that on later (Pro); anyone with the link can view. Use this only for a brand-new page; to change a page that already exists, call update_page so its URL stays the same (find the id with list_pages). Each call creates a page that counts toward the plan's live-page cap; at the cap the call fails with doc_limit_reached and, on the free plan, an upgrade link to relay to the human. Content that looks like live credentials (API keys, private keys, .env lines, database URLs with passwords) is refused with secrets_detected and the line numbers; remove them and retry. A page that works as a sign-in or payment form sending what people type to another site can be refused with unsafe_page_detected (no override): make such forms non-functional demos. Returns { url, id, mode, visibility, dashboardUrl }. Connected without an API key, it publishes a 7-day preview at a pubspace.page link instead (no account needed, up to 5 MB, no password, stricter sign-in lookalike check) and returns { url, id, mode, preview: true, expiresAt, claimToken, tell_user }: relay tell_user, and keep claimToken, the only way to change that page later (update_page with claim_token). Pass claim_token to add another page under the same token (up to 5 live previews). Later publishes in the same session join the first preview's token and do not return claimToken again: that first token covers them. To keep previews for good, call claim_page with the human's email.",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "description": "Keyless previews only: the claimToken from an earlier preview, to add this page under the same token. Ignored when connected with an API key.",
                "type": "string"
              },
              "html": {
                "description": "Full HTML document (or Markdown when source_type is \"markdown\"), up to 15 MB on the free plan and 20 MB on Pro, so self-contained pages with embedded images fit; a free account's pages and drafts total up to 100 MB (past that: storage_limit_reached). Served byte-faithful apart from documented meta/bar injections. Over 5 MB the result adds a sizeNote with tips to shrink it.",
                "type": "string"
              },
              "project": {
                "description": "Optional: which body of work this page belongs to (e.g. \"Q3 board pack\"). Groups pages in the maker's library — reuse their existing project names from list_pages when one fits. (Renamed from `product` in v0.16.0; the old name is still accepted.)",
                "type": "string"
              },
              "source_type": {
                "description": "Default \"html\".",
                "enum": ["html", "markdown"],
                "type": "string"
              },
              "title": {
                "description": "Optional title (used in the dashboard and social cards).",
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76d62cee82cd1dfae12380b400f20ce68a15868196a8b64c3b9203cc74272342"
        },
        {
          "name": "resolve_comment",
          "title": "Resolve a comment thread",
          "description": "Mark a comment thread resolved (or reopen it with resolved: false) after you have addressed it. The pin turns grey and drops out of the open list for everyone; nothing is deleted. Returns { ok, page_id, thread_id, resolved }. Fails with thread_not_found if the id is not an open-or-resolved thread on that page.",
          "inputSchema": {
            "properties": {
              "page_id": {
                "description": "The page id: the `id` field from publish_page or list_pages (also the last path segment of the page URL, …/docs/<page_id>). Only pages in the connected maker's space are visible.",
                "type": "string"
              },
              "resolved": {
                "description": "Default true. false reopens the thread.",
                "type": "boolean"
              },
              "thread_id": {
                "description": "A thread `id` from list_comments.",
                "type": "integer"
              }
            },
            "required": ["page_id", "thread_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a4270734df1f99957f02eebd62fa6dc21c8514bf018391b6e4cc7eca6acb0d25"
        },
        {
          "name": "set_comments",
          "title": "Turn comments on or off for a page",
          "description": "Turn click-to-pin comments on or off for a page. While on, anyone who can view the page can click a spot on it to comment once they sign in with their email (on a work-email-locked page, their viewing sign-in is enough); the maker gets an email per comment. Off hides comments without deleting them. Off by default. Returns { ok, page_id, commentsEnabled }. Use it when the human asks for feedback or review on a page.",
          "inputSchema": {
            "properties": {
              "enabled": {
                "description": "true turns comments on, false turns them off.",
                "type": "boolean"
              },
              "page_id": {
                "description": "The page id: the `id` field from publish_page or list_pages (also the last path segment of the page URL, …/docs/<page_id>). Only pages in the connected maker's space are visible.",
                "type": "string"
              }
            },
            "required": ["enabled", "page_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ae64c7370a4b28e04feb6bee81e2d24efe80b1d6c8bc86015bf510a7801b0975"
        },
        {
          "name": "unpublish_page",
          "title": "Take a page offline or back online",
          "description": "Take a page offline without deleting it: its URL shows an \"offline\" notice to viewers, and the content, id, URL and view count are kept. Pass restore: true to put it back online at the same URL. Prefer this over delete_page when the human wants a page hidden or paused. Calling it twice is harmless. Returns { ok, id, live }; fails with page_not_found if the id is not in this space.",
          "inputSchema": {
            "properties": {
              "page_id": {
                "description": "The page id: the `id` field from publish_page or list_pages (also the last path segment of the page URL, …/docs/<page_id>). Only pages in the connected maker's space are visible.",
                "type": "string"
              },
              "restore": {
                "description": "Default false (take offline). true = put the page back online.",
                "type": "boolean"
              }
            },
            "required": ["page_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ab49e07e6fc25b77d22926a452cf114edfa311c4419b6b29539a8b876f0da4bd"
        },
        {
          "name": "update_page",
          "title": "Replace a page's content",
          "description": "Replace the content of an existing page in place: the same URL serves the new content immediately, so links the human already shared keep working. Use this instead of publish_page whenever the page already exists. The previous version stays restorable from the dashboard for 7 days (Pro keeps full version history). Pass draft: true to stage the update instead: nothing changes for viewers until the maker reviews the previewUrl and presses \"Sync to live\"; use it when the human asked to see changes before they go out. Fails with page_not_found if the id is not a live or offline page in this space, and with secrets_detected (nothing changes) if the new content looks like it holds live credentials. A page that works as a sign-in or payment form sending what people type to another site can be refused with unsafe_page_detected (no override): make such forms non-functional demos. Connected without an API key, it updates a preview instead: pass the claim_token that publish_page returned (or omit it in the same session that published the page). The URL stays the same and the 7-day expiry does not move; previews have no drafts or version history. After the human claims the preview (claim_page), a page that moved into their account answers preview_already_claimed: reconnect with their API key to keep updating it. Pages that did not fit their plan stay previews and the claim token still updates them.",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "description": "Keyless previews only: the claimToken publish_page returned for this page. Ignored when connected with an API key.",
                "type": "string"
              },
              "draft": {
                "description": "Default false (publishes live instantly). true = stage the update; relay the returned previewUrl so the human can review and press Sync. A new draft replaces any pending one.",
                "type": "boolean"
              },
              "html": {
                "description": "The complete new document (not a diff). HTML, or Markdown when source_type is \"markdown\".",
                "type": "string"
              },
              "page_id": {
                "description": "The page id: the `id` field from publish_page or list_pages (also the last path segment of the page URL, …/docs/<page_id>). Only pages in the connected maker's space are visible.",
                "type": "string"
              },
              "project": {
                "description": "Optional; omit to keep the existing project.",
                "type": "string"
              },
              "source_type": {
                "description": "Default \"html\".",
                "enum": ["html", "markdown"],
                "type": "string"
              },
              "title": {
                "description": "Optional; omit to keep the existing title.",
                "type": "string"
              }
            },
            "required": ["html", "page_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3c24b2b1fb5e899d152723c79cd85a017bb2886e1bfa481992524b9a2f62bc7"
        },
        {
          "name": "verify_email",
          "title": "Verify the account email",
          "description": "Finish account verification with the 6-digit code PubSpace emailed to the human (ask them to read it to you). Publishing unlocks on success. Works in the session where create_account ran, or with an API key for an unverified account. Returns { ok, verified, subdomain }; fails with invalid_code (and attemptsRemaining), code_expired, too_many_attempts or already_verified.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The 6-digit code from the verification email.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:24152702fbf00f88d3b5b3689ce9f51357d206e1a46b649d4a84c3cf55212e1a"
        }
      ],
