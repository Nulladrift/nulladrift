      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Wizzair",
        "title": "Wizzair MCP",
        "version": "1.0.0",
        "description": "Wizzair fares, routes, timetables and flight details across its network.",
        "websiteUrl": "https://mcps.wondel.ai/servers/wizzair/",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Wizz Air (https://www.wizzair.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "wizzair_search_fares",
          "title": "Wizzair fares around a date",
          "description": "Cheapest Wizzair fare per day around a date (fare chart, ±day_interval days — up to a 19-day window). Returns one price per day in the route's local currency, plus return-leg days when return_date is set, and a wizzair.com fare-finder link. Data comes live from Wizzair's private booking API (unofficial — may briefly fail if Wizzair rotates or throttles it). Use wizzair_search_timetable for departure times, wizzair_search_flight_dates for operating days.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Number of adults. Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "arrival_station": {
                "description": "Arrival airport IATA code (3-letter, e.g. BCN).",
                "minLength": 3,
                "type": "string"
              },
              "children": {
                "description": "Number of children. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "date": {
                "description": "Center date of the window, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "day_interval": {
                "description": "Days around the date to include (±N). Default 9; Wizzair's minimum is 3 — lower values are bumped.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "departure_station": {
                "description": "Departure airport IATA code (3-letter, e.g. WAW).",
                "minLength": 3,
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh Wizzair fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "return_date": {
                "description": "Return-leg center date, YYYY-MM-DD. Omit for one-way.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "wdc": {
                "description": "Price with the Wizz Discount Club (WDC) membership discount. Default false.",
                "type": "boolean"
              }
            },
            "required": ["arrival_station", "date", "departure_station"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f076bc69c9567ec1e2975debc0d3aaeb9351c25f2e41267c1750dea14f83bb0f"
        },
        {
          "name": "wizzair_search_flight_dates",
          "title": "Wizzair operating dates on a route",
          "description": "Dates with available Wizzair flights on a route within a from/to window — the fastest way to see which days a route operates before asking for prices. Data comes live from Wizzair's private booking API (unofficial — may briefly fail if Wizzair rotates or throttles it).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "arrival_station": {
                "description": "Arrival airport IATA code (3-letter, e.g. BCN).",
                "minLength": 3,
                "type": "string"
              },
              "departure_station": {
                "description": "Departure airport IATA code (3-letter, e.g. WAW).",
                "minLength": 3,
                "type": "string"
              },
              "from_date": {
                "description": "Window start, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh Wizzair fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "to_date": {
                "description": "Window end, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["arrival_station", "departure_station", "from_date", "to_date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e229ce9743d278132f3107f595d3b0ecdd6e22cae40385577bf6345a383af4f"
        },
        {
          "name": "wizzair_search_flights",
          "title": "Wizzair flights with fare bundles (experimental)",
          "description": "EXPERIMENTAL: detailed Wizzair flights for exact dates with fare bundles (Basic/WIZZ Go/WIZZ Plus — base, discounted and WDC price per bundle, flight numbers, exact times). This endpoint sits behind Kasada bot protection and may return a rate-limited error — fall back to wizzair_search_timetable or wizzair_search_fares when it does. Data comes live from Wizzair's private booking API (unofficial — may briefly fail if Wizzair rotates or throttles it).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Number of adults. Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "arrival_station": {
                "description": "Arrival airport IATA code (3-letter, e.g. BCN).",
                "minLength": 3,
                "type": "string"
              },
              "children": {
                "description": "Number of children. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "departure_date": {
                "description": "Departure date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "departure_station": {
                "description": "Departure airport IATA code (3-letter, e.g. WAW).",
                "minLength": 3,
                "type": "string"
              },
              "infants": {
                "description": "Number of infants. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "no_cache": {
                "description": "Force a fresh Wizzair fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "return_date": {
                "description": "Return date, YYYY-MM-DD. Omit for one-way.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "wdc": {
                "description": "Price with the WDC membership discount. Default TRUE for this tool.",
                "type": "boolean"
              }
            },
            "required": ["arrival_station", "departure_date", "departure_station"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd74ac20e4c30592ae3350850a9e99385ea79c089d8406d28ec2e6db62d99cef"
        },
        {
          "name": "wizzair_search_routes",
          "title": "Wizzair route network",
          "description": "Wizzair's route map: pass a station IATA code to list its direct connections (city, country, is_new), or omit it to list every Wizzair city with its destination count. Cached for 6 hours. Data comes live from Wizzair's private booking API (unofficial — may briefly fail if Wizzair rotates or throttles it). Result shape: { source, fetchedAt, query, mode, count, route_map_url, ... }. With station: mode='single_station', station, station_name, country, connections: [{ iata, city, country, is_new }]. Without: mode='all_cities', cities: [{ iata, city, country, country_code, destinations }]. The list key is `connections` (or `cities`), never `routes`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "no_cache": {
                "description": "Force a fresh Wizzair fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "station": {
                "description": "Station IATA code to list connections from (e.g. WAW). Omit to list all Wizzair cities.",
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "cities": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "country_code": {
                      "type": "string"
                    },
                    "destinations": {
                      "type": "number"
                    },
                    "iata": {
                      "type": "string"
                    }
                  },
                  "required": ["city", "country", "country_code", "destinations", "iata"],
                  "type": "object"
                },
                "type": "array"
              },
              "connections": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "iata": {
                      "type": "string"
                    },
                    "is_new": {
                      "type": "boolean"
                    }
                  },
                  "required": ["city", "country", "iata", "is_new"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "number"
              },
              "country": {
                "type": "string"
              },
              "fetchedAt": {
                "type": "string"
              },
              "mode": {
                "enum": ["single_station", "all_cities"],
                "type": "string"
              },
              "query": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "route_map_url": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "station": {
                "type": "string"
              },
              "station_name": {
                "type": "string"
              }
            },
            "required": ["count", "fetchedAt", "mode", "query", "route_map_url", "source"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07d310d72e15892bf8b002990b4ed614123d5f4b0a074ea290449435042cbfc6"
        },
