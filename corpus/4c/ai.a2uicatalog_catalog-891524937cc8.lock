          "description": "CALL THIS FIRST, before any other a2ui-catalog tool, once per session. Declares your own model identity so this response can hand you capability-matched guidance up front — some models need simpler, judgment-free tools; skipping this just means you default to the full toolkit, including tools that require sizing/pagination judgment calls.\n\nHOW TO ANSWER — do not guess:\n- Copy your model name EXACTLY as stated in your own system prompt or developer context (look for phrasing like \"you are powered by the model named X\" or similar). Do NOT infer it from your training cutoff, your own behavior, or general capability.\n- Examples of valid values: \"claude-haiku-4-5\", \"claude-sonnet-5\", \"claude-opus-4-8\", \"gemini-2.0-flash\", \"gpt-4o\". Partial names are fine (\"haiku\", \"sonnet\").\n- If your model name is genuinely not stated anywhere in your context, pass \"unknown\" — do NOT guess a plausible-sounding value. A wrong report is worse than no report: it can hand you tools you cannot reliably operate.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Your own model identifier, exactly as your system prompt states it, or \"unknown\" if not stated. Do not guess.",
                "type": "string"
