        {
          "name": "open_workspace",
          "description": "Open the A2UI Workspace — a rendered surface that IS the demo: each tool is introduced by the scenario it answers, then wired to run, then shows what it saved. This tool RENDERS ITSELF: its result carries the view, so call it alone and show the result — do NOT pass it on to render_surface, and do not describe the payload in prose. Call it when the user asks to open the workspace, wants to see what this connector can do, asks what is saved about them, or names one of its tools directly — e.g. \"open the Wall Builder\" means THIS tool with view: \"wall_builder\", not a separate tool named wall_builder. It shows a display name they chose, never their email.",
          "inputSchema": {
