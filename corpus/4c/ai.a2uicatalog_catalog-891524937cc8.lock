        {
          "name": "deck_build",
          "description": "Build a PowerPoint (.pptx) file from a scene list or an A2UI payload. Deterministic (same input, same bytes), nothing is stored or fetched, text is fitted with real font metrics and the file is linted (overlap, bounds, contrast, alt text). Returns the file as an embedded resource plus a report: errors, lint, warnings and unsupported atoms. Opens in PowerPoint and Google Slides (checked in Google Slides). Demo limit: 10 builds a day per connection.",
          "inputSchema": {
            "properties": {
              "deck": {
                "description": "A typed scene list: {\"title\",\"target\",\"scenes\":[{\"type\":\"title|bullets|stats|quote|table|media|cta\",\"f\":{...fields...},\"notes\":\"speaker notes\"}]}. Same scene fields as make_film (eyebrow, headline, sub, kicker, stats as [value,label] pairs, steps/items, quote, name, role, b1/l1, foot). Call deck_schema for every layout and limit. Give deck OR payload."
              },
              "delivery": {
                "description": "How the .pptx comes back. link (default): a download link valid for one hour, which works in every client including chat apps that cannot receive attachments. file: the .pptx as an embedded resource, for clients that save attachments (Claude Desktop, Claude Code). both: the two together.",
                "enum": ["link", "file", "both"],
                "type": "string"
              },
              "payload": {
                "description": "An A2UI payload {\"blocks\":[{\"type\":\"quote\",...},...]}: each atom with a slide recipe becomes slides, others are listed under `unsupported`, never guessed. deck_schema lists the atoms. Give payload OR deck."
              },
              "skip_film_only": {
                "description": "For a scene list that came from a film: leave out scenes with no slide layout (chart, chat, word, morph, captions, image) instead of treating them as errors.",
                "type": "boolean"
              },
              "target": {
                "description": "Where the file will be opened. google-slides fits text tighter; powerpoint and any keep a 12% margin for a substituted font. Default any. Ask the user if you do not know.",
                "enum": ["google-slides", "powerpoint", "any"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Build a PPTX"
          },
