        {
          "name": "make_surface_url",
          "description": "Render an A2UI payload in the CALLER'S OWN environment. Pass renderer_url (your deployed renderer /exec) and get a live URL + the catalogs it declares. Omit renderer_url to get the encoded fragment + BYO guidance. We host nothing and never see your content.\n\nNEVER hand-write your own gzip/base64 encoding for the ?p= URL, in ANY language, even as a \"just this once\" fallback. This is the single most common cause of \"could not decompress gzip\" — a self-written encoder with one wrong flag (wrong wbits, standard vs. urlsafe base64, un-stripped padding) produces a broken URL at ANY size, not just large ones. Always call this tool again — never substitute your own implementation.\n\nSIZING IS AUTOMATIC — you do not need to estimate, count characters, or decide whether to split. Call this tool ONCE with your FULL, unsplit payload. If it fits, you get back `url` (and nothing else to do). If it does not fit the real size ceiling, the tool SPLITS IT FOR YOU server-side (at natural heading boundaries) and returns `auto_split: true` plus a `pages` array of independent URLs — present that list to the user (e.g. as numbered links) instead of the single `url`. Never pre-split your content before the first call; always send everything in one call and let the response tell you what happened.\n\nGRADUATE substantial surfaces with emit_deployment instead (no size limit at all) when you want a standing app rather than a shareable link.\n\nIF A RENDER CHECK REPORTS \"could not decompress gzip\" / \"Render error\" / \"invalid distance too far back\" on a URL this tool returned: STOP. Do NOT call this tool again with the SAME unchanged payload — re-call it with the SAME payload once to confirm, and if it still fails, use emit_deployment instead. Never fall back to a hand-written encoding script.",
          "inputSchema": {
            "properties": {
              "payload": {
                "description": "The A2UI payload to encode into a ?p= URL: {title, theme, blocks:[...]}. Send it whole; oversize payloads are split for you.",
                "properties": {
                  "blocks": {
                    "description": "A2UI blocks-dialect atoms (see list_catalogs / get_catalog)",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "theme": {
                    "enum": ["light", "dark", "terminal"],
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["blocks"],
                "type": "object"
              },
              "renderer_url": {
                "description": "your renderer /exec (BYO). Omit for fragment + guidance.",
                "type": "string"
              }
            },
            "required": ["payload"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "auto_split": {
                "description": "True when the payload was split into pages.",
                "type": "boolean"
              },
              "clipboard": {
                "additionalProperties": true,
                "description": "Optional ready-made copy commands for the URL (linux, macos, windows) plus a note.",
                "properties": {
                  "note": {
                    "description": "How to use these.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "fragment": {
                "description": "The ?p= fragment to append to your own renderer (present when renderer_url was omitted).",
                "type": "string"
              },
              "note": {
                "description": "Guidance for the caller.",
                "type": "string"
              },
              "page_count": {
                "description": "Number of pages when split.",
                "type": "integer"
              },
              "pages": {
                "description": "One entry per page, each with a url.",
                "items": {
                  "additionalProperties": true,
                  "description": "A page.",
                  "properties": {
                    "heading": {
                      "description": "Page heading, when the page came from a section.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Page URL.",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "type": "array"
              },
              "required_catalogs": {
                "description": "Catalog URIs the payload needs (base catalog first).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "size": {
                "additionalProperties": true,
                "description": "Present when the URL is large: url_length, warning and recommendation.",
                "properties": {
                  "recommendation": {
                    "description": "What to do instead.",
                    "type": "string"
                  },
                  "url_length": {
                    "description": "Characters the URL is once the gas/ stable link is followed.",
                    "type": "integer"
                  },
                  "warning": {
                    "description": "Why the length matters.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "url": {
                "description": "Live renderer URL (present when renderer_url was given; the first page when split).",
                "type": "string"
              }
            },
            "required": ["required_catalogs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
