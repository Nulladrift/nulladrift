        {
          "name": "publish_url",
          "description": "STORES the payload server-side and returns a SHORT shareable link. Opt-in only: requires acknowledge_storage=true — confirm with the user first that they accept operator-hosted storage (ONE WEEK retention on the public tier, revocable earlier via the returned delete_token; anyone with the link can view). target \"play\" (default) renders in the a2uicatalog playground by reference (no URL size ceiling); target \"gas\" makes the short link redirect to the public Apps Script renderer. For storage in the USER's own account use emit_deployment; for nothing-stored links use preview_url.",
          "inputSchema": {
            "properties": {
              "acknowledge_storage": {
                "description": "MUST be true — affirms the user consented to server-side storage",
                "type": "boolean"
              },
              "alias": {
                "description": "optional vanity name for the link (/s/<alias>) — first-come, frees when the link expires",
                "type": "string"
              },
              "payload": {
                "description": "The A2UI payload to store and share: {title, theme, blocks:[...]}, up to 100 KB serialised.",
                "properties": {
                  "blocks": {
                    "description": "A2UI blocks-dialect atoms (see list_catalogs / get_catalog)",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "theme": {
                    "enum": ["light", "dark", "terminal"],
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["blocks"],
                "type": "object"
              },
              "target": {
                "description": "Where the short link opens: \"play\" (default) the a2uicatalog playground by reference, \"gas\" the public Apps Script renderer.",
                "enum": ["play", "gas"],
                "type": "string"
              },
              "ttl_days": {
                "description": "OPERATOR-ONLY (authenticated requests): retention override; 0 = permanent. Public tier is fixed at one week.",
                "type": "number"
              }
            },
            "required": ["acknowledge_storage", "payload"],
            "type": "object"
          },
          "outputSchema": {
