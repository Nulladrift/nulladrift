        {
          "name": "emit_runbook_surface",
          "description": "Stamp your content through a DECLARED runbook — a pre-authored, judgment-free surface composition. You supply content only; the runbook supplies the composition (which atoms, how arranged, navigation). DISCOVERY: call with runbook_id only (no content) to get that runbook's input_contract + parsing_guide — shape your source data to the contract (parsing is your job as the consumer), then call again with `content`. Some runbooks also return `elicit` — questions to ASK THE USER before you fill the contract. Ask them; do not guess the answers.\nON SUCCESS YOU GET BOTH `payload` AND `url`, AND THEY ARE NOT THE SAME OFFER. `payload` is the compiled surface — pass it STRAIGHT to render_surface and the reading appears inline, in the conversation, where the reader already is. `url` is the shareable link, for later or for elsewhere. Default to rendering: handing back only a link makes the reader leave to see the thing they asked for. If the reading was too large to encode as a link you get `payload` and `url_unavailable` instead — that is a SUCCESS, so render it and say the link is missing.\nAvailable stampable runbooks: (1) learning_hub — curriculum/revision study app: subject tabs, slide pills, timeline/drill/flashcards/quiz/takeaways/method interactions per slide, the full rich hub UI. Prefer this over emit_training_runbook for study/curriculum content — much richer output, still zero composition decisions. (2) article_playbook — a steered critical reading of SOMEONE ELSE'S article: source attribution bar, a hero mental-model card, then rungs down a rail. The reader picks a lens (explain, apply to their domain, challenge, situate in prior art) and says what they want it to look for; the rung progression is Toulmin (claim → grounds → warrant) so the analysis lands on the assumption a summary drops. Use it whenever asked to analyse, critique, tear down, or work out what an article means for a particular domain. You fetch and read the article yourself; nothing is retrieved server-side.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "Your content shaped to the runbook's input_contract. Omit to get the contract back instead of a URL.",
                "type": "object"
              },
              "renderer_url": {
                "description": "Your deployed renderer /exec URL (optional; defaults to the public demo renderer)",
                "type": "string"
              },
              "runbook_id": {
                "description": "Stampable runbook name. \"learning_hub\" = curriculum/study app from content you supply. \"article_playbook\" = a steered critical reading of someone else's article (you fetch and read it yourself; the runbook supplies the composition and the method). Call with this alone, no `content`, to get the contract and any questions to ask the user.",
                "enum": ["article_playbook", "learning_hub"],
                "type": "string"
              },
              "source": {
                "description": "The source the USER supplied (workspace surfaces pass this; you normally do not). {url?, text?}. Echoed back in the discovery response so you read THAT source rather than asking for it again. Ignored when `content` is present — by then the reading is done.",
                "properties": {
                  "text": {
                    "description": "Source text the reader pasted or dropped in, when they had no fetchable URL.",
                    "type": "string"
                  },
                  "url": {
                    "description": "The article URL the reader gave. Fetch it yourself.",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["runbook_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "emit_runbook_surface"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
