          "inputSchema": {
            "properties": {
              "renderer_url": {
                "description": "Your deployed renderer /exec URL (optional; defaults to BYO)",
                "type": "string"
              },
              "sections": {
                "description": "Array of {heading, content} sections",
                "items": {
                  "properties": {
