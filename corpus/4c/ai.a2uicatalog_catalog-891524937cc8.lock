        {
          "name": "diagram_studio",
          "description": "Draw a diagram in-chat with the full Diagram Studio interface (MCP Apps hosts only; it opens fullscreen where the host allows it). YOU write the diagram; nothing is generated server-side and nothing is stored. PREFER `graph`: give vertices (id, label, type start|process|decision|database|cloud|end) and edges (source, target, optional label). The person then gets the whole studio: they can switch the same graph between Mermaid, D2, PlantUML and draw.io, flip its direction, zoom, copy the code, open it in the real draw.io editor with one click, and edit nodes and connections themselves (their edits come back to you). Use `syntax` with `source` instead only for diagrams a flow graph cannot express, drawn exactly as written: \"mermaid\" for sequence, class, state, ER, gantt and mind maps; \"d2\" for architecture diagrams with containers and nested boxes. Give exactly one of `graph` or `syntax` with `source`. Keep diagrams compact (the input schema states the limits). If the tool or the view reports a problem, fix it and call this tool again. On a host without MCP Apps support the diagram comes back as text.",
          "inputSchema": {
            "properties": {
              "direction": {
                "description": "Graph layout direction: TB (top to bottom, default) or LR.",
                "enum": ["TB", "LR"],
                "type": "string"
              },
              "format": {
                "description": "Which format the view opens on. Default mermaid; mermaid and d2 draw a picture.",
                "enum": ["mermaid", "d2", "plantuml", "drawio"],
                "type": "string"
              },
              "graph": {
                "description": "The diagram as a graph (preferred).",
                "properties": {
                  "edges": {
                    "description": "The connections. Loops back to an earlier node are fine.",
                    "items": {
                      "properties": {
                        "label": {
                          "description": "Optional: a condition such as Yes / No.",
                          "maxLength": 60,
                          "type": "string"
                        },
                        "source": {
                          "description": "The id of the node it leaves.",
                          "type": "string"
                        },
                        "target": {
                          "description": "The id of the node it enters.",
                          "type": "string"
                        }
                      },
                      "required": ["source", "target"],
                      "type": "object"
                    },
                    "maxItems": 400,
                    "type": "array"
                  },
                  "vertices": {
                    "description": "The nodes.",
                    "items": {
                      "properties": {
                        "id": {
                          "description": "Unique within the graph; any short text. Edges refer to it.",
                          "maxLength": 40,
                          "type": "string"
                        },
                        "label": {
                          "description": "Short (two to five words reads best). Decision nodes: a question.",
                          "maxLength": 80,
                          "type": "string"
                        },
                        "type": {
                          "description": "The shape. Defaults to process.",
                          "enum": ["start", "process", "decision", "database", "cloud", "end"],
                          "type": "string"
                        }
                      },
                      "required": ["id", "label"],
                      "type": "object"
                    },
                    "maxItems": 200,
                    "type": "array"
                  }
                },
                "required": ["vertices"],
                "type": "object"
              },
              "source": {
                "description": "Only with `syntax`: a complete diagram, drawn as written.",
                "maxLength": 20000,
                "type": "string"
              },
              "syntax": {
                "description": "Only with `source`: the language of that source.",
                "enum": ["mermaid", "d2"],
                "type": "string"
              },
              "theme": {
                "description": "Colours for the draw.io output. Default modern_indigo.",
                "enum": ["modern_indigo", "vibrant_cloud", "warm_amber", "monochrome"],
                "type": "string"
              },
              "title": {
                "description": "Optional heading shown above the diagram.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
