        {
          "name": "make_film",
          "description": "Make a short motion film (a social clip, launch teaser, quote card...) built by the A2UI Design Studio: you choose a template and supply the words; the studio builds the film. Use this instead of composing motion_timeline blocks yourself. It plays inline here and comes with a link that opens in the A2UI Studio app on Android, where the user can edit the text and export MP4 or GIF on the phone.\n\nBEFORE CALLING, ask the user in one short message for what you do not know: what it is about (the hook line), any real numbers with their labels, the call to action, and where it will be posted (portrait 9:16 for LinkedIn/Instagram/stories, 16:9 for slides or YouTube, 1:1 for a quote card). Never invent statistics: with no real numbers, use scenes without a Numbers or Chart scene.\n\nTemplates (each a ready scene sequence; pass `scenes` to replace it):\nlaunch: Product launch, Title, numbers, phone, call to action (16:9; scenes title > stats > device > cta)\ndata: Data story, Chart, numbers, steps (16:9; scenes title > chart > stats > steps)\nagent: Agent demo, Chat, particle word, CTA (16:9; scenes chat > word > cta)\nquote: Quote card, A quote and a name (1:1; scenes quote > cta)\nhook: LinkedIn hook, Portrait: captions, numbers, CTA (9:16; scenes captions > stats > cta)\nclient: Client feature demo, Title, features that light up beside your pictures, CTA (16:9; scenes title > features > cta)\nevent: Event promo, Particle word, title, photo, CTA (16:9; scenes word > title > morph > cta)\n\nScene types and their fields (`fields` keys; text supports *word* for the accent colour; list fields take one item per line in the format the label gives):\ntitle (Title): eyebrow = Eyebrow; headline = Headline (use *word* for accent); sub = Subline\nstats (Numbers): kicker = Kicker; stats = Stats, one per line: value | label; roll = Number style\nchart (Chart): heading = Heading; kind = Chart; data = Data, one per line: label value; unit = Unit\nchat (Chat): heading = Heading; messages = Messages, alternating you / agent\nword (Particle word): word = Word (A-Z 0-9, up to 12); sub = Subline\nfeatures (Feature walkthrough): heading = Heading; features = Features (2-6): a title, a line of detail and an optional picture each; images = \ncollage (Collage swap): heading = Heading; sets = Sets of tiles, up to 4, separated by a blank line. One tile per line: label | optional picture link (2-6 tiles a set); hold = Seconds each set stays (0.8 to 8); swap = Seconds the swap and outline change take (0.4 to 3); fx = Panel outline\nbubbles (Bubbles title): heading = Heading; count = Bubbles (2-14)\nbeats (Beat countdown): items = One word or number per beat, 2-8 lines (fades; keep each beat over 0.35 s)\ndock (Icon dock): heading = Heading; items = Icons, one per line: glyph | name (2-7)\nlit (Cards light up): heading = Heading; cards = Cards, one per line: title | text (2-6)\narcs (Arc mark): heading = Heading; effect = Effect\nlockup (Centred lockup): lines = Lines, one per line; write {mark} where the arc mark goes (up to 4 lines); effect = Effect\npattern (Text pattern): text = Repeated text; word = One word turned on its side (optional); angle = Angle (-90 to 90)\nfit (Fill-the-width word): word = Word (up to 20 characters); recede = Recede at the end; effect = Effect\nmorph (Shape morph): heading = Heading; shapes = Shapes (comma list; also panel, notch, step, tab); wide = Wide panel (1.78:1); effect = Effect\nimage (Photo): heading = Heading; url = Image URL (https); caption = Caption\ndevice (Phone): heading = Heading; items = Checklist on the phone\ncaptions (Captions): sentence = Sentence (lights word by word)\nsteps (Steps): heading = Heading; steps = Steps, one per line (2-6)\nquote (Quote): quote = Quote; name = Name; role = Role\ncta (Call to action): headline = Headline; b1 = Button 1 text; l1 = Button 1 link; b2 = Button 2 text; l2 = Button 2 link; foot = Footer line\n\nGive the user the returned `link` as well as showing the film.",
          "inputSchema": {
            "properties": {
              "aspect": {
                "description": "Override the template aspect.",
                "enum": ["16:9", "9:16", "1:1"],
                "type": "string"
              },
              "look": {
                "description": "Colour preset. Default: the template's.",
                "enum": ["a2ui", "amber-night", "linkedin-blue", "ocean", "mint", "violet", "paper"],
                "type": "string"
              },
              "pace": {
                "description": "Timing preset for scene length and transitions. Default: the template's.",
                "enum": ["calm", "standard", "punchy"],
                "type": "string"
              },
              "scenes": {
                "description": "Scenes in order, replacing the template's. Omit to keep the template's scenes with its sample words.",
                "items": {
                  "properties": {
                    "fields": {
                      "description": "Field values for this scene type (see the list above); missing ones keep their defaults.",
                      "type": "object"
                    },
                    "transition": {
                      "enum": ["dissolve", "push", "rise", "blur", "zoom-through", "whip", "wipe", "iris", "clock", "slice", "flip", "spin", "ribbon", "cut"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["title", "stats", "chart", "chat", "word", "features", "collage", "bubbles", "beats", "dock", "lit", "arcs", "lockup", "pattern", "fit", "morph", "image", "device", "captions", "steps", "quote", "cta"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "template": {
                "description": "Starting template.",
                "enum": ["launch", "data", "agent", "quote", "hook", "client", "event"],
                "type": "string"
              },
              "title": {
                "description": "Film title (also the file name when exported).",
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "make_film"
          },
          "behavior": {
