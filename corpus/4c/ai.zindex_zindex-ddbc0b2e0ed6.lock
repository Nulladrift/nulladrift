                    },
                    "type": "array"
                  }
                },
                "required": ["added", "removed", "updated"],
                "type": "object"
              },
              "hash": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "noop": {
                "type": "boolean"
              },
              "replayed": {
                "type": "boolean"
              },
              "revision": {
