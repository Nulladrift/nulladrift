        {
          "name": "diagram_edit",
          "title": "Change a diagram",
          "description": "Changes a saved diagram as a new revision; old ones stay. Give baseRevision (the revision you last read), a one-line message, and ops (typed operations, https://zindex.ai/schemas/ops.schema.json), mermaid (the whole diagram edited from view mermaid; only differences apply), restoreRevision (an earlier version back), or brief. An edit with an error saves nothing; one that changes nothing returns noop. requestId makes a retry return the first result. A conflict lists what changed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "baseRevision": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "brief": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Replace the brief; null removes it"
              },
              "id": {
                "description": "Diagram id or key",
                "type": "string"
              },
              "mermaid": {
                "description": "The whole diagram as Mermaid; not with ops or restoreRevision",
                "maxLength": 65536,
                "type": "string"
              },
              "message": {
                "description": "One line on what the edit does and why",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "ops": {
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              },
              "requestId": {
                "description": "Your id for this edit, e.g. a UUID",
                "maxLength": 255,
                "minLength": 1,
                "pattern": "^[!-~]+$",
                "type": "string"
              },
              "restoreRevision": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "properties": {
                      "asOf": {
                        "type": "string"
                      }
                    },
                    "required": ["asOf"],
                    "type": "object"
                  }
                ],
                "description": "A revision number, or { asOf } for the version current at that instant"
              }
            },
            "required": ["baseRevision", "id", "message"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
