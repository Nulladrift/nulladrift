      "instructions": "Immutable agent diagrams. Zindex keeps every saved version exactly, so a diagram made in one conversation can be found, changed and rendered the same way later, from any MCP client.\n\nLoop: diagram_find first (or the id in .zindex.json); edit the one the person means rather than copy it, else diagram_create. Then diagram_get, diagram_edit, diagram_render. Edits need baseRevision (the revision you last read) and a one-line message. A page you publish shows a saved version (diagram_render), never a diagram you draw yourself.\n\n- diagram_get returns a compact outline; knownRevision returns what changed since.\n- Mermaid erDiagram, flowchart, sequenceDiagram: diagram_create takes it, diagram_get view mermaid returns it, diagram_edit applies what changed (architecture, flowchart, ER, sequence). Node IDs are the Mermaid IDs.\n- On REVISION_CONFLICT the error lists what changed; re-plan.\n- Give every diagram a key and a brief: the next agent finds it by them and reads the brief. Retries are safe: key on diagram_create, requestId on diagram_edit.\n- Element IDs are yours and stable; reuse them.\n- Auto-layout is the default: leave layout off nodes and the engine places them (text and image elements need a layout). Placed nodes stay put unless an edit needs the room, changes their frame or adds an order constraint; resizeElement with anchor \"left\" (\"top\" in TB, flowcharts' default) grows one in place. autoLayout lays out again; without elements it also drops most frames' own layout.\n- Lanes: a pool frame (containerType pool, laneDirection) whose children are lane frames listing the tasks; no layouts. createNode's frame adds a task.\n- Each key or sign-in works in one workspace; everyone in it reads its diagrams. READ_ONLY: read access or a viewer's role; don't retry.\n- Docs: https://zindex.ai/docs/tools/\n- Keep a .zindex.json's revision current; add one only if the person wants it.\n- When the docs and the engine disagree, or something is missing, say so; if the person wants Zindex told, diagram_share action feedback sends it.",
      "tools": [
        {
          "name": "diagram_create",
