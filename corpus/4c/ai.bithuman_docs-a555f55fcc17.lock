{
  "lockfileVersion": 2,
  "subjects": {
    "ai.bithuman/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docs.bithuman.ai/docs-mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bithuman-docs",
        "title": "bitHuman docs",
        "version": "1.0.0",
        "websiteUrl": "https://docs.bithuman.ai/resources/agents#docs-mcp",
        "icons": [
          {
            "src": "https://docs.bithuman.ai/favicon.png",
            "mimeType": "image/png",
            "sizes": ["128x128"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "bitHuman documentation (https://docs.bithuman.ai). Use `search` to find pages and `fetch` to read one as markdown; the index is https://docs.bithuman.ai/llms.txt.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a bitHuman docs page",
          "description": "Fetch one docs page as markdown by the id `search` returned (a path such as /platforms/python), or by its full docs.bithuman.ai URL. Returns JSON {id, title, text (the whole page as markdown), url, metadata}. Example: {\"id\": \"/api/agents\"}. Errors: an unknown path (run `search` for the id) and a URL outside docs.bithuman.ai are refused. Read-only, no sign-in.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "A page path (/platforms/python) or URL (https://docs.bithuman.ai/platforms/python).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a bitHuman docs page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90f2fc94ec761f4e56817bc9261db40aa63f65873f11173846396c81645a7ffc"
        },
        {
          "name": "search",
          "title": "Search the bitHuman docs",
          "description": "Search docs.bithuman.ai (bitHuman real-time avatar SDKs, the REST API, deployment options, models, pricing). Returns JSON {results: [{id, title, url, section, text}]}, most relevant first (default 8, at most 20); `text` is a short snippet, so pass the `id` to `fetch` for the whole page. Example: {\"query\": \"create an agent and poll status\", \"section\": \"API reference\"}. An empty query is an error; no match returns an empty list (try fewer or other words, or drop `section`). The REST contract as OpenAPI 3.1 JSON: https://docs.bithuman.ai/openapi.json.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many results, 1 to 20 (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"Android first frame\" or \"LiveKit secret\".",
                "type": "string"
              },
              "section": {
                "description": "Limit to one section.",
                "enum": ["Overview", "Platforms", "Models", "Guides", "Deploy", "Performance", "API reference", "Get started", "Resources", "Build", "API"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the bitHuman docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:555df1a94f91012b339c29790ca83ad61997a56b23a3e71b396cffef919052df"
        }
      ],
      "digest": "sha256:eb77d9df588b93483417cdf1bfe6a1564acc743029fb1c10ebd54a9f5589acf7"
    }
  }
}
