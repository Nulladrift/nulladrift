                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "attendance": {
                      "properties": {
                        "absences": {
                          "type": "integer"
                        },
                        "recent": {
                          "items": {
                            "properties": {
                              "code": {
                                "type": "string"
                              },
                              "date": {
                                "type": "string"
                              },
                              "description": {
                                "type": "string"
                              },
                              "period": {
                                "type": "string"
                              }
                            },
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "tardies": {
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "attention": {
                      "description": "Flags from the fixed rules, most urgent first.",
                      "items": {
                        "properties": {
                          "course": {
                            "type": ["string", "null"]
                          },
                          "detail": {
                            "type": "object"
                          },
                          "item": {
                            "type": ["string", "null"]
