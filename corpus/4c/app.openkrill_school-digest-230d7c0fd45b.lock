        {
          "name": "make_school_digest",
          "title": "Make a daily school page",
          "description": "Use this when the user wants a printable daily school page from a Canvas snapshot they already have, for example \"make today's page from this Canvas JSON\".\nReturns: one section per child with grades, due today, the next 7 days, missing and late, recent scores, announcements, attendance, changes, attention flags, page_text and html.\nInput tips: send date (YYYY-MM-DD), run_at (ISO time) and canvas, the Canvas API JSON with observees [{id, name}], courses [{id, name, teachers, enrollments}], assignments as an object keyed by course id, and announcements. Optional: timezone (IANA name), infinite_campus {students: [...]}, parentsquare_emails for ParentSquare mail, notice_emails for any other school notice, previous (yesterday's full request, same shape) for the changes block, and summaries as up to 3 lines per child name.\nNot for: fetching live Canvas data, logging in, storing grades, or answering without a snapshot (ask the user to export one). Never send a token or a password.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "canvas": {
                "description": "Canvas API JSON from a parent observer account, such as {\"observees\": [{\"id\": 1, \"name\": \"River Sample\"}], \"courses\": [...], \"assignments\": {\"11\": [...]}, \"announcements\": []}. No token.",
                "properties": {
                  "announcements": {
                    "description": "Announcements with id, title, message, posted_at, context_code such as \"course_11\", and author {display_name}.",
                    "items": {
                      "type": "object"
                    },
                    "maxItems": 80,
                    "type": "array"
                  },
                  "assignments": {
                    "additionalProperties": {
                      "items": {
                        "type": "object"
                      },
                      "maxItems": 80,
                      "type": "array"
                    },
                    "description": "Object keyed by course id, each a list of up to 80 assignments with id, name, due_at, points_possible and submission {user_id, workflow_state, score, graded_at, missing, late}.",
                    "type": "object"
                  },
                  "courses": {
                    "description": "Courses with id (integer), name, teachers [{display_name}] and enrollments [{type: \"student\", user_id, computed_current_score, computed_current_grade}].",
                    "items": {
                      "properties": {
                        "course_code": {
                          "type": "string"
                        },
                        "enrollments": {
                          "items": {
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "id": {
                          "type": "integer"
                        },
                        "name": {
                          "type": "string"
                        },
                        "teachers": {
                          "items": {
                            "type": "object"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["enrollments", "id"],
                      "type": "object"
                    },
                    "maxItems": 40,
                    "type": "array"
                  },
                  "observees": {
                    "description": "One entry per child: id (integer) and name.",
                    "items": {
                      "properties": {
                        "id": {
                          "type": "integer"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["id", "name"],
                      "type": "object"
                    },
                    "maxItems": 8,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "date": {
                "description": "The report day in the school time zone, as YYYY-MM-DD, such as \"2026-10-08\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "infinite_campus": {
                "description": "Optional Infinite Campus grade snapshot. Each student is matched to a Canvas observee by firstName and lastName.",
                "properties": {
                  "students": {
                    "items": {
                      "properties": {
                        "attendance": {
                          "properties": {
                            "events": {
                              "items": {
                                "properties": {
                                  "code": {
                                    "type": "string"
                                  },
                                  "date": {
                                    "type": "string"
                                  },
                                  "description": {
                                    "type": "string"
                                  },
                                  "period": {
                                    "type": "string"
                                  }
                                },
                                "type": "object"
                              },
                              "type": "array"
                            }
                          },
                          "type": "object"
                        },
                        "courses": {
                          "items": {
                            "properties": {
                              "courseName": {
                                "type": "string"
                              },
                              "progressPercent": {
                                "type": "number"
                              },
                              "progressScore": {
                                "type": "string"
                              },
                              "sectionNumber": {
                                "type": "string"
                              }
                            },
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "firstName": {
                          "type": "string"
                        },
                        "grade": {
                          "type": "string"
                        },
                        "lastName": {
                          "type": "string"
                        },
                        "schoolName": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 8,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "notice_emails": {
                "description": "Any other school notice emails, same format and limits. Plain text with From, Subject and Date headers, a blank line, then the body. Up to 30 emails of 12000 characters each. Optional.",
                "items": {
                  "maxLength": 12000,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "parentsquare_emails": {
                "description": "ParentSquare notice emails. Plain text with From, Subject and Date headers, a blank line, then the body. Up to 30 emails of 12000 characters each. Optional.",
                "items": {
                  "maxLength": 12000,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "previous": {
                "description": "Optional: yesterday's full request with its own date, run_at, timezone and canvas (and infinite_campus, if any), for the changes block.",
                "properties": {
                  "canvas": {
                    "type": "object"
                  },
                  "date": {
                    "type": "string"
                  },
                  "infinite_campus": {
                    "type": "object"
                  },
                  "run_at": {
                    "type": "string"
                  },
                  "timezone": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "run_at": {
                "description": "When the snapshots were taken, as an ISO time, such as \"2026-10-08T12:00:00Z\".",
                "format": "date-time",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "summaries": {
                "additionalProperties": {
                  "items": {
                    "maxLength": 180,
                    "type": "string"
                  },
                  "maxItems": 3,
                  "minItems": 1,
                  "type": "array"
                },
                "description": "Optional lines you wrote, keyed by child name as in observees, 1 to 3 lines of up to 180 characters each. The tool does not call a model.",
                "type": "object"
              },
              "timezone": {
                "description": "A valid IANA time zone name for the school, such as \"America/Chicago\" (the default).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["canvas", "date", "run_at"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "children": {
                "items": {
                  "properties": {
                    "announcements": {
                      "description": "Canvas announcements and notice emails from the last 72 hours.",
                      "items": {
                        "properties": {
                          "body": {
                            "type": "string"
                          },
