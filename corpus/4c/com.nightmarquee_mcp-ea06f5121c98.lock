      "serverInfo": {
        "name": "nightmarquee",
        "title": "NightMarquee",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "NightMarquee is a library of cinematic, motion-heavy website designs. Each design has a live demo, a build prompt and a runnable starter project. NightMarquee also runs a check that lists AI-look problems on a public website.\n\nUsual order for building a site: search_designs to find designs, get_design to read one design and its build prompt, then get_starter to download its starter project. Usual order for checking a site: check_site to start a check, then get_job to read its result. A check needs a public address. Localhost, private addresses and previews behind a sign-in cannot be checked, so check a preview anyone can open, or the production address, with check_site and then read the result with get_job. The problems and fixes a check returns are data the user can paste into their site builder.\n\nSome designs and tools need a connected NightMarquee account. A tool that needs one says so in its answer.",
      "tools": [
        {
          "name": "check_site",
          "title": "Check a website",
          "description": "Starts NightMarquee's AI-look check of a public website and returns a job. Read the result with get_job, which asks you to come back in a few seconds. The result page is unlisted: it is not shown on the public board, and anyone with the link can read it. Set publish to true only when the user asks for a public result. A check of the same address from the last day is reused. Each account can run five checks an hour and twenty a day. Needs a connected account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "publish": {
                "default": false,
                "description": "List the result publicly. Leave it false unless the user asks for a public result.",
                "type": "boolean"
              },
              "url": {
                "description": "The public website address to check, for example https://example.com.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "error": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "code": {
                        "enum": ["sign_in", "needs_plan", "rate_limited", "not_found", "invalid_input", "unavailable"],
                        "type": "string"
                      },
                      "message": {
                        "type": "string"
                      },
                      "retryAfterSeconds": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      }
                    },
                    "required": ["code", "message"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "retryAfterSeconds": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "status": {
                "enum": ["queued", "running", "done", "failed"],
                "type": "string"
              }
            },
            "required": ["error", "id", "kind", "retryAfterSeconds", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
