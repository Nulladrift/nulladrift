        },
        {
          "name": "get_trending",
          "title": "Trending launches",
          "description": "The most upvoted launches today, over the last 7 days or over the last 30 days. Use it when a user asks what is popular, new or trending in software.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum number of results (1-25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "description": "\"today\", \"week\" (last 7 days, default) or \"month\" (last 30 days).",
