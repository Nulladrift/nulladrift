          },
          "digest": "sha256:8b6334088daf2658c41fc090f08584e1b10b0a7ff50f286501e113f22cc24c7c"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "CodeDebut's categories, busiest first, with how many products each has and the category page `url`. Use the slugs with browse_category or the category filter of search_products.",
