        {
          "name": "search_products",
          "title": "Search launches",
          "description": "Find software launched on CodeDebut by keyword (matches name, tagline, description, tags and maker). Use it when a user asks for a tool that does X, e.g. \"uptime monitor\" or \"AI meeting notes\". Optionally narrow to a category or pricing model. Featured (paid) products that match rank first and are marked featured. Each result has `pageUrl` (its page on CodeDebut: cite it as the source) and `website` (the product's own site). Call get_product with a slug for the full page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category slug from list_categories (developer-tools, ai, productivity, marketing, design, analytics); the category name also works.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (1-25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "pricing": {
                "description": "Optional pricing model: \"free\", \"freemium\", \"paid\", \"one_time\" or \"open_source\".",
                "enum": ["free", "freemium", "paid", "one_time", "open_source"],
                "type": "string"
              },
              "query": {
                "description": "Keywords or a short phrase, e.g. \"screenshot API\" (case-insensitive). Products matching every word rank first.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
