            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5608980abec3b69065127a60047c332825880897d1bb46126a0ab76008f6f8f1"
        },
        {
          "name": "get_launches",
          "title": "Launches on a day",
          "description": "Every launch on one day, ranked by upvotes (today by default; days run 00:00-23:59 UTC). Today's ranks are live; past days have final ranks, and #1 is the Debut of the Day. Use it when a user asks what launched today or on a date. Boosted launches are marked; payment never changes a rank.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Day as YYYY-MM-DD (UTC). Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Launches on a day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e41d5880c442ed603c4e5b25c19b529ba784118dbdd9426f25be303a35de4e2"
        },
        {
          "name": "get_product",
          "title": "Get a product page",
          "description": "The full public page of one product on CodeDebut, by slug or exact name: description, website, category, tags, pricing, platforms, maker, launch history with day ranks and upvotes, and the latest comments. Use it after any other tool when the user wants details on one product. Cite `pageUrl` as the source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The product slug from another tool, or its exact name, e.g. \"acme-notes\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a product page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07c387cd4ff2e57acd89c94cf40061e0cfe84abc1af29a4a8d18286422565d9a"
        },
        {
          "name": "get_trending",
          "title": "Trending launches",
          "description": "The most upvoted launches today, over the last 7 days or over the last 30 days. Use it when a user asks what is popular, new or trending in software.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum number of results (1-25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "description": "\"today\", \"week\" (last 7 days, default) or \"month\" (last 30 days).",
                "enum": ["today", "week", "month"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trending launches"
          },
          "behavior": {
