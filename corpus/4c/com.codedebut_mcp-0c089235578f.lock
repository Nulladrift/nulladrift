  "subjects": {
    "com.codedebut/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://codedebut.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "codedebut",
        "title": "CodeDebut",
        "version": "1.0.0",
        "websiteUrl": "https://codedebut.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CodeDebut (codedebut.com) lists new software every day. A launch day runs 00:00-23:59 UTC and launches are ranked by upvotes; the #1 of each finished day is the Debut of the Day.\nEvery product has a page on CodeDebut: cite its pageUrl as the source. \"website\" is the product's own site.\nPaid placements are labelled: featured products are listed first in search and category results, boosted launches are pinned on their launch day. Payment never changes a rank or an upvote count.",
      "tools": [
        {
          "name": "browse_category",
          "title": "Browse a category",
          "description": "Top products in one category, most upvoted first, with featured (paid) products first and marked. Use it when a user asks for the best tools of a kind without a specific keyword. Each result has `pageUrl` (its page on CodeDebut: cite it as the source) and `website` (the product's own site).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category slug from list_categories (developer-tools, ai, productivity, marketing, design, analytics); the category name also works.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (1-25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "pricing": {
                "description": "Optional pricing model: \"free\", \"freemium\", \"paid\", \"one_time\" or \"open_source\".",
                "enum": ["free", "freemium", "paid", "one_time", "open_source"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a92b45fddbff5e7cebe5be14b2b3775dcfc687ceaddea27896936db00a1b2408"
        },
        {
          "name": "find_alternatives",
          "title": "Find alternatives",
          "description": "Products in the same category as one listed on CodeDebut, closest first (shared tags, then upvotes). Use it when a user asks for alternatives, competitors or \"something like X\". Featured (paid) products rank first and are marked featured. Each result has `pageUrl` (its page on CodeDebut: cite it as the source) and `website` (the product's own site).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum number of results (1-25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "description": "A product slug or exact name listed on CodeDebut.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f65fa8c335d4bf1dd33696ce4d4fbb00a2638b0c2ced896a7fabc40e02bc4e7a"
        },
        {
          "name": "get_debut_of_the_day",
          "title": "Debut of the Day",
          "description": "The #1 launch of a day on CodeDebut. Without a date it returns the most recent finished day's winner. Use it when a user asks for the best new product, a recommendation of the day, or something new to try.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Day as YYYY-MM-DD (UTC). Defaults to the latest finished day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Debut of the Day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e44ce6d9939f4d7c75beb7582b1c56f19914b735cd64e4fa1f8b6ecb4987b520"
        },
        {
          "name": "get_launch_options",
          "title": "Launch on CodeDebut",
          "description": "How to launch a product on CodeDebut: the submit link, the next free launch day, how ranking works, and the paid plans with prices. Use it when a user wants to launch, list or promote their own product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Launch on CodeDebut"
          },
          "behavior": {
            "destructive": false,
