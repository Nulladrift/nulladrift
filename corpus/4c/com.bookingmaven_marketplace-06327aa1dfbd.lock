{
  "lockfileVersion": 2,
  "subjects": {
    "com.bookingmaven/marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bookingmaven.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "BookingMaven",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "book_appointment",
          "description": "Reserve an appointment slot at a service business. Provide a unique idempotency_key to safely retry without double-booking. Get service_id from get_business and start_time/end_time from get_availability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_slug": {
                "description": "The business slug from search_businesses results",
                "type": "string"
              },
              "customer_email": {
                "description": "Customer email address",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "customer_name": {
                "description": "Customer full name",
                "type": "string"
              },
              "customer_phone": {
                "description": "Customer phone number (optional)",
                "type": "string"
              },
              "end_time": {
                "description": "ISO 8601 datetime for the appointment end (from get_availability)",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique key to prevent duplicate bookings (e.g. UUID). Reuse the same key to safely retry.",
                "type": "string"
              },
              "notes": {
                "description": "Any special requests or notes for the business",
                "type": "string"
              },
              "service_id": {
                "description": "The service ID from get_business results",
                "type": "string"
              },
              "staff_id": {
                "description": "Staff member ID (from get_business). Omit to auto-assign.",
                "type": "string"
              },
              "start_time": {
                "description": "ISO 8601 datetime for the appointment start (from get_availability)",
                "type": "string"
              }
            },
            "required": ["business_slug", "customer_email", "customer_name", "end_time", "idempotency_key", "service_id", "start_time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book appointment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b62324759b30ce5128c52d0e5cba33978927f5d191447c0d6141b7234cdb6fd4"
        },
        {
          "name": "cancel_appointment",
          "description": "Cancel a booking you made. Requires booking_id and the lookup_token from book_appointment. Safe to retry (idempotent). No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "booking_id": {
                "description": "The booking_id returned from book_appointment",
                "type": "string"
              },
              "lookup_token": {
                "description": "The lookup_token returned from book_appointment for this booking",
                "type": "string"
              }
            },
            "required": ["booking_id", "lookup_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel appointment"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d138fc102402655446738f20441c1e12f35c48b94178cf358f7823c350b94c55"
        },
        {
          "name": "create_account",
          "description": "Get a BookingMaven signup link pre-filled with the customer's details. The customer visits the link to set their password and activate their account, which links their past bookings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Customer email (use the same email used for booking)",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "Customer full name",
                "type": "string"
              },
              "phone": {
                "description": "Customer phone number (optional)",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd169e70b22b15e4f1c6214efb2b7afde497df37fc445f587e8728b50ba97a3e"
        },
        {
          "name": "get_availability",
          "description": "Get open appointment slots for a business on a specific date. Returns ISO timestamps for each available slot. Use these start_time/end_time values when calling book_appointment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_slug": {
                "description": "The business slug from search_businesses results",
                "type": "string"
              },
              "date": {
                "description": "Date to check in YYYY-MM-DD format",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "staff_id": {
                "description": "Specific staff member ID (from get_business). Omit to check any available staff.",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone string (e.g. 'America/New_York'). Defaults to business local time.",
                "type": "string"
              }
            },
            "required": ["business_slug", "date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:267d876fa37f045a3c0f39312f98a636c9209c3eeff5e9f240d1f99dd34e5531"
        },
        {
          "name": "get_booking",
          "description": "Look up the current status/time of a booking you made. Requires the booking_id and the lookup_token that book_appointment returned. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "booking_id": {
                "description": "The booking_id returned from book_appointment",
                "type": "string"
              },
              "lookup_token": {
                "description": "The lookup_token returned from book_appointment for this booking",
                "type": "string"
              }
            },
            "required": ["booking_id", "lookup_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b75caa0282fb4a1127d73d64d49c16c77326429926a70d7eba349dbd472aa916"
        },
        {
          "name": "get_business",
          "description": "Get full details for a business including services (with IDs and prices), staff, and hours. You need service_id and optionally staff_id before calling book_appointment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_slug": {
                "description": "Alias for slug — the business slug from search_businesses results",
                "type": "string"
              },
              "slug": {
                "description": "The business slug from search_businesses results",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:426443a4826f03f356ad9e462559106150c3d44b715415f0db741963a34c520b"
        },
        {
          "name": "link_account",
          "description": "Link the guest bookings you made with your email to your signed-in account so you can manage them from your account. Requires signing in (OAuth) with a verified email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Link my bookings to my account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b760d1e6a2f69c7b3aac63c13b52007456ed4f72ee8436db88fad83472e23a6"
        },
        {
          "name": "list_my_bookings",
          "description": "List all appointments booked with your email address. Requires signing in (OAuth) — your AI must be connected with an authenticated account that has a verified email. Returns your upcoming and past bookings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List my bookings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eea95a1f96fe3cb4d764aaaf6bfea4a84d88cf16fddf5697068a7f01193dcd33"
        },
        {
          "name": "reschedule_appointment",
          "description": "Move a booking you made to a new time. Requires booking_id, the lookup_token from book_appointment, and new_start_time/new_end_time (ISO 8601, from get_availability). The new slot is checked for conflicts. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "booking_id": {
                "description": "The booking_id returned from book_appointment",
                "type": "string"
              },
              "lookup_token": {
                "description": "The lookup_token returned from book_appointment for this booking",
                "type": "string"
              },
              "new_end_time": {
                "description": "ISO 8601 datetime for the new appointment end (from get_availability)",
                "type": "string"
              },
              "new_start_time": {
                "description": "ISO 8601 datetime for the new appointment start (from get_availability)",
                "type": "string"
              }
            },
            "required": ["booking_id", "lookup_token", "new_end_time", "new_start_time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Reschedule appointment"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f4d7a7bf620b2c525eab7d6983d12acba3da0722c6d8996da699dfd6bb6a67c"
        },
        {
          "name": "search_businesses",
          "description": "Search for service businesses by location. Returns businesses with their booking URLs, ratings, and descriptions. Use get_business to see services and get_availability to check open slots.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Filter by business type",
                "enum": ["barbershop", "hair_salon", "tattoo_piercing", "nail_salon", "mobile_services", "fitness_training", "car_detailing", "spa_wellness", "yoga", "personal_trainer"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results (default 10)",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "location": {
                "description": "City, city+state, or zip code. E.g. 'Brooklyn NY', 'Austin, TX', '90210'",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:72278028dd27b4b3d8187cc4049b30d1c8f5eb10207567701ff61106ae6998bf"
        },
        {
          "name": "start_business_signup",
          "description": "Get a link for a business owner to sign up and list their business on BookingMaven. Returns a URL with optional pre-filled details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_name": {
                "description": "Name of the business",
                "type": "string"
              },
              "category": {
                "description": "Type of business",
                "enum": ["barbershop", "hair_salon", "tattoo_piercing", "nail_salon", "mobile_services", "fitness_training", "car_detailing", "spa_wellness", "yoga", "personal_trainer"],
                "type": "string"
              },
              "email": {
                "description": "Business owner email",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:49537e9a111ea06c4b5fc1d6ef10784d9cba856aa0dd2c737bb69ad21d36c26c"
        }
      ],
      "digest": "sha256:2606173a8b3a156743969341a688305fe52d896ed0688ffd558c82bfbe8727ab"
    }
  }
}
