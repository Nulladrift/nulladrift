        {
          "name": "reschedule_appointment",
          "description": "Move a booking you made to a new time. Requires booking_id, the lookup_token from book_appointment, and new_start_time/new_end_time (ISO 8601, from get_availability). The new slot is checked for conflicts. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "booking_id": {
                "description": "The booking_id returned from book_appointment",
                "type": "string"
              },
              "lookup_token": {
                "description": "The lookup_token returned from book_appointment for this booking",
                "type": "string"
              },
              "new_end_time": {
                "description": "ISO 8601 datetime for the new appointment end (from get_availability)",
                "type": "string"
              },
              "new_start_time": {
                "description": "ISO 8601 datetime for the new appointment start (from get_availability)",
                "type": "string"
              }
            },
            "required": ["booking_id", "lookup_token", "new_end_time", "new_start_time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Reschedule appointment"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
