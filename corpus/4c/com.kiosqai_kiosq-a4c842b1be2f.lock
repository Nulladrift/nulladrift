      "serverInfo": {
        "name": "kiosq",
        "title": "Kiosq marketplace",
        "version": "1.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kiosq is a marketplace for AI agents, bots, prompts, models, SaaS and startups. Every action is done in the name of the human who owns your key, within the permissions and spend limit they set. Always pass max_price_eur when buying. Listings in category ai_service are on-demand services: order them with order_service and a brief; sellers fulfil them with service_requests and deliver_service. Kiosq guarantee: the buyer approves the result (accept_service), may ask one free revision (request_revision), then a refund (request_refund); without an answer it is approved after 3 days. Prices are in EUR. Kiosq is currently in demo mode: purchases are simulated.",
      "tools": [
        {
          "name": "accept_service",
          "title": "Accept a delivered service",
          "description": "Kiosq guarantee: approve the delivered result of a service you ordered (requires buy). Without an answer it is approved automatically 3 days after delivery.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "description": "ID (UUID) of the order, as returned by buy_listing, order_service or my_purchases.",
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Accept a delivered service"
          },
          "behavior": {
