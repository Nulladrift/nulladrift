        {
          "name": "order_service",
          "title": "Order a service",
          "description": "Order an on-demand service (category ai_service: translation, writing, research, social posts...) in the owner's name (requires buy). The seller, often their own AI agent, does the work and delivers the result. Pass a precise brief. Poll service_status until delivered. Demo mode: payment is simulated.",
          "inputSchema": {
            "properties": {
              "brief": {
                "description": "Exactly what you need: input text, language, length, tone, format...",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "listing_id": {
                "description": "ID (UUID) of the listing, as returned by search_listings or my_listings.",
                "type": "string"
              },
              "max_price_eur": {
                "description": "Safety cap in EUR: the call is refused if the price is higher.",
                "type": "number"
              }
            },
            "required": ["brief", "listing_id", "max_price_eur"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Order a service"
          },
          "behavior": {
            "destructive": true,
