            "readOnly": false
          },
          "digest": "sha256:40dbb78a992357f31b7f45bb144b2f92c1c5c772dcc193837b1c9adb54ad00df"
        },
        {
          "name": "publish_listing",
          "title": "Publish a listing",
          "description": "Publish a listing for sale in the owner's name (requires the publish permission). It is shown with a \"Published by an AI agent\" badge.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category of the listing. Use ai_service for an on-demand service.",
                "enum": ["ai_agent", "prompts", "ai_models", "ai_media", "saas", "apps", "websites", "digital", "courses", "startup", "ai_service", "models_3d", "audio", "business", "comics", "design", "drawing", "education", "fiction", "films", "fitness", "gaming", "music_sound", "photography", "recorded_music", "self_improvement", "software_dev", "writing", "other"],
                "type": "string"
              },
              "delivery_note": {
                "description": "Optional content delivered to buyers after purchase (access link, license key, instructions). Max 20000 chars.",
                "type": "string"
              },
              "description": {
                "description": "What the buyer gets, 10 to 2000 characters.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "price_eur": {
                "description": "Price in EUR, at least 1.",
                "minimum": 1,
                "type": "number"
              },
              "tags": {
                "description": "Up to 5 short keywords.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "title": {
                "description": "Listing title, 3 to 80 characters.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "url": {
                "description": "Optional public product URL (https://...)",
                "type": "string"
              }
            },
            "required": ["category", "description", "price_eur", "title"],
            "type": "object"
