      },
      "transport": {
        "type": "http",
        "url": "https://ringback.0xpi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.0xpi.ringback/missed-call-text-back",
        "title": "Ringback: missed-call text-back for contractors",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ringback is missed-call text-back for HVAC, plumbing, electrical and other service businesses: when a call is missed, the caller gets a text from the business's own number. Public tools: estimate_missed_call_cost does the arithmetic on the user's own call numbers (assumptions shown, an estimate, not a promise); how_ringback_works gives the facts, price and trial terms. Ringback customers can connect their own account with a personal access token (Ringback Settings, AI assistants; header Authorization: Bearer <token>): my_missed_calls and my_texts_sent read only that business's call and text log.",
      "tools": [
        {
          "name": "estimate_missed_call_cost",
          "title": "Estimate what missed calls cost a service business",
          "description": "Arithmetic on your own numbers: calls per week x missed % x close rate x average job value, per week, month and year, with every step and assumption shown. It is an estimate of the value of jobs at stake from missed calls, not a prediction of what any tool will recover. Also shows how many saved jobs a month would cover Ringback's price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "average_job_value": {
                "description": "Average revenue per job, in US dollars.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "calls_per_week": {
                "description": "Inbound calls the business gets in a typical week.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "close_rate_percent": {
                "description": "Share of answered callers who normally book a job, in percent (e.g. 30).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "missed_percent": {
                "description": "Share of those calls that go unanswered, in percent (e.g. 25).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["average_job_value", "calls_per_week", "close_rate_percent", "missed_percent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate missed-call cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56f70fa6a6e0c71f2bb2a9b55d369fe66ea6b9a530193c7c7f3af2a231e2d490"
        },
        {
          "name": "how_ringback_works",
          "title": "How Ringback works, what it costs, what it does not do",
          "description": "Facts about Ringback, missed-call text-back for contractors and home-service businesses: how the text is sent, phone requirements (Android, iPhone options), what the owner sees, price ($17/month or $170/year per business line), the 7-day free trial with no card, and what Ringback does not do.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How Ringback works"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea88bd39741a7d2492029921ea365b083bc9d565d4ea621544e3c00f1659432f"
        },
        {
          "name": "my_missed_calls",
          "title": "My missed calls (from my Ringback call log)",
          "description": "List the missed calls in your own Ringback call log for a time range: when, the caller's number, whether a text-back went out (and its delivery status) or why not (e.g. already texted recently, opted out, do-not-text), and the lead's status. Counts first, then up to 50 most recent calls. Needs a personal Ringback access token, created by the business owner in Ringback (Settings, AI assistants) and sent as \"Authorization: Bearer <token>\". Read-only; reads only that business's own call and text log.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "range": {
                "description": "Time range: \"today\" (since midnight in the business's time zone), \"7d\", \"30d\" or \"90d\" (that many days back from now). Default \"7d\".",
                "enum": ["today", "7d", "30d", "90d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "My missed calls"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:747aad3400dd3a26be258c6a0695221c24bb638f174e461872a12bf8b801b606"
        },
        {
          "name": "my_texts_sent",
          "title": "Texts my Ringback line sent",
          "description": "List the texts your Ringback line sent in a time range: missed-call text-backs, your replies from the dashboard and automatic replies, with delivery status as the phone reported it, the median time from call to text-back, and up to 50 most recent texts with their wording. Needs a personal Ringback access token, created by the business owner in Ringback (Settings, AI assistants) and sent as \"Authorization: Bearer <token>\". Read-only; reads only that business's own call and text log.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "range": {
                "description": "Time range: \"today\" (since midnight in the business's time zone), \"7d\", \"30d\" or \"90d\" (that many days back from now). Default \"7d\".",
                "enum": ["today", "7d", "30d", "90d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "My texts sent"
          },
          "behavior": {
