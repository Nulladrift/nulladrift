      "instructions": "NAO es el marketplace de México hecho para bots (fase 1: Guadalajara).\nTu agente compra donde más te conviene: vendedores de NAO o negocios locales de tu colonia (ferreterías, papelerías, refaccionarias, farmacias, tienditas…), entregados el mismo día por repartidores de colonia.\nPara comprar (\"cómprame…\", \"pídeme…\", \"tacos para 4\"): buscar_productos → (opcional ver_producto) → crear_pedido. No preguntes de más: si la persona no da colonia, compra igual (NAO usa una entrega de demo en la colonia del negocio; no pidas nombre ni teléfono). Elige lo que mejor cumpla lo pedido (cantidad para el número de personas) y de UN solo negocio local cuando se pueda (cada negocio cobra su envío).\nTambién puedes armar carrito: agregar_al_carrito (devuelve un token 'carrito') → ver_carrito → crear_pedido con ese carrito. En ChatGPT y Claude las herramientas muestran tarjetas con botones Agregar y Pedir.\nDespués de pedir: estado_pedido (con el token que devolvió crear_pedido).\nPara reintentar una compra sin duplicarla manda la misma clave_idempotencia.\nPara negocios locales cerca: buscar_tienditas_cerca → ver_tiendita → crear_pedido.\nSin llave puedes leer y comprar (con límites bajos). Si tienes llave del buzón de bots de NAO, mándala como Authorization: Bearer <llave>: tus pedidos quedan ligados a tu bot y tus límites son más altos.\nNinguna herramienta cambia productos, precios, estados ni hilos: eso solo se hace con sesión en los paneles.\nPrecios en MXN. Demo de NAO: todos los pedidos son de prueba (pago al recibir, pero no se cobra nada y nadie entrega nada). Los negocios son de ejemplo.\nDespués de comprar, comparte con la persona la liga \"seguimiento\" y la de \"vista_del_negocio\" (ahí se ve cómo le llega el pedido al negocio).",
      "tools": [
        {
          "name": "agregar_al_carrito",
          "title": "Agregar al carrito",
          "description": "Agrega un producto al carrito de esta compra (o lo resta con cantidad negativa; en 0 se quita). La primera vez no mandes 'carrito'; después manda siempre el token 'carrito' que te devolvió la llamada anterior. Devuelve el carrito con total y envío. Para cerrar: crear_pedido con ese 'carrito'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cantidad": {
                "description": "Piezas a sumar (1 por omisión). Negativo resta.",
                "maximum": 20,
                "minimum": -20,
                "type": "integer"
              },
              "carrito": {
                "description": "Token del carrito (c1.…) de la llamada anterior. Vacío = carrito nuevo.",
                "maxLength": 3000,
                "type": "string"
              },
              "producto_id": {
                "description": "id del producto (p-...) de buscar_productos.",
                "maxLength": 90,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["producto_id"],
            "type": "object"
