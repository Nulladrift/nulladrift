        {
          "name": "buscar_productos",
          "title": "Buscar productos",
          "description": "Busca productos en NAO (Guadalajara): vendedores de NAO y negocios locales de tu colonia (ferreterías, tlapalerías, refaccionarias, papelerías, farmacias, tienditas…). Con colonia o código postal solo devuelve lo que sí llega ahí (los negocios locales entregan el mismo día, a 2 km, con repartidor de colonia). Precios en MXN.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categoria": {
                "description": "Categoría opcional.",
                "enum": ["hogar", "moda", "cafe-cocina", "electronica", "papeleria", "abarrotes", "bebidas", "panaderia", "botanas", "limpieza", "frutas-verduras", "mascotas", "ferreteria", "farmacia", "refacciones", "comida"],
                "type": "string"
              },
              "codigo_postal": {
                "description": "Código postal de entrega (5 dígitos), p. ej. '44600'.",
                "maxLength": 10,
                "type": "string"
              },
              "colonia": {
                "description": "Colonia de entrega en Guadalajara, p. ej. 'Santa Tere', 'Americana', 'Chapalita'.",
                "maxLength": 80,
                "type": "string"
              },
              "limite": {
                "description": "Máximo de resultados (12 por omisión).",
                "maximum": 50,
