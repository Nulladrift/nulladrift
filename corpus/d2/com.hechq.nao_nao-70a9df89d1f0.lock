        {
          "name": "crear_pedido",
          "title": "Crear pedido de prueba",
          "description": "Cierra la compra: crea un pedido de PRUEBA en NAO (pago al recibir; en la demo no se cobra nada y nadie entrega). Manda 'productos' (ids de buscar_productos) o 'carrito' (el token de agregar_al_carrito). Entrega: colonia o código postal de Guadalajara; si la persona no dio ninguna, NO preguntes: NAO usa una entrega de demo en la colonia del negocio. No hace falta pedir nombre ni teléfono. Después comparte la liga 'seguimiento' y la de 'vista_del_negocio' (ahí se ve cómo le llega el pedido al negocio). Devuelve el id del pedido, su token (guárdalo: estado_pedido lo pide), el total en MXN, la liga de seguimiento y la liga al panel donde la persona ve lo que su bot compró. Usa 'comprador' para agrupar los pedidos de una misma persona en su panel. Manda 'clave_idempotencia' (p. ej. un UUID) para reintentar sin duplicar: con la misma clave y los mismos datos devuelve el mismo pedido.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agente": {
                "description": "Quién compra: 'Claude', 'ChatGPT', 'Grok', 'Muse', 'bot de mi empresa'…",
                "maxLength": 60,
                "type": "string"
              },
              "carrito": {
                "description": "Token del carrito que devolvió agregar_al_carrito o ver_carrito (en vez de 'productos').",
                "maxLength": 3000,
                "type": "string"
              },
              "clave_idempotencia": {
                "description": "Clave única de este intento de compra (p. ej. un UUID). Si reintentas con la misma clave y los mismos datos, devuelve el mismo pedido en vez de crear otro.",
                "maxLength": 100,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "codigo_postal": {
                "description": "Código postal de entrega (5 dígitos), p. ej. '44600'.",
                "maxLength": 10,
                "type": "string"
              },
              "colonia": {
                "description": "Colonia de entrega en Guadalajara, p. ej. 'Santa Tere', 'Americana', 'Chapalita'.",
                "maxLength": 80,
                "type": "string"
              },
              "comprador": {
                "description": "Código del panel de la persona (letras y números). Si no lo mandas, NAO le crea uno privado.",
                "maxLength": 40,
                "type": "string"
              },
              "notas": {
                "maxLength": 500,
                "type": "string"
              },
              "productos": {
                "description": "Lista de {producto_id, cantidad}. Opcional si mandas 'carrito'.",
                "items": {
                  "properties": {
                    "cantidad": {
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "producto_id": {
                      "maxLength": 90,
                      "minLength": 2,
                      "type": "string"
                    }
                  },
                  "required": ["producto_id"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "recibe": {
                "description": "Nombre de quien recibe (opcional).",
                "maxLength": 60,
                "type": "string"
              },
              "referencia": {
                "description": "Referencia de entrega: calle, número, 'portón negro'.",
                "maxLength": 200,
                "type": "string"
              },
              "telefono": {
                "description": "Teléfono de quien recibe, 10 dígitos de México (opcional).",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
