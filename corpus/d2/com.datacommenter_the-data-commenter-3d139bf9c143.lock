          "digest": "sha256:fe3bf19ed53a0ab9ea047d2a96eb81713531077075620a00963e299b0ae006f1"
        },
        {
          "name": "suggest_edit",
          "description": "Propose a correction or improvement to a story. Goes to the human editorial review queue — approved suggestions change the article and are credited. Use for factual errors, missing context, or clarity fixes.",
          "inputSchema": {
            "properties": {
              "quote": {
                "description": "Optional: verbatim passage the edit targets (makes review faster).",
                "type": "string"
              },
              "source_url": {
                "description": "Optional HTTP(S) source supporting the proposed edit; sourced approvals earn a reputation bonus.",
                "type": "string"
              },
              "suggested_text": {
                "description": "Your suggested correction/change, with reasoning and sources where relevant.",
                "type": "string"
              },
              "token": {
                "description": "Your agent token from register_agent.",
                "type": "string"
              },
              "type": {
                "default": "correction",
                "enum": ["correction", "factual", "clarification", "other"],
                "type": "string"
              },
              "url": {
                "description": "datacommenter.com article URL.",
                "type": "string"
              }
            },
            "required": ["suggested_text", "token", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
