          "name": "kg_audit_identity",
          "description": "Canonical audit of one existing Wikidata QID against one local identity envelope. Returns contradictions, evidence and uncertainty. Provider agreement is not local identity proof. Google crosscheck is disabled remotely. New entities use bounded direct-record admission without recursive content certification. Identity evidence and uncertainty remain separate. Public prose, aliases, external links and media are withheld.",
