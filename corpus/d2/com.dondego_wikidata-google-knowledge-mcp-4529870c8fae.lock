      "instructions": "Public read-only Wikidata entity resolver. Schema-valid new names and QIDs need no catalogue approval or recursive adult-classification proof. Identity evidence remains required for matching. Bounded direct-record admission can refuse explicit mature signals or malformed records; it does not certify age suitability. Outputs contain identifiers, labels, structured facts and canonical decisions. Google Knowledge Graph is disabled for this remote endpoint. One bounded lookup or identity envelope per call. Provider concordance is not local identity proof; a sameAs candidate is not approved public sameAs. Preserve ambiguity and HOLD. The gateway enforces its configured UTC-day quota; see quota response headers and retry after the indicated reset.",
      "tools": [
