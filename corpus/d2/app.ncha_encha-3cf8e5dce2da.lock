      },
      "serverInfo": {
        "name": "encha",
        "title": "엔차 · 오래 버틴 맛집",
        "version": "1.0.0",
        "websiteUrl": "https://ncha.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "엔차(ncha.app)는 리뷰·별점 대신 행정안전부 일반음식점 인허가 기록으로 같은 자리에서 몇 년째 영업 중인지 계산해 오래 버틴 동네 음식점을 고르는 서비스입니다. 가게에게 돈을 받지 않고 광고가 없습니다.\n- 맛이나 별점을 말하지 말고 \"인허가 기록상 같은 자리에서 N년째 영업 중\"이라고 설명하세요.\n- 숫자는 도구가 준 값만 쓰세요. confidence가 \"추정\"이면 기록을 이어 붙여 계산한 값입니다.\n- 가게마다 엔차 링크(url)를 함께 알려 주세요. 사람들이 근거(인허가 기록)와 지도를 볼 수 있습니다.\n- 폐업 신고가 늦게 반영될 수 있으니 가기 전에 지도에서 영업 여부를 확인하라고 안내하세요.",
      "tools": [
        {
          "name": "find_long_running_restaurants",
          "title": "오래 버틴 맛집 찾기",
          "description": "지역·동·메뉴로 같은 자리에서 오래 영업 중인 음식점을 찾습니다(공공 인허가 기록 기준, 별점 없음). \"동탄 국밥 맛집\", \"오산 노포\", \"평택 서정동 중국집\", \"마포 노포\"처럼 맛집·노포·오래된 식당을 찾거나 맛집 글을 쓸 때 쓰세요. 전국 시·군·구(서울 구, 경기 시·군, 광역시 구·군, 도의 시·군, 화성 동탄은 \"동탄\"으로 따로)를 다룹니다.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "업태 묶음. 선택.",
                "enum": ["한식", "고기", "회·일식", "중식", "분식·김밥", "양식", "치킨·술집", "카페", "기타"],
                "type": "string"
              },
              "dong": {
                "description": "동·읍·면 이름(예: 석우동, 서정동, 안중읍). 선택.",
                "type": "string"
              },
              "include_uncertain": {
                "default": false,
                "description": "다른 가게일 수 있는 기록(확인 필요)도 넣을지.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "menu": {
                "description": "메뉴나 가게 이름 낱말(예: 국밥, 짬뽕, 고기, 회, 칼국수). 선택.",
                "type": "string"
              },
              "min_years": {
                "default": 10,
                "description": "최소 영업 햇수. 기본 10.",
                "minimum": 0,
                "type": "integer"
              },
              "region": {
                "description": "시·군·구 이름(예: 수원, 화성 동탄, 경기 광주, 마포구, 서울 중구, 부산 해운대구, 강릉). \"경기\"·\"부산\"처럼 시·도만 쓰면 그 시·도 전체, 비우면 전체.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "오래 버틴 맛집 찾기"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:909cd0a83ecfa2d2400916a52a217f56001048959074b33fe1f2d81cba9b98b0"
        },
        {
          "name": "find_restaurants_near",
          "title": "근처 오래 버틴 집",
          "description": "위도·경도 주변(기본 800m, 걸어서 10분)에서 오래 영업 중인 음식점을 햇수 순으로 찾습니다. 전국에서 찾습니다(지도 좌표가 있는 가게만).",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "type": "number"
              },
              "min_years": {
                "default": 5,
                "minimum": 0,
                "type": "integer"
              },
              "radius_m": {
                "default": 800,
                "maximum": 5000,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "근처 오래 버틴 집"
          },
          "behavior": {
