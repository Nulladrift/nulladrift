          },
          "digest": "sha256:d15f5cf59543263d66e9cbe9805238e2bff64eacdbac93d5f971d2d9577a5113"
        },
        {
          "name": "get_restaurant",
          "title": "가게 근거 보기",
          "description": "가게 id로 주소, 영업 햇수, 인허가 기록(최초·승계·재신고), 확인할 점을 봅니다.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "가게 id(예: s_6ed1b96dc2)",
                "type": "string"
              }
            },
