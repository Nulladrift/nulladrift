      },
      "transport": {
        "type": "http",
        "url": "https://mamoie.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mamoie",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "まもいえ（mamoie.com）の公開MCPサーバー。日本の住まいの災害リスクを公式データで判定します。回答には必ず出典と『参考情報である』旨を添えてください。",
      "tools": [
        {
          "name": "check_home_disaster_risk",
          "description": "日本の住所の災害リスク（洪水・地震・土砂・津波・高潮・液状化）を、国の公式データ（重ねるハザードマップ・J-SHIS）に基づいて判定して返します。日本国内の住所または緯度経度に対応。出典つき。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "日本の住所（例: 東京都墨田区押上1-1-2）。緯度経度で指定する場合は lat/lon を使う。",
                "type": "string"
              },
              "lang": {
                "description": "応答の言語。'en' で英語サマリー（国外投資家向け）。既定は 'ja'。",
                "enum": ["ja", "en"],
                "type": "string"
              },
              "lat": {
                "description": "緯度（address の代わりに座標で指定する場合）",
                "type": "number"
              },
              "lon": {
                "description": "経度（address の代わりに座標で指定する場合）",
                "type": "number"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:250d6160dc7f3d7083f47bd20de004b61a8d6b42b679ed437753c20c06f6ad39"
        }
      ],
      "digest": "sha256:9f97c1fc7e7c2acd0c97702a9a7dd68a75fbdd4b214d288177d00e1529936077"
    }
  }
