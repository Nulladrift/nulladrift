      "serverInfo": {
        "name": "model-salt-openai-hosted",
        "version": "1.0.0-numbers"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Model Salt: for a creative or open-ended request (a picture, an SVG, a story, a poem, a design, a name, a plan), first write in your reply, before anything else, the 5 decisions an expert would settle first for this request, in plain words, no two overlapping, and for each a numbered list of 5 options as different from each other as possible: option 1 is the usual choice an expert would make, options 2 to 5 are other choices that fit the request in the exact form it asks for and add nothing it did not ask for. Then call model_salt with only how many options each decision has. It returns one option number per decision, drawn from physical randomness; nothing of the request or your options is sent. Use exactly the drawn options, never swap a drawn option for a safer one. Write each decision with its drawn number and option in one short line, then make the result so it clearly shows every drawn option. Only if the user asks for more or less variety, send randomness too (0 to 2, this connection is at 1) and write the lists for it (0: 3 decisions with 2 options each; 2: 6 decisions with 10 options each).",
      "tools": [
        {
          "name": "model_salt",
          "title": "Model Salt",
          "description": "Settles a creative request's open choices with physical randomness, without seeing the request. Before calling, write in your reply 5 decisions with 5 numbered options each (option 1 the usual choice). Send only the option count of each decision, e.g. [5, 5, 5, 5, 5]. Returns one option number per decision: use exactly those options, write each one out, then make the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "counts": {
                "description": "How many options each decision has, in order. Nothing else from the chat.",
                "items": {
                  "maximum": 20,
                  "minimum": 2,
                  "type": "integer"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "randomness": {
                "description": "Optional: only if the user asked for more or less variety, 0 the usual answer to 2 as varied as it gets.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["counts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Options drawn",
            "openai/toolInvocation/invoking": "Drawing outside randomness"
          },
