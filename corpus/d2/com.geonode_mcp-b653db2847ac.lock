        {
          "name": "crawl",
          "title": "Start a site crawl",
          "description": "Start a website crawl job from a seed URL. Crawls pages breadth-first (BFS) up to the 'depth' parameter (BFS levels from the seed) and the 'limit' parameter (maximum number of pages to crawl). Supports Markdown and HTML output formats, optional JavaScript rendering, proxy geo-targeting, domain filtering, and the grouped wait_config browser wait policy. Omit wait_config or set it to null to keep adaptive browser settling for page extractions; send {} or concrete values to opt every page extraction into explicit mode. Returns a job ID that can be polled with the 'crawl_status' tool. Requires a Geonode API key, sent as the X-Api-Key header.",
          "inputSchema": {
            "$defs": {
              "CrawlRequest": {
                "properties": {
                  "depth": {
                    "default": 2,
                    "description": "Maximum BFS depth from the seed URL (1 = seed only)",
                    "maximum": 10,
                    "minimum": 1,
                    "title": "Depth",
                    "type": "integer"
                  },
                  "formats": {
                    "default": ["markdown"],
                    "description": "Output formats to extract per page",
                    "items": {
                      "$ref": "#/$defs/OutputFormat"
                    },
                    "title": "Formats",
                    "type": "array"
                  },
                  "include_subdomains": {
                    "default": false,
                    "description": "When same_domain_only is true, also include subdomains of the seed domain",
                    "title": "Include Subdomains",
                    "type": "boolean"
                  },
                  "limit": {
                    "default": 50,
                    "description": "Maximum number of pages to crawl",
                    "maximum": 10000,
                    "minimum": 1,
                    "title": "Limit",
                    "type": "integer"
                  },
                  "proxy": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ProxySettings"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": {
                      "country": null,
                      "type": "residential"
                    },
                    "description": "Proxy configuration for page requests. Optional — when omitted or explicitly `null`, defaults are applied per page: residential type, country auto-resolved from each page URL (domain/path overrides first, then the TLD; if nothing matches, the upstream proxy provider picks the exit region). Send an object to override either field; individual fields inside the object may also be null (see ProxySettings)."
                  },
                  "render_js": {
                    "default": false,
                    "description": "Use a headless browser to render each page (slower, handles JS-heavy sites)",
                    "title": "Render Js",
                    "type": "boolean"
                  },
                  "same_domain_only": {
