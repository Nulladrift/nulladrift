                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 3166-1 alpha-2 country code for geo-targeting (e.g., 'US', 'GB'). Codes that are not backed by a geo-targeted proxy pool are rejected rather than silently ignored. If null, the server auto-resolves a country from the target URL (domain/path overrides first, then the TLD). If no country can be inferred, the upstream proxy provider picks the exit region.",
                    "title": "Country"
                  },
                  "type": {
                    "$ref": "#/$defs/ProxyType",
                    "default": "residential",
                    "description": "Type of proxy to use (datacenter or residential). Defaults to 'residential' when omitted."
