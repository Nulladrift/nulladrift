        {
          "name": "extract",
          "title": "Extract a web page",
          "description": "Extract content from a web page. Supports HTML and Markdown output formats, optional JavaScript rendering via headless browser, proxy geo-targeting, custom HTTP headers, and explicit browser wait controls via the wait_config object. Can run synchronously (returns content immediately) or asynchronously (returns a job ID that can be polled with the 'job' tool). Use 'render_js=true' for pages that require JavaScript to load their content; supplying wait_config also enables browser rendering automatically. Omit wait_config or set it to null to keep the adaptive browser settle path; send {} or concrete values to opt into explicit mode. Without an API key, extraction is synchronous only, without JavaScript rendering or request headers other than Accept-Language, and limited to a small per-client rate and daily volume. An API key, sent as the X-Api-Key header, lifts these restrictions; the plan's own limits apply instead.",
          "inputSchema": {
            "$defs": {
              "ExtractRequest": {
                "properties": {
                  "formats": {
                    "default": ["html"],
                    "description": "Output formats to return",
                    "items": {
                      "$ref": "#/$defs/OutputFormat"
                    },
                    "title": "Formats",
                    "type": "array"
                  },
                  "headers": {
                    "anyOf": [
                      {
                        "additionalProperties": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Custom HTTP headers to include in extraction request. `Accept-Language` is the one exception on browser-rendered requests: it is not forwarded verbatim, because it would override the header the browser derives from its locale and leave the wire value contradicting `navigator.language`. The language you ask for is still honoured — it selects the browser locale, paired with the proxy country's region, so `en-US` through a German proxy renders the page as `en-DE`. `Host` and `:authority` are dropped: the target host always comes from `url`.",
                    "title": "Headers"
                  },
                  "processing_mode": {
                    "$ref": "#/$defs/ProcessingMode",
                    "default": "sync",
                    "description": "Processing mode: sync (block until done) or async (starts job and return job ID)"
                  },
                  "proxy": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ProxySettings"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": {
                      "country": null,
                      "type": "residential"
                    },
                    "description": "Proxy configuration. Optional — when omitted or explicitly `null`, defaults are applied: residential type, country auto-resolved from the target URL (domain/path overrides first, then the TLD; if nothing matches, the upstream proxy provider picks the exit region). Send an object to override either field; individual fields inside the object may also be null (see ProxySettings)."
                  },
                  "render_js": {
                    "default": false,
                    "description": "If true, uses a headless browser to render the page (slower, more expensive).",
                    "title": "Render Js",
                    "type": "boolean"
                  },
                  "timeout": {
                    "anyOf": [
                      {
                        "minimum": 1000,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Milliseconds this request may take, counted from when we receive it and including any queue wait. A wait for the per-site rate limit or for a free thread uses the same time: when it does not fit, the request is refused with 429 instead of being held longer. On expiry the escalation chain stops rather than the response merely arriving sooner: no further browser is launched, and the request is not billed. Omit it to keep the system ceiling. Sync requests only: sending it with processing_mode=async is rejected rather than ignored, because an async caller holds a job id and polls at its own pace. Values above the ceiling are clamped to it.",
