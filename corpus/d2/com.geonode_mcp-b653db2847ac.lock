                    "title": "Url",
                    "type": "string"
                  },
                  "wait_config": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/WaitConfig"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Grouped browser wait policy. Optional: when omitted or null, browser requests use the adaptive default settle policy whenever a browser runs. Send a non-null object to opt into caller-owned explicit wait mode, which skips the adaptive default settle phase. Null fields inside wait_config behave the same as absence. If render_js is not set explicitly, any non-null wait_config auto-enables browser rendering and the effective render_js value is returned in metadata. If render_js=false is sent together with a non-null wait_config, the request is rejected as ambiguous."
