                    "default": null,
                    "description": "Locale tag: a language code ('en'), a language-region tag ('en-US'), or 'all'.",
                    "title": "Locale"
                  },
                  "page": {
                    "default": 1,
                    "description": "Result page to fetch. Without `engine`, 1 to 9. With `engine` set, the pinned engine's own limit applies instead: brave 9, duckduckgo 5, naver 9.",
                    "examples": [1, 2, 9],
                    "maximum": 9,
                    "minimum": 1,
                    "title": "Result page",
                    "type": "integer"
                  },
                  "query": {
                    "description": "Search query",
                    "maxLength": 1000,
                    "minLength": 1,
                    "title": "Query",
                    "type": "string"
                  },
                  "safe": {
                    "default": "off",
                    "description": "Safe-search filtering level. Accepted values: \"off\", \"moderate\", or \"strict\".",
                    "enum": ["off", "moderate", "strict"],
                    "examples": ["off", "moderate", "strict"],
                    "title": "Safe-search level",
                    "type": "string"
