                "title": "ProxyType",
                "type": "string"
              },
              "WaitConfig": {
                "description": "Explicit browser wait policy applied in order: wait_until → wait_for → wait_timeout.\nWhen a non-null WaitConfig is provided, the adaptive default settle phase is skipped\nand the caller owns the full wait sequence. Null fields inside the object are treated\nthe same as absence of that field.",
                "properties": {
                  "wait_for": {
                    "anyOf": [
                      {
                        "maxLength": 4096,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "CSS selector or XPath expression to wait for before extracting the DOM. At least one matching element must become attached to the DOM for the wait to succeed. XPath expressions must start with `//` or `xpath=`; anything else is treated as a CSS selector. Applied after wait_until.",
                    "title": "Wait For"
                  },
                  "wait_timeout": {
                    "anyOf": [
                      {
                        "maximum": 30000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Deliberate pause in milliseconds inserted after wait_for resolves (or immediately after wait_until when wait_for is omitted), before the DOM is captured. Use to allow late-settling JavaScript to finish rendering. Range: 0–30 000 ms.",
                    "title": "Wait Timeout"
                  },
                  "wait_until": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/WaitUntil"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Playwright page lifecycle event to wait for during navigation, before the selector wait or explicit delay. Accepted values: `commit` — response headers received and navigation committed; `domcontentloaded` — HTML parsed and DOM ready (no sub-resources); `load` — page and all sub-resources (images, scripts) fully loaded; `networkidle` — no network activity for 500 ms. When omitted, defaults to `domcontentloaded`."
                  }
                },
                "title": "WaitConfig",
                "type": "object"
              },
              "WaitUntil": {
                "enum": ["commit", "domcontentloaded", "load", "networkidle"],
                "title": "WaitUntil",
                "type": "string"
              }
