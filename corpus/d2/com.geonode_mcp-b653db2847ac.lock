                    "type": "boolean"
                  },
                  "url": {
                    "description": "Seed URL to start crawling from",
                    "format": "uri",
                    "minLength": 1,
                    "title": "Url",
                    "type": "string"
                  },
                  "wait_config": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/WaitConfig"
                      },
                      {
                        "type": "null"
                      }
