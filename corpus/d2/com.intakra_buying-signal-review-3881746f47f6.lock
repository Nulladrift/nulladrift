        {
          "name": "prepare_why_now_review",
          "title": "Prepare an evidence-labeled why-now review",
          "description": "Turn caller-supplied fit criteria and business signals into reviewable why-now and fit guidance. Every fact remains labeled caller-supplied and unverified. The tool does not research, infer budget or buyer intent as fact, draft outreach, access private data, persist input, or take action.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "description": "Business account name supplied by the caller. Do not include personal or confidential data.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "asOfDate": {
                "description": "Optional date for reproducible recency scoring. Defaults to the current California date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fitCriteria": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assessment": {
                      "enum": ["match", "mismatch", "unknown"],
                      "type": "string"
                    },
                    "criterion": {
                      "maxLength": 240,
                      "minLength": 1,
                      "type": "string"
                    },
                    "evidence": {
                      "description": "Caller-supplied fact supporting the fit assessment.",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "sourceUrl": {
                      "description": "Optional credential-free HTTPS source. Intakra does not open or verify it.",
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "required": ["assessment", "criterion", "evidence"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "signals": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "confidence": {
                      "description": "The caller's confidence in the observation, not Intakra verification.",
                      "enum": ["high", "medium", "low"],
                      "type": "string"
                    },
                    "evidence": {
                      "description": "A concrete business event or observation supplied by the caller.",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["leadership_change", "hiring", "funding", "product_launch", "expansion", "technology_change", "partnership", "regulatory_event", "other"],
                      "type": "string"
                    },
                    "observedAt": {
                      "description": "Optional event date. Missing or stale dates reduce confidence.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "relevanceToOffer": {
                      "description": "The caller's specific, hedged explanation of why the event may matter for this offer.",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "sourceUrl": {
                      "description": "Optional credential-free HTTPS source. Intakra does not open or verify it.",
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "required": ["confidence", "evidence", "kind", "relevanceToOffer"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "vendor": {
                "additionalProperties": false,
                "properties": {
                  "idealCustomerProfile": {
                    "description": "Plain-language ideal-customer profile supplied by the caller.",
                    "maxLength": 1000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "offer": {
                    "description": "Plain-language description of the vendor offer being evaluated.",
                    "maxLength": 1000,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["idealCustomerProfile", "offer"],
                "type": "object"
              }
            },
            "required": ["account", "fitCriteria", "signals", "vendor"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "accountName": {
                "type": "string"
              },
              "disposition": {
                "enum": ["review_now", "verify", "deprioritize"],
                "type": "string"
              },
              "evidenceGaps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fitGuidance": {
                "type": "string"
              },
              "headline": {
                "type": "string"
              },
              "prohibitedActions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "questionsForReviewer": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requiresHumanReview": {
                "const": true,
                "type": "boolean"
              },
              "sourceVerificationPerformed": {
                "const": false,
                "type": "boolean"
              },
              "status": {
                "const": "draft",
                "type": "string"
              },
              "supportedFacts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "claim": {
                      "type": "string"
                    },
                    "observedAt": {
                      "type": ["string", "null"]
                    },
                    "signalNumber": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sourceUrl": {
                      "type": ["string", "null"]
                    },
                    "verificationStatus": {
                      "const": "caller_supplied_unverified",
                      "type": "string"
                    }
                  },
                  "required": ["claim", "observedAt", "signalNumber", "sourceUrl", "verificationStatus"],
                  "type": "object"
                },
                "type": "array"
              },
              "whyNow": {
                "type": "string"
              }
            },
            "required": ["accountName", "disposition", "evidenceGaps", "fitGuidance", "headline", "prohibitedActions", "questionsForReviewer", "requiresHumanReview", "sourceVerificationPerformed", "status", "supportedFacts", "whyNow"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare an evidence-labeled why-now review"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Why-now review ready",
            "openai/toolInvocation/invoking": "Preparing a why-now review...",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
