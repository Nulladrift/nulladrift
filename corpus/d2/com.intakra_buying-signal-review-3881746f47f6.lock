      },
      "instructions": "Use get_daily_brief for accounts worth a call, prioritize_accounts for a tracked list, and get_account_changes for what changed this week. These tools require an Intakra workspace connection and return saved, dated evidence, not new research or confirmed buyer intent. Separate pending checks from no eligible signals. Ask before adding accounts or replacing the offering. No tool sends outreach. The two public evidence-review tools remain available without a connection and use only caller-supplied observations. Clients that need sign-in when they connect, or a workspace API key, use https://intakra.com/api/mcp for the workspace tools.",
      "tools": [
        {
          "name": "add_accounts",
          "title": "Add accounts",
          "description": "Use after the user asks to add companies. Adds accounts to the list by website domain (for example [\"acme.com\", \"globex.com\"]). Domains already on the list are skipped and the plan's account limit applies. Checks of new accounts start in the normal background pass, subject to the plan; this returns no findings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domains": {
                "description": "Up to 200 company domains",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "added": {
                "type": "integer"
              },
              "checks_stopped": {
                "description": "Why no checks will run (plan canceled, paused or unpaid).",
                "type": "string"
              },
              "over_plan_limit": {
                "type": "integer"
              },
              "skipped": {
                "type": "integer"
              }
            },
            "required": ["added", "skipped"],
            "type": "object"
          },
