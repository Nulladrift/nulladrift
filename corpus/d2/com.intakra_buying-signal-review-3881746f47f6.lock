        {
          "name": "score_buying_signal_evidence",
          "title": "Score caller-supplied buying-signal evidence",
          "description": "Deterministically score caller-supplied business-account fit and buying-signal evidence. Returns a review-only scorecard, evidence gaps, and unsupported-claim flags. The tool does not fetch sources, access Intakra workspaces, store input, spend money, draft outreach, or send anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "description": "Business account name supplied by the caller. Do not include personal or confidential data.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "asOfDate": {
                "description": "Optional date for reproducible recency scoring. Defaults to the current California date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fitCriteria": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assessment": {
                      "enum": ["match", "mismatch", "unknown"],
                      "type": "string"
                    },
                    "criterion": {
                      "maxLength": 240,
                      "minLength": 1,
                      "type": "string"
                    },
                    "evidence": {
                      "description": "Caller-supplied fact supporting the fit assessment.",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "sourceUrl": {
                      "description": "Optional credential-free HTTPS source. Intakra does not open or verify it.",
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "required": ["assessment", "criterion", "evidence"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "signals": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "confidence": {
                      "description": "The caller's confidence in the observation, not Intakra verification.",
                      "enum": ["high", "medium", "low"],
                      "type": "string"
                    },
                    "evidence": {
                      "description": "A concrete business event or observation supplied by the caller.",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["leadership_change", "hiring", "funding", "product_launch", "expansion", "technology_change", "partnership", "regulatory_event", "other"],
                      "type": "string"
                    },
                    "observedAt": {
                      "description": "Optional event date. Missing or stale dates reduce confidence.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "relevanceToOffer": {
                      "description": "The caller's specific, hedged explanation of why the event may matter for this offer.",
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "sourceUrl": {
                      "description": "Optional credential-free HTTPS source. Intakra does not open or verify it.",
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "required": ["confidence", "evidence", "kind", "relevanceToOffer"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "vendor": {
                "additionalProperties": false,
                "properties": {
                  "idealCustomerProfile": {
                    "description": "Plain-language ideal-customer profile supplied by the caller.",
                    "maxLength": 1000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "offer": {
                    "description": "Plain-language description of the vendor offer being evaluated.",
                    "maxLength": 1000,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["idealCustomerProfile", "offer"],
                "type": "object"
              }
            },
            "required": ["account", "fitCriteria", "signals", "vendor"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "accountName": {
                "type": "string"
              },
              "admissibleSignalCount": {
                "minimum": 0,
                "type": "integer"
              },
              "asOfDate": {
                "type": "string"
              },
              "boundaries": {
                "additionalProperties": false,
                "properties": {
                  "callerSuppliedOnly": {
                    "const": true,
                    "type": "boolean"
                  },
                  "dataPersisted": {
                    "const": false,
                    "type": "boolean"
                  },
                  "messageSent": {
                    "const": false,
                    "type": "boolean"
                  },
                  "networkAccess": {
                    "const": false,
                    "type": "boolean"
                  },
                  "outreachDrafted": {
                    "const": false,
                    "type": "boolean"
                  },
                  "sourceVerificationPerformed": {
                    "const": false,
                    "type": "boolean"
                  }
                },
                "required": ["callerSuppliedOnly", "dataPersisted", "messageSent", "networkAccess", "outreachDrafted", "sourceVerificationPerformed"],
                "type": "object"
              },
              "disposition": {
                "enum": ["review_now", "verify", "deprioritize"],
                "type": "string"
              },
              "evidence": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "contribution": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "flags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "signalNumber": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "status": {
                      "enum": ["admissible", "needs_verification", "excluded"],
                      "type": "string"
                    }
                  },
                  "required": ["contribution", "flags", "signalNumber", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "evidenceGaps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fit": {
                "additionalProperties": false,
                "properties": {
                  "matches": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "mismatches": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "summary": {
                    "type": "string"
                  },
                  "unknowns": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["matches", "mismatches", "summary", "unknowns"],
                "type": "object"
              },
              "nextAction": {
                "type": "string"
              },
              "requiresHumanReview": {
                "const": true,
                "type": "boolean"
              },
              "scores": {
                "additionalProperties": false,
                "properties": {
                  "evidenceQuality": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "fit": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "priority": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "timing": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["evidenceQuality", "fit", "priority", "timing"],
                "type": "object"
              },
              "status": {
                "const": "draft",
                "type": "string"
              },
              "unsupportedClaims": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["accountName", "admissibleSignalCount", "asOfDate", "boundaries", "disposition", "evidence", "evidenceGaps", "fit", "nextAction", "requiresHumanReview", "scores", "status", "unsupportedClaims"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Score caller-supplied buying-signal evidence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Evidence scorecard ready for review",
            "openai/toolInvocation/invoking": "Scoring supplied evidence...",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
