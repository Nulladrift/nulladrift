        {
          "name": "get_account_changes",
          "title": "Review changes on your account list",
          "description": "Use for 'anything happening on my list?' or 'what changed at these companies this week?'. Returns findings recorded since a date (default seven days ago) for the tracked accounts, each with the event date, the date Intakra recorded it and a source link. Optional domains restrict the list. A finding can describe an older event recorded recently, and no findings is not proof of no activity. Saved records only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domains": {
                "description": "Optional company domains to check against your tracked list, up to 200. Omit to use your tracked accounts.",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "description": "Findings to return, default 50. Narrow since or domains if truncated.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Start date YYYY-MM-DD or ISO 8601 timestamp with timezone, not in the future. Default: seven days ago.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "account_check_details_truncated": {
                "type": "boolean"
              },
              "account_scan_truncated": {
                "type": "boolean"
              },
              "accounts": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "added_at": {
