              },
              "description": {
                "description": "For example \"logistics software companies in Texas\"",
                "type": "string"
              },
              "employee_max": {
                "minimum": 1,
                "type": "integer"
              },
              "employee_min": {
                "minimum": 1,
                "type": "integer"
              },
              "industry": {
                "type": "string"
