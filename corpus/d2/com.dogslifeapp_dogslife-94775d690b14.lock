            }
          },
          "digest": "sha256:bf93e17243c72b74888654c4e312a9d222ca6ed3865e6a1bf958a64bf0813313"
        },
        {
          "name": "calculate_dog_walk_needs",
          "title": "Dog walk and exercise needs",
          "description": "Works out how much walking and exercise a dog needs per day for its age, size and energy level. Puppies (until about 12 months, large breeds 18 months): the 5-minutes-per-month-of-age rule for formal walks, up to twice a day, never above the adult amount for the dog's type. Adults: the Royal Kennel Club daily bands (up to 30 minutes, up to 1 hour, or more than 2 hours). For questions about how long to walk a puppy or a dog, or how much exercise a breed type needs. General guidance from kennel-club and vet sources (Royal Kennel Club, PDSA, AniCura), not veterinary advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age": {
                "description": "The dog's age, in the unit below (8 weeks to 20 years).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "energy": {
                "default": "moderate",
                "description": "Breed energy: low (up to 30 min a day as an adult), moderate (up to 1 hour), high (more than 2 hours, e.g. working and herding breeds).",
                "enum": ["low", "moderate", "high"],
                "type": "string"
              },
              "language": {
                "description": "The language the user is writing in, as a language code (e.g. en, de, sv, pt-BR, es-MX, ja, ar). The answer comes back in that language.",
                "maxLength": 16,
                "type": "string"
              },
              "size": {
                "default": "small",
                "description": "small = small or medium breed (grown at about 12 months); large = large or giant breed (grown at about 18 months).",
                "enum": ["small", "large"],
                "type": "string"
              },
              "unit": {
                "default": "months",
                "description": "Unit of age.",
                "enum": ["weeks", "months", "years"],
                "type": "string"
              }
            },
            "required": ["age"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dog walk and exercise needs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
