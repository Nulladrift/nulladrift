        {
          "name": "calculate_dog_human_age",
          "title": "Dog age in human years",
          "description": "Converts a dog's age (1 to 16 years) into human years using the American Veterinary Medical Association chart (about 15 human years at 1, 24 at 2, then about 4 to 6 per year), and says when dogs are usually considered seniors. For questions like how old a dog is in human years.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "The language the user is writing in, as a language code (e.g. en, de, sv, pt-BR, es-MX, ja, ar). The answer comes back in that language.",
                "maxLength": 16,
                "type": "string"
              },
              "months": {
                "default": 0,
                "description": "Extra months on top of the years, 0 to 11.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "years": {
                "description": "The dog's age in whole years, 0 to 16.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dog age in human years"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
