        {
          "name": "calculate_puppy_feeding_schedule",
          "title": "Puppy feeding schedule",
          "description": "Makes a puppy feeding schedule: how many meals a day for its age (8 weeks to 24 months), meal times spread over the household's day, and when to switch to adult food for its size. Does not calculate food amounts (those follow the food's own label). For questions about how many times a day to feed a puppy, puppy meal times, or when to move to adult food. General guidance from AKC, Agria and PDSA, not veterinary advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age": {
                "description": "The puppy's age, in the unit below (8 weeks to 24 months).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "bedtime": {
                "default": "22:00",
                "description": "The puppy's bedtime, 24-hour HH:MM. Default 22:00.",
                "pattern": "^([01]?\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "language": {
                "description": "The language the user is writing in, as a language code (e.g. en, de, sv, pt-BR, es-MX, ja, ar). The answer comes back in that language.",
                "maxLength": 16,
                "type": "string"
              },
              "size": {
                "default": "medium",
                "description": "Expected adult size of the breed.",
                "enum": ["small", "medium", "large"],
                "type": "string"
              },
              "unit": {
                "default": "weeks",
                "description": "Unit of age.",
                "enum": ["weeks", "months"],
                "type": "string"
              },
              "wake": {
                "default": "07:00",
                "description": "When the household gets up, 24-hour HH:MM. Default 07:00.",
                "pattern": "^([01]?\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              }
            },
            "required": ["age"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Puppy feeding schedule"
