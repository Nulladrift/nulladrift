        },
        {
          "name": "calculate_puppy_adult_weight",
          "title": "Puppy adult weight estimate",
          "description": "Estimates a puppy's adult weight from its age (6 to 18 months) and current weight, using the share of adult weight puppies of each size class usually reach by that age (American Kennel Club growth chart), and says when puppies of that size usually finish growing. For questions about how big a puppy will get. An estimate only: breed, genes and diet change it, and it is not veterinary advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age_months": {
                "description": "The puppy's age in months, 6 to 18.",
                "type": "number"
              },
              "language": {
                "description": "The language the user is writing in, as a language code (e.g. en, de, sv, pt-BR, es-MX, ja, ar). The answer comes back in that language.",
                "maxLength": 16,
                "type": "string"
              },
              "unit": {
                "default": "kg",
                "description": "Unit of weight.",
                "enum": ["kg", "lb"],
                "type": "string"
              },
              "weight": {
                "description": "The puppy's current weight, in the unit below.",
                "type": "number"
              }
            },
            "required": ["age_months", "weight"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Puppy adult weight estimate"
