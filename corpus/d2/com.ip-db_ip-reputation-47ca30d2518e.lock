      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ip-db",
        "title": "IP-DB IP Reputation",
        "version": "1.0.0",
        "websiteUrl": "https://ip-db.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "IP-DB answers questions about IP addresses: is it malicious or blacklisted, is it a VPN, proxy, Tor exit or hosting address, who owns it and where to report abuse. Use check_ip for a verdict and check_blacklists when the user asks which lists carry an address; domain_whois answers who registered a domain, when it was created and when it expires. Scores are evidence summaries (0-100; 75+ critical, 40-74 suspicious, 10-39 low, under 10 clean), not proof. Cite the report_url so the user can see the evidence.",
      "tools": [
        {
          "name": "check_blacklists",
          "title": "Check IP blacklists",
          "description": "Check one IP address against every threat-intelligence blocklist IP-DB carries plus live DNSBL/RBL spam blacklists (SpamCop, Barracuda, PSBL, UCEPROTECT, Mailspike and more). Returns which lists carry it and which do not.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "IPv4 or IPv6 address, or a hostname to resolve first (e.g. 185.220.101.1, mail.example.com)",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:79f4bca661a2558597d3cd42489c32613542968966a196ae79d33c4da8054e9a"
        },
        {
          "name": "check_ip",
          "title": "Check IP reputation",
          "description": "Reputation of one IP address from IP-DB: 0-100 abuse confidence score and label, network type (residential, datacenter/hosting, vpn, tor), the threat-intelligence blocklists and DNSBLs that list it, community abuse reports, country, ASN and owner, the network's abuse contact, and a fraud-screening recommendation (allow, review, challenge, block).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "IPv4 or IPv6 address, or a hostname to resolve first (e.g. 185.220.101.1, mail.example.com)",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f899c53fb7fca521e24da4ad48348fd290d9324f03431ebbdbf9f3264472e7e"
        },
        {
          "name": "domain_whois",
          "title": "Domain WHOIS lookup",
          "description": "WHOIS/RDAP record of a domain from whois.ip-db.com: registrar, creation date (domain age), expiry date, status codes, nameservers, the hosting IPs with their ip-db.com reputation, subdomain count and a short security assessment (SPF, DMARC, TLS, transfer lock). Works for .com.tr and the other .tr domains.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A registered domain name, e.g. example.com or ornek.com.tr",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4bf381207d439c9993f96db65de3b34d01446b6549691301994d2ab0865ab54e"
        }
      ],
