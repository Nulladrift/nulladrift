        {
          "name": "clear_ice_request_offer",
          "title": "Clear Ice – request an offer",
          "description": "Sends an offer request to Clear Ice Schweiz on behalf of the user (like the contact form): company, name, e-mail and optional postcode and town, formats (40–200 mm), date, use and message. Before calling, ask the user (voluntarily, they may decline and still request an offer) for the postcode and town, a phone number, a desired delivery date and the use (bar, hotel, event, private). The details are sent to Clear Ice Schweiz, who reply with an offer by e-mail after the user has confirmed the request via a link in one confirmation e-mail (double opt-in); privacy policy: https://clear-ice.ch/datenschutz/. Only use when the user explicitly asks for an offer and agrees to share these details. Best next step for businesses. / Sendet eine Offertanfrage an Clear Ice Schweiz (wie das Kontaktformular); die Angaben gehen an Clear Ice Schweiz, Datenschutz: https://clear-ice.ch/datenschutz/.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company / venue (required) / Firma bzw. Betrieb (Pflicht)",
                "maxLength": 120,
                "type": "string"
              },
              "desired_date": {
                "description": "Desired delivery date (optional) / gewünschtes Datum (optional)",
                "maxLength": 60,
                "type": "string"
              },
              "email": {
                "description": "E-mail for the offer (required) / E-Mail für die Offerte (Pflicht)",
                "maxLength": 254,
                "type": "string"
              },
              "include_estimate": {
                "description": "Also return the shop price as a non-binding estimate (formats up to 140 mm) / zusätzlich unverbindlicher Richtpreis aus dem Shop (bis 140 mm)",
                "type": "boolean"
              },
              "items": {
                "description": "Formats 40–200 mm, up to 10 (optional) / Formate 40–200 mm, bis 10 (optional)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "depth_mm": {
                      "description": "Depth in mm / Tiefe in mm (online up to 140, 141–200 on request / online bis 140, 141–200 auf Anfrage)",
                      "maximum": 200,
                      "minimum": 40,
                      "type": "integer"
                    },
                    "height_mm": {
                      "description": "Height in mm / Höhe in mm (online up to 140, 141–200 on request / online bis 140, 141–200 auf Anfrage)",
                      "maximum": 200,
                      "minimum": 40,
                      "type": "integer"
                    },
                    "quantity": {
                      "description": "Number of pieces (rounded up to full packs) / Anzahl Stück (auf volle Packungen aufgerundet)",
                      "maximum": 20000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "width_mm": {
                      "description": "Width in mm / Breite in mm (online up to 140, 141–200 on request / online bis 140, 141–200 auf Anfrage)",
                      "maximum": 200,
                      "minimum": 40,
                      "type": "integer"
                    }
                  },
