          "digest": "sha256:809b676659fa050222c51a0a6ba3147477805e3f4c51c5aa46ced3d8f6489234"
        },
        {
          "name": "search_faq",
          "title": "Search the FAQ",
          "description": "Questions and answers from the site that match the words of a query, each with its source page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "matches": {
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
