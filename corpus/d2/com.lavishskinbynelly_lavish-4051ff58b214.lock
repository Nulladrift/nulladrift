                            "type": "string"
                          },
                          "minutes": {
                            "type": "integer"
                          },
                          "name": {
                            "type": "string"
                          },
                          "price_usd": {
                            "type": "number"
                          }
                        },
                        "required": ["booking_url", "minutes", "name", "price_usd"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["category", "checked_on", "id", "name", "page_url", "summary", "variants"],
