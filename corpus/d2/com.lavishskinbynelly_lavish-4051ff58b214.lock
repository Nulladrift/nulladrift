      "serverInfo": {
        "name": "lavish-skin-by-nelly",
        "title": "Lavish Skin by Nelly",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Facts about Lavish Skin by Nelly, a skin care spa in Mahopac, NY: services, prices, FAQ and booking links. Read-only. Booking happens on Square, by the person. Questions about a person's own skin are for Nelly.",
      "tools": [
        {
          "name": "get_booking_link",
          "title": "Get a booking link",
          "description": "The Square booking links for a service, or the free consultation link if no service is given. The person books on Square themselves; this server cannot book.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service_id": {
                "enum": ["acne-facial", "argireline-facial", "cold-treatment", "dermaplaning", "express-d-tox", "express-facial", "hydro-luxx", "hydrojelly-mask", "led-anti-aging", "led-light", "microcurrent", "oxygen-infusion", "signature-ultrasonic"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "booking_url": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["booking_url", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["note", "options"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1744df450dfdcdf2e159bc063f4a5ad94c935885466f652ab498d67595a830ea"
        },
        {
          "name": "get_business_info",
          "title": "Business information",
          "description": "Name, address, phone, hours, map link, license line, new client offer and policies of Lavish Skin by Nelly.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "hours": {
                "type": "string"
              },
              "license_line": {
                "type": "string"
              },
              "maps_url": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "new_client_offer": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "phone": {
                "type": "string"
              },
              "policies": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source_url": {
                "type": "string"
              }
            },
            "required": ["address", "maps_url", "name", "new_client_offer", "phone", "policies", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business information"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5650f27bf08306a7376cb9fcd54e8ddd6e73add2adcfa0d38f39491e84d11b4b"
        },
        {
          "name": "get_service",
          "title": "Get one service",
          "description": "One service: summary, options, FAQ, who it may not suit under the spa's terms, and its booking link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "enum": ["acne-facial", "argireline-facial", "cold-treatment", "dermaplaning", "express-d-tox", "express-facial", "hydro-luxx", "hydrojelly-mask", "led-anti-aging", "led-light", "microcurrent", "oxygen-infusion", "signature-ultrasonic"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booking_url": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "checked_on": {
                "description": "The day prices were last checked against the booking page.",
                "type": "string"
              },
              "faq": {
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question", "source_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "id": {
                "type": "string"
              },
              "may_not_suit": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "may_not_suit_source": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "page_url": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "variants": {
                "items": {
                  "properties": {
                    "booking_url": {
                      "type": "string"
                    },
                    "minutes": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price_usd": {
                      "type": "number"
                    }
                  },
                  "required": ["booking_url", "minutes", "name", "price_usd"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["booking_url", "category", "checked_on", "faq", "id", "may_not_suit", "may_not_suit_source", "name", "page_url", "summary", "variants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one service"
