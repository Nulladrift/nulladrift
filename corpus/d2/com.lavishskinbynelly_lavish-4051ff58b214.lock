          "digest": "sha256:8ab231b10dc2c7ddb94e45e0dbfa98cd594c2b0ffe55e0b887f669be9e5aac26"
        },
        {
          "name": "list_services",
          "title": "List services",
          "description": "Services with their options, length, price, page and booking link. Filter by category, highest price or longest length.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["Skincare Services", "Facials", "Add-On Any service"],
                "type": "string"
              },
              "max_minutes": {
                "minimum": 0,
                "type": "integer"
              },
              "max_price": {
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
