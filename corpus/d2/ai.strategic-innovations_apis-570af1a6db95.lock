{
  "lockfileVersion": 2,
  "subjects": {
    "ai.strategic-innovations/apis": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://strategic-innovations.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai.strategic-innovations/apis",
        "title": "Strategic Innovations APIs",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "fetch_page and check_agent_readiness run on your own key (Authorization: Bearer sik_…). No key yet? Call request_key with the email of the person you work for. Keys are also issued at https://strategic-innovations.ai/dashboard. 100 calls a day are free; each answer says how many are left.",
      "tools": [
        {
          "name": "check_agent_readiness",
          "title": "Check whether AI agents can use a website",
          "description": "Check a website the way an AI agent meets it: robots.txt and content signals, sitemap, Markdown on request, llms.txt, the API catalog, OAuth discovery, an MCP server card, agent skills, an A2A card, and whether the home page lets an agent in. Each file is checked by its body against an address that cannot exist, so a site that answers every path with its home page is reported as a false pass instead of a pass.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your key (sik_…), only if your MCP client cannot send it as the Authorization header, for example a key you just got from request_key. The header wins when both are sent.",
                "type": "string"
              },
              "url": {
                "description": "The site to check, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0c6a2eced1184ff266025b941ce174fe63537b43a25d034adb3019e01d681cd3"
        },
        {
          "name": "fetch_page",
          "title": "Fetch a web page as clean Markdown",
          "description": "Fetch a web page and get its main text as Markdown, with the title, word count, outgoing links, the final URL after redirects, and a SHA-256 of the Markdown. Before returning it, the page is judged: an app shell that needs JavaScript, a bot challenge, a cookie wall, a sign-in redirect or an error page comes back as verdict not_content with the reason, and does not count against your calls. Plain HTTP only: it does not run JavaScript.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your key (sik_…), only if your MCP client cannot send it as the Authorization header, for example a key you just got from request_key. The header wins when both are sent.",
                "type": "string"
              },
              "url": {
                "description": "The page to fetch, e.g. https://developers.cloudflare.com/workers/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d6296ed8d465a4ed755ce311e116798e0211300fa149f40ad5fd1c62cd192c3"
        },
        {
          "name": "request_key",
          "title": "Get an API key for this server",
          "description": "Get a working API key now, without a sign-up form. Give the email of the person you work for: the key works at once for a few calls a day, they get one email, and when they confirm it the same key moves to the free plan of 100 calls a day. Then send it as Authorization: Bearer <key> on this server.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "A short name for your agent, shown to that person",
                "type": "string"
              },
              "email": {
                "description": "Email of the person the agent works for",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d18683d27b342d64d3db71b1b0b6a375e763669f4c7e7b58463717711397c77"
        }
      ],
      "digest": "sha256:8f04f43698dfa3c48af5446852b2443ea134374050dc8c7b0121f82dcb753394"
    }
  }
}
