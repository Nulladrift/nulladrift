{
  "lockfileVersion": 2,
  "subjects": {
    "ai.arclan/registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://arclan.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "arclan-registry",
        "version": "0.1.0",
        "description": "MCP server registry — find and report on validated MCP servers"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_server",
          "description": "Get full details for a specific MCP server. Pass the server name (e.g. \"GitHub\", \"Brave Search\"), registry ID slug, or endpoint URL. Returns score, state, tools list, latency, and recent test history.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Server name, registry ID slug, or any identifier (e.g. \"github\", \"brave-search\", \"gateway-pipeworx-io-rpc-mcp\")",
                "type": "string"
              },
              "url": {
                "description": "The MCP server endpoint URL (e.g. \"https://mcp.example.com/mcp\")",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ec2c57f7926023c1b041434f608236b345a1be88a35a17d460f6d92b0838f35"
        },
        {
          "name": "query_registry",
          "description": "Search the Arclan registry for MCP servers. By default returns only connectable servers (active, mcp_partial, auth_gated). Use status=stdio to browse local-only servers available for installation. Use status=all to query the full index. Use production_safe=true to restrict to servers with uptime > 97% and handshake success > 95%. Use read_only=true to restrict to servers with no write or exec tools. Use this before connecting to an MCP server to check its validation status and score. After using a server, call report_server to contribute reliability data.",
          "inputSchema": {
            "properties": {
              "capability": {
                "description": "Filter by tool name or keyword (searches name, description, tools)",
                "type": "string"
              },
              "limit": {
                "description": "Max results to return 1–20 (default 10)",
                "type": "number"
              },
              "min_score": {
                "description": "Minimum validation score 0–100 (default 0)",
                "type": "number"
              },
              "production_safe": {
                "description": "Only return servers with uptime_7d > 97% and handshake_success_rate > 95%. Use when reliability matters.",
                "type": "boolean"
              },
              "read_only": {
                "description": "Only return servers with no write or exec tools — safe for read-only agent workflows.",
                "type": "boolean"
              },
              "status": {
                "description": "Filter by state. Default (omit): connectable states only (active + mcp_partial + auth_gated). Use \"stdio\" for local-install catalog. Use \"all\" for the full index.",
                "enum": ["active", "mcp_partial", "auth_gated", "stdio", "unreachable", "invalid", "zombie", "all"],
                "type": "string"
              },
              "transport": {
                "type": "string",
                "description": "Filter by transport type",
                "enum": ["http", "sse", "stdio", "unknown"]
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:71f6f2a3ccca002a450576ab0370628a0410393ceca518dff66cf1562d940b6d"
        },
        {
          "name": "recommend_server",
          "description": "Get ranked MCP server recommendations for a task. Returns servers scored by production safety, keyword relevance, registry score, latency, and freshness. Each result includes a reason code array explaining why it was ranked. Use this instead of query_registry when you want an opinionated ranked list rather than a filtered search.",
          "inputSchema": {
            "properties": {
              "auth": {
                "description": "Include servers that require authentication (default: true)",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results 1–20 (default: 5)",
                "type": "number"
              },
              "production_safe": {
                "description": "Only return production-safe servers (uptime > 97%, handshake > 95%)",
                "type": "boolean"
              },
              "q": {
                "description": "Task or capability query — e.g. \"search the web\" or \"read files\"",
                "type": "string"
              },
              "read_only": {
                "description": "Only return servers with no write-classified tools",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3cb06d1bbbaef32da321caefed034f0e26f3c846ad06404482e3bdd2a717696"
        },
        {
          "name": "report_server",
          "description": "Submit an agent usage report for an MCP server. Reports are aggregated and influence registry trust scores. Call this after using an MCP server so the registry can track real-world reliability. Supports both a simple outcome report and a structured scoring report (criterion + component_score).",
          "inputSchema": {
            "properties": {
              "agentId": {
                "description": "Identifier for the reporting agent (optional)",
                "type": "string"
              },
              "componentScore": {
                "description": "Score 0–100 for the specified criterion",
                "type": "number"
              },
              "criterion": {
                "description": "Specific reliability criterion being scored (enables structured component scoring)",
                "enum": ["output_reliability", "side_effect_transparency", "failure_handling", "rate_limits", "agent_feedback"],
                "type": "string"
              },
              "environment": {
                "description": "Environment the server was used in",
                "enum": ["prod", "staging", "dev", "unknown"],
                "type": "string"
              },
              "errors": {
                "description": "Array of error strings encountered during tool use",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "evidenceRef": {
                "description": "Trace ID, log URL, or other reference supporting this report",
                "type": "string"
              },
              "latencyMs": {
                "description": "Total wall-clock latency in milliseconds",
                "type": "number"
              },
              "outcome": {
                "description": "Result of using the server",
                "enum": ["success", "failure", "partial"],
                "type": "string"
              },
              "serverUrl": {
                "description": "The MCP server endpoint URL that was used",
                "type": "string"
              },
              "severity": {
                "description": "Severity of the worst issue encountered",
                "enum": ["info", "warning", "error", "critical"],
                "type": "string"
              },
              "taskCategory": {
                "description": "Category of task attempted (e.g. \"search\", \"write\", \"read\")",
                "type": "string"
              },
              "taskDescription": {
                "description": "Brief description of what the task was",
                "type": "string"
              },
              "toolsUsed": {
                "description": "List of tool names that were called",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "turnsRequired": {
                "description": "Number of turns to complete the task",
                "type": "number"
              }
            },
            "required": ["outcome", "serverUrl"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bcc89413afcf472cbbf0e99b37aa67a6b4ac642d724e0a4b15e37ab1ce016feb"
        }
      ],
      "digest": "sha256:248b3019ae33eca9d67b42508d35efd139097084507e781eab9cb1f05e596251"
    }
  }
}
