        {
          "name": "list_my_items",
          "title": "List my tagged items",
          "description": "Use when the person asks for their items marked fragile, or tagged to ship, sell, store, donate or toss, items already sold, or items missing a photo or a value. Only for the person's own BoxTrack account; the chat app asks them to connect it the first time.",
