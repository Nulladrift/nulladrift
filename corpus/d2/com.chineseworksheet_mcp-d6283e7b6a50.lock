        {
          "name": "analyze_hsk_vocabulary_level",
          "title": "HSK 3.0 & CEFR Chinese Character Difficulty Classifier",
          "description": "Classify Chinese characters or vocabulary sentences into official HSK proficiency tiers (HSK 1 to HSK 7-9), CEFR language equivalents (A1 to C2), and recommend matching printable worksheets.",
          "inputSchema": {
            "properties": {
              "chineseText": {
                "description": "Chinese character(s) or short sentence to analyze (e.g. \"我爱学习中文\", \"你好\", \"图书馆\")",
                "type": "string"
              },
              "hskStandard": {
                "description": "Official syllabus version: HSK 3.0 (9-band 2021+) or HSK 2.0 (6-level)",
                "enum": ["hsk3_0", "hsk2_0"],
                "type": "string"
              }
            },
            "required": ["chineseText"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "HSK 3.0 & CEFR Chinese Character Difficulty Classifier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16fb2a4ad66fc1a36cf68ada52460558d5344459e31cc2e7b9ac211288e03bef"
        },
        {
          "name": "calculate_worksheet_grid_geometry",
          "title": "Tian Zi Ge & Mi Zi Ge Vector Worksheet Grid Calculator",
          "description": "Calculate exact physical millimeter and PostScript point dimensions for printable Chinese writing grids (Tian Zi Ge, Mi Zi Ge, Jiu Gong Ge, Hui Zi Ge) on A4 or US Letter paper.",
          "inputSchema": {
            "properties": {
              "gridStyle": {
                "description": "Chinese character practice box style: tianzige (crosshair), mizige (diagonal+cross), jiugongge (9-square), huizige (inner proportion box)",
                "enum": ["tianzige", "mizige", "jiugongge", "huizige"],
                "type": "string"
              },
              "paperSize": {
                "description": "Physical paper standard: a4 (210x297mm) or letter (215.9x279.4mm)",
                "enum": ["a4", "letter"],
                "type": "string"
              },
              "rowsPerPage": {
                "description": "Pedagogical row density: 5 (kindergarten), 6 (standard grade 1-2), 7 (compact), 8 (HSK intensive)",
                "enum": [5, 6, 7, 8],
                "type": "integer"
              }
            },
            "required": ["gridStyle", "paperSize"],
            "type": "object"
          },
