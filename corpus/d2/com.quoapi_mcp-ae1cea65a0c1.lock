{
  "lockfileVersion": 2,
  "subjects": {
    "com.quoapi/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://quoapi.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "QuoAPI",
        "title": "QuoAPI",
        "version": "0.29.0",
        "websiteUrl": "https://quoapi.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use quoapi.search and quoapi.describe to discover capabilities, then quoapi.execute through the same policy, routing and billing core as REST.",
      "tools": [
        {
          "name": "quoapi.describe",
          "title": "Describe a QuoAPI capability",
          "description": "Read the DESIGN-TIME contract for an exact handle from quoapi.search (e.g. address.validate): inputSchema/outputSchema, auth/scopes, pricing, availability, regions and REST mapping. Use inputSchema before quoapi.execute. No upstream action or charges are performed; this does not test credentials or provider reachability. Unknown or MCP-ineligible handles return capability_not_mcp_visible. Use quoapi.inspect for runtime health, not contracts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "capability": {
                "description": "Copy the handle verbatim from quoapi.search capabilities[].handle (for example address.validate). A provider display name, URL or family name is not a handle; missing/ineligible handles raise capability_not_mcp_visible.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["capability"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0614b0aaf905e8d001dedc3c08bcfbc3ea69e3add721a1840487ca381a6960fb"
        },
        {
          "name": "quoapi.execute",
          "title": "Execute a QuoAPI capability",
          "description": "Execute an authorized handle using the inputSchema from quoapi.describe. May send messages, modify/delete data or incur charges: check pricing and obtain user approval first. For live actions, confirm=true, interactive confirmation or step-up may be required; policy can still deny execution. Optional task_id correlates workflow; provider selects an eligible upstream route; auth_mode selects a supported credential model—none bypasses access gates. Reuse idempotency_key only for the same operation with identical inputs. Returns gateway output or a structured error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "auth_mode": {
                "description": "Optional upstream credential mode: QUO_MANAGED (QuoAPI-managed), CONNECTED_ACCOUNT (tenant OAuth/account), BYOK (customer key), ENTERPRISE (approved enterprise credentials). Requires configured eligibility.",
                "enum": ["QUO_MANAGED", "CONNECTED_ACCOUNT", "BYOK", "ENTERPRISE"],
                "type": "string"
              },
              "capability": {
                "description": "Exact, case-sensitive capability ID from quoapi.search capabilities[].handle, e.g. address.validate. Use quoapi.describe to obtain that handle's inputSchema before execution.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "confirm": {
                "default": false,
                "description": "True only after the user explicitly approves this sensitive or billable live operation. Default false; server may request separate interactive confirmation or step-up and may still refuse.",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "Optional caller-chosen idempotency key. For retry after a timeout, reuse the identical key AND unchanged capability, input and execution context. Never reuse for a new action.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "input": {
                "description": "JSON object whose fields and required properties match quoapi.describe inputSchema for this capability. Do not pass the entire describe response. {} is valid only for capabilities with no required input.",
                "type": "object"
              },
              "provider": {
                "description": "Optional provider ID for a specific eligible upstream route. Omit for policy-driven routing; passing it does not create a connection, enable a disabled provider or override routing gates.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "task_id": {
                "description": "Optional external workflow/task correlation ID used in gateway execution metadata and audits. Not a capability handle, job-status lookup, or authorization token.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["capability", "input"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:722f26c3e122e4cdd4f3a15dd95371ba0dd7e29b80018e274a1508f0225aacdb"
        },
        {
          "name": "quoapi.inspect",
          "title": "Inspect QuoAPI runtime status",
          "description": "Read-only RUNTIME STATUS of the QuoAPI MCP gateway, not a provider execution. With no arguments returns state, server protocol version, tool count, visible capability count and discovery/registry revisions. Optional capability handle adds public context only: this is not to test upstream execution, a live upstream health probe, credentials or tenant authorization. Use quoapi.describe for schemas, pricing and auth; quoapi.search to discover handles; quoapi.execute for approved actions. Unknown handles return capability_not_mcp_visible; status incurs no upstream charges.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "capability": {
                "description": "Optional exact canonical handle from quoapi.search (e.g. address.validate) to include publicly visible capability context. Omit to inspect the gateway overall; use quoapi.describe for schemas.",
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b229a0abba51107fa5cb7897b1bebd811ae22c0f2894dd1c84246b27468a5e0"
        },
        {
          "name": "quoapi.search",
          "title": "Search QuoAPI capabilities",
          "description": "Find canonical QuoAPI capability handles by intent, ID or provider; catalog metadata are not upstream API results. Use query=\"*\" to enumerate MCP-visible capabilities (limit 1–20; offset 0 then next_offset until null). Inventory returns total/count/next_offset; keyword search returns up to limit matches without total. Provider/region filters restrict but never grant access. Results do not prove tenant authorization, a connected account or live provider availability. Use quoapi.describe for contracts; quoapi.inspect for runtime health.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "Page size between 1 and 20 (default 8). For query=*, read next_offset from the response and continue until it is null; keyword search returns at most this many matches.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Zero-based inventory cursor (default 0), valid only with query=*. Start at 0 and pass the response next_offset on each subsequent request; never increment beyond the returned total.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "provider": {
                "description": "Optional upstream provider ID/name (e.g. loqate) to filter to currently eligible routed capabilities. It does not inspect or authorize a tenant connection; omit to search across providers.",
                "maxLength": 120,
                "type": "string"
              },
              "query": {
                "description": "Intent or exact capability ID (e.g. address.validate), or provider name (e.g. Loqate). The only wildcard is the literal * for a filtered complete inventory; pass offset/limit to page through it.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Optional coverage-region code; results include matching region and global capabilities. Omit for every permitted region. Filtering cannot override region or release policies.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:faf1266f9cacde4b9d7f13b3ef25a13d12fc16191f545574c66d20a1c9b23af6"
        }
      ],
      "digest": "sha256:d80e30424da0ed0e3df6c13540d9977a293404f81a6f60b79ed446a82935f9de"
    }
  }
}
