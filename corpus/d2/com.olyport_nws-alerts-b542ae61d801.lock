      "tools": [
        {
          "name": "get_alert_detail",
          "description": "Get full details of a specific NWS weather alert by its ID.\n\n    Returns the complete alert including description, instructions, and\n    affected areas. Use alert IDs from get_alerts results.\n\n    Args:\n        alert_id: The full NWS alert ID (e.g. 'urn:oid:2.49.0.1.840.0.xxx').\n    ",
          "inputSchema": {
            "properties": {
              "alert_id": {
                "title": "Alert Id",
                "type": "string"
              }
            },
            "required": ["alert_id"],
            "title": "get_alert_detailArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_alert_detailOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:55e697f66cd45ff2a12fd3032d642557b54ce7e4e67bd07c1a12c9bb5d1fd461"
        },
        {
          "name": "get_alerts",
          "description": "Get active NWS weather alerts for a US state.\n\n    Returns current weather alerts including watches, warnings, and advisories\n    issued by the National Weather Service.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX', 'NY').\n        severity: Filter by severity level: 'Extreme', 'Severe', 'Moderate', or 'Minor'.\n        event: Filter by event type (e.g. 'Tornado Warning', 'Flash Flood Watch').\n        limit: Maximum number of alerts to return (default 25, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "event": {
                "default": null,
                "title": "Event",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "severity": {
                "default": null,
                "title": "Severity",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_alertsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_alertsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:458a5aef9715c16aeb462f9f4f1dc5f86614ec1c139df4f99f97fe6aaf11300c"
        },
        {
          "name": "get_forecast",
          "description": "Get the weather forecast for a specific latitude/longitude location.\n\n    Returns a multi-day forecast from the National Weather Service. Works for\n    any location within the United States and its territories.\n\n    Args:\n        latitude: Latitude of the location (e.g. 38.8894 for Washington DC).\n        longitude: Longitude of the location (e.g. -77.0352 for Washington DC).\n    ",
          "inputSchema": {
            "properties": {
              "latitude": {
                "title": "Latitude",
                "type": "number"
              },
              "longitude": {
                "title": "Longitude",
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "title": "get_forecastArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_forecastOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3c003ea76af4020a842237f08e78f5759a1b2be0721a8c4a5165f1ed5f5fbab"
        }
      ],
      "digest": "sha256:ff82fd6b138ab15d1ba1edff0e5a91216a58ae3347751a6aefa5cb7acb777670"
    }
  }
