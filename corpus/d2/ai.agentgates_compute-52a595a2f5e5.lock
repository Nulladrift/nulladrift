      "instructions": "Agentgates Compute: computers for AI swarms, rented for the time one payment buys (by the hour, or by the minute on a plan whose compute_plans card carries minMinutes) over x402, paid in USDC. No account and no sign-up: the wallet that pays owns what it buys.\nTwo kinds: a confidential VM (Intel TDX, memory encrypted while it runs, the host cannot read it, a public proof anyone checks) for agents that hold keys, money or private data, such as trading agents with wallet keys; and a plain VM (proof \"none\" in compute_plans: its own IP and any port, its host can read it) for agents with nothing secret on them, such as scrapers, crawlers, bots on public data and test runs, for much less.\nThese tools are free and read only: compute_plans (live plans and prices per network), compute_quote (the exact 402 for a plan, hours and setup, or a renewal, with what to sign) and compute_docs (how to pay, poll until running, renew, and sign owner calls).\nPaying happens over HTTP with your own wallet: send the quoted request with an X-PAYMENT header. On no clear answer, send the SAME X-PAYMENT again; never sign a second one.\nThe Agentgates wallet tools for a paired wallet are a separate server behind OAuth: https://mcp.agentgates.ai/api/mcp.\nWhat's new:\n- 2026-11-17, Sealed sandboxes: Issue: a short task bought a whole machine by the hour and waited for it to boot. Now: a sealed sandbox in a confidential VM sells by the minute, used by its owner alone at its own address, and runs at the paid answer if a host has room.\n- 2026-11-17, Sandbox proof checked on its page: Issue: a verify page showed a machine's proof and checked nothing. Now: a sealed sandbox's verify page runs the four checks and says each result, and how to run them yourself with agentgates sandbox verify.\n- 2026-11-17, Sandbox tools for agents: Issue: the CLI and the MCP tools ran machines only. Now: agentgates sandbox and agentgates mcp create a sealed sandbox, run commands and copy files in it, check its proof with your own nonce, renew and delete it; the compute MCP quotes it.\nAll of it: https://api.agentgates.ai/changelog.json",
