      "instructions": "Agentgates Compute: confidential computers for AI swarms, a confidential virtual machine (Intel TDX, memory encrypted in use) for each agent, for trading swarms or any other swarm, rented by the hour over x402, paid in USDC. No account and no sign-up: the wallet that pays owns the machine.\nThese tools are free and read only: compute_plans (live plans and prices per network), compute_quote (the exact 402 for a plan, hours and setup, or a renewal, with what to sign) and compute_docs (how to pay, poll until running, renew, and sign owner calls).\nPaying happens over HTTP with your own wallet: send the quoted request with an X-PAYMENT header. On no clear answer, send the SAME X-PAYMENT again; never sign a second one.\nThe Agentgates wallet tools for a paired wallet are a separate server behind OAuth: https://mcp.agentgates.ai/api/mcp.\nWhat's new:\n- 2026-11-11, Plain machines: Issue: every machine was a confidential one, priced for its proof. Now: compute.vm.standard and compute.vm.pro run your compose at their own address on any port, with no proof, for less; the catalog lists them.\n- 2026-11-10, Pay-as-you-go in SOL: Issue: pay-as-you-go on Solana took only USDC. Now: it takes SOL too, each later hour a transfer you sign ahead against a nonce account of yours, sent right before that hour starts.\n- 2026-11-09, Pay-as-you-go on Solana: Issue: pay-as-you-go took only pre-signed hours on EVM chains. Now: on Solana it takes USDC, the first hour's transaction approving extra.paygDelegate for extra.paygAllowance, each hour drawn right before it starts.\nAll of it: https://api.agentgates.ai/changelog.json",
