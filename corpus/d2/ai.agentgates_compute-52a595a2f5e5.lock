      "instructions": "Agentgates Compute: computers for AI swarms, rented for the time one payment buys (by the hour, or by the minute on a plan whose compute_plans card carries minMinutes) over x402, paid in USDC. No account and no sign-up: the wallet that pays owns what it buys.\nTwo kinds: a confidential VM (Intel TDX, memory encrypted while it runs, the host cannot read it, a public proof anyone checks) for agents that hold keys, money or private data, such as trading agents with wallet keys; and a plain VM (proof \"none\" in compute_plans: its own IP and any port, its host can read it) for agents with nothing secret on them, such as scrapers, crawlers, bots on public data and test runs, for much less.\nThese tools are free and read only: compute_plans (live plans and prices per network), compute_quote (the exact 402 for a plan, hours and setup, or a renewal, with what to sign) and compute_docs (how to pay, poll until running, renew, and sign owner calls).\nPaying happens over HTTP with your own wallet: send the quoted request with an X-PAYMENT header. On no clear answer, send the SAME X-PAYMENT again; never sign a second one.\nThe Agentgates wallet tools for a paired wallet are a separate server behind OAuth: https://mcp.agentgates.ai/api/mcp.\nWhat's new:\n- 2026-11-12, Which machine to pick: Issue: the docs, llms.txt, the MCP and the CLI did not say when to pick a plain machine over a confidential one. Now: confidential VMs for agents holding keys, money or private data; plain VMs for agents with nothing secret, for much less.\n- 2026-11-11, Counts and notices on the compute MCP: Issue: the compute MCP priced one machine per quote and dropped the notices the API sends with its answers. Now: compute_quote prices 2 to 10 machines in one payment, and compute_plans and compute_quote pass the notices on.\n- 2026-11-11, AI receipt as x_agentgates: Issue: AI answers and the model list at /api/inference/v1 carried their receipt and model details under x_godely. Now: the same fields also come under x_agentgates; read that one, as x_godely goes in a later release.\nAll of it: https://api.agentgates.ai/changelog.json",
