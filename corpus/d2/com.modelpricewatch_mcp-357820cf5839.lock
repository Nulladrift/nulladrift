{
  "lockfileVersion": 2,
  "subjects": {
    "com.modelpricewatch/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://modelpricewatch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "modelpricewatch",
        "title": "Model Price Watch",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live LLM API pricing from modelpricewatch.com. Use these tools to look up current input/output token prices, context windows, and capabilities for 150+ AI models across 20+ providers (OpenAI, Anthropic, Google, Mistral, xAI, etc.), and find the cheapest option for a use case. All prices are USD per 1,000,000 tokens.",
      "tools": [
        {
          "name": "cheapest_models",
          "title": "Find cheapest models",
          "description": "Find the cheapest current models, ranked by input price, output price, or a blended cost. The generic ranking covers generative text models (embeddings, OCR and realtime models are excluded — they price different work); pass category to rank a specific pool instead, e.g. 'embedding'. Use to answer 'what is the cheapest model for <use case>'.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by category, e.g. flagship, reasoning, budget, coding, embedding.",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 10, max 50).",
                "type": "number"
              },
              "open_source": {
                "description": "If true, only open-source models.",
                "type": "boolean"
              },
              "sort_by": {
                "description": "Ranking metric: 'input', 'output', or 'blended' (default 'blended').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:73b2423e4a12852f64f7b8fb40ecbd49a5b50110290acebb9fe594b231622589"
        },
        {
          "name": "get_model_pricing",
          "title": "Get model pricing",
          "description": "Get full pricing and capability details for one model by its id (from search_models). Returns input/output/cached price per 1M tokens, blended cost, context window, modality, release date, and the modelpricewatch.com page URL.",
          "inputSchema": {
            "properties": {
              "model_id": {
                "description": "The model id, e.g. 'anthropic-claude-opus-4-8' or 'openai-gpt-5-5'. Get ids from search_models.",
                "type": "string"
              }
            },
            "required": ["model_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98b6168c578360bdc353e34d923a6ec58242dc9685aaaef6db884b72340cccfc"
        },
        {
          "name": "list_providers",
          "title": "List providers",
          "description": "List all tracked AI model providers (OpenAI, Anthropic, Google, etc.) with a short description and their pricing page.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6675e9942c127c711ec5840612a058ddc7f0e8f3bef003d297f92392ae4dc482"
        },
        {
          "name": "search_models",
          "title": "Search models",
          "description": "Search the live LLM pricing database by model name, provider, or id. Returns matching models with current input/output prices (USD per 1M tokens), context window, modality, and category. Use this to answer 'how much does <model> cost' or 'what models does <provider> offer'.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by category, e.g. flagship, reasoning, budget, coding, embedding, fast, mid-tier.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 20, max 50).",
                "type": "number"
              },
              "open_source": {
                "description": "If true, only open-source/open-weight models; if false, only proprietary.",
                "type": "boolean"
              },
              "query": {
                "description": "Free-text match against model name, provider, or id (e.g. 'claude', 'gpt-5', 'gemini flash'). Omit to list all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3492027e4e74fca82b53f6cfbd27862e3ffafec11848a1d1a1cecfa45681e30"
        }
      ],
      "digest": "sha256:1855f131b007d21ccef28efbc03582bdc19f710749c9a40b2bc99a3c59ddf85b"
    }
  }
}
