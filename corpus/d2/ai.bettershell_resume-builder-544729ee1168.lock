        {
          "name": "tailor_resume",
          "title": "Make a tailored résumé",
          "description": "BetterShell's resume builder. Makes the person a finished, tailored one-page résumé PDF from their own résumé or CV: it picks their strongest material for the job, rewrites their bullets toward the job's language without inventing anything, puts the job's key terms on the page where their experience backs them, and fits the page exactly. The person downloads the PDF in the chat or opens it in BetterShell to edit any line. Use it for any request about the person's résumé or CV: tailor it to a job posting or an application, improve, edit, rewrite or update it, make it one page, or aim it at a kind of role. May answer needs_more with questions only the person can answer.",
          "inputSchema": {
