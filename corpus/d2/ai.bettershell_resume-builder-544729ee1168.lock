        {
          "name": "review_resume",
          "title": "Review a résumé",
          "description": "Measures the person's résumé the way BetterShell lays out a page and returns the facts for a review: how much of a page it fills, which jobs have one line, lines with no number or result, lines that open with what they were assigned rather than what they did, lines that run long, missing contact details, and, with a posting, the tools and terms it names that the résumé never does. Use it when the person asks for feedback, a critique or a review of their résumé or CV. It saves nothing. It returns facts; you give the review.",
          "inputSchema": {
            "properties": {
              "job": {
                "description": "What to aim the résumé at: a job posting (its full text is best, or its link), or the kind of role when there's no posting.",
                "properties": {
                  "company": {
                    "description": "Company, if known.",
                    "type": "string"
                  },
                  "description": {
                    "description": "The posting's full text, if you have it. Needed when the link can't be read.",
                    "type": "string"
                  },
                  "link": {
                    "description": "Link to the job posting.",
                    "type": "string"
                  },
                  "role": {
                    "description": "The kind of role to aim at when there's no posting, e.g. 'Mechanical engineer, new grad'. BetterShell tailors to what a typical posting for it asks.",
                    "type": "string"
                  },
                  "title": {
                    "description": "Job title, if known.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "resume": {
                "description": "The person's résumé word for word: every job, project and activity, with every bullet. If they've shared more than one résumé or more of their experience, all of it as one: each job once, every bullet kept. Never rewritten, improved or added to; leave out what they haven't given.",
                "properties": {
                  "activities": {
                    "description": "Leadership, clubs and volunteering that aren't jobs.",
                    "items": {
                      "properties": {
                        "bullets": {
                          "description": "The bullet points exactly as written, one string each.",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "end": {
                          "description": "As written on the résumé, e.g. 'Mar 2022', '2020' or 'Present'.",
                          "type": "string"
                        },
                        "organization": {
                          "description": "Organization.",
                          "type": "string"
                        },
                        "role": {
                          "description": "Role.",
                          "type": "string"
                        },
                        "start": {
                          "description": "As written on the résumé, e.g. 'Mar 2022', '2020' or 'Present'.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "certifications": {
                    "description": "Certifications and licenses the résumé lists as such, one each. A skill stays in skills.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "courses": {
                    "description": "Relevant coursework, if listed.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "education": {
