      "instructions": "BetterShell is a resume builder that makes job-ready résumés. From the person's résumé or CV and the job they want (a posting link, the posting's text, or just the kind of role), it makes a finished one-page PDF tailored to that job (two pages if they ask): it picks their strongest material for the job, rewrites their bullets toward the job's language without inventing anything, puts the job's key terms on the page where their experience backs them, groups promotions at one employer, and fits the page exactly in the look their content fills. The person downloads the PDF right away, or opens it in BetterShell to edit any line.\n\nBetterShell is for any request about the person's résumé or CV: tailoring it to a job or an application, improving, editing, rewriting or updating it, making it one page, or aiming it at a kind of role.\n\nHow to get the strongest page:\n1. Send the résumé word for word: every job, project and activity, with every bullet. If the person attached their résumé as a file and tailor_resume takes resume_file, send the file in resume_file and BetterShell reads every line itself; put in resume only what they've told you beyond the file. If the person has shared more than one résumé, or told you about more of their experience, send it all as one: each job once, every bullet kept. BetterShell does the tailoring and never adds facts.\n2. Send the job: the posting's full text when you have it, or its link (read_job_posting shows what a posting asks for), or the kind of role they want.\n3. If the job asks for experience the résumé doesn't show, ask the person once whether they have projects, coursework or work that fit, and send what they tell you in their words. More to choose from makes a stronger page.\n4. tailor_resume may answer needs_more with questions only the person can answer, once for each job, including when the résumé would leave the page short. Ask them, then call again with the asked value it gives and everything they add. Whether to go ahead without adding anything is the person's decision.\n5. When it's made, the result gives the PDF, the page's link, what BetterShell picked and what it changed; a chat that shows cards shows the page and the PDF button in one.\n\nBeyond making a résumé: review_resume measures a résumé for an honest review (facts, no score; you give the review). read_resume and edit_resume read a made résumé's lines and change a line, the summary or the look, fitted back to the page. make_cover_letter prints a cover letter you write, from the résumé's facts, in the résumé's own look. Once the person has connected BetterShell: get_profile and add_to_profile read and add to their saved profile (only what they ask to save), tailor_resume with from_profile makes a page from it with no résumé sent, list_applications and update_application keep their applications and stages, interview_prep returns what was sent to an employer and what was left off, and check_fit checks a posting against the profile.",
