        {
          "name": "meetings_search",
          "title": "Search your meeting transcripts",
          "description": "Ask a question across every meeting you have imported as queryable, and get back ranked excerpts with the meeting they came from. This is the tool to use when the user refers to something that was said, agreed, or decided in a call -- 'what did we decide about pricing', 'who owned the migration', 'when did we say we would ship'. Returns 'searched_meetings' and 'private_meetings_skipped': meetings imported as private are encrypted and CANNOT be searched, so if searched_meetings is 0 an empty result means nothing was searched, NOT that the topic was never discussed. Use meetings_get to read a full transcript once you have found the right meeting. Costs $0.010 in USDC on Base, paid via the x402 protocol, or from a credit token — call credits_trial for free credit if you have neither.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "credit_token": {
                "description": "Optional. A credit token from credits_trial or /credits/buy. Supplying it pays for this call from that balance, so no x402 payment or wallet is needed.",
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-50 (default 10)",
                "type": "integer"
              },
              "namespace": {
                "description": "Isolation scope holding your meetings",
                "type": "string"
              },
              "namespace_token": {
                "description": "One-time token issued by the first call that claimed this namespace. Required for every later call.",
                "type": "string"
              },
              "query": {
                "description": "FTS5 match expression. Use quotes for phrases, e.g. \"budget review\". Prefer a few distinctive words over a whole sentence.",
                "type": "string"
              }
            },
            "required": ["namespace", "namespace_token", "query"],
            "type": "object"
          },
          "outputSchema": {
