        {
          "name": "meetings_import",
          "title": "Import a meeting transcript",
          "description": "Store a transcript so it can be searched later. Accepts a raw WebVTT or SRT export straight from Zoom, Teams, Meet or a notetaker -- you do NOT need to strip timestamps or parse it first, and cues split across timing boundaries are merged so phrases still match. `visibility` is a required decision and cannot be guessed for you: 'queryable' stores plaintext, indexes it, and means this service can read it; 'private' stores ciphertext you encrypted yourself, which is unreadable here and therefore NEVER searchable. Send `transcript` for queryable and `ciphertext` for private -- the mismatched combinations are refused rather than silently doing the wrong thing. The first import into a namespace returns a namespace_token shown exactly once; save it or the namespace is unrecoverable. Costs $0.010 in USDC on Base, paid via the x402 protocol, or from a credit token — call credits_trial for free credit if you have neither.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ciphertext": {
                "description": "Client-side encrypted transcript. Only valid with visibility 'private'.",
                "type": "string"
              },
              "credit_token": {
                "description": "Optional. A credit token from credits_trial or /credits/buy. Supplying it pays for this call from that balance, so no x402 payment or wallet is needed.",
                "type": "string"
              },
              "namespace": {
                "description": "Isolation scope, e.g. my-meetings-<uuid>",
                "type": "string"
              },
              "namespace_token": {
                "description": "One-time token issued by the first call that claimed this namespace. Required for every later call.",
                "type": "string"
              },
              "occurred_at": {
                "description": "ISO-8601 time the meeting happened",
                "type": "string"
              },
              "participants": {
                "description": "Optional attendees",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "description": "Optional hint about the export format. Ignored if it disagrees with the file: WebVTT and SRT are detected from the content itself, unpacked into speaker-attributed text, and any speakers found are added to participants. Plain text is stored verbatim.",
                "type": "string"
              },
              "title": {
                "description": "Human-readable meeting title",
                "type": "string"
              },
              "transcript": {
                "description": "Plaintext transcript. Only valid with visibility 'queryable'.",
                "type": "string"
              },
              "visibility": {
                "description": "'queryable' (plaintext, searchable, readable by this service) or 'private' (ciphertext, never searchable). Defaults to private.",
                "type": "string"
