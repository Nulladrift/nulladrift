              },
              "completed_at": {
                "description": "ISO-8601 completion time",
                "type": "string"
              },
              "expires_at": {
                "description": "When the recorded result is discarded",
                "type": "string"
              },
              "has_result": {
                "description": "Distinguishes a recorded null result from no result at all",
                "type": "boolean"
              },
              "result": {
                "description": "The stored result, replayed to later claimants."
