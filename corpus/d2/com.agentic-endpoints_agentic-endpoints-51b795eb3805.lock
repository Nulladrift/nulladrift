        {
          "name": "x402_verify",
          "title": "Check an x402 endpoint before paying it",
          "description": "Call this BEFORE authorising payment to any x402 endpoint you did not write yourself. It fetches the endpoint's live payment challenge and compares it against every observation previously made by every other caller, so you learn things a single agent cannot see on its own -- above all, whether the address receiving the money has changed. A 'critical' entry in `drift` means something determining where funds go (pay_to, network or asset) is different from before: stop and confirm out of band. Read the LIVE `charges` in preference to any directory listing, and pass what the listing claimed as `expect` to have the disagreement reported. IMPORTANT: 'status':'ok' is NOT an endorsement -- it only means a challenge was read and recorded. It cannot tell you whether the operator will deliver anything for your money. 'first_observation':true means there is no history at all, so an empty `drift` proves nothing. ALWAYS read `prior_criticals`: `drift` only compares against the last observation, so an endpoint that swapped its payee earlier shows an empty `drift` once that swap became the baseline -- a non-zero `prior_criticals` means it has changed where money goes before, and that is true no matter how clean today's look is. 'status':'unreachable' is not evidence of fraud and not evidence of health; do not pay on it either way. A null `price_usd` means the token's units are unknown here and the amount was NOT converted -- do not assume it is small. Costs $0.010 in USDC on Base, paid via the x402 protocol, or from a credit token — call credits_trial for free credit if you have neither.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "credit_token": {
                "description": "Optional. A credit token from credits_trial or /credits/buy. Supplying it pays for this call from that balance, so no x402 payment or wallet is needed.",
                "type": "string"
              },
              "expect": {
                "additionalProperties": false,
                "description": "Optional. What a directory, README or earlier response led you to believe. Any disagreement with the live challenge is reported.",
                "properties": {
                  "asset": {
                    "description": "The token contract address you expected",
                    "type": "string"
                  },
                  "max_price_usd": {
                    "description": "Report a mismatch if the live price exceeds this",
                    "type": "number"
                  },
                  "network": {
                    "description": "The chain you expected. A name like 'base' and its CAIP-2 form 'eip155:8453' are understood as the same chain, so an endpoint upgrading protocol version is not reported as a mismatch.",
                    "type": "string"
                  },
                  "pay_to": {
                    "description": "The address you expected to pay",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "method": {
                "description": "How to provoke the challenge: 'POST' (default), 'GET' or 'HEAD'. Use the method you intend to pay for.",
                "type": "string"
              },
              "url": {
                "description": "Public HTTPS URL of the endpoint you are about to pay. Loopback and private-network addresses are refused rather than fetched.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "advice": {
                "description": "Plain-language statement of what was and was not established",
                "type": "string"
              },
              "charges": {
                "description": "What the endpoint declares it will charge, right now",
                "properties": {
                  "amount": {
                    "description": "Amount in the asset's smallest unit, as a string",
                    "type": "string"
                  },
                  "asset": {
                    "description": "Token contract address",
                    "type": "string"
                  },
                  "network": {
                    "description": "Chain the payment settles on",
                    "type": "string"
                  },
                  "pay_to": {
                    "description": "Address that would receive the money",
                    "type": "string"
                  },
                  "price_usd": {
                    "description": "Amount in dollars, or null when the token's decimals are unknown here. Null means unconverted, not free.",
                    "type": ["string", "null"]
                  },
                  "scheme": {
                    "description": "x402 payment scheme",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "drift": {
                "description": "Differences from the last observation. Any severity 'critical' entry changes where money goes. Null means no comparison was made at all, which is not the same as an empty array.",
                "items": {
                  "properties": {
                    "field": {
                      "description": "What changed",
                      "type": "string"
                    },
                    "from": {
                      "description": "Previous value",
                      "type": "string"
                    },
                    "note": {
                      "description": "Why it matters",
                      "type": "string"
                    },
                    "severity": {
                      "description": "'critical' when something determining where money goes is new, 'warning' when it is worth knowing, 'info' when it is merely a fact",
                      "type": "string"
                    },
                    "to": {
                      "description": "Current value",
                      "type": "string"
                    }
                  },
                  "required": ["field", "severity"],
                  "type": "object"
                },
                "type": ["array", "null"]
              },
              "first_observation": {
                "description": "True when there was no prior record, so an empty `drift` means nothing",
                "type": "boolean"
              },
              "first_seen": {
                "description": "ISO-8601 time this endpoint was first observed",
                "type": "string"
              },
              "http_status": {
                "description": "Status code the endpoint returned",
                "type": "number"
              },
              "last_critical": {
                "description": "The most recent previously recorded critical change, or null if there has never been one.",
                "properties": {
                  "at": {
                    "description": "ISO-8601 time the change was recorded",
                    "type": "string"
                  },
                  "field": {
                    "description": "What changed: pay_to, network or asset",
                    "type": "string"
                  },
                  "from": {
                    "description": "The previous value",
                    "type": "string"
                  },
                  "to": {
                    "description": "The value that replaced it",
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "last_seen": {
                "description": "ISO-8601 time of the previous observation",
                "type": "string"
              },
              "matches_expectation": {
                "description": "Present only when `expect` was supplied",
                "type": "boolean"
              },
              "mismatches": {
                "description": "How the live challenge disagrees with what you expected",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "prior_criticals": {
                "description": "How many critical changes have EVER been recorded for this endpoint, not counting this call. `drift` only compares against the last observation, so once a change has been absorbed into the baseline it stops appearing there. A non-zero value here means this endpoint has changed where money goes before, even when `drift` is empty.",
                "type": "number"
              },
              "reachable": {
                "description": "Whether the endpoint answered at all",
                "type": "boolean"
              },
              "status": {
                "description": "'ok' means a challenge was read -- NOT that the endpoint is trustworthy. 'refused' means the URL was never fetched. 'unreachable', 'redirected' and 'not_x402' all mean no challenge was obtained.",
                "type": "string"
              },
              "times_seen": {
                "description": "How many observations exist, across all callers",
                "type": "number"
              },
              "url": {
                "description": "The URL that was checked",
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
