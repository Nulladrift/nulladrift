        {
          "name": "ingatlan_save_draft",
          "description": "Save the seller's listing as a DRAFT — never live: the seller opens its activate_url, adds the photos and the map pin, accepts the terms and posts it. Checked by the posting form's rules; if something is missing or wrong, nothing is saved and the message says what to ask. At most 3 drafts; give draft_id to update one. Prices are whole amounts: a sale in millions with at most one decimal (42900000), a rent a month in whole thousands. Needs the seller's sign-in.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "maxLength": 300,
                "type": "string"
              },
              "building": {
                "description": "Required for a home.",
                "enum": ["house", "semi-detached", "small-condo", "large-condo", "housing-estate"],
                "type": "string"
              },
              "currency": {
                "maxLength": 3,
                "type": "string"
              },
              "deadline": {
                "description": "Last day for offers, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "description": {
                "maxLength": 20000,
                "type": "string"
              },
              "draft_id": {
                "description": "Update this draft instead of making a new one.",
                "maxLength": 64,
                "type": "string"
              },
              "facts": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    {
                      "items": {
                        "additionalProperties": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "number"
                            }
                          ]
                        },
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "type": "array"
                    }
                  ]
                },
                "description": "By key, as ingatlan_draft_fields lists them.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "kind": {
                "enum": ["home", "shop"],
                "type": "string"
              },
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "rent": {
                "properties": {
                  "min_months": {
                    "maximum": 120,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "monthly_rent": {
                    "description": "Asking rent a month, e.g. 250000.",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  "reserve": {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["min_months", "monthly_rent"],
                "type": "object"
              },
              "sale": {
                "properties": {
                  "price": {
                    "description": "Asking price, e.g. 65000000.",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  "reserve": {
                    "description": "Hidden minimum, at most the price; the price when omitted.",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["price"],
                "type": "object"
              },
              "title": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["kind", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8d3f140c9e27568a3202f4270c6b6e513805d6785ef964e4500a6d041baa7015"
        },
        {
          "name": "ingatlan_search_listings",
          "description": "Search the live listings of otthon & üzlet (otthonesuzlet.hu), Hungarian homes and shops for sale or rent with sealed offers. Returns a page of listings (code, url, title, address, asking prices, deadline, a short summary) and the same search's catalogue_url. A search needs three conditions: a place (in text), a kind of property (filters.building, kind \"shop\", or typed) and one more condition. Until it has them the answer is a guide, not listings: { valid: false, missing, how, choices } — choices are the filter values there are for the place typed, with counts. Ask the user the questions in ask_user (never guess a missing condition), then search again.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "building": {
                "description": "A home's building type (one; for several use filters.building).",
                "enum": ["house", "semi-detached", "small-condo", "large-condo", "housing-estate"],
                "type": "string"
              },
              "deal": {
                "description": "For sale or for rent. With \"rent\" the price range is the monthly rent.",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "filters": {
                "description": "The site's chips, each a list of values: building (the kind of property: house, semi-detached, small-condo, large-condo, housing-estate, shop), rooms, newness, condition, heating, extras.",
                "properties": {
                  "building": {
                    "description": "Ingatlantípus: any of them.",
                    "items": {
                      "enum": ["house", "semi-detached", "small-condo", "large-condo", "housing-estate", "shop"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "condition": {
                    "description": "Állapot: any of them.",
                    "items": {
                      "enum": ["like-new", "renovated", "good", "average", "needs-renovation", "shell-complete", "to-demolish"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "extras": {
                    "description": "Felszereltség: all of them.",
                    "items": {
                      "enum": ["balcony", "garage", "elevator", "air-conditioning", "basement"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "heating": {
                    "description": "Fűtés: any of them.",
                    "items": {
                      "enum": ["gas", "district", "central", "heat-pump", "electric", "solid-fuel"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "newness": {
                    "description": "Új vagy használt: any of them.",
                    "items": {
                      "enum": ["new", "used"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "rooms": {
                    "description": "Szobák: any of them.",
                    "items": {
                      "enum": ["2-plus", "3-plus"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "kind": {
                "description": "\"home\" or \"shop\".",
                "enum": ["home", "shop"],
                "type": "string"
              },
              "max_price": {
                "description": "Highest asking price, a whole amount in HUF.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "min_price": {
                "description": "Lowest asking price, a whole amount in HUF (e.g. 40000000; a rent e.g. 150000).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "near": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "const": 200,
                      "type": "number"
                    },
                    {
                      "const": 400,
                      "type": "number"
                    },
                    {
                      "const": 800,
                      "type": "number"
                    },
                    {
                      "const": 1500,
                      "type": "number"
                    },
                    {
                      "const": 3000,
                      "type": "number"
                    },
                    {
                      "const": 5000,
                      "type": "number"
                    },
                    {
                      "const": 10000,
                      "type": "number"
                    },
                    {
                      "const": 15000,
                      "type": "number"
                    },
                    {
                      "const": 300,
                      "type": "number"
                    },
                    {
                      "const": "any",
                      "type": "string"
                    },
                    {
                      "const": "none",
                      "type": "string"
                    }
                  ]
                },
                "description": "Things within a distance, e.g. { \"transit-stop\": 400, \"school\": 800 }. Distances: 200, 400, 800, 1500, 3000, 5000, 10000, 15000 m. nightclub (300 m), railway (300 m), major-road (300 m), cemetery (300 m), industrial (300 m), airport (5000 m): \"none\" (none within that distance), \"any\" (no matter) or that distance (want one); unset: no matter.",
                "propertyNames": {
                  "enum": ["transit-stop", "kindergarten", "school", "doctors", "pharmacy", "chain-supermarket", "small-shop", "parcel-locker", "train-station", "hospital", "mall", "swimming", "cinema", "museum", "metro", "park", "green-area", "cycleway", "thermal-bath", "water-park", "ambulance-station", "emergency-hospital", "government-window", "nightclub", "railway", "major-road", "cemetery", "industrial", "airport"],
                  "type": "string"
                },
                "type": "object"
              },
              "page": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "page_size": {
                "description": "At most 20; 10 by default.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Closing soonest first by default (relevance, the site's \"Legjobb egyezés\", keeps that order here).",
                "enum": ["relevance", "deadline", "price_asc", "price_desc", "newest"],
                "type": "string"
              },
              "text": {
                "description": "Required: a place, up to 5 — any of them: a settlement (\"Győr\"), a city part of one settlement only (\"Kelenföld\", \"Zugló\"), or \"Settlement-Part\" with a hyphen for a part several settlements have (\"Győr-Belváros\", \"Szeged-Tápé\", \"Budapest-Zugló\", \"Budapest-XI.\"; \"Belváros\" alone is no place); a county with \"megye\" (\"Fejér megye\"); a side of the Danube (\"budai oldal\", \"pesti oldal\"); and words or figures for the rest (e.g. \"lakótelep\", \"erkély\", \"3 szobás\", \"60 millió alatt\"); all must match, in any order, each category any of its values. Accents optional; \"út\" = \"utca\".",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b29e1fddcf7f6b804957c66e9711cb5f0b36ca866fa19c05cb43d7ded6eabead"
        }
      ],
      "resources": [
        {
          "uri": "ingatlan://draft/fields",
          "name": "draft-fields",
          "title": "What a listing draft asks the seller",
          "description": "Every field to ask the seller before ingatlan_save_draft: the kinds and building types, the general fields (title, prices in millions with one decimal / whole thousands, deadline…) and each property fact with its type, options, bounds, whether it is required and when it applies (kind, building, sale or rent, only_when another fact has a value). Photos and the map pin are not asked: the seller adds them when activating.",
          "mimeType": "application/json",
          "digest": "sha256:b46500162e00aca46394bc253acf21c4715700179824f65cadb8ff4021b73e03"
        }
