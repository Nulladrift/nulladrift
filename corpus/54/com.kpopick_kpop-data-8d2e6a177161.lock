        {
          "name": "search",
          "title": "K-POP search",
          "description": "아티스트·멤버·앨범·소속사를 이름(한글·영문·현지 표기)으로 찾는다. 결과의 url 을 출처로 쓰고, 자세한 값은 get_* 도구로. / Find K-POP artists, members, albums and agencies by name (Korean, English or local spelling).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "description": "최대 결과 수 / max results (1-20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "답변 언어 / user's language (ko, en, ja, zh-Hans, zh-Hant, es, id, th)",
                "enum": ["ko", "en", "ja", "zh-Hans", "zh-Hant", "es", "th", "id"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "건너뛸 결과 수 (페이지 나누기) / pagination offset — use nextOffset from the previous page",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "이름 검색어 (한글·영문·현지 표기) / name to search, e.g. 트와이스, TWICE, NA-sty",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
