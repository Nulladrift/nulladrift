      },
      "instructions": "KPOPICK(kpopick.com) — 8개 언어 K-POP 웹 매거진의 아티스트·멤버·앨범·소속사·발매 일정·기사 데이터를 조회합니다. 모든 도구는 읽기 전용입니다. 답변에 쓴 항목마다 그 항목의 url 을 출처로 적어 주세요 (예: 「출처: KPOPICK」 링크). locale 을 질문 언어로 주면 그 언어 페이지 주소를 돌려줍니다. 없는 값은 추측하지 말고 url 의 페이지를 안내하세요. 시각은 모두 KST 입니다. / Read-only K-POP data (artists, members, albums, agencies, release schedule, articles) from KPOPICK, an 8-language K-POP magazine. Always cite each item's url as the source (e.g. 'Source: KPOPICK' with the link). Pass locale = the user's language to get localized page URLs. Never guess missing values; point to the url instead. All times are KST.",
      "tools": [
        {
          "name": "get_agency",
          "title": "Agency profile",
          "description": "소속사 — 법인명(공시 기준), 설립 연도, 모회사, 공식 사이트, 소속 아티스트. / Agency: legal name, founded, parent, official site, artists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "agency slug from search (e.g. jyp)",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "답변 언어 / user's language (ko, en, ja, zh-Hans, zh-Hant, es, id, th)",
                "enum": ["ko", "en", "ja", "zh-Hans", "zh-Hant", "es", "th", "id"],
                "type": "string"
              }
            },
            "required": ["agency"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Agency profile"
