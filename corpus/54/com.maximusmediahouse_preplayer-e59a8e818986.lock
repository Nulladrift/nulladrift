      },
      "instructions": "PrepLayer.ai is deterministic text prep for agents — normalize, validate, dedupe, redact, diff, chunk, extract, hash. Every tool is paid per call in USDC via x402 (Base, Solana, Polygon, Arbitrum); there is no account and no API key. Payment model: an unpaid tools/call returns isError with the x402 PaymentRequired object (including the bazaar discovery extension) in structuredContent. The client signs one accepted option with its own wallet and repeats the call with the base64 PaymentPayload in params._meta[\"x402/payment\"]; @x402/mcp's createx402MCPClient automates that flow. The Worker never holds funds — payment comes from the caller's wallet — and a failed call is not settled.",
      "tools": [
        {
          "name": "batch",
          "title": "batch",
          "description": "Run up to 10 primitive calls in one round trip for one x402 payment of $0.02 (= $0.0020 per call, below the priciest single-call route at $0.01). Each request names an `endpoint` (normalize, validate, extract, redact, classify, dedupe, diff, chunk, extract_custom, validate_json, slugify, hash) and its input; results return in request order. Single payment, no streaming. Larger rungs cost less per call: /v1/batch/50 ($0.075, $0.0015/call) and /v1/batch/100 ($0.100, $0.0010/call). $0.02 USDC per successful call (x402, client-paid); failed calls are not charged.",
          "inputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
