                      "description": "Split long text into pieces for RAG retrieval. Strategies: 'sentence' packs whole sentences into a size budget and never splits mid-sentence; 'paragraph' prefers \\n\\n boundaries; 'fixed' is a hard char window with overlap. The highest-value endpoint for agents that build retrieval pipelines.",
                      "example": {
                        "overlap": 100,
                        "size": 1000,
                        "strategy": "sentence",
                        "text": "…"
                      },
                      "inputSchema": {
                        "properties": {
                          "overlap": {
