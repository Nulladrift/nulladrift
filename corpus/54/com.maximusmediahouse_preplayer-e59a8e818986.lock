        {
          "name": "dedupe",
          "title": "dedupe",
          "description": "Near-duplicate detection across a batch of documents. Exact Jaccard similarity over word-3-shingle sets decides duplication; a 64-bit SimHash is returned per document as a compact content fingerprint. Up to 200 documents per call. $0.01 USDC per successful call (x402, client-paid); failed calls are not charged.",
          "inputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "x402/bazaar": {
              "extensions": {
                "bazaar": {
                  "info": {
                    "input": {
                      "description": "Near-duplicate detection across a batch of documents. Exact Jaccard similarity over word-3-shingle sets decides duplication; a 64-bit SimHash is returned per document as a compact content fingerprint. Up to 200 documents per call.",
                      "example": {
                        "documents": ["the quick brown fox jumps over the lazy dog", "the quick brown fox jumped over a lazy dog"],
                        "threshold": 60
                      },
                      "inputSchema": {
                        "properties": {
                          "documents": {
