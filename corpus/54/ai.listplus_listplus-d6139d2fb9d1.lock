        {
          "name": "search_people",
          "title": "Search people",
          "description": "PAID (needs a key) — 2 credits per page of up to 25 people, only for pages the database counts (a repeat within 30 days and an empty result cost nothing). Finds people in the B2B contact database by job title, seniority, department, place, industry, company size or company. The people go into a list in ListPlus (name, job title, company, domain, LinkedIn, place — no e-mail or phone: those are enrich_records, priced in `options`). Up to 4 pages per call, a cursor for the next ones (20 pages deep). Exact values from search_options; estimate:true shows the filters as understood and the price (free, no key).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "Company names",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "company_domains": {
                "description": "Company domains, e.g. acme.com (more exact than names)",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "cursor": {
                "description": "From the last answer: the next pages of the same search into the same list",
                "maxLength": 4000,
                "type": "string"
              },
              "departments": {
                "description": "Departments, e.g. Marketing, Sales — values: search_options category departments",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 14,
                "type": "array"
              },
              "estimate": {
                "description": "true = the filters as understood and the price, nothing runs (free, no key)",
                "type": "boolean"
              },
              "exact_titles": {
                "description": "true = job titles match exactly, not as \"contains\"",
                "type": "boolean"
              },
              "has_email": {
                "description": "Only people the database holds a verified work e-mail for",
                "type": "boolean"
              },
              "has_mobile": {
                "description": "Only people the database holds a verified mobile number for",
                "type": "boolean"
              },
              "headcount": {
                "description": "The company's size class, e.g. 51-100 — values: search_options category headcount",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 11,
                "type": "array"
              },
              "industries": {
                "description": "The company's industries; everyday words like saas or fintech are understood — values: search_options category industries",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "job_titles": {
                "description": "Matched as CONTAINS unless exact_titles",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "keywords": {
                "description": "Words in the person's profile",
                "items": {
                  "maxLength": 50,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "language": {
                "description": "Language of `tell_your_user` (default en)",
                "enum": ["en", "de"],
                "type": "string"
              },
              "list_id": {
                "description": "Append to this list of the workspace (default: a new list per search)",
                "maxLength": 80,
                "type": "string"
              },
              "list_name": {
                "description": "The new list's name",
                "maxLength": 80,
                "type": "string"
              },
              "locations": {
                "description": "Where the PERSON is: cities, countries, territories (DACH, EMEA)",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "max_credits": {
                "description": "The most this call may cost; it loads fewer pages / refuses rather than spend more",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "pages": {
                "description": "Pages of up to 25 to load in this call (default 1)",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "seniorities": {
                "description": "Seniorities, e.g. Director, VP, C-Suite — values: search_options category seniorities",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
