                            "properties": {
                              "kind": {
                                "type": "string"
                              }
                            },
                            "required": ["kind"],
                            "type": "object"
                          },
                          "op": {
                            "description": "An operator describe_setup offers for that field",
                            "type": "string"
                          },
                          "values": {
                            "items": {
                              "type": "string"
                            },
