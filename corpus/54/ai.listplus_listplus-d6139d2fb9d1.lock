                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "hide",
                          "type": "string"
                        }
                      },
                      "required": ["kind"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
