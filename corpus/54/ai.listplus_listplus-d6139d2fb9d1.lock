        {
          "name": "create_trigger",
          "title": "Create a rule",
          "description": "FREE (key, Set up) to set up — Use when something should happen by itself whenever a record arrives, changes or meets a condition. a rule (trigger) of a list: when a record is new / changed / meets the conditions, set a status (a new name is created), add a tag, hide it (it leaves the normal flow: no checks, rules, enrichment or sync — restorable), hand it to an EXISTING pipeline (pipelines are made by a person in the app), or ENRICH it — PAID per hit, at most budget_per_record credits per record, on THIS connection's day budget (an empty day makes the rule wait, never overspend). Active at once unless activate: false — set an enrich rule up paused until your user agreed to the budget. include_existing runs it once for the records already in the list. Status, tag and hide need Edit on the list; a pipeline the pipeline's share; enrich Full. Call describe_setup first for the fields and operators.",
          "inputSchema": {
            "additionalProperties": false,
