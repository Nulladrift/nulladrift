        {
          "name": "update_trigger",
          "title": "Change or remove a rule",
          "description": "FREE (key, Set up) — pause, activate, change or remove (remove: true) a rule of a list. Your own rules with the rights of their actions; a rule a person or another connection set up only with the list shared in Full — ask your user first. `actions` replaces the rule's actions (an enrich action named again keeps its settings' place; one left out goes). Enrichment only on your own rules.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actions": {
                "items": {
                  "oneOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "status",
                          "type": "string"
                        },
                        "status": {
                          "description": "A status NAME; a new one is created. \"hidden\" hides the record",
                          "maxLength": 30,
                          "minLength": 1,
                          "type": "string"
