                      },
                      "required": ["kind", "status"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "tag",
                          "type": "string"
                        },
                        "tag": {
                          "maxLength": 60,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["kind", "tag"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "hide",
                          "type": "string"
                        }
                      },
                      "required": ["kind"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "pipeline",
                          "type": "string"
                        },
                        "pipeline": {
                          "description": "An EXISTING pipeline's id or name (describe_setup)",
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["kind", "pipeline"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "budget_per_record": {
                          "description": "The most credits per record (default 10)",
                          "enum": ["5", "10", "25", "50"],
                          "type": "string"
                        },
                        "fields": {
                          "description": "Fields to fill: email, phone, job_title, linkedin_profile_url, company_name, domain, industry, city, country",
                          "items": {
                            "maxLength": 40,
                            "type": "string"
                          },
                          "maxItems": 8,
                          "minItems": 1,
                          "type": "array"
                        },
                        "fill": {
                          "description": "empty_only (default), empty_or_invalid, replace_all",
                          "enum": ["empty_only", "empty_or_invalid", "replace_all"],
                          "type": "string"
                        },
                        "kind": {
                          "const": "enrich",
                          "type": "string"
                        }
                      },
                      "required": ["fields", "kind"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "conditions": {
                "additionalProperties": false,
                "description": "Groups are OR-ed, the conditions inside a group AND-ed: { groups: [[cond, cond], [cond]] }",
                "properties": {
                  "groups": {
                    "items": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "field": {
                            "additionalProperties": {},
                            "description": "A field exactly as describe_setup names it, e.g. { \"kind\": \"contentType\", \"key\": \"job_title\" }, { \"kind\": \"column\", \"name\": \"score\" }, { \"kind\": \"status\" }, { \"kind\": \"tags\" }",
                            "properties": {
                              "kind": {
                                "maxLength": 20,
                                "type": "string"
                              }
                            },
                            "required": ["kind"],
                            "type": "object"
                          },
                          "op": {
                            "description": "An operator describe_setup offers for that field",
                            "maxLength": 40,
                            "minLength": 1,
                            "type": "string"
                          },
                          "values": {
                            "items": {
                              "maxLength": 500,
                              "type": "string"
                            },
                            "maxItems": 100,
                            "type": "array"
                          }
                        },
                        "required": ["field", "op"],
                        "type": "object"
                      },
                      "maxItems": 12,
                      "type": "array"
                    },
                    "maxItems": 5,
                    "type": "array"
                  }
                },
                "required": ["groups"],
                "type": "object"
              },
              "include_existing": {
                "type": "boolean"
              },
              "language": {
                "description": "Language of `tell_your_user` and of Yes/No words in new columns (default en)",
                "enum": ["en", "de"],
                "type": "string"
              },
              "list_id": {
                "description": "The list's id (describe_list shows the lists shared with you)",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "on": {
                "enum": ["new", "changed", "match"],
                "type": "string"
              },
              "remove": {
                "const": true,
                "type": "boolean"
              },
              "status": {
                "enum": ["active", "paused"],
                "type": "string"
              },
              "trigger_id": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["list_id", "trigger_id"],
            "type": "object"
          },
