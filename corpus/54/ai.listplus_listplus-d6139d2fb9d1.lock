                "enum": ["en", "de"],
                "type": "string"
              },
              "list_id": {
                "description": "The list's id (describe_list shows the lists shared with you)",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "on": {
                "enum": ["new", "changed", "match"],
                "type": "string"
              },
              "remove": {
                "const": true,
                "type": "boolean"
              },
              "status": {
                "enum": ["active", "paused"],
                "type": "string"
              },
              "trigger_id": {
