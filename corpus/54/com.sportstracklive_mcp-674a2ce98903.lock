      "capabilities": {
        "tools": {}
      },
      "instructions": "SportsTrackLive — live GPS sports tracking and sport-specific activity analysis (paragliding, hang gliding, gliding, sailing, cycling, running, skiing…). Use analyze_activity_file to analyze a user's GPS trace file (GPX/TCX/IGC/SBP/FIT): it returns computed metrics plus, per sport, thermals, flight phases with glide polar and MacCready, wind estimate and laps. Browse the public platform data with get_live_activities (who is live right now), search_tracks / get_track_stats (public activities and their statistics), search_athletes (public profiles) and get_track_replay_3d (interactive 3D replay URL) — these are read-only, anonymous, and only ever return public data. For the user's OWN file, create_ephemeral_replay builds a private 3D replay (no account, link valid 7 days) and import_activity saves it to their account (OAuth). Whenever you cannot transmit a file yourself — no shell, a sandbox that blocks this host, a file too large to inline — call create_upload_link and let the user drop the file in their browser; never give up on a file for lack of an upload route.",
      "tools": [
        {
          "name": "analyze_activity_file",
          "description": "Analyze a GPS activity trace file (GPX, TCX, IGC, SBP or FIT, max 8 MiB) and return sport-specific metrics computed by the SportsTrackLive engine: distance, speeds, altitudes, and — depending on the sport — thermal detection with climb statistics, flight phases (glide/float/search) with glide polar and MacCready, wind estimation, lap detection around course marks, and splits. Stateless: nothing is stored, no account needed. HOW TO SEND THE FILE — pass exactly one of `file_url`, `upload_id` or `file_base64`. Take the first route below that works where you run and move on to the next whenever one is blocked; a blocked route is never a reason to stop or to ask the user to change settings. (1) The file already has a public https link: pass it as `file_url`. (2) You have a shell with outbound network access: `curl -s -X POST https://mcp.sportstracklive.com/upload --data-binary @/path/to/file` then pass the returned `upload_id`. A 403, a proxy error or a timeout here means your sandbox blocks the host — go to the next route. (3) The file is small: `file_base64`, keeping the base64 text under ~100 KB; gzip is inflated automatically, so `gzip -9 -c file | base64` fits traces 3–4× larger. (4) ALWAYS WORKS, including chat apps with no shell or a locked-down sandbox: call `create_upload_link`, give the user the link it returns, and once they have dropped the file there call this tool with the returned `upload_id`. Never retype or reconstruct file content by hand.",
          "inputSchema": {
            "$defs": {
              "DetailLevel": {
                "enum": ["standard", "full"],
                "type": "string"
              },
              "MeasureUnit": {
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "SportKind": {
                "description": "Sport declared by the calling agent. `Auto` lets the server guess from\nthe file format and the trace kinematics; the resolved value is returned\nin `context_used` so the agent can correct it and call again.",
                "enum": ["auto", "paragliding", "hang_gliding", "glider", "balloon", "sailing", "windsurfing", "cycling", "mountain_biking", "running", "trail_running", "ski", "hiking", "motorsport", "other"],
                "type": "string"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "$ref": "#/$defs/DetailLevel",
                "description": "\"standard\" (default) returns every computed insight but strips the\nbulky point-level payloads (per-phase segment lists, wind timeline,\npause/trim ranges) — a few KB instead of tens. \"full\" returns the\nraw engine output unabridged."
              },
              "file_base64": {
                "default": null,
                "description": "The file content, base64-encoded — for small files only, since you\nemit every character yourself: keep the base64 text under ~100 KB.\nA gzip stream is detected and inflated server-side, so\n`gzip -9 -c file | base64` is accepted as is and fits traces 3–4×\nlarger. Past that, use `upload_id` (see `create_upload_link`).",
                "type": ["string", "null"]
              },
              "file_url": {
                "default": null,
                "description": "Public https:// URL of the file (e.g. a cloud share or export link);\nthe server downloads it (15 MiB cap). Provide exactly one of\n`file_url`, `upload_id` or `file_base64`.",
                "type": ["string", "null"]
              },
              "filename": {
                "description": "File name including its extension — the extension selects the parser.\nSupported: .gpx, .tcx, .igc, .sbp, .fit",
                "type": "string"
              },
              "measure_unit": {
                "$ref": "#/$defs/MeasureUnit",
                "description": "Preferred units for the computed metrics (\"metric\" default, or\n\"imperial\")."
              },
              "sport": {
                "$ref": "#/$defs/SportKind",
                "default": "auto",
                "description": "Sport of the activity. Use \"auto\" (default) to let the server infer it\nfrom the file format and trace kinematics; the resolved sport is\nreturned in `context_used.sport` and can be overridden on a second call."
              },
              "upload_id": {
                "default": null,
                "description": "Id of a file already sent to the server, valid 15 minutes. Two ways\nto get one: (a) the `create_upload_link` tool — the user drops the\nfile on the returned web page; works from any client, no shell\nneeded; (b) with a shell that can reach the host:\n`curl -s -X POST https://mcp.sportstracklive.com/upload --data-binary @/path/to/file`.\nPass the id here with the original filename.",
                "type": ["string", "null"]
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
