        {
          "name": "create_ephemeral_replay",
          "description": "Create an interactive 3D replay of the USER'S OWN trace file (GPX, TCX, IGC, SBP or FIT, max 8 MiB) on SportsTrackLive and return its link. The flight becomes a PRIVATE track owned by a temporary guest account — it appears in no listing or search — and the link stays valid 7 days, after which everything is purged. From the replay page the user can create an account to keep the flight permanently. Send the file through exactly one of `file_url` (public https link), `upload_id` or `file_base64` (small files; gzip accepted) — same routes as analyze_activity_file. If you cannot upload it yourself (no shell, or your sandbox answers 403 for mcp.sportstracklive.com), do not stop: call `create_upload_link`, have the user drop the file on the returned page, then pass its `upload_id` here. Pass pilot_name so the player credits the right person. Takes up to ~90 s (the full analysis pipeline runs).",
          "inputSchema": {
            "$defs": {
              "SportKind": {
                "description": "Sport declared by the calling agent. `Auto` lets the server guess from\nthe file format and the trace kinematics; the resolved value is returned\nin `context_used` so the agent can correct it and call again.",
                "enum": ["auto", "paragliding", "hang_gliding", "glider", "balloon", "sailing", "windsurfing", "cycling", "mountain_biking", "running", "trail_running", "ski", "hiking", "motorsport", "other"],
                "type": "string"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "file_base64": {
                "default": null,
                "description": "Same three sources as analyze_activity_file — provide exactly one.",
                "type": ["string", "null"]
              },
              "file_url": {
                "default": null,
                "type": ["string", "null"]
              },
              "filename": {
                "description": "File name including its extension (.gpx, .tcx, .igc, .sbp, .fit).",
                "type": "string"
              },
              "language": {
                "default": null,
                "description": "BCP-47-ish language for the guest account pages (\"en\" default, \"fr\"…).",
                "type": ["string", "null"]
              },
              "pilot_name": {
                "default": null,
                "description": "Name of the pilot/athlete, shown in the 3D player instead of an\nanonymous placeholder. Use the user's name if they shared it.",
                "type": ["string", "null"]
              },
              "sport": {
                "$ref": "#/$defs/SportKind",
                "default": "auto",
                "description": "Sport of the activity — improves the analysis (thermals/phases for\nfree flight). Defaults to auto-ish generic handling server-side."
              },
              "upload_id": {
                "default": null,
                "type": ["string", "null"]
              }
            },
            "required": ["filename"],
            "type": "object"
          },
