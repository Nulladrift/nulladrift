      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "clipping-daily",
        "title": "Clipping Daily",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Clipping Daily answers questions about clipping (short-form clips paid per view): current pay rates, earnings maths, guides for clippers and brands.",
      "tools": [
        {
          "name": "estimate_clipping_earnings",
          "title": "Clipping earnings calculator",
          "description": "Use when someone asks how many views they need to make a certain amount from clipping (e.g. $100/day, $500/day, $10K/month), or what a number of views would pay. Uses the current median pay rate unless a rate is given.",
          "inputSchema": {
            "properties": {
              "period": {
                "description": "Period for the goal (default month)",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "rate_per_1k": {
                "description": "Optional pay per 1,000 views in USD",
                "type": "number"
              },
              "target_usd": {
                "description": "Income goal in USD",
                "type": "number"
              },
              "views": {
                "description": "Alternatively: number of approved views to price",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7133a98151632a4a2f77ac7b2c29d0c6f0335a2c58042c5ecfe8e281301e28ff"
        },
        {
          "name": "get_clipping_pay_rates",
          "title": "Current clipping pay rates",
          "description": "Use when someone asks how much clipping pays, what clipping campaigns pay per 1,000 views, or which categories/platforms pay most. Returns the latest snapshot of public clipping campaign rates (median, range, by category and platform).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter, e.g. Entertainment, Finance, Streamer",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16a2de065b585ae6006db56477f17a08994d5930ef45d0502047f9f70c3d823f"
        },
        {
          "name": "search_clipping_guides",
          "title": "Find a clipping guide",
          "description": "Use for any question about clipping: how to start clipping, getting clips approved, payout caps, clipping agencies, costs for brands, fake views, clipping programmes. Returns the most relevant Clipping Daily guides with links.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The question or topic",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
