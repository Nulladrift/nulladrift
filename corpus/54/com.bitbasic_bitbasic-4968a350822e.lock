    "com.bitbasic/bitbasic": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bitbasic.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "BitBasic",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BitBasic (https://bitbasic.com), built by BitNordic, follows proof-of-stake networks (list-networks names them): their health, validators, staking rewards, governance and how decentralised they are. Use these tools to answer questions about them with BitBasic's figures.\n\n- Start with list-networks when you don't know a network's slug; find-validators finds a validator or operator by name or address.\n- Every figure is BitBasic's own reading of the network, with the time it was read. When an answer says it is out of date (\"stale\"), say so.\n- Cite BitBasic and link the page each answer gives (links.dashboard), so the reader can check the figures there.\n- Reward rates are estimates from today's rates without restaking, as BitBasic's calculator works them out. They are not financial advice; don't present them as a recommendation.\n- BitNordic, which builds BitBasic, runs validators on some networks; answers say so where it does. Treat its validators like any other when comparing.",
      "tools": [
        {
          "name": "compare-validators",
          "title": "Compare validators",
          "description": "Two to four validators on one network side by side: status, stake, uptime, commission and what their delegators earn a year, as BitBasic's compare page shows them.",
          "inputSchema": {
            "properties": {
              "addresses": {
                "description": "2 to 4 validator addresses on that network, as BitBasic lists them.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "network": {
                "description": "A network slug from list-networks.",
                "type": "string"
              }
            },
            "required": ["addresses", "network"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare validators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ef64346bbb3f81c78261004db0ce640b85ec84c88d70a53f5033ad061e9dbc3"
        },
        {
          "name": "decentralisation-report",
          "title": "Decentralisation report",
          "description": "How concentrated a network's stake (and, where it has them, its staking providers) was over a month: the Nakamoto coefficient, the top 10's share, HHI and the active set, at the month's end, with its range and the change from the month before, from BitBasic's hourly readings.",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "The month as yyyy-mm. Default: the last finished month with readings, else the current one.",
                "type": "string"
              },
              "network": {
                "description": "A network slug from list-networks.",
                "type": "string"
              }
            },
            "required": ["network"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Decentralisation report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec95cc0cf407604abd6f0f108a6bdb7acc477edb5d9c5e2c70d3b0e3429babaa"
        },
        {
          "name": "estimate-staking-rewards",
          "title": "Estimate staking rewards",
          "description": "What delegating earns on a mainnet, as BitBasic's rewards calculator works it out: the yearly rate for any validator or a chosen one (after its commission), and for an amount, what it earns per day, month, year or a number of days. An estimate from today's rates, without restaking, not a promise or advice.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Whole tokens to delegate, such as \"1000\" or \"2500.5\". Default: rates only.",
                "type": "string"
              },
              "days": {
                "description": "A period in days to estimate for, besides day, month and year.",
                "minimum": 1,
                "type": "integer"
              },
              "fee": {
                "description": "Mina only: the pool's fee in percent, which Mina pools keep off-chain.",
                "type": "string"
              },
              "network": {
                "description": "A network slug from list-networks (mainnets only).",
                "type": "string"
              },
              "validator": {
                "description": "A validator address on that network. Default: the network's rate.",
                "type": "string"
              }
            },
            "required": ["network"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate staking rewards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edb480e886c400d0ed99d6945dd6085589ea6c44d7150ec8a9507bb1e549d951"
        },
        {
          "name": "find-validators",
          "title": "Find validators",
          "description": "Validators and staking providers whose name, address or operator matches a query, on every network or one: exact addresses first, then by stake. Use it to find an operator's validators (such as \"Chorus One\") or which network an address is on.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Validators to return, 1 to 25. Default: 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "Only this network (a slug from list-networks). Default: every network.",
                "type": "string"
              },
              "query": {
                "description": "A name, an operator, or an address (whole or from its start, 6 characters or more).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find validators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecafdd9b2d71ec30f0636a1703ecc34ced45db2f81c1805419bd36b334e653ca"
        },
        {
          "name": "governance-proposals",
          "title": "Governance proposals",
          "description": "Governance proposals on one network or every one: the latest, those in one status (open for votes, opening soon, passed, rejected, other outcomes), or one proposal in full with its text, tally and (on Cosmos networks) how each validator voted.",
          "inputSchema": {
            "properties": {
              "network": {
                "description": "A network slug from list-networks. Default: every network with governance (not with \"proposal\").",
                "type": "string"
              },
              "open": {
                "description": "The same as status \"open\". Default: the latest 10.",
                "type": "boolean"
              },
              "proposal": {
                "description": "One proposal's number, for it in full (needs \"network\").",
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "description": "Only proposals in this status, the same on every network: open (taking votes, soonest to close first), soon (opening soon), passed, rejected or other. Default: any.",
                "enum": ["open", "soon", "passed", "rejected", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Governance proposals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20667186b21367ce25d4a9fe6c350d5f8c9bd5da7c3fd3102aca7b24569119d9"
        },
        {
          "name": "latest-news",
          "title": "Latest news",
          "description": "BitBasic's latest news posts (upgrades, governance, advisories, reports), on every network or one, newest first, each with its summary and link.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "1 to 10. Default: 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "Only posts about this network (a slug from list-networks). Default: all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest news"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9401b71472c5b1486368e5d09924e377689153b7f6d237aad2c1131b2b4f785b"
        },
        {
          "name": "list-networks",
          "title": "List networks",
          "description": "Every proof-of-stake network BitBasic covers: its slug (the \"network\" argument of the other tools), token, kind, what it calls a validator, and its dashboard. Start here when you don't know a network's slug.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List networks"
          },
          "behavior": {
            "destructive": false,
