            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe4f477592bec51a495eae5d8166e30b4b2d0b6bf32ea115e34a00254945cb4f"
        },
        {
          "name": "list-validators",
          "title": "List validators",
          "description": "A network's validators, sorted as its dashboard sorts them (by stake on most networks) or by another figure, each with its status, stake, uptime, commission and delegators' reward rate.",
          "inputSchema": {
            "properties": {
              "direction": {
                "description": "Default: desc.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "limit": {
                "description": "1 to 25. Default: 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "A network slug from list-networks.",
                "type": "string"
              },
              "sort": {
                "description": "A sort the network's validator list offers (stake, commission, uptime, produced…); a wrong one answers with the ones it takes. Default: the dashboard's.",
                "type": "string"
              },
              "status": {
                "description": "Only validators with this status. Default: all.",
                "enum": ["active", "queued", "exiting", "inactive", "exited"],
                "type": "string"
              }
            },
            "required": ["network"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List validators"
