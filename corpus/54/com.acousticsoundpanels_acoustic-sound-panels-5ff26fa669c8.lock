      "serverInfo": {
        "name": "acoustic-sound-panels",
        "title": "Acoustic Sound Panels",
        "version": "1.0.0",
        "description": "Estimate how much echo a room has, see how many acoustic panels to plan for and what they cost today, then ask the Acoustic Sound Panels team for a Free Room Analysis.",
        "websiteUrl": "https://acousticsoundpanels.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Acoustic Sound Panels sells custom-built acoustic panels that reduce echo in rooms such as home theaters, studios, offices, restaurants, gyms, classrooms and churches. Use these tools when someone wants a room to sound clearer.\n\nBefore calling a tool, ask for the room's length, width and ceiling height in feet, and what the room is used for.\n- asp_calculate_room_acoustics estimates the room's echo.\n- asp_recommend_panels gives a starting panel count, exact prices from the store when available, and a product link.\n- asp_start_free_room_analysis asks the Acoustic Sound Panels team for a recommended layout and one written quote. Ask for the person's first name, email and ZIP code, and get a clear yes to sharing them with Acoustic Sound Panels, before calling it.\n- asp_get_scan_link shares the Acoustic Sound Panels app for scanning a room.\n\nShare counts, prices and shipping statements exactly as the tools return them, and keep the word \"estimated\" with every echo figure. Prices come only from the tools: do not state or estimate any other price, rate or total.\nThese panels reduce echo inside a room. They do not block sound from passing through walls.\nDo not offer installation, installers or fabric samples, and do not state specifications or certifications. Send those questions to AcousticSoundPanels.com or 888-923-5777.\nIf asked about discounts, say only: Every panel is priced per item at any quantity. For a real project, submit a Free Room Analysis with quantity and the team will send one written quote for the whole project.\nFor timing, delivery or production questions, do not estimate. Call 888-923-5777 or see AcousticSoundPanels.com/policies/shipping-policy.\nOrders are placed on AcousticSoundPanels.com. For anything these tools do not cover, call 888-923-5777.",
      "tools": [
        {
          "name": "asp_calculate_room_acoustics",
          "title": "Estimate a room's echo",
          "description": "Find out how much echo a room is likely to have and how much of its walls and ceiling is worth covering. Give the room's length, width and ceiling height in feet and what the room is used for. Returns an estimated echo time in seconds with a plain rating for speech, and the share of walls and ceiling Acoustic Sound Panels suggests covering as a starting point. These are estimates for planning, based on a plain rectangular room. A Free Room Analysis gives the team's recommended layout.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ceiling_height_ft": {
                "description": "Ceiling height in feet, 6 to 30. Decimals are fine.",
                "maximum": 30,
                "minimum": 6,
                "type": "number"
              },
              "length_ft": {
                "description": "Room length in feet, 4 to 400. Decimals are fine.",
                "maximum": 400,
                "minimum": 4,
                "type": "number"
              },
              "room_use": {
                "description": "What the room is used for.",
                "enum": ["Home Theater", "Studio", "Office", "Restaurant", "Church", "Gym / Fitness", "Classroom", "Other"],
                "type": "string"
              },
              "width_ft": {
                "description": "Room width in feet, 4 to 400. Decimals are fine.",
                "maximum": 400,
                "minimum": 4,
                "type": "number"
              }
            },
            "required": ["ceiling_height_ft", "length_ft", "room_use", "width_ft"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f470d6d3cc389712c10910d9d65f724a973e4f321e809cd8117282c40a7db0e"
        },
        {
          "name": "asp_get_scan_link",
          "title": "Ways to scan or measure a room",
          "description": "Get a way to capture a room for Acoustic Sound Panels: the Acoustic Sound Panels app for iPhone Pro and iPad Pro models with LiDAR. A personal link for sending photos, room dimensions or video comes with a Free Room Analysis request.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
