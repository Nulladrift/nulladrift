            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:437f83d42a8714abf73b1f9714726619d7fbd279f6a2ecaef64d5ca823e64403"
        },
        {
          "name": "asp_recommend_panels",
          "title": "Recommend panels for a room",
          "description": "See how many Acoustic Sound Panels to plan for in a room and what they cost today. Give the room's length, width and ceiling height in feet and what the room is used for. Returns a starting panel size and count, the estimated echo before and after, exact current prices from the store when they are available, the shipping statement that applies, and a link to the product page. Panels are priced as Burch Fabrics Prime Time, and other fabrics show their own exact prices on the product page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ceiling_height_ft": {
                "description": "Ceiling height in feet, 6 to 30. Decimals are fine.",
                "maximum": 30,
                "minimum": 6,
                "type": "number"
              },
              "length_ft": {
                "description": "Room length in feet, 4 to 400. Decimals are fine.",
                "maximum": 400,
                "minimum": 4,
                "type": "number"
              },
              "room_use": {
                "description": "What the room is used for.",
                "enum": ["Home Theater", "Studio", "Office", "Restaurant", "Church", "Gym / Fitness", "Classroom", "Other"],
                "type": "string"
              },
              "width_ft": {
                "description": "Room width in feet, 4 to 400. Decimals are fine.",
                "maximum": 400,
                "minimum": 4,
                "type": "number"
              }
            },
            "required": ["ceiling_height_ft", "length_ft", "room_use", "width_ft"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:00abd238341267112e220e026d9625354fa71f9096b0664593aabe3a3baf40d6"
        },
        {
          "name": "asp_start_free_room_analysis",
          "title": "Start a Free Room Analysis",
          "description": "Ask the Acoustic Sound Panels team for a Free Room Analysis: a recommended layout and one written quote for the room. Before calling, ask the person for their first name, email address and ZIP code, and get a clear yes to sharing them with Acoustic Sound Panels for this request. Nothing is ordered or charged. Returns a confirmation and, for a new request, a personal link for adding photos, room dimensions or a short video.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ceiling_height_ft": {
                "description": "Ceiling height in feet, 6 to 30. Decimals are fine.",
                "maximum": 30,
                "minimum": 6,
                "type": "number"
              },
              "consent": {
                "const": true,
                "description": "Must be true. Set it only after the person has said yes to sharing their name and email with Acoustic Sound Panels for this request.",
                "type": "boolean"
              },
              "email": {
                "description": "The email address where the team should follow up.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "first_name": {
                "description": "The person's first name.",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[\\p{L}\\p{M}][\\p{L}\\p{M} .'-]{0,59}$",
                "type": "string"
              },
              "goals": {
                "description": "What the person wants fixed, in their words, for example echo or recording quality. Up to 500 characters. No links, email addresses or phone numbers.",
                "maxLength": 500,
                "type": "string"
              },
              "last_name": {
                "description": "The person's last name, if they gave one.",
                "maxLength": 60,
                "pattern": "^$|^[\\p{L}\\p{M}][\\p{L}\\p{M} .'-]{0,59}$",
                "type": "string"
              },
              "length_ft": {
                "description": "Room length in feet, 4 to 400. Decimals are fine.",
                "maximum": 400,
                "minimum": 4,
                "type": "number"
              },
              "room_use": {
                "description": "What the room is used for.",
                "enum": ["Home Theater", "Studio", "Office", "Restaurant", "Church", "Gym / Fitness", "Classroom", "Other"],
                "type": "string"
              },
              "width_ft": {
                "description": "Room width in feet, 4 to 400. Decimals are fine.",
                "maximum": 400,
                "minimum": 4,
                "type": "number"
              },
              "zip": {
                "description": "US ZIP code where the room is, 5 digits.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["ceiling_height_ft", "consent", "email", "first_name", "length_ft", "room_use", "width_ft", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
