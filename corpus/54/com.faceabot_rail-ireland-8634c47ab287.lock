{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/rail-ireland": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/ie-rail"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-rail-ireland",
        "title": "Faceabot Rail Ireland",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Rail Ireland: Irish trains (Irish Rail Intercity, Commuter, DART, Enterprise Dublin–Belfast) for AI agents, free, no key.\nStart with ie_train_connections {\"from\":\"…\",\"to\":\"…\"} (direct trains in the next 90 minutes). Unsure of a name? ie_find_station.\nTimes are Irish local time (Europe/Dublin); delays in minutes. Data: Irish Rail official realtime API, live, cached 60 s. It covers only the next 90 minutes: for later trips, give your human the officialSite (https://www.irishrail.ie).\nPart of Faceabot (https://faceabot.com): other countries: Belgium /tools-mcp/be-rail, Switzerland /tools-mcp/ch-rail, Norway /tools-mcp/no-transit, Finland /tools-mcp/fi-rail; any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "ie_find_station",
          "title": "Find an Irish station",
          "description": "Finds Irish Rail stations (Republic of Ireland and Northern Ireland lines served by Irish Rail) matching a word, with their codes.\nUse when: a station name is ambiguous or misspelled.\nExample: {\"query\":\"Dublin\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Part of the station name",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:674bda8598baacc99fd20dae845c6a43b69e5eaf21b36cbf71de3b2de0b502cc"
        },
        {
          "name": "ie_station_departures",
          "title": "Next trains from an Irish station",
          "description": "Next train departures from one Irish station within the next 90 minutes: time, train, destination, live delay, last reported position. Includes DART and commuter trains.\nUse when: someone is at (or going to) a station in Ireland.\nExample: {\"station\":\"Dublin Connolly\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "minutes": {
                "default": 90,
                "maximum": 90,
                "minimum": 5,
                "type": "integer"
              },
              "results": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "station": {
                "description": "Station name or code",
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2fff8e92088189b0d57b487a9337ff63685b475b54c478df4fcc85f7a1b2baa3"
        },
        {
          "name": "ie_train_connections",
          "title": "Direct Irish trains between two stations, next 90 minutes (Irish Rail)",
          "description": "Direct trains leaving in the next 90 minutes between two stations in Ireland (Irish Rail Intercity, Commuter, DART, Enterprise to Belfast): departure and arrival times, live delay, where the train is now. Live data only: no later days, no transfers.\nUse when: someone wants to take a train in Ireland now or soon (e.g. Dublin to Cork).\nExample: {\"from\":\"Dublin Heuston\",\"to\":\"Cork\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Departure station (Dublin Heuston, Dublin Connolly, Cork, Galway, Limerick, Belfast…) or its code (HSTON). \"Dublin\" searches all main Dublin stations",
                "type": "string"
              },
              "results": {
                "default": 3,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Arrival station or code",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:58bf2d98832c91e37b4ca2a6754d3cf8e7f4337ead5c0ff9ce4eb10f3106d85b"
        }
      ],
      "digest": "sha256:f9fdbc46af80d5b5a20e8a59f0affbf1b68aa17d91e174f7ba9314e52b2f872c"
    }
  }
}
