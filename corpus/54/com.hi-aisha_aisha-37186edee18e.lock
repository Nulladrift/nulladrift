        {
          "name": "cerrar_horas",
          "description": "Para el DUEÑO: cerrar horas para que nadie se las pueda agendar.\n\nÚsala cuando diga cosas como \"tápame mañana de 2 a 4\", \"no voy a estar el\njueves\" o \"bloquéame la tarde\". 'desde' y 'hasta' en formato 24h (14:00).\nSin 'hasta', cierra solo esa hora. Para un día completo, usa el horario de\napertura y cierre del negocio.\n\nNo afecta las citas que ya existen: si hay una agendada ahí, avísale al\ndueño para que decida si la cancela.",
          "inputSchema": {
            "properties": {
