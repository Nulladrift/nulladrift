        {
          "name": "agendar_yo_mismo",
          "description": "Para el DUEÑO: meter en Aisha una cita que le llegó por fuera.\n\nEsta es la importante. Cuando a un negocio le hablan por teléfono, le\nescriben por WhatsApp o le llega alguien de la calle, esa cita debe entrar\naquí igual que las de Aisha — si no, la agenda que ven los asistentes de IA\nestá incompleta y pueden ofrecer una hora que ya está vendida.\n\nA diferencia de crear_reserva, el contacto del cliente es OPCIONAL: el\ndueño lo tiene enfrente o acaba de hablar con él. Pero pídeselo si lo\ntiene a la mano, porque sirve para avisarle de cualquier cambio.\n\nMUY IMPORTANTE — de quién es la cita: quien te está hablando es el DUEÑO\ndel negocio, NO el cliente. Si no te dijo a nombre de quién va la cita,\nPREGÚNTASELO. No pongas el nombre de la persona con la que estás hablando,\nni el del titular de la cuenta, ni ningún nombre que hayas deducido del\ncontexto. Una cita a nombre equivocado es peor que no tenerla: el negocio\nllama a quien no es y pierde al que sí venía.",
          "inputSchema": {
            "properties": {
              "clave": {
                "title": "Clave",
                "type": "string"
              },
              "contacto_cliente": {
                "default": "",
                "title": "Contacto Cliente",
                "type": "string"
              },
