        {
          "name": "cancelar_cita_mia",
          "description": "Para el DUEÑO: cancelar una cita de su propio negocio.\n\nSe puede por folio, o por nombre del cliente y fecha. Si hay más de una\ncoincidencia NO cancela ninguna: devuelve la lista para que el dueño diga\ncuál. Cancelar es irreversible desde aquí, así que nunca se adivina.\n\nAl confirmar, recuérdale al dueño que le avise al cliente — Aisha no le\nescribe a la persona por él.",
