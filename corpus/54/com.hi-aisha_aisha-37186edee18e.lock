        {
          "name": "crear_reserva",
          "description": "Crea una reserva en un negocio.\n\nRequiere negocio (id o nombre), nombre completo del cliente, fecha (AAAA-MM-DD),\nhora (ej. 17:00), servicio, y contacto_cliente: el teléfono o WhatsApp de quien\nasistirá.\n\nIMPORTANTE sobre contacto_cliente: pídeselo a la persona antes de agendar y\nexplícale para qué es — el negocio lo necesita para avisarle si surge algún\nimprevisto, un cambio de horario o para confirmar. No lo inventes ni pongas\ndatos falsos: una cita sin forma de contactar al cliente es un riesgo para el\nnegocio. Si la persona no quiere darlo, dile que entonces reserve por teléfono\ndirectamente con el negocio.\n\nSobre 'persona': en barberías, salones y spas la gente suele querer a alguien\nen concreto (\"un corte con Carlos\"). Si tu humano menciona un nombre, pásalo\naquí. Si no dice nada, no lo inventes: déjalo vacío y el negocio asigna a\nquien esté libre. Los nombres de quienes atienden salen en ver_servicios.\n\nDevuelve el folio, con quién quedó la cita, la dirección, la liga de mapa y\ncon cuántos minutos de antelación pide llegar el negocio.",
          "inputSchema": {
            "properties": {
              "contacto_cliente": {
                "title": "Contacto Cliente",
                "type": "string"
              },
              "fecha": {
                "title": "Fecha",
