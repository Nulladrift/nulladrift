          "name": "abrir_horas",
          "description": "Para el DUEÑO: volver a abrir horas que había cerrado.\n\nLo contrario de cerrar_horas. Úsala con \"ya puedo el jueves\", \"ábreme la\ntarde otra vez\" o \"quita el bloqueo\".",
