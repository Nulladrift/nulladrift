      "serverInfo": {
        "name": "inquira",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "create_survey",
          "description": "Generate a professional survey using AI based on a research goal. Returns the survey ID and shareable link.",
          "inputSchema": {
            "properties": {
              "goal": {
                "description": "Describe what you want to research. E.g. 'Customer satisfaction survey for our SaaS product after onboarding'",
                "type": "string"
              },
              "lang": {
                "description": "Language for the survey content. Defaults to 'en'.",
                "enum": ["en", "zh", "ja", "es", "pt"],
                "type": "string"
              },
              "publish": {
                "description": "Whether to immediately publish the survey after creation. Defaults to false.",
                "type": "boolean"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e1e04de51050eacbc3c3c32a7ee6b357dd0499578708039052e2634f6f452b62"
        },
        {
          "name": "get_ai_report",
          "description": "Generate an AI analysis report for a survey's responses. Returns executive summary, key metrics, per-question insights, and action recommendations.",
          "inputSchema": {
            "properties": {
              "survey_id": {
                "description": "The ID of the survey to analyze.",
                "type": "string"
              }
            },
            "required": ["survey_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6232856f528a22249ac49c37de9a9bd24e3b98890c0efb17d32d95776a9ea96"
        },
        {
          "name": "get_responses",
          "description": "Get all responses submitted to a specific survey.",
          "inputSchema": {
            "properties": {
              "survey_id": {
                "description": "The ID of the survey to get responses for.",
                "type": "string"
              }
            },
            "required": ["survey_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:781764f49d086420c64ac74de25999b3f235bb4bd5db76e9c3e576e0bbdbccd1"
        },
        {
          "name": "get_survey_link",
          "description": "Get the shareable link for a published survey.",
          "inputSchema": {
            "properties": {
              "survey_id": {
                "description": "The ID of the survey.",
                "type": "string"
              }
            },
            "required": ["survey_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0793dbc4a57dda8894575c80f51223998673f75be6a3ba92416442a3e42106db"
        },
        {
          "name": "get_surveys",
          "description": "List all surveys belonging to the authenticated user.",
          "inputSchema": {
            "properties": {
              "status": {
                "description": "Filter by survey status. Defaults to 'all'.",
                "enum": ["all", "published", "draft"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
