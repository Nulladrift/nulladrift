      "serverInfo": {
        "name": "depthfeed",
        "title": "DepthFeed",
        "version": "0.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DepthFeed serves prediction-market order-book depth and history for Polymarket, Kalshi, and Limitless across BTC/ETH/SOL/XRP/DOGE/BNB/HYPE up/down markets. Paid data plans can use polymarket_all_markets for the complete current Polymarket universe in a compact MARKET_NAME | PRICE | DEADLINE format. MCP polymarket_search_markets, polymarket_get_market and polymarket_get_snapshots support crypto up/down markets; use market ids from polymarket_search_markets for these detail/history tools. For other categories, including weather, account plans can use REST discovery at /v3/polymarket/markets and history at /v3/polymarket/{asset_id}/snapshots with an outcome token asset_id. History is subject to plan limits and actual captured data; catalog presence does not guarantee stored snapshots. `screener` gives a cross-venue top-of-book view. Without an API key you are on the keyless demo tier (BTC + Polymarket, top-of-book only). Set a DepthFeed API key (Authorization: Bearer df_…, from https://depthfeed.com) to unlock all coins, Kalshi, Limitless, the full ladder, and deep history. Timestamps accept ms-epoch or ISO-8601.",
      "tools": [
        {
          "name": "backtest_paths",
          "description": "Mid-price path per Polymarket market for backtesting, resampled to a fixed interval and bounded to each market's own lifetime so post-settlement books cannot leak in as risk-free fills. Returns {interval_seconds, markets:{<market_id>:{points:[[ts_ms, price_up, coin_price], …]}}} — up to 1000 points per market. Pass 1 to 50 market ids from polymarket_search_markets. History is bounded by the plan window and the interval floor by plan; both fail closed rather than silently coarsening.",
          "inputSchema": {
            "properties": {
              "coin": {
                "default": "btc",
                "description": "Crypto asset. Every account plan reaches all seven; only the keyless demo surface is BTC-only.",
                "enum": ["btc", "eth", "sol", "xrp", "doge", "bnb", "hype"],
                "type": "string"
              },
              "ids": {
                "description": "Comma-separated Polymarket market ids, 1 to 50, from polymarket_search_markets.",
                "type": "string"
              },
              "interval": {
                "description": "Resample interval in seconds (default 60). The floor is set by plan; a finer value is refused, not rounded.",
                "type": "integer"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Backtest price paths"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b0e83095c902f3970cc4dda8dfe16f0389f82f280fdc24f7e1640ecf18c89c53"
        },
        {
          "name": "bars",
          "description": "OHLCV price bars for US equities and ETFs, Binance spot pairs, and perpetual futures. One minute is the finest resolution; 5Min, 15Min, 1Hour and 1Day are rolled up from it and say so with `derived`. Spell a crypto pair the way the venue does (BTCUSDT, not BTC) and a perpetual with a .P suffix (BTCUSDT.P) — spot and perp are different instruments at different prices. BTCU, ETHU and WLDU are each both a US ETF and a Binance pair, and resolve to the equity — pass venue=binance to reach the pair instead. Optional `venue` selects the market explicitly: us-equities, binance (spot) or binance-futures (perpetuals). Bounded by the same plan history window as every other read (403 HISTORY_LIMIT_EXCEEDED past it); the plan also sets how many symbols one request may carry.",
          "inputSchema": {
            "properties": {
              "end_time": {
                "description": "End of time as ms-epoch or ISO-8601. History is clamped to your plan's window.",
                "type": "string"
              },
              "start_time": {
                "description": "Start of time as ms-epoch or ISO-8601. History is clamped to your plan's window.",
                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated symbols, e.g. \"AAPL,BTCUSDT,BTCUSDT.P\". 3 per request on Explorer, 8 Quant, 16 Research, 32 Desk.",
                "type": "string"
              },
              "timeframe": {
                "description": "1Min (default), 5Min, 15Min, 1Hour or 1Day.",
                "type": "string"
              }
            },
            "required": ["symbols"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Equity & crypto price bars"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:badeb5e3454c47282e25cc833eca47fa60ca758ea58450c22daf859c0e0a382a"
        },
        {
          "name": "kalshi_get_candles",
          "description": "Hourly OHLC candles (yes bid, yes ask, traded price) plus volume and open interest for a Kalshi market. This is the only history that exists for non-crypto Kalshi markets — Kalshi serves no historical order book — and it reaches back up to a year, far past the order-book capture. `price` is null in periods with no trade. Every account plan; history is bounded by your plan window.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor from a previous response's pagination.next_cursor.",
                "type": "string"
              },
              "end_time": {
                "description": "End of time as ms-epoch or ISO-8601. History is clamped to your plan's window.",
                "type": "string"
              },
              "interval": {
                "description": "Candle period. Only 1h (60m) is recorded; omit for the default.",
                "type": "string"
              },
              "limit": {
                "description": "Page size (1–500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "start_time": {
                "description": "Start of time as ms-epoch or ISO-8601. History is clamped to your plan's window.",
                "type": "string"
              },
              "ticker": {
                "description": "Exact Kalshi market ticker from kalshi_search_markets (never constructed from a timestamp).",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Kalshi candle history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e91616afecf73f32fd9034f6f991bffab32c94ef9636ee208a36c1602cff3cb"
        },
