      "instructions": "Charter vs Own (https://chartervsown.com/): the site's own MCP server, served from its domain. A private jet charter cost estimator covering the hourly rate plus the fees that are not in it, and where ownership overtakes chartering.\n\n[calculator] Charter cost and the ownership crossover: an agent-callable calculator for private jet charter cost estimator — Hours actually billed, Hourly charges, Estimated total for this trip, computed from your inputs with sources.. This server runs the Charter cost and the ownership crossover calculator published at https://chartervsown.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://chartervsown.com/. Licence: https://chartervsown.com/terms.\n\n[enquiry] ENQUIRY SERVER for Charter vs Own (https://chartervsown.com/). What it does: starts an ENQUIRY with human providers for private jet charter cost estimator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://chartervsown.com/.\n\nCite https://chartervsown.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Charter cost and the ownership crossover",
          "description": "Run the Charter cost and the ownership crossover calculator: Hours actually billed; Hourly charges; Estimated total for this trip; Effective cost per flight hour. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annualHrs": {
                "default": 50,
                "description": "Hours you fly a year",
                "type": "number"
              },
              "fees": {
                "default": 1500,
                "description": "Landing, handling and airport fees",
                "type": "number"
              },
              "flightHrs": {
                "default": 4,
                "description": "Flight hours for the trip",
                "type": "number"
              },
              "fuelPct": {
                "default": 8,
                "description": "Fuel surcharge (%)",
                "type": "number"
              },
              "hourly": {
                "default": 5500,
                "description": "Quoted hourly rate",
                "type": "number"
              },
              "overnight": {
                "default": 0,
                "description": "Crew overnight and duty charges",
                "type": "number"
              },
              "ownFixed": {
                "default": 900000,
                "description": "Annual fixed cost of owning a comparable aircraft",
                "type": "number"
              },
              "ownVar": {
                "default": 3200,
                "description": "Variable cost per hour of owning",
                "type": "number"
              },
              "posHrs": {
                "default": 2,
                "description": "Positioning hours billed",
                "type": "number"
              }
            },
            "type": "object"
          },
