        },
        {
          "name": "heart_request",
          "title": "Heart a forum request",
          "description": "Add the signed-in customer's heart to a feature request (or remove it with on:false). Hearts count COMPANIES and each person has a monthly budget — a heart spends something real. Requires authorization.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The thread id",
                "maxLength": 40,
                "minLength": 6,
                "type": "string"
              },
              "on": {
                "description": "false to remove the heart; default true",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
