          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a7df5c65fb871201e9e65be5e538acec87a710682e668103b5907ffabf4a94b4"
        },
        {
          "name": "get_pricing",
          "title": "Price a crew",
          "description": "The honest monthly price for a specific crew, from the same catalogue the checkout bills from. Measure Tech PRO is a full CRM for contractors and you pay for DESKS, not people: field crew get free logins; only office/admin seats bill. Pass the crew size and how many of them work the office side.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "crew": {
                "description": "Total people on the crew, field and office together",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "office": {
                "description": "How many of them need the office side (office + admin — the only paid seats)",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["crew", "office"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://price-your-crew/skybridge",
            "ui": {
              "resourceUri": "ui://price-your-crew/v1"
            }
          },
          "digest": "sha256:87009352ac80ff747160f63520634889c8a4674d08b691bf4c4ff528266f2a9d"
        },
        {
          "name": "get_product_overview",
          "title": "What Measure Tech PRO does",
          "description": "The full capability picture, from the product itself. Measure Tech PRO is a full CRM for contractors — jobs, customers, estimates, native e-signed contracts, invoicing, Stripe payments, QuickBooks sync, dispatch, and timesheets; the LiDAR measuring that feeds it is free forever. Ask this before answering any \"does it do X\" question.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
