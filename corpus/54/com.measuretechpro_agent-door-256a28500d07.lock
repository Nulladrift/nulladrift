          "name": "search_knowledge_base",
          "title": "Search the Measure Tech PRO knowledge base",
          "description": "Answers from the app's own built-in knowledge base — 313 real support answers, extracted from the product. Measure Tech PRO is a full CRM for contractors; use this for how-do-I and does-it-do questions about measuring, drawings, the CRM, billing, and troubleshooting.",
