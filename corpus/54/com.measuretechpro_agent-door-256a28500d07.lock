          "title": "About Measure Tech PRO",
          "description": "What Measure Tech PRO is and what this server offers. Measure Tech PRO is a full CRM for contractors, available today on iPhone, iPad, and Mac. The web console for the office is available now. Returns the product summary, the knowledge-base size, and where the other surfaces live.",
