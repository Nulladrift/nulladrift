          "digest": "sha256:71ba631302fb42a136db80c0719049329c97e5f82875b3f6567e1b015ebf63ef"
        },
        {
          "name": "get_forum_thread",
          "title": "Read one forum request",
          "description": "One request from the public forum by id: title, body, status, the developer's written answer if there is one, and the heart counts (hearts count COMPANIES — a twelve-person crew and a solo shop each get one effective vote).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The thread id from a forum URL or search_forum result",
                "maxLength": 40,
                "minLength": 6,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
