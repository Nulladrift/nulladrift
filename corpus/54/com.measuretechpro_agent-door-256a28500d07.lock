          "name": "search_forum",
          "title": "Search the public forum",
          "description": "Search Measure Tech PRO's public feature-request forum — real contractors asking for real things, with hearts that count companies and statuses the developer answers in writing. Use it to check whether something is already requested, planned, shipped, or declined before answering \"can it\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
