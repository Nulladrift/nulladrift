          "name": "get_roadmap",
          "title": "The public roadmap",
          "description": "What Measure Tech PRO has shipped, is building, is planning, and has declined — straight from the public forum's statuses, with the developer's written answers. The declines carry reasons; a no you can read beats silence.",
          "inputSchema": {
