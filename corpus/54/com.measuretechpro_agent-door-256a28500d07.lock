        {
          "name": "post_feature_request",
          "title": "File a feature request",
          "description": "Post a new request to the public forum as the signed-in customer — AFTER checking for duplicates: the first call returns any similar existing requests, and posting anyway requires confirm_duplicates true. Hearting an existing request counts more than a tenth copy. Requires authorization.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board": {
                "description": "Defaults to features",
                "enum": ["features", "bugs", "help"],
                "type": "string"
              },
              "body": {
                "description": "The situation and the workaround used today — the most useful part",
                "maxLength": 5000,
                "minLength": 12,
                "type": "string"
              },
              "confirm_duplicates": {
                "description": "Set true ONLY after reviewing the duplicates the first call returned",
                "type": "boolean"
              },
              "title": {
                "description": "One sentence: what should the app do",
                "maxLength": 120,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["body", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c3edd39e4e9933d4acb5cfc6cdc9ef6e1876839cd960357dcec0d90952bcaa3d"
        },
        {
          "name": "request_contact",
          "title": "Ask Measure Tech PRO to get in touch",
          "description": "Relay a real person's request for human contact (sales question, demo, enterprise) to the Measure Tech PRO team. Nothing sends until a reply channel is given — an email or phone number the PERSON provided. Rate-limited, and capped per connection per day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Their reply email — theirs, given by them",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "What they want, in their words",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "Who is asking",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Their phone, if they prefer a call",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
