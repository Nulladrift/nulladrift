      "tools": [
        {
          "name": "comment_on_request",
          "title": "Comment on a forum request",
          "description": "Add the signed-in customer's comment to a thread — their workaround, their trade's angle, their +1 with a reason. Requires authorization.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "body": {
                "description": "The comment",
                "maxLength": 3000,
                "minLength": 2,
                "type": "string"
              },
              "id": {
                "description": "The thread id",
                "maxLength": 40,
                "minLength": 6,
                "type": "string"
              }
            },
            "required": ["body", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
