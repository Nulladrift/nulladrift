{
  "lockfileVersion": 2,
  "subjects": {
    "ai.mapsdata/mapsdata": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mapsdata.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mapsdata",
        "title": "MapsData",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MapsData scrapes Google Maps businesses and their email addresses. A scrape's query must be an exact Google Maps category and its regions must be full names, so confirm both with mapsdata_search_categories and mapsdata_list_regions before starting one. Scrapes run for minutes to hours: start one, tell the user, and stop. Do not poll in a loop.",
      "tools": [
        {
          "name": "mapsdata_cancel_scrape",
          "title": "Cancel a scrape",
          "description": "Cancel a queued or running scrape. A queued scrape costs nothing. CANCELLING A RUNNING SCRAPE STILL BILLS the leads already delivered, so confirm with the user before calling this.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel a scrape"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a56913402a7e4d8a870970d8193bca6639015b1eb3c36cc5771a7ea93e3dfb4"
        },
        {
          "name": "mapsdata_get_download_link",
          "title": "Get a download link",
          "description": "Get a link to a finished scrape's results. The link expires in 15 minutes, so hand it to the user promptly rather than storing it.",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "csv",
                "enum": ["csv", "xlsx"],
                "type": "string"
              },
              "job_id": {
                "type": "string"
              },
              "scope": {
                "default": "emails",
                "description": "'emails' is rows with a deliverable email, which is what usage is billed on. 'all' is every scraped row.",
                "enum": ["emails", "all", "filtered"],
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a download link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5b7ca7ab755fc8eaaf7539978db984d82d99967d0d2a49c462b682eb92c2c741"
        },
        {
          "name": "mapsdata_get_scrape",
          "title": "Check a scrape",
          "description": "Get the current state of one scrape. This is an INSTANT SNAPSHOT of a job that runs for minutes to hours. Do NOT call it repeatedly in a loop. The response includes next_action, the suggested next step for the job's current status. MapsData also emails the user when a scrape finishes.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a scrape"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:19cf0cf20af1ca3c0f22a53d7de6d9191a1d19015063d87f2ef936556d315e27"
        },
        {
          "name": "mapsdata_get_usage",
          "title": "Check Scraping Credits",
          "description": "How many Scraping Credits the organization has left to spend, and the largest single scrape this plan allows. Read max_rows_this_scrape before choosing a total_limit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Scraping Credits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ca1f3f7df41c307448c343e5265fe02a80d923306a1f5bba853977f4a491c57a"
        },
        {
          "name": "mapsdata_list_regions",
          "title": "List valid regions",
          "description": "List the exact region names a scrape accepts for a country. Submit them verbatim. Abbreviations like 'TX' are rejected; use the full name.",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "us",
                "enum": ["au", "ca", "uk", "us"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List valid regions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c18c1d0133c237d4fcaf0cf2b60f90c9341e9acb6db601a261e85815094bd92b"
        },
        {
          "name": "mapsdata_list_scrapes",
          "title": "List recent scrapes",
          "description": "List this organization's recent scrapes, newest first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "enum": ["queued", "running", "cancelling", "cancelled", "completed", "failed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List recent scrapes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c305457fe9672af703022073ccc8e215139c44c1676037dc87082d3df2ece04a"
        },
        {
          "name": "mapsdata_search_categories",
          "title": "Search Google Maps categories",
          "description": "Search the Google Maps business categories MapsData can scrape. CALL THIS FIRST, before mapsdata_start_scrape: a scrape's query must be one of these exact categories, and a free-text guess like 'plumbing companies' is rejected.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional: the country you will scrape. Categories Google rarely uses there are flagged, with local alternatives (e.g. 'General contractor' in au).",
                "enum": ["au", "ca", "uk", "us"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Substring to search for, e.g. 'plumb'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Google Maps categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af894d350d1fea3e13dd6bdcd4780c29f46a8e99ef0655d8ca2107bd29fe7690"
        },
        {
          "name": "mapsdata_start_scrape",
          "title": "Start a scrape",
          "description": "Start scraping Google Maps businesses and their emails. Returns IMMEDIATELY with a job id; the scrape itself takes 5 minutes to several hours.\n\nBefore calling this, confirm the category with mapsdata_search_categories and the region with mapsdata_list_regions. Those two mistakes are the overwhelming majority of rejections.\n\nThis spends the organization's Scraping Credits (its lead allowance). Set dry_run to check a request against every rule without spending anything.\n\nmin_reviews, max_reviews and max_emails_per_company are optional. Pass them when the user asks for them. The response reports the filters that apply, including the default email cap.",
          "inputSchema": {
            "properties": {
              "cities": {
                "description": "Named cities instead of whole regions.",
                "items": {
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "state": {
                      "description": "Full region name.",
                      "type": "string"
                    }
                  },
                  "required": ["city", "state"],
                  "type": "object"
                },
                "type": "array"
              },
              "country": {
                "default": "us",
                "enum": ["au", "ca", "uk", "us"],
                "type": "string"
              },
              "dry_run": {
                "default": false,
                "description": "Validate against every rule and return the plan WITHOUT starting a scrape or spending quota.",
                "type": "boolean"
              },
              "limit_basis": {
                "description": "What total_limit counts. 'emails' stops once that many leads WITH an email are found; leads without one are still delivered and never billed. 'rows' stops at that many leads of any kind. Omit it for the organization's default, which is 'emails' unless the organization used the API before this option launched.",
                "enum": ["emails", "rows"],
                "type": "string"
              },
              "list_name": {
                "description": "Label for the list. Defaults to the query.",
                "type": "string"
              },
              "max_emails_per_company": {
                "description": "Most emails kept per business. Defaults to 5 when omitted.",
                "minimum": 1,
                "type": "integer"
              },
              "max_reviews": {
                "description": "Skip businesses with more Google reviews. Omit it for no maximum. 0 keeps ONLY businesses with no reviews.",
                "minimum": 0,
                "type": "integer"
              },
              "min_reviews": {
                "description": "Skip businesses with fewer Google reviews. Defaults to 0, no minimum.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "An exact Google Maps category, e.g. 'Plumber'. Verify it with mapsdata_search_categories first.",
                "type": "string"
              },
              "states": {
                "description": "Full region names, e.g. ['Texas']. Not abbreviations. Use this or cities, not both.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total_limit": {
                "description": "How many leads to scrape, in the unit limit_basis sets. Read max_rows_this_scrape from mapsdata_get_usage first: a larger request is reduced to the Scraping Credits left, not rejected.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query", "total_limit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a scrape"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f235c0e887ea65115e93ca5c732d6464c8ee116f7e9176e0357580562d3bc02"
        }
      ],
      "digest": "sha256:2167ad434c92204c51c6c0303adeae62c5f805ba8080361352decb1d8c76846b"
    }
  }
}
