        {
          "name": "prepare_transfer",
          "title": "Prepare file transfer",
          "description": "Stores one text file behind a temporary download link and shows a transfer card. Use only when the user wants a hosted download link. To stage a file, send file_name and content (ttl_hours is optional, 1 to 168, default 24). To check a link made earlier, send only transfer_id. Returns download_url, file_name, sha256, size_bytes, expires_at and transfer_id; ChatGPT also shows a card with the file details, time left and a download button. With no content and no transfer_id it stages nothing and returns status ready. Do not use to show a draft: draft_email, create_calendar_event and create_markdown_file already return the file text. The file is stored until the link expires.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Full text of the file to stage (at most 200,000 characters). Send it together with file_name. Without content, nothing is stored.",
                "maxLength": 200000,
                "type": "string"
              },
              "file": {
                "description": "Set by ChatGPT when the user opens the card from a file. Do not fill this in yourself.",
                "properties": {
                  "name": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "resourceUri": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["name", "resourceUri"],
                "type": "object"
              },
              "file_name": {
                "description": "File name with its extension, such as \"report.md\", \"invite.ics\" or \"draft.eml\". Send it together with content to stage a file.",
                "maxLength": 120,
                "type": "string"
              },
              "mime_type": {
                "description": "Optional MIME type, such as \"text/markdown\", \"text/calendar\" or \"message/rfc822\". Guessed from file_name when omitted.",
                "maxLength": 100,
                "type": "string"
              },
              "transfer_id": {
                "description": "ID of a transfer made earlier, from its transfer_id field (32 hex characters). Send it alone to check that link. An unknown or expired ID returns transfer_not_found.",
                "maxLength": 64,
                "type": "string"
              },
              "ttl_hours": {
                "description": "Hours until the download link expires, from 1 to 168. Default 24.",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "download_url": {
                "description": "Direct download URL. Set when status is ok.",
                "type": "string"
              },
              "expires_at": {
                "description": "When the link stops working, as an ISO 8601 UTC time. Set when status is ok.",
                "type": "string"
              },
              "file": {
                "description": "The file ChatGPT passed when the card was opened from a file. Set only in that case.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "resourceUri": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "file_name": {
                "description": "Cleaned file name. Set when status is ok, and when ready if a name was given.",
                "type": "string"
              },
              "interactive_ui": {
                "description": "Resource URI of the transfer card.",
                "type": "string"
              },
              "message": {
                "description": "Set when status is ready: says what to send next.",
                "type": "string"
              },
              "mime_type": {
                "description": "MIME type of the file. Set when status is ok.",
                "type": "string"
              },
              "notes": {
                "description": "Short notes to pass on to the user. Set when status is ok.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sha256": {
                "description": "SHA-256 checksum of the file as 64 hex characters. Set when status is ok.",
                "type": "string"
              },
              "size_bytes": {
                "description": "File size in bytes. Set when status is ok.",
                "type": "integer"
              },
              "status": {
                "description": "ok: a file is staged or found, and the download fields are set. ready: nothing is staged yet; read message for what to send.",
                "enum": ["ok", "ready"],
                "type": "string"
              },
              "transfer_id": {
                "description": "ID to check this link again later. Set when status is ok.",
                "type": "string"
              }
