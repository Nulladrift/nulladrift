            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Email draft ready",
            "openai/toolInvocation/invoking": "Drafting the email..."
          },
          "digest": "sha256:cc16d3fc2a3381f9d079d62fc4a15702be80babdb65e340caf696a2e464b278f"
