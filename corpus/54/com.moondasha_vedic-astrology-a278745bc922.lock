                    "type": "string"
                  },
                  "utc_offset": {
                    "type": "string"
                  }
                },
                "required": ["date", "latitude", "longitude", "time", "time_is_approximate", "time_zone", "utc_offset"],
                "type": "object"
              },
              "calendar": {
                "enum": ["gregorian", "julian"],
                "type": "string"
              },
              "chart_link": {
                "type": ["string", "null"]
              },
              "cycle": {
