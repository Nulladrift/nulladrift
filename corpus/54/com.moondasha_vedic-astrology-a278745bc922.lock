          "name": "compatibility",
          "title": "Compatibility",
          "description": "Match two people's Vedic charts with Moon Dasha: Guna Milan (Ashtakoota) out of 36 with each koota's points, the koota doshas and the Muhurta Chintamani conditions that lift them; each person's Mangal Dosha (outside the 36); and Dual Cosmodyne, a Western synastry score with its strongest aspects. Each score stands on its own. Needs both people's birth dates, local birth times and birthplaces (place_ids from find_place). Guna Milan reads one person as the groom and one as the bride, so it needs to know who is the man and who is the woman: ask if the person has not said, and set groom to the man's letter. With no genders given, or for a couple of the same sex, person A takes the groom's seat. The figures are Moon Dasha's calculations. A score shows how two charts agree by tradition, not whether a relationship will succeed; never treat it as a reason not to marry, never read Nadi as a medical or genetic test, and never predict death, illness, a child's sex, markets, elections or court cases.",
