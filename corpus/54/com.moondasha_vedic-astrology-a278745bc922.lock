      "instructions": "Moon Dasha calculates Vedic (sidereal, Jyotish) planetary positions, periods and scores.\n\nA birth calculation needs the date, the local time and the place. Turn the place into a place_id with find_place first. When it is not found, ask before using the nearest larger city, and say the ascendant and houses are then approximate. Never invent a birth time: if the person does not know it, ask for their best guess, pass it with time_is_approximate, and say that the ascendant and houses may differ.\n\nInterpret the results with care, as tendencies rather than certainties. When interpreting them, never predict: death, lifespan or the timing of a death; a diagnosis or a specific illness; a child's sex; lottery numbers, stock, crypto or market calls; the outcome of an election or a court case; the health, death or divorce of a living public figure.",
      "tools": [
        {
          "name": "birth_chart",
          "title": "Birth chart",
          "description": "Calculate a Vedic birth chart (D1, sidereal) with Moon Dasha: the ascendant and the nine grahas with sign, degree, whole-sign house, nakshatra and pada, nakshatra lord, dignity, sign lord and the planet's relationship to it, retrograde, combust, Vargottama and Bhavottama flags, and chara karakas (7-karaka scheme), plus a link to the full chart on moondasha.com. Needs the birth date, the local birth time and the birthplace (a place_id from find_place). If the person does not know the birth time, ask for a best guess and set time_is_approximate. The figures are Moon Dasha's calculations. Interpret them with care and never predict death, illness, a child's sex, markets, elections or court cases.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ayanamsa": {
                "description": "Default Lahiri. Krishnamurti is the KP ayanamsa.",
                "enum": ["Lahiri", "TrueLahiri", "Krishnamurti", "Raman", "Fagan", "Yukteshwar", "Galactic", "Dhruva", "Pushya", "Ushashashi", "ChandraHari", "TrueRevati", "SuryaSiddhanta", "Tropical"],
                "type": "string"
              },
              "chart_style": {
                "description": "How the chart card draws the chart: North Indian (default) or South Indian. Set south only when the person asks for it.",
                "enum": ["north", "south"],
                "type": "string"
              },
              "date": {
                "description": "Birth date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "node": {
                "description": "Rahu and Ketu by the mean node (default) or the true node.",
                "enum": ["mean", "true"],
                "type": "string"
              },
              "place_id": {
                "description": "The place_id find_place returned for the birthplace.",
                "maxLength": 80,
                "type": "string"
              },
              "time": {
                "description": "Local clock time at the birthplace, 24-hour HH:MM or HH:MM:SS. Required: if the person does not know it, ask for their best guess and set time_is_approximate.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$",
                "type": "string"
              },
              "time_is_approximate": {
                "description": "Set when the birth time is a guess: the answer then shows the ascendant an hour either side.",
                "type": "boolean"
              }
            },
            "required": ["date", "place_id", "time"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
