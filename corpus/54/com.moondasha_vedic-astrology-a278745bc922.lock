          "name": "dasha_periods",
          "title": "Dasha periods",
          "description": "Calculate Vedic dasha periods with Moon Dasha in any of seven systems: Vimshottari (default), Yogini, Ashtottari, Chara (K. N. Rao), Kaal Chakra, Narayana and Sudarshan Chakra. Returns the Mahadashas with their dates to the 120th year of life, across cycles (Sudarshan Chakra: the 12 years of the running cycle), the Mahadasha, Antardasha and Pratyantardasha running on a given day (default today; Sudarshan Chakra: the year and its month), and the running Mahadasha's Antardashas, plus a link to the dashas on moondasha.com. Needs the birth date, the local birth time and the birthplace (a place_id from find_place). If the person does not know the birth time, ask for a best guess and set time_is_approximate. The figures are Moon Dasha's calculations. Interpret them with care and never predict death, illness, a child's sex, markets, elections or court cases.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "The day whose running periods to show, YYYY-MM-DD, from the birth date to the 120th year of life. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ayanamsa": {
                "description": "Default Lahiri. Krishnamurti is the KP ayanamsa.",
                "enum": ["Lahiri", "TrueLahiri", "Krishnamurti", "Raman", "Fagan", "Yukteshwar", "Galactic", "Dhruva", "Pushya", "Ushashashi", "ChandraHari", "TrueRevati", "SuryaSiddhanta", "Tropical"],
                "type": "string"
              },
              "dasha_year": {
                "description": "The year the periods count in: true_sidereal (default), mean_sidereal, true_tropical, mean_tropical or savana (360 days). Set it only when the person asks for one.",
                "enum": ["true_sidereal", "mean_tropical", "true_tropical", "mean_sidereal", "savana"],
                "type": "string"
              },
              "date": {
                "description": "Birth date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "node": {
                "description": "Rahu and Ketu by the mean node (default) or the true node.",
                "enum": ["mean", "true"],
                "type": "string"
              },
              "place_id": {
                "description": "The place_id find_place returned for the birthplace.",
                "maxLength": 80,
                "type": "string"
              },
              "system": {
                "description": "The dasha system: vimshottari (default), yogini, ashtottari, chara (K. N. Rao), kaal_chakra, narayana or sudarshan_chakra. Use the one the person asks for.",
                "enum": ["vimshottari", "yogini", "ashtottari", "chara", "kaal_chakra", "narayana", "sudarshan_chakra"],
                "type": "string"
              },
              "time": {
                "description": "Local clock time at the birthplace, 24-hour HH:MM or HH:MM:SS. Required: if the person does not know it, ask for their best guess and set time_is_approximate.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d)?$",
                "type": "string"
              },
              "time_is_approximate": {
                "description": "Set when the birth time is a guess: the answer then shows the running periods an hour either side and how far the dates move.",
                "type": "boolean"
              }
            },
            "required": ["date", "place_id", "time"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "antardashas": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cycle": {
                      "description": "The Mahadasha's cycle, 1 for the first: a later round of Yogini, Ashtottari or Narayana, or a repeat of Chara or Kaal Chakra.",
                      "type": "number"
