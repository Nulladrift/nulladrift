                "description": "The first day of the window, YYYY-MM-DD. Default today, when the transit chart shows the planets now; on a given day it shows them at noon.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "months": {
                "description": "How many months the window covers, 1 to 120. Default 24.",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
