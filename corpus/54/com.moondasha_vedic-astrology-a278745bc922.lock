                "description": "Whose Ashtakavarga tables: varahamihira (default) or parashara. Set parashara only when the person asks for Parashara's tables.",
                "enum": ["varahamihira", "parashara"],
                "type": "string"
              },
              "ayanamsa": {
                "description": "Default Lahiri. Krishnamurti is the KP ayanamsa.",
                "enum": ["Lahiri", "TrueLahiri", "Krishnamurti", "Raman", "Fagan", "Yukteshwar", "Galactic", "Dhruva", "Pushya", "Ushashashi", "ChandraHari", "TrueRevati", "SuryaSiddhanta", "Tropical"],
                "type": "string"
              },
              "date": {
                "description": "Birth date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include": {
                "description": "Which strengths to give, any of shadbala (with Ishta and Kashta Phala), bhava_bala (house strength), ashtakavarga, vimsopaka and vaiseshikamsa. Default: all five.",
                "items": {
                  "enum": ["shadbala", "bhava_bala", "ashtakavarga", "vimsopaka", "vaiseshikamsa"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "node": {
                "description": "Rahu and Ketu by the mean node (default) or the true node.",
                "enum": ["mean", "true"],
                "type": "string"
              },
              "place_id": {
                "description": "The place_id find_place returned for the birthplace.",
                "maxLength": 80,
                "type": "string"
              },
              "time": {
                "description": "Local clock time at the birthplace, 24-hour HH:MM or HH:MM:SS. Required: if the person does not know it, ask for their best guess and set time_is_approximate.",
