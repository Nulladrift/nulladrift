        {
          "name": "strengths",
          "title": "Planet and house strengths",
          "description": "Calculate Vedic planet and house strengths with Moon Dasha, as the moondasha.com report computes them: Shadbala (each planet's six-fold strength in virupas and rupas against its required minimum, with Ishta and Kashta Phala), Bhava Bala (each house's strength), Ashtakavarga (bindus by sign for each planet and the Sarvashtakavarga, by Varahamihira's or Parashara's tables), Vimsopaka Bala and Vaiseshikamsa Bala (under the 6, 7, 10 and 16 chart schemes), each with the report's own reading bands, plus a link to them on moondasha.com. Choose with include; all five by default. Needs the birth date, the local birth time and the birthplace (a place_id from find_place). The figures are Moon Dasha's calculations. Interpret them with care and never predict death, illness, a child's sex, markets, elections or court cases.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
