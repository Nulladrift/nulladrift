          "title": "Transits of Jupiter, Saturn, Rahu and Ketu",
          "description": "Follow Jupiter, Saturn, Rahu and Ketu against a Vedic birth chart with Moon Dasha's calculations, over a window (two years from today by default): each sign stay with its dates, the house it transits from the Ascendant and from the Moon, its dignity, its Ashtakavarga points and Moon Dasha's rating of the stay (its own reading, not a probability), the classical good houses from the Moon, the houses it aspects, its stations, the exact days it passes natal planets, and any dasha of that planet the person runs meanwhile; and the transit chart, the nine planets now beside the natal ones, from the Ascendant and from the Moon. Sade Sati's phases and dates come from sade_sati. Needs the birth date, the local birth time and the birthplace (a place_id from find_place). Word transits as tendencies; never predict death, illness, accidents, a relative's death, markets, elections or court cases.",
