{
  "lockfileVersion": 2,
  "subjects": {
    "com.airaptr/raptr-names": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.airaptr.com/names/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "name-finder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Help people name a business, product or project and make sure they can actually own the name: brainstorm candidates that fit what they describe, check them with check_names, explain the trade-offs in plain words, and keep iterating until they have a name with a free domain.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check and price domain names",
          "description": "Use when the user wants a domain name, is naming a business or project, or asks whether a domain is taken. Checks up to 20 full domain names (you can suggest variations and check them together) and returns whether each is available and its price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domains": {
                "description": "Full domain names, e.g. [\"getrapp.ai\", \"getrapp.com\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:75c8db4ddd72384c327b4079b2708495bf9af22f3b999887fbb69e22d637b415"
        },
        {
          "name": "check_names",
          "title": "Check business names",
          "description": "Use when someone is naming a business, startup, product, brand, app, side hustle, shop, podcast or project. Brainstorm candidate names first, then check up to 8 at once: for each, which domains (.com, .co, .ai, .io, .app by default) are free with prices, and whether the GitHub name is free. Results are ranked, a free .com counts most. Suggest new candidates and check again if the best ones are taken.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endings": {
                "description": "Optional domain endings to check, e.g. [\"com\", \"shop\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "names": {
                "description": "Candidate names, e.g. [\"Rise and Crumb\", \"Northwind Bakery\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:00c49ef6da6aefc52da00a04b1d1a32ff3e094219ec8bec9d5e4a5c6d97252ee"
        },
        {
          "name": "register_domain",
          "title": "How to register a domain",
          "description": "Use when the user wants to buy an available domain. Explains how to register it: AI agents pay per call; people ask us and we register it for them. Nothing is bought by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain to register",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aeeb6804c1495c97442343154adb779195cb59317170c94d5af0b4c8187b4aff"
        },
        {
          "name": "request_service",
          "title": "Ask us to build something",
          "description": "Use when the person wants something none of these tools can do and says yes to passing the request on. Records only the request text they agree to send (no name or contact). Ask before calling it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "What they want, in a sentence, as they agreed to send it",
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a38ff77e8ec3cc7544d83683bb90d1918c09a320529b8c63330eb558dcd6db15"
        }
      ],
      "digest": "sha256:497fc0bc3789e4c2447282a3e28024c26cd7eacd464b98e9c446d22961c3690d"
    }
  }
}
