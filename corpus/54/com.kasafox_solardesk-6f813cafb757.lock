      "capabilities": {
        "tools": {}
      },
      "instructions": "SolarDesk is independent and unofficial. High-voltage, grid-tied and battery systems can kill. Qualified installer only for faults touching AC/DC power, batteries, or internal power stages. Verify against the manual for your exact model and serial number.",
      "tools": [
        {
          "name": "diagnose_inverter_fault",
          "description": "Look up a solar / ESS / EV inverter or charge-controller fault code and return the normalised meaning, likely causes, checks, parts, safety notes, and source. Cite the source and hard-stop (requires_qualified_installer) on safety-critical faults.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Inverter/charger brand",
                "enum": ["Fronius", "Growatt", "SMA", "SolarEdge", "Victron"],
                "type": "string"
              },
              "code": {
                "description": "The code shown on the display or app, e.g. 'Err 17', 'VE.Bus Error 8'",
                "type": "string"
              },
              "model": {
                "description": "Optional model or series",
                "type": "string"
              },
              "symptom": {
                "description": "Optional free-text symptom",
                "type": "string"
              }
            },
            "required": ["brand", "code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
