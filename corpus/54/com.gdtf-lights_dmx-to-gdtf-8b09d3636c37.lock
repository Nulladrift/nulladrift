{
  "lockfileVersion": 2,
  "subjects": {
    "com.gdtf-lights/dmx-to-gdtf": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gdtf-lights.com/mcp/dmx-to-gdtf"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gdtf-lights-dmx-to-gdtf",
        "title": "DMX to GDTF fixture finder",
        "version": "1.5.1",
        "websiteUrl": "https://gdtf-lights.com/dmx-to-gdtf",
        "icons": [
          {
            "src": "https://gdtf-lights.com/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          },
          {
            "src": "https://gdtf-lights.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Identifies lighting fixtures by their DMX channel layout in the GDTF Stage Studio library (https://gdtf-lights.com) of 10500+ fixtures with GDTF profiles, run by SOH Sound & Lights s.r.o., Prague. Give match_dmx_channels the channel names in DMX order from address 1 (from a manual, a console, a fixture-profile TXT or a photo the person describes). It returns the best matching fixtures with score 0-100 and the matched DMX mode, with links to the fixture page and the .gdtf file. With confidence low or same_score_count above 1 say the result is uncertain and ask for the manufacturer or DMX values. Tool errors carry a machine code (code) and, when waiting helps, retry_after_seconds. One JSON-RPC message per POST. Catalog language follows the endpoint URL: English by default; ?lang=cs, de or es. The site publishes no prices or stock. Privacy: https://gdtf-lights.com/api#privacy. Full rules: https://gdtf-lights.com/llms.txt",
      "tools": [
        {
          "name": "match_dmx_channels",
          "title": "Identify fixture by DMX channels",
          "description": "Finds the fixtures whose GDTF profile matches a DMX channel list and the matched DMX mode: channel names in DMX order from address 1 (English, Czech, German or Spanish; abbreviations, synonyms and typos are understood), as in a manual, on a console or in a fixture-profile TXT. Give channels (a list) or text (a pasted list, or a TXT with one or more modes; rows such as \"Shutter;0;Closed;32;Open\" add DMX values as a tie-breaker). Returns up to limit fixtures with score 0-100, the matched GDTF mode (mode.name and mode.channels), links to the fixture page (url) and the .gdtf file (gdtf_url), confidence and same_score_count (several fixtures with the same layout: ask for the manufacturer or DMX values). Same search as https://gdtf-lights.com/dmx-to-gdtf. Limit per IP: 20000 searches a day and 300 a minute, shared with the JSON API of that page; 500 a minute and 10000 an hour for all API and MCP clients together.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channels": {
                "description": "Channel names in DMX order, address 1 first, e.g. [\"Pan\", \"Pan fine\", \"Tilt\", \"Tilt fine\", \"Dimmer\", \"Shutter\", \"Color wheel\", \"Gobo\"]; use \"Empty\" for an unused address",
                "items": {
                  "description": "One channel name as written in the manual or on the console, e.g. \"Dimmer\" or \"Pan fine\"",
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 512,
                "minItems": 1,
                "type": "array"
              },
              "include_diff": {
                "default": false,
                "description": "Add for each match the DMX addresses that differ (your channel vs the fixture channel)",
                "type": "boolean"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of fixtures to return, best score first (1-10, default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "Only fixtures of this manufacturer; part of the name is enough, e.g. \"Robe\"",
                "maxLength": 100,
                "type": "string"
              },
              "text": {
                "description": "Instead of channels: a pasted channel list (one per line, numbered or comma-separated) or a fixture-profile TXT (***mode:N***, --- Mode: ---, ##Name;N##)",
                "maxLength": 100000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "properties": {
                  "confidence": {
                    "enum": ["high", "medium", "low", "none"],
                    "type": "string"
                  },
                  "elapsed_ms": {
                    "type": "number"
                  },
                  "ignored_arguments": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "indexed": {
                    "type": "integer"
                  },
                  "input": {
                    "properties": {
                      "fixture_name": {
                        "type": ["string", "null"]
                      },
                      "modes": {
                        "items": {
                          "properties": {
                            "channels": {
                              "type": "integer"
                            },
                            "name": {
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["channels"],
                          "type": "object"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["modes"],
                    "type": "object"
                  },
                  "manufacturer_filter": {
                    "type": "string"
                  },
                  "matches": {
                    "items": {
                      "properties": {
                        "add_to_my_list_url": {
                          "type": "string"
                        },
                        "channels_matched": {
                          "type": ["object", "null"]
                        },
                        "diff": {
                          "type": "object"
                        },
                        "gdtf_url": {
                          "type": ["string", "null"]
                        },
                        "id": {
                          "type": "string"
                        },
                        "image": {
                          "type": ["string", "null"]
                        },
                        "input_mode": {
                          "type": ["object", "null"]
                        },
                        "manufacturer": {
                          "type": "string"
                        },
                        "mode": {
                          "properties": {
                            "channels": {
                              "type": "integer"
                            },
                            "in_gdtf": {
                              "type": "boolean"
                            },
                            "name": {
                              "type": ["string", "null"]
                            }
                          },
                          "type": ["object", "null"]
                        },
                        "mvr_export_url": {
                          "type": ["string", "null"]
                        },
                        "name": {
                          "type": "string"
                        },
                        "rank": {
                          "type": "integer"
                        },
                        "score": {
                          "maximum": 100,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "url": {
                          "type": ["string", "null"]
                        },
                        "value_agreement": {
                          "type": ["integer", "null"]
                        },
                        "value_channels": {
                          "type": "integer"
                        }
                      },
                      "required": ["add_to_my_list_url", "id", "name", "rank", "score", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "note": {
                    "type": "string"
                  },
                  "page_url": {
                    "type": "string"
                  },
                  "same_score_count": {
                    "type": "integer"
                  },
                  "same_score_count_is_minimum": {
                    "type": "boolean"
                  },
                  "scored": {
                    "type": "integer"
                  }
                },
                "required": ["confidence", "indexed", "input", "matches", "page_url", "same_score_count"],
                "type": "object"
              },
              {
                "properties": {
                  "allowed_layouts": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "allowed_templates": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "allowed_visualizers": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "candidates": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "code": {
                    "enum": ["invalid_argument", "fixture_not_found", "no_gdtf", "unknown_layout", "unknown_visualizer", "unknown_template", "templates_disabled", "invalid_layout_params", "invalid_scene", "job_unknown", "forbidden_origin", "rate_day", "rate_minute", "rate_global", "rate_storage", "busy", "server_busy", "unavailable", "template_unavailable", "invalid_job", "server_error"],
                    "type": "string"
                  },
                  "error": {
                    "type": "string"
                  },
                  "errors": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "mvr_export_page": {
                    "type": "string"
                  },
                  "parameters": {
                    "type": "string"
                  },
                  "retry_after_seconds": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "warnings": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["code", "error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
