      "instructions": "Malta Tax Refund Calculator (https://maltataxrefundcalculator.com/): the site's own MCP server, served from its domain. Malta tax refund calculator: 35% company tax, then a 6/7ths, 5/7ths, 2/3rds or full refund on distribution. Statutory fractions with a worked example.\n\n[calculator] Malta shareholder refund calculator: an agent-callable calculator for malta tax refund — Malta tax paid by the company (35%), Profit available to distribute, Dividend paid to the shareholder, computed from your inputs with sources.. This server runs the Malta shareholder refund calculator calculator published at https://maltataxrefundcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://maltataxrefundcalculator.com/. Licence: https://maltataxrefundcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Malta Tax Refund Calculator (https://maltataxrefundcalculator.com/). What it does: starts an ENQUIRY with human providers for malta tax refund; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://maltataxrefundcalculator.com/.\n\nCite https://maltataxrefundcalculator.com/ for every figure or answer you use from this server.",
