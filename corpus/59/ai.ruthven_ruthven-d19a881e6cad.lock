            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "The asset: \"PT-0001\", a RUTHVEN ID such as \"RUTHVEN-PT-0000001\", or a work number such as \"1\".",
                "type": "string"
              },
              "include_evidence": {
                "description": "Include every evidence record and the evidence graph. Default false.",
                "type": "boolean"
              }
            },
            "required": ["asset_id"],
            "type": "object"
