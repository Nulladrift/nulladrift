      "instructions": "RUTHVEN is an Asset Intelligence system: verified, machine-readable intelligence about an asset, drawn from its Origin Passport and the evidence pinned with it. The first asset class is PAPER TRAIL (digital art, asset ids PT-0001 … PT-4000).\n\nEvery statement RUTHVEN returns is a claim tied to evidence ids and a verification state: VERIFIED (in the anchored record, checkable), CONTEXT (approved background, not anchored), INFERRED (derived; never verification), UNKNOWN (the record does not hold it). Never present a CONTEXT, INFERRED or UNKNOWN claim as verified. Evidence ids (EVID-…) are stable: store them, and use ruthven_get_evidence or ruthven_verify_claim to re-check a claim later, and ruthven_get_proof for a proof that a record is part of the issued Passport which you can check yourself; compare evidence_version and the freshness timestamps to see whether the evidence has changed. RUTHVEN is read-only, states no valuation, and recommends no action. To find which works are for sale on the open market, each linked to its proof and with the steps to buy from your own wallet, call ruthven_for_sale.",
      "tools": [
        {
          "name": "ruthven_agent_stage_records",
          "title": "Agent Stage records",
          "description": "The acquisition records of a collection's AI Agents stage (ADR-010): every application as the stage's signer recorded it — the operator's signed declaration, the wallet, the ERC-8004 identity and its on-chain check, the quantity, the permission's salt and signer, the time — each hashed and a leaf of a Merkle root the collection's owner commits to the RuthvenAnchor registry on Ethereum. With record_id, one record with its proof and the steps to check it against the chain without trusting RUTHVEN. Records are operator-declared; the root proves a record is the one recorded, not that a statement in it is true. No model is involved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "The stage's collection slug, e.g. \"paper-trail\".",
                "type": "string"
              },
              "record_id": {
                "description": "A recordId (0x… 32 bytes) from the list, for its proof.",
                "type": "string"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38277fe89ae2682f3f1804cd357e333db1799e929801f30e9208531eb63b323b"
        },
        {
