          "title": "Ask RUTHVEN",
          "description": "Ask a question about one asset. Returns structured JSON only: an answer, claims (each with a verification state and the evidence ids it rests on), unknowns, the full cited evidence records, and follow-up questions. Never a valuation; never a recommendation to act.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "The asset: \"PT-0001\", a RUTHVEN ID such as \"RUTHVEN-PT-0000001\", or a work number such as \"1\".",
                "type": "string"
              },
              "question": {
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["asset_id", "question"],
            "type": "object"
          },
