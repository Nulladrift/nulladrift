        {
          "name": "ruthven_get_proof",
          "title": "Prove a claim",
          "description": "A Merkle proof that evidence records are part of the issued Origin Passport, with the entry each rests on and the steps to check it without trusting RUTHVEN: SHA-256 over the entry, keccak256 up the proof, and the root compared with the one in the published Passport. It proves that the record contains the entry; it does not make a statement true. With neither evidence_ids nor paths, returns the paths that can be proved. Deterministic; no model is involved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "The asset: \"PT-0001\", a RUTHVEN ID such as \"RUTHVEN-PT-0000001\", or a work number such as \"1\".",
                "type": "string"
              },
              "evidence_ids": {
                "description": "Stable evidence ids (EVID-…).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "paths": {
                "description": "Entry paths in the Passport, e.g. \"identity.name\" or \"module.collection.copyrightOwner\".",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["asset_id"],
            "type": "object"
          },
