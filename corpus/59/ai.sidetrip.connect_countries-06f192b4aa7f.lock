{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sidetrip.connect/countries": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://demo-countries.sidetrip.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "countries",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only public data. Use find_country for a profile, compare_countries for a side-by-side profile, get_indicator for GDP, population, inflation, and other World Bank series, list_common_indicators for aliases, list_countries for a region or currency roster, and fx_rates for European Central Bank exchange rates. No account is required. Figures can lag by a year or more.",
      "tools": [
        {
          "name": "compare_countries",
          "description": "Compare two to six countries side by side on capital, region, population, area, languages, and currencies. An exact common name is chosen when a search also returns other countries, such as Guinea among the Guineas. Pass ISO codes when the name is still ambiguous. Use get_indicator to compare GDP, inflation, or a year range.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "countries": {
                "description": "Country names or ISO codes, from 2 to 6.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["countries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:79d545a61febf355c3626cf2034f9b7f39e43ada805c2f6ddb8ed4faf05f02f5"
        },
        {
          "name": "find_country",
          "description": "Look up a country by common name, ISO 3166 alpha-2 or alpha-3 code, or capital city. Returns the name, codes, capital, region, population, area, languages, currencies, and flag. Use this for a single country profile. Population here is the countries.dev figure; use get_indicator with population for the World Bank series.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "match": {
                "description": "How to search. auto tries an ISO code first when the query is 2 or 3 letters, otherwise a name.",
                "enum": ["auto", "name", "code", "capital"],
                "type": "string"
              },
              "query": {
                "description": "Country name, ISO code, or capital. Examples: France, FR, FRA, Paris.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f1a006dfd709dfa58b106a9f2e741a17a211599954ceec4751993d22da54a7b6"
        },
        {
          "name": "fx_rates",
          "description": "Convert an amount with European Central Bank reference rates via Frankfurter. Defaults to the latest USD rates. Pass date as YYYY-MM-DD for the rate on that day, or the previous business day when the market was closed. No API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Amount of the base currency. Defaults to 1.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "base": {
                "description": "ISO 4217 currency to convert from. Defaults to USD.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "date": {
                "description": "Calendar day YYYY-MM-DD. Omit for the latest published rate.",
                "type": "string"
              },
              "symbols": {
                "description": "Currencies to quote. Omit to return every ECB rate against the base.",
                "items": {
                  "pattern": "^[A-Za-z]{3}$",
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:704d4d810df40013e4f3b445ed479aa05df8602518b1fb5e5f1d105645cfe2d2"
        },
        {
          "name": "get_indicator",
          "description": "Fetch a World Bank indicator for one or more countries and a year range. Aliases: gdp, gdp_per_capita, gdp_growth, population, inflation, unemployment, life_expectancy, exports. A raw id such as NY.GDP.MKTP.CD also works. Call list_common_indicators to see ids and units. Missing years are omitted. World Bank figures often lag by a year or more.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "countries": {
                "description": "Country names or ISO codes, from 1 to 8.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "end_year": {
                "description": "Last year. Defaults to the current year, or to start_year when only the start is set.",
                "maximum": 2100,
                "minimum": 1960,
                "type": "integer"
              },
              "indicator": {
                "description": "Alias such as gdp or inflation, or a World Bank indicator id.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "start_year": {
                "description": "First year. Defaults to ten years before the current year, or to end_year when only the end is set.",
                "maximum": 2100,
                "minimum": 1960,
                "type": "integer"
              }
            },
            "required": ["countries", "indicator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:38b2e63270a350cf6b96862e8764705317e1539fa32f6c99c6d60cb7278d46bd"
        },
        {
          "name": "list_common_indicators",
          "description": "List the indicator aliases get_indicator accepts, with the World Bank id, name, and unit. Optionally filter by text in the alias, id, or name. This list is local and does not call the network.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Optional text filter, such as gdp or inflation.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0f462cd9fb9213add974053ddddd9b0ae1c964da9d6bac0a695fca362e1363d3"
        },
        {
          "name": "list_countries",
          "description": "List countries in one region, or countries that use an ISO 4217 currency. Regions: Africa, Americas, Asia, Europe, Oceania, Antarctic. Pass both to keep only that currency inside the region. Returns a compact roster, not a full profile.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currency": {
                "description": "ISO 4217 currency code, such as EUR or JPY.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "region": {
                "description": "UN statistical region.",
                "enum": ["Africa", "Americas", "Asia", "Europe", "Oceania", "Antarctic"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a39035a0cdf9ad7db5f90853a61fe0faf37915d03d235ea8b15d480d8b728095"
        }
      ],
      "digest": "sha256:ed954ad37064e5bcba2a68a43d5e6b310377046ef4deb2973dca09f39b37a549"
    }
  }
}
