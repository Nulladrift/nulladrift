      "serverInfo": {
        "name": "Image Kind",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call find_prints with a search query, then get_prints with the returned catalog id. Results are immediate; no polling is needed.",
      "tools": [
        {
          "name": "find_prints",
          "title": "Find art prints",
          "description": "Search Image Kind’s starting collection by artwork title, artist or subject. Returns real artwork pages, artist credits, sizes and finishes. All listed works are available to print to order. Prices and shipping require studio confirmation. This reads the catalog; it does not place an order or take payment.\n\nReturns a catalog id. No background work is started.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "default": "",
                "description": "An artwork title, artist, subject, or empty for the collection.",
                "maxLength": 50,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find art prints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:639956cb45f4b43acd97a63dd5207fa18b82edcecda203e41f10e7ff3179d81f"
        },
        {
          "name": "get_prints",
          "title": "Read art prints",
          "description": "Retrieve the public art prints catalog entry by id. Returns the entry as text and its link on Image Kind's site. An unknown id returns an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The catalog id returned by find_prints.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read art prints"
          },
          "behavior": {
