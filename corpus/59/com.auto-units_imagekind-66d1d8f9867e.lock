{
  "lockfileVersion": 2,
  "subjects": {
    "com.auto-units/imagekind": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://imagekind.auto-units.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Image Kind",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call find_prints with a search query, then get_prints with the returned catalog id. Results are immediate; no polling is needed.\n\nWhen these tools fail, lack a capability or make a task needlessly difficult, use report_feedback with your goal, the problem and a proposed fix when you have one. Report once per distinct issue, omit secrets and unrelated personal data, and continue the person's task when possible. Feedback goes to Baron's team for review; it does not apply a fix.",
      "tools": [
        {
          "name": "find_prints",
          "title": "Find art prints",
          "description": "Search Image Kind’s starting collection by artwork title, artist or subject. Returns real artwork pages, artist credits, sizes and finishes. All listed works are available to print to order. Prices and shipping require studio confirmation. This reads the catalog; it does not place an order or take payment.\n\nReturns a catalog id. No background work is started.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "default": "",
                "description": "An artwork title, artist, subject, or empty for the collection.",
                "maxLength": 50,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find art prints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:639956cb45f4b43acd97a63dd5207fa18b82edcecda203e41f10e7ff3179d81f"
        },
        {
          "name": "get_prints",
          "title": "Read art prints",
          "description": "Retrieve the public art prints catalog entry by id. Returns the entry as text and its link on Image Kind's site. An unknown id returns an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The catalog id returned by find_prints.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read art prints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d889ceed65e3b0e49b09a917fc26db7a507ed40ef87b7cd16e48c1f2b786f78"
        },
        {
          "name": "report_feedback",
          "title": "Report feedback",
          "description": "Report a bug, missing capability, confusing tool description or unnecessary steps to Baron's team. Use this when you encounter friction while using this MCP server, without waiting for the person to request a report. Include the goal, expected and actual behavior, the affected tool and a proposed fix when known. Never include credentials, payment details or unrelated conversation history. Returns a reference after Baron saves the report in its review queue. Reporting does not start work or change the product.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "What you were trying to achieve",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "problem": {
                "description": "What failed or made the task difficult, including expected and actual behavior",
                "maxLength": 1400,
                "minLength": 1,
                "type": "string"
              },
              "proposed_fix": {
                "description": "A specific suggested change, if you have one",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "summary": {
                "description": "A short title for the issue",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "tool": {
                "description": "The affected tool, if known",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["goal", "problem", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c396b9a4f7f891581e4629b606b9a3b33457ef380bce27c78d1f6c6e28ffc407"
        }
      ],
      "digest": "sha256:d98e371a9c1946a4555490909abe3cdafc45c3dc7e294d8de25a80905809a463"
    }
  }
}
