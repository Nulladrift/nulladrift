        {
          "name": "request_quote",
          "title": "Request a survey quote",
          "description": "Sends a land survey quote request to Roome Land Surveying, a licensed land surveying firm in Plano, Texas, with the details the person gives. Properties in Texas only. Each accepted request emails the person a link to confirm it, and nothing reaches Roome until they do.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "The property's street address with the city or ZIP, for example 1234 Main St, Plano, TX 75074.",
                "type": "string"
              },
              "date": {
                "description": "Optional: the desired completion date, YYYY-MM-DD.",
                "type": "string"
              },
              "email": {
                "description": "The person's email address. The confirmation email goes here.",
                "type": "string"
              },
              "name": {
                "description": "The person's full name.",
                "type": "string"
              },
              "needs": {
                "description": "What the survey is for, in the person's words (up to 1000 characters).",
                "type": "string"
              },
              "phone": {
                "description": "The person's 10-digit US phone number.",
                "type": "string"
              },
              "service": {
                "description": "Optional: a service slug from list_services, for example boundary-survey.",
                "type": "string"
              }
            },
            "required": ["address", "email", "name", "needs", "phone"],
            "type": "object"
          },
