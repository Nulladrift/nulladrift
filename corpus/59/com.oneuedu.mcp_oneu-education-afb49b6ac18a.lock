        {
          "name": "get_planning_schema_definition",
          "title": "Read an authoritative planning definition",
          "description": "Read one to twenty published references together in schema_refs, including a one-element list for one definition. Collect known references for the next action and batch them instead of calling once per field. Returns definitions keyed by reference and shared, reference-closed components. Reuse them at the same name/version; profile output and profile_patch input are distinct. result_list describes the lightweight list projection; result_reading describes expanded user-facing detail and field meanings, not integer record tables from the separate full-reading API. Invalid references or oversized batches fail explicitly; split a rejected batch without omitting constraints. Avoid full profile definitions unless needed. Requires the authenticated One U Education account and declared planning scope; credentials and user identity are never tool arguments.",
          "inputSchema": {
            "$defs": {
              "__schema0": {
                "minLength": 1,
                "type": "string"
              },
              "__schema1": {
                "minLength": 1,
                "type": "string"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "name": {
                "enum": ["preferences", "profile", "profile_patch", "planning_settings", "result_reading", "result_list", "result"],
                "type": "string"
              },
              "schema_refs": {
                "description": "Collect needed published schema_ref values and read them together, even for one reference. Same schema name/version only; definitions are keyed by reference and components are shared. Invalid references or an oversized batch fail explicitly.",
                "items": {
                  "$ref": "#/$defs/__schema0"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "version": {
                "$ref": "#/$defs/__schema1",
                "description": "Reuse definitions only for the same schema name/version. Only the current version is served."
              }
            },
            "required": ["name", "schema_refs"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "type": "integer"
              },
              "data": {
                "type": "object"
              },
              "msg": {
                "type": "string"
