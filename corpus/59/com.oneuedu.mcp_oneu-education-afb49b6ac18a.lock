        {
          "name": "search_courses",
          "title": "Search Australian courses",
          "description": "Search CRICOS-registered Australian courses for international students by keyword and structured filters (state/city, qualification group or exact AQF level, field of education, tuition range, IELTS, length, provider type, provider code, provider evidence level, regional area, sort). Returns a page of compact course summaries with tuition for the given studentLocation, provider and page url, plus webUrl (the same search on oneuedu.com) for the user. totalResults is the number of matching courses; when totalCapped is true only the first reachableResults of them can be paged through, so split the search (by state, subject, schoolCode or fee range) to list them all. evidenceLevel requires a website account on the public endpoint; other filters are public. Use get_course with explicit sections afterwards for the topics relevant to a specific course. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
          "inputSchema": {
            "properties": {
              "accurateFeeOnly": {
                "description": "Only courses whose tuition is verified/accurate.",
                "type": "boolean"
              },
              "city": {
                "description": "City of the campus in English (Sydney, Melbourne, Brisbane, Perth, Adelaide, Canberra, Hobart, Darwin, Gold Coast, Geelong, ...). Requires state. See list_search_options for the full list.",
                "type": "string"
              },
              "closedOnly": {
                "description": "Only courses that no longer accept international students (closed). Default false: only courses still open to them. There is no mixed mode; to check whether one specific course is closed, call get_course.",
                "type": "boolean"
              },
              "degree": {
                "description": "Qualification group(s): master (postgraduate), bachelor (undergraduate), diploma (diplomas and Certificate I-IV), k12 (schools), other (PhD, graduate certificate/diploma, non-AQF).",
                "items": {
                  "enum": ["master", "bachelor", "diploma", "k12", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "degreeLevel": {
                "description": "Exact AQF level name(s) for a finer filter than degree, e.g. \"Masters Degree (Coursework)\", \"Bachelor Degree\", \"Certificate III\"; overrides degree when both are given. Group names (master/bachelor/diploma/k12/other) belong in degree, not here: they are moved to degree automatically, case/spacing variants of a level name are corrected, and unknown values are ignored. list_search_options lists the levels under each group.",
                "items": {
                  "enum": ["Masters Degree (Coursework)", "Masters Degree (Research)", "Masters Degree (Extended)", "Associate Degree", "Bachelor Degree", "Bachelor Honours Degree", "Diploma", "Advanced Diploma", "Certificate I", "Certificate II", "Certificate III", "Certificate IV", "Primary School Studies", "Junior Secondary Studies", "Kindergarten Studies", "Senior Secondary Certificate of Education", "Non AQF Award", "Doctoral Degree", "Graduate Diploma", "Graduate Certificate"],
                  "type": "string"
                },
                "type": "array"
              },
              "educationType": {
                "description": "higherEducation (universities) or vocationalEducation (VET/TAFE/RTO).",
                "enum": ["higherEducation", "vocationalEducation"],
                "type": "string"
              },
              "evidenceLevel": {
                "description": "Only courses at providers whose student-visa evidence level is one of these (1 = lowest documentary risk, 3 = highest), as compiled by One U Education from the official Document Checklist Tool. On the public endpoint this requires a connected One U Education account. Each returned provider is checked against its current evidence-level record: results attach providerEvidenceLevel with its capture date, and evidenceLevelCheck lists providers excluded because their current record is outside the requested levels. A provider level is not a visa approval probability.",
                "items": {
                  "enum": [1, 2, 3],
                  "type": "integer"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "funding": {
                "description": "Provider type: Government (public universities/TAFE) or Private.",
                "enum": ["Government", "Private"],
                "type": "string"
              },
              "keyword": {
                "description": "Course name keywords in English or Chinese, or a CRICOS course code. Examples: \"nursing\", \"early childhood\", \"幼教\", \"089591C\". Keep it short (2-4 words); do not put the city, degree or school name here, use the dedicated filters instead.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "default": "zh-CN",
                "description": "Language of names/descriptions in the result: zh-CN (default, Simplified Chinese plus English names), en-US, zh-TW. Also selects the language prefix of returned oneuedu.com URLs.",
                "enum": ["zh-CN", "en-US", "zh-TW"],
                "type": "string"
              },
              "maxFee": {
                "description": "Maximum tuition in AUD per academic year: compared with tuitionForStudentLocation.perAcademicYearAud in each result (courses shorter than one year use their whole-course fee), the same basis as sort fee_asc/fee_desc. Not total course tuition.",
                "minimum": 0,
                "type": "number"
              },
              "maxIelts": {
                "description": "Maximum IELTS overall band required (0-9, 0.5 steps).",
                "maximum": 9,
                "minimum": 0,
                "type": "number"
              },
              "maxYears": {
                "description": "Maximum course length in academic years (0.5 steps).",
                "maximum": 7,
                "minimum": 0,
                "type": "number"
              },
              "minFee": {
                "description": "Minimum tuition in AUD per academic year: compared with tuitionForStudentLocation.perAcademicYearAud in each result (courses shorter than one year use their whole-course fee), the same basis as sort fee_asc/fee_desc. Not total course tuition.",
                "minimum": 0,
                "type": "number"
              },
              "minIelts": {
                "description": "Minimum IELTS overall band required (0-9, 0.5 steps).",
                "maximum": 9,
                "minimum": 0,
                "type": "number"
              },
              "minYears": {
                "description": "Minimum course length in academic years (0.5 steps).",
                "maximum": 7,
                "minimum": 0,
                "type": "number"
              },
              "packagedOnly": {
                "description": "Only packaged (pathway) courses.",
                "type": "boolean"
              },
              "page": {
                "default": 1,
                "description": "1-based page number.",
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "default": 10,
                "description": "Results per page, max 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "remoteArea": {
                "description": "\"only\" = regional/remote-area campuses only (extra migration points); \"exclude\" = metropolitan only.",
                "enum": ["only", "exclude"],
                "type": "string"
              },
              "schoolCode": {
                "description": "Restrict to one provider by its CRICOS provider code, e.g. \"00113B\" (Deakin University). Use get_school or a school page URL to find codes.",
                "type": "string"
              },
              "sort": {
                "description": "relevance (default), fee_asc/fee_desc (tuition per academic year), totalFee_asc/totalFee_desc (whole-course tuition), length_asc, length_desc.",
                "enum": ["relevance", "fee_asc", "fee_desc", "totalFee_asc", "totalFee_desc", "length_asc", "length_desc"],
                "type": "string"
              },
              "state": {
                "description": "Australian state/territory of the campus: VIC, NSW, QLD, WA, SA, ACT, TAS, NT.",
                "enum": ["VIC", "NSW", "QLD", "WA", "SA", "ACT", "TAS", "NT"],
                "type": "string"
              },
              "studentLocation": {
                "default": "offshore",
                "description": "Where the student currently is. \"offshore\" = applying from outside Australia (default); \"onshore\" = already in Australia. This changes both the result set and which tuition figure is authoritative, so ask the user if unknown.",
                "enum": ["offshore", "onshore"],
                "type": "string"
              },
              "subject": {
                "description": "Broad field of education code(s): 01 Natural & Physical Sciences, 02 Information Technology, 03 Engineering, 04 Architecture & Building, 05 Agriculture & Environment, 06 Health, 07 Education, 08 Management & Commerce, 09 Society & Culture, 10 Creative Arts, 11 Food/Hospitality/Personal Services, 12 Mixed field.",
                "items": {
                  "enum": ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
