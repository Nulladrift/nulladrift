                      "minLength": 1,
                      "type": "string"
                    },
                    "size": {
                      "maximum": 20971520,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["file_name", "size"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "request_id": {
                "pattern": "^[0-9a-fA-F-]{36}$",
                "type": "string"
              }
