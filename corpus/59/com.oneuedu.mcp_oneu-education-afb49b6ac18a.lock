        {
          "name": "query_dama_occupations",
          "title": "Find DAMA regions, occupations and conditions",
          "description": "Regional policy directory without filters. keyword finds candidate official titles; code or exact officialTitle compares entries across regions. agreementId lists or filters regional occupations. Matches identify entries. Open detail to read conditions and the agreement’s registered source documents. Detail uses agreementId, itemId and releaseId for complete conditions. Pages contain up to 20 entries; subsequent pages use the same filters, releaseId and locale. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
