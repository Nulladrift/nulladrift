        {
          "name": "get_skill_assessment_rules",
          "title": "Get skills assessment rules",
          "description": "Skills assessment rules of an Australian assessing authority (TRA, ACS, VETASSESS, Engineers Australia, ANMAC, CPA Australia, CAANZ, IPA, ACECQA and others), checked against the authority's official pages. By default returns a summary: the authority, each program's target applicants, English, processing time and fees, the occupation's TRA facts (MSA / OSAP / TSS by passport) and its published pathways, with source dates and the sections not yet read. sections reads the full program rules (qualification, work experience, exclusions), pathway text, common misconceptions, sources or review metadata; programIds / pathwayIds narrow them. Pass occupation alone to look up its authority and pathways. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
          "inputSchema": {
            "properties": {
              "authority": {
                "description": "Assessing authority code or name, e.g. \"TRA\", \"ACS\", \"VETASSESS\", \"Engineers Australia\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "locale": {
                "default": "zh-CN",
                "description": "Language of names/descriptions in the result: zh-CN (default, Simplified Chinese plus English names), en-US, zh-TW. Also selects the language prefix of returned oneuedu.com URLs.",
                "enum": ["zh-CN", "en-US", "zh-TW"],
                "type": "string"
              },
              "occupation": {
                "description": "Internal occupationCode from search_occupations, or occupation URL/slug. anzsco is a shared classification code, not a unique identity. Exact internal code matches take precedence; search to select a candidate only if no exact match exists.",
                "minLength": 4,
                "type": "string"
              },
              "passportCountry": {
                "description": "Passport country in English, e.g. \"China\", \"India\". TRA decides OSAP / TSS by passport.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "pathwayIds": {
                "description": "With sections [\"occupationPathways\"]: only these pathway ids, e.g. [\"TRA-TSS\"]. Ids are listed in the summary.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "programIds": {
                "description": "With sections [\"programRules\"]: only these program ids, e.g. [\"OSAP\"]. Ids are listed in the summary.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "sections": {
                "description": "Omit for the summary (authority, program index with who / English / processing / fees, occupation facts and pathway index). Add sections to read more: authorityRules, programRules, commonMisconceptions, occupationFacts, occupationPathways, sources, verification. The summary lists the sections it did not include.",
                "items": {
                  "enum": ["summary", "authorityRules", "programRules", "commonMisconceptions", "occupationFacts", "occupationPathways", "sources", "verification"],
                  "type": "string"
