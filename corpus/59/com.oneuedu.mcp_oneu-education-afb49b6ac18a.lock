        {
          "name": "update_planning_profile",
          "title": "Update confirmed planning facts",
          "description": "Save the user’s explicit confirmed facts as structured changes at expected_revision. The client model interprets text/files; clarify ambiguous people, ownership or inferred facts before writing. When a field or record shape is unknown, use get_planning_schema_index and batch all needed references in get_planning_schema_definition.schema_refs with name=profile_patch; reuse definitions and included components already read at the same schema name/version, without mixing profile output and profile_patch input definitions. Schema discovery is not a prerequisite for every write. Save supported facts progressively without completing unrelated topics. A successful save already returns the revision and resource; fetch questions only when the next reply actually needs a new backend question, not as an automatic post-save check. Atomic changes may span people and topics. Objects merge; spouse:{} creates an empty spouse, spouse:null removes it without changing relationship status. Study, work and occupational goals are independent; explain recommendations and obtain user confirmation before saving them. Omitted fields remain unchanged; nullable facts accept null, empty string or empty array as unknown; valid zero and false are preserved; arrays replace the complete array, so read and preserve unrelated records and stable IDs. Returns the saved revision or explicit validation errors. Requires the authenticated One U Education account and declared planning scope; credentials and user identity are never tool arguments.",
