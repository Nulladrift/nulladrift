        {
          "name": "get_state_nomination_detail",
          "title": "Read selected state nomination policy sections",
          "description": "Read selected policy blocks for one state; sections is required and nonempty. Start with the fewest blocks directly relevant to the question (fees for costs; application and policyNotes for state deadlines). programRules returns one upstream compiled project record, not all applicable conditions. It requires visaSubclass and exact program together; omit both for state-wide sections. In mixed requests they scope programRules only. For programRules, reuse the exact state/visaSubclass/program identity previously returned by this MCP in the current conversation. Otherwise first call get_state_nomination_occupations without program. User-provided pathway names, abbreviations or translations are not verified API identities. State-wide sections such as fees do not require directory discovery. Identify specific missing facts before reading more; if no block resolves a conflict, report it. available means data was read, not verified, undisputed or personal eligibility. federalRequirements is shared validity/deadline information, not all federal visa rules. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
          "inputSchema": {
            "properties": {
              "locale": {
                "default": "zh-CN",
                "description": "Language of names/descriptions in the result: zh-CN (default, Simplified Chinese plus English names), en-US, zh-TW. Also selects the language prefix of returned oneuedu.com URLs.",
                "enum": ["zh-CN", "en-US", "zh-TW"],
                "type": "string"
              },
              "program": {
                "description": "Required together with visaSubclass only when sections contains programRules. Omit both for state-wide policy sections. In mixed requests they scope programRules only; they do not filter other sections. Reuse the exact state/visaSubclass/program identity previously returned by this MCP in the current conversation. Otherwise first call get_state_nomination_occupations without program. User-provided pathway names, abbreviations or translations are not verified API identities.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "releaseId": {
                "description": "Reuse the releaseId from a previous result for subsequent details and pages.",
                "maxLength": 160,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9._-]+$",
                "type": "string"
              },
              "sections": {
                "items": {
                  "enum": ["pathways", "selection", "fees", "application", "policyNotes", "occupationPolicy", "allocations", "federalRequirements", "sources", "programRules"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "state": {
                "enum": ["ACT", "NSW", "NT", "QLD", "SA", "TAS", "VIC", "WA"],
                "type": "string"
              },
              "visaSubclass": {
                "description": "Required together with program only when sections contains programRules. Omit both for state-wide policy sections. In mixed requests they scope programRules only; they do not filter other sections.",
                "enum": ["190", "491"],
                "type": "string"
              }
            },
            "required": ["sections", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
