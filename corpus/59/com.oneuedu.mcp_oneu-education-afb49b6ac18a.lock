        {
          "name": "get_eoi",
          "title": "Read EOI pools, history and distributions",
          "description": "Read SkillSelect EOI data in English for subclass 189, 190 or 491 state nomination. view defaults to summary, with optional points comparison; history returns monthly totals, at most six months per call; points or states requires occupation and month and returns at most fifteen categories per page. Anonymous access covers the latest published month and preceding two calendar months in every view. Earlier months require an OAuth-connected One U Education account with mcp:read. History uses fromMonth/toMonth; distributions use page. Each request reads the current published data. Counts below twenty are suppressed, state categories overlap, and 189 has no state distribution. Preserve the other filters when continuing, and stop when the user’s question is answered. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fromMonth": {
                "description": "history only: first month in the requested range, inclusive.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "locale": {
                "default": "zh-CN",
                "description": "Language of names/descriptions in the result: zh-CN (default, Simplified Chinese plus English names), en-US, zh-TW. Also selects the language prefix of returned oneuedu.com URLs.",
                "enum": ["zh-CN", "en-US", "zh-TW"],
                "type": "string"
              },
              "month": {
                "description": "summary, points or states only: snapshot month. Required for points and states; summary defaults to the latest published month. Anonymous access is limited to the latest published month and preceding two calendar months; an OAuth connection unlocks earlier snapshots.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "occupation": {
                "description": "Internal occupationCode from search_occupations, or occupation URL/slug. anzsco is a shared classification code, not a unique identity. Exact internal code matches take precedence; search to select a candidate only if no exact match exists.",
                "maxLength": 512,
                "minLength": 4,
                "type": "string"
              },
              "page": {
                "description": "points or states only: category page, starting at 1. occupation and month are required for these views.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "points": {
                "description": "summary only: points score for a pool comparison. This score stays inside the MCP server.",
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "toMonth": {
                "description": "history only: last month in the requested range, inclusive. Use the suggested toMonth for earlier pages.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "view": {
                "default": "summary",
                "description": "summary: short overview and optional points comparison; history: monthly totals, six months per call; points or states: one occupation and snapshot distribution, fifteen categories per page.",
                "enum": ["summary", "history", "points", "states"],
                "type": "string"
              },
              "visaSubclass": {
                "default": "189",
                "enum": ["189", "190", "491"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read EOI pools, history and distributions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:60570245ad45179cec64ac6b25eb20d926d26b030805a1d086db6a8eaecf7201"
