        {
          "name": "estimate_189_invitation",
          "title": "Estimate subclass 189 invitation timing",
          "description": "Estimates when a subclass 189 EOI could be invited, using One U Education's queue model (the same as oneuedu.com's 189 invitation predictor): give the internal occupationCode and points, and optionally the EOI date of effect (YYYY-MM) for a queue position by lodgement month. Returns the verdict (next round, later round, not within the 24-month EOI life, or stalled), estimated month, fast/slow scenarios, EOIs ahead, and the wait at other points scores. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
          "inputSchema": {
            "properties": {
              "eoiMonth": {
                "description": "Date of effect month YYYY-MM (when the EOI reached this score). Ties at the same score are ranked by it.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "firstLodgedMonth": {
                "description": "Month the EOI was first lodged, if different from eoiMonth (EOIs expire 24 months after lodgement).",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "locale": {
                "default": "zh-CN",
                "description": "Language of names/descriptions in the result: zh-CN (default, Simplified Chinese plus English names), en-US, zh-TW. Also selects the language prefix of returned oneuedu.com URLs.",
                "enum": ["zh-CN", "en-US", "zh-TW"],
                "type": "string"
              },
              "occupation": {
                "description": "Internal occupationCode from search_occupations, or occupation URL/slug. anzsco is a shared classification code, not a unique identity. Exact internal code matches take precedence; search to select a candidate only if no exact match exists.",
                "minLength": 4,
                "type": "string"
              },
              "points": {
                "description": "Points test score on the EOI (65 is the pass mark).",
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["occupation", "points"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate subclass 189 invitation timing"
          },
          "behavior": {
            "destructive": false,
