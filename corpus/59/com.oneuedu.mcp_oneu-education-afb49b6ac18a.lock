        {
          "name": "search_occupations",
          "title": "Search skilled occupations (ANZSCO)",
          "description": "Search the Australian skilled occupation database (ANZSCO codes used for skills assessment and skilled migration) by occupation name keyword or ANZSCO code, optionally filtered by occupation list (MLTSSL / STSOL / ROL / CSOL), by the lists a visa subclass accepts (189, 190, 491, 491F, 494, 407, 485, 482, 186) and by processing priority under Ministerial Directions 121 / 122. Returns occupation identity (occupationCode, shared anzsco, optional name), which occupation lists it sits on, shortage flag, processing-priority sector and the oneuedu.com page url. For \"482 priority occupations\" use visaSubclass \"482\" with processingPriority true. Use get_base_occupation for basic facts; get_occupation_visas, get_skill_assessment_rules, get_189_invitations, get_eoi or get_state_nomination for a specific topic. get_occupation requires explicit sections for multi-topic queries. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "Occupation name in English or Chinese (e.g. \"nurse\", \"software engineer\", \"厨师\") or an ANZSCO code such as \"254411\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "default": "zh-CN",
                "description": "Language of names/descriptions in the result: zh-CN (default, Simplified Chinese plus English names), en-US, zh-TW. Also selects the language prefix of returned oneuedu.com URLs.",
                "enum": ["zh-CN", "en-US", "zh-TW"],
                "type": "string"
              },
              "occupationList": {
                "description": "Only occupations on this list: MLTSSL (medium/long-term, 189 eligible), STSOL (short-term), ROL (regional), CSOL (482 Core Skills / 186 Direct Entry). With visaSubclass it must be one of the lists that visa accepts.",
                "enum": ["MLTSSL", "STSOL", "ROL", "CSOL"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "1-based page number; 15 occupations per page.",
                "minimum": 1,
                "type": "integer"
              },
              "processingPriority": {
                "description": "true: only occupations whose ANZSCO code falls in a priority sector of Ministerial Directions 121 (482) / 122 (186, 189, 190, 491, 494 and others), in effect from 19 Sep 2026: construction, healthcare, education, plus resources and law enforcement, which also depend on the position or nominator. Agriculture, aquaculture, fisheries and defence are judged by the role, not the code, so they cannot be filtered. Not available with 407 or 485, which neither direction covers. Results are sorted by ANZSCO code.",
                "type": "boolean"
              },
              "visaSubclass": {
                "description": "Only occupations on the lists this visa's list-bound streams accept: 189 MLTSSL; 190 MLTSSL + STSOL; 491 MLTSSL + STSOL + ROL (491F MLTSSL); 494 MLTSSL + ROL; 407 MLTSSL + STSOL + ROL; 485 MLTSSL (Post-Vocational); 482 and 186 CSOL (Core Skills / Direct Entry). Streams without a list (482 Specialist Skills, labour agreements, 186 TRT, 485 Post-Higher Education) are not covered by this filter; the result says so.",
                "type": "string"
              }
            },
            "type": "object"
          },
