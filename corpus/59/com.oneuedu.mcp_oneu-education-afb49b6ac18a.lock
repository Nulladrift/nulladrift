      "instructions": "get_course defaults to core. Select explicit sections for fees, requirements, intakes or campuses; use get_course_pathways, get_course_packages and get_similar_courses for associated data. Exact course codes need no prior search. Page through every semantic page for a complete list; carry contentVersion unchanged. Narrow with actual sections, fee years/audience, requirement topics or collection filters. A truncated direct result is not a complete reading: re-query narrowly, or use existing Code Mode to query again and project necessary facts together with sources, dates, exceptions and partial/unknown. Do not assume previous structured results become Code Mode variables. If the smallest unit cannot be read, the reading is incomplete. Course links supplement data, not proof of full retrieval.\nInternal occupation identities used by the tools differ from displayed ANZSCO codes. Select explicit occupation sections or individual topic tools. Applicability never establishes personal eligibility; results mark unknown, no_data and error states and include sources.\nRead explicit relevant sections. programRules requires the exact returned program and visaSubclass. Results include full conditions and sources; employer location is not DAMA coverage.\nResults keep official text and translations separate and include source dates and links. Visa cases and historical grant rates do not establish individual eligibility. The student visa query supplies its decision period, source, snapshot and sample status.\nRPL qualifications and scheduled short courses are separate records. Published information does not establish eligibility or seats; results include residency-specific fees and extra conditions.\nResults include source URLs and snapshot dates. Registration and regulatory decisions do not establish individual eligibility.\nPreserve leading zeroes. Unknown region is not non-regional. Address associations do not rank distance or establish open campuses.\nSearch the same latest at most 200 open jobs as the website. Counts are limited to that window. Get details for public job information and aggregate progress only; applications stay on the website.\nlist_advisors returns public contact links for the user to choose from.\nPartner service pricing is independent of the public information toolkit. get_agent_pricing requires the partner unlockCode provided by the user; never guess a code.\nAll returned public information is compiled by One U Education. Results include a source attribution and a page url on oneuedu.com. Migration information is not individual migration advice.\nFor private planning, save supported facts progressively, use get_planning_schema_index to discover unfamiliar shapes and get_planning_schema_definition to batch published references in schema_refs, reuse returned definitions and included components at the same schema name/version, and use backend gaps when needed to decide what is still missing. Do not automatically fetch questions after every successful save; use paged reading for explanations and disclose unread pages instead of rebuilding raw result graphs.\nFeedback: submit_feedback creates reports or appends to an owned signed-in report using feedback_id. list_my_feedback and get_my_feedback read only the current account’s signed-in tickets and public discussion. Anonymous reports remain one-way. Feedback never edits official data. Signed-in account connections can submit without additional permission. Preserve claims, known context and unknown details; a receipt means received only.",
      "tools": [
        {
          "name": "create_planning_calculation",
          "title": "Submit an asynchronous planning calculation",
          "description": "Start a migration planning calculation for a saved dossier. The calculation runs asynchronously: an accepted request returns a calculation_id immediately and the result is saved to the account. Only mode=ordinary is available; saved results from other modes stay readable. expected_revision must equal the dossier’s current revision. calculation_scope selects a fixed configuration: existing_189 covers current 189 routes without automatic preparation strategies; future covers wider planning. A full plan usually runs existing_189 first and continues with future when no 189 route has a conditional PR date or the user asks for more options. To continue, submit future with continuation_of set to the first calculation_id, the same revision and mode, and a new request_id; the service checks ownership, versions and a one-continuation limit and returns an error on mismatch. request_id is the idempotency key: retrying with the same value returns the same calculation, and list_planning_calculations finds it by request_id after a timeout. If required facts are missing it returns 422 needs_information with the missing items and schema references, and no calculation is created. Undecided preferences limit only the directions that depend on them; results report these as scope_gaps. parent_calculation_id and comparison must refer to this account’s calculations. Accepted calculations are subject to the account’s calculation quota. Use get_planning_calculation to check progress and read results. Requires the authenticated One U Education account and declared planning scope; credentials and user identity are never tool arguments.",
