        {
          "name": "get_agent_pricing",
          "title": "Get One U Education partner agent pricing",
          "description": "One U Education's service price list for partner agents (the oneuedu.com agent pricing page): visa applications, school applications, short courses (White Card, forklift, EWP, first aid and more) and other services, each with its description. With the partner unlock code it adds, per product, the retail price (suggested price to the client), the agent settlement price (what the agent pays One U Education) and the agent profit; without the code prices stay hidden, as on the page. Prices are service fees only: government and other third-party fees are extra. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "visa (visa applications), school (school applications), course (short courses such as White Card, forklift, first aid) or extra (other services).",
                "enum": ["visa", "school", "course", "extra"],
                "type": "string"
              },
              "locale": {
                "default": "zh-CN",
                "description": "Language of names/descriptions in the result: zh-CN (default, Simplified Chinese plus English names), en-US, zh-TW. Also selects the language prefix of returned oneuedu.com URLs.",
                "enum": ["zh-CN", "en-US", "zh-TW"],
                "type": "string"
              },
              "query": {
                "description": "Words to match in the product name or description, in the result language (e.g. \"482\", \"白卡\", \"forklift\").",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "unlockCode": {
                "description": "Configured partner unlock code (including email-shaped codes), the same one the page asks for. Trim outer whitespace; preserve case and internal characters. Must be non-empty, at most 256 UTF-8 bytes, and contain no internal CR/LF. Pass it only when the user gave it to you in this conversation; never guess one. Without it, products are listed with prices hidden.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get One U Education partner agent pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cab4d4aab0175fea340b96a4303a783f80b6b2100021274625b8db7c2195d8b1"
        },
