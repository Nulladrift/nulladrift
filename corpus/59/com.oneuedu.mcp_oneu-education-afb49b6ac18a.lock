          "description": "Prepare a short-lived, single-file upload capability for each local feedback attachment. Requires an account connection plus client-side local file and HTTP PUT access. Returns explicit text upload instructions, a curl example and exact JSON upload parameters. Upload original bytes directly to the returned CRM upload_url with X-Upload-Token, then use ready IDs with submit_feedback. Maximum 10 files, 20 MiB per file and 50 MiB combined per feedback including later additions. Do not put bytes or Base64 in MCP arguments. Reuse request_id for retries; never log upload tokens. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
