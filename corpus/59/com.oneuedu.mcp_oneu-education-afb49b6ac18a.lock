          "description": "Occupation-level visa applicability, separately by visa stream, list statuses, and for subclass 482 whether the IMMI 18/039 mandatory skills assessment applies: required passports, assessing authority, accepted assessment type, timing, exemptions and legal source. Optional passportCountry answers it for one passport. Includes negative and unknown results. Optional visaSubclass filters the options; omitting it returns all. Does not establish personal eligibility. Fees and processing times have separate tools. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
