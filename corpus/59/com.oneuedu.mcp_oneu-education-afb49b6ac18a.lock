        {
          "name": "get_student_visa_grant_rates",
          "title": "Get Australian student visa grant rates",
          "description": "Query published Australian student visa grant and refusal decisions (BP0015) with optional filters, monthly results and a breakdown. Results include the official source, period, snapshot and sample notices. Grant rates are aggregate historical statistics for the selected group and do not indicate any individual applicant’s chance of a grant. No rate is given when there are fewer than 30 decisions; 30–99 decisions are flagged as a small sample. This public endpoint returns English natural-language text, preserving sources, conditions and pagination.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Age group, such as 20 to 24 years or 20-24.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "applicantType": {
                "description": "Applicant type, Primary or Secondary.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "breakdown_by": {
                "description": "Optional grouping dimension. The total and monthly series still use all requested filters.",
                "enum": ["country", "sector", "location", "state", "applicantType", "age"],
                "type": "string"
              },
              "country": {
                "description": "Country of citizenship. Use an official name, a Chinese or English alias, or an ISO3 code.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "fy": {
                "description": "Starting year of the Australian financial year. For example, 2025 means July 2025 to June 2026. Use fy or months.",
                "maximum": 9998,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Applicant location, In Australia (onshore) or Outside Australia (offshore).",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "months": {
                "description": "Number of months ending at the snapshot’s latest decision month. Defaults to 12 when fy is absent.",
                "minimum": 1,
                "type": "integer"
              },
              "sector": {
                "description": "Education sector. Use an official name, a slug or a common short name, such as Higher Education, VET, ELICOS or Schools.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "snapshotId": {
                "description": "Optional previously published snapshot ID. Omit for the current snapshot.",
                "maxLength": 255,
                "minLength": 1,
                "pattern": "^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$",
                "type": "string"
              },
              "state": {
                "description": "Education provider’s registered state or territory, as an abbreviation such as VIC or a full name such as Victoria.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
