{
  "lockfileVersion": 2,
  "subjects": {
    "com.besttimetobookhotels/booking-timing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.besttimetobookhotels.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mcp-typescript server on vercel",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_reviewed_hotels",
          "title": "Find reviewed hotels",
          "description": "Find hotels that have editorial reviews. Filter by city and minimum overall grade; optionally rank by one category (location, rooms, service, dining, facilities, value).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Rank results by this category's grade",
                "enum": ["location", "rooms", "service", "dining", "facilities", "value"],
                "type": "string"
              },
              "city": {
                "description": "Only hotels in this city, e.g. 'Istanbul'",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Max results to return (default 10)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_grade": {
                "description": "Minimum overall grade, e.g. 'B+'",
                "enum": ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "F+", "F", "F-"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc1de6b10510288c2ea3227f1d0f34624d6c006a8bf6585f458eb8a4000183ec"
        },
        {
          "name": "get_booking_advice",
          "title": "Best time to book advice",
          "description": "Get a data-backed verdict on whether to book a hotel now or wait, for a city and stay dates. Based on tracked daily median prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkIn": {
                "description": "Check-in date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "city": {
                "description": "City name, e.g. 'Lisbon'",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:970a2064d92726e263d639435ceaaa5c8ad6c8e056a7fd9ffa2d80d4f4a64299"
        },
        {
          "name": "get_city_calendar",
          "title": "City price calendar",
          "description": "Hot dates (events and holidays that push hotel prices up) and value windows (historically cheaper stretches) for a city in a date range.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. 'Lisbon'",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "from": {
                "description": "Range start, YYYY-MM-DD (default: today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "Range end, YYYY-MM-DD (default: one year from today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66eedc9c50821d9811c5c9987132d2244b4fd203443afca1afd82c28ef5af9fa"
        },
        {
          "name": "get_hotel_review",
          "title": "Hotel review digest",
          "description": "Editorial review of a specific hotel: overall letter grade, who it suits and who it doesn't, a six-category breakdown (location, rooms, service, dining, facilities, value), and a verdict. ~350 hotels covered; available in 19 languages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Optional city name to narrow the match",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "hotel": {
                "description": "Hotel name or slug, e.g. 'Artelist Hotel' or 'artelist-hotel-istanbul'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "description": "Language for the review text (default: en)",
                "enum": ["en", "de", "ru", "fr", "es", "it", "uz", "tr", "ar", "zh", "pt", "id", "ja", "ko", "th", "pl", "hi", "nl", "vi"],
                "type": "string"
              }
            },
            "required": ["hotel"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f5e0319e6365291c38b7a296f0c607c0865d3dffa77646dede1a42472ba35f1"
        },
        {
          "name": "get_last_minute_deals",
          "title": "Last-minute hotel deals",
          "description": "Current last-minute hotel deals in a city: live rates below each hotel's tracked typical price, plus hotels that historically drop prices close to check-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. 'Lisbon'",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:398c9d7519ae563ae264cadd0d5ab4ca8b9991007f890290947e379a35f6a49f"
        },
        {
          "name": "list_cities",
          "title": "List covered cities",
          "description": "List the cities with hotel booking-timing data on Best Time to Book Hotels. Optionally filter by a search string. Call this first to learn coverage.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "search": {
                "description": "Optional filter matched against city and country names",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:368a5c105c852632b92625a0c043d9049ddae534377d3dbd3872eab69a8dfaea"
        }
      ],
      "digest": "sha256:d43e32c072024f1a6caded9cb01f48e8d7df1513bf27cf3be9cbd8fd8a1ced2c"
    }
  }
}
