        {
          "name": "find_email",
          "title": "Find one email",
          "description": "Use this when the user wants a specific person's work email address at a company: to contact, reach out to, cold-email or follow up with them, or to fill in a missing email on a lead. Needs the person's first and last name and the company's website domain, or the company's LinkedIn page when the domain is unknown. Returns the address with a status: verified (the mail server accepted that mailbox), catch_all, predicted or not_found. Do not use for personal addresses such as Gmail, for phone numbers, or for someone with no company. Costs 1 credit only when the result is verified. Misses, catch-alls, and cached repeats are free and still return at 0 credits. A billable result fails at 0 balance with an insufficient_credits error. This stores the lookup. It does not delete or modify the person's data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company_domain": {
                "description": "Company website domain, such as example.com. Optional when company_linkedin_url is set.",
                "maxLength": 300,
                "type": "string"
              },
              "company_linkedin_url": {
                "anyOf": [
                  {
                    "format": "uri",
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "const": "",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The company's LinkedIn page. Resolved to a domain only when company_domain is empty. Costs 1 credit only when a domain is found."
              },
              "company_name": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Company display name. Optional."
              },
              "first_name": {
                "description": "Given name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "last_name": {
                "description": "Family name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["first_name", "last_name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "company_domain": {
                "type": "string"
              },
              "confidence": {
                "description": "0 to 1.",
                "type": "number"
              },
              "confidence_label": {
                "type": "string"
              },
              "credits_remaining": {
                "type": ["number", "null"]
              },
              "credits_used": {
                "description": "Credits this call spent. 0 for a free outcome.",
                "type": "number"
              },
              "email": {
                "description": "The address found, or null when there is none to return.",
                "type": ["string", "null"]
              },
              "first_name": {
                "type": "string"
              },
              "last_name": {
                "type": "string"
              },
              "needs_verification": {
                "description": "True when the address could not be confirmed, for example on a catch-all domain.",
                "type": "boolean"
              },
              "status": {
                "description": "Outcome of the lookup: verified, catch_all, predicted, not_found, insufficient_evidence, invalid_input or error. Only verified is a confirmed mailbox.",
                "type": "string"
              },
              "verified_at": {
                "type": ["string", "null"]
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find one email"
