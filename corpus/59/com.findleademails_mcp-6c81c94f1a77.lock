        },
        {
          "name": "find_email",
          "title": "Find one email",
          "description": "Find and verify one person's work email from their name and company domain, or from a LinkedIn company page URL when you do not have the domain. Costs 1 credit only when the result is verified. Misses, catch-alls, and cached repeats are free and still return at 0 credits. A billable result fails at 0 balance; the error includes https://www.findleademails.com/pricing. This stores the lookup. It does not delete or modify the person's data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company_domain": {
                "description": "Company website domain, such as example.com. Optional when company_linkedin_url is set.",
                "maxLength": 300,
                "type": "string"
              },
              "company_linkedin_url": {
                "anyOf": [
                  {
                    "format": "uri",
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "const": "",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The company's LinkedIn page. Resolved to a domain only when company_domain is empty. Costs 1 credit only when a domain is found."
              },
              "company_name": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Company display name. Optional."
              },
              "first_name": {
                "description": "Given name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "last_name": {
                "description": "Family name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["first_name", "last_name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "company_domain": {
                "type": "string"
              },
              "confidence": {
                "description": "0 to 1.",
                "type": "number"
              },
              "confidence_label": {
                "type": "string"
              },
              "credits_remaining": {
                "type": ["number", "null"]
              },
              "credits_used": {
                "description": "Credits this call spent. 0 for a free outcome.",
                "type": "number"
              },
              "email": {
                "description": "The address found, or null when there is none to return.",
                "type": ["string", "null"]
              },
              "first_name": {
                "type": "string"
              },
              "last_name": {
                "type": "string"
              },
              "needs_verification": {
                "description": "True when the address could not be confirmed, for example on a catch-all domain.",
                "type": "boolean"
              },
              "status": {
                "description": "Outcome of the lookup: verified, catch_all, predicted, not_found, insufficient_evidence, invalid_input or error. Only verified is a confirmed mailbox.",
                "type": "string"
              },
              "verified_at": {
                "type": ["string", "null"]
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find one email"
