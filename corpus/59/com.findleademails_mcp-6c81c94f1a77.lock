      },
      "instructions": "FindLeadEmails finds and verifies B2B work emails. find_email and find_emails_bulk take a name and company domain. verify_email checks an address. create_job queues a large list; poll get_job_status and page get_job_results. Free outcomes (catch-all, miss, cached repeat) cost nothing. A billable lookup costs 1 credit and fails at 0 balance. Buy credits at https://www.findleademails.com/pricing. Tool calls need a credential: sign in with OAuth, or send Authorization: Bearer <API key>. Listing tools does not.",
      "tools": [
        {
          "name": "create_job",
          "title": "Create an async bulk job",
          "description": "Queue a large list and return a job id. Reserves one credit per row up front and refunds what rows do not use. If the wallet cannot cover every row, the job is refused up front (no partial queue) with insufficient_credits and https://www.findleademails.com/pricing. Poll get_job_status, then page get_job_results. Each call creates a new job.",
