        {
          "name": "find_emails_bulk",
          "title": "Find emails in bulk",
          "description": "Use this when the user has a list of up to 100 people with their companies and wants work emails for all of them, for example a prospect list, event attendees, or a CRM export missing emails. Each record needs a first name, last name and company domain (or the company's LinkedIn page). Returns one row per person with its status, then summary totals. For more than 100 people use create_job. Tell the user how many rows you will look up before calling. 1 credit per verified result. Free outcomes still return at 0 credits. Rows run until a billable result cannot be paid for; later rows are skipped with insufficient_credits. This stores the lookups. It does not delete data.",
          "inputSchema": {
