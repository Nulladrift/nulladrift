      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "FindLeadEmails finds and verifies B2B work emails. find_email and find_emails_bulk take a name and company domain. verify_email checks an address. create_job queues a large list; poll get_job_status and page get_job_results. Free outcomes (catch-all, miss, cached repeat) cost nothing. A billable lookup costs 1 credit and fails at 0 balance. Plans: https://www.findleademails.com/pricing. Tool calls need a signed-in FindLeadEmails account (OAuth). Listing tools does not.",
      "tools": [
        {
          "name": "create_job",
          "title": "Create an async bulk job",
          "description": "Queue a large list and return a job id. Reserves one credit per row up front and refunds what rows do not use. If the wallet cannot cover every row, the job is refused up front (no partial queue) with insufficient_credits and https://www.findleademails.com/pricing. Poll get_job_status, then page get_job_results. Each call creates a new job.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "callback_url": {
                "anyOf": [
                  {
                    "format": "uri",
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "const": "",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional HTTPS URL notified when the job finishes."
              },
              "name": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional label for the job."
              },
              "records": {
                "description": "People to look up. Each record uses the same fields as find_email.",
                "items": {
                  "properties": {
                    "company_domain": {
                      "description": "Company website domain, such as example.com. Optional when company_linkedin_url is set.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "company_linkedin_url": {
                      "anyOf": [
                        {
                          "format": "uri",
                          "maxLength": 500,
                          "type": "string"
                        },
                        {
                          "const": "",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The company's LinkedIn page. Resolved to a domain only when company_domain is empty. Costs 1 credit only when a domain is found."
                    },
                    "company_name": {
                      "anyOf": [
                        {
                          "maxLength": 200,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Company display name. Optional."
                    },
                    "first_name": {
                      "description": "Given name.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "last_name": {
                      "description": "Family name.",
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["first_name", "last_name"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["records"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "catch_all_items": {
                "type": "number"
              },
              "credits_reserved": {
                "type": "number"
              },
              "credits_spent": {
                "type": "number"
              },
              "failed_items": {
                "type": "number"
              },
              "id": {
                "description": "Job id. Pass it to get_job_status and get_job_results.",
                "type": "string"
              },
              "name": {
                "type": ["string", "null"]
              },
              "not_found_items": {
                "type": "number"
              },
              "predicted_items": {
                "type": "number"
              },
              "processed_items": {
                "type": "number"
              },
              "status": {
                "description": "queued, processing, completed, partial, failed or canceled.",
                "type": "string"
              },
              "total_items": {
                "type": "number"
              },
              "verified_items": {
                "type": "number"
              }
            },
            "required": ["id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an async bulk job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
