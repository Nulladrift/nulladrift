            },
            "required": ["records"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "results": {
                "description": "One row per input record, in the order given.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "company_domain": {
                      "type": "string"
                    },
                    "confidence": {
                      "description": "0 to 1.",
                      "type": "number"
                    },
                    "confidence_label": {
                      "type": "string"
                    },
                    "email": {
                      "description": "The address found, or null when there is none to return.",
                      "type": ["string", "null"]
                    },
                    "first_name": {
                      "type": "string"
                    },
                    "last_name": {
                      "type": "string"
                    },
                    "needs_verification": {
                      "description": "True when the address could not be confirmed, for example on a catch-all domain.",
