                  "required": ["first_name", "last_name"],
                  "type": "object"
                },
                "maxItems": 10000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["records"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "results": {
                "description": "One row per input record, in the order given.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "company_domain": {
                      "type": "string"
                    },
                    "confidence": {
                      "description": "0 to 1.",
                      "type": "number"
                    },
                    "confidence_label": {
                      "type": "string"
                    },
                    "email": {
                      "description": "The address found, or null when there is none to return.",
                      "type": ["string", "null"]
                    },
                    "first_name": {
                      "type": "string"
                    },
                    "last_name": {
                      "type": "string"
                    },
                    "needs_verification": {
                      "description": "True when the address could not be confirmed, for example on a catch-all domain.",
                      "type": "boolean"
                    },
                    "status": {
                      "description": "verified, catch_all, predicted, not_found, insufficient_evidence, invalid_input or error, or skipped when the row was not looked up.",
                      "type": "string"
                    },
                    "verified_at": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["status"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "additionalProperties": {},
                "properties": {
                  "catch_all": {
                    "type": "number"
                  },
                  "credits_remaining": {
                    "type": ["number", "null"]
                  },
                  "credits_used": {
                    "description": "Credits this call spent. 0 for a free outcome.",
                    "type": "number"
                  },
                  "skipped": {
                    "type": "number"
                  },
                  "total": {
                    "type": "number"
                  },
                  "verified": {
                    "type": "number"
                  }
                },
                "required": ["catch_all", "skipped", "total", "verified"],
                "type": "object"
              }
            },
            "required": ["results", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find emails in bulk"
          },
          "behavior": {
            "destructive": false,
