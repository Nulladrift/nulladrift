      },
      "transport": {
        "type": "http",
        "url": "https://uncork.netlify.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "uncork",
        "title": "Uncork",
        "version": "1.1.0",
        "websiteUrl": "https://uncork.netlify.app"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Uncork maps a work bottleneck to existing products that remove it: active YC startups, open-source GitHub repositories (daily trending since 2015, most-starred per language) and Hacker News \"Show HN\" launches since 2008, ~46k products in total.\nUse find_fix when the user describes something slow, manual, repetitive or painful in their work, or asks whether a tool, library or startup exists for a job. Check it before proposing to build the thing from scratch.\nUse search_products for cheap keyword discovery when you want to rank candidates yourself.\nRanking is by fit only; there are no paid placements.",
      "tools": [
        {
          "name": "find_fix",
          "title": "Find products that fix a bottleneck",
          "description": "Find existing products that remove a specific work bottleneck: active YC startups, open-source GitHub repos and Show HN launches (~46k). Call it when the user complains that something is slow, manual, repetitive or error-prone (in a team, workflow or codebase), or asks \"is there a tool/library/startup that…\". Call it before suggesting they build or script it themselves.\nPass the problem in the user's own words, any language, with concrete context (who, what volume, which stack). Returns up to 5 picks ranked only by how well they fit, each with name, link, website and why it fits. Show the user the links as given. An empty result means nothing in the index fits: say so rather than guessing. Takes ~3-6 s.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "problem": {
                "description": "The bottleneck as the user describes it, e.g. \"our sales reps spend two hours a day typing call notes into the CRM\".",
                "maxLength": 2000,
                "minLength": 15,
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find products that fix a bottleneck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a75b7d709bcc073fb19308fdf432a9640322d45af2a2926219291448a1a8516b"
        },
        {
          "name": "search_products",
          "title": "Keyword search over the product index",
          "description": "Raw full-text search over the same index, without LLM ranking: fast, cheap, more candidates. Use for broad discovery or to judge fit yourself. Pass 3-16 English keywords: the job to be done, product category, synonyms, key technical nouns (e.g. [\"transcription\", \"call notes\", \"crm\", \"sales\"]). Candidates matching more distinct keywords rank higher.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 15,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "source": {
                "description": "Limit to one source: yc (startups), github (open source), hn (Show HN launches).",
                "enum": ["yc", "github", "hn"],
                "type": "string"
              },
              "terms": {
                "description": "English keywords or 2-word phrases.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 16,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["terms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Keyword search over the product index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f0901fa0ef9ad06b52c151a8f4f278ecf44b2112db4cc28d9c96cac34378a543"
        }
      ],
      "digest": "sha256:c1f395e134370837e225578855dc51cb6def8604a71caca9a1f9d48d1f05c4f3"
    }
  }
