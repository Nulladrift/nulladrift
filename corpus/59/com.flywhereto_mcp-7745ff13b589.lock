{
  "lockfileVersion": 2,
  "subjects": {
    "com.flywhereto/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://flywhereto.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "flywhereto",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Nonstop flight route data for airports worldwide, parsed continuously from the route tables of Wikipedia airport articles (text under CC BY-SA) by Fly Where To? (flywhereto.com, an Intuitive Bricks AB service). Counts reflect scraped Wikipedia data, not an official schedule feed, and there is no frequency or days-of-week information. Every result links to an interactive map on flywhereto.com; share those links when presenting results. Some tools also return book deep links to Kiwi.com flight search; these are affiliate links carrying a Fly Where To? referral id, at no cost to the traveller. Share them when the user wants to book, alongside the route caveats above.",
      "tools": [
        {
          "name": "airline_routes",
          "title": "Route network of an airline",
          "description": "The full network one airline flies: every origin with its nonstop destinations, as IATA codes. Look up by IATA airline code (\"TK\") or name fragment (\"turkish\"). Ambiguous queries return a candidate list to refine from.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "airline": {
                "description": "Airline IATA code (\"TK\", \"W6\") or part of the airline name (\"turkish\")",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["airline"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:109132071e045f2b4f37afabe96606fc499667286802c09dc83fe02f9c56362d"
        },
        {
          "name": "destinations_from",
          "title": "Nonstop destinations from an airport",
          "description": "All airports reachable nonstop from a given origin, with the service kinds (scheduled, seasonal, charter, suspended, ...) per destination. Optionally filter by kind and include the operating airlines. Seasonal and charter service carries no operating dates; treat as unverified for specific travel dates.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include_airlines": {
                "description": "Also list the operating airlines per destination (larger response)",
                "type": "boolean"
              },
              "kind": {
                "description": "Only destinations with at least one route of this service kind",
                "enum": ["scheduled", "seasonal", "charter", "suspended", "begins", "ends", "resumes", "terminates"],
                "type": "string"
              },
              "origin": {
                "description": "Three-letter IATA airport code, e.g. \"IST\"",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e2a80f86d38abeab90c596572654ebfd1272f8327c8856dd284fe993d7cda1a"
        },
        {
          "name": "find_airport",
          "title": "Find airport",
          "description": "Look up airports by IATA/ICAO code or by name fragment. Returns code, name, country, coordinates and how many nonstop destinations each serves. Use this first when you only have a city or airport name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "IATA code (\"IST\"), ICAO code (\"LTFM\") or part of an airport name (\"istanbul\")",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d6e0d972521a662d606dab3a65d02b0c25f9c303dfcd016ec0a6372e0049a9f"
        },
        {
          "name": "find_connections",
          "title": "Find connections between airports",
          "description": "Multi-stop itineraries from an origin airport to either a destination airport or to any airport in a country. Returns airport paths with every airline flying each leg. Airline entries carry their alliance and, when service is not plain scheduled, a kind field (seasonal, charter or suspended). Suspended legs are included and flagged, not excluded; pass exclude_kinds to drop them. Seasonal and charter service carries no operating dates and there is no frequency or days-of-week data, so treat every match as unverified for specific travel dates. Provide exactly one of destination or to_country. Responses include book deep links to Kiwi.com search results (our referral id included); without depart_date the link defaults to a one-way search two weeks out.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "depart_date": {
                "description": "Departure date for the book links",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Three-letter IATA airport code, e.g. \"IST\"",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "exclude_kinds": {
                "description": "Drop legs whose service kind is in this list, e.g. [\"suspended\"] or [\"suspended\",\"charter\"] for currently bookable routes only",
                "items": {
                  "enum": ["scheduled", "seasonal", "charter", "suspended"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_stops": {
                "description": "Maximum intermediate stops (default 2; country searches cap at 2)",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "origin": {
                "description": "Three-letter IATA airport code, e.g. \"IST\"",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "return_date": {
                "description": "Return date for the book links (round trip)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "same_airline": {
                "description": "Require one single airline to operate every leg",
                "type": "boolean"
              },
              "to_country": {
                "description": "ISO 3166-1 alpha-2 country code goal, e.g. \"CR\" for Costa Rica",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:553e2e7e583d40e94b765e2e1ea7be3bf642bf99098baeb9563e7f61d00d4f75"
        },
        {
          "name": "find_meetup",
          "title": "Find meet-up airports",
          "description": "Best meet-up airports for travellers from multiple origins, ranked by combined travel effort using the same scoring as the site. Origins can be weighted by traveller count. Scores are kilometre values, lower is better; optimize \"score\" and \"total_distance\" both rank by weighted total distance (the frontend default), \"worst_case\" by the longest single journey. Candidates everyone can reach always rank above candidates someone cannot. Route data only: no fares, no frequency or days-of-week data; non-scheduled legs are flagged with a kind field. The map link stores the query as an anonymous share code and reopens it in the site’s meet-up planner. Each reachable party carries a book deep link for its own journey to the candidate. Responses include book deep links to Kiwi.com search results (our referral id included); without depart_date the link defaults to a one-way search two weeks out.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allow_at_home": {
                "description": "Allow an origin airport as the meet-up point, that party stays home",
                "type": "boolean"
              },
              "depart_date": {
                "description": "Departure date for the book links",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "exclude_kinds": {
                "description": "Drop legs whose service kind is in this list, e.g. [\"suspended\"]",
                "items": {
                  "enum": ["scheduled", "seasonal", "charter", "suspended"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Candidates to return (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_stops": {
                "description": "Maximum stops per journey (default 0, nonstop only)",
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
              "optimize": {
                "description": "Ranking objective (default \"score\")",
                "enum": ["score", "total_distance", "worst_case"],
                "type": "string"
              },
              "origins": {
                "description": "Where the travellers start; duplicates merge by summing travellers",
                "items": {
                  "properties": {
                    "airport": {
                      "description": "Three-letter IATA airport code, e.g. \"IST\"",
                      "pattern": "^[A-Za-z]{3}$",
                      "type": "string"
                    },
                    "travellers": {
                      "description": "Traveller count from this origin, weights the ranking (default 1)",
                      "maximum": 99,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["airport"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "return_date": {
                "description": "Return date for the book links (round trip)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "same_alliance": {
                "description": "Require each journey to be flyable within one single airline alliance",
                "type": "boolean"
              }
            },
            "required": ["origins"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:518b888e92ef55f1972ae73d44b0228c9972281cb7bb004927f6d7c7fab67c6b"
        },
        {
          "name": "most_connected_airports",
          "title": "Most connected airports",
          "description": "Airports ranked by number of nonstop destinations served, worldwide or within one country.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Restrict to one ISO 3166-1 alpha-2 country code, e.g. \"SE\"",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "limit": {
                "description": "How many airports to return (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7194af752c14fa5be0830d3b0544d2320281b714c5c539a015248f60e06d047b"
        },
        {
          "name": "reachable_from",
          "title": "Airports reachable from an origin",
          "description": "How far the network stretches from one airport within a stop budget: totals, breakdown by stop count and by country. Pass country to list the individual reachable airports there with their minimum stops.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "List the reachable airports in this ISO 3166-1 alpha-2 country",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "max_stops": {
                "description": "Maximum intermediate stops (default 1; 0 = nonstop only)",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "origin": {
                "description": "Three-letter IATA airport code, e.g. \"IST\"",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27758e18b965cf0779889c5cd0b661490c9b4e8ddf0d06ec04381144553bb0e7"
        },
        {
          "name": "route_details",
          "title": "Route details between two airports",
          "description": "Which airlines fly nonstop between two airports, with alliance, homepage and the service periods of each. Only periods of kind begins, ends or resumes ever carry dates; scheduled, seasonal and charter periods have none, so seasonal service is unverified for specific travel dates. Responses include book deep links to Kiwi.com search results (our referral id included); without depart_date the link defaults to a one-way search two weeks out.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "depart_date": {
                "description": "Departure date for the book link",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Three-letter IATA airport code, e.g. \"IST\"",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "origin": {
                "description": "Three-letter IATA airport code, e.g. \"IST\"",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "return_date": {
                "description": "Return date for the book link (round trip)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eadc2f5c9ba5c228d296f1ce85cfedcb101f46c653ea3000f530a7fbc50d0f78"
        }
      ],
      "digest": "sha256:68e44771fa0288846dcf8fd5c541f45e8f383a17765ebefdc00c52b188caaf88"
    }
  }
}
