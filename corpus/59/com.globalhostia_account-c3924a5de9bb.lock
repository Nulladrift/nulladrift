      "serverInfo": {
        "name": "globalhostia",
        "title": "GlobalHostia",
        "version": "2.0.0",
        "description": "Manage your GlobalHostia hosting, servers, domains, DNS, email, SSL, invoices and support tickets.",
        "websiteUrl": "https://globalhostia.com/connectors",
        "icons": [
          {
            "src": "https://globalhostia.com/connectors/globalhostia-icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://globalhostia.com/connectors/globalhostia-512.png",
