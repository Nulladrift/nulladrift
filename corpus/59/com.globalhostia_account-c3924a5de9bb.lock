        {
          "name": "create_storage_bucket",
          "title": "Create a storage bucket",
          "description": "Create a private bucket in a region of an Object Storage service (the region is turned on first if needed). Bucket names are shared by all customers, so a taken name fails; suggest another.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bucket": {
                "description": "Bucket name (3-63 lowercase letters, digits, dots, hyphens).",
                "pattern": "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$",
                "type": "string"
