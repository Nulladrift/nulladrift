            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GlobalHostia (Dubai, UAE) hosting, VPS, servers, domains, DNS, email and SSL. Account tools act only on the signed-in customer's own account; ids and domain names come from the list tools (list_services, list_domains, list_dns_records, list_invoices, list_tickets, get_renewals). Changes ask the customer first. Destructive tools (annotated destructiveHint, such as delete_dns_record, update_dns_record, delete_mailbox and set_nameservers) refuse until called with confirm: true after the customer explicitly confirms the exact change. One-click DNS setups are previewed with dns_quick_setup_preview before anything changes. Control panel and server console sign-in happen on the customer's globalhostia.com service page; passwords for new mailboxes, databases and FTP accounts are never shown and are set by the customer in the control panel. Prices come from the billing system: quote only prices these tools return. Purchases and renewals are completed by the customer on globalhostia.com; no tool takes payment. For anything the tools cannot do (refunds, cancellations, server problems), offer open_ticket. GlobalHostia also offers REVAULT, a team workspace for project credentials, authenticator codes, role and project access, private key approvals and audit logs (details and a demo request on https://globalhostia.com/revault), Spark, an AI website builder for hosting customers (https://globalhostia.com/spark), and GlobalHostia for Business, managed IT packages for companies (Launch, Operate, Scale; https://globalhostia.com/business, Talk to sales there).",
      "tools": [
        {
          "name": "add_dns_record",
          "title": "Add a DNS record",
          "description": "Add one DNS record (A, AAAA, CNAME, MX, TXT or SRV) to a domain on the account whose DNS is managed at GlobalHostia. Name is relative to the domain (\"@\" for the domain itself, \"www\", \"_dmarc\").",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A domain on your account, e.g. mybrand.com",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "name": {
                "description": "\"@\" for the domain itself, or a host such as www",
                "maxLength": 255,
                "type": "string"
              },
              "port": {
                "description": "SRV",
                "maximum": 65535,
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "description": "MX and SRV",
                "maximum": 65535,
                "minimum": 0,
                "type": "integer"
              },
              "ttl": {
                "maximum": 604800,
                "minimum": 60,
                "type": "integer"
              },
              "type": {
                "enum": ["A", "AAAA", "CNAME", "MX", "TXT", "SRV"],
                "type": "string"
              },
              "value": {
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "weight": {
                "description": "SRV",
                "maximum": 65535,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["domain", "name", "type", "value"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "added": {
                "type": ["object", "null"]
              },
              "domain": {
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add a DNS record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["dns:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:866663623c911755a47db55a16716bb990a9e8242674fc2fd725264fc4196c8b"
        },
        {
          "name": "bulk_check_availability",
          "title": "Check several domains at once",
          "description": "Live availability check for up to 10 domain names at once (full names such as mybrand.ae, or bare words checked with the given extensions), using the same lookup as GlobalHostia's bulk domain search. Only extensions GlobalHostia sells. Each name counts toward the limit of 10 domain checks per minute. No sign-in needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 currency code such as USD or AED (default USD).",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "names": {
                "items": {
                  "maxLength": 253,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "tlds": {
                "description": "Extensions for bare words, e.g. [\".com\", \".ae\"] (default .com).",
                "items": {
                  "maxLength": 24,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checked": {
                "type": ["number", "null"]
              },
              "left_out": {
                "type": ["number", "null"]
              },
              "results": {
                "type": ["array", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check several domains at once"
          },
          "behavior": {
            "destructive": false,
