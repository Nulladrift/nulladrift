                "type": "string"
              },
              "confirm": {
                "const": true,
                "description": "Must be true. Set it only after the customer has explicitly confirmed this exact change.",
                "type": "boolean"
              },
              "dest_prefix": {
                "description": "Folder to unpack into, e.g. \"Design_System/files/\". Default: next to the zip, named after it.",
                "maxLength": 500,
                "type": "string"
              },
              "key": {
                "description": "Path of the .zip in the bucket.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Region code from storage_plans or storage_overview, e.g. fra (Frankfurt), usa (Virginia), sgp (Singapore).",
                "pattern": "^[a-z0-9-]{2,12}$",
                "type": "string"
              },
              "service_id": {
                "description": "Object Storage service id, as returned by the matching list tool.",
                "minimum": 1,
                "type": "integer"
              },
              "start": {
                "description": "Entry number to continue from (the previous result's next_start). Default 0.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["bucket", "key", "region", "service_id"],
