      "serverInfo": {
        "name": "proxycove",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ProxyCove — proxy service (residential / mobile / datacenter, pay per GB, no registration needed).\nTypical flow for a new user:\n1. create_account → returns an API key (pc_live_...). Tell the human to SAVE it; add it to this connector's Authorization header (\"Bearer pc_live_...\") for future sessions.\n2. Paying. Two ways, pick whichever you can do:\n   - You hold a machine payment credential (MPP / Shared Payment Token) → pay yourself: POST {\"amount_usd\": N} to https://mcp.proxycove.com/pay with your Authorization header, answer the HTTP 402 challenge. No human needed. See pay_from_agent_wallet.\n   - You do not → create_topup returns payment_url. Give the link to the human; they pay in the browser (SBP / bank card / crypto). NEVER ask for card details yourself.\n3. Poll get_payment_status until \"paid\", then buy_proxy. Connection credentials come back immediately.\nPrices: get_pricing. Traffic is prepaid per GB and never expires while the account is active.",
      "tools": [
        {
          "name": "attach_recovery",
          "title": "Attach recovery email",
          "description": "Attaches an email to the account so the human can log in on proxycove.com (via \"Forgot password\") and never lose the balance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Human's email",
                "format": "email",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:09ad50cc43c7ce42638f97c6f21a580bab8ea43a2ed4e1e218e3de5c9e20cb60"
        },
        {
          "name": "buy_proxy",
          "title": "Buy proxy",
          "description": "Buys a proxy, deducting the account balance. Returns connection credentials (host go.proxycove.com, port 824 = new IP every request, port 10000 = sticky IP by interval). Check get_pricing × traffic_gb against the balance first. IMPORTANT: wait ~5 seconds after the purchase before sending the first request through the proxy — the country filter takes a moment to propagate at the upstream provider, so an immediate first request may exit from another country.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country code, e.g. \"br\" for Brazil. Omit for mixed pool",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "rotation_interval_minutes": {
                "description": "Sticky IP: keep the same IP for N minutes. Omit = rotate on every request",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "traffic_gb": {
                "description": "Prepaid traffic in GB",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "Proxy type",
                "enum": ["residential", "mobile", "datacenter"],
                "type": "string"
              }
            },
            "required": ["traffic_gb", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b93a77022ded1f3390ce90c45dc7a1375e1731c4ebf37c667b3d2ecdff9dd470"
        },
        {
          "name": "create_account",
          "title": "Create ProxyCove account",
          "description": "Creates a new account WITHOUT registration forms and returns an API key (pc_live_...). IMPORTANT: if the human already has a ProxyCove account, do NOT create a new one — ask them for a key from the website cabinet or the Telegram bot instead. The key is shown ONCE and IS the account: there is no password. Tell the human to save it and add it as the Authorization header (\"Bearer <key>\") of this connector. Losing the key means losing the balance unless a recovery channel is attached — offer attach_recovery (email) or link_telegram right after the account is created.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contact_email": {
                "description": "Optional email for account recovery",
                "format": "email",
                "type": "string"
              },
              "label": {
                "description": "Short account label, e.g. the human's project name",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d92d9385d2afad11fc34df93a2ff6ba14f81a56db9bb33d837ed4a85e24ef659"
        },
        {
          "name": "create_topup",
          "title": "Create top-up payment link",
          "description": "Creates an invoice and returns payment_url. Give the URL to the human — they open it in the browser and pay. Methods: sbp (Russian instant bank transfer, default for RU users), card_ru (Russian bank card), crypto (crypto via the RU provider), card_international (international card, best for non-RU users), crypto_cryptomus (crypto via Cryptomus — alternative crypto gateway). Agents must NEVER collect card details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount_usd": {
                "description": "Top-up amount in USD, min 1.5",
                "maximum": 10000,
                "minimum": 1.5,
                "type": "number"
              },
              "method": {
                "default": "sbp",
                "description": "Payment method",
                "enum": ["sbp", "card_ru", "crypto", "card_international", "crypto_cryptomus"],
                "type": "string"
              }
            },
            "required": ["amount_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
