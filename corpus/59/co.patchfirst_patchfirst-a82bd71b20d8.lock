      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "patchfirst",
        "title": "Patchfirst",
        "version": "1.0.0",
        "description": "Exploited CVEs ranked by what to patch first, with CISA KEV, EPSS, ATT&CK techniques and sourced evidence.",
        "websiteUrl": "https://patchfirst.co",
        "icons": [
          {
            "src": "https://patchfirst.co/favicon.svg",
            "mimeType": "image/svg+xml"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Patchfirst: CVE intelligence with the MITRE ATT&CK and evidence layer (what attackers do with a CVE, and which threat-report passage says so).\n\nEvery claim carries a provenance badge. Respect it when you answer:\n- [Source data] (provenance \"source\"): copied from an authoritative feed (NVD, CVE.org, CISA KEV, FIRST EPSS, MITRE CTID mappings). Safe to state as fact, citing the feed.\n- [Machine-matched] (\"machine\"): keyword/pattern matching over threat-report text, or a dataset annotation on a passage in the same sentence as the CVE (~64% link precision). UNVERIFIED. Say \"a report passage suggests...\" / \"machine-matched, unverified\", never \"attackers use X\".\n- [AI-written] (\"ai\"): language-model summary; always shows the model. Do not present as sourced fact.\n- [Human-checked] (\"human\"): confirmed by a named Patchfirst reviewer.\nNever upgrade a badge. When a technique has several links, the strongest one is listed first; quote the evidence and link the report URL rather than paraphrasing.\nPriority (0-100) is computed by Patchfirst from source data, the order to patch in: 35 if in a KEV catalog (CISA or VulnCheck) + 10 for a KEV listing in the last 90 days (5 within a year) + 10 known ransomware use + 20 x EPSS percentile + up to 10 for threat-report mentions + 5 public exploit code + up to 3 for OTX pulses + 0.7 x CVSS, minus 15 for an end-of-life product (floor 0). Each result lists its factors; quote them rather than inventing a reason.\nCoverage: every published CVE has a record (search, get_vulnerability), but ATT&CK techniques and threat reports exist only for the \"core\" tier (KEV, report-named, high EPSS, recent critical). No technique link does not mean no exploitation. Quotes are short excerpts; follow the report URL for context.\nWhich tool to use:\n- \"What should I patch first?\" / \"what is being exploited?\": list_exploited (filter by ransomware, tactic or technique).\n- One CVE in depth: get_vulnerability. Only its ATT&CK techniques: techniques_for_cve.\n- \"Which CVEs give an attacker T1190?\": cves_for_technique.\n- \"Is my project affected?\": check_stack with the packages and versions from a lockfile.\n- Newest CVEs since a date: list_feed. A product or vendor name, or a partial CVE id: search.\nLink the Patchfirst page (url field) when you cite a CVE. Data is rebuilt daily; a weekly digest of CISA KEV additions is at https://patchfirst.co/weekly/.",
      "tools": [
        {
          "name": "check_stack",
          "title": "Check stack",
          "description": "Check a list of packages for known vulnerabilities via OSV.dev, then join with Patchfirst exploitation data (CISA KEV, EPSS, priority, ATT&CK techniques). Results are sorted exploited-first so you fix what attackers actually use. Ecosystems use OSV names: npm, PyPI, Maven, Go, crates.io, RubyGems, NuGet, Packagist, Debian, Alpine, etc.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "packages": {
                "items": {
                  "properties": {
                    "ecosystem": {
                      "description": "OSV ecosystem, e.g. \"npm\", \"PyPI\", \"Maven\"",
                      "type": "string"
                    },
                    "name": {
                      "description": "Package name, e.g. \"lodash\" or \"org.apache.logging.log4j:log4j-core\"",
                      "type": "string"
                    },
                    "version": {
                      "description": "Installed version. Omit to list all known vulns for the package.",
                      "type": "string"
                    }
                  },
                  "required": ["ecosystem", "name"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["packages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:475541202c989f785ba5f11c158230de970feec54f2e1b0ca82294e76dba6765"
        },
        {
          "name": "cves_for_technique",
          "title": "CVEs for technique",
          "description": "Reverse ATT&CK lookup: which CVEs lead to a given technique, e.g. \"which exploited CVEs give T1190 Exploit Public-Facing Application?\". Sorted by Patchfirst priority. Parent ids include sub-techniques (T1059 matches T1059.004). Each hit shows the link's provenance badge and best evidence quote.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include_subtechniques": {
                "description": "For a parent id, also match its sub-techniques. Default true.",
                "type": "boolean"
              },
              "kev_only": {
                "description": "Only CVEs in CISA KEV (known exploited). Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results, default 10, max 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "technique_id": {
                "description": "ATT&CK technique id, e.g. \"T1190\" or \"T1059.004\"",
                "type": "string"
              }
            },
            "required": ["technique_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f154f2ec3361b77109c565d4f48c33f273843a9ac1666d6d2925430205d09f5"
        },
        {
          "name": "get_vulnerability",
          "title": "Get vulnerability",
          "description": "Full Patchfirst record for one CVE: description, CVSS, EPSS, CISA KEV status, the ATT&CK techniques attackers use with it (each with provenance badge, basis, evidence quotes and report links), threat reports that name it, and the priority score with its factors. Every field carries provenance and a source URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cve_id": {
                "description": "CVE id, e.g. \"CVE-2024-3400\"",
                "type": "string"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42d6d72325355d6f48a3a50fdd252d2a4744a740581a13cc7856a287ffb6a70f"
        },
        {
          "name": "list_exploited",
          "title": "List exploited CVEs",
          "description": "Top known-exploited CVEs (CISA KEV) ranked by Patchfirst priority, optionally filtered to known ransomware use, an ATT&CK tactic (e.g. \"initial-access\", \"Privilege Escalation\", \"TA0004\") or a technique id. Each result lists its techniques with provenance badges.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results, default 10, max 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "ransomware_only": {
                "description": "Only KEV entries with known ransomware campaign use.",
                "type": "boolean"
              },
              "tactic": {
                "description": "ATT&CK tactic id, name or TA id. One of: reconnaissance, resource-development, initial-access, execution, persistence, privilege-escalation, defense-evasion, stealth, defense-impairment, credential-access, discovery, lateral-movement, collection, command-and-control, exfiltration, impact",
                "type": "string"
              },
              "technique": {
                "description": "ATT&CK technique id, e.g. \"T1190\"; parent ids include sub-techniques.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad2e3731e56daf0ea001cd68c7f269cd2388edfdf9c807b3566d336d98e5cfaf"
        },
        {
          "name": "list_feed",
          "title": "Newest CVEs",
          "description": "Newest CVEs by published date, with KEV/EPSS/CVSS (source data) and priority. Complete for the last 30 days (every CVE published in that window is core tier); older dates list core-tier CVEs only. Filter by a since-date and minimum CVSS severity.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results, default 20, max 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_severity": {
                "description": "Minimum CVSS base severity.",
                "enum": ["LOW", "MEDIUM", "HIGH", "CRITICAL"],
                "type": "string"
              },
              "since": {
                "description": "Only CVEs published on/after this date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e942d0e64254b860c3160bbef167d0f08f01140ed00c2c05da458f6e47c3ef5"
        },
        {
          "name": "search",
          "title": "Search CVEs",
          "description": "Search every published CVE (all tiers) by CVE id (full or partial, e.g. \"CVE-2024-3400\", \"2024-34\"), vendor, product or title words (e.g. \"fortinet fortios\", \"confluence\", \"sql injection\"). Ranked by match quality, then priority.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results, default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "CVE id, vendor, product or title words",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e18a1cf34810bb4b1c93f73781f16720eb4ed093036da5cec72d97c1c2440f0d"
        },
        {
          "name": "techniques_for_cve",
          "title": "Techniques for CVE",
          "description": "What attackers do with a CVE: its MITRE ATT&CK techniques grouped by tactic in kill-chain order (Reconnaissance -> Impact). Each technique lists every supporting link with provenance badge, basis, evidence quote and report URL, strongest provenance first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
