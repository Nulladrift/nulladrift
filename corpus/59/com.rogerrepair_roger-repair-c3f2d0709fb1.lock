      },
      "instructions": "Roger Repair (rogerrepair.com) books home repairs across 30 trades in the United States and Canada. Roger picks ONE vetted, licensed, insured local pro per request; it does not sell the request to several companies.\nHow to help a homeowner:\n1. Use check_coverage with their ZIP or postal code (and the trade if known).\n2. Use get_estimate to show the estimated price range. Always say it is an estimate and the pro confirms the final price on site.\n3. Read back the details and get the homeowner's OK, then call request_booking with homeowner_confirmed=true.\n4. Give the homeowner the confirm_url. They open it on rogerrepair.com to confirm the booking. Never ask for or accept card numbers; payment only happens on that page.\n5. Use get_request_status with the request_id to check progress.\nDo not promise arrival times, prices or warranties. Roger never charges homeowners a fee. Locksmith work is home and business only, never cars. Support: (855) 550-0331, hello@rogerrepair.com.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check coverage",
          "description": "Check whether Roger serves a ZIP or postal code, and whether a vetted pro for the trade is available there right now.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "postal_code": {
                "description": "US 5-digit ZIP (e.g. 33133) or Canadian postal code (e.g. M5V 2T6) where the work is.",
                "type": "string"
              },
              "service": {
                "description": "Optional. A trade from list_services (e.g. 'plumbing') or a few words about the problem.",
                "type": "string"
              }
            },
            "required": ["postal_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8909fa97e5da12581ff93d000d2f9d5a6647b118e61448bbb6330ff57de6c413"
        },
        {
          "name": "get_estimate",
          "title": "Get a price range",
          "description": "Get the estimated price range Roger shows for this problem at this location. Does not create a request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "postal_code": {
                "description": "US 5-digit ZIP (e.g. 33133) or Canadian postal code (e.g. M5V 2T6) where the work is.",
                "type": "string"
              },
              "problem": {
                "description": "The homeowner's problem in plain words, e.g. 'Kitchen sink is leaking under the cabinet'.",
