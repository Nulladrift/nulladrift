      "instructions": "Palimpalem builds websites for small local businesses. Use crear_borrador_web when someone wants a website for a business, or a new version of their current website: it returns a link to a finished draft they can view and keep.",
      "tools": [
        {
          "name": "crear_borrador_web",
          "title": "Build a website draft",
          "description": "Builds a free draft website for a small local business (restaurant, hairdresser, shop, clinic, tradesperson, association) and returns a link where the person can view it. Takes 15 to 60 seconds. Give either a short description of the business (what it does, where, what it offers, how to contact it) or the address of its current website, whose texts and photos are reused. No account is needed to build or view the draft; on the draft page the person can keep the website and later change it by chatting. Languages: Spanish, German, English.",
          "inputSchema": {
            "properties": {
              "current_website": {
                "description": "Address of the business's current website, e.g. example.com. Its texts and photos are reused for the new draft.",
                "type": "string"
              },
              "description": {
                "description": "What the business does, where it is, what it offers, contact details. At least one full sentence. Used when no current_website is given.",
                "type": "string"
              },
              "language": {
                "default": "es",
                "description": "Language of the website.",
                "enum": ["es", "de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
