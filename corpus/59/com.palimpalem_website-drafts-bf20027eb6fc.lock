{
  "lockfileVersion": 2,
  "subjects": {
    "com.palimpalem/website-drafts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://palimpalem.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "palimpalem",
        "title": "Palimpalem",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Palimpalem builds websites for small local businesses and hosts them, with their own domain and e-mail. crear_borrador_web builds a free draft from a description or an existing website and returns a link. ver_borrador reads the state of a draft by its link or token. comprobar_dominio checks whether a domain name is free. With a palimpalem sign-in (OAuth, a code by e-mail is enough, also without an account): reclamar_borrador saves a draft as the person's own website, listar_mis_webs and ver_mi_web read their websites, editar_web changes a website from a request in plain words, on any page, also replacing a photo from an address (every change can be undone), publicar_web makes it visible after the person confirms, estado_web shows the whole state (online, plan, domain, e-mail, pages, languages), idiomas_web adds or removes languages, versiones_web lists saved versions and restores one. ver_dns shows where a domain points; conectar_dominio_existente connects a domain the person already owns (two DNS steps, then a check). solicitar_dominio, solicitar_correo and solicitar_plus return a payment link on palimpalem.com for a domain, an e-mail package or Plus; the person pays there, the tools charge nothing.",
      "tools": [
        {
          "name": "comprobar_dominio",
          "title": "Check a domain name",
          "description": "Use this when someone wants to know whether a domain name for their website is free, e.g. panaderia-ruzafa. Checks up to three endings (com, es, net, info, org, de, eu) per call; at most one of them is confirmed with the registry, the others are marked as not confirmed. Read only; registers nothing and gives no prices. Limited to a few calls per hour.",
          "inputSchema": {
            "properties": {
              "ending": {
                "description": "Optional. One ending to check. Without it, com, es and net are checked.",
                "enum": ["com", "es", "net", "info", "org", "de", "eu"],
                "type": "string"
              },
              "name": {
                "description": "The name without ending, e.g. panaderia-ruzafa. A full domain such as panaderia-ruzafa.es is also accepted. Letters a-z, digits and hyphens.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a domain name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:42e86dead50c75dc8c0d0cdb5cc67c4579f5d773d2651f899c38713c8bbc9274"
        },
        {
          "name": "conectar_dominio_existente",
          "title": "Connect a domain I already own",
          "description": "Use this when the person already owns a domain at another provider and wants it to show their palimpalem website. Requires palimpalem sign-in. Returns exactly two DNS steps to make at their provider; with check=true it verifies them by DNS lookup and, when both are correct, asks palimpalem to activate the domain. It never writes into DNS zones by itself. For a domain managed by palimpalem it e-mails the owner a confirmation link instead, and the change is made only after the owner clicks it.",
          "inputSchema": {
            "properties": {
              "check": {
                "default": false,
                "description": "true to verify the two DNS steps after the person made them.",
                "type": "boolean"
              },
              "domain": {
                "description": "The domain the person owns, e.g. panaderia-ruzafa.es.",
                "type": "string"
              },
              "web": {
                "description": "Optional when the account has one website. The website: its name, its palimpalem address or its own domain.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Connect a domain I already own"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03bf30819a405f10c9724e82aa0fbb26127621bc3bc0370b9df95900fa49855c"
        },
        {
          "name": "crear_borrador_web",
          "title": "Build a website draft",
          "description": "Use this when someone wants a website for a small local business (restaurant, hairdresser, shop, clinic, tradesperson, association) or a new version of their current website. Builds a free draft and returns a link where the person can view it. Takes 15 to 60 seconds. Give either a short description of the business (what it does, where, what it offers, how to contact it) or the address of its current website, whose texts and photos are reused. No account is needed to build or view the draft. If the person likes it, the website can be kept on palimpalem: hosted there, changed later by chatting, and run with its own domain and e-mail address. Languages: Spanish, German, English.",
          "inputSchema": {
            "properties": {
              "current_website": {
                "description": "Address of the business's current website, e.g. example.com. Its texts and photos are reused for the new draft.",
                "type": "string"
              },
              "description": {
                "description": "What the business does, where it is, what it offers, contact details. At least one full sentence. Used when no current_website is given.",
                "type": "string"
              },
              "language": {
                "default": "es",
                "description": "Language of the website.",
                "enum": ["es", "de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a website draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b374e6c60689a00575e4e22cc997fbb4345304da40e2e6c340fd89064df2803b"
        },
        {
          "name": "editar_web",
          "title": "Change my website",
          "description": "Use this when the person wants to change something on one of their palimpalem websites: texts, titles, photos, sections, new pages (\"add a page about …\", added to the menu, sitemap and llms.txt), colours and style, contact details, WhatsApp button, SEO title. Requires palimpalem sign-in. Takes the change in plain words, carries it out and says exactly what changed. To work on another page than the home page give page; to aim at one element give element (ids from ver_mi_web). To put an own photo of the person in place of an existing one give photo_url (a public https address of a JPG, PNG or WebP) and element (the id of the photo); photo_edit improves (light, colour, sharpness) or crops an own photo to fit its place. Changes are saved and visible right away; each one can be undone (also by asking to undo the last change, or with versiones_web). Translations follow automatically. Does not touch domain, e-mail, payments or the account. Takes 5 to 60 seconds.",
          "inputSchema": {
            "properties": {
              "element": {
                "description": "Optional. Element id from ver_mi_web (e.g. b12) to aim the change at. Required with photo_url and photo_edit (the id of the photo).",
                "type": "string"
              },
              "page": {
                "description": "Optional. The page to change (name from ver_mi_web, e.g. \"menu\"). Without it, the home page.",
                "type": "string"
              },
              "photo_edit": {
                "description": "Optional. improve: better light, colour and sharpness; fit: crop to the shape of its place around the main subject. Only for the website's own photos (also right after photo_url).",
                "enum": ["improve", "fit"],
                "type": "string"
              },
              "photo_url": {
                "description": "Optional. Public https address of a photo (JPG, PNG or WebP, up to 15 MB) that replaces the photo at element. It is copied to the website.",
                "type": "string"
              },
              "request": {
                "description": "The change in plain words, in any language, e.g. \"Change the main title to Fresh bread every morning\" or \"Add a section with opening hours: Mon-Fri 8-14\". Optional when only photo_url or photo_edit is given.",
                "type": "string"
              },
              "web": {
                "description": "The website: its name, its palimpalem address or its own domain.",
                "type": "string"
              }
            },
            "required": ["web"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change my website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7d4e8ff92e4ecacf362273a77e842128f9ad500f160d1340023c7495fee314c2"
        },
        {
          "name": "estado_web",
          "title": "Show the state of my website",
          "description": "Use this when the person asks how their palimpalem website stands overall: online or not, free or Plus and until when, own domain and until when, e-mail package, pages and languages. Requires palimpalem sign-in. Read only.",
          "inputSchema": {
            "properties": {
              "web": {
                "description": "Optional when the account has one website. Its name, palimpalem address or own domain.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show the state of my website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8c2aac2fb20a0ceb64334ac60125efc7782b8ca09dae288d1af452805346d44"
        },
        {
          "name": "idiomas_web",
          "title": "Languages of my website",
          "description": "Use this when the person wants their palimpalem website in another language as well, or wants to remove one. Requires palimpalem sign-in. action=list shows the languages; action=add translates every page by AI in the background (about one minute per page) and publishes it under /<code>/ with a language switch, and later changes are translated automatically; action=remove takes a language off. The original language stays the one that is edited. Languages: es, en, de, fr, it, pt, ca.",
          "inputSchema": {
            "properties": {
              "action": {
                "default": "list",
                "enum": ["list", "add", "remove"],
                "type": "string"
              },
              "language": {
                "description": "Needed for add and remove.",
                "enum": ["es", "en", "de", "fr", "it", "pt", "ca"],
                "type": "string"
              },
              "web": {
                "description": "The website: its name, its palimpalem address or its own domain.",
                "type": "string"
              }
            },
            "required": ["web"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Languages of my website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cc8ba402be0f16c0a8180cdd52560f8bee30b33b5d4a556c0d29b6f087f7d083"
        },
        {
          "name": "listar_mis_webs",
          "title": "List my websites",
          "description": "Use this when the person asks which websites they have on palimpalem. Requires palimpalem sign-in. Returns each website with its address, own domain if any, whether it is online, and whether it can be changed by AI. Read only.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my websites"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d95b440745296e6d71ea6482090f2045f5a4329530cd3f94c4038d8d8e965ac7"
        },
        {
          "name": "publicar_web",
          "title": "Publish my website",
          "description": "Use this when the person wants their palimpalem website to be visible to everyone, e.g. after maintenance mode. Requires palimpalem sign-in. Without confirm=true it only reports what would happen and changes nothing; with confirm=true (only after the person agreed) it publishes and returns the live address.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "description": "true only after the person has confirmed that the website should go public.",
                "type": "boolean"
              },
              "web": {
                "description": "The website: its name, its palimpalem address or its own domain.",
                "type": "string"
              }
            },
            "required": ["web"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish my website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce861b5cda48ce479a87d22a474cf5447f16fee0d178daf9ec2a68a23d6cccf7"
        },
        {
          "name": "reclamar_borrador",
          "title": "Save a draft as my website",
          "description": "Use this when the person likes a draft from crear_borrador_web and wants to keep it as their own website. Requires palimpalem sign-in. Creates a new free website in their account from the draft (it never overwrites an existing website) and returns its address, e.g. https://name.palimpalem.com/. The login details are e-mailed to the person. Calling it again with the same draft returns the same website.",
          "inputSchema": {
            "properties": {
              "draft": {
                "description": "The draft link (https://palimpalem.com/palim/apli/entwurf.php?t=...) or its 24-character token.",
                "type": "string"
              },
              "subdomain": {
                "description": "Optional. Wished address name, e.g. panaderia-ruzafa for panaderia-ruzafa.palimpalem.com. Letters a-z, digits and hyphens, 3 to 25. Without it a name is suggested from the business name.",
                "type": "string"
              }
            },
            "required": ["draft"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save a draft as my website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:22923432f5fa49ae1113fef99ea73214ca4f936827b771099d533dd140da1d05"
        },
        {
          "name": "solicitar_correo",
          "title": "Get a payment link for e-mail",
          "description": "Use this when the person wants e-mail addresses with their own domain (e.g. info@their-domain.es) for their palimpalem website. Requires palimpalem sign-in. Without a package it lists the packages with mailboxes, storage and price; with a package it returns a payment link on palimpalem.com. Mailboxes are created after payment. This tool charges nothing.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional when the website has one domain. The domain for the addresses.",
                "type": "string"
              },
              "package": {
                "description": "The e-mail package. Leave empty to see the packages first.",
                "enum": ["mini", "mail", "mail_plus", "mail_pro"],
                "type": "string"
              },
              "web": {
                "description": "Optional when the account has one website.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get a payment link for e-mail"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:18723c5fd89b0a2e9944150088c40e879e052508f507e7ea84ea09752b005d87"
        },
        {
          "name": "solicitar_dominio",
          "title": "Get a payment link for a new domain",
          "description": "Use this when the person wants a new domain name (e.g. panaderia-ruzafa.es) for their palimpalem website. Requires palimpalem sign-in. Checks that the name is free and returns a payment link on palimpalem.com with the price. On that page the person enters the details of the domain owner (always the person or their business) and pays; the domain is registered after payment. This tool registers nothing and charges nothing.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The full domain name with ending, e.g. panaderia-ruzafa.es. Endings: com, es, net, info, org, de, eu.",
                "type": "string"
              },
              "web": {
                "description": "Optional when the account has one website. The website the domain is for.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
