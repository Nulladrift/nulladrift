        {
          "name": "diff",
          "title": "Diff: compare two texts, unified patch",
          "description": "Compare two strings in the same way as the Diff checker page: line counts for added, removed and unchanged lines, plus a unified patch (--- / +++ / @@). Optional ignore_whitespace and ignore_case. Text is not stored.",
          "inputSchema": {
            "properties": {
