        },
        {
          "name": "binary_calculator",
          "title": "Binary, hex, octal and decimal integer calculator",
          "description": "Add, subtract, multiply, divide or apply bitwise operators to integers in binary, hexadecimal, octal or decimal, or convert a value into every base. Optional 8, 16, 32 or 64-bit wrapping, with or without two's complement. Input is not stored.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "First operand, or the value to convert",
                "type": "string"
              },
              "b": {
                "description": "Second operand (not used for convert or not)",
                "type": "string"
              },
              "base": {
                "description": "Input base, default bin",
                "enum": ["bin", "oct", "dec", "hex"],
                "type": "string"
              },
              "op": {
                "description": "calculate (default) plus one of add, sub, mul, div, mod, and, or, xor, nand, nor, not, shl, shr, sar; or convert",
                "type": "string"
              },
              "signed": {
                "description": "Treat a fixed width as signed two's complement",
                "type": "boolean"
              },
              "width": {
                "description": "Bit width, default auto",
                "enum": ["auto", "8", "16", "32", "64"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
