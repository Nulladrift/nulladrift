        },
        {
          "name": "convert",
          "title": "Convert: units, colors and contrast, numbers to words, Markdown, print size, CGPA",
          "description": "Unit conversion (imperial and metric: length, weight, volume, area, speed, temperature, data, pressure, energy), color hex/rgb/hsl, WCAG contrast ratio, numbers in words and $ or lakh/crore formats, Markdown to HTML, pixels vs print size at a DPI, and CGPA to percentage (official formulas).",
