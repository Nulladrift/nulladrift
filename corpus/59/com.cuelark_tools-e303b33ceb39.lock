      },
      "instructions": "Exact answers for things models get wrong or can't check. Each tool takes an `op` where it groups several operations. json: validate/format/convert. text: counts, limit fit, case, slug, regex, tokens. dates: differences, business days with public holidays, age, cron. time: now, zone conversion, Unix timestamps. encode: Base64, URL, hashes, UUID/ULID, JWT decode. convert: units, colors and WCAG contrast, numbers to words, Markdown, print size. finance: loan payments, interest, percentages, sales tax/VAT. calculate: exact decimal math, stats, BMI. income_tax: US federal or India. validate: ID formats and check digits (US routing, EIN, SSN, ZIP; IBAN, cards; India GSTIN, PAN, IFSC, Aadhaar). Live lookups: verify_links, package_check, verify_citation, ifsc_lookup. Inputs are loose; unknown keys come back in ignored_params. Nothing is stored or logged. No file, image or PDF tools.",
      "tools": [
        {
          "name": "ascii_converter",
          "title": "Convert text to and from decimal, hex, binary or octal codes",
          "description": "Encode text to Unicode scalar values in decimal, hex, binary or octal, or decode those codes back to text, the same way as the ASCII converter page. Optional prefixes (0x, U+, 0b, 0o, HTML entities). ASCII is 0–127; values above that are included unless ascii_only is true. Or return the official Unicode names and traditional abbreviations for 0–127. Input is not stored.",
          "inputSchema": {
            "properties": {
              "ascii_only": {
                "description": "Omit values outside 0–127",
                "type": "boolean"
              },
              "base": {
                "description": "Number base, default dec",
                "enum": ["dec", "hex", "bin", "oct"],
                "type": "string"
              },
              "op": {
                "description": "encode (default), decode, or table",
                "enum": ["encode", "decode", "table"],
                "type": "string"
              },
              "prefix": {
                "description": "For encode, how to write each value",
                "enum": ["none", "0x", "0b", "0o", "U+", "u-brace", "html"],
                "type": "string"
              },
              "separator": {
                "description": "For encode, how to join values, default space",
                "enum": ["space", "comma", "newline"],
                "type": "string"
              },
              "text": {
                "description": "Text to encode, or codes to decode",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
