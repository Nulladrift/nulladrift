      },
      "instructions": "Exact answers for things models get wrong or can't check. Each tool takes an `op` where it groups several operations. json: validate/format/convert. text: counts, limit fit, case, slug, regex, tokens. dates: differences, business days with public holidays, age, cron. time: now, zone conversion, Unix timestamps. encode: Base64, URL, hashes, UUID/ULID, JWT decode. convert: units, colors and WCAG contrast, numbers to words, Markdown, print size. finance: loan payments, interest, percentages, sales tax/VAT. calculate: exact decimal math, stats, BMI. income_tax: US federal or India. validate: ID formats and check digits (US routing, EIN, SSN, ZIP; IBAN, cards; India GSTIN, PAN, IFSC, Aadhaar). Live lookups: verify_links, package_check, verify_citation, ifsc_lookup. Inputs are loose; unknown keys come back in ignored_params. Nothing is stored or logged. No file, image or PDF tools.",
      "tools": [
        {
          "name": "calculate",
          "title": "Calculate: exact arithmetic, statistics, rounding, BMI",
          "description": "Exact decimal arithmetic for an expression (no floating-point drift: 0.1+0.2 = 0.3; + − × ÷ ^ %, sqrt, ln, log, round, min, max, pi), summary statistics for a list of numbers, rounding with a chosen mode, and adult BMI from lb/in or kg/cm.",
          "inputSchema": {
            "properties": {
              "decimals": {
                "default": 2,
                "type": "integer"
              },
              "expression": {
                "examples": ["(1250 * 1.0825) / 12"],
                "type": "string"
              },
              "height_cm": {
                "type": "number"
              },
              "height_in": {
                "type": "number"
              },
              "mode": {
                "default": "half_up",
                "enum": ["half_up", "half_even", "up", "down", "ceil", "floor"],
                "type": "string"
              },
              "op": {
                "default": "expression",
                "enum": ["expression", "stats", "round", "bmi"],
                "type": "string"
              },
              "value": {
                "type": ["string", "number"]
              },
              "values": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "weight_kg": {
                "type": "number"
              },
              "weight_lb": {
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
