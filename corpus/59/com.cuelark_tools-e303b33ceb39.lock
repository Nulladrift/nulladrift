          "digest": "sha256:0ae94b0ed56b5debdeea978abbcf394201002f525e5ef6478028b6a7dd0c6f02"
        },
        {
          "name": "conduit_fill",
          "title": "Conduit fill from NEC Chapter 9 Tables 1, 4 and 5",
          "description": "Work out the fill of EMT, IMC, RMC or PVC Schedule 40 or 80 from NFPA 70 (NEC) 2023 Chapter 9: Table 5 conductor areas, Table 4 raceway area, and Table 1 allowed percent (53% for one conductor, 31% for two, 40% for more than two, or 60% for a nipple 24 in or shorter). Mixed sizes are allowed. Verify the result with the edition your AHJ has adopted.",
          "inputSchema": {
            "properties": {
              "conductors": {
                "description": "One conductor group per line, e.g. '6 x 4 AWG THHN'",
                "type": "string"
              },
              "conduit": {
                "description": "emt, imc, rmc, pvc40 or pvc80",
                "type": "string"
              },
              "nipple": {
                "description": "If true, use 60% fill for a nipple 24 in (600 mm) or shorter",
                "type": "boolean"
              },
              "trade_size": {
                "description": "Trade size such as 1/2, 3/4, 1, 1-1/4. Omit to get the smallest size that fits.",
                "type": "string"
              }
            },
            "required": ["conductors", "conduit"],
            "type": "object"
          },
