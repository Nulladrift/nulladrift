        {
          "name": "calculate",
          "title": "Calculate: exact arithmetic, statistics, rounding, BMI",
          "description": "Exact decimal arithmetic for an expression (no floating-point drift: 0.1+0.2 = 0.3; + − × ÷ ^ %, sqrt, ln, log, round, min, max, pi), summary statistics for a list of numbers, rounding with a chosen mode, and adult BMI from lb/in or kg/cm.",
          "inputSchema": {
            "properties": {
              "decimals": {
                "default": 2,
                "type": "integer"
              },
              "expression": {
                "examples": ["(1250 * 1.0825) / 12"],
                "type": "string"
              },
              "height_cm": {
                "type": "number"
              },
              "height_in": {
                "type": "number"
              },
              "mode": {
                "default": "half_up",
                "enum": ["half_up", "half_even", "up", "down", "ceil", "floor"],
                "type": "string"
              },
              "op": {
                "default": "expression",
                "enum": ["expression", "stats", "round", "bmi"],
                "type": "string"
              },
              "value": {
                "type": ["string", "number"]
              },
              "values": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "weight_kg": {
                "type": "number"
              },
              "weight_lb": {
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
