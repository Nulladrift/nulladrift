        },
        {
          "name": "cap_rate",
          "title": "Real-estate cap rate from NOI and value",
          "description": "Capitalization rate = net operating income ÷ value. NOI is potential gross income minus vacancy and credit loss minus operating expenses. Mortgage, depreciation, income tax and capital expenditures are not subtracted. You can also omit value and give a target cap rate to back into value. Educational only, not appraisal or investment advice.",
          "inputSchema": {
            "properties": {
              "operating_expenses": {
                "description": "Annual operating expenses, excluding debt service",
                "type": "number"
              },
              "potential_gross_income": {
                "description": "Annual scheduled rent plus other income",
                "type": "number"
              },
              "target_cap_rate_percent": {
                "description": "If value is omitted, value = NOI ÷ (target / 100)",
                "type": "number"
              },
              "vacancy_percent": {
                "description": "Vacancy and credit loss as a percent of PGI, 0–100",
                "type": "number"
              },
              "value": {
                "description": "Purchase price or current market value",
                "type": "number"
              }
            },
            "required": ["operating_expenses", "potential_gross_income", "vacancy_percent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1d3c50d9dea576cf2fcc7fcf97fdb0837956cda0b4f972c4c28f2888a7ce9dc"
        },
        {
          "name": "cfm",
          "title": "Airflow in CFM from room, duct, sensible load or ASHRAE 62.2",
          "description": "Airflow in CFM (plus m³/h, L/s). op=room: volume × ACH ÷ 60. op=duct: area × velocity. op=heat: Btu/h ÷ (1.08 × ΔT). op=home: ASHRAE 62.2-2019 Eq. 4-1a/4-1b, 0.03 A + 7.5 (Nbr + 1). units us (ft, in, fpm, Btu/h, °F, ft²) or metric (m, mm, m/s, W, °C, m²). Educational, not a load calculation.",
          "inputSchema": {
            "properties": {
              "ach": {
                "description": "room: air changes per hour",
                "type": "number"
              },
              "bedrooms": {
                "description": "home: bedrooms (0 counts as 1)",
                "type": "number"
              },
              "delta_t": {
                "description": "heat: supply-to-room temperature difference (°F or °C)",
                "type": "number"
              },
              "diameter": {
                "description": "duct: round diameter (in or mm)",
                "type": "number"
              },
              "floor_area": {
                "description": "home: floor area (ft² or m²)",
                "type": "number"
              },
              "height": {
                "description": "room: ceiling height (ft or m); duct: rectangular height (in or mm)",
                "type": "number"
              },
              "length": {
                "description": "room: length (ft or m)",
                "type": "number"
              },
              "load": {
                "description": "heat: sensible load (Btu/h or W)",
                "type": "number"
              },
              "occupants": {
                "description": "home: occupants, counted only above bedrooms + 1",
                "type": "number"
              },
              "op": {
                "description": "Method",
                "enum": ["room", "duct", "heat", "home"],
                "type": "string"
              },
              "shape": {
                "description": "duct shape, default round",
                "enum": ["round", "rectangular"],
                "type": "string"
              },
              "units": {
                "description": "Default us",
                "enum": ["us", "metric"],
                "type": "string"
              },
              "velocity": {
                "description": "duct: velocity (fpm or m/s)",
                "type": "number"
              },
              "width": {
                "description": "room: width (ft or m); duct: rectangular width (in or mm)",
                "type": "number"
              }
            },
            "required": ["op"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
