        {
          "name": "crosswind",
          "title": "Crosswind and headwind components from runway and wind",
          "description": "Headwind = V × cos(θ) and crosswind = V × sin(θ), where θ is the angle between the runway heading and the wind direction, from FAA-H-8083-25C Chapter 11. Enter a runway number 1–36 or a heading in degrees. Optional gust. Educational only, not for navigation or dispatch.",
          "inputSchema": {
            "properties": {
              "gust": {
                "description": "Optional gust speed in the same unit",
                "type": "number"
              },
              "runway": {
                "description": "Runway number 1–36, or a heading 0–360",
                "type": "number"
              },
              "unit": {
                "description": "Speed unit, default kt",
                "enum": ["kt", "km/h", "m/s"],
                "type": "string"
              },
              "wind_direction_deg": {
                "description": "Direction the wind is FROM, 0–360, same reference as the runway",
                "type": "number"
              },
              "wind_speed": {
                "description": "Sustained wind speed",
                "type": "number"
              }
            },
            "required": ["runway", "wind_direction_deg", "wind_speed"],
            "type": "object"
          },
