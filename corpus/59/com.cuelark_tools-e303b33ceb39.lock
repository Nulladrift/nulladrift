        {
          "name": "density_altitude",
          "title": "Density altitude from pressure altitude and temperature, or elevation and QNH",
          "description": "Density altitude is the ICAO standard-atmosphere height with the same air density (FAA-H-8083-25C Chapter 11; ICAO Doc 7488 / ISO 2533). Pass pressure_altitude_ft and oat_c (or oat_f), or field_elevation_ft plus altimeter_inhg or altimeter_hpa. Dry air. Educational only, not for performance dispatch.",
          "inputSchema": {
            "properties": {
              "altimeter_hpa": {
                "description": "Altimeter setting in hectopascals",
                "type": "number"
              },
              "altimeter_inhg": {
                "description": "Altimeter setting in inches of mercury",
                "type": "number"
              },
              "field_elevation_ft": {
                "description": "Field elevation in feet, used with an altimeter setting",
                "type": "number"
              },
              "oat_c": {
                "description": "Outside air temperature in °C",
                "type": "number"
              },
              "oat_f": {
                "description": "Outside air temperature in °F (used if oat_c is omitted)",
                "type": "number"
              },
              "pressure_altitude_ft": {
                "description": "Pressure altitude in feet (altimeter set to 29.92 inHg)",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
