        {
          "name": "income_tax",
          "title": "Income tax estimate: US federal or India",
          "description": "Estimate income tax from official tables. us_federal: 2025 or 2026 IRS brackets, standard deduction (with 65+/blind extras) or itemized, by filing status. india: FY 2025-26 or 2026-27, new vs old regime with 87A rebate, surcharge and cess. Each answer cites its source.",
          "inputSchema": {
            "properties": {
              "age65": {
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
              "age_band": {
                "enum": ["below_60", "60_to_79", "80_plus"],
                "type": "string"
              },
              "blind": {
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
              "deductions": {
                "description": "us: itemized total (used if above standard)",
                "type": "number"
              },
              "deductions_old": {
                "description": "india: 80C, 80D, HRA etc. total",
                "type": "number"
              },
              "filing_status": {
                "default": "single",
                "enum": ["single", "married_joint", "married_separate", "head_of_household"],
                "type": "string"
              },
              "fy": {
                "default": "2026-27",
                "enum": ["2025-26", "2026-27"],
                "type": "string"
              },
              "income": {
                "description": "Annual gross income",
                "type": "number"
              },
              "op": {
                "default": "us_federal",
                "enum": ["us_federal", "india"],
                "type": "string"
              },
              "salaried": {
                "default": true,
                "type": "boolean"
              },
              "year": {
                "default": 2026,
                "enum": [2025, 2026],
                "type": "integer"
              }
            },
            "required": ["income"],
            "type": "object"
          },
