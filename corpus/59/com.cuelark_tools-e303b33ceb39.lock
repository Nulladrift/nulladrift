                "type": "string"
              },
              "op": {
                "default": "expression",
                "enum": ["expression", "stats", "round", "bmi"],
                "type": "string"
              },
              "value": {
                "type": ["string", "number"]
              },
              "values": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "weight_kg": {
                "type": "number"
              },
              "weight_lb": {
                "type": "number"
              }
