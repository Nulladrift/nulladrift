                        },
                        "required": ["cited", "field", "record"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "doi": {
                      "type": ["string", "null"]
                    },
                    "index": {
                      "type": "number"
                    },
                    "mismatched_fields": {
                      "items": {
                        "enum": ["doi", "title"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "notice": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "date": {
                              "type": ["string", "null"]
                            },
                            "notice_doi": {
                              "type": ["string", "null"]
                            },
                            "reason": {
                              "type": ["string", "null"]
                            },
                            "type": {
                              "enum": ["retraction", "expression_of_concern", "correction"],
                              "type": "string"
                            }
                          },
                          "required": ["date", "notice_doi", "reason", "type"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "record": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "first_author": {
                              "type": ["string", "null"]
                            },
                            "journal": {
                              "type": ["string", "null"]
                            },
                            "title": {
                              "type": ["string", "null"]
                            },
                            "year": {
                              "type": ["number", "null"]
                            }
                          },
                          "required": ["first_author", "journal", "title", "year"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "reference": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["resolves", "registered_outside_crossref", "metadata_mismatch", "retracted", "expression_of_concern", "correction_issued", "journal_flagged", "not_found", "could_not_check"],
                      "type": "string"
