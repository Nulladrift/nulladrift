                        "type": "string"
                      },
                      "recheck_due": {
                        "type": "string"
                      },
                      "rules": {
                        "additionalProperties": false,
                        "properties": {
                          "ai_as_author": {
                            "additionalProperties": false,
                            "properties": {
                              "detail": {
                                "type": ["string", "null"]
                              },
                              "source": {
                                "type": ["string", "null"]
                              },
                              "value": {
                                "type": "string"
                              }
                            },
                            "required": ["detail", "source", "value"],
                            "type": "object"
                          },
                          "ai_generated_images": {
                            "additionalProperties": false,
                            "properties": {
                              "detail": {
                                "type": ["string", "null"]
                              },
                              "source": {
                                "type": ["string", "null"]
                              },
                              "value": {
                                "type": "string"
                              }
                            },
                            "required": ["detail", "source", "value"],
                            "type": "object"
                          },
                          "disclosure_required": {
                            "additionalProperties": false,
                            "properties": {
                              "detail": {
                                "type": ["string", "null"]
                              },
                              "source": {
                                "type": ["string", "null"]
                              },
                              "value": {
                                "type": "string"
                              },
