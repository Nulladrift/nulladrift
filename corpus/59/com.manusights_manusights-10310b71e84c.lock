        {
          "name": "get_manuscript_review",
          "title": "Read a manuscript review",
          "description": "Use this to read the preview, and the Full Review if the account has one, for a review_id returned by review_manuscript or list_manuscript_reviews. While preview.status is \"processing\", wait check_again_after_seconds and call again with the same review_id. Report status only while processing; when ready, report only returned findings without inventing critique or recommended fixes. Set include_full_review=false for a download-only or status request so the saved Full Review text is not read. To continue a partial report, pass the next paragraph and the document SHA-256 from the preceding result in report_range. Do not use it for review_ids the user has not referred to.",
