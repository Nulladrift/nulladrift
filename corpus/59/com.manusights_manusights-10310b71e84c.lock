      "instructions": "Manusights checks citations and manuscripts. check_references: any citations, even an assistant's earlier ones, as written; a whole list goes in reference_list; sources: Crossref, DOI registry, Retraction Watch and (no DOI) Semantic Scholar, PubMed, arXiv, Open Library. get_journal_ai_policy: a journal's AI-use and disclosure rules. review_manuscript: a pre-submission preview of an attached manuscript. Report only returned findings; no extra critique. Never call a reference fake or a manuscript verified.",
      "tools": [
        {
          "name": "check_references",
          "title": "Check references",
          "description": "Use this when the user wants to check references or citations from any source: a manuscript, a bibliography, a literature review, or citations an AI assistant gave earlier in the conversation. It reports whether each one exists, points to the right paper, or has been retracted, corrected or flagged, for questions like \"are these references real?\", \"is this paper retracted?\" or \"is this DOI right?\". Send citations from earlier in the conversation exactly as given, without correcting them first. Send every reference in the list as its own item, with or without a DOI (one without a DOI is matched by title and first author), with the full text as written, plus its DOI and title when you can read them, and any authors, journal, link, identifier or cite key you can read (the title lets a broken DOI be told apart from a missing work); up to 100 per call. For a whole reference list, such as the References section of an attached paper or a bibliography, send it as written, one reference per line, in reference_list instead of items: every reference in it is checked, in parts when it is long; call again with start_at as the result says until the whole list is done. When the whole original list's count is known, send it as expected_reference_count on every part; do not send a sample or reduce that count to fit a shortened input. Results come from Crossref, the DOI registry and Retraction Watch, and for references without a DOI also Semantic Scholar, PubMed, arXiv and, for books, Open Library; the manuscript itself is not sent. Do not use it to find new sources, to format citations, or to judge whether a source supports a claim. Report as the result's how_to_report says: each status as returned (for example \"resolves\" or \"not found\"), explained with the row detail; do not describe results as verified, fabricated or safe to cite. A reference with a DOI is compared by DOI and title only; one without a DOI must match a work by title and author.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "expected_reference_count": {
                "description": "The number of references in the whole original list, when known, not the current part. With reference_list, a one-entry discrepancy is checked as read with an explicit warning; larger discrepancies stop before lookup. With references items, the count must match the items sent plus positions before start_at. Keep the original count; do not lower it to fit shortened input.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "reference_list": {
                "description": "A whole reference list as written, one reference per line, keeping any numbers: numbered, author-year, BibTeX, RIS or CSL-JSON, for example a paper's whole References section.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              },
              "references": {
                "description": "The references to check, one item each. Leave out when sending reference_list.",
                "items": {
                  "properties": {
                    "arxiv_id": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "authors": {
                      "description": "The author list, as written.",
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "cite_key": {
                      "description": "The BibTeX or reference-manager key; it is echoed back on the result.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "doi": {
                      "description": "The DOI, if the reference has one.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "first_author_surname": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "isbn": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "journal": {
                      "description": "The journal, conference or publisher, as written.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "pmcid": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "pmid": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "text": {
                      "description": "The full reference exactly as written in the manuscript, or one BibTeX, RIS or CSL-JSON entry.",
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "description": "The cited work's title, as written.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "url": {
                      "description": "A link given in the reference.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "year": {
                      "maximum": 2100,
                      "minimum": 1500,
                      "type": "integer"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "start_at": {
                "description": "The original list position of the next part, from progress.next_start_at. A reference_list continuation uses the same whole list. A references-items continuation contains only remaining original items, in order, with separately supplied fields retained.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checked_at": {
                "type": "string"
              },
              "count_discrepancy": {
                "additionalProperties": false,
                "properties": {
                  "expected": {
                    "maximum": 1000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "read": {
                    "maximum": 1000,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["expected", "read"],
                "type": "object"
              },
              "counts": {
                "additionalProperties": {
                  "type": "number"
                },
                "propertyNames": {
                  "enum": ["resolves", "registered_outside_crossref", "metadata_mismatch", "retracted", "expression_of_concern", "correction_issued", "journal_flagged", "not_found", "could_not_check"],
                  "type": "string"
                },
                "required": ["correction_issued", "could_not_check", "expression_of_concern", "journal_flagged", "metadata_mismatch", "not_found", "registered_outside_crossref", "resolves", "retracted"],
                "type": "object"
              },
              "how_to_report": {
                "type": "string"
              },
              "licensed_by": {
                "type": ["string", "null"]
              },
              "progress": {
                "additionalProperties": false,
                "properties": {
                  "first": {
                    "type": "number"
                  },
                  "last": {
                    "type": "number"
                  },
                  "next_start_at": {
                    "type": ["number", "null"]
                  },
                  "total": {
                    "type": "number"
                  }
                },
                "required": ["first", "last", "next_start_at", "total"],
                "type": "object"
              },
              "retraction_data_as_of": {
                "type": ["string", "null"]
              },
              "retraction_data_complete": {
                "type": "boolean"
              },
              "rows": {
                "items": {
