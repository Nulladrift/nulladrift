        {
          "name": "get_manuscript_review",
          "title": "Read a manuscript review",
          "description": "Use this to read the preview, and the Full Review if the account has one, for a review_id returned by review_manuscript or list_manuscript_reviews. While preview.status is \"processing\", wait check_again_after_seconds and call again with the same review_id. Report status only while processing; when ready, report only returned findings without inventing critique or recommended fixes. Do not use it for review_ids the user has not referred to.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "review_id": {
                "description": "The review_id of one of the user's reviews.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["review_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "check_again_after_seconds": {
                "type": ["number", "null"]
              },
              "created_at": {
                "type": ["string", "null"]
              },
              "filename": {
                "type": ["string", "null"]
              },
              "full_review": {
                "additionalProperties": false,
                "properties": {
                  "download_url": {
                    "type": ["string", "null"]
                  },
                  "message": {
                    "type": ["string", "null"]
                  },
                  "progress_percent": {
                    "type": ["number", "null"]
                  },
                  "report_url": {
                    "type": ["string", "null"]
                  },
                  "status": {
                    "enum": ["not_included", "payment_received", "processing", "ready", "failed"],
                    "type": "string"
                  }
                },
                "required": ["download_url", "message", "progress_percent", "report_url", "status"],
                "type": "object"
              },
              "input_receipt": {
                "additionalProperties": false,
                "properties": {
                  "message": {
                    "type": "string"
                  },
                  "received_as": {
                    "enum": ["host_supplied_text", "file_bytes", "unknown"],
