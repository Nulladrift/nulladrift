        {
          "name": "get_journal_ai_policy",
          "title": "Get a journal's AI policy",
          "description": "Use this when the user asks what a named journal or publisher allows or requires about AI: AI as an author, disclosure statements and where they go, AI-generated images, uploading manuscripts to AI tools, or reviewers' and editors' AI use. It returns the rules as recorded from the publisher's official policy page, with that page's URL and the date Manusights last checked it. When the record is overdue for a re-check or the page could not be fully read, it says which and gives the URL instead of the rules. It also returns the journal's measured submission-to-acceptance time when Manusights has it. Takes an exact journal name or ISSN. Do not use it for word limits, formatting, fees or impact factors.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "journal": {
                "description": "The journal's exact name or ISSN, e.g. \"Nature Communications\" or \"2041-1723\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["journal"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acceptance_time": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "accepted_to_published_median_days": {
                        "type": ["number", "null"]
                      },
                      "dataset": {
                        "type": "string"
                      },
                      "median_days": {
                        "type": "number"
                      },
                      "p25_days": {
                        "type": "number"
                      },
                      "p75_days": {
                        "type": "number"
                      },
                      "papers": {
                        "type": "number"
                      },
                      "source": {
                        "type": "string"
                      },
                      "window": {
                        "additionalProperties": false,
                        "properties": {
                          "end": {
                            "type": "string"
                          },
                          "start": {
                            "type": "string"
                          }
                        },
                        "required": ["end", "start"],
                        "type": "object"
                      }
                    },
                    "required": ["accepted_to_published_median_days", "dataset", "median_days", "p25_days", "p75_days", "papers", "source", "window"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "ai_policy": {
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "checked_on": {
                        "type": "string"
                      },
