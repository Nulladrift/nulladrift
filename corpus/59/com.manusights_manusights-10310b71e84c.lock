        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Manusights checks citations and manuscripts. check_references: any citations, even an assistant's earlier ones, as written; a whole list goes in reference_list; sources: Crossref, DOI registry, Retraction Watch and (no DOI) Semantic Scholar, PubMed, arXiv, Open Library. get_journal_ai_policy: a journal's AI-use and disclosure rules. review_manuscript: a pre-submission preview of an attached manuscript. Report only returned findings; no extra critique. Never call a reference fake or a manuscript verified.",
      "tools": [
        {
          "name": "check_references",
          "title": "Check references",
          "description": "Use this when a researcher asks whether citations in a bibliography, manuscript or earlier answer resolve, match the cited record, or have publication notices. Inputs are original citations with any DOI, title, author or other supplied identifiers. Long bibliographies return position coverage and the next available part. Results describe source matches, correction and retraction notices, and unresolved lookups. Sources include Crossref, the DOI registry, Retraction Watch and other scholarly indexes. Signed-in checks save results for 90 days and remove expired unwatched history. A historical comparison is available only on explicit request. This tool does not find new sources, format citations, or judge whether a source supports a claim. The how_to_report field describes the scope and limits of each result.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "comparison": {
                "description": "Only for an explicitly requested revision comparison: latest selects the latest eligible complete check from this account before this check started; check selects the exact saved check_id already returned by Manusights. Do not infer a revision from shared references. A specific unavailable baseline is not replaced. The request is retained across parts.",
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "mode": {
                        "const": "latest",
                        "type": "string"
                      }
                    },
                    "required": ["mode"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "check_id": {
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                        "type": "string"
                      },
                      "mode": {
                        "const": "check",
                        "type": "string"
                      }
                    },
                    "required": ["check_id", "mode"],
                    "type": "object"
                  }
                ]
              },
              "comparison_page": {
                "additionalProperties": false,
                "description": "Read a page of position-level details from the exact completed saved comparison. Send this field alone with the current saved check ID and the zero-based number of detail rows already returned. Use next_offset to continue. No citation text or new source lookup is needed.",
                "properties": {
                  "check_id": {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  "offset": {
                    "maximum": 1999,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["check_id", "offset"],
                "type": "object"
              },
              "expected_reference_count": {
                "description": "The number of references in the whole original list, when known, not the current part. With reference_list, a one-entry discrepancy is checked as read with an explicit warning; larger discrepancies stop before lookup. With references items, the count must match the items sent plus positions before start_at. Keep the original count; do not lower it to fit shortened input.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "reference_chunk_end": {
                "description": "Inclusive last original position of an exact numbered range of up to 16 entries in reference_list. This continues an existing signed-in check using its resume_check_id, next start_at and unchanged original expected_reference_count. The first request uses the complete bibliography.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "reference_list": {
                "description": "The complete original bibliography as written, one reference per line, with its original labels. When a continuation returns an exact numbered range, send only those entries with reference_chunk_end.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              },
              "references": {
                "description": "The references to check, one item each. Leave out when sending reference_list.",
                "items": {
                  "properties": {
                    "arxiv_id": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "authors": {
                      "description": "The author list, as written.",
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "cite_key": {
                      "description": "The BibTeX or reference-manager key; it is echoed back on the result.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "doi": {
                      "description": "The DOI, if the reference has one.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "first_author_surname": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "isbn": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "journal": {
                      "description": "The journal, conference or publisher, as written.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "pmcid": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "pmid": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "text": {
                      "description": "The full reference exactly as written in the manuscript, or one BibTeX, RIS or CSL-JSON entry.",
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "description": "The cited work's title, as written.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "url": {
                      "description": "A link given in the reference.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "year": {
                      "maximum": 2100,
                      "minimum": 1500,
                      "type": "integer"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "resume_check_id": {
                "description": "For a continuation, use the latest incomplete saved_check.check_id, its next start_at, and the original citations for the requested positions. The current run ID is separate from any earlier comparison baseline.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "retry_saved": {
                "additionalProperties": false,
                "description": "The user can select Retry unchecked sources on a completed saved check card. If the card action is unavailable and the user asks to retry an exact completed check, use its check_id and original unchecked positions. Use this field alone. Citation text is read from that saved check.",
                "properties": {
                  "check_id": {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  "positions": {
                    "items": {
                      "maximum": 1000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "maxItems": 8,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["check_id", "positions"],
                "type": "object"
              },
              "start_at": {
                "description": "The original position of the next part, from progress.next_start_at. A continuation can use the returned numbered range, the complete original list, or its exact numbered remainder with the original expected_reference_count. A references-items continuation contains only the remaining items, in original order with all supplied fields.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
