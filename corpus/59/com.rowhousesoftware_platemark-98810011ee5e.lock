{
  "lockfileVersion": 2,
  "subjects": {
    "com.rowhousesoftware/platemark": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://platemark.rowhousesoftware.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "platemark",
        "title": "Platemark",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Platemark makes finished files from data. Charts from numbers: render_chart. Invoices: render_invoice. Quotes, receipts, certificates and letters: render_document. Social images: list_templates, then render_image. Short videos: render_video, then video_status until done.",
      "tools": [
        {
          "name": "account_status",
          "title": "Check plan and credits",
          "description": "Plan and credits left for the connected key. Call it before a batch of renders to check there are enough credits.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf11354f561890f738138122bf65bf3b5f96b775c78ad8e4cd422c501970f212"
        },
        {
          "name": "create_account",
          "title": "Create a free Platemark account",
          "description": "Make a free Platemark account (100 credits a month for images, PDFs and video, small watermark) and return its API key. The key is shown once; tell the user to save it and add it to this server's Authorization header.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:bcac34eefaf43698cd2166f13181df2ac0c0fe01abbb3af5c3b1a6e21da3e19d"
        },
        {
          "name": "list_templates",
          "title": "List image templates",
          "description": "List Platemark image templates with their size and the slots each one takes. Call this first to pick a template and see slot names.",
          "inputSchema": {
            "properties": {
              "tag": {
                "description": "Optional filter, like 'real estate', 'og', 'story' or 'ecommerce'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:738a2dffd758ed194594bf8ea9f4e667341a1219b050e6ad47d1917d160e7c30"
        },
        {
          "name": "render_chart",
          "title": "Make a chart image",
          "description": "Turn numbers into a clean chart PNG: bar, horizontal_bar, stacked_bar, line, area, pie or donut. Returns the image, a link that works for a year (for emails, docs, Slack or markdown) and one-sentence alt text describing the data. Axes, number formatting, colors and labels are handled; pass the data and a title. Costs 1 credit.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "ISO code like USD or EUR, with format currency.",
                "type": "string"
              },
              "decimals": {
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "format": {
                "description": "percent expects percentages: 12.5 means 12.5%.",
                "enum": ["number", "currency", "percent"],
                "type": "string"
              },
              "highlight": {
                "description": "A label to emphasize; the other bars or slices go gray.",
                "type": "string"
              },
              "labels": {
                "description": "One label per value: months, categories or slice names.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "locale": {
                "description": "Like en-US or de-DE.",
                "type": "string"
              },
              "series": {
                "description": "Several series share the labels. null leaves a gap in a line.",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "values": {
                      "items": {
                        "type": ["number", "null"]
                      },
                      "type": "array"
                    }
                  },
                  "required": ["values"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "show_values": {
                "description": "Force value labels on or off. By default they appear where they fit.",
                "type": "boolean"
              },
              "size": {
                "description": "landscape 1200x675 (default), og 1200x630, square 1080x1080, portrait 1080x1350, story 1080x1920.",
                "enum": ["landscape", "og", "square", "portrait", "story"],
                "type": "string"
              },
              "source": {
                "description": "Footnote, like 'Source: Stripe'.",
                "type": "string"
              },
              "subtitle": {
                "description": "Units, period or context, like 'USD, 2026'.",
                "type": "string"
              },
              "theme": {
                "enum": ["light", "dark"],
                "type": "string"
              },
              "title": {
                "description": "What the chart shows, like 'Monthly revenue'.",
                "type": "string"
              },
              "type": {
                "description": "bar for comparing categories, line or area for change over time, stacked_bar for parts of a total over categories, pie or donut for shares of one total (6 slices max; the rest fold into Other), horizontal_bar for long category names.",
                "enum": ["bar", "horizontal_bar", "stacked_bar", "line", "area", "pie", "donut"],
                "type": "string"
              },
              "values": {
                "description": "For a single series. Use series instead for several.",
                "items": {
                  "type": ["number", "null"]
                },
                "type": "array"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:49ba72aa23454855c72a21a702bcc09970925d5d15e4d3dcdc5f92d8fb550c13"
        },
        {
          "name": "render_document",
          "title": "Make a quote, receipt, certificate or letter PDF",
          "description": "Make a PDF of another kind: quote (estimate with valid-until date), receipt (marked Paid), certificate (completion or award, with signatures) or letter (offer letters, notices). Pass the type and its fields; quotes and receipts take the same fields as render_invoice. Returns a PDF link. Costs 2 credits.",
          "inputSchema": {
            "properties": {
              "fields": {
                "additionalProperties": true,
                "description": "quote/receipt: same as render_invoice, plus valid_until or valid_days (quote) and paid_date, payment_method (receipt). certificate: title, recipient, reason, kicker, presented, signatures [{name, role}], date, id. letter: from {name, address}, to {name, address}, subject, body (paragraphs split by blank lines), closing, signer, signer_role, date.",
                "type": "object"
              },
              "type": {
                "enum": ["quote", "receipt", "certificate", "letter", "invoice"],
                "type": "string"
              }
            },
            "required": ["fields", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:874367540476932c438c31c60159e141a88dffc1406983219d7c88246621ac2e"
        },
        {
          "name": "render_image",
          "title": "Render a social image",
          "description": "Fill a template's slots and get back a finished PNG. Text shrinks to fit its box. Image slots take an https PNG, JPG or GIF URL under 4 MB. Leave a slot out to keep its sample. Costs 1 credit.",
          "inputSchema": {
            "properties": {
              "modifications": {
                "additionalProperties": true,
                "description": "Keyed by slot name. A value is a string, or an object like {\"text\": \"...\", \"color\": \"#fff\"} or {\"image_url\": \"https://...\"}.",
                "type": "object"
              },
              "template": {
                "description": "Template id from list_templates, like 'og-image'.",
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:03f8563e72f6ad316f22d4629383d718f91eb09580bb503d5ea95f37518bc398"
        },
        {
          "name": "render_invoice",
          "title": "Make an invoice PDF",
          "description": "Make a professional invoice PDF and get a link to it. Send the line items and rates; Platemark does the math (subtotal, discount, tax, shipping, amount paid, amount due) in exact cents and formats money for the currency. Returns the PDF link, page count and the totals it used. Costs 2 credits.",
          "inputSchema": {
            "properties": {
              "accent": {
                "description": "Hex color for the title and total, like #1d4ed8.",
                "type": "string"
              },
              "amount_paid": {
                "description": "Already paid, subtracted from the total.",
                "type": "number"
              },
              "currency": {
                "description": "ISO code like USD, EUR, GBP. Default USD.",
                "type": "string"
              },
              "discount": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "label": {
                    "type": "string"
                  },
                  "percent": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "due_date": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "due_days": {
                "description": "Days after the issue date, if no due_date. 30 means Net 30.",
                "type": "number"
              },
              "from": {
                "description": "Who is billing.",
                "properties": {
                  "address": {
                    "description": "Street, city and so on, separated by line breaks or commas.",
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "tax_id": {
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "issue_date": {
                "description": "YYYY-MM-DD. Defaults to today.",
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "type": "number"
                    },
                    "unit_price": {
                      "description": "Price of one unit, in the invoice currency.",
                      "type": "number"
                    }
                  },
                  "required": ["description", "unit_price"],
                  "type": "object"
                },
                "type": "array"
              },
              "locale": {
                "description": "Like en-US or de-DE, for date and number formats.",
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "number": {
                "description": "Invoice number, like INV-1042.",
                "type": "string"
              },
              "paper": {
                "enum": ["letter", "a4"],
                "type": "string"
              },
              "payment_instructions": {
                "type": "string"
              },
              "po_number": {
                "type": "string"
              },
              "shipping": {
                "type": "number"
              },
              "tax": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "label": {
                    "description": "Like 'Sales tax (6%)' or 'VAT'.",
                    "type": "string"
                  },
                  "percent": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "terms": {
                "type": "string"
              },
              "to": {
                "description": "Who is being billed.",
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              }
            },
            "required": ["from", "items", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3adabc051aa609a7efb0ce4b88bee2d9698c405fbfc24fe7535ee94f2dc4c0cd"
        },
        {
          "name": "render_video",
          "title": "Make a short video",
          "description": "Make an MP4 (up to 90 seconds) from scenes: each scene is a filled image template or an https photo, shown for some seconds with a slow zoom or pan, joined by fades, with optional music. Returns a job id at once; call video_status with it until the status is done (usually 15 to 60 seconds) to get the MP4 link. Costs half a credit per second, rounded up.",
          "inputSchema": {
            "properties": {
              "audio_url": {
                "description": "Optional https MP3, M4A, AAC or WAV, trimmed to the video.",
                "type": "string"
              },
              "scenes": {
                "items": {
                  "properties": {
                    "image_url": {
                      "description": "An https photo, instead of a template.",
                      "type": "string"
                    },
                    "modifications": {
                      "additionalProperties": true,
                      "description": "Slot values, as in render_image.",
                      "type": "object"
                    },
                    "motion": {
                      "default": "zoom_in",
                      "enum": ["none", "zoom_in", "zoom_out", "pan_left", "pan_right"],
                      "type": "string"
                    },
                    "seconds": {
                      "default": 3,
                      "maximum": 30,
                      "minimum": 1,
                      "type": "number"
                    },
                    "template": {
                      "description": "Template id from list_templates. Every template in one video must be the same size.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "transition": {
                "default": "fade",
                "enum": ["fade", "cut"],
                "type": "string"
              }
            },
            "required": ["scenes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e2fd3e9d6432f29ecd54afaef6c6d1052d5d413e3d269efc8d38bea8e8d19ba8"
        },
        {
          "name": "video_status",
          "title": "Check a video job",
          "description": "Status of a render_video job: queued, rendering, done (with the MP4 link, kept 30 days) or failed (credits refunded).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The id render_video returned, like vid_...",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5fd11f7766d68f4e7b015afc14f6be343e3f1b7943b3085332efdb50581fc96"
        }
      ],
      "digest": "sha256:bcd6d525bf4bb67349aecb4ac52a9b0b3f97f6d314c3cb38d6385aca40f36120"
    }
  }
}
