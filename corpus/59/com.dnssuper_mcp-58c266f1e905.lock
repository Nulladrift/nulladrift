        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DNS Super checks domains, DNS, email setup, certificates and websites using data straight from the source. Each tool's description states its cost in credits; outputs are compact by default, pass detail='full' for everything.",
      "tools": [
        {
          "name": "analyze_email_headers",
          "title": "Email header analyzer",
          "description": "Read pasted email headers: every hop with its delay and encryption, the receiver's SPF, DKIM and DMARC results, alignment with the From domain, ARC sets and spam scores. The headers are processed in memory and never stored. Paste everything above the message text, as 'Show original' shows it. Free; any API key works and nothing is charged. What you paste is processed in memory and never stored. Returns about 15 lines of text; pass detail='full' for the complete JSON result.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "compact",
                "description": "'compact' (default) for a short text summary, 'full' for the JSON.",
                "enum": ["compact", "full"],
                "title": "Detail",
                "type": "string"
              },
              "headers": {
                "description": "The raw message headers (a whole message works too; only headers are read).",
                "maxLength": 262144,
                "minLength": 1,
                "title": "Headers",
                "type": "string"
              }
            },
            "required": ["headers"],
            "title": "analyze_email_headersArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Email header analyzer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3968c790ad341586a04856b1935fa3ab231d27fe7d0714207aed5122fc7c6d3e"
        },
        {
          "name": "audit_accessibility",
          "title": "Basic accessibility",
          "description": "Run basic automated accessibility checks on one page: language, title, images without alt text, form fields without labels, links and buttons without names, heading order, landmarks and zoom, each with an example element. With contrast=true it also runs axe-core in a headless browser for colour contrast and more rules; that runs as a job: waits up to 45 seconds, then returns a job ID you pass back as job_id. Costs 2 credits per call; cached answers cost the same. Contrast mode costs 5 credits and runs as a job: reserved when it starts, charged when it finishes, and only 2 if the browser part fails. Calls that fail upstream (502) and failed runs are free. Returns about 15 lines of text; pass detail='full' for the complete JSON result.",
          "inputSchema": {
            "properties": {
              "contrast": {
                "default": false,
                "description": "Also load the page in a headless browser and run axe-core (colour contrast and more rules). Costs 5 credits and runs as a job.",
                "title": "Contrast",
                "type": "boolean"
              },
              "detail": {
                "default": "compact",
                "description": "'compact' (default) for a short text summary, 'full' for the JSON.",
                "enum": ["compact", "full"],
                "title": "Detail",
                "type": "string"
              },
              "fresh": {
                "default": false,
                "description": "Skip the cache and check again. Costs the same as a cached answer.",
                "title": "Fresh",
                "type": "boolean"
              },
              "job_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The job ID an earlier contrast call returned, to get its result.",
                "title": "Job Id"
              },
              "url": {
                "description": "A page URL or a domain; a domain means its home page.",
                "maxLength": 2048,
                "minLength": 1,
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "audit_accessibilityArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Basic accessibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e0af607818ae34f5b91918a9f657e695508cfa89f9fed1e017d0bfa5d092f9ac"
        },
        {
          "name": "audit_email",
          "title": "Email setup audit",
          "description": "Audit a domain's email setup: MX hosts, SPF with its DNS lookup count, DMARC policy and report addresses, DKIM keys at the provider's and common selectors, and MTA-STS, TLS-RPT and BIMI verdicts, graded A to F with findings. Accepts a domain or an email address. Costs 2 credits per call; cached answers cost the same. Calls that fail upstream (502) are free. Returns about 15 lines of text; pass detail='full' for the complete JSON result.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "compact",
                "description": "'compact' (default) for a short text summary, 'full' for the JSON.",
                "enum": ["compact", "full"],
                "title": "Detail",
                "type": "string"
              },
              "domain": {
                "description": "A domain, URL or email address, e.g. example.com. For an address only the part after @ is used.",
                "maxLength": 2048,
                "minLength": 1,
                "title": "Domain",
                "type": "string"
              },
              "fresh": {
                "default": false,
                "description": "Skip the cache and check again. Costs the same as a cached answer.",
                "title": "Fresh",
                "type": "boolean"
              },
              "selector": {
                "anyOf": [
                  {
                    "maxLength": 253,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A DKIM selector to try first, such as s1.",
                "title": "Selector"
              }
            },
            "required": ["domain"],
            "title": "audit_emailArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Email setup audit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5423ddb1bb8b56cad2964cabf048ddc70afc8cc09fe8c4f0c35488d24e5a258a"
        },
        {
          "name": "audit_seo",
          "title": "Technical SEO audit",
          "description": "Audit one page for technical SEO: whether search engines may index it (robots.txt, noindex, status), its canonical link, title, description and headings, the sitemap, redirects and signs that it needs JavaScript, graded A to F. With rendered=true it also loads the page in a headless browser and compares; that runs as a job: waits up to 45 seconds, then returns a job ID you pass back as job_id. Costs 3 credits per call; cached answers cost the same. Rendered mode costs 8 credits and runs as a job: reserved when it starts, charged when it finishes, and only 3 if the browser part fails. Calls that fail upstream (502) and failed runs are free. Returns about 15 lines of text; pass detail='full' for the complete JSON result.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "compact",
                "description": "'compact' (default) for a short text summary, 'full' for the JSON.",
                "enum": ["compact", "full"],
                "title": "Detail",
                "type": "string"
              },
              "fresh": {
                "default": false,
                "description": "Skip the cache and check again. Costs the same as a cached answer.",
                "title": "Fresh",
                "type": "boolean"
              },
              "job_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The job ID an earlier rendered call returned, to get its result.",
                "title": "Job Id"
              },
              "rendered": {
                "default": false,
                "description": "Load the page in a headless browser and compare with the raw HTML. Costs 8 credits and runs as a job.",
                "title": "Rendered",
                "type": "boolean"
              },
              "url": {
                "description": "A page URL or a domain; a domain means its home page.",
                "maxLength": 2048,
                "minLength": 1,
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "audit_seoArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Technical SEO audit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7446c7fbaef1ba57bd0488a9bac8838eb155edb21ad73583b4e855379ea499a0"
        },
        {
          "name": "build_dns_record",
          "title": "DNS record builder",
          "description": "Build an SPF, DMARC or CAA record from settings, or check a pasted SPF record (kind spf with settings.record). Returns the record, where it goes, a zone file line and any findings. Settings fields by kind: spf: record, providers, includes, ip4, ip6, a, mx, all; dmarc: policy, subdomain_policy, pct, rua, ruf, adkim, aspf, fo; caa: issue, wildcard, issuewild, validation_methods, account_uri, iodef, current_issuer. SPF provider ids: google-workspace, microsoft-365, zoho-mail, fastmail, proton-mail, hostinger-mail, icloud-mail, sendgrid, mailgun, amazon-ses, mailchimp, postmark, brevo, sparkpost, hubspot, zendesk. CAA authority ids: letsencrypt, google-trust-services, ssl-com, digicert, sectigo, globalsign, amazon, entrust, buypass, godaddy. Free; any API key works and nothing is charged. Returns about 15 lines of text; pass detail='full' for the complete JSON result.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "compact",
                "description": "'compact' (default) for a short text summary, 'full' for the JSON.",
                "enum": ["compact", "full"],
                "title": "Detail",
                "type": "string"
              },
              "domain": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Your domain, e.g. example.com; names the record and counts SPF lookups.",
                "title": "Domain"
              },
              "kind": {
                "description": "Which record to build: spf, dmarc or caa.",
                "enum": ["spf", "dmarc", "caa"],
                "title": "Kind",
                "type": "string"
              },
              "settings": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "a": {
                        "description": "The domain's own web server sends mail.",
                        "type": "boolean"
                      },
                      "all": {
                        "default": "~all",
                        "description": "What receivers do with mail from anyone else.",
                        "enum": ["-all", "~all"],
                        "type": "string"
                      },
                      "includes": {
                        "description": "Other include domains, one per line.",
                        "items": {
                          "maxLength": 253,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array",
                        "x-widget": "lines"
                      },
                      "ip4": {
                        "description": "IPv4 addresses or ranges that send mail, one per line.",
                        "items": {
                          "maxLength": 18,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array",
                        "x-widget": "lines"
                      },
                      "ip6": {
                        "description": "IPv6 addresses or ranges that send mail, one per line.",
                        "items": {
                          "maxLength": 43,
                          "type": "string"
                        },
                        "maxItems": 50,
                        "type": "array",
                        "x-widget": "lines"
                      },
                      "mx": {
                        "description": "The domain's mail servers also send mail.",
                        "type": "boolean"
                      },
                      "providers": {
                        "description": "Mail services that send for your domain.",
                        "items": {
                          "pattern": "^[a-z0-9-]{1,40}$",
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array",
                        "uniqueItems": true,
                        "x-widget": "checkboxes"
                      },
                      "record": {
                        "description": "An existing SPF record to check instead of building one.",
                        "maxLength": 2048,
                        "type": "string",
                        "x-mono": true,
                        "x-widget": "textarea"
                      }
                    },
                    "title": "spf",
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "adkim": {
                        "default": "r",
                        "description": "DKIM alignment, relaxed or strict.",
                        "enum": ["r", "s"],
                        "type": "string",
                        "x-advanced": true
                      },
                      "aspf": {
                        "default": "r",
                        "description": "SPF alignment, relaxed or strict.",
                        "enum": ["r", "s"],
                        "type": "string",
                        "x-advanced": true
                      },
                      "fo": {
                        "description": "When failure reports are sent.",
                        "enum": ["0", "1", "d", "s"],
                        "type": "string",
                        "x-advanced": true
                      },
                      "pct": {
                        "default": 100,
                        "description": "Percentage of failing mail the policy applies to.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "policy": {
                        "description": "What receivers do with mail that fails DMARC.",
                        "enum": ["none", "quarantine", "reject"],
                        "type": "string"
                      },
                      "rua": {
                        "description": "Addresses for daily aggregate reports, one per line.",
                        "items": {
                          "maxLength": 254,
                          "type": "string"
                        },
                        "maxItems": 5,
                        "type": "array",
                        "x-widget": "lines"
                      },
                      "ruf": {
                        "description": "Addresses for failure reports, one per line.",
                        "items": {
                          "maxLength": 254,
                          "type": "string"
                        },
                        "maxItems": 5,
                        "type": "array",
                        "x-advanced": true,
                        "x-widget": "lines"
                      },
                      "subdomain_policy": {
                        "description": "A different policy for subdomains; leave empty to use the main policy.",
                        "enum": ["none", "quarantine", "reject"],
                        "type": "string"
                      }
                    },
                    "required": ["policy"],
                    "title": "dmarc",
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "account_uri": {
                        "description": "Your ACME account URI; only with exactly one authority.",
                        "maxLength": 512,
                        "type": "string",
                        "x-advanced": true
                      },
                      "current_issuer": {
                        "description": "The authority that issued your current certificate, to warn before locking it out.",
                        "maxLength": 253,
                        "type": "string",
                        "x-advanced": true
                      },
                      "iodef": {
                        "description": "Where authorities report refused requests (mailto or https).",
                        "maxLength": 512,
                        "type": "string",
                        "x-advanced": true
                      },
                      "issue": {
                        "description": "Certificate authorities allowed to issue, by id or CAA identifier; an empty list means no authority may issue.",
                        "items": {
                          "maxLength": 253,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array",
                        "x-widget": "lines"
                      },
                      "issuewild": {
                        "description": "Authorities allowed to issue wildcard certificates, when wildcard is custom.",
                        "items": {
                          "maxLength": 253,
                          "type": "string"
                        },
                        "maxItems": 10,
                        "type": "array",
                        "x-advanced": true,
                        "x-widget": "lines"
                      },
                      "validation_methods": {
                        "description": "Allowed validation methods, for every authority listed.",
                        "items": {
                          "enum": ["dns-01", "http-01", "tls-alpn-01"],
                          "type": "string"
                        },
                        "type": "array",
                        "uniqueItems": true,
                        "x-advanced": true,
                        "x-widget": "checkboxes"
                      },
                      "wildcard": {
                        "default": "same",
                        "description": "Who may issue wildcard certificates.",
                        "enum": ["same", "none", "custom"],
                        "type": "string"
                      }
                    },
                    "required": ["issue"],
                    "title": "caa",
                    "type": "object"
                  }
                ],
                "description": "The builder's settings; the fields depend on kind (see the description).",
                "title": "Settings"
              }
            },
            "required": ["kind", "settings"],
            "title": "build_dns_recordArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DNS record builder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d7b992db47feed4ccb6f334724a02b17d2c4e98611f2f33a1a4cd03bae07b5aa"
        },
        {
          "name": "bulk_run",
          "title": "Bulk check",
          "description": "Start a bulk check: run one tool over up to 500 names as a job (each row costs the tool's price; rows without a result are free). Returns the job ID at once; follow it with get_job. Use dry_run=true first to see row errors, credits and the estimated time. Each row costs its tool's price. The most it can cost is reserved when the job starts, and only finished rows are charged. Failed rows are free. Returns about 15 lines of text; pass detail='full' for the complete JSON result.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "compact",
                "description": "'compact' (default) or 'full' (row errors, columns).",
                "enum": ["compact", "full"],
                "title": "Detail",
                "type": "string"
              },
              "dry_run": {
                "default": false,
                "description": "Show rows, errors, credits and time; start nothing.",
                "title": "Dry Run",
                "type": "boolean"
              },
              "label": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Your name for the job.",
                "title": "Label"
              },
              "options": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Tool parameters for every row, such as {'types': 'A,MX'}.",
                "title": "Options"
              },
              "targets": {
                "description": "Names, one per row.",
                "items": {
                  "maxLength": 253,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 1,
                "title": "Targets",
                "type": "array"
              },
              "tool": {
                "description": "The registry id of the tool to run, such as 'dns-lookup'.",
                "maxLength": 64,
                "minLength": 1,
                "title": "Tool",
                "type": "string"
              }
            },
            "required": ["targets", "tool"],
            "title": "bulk_runArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Bulk check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2dcbedad0d0f80fd0b4ca1b6cb690e3fe3bf5c35df602627b1412774bd3dac05"
