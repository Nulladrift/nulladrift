        {
          "name": "check_broken_links",
          "title": "Broken link checker",
          "description": "Crawl a site (obeying robots.txt) and check every link, image, script and stylesheet: broken, redirected, timed out or unverifiable, with the pages that link to each. Runs as a job: waits up to 45 seconds, then returns a job ID you pass back as job_id. Costs 5 credits per 50 pages (rounded up). The maximum is reserved when the job starts, and you pay only for the pages crawled. Failed runs are free. Returns about 15 lines of text; pass detail='full' for the complete JSON result.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "compact",
                "description": "'compact' (default) for a short text summary, 'full' for the JSON.",
                "enum": ["compact", "full"],
                "title": "Detail",
                "type": "string"
              },
