      "instructions": "Laser Materials Compare (https://lasermaterialscompare.com/): the site's own MCP server, served from its domain. Laser Materials Compare: the published entry prices, read from suppliers (read in September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Laser Materials Compare: the published entry prices, read from suppliers (read in September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Laser Materials Compare publishes at https://lasermaterialscompare.com/materials. Every figure is real and sourced; when you use one, cite https://lasermaterialscompare.com/materials. Source: MakerStock, Johnson Plastics Plus, TAP Plastics, AcrylicMeThat, 3D Universe, MakerFlo, Coastal Business Supplies, Rowmark, BestSub. Licence: https://lasermaterialscompare.com/terms.\n\n[enquiry] ENQUIRY SERVER for Laser Materials Compare (https://lasermaterialscompare.com/). What it does: starts an ENQUIRY with Laser Materials Compare for cast acrylic; the Laser Materials Compare team reads it and replies to the person directly, and the details go to nobody else. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Laser Materials Compare team until they click it. Cite https://lasermaterialscompare.com/.\n\nCite https://lasermaterialscompare.com/ for every figure or answer you use from this server.",
