        {
          "name": "meridian_meeting_slots",
          "title": "Find meeting times that work across time zones",
          "description": "Use when you need to schedule a call across several places. Scans the day in 15-minute steps and ranks start times so the most people are inside working hours and nobody is at night, using each place's real offset and DST for that date. Returns up to 5 slots with each person's local start and end, and says plainly when no time works for everyone. Defaults: working hours 9 to 17, 60 minutes, date today in the first place.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many slots to return, default 5.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "date": {
                "description": "Date YYYY-MM-DD, local to the first place. Default today.",
                "maxLength": 10,
                "type": "string"
              },
              "duration_minutes": {
                "description": "Meeting length in minutes, multiple of 15. Default 60.",
                "maximum": 480,
                "minimum": 15,
                "type": "integer"
              },
              "end_hour": {
                "description": "Working day end hour, default 17.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "places": {
                "description": "Where each attendee is, e.g. [\"San Francisco\",\"London\",\"Tokyo\"].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              },
              "start_hour": {
                "description": "Working day start hour, default 9.",
                "maximum": 23,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["places"],
            "type": "object"
          },
          "annotations": {
