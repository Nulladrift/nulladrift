        "name": "com.clawhard/studio",
        "title": "Clawhard Studio",
        "version": "1.14.0",
        "description": "The Clawhard MCP server gives AI assistants 25 tools from Clawhard Studio: count tokens exactly, check color contrast, tell and convert time across zones, show cron next runs, check that npm and PyPI packages exist, repair and query JSON, check who can read Supabase tables, find and redact leaked API keys, check a domain's email setup (SPF, DKIM, DMARC), check which AI bots a site lets in, split group costs and build event schedules. No API key.",
        "websiteUrl": "https://clawhard.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
