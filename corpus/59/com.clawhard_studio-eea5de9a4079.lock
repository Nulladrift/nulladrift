        {
          "name": "meridian_convert_time",
          "title": "Convert a time between time zones, DST-correct",
          "description": "Use when you need to convert a specific wall-clock time from one place to others, for any date. It uses the real tz database, so daylight saving is right for that exact date (the US and Europe switch on different weeks), and it warns when the time does not exist (spring forward) or happens twice (fall back). Time accepts \"15:00\", \"3:30pm\", \"noon\", \"now\" or an ISO local time like 2026-11-05T15:00 (no Z). Date defaults to today in the source zone. Returns {input, utc, source:{...}, converted:[{place, zone, local, time_12h, date, utc_offset, abbreviation, day_note, hours_ahead_of_source}], warning?, summary, open_url}.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional date YYYY-MM-DD in the source zone. Default today.",
                "maxLength": 10,
                "type": "string"
              },
              "from": {
                "description": "Source place or zone, e.g. \"New York\" or \"America/New_York\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "time": {
                "description": "Local time in the source place, e.g. \"15:00\", \"3:30pm\", \"noon\", \"now\", \"2026-11-05T15:00\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "Destination places, e.g. [\"London\",\"Tokyo\"].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["from", "time", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert a time between time zones, DST-correct"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
