          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Clawhard Studio: small tools that return exact, checkable answers. tokendiet_count_tokens: exact token counts and context-window fit. swatch_check_contrast, swatch_fix_contrast, swatch_make_scale, swatch_check_pairs: WCAG and APCA contrast, the nearest passing color, 50-950 palettes and color formats. meridian_now, meridian_convert_time, meridian_meeting_slots, meridian_zone_info: current time, DST-correct conversion and meeting slots. tick_next_runs, tick_matches: cron next runs with DST warnings. notary_check_packages: whether npm and PyPI packages (and pinned versions) really exist, with age, downloads, deprecation, install scripts and look-alike warnings. xray_scan_text: invisible Unicode, tag-character (ASCII smuggling) messages decoded, bidi overrides and look-alike letters in text or a public file, with line and column. mend_repair_json, mend_outline_json, mend_query_json: repair JSON without changing values, outline a big payload, extract fields by path. deadbolt_check_supabase_access, deadbolt_catalog_query: who can read and write each Supabase table, with fix SQL. spill_scan_secrets: API keys, tokens, private keys and passwords in text (masked) plus a redacted copy. stamp_check_email_domain, stamp_check_dns_record: SPF, DKIM, DMARC and MX from live DNS, sender-rule status and fix records. doorman_check_ai_bot_access: which AI bots a site or a robots.txt text lets in. halves_settle_up, halves_create_group_link: the fewest payments that settle a group, or a shared group page. runsheet_create_schedule: a live shareable event schedule. Results that save something include a link (open_url, group_url or view_url); a runsheet edit_url gives edit access. Results include a short text summary and structuredContent, and render as an interactive card in hosts that support MCP Apps.",
      "tools": [
        {
          "name": "deadbolt_catalog_query",
          "title": "Get the read-only SQL that snapshots a live Supabase database for Deadbolt",
          "description": "Use when you need to check a live Supabase project rather than migration files: returns a read-only SQL query that reads table RLS settings, grants for anon and authenticated, policies, SECURITY DEFINER functions and storage buckets (never row data) and returns one JSON value. Run it with the user's Supabase SQL Editor or a Supabase MCP execute_sql tool, then pass the JSON to deadbolt_check_supabase_access.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the read-only SQL that snapshots a live Supabase database for Deadbolt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d50ce88d1fedb0f27abd5b93aefd9c6ca90d19a061fd37d78b801411056e1982"
        },
        {
          "name": "deadbolt_check_supabase_access",
          "title": "Check who can read and write Supabase tables (RLS, policies, grants)",
          "description": "Use when you write, review or are about to apply Supabase / PostgreSQL migration SQL (CREATE TABLE, RLS, CREATE POLICY, GRANT, views, SECURITY DEFINER functions, storage buckets), or when a user asks whether their Supabase data is exposed, whether RLS is set up right, or why a query returns 42501 permission denied or no rows. Replays the SQL with real Postgres rules and returns, per table, what signed-out (anon) and signed-in (authenticated) users can SELECT/INSERT/UPDATE/DELETE (all rows, own rows, some rows, none, or denied for a missing grant), plus findings with severity and ready-to-run fix SQL: RLS off, policies written but RLS never enabled, using(true) writes, personal columns readable by anyone, views that bypass RLS, SECURITY DEFINER functions anyone can call, user_metadata in policies, public bucket listing, grants missing after the Oct 30 2026 default change. Also accepts the JSON produced by deadbolt_catalog_query for the live database. Deterministic; never connects to any database. Up to 200,000 characters.",
          "inputSchema": {
            "properties": {
              "project_created_before_2026_10_30": {
                "description": "Only for SQL input. true (default): the project grants new public tables to anon and authenticated automatically (projects created before Oct 30, 2026). false: new tables get no grants unless the SQL grants them (projects created on or after Oct 30, 2026).",
                "type": "boolean"
              },
              "sql": {
                "description": "Migration SQL (one or many files concatenated, in order), or the single JSON value returned by the catalog query.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["sql"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check who can read and write Supabase tables (RLS, policies, grants)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/deadbolt/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/deadbolt/result"
          },
          "digest": "sha256:6c0fa9871ee5a3c23644585511f8fb5ef3aa3f4ae2dd62aff2fb8dc88fdb4fc2"
        },
        {
          "name": "doorman_check_ai_bot_access",
          "title": "See which AI bots a website lets in",
          "description": "Use when the user asks whether their site (or any public site), or a robots.txt they pasted, blocks ChatGPT, Claude, Google AI, Perplexity or other AI crawlers, whether AI can read or train on their content, or why AI search does not mention their site. Fetches the live robots.txt and reports, for 22 named AI bots in four groups (AI training, AI search, assistants, search engines), which are let in, kept out or partly blocked, plus the site's content-signal preference and fixes. Example: {\"url\": \"example.com\"} or {\"robots_txt\": \"User-agent: GPTBot\\nDisallow: /\"}. Pass robots_txt instead of url to check a draft or pasted file without fetching anything. Read-only.",
          "inputSchema": {
            "properties": {
              "robots_txt": {
                "description": "robots.txt text to check instead of fetching a site (a draft or a pasted file, up to 512 KB). Empty means no robots.txt.",
                "minLength": 0,
                "type": "string"
              },
              "url": {
                "description": "Website address or domain, e.g. nytimes.com. Send this or robots_txt.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "See which AI bots a website lets in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
