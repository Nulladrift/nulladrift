      "instructions": "Company Finders finds local businesses with no website, or with a broken or out-of-date one, in the US, Canada, the UK, Australia, New Zealand and Ireland.\nBusiness listings come from Google Maps listings. The website check is Company Finders' own, made at the time of the call.\nCounting is free. A list costs 1 credit per business ($3 per 1,000). A single website check costs 1 credit ($0.003). A call that fails costs nothing.\nA list takes one to three minutes to build around a city and a few minutes for a whole country: call build_list, then get_list with its id until status is done.\ncount_businesses and build_list start a new count for a search not counted in the last 30 days. A key may start 200 new counts a day (UTC), the two together; past that they answer rate_limited until 00:00 UTC. A search already counted uses none of the day's new counts, so count first and build the lists you choose.\nA business reported as having no website may still have one it never linked on its listing. A site reported as could_not_check means we could not find out that day (no answer after 4 tries, a page that stopped loading partway, a site that turned automated visitors away, or our time limit ran out). It is not known to be broken or fine. Say so when you report results.\nseo_audit runs a Full SEO audit of one website: it opens up to 20, 50 or 100 of its pages (size, default 100) and lists every issue found, with every affected page. A Full SEO audit costs 15 credits for each page audited, at most 1,500, with no minimum. The most its size can cost is held when it starts, and the rest comes back when it is done. An audit that cannot run costs 0 credits, and pages past the size are listed as not checked and not charged. Call seo_audit with site to start it, then with the id it returns until status is done; an audit of 100 pages takes a few minutes. Report findings in the words the result gives (title, what_it_means, how_to_fix). A no_score result is about whether the website could be scanned that day, not about how good it is.\nBusinesses whose listing marks them as permanently closed are left out of every count and list and are never charged for; temporarily closed ones stay in, with temporarily_closed set to yes.\nhours_on_listing, temporarily_closed, photos_on_listing, other_categories and description_on_listing are what the Google listing showed on the day it was fetched, not facts about today: report hours as \"hours shown on the listing\", never as whether a business is open now. google_place_id matches a business across lists. same_phone_listing_with_website, on a row with no website, names another listing in the same list with the same phone that shows a website: report it as \"another listing with the same phone shows a website\", and keep the row as no website. listing_updated_on is the day the data provider last refreshed the listing, not a day the business changed it. Lists built before these columns existed have them blank.",
      "tools": [
        {
          "name": "build_list",
          "title": "Build a checked list",
          "description": "Starts building a list: up to 10,000 that list no website and up to 1,000 that list one, the most-reviewed of each, with each listed website visited now. Costs 1 credit per business ($3 per 1,000), taken when the build starts; unused credits come back. Permanently closed businesses are left out and not charged for. Returns an id; call get_list with it until status is done.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City as \"Austin, TX\", \"Leeds, UK\" or \"Toronto, ON\". Send a country's name as city (United States, United Kingdom, Canada, Australia, New Zealand or Ireland) for one type in the whole country, written as here: radius_km is then ignored and min_reviews must be left out, so there is no distance and every business is counted. There are no state or region lists. A name several cities share, such as \"Springfield\" or \"Kansas City\", is read as the largest of them. To be sure of the city, send its full label as /api/v1/cities gives it, for example \"Springfield, IL\". When the name sent is shared, a count or new-list answer also has place_chosen, the full label of the city used, and other_places, the labels of up to 5 other cities of that name, largest first. Both are left out when the name is not shared.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "min_reviews": {
                "description": "Only businesses with at least this many reviews: 0, 5 or 20. Default 0.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "radius_km": {
                "description": "Distance from the city centre in km: 10, 25, 50, 100, 200. Default 25. Ignored for a whole country.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "type": {
                "description": "Business type id, for example plumber or hair_salon. list_business_types gives them all.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["city", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a checked list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28ed8a8d83ac0dbadba4cda5f9ba46d8438f33550433327bbf1235733f4a3e19"
