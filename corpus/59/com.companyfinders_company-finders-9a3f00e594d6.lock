      "serverInfo": {
        "name": "company-finders",
        "title": "Company Finders",
        "version": "1.0.0",
        "websiteUrl": "https://companyfinders.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Company Finders finds local businesses with no website, or with a broken or out-of-date one, in the US, Canada, the UK, Australia, New Zealand and Ireland.\nBusiness listings come from Google Maps listings. The website check is Company Finders' own, made at the time of the call.\nCounting is free. A list costs 1 credit per business ($3 per 1,000). A single website check costs 1 credit ($0.003). A call that fails costs nothing.\nA list takes one to three minutes to build: call build_list, then get_list with its id until status is done.\nA business reported as having no website may still have one it never linked on its listing. A site reported as could_not_check turned the checker away and is not known to be broken. Say so when you report results.",
      "tools": [
        {
          "name": "build_list",
          "title": "Build a checked list",
          "description": "Starts building the full list: every business, with each listed website visited now. Costs 1 credit per business ($3 per 1,000), taken when the build starts; unused credits come back. Returns an id; call get_list with it until status is done.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City as \"Austin, TX\", \"Leeds, UK\" or \"Toronto, ON\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "min_reviews": {
                "description": "Only businesses with at least this many reviews: 0, 5 or 20. Default 0.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "radius_km": {
                "description": "Distance from the city centre in km: 10, 25, 50. Default 25.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "type": {
                "description": "Business type id, for example plumber or hair_salon. list_business_types gives them all.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["city", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a checked list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5565d7042348bf415525116f78701343e7862356d3f17ad14ebac8a046bda896"
        },
        {
          "name": "check_website",
          "title": "Check one website",
          "description": "Visits one website now and reports whether it loads, is broken or looks out of date, with the reason. Costs 1 credit ($0.003).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The website address, for example example.com.",
