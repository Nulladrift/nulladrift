      "instructions": "Company Finders finds local businesses with no website, or with a broken or out-of-date one, in the US, Canada, the UK, Australia, New Zealand and Ireland.\nBusiness listings come from Google Maps listings. The website check is Company Finders' own, made at the time of the call.\nCounting is free. A list costs 1 credit per business ($3 per 1,000). A single website check costs 1 credit ($0.003). A call that fails costs nothing.\nA list takes one to three minutes to build: call build_list, then get_list with its id until status is done.\nA business reported as having no website may still have one it never linked on its listing. A site reported as could_not_check means we could not find out that day (no answer after 4 tries, a page that stopped loading partway, a site that turned automated visitors away, or our time limit ran out). It is not known to be broken or fine. Say so when you report results.\nBusinesses whose listing marks them as permanently closed are left out of every count and list and are never charged for; temporarily closed ones stay in, with temporarily_closed set to yes.\nhours_on_listing, temporarily_closed, photos_on_listing, other_categories and description_on_listing are what the Google listing showed on the day it was fetched, not facts about today: report hours as \"hours shown on the listing\", never as whether a business is open now. google_place_id matches a business across lists. same_phone_listing_with_website, on a row with no website, names another listing in the same list with the same phone that shows a website: report it as \"another listing with the same phone shows a website\", and keep the row as no website. listing_updated_on is the day the data provider last refreshed the listing, not a day the business changed it. Lists built before these columns existed have them blank.",
      "tools": [
        {
          "name": "build_list",
          "title": "Build a checked list",
          "description": "Starts building a list: up to 1,000 that list no website and up to 1,000 that list one, the most-reviewed of each, with each listed website visited now. Costs 1 credit per business ($3 per 1,000), taken when the build starts; unused credits come back. Permanently closed businesses are left out and not charged for. Returns an id; call get_list with it until status is done.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City as \"Austin, TX\", \"Leeds, UK\" or \"Toronto, ON\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "min_reviews": {
                "description": "Only businesses with at least this many reviews: 0, 5 or 20. Default 0.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "radius_km": {
                "description": "Distance from the city centre in km: 10, 25, 50. Default 25.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "type": {
                "description": "Business type id, for example plumber or hair_salon. list_business_types gives them all.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["city", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a checked list"
          },
          "behavior": {
