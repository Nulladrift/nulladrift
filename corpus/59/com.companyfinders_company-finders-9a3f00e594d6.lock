          "name": "seo_audit",
          "title": "Full SEO audit of one website",
          "description": "Starts a Full SEO audit of one website (give site, and size 20, 50 or 100 pages, default 100), or reads one (give id). The result has the score out of 100 and its four parts, the issues to fix first and every other finding in plain words with every affected page, the pages audited, and the pages not checked with why. A Full SEO audit costs 15 credits for each page audited, at most 1,500, with no minimum. The most its size can cost is held when it starts, and the rest comes back when it is done. An audit that cannot run costs 0 credits, and pages past the size are listed as not checked and not charged. Reading an audit is free.",
