      },
      "instructions": "This server estimates what a company's operational data could be worth when licensed to AI labs, and lets the owner request a real offer.\nHow to use it:\n1. Call assessment_checklist to see which counts the estimate needs.\n2. Inputs come from the user, or from figures the user has already asked you to gather. Counts and date ranges only. Never send message text, customer names, file contents or any personal data to this server.\n3. Ask the user for any number you do not have. Do not guess. Tell the user which figures were measured and which were estimated.\n4. Call estimate_data_value with the summary numbers. Show the range as an indicative estimate, not an offer.\n5. Each estimate ends with an offer_prompt line for the owner. Only if the user asks for an offer or rights review (for example by saying \"check my data rights\", \"get me offers\" or \"review my data\"), collect their contact details, read them back, get a clear yes, then call request_offer.\nIndicative only, not a market valuation or buyer offer. Subject to eligibility, data review and agreed terms.",
      "tools": [
        {
          "name": "assessment_checklist",
          "title": "What to measure before estimating",
          "description": "Returns a checklist of company details and summary counts used to assess business data for licensing. Requires no company details. Usage metadata is recorded as described in the privacy notice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "categories": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "examples": {
                      "type": "string"
                    },
                    "measure": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["category", "examples", "measure"],
                  "type": "object"
                },
                "type": "array"
              },
              "company_facts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "privacy_rule": {
                "type": "string"
              },
              "rules": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["categories", "company_facts", "privacy_rule", "rules"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What to measure before estimating"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fdce729b1752fedfadc50cecba5d073330fea7aeeab4ae3d368cbec438f3418"
        },
        {
          "name": "estimate_data_value",
          "title": "Estimate data licensing value",
          "description": "Calculates an indicative data licensing range from headcount, founding year, region and number of business systems. Smaller companies receive a clearly labelled rough estimate. Record volumes do not currently affect the calculation. Returns a link that opens the website calculator with the same inputs. Does not submit an enquiry. Usage metadata is recorded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Where the company is based: us, ca (Canada), uk, eu, anz (Australia or New Zealand), other.",
                "enum": ["us", "ca", "uk", "eu", "anz", "other"],
                "type": "string"
              },
              "employees": {
                "description": "Approximate number of staff.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "founded_year": {
                "description": "Year the company was founded.",
                "minimum": 1800,
                "type": "integer"
              },
              "slack_public_share": {
                "description": "Share of Slack channels that are public. The value no_slack means the company does not use Slack.",
                "enum": ["most", "half", "little", "unsure", "no_slack"],
                "type": "string"
              },
              "systems": {
                "description": "One entry per system that holds company data. May be empty if unknown.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "description": "What kind of system it is.",
                      "enum": ["chat", "crm", "support", "docs", "code", "email", "project", "finance", "other"],
                      "type": "string"
                    },
                    "exportable": {
                      "description": "Whether the owner can export the data.",
                      "enum": ["yes", "no", "unsure"],
                      "type": "string"
                    },
                    "measured": {
                      "description": "true if the figure is a measured count, false if it is an estimate provided by the user.",
                      "type": "boolean"
                    },
                    "people": {
                      "description": "Number of people who use it or appear in it.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "since_year": {
                      "description": "Year of the oldest data in this system.",
                      "minimum": 1980,
                      "type": "integer"
                    },
                    "tool": {
                      "description": "Product name, for example Slack, HubSpot, Zendesk, Notion, GitHub.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "volume": {
                      "description": "Short count such as \"40k messages\", \"12k tickets\", \"8k contacts\". Numbers only, no content.",
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["category", "tool"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["country", "employees", "founded_year", "systems"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "basis": {
                "type": "string"
              },
              "below_bar": {
                "description": "true when the company is below the size most buyers target and the figure is a rough band.",
                "type": "boolean"
              },
              "capped": {
                "type": "boolean"
              },
              "caveats": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "disclaimer": {
                "type": "string"
              },
              "estimate": {
                "const": true,
                "description": "Always true. This is an estimate.",
                "type": "boolean"
              },
              "estimate_url": {
                "description": "Link to the website calculator with the same inputs filled in.",
                "type": "string"
              },
              "headline": {
                "type": "string"
              },
              "high_usd": {
                "type": ["integer", "null"]
              },
              "low_usd": {
                "type": ["integer", "null"]
              },
              "next_step": {
                "type": "string"
              },
              "offer_prompt": {
                "description": "Owner-facing sentence explaining how to request offers.",
                "type": "string"
              },
              "qualifies": {
                "type": "boolean"
              },
              "range": {
                "type": ["string", "null"]
              },
              "region": {
                "type": "string"
              },
              "systems_counted": {
                "type": "integer"
              },
              "what_would_move_it": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "years_in_business": {
                "type": "integer"
              }
            },
            "required": ["caveats", "disclaimer", "estimate", "headline", "next_step", "qualifies", "what_would_move_it"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate data licensing value"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1461c2adb4dd0c11b2ac62eb06616083254c1e21524be40dfce9c38332559e5"
        },
        {
          "name": "request_offer",
          "title": "Request an offer from Sell My Company Data",
          "description": "Submits contact details and summary company information to Sell My Company Data for human review. Requires the user's explicit request, confirmed contact details and consent to be contacted. Creates an enquiry and triggers internal notifications and a confirmation email. Does not access or modify the user's connected apps. Repeated successful submissions create separate enquiries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai_client": {
                "description": "Which assistant is being used.",
                "enum": ["chatgpt", "claude", "other"],
                "type": "string"
              },
              "company": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "consent": {
                "description": "true only if the user agreed to be contacted about an offer.",
                "type": "boolean"
              },
              "country": {
                "description": "Where the company is based: us, ca (Canada), uk, eu, anz (Australia or New Zealand), other.",
                "enum": ["us", "ca", "uk", "eu", "anz", "other"],
                "type": "string"
              },
              "email": {
                "description": "Work email the user confirmed.",
                "maxLength": 200,
                "type": "string"
              },
              "employees": {
                "description": "Approximate number of staff.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "first_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "founded_year": {
                "description": "Year the company was founded.",
                "minimum": 1800,
                "type": "integer"
              },
              "is_authorized": {
                "description": "true if they are an owner or director, or are authorised to discuss data licensing for the company.",
                "type": "boolean"
              },
              "last_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "description": "Anything the user wants us to know. No personal data about other people.",
                "maxLength": 800,
                "type": "string"
              },
              "role": {
                "description": "Their position, for example Founder, CEO, Head of Operations.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "slack_public_share": {
                "description": "Share of Slack channels that are public. The value no_slack means the company does not use Slack.",
                "enum": ["most", "half", "little", "unsure", "no_slack"],
                "type": "string"
              },
              "systems": {
                "description": "One entry per system that holds company data. May be empty if unknown.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "description": "What kind of system it is.",
                      "enum": ["chat", "crm", "support", "docs", "code", "email", "project", "finance", "other"],
                      "type": "string"
                    },
                    "exportable": {
                      "description": "Whether the owner can export the data.",
                      "enum": ["yes", "no", "unsure"],
                      "type": "string"
                    },
                    "measured": {
                      "description": "true if the figure is a measured count, false if it is an estimate provided by the user.",
                      "type": "boolean"
                    },
                    "people": {
                      "description": "Number of people who use it or appear in it.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "since_year": {
                      "description": "Year of the oldest data in this system.",
                      "minimum": 1980,
                      "type": "integer"
                    },
                    "tool": {
                      "description": "Product name, for example Slack, HubSpot, Zendesk, Notion, GitHub.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "volume": {
                      "description": "Short count such as \"40k messages\", \"12k tickets\", \"8k contacts\". Numbers only, no content.",
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["category", "tool"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "website": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["company", "consent", "country", "email", "employees", "first_name", "founded_year", "is_authorized", "last_name", "role", "systems"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "lead_id": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "submitted": {
                "type": "boolean"
              }
            },
            "required": ["message", "submitted"],
            "type": "object"
          },
