          "digest": "sha256:9d52d4c45a4f13dff0db2ed7b901f5cf5ddc958829c56baa9c276316b67015af"
        },
        {
          "name": "bootstrap_energy_project",
          "description": "Create a persisted project context, provisional Energy Node score, coverage map, and immediately reusable assessmentId in one call. [$0.10/call]",
          "inputSchema": {
            "properties": {
              "apiKey": {
                "description": "Optional one-call credential bridge for MCP hosts that cannot change Authorization headers mid-session. Pass the key returned by create_builder_key; EnergyAI removes it from the request body before billing, execution, and persistence. Omit when the Bearer header is already attached.",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "country": {
                "default": "US",
                "enum": ["US", "CA", "GB", "DE", "AU", "OTHER"],
                "type": "string"
              },
              "monthlyBillRange": {
                "default": "unknown",
                "enum": ["lt_75", "75_150", "150_250", "250_400", "gt_400", "unknown"],
                "type": "string"
              },
              "postalCode": {
                "description": "Property ZIP or local postal code.",
                "type": "string"
              },
              "primaryGoal": {
                "default": "save_money",
                "enum": ["save_money", "resilience", "climate", "independence", "all"],
                "type": "string"
              },
              "propertyType": {
                "default": "other",
                "enum": ["single_family", "townhouse", "condo", "rental", "commercial", "farm", "other"],
                "type": "string"
              },
              "serviceType": {
                "default": "unsure",
                "enum": ["solar", "battery", "ev_charger", "efficiency", "heat_pump", "unsure"],
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "required": ["postalCode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:048dfacf8756996d6e86774c4c89963859ab340ff78b2b2e90784e2f7951789a"
        },
        {
          "name": "check_incentives",
          "description": "Clean-energy incentive source guidance by country and postal code; eligibility is not verified. US ZIP → federal status + state/utility programs (via DSIRE). Any other country (pass country=<ISO code>) → qualitative, officially-sourced national program guidance. Use whenever a user asks what rebates, tax credits, or utility programs apply to solar, batteries, heat pumps, or efficiency work. [20 anonymous calls/caller/24h; then 100 free calls/key/30d; active Builder required for sustained informational use]",
          "inputSchema": {
            "examples": [
              {
                "zipCode": "59715"
              },
              {
                "country": "DE",
                "zipCode": "10115"
              }
            ],
            "properties": {
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. Omit for US. Any country works — non-US results return qualitative, officially-sourced incentive guidance (never US federal credits).",
