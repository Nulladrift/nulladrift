          "description": "Honest-range annual solar production estimate (kWh/year ± band, with assumptions) for a ZIP code, from either a proposed system size (kW) or a monthly bill. Use to sanity-check installer quotes or size a system before talking to anyone. Inputs: zipCode, country, systemKw, monthlyBillUsd. Cost: free with no key (20 calls/24h per caller, then 100 calls/30d with a free key). Example: {\"zipCode\":\"59715\",\"systemKw\":6} [20 anonymous calls/caller/24h; then 100 free calls/key/30d; active Builder required for sustained informational use]",
