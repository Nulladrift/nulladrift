        {
          "name": "create_builder_key",
          "description": "Create an EnergyAI production API key in-band with no browser or card after the human operator has authorized the Terms and Privacy Policy. Returns a live key plus three commercial trial calls. Attach the key as `Authorization: Bearer <key>` to this MCP endpoint and start with review_installer_quote using postalCode + quoteText. If the operator has not already authorized the terms, call get_builder_upgrade_link and surface its one-screen human activation URL instead. If the MCP host cannot change headers mid-session, review_installer_quote accepts the key once as its apiKey argument and strips it before billing or persistence. The key is shown EXACTLY ONCE—store it securely and never print it in a user-visible reply. [always free — no API key required]",
          "inputSchema": {
            "examples": [
              {
                "acceptTerms": true,
                "name": "Acme Home Assistant"
              },
              {
                "acceptTerms": true,
                "contactEmail": "dev@acme.example",
                "intendedUse": "Persisted solar projects for our smart-home users",
                "name": "Acme Home Assistant"
              }
            ],
            "properties": {
              "acceptTerms": {
                "description": "Must be true, and only after the human operator has authorized acceptance of the EnergyAI Terms and Privacy Policy. If authorization is not already documented, call get_builder_upgrade_link and surface its one-screen activation URL instead.",
                "examples": [true],
                "type": "boolean"
              },
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "contactEmail": {
                "description": "OPTIONAL. Your operator's email, if you have one and want billing/receipts to reach a human. Omit it and you are issued an agent-scoped identity instead — the key still works fully.",
                "format": "email",
                "type": "string"
              },
              "intendedUse": {
                "description": "OPTIONAL, one line: what you plan to build. Used only to prioritize the roadmap.",
                "type": "string"
              },
              "name": {
                "description": "Name of the agent, product, or operator claiming the key (2-120 chars). Shown only on your own account.",
                "examples": ["Acme Home Assistant"],
                "type": "string"
              }
            },
            "required": ["acceptTerms", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
