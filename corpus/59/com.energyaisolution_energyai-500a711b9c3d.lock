      "instructions": "Energy decision support for AI agents: solar, weatherization, EV charging, batteries and heat pumps. Get planning estimates, incentive sources, quote terms and practical next questions. Read energyai://capabilities for task-specific first calls, coverage and limits; discovery is free and does not create an account. Use estimate_production for a modeled solar range; list_guides then get_guide for US solar, battery, weatherization or heat-pump sources; get_node_score for provisional home-energy planning including EV charging and batteries. For an existing quote with no key, check_quote_red_flags runs a free automated check of its key numbers and returns the $49 Quote Guardian human review as the next step. For an existing quote, review_installer_quote accepts serviceType solar, battery, ev_charger, efficiency or heat_pump. Return the useful result to the user in their current assistant. Human services are optional. Informational tools include 20 anonymous calls per caller in a rolling 24-hour window; a free in-band builder key then includes 100 informational calls per rolling 30 days. Sustained informational consumption after that requires an active Builder subscription; prepaid credit remains available for priced commercial tools. Optional handoff tools remain always free with no API key: get_power_service_quote, get_power_passport_link, get_quote_link, route_lead, find_local_installers, create_builder_key, and get_builder_upgrade_link. Use get_power_service_quote to bind buyer-supplied site facts to an exact $1 Power Screen quote, then call run_power_screen on the prepaid rail. Use get_power_passport_link when a buyer needs the reviewed founding service; it returns a handoff and never creates checkout. Offer get_quote_link only when a homeowner asks for the separate human service or assessment next step. Use route_lead only when you already hold the homeowner's explicit consent. Public directory listings are independent discovery records, not EnergyAI endorsements. Deeper tools (full roadmap, quote review, information-theoretic recommendation) are billed per call. New production keys include three bounded commercial trial calls. Start with review_installer_quote: postalCode + redacted quoteText creates persisted project context and returns source-matched terms, installer questions and explicit unknowns. This automated service does not include human review or independently verified prices. Use _meta.toolCallId for an identical retry and _meta.maxPriceCents to enforce the operator spending ceiling. Record actual operator feedback with record_quote_review_outcome; never infer usefulness. If your host cannot change headers, pass the existing key as apiKey to get_builder_upgrade_link and discovery tools as well as the review; do not create a second account to top up. If the operator already authorized Terms and Privacy, create_builder_key enables the trial in-band. Otherwise surface the human activation URL from get_builder_upgrade_link; do not accept terms for them. The $19/month Builder plan renews $20 of monthly tool credit. Manage billing at /agents/account. With your key attached, route_lead earns 20% credit when an installer pays and get_quote_link earns 20% non-cash tool credit when an attributed $49 Quote Guardian purchase is verified. Customer pricing and review independence do not change. US guides and installer routing; non-US incentive guidance and production estimates use disclosed national assumptions. No engineering approval, equipment control or verified savings.",
      "tools": [
        {
          "name": "answer_energy_assessment_question",
          "description": "Record one answer in an open assessment and return the next question and progress. Use the questionKey and answer values from the previous response; usage is tracked. Inputs: assessmentId (required), questionKey (required), answerValue (required), answerLabel. Cost: free; requires a free EnergyAI key. Example: {\"assessmentId\":\"<assessmentId>\",\"questionKey\":\"service_selection\",\"answerValue\":\"heat_pump\"} [free]",
          "inputSchema": {
            "properties": {
              "answerLabel": {
                "type": "string"
              },
              "answerValue": {
                "type": "string"
              },
              "assessmentId": {
                "type": "string"
              },
              "questionKey": {
                "type": "string"
              }
            },
            "required": ["answerValue", "assessmentId", "questionKey"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04c00925dfe1f005dde3e9c094f2fb948da8b731e36fbba6541aa84ecc8ef1ab"
        },
        {
          "name": "bootstrap_energy_project",
          "description": "Create a persisted project context, provisional Energy Node score, coverage map, and immediately reusable assessmentId in one call. Inputs: postalCode (required), serviceType, country, propertyType, primaryGoal, monthlyBillRange, state, city. Cost: $0.10 per call from prepaid balance (new keys include 3 trial calls on tools up to $0.25). Example: {\"postalCode\":\"59715\",\"serviceType\":\"solar\"} [$0.10/call]",
          "inputSchema": {
            "properties": {
              "apiKey": {
                "description": "Optional one-call credential bridge for MCP hosts that cannot change Authorization headers mid-session. Pass the key returned by create_builder_key; EnergyAI removes it from the request body before billing, execution, and persistence. Omit when the Bearer header is already attached.",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "country": {
                "default": "US",
                "enum": ["US", "CA", "GB", "DE", "AU", "OTHER"],
                "type": "string"
              },
              "monthlyBillRange": {
                "default": "unknown",
                "enum": ["lt_75", "75_150", "150_250", "250_400", "gt_400", "unknown"],
                "type": "string"
              },
              "postalCode": {
                "description": "Property ZIP or local postal code.",
                "type": "string"
              },
              "primaryGoal": {
                "default": "save_money",
                "enum": ["save_money", "resilience", "climate", "independence", "all"],
                "type": "string"
              },
              "propertyType": {
                "default": "other",
                "enum": ["single_family", "townhouse", "condo", "rental", "commercial", "farm", "other"],
                "type": "string"
              },
              "serviceType": {
                "default": "unsure",
                "enum": ["solar", "battery", "ev_charger", "efficiency", "heat_pump", "unsure"],
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "required": ["postalCode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:282765411396a96da8530862f2b878d123705188b9c551718a807cf5f52fbe31"
        },
        {
          "name": "check_incentives",
          "description": "Clean-energy incentive source guidance by country and postal code; eligibility is not verified. US ZIP → federal status + state/utility programs (via DSIRE). Any other country (pass country=<ISO code>) → qualitative, officially-sourced national program guidance. Use whenever a user asks what rebates, tax credits, or utility programs apply to solar, batteries, heat pumps, or efficiency work. Inputs: zipCode, country. Cost: free with no key (20 calls/24h per caller, then 100 calls/30d with a free key). Example: {\"zipCode\":\"59715\"} [20 anonymous calls/caller/24h; then 100 free calls/key/30d; active Builder required for sustained informational use]",
          "inputSchema": {
            "examples": [
              {
                "zipCode": "59715"
              },
              {
                "country": "DE",
                "zipCode": "10115"
              }
            ],
            "properties": {
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. Omit for US. Any country works — non-US results return qualitative, officially-sourced incentive guidance (never US federal credits).",
                "examples": ["DE", "GB", "CA"],
                "type": "string"
              },
              "zipCode": {
                "description": "Postal code of the property. US: 5-digit ZIP (ZIP+4 accepted). Other countries: your local postal code (pass country too). Omit entirely for national-level guidance.",
                "examples": ["59715"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ebb584047bc6467049cbd81762f233b8391bcac77a06c173aa5610c8982818c9"
        },
        {
          "name": "check_quote_red_flags",
          "description": "Free automated check of an installer quote for solar, a battery or a heat pump, from its key numbers: price, system size, equipment, incentives claimed, warranty and state. Returns up to 5 red flags (expired federal credits counted, price per watt outside the usual range, missing workmanship warranty, unnamed equipment, unusually large incentives), each with a question to ask the installer, plus a one-paragraph summary to show the homeowner. It is not a human review and never signs off on a quote; every response includes the $49 Quote Guardian human review as the next step. Do not send names, addresses or contact details. Inputs: state (required), priceUsd (required), serviceType, systemKw, batteryKwh, equipment, incentivesClaimed, workmanshipWarrantyYears, equipmentWarrantyYears, ownership. Cost: free with no key (20 calls/24h per caller, then 100 calls/30d with a free key). Example: {\"state\":\"VT\",\"serviceType\":\"solar\",\"priceUsd\":31800,\"systemKw\":8,\"equipment\":[\"REC Alpha 400W\",\"Enphase IQ8\"],\"workmanshipWarrantyYears\":10} [20 anonymous calls/caller/24h; then 100 free calls/key/30d; active Builder required for sustained informational use]",
          "inputSchema": {
            "examples": [
              {
                "equipment": ["REC Alpha 400W", "Enphase IQ8"],
                "incentivesClaimed": [
                  {
                    "amountUsd": 9540,
                    "name": "30% federal tax credit"
                  }
                ],
                "priceUsd": 31800,
                "serviceType": "solar",
                "state": "VT",
                "systemKw": 8
              }
            ],
            "properties": {
              "apiKey": {
                "description": "Optional existing EnergyAI key for hosts that cannot change Authorization headers. Use it to retain account identity for discovery and get_builder_upgrade_link after a trial. Removed before tool execution and persistence. Omit when the Bearer header is attached; never show the key to the user.",
                "type": "string"
              },
              "batteryKwh": {
                "description": "Battery usable capacity in kWh, if any.",
                "type": "number"
              },
              "equipment": {
                "description": "Equipment as named on the quote: panel, inverter, battery or heat-pump model. No customer details.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "equipmentWarrantyYears": {
                "description": "Main equipment (panel or heat-pump) product warranty in years; omit if not stated.",
                "type": "number"
              },
              "incentivesClaimed": {
                "description": "Incentives the quote counts toward your cost, by name and dollar amount.",
                "items": {
                  "properties": {
                    "amountUsd": {
                      "type": "number"
                    },
                    "name": {
                      "maxLength": 80,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "ownership": {
                "description": "How it is paid for. Default cash.",
                "enum": ["cash", "loan", "lease", "ppa"],
                "type": "string"
              },
              "priceUsd": {
                "description": "Total quoted price in US dollars BEFORE incentives.",
                "type": "number"
              },
              "serviceType": {
                "description": "What the quote is for. Default solar.",
                "enum": ["solar", "battery", "heat_pump"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state where the system will be installed, e.g. VT.",
                "type": "string"
              },
              "systemKw": {
                "description": "Solar system size in kW DC, from the quote.",
                "type": "number"
              },
              "workmanshipWarrantyYears": {
                "description": "Installer workmanship warranty in years; omit if the quote does not state one.",
                "type": "number"
              }
            },
            "required": ["priceUsd", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07bbb5db0c8a32c79366bff9308a46b02063f9effa39e653db7a73e430a1f624"
        },
