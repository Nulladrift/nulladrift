      "instructions": "Energy decision support for AI agents: solar, weatherization, EV charging, batteries and heat pumps. Get planning estimates, incentive sources, quote terms and practical next questions. Read energyai://capabilities for task-specific first calls, coverage and limits; discovery is free and does not create an account. Use estimate_production for a modeled solar range; list_guides then get_guide for US solar, battery, weatherization or heat-pump sources; get_node_score for provisional home-energy planning including EV charging and batteries. For an existing quote, review_installer_quote accepts serviceType solar, battery, ev_charger, efficiency or heat_pump. Return the useful result to the user in their current assistant. Human services are optional. Informational tools include 20 anonymous calls per caller in a rolling 24-hour window; a free in-band builder key then includes 100 informational calls per rolling 30 days. Sustained informational consumption after that requires an active Builder subscription; prepaid credit remains available for priced commercial tools. Optional handoff tools remain always free with no API key: get_power_service_quote, get_power_passport_link, get_quote_link, route_lead, find_local_installers, create_builder_key, and get_builder_upgrade_link. Use get_power_service_quote to bind buyer-supplied site facts to an exact $1 Power Screen quote, then call run_power_screen on the prepaid rail. Use get_power_passport_link when a buyer needs the reviewed founding service; it returns a handoff and never creates checkout. Offer get_quote_link only when a homeowner asks for the separate human service or assessment next step. Use route_lead only when you already hold the homeowner's explicit consent. Public directory listings are independent discovery records, not EnergyAI endorsements. Deeper tools (full roadmap, quote review, information-theoretic recommendation) are billed per call. New production keys include three bounded commercial trial calls. Start with review_installer_quote: postalCode + redacted quoteText creates persisted project context and returns source-matched terms, installer questions and explicit unknowns. This automated service does not include human review or independently verified prices. Use _meta.toolCallId for an identical retry and _meta.maxPriceCents to enforce the operator spending ceiling. Record actual operator feedback with record_quote_review_outcome; never infer usefulness. If your host cannot change headers, pass the existing key as apiKey to get_builder_upgrade_link and discovery tools as well as the review; do not create a second account to top up. If the operator already authorized Terms and Privacy, create_builder_key enables the trial in-band. Otherwise surface the human activation URL from get_builder_upgrade_link; do not accept terms for them. The $19/month Builder plan renews $20 of monthly tool credit. Manage billing at /agents/account. With your key attached, route_lead earns 20% credit when an installer pays and get_quote_link earns 20% non-cash tool credit when an attributed $49 Quote Guardian purchase is verified. Customer pricing and review independence do not change. US guides and installer routing; non-US incentive guidance and production estimates use disclosed national assumptions. No engineering approval, equipment control or verified savings.",
