{
  "lockfileVersion": 2,
  "subjects": {
    "com.getinvoicesnap/invoicesnap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getinvoicesnap.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "invoicesnap",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "InvoiceSnap (getinvoicesnap.com) is a receipt scanner. These tools turn receipts you have already read into spreadsheet files.\nRead each receipt yourself (vendor, date, currency, total, and the VAT amount per rate as printed), then call build_receipt_spreadsheet once with all of them. Never guess a VAT rate or amount the receipt doesn't show: leave vat out instead.\nGive the user the summary and the download link exactly as returned. The link works for 24 hours.\nIf the photos are hard to read, or there are many, suggest scan_receipts_on_website.",
      "tools": [
        {
          "name": "build_receipt_spreadsheet",
          "title": "Build a receipt spreadsheet",
          "description": "Turn receipts you have read into an Excel (.xlsx), CSV, Xero or QuickBooks import file, with VAT split into one column per rate. Returns totals per currency and VAT rate, warnings where net + VAT doesn't match the total, and a download link valid for 24 hours. Up to 200 receipts per call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "csvStyle": {
                "default": "standard",
                "description": "For csv only: standard = comma-separated with dot decimals; european = semicolons with comma decimals (Excel in most EU countries)",
                "enum": ["standard", "european"],
                "type": "string"
              },
              "format": {
                "default": "xlsx",
                "description": "xlsx (Excel), csv, xero (bank statement CSV) or quickbooks (bank upload CSV)",
                "enum": ["xlsx", "csv", "xero", "quickbooks"],
                "type": "string"
              },
              "includeLineItems": {
                "default": false,
                "description": "xlsx: add a Line items sheet; csv: one row per line item",
                "type": "boolean"
              },
              "receipts": {
                "description": "The receipts you have read, one entry per receipt (1 to 200). Copy amounts as printed; never guess a VAT rate",
                "items": {
                  "properties": {
                    "category": {
                      "description": "Expense category, e.g. Meals, Travel, Office",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "currency": {
                      "description": "ISO 4217 code, e.g. EUR, GBP, USD",
                      "pattern": "^[A-Za-z]{3}$",
                      "type": "string"
                    },
                    "date": {
                      "description": "Receipt date, YYYY-MM-DD",
                      "pattern": "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$",
                      "type": "string"
                    },
                    "lineItems": {
                      "description": "The receipt's lines, if you need them in the file (see includeLineItems). Leave out otherwise",
                      "items": {
                        "properties": {
                          "description": {
                            "description": "The line as printed, e.g. Cappuccino",
                            "maxLength": 300,
                            "type": "string"
                          },
                          "price": {
                            "description": "What the line cost (qty × unit price), not the unit price",
                            "exclusiveMaximum": 1000000000,
                            "exclusiveMinimum": -1000000000,
                            "type": "number"
                          },
                          "qty": {
                            "description": "Quantity; 1 if the receipt shows none",
                            "maximum": 1000000,
                            "minimum": 0,
                            "type": "number"
                          }
                        },
                        "required": ["description", "price", "qty"],
                        "type": "object"
                      },
                      "maxItems": 200,
                      "type": "array"
                    },
                    "subtotal": {
                      "description": "Amount before VAT, if printed. Left out: we derive it from total minus VAT",
                      "exclusiveMaximum": 1000000000,
                      "exclusiveMinimum": -1000000000,
                      "type": "number"
                    },
                    "total": {
                      "description": "Amount paid, VAT included",
                      "exclusiveMaximum": 1000000000,
                      "exclusiveMinimum": -1000000000,
                      "type": "number"
                    },
                    "vat": {
                      "description": "One entry per VAT rate printed on the receipt. Leave out if the receipt shows no VAT",
                      "items": {
                        "properties": {
                          "amount": {
                            "description": "VAT amount at this rate",
                            "exclusiveMaximum": 1000000000,
                            "exclusiveMinimum": -1000000000,
                            "type": "number"
                          },
                          "rate": {
                            "description": "VAT rate in percent, e.g. 21 (not 0.21)",
                            "maximum": 100,
                            "minimum": 0,
                            "type": "number"
                          }
                        },
                        "required": ["amount", "rate"],
                        "type": "object"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "vendor": {
                      "description": "Shop or supplier name as printed",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["currency", "date", "total", "vendor"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "totalsCurrency": {
                "description": "Also convert every total to this currency at the ECB rate of the receipt date, e.g. EUR",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["receipts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Build a receipt spreadsheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:004ba82a74768e922de4b28f37e7582ba875c829bc5ae9e3f5d550e67dde8e51"
        },
        {
          "name": "convert_currency",
          "title": "Convert at the ECB rate",
          "description": "The European Central Bank reference rate for a currency on a date (the last published rate on or before it), and the converted amount.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "The amount to convert, in the from currency",
                "type": "number"
              },
              "date": {
                "description": "YYYY-MM-DD, usually the receipt date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "ISO 4217 code of the amount's currency, e.g. USD",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "to": {
                "description": "ISO 4217 code to convert into, e.g. EUR",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["amount", "date", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert at the ECB rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd9109441df8ec349f5556a1b672abc7be1739e2fd37261d4a93264e6692df74"
        },
        {
          "name": "scan_receipts_on_website",
          "title": "Scan receipts on getinvoicesnap.com",
          "description": "Link to InvoiceSnap's own scanner, for when receipt photos are hard to read or there are many: it reads photos and PDFs (up to 50 at once) and exports the same files.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Scan receipts on getinvoicesnap.com"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf51d73738468b18db7d8afe2dbc88467a75db29a038e6932f793c1bc46830d1"
        }
      ],
      "digest": "sha256:2acf4ff52c20b9b007d69eb6b6d7ddea7029c685659a0cc9d51a31b4f2e09da0"
    }
  }
}
