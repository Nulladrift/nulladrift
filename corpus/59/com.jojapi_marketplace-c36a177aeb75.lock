{
  "lockfileVersion": 2,
  "subjects": {
    "com.jojapi/marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.jojapi.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jojapi",
        "title": "JoJ API Marketplace",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Discovery server for the JoJ API marketplace (jojapi.com). Typical flow: search_apis → get_api → get_endpoint → call_endpoint. call_endpoint needs a JoJ API key on this connection (Authorization: Bearer jk_...); create one at https://jojapi.com/workspace/api-keys and subscribe to APIs at https://jojapi.com/hub. Each API also has a dedicated MCP server at https://mcp.jojapi.com/{slug} with its endpoints as first-class tools.",
      "tools": [
        {
          "name": "call_endpoint",
          "title": "Call an endpoint",
          "description": "Execute one endpoint of a marketplace API through the live gateway. Requires a JoJ API key configured on this MCP connection as an HTTP header (Authorization: Bearer jk_...). Usage is billed to the key's subscription exactly like any other API call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arguments": {
                "description": "Endpoint arguments keyed by parameter name, as documented by get_endpoint (path/query/form/header parameters and, when documented, a `body` object).",
                "type": "object"
              },
              "method": {
                "description": "HTTP method of the endpoint.",
                "type": "string"
              },
              "path": {
                "description": "The endpoint path exactly as listed by get_api.",
                "type": "string"
              },
              "slug": {
                "description": "The API's marketplace slug.",
                "type": "string"
              }
            },
            "required": ["method", "path", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5f1357ea8aaf6458d03bf122cc5d3423ce5ac020d83d8fe849e3a71ac712870"
        },
        {
          "name": "get_api",
          "title": "Get an API's overview",
          "description": "Overview of one marketplace API by slug: what it does, its endpoint list, plans and links (docs, OpenAPI, dedicated MCP server).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The API's marketplace slug, e.g. from search_apis.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:131a7015883f89876e5ccd8795bb1b357988d4ec836dbabbcc0e6037a985e825"
        },
        {
          "name": "get_endpoint",
          "title": "Get full endpoint documentation",
          "description": "Complete documentation for one endpoint of a marketplace API: parameters with types and requirements, request body, documented responses with examples, and billing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "method": {
                "description": "HTTP method, e.g. GET or POST.",
                "type": "string"
              },
              "path": {
                "description": "The endpoint path exactly as listed by get_api, e.g. /v1/search.",
                "type": "string"
              },
              "slug": {
                "description": "The API's marketplace slug.",
                "type": "string"
              }
            },
            "required": ["method", "path", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e1347f494eb9d2007964733c1e36e75edde067b091010633a01b786f0878b6d"
        },
        {
          "name": "search_apis",
          "title": "Search the API catalog",
          "description": "Search the JoJ API marketplace (jojapi.com) — scraping, web search, social media and real-world data APIs, all callable with one API key through one gateway. Returns matching APIs with their slugs and links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 24,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search over API names and descriptions. Omit or leave empty to browse the catalog.",
                "type": "string"
              },
              "sort": {
                "default": "popular",
                "enum": ["popular", "newest", "random"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:646c998781d170cd1f53f88e7a63315c2d86d402f710e9e6787bc3f52d862480"
        }
      ],
      "digest": "sha256:a97e3e49ecb92ca6b7f85dc1b46d48742a13bf235a1cfa64949f8ea429646714"
    }
  }
}
