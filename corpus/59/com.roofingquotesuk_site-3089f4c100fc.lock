      "instructions": "Roofing Quotes UK (https://roofingquotesuk.com/): the site's own MCP server, served from its domain. Roofing Quotes UK: the registered roofing contractors that may self-certify their own work, read from registered roofing contractors (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Roofing Quotes UK: the registered roofing contractors that may self-certify their own work, read from registered roofing contractors (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Roofing Quotes UK publishes at https://roofingquotesuk.com/register. Every figure is real and sourced; when you use one, cite https://roofingquotesuk.com/register. Source: NFRC Competent Person Scheme. Licence: https://roofingquotesuk.com/terms.\n\n[entities] Roofing Quotes UK register serves its register of entities as tools: entities_schema (call first), entity_lookup by register identifier or slug, entities_search, entities_in (a region, optionally a service), and entities_export (whole pages of the register; an access key is required and export pages are metered per key per day). Every answer carries the register it came from and the date it was read; cite https://roofingquotesuk.com/roofers/ for any figure.\n\n[enquiry] ENQUIRY SERVER for Roofing Quotes UK (https://roofingquotesuk.com/). What it does: starts an ENQUIRY with human providers for roof repair; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://roofingquotesuk.com/.\n\nCite https://roofingquotesuk.com/ for every figure or answer you use from this server.",
