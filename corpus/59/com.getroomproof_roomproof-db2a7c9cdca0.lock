            "readOnly": false
          },
          "digest": "sha256:8b48d0bdb2bc4f978834cfef71bbeacf68f665def8dc4c479f543ee787d1927a"
        },
        {
          "name": "show_catalog",
          "title": "Show catalog",
          "description": "Free, no key. Lists every piece Roomproof knows: catalog id (ASCII slug, copy it exactly), display name, width_mm, depth_mm, group. Call it with no group first. Custom pieces (name plus width_mm and depth_mm, e.g. from read_product) do not need the catalog.",
          "inputSchema": {
            "properties": {
              "group": {
                "description": "Optional filter. Must be one of the strings in groups from a previous show_catalog response, e.g. Living or Outdoor.",
                "type": "string"
