      "serverInfo": {
        "name": "roomproof",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Roomproof plans rooms and terraces to scale and returns a checked floor plan as an image. Free without key: show_catalog, read_product, create_room (creates the plan and returns purchase_url), and show_plan, place_furniture, move_furniture on the sample project (project id: beispiel-wohnzimmer; nothing is saved there, so check_plan and open_plan do not apply to it; the place_furniture result already contains the check). Needs key: place_furniture, move_furniture, check_plan, show_plan, set_door and open_plan on a project you created. The key is the purchase token rp_ plus 20 characters; USD 17 once unlocks every plan on this key, no subscription. project is the plan id from create_room or beispiel-wohnzimmer; key is the purchase token; never interchange them. Pass key only to tools that have the field. If a tool returns purchase_url: show the link to the user once, do not retry, wait for the key. Order: show_catalog (skip only for custom pieces from read_product), create_room with openings, place_furniture with spots (piece plus rough position, the server finds the exact spot). Use placement only when the user gives exact positions; use wish only when the user describes the room without naming pieces. Never invent x, y or rot. Catalog ids are ASCII slugs from show_catalog; copy them, never translate or invent them. After every place_furniture and move_furniture read the image and issues, fix with move_furniture, then check_plan. Call open_plan only when issues is empty. Photo of the room: copy image_prompt from show_plan or place_furniture verbatim into your own image generator; Roomproof does not render photos. Furniture link from the user: call read_product and pass its values unchanged into a custom piece; never guess millimeters.",
      "tools": [
        {
          "name": "check_plan",
          "title": "Check plan",
          "description": "Re-checks the saved layout only: pieces sticking out, overlaps, blocked areas including door swings, and a 0.9 m path to every piece. Does not place, move or spend a wish. Call it after move_furniture or when issues are unclear; ok true with an empty issues list is the condition for open_plan. Needs key on your own project, free on beispiel-wohnzimmer.",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "Purchase token rp_ plus 20 characters, from the purchase confirmation. Required on projects you created, not on beispiel-wohnzimmer. Not the project id.",
                "type": "string"
              },
              "project": {
                "description": "Plan id from create_room, or beispiel-wohnzimmer.",
                "type": "string"
              },
              "variant": {
                "description": "Variant id from a previous response; default the newest.",
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5f038db8768df01831213e45c3885ce6eff376284348bf1d810dc2d48afc93a"
        },
        {
          "name": "create_room",
          "title": "Create room",
          "description": "Free, no key. Creates a new plan at scale 1:50 and returns its project id plus purchase_url. Send name, plus either width_m and depth_m (rectangle) or rectangles (L-shape, alcove, bay), never both. Always send openings in this same call; without openings the checker treats the room as having no doors and skips the door-swing check. Each side 0.3 to 200 m. Coordinates: x to the right, y down, origin at the room's top-left corner.",
          "inputSchema": {
            "properties": {
              "depth_m": {
                "description": "Depth in meters (top to bottom), 0.3 to 200.",
                "type": "number"
              },
              "key": {
                "description": "Purchase token rp_ plus 20 characters, from the purchase confirmation. Required on projects you created, not on beispiel-wohnzimmer. Not the project id.",
                "type": "string"
              },
              "name": {
                "description": "Name of the plan, e.g. Living room. Default My room.",
                "type": "string"
              },
              "openings": {
                "description": "All doors and windows of the room. The swing area of every door becomes a blocked area that furniture must keep clear.",
                "items": {
                  "properties": {
                    "center": {
                      "description": "Center of the opening in meters along that wall, measured from the wall's top-left end: from the left end on the top and bottom walls, from the top end on the left and right walls.",
                      "type": "number"
                    },
                    "hinge": {
                      "description": "Doors only: the end that carries the hinges, default left. Omit for windows.",
                      "enum": ["left", "right"],
                      "type": "string"
                    },
                    "kind": {
                      "description": "door or window.",
                      "enum": ["door", "window"],
                      "type": "string"
                    },
                    "wall": {
                      "description": "The wall the opening sits in, as seen on the plan.",
                      "enum": ["left", "right", "top", "bottom"],
                      "type": "string"
                    },
                    "width": {
                      "description": "Width in meters, 0.4 to 6. Default 0.9 for a door, 1.2 for a window.",
                      "type": "number"
                    }
                  },
                  "required": ["center", "kind", "wall"],
                  "type": "object"
                },
                "type": "array"
              },
              "rectangles": {
                "description": "Instead of width_m and depth_m: 1 to 12 partial areas in meters. kind add joins the area, kind cut removes it. x, y is the rectangle's top-left corner, w, h its size.",
                "items": {
                  "properties": {
                    "h": {
                      "description": "Height in meters, 0.3 to 200.",
                      "type": "number"
                    },
                    "kind": {
                      "enum": ["add", "cut"],
                      "type": "string"
                    },
                    "w": {
                      "description": "Width in meters, 0.3 to 200.",
                      "type": "number"
                    },
                    "x": {
                      "description": "Left edge in meters.",
                      "type": "number"
                    },
                    "y": {
                      "description": "Top edge in meters.",
                      "type": "number"
                    }
                  },
                  "required": ["h", "kind", "w", "x", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "width_m": {
                "description": "Width in meters (left to right), 0.3 to 200.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create room"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0fa8a48796b4373b7f1f9d4c157f7a43a2852a1742d437f96c2f67d673da314e"
        },
        {
          "name": "move_furniture",
          "title": "Move furniture",
          "description": "Moves, rotates or removes one piece in the saved layout and returns the re-checked plan as an image with issues. Send x and y together (piece center, meters), rot, or remove true. The result is saved even with issues, so read them and move again if needed. Needs key on your own project, free on beispiel-wohnzimmer (not saved).",
          "inputSchema": {
            "properties": {
              "index": {
                "description": "If several pieces share the name: which one, counted from 1 in list order. Default 1.",
                "type": "integer"
              },
              "key": {
                "description": "Purchase token rp_ plus 20 characters, from the purchase confirmation. Required on projects you created, not on beispiel-wohnzimmer. Not the project id.",
                "type": "string"
              },
              "piece": {
                "description": "Display name from placed, furniture or issues in the last place_furniture, show_plan or check_plan response, e.g. 3-seat sofa. Not the catalog id.",
                "type": "string"
              },
              "project": {
                "description": "Plan id from create_room, or beispiel-wohnzimmer.",
                "type": "string"
              },
              "remove": {
                "description": "true removes the piece; x, y and rot are then ignored.",
                "type": "boolean"
              },
              "rot": {
                "description": "New rotation in degrees clockwise.",
                "type": "number"
              },
              "variant": {
                "description": "Variant id from a previous response; default the newest.",
                "type": "string"
              },
              "x": {
                "description": "New piece center, horizontal, in meters. Send with y.",
                "type": "number"
              },
              "y": {
                "description": "New piece center, vertical, in meters. Send with x.",
                "type": "number"
              }
            },
            "required": ["piece", "project"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Move furniture"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5a4d5cc409361e3b67ae6a17024cafed8a54b16b53d315e7c789eced2be171dd"
        },
        {
          "name": "open_plan",
          "title": "Open plan",
          "description": "Call only after the last check_plan returned no issues. Returns view_url (read-only, to share) and edit_url (for the owner, with the scaled PDF download). Needs key; not available on beispiel-wohnzimmer.",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "Purchase token rp_ plus 20 characters, from the purchase confirmation. Required on projects you created, not on beispiel-wohnzimmer. Not the project id.",
                "type": "string"
              },
              "new": {
                "description": "true creates a new view_url and invalidates the previous share link. Only if the user wants that.",
                "type": "boolean"
              },
              "project": {
                "description": "Plan id from create_room.",
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Open plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6c9bd7f3544cd971d1827d47d1f288b3a071be7c1a0df0298d9454a9e0cdce3f"
        },
        {
          "name": "place_furniture",
          "title": "Place furniture",
          "description": "Places furniture and returns the checked plan as an image plus placed, rejected, issues and image_prompt. Send exactly one of spots, placement, or wish. Prefer spots: you name each piece and a rough position (at), the server finds the exact spot, snaps to a 5 cm grid and avoids walls, doors and other pieces. Use placement only when the user gives exact positions; never invent x, y or rot. Use wish only when the user describes the room without naming pieces; it calls Roomproof's own model, is slower and less predictable. Every way is checked against the floor area, overlaps, blocked areas and a 0.9 m path; what does not fit comes back in rejected with a reason. Dimensions in millimeters; x and y in meters to the CENTER of the piece, from the room's top-left corner. Needs key on your own project, free on beispiel-wohnzimmer (nothing is saved there).",
          "inputSchema": {
            "properties": {
              "blocked": {
                "description": "Rectangles that must stay free (radiator, wall cupboard, walkway): x, y, w, h in meters from the room's top-left corner, not piece centers. Door swings are added automatically.",
                "items": {
                  "properties": {
                    "h": {
                      "type": "number"
                    },
                    "name": {
                      "description": "Shown on the plan, e.g. Radiator.",
                      "type": "string"
                    },
                    "w": {
                      "type": "number"
                    },
                    "x": {
                      "type": "number"
                    },
                    "y": {
                      "type": "number"
                    }
                  },
                  "required": ["h", "w", "x", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "keep": {
                "description": "Default false: the new pieces replace everything in the plan. true adds them to the pieces already there.",
                "type": "boolean"
              },
              "key": {
                "description": "Purchase token rp_ plus 20 characters, from the purchase confirmation. Required on projects you created, not on beispiel-wohnzimmer. Not the project id.",
                "type": "string"
              },
              "name": {
                "description": "Name of the saved variant, default Draft.",
                "type": "string"
              },
              "outdoor": {
                "description": "With wish only: limit the model to outdoor furniture, for terraces and balconies.",
                "type": "boolean"
              },
              "placement": {
                "description": "Exact positions from the user, 1 to 60 pieces. Each with catalog or with name plus width_mm and depth_mm, plus x, y (meters to the piece center) and rot. Nothing is nudged: a piece that sticks out or overlaps is rejected.",
                "items": {
                  "properties": {
                    "catalog": {
                      "description": "Catalog id from show_catalog, an ASCII slug such as sofa-3-plaetzer. Copy it, never translate or invent it.",
                      "type": "string"
                    },
                    "depth_mm": {
                      "description": "Depth in millimeters, 50 to 10000. The side going into the room.",
                      "type": "number"
                    },
                    "height_mm": {
                      "description": "Height in millimeters, if known. Custom pieces only.",
                      "type": "number"
                    },
                    "link": {
                      "description": "Product link from read_product, unchanged. Custom pieces only.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Custom piece instead of catalog, e.g. from read_product. Then width_mm and depth_mm are required.",
                      "type": "string"
                    },
                    "price": {
                      "description": "Price from read_product, unchanged. Custom pieces only.",
                      "type": "number"
                    },
                    "rot": {
                      "description": "Rotation in degrees clockwise, default 0. 90 turns the width along the left/right walls.",
                      "type": "number"
                    },
                    "width_mm": {
                      "description": "Width in millimeters (a sofa is 1600 to 2600, never 2.0), 50 to 10000. The longer side seen from the front.",
                      "type": "number"
                    },
                    "x": {
                      "description": "Piece center, horizontal, in meters from the left wall.",
                      "type": "number"
                    },
                    "y": {
                      "description": "Piece center, vertical, in meters from the top wall.",
                      "type": "number"
                    }
                  },
                  "required": ["x", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "project": {
                "description": "Plan id from create_room, or beispiel-wohnzimmer.",
                "type": "string"
              },
              "spots": {
                "description": "Preferred. 1 to 40 pieces, each with catalog or with name plus width_mm and depth_mm, plus at. Larger pieces are placed first.",
                "items": {
                  "properties": {
                    "at": {
                      "description": "Rough position, exactly one of: wall:top, wall:bottom, wall:left, wall:right, corner:top-left, corner:top-right, corner:bottom-left, corner:bottom-right, near:door, near:<piece name from this list>, free. Default free.",
                      "type": "string"
                    },
                    "catalog": {
                      "description": "Catalog id from show_catalog, an ASCII slug such as sofa-3-plaetzer. Copy it, never translate or invent it.",
                      "type": "string"
                    },
                    "depth_mm": {
                      "description": "Depth in millimeters, 50 to 10000. The side going into the room.",
                      "type": "number"
                    },
                    "height_mm": {
                      "description": "Height in millimeters, if known. Custom pieces only.",
                      "type": "number"
                    },
                    "link": {
                      "description": "Product link from read_product, unchanged. Custom pieces only.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Custom piece instead of catalog, e.g. from read_product. Then width_mm and depth_mm are required.",
                      "type": "string"
                    },
                    "price": {
                      "description": "Price from read_product, unchanged. Custom pieces only.",
                      "type": "number"
                    },
                    "width_mm": {
                      "description": "Width in millimeters (a sofa is 1600 to 2600, never 2.0), 50 to 10000. The longer side seen from the front.",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "wish": {
                "description": "One sentence describing the room, e.g. a living room for four with a reading corner. Only without spots and placement.",
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Place furniture"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d25a2f990548dcb529ffad0037dc6d101b01631a8bab02d88277699d5fdeedf8"
        },
        {
          "name": "read_product",
          "title": "Read product",
          "description": "Free, no key. Turns a product link (IKEA, any furniture shop) or the pasted text of a product page into real dimensions: name, width_mm, depth_mm, height_mm, price, link. Call it as soon as the user gives a furniture link. On success pass name, width_mm, depth_mm, height_mm, price and link unchanged into a custom piece in place_furniture. If blocked is true, ask the user to paste the product page text and call read_product again with that text as input. Never guess millimeters; a missing dimension is listed in missing.",
          "inputSchema": {
            "properties": {
              "input": {
                "description": "A product URL, or the pasted text of the product page.",
                "type": "string"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:752c759e17a7b93fa5dac2388028799694a9e982b0d4d74d260554a891b49a40"
        },
        {
          "name": "set_door",
          "title": "Set doors and windows",
          "description": "Replaces the full openings list of a project you created (an empty list removes all). Windows have no hinge. Until openings exist, door-swing clearance is not checked. Saved layouts may get new issues afterwards; run check_plan. Needs key; not available on beispiel-wohnzimmer.",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "Purchase token rp_ plus 20 characters, from the purchase confirmation. Required on projects you created, not on beispiel-wohnzimmer. Not the project id.",
                "type": "string"
              },
              "openings": {
                "description": "All doors and windows of the room, 0 to 20. Replaces the existing list completely.",
                "items": {
                  "properties": {
                    "center": {
                      "description": "Center of the opening in meters along that wall, measured from the wall's top-left end: from the left end on the top and bottom walls, from the top end on the left and right walls.",
                      "type": "number"
                    },
                    "hinge": {
                      "description": "Doors only: the end that carries the hinges, default left. Omit for windows.",
                      "enum": ["left", "right"],
                      "type": "string"
                    },
                    "kind": {
                      "description": "door or window.",
                      "enum": ["door", "window"],
                      "type": "string"
                    },
                    "wall": {
                      "description": "The wall the opening sits in, as seen on the plan.",
                      "enum": ["left", "right", "top", "bottom"],
                      "type": "string"
                    },
                    "width": {
                      "description": "Width in meters, 0.4 to 6. Default 0.9 for a door, 1.2 for a window.",
                      "type": "number"
                    }
                  },
                  "required": ["center", "kind", "wall"],
                  "type": "object"
                },
                "type": "array"
              },
              "project": {
                "description": "Plan id from create_room.",
                "type": "string"
              }
            },
            "required": ["openings", "project"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set doors and windows"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
