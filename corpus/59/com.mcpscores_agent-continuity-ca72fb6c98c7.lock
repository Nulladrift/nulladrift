                "examples": ["[{\"item_id\":\"P-1\",\"payload\":{\"url\":\"...\"}}]"],
                "type": "array"
              },
              "max_attempts": {
                "description": "How many times an item may be handed to a worker before it is dead-lettered. Default 3, max 20. Set on first push; later pushes do not change it. Example: '3'.",
