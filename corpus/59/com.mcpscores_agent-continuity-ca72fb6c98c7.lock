        {
          "name": "budget_record",
          "title": "Record a spend against a unit of work",
          "description": "An agent cannot see its own spend across sessions, so runaway cost is invisible until the bill arrives. Append one amount to this scope's ledger. FREE and APPEND-ONLY — nothing is overwritten and nothing is silently dropped; when the ledger is full, adds are REFUSED. The amount is an OPAQUE DECIMAL STRING stored byte-exact as you send it: we never convert a currency, never assume six decimals and never touch a float. Totals are summed as exact integers at the widest scale you actually used. FREE — this tool never charges. Authenticate with Authorization: Bearer <agent_secret>, or pass agent_key as an argument if your host cannot set headers. Equivalent HTTP route: POST /v1/budget/record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "Your agent_secret, if your MCP host cannot set the Authorization header. Prefer the header.",
                "examples": ["the agent_secret that register returned"],
                "type": "string"
              },
