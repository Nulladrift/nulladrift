      "instructions": "You stopped, and now you are back and do not know what you already did. That is what this fixes. Checkpoints compose into a resume briefing; leases and pull queues stop two workers taking one item; seen-sets and claims stop a side effect happening twice; barriers join parallel work; budgets say when to stop.\n\nHOW TO PAY, first — nothing below works without it. 13 of the 33 tools cost $0.002; every write, and initialize, ping and tools/list, are free; tools/list carries each tool's schema and exact price. Send the base64 X-PAYMENT header on this POST /mcp request, or `params._meta['x402/payment']`. Call register (free) first for an agent_secret and a public address, then send it as `Authorization: Bearer <agent_secret>`, or as the `agent_key` argument if this host cannot set headers. You are billed only when a call delivers information you did not already have, and never twice for the same fact — remembered per record for its last 32 distinct billed answers.\n\nWhat we REFUSE. We hold work; we do not run it — we cannot restart your agent, and something else (a cron, a user, a queue) must invoke it. We cannot kill a worker: job_cancel sets a flag, and a worker that never checks should_continue runs to completion. We report budgets and NEVER block a call. No webhook, no callback URL: we queue an envelope and you poll for it. Mailbox delivery is at-least-once, not exactly-once — hence ack and the tombstone. A dead-man switch detects SILENCE, not failure. We never read another agent's mailbox, never list your keys, and never parse a checkpoint body.\n\nLimits, all enforced by deletion, not promised: leases 1 hour max, claims 30 days, checkpoints 90 days, retry state 30 days. A queue id holds 2000 items over its LIFETIME, finished ones included, because work_status keeps their results and dead letters — not a concurrency limit. Past it, pushes are REFUSED by item_id, never silently dropped: roll to a new queue_id. A seen-set or a mailbox that fills refuses the add rather than forgetting an entry.",
      "tools": [
        {
          "name": "barrier_create",
          "title": "Open a join point for fan-out work",
          "description": "Fan work out to N agents and have the LAST one to finish wake the joiner. FREE. A BARRIER THAT WAITS FOR ALL N IS A HANG WAITING TO HAPPEN, so stragglers are the normal case here, not an edge case: set min_count and/or deadline_seconds and we fire on whichever comes first, ALWAYS naming the participants that did not report. Exactly ONE envelope is queued to notify_address, carrying every participant's payload; that delivery is billed by the existing inbox_poll rule, so there is no new charge. If nothing has fired by the TTL we queue a `barrier_timeout` envelope naming the missing participants — a timeout is information and is delivered, never silently dropped. REUSING A BARRIER_ID IS THE NORMAL PATTERN: while a join is still open this call is idempotent and refuses to reset it (created:false), because a retrying agent must not be able to reset a join others are signalling — but once it has fired or timed out, calling barrier_create with the same id opens a NEW GENERATION with your new roster, and that generation gets its own notification. FREE — this tool never charges. Authenticate with Authorization: Bearer <agent_secret>, or pass agent_key as an argument if your host cannot set headers. Equivalent HTTP route: POST /v1/barrier/create.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "Your agent_secret, if your MCP host cannot set the Authorization header. Prefer the header.",
                "examples": ["the agent_secret that register returned"],
                "type": "string"
              },
              "barrier_id": {
                "description": "Your name for this join point. Namespace-scoped; stored in plain text so a timeout can name it back to you. Example: 'quarterly-rollup-2026q3'.",
                "examples": ["quarterly-rollup-2026q3"],
                "type": "string"
              },
              "deadline_seconds": {
                "description": "Fire at this many seconds from now with whoever has signalled, whether or not min_count was reached. Must be <= ttl_seconds. The notification names who did not report. Example: '600'.",
                "examples": [600],
                "type": "integer"
              },
              "expected_count": {
                "description": "How many participants you expect. 1..500. Defaults to the length of `participants` when you supply a roster. Example: '3'.",
                "examples": [3],
                "type": "integer"
              },
              "min_count": {
                "description": "Fire as soon as THIS many have signalled, instead of waiting for all of them. Default: expected_count. Set it lower and a straggler cannot hang the join. Example: '2'.",
                "examples": [2],
                "type": "integer"
              },
              "notify_address": {
                "description": "Where the completion, deadline or timeout envelope goes. Must be registered. WRITE-ONLY: we queue into it and never read it. Example: 'agent:7k2p.../joins'.",
                "examples": ["agent:7k2p.../joins"],
                "type": "string"
              },
              "objective": {
                "description": "Optional text carried into every envelope so the joiner knows what it is being woken for. <=2048 chars. Example: 'Roll up the three regional reports'.",
                "examples": ["Roll up the three regional reports"],
                "type": "string"
              },
              "participants": {
                "description": "Optional roster of participant ids. Supply it and every notification names exactly who is missing; omit it and we can only report the shortfall. A signal from outside the roster is recorded but does NOT count toward the threshold. Example: '[\"a\",\"b\",\"c\"]'.",
                "examples": ["[\"a\",\"b\",\"c\"]"],
                "type": "array"
              },
              "ttl_seconds": {
                "description": "How long the barrier lives before timing out. Default 3600, min 5, max 2592000. Example: '3600'.",
                "examples": [3600],
                "type": "integer"
              }
            },
            "required": ["barrier_id", "notify_address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
