        {
          "name": "tourradar_web-ask-question",
          "description": "[tourradar] Use this when the user wants to ASK A QUESTION about a tour or operator WITHOUT committing to a booking.\n\nTwo modes:\n- mode \"tour\": a question about a specific tour. Requires `tourId`. The `departureDate` is OPTIONAL here — if the customer has not picked a date, omit it and the backend will pick the nearest real departure. Do NOT fabricate a date.\n- mode \"operator\": a general/operator-level question. Requires `operatorId` and no tour.\n\nAlways provide the customer's real contact details (email, first/last name; phone optional) and their actual question text. Never fabricate or assume user data — ask for missing information.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentInformation": {
                "description": "Optional agent context about the customer's needs/preferences. Helps Customer Support. The customer's question stays primary; this is appended as extra context.",
                "type": "string"
              },
              "email": {
                "description": "Customer email address. If email is not given by the customer, please ask before executing this tool. Never generate an email yourself.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "entity": {
                "description": "What the question is about. Pick exactly one mode: \"tour\" (carries `tourId` + optional departure/pax) or \"operator\" (carries `operatorId`). A tour question cannot carry an operator id and vice versa.",
                "oneOf": [
                  {
                    "properties": {
                      "departureDate": {
                        "description": "Optional departure date, from the customer selection. Omit if the customer has not chosen a date — do not fabricate one; the backend will pick the nearest real departure.",
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                        "type": "string"
                      },
                      "mode": {
                        "const": "tour",
                        "description": "Use \"tour\" for a question about a specific tour.",
                        "type": "string"
                      },
                      "paxAdults": {
                        "description": "Number of adults. Defaults to 1 when omitted.",
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      },
                      "paxChildren": {
                        "description": "Number of children. Defaults to 0 when omitted.",
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "tourId": {
                        "description": "Tour ID. Required for a tour question.",
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      }
                    },
                    "required": ["mode", "tourId"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "mode": {
                        "const": "operator",
                        "description": "Use \"operator\" for a general/operator-level question (no specific tour).",
                        "type": "string"
                      },
                      "operatorId": {
                        "description": "Operator ID. Required for an operator question.",
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      }
                    },
                    "required": ["mode", "operatorId"],
                    "type": "object"
                  }
                ]
              },
              "firstName": {
                "description": "Customer first name.",
                "type": "string"
              },
              "lastName": {
                "description": "Customer last name.",
                "type": "string"
              },
              "phoneNumber": {
                "description": "Customer phone number in E-164 format. Optional but recommended. Never put a fake phone number; if the customer does not provide one, skip this field.",
                "type": "string"
              },
              "question": {
                "description": "The customer's actual question text. Required and must be non-empty. This is the question the customer wants answered.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email", "entity", "firstName", "lastName", "question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d171c560b0fe1866c7eb297ca67a85235505c3bca589be9b9f165e638d221ae1"
        },
        {
          "name": "tourradar_web-tour-booking",
          "description": "[tourradar] Use this when the user explicitly wants to book a tour and has provided their contact details.\n\nCreates a booking request for a specific tour. Requires real contact details (email, names; phone optional). Always confirm the departure date by checking departures first. Never fabricate or assume user data - always ask for missing information.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentInformation": {
                "description": "Agent information about the booking. Describe here what customer is looked for, preferences etc, what you can recognize. Will be helpful for our Customer Support team to understand the customer needs.",
                "type": "string"
              },
              "departureDate": {
                "description": "Departure date, from customer selection",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "email": {
                "description": "Customer email address. If email is not given by the customer, please ask him before executing this endpoint. Never generate email by yourself, always ask customer for give the email before calling this tool.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "extraInformation": {
                "description": "Customer extra information from the customer or agent. Fill here if customer has provided any additional information about the booking. This is optional and can be empty.",
                "type": "string"
              },
              "firstName": {
                "type": "string"
              },
              "lastName": {
                "type": "string"
              },
              "paxAdults": {
                "description": "Number of the adults. Always ask customer for this information, is important to have it",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "paxChildren": {
                "description": "Number of the children",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "phoneNumber": {
                "description": "Customer phone number in E-164 format. Is optional, but recommended to provide it. Never put fake phone number, always ask customer for give the phone number before calling this tool. If customer do not gives phone number, just skip this field",
                "type": "string"
              },
              "tourId": {
                "description": "Tour ID",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["agentInformation", "departureDate", "email", "extraInformation", "firstName", "lastName", "paxAdults", "paxChildren", "tourId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58551554aef976d9d926b5e9a08024863fe83d6b77b6edb520214fee1198fca7"
        },
        {
          "name": "tourradar_web-tour-send-brochure",
          "description": "[tourradar] Use this when the user requests a tour brochure or PDF to be sent to their email.\n\nSends a tour brochure (PDF file) to the specified email address. Before using this, ensure the user has provided their email address. If not provided, ask the user for it. Never generate or assume email addresses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "User email address. If email is not given by the user, please ask him before executing this endpoint. Never generate email by yourself, always ask user for give the email before calling this tool.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "tourId": {
                "description": "Tour ID",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["email", "tourId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
