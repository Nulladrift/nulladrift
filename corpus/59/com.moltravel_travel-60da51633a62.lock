        {
          "name": "peek_search_experiences",
          "description": "[peek] Search for travel experiences with comprehensive filtering options. Returns available categories, tags, and regions with IDs for further filtering.",
          "inputSchema": {
            "properties": {
              "categoryId": {
                "description": "Limit to only a specific activity category",
                "type": "string"
              },
              "endDate": {
                "description": "Return experiences that are available on or before this date in YYYY-MM-DD format (e.g., '2025-06-20' would return things taking place ON or BEFORE the 20th)",
                "type": "string"
              },
              "latLng": {
                "description": "When the user wants something NEAR a specific place, but not necessarily IN a specific place, limit to only those near a given lat_lng. ex: \"37.7799,-122.2822\". Don't use this for regions, instead use the search_regions and provide a region id. this is a good fallback if a specific region is lacking inventory.",
                "type": "string"
              },
              "query": {
                "description": "When the user wants something w/ a specific keyword (bike, beer, art, etc) limit to experiences whose title contain a keyword. Never include location information.",
                "type": "string"
