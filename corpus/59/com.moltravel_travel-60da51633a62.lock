        {
          "name": "tourradar_vertex-review-search",
          "description": "[tourradar] Search tour reviews using AI-powered semantic search. Requires tourIds to scope results to specific tours. Use this when the user asks about reviews, feedback, or experiences for specific tours. Combine with an optional text query to find reviews mentioning specific topics (e.g., 'food', 'guide', 'accommodation'). When you don't have tour IDs, use vertex-tour-search or vertex-tour-title-search first to find them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "createdAfter": {
                "description": "Only return reviews created on or after this date (YYYY-MM-DD). Use to bias toward recent reviews.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "keywords": {
                "description": "Array of keyword phrases to search reviews for. These are joined with OR logic to find reviews matching any of the given topics. Use short phrases (e.g., ['food quality', 'meals', 'restaurant']). When provided, this takes priority over 'query'.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "minRating": {
                "description": "Only return reviews with a star rating >= this value (1-5). Use to surface only strong reviews.",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "pageSize": {
                "default": 10,
                "description": "Number of reviews to return (1-20, default 10)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "pageToken": {
                "description": "Token for fetching the next page of results. Use the nextPageToken value from a previous response.",
                "type": "string"
              },
              "query": {
                "default": "",
                "description": "Short natural language search query to find specific review topics. Keep it concise — do NOT expand into keyword lists. Use simple phrases like 'food quality', 'guide', 'hotel issues'. The search engine handles semantic matching automatically. Prefer using 'keywords' parameter instead when user intent maps to specific topics. Leave empty to return all reviews.",
                "type": "string"
              },
              "tourIds": {
                "description": "Tour IDs to scope reviews to specific tours. Use vertex-tour-title-search to find tour IDs if needed.",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 9007199254740991,
                  "type": "integer"
                },
                "minItems": 1,
                "type": "array"
              },
              "travelledAfter": {
                "description": "Only return reviews whose trip departed on or after this date (YYYY-MM-DD). Use to surface reviews from recent travellers.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
