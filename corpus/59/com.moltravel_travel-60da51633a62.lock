      "instructions": "MoltTravel aggregates travel tools from multiple providers.\n\nRecommended flow for flights:\n1. Use `kiwi_search-flight` to search for flights.\n2. Use `navifare_format_flight_pricecheck_request` to format a specific flight result for price checking.\n3. Use `navifare_flight_pricecheck` to compare prices across booking sites.\n\nMulti-Day Tours (TourRadar):\n- `tourradar_*` — search 50K+ multi-day tours by destination, dates, duration, and style\n- Get full itineraries, pricing, operator info, and brochure downloads\n- Best for organized tours (3+ days): guided tours, cruises, safaris, treks\n\nExperiences & Activities (Peek):\n- `peek_search_experiences` — search for day activities and experiences\n- `peek_experience_details` — get details about a specific experience\n- `peek_experience_availability` — check availability and pricing\n- `peek_search_regions` — find region IDs for location-based searches\n- `peek_list_tags` — list category tags for filtering\n- `peek_render_activity_tiles` — render embeddable activity widgets\n\nFlights, Hotels & Cars (Skiplagged):\n- `skiplagged_sk_flights_search` — search flights with hidden-city and virtual interlining options\n- `skiplagged_sk_hotels_search` — search hotels by city and dates\n- `skiplagged_sk_hotel_details` — room-level availability and pricing\n- `skiplagged_sk_cars_search` — rental car search by location and dates\n- `skiplagged_sk_destinations_anywhere` — find cheapest destinations from a city\n- `skiplagged_sk_flex_departure_calendar` / `sk_flex_return_calendar` — flexible date pricing\n\nFerries (Ferryhopper):\n- `ferryhopper_get_ports` — list all ferry ports\n- `ferryhopper_get_direct_connections_for_ports` — find routes from a port\n- `ferryhopper_search_trips` — search ferry trips between two ports on a date\n\nAccommodation (Trivago):\n- `trivago_trivago-search-suggestions` — get location IDs for a city/region query\n- `trivago_trivago-accommodation-search` — search hotels by location ID, dates, guests\n- `trivago_trivago-accommodation-radius-search` — search hotels near coordinates\n- First call search-suggestions to get the location ID, then use it in accommodation-search\n\nAirport & Airline Reference:\n- `airports_lookup` — look up airport by IATA/ICAO code\n- `airports_search` — search airports by name/city\n- `airports_near` — find airports near a lat/lon point\n- `airlines_lookup` — look up airline by IATA/ICAO code\n- `airlines_search` — search airlines by name\n\nVisa Requirements:\n- `visa_check` — check visa requirement for a passport+destination pair\n- `visa_summary` — overview of visa-free access for a passport country\n\nOther tools:\n- `restcountries_country_info` — look up country details (capital, currency, timezone, etc.)\n- `fcdo_travel_advice` — get UK FCDO travel advice for a specific country\n- `fcdo_list_countries` — list all countries with FCDO travel advice\n- `data_status` — check which static datasets are loaded\n\nAll tools are prefixed with their provider name (e.g. kiwi_, navifare_, skiplagged_, trivago_, ferryhopper_, tourradar_, peek_, restcountries_, fcdo_).\n\nMaster tool:\n- `travel_agent` — ask any travel question in natural language and it will automatically route to the right tools and return a combined answer.",
