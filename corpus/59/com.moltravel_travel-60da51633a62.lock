        {
          "name": "ferryhopper_search_ferry_trips",
          "description": "[ferryhopper] Search ferry trips as an ordered chain of 1 to 5 legs. Takes human-readable location names (e.g. city or port name) for each leg, not port codes — no need to call get_ports first. Availability flags (cabin, vehicles, pets, e-ticket) are reported per segment.\n\n- One leg: a plain one-way search.\n- Two legs where leg 2 reverses leg 1 (e.g. leg 1 Piraeus→Mykonos, leg 2 Mykonos→Piraeus): a round trip.\n- Up to 5 legs otherwise (e.g. A to B, then B to C, then C to D): an island-hopping chain.\n\nLegs after the first must depart from the location the previous leg arrived at, and must be in chronological order (a later leg may share the same date as an earlier one, but may not precede it).\n\nThe response returns each leg's available options independently (legs[].options) — options are never filtered against another leg's options. Consecutive legs must leave enough time between one leg's arrival and the next leg's departure to be a valid connection; this is not pre-filtered server-side or reflected in this output, so do not assume every combination of options across legs is a valid connection — the widget the user interacts with enforces this.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "legs": {
                "description": "An ordered chain of sailing legs. A one-way search is a single leg. A round trip is 2 legs where leg 2 reverses leg 1 (e.g. leg 1 Piraeus→Mykonos, leg 2 Mykonos→Piraeus). An island-hopping chain is up to 5 legs, e.g. A→B, then B→C, then C→D. Each leg after the first must depart from the location the previous leg arrived at.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arrivalLocation": {
                      "description": "Arrival location as a human-readable name or search term (e.g. city, port name), not a port code.",
                      "type": "string"
                    },
                    "departureDate": {
                      "description": "Departure date for this leg in ISO format YYYY-MM-DD (e.g. 2026-06-21).",
                      "format": "date",
                      "type": "string"
                    },
                    "departureLocation": {
                      "description": "Departure location as a human-readable name or search term (e.g. city, port name), not a port code.",
                      "type": "string"
                    }
                  },
                  "required": ["arrivalLocation", "departureDate", "departureLocation"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["legs"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:969625d8180f12ff0699473c349a448f830520491442e4ea0348b673afce3fb9"
        },
