        {
          "name": "visarun_check_eligibility",
          "title": "Check eligibility",
          "description": "Use this when someone asks whether they need a visa for a country, what a visa with Visarun costs, which documents it takes or how long it takes: 'do I need a visa for Dubai on an Indian passport', 'هل أحتاج تأشيرة لدبي بجواز سفر هندي؟', 'нужна ли виза в Таиланд с российским паспортом', 'क्या भारतीय पासपोर्ट पर थाईलैंड के लिए वीज़ा चाहिए?', 'how much is a Schengen visa from Dubai'. To compare destinations, call it for each. Not for where a passport can go: that is visarun_list_destinations. It answers whether Visarun can file a visa for this traveller and destination (supported), which questionnaire it uses, the main documents it asks for (required_documents, a short list: visarun_get_application_fields lists every upload once the application exists, and visarun_get_requirements what a consulate or visa centre checks) and the estimated processing days. Where Visarun files nothing for the destination (reason country_not_supported), visa_required is null: Visarun does not say whether a visa is needed there, and message sends the person to the official source. For a traveller who pays Visarun, without signing in or signed in as Visarun's own customer, it also carries price_from, the least an adult pays before answers that may raise it (government_fee, service_fee and premium_fee add up to amount; card_processing is what checkout adds; government_fee_not_included, where present, is a government fee the person pays outside Visarun, so not in amount: to the visa centre, which also takes its own service fee (a Schengen state's consular fee, China's visa fee outside the US), or to the mission (Japan's and Taiwan's consular fees, China's in the US), an adult's amount in its currency, null where the centre or mission sets it), and apply_url, where the person applies on the Visarun site. For a traveller who pays Visarun, reason not_offered means Visarun files it for agencies only, or the signed-in member's own countries leave it out; message says which. Ask before creating an application. eligibility_questions are the questions New Application asks this passport for this destination (which visas or permits the traveller holds, what they travel on): ask the person, then check again with their answers in held_credentials, the values of the options they hold or the none option's. For our own customers an answer is needed before creating; some answers close the online route, and some waive the visa (visa_free, with what to do before flying in message). Tell the person each of warnings (a US travel restriction, Saudi Arabia's embassy review, a trip longer than the visa allows or sooner than its processing time) before creating.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "citizenship": {
                "description": "Passport nationality, ISO-2",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "destination": {
                "description": "Destination country, ISO-2 (e.g. SA)",
                "type": "string"
              },
              "held_credentials": {
                "description": "Answers to eligibility_questions: the values of the options the traveller holds, or the none option's value",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "organization_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$",
                "type": "string"
              },
              "purpose": {
                "type": "string"
              },
              "residence": {
                "description": "Country of residence, ISO-2",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "travel_end_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "travel_start_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "visa_type": {
                "description": "A code or label from visa_types, in any case; one not offered for this passport, or not filed for this trip, is refused",
                "type": "string"
              }
            },
            "required": ["citizenship", "destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check eligibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
