          "description": "Use this when someone asks where they can travel, or which visa Visarun can get them: 'where can I go on an Indian passport', 'which e-visas can I get living in Dubai', 'أين يمكنني السفر بجواز سفر باكستاني؟', 'куда можно поехать с паспортом Казахстана', 'मैं भारतीय पासपोर्ट से कहाँ जा सकता हूँ?', 'which visa can I get fastest'. Not for one destination's documents or warnings: that is visarun_check_eligibility. It lists the destinations Visarun files for this citizenship and residence, each with its visa type, estimated_processing_days and price_from, an adult's least price before card processing, whose government_fee, service_fee and premium_fee add up to amount (null where nothing is paid in the app), with government_fee_not_included where the person also pays a government fee outside Visarun, to the visa centre or the mission; ask_first lists those where the traveller answers a question first, which visarun_check_eligibility asks. Destinations that need no visa are not listed. For a traveller who pays Visarun, without signing in or signed in as Visarun's own customer, each carries apply_url, where the person applies on the Visarun site; signed in, the list is the organization's.",
