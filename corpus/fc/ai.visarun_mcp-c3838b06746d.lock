      },
      "instructions": "Visarun files visas for travellers. Without signing in, three tools answer: visarun_list_destinations (where this passport can go with Visarun: the visa, its price from and how long it takes), visarun_check_eligibility (one destination: whether a visa is needed, the documents Visarun asks for, the processing time and the price from) and visarun_get_requirements (what the destination's consulate or visa centre checks: every document, the fee and the official page). Call them before answering: never quote a price, a document or a processing time from memory.\nEach answer carries apply_url: the person applies there, on the Visarun site. For you to apply for them instead, call the tool that does it (visarun_create_application and the rest): the person first signs in to Visarun, or signs up, and allows the connection.\nHelp from a person: support@visarun.ai.",
