        {
          "name": "visarun_get_application_fields",
          "title": "Get questionnaire fields",
          "description": "The questionnaire of an application as data, in two parts. documents: each file to upload with its status (missing, reading, read, failed, uploaded) and, once read, what it read in answer keys (files[].read.answers, with confirmed_by_mrz naming the values the passport's check digits confirm); a passport page field's PDF (a cover, a last page) has page: prepared with the page cut out of it, not_found when the PDF has no such page, not_prepared while it is not cut or, for Go Kite's Passport Page 2 and Passport Cover, while the cut awaits its check (Submit runs the check itself: do nothing for it), or unverified when that check did not confirm the cut (one upright last page; the passport's outer cover, upright) (Submit files the upload as it is, with a warning: to send just the page, ask for a straight, flat photo of it, or a crop in the form): for one not_found, still not_prepared minutes after its upload (except Go Kite's Passport Page 2 and Passport Cover, which Submit checks), or prepared but read with no answers, failed or never read (the cut likely took the wrong page, unless that passport's last page prints no address, as most outside India do), visarun_create_upload_page for that field shows the person the passport PDF's pages to tap the right one, or takes a photo of that page. answers: steps of fields with current values, which are required right now, option lists and info boxes as notes, and missing, the answers still needed. Read it before uploading and before saving answers, and again after a save: an answer can open new fields.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "application_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$",
