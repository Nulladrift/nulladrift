{
  "lockfileVersion": 2,
  "subjects": {
    "com.growthranked/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://growthranked.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "growth-ranked",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_tool",
          "description": "Get full verified specifications, pricing, pros/cons, and source URL for one listed growth tool by slug.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Tool slug, e.g. clay, apollo, smartlead, peec-ai",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47a3d6393098284c56b642466d2b1f45bda55aaef074523c680dfba8acfa9c68"
        },
        {
          "name": "list_categories",
          "description": "List all ranking categories with slugs, URLs, and published product counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8a7f69ff1a9ae9cb7d4148b64963e5ae475066cf04faf887bdedd098bc6e860"
        },
        {
          "name": "search_tools",
          "description": "Search published AI SDR, cold email, LinkedIn automation, visitor ID, and GEO/AEO tools on Growth Ranked by query or category slug.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug from list_categories",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max results, 1-50, e.g. 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword matching name, tagline, best_for, or price",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36417fd1723ac3750fccf2b95d51628b64883844a8c533c4ad7c9e8feb4a3944"
        },
        {
          "name": "submit_tool",
          "description": "Submit an AI outbound, AI SDR, lead enrichment, visitor ID, or GEO/AEO tool. Tiers: free_backlink ($0 with badge link), fast_29 (one-time instant publish), featured_59 (one-time + 30-day category pin). Always preview with dryRun=true first to see the live price and checkout URL details.",
          "inputSchema": {
            "properties": {
              "categories": {
                "description": "Category slugs from list_categories, e.g. [\"ai-sdr-tools\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dryRun": {
                "default": true,
                "description": "true previews price and checkout without creating a submission",
                "type": "boolean"
              },
              "logoUrl": {
                "description": "Square logo image URL (PNG or SVG)",
                "type": "string"
              },
              "name": {
                "description": "Product name, e.g. Acme Outbound",
                "type": "string"
              },
              "pricingUrl": {
                "description": "Public pricing page URL, e.g. https://acme.com/pricing",
                "type": "string"
              },
              "submitterEmail": {
                "description": "Contact email for listing updates, e.g. founder@acme.com",
                "type": "string"
              },
              "tagline": {
                "description": "One-line pitch, under 120 characters",
                "type": "string"
              },
              "tier": {
                "description": "Listing tier: free_backlink ($0, needs badge link), fast_29, or featured_59",
                "enum": ["free_backlink", "fast_29", "featured_59"],
                "type": "string"
              },
              "websiteUrl": {
                "description": "Product homepage URL, e.g. https://acme.com",
                "type": "string"
              }
            },
            "required": ["name", "submitterEmail", "tier", "websiteUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7f4d088ce76759180918b661716e88910506aac14b9677c881c170948104d521"
        },
        {
          "name": "verify_backlink",
          "description": "Verify that a page contains a visible dofollow backlink to Growth Ranked and publish a free_backlink submission.",
          "inputSchema": {
            "properties": {
              "pageUrl": {
                "description": "Public page URL that shows the badge link, e.g. https://acme.com/partners",
                "type": "string"
              },
              "submissionId": {
                "description": "Submission id returned by submit_tool",
                "type": "string"
              }
            },
            "required": ["pageUrl", "submissionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ab450dcd4edbd1f35e0884865011b19073fd5a0d1080260273d5634cc95c691"
        }
      ],
      "digest": "sha256:ac914fe514604930f2273c2732388baf148122c35edd4011688336cc612161b7"
    }
  }
}
