                    }
                  },
                  "required": ["areaName", "bedroomsMax", "bedroomsMin", "buildingName", "displayAreaSqft", "localityName", "market", "offPlanSaleType", "plotSizeSqft", "priceAed", "projectName", "propertyType", "saleDate", "sourceProjectId", "status", "transactionId"],
                  "type": "object"
