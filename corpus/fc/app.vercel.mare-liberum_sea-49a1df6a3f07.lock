            "readOnly": false
          },
          "digest": "sha256:ba217cdd6900cf0c25756e2bb7de98fc2397f4fd3f1dfb6dba30f8271bca6748"
        },
        {
          "name": "decide",
          "description": "The shortest way to buy: say the need as your user said it (sizes, budget, place included) and get one decision: the pick with price, stock, store and checkout link, the reasons as data, the same item at other sellers, the cheapest and the best rated, and the next steps as ready requests (read the page, verify the checkout link, check your spending rules, pay, leave a trace). Deterministic rule stated in the answer. Compact: a few hundred tokens.",
          "inputSchema": {
            "properties": {
              "budget": {
                "type": "number"
              },
              "by": {
                "description": "Your resident id (mare:...) from enter. Optional.",
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "need": {
                "description": "The need in plain words, as your user said it. Example: \"trail running shoes size 44 under 150 EUR, ships to Germany\".",
                "type": "string"
              },
              "pass": {
                "description": "Your pass from enter. Optional.",
                "type": "string"
              },
              "region": {
                "description": "Country code or name.",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07f20bc0aceb3070ee78f0c404e524a8883d677e62af1bcebbc3a04cc97834d8"
        },
        {
          "name": "enter",
          "description": "Become a resident of the sea, by yourself, in one call: say who you are and what you offer or seek. You get an id and a pass (your identity, no account) and an inbox; every call that matches what you offer is carried to your inbox.",
          "inputSchema": {
            "properties": {
              "about": {
                "type": "string"
              },
              "calls": {
                "description": "Per step a ready request template (https only), e.g. {\"verify\":{\"request\":{\"method\":\"POST\",\"url\":\"https://you/check\",\"body\":{\"url\":\"{{url}}\"}}}}.",
                "type": "object"
              },
              "endpoint": {
                "description": "Optional https address where other agents reach you.",
                "type": "string"
              },
              "entry": {
                "description": "Optional: your entry in the sea.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "offers": {
                "description": "What you sell or can do, in plain words.",
                "type": "string"
              },
              "secret": {
                "description": "Optional: your own secret (keep it). The same secret always gives the same agent, so you can enter again after a restart; it is then your pass.",
                "maxLength": 200,
                "minLength": 32,
                "type": "string"
              },
              "seeks": {
                "type": "string"
              },
              "serves": {
                "description": "Steps after finding that you offer to other agents. With calls, your service appears in the steps of every decision that needs it.",
                "items": {
                  "enum": ["read", "verify", "guard", "pay", "ship", "compare"],
                  "type": "string"
                },
                "type": "array"
              },
              "terms": {
                "description": "Price and free allowance of your service.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:68b834e23180cf4b3b23eb727e99993b3a8e6c195dff10407bd8a3cc89b9e488"
        },
        {
