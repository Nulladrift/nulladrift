      "capabilities": {
        "tools": {}
      },
      "instructions": "Nullary serves negative results from drug discovery — failed compounds, terminated trials, failed CRISPR screens, antibody developability failures, and more. Search is organized by modality; every result carries provenance.",
      "tools": [
        {
          "name": "get_compound",
          "description": "A compound (structure, name, max clinical phase) + its full negative profile across modalities/sources.",
          "inputSchema": {
            "properties": {
              "chembl_id": {
                "description": "ChEMBL molecule ID, e.g. CHEMBL941.",
                "type": "string"
              },
              "inchi_key": {
                "description": "Compound InChIKey (provide one of inchi_key, chembl_id, or pubchem_cid).",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Maximum number of findings to return (1–100, default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of findings to skip before this page, for pagination (default 0).",
                "minimum": 0,
                "type": "integer"
              },
              "pubchem_cid": {
                "description": "PubChem Compound ID (CID).",
                "type": "integer"
              },
              "tier": {
                "default": "curated",
                "description": "Confidence tier. 'curated' (default) returns the credible layer; 'all' also includes high-volume screening-grade rows (PubChem HTS inactives, CRISPR non-essential tails).",
                "enum": ["curated", "all"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "description": "A compound's identity plus its full negative profile across modalities and sources.",
            "properties": {
              "compound": {
                "description": "Identity: pref_name, chembl_id, inchi_key, max_phase.",
                "type": "object"
              },
              "findings": {
                "description": "Every negative finding for this molecule.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "query_metadata": {
                "description": "Echo of the resolved query.",
                "type": "object"
              },
              "returned_count": {
                "type": "integer"
              }
            },
            "required": ["query_metadata"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get compound"
