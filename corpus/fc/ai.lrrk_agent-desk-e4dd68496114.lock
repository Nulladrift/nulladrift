{
  "lockfileVersion": 2,
  "subjects": {
    "ai.lrrk/agent-desk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lrrk.ai/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lrrk-public-agent-desk",
        "title": "LrrK Public Agent Desk",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these read-only tools for already-published LrrK research and service discovery. Each Tuesday, compare saved publication versions and follow all change pages before advancing your checkpoint. Cite the edition and canonical URL for current records. Identify your client with a descriptive User-Agent when opening cited pages. Public evidence does not establish a device-specific assessment or paid entitlement.",
      "tools": [
        {
          "name": "lrrk_check_updates",
          "title": "Check reviewed LrrK updates",
          "description": "Get exact record additions, corrections, and withdrawals between saved published version keys and the current public versions. Follow nextPage with the same knownVersions before saving the new keys. An unknown checkpoint or unavailable source means the exact comparison is incomplete.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "changePage": {
                "additionalProperties": false,
                "description": "Copy a source's nextPage exactly and keep the original knownVersions.",
                "properties": {
                  "corpus": {
                    "enum": ["hal", "letters", "intelligence"],
                    "type": "string"
                  },
                  "offset": {
                    "maximum": 20000,
                    "minimum": 20,
                    "multipleOf": 20,
                    "type": "integer"
                  },
                  "toVersion": {
                    "pattern": "^v2:[a-f0-9]{64}$",
                    "type": "string"
                  }
                },
                "required": ["corpus", "offset", "toVersion"],
                "type": "object"
              },
              "knownVersions": {
                "additionalProperties": false,
                "description": "Version keys from an earlier response. Omit on the first check.",
                "properties": {
                  "hal": {
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "intelligence": {
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "letters": {
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:004d13f6cd549b3094b47b76902ffd9ec391c370d4911aaa7064e292823f4322"
        },
        {
          "name": "lrrk_find_evidence",
          "title": "Find public LrrK evidence",
          "description": "Search published LrrK Letters, reviewed Hardware Attack Library records, and admitted Intelligence Product metadata. Returns bounded excerpts and canonical source links. Historical paid publication bodies are never returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "corpus": {
                "enum": ["all", "hal", "letters", "intelligence"],
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b2c1caaddddc168c6b0a98fc3ef8bc328e6d89da3fab3f76dcc8392f37bb6fbc"
        },
        {
          "name": "lrrk_find_service",
          "title": "Find a LrrK review path",
          "description": "Find LrrK's human-reviewed Assess, Engage, Monitor, or one-question Evidence Brief path for a stated need. Returns criteria and a first-party link; no inquiry is submitted and no work is initiated.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "need": {
                "enum": ["one-question", "device-risk", "authorized-test", "change-monitoring", "unsure"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6fbec6fbc332b5a51b01977a6cb552a71de4a71aaeb3a969ef8e95f3e7bdd4de"
        },
        {
          "name": "lrrk_get_evidence",
          "title": "Get a cited public record",
          "description": "Retrieve the metadata, edition, citations, evidence status and limits for one public LrrK record. A historical Intelligence Product returns metadata and its exact-edition owner handoff only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "kind": {
                "enum": ["hal", "letters", "intelligence"],
                "type": "string"
              }
            },
            "required": ["id", "kind"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0242bac67676ed5f296f56feb4004433c56739399995065dfa91a285ae2ce82b"
        },
        {
          "name": "lrrk_map_coverage",
          "title": "Map public evidence coverage",
          "description": "Map a topic and optional device class to reviewed public references and explicit gaps. Search matches are not device-specific applicability, testing, or risk verdicts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deviceClass": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "topic": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5c7c95092398385a778010199c445d23d19e31b961e35ec0f2ffbe02d5905814"
        }
      ],
      "digest": "sha256:813ed44cc9ea41c060973badc99b296129b0f46ea05de2c6c7858d9cc65c34ba"
    }
  }
}
