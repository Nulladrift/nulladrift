{
  "lockfileVersion": 2,
  "subjects": {
    "co.herakraft.recruiting/job-alerts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://recruiting.herakraft.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "job-alerts",
        "title": "Job Alerts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Catalog of open internship and new-grad roles read from company career sites. search_roles lists open roles; get_role fetches one by id. list_tracks, list_groups and list_companies give the values the track, group and company filters take. Results default to US-eligible roles that do not require US citizenship or a clearance; pass us_only=false, country, or include_clearance=true to widen. Send people to apply_url to apply. Without a Realtime key, roles appear 60 minutes after they are first detected. recent_changes (Realtime) is a feed of roles announced and closed.",
      "tools": [
        {
          "name": "get_role",
          "title": "Get role",
          "description": "One role by its numeric id, including closed roles (status \"closed\", apply_url null). apply_url is the link to send a person to. With a Realtime key, employer_url is the employer posting (fetch it for the description) and ats_job_id the ATS id; both are null otherwise. include_evidence is Realtime.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Role id from search_roles or a /roles/<id> link.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "include_evidence": {
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get role"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:36d987fb4ab312674cd2a38331cba4cf13507b66e9543d6dcd17865365d64bd4"
        },
        {
          "name": "list_companies",
          "title": "List companies",
          "description": "Companies with open early-career roles, most roles first, with their groups and ATS. open_roles counts every country. Pass a name to the company filter of search_roles exactly as returned here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "group": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 64,
                      "type": "string"
                    },
                    "maxItems": 24,
                    "type": "array"
                  },
                  {
                    "maxLength": 4824,
                    "type": "string"
                  }
                ],
                "description": "Only companies in any of these groups; an array or a comma-separated string."
              },
              "limit": {
                "description": "Default 100.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the company name or slug.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List companies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:38187e50ba76c1c04782d025fc571291ae32b142480eb5550c554b608e7327a5"
        },
        {
          "name": "list_groups",
          "title": "List company groups",
          "description": "Company groups the group filter takes: curated lists (faang, ai-companies, quant-hft, ...) and sectors, with member counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List company groups"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:59b29d3283dee4729b2aba7fd264b39c735607bdc27acdaf6e4fb420aa545e72"
        },
        {
          "name": "list_tracks",
          "title": "List tracks",
          "description": "The job tracks the track filter takes (swe, data-ai, quant, ...), with open early-career role counts across every country.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List tracks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8d9329e360e0ba395c987c5c13f15d3cd377a4331018846394e204e1d57a3d88"
        },
        {
          "name": "recent_changes",
          "title": "Recent changes",
          "description": "Feed of role.created (announced) and role.closed events, oldest first after the given event id. Without after, returns the latest events. Pass next_after back as after to poll. Requires an API key on the Realtime plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "after": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "maxLength": 40,
                    "type": "string"
                  }
                ],
                "description": "Event id to read after: next_after from the previous call."
              },
              "citizenship": {
                "description": "\"not_required\" hides roles whose posting requires US citizenship or US-person status (eligibility.citizenship_required true). Roles not read yet stay in. With include_clearance=true it keeps clearance roles that state no citizenship requirement. REST: citizenship.",
                "enum": ["not_required"],
                "type": "string"
              },
              "company": {
                "description": "Exact company name as list_companies returns it. REST: company.",
                "maxLength": 200,
                "type": "string"
              },
              "country": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 2,
                      "type": "string"
                    },
                    "maxItems": 24,
                    "type": "array"
                  },
                  {
                    "maxLength": 4824,
                    "type": "string"
                  }
                ],
                "description": "ISO 3166-1 alpha-2 codes, an array or a comma-separated string. Setting it replaces the US-only default. REST: country."
              },
              "degree": {
                "description": "Keep roles open to this degree program: a posting that names the degrees it accepts must include it; one naming none stays in. REST: degree.",
                "enum": ["bachelors", "masters", "phd"],
                "type": "string"
              },
              "exclude_companies": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  {
                    "maxLength": 10050,
                    "type": "string"
                  }
                ],
                "description": "Company names to leave out; an array or a comma-separated string. REST: exclude."
              },
              "graduation_year": {
                "description": "Hide roles whose graduation window excludes this year. REST: grad.",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              },
              "group": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 64,
                      "type": "string"
                    },
                    "maxItems": 24,
                    "type": "array"
                  },
                  {
                    "maxLength": 4824,
                    "type": "string"
                  }
                ],
                "description": "Company group slugs from list_groups, any of them; an array or a comma-separated string. REST: group."
              },
              "include_clearance": {
                "description": "Default false hides roles requiring US citizenship, US-person status or a clearance. REST: clearance=1.",
                "type": "boolean"
              },
              "level": {
                "description": "Omit for both. REST: level.",
                "enum": ["intern", "new-grad"],
                "type": "string"
              },
              "limit": {
                "description": "Default 50.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Text the role title or company name contains, matched as one phrase. REST: q.",
                "maxLength": 200,
                "type": "string"
              },
              "since": {
                "description": "Only roles posted within this window. REST: since.",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              },
              "sponsorship": {
                "description": "For an applicant who needs visa sponsorship. \"needed\" hides roles whose posting says no sponsorship; roles that do not say, or are not read yet, stay in. \"available\" keeps only roles whose posting says it sponsors. REST: sponsorship.",
                "enum": ["needed", "available"],
                "type": "string"
              },
              "track": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["frontend", "backend", "fullstack", "swe", "cloud-devops", "security", "data-ai", "hardware", "quant", "business", "sales", "pm", "general"],
                      "type": "string"
                    },
                    "maxItems": 24,
                    "type": "array"
                  },
                  {
                    "maxLength": 4824,
                    "type": "string"
                  }
                ],
                "description": "Any of these tracks, as an array or a comma-separated string. \"swe\" covers frontend, backend and fullstack. REST: track."
              },
              "types": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["role.created", "role.closed"],
                      "type": "string"
                    },
                    "maxItems": 2,
                    "type": "array"
                  },
                  {
                    "maxLength": 402,
                    "type": "string"
                  }
                ],
                "description": "role.created, role.closed, or both (the default); an array or a comma-separated string."
              },
              "undergrad": {
                "description": "true hides roles that accept only graduate degrees. REST: undergrad=1, or degree=bachelors.",
                "type": "boolean"
              },
              "us_only": {
                "description": "Default true: roles open to US applicants. false lifts it. REST: us=0.",
                "type": "boolean"
              },
              "workplace": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["onsite", "hybrid", "remote", "flexible"],
                      "type": "string"
                    },
                    "maxItems": 4,
                    "type": "array"
                  },
                  {
                    "maxLength": 804,
                    "type": "string"
                  }
                ],
                "description": "Workplace types, any of them; an array or a comma-separated string. REST: workplace."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:664a9eb1a42039f122c9e2cdfac9291931bf2490c2ac74f92650f66e8b4f7ec2"
        },
        {
          "name": "search_roles",
          "title": "Search roles",
          "description": "Open intern and new-grad roles, newest posting first. Returns {data: Role[], next_cursor, total}. Pass next_cursor back as cursor for the next page. Page size is up to 20 without an API key and 100 with one. Without a Realtime key, roles first detected within the Free plan's delay (minutes in the server instructions) are left out, and employer_url and ats_job_id are null. include_evidence (Realtime) adds the posting sentences behind the sponsorship, citizenship, clearance and graduation fields.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "citizenship": {
                "description": "\"not_required\" hides roles whose posting requires US citizenship or US-person status (eligibility.citizenship_required true). Roles not read yet stay in. With include_clearance=true it keeps clearance roles that state no citizenship requirement. REST: citizenship.",
                "enum": ["not_required"],
                "type": "string"
              },
              "company": {
                "description": "Exact company name as list_companies returns it. REST: company.",
                "maxLength": 200,
                "type": "string"
              },
              "country": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 2,
                      "type": "string"
                    },
                    "maxItems": 24,
                    "type": "array"
                  },
                  {
                    "maxLength": 4824,
                    "type": "string"
                  }
                ],
                "description": "ISO 3166-1 alpha-2 codes, an array or a comma-separated string. Setting it replaces the US-only default. REST: country."
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "maxLength": 200,
                "type": "string"
              },
              "degree": {
                "description": "Keep roles open to this degree program: a posting that names the degrees it accepts must include it; one naming none stays in. REST: degree.",
                "enum": ["bachelors", "masters", "phd"],
                "type": "string"
              },
              "exclude_companies": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  {
                    "maxLength": 10050,
                    "type": "string"
                  }
                ],
                "description": "Company names to leave out; an array or a comma-separated string. REST: exclude."
              },
              "graduation_year": {
                "description": "Hide roles whose graduation window excludes this year. REST: grad.",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              },
              "group": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 64,
                      "type": "string"
                    },
                    "maxItems": 24,
                    "type": "array"
                  },
                  {
                    "maxLength": 4824,
                    "type": "string"
                  }
                ],
                "description": "Company group slugs from list_groups, any of them; an array or a comma-separated string. REST: group."
              },
              "include_clearance": {
                "description": "Default false hides roles requiring US citizenship, US-person status or a clearance. REST: clearance=1.",
                "type": "boolean"
              },
              "include_evidence": {
                "type": "boolean"
              },
              "level": {
                "description": "Omit for both. REST: level.",
                "enum": ["intern", "new-grad"],
                "type": "string"
              },
              "limit": {
                "description": "Default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "posted_after": {
                "description": "ISO 8601 time; only roles posted at or after it.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "query": {
                "description": "Text the role title or company name contains, matched as one phrase. REST: q.",
                "maxLength": 200,
                "type": "string"
              },
              "since": {
                "description": "Only roles posted within this window. REST: since.",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              },
              "sponsorship": {
                "description": "For an applicant who needs visa sponsorship. \"needed\" hides roles whose posting says no sponsorship; roles that do not say, or are not read yet, stay in. \"available\" keeps only roles whose posting says it sponsors. REST: sponsorship.",
                "enum": ["needed", "available"],
                "type": "string"
              },
              "track": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["frontend", "backend", "fullstack", "swe", "cloud-devops", "security", "data-ai", "hardware", "quant", "business", "sales", "pm", "general"],
                      "type": "string"
                    },
                    "maxItems": 24,
                    "type": "array"
                  },
                  {
                    "maxLength": 4824,
                    "type": "string"
                  }
                ],
                "description": "Any of these tracks, as an array or a comma-separated string. \"swe\" covers frontend, backend and fullstack. REST: track."
              },
              "undergrad": {
                "description": "true hides roles that accept only graduate degrees. REST: undergrad=1, or degree=bachelors.",
                "type": "boolean"
              },
              "us_only": {
                "description": "Default true: roles open to US applicants. false lifts it. REST: us=0.",
                "type": "boolean"
              },
              "workplace": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["onsite", "hybrid", "remote", "flexible"],
                      "type": "string"
                    },
                    "maxItems": 4,
                    "type": "array"
                  },
                  {
                    "maxLength": 804,
                    "type": "string"
                  }
                ],
                "description": "Workplace types, any of them; an array or a comma-separated string. REST: workplace."
              }
            },
            "type": "object"
          },
