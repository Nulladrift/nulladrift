        {
          "name": "verfuegbarkeit_pruefen",
          "title": "Freie Zimmer und Preise für einen Zeitraum",
          "description": "Prüft live, welche Zimmerkategorien in einem Zeitraum frei sind, und liefert Endpreise in Euro für den gesamten Aufenthalt. Jedes Angebot enthält einen fertigen Buchungslink mit vorbefülltem Zeitraum und Kategorie — diesen Link unverändert weitergeben und niemals selbst eine Buchungs-URL zusammenbauen. Preise niemals schätzen oder aus älteren Antworten übernehmen. Ist nichts frei, danach alternative_termine aufrufen. WICHTIG: Ein Preis ist noch keine Buchbarkeit — nur Angebote mit sofort_buchbar=true können verbindlich online gebucht werden. Bei false (Grund im Feld grund) dem Gast offen sagen, dass online keine Sofortbuchung möglich ist, und die unverbindliche Anfrage über den Link anbieten, statt Verfügbarkeit zu versprechen. Jedes Angebot hat einen EIGENEN Link inklusive Verpflegungsvariante — immer den Link des Angebots weitergeben, das dem Gast genannt wurde, und ihn nie verändern.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Anzahl Erwachsener (1–4)",
                "type": "integer"
              },
              "check_in": {
                "description": "Anreise JJJJ-MM-TT",
                "type": "string"
              },
              "check_out": {
                "description": "Abreise JJJJ-MM-TT",
                "type": "string"
              },
              "children": {
                "description": "Alter der Kinder in Jahren, kommagetrennt (z. B. \"6,9\"). Das Alter bestimmt den Preis — bitte immer erfragen.",
                "type": "string"
              },
