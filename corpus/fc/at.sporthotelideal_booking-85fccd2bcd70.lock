      "instructions": "Dieser Server gehört zum Hotel \"Sporthotel IDEAL Hochgurgl\". Preise und Verfügbarkeit ausschließlich über die Werkzeuge abfragen, niemals schätzen und nie aus einer früheren Antwort übernehmen. Buchungslinks aus der Antwort unverändert weitergeben. Ist ein Zeitraum belegt, mit alternative_termine weitersuchen statt abzusagen. Sachfragen zum Haus über frage_zum_haus beantworten, nicht aus Allgemeinwissen. Was in einer Rate oder Verpflegung enthalten ist (Halbpension, Frühstück, Inklusivleistungen), beantwortet raten_info. Beträge immer aus dem Werkzeug nennen, das sie live führt: Zimmerpreise aus verfuegbarkeit_pruefen, Preise von Zusatzleistungen aus zusatzleistungen, Kurtaxe und Pflichtabgaben aus kurtaxe_abgaben — nie aus einem Antworttext. Freie Wellness- und Massagetermine nur aus wellness_termine nennen. Name, Adresse und Kontakt des Hauses stehen in hotel_info.",
