      "instructions": "Dieser Server gehört zum Hotel \"Sporthotel IDEAL Hochgurgl\". Preise und Verfügbarkeit ausschließlich über die Werkzeuge abfragen, niemals schätzen und nie aus einer früheren Antwort übernehmen. Buchungslinks aus der Antwort unverändert weitergeben. Ist ein Zeitraum belegt, mit alternative_termine weitersuchen statt abzusagen. Sachfragen zum Haus über frage_zum_haus beantworten, nicht aus Allgemeinwissen. Was in einer Rate oder Verpflegung enthalten ist (Halbpension, Frühstück, Inklusivleistungen), beantwortet raten_info.",
      "tools": [
        {
          "name": "alternative_termine",
          "title": "Ausweichtermine, wenn der Wunschzeitraum belegt ist",
          "description": "Sucht rund um einen belegten Wunschzeitraum nach sofort buchbaren Terminen: gleiche Anreise mit anderer Dauer sowie derselbe Aufenthalt einige Tage früher oder später. Immer dann aufrufen, wenn verfuegbarkeit_pruefen nichts geliefert hat — statt dem Gast nur abzusagen. Die Vorschläge sind live gerechnet und enthalten je Termin einen fertigen Buchungslink.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Anzahl Erwachsener (1–4)",
                "type": "integer"
              },
              "check_in": {
                "description": "Gewünschte Anreise JJJJ-MM-TT",
                "type": "string"
              },
              "check_out": {
                "description": "Gewünschte Abreise JJJJ-MM-TT",
                "type": "string"
              },
              "children": {
                "description": "Alter der Kinder in Jahren, kommagetrennt",
                "type": "string"
              },
              "lang": {
                "description": "Sprachcode, z. B. de, en, it, fr",
                "type": "string"
              }
            },
            "required": ["check_in", "check_out"],
            "type": "object"
          },
