        {
          "name": "verfuegbarkeit_pruefen",
          "title": "Freie Zimmer und Preise für einen Zeitraum",
          "description": "Live availability and total prices of this hotel for given dates, with a ready-made booking link per offer — use this whenever a guest asks for free rooms or prices. Prüft live, welche Zimmerkategorien in einem Zeitraum frei sind, und liefert die Preise in Euro für den gesamten Aufenthalt — je Angebot mit dem Betrag an Kurtaxe und Pflichtabgaben, der dazukommt (zzgl_kurtaxe_abgaben). Jedes Angebot enthält einen fertigen Buchungslink mit vorbefülltem Zeitraum, Kategorie und Personenzahl — diesen Link unverändert weitergeben und niemals selbst eine Buchungs-URL zusammenbauen. Preise niemals schätzen oder aus älteren Antworten übernehmen. Ist nichts frei, danach alternative_termine aufrufen. WICHTIG: Ein Preis ist noch keine Buchbarkeit — nur Angebote mit sofort_buchbar=true können verbindlich online gebucht werden. Bei false (Grund im Feld grund) dem Gast offen sagen, dass online keine Sofortbuchung möglich ist, und die unverbindliche Anfrage über den Link anbieten, statt Verfügbarkeit zu versprechen. Jedes Angebot hat einen EIGENEN Link inklusive Verpflegungsvariante — immer den Link des Angebots weitergeben, das dem Gast genannt wurde, und ihn nie verändern.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of adults (1–4, default 2) / Anzahl Erwachsener",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "Arrival date YYYY-MM-DD / Anreise",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date YYYY-MM-DD / Abreise",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children": {
                "description": "Ages of the children in years, e.g. [6, 9] / Alter der Kinder in Jahren. Das Alter bestimmt den Preis — bitte immer erfragen.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 6,
                "type": "array"
              },
              "lang": {
                "description": "Language code (ISO 639-1) for the answer, e.g. de, en, it, fr, nl / Sprachcode",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              }
            },
            "required": ["check_in", "check_out"],
            "type": "object"
          },
          "outputSchema": {
