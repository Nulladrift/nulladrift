          "name": "search",
          "title": "Inhalte des Hauses durchsuchen",
          "description": "Durchsucht die Inhalte des Hotels (häufige Fragen, Zimmerkategorien, Pauschalen) und liefert Treffer mit id, Titel und Link. Den Volltext eines Treffers danach mit fetch holen. Für Preise und Verfügbarkeit NICHT geeignet — dafür verfuegbarkeit_pruefen verwenden.",
