        {
          "name": "wellness_termine",
          "title": "Freie Wellness-Termine an einem Tag",
          "description": "Live free time slots for spa treatments (massage, beauty) on a given day; books nothing. Prüft live im Wellnessplan des Hauses, zu welchen Uhrzeiten an einem Tag noch ein Termin für eine Behandlung frei ist (Massage, Kosmetik …) — mit den Arbeitszeiten der Mitarbeiter und den schon gebuchten Terminen. Ohne artikel_id kommt die Liste der Behandlungen (behandlungen) mit Dauer und Bereich; mit artikel_id gilt deren Dauer, sonst dauer_minuten oder 60 Minuten. Gezählt werden nur Mitarbeiter des Bereichs der Behandlung (wellness oder kosmetik) — ohne artikel_id Wellness/Massage, für Kosmetik daher artikel_id einer Behandlung mit bereich „kosmetik\" mitgeben. Fragt ein Gast nach einem Wellness- oder Massagetermin, immer hier nachsehen und nur Uhrzeiten aus freie_startzeiten nennen. Die Abfrage reserviert nichts — Termine bucht derzeit die Rezeption; nie einen Termin als gebucht bestätigen. auskunft=false heißt: keine Live-Auskunft, NICHT „ausgebucht\".",
          "inputSchema": {
            "properties": {
              "artikel_id": {
                "description": "Treatment id from behandlungen (optional) / Behandlung aus behandlungen",
                "minimum": 1,
                "type": "integer"
