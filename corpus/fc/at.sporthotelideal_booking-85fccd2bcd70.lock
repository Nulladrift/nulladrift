                "description": "Language code (ISO 639-1) for the answer, e.g. de, en, it, fr, nl / Sprachcode",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              }
            },
            "required": ["datum"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "auskunft": {
                "description": "false = keine Live-Auskunft, NICHT als \"ausgebucht\" deuten",
                "type": "boolean"
