        {
          "name": "zusatzleistungen",
          "title": "Zusatzleistungen mit aktuellen Preisen",
          "description": "Extra services of this hotel with current prices (e.g. garage, pets, Wi-Fi) and live garage availability. Listet die Leistungen, deren Preis das Haus freigegeben hat (z. B. WLAN, Garagenplatz, Haustier, Bademantel, Ladestrom), mit dem aktuellen Preis aus dem Artikelstamm des Hauses und der Abrechnungsart. online_buchbar sagt, ob sich die Leistung bei der Online-Buchung dazubuchen lässt — sonst ist es nur eine Preisauskunft, verrechnet wird vor Ort. Immer hier nachsehen, wenn nach dem Preis einer solchen Leistung gefragt wird — nicht aus frage_zum_haus. \"pro_nacht\" wird bei der Buchung automatisch mit den Nächten multipliziert — nicht selbst hochrechnen. Manche Leistungen haben Saison-Preise: Nennt der Gast Reisedaten, IMMER check_in (Anreisetag) mitgeben — dann ist preis genau der Preis für diesen Aufenthalt. Garagenplatz: Mit check_in UND check_out prüft das Werkzeug live, ob in diesem Zeitraum noch ein Garagenplatz frei ist (Feld garagen_verfuegbarkeit, je Garage verfuegbar true/false) — fragt ein Gast nach einer Garage für seine Reise, immer beide Daten mitgeben und nie ohne diese Prüfung einen Platz zusagen. beschreibung ist der Text des Hauses zur Leistung (in der Sprache lang).",
          "inputSchema": {
            "properties": {
              "check_in": {
                "description": "Arrival YYYY-MM-DD (optional) / Anreise — Preise gelten dann zu diesem Tag",
                "format": "date",
