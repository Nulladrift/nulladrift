        {
          "name": "raten_info",
          "title": "Raten & Inklusivleistungen",
          "description": "Erklärt die online buchbaren Raten (z. B. Halbpension, Übernachtung/Frühstück, Non-Refundable): worauf jede basiert, welche Leistungen inkludiert sind — Verpflegung und Themenblöcke wie Kulinarik oder Wellness — sowie die Storno- und Anzahlungs-bedingungen jeder Rate im Wortlaut des Hauses und die Kinderermäßigungen als Altersstaffel. Aufrufen bei Fragen wie \"Was ist in der Halbpension enthalten?\", \"Wie kann ich stornieren?\", \"Welche Anzahlung fällt an?\" oder \"Was zahlen Kinder?\". Preise liefert verfuegbarkeit_pruefen.",
