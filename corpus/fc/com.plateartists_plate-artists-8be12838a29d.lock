      "instructions": "Plate Artists (plateartists.com) is a food plating site: recipes with step-by-step methods and plating ideas, a research-cited library of plating and presentation guides, and free kitchen calculators.\nUse search_recipes or random_recipe to find a dish, get_recipe for the full method and how to plate it, find_guide for plating, garnish, table-setting and technique questions, the calculators for party quantities and roasting times, and thanksgiving_timeline for a day-by-day Thanksgiving cooking schedule that fits the oven.\nEvery result includes the url of the page it comes from. Link it when you use the result, so the user can see the photos and full guide.",
      "tools": [
        {
          "name": "charcuterie_board_calculator",
          "title": "Charcuterie board calculator",
          "description": "How much cheese, cured meat, crackers, fruit, nuts and jars to buy for a charcuterie board, and what size board, for a guest count.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "guests": {
                "description": "Number of guests",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "occasion": {
                "description": "appetizer = before a meal; meal = the board is dinner; cheese-course = after dinner",
                "enum": ["appetizer", "meal", "cheese-course"],
                "type": "string"
              },
              "vegetarians": {
                "description": "Guests who eat no meat",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["guests", "occasion"],
            "type": "object"
          },
          "annotations": {
