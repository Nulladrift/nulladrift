      "tools": [
        {
          "name": "category_range",
          "title": "Price range and median for AI or virtual receptionists",
          "description": "The range and median monthly cost of AI receptionists or live virtual receptionists at a call volume (3-minute calls), the all-in rate per minute and the range of entry plans. Source: ReceptionistPrices.com, prices checked November 8, 2026, https://www.receptionistprices.com/ai-receptionist-cost/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calls": {
                "default": 150,
                "description": "Calls a month",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "ai, or virtual (live people)",
                "enum": ["ai", "virtual"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c692cfea3e5054c7357c2299fa75b88dadfacf7ccbe3dd4bad0c46e9ee5e4c0"
        },
        {
          "name": "compare_at_volume",
          "title": "Compare receptionists at a call volume",
          "description": "Monthly cost of every AI or virtual receptionist at a call volume and call length, lowest first, from each vendor's cheapest published plan plus overage. Quote-only vendors are listed separately. Defaults: AI receptionists, 3-minute calls. Source: ReceptionistPrices.com, prices checked November 8, 2026, https://www.receptionistprices.com/ai-receptionist-cost/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calls": {
                "description": "Calls a month (13 calls a day, the small-business average in Google CallJoy's testing, is 390)",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "minutes_per_call": {
                "default": 3,
                "description": "Average minutes per call",
                "maximum": 60,
                "minimum": 0.5,
                "type": "number"
              },
              "type": {
                "default": "ai",
                "enum": ["ai", "virtual", "platform", "all"],
                "type": "string"
              }
            },
            "required": ["calls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/receptionistprices-table.html",
            "openai/toolInvocation/invoked": "Prices ready",
            "openai/toolInvocation/invoking": "Reading the price index",
            "openai/widgetAccessible": false
          },
          "digest": "sha256:ff0c357be7e9fc6a389f40ce1b12346340ee1020941b72158280d0a1143bba04"
        },
        {
          "name": "get_vendor_pricing",
          "title": "A receptionist vendor's prices, terms and integrations",
          "description": "One vendor's published plans, overage, cost at 3, 5 and 13 three-minute calls a day, billing terms (rounding, time billed beyond the call, spam, setup fee, contract, trial) and which business tools it writes to, each with the URL and the date it was read. Accepts an id or a name, e.g. \"Ruby\", \"Smith.ai\", \"Rosie\", \"RingCentral\". Source: ReceptionistPrices.com, prices checked November 8, 2026, https://www.receptionistprices.com/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "vendor": {
                "description": "Vendor id or name",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/receptionistprices-table.html",
            "openai/toolInvocation/invoked": "Prices ready",
            "openai/toolInvocation/invoking": "Reading the price index",
            "openai/widgetAccessible": false
          },
          "digest": "sha256:e5c3be2119aff2449290c93baff71d396244bd83000e54063ea6ed4142b2b57f"
        },
        {
          "name": "hire_vs_ai",
          "title": "What hiring a receptionist costs, against AI and virtual receptionists",
          "description": "Monthly cost of an in-house receptionist from BLS data (OEWS median wage for SOC 43-4171, national or by state; ECEC employer benefits other than paid leave, which is already paid inside 2,080 paid hours; NCS paid leave days; JOLTS quits times a published replacement-cost share), for one full-time hire or for full cover of N hours a week, next to the cheapest AI and virtual receptionist at the same call volume. Source: ReceptionistPrices.com, prices checked November 8, 2026, https://www.receptionistprices.com/hire-vs-ai/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calls": {
                "default": 150,
                "description": "Calls a month",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "hours_per_week": {
                "description": "Hours a week the phone must be covered; omit for one full-time hire",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state code, e.g. TX",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:95009e541c5a1095992e9a9039f10dc3811e0bba1a4639a3d00f273a25e0acdc"
        },
        {
          "name": "integrations",
          "title": "Which receptionists write to a business tool",
          "description": "For Clio, MyCase, Lawmatics, HubSpot, GoHighLevel, Google Calendar, Calendly, Jobber, ServiceTitan, Housecall Pro or Towbook: which AI and virtual receptionists document a built-in integration, which connect through Zapier, and the page that shows it. \"Not documented\" means neither the vendor's pages nor the tool's directory show it; it is not a guess. Source: ReceptionistPrices.com, prices checked November 8, 2026, https://www.receptionistprices.com/integrations/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tool": {
                "description": "The business tool",
                "enum": ["Clio", "MyCase", "Lawmatics", "HubSpot", "GoHighLevel", "Google Calendar", "Calendly", "Jobber", "ServiceTitan", "Housecall Pro", "Towbook"],
                "type": "string"
              }
