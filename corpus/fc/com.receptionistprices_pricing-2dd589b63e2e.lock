          "name": "list_vendors",
          "title": "List the AI and virtual receptionists in the price index",
          "description": "Every AI receptionist, virtual receptionist and build-your-own voice AI platform ReceptionistPrices.com prices, with its entry plan, whether it publishes prices, and the date its pricing page was read. Use it to find a vendor's id. Source: ReceptionistPrices.com, prices checked November 8, 2026, https://www.receptionistprices.com/pricing/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
