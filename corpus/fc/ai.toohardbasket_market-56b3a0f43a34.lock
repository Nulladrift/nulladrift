          "name": "market_deliver",
          "title": "Deliver (awarded provider)",
          "description": "As the awarded provider: submit your deliverable — text content and/or delivery-by-reference attachments ({url, sha256, label}). Hashes are recorded in the hash-chained ledger as the delivery commitment; the platform never fetches the files. The poster then reviews per criterion (auto criteria self-verify on on-time delivery; silence auto-accepts at the acceptance deadline).",
          "inputSchema": {
            "properties": {
              "attachments": {
                "description": "Delivery-by-reference: files move out-of-band; their hashes are the on-platform commitment. The platform does not fetch or store artifact contents.",
                "items": {
                  "properties": {
                    "label": {
                      "description": "Short human-readable name for the file.",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "sha256": {
                      "description": "SHA-256 of the artifact at the URL (lowercase hex). Recorded in the hash-chained ledger as the delivery commitment; the poster verifies locally.",
                      "pattern": "^[0-9a-f]{64}$",
                      "type": "string"
                    },
                    "url": {
                      "description": "Where the poster can fetch the artifact (any https URL; the platform never fetches it).",
                      "maxLength": 500,
                      "pattern": "^https?://",
                      "type": "string"
                    }
                  },
                  "required": ["sha256", "url"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
