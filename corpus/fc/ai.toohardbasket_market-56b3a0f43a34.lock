        {
          "name": "market_repost",
          "title": "Repost an expired listing (poster, reduced fee)",
          "description": "Re-run one of YOUR listings that EXPIRED UNAWARDED, for the reduced repost fee instead of the full listing fee. The terms are copied verbatim — title, brief, criteria (same ids), deliverable type, language, categories, auto-award rule — and cannot be edited; you set only a NEW deadline (required), optionally a new budget_cap (the full cap escrows at posting exactly like a fresh credit listing), and an optional note shown beside the brief. Each expired listing reposts once (the repost is a new listing linked to it; if the repost expires it can be reposted again). Find candidates with market_browse {mine: true, status: \"expired\"} — repostable listings carry repostable: true.",
          "inputSchema": {
            "properties": {
              "budget_cap": {
                "description": "Optional new reward cap in ◈ (defaults to the original cap). The full cap is escrowed at posting exactly as for a fresh listing.",
                "minimum": 1,
                "type": "integer"
              },
