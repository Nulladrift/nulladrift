  "subjects": {
    "com.doucebeads/image-to-beads": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://doucebeads.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "doucebeads",
        "title": "豆册 · 图片转拼豆图纸",
        "version": "1.0.0",
        "websiteUrl": "https://doucebeads.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Provide the free chart and material counts first. This server does not generate chibi images or spend credits. Offer the optional Doucebeads Q-version link only as a clearly separate next step. Never send card codes, private history or unnecessary personal data.",
      "tools": [
        {
          "name": "convert_image_to_pattern",
          "title": "把图片转成可打印拼豆图纸",
          "description": "Convert a user-provided PNG/JPEG into an editable fuse-bead chart with real MARD color codes, bead counts, PNG and CSV. Free direct conversion, not AI chibi stylization. Process only images the user authorizes; the image is sent to Doucebeads for this request, never persisted. Prefer base64 from an image/file attachment when the client can pass it; do not invent file URLs. At most 750KB and 1 megapixel. Return the free result first; optionally mention the Q-version link only for users who want stylization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "default": "mard",
                "enum": ["mard", "mard221"],
                "type": "string"
              },
              "colors": {
                "default": 12,
                "maximum": 36,
                "minimum": 2,
                "type": "integer"
              },
              "image_base64": {
                "description": "PNG/JPEG bytes as standard base64 or data:image/png/jpeg;base64. Not a local file path.",
                "maxLength": 1000080,
                "type": "string"
              },
              "image_url": {
                "description": "Optional public HTTPS image on doucebeads.com, images.unsplash.com, i.imgur.com, raw.githubusercontent.com or pbs.twimg.com. Other hosts must use base64. Provide exactly one image source.",
                "maxLength": 2048,
                "type": "string"
              },
              "max_beads": {
                "default": 4096,
                "maximum": 4096,
                "minimum": 64,
                "type": "integer"
              },
              "width": {
                "default": 32,
                "description": "Requested chart width; preserves aspect ratio and may shrink to max_beads.",
                "maximum": 64,
                "minimum": 8,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1ed7d9a7e18b07297e16fce9b53a45b4b8f5f0f4afd11861c5b71ebd5876ecbc"
        },
        {
          "name": "get_conversion_guide",
          "title": "查看图片转图纸与打印指引",
          "description": "Get supported image formats, privacy, request limits, and links to free chart printing or optional paid chibi styling. No image is uploaded by this call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f4d101dd45bae93cf68a2a3759b05b4c41c959593476f2de4a50c2c5ffb0d33"
        },
        {
          "name": "lookup_bead_color",
          "title": "查询MARD色号",
          "description": "Look up a specific MARD bead code; RGB values are community approximations, not official calibrated measurements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "enum": ["mard", "mard221"],
                "type": "string"
              },
              "code": {
                "maxLength": 8,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
