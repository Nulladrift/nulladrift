        {
          "name": "get_signals",
          "title": "Trading Signals",
          "description": "Purpose: Query signals with dynamic filters (symbol / interval / action / score / confidence).\nTriggers (casual questions too): \"what's the signal for BTC / AAPL / 삼성전자?\",\n    \"is X bullish or bearish?\", \"how does X look right now?\". When the user asks whether to\n    trade X, FELPRA gives context (regime, score, measured past hit rate of similar scores),\n    not a conclusion: pass it on as context and do not turn it into a trade call. Always\n    surface the disclaimer.\nWhen to call: drilling into a specific signal slice; symbol-by-symbol scanning;\n    any question about how a live symbol currently looks.\nPrerequisites: market://{market_id}/signals/summary is useful first for the global view.\nNext steps: explain_decision (include=[\"history\",\"feedback\",\"roles\"] for history and per-timeframe roles).\nCaveats: When `symbol`/`coin` is omitted, the whole market is scanned in one\n    consolidated query (2 newest rows per symbol, newest-first scan cap per interval).\n    Results are capped: check `truncated` / `truncated_note` before reading the set\n    as \"the whole market\". Fields that are identical across every returned row are\n    hoisted into `common` and omitted from the rows (see `common_note`); a row-level\n    key, when present, wins over `common`. `warnings` carries only the flags that are\n    true and is omitted entirely when none are. `reason_uncalibrated: true` on a row\n    points at the response-level `reason_uncalibrated_note`.\nOutput nature: Observed signal state computed from live market prices each cycle. signal_score is an internal ranking score, not a probability; bias is its sign. Context for the user's question, not investment advice.",
