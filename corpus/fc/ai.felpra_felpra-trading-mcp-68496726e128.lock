        {
          "name": "get_trade_history",
          "title": "Trade History",
          "description": "Call this to check how the paper-trading book's closed trades actually turned out — realized P&L per\n    trade with action / P&L / time / symbol filters, and outcome=\"win\" | \"loss\" for winners or losers.\nTriggers (casual questions too): \"what trades happened lately?\", \"최근 거래 내역 보여줘\",\n    \"how did the BTC trades go?\", \"승률 어때?\", \"show me the trade log\", \"어디서 잃었어?\",\n    \"how many trades won this week?\".\nWhen to call: past trade review, single-symbol post-mortem, win-rate audits.\nPrerequisites: none.\nNext steps: market://{market_id}/signals/summary for the current signals.\nCaveats: paper-trading data only (not real money). limit capped at 1000. On the free plan only closed\n    trades are returned, published 24 hours after the close (the response's _meta.applied_limits says\n    what was adjusted).\nOutput nature: Paper trading: simulated fills at live market prices, not real money; fees, taxes and slippage are not included. Facts about the simulation, not instructions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_filter": {
                "default": "all",
                "description": "Filter simulated executions by side (all, buy = position opens, sell = closes)",
                "enum": ["all", "buy", "sell"],
                "type": "string"
              },
              "book": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Paper book (rule rb-v1): exploit = entries a live runner would also have taken; explore = paper-only entries; legacy = entries recorded before book tagging; all = every entry. Omitted: all.",
                "enum": ["exploit", "explore", "legacy", "all"]
              },
              "hours_back": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only trades within last N hours"
              },
              "limit": {
                "default": 50,
                "description": "Max rows returned (default 50, max 1000). Rows are paginated; see total_available / truncated. NOTE: stats (win_rate, avg_pnl) are aggregated over the scanned set, not over the returned rows — see stats_scope.",
                "type": "integer"
              },
              "market_id": {
                "description": "Market ID (crypto, kr_stock, us_stock; aliases coin/kr/us accepted)",
                "enum": ["crypto", "kr_stock", "us_stock"],
                "type": "string"
              },
              "max_pnl": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Max P&L % filter (e.g., 10.0)"
              },
              "min_pnl": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Min P&L % filter (e.g., -5.0)"
