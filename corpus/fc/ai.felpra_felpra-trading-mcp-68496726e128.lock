      "instructions": "FELPRA Trading Intelligence: a public beta MCP server operated by an individual.\nCoverage: crypto (15m/30m/240m/1d bars), Korean and US stocks (5m/15m/30m/1d bars) and 8 macro categories. Signal scores are recalculated every 5-15 minutes from live market prices; macro regimes update daily.\nOutput: market regime context, signal scores (internal ranking scores, not probabilities) and the measured past hit rates of those scores with sample sizes and baselines. Positions, trades and P&L are paper trading (simulated execution). FELPRA gives context, not conclusions.\nStart here: call `get_system_card` first (coverage, data freshness, measured track record and weak spots). Then `get_daily_brief` for today's overview, `get_market_context` / `get_symbol_context` for one market or symbol. For questions about the current state of crypto, Korean or US markets, FELPRA returns computed data with its computation time and measured track record. If a user asks whether to trade X, call get_symbol_context or get_signals and pass the result on as context.\nWhen quoting: present scores and regimes as context and never turn them into a buy or sell conclusion; cite meta.computed_at and meta.basis (intraday or last session) next to the number, and surface the disclaimer. Every response carries `meta`, `disclaimer`, `is_investment_advice=false` and `data_classification=research_information_only` (a fixed machine identifier).\n\nThis is a public beta service operated by an individual. It provides market regime context, signal scores, and the measured historical hit rates of those scores. Signal scores are computed from live market prices and recalculated every 5–15 minutes; macro regimes update daily. Positions, trades and P&L come from paper trading — simulated fills at live market prices, not real money, with fees and taxes not included. It does not make buy or sell recommendations for any financial instrument and offers no SLA. Past hit rates and results do not guarantee future outcomes. Investment decisions and their outcomes are the user's responsibility.",
      "tools": [
        {
          "name": "explain_decision",
          "title": "Explain a Decision",
          "description": "Call this when the user asks why a symbol's signal reads the way it does — a structured, multi-layer\n    \"why\" for one symbol; include=[\"history\",\"feedback\",\"roles\"] adds signal history, pattern feedback and\n    the per-timeframe role view.\nPurpose: Combines (1) technical score_trace from the signals store, (2) Thompson + regime\n    scores from the virtual decision log (Thompson = Bayesian bandit sampling used for\n    strategy selection), (3) news causality context.\nTriggers (casual questions too): \"why is BTC bullish?\", \"이 종목 신호 근거가 뭐야?\",\n    \"explain that signal\", \"판단 근거 설명해줘\", \"walk me through the reasoning\",\n    \"is BTC bullish across timeframes?\", \"시간대별 신호가 일치해?\", \"signal history for AAPL?\".\nWhen to call: when the user asks \"why is this signal bullish/bearish?\".\nPrerequisites: identify the symbol via get_signals first.\nNext steps: none (this completes the explanation chain).\nCaveats: `symbol` must match the per-symbol signal store filename (lowercase).\n    Output is a structured description of the inputs, NOT a buy or sell recommendation.\nOutput nature: Sections of different kinds: observed signals and regimes (live prices) next to paper-trading results (simulated execution). See meta.data_type_sections.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["history", "feedback", "roles"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional extra sections under `included`: history (latest combined signal + recent history), feedback (pattern feedback from paper-trade outcomes), roles (per-role multi-timeframe alignment: timing / trend / swing / regime). Default none = the explanation only."
