        {
          "name": "get_prediction_accuracy",
          "title": "Prediction Accuracy",
          "description": "Call this first when judging how FELPRA's macro calls have held up — per-cell hit rates with honest\n    baselines; granularity=\"monthly\" for the month-by-month trend.\nPurpose: Per-cell (category, target_market, lag_bucket) hit rates WITH the honest\n    baselines (schema 1.1): persistence_accuracy (the null model — regimes are\n    sticky, so raw accuracy mostly measures regime persistence, not alpha),\n    skill_score with autocorrelation-corrected skill_ci_95, n_effective vs\n    n_nominal, and accuracy_v2_only (post 2026-07-08 methodology cutover).\n    edge_cells/anti_predictive_cells are judged on persistence-skill (criteria v2),\n    forecast cells only.\nTriggers (casual questions too): \"how accurate are your predictions?\",\n    \"예측 잘 맞아?\", \"track record 있어?\", \"can I trust these forecasts?\",\n    \"적중률 보여줘\", \"does macro actually predict these markets?\".\nWhen to call: first, when an AI agent evaluates how FELPRA calls have held up.\nPrerequisites: none.\nNext steps: get_ledger_integrity (tamper-evidence for these numbers),\n    granularity=\"monthly\" (time series), get_signal_calibration (Level-1 signal confidence reliability).\nCaveats: raw accuracy without skill_score is misleading for sticky regimes —\n    a 99% cell can be pure persistence (measured 2026-07: +0.05pp over null).\n    Judge by skill_ci_95, filter horizon_type='forecast', and treat n_nominal\n    as correlated trials (use n_effective). Monthly accuracy trends largely\n    track market stickiness, not model improvement.\nOutput nature: Past calls and their realized outcomes, judged after the fact, with sample sizes and baselines. Past hit rates describe the past, not future outcomes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional macro category filter (bonds, forex, vix, commodities, credit, liquidity, inflation, energy)"
              },
              "compact": {
                "default": true,
                "description": "Compact view (default true): per cell only the baselined hit-rate object plus lifecycle and skill; methodology, known_biases and ledger_health become pointers. false returns every field.",
                "type": "boolean"
              },
              "forecast_only": {
                "default": false,
                "description": "Only forecast cells (exclude nowcast). Default false.",
                "type": "boolean"
              },
              "granularity": {
                "default": "cell",
                "description": "cell (default) = per-cell hit rates with baselines; monthly = monthly accuracy time series per (category, target_market, lag_bucket) — compact / forecast_only / limit do not apply.",
                "enum": ["cell", "monthly"],
                "type": "string"
              },
              "limit": {
                "anyOf": [
                  {
                    "maximum": 200,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum number of cells to return (response carries total/returned/truncated)."
              },
              "target_market": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional target market filter (crypto, kr_stock, us_stock). Aliases coin/kr/us and any letter case are accepted.",
                "enum": ["crypto", "kr_stock", "us_stock"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "data_classification": {
                "anyOf": [
                  {
                    "const": "research_information_only",
