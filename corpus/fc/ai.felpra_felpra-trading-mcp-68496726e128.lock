                "default": null,
                "description": "filter e.g. \"vix\", \"bonds\", \"commodities\""
              },
              "status": {
                "default": "all",
                "description": "\"all\" | \"resolved\" | \"open\"",
                "type": "string"
              },
              "target_market": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "filter e.g. \"coin_market\" / \"kr_market\" / \"us_market\". Aliases coin/kr/us and any letter case are accepted.",
