        {
          "name": "search",
          "title": "Search",
          "description": "Purpose: ChatGPT-connector-standard discovery search over FELPRA's live surface —\n    tools, resources, and the latest score-ranked combined signals across crypto /\n    kr_stock / us_stock. Returns result ids consumable by the `fetch` tool.\nTriggers: ChatGPT connectors and Deep Research call this automatically for any\n    user query routed to FELPRA (\"bitcoin signal\", \"prediction accuracy\",\n    \"korean stocks today\", ...). Other AI clients may use it as a keyword\n    starting point when unsure which tool/resource to call.\nWhen to call: first step of connector-style discovery. MCP-native clients can\n    instead browse tools/list + resources/list directly.\nPrerequisites: none.\nNext steps: pass any result id to `fetch` for the full document.\nCaveats: corpus is rebuilt at most every 10 minutes (tool/resource catalog +\n    top-20 signals by |score| per market). Ticker / company-name queries (BTC, NVDA,\n    삼성전자) resolve to `signal:{market}:{symbol}` first; market words (S&P, KOSPI,\n    crypto) surface that market's resources. Every result id is fetchable. Empty\n    results come with a `note` explaining coverage.\nOutput: {results: [{id, title, url}], disclaimer, is_investment_advice,\n    data_classification} — flat envelope, OpenAI fixed shape.\nOutput nature: Observed signal state computed from live market prices each cycle. signal_score is an internal ranking score, not a probability; bias is its sign. Context for the user's question, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "free-text search string (English/Korean, symbols like BTC/AAPL)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "`full_data` for search — 실응답에서 추출(2026-09-23).",
            "properties": {
              "results": {
                "items": {},
                "type": "array"
              }
            },
            "type": "object"
          },
