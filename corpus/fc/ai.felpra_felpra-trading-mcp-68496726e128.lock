        {
          "name": "get_system_card",
          "title": "System Card",
          "description": "Purpose: Start here. One-page card for an agent meeting FELPRA for the first time: what it is (public\n    beta, operated by an individual, SLA: none), coverage (markets, bar intervals, universe sizes), data\n    freshness (ok / degraded per pipeline component), and the measured track record with weak spots.\nWhen to call: first, before any other FELPRA tool, or when asked how reliable FELPRA is.\nNext steps: get_daily_brief, get_market_context, get_symbol_context, get_signal_calibration,\n    get_prediction_accuracy.\nCaveats: on the free plan the card also lists what the Pro plan adds (no tool names). Every number is read from the judgment ledgers at request time (cached 15 minutes). Cells below\n    their minimum sample (track_record.*.min_n) show n and days but no rates. Calibration is ECE with a\n    bucket-midpoint approximation; Brier is not computed. Profit metrics are not in this card.\nOutput nature: Service status, coverage and past measured hit rates against baselines, judged after the\n    fact. Past hit rates do not guarantee future outcomes.",
