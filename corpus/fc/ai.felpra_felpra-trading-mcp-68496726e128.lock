        {
          "name": "get_performance_metrics",
          "title": "Performance Metrics",
          "description": "Purpose: Portfolio-level performance metrics (MDD / Sharpe / Sortino / Calmar /\n    monthly returns / equity curve) over a FIXED window — the single canonical\n    computation path shared by the FELPRA blog and external clients.\nTriggers (casual questions too): \"what's the max drawdown?\", \"MDD 얼마야?\",\n    \"샤프 비율 보여줘\", \"monthly returns table?\", \"트랙레코드 지표\", \"에쿼티 커브 데이터\".\nWhen to call: track-record verification, blog figure cross-checks, risk review.\nPrerequisites: none.\nNext steps: get_trade_history for the underlying trades.\nCaveats: paper-trading data under a SYNTHETIC fixed-book capital model\n    (400 slots, anchor 2026-06-16 — see capital_model in the response).\n    account_type is REQUIRED; 'live' returns an explicit no-data error until\n    real-money records exist (paper and live curves are never concatenated).\n    Fixed window → same inputs always reproduce the same numbers (as-of verifiable).\nOutput nature: Paper trading: simulated fills at live market prices, not real money; fees, taxes and slippage are not included. Facts about the simulation, not instructions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_type": {
                "description": "REQUIRED. 'paper' (simulated) or 'live' (real — not yet available).",
                "type": "string"
              },
              "book": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Paper book (rule rb-v1): exploit = entries a live runner would also have taken; explore = paper-only entries; legacy = entries recorded before book tagging; all = every entry. Omitted: all.",
                "enum": ["exploit", "explore", "legacy", "all"]
              },
              "include_daily_curve": {
                "default": false,
                "description": "include per-day equity curve rows (default false).",
                "type": "boolean"
              },
              "market": {
                "description": "coin | kr | us | all (aliases crypto/kr_stock/us_stock accepted). 'all' = fixed 1/3 allocation across the three books.",
                "type": "string"
              },
              "window_end": {
