{
  "lockfileVersion": 2,
  "subjects": {
    "com.repolode/repolode": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://repolode.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "repolode",
        "title": "Repolode",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Repolode helps you choose open-source projects: it screens GitHub projects daily and compares similar ones from their code, real usage (package downloads) and maintenance. Before adding a dependency, tool or MCP server, call choose_project with the need (and language or license constraints) to get the recommended project, the alternatives and when each fits; compare_projects returns a whole comparison by group slug, and get_repo shows how one project compares within its group. Use search_repos to find projects, get_repo for a project's details (summary, features, quick start, limitations, license), find_alternatives for open-source replacements of a commercial product, trending for this week's fastest-growing projects, and list_collections / get_collection for topic lists. Pass locale (zh, en, ja, ko, es, pt, ru) to get text in that language.",
      "tools": [
        {
          "name": "choose_project",
          "title": "Choose an open-source project for a need",
          "description": "Recommends open-source projects for a need (e.g. 'MCP server to query Postgres', 'self-hosted Google Photos replacement', 'terminal coding agent'), from Repolode's comparisons of similar projects: the default pick, strong alternatives and specialists, when to choose and avoid each, plus a scenario guide. Projects are judged on code substance, engineering, real usage (downloads) and maintenance, not stars alone. Falls back to keyword search when no comparison covers the need.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Only projects written in this language, as GitHub names it (e.g. 'Python', 'TypeScript').",
                "type": "string"
              },
              "limit": {
                "description": "How many results, at most 15; default 10.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "What the project should do, in plain words.",
                "type": "string"
              },
              "permissive_license": {
                "description": "Only permissively licensed projects (MIT, Apache-2.0, BSD, ISC, MPL-2.0…).",
                "type": "boolean"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:618f7b73b9b959b89f22390baecef521d6077c666340f29182ffeea6d650c9a7"
        },
        {
          "name": "compare_projects",
          "title": "Compare similar projects",
          "description": "The full comparison of one group of similar projects, by slug (from choose_project or list_collections): every project's role (leader, strong_alternative, specialist, newcomer_to_watch, me_too, wrapper, addon), verdict, when to choose and avoid it, with license, maintenance and download numbers.",
          "inputSchema": {
            "properties": {
              "group": {
                "description": "Group slug, e.g. 'database-mcp-servers'.",
                "type": "string"
              }
            },
            "required": ["group"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:863f4bb496238cc083411c154a8d3709f2a43088f47a4f455f0bc944a7c239e7"
        },
        {
          "name": "find_alternatives",
          "title": "Find open-source alternatives",
          "description": "Open-source alternatives to a commercial product or service (e.g. 'Notion', 'Google Analytics', 'Zapier'), most-starred first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many results, at most 25; default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the summaries; default en.",
                "enum": ["zh", "en", "ja", "ko", "es", "pt", "ru"],
                "type": "string"
              },
              "product": {
                "description": "Product name, e.g. 'Notion'.",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b15c85f7e5dc8134301ede841beba3de241e4178561a66c7144bcb5b59dbb94d"
        },
        {
          "name": "get_collection",
          "title": "Get a topic collection",
          "description": "Projects in one topic collection, by slug from list_collections.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many results, at most 30; default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the summaries; default en.",
                "enum": ["zh", "en", "ja", "ko", "es", "pt", "ru"],
                "type": "string"
              },
              "slug": {
                "description": "Collection slug, e.g. 'mcp-servers'.",
                "type": "string"
              },
              "sort": {
                "description": "Order; default most stars.",
                "enum": ["stars", "trending", "added", "updated"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03034cbe6a277e512a22bf223c589270df121ff5a8cc01390f90c7dc026f0180"
        },
        {
          "name": "get_repo",
          "title": "Get a project's write-up",
          "description": "Full Repolode write-up of one GitHub project: summary, description, features, use cases, quick start commands, limitations, license, stars, what it replaces, and maintenance signals (recent commits and contributors, releases, CI, tests, issue responses).",
          "inputSchema": {
            "properties": {
              "locale": {
                "description": "Language of the summaries; default en.",
                "enum": ["zh", "en", "ja", "ko", "es", "pt", "ru"],
                "type": "string"
              },
              "repo": {
                "description": "GitHub repo as 'owner/name' or its URL.",
                "type": "string"
              }
            },
            "required": ["repo"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de9f129dfc3b6770f795867644dbdafd584b02fbad5a47691e8c5b2ea5010c8f"
        },
        {
          "name": "list_collections",
          "title": "List topic collections",
          "description": "Repolode's topic collections (e.g. AI agents, MCP servers, self-hosted apps) with their slug and project count.",
          "inputSchema": {
            "properties": {
              "locale": {
                "description": "Language of the summaries; default en.",
                "enum": ["zh", "en", "ja", "ko", "es", "pt", "ru"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cb12d3c21238035e83def54c866aca55215bfc34d4abc19b899fbf4419b7e6d"
        },
        {
          "name": "search_repos",
          "title": "Search open-source projects",
          "description": "Search Repolode's curated open-source projects by keyword, category or programming language. Returns name, one-line summary, stars, weekly star gain, license and links.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Limit to one category.",
                "enum": ["ai", "devtools", "frontend", "backend", "database", "devops", "security", "mobile", "data", "productivity", "learning", "other"],
                "type": "string"
              },
              "language": {
                "description": "Programming language as GitHub names it, e.g. 'Python', 'TypeScript', 'Rust'.",
                "type": "string"
              },
              "limit": {
                "description": "How many results, at most 25; default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the summaries; default en.",
                "enum": ["zh", "en", "ja", "ko", "es", "pt", "ru"],
                "type": "string"
              },
              "query": {
                "description": "Keywords, e.g. 'self-hosted notes' or 'mcp server for postgres'.",
                "type": "string"
              },
              "sort": {
                "description": "Order: most stars (default), trending this week, recently added, recently updated.",
                "enum": ["stars", "trending", "added", "updated"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e20e8e6e627a84fba277893165de327ac8da01029935354e4c3649e702626bb5"
        },
        {
          "name": "trending",
          "title": "Trending this week",
          "description": "Projects that gained the most GitHub stars over the last 7 days, optionally within one category.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Limit to one category.",
                "enum": ["ai", "devtools", "frontend", "backend", "database", "devops", "security", "mobile", "data", "productivity", "learning", "other"],
                "type": "string"
              },
              "limit": {
                "description": "How many results, at most 25; default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the summaries; default en.",
                "enum": ["zh", "en", "ja", "ko", "es", "pt", "ru"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19fe70e4230d4825a83fecbbeeaceae637aa7c07e1d9d8cff12e07ed647df714"
        }
      ],
      "digest": "sha256:81170c35d4898e366ab6eab18be109b3a9de04175f4fcef16400d39c3db7ff0a"
    }
  }
}
