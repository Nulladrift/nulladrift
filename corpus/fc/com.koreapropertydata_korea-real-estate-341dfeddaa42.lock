                "description": "Minimum deposit in KRW (won), inclusive.",
                "title": "Min Deposit Krw"
              },
              "property_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Property type: APT (apartment), OFFI (officetel), RH (row / multi-unit house), SH (detached or multi-family house). Omit for all four.",
                "title": "Property Type"
              },
              "region": {
                "description": "Where to search: a 5-digit si/gun/gu code (11680 = Gangnam-gu, Seoul), a 2-digit si/do prefix (11 = all of Seoul), a city code that has districts (41110 = all of Suwon), or a name such as 'Gangnam-gu' or '강남구'. Use search_regions to look a code up.",
                "title": "Region",
                "type": "string"
              },
              "rent_type": {
                "anyOf": [
                  {
                    "type": "string"
