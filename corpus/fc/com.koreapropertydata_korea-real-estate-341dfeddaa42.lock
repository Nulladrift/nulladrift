                "default": null,
                "description": "Maximum deposit in KRW (won), inclusive.",
                "title": "Max Deposit Krw"
              },
              "max_monthly_rent_krw": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum monthly rent in KRW (won), inclusive; jeonse leases have 0.",
                "title": "Max Monthly Rent Krw"
              },
              "min_area_m2": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum area in m², inclusive; filters each record's area_m2.",
                "title": "Min Area M2"
              },
              "min_deposit_krw": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
