              "date_to": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last contract month to include, YYYY-MM, inclusive. Omit for up to the latest month.",
                "title": "Date To"
              },
              "lang": {
                "default": "en",
                "description": "Language of names and labels: en (default), ko or zh. Codes, amounts and dates are the same in every language.",
                "title": "Lang",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Rows per page, 1-500. The BASIC plan and keyless calls return at most 50 rows per page.",
                "title": "Limit",
                "type": "integer"
              },
              "max_area_m2": {
                "anyOf": [
