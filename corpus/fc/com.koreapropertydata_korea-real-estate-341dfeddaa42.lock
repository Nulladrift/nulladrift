      "serverInfo": {
        "name": "korea-real-estate",
        "title": "Korea Real Estate Transactions",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Official South Korean real estate transaction records (MOLIT, via data.go.kr): every reported sale and lease (jeonse / monthly rent) by district, normalized to English. Amounts are KRW integers, areas are m². `region` accepts a 5-digit si/gun/gu code (11680 = Gangnam-gu), a 2-digit si/do prefix (11 = Seoul) or a name such as 'Gangnam-gu' or '강남구'; use search_regions when unsure. Dates are months in YYYY-MM. Results page with `cursor` (pass meta.next_cursor back). meta.coverage tells which months are loaded for the region, so an empty result can be told apart from data that is not collected yet. Attribution: MOLIT RTMS via data.go.kr, KOGL Type 1.",
      "tools": [
        {
          "name": "complex_summary",
          "title": "Complex summary",
          "description": "Summarize one apartment complex: master record, prices by exclusive-area band over the last\n        `months`, and the 10 latest sales. Pass `complex_seq` (e.g. \"11680-2246\"), or `region` + `name` (Korean\n        complex name, partial match) to look it up; several matches return the candidates to choose from.",
          "inputSchema": {
            "properties": {
              "complex_seq": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Complex ID such as '11680-2246' (complex_seq in sale and lease results). Pass this, or region together with name.",
                "title": "Complex Seq"
              },
              "lang": {
                "default": "en",
                "description": "Language of names and labels: en (default), ko or zh. Codes, amounts and dates are the same in every language.",
                "title": "Lang",
                "type": "string"
              },
              "months": {
                "default": 24,
                "description": "How many recent months the price summary covers, 1-240.",
                "title": "Months",
                "type": "integer"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With region: the complex name in Korean, partial match (e.g. '래미안').",
                "title": "Name"
              },
              "region": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With name: the district to look in, as a code or name (see search_regions).",
                "title": "Region"
              }
            },
            "title": "complex_summaryArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "complex_summaryDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:892314933eaa6b98357c535274ae5aca2108787a41c3d5dfacbae189c0ed8e91"
        },
        {
          "name": "coverage",
          "title": "Data coverage",
          "description": "Nationwide data freshness per source: latest collected deal month, last refresh time and row count\n        for each property type and kind (sale / rent).",
          "inputSchema": {
            "properties": {},
            "title": "coverageArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "coverageDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85379fc9780450ce1e99a8ac375e9bcaa7a0296c519e4ef79ebd000939646029"
        },
        {
          "name": "monthly_stats",
          "title": "Monthly statistics",
          "description": "Monthly aggregates per district and property type: deal counts, median / mean / quartile prices and\n        price per m² for sales; set rent_type (JEONSE or MONTHLY) for lease statistics instead (median deposit,\n        median monthly rent, renewal share). Sale counts and prices exclude cancelled deals (n_cancelled counts\n        them). BUSINESS plan (ULTRA on RapidAPI).",
          "inputSchema": {
            "properties": {
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Paging token: pass meta.next_cursor from the previous result to get the next page. Omit for the first page.",
                "title": "Cursor"
              },
              "date_from": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First contract month to include, YYYY-MM (e.g. 2025-01). Omit for no lower bound (the BASIC plan and keyless calls cover only the last 3 months).",
                "title": "Date From"
              },
              "date_to": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last contract month to include, YYYY-MM, inclusive. Omit for up to the latest month.",
                "title": "Date To"
              },
              "lang": {
                "default": "en",
                "description": "Language of names and labels: en (default), ko or zh. Codes, amounts and dates are the same in every language.",
                "title": "Lang",
                "type": "string"
              },
              "limit": {
                "default": 120,
                "description": "Rows per page, 1-500.",
                "title": "Limit",
                "type": "integer"
              },
              "property_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Property type. Sales: APT, OFFI, RH, SH, LAND, NRG, SILV, INDU; leases (with rent_type): APT, OFFI, RH, SH. Omit for all types.",
                "title": "Property Type"
              },
              "region": {
                "description": "Where to search: a 5-digit si/gun/gu code (11680 = Gangnam-gu, Seoul), a 2-digit si/do prefix (11 = all of Seoul), a city code that has districts (41110 = all of Suwon), or a name such as 'Gangnam-gu' or '강남구'. Use search_regions to look a code up.",
                "title": "Region",
                "type": "string"
              },
              "rent_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Set JEONSE or MONTHLY for lease statistics. Omit for sale statistics.",
                "title": "Rent Type"
              }
            },
            "required": ["region"],
            "title": "monthly_statsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "monthly_statsDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
