        {
          "name": "search_sales",
          "title": "Search sale transactions",
          "description": "List reported sale transactions in a region, newest first.\n        property_type: APT apartment, OFFI officetel, RH row/multi-unit house, SH detached house, LAND, NRG\n        commercial/office, SILV pre-sale right, INDU factory/warehouse (omit for all).\n        date_from/date_to: months, YYYY-MM, inclusive. sort: deal_date_desc | deal_date_asc | price_desc | price_asc.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
