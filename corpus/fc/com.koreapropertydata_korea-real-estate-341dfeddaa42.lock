        {
          "name": "search_regions",
          "title": "Search regions",
          "description": "Find region codes by name (English, Korean or Chinese), e.g. \"Gangnam\", \"Suwon\", \"해운대\".\n        level: 1 = si/do (province/metro city), 2 = si/gun/gu (district), 3 = eup/myeon/dong.\n        Each result has `region_code`, the value to pass as `region` to the other tools.",
          "inputSchema": {
            "properties": {
              "level": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this level: 1 = si/do (province or metropolitan city), 2 = si/gun/gu (city, county or district), 3 = eup/myeon/dong (town or neighbourhood). Omit for all levels.",
                "title": "Level"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of results, 1-500.",
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "Region name or part of it, in English, Korean or Chinese (e.g. 'Gangnam', 'Suwon', '해운대').",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_regionsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_regionsDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d8a156f8017bd4600772a6d2163cd168d3ad3b291a113515a46777ff0763cbf"
        },
        {
