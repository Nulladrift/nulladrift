          "title": "Search lease transactions",
          "description": "List reported lease transactions in a region, newest first.\n        rent_type: JEONSE (lump-sum deposit, no monthly rent) or MONTHLY. contract_type: NEW or RENEWAL.\n        property_type: APT, OFFI, RH or SH. date_from/date_to: months, YYYY-MM, inclusive.\n        min_area_m2/max_area_m2 filter area_m2: exclusive area, or the contracted floor area for SH.",
