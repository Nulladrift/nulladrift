            "properties": {
              "contract_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "NEW (new contract) or RENEWAL (renewed with the same tenant). Omit for both.",
                "title": "Contract Type"
              },
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
