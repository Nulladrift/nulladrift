          },
          "digest": "sha256:4aa2ad91105c00e6e7f654780a5c8b166954581834e061bffc72d9b2d02b7355"
        },
        {
          "name": "list_presets",
          "title": "Preset catalogue with loudness targets",
          "description": "Lists every preset with its target loudness in LUFS. The keys it returns are the only style values master_track and batch_master accept. To audition two to six of them on your own track, use preview_styles; for the full service manifest rather than presets, use get_service_info. No cost.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "presets": {
                "items": {
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "target_lufs": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["presets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f701dd03e75249510bb8088373ca8f8cb0ab2af7ab6987f53e1c5fe1312e5e6f"
        },
        {
          "name": "master_track",
          "title": "Single-track master job",
          "description": "Renders one track into a finished master. Each run draws one credit if the account holds a balance; without one it falls back to the free allowance (1 free master per day (UTC), no advanced modules). The job id comes back at once; follow progress with get_job. A run usually finishes in 20-60 s and can take up to 10 min when restoration is on. This server downloads the source itself, so 100 MB per file is the upper bound. Set dry_run=true to see the planned charge and the effective settings with nothing spent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_url": {
                "description": "Track address as a public https link: a direct file (wav, mp3, flac, m4a) or a sharing link, which the server opens for you.",
                "type": "string"
              },
              "bitrate": {
                "description": "Kbps setting. MP3: 128, 192, 256 or 320. OPUS: 128 or 192.",
                "type": "integer"
              },
              "denoise_strength": {
                "description": "Noise reduction on a 0 to 1 scale; 0 turns it off.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "dither_type": {
                "description": "Applied only when the output is 16-bit WAV. Options: tpdf, the default, plus two noise-shaping variants, ns_e and ns_itu.",
                "enum": ["tpdf", "ns_e", "ns_itu"],
                "type": "string"
              },
              "dry_run": {
                "description": "Planning only: reports the expected charge and effective settings. No credit is spent and the file is not downloaded.",
                "type": "boolean"
              },
              "intensity": {
                "description": "Strength factor for the preset's multiband stage. The designed value is 1.0; below it gives a softer result, above it a denser one. Out-of-range input is clamped into 0.5 to 1.5.",
                "maximum": 1.5,
                "minimum": 0.5,
                "type": "number"
              },
              "out_format": {
                "description": "Container and encoding of the rendered file.",
                "enum": ["wav", "wav24", "mp3", "flac", "opus", "aac"],
                "type": "string"
              },
              "remove_watermark": {
                "description": "Runs AI artifact cleanup before mastering as well.",
                "type": "boolean"
              },
              "restore_dynamics": {
                "description": "Expands a crushed source before mastering; intended for the unlimiter style.",
                "type": "boolean"
              },
              "style": {
                "description": "Preset identifier, such as edm, hiphop, podcast or unlimiter (the full set is in list_presets). Falls back to standard.",
                "type": "string"
              },
              "target_lufs": {
                "description": "Replaces the preset's loudness goal, e.g. -14 for a Spotify-style target.",
                "type": "number"
              },
              "webhook_url": {
                "description": "HTTPS endpoint that receives the finished result by POST, as an alternative to polling.",
                "type": "string"
              }
            },
            "required": ["audio_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dry_run": {
                "type": "boolean"
              },
              "job_id": {
                "type": "string"
              },
              "nothing_was_charged": {
                "type": "boolean"
              },
              "poll_with": {
                "type": "string"
              },
              "tokens_balance": {
                "type": "integer"
              },
              "would_charge": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
