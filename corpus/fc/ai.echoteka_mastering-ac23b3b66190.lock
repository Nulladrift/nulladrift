        {
          "name": "list_presets",
          "title": "List mastering presets",
          "description": "All mastering presets with their target loudness in LUFS. Call this to get the exact preset keys that master_track and batch_master accept. Use preview_styles instead when you want to HEAR 2-6 of them on the actual track before choosing, and get_service_info when you need the wider service manifest rather than the preset list. Free.",
          "inputSchema": {
