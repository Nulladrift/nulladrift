        },
        {
          "name": "master_track",
          "title": "Master a track",
          "description": "Master one track. Uses 1 CREDIT when the account has a balance; otherwise it runs on the free quota (1 free master per day (UTC), without advanced modules). Returns a job id immediately - poll get_job (typical 20-60 s, up to 10 min with restoration). The source is fetched by this server, so the ceiling here is 100 MB per file. Pass dry_run=true first if you want to see what would be used and the effective settings before anything is spent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_url": {
                "description": "Public https URL of the audio file (wav/mp3/flac/m4a). A share link to the page works too — Suno/Udio song pages, Google Drive and Dropbox links are resolved to the file automatically.",
                "type": "string"
              },
              "bitrate": {
                "description": "MP3: 128/192/256/320; OPUS: 128/192.",
                "type": "integer"
              },
              "denoise_strength": {
                "description": "Noise reduction, 0-1. 0 disables.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "dither_type": {
                "description": "Dither for 16-bit WAV output: tpdf (default), ns_e or ns_itu (noise-shaped).",
                "enum": ["tpdf", "ns_e", "ns_itu"],
                "type": "string"
              },
              "dry_run": {
                "description": "Do not master: report what this call would use and what settings would apply. Nothing is charged, the file is not even downloaded.",
                "type": "boolean"
              },
              "intensity": {
                "description": "Multiplier on the preset's multiband compression: 1.0 as designed, 0.5 gentler, 1.5 denser. Values outside 0.5-1.5 are clamped.",
                "maximum": 1.5,
                "minimum": 0.5,
                "type": "number"
              },
              "out_format": {
                "enum": ["wav", "wav24", "mp3", "flac", "opus", "aac"],
                "type": "string"
              },
              "remove_watermark": {
                "description": "Also run AI artifact cleanup first. Free.",
                "type": "boolean"
              },
              "restore_dynamics": {
                "description": "Open up a brickwalled source before mastering (pairs with style unlimiter).",
                "type": "boolean"
              },
              "style": {
                "description": "Preset key from list_presets, e.g. edm, hiphop, podcast, unlimiter. Default standard.",
                "type": "string"
              },
              "target_lufs": {
                "description": "Override the preset target, e.g. -14 for Spotify.",
                "type": "number"
              },
              "webhook_url": {
                "description": "Public https URL to POST the result to instead of polling.",
                "type": "string"
              }
            },
            "required": ["audio_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dry_run": {
                "type": "boolean"
              },
              "job_id": {
                "type": "string"
              },
              "nothing_was_charged": {
                "type": "boolean"
              },
              "poll_with": {
                "type": "string"
              },
              "tokens_balance": {
                "type": "integer"
              },
              "would_charge": {
                "type": "string"
              }
            },
            "type": "object"
          },
