      "instructions": "Audio mastering tools. Analysis, AI artifact cleanup, preset previews and job status are free. 1 full master per day (UTC) is free without an account; extra masters use credits, which a human buys on the website - an agent cannot pay. Full rules: resource echoteka://playbook.",
      "tools": [
        {
          "name": "analyze_track",
          "title": "Analyze a track",
          "description": "Measure integrated LUFS, sample peak, duration, sample rate and stereo correlation without processing. Free, a couple of seconds. Run this before choosing a preset. Note: true peak and loudness range are NOT part of this fast pass — they are measured on the result and come back from get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_url": {
                "description": "Public https URL of the audio file (wav/mp3/flac/m4a). A share link to the page works too — Suno/Udio song pages, Google Drive and Dropbox links are resolved to the file automatically.",
                "type": "string"
              }
            },
            "required": ["audio_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "channels": {
                "type": ["integer", "null"]
              },
              "duration_sec": {
                "type": ["number", "null"]
              },
              "genre_suggestion": {},
              "lufs": {
                "type": ["number", "null"]
              },
              "peak_dbfs": {
                "type": ["number", "null"]
              },
              "sample_rate": {
                "type": ["integer", "null"]
              },
              "stereo_correlation": {
                "type": ["number", "null"]
              },
              "true_peak_db": {
                "description": "null in the fast pass; see get_job for the measured value",
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dfe81404740110d0c3d5990e1be7dffb069c47c9af45393551dd3ec9932e732a"
        },
        {
          "name": "batch_master",
          "title": "Master an album or a batch",
          "description": "Master up to 10 tracks in one call with the same settings. Needs N CREDITS for N tracks, or N free runs - not one. album_mode (default true) levels the tracks RELATIVE to each other: the loudest hits the target exactly, the others keep their offsets, so a quiet interlude is not inflated to single level. Limits: 10 tracks, 100 MB per file and 300 MB per call (this server's own caps, for memory). A big album takes minutes - send fewer, longer tracks per call rather than all at once. Returns one job id per track - poll each with get_job. Pass dry_run=true to see what would be used and the settings before anything is spent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "album_mode": {
                "description": "Keep relative loudness between tracks. Default true. Set false for unrelated singles.",
                "type": "boolean"
              },
              "audio_urls": {
                "description": "Public https URLs, in album order.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "bitrate": {
                "description": "MP3: 128/192/256/320; OPUS: 128/192.",
                "type": "integer"
              },
              "dry_run": {
                "description": "Report what would be used and the settings without mastering and without downloading anything.",
                "type": "boolean"
              },
              "out_format": {
                "enum": ["wav", "wav24", "mp3", "flac", "opus", "aac"],
                "type": "string"
              },
              "remove_watermark": {
                "description": "Also run AI artifact cleanup first. Free.",
                "type": "boolean"
              },
              "style": {
                "description": "Preset key from list_presets.",
                "type": "string"
              },
              "target_lufs": {
                "description": "Target for the LOUDEST track in album mode.",
                "type": "number"
              }
            },
            "required": ["audio_urls"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "album_mode_requested": {
                "type": "boolean"
              },
              "album_offsets_applied": {
                "type": "boolean"
              },
              "dry_run": {
                "type": "boolean"
              },
              "enough_capacity": {
                "type": "boolean"
              },
              "job_ids": {
                "type": "array"
              },
              "jobs": {
                "type": "array"
              },
              "nothing_was_charged": {
                "type": "boolean"
              },
              "poll_with": {
                "type": "string"
              },
              "tracks": {
                "description": "job_id, filename, source_url, target_lufs and album_lufs_offset as APPLIED by the server",
                "type": "array"
              },
              "would_charge": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
