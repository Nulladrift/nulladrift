        {
          "name": "clean_ai_trace",
          "title": "Clean AI generator artifacts",
          "description": "Remove the marks an AI generator leaves in the audio (narrow tones above 15 kHz, level jumps at block seams, fixed spectral peaks); loudness and tone stay as they are. It does not hide that a track is AI-made - disclose AI use wherever a platform asks. Free, never spends a credit. Returns a job id - poll get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_url": {
                "description": "Public https URL of the audio file (wav/mp3/flac/m4a). A share link to the page works too — Suno/Udio song pages, Google Drive and Dropbox links are resolved to the file automatically.",
                "type": "string"
              },
              "out_format": {
                "enum": ["wav", "wav24", "mp3", "flac", "opus", "aac"],
                "type": "string"
              },
              "sensitivity": {
                "description": "0-1, default server-side.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["audio_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
