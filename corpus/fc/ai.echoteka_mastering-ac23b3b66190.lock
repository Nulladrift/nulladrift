      },
      "instructions": "Audio mastering tools. Analysis, AI artifact cleanup, preset previews and job status are free. 1 full master per day (UTC) is free without an account; extra masters use credits, which a human buys on the website - an agent cannot pay. Full rules: resource echoteka://playbook.",
      "tools": [
        {
          "name": "analyze_track",
          "title": "Quick loudness reading",
          "description": "Reads integrated loudness (LUFS), sample peak, length, sample rate and stereo correlation straight from the file; nothing is rendered. Costs nothing and takes a few seconds. True peak and loudness range are not part of this quick read: they are measured on a rendered result and returned by get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_url": {
                "description": "Track address as a public https link: a direct file (wav, mp3, flac, m4a) or a sharing link, which the server opens for you.",
                "type": "string"
              }
            },
            "required": ["audio_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "channels": {
                "type": ["integer", "null"]
              },
              "duration_sec": {
                "type": ["number", "null"]
              },
              "genre_suggestion": {},
              "lufs": {
                "type": ["number", "null"]
              },
              "peak_dbfs": {
                "type": ["number", "null"]
              },
              "sample_rate": {
                "type": ["integer", "null"]
              },
              "stereo_correlation": {
                "type": ["number", "null"]
              },
              "true_peak_db": {
                "description": "null in the fast pass; see get_job for the measured value",
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:598a27f4b7c8d9a56f7b410d1baf262948159cc0563e7f4d5d00035d7974206f"
        },
        {
          "name": "batch_master",
          "title": "Multi-track run with shared settings",
          "description": "Runs up to 10 tracks through one set of settings in a single call. Every track needs a credit or a free run, so N tracks need N of them. With album_mode on (the default) loudness is matched across the set: the loudest track lands on the target and the others keep their level differences, so a quiet interlude is not pushed up to single-track level. Caps set by this server, for memory: 10 tracks, 100 MB per file and 300 MB per call. Long albums take minutes, so fewer tracks per call work better. One job id comes back per track; poll each with get_job. dry_run=true reports the planned charge and settings first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "album_mode": {
                "description": "Matches loudness across the batch so the tracks keep their relative levels. Defaults to true; set false for unrelated singles.",
                "type": "boolean"
              },
              "audio_urls": {
                "description": "Track addresses as public https links, listed in album order.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "bitrate": {
                "description": "Kbps setting. MP3: 128, 192, 256 or 320. OPUS: 128 or 192.",
                "type": "integer"
              },
              "dry_run": {
                "description": "Planning only: reports the expected charge and settings without rendering and without fetching any file.",
                "type": "boolean"
              },
              "out_format": {
                "description": "Container and encoding of the rendered file.",
                "enum": ["wav", "wav24", "mp3", "flac", "opus", "aac"],
                "type": "string"
              },
              "remove_watermark": {
                "description": "Runs AI artifact cleanup before mastering as well.",
                "type": "boolean"
              },
              "style": {
                "description": "Name of the preset applied to every track; list_presets gives the options.",
                "type": "string"
              },
              "target_lufs": {
                "description": "Goal for the loudest track when album mode is on.",
                "type": "number"
              }
            },
            "required": ["audio_urls"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "album_mode_requested": {
                "type": "boolean"
              },
              "album_offsets_applied": {
                "type": "boolean"
              },
              "dry_run": {
                "type": "boolean"
              },
              "enough_capacity": {
                "type": "boolean"
              },
              "job_ids": {
                "type": "array"
              },
              "jobs": {
                "type": "array"
              },
              "nothing_was_charged": {
                "type": "boolean"
              },
              "poll_with": {
                "type": "string"
              },
              "tracks": {
                "description": "job_id, filename, source_url, target_lufs and album_lufs_offset as APPLIED by the server",
                "type": "array"
              },
              "would_charge": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e44f8e76894c6282548e70658adf26207a3c333a29b8dbc13ffc51429195d3f"
        },
        {
          "name": "check_limits",
          "title": "Remaining free runs and credits",
          "description": "Snapshot of the caller's standing: credits on hand, free runs still open today and the moment they reset, the largest file accepted per upload, and whether advanced modules are unlocked. Check it ahead of a master request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "can_master_now": {
                "type": "boolean"
              },
              "free": {
                "type": "object"
              },
              "max_batch_total_mb_via_mcp": {
                "type": "integer"
              },
              "max_upload_mb": {
                "type": "integer"
              },
              "max_upload_mb_via_mcp": {
                "description": "effective per-file ceiling for THIS channel",
                "type": "integer"
              },
              "result_retention_days": {
                "type": "integer"
              },
              "tokens_balance": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b35b6995833a9338fa6a084df895548c4d45320fa767dfc7542b13823dd360e"
        },
        {
          "name": "clean_ai_trace",
          "title": "Clean AI generator artifacts",
          "description": "Removes the marks an AI generator leaves in the audio (narrow tones above 15 kHz, level jumps at block seams, fixed spectral peaks), while loudness and tone are kept. Cleanup does not conceal that a track is AI-made: disclose AI use wherever a platform asks. One run a day is free; further runs use 1 credit each. Returns a job id to poll with get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_url": {
                "description": "Track address as a public https link: a direct file (wav, mp3, flac, m4a) or a sharing link, which the server opens for you.",
                "type": "string"
              },
              "out_format": {
                "description": "Container and encoding of the rendered file.",
                "enum": ["wav", "wav24", "mp3", "flac", "opus", "aac"],
                "type": "string"
              },
              "sensitivity": {
                "description": "Strength from 0 to 1; leave it unset to use the server default.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["audio_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:166ebae21f5003b026d1719c27763586c4aa19fe8c64ab4c5266814506cc3044"
        },
        {
          "name": "get_job",
          "title": "Poll a job: progress and metrics",
          "description": "Reports where a mastering, cleanup or preview job stands: status, percent progress and final metrics (after_lufs, true_peak_db, lra, platform_ready). Preview jobs list every style with its loudness and a listen link. A finished master also gets download_url, a signed link valid for about an hour with no credentials needed. No cost.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Identifier from master_track, clean_ai_trace or preview_styles; batch_master returns one per entry in job_ids. Letters, digits, underscore and hyphen only, 1 to 64 characters. Not a URL or a file name.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "after_lufs": {
                "type": ["number", "null"]
              },
              "download_url": {
                "description": "signed, ~1 h, works without credentials",
                "type": "string"
              },
              "download_url_expires_in": {
                "type": "integer"
              },
              "error": {
                "type": ["string", "null"]
              },
              "lra": {
                "type": ["number", "null"]
              },
              "platform_ready": {},
              "progress": {
                "type": ["integer", "null"]
              },
              "result_url": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "true_peak_db": {
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
