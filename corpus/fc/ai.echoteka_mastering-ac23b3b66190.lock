          "title": "Compare presets on 24 seconds",
          "description": "Master the middle 24 s of the track in 2-6 presets at once and get each one's loudness plus a listen link. FREE (6 per day). Use this instead of guessing a preset, and instead of spending a credit to 'try' one.",
          "inputSchema": {
