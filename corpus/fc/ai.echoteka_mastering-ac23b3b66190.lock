        {
          "name": "get_service_info",
          "title": "About this server and its rules",
          "description": "Returns this service's profile: which features run free, what one credit covers, and links to the written rules. A sensible first call in a session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "description": "Service manifest: endpoints, presets, live prices, limits, policies.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
