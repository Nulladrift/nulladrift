        {
          "name": "get_job",
          "title": "Get job status",
          "description": "Status, progress and result metrics (after_lufs, true_peak_db, lra, platform_ready) for a mastering, cleanup or preview job. For previews it returns each style with its loudness and a listen link. When a master is done it also returns download_url - a signed link that works without credentials for about an hour. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Job id returned by master_track, clean_ai_trace or preview_styles; batch_master returns one per track in job_ids. Not a URL or a filename: 1-64 chars of A-Z a-z 0-9 _ -",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "after_lufs": {
                "type": ["number", "null"]
              },
              "download_url": {
                "description": "signed, ~1 h, works without credentials",
                "type": "string"
              },
              "download_url_expires_in": {
                "type": "integer"
              },
              "error": {
                "type": ["string", "null"]
              },
              "lra": {
                "type": ["number", "null"]
              },
              "platform_ready": {},
              "progress": {
                "type": ["integer", "null"]
              },
              "result_url": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "true_peak_db": {
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
