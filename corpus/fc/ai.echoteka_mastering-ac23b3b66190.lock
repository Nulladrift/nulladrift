          },
          "digest": "sha256:2c278c020913f94f059b2fc56864e88f83d4b774fdf63b5f2a8caf04e94bfbca"
        },
        {
          "name": "preview_styles",
          "title": "Short audition of several presets",
          "description": "Renders the central 24 seconds of the track through two to six presets side by side and reports each preset's loudness with a link to listen. Free, limited to 6 runs per day. Choose from these results rather than guessing, and rather than paying a credit to audition a style.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_url": {
                "description": "Track address as a public https link: a direct file (wav, mp3, flac, m4a) or a sharing link, which the server opens for you.",
                "type": "string"
              },
              "styles": {
                "description": "Two to six preset names (see list_presets). Left out, the server tries edm, pop, rnb and standard.",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["audio_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              },
              "poll_with": {
                "type": "string"
              },
              "preview_url_template": {
                "type": "string"
              },
              "styles": {
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
