        {
          "name": "naulon_retrieve",
          "title": "Preview open research papers for a question (free)",
          "description": "FREE preview, RESEARCH PAPERS only. For a question, lists the open CC0, CC BY, CC BY-SA or public-domain papers that could answer it and the price of each mode (answer, retrieve). This tool never pays and never runs the answer. Prices only: nothing on this server buys. How buying works: https://naulon.app/docs/for-buyers",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
