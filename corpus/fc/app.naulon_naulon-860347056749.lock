      "instructions": "naulon is a toll publishers put in front of their sites: people read free, and AI agents pay the\nauthor to read or cite a page. This server finds sources and states their prices. It cannot pay,\nand it returns no paid text.\n\nHUMANS READ FREE, ALWAYS. Every source carries its `url`; if a person wants the whole article, give\nthem that link. They owe nothing for it.\n\nA PRICE IS NOT A PURCHASE. `priceUsdc` from naulon_discover is indicative; naulon_quote reads the\nlive price from the publisher's toll. Never report a source as bought or as read in full.",
      "tools": [
        {
          "name": "naulon_appraise",
          "title": "Appraise candidates for a topic",
          "description": "Score how relevant each candidate is to the topic, from its free teaser alone — a 0..1 relevance plus a one-line rationale. Pass the candidates you got from naulon_discover (or a curated subset), and pass them back WHOLE — `matchedInBody` / `matchedSemantic` tell the scorer WHY the search returned each one, and dropping them makes a body-matched source with a terse teaser look identical to a near-miss with a keyword-ish one. FREE: it reads the teaser and those flags, never paid content, and it fetches and pays for nothing. Use it to decide what is worth quoting.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "candidates": {
                "description": "Candidates to appraise — pass naulon_discover's rows through unmodified.",
                "items": {
                  "properties": {
                    "matchedInBody": {
                      "description": "From naulon_discover: the topic's words are inside this source's full text.",
                      "type": "boolean"
                    },
                    "matchedSemantic": {
                      "description": "From naulon_discover: near the topic in meaning only — its words are absent.",
                      "type": "boolean"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "summary": {
                      "description": "The free teaser to judge — title + summary, no paid content.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["slug", "summary", "title"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "topic": {
                "description": "The research topic to score relevance against.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["candidates", "topic"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appraised": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "rationale": {
                      "description": "One-line justification for the score.",
                      "type": "string"
                    },
                    "relevance": {
                      "description": "0..1 estimate of usefulness for the topic.",
                      "type": "number"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["rationale", "relevance", "slug", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["appraised"],
            "type": "object"
          },
