              "paper": {
                "additionalProperties": false,
                "properties": {
                  "abstract": {
                    "description": "Up to 1500 characters, only where its licence lets it be shown.",
                    "type": ["string", "null"]
                  },
                  "authorCount": {
                    "type": "number"
                  },
                  "authors": {
                    "description": "The first 10 authors.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "citedBy": {
                    "description": "Held papers that cite it.",
                    "type": "number"
                  },
                  "freeCopy": {
                    "description": "An open copy's address, when one is known.",
                    "type": ["string", "null"]
                  },
                  "ids": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "scheme": {
                          "type": "string"
                        },
                        "value": {
                          "type": "string"
                        }
                      },
                      "required": ["scheme", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "key": {
                    "type": "string"
                  },
                  "licence": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "kind": {
                            "type": "string"
                          },
                          "url": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["kind", "url"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "notices": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "type": ["string", "null"]
                        },
                        "noticeDoi": {
                          "type": ["string", "null"]
                        },
                        "source": {
                          "type": "string"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "required": ["date", "noticeDoi", "source", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "readable": {
                    "description": "What naulon's page for it shows.",
                    "enum": ["full", "abstract", "none"],
                    "type": "string"
                  },
                  "references": {
                    "type": "number"
                  },
                  "status": {
                    "description": "The retraction record's verdict: clean, or the most serious notice.",
