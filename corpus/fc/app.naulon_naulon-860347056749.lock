        },
        {
          "name": "naulon_lookup",
          "title": "Look up one source (free)",
          "description": "FREE. Get the record of one source you already have the address of: a publisher page by its URL, or a paper by DOI, PMID, PMCID or arXiv id. For a page it returns the title, site, summary and its read and citation prices. For a paper it returns the title, authors, venue, year, retraction and correction notices, licence, abstract where it may be shown, and where a free copy is. It searches nothing: to find sources by topic use naulon_discover or naulon_search.",
