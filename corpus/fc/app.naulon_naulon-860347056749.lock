                      ],
                      "description": "naulon's grade scale: supports, partly, does_not_support, contradicts, cannot_assess. Set when the outcome needs no reading: does_not_support when the full text shares no term with the claim, cannot_assess when the text needed was not read. Null when passages came back: nobody has read them, so grade the claim yourself on this same scale, and say cannot_assess rather than does_not_support when only the abstract was read."
                    },
                    "paper": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
