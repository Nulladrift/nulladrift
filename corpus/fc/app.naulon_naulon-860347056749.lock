                    "title": {
                      "type": ["string", "null"]
                    },
                    "venue": {
                      "type": ["string", "null"]
                    },
                    "why": {
                      "type": ["string", "null"]
                    },
                    "year": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["alternatives", "candidates", "id", "input", "matchedBy", "mismatch", "notice", "noticeDate", "noticeDoi", "noticesCheckedAt", "status", "supportsClaims", "title", "venue", "why", "year"],
                  "type": "object"
                },
                "type": "array"
