                          "type": "object"
                        },
                        "paidReads": {
                          "description": "How many times buyers have paid to read it.",
                          "type": "number"
                        }
                      },
                      "required": ["paidReads"],
                      "type": "object"
                    },
                    "key": {
                      "description": "Identifies this row.",
                      "type": "string"
                    },
                    "listPriceUsdc": {
                      "description": "What reading it would cost at the publisher's price, when priceUsdc is 0 because the publisher is observing.",
                      "type": "number"
                    },
                    "mentions": {
                      "additionalProperties": false,
                      "description": "Which of the question's own words the article contains, rarest first, and in how many passages. Read privately; carries no word of the article. Absent: no stored body.",
                      "properties": {
                        "found": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "missing": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "passages": {
                          "type": "number"
                        },
                        "places": {
                          "type": "number"
                        }
                      },
                      "required": ["found", "missing", "passages", "places"],
                      "type": "object"
                    },
                    "network": {
                      "description": "The chain it settles on. Picks must share one.",
                      "type": "string"
                    },
