                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "retrieve": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "network": {
                            "type": "string"
                          },
                          "testnet": {
                            "type": "boolean"
                          },
                          "usdc": {
                            "type": "number"
                          }
                        },
                        "required": ["network", "testnet", "usdc"],
