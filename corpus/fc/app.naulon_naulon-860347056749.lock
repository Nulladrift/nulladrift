                    "type": "string"
                  },
                  "network": {
                    "description": "CAIP-2 network id, e.g. eip155:5042002 (Arc Testnet) — the chain the toll settles on.",
                    "type": "string"
                  },
                  "testnet": {
                    "description": "TRUE = testnet play-money with NO fiat value (faucet-funded); FALSE = real-money mainnet. Report this honestly — never call a testnet toll 'real money'.",
                    "type": "boolean"
                  },
                  "token": {
                    "additionalProperties": false,
                    "description": "The token every toll is paid in.",
                    "properties": {
                      "address": {
                        "description": "ERC-20 token contract address on this chain.",
                        "type": "string"
                      },
                      "decimals": {
                        "description": "Token decimals (6 for USDC).",
                        "type": "number"
                      },
                      "symbol": {
                        "description": "Settlement token symbol (USDC).",
                        "type": "string"
                      }
                    },
                    "required": ["address", "decimals", "symbol"],
                    "type": "object"
                  }
                },
                "required": ["chainId", "chainName", "network", "testnet", "token"],
                "type": "object"
              },
              "totalUsdc": {
                "description": "The buyer's true total across all settlement legs.",
                "type": "number"
              }
            },
            "required": ["settlement"],
            "type": "object"
          },
