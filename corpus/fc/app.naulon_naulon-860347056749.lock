          "description": "Find which naulon publisher pages a passage was copied from, word for word. Returns each page's title and url, whether it holds most of the passage or part of it, and how many Citation Licenses the page has sold where its publisher shows that. Use it on text you were given, to learn where it came from. To find pages by subject, call naulon_search or naulon_discover. It is free. Calls are limited per caller: a refused call says how many seconds to wait. It matches verbatim reuse only, never paraphrase or training, and an empty `matches` with `searched` above zero means no listed page holds these words. Send the passage as it was written, not a summary of it.",
