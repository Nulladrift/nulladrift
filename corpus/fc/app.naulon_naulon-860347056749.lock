                      "type": ["boolean", "null"]
                    },
                    "title": {
                      "type": ["string", "null"]
                    },
                    "venue": {
                      "type": ["string", "null"]
                    },
                    "why": {
                      "type": ["string", "null"]
                    },
                    "year": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["alternatives", "candidates", "id", "input", "matchedBy", "mismatch", "notice", "noticeDate", "noticeDoi", "noticesCheckedAt", "status", "supportsClaims", "title", "venue", "why", "year"],
                  "type": "object"
                },
                "type": "array"
              },
              "retryAfterSec": {
                "description": "Seconds until your paper reads open again, when any sentence was skipped as rate_limited.",
                "type": ["number", "null"]
