        {
          "name": "naulon_discover",
          "title": "Browse sources for a topic (free)",
          "description": "Browse a TOPIC: list candidate articles by title and teaser, with no verdict on whether any of them answers a question. Returns FREE public teasers only — slug, title, and summary — with no content and no payment. Call this first to see what is available before appraising or quoting. A candidate may carry WHY it matched: `matchedInBody` means your terms are inside the paid text but NOT in the title or teaser (strong — the teaser just does not show it), `matchedSemantic` means only that it is near your query in meaning and your terms are absent (weak: judge the teaser, and set aside one that is off-topic). NEITHER flag set means one of two opposite things, so read it against the rest of the response: if any OTHER candidate here carries a flag, this source searches, and no flag is the STRONGEST result of all — your terms matched the title or teaser, which is why no body-only or semantic explanation was needed. If NO candidate in the response carries a flag, the source does not search (a plain RSS feed), and the absence says nothing at all — judge every candidate on its teaser. Discovery returns the best available matches, never a promise that any of them answers your question.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "topic": {
                "description": "The research topic to find candidate sources for.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "description": "Free teasers; the agent has paid for nothing at this stage.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "citationPriceUsdc": {
                      "description": "Indicative citation price in USDC from the catalog. Advisory, same caveat as priceUsdc.",
                      "type": "number"
                    },
                    "matchedInBody": {
                      "description": "STRONG: your query's terms appear inside this source's full text but NOT in its title or teaser, which is why the flag is needed at all. A flag only — the body itself stays behind the toll. ABSENT/false does NOT mean a weak match: a title or teaser hit also reads false, and is stronger than this. See the tool description for how to tell that apart from a source that does not search.",
                      "type": "boolean"
                    },
                    "matchedSemantic": {
                      "description": "WEAK: this source is close to your query in meaning, but your terms do NOT appear in it. Judge it on the title and teaser; a near-miss looks exactly like this. ABSENT/false with `matchedInBody` also absent is the both-false case — see the tool description; it is either the strongest match or no signal, never a weak one.",
                      "type": "boolean"
                    },
                    "priceUsdc": {
                      "description": "Indicative read price in USDC from the catalog. ADVISORY ONLY — naulon_quote's live 402 is the truth, and the buyer's total may be higher once extra settlement legs are added.",
                      "type": "number"
                    },
                    "site": {
                      "description": "Publisher host serving this source. Set by the fleet directory; absent for a single-origin source.",
                      "type": "string"
                    },
                    "slug": {
                      "description": "Stable identifier used to quote this source.",
                      "type": "string"
                    },
                    "summary": {
                      "description": "Free teaser: what the agent reads to judge relevance.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical URL this source is served from (from the RSS <link> / catalog / directory). Pass it back to naulon_quote / naulon_pay_and_read so the toll targets the real link (e.g. /articles/<slug>) instead of a reconstructed /essays/<slug> path.",
                      "type": "string"
                    }
                  },
                  "required": ["slug", "summary", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "Present when refused — explains why, and where to go instead.",
                "type": "string"
              },
              "refused": {
                "description": "True if the server refused to run discovery at all (e.g. a hosted ask-only mount) — see note. Never set alongside real candidates.",
                "type": "boolean"
              }
            },
            "required": ["candidates"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
