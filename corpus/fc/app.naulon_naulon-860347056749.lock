                      ],
                      "description": "The full text the passages were taken from: where and when it was read, under which licence, and the sha256 that names that exact text. Null for an abstract and when no text was read."
                    },
                    "wordsNotFound": {
                      "description": "Words of the claim that appear nowhere in the text read. Empty when no text was read.",
                      "items": {
