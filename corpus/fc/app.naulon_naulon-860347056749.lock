                              "type": "boolean"
                            },
                            "reason": {
                              "anyOf": [
                                {
                                  "enum": ["not_held", "no_text", "no_open_copy", "unknown_paper", "unresolved", "abstract_only", "retracted", "withdrawn", "not_a_paper", "wrong_work", "ungrounded"],
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Why the grade is cannot_assess. Null with any other grade."
                            },
                            "searched": {
                              "anyOf": [
                                {
                                  "enum": ["full_text", "abstract"],
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Which text of the paper was read. Null when none was."
                            },
                            "status": {
                              "description": "passages: text was found. absent: the text read shares no term with the claim. not_held: no text of this paper is held yet. no_open_copy: none can be, the paper has no open copy that may be shown. unknown_paper: no index knows this identifier. unresolved: the lookup or the read did not finish, so nothing is known; ask again. retracted, withdrawn: the paper cannot support a claim. not_a_paper: its record names a book, a chapter, a report or another work that is not a paper, so no text of it is read. papers_unavailable: paper text is switched off on this fleet.",
                              "enum": ["passages", "absent", "not_held", "no_open_copy", "unknown_paper", "unresolved", "retracted", "withdrawn", "not_a_paper", "papers_unavailable"],
                              "type": "string"
