                          "enum": ["no_work", "reference_unchecked", "ambiguous_reference", "another_work", "rate_limited", "read_failed", "papers_unavailable"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "no_work: the reference did not resolve to a work, and its row in `references` says why. reference_unchecked: the citation check could not answer for the reference this time, so nothing is known about it or the sentence; send the text again. ambiguous_reference: the reference matched more than one record, listed in its row's `candidates`; add a DOI or PMID to that reference and send the text again. another_work: the reference's identifier belongs to a work under another author or year, shown in its row's `mismatch`; find the work the text meant. rate_limited: your paper reads ran out during this call; wait `retryAfterSec` and send the text again. read_failed: the paper could not be read this time, which says nothing about the sentence. papers_unavailable: paper text is switched off on this fleet."
                    },
