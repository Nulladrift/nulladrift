        {
          "name": "naulon_quote",
          "title": "Quote the toll (free price probe)",
          "description": "Probe the real x402 toll for a source WITHOUT paying — the free 402 price check. Returns the author price, the buyer's true total (when the publisher adds extra settlement legs such as an operator fee, the total is higher than the author price), and the settlement terms. gated:false means one thing only — the origin answered 2xx, so it is a genuinely free read you may just fetch. Anything else returns refused:true with the reason in note: a refusal to reach the url (off-gate identity, or operator policy such as a kill-switch or deny-list), a 404, an unreachable origin, or a malformed 402. A refused url is NEITHER payable nor free — do not fetch it and do not report it as free; retry or fix the url.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Source slug from naulon_discover.",
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Canonical URL from naulon_discover (the source's real link). When present it is probed VERBATIM; absent, the slug is reconstructed to the /essays/<slug> template.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amountAtomic": {
                "description": "The author amount in atomic units (micro-USDC string).",
                "type": "string"
              },
              "asset": {
                "type": "string"
              },
              "gated": {
                "description": "True if the source requires payment; false if it is a free read. Absent on a refusal (see refused).",
                "type": "boolean"
              },
              "legs": {
                "description": "Present only for a multi-leg toll (e.g. author + operator fee).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": "string"
                    },
                    "payTo": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    }
                  },
                  "required": ["amount", "payTo", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "network": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "payTo": {
                "description": "The author payee address.",
                "type": "string"
              },
              "priceUsdc": {
                "description": "The author leg price in USDC.",
                "type": "number"
              },
              "refused": {
                "description": "True when this url is NEITHER payable NOR free, so there is nothing to act on: the server refused to reach it (off-gate identity, or operator policy such as a kill-switch / deny-list), the path was not found (404), the origin was unreachable, or the gate answered a malformed 402. The reason is in note; do NOT fetch it, and do NOT treat it as free. Mutually exclusive with a gated/free result.",
                "type": "boolean"
              },
              "refusedReason": {
                "description": "WHY it was refused, always present when refused is true. `policy` — we would not even probe it (off-gate identity, kill-switch, deny-list): the url is out of bounds, so do not retry it. `not_found` — the path is wrong; re-quote with the canonical url from naulon_discover. `unreachable` — the origin or gate is down; the url may be fine, so retry later. `malformed` — the gate answered a 402 we cannot read; it is misconfigured, and retrying will not help. Two of these are the caller's to fix and two are not, which is why this is a field and not prose.",
                "enum": ["policy", "not_found", "unreachable", "malformed"],
                "type": "string"
              },
              "settlement": {
                "additionalProperties": false,
                "description": "The chain + token the toll settles on. Check settlement.testnet before calling a price real money.",
                "properties": {
                  "chainId": {
                    "description": "EVM chain id.",
                    "type": "number"
                  },
