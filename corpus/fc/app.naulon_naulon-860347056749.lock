                        {
                          "enum": ["full", "quotes"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "full: the text may be used whole (CC0). quotes: sentences are quoted with attribution (CC BY). null: not quotable."
                    },
                    "fit": {
                      "enum": ["direct", "partial", "none"],
                      "type": "string"
                    },
                    "key": {
                      "description": "Identifies this row.",
                      "type": "string"
                    },
                    "licence": {
                      "description": "The licence the quoted sentences are used under (cc0, cc-by).",
                      "type": "string"
                    },
                    "network": {
                      "type": "string"
                    },
                    "notice": {
                      "description": "Retraction state. A retracted or withdrawn paper is listed so you know, and cannot be read.",
                      "enum": ["unchecked", "clean", "retracted", "withdrawn", "concern", "corrected"],
                      "type": "string"
                    },
                    "noticeCheckedAt": {
                      "type": ["string", "null"]
                    },
                    "quotable": {
                      "type": "boolean"
                    },
                    "relevance": {
                      "type": "number"
                    },
                    "site": {
                      "type": "string"
                    },
                    "stance": {
                      "enum": ["new", "deeper", "overlaps", "off_topic"],
                      "type": "string"
                    },
                    "summary": {
                      "description": "The open abstract, where its licence lets it be shown.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The free copy, readable by anyone.",
                      "type": "string"
                    },
                    "value": {
                      "enum": ["high", "medium", "low"],
                      "type": "string"
                    }
                  },
                  "required": ["access", "key", "licence", "notice", "noticeCheckedAt", "quotable", "site", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "papersDown": {
                "const": true,
                "description": "The paper search did not answer this time. `papers` is absent because it is not known, not because there are none: ask again for papers.",
                "type": "boolean"
              },
              "question": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "basis": {
                      "description": "Whether the verdict read the article privately, only its summary, or no text at all: similarity means the judge was not reached and fit is the article's closeness to the question, with no value or stance.",
                      "enum": ["body", "summary", "similarity"],
                      "type": "string"
