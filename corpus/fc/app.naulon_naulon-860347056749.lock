                    },
                    "mismatch": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "author": {
                              "type": ["string", "null"]
                            },
                            "recordAuthor": {
                              "type": ["string", "null"]
                            },
                            "year": {
                              "type": ["number", "null"]
                            }
                          },
                          "required": ["author", "recordAuthor", "year"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Set when the reference wrote its identifier with a first author or a year the record does not carry: `author` and `year` are what the reference says, `recordAuthor` and the row's `year` are the record's. The identifier exists and names another work, the commonest invented citation. Do not cite it as written; find the work the text meant."
                    },
