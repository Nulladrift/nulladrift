                          "type": "string"
                        },
                        "sentence": {
                          "type": "string"
                        }
                      },
                      "required": ["mark", "sentence"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "duplicates": {
                    "description": "Works listed more than once.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "labels": {
                          "items": {
                            "type": ["number", "null"]
                          },
                          "type": "array"
                        },
                        "reference": {
                          "type": "number"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["labels", "reference", "text"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "entries": {
                    "description": "Entries in the text's reference list. Zero when no list was found: then nothing below is reported.",
                    "type": "number"
                  },
                  "load": {
                    "description": "Per reference, the sentences citing it and how many cite nothing else: the sentences that lose their only source if that paper is retracted.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "alone": {
                          "type": "number"
                        },
                        "reference": {
                          "type": "number"
                        },
                        "sentences": {
                          "type": "number"
                        }
                      },
                      "required": ["alone", "reference", "sentences"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "uncited": {
                    "description": "Entries no in-text citation reaches. Cite them where they belong or take them out.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "label": {
                          "description": "The entry's own number in the list, when it has one.",
                          "type": ["number", "null"]
                        },
                        "reference": {
                          "description": "Index into `references`.",
                          "type": "number"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["label", "reference", "text"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["dangling", "duplicates", "entries", "load", "uncited"],
                "type": "object"
              },
              "more": {
                "description": "References found past the first 100 and not checked.",
                "type": "number"
              },
              "provenQuotes": {
                "additionalProperties": false,
                "description": "Present when an alternative was offered and the papers run is open: quotes on the same subject, each proven against its paper, for you to write from. `how` says how to reach it from this server.",
                "properties": {
                  "how": {
                    "type": "string"
                  },
                  "tool": {
                    "const": "naulon_retrieve",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["how", "tool", "url"],
                "type": "object"
              },
              "references": {
                "description": "One row per reference found in the text, in the order they appear, whether or not a sentence cites it.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alternatives": {
                      "description": "Up to three papers to read instead. For a retracted or withdrawn citation: the reviews and trials that cite it, from its notice on, strongest first. For one not found or unmatched: papers on the same subject. Empty otherwise, and empty rather than a paper that only shares the retracted paper's subject.",
                      "items": {
