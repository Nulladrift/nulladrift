{
  "lockfileVersion": 2,
  "subjects": {
    "ai.ssid/ssid-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ssid.ai/mcp/http"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ssid",
        "title": "ssid.ai",
        "version": "0.4.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Router default logins and compliance verdicts are manufacturer-cited: every record carries the source URL it came from. lookup_mac resolves a MAC to the organisation that actually holds the block. The read tools are free with no API key; submit_correction needs an ssid Pro key ($15/mo, ssid.ai/pricing) as an Authorization bearer token, which also raises the rate limit.",
      "tools": [
        {
          "name": "check_router_compliance",
          "title": "Universal default password check (UK PSTI / EU CRA pattern)",
          "description": "Whether a router model still ships a universal default password, the pattern prohibited for consumer connectable products under the UK PSTI Act and targeted by the EU Cyber Resilience Act, based on the manufacturer-cited credential type, with the ssid.ai Router Compliance Index totals for context. Pass the ssid.ai slug (get it from get_router_defaults). Documentation reading, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "ssid.ai router slug",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:67bc109b0d03190b345524aa8de7173cbc90890257bd329fbadc81d87842bd51"
        },
        {
          "name": "get_router_defaults",
          "title": "Router factory login (manufacturer-cited)",
          "description": "Default gateway IP, admin username and password (or the fact that there is none), credential type and factory-reset steps for a router or gateway model, each cited to the manufacturer's own documentation with the source URL. Pass the ssid.ai slug, or brand plus model. Use after lookup_mac identifies the vendor, or whenever a user asks for a router's default login, factory password, gateway address or reset procedure. Covers the 409-model ssid.ai directory; no listing or wildcard search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Manufacturer, e.g. TP-Link, Netgear, ASUS",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "model": {
                "description": "Model as printed on the device, e.g. Archer AX55",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "slug": {
                "description": "ssid.ai router slug, e.g. tp-link-archer-ax55 (from ssid.ai/routers/<slug>)",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:544aa18412e397603f1a7102aac3d4cf1c1c4457cdbe3ffab737e15eef3457d0"
        },
        {
          "name": "lookup_mac",
          "title": "MAC / OUI vendor lookup",
          "description": "Identify the organisation behind a MAC address and detect randomized/private (locally-administered) addresses used by modern phones. Resolves the IEEE registries longest-prefix-first, so an address inside a block the IEEE subdivided returns the company that actually holds it (MA-M, MA-S or IAB) rather than the MA-L registrar. Returns vendor, blockType (MA-L | MA-M | MA-S | IAB), block start/end for a sub-block, OUI, kind, randomized flag, confidence and the source registry file. A randomized address keeps vendor: null and adds cidRegistrant when its prefix is a registered Company ID (DA:A1:19 is Google's). For the router's factory login, call get_router_defaults next.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mac": {
                "description": "A MAC address in any format, e.g. F4:F5:E8:11:22:33",
                "type": "string"
              }
            },
            "required": ["mac"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb0f1f190afc263940c15a38d2bece21d1de0cfb5eeef4f15c8d50bd3524eca4"
        },
        {
          "name": "submit_correction",
          "title": "Propose a router default-login correction",
          "description": "Propose a fix to a router model's default gateway IP, username, password, credential type, or reset steps on ssid.ai. Requires an official manufacturer source URL (never an aggregator/forum). Queued for verification — never applied automatically. Use the router's slug from ssid.ai/routers/<slug>. Requires an ssid Pro key ($15/mo, ssid.ai/pricing) sent as SSID_API_KEY or a Bearer token; the three read tools stay free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "field": {
                "description": "Which field is wrong",
                "enum": ["defaultGatewayIp", "defaultUsername", "defaultPassword", "credType", "resetSteps"],
                "type": "string"
              },
              "proposedValue": {
                "description": "The correct value, per the cited source",
                "maxLength": 500,
                "type": "string"
              },
              "slug": {
                "description": "The router's ssid.ai slug, e.g. 'tp-link-archer-ax55'",
                "type": "string"
              },
              "sourceUrl": {
                "description": "Official https manufacturer source confirming the correct value",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["field", "proposedValue", "slug", "sourceUrl"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:00ed8c150d63d581bb76e6e6b442a06df515d079c9ac4e8b831c2dca0a17b31b"
        }
      ],
      "digest": "sha256:3d6b0eb948bd71b554fa2729b8eb16043c37c39dacc44033013ec9752a6db7a7"
    }
  }
}
