{
  "lockfileVersion": 2,
  "subjects": {
    "be.vakmanindebuurt/leads": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://vakmanindebuurt.be/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "vakmanindebuurt",
        "title": "Vakman in de Buurt",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Zoek een vakman in België met search_service_or_craftsman en vraag daarna met submit_lead_quote een gratis offerte aan. Vraag de gebruiker altijd zelf om zijn gegevens en toestemming; verzin niets.",
      "tools": [
        {
          "name": "search_service_or_craftsman",
          "title": "Zoek vakman of dienst in België",
          "description": "Search for craftsmen (plumber, roofer, electrician, solar panels, ...) in Belgium by service and postcode on vakmanindebuurt.be. Returns the matched service, the municipality and up to 10 public craftsman profiles (no contact details). Use the returned expertise_id (and optionally a craftsman_id) in submit_lead_quote. Read-only.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "postcode": {
                "description": "Belgische postcode van 4 cijfers waar de klus is.",
                "pattern": "^[1-9][0-9]{3}$",
                "type": "string"
              },
              "service": {
                "description": "Wat de gebruiker zoekt, bv. \"loodgieter\", \"zonnepanelen\", \"dak herstellen\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["postcode", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b4a132170a587a666434a3b53e8f25df090ab1be6fca0fab2be6c6fa1e1cfd6"
        },
        {
          "name": "submit_lead_quote",
          "title": "Vraag een offerte aan bij een vakman",
          "description": "Submit a free quote request for a job in Belgium. The request is sent to the chosen craftsman (craftsman_id from search_service_or_craftsman) or, without one, kept as a regional request. ONLY call this after the user has explicitly given every field below themselves and agreed that their contact details are passed to the craftsman; never invent, guess or reuse details from elsewhere. Set consent_contact and consent_text_shown to true only if that is the case. Validation errors are returned per field so you can ask the user again.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Optioneel: gemeente van de klus.",
                "maxLength": 80,
                "type": "string"
              },
              "client_reference": {
                "description": "Optioneel: eigen referentie om dubbele indiening te voorkomen.",
                "maxLength": 80,
                "type": "string"
              },
              "consent_contact": {
                "description": "De gebruiker gaat ermee akkoord dat zijn gegevens aan de gekozen vakman worden doorgegeven. Moet true zijn.",
                "type": "boolean"
              },
              "consent_text_shown": {
                "description": "De gebruiker heeft gezien dat zijn gegevens worden doorgegeven en de privacyverklaring is aangeboden. Moet true zijn.",
                "type": "boolean"
              },
              "craftsman_id": {
                "description": "Optioneel: de gekozen vakman uit de zoekresultaten.",
                "type": "integer"
              },
              "desired_start": {
                "enum": ["asap", "within_2_weeks", "within_1_month", "within_3_months", "flexible"],
                "type": "string"
              },
              "email": {
                "format": "email",
                "type": "string"
              },
              "expertise_id": {
                "description": "Uit search_service_or_craftsman (matched_service.expertise_id).",
                "type": "integer"
              },
              "first_name": {
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "job_description": {
                "description": "Wat moet er gebeuren? Zonder links of e-mailadressen.",
                "maxLength": 1500,
                "minLength": 20,
                "type": "string"
              },
              "last_name": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Belgisch gsm- of vast nummer, bv. 0475 12 34 56.",
                "type": "string"
              },
              "postcode": {
                "pattern": "^[1-9][0-9]{3}$",
                "type": "string"
              },
              "service": {
                "description": "Alternatief voor expertise_id: de dienst als tekst.",
                "maxLength": 100,
                "type": "string"
              },
              "street_address": {
                "description": "Optioneel: straat en huisnummer.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["consent_contact", "consent_text_shown", "desired_start", "email", "first_name", "job_description", "last_name", "phone", "postcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:edb2c7fad03d2c5e134f75f2366bcc54bb4aa93c35c9317bb15eb0a7954b2a9d"
        }
      ],
      "digest": "sha256:27154ff929f927645dfcbe1256465601c5193467d3f2ae4f79502ce8976137a6"
    }
  }
}
