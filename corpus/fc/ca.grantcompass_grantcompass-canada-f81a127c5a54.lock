      },
      "instructions": "GrantCompass Canada finds funding programmes for businesses, start-ups and non-profits in Canada and checks the basic eligibility requirements. Use search_grants to find programmes, check_eligibility for \"do I qualify for X?\", get_grant for one programme's details. Eligibility results are likelihoods based on basic requirements only; always point the user to the programme page for the full conditions. Not for scholarships, student aid, personal finance, or funding outside Canada.",
      "tools": [
        {
          "name": "check_eligibility",
          "title": "Check basic eligibility for a programme",
          "description": "Use this when the user asks whether they qualify for a specific Canadian funding programme (\"am I eligible for CanExport?\", \"could I get IRAP?\"), or after a search when they give more details about their business. Checks the basic requirements — location, organization type, size, years operating, industry, and whether the programme is reserved for specific founders — and returns which are met, not met, or still unknown, plus the questions to ask for the unknowns. The result is a likelihood, never a guarantee: every programme has further specific conditions, which are counted and listed on its page. Pass the programme name or the `slug` from a search result. Works with partial details: call it even when the user has shared little, because it returns what is already known and lists exactly which questions to ask next.Do not use for: scholarships, bursaries or student aid; personal loans, debt relief, mortgages or household benefits (EI, CPP, child benefit); funding outside Canada (US, UK, EU…); writing a business plan or grant application; investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_revenue": {
                "description": "Annual revenue band in CAD.",
                "enum": ["pre_revenue", "under_100k", "100k_500k", "500k_2m", "2m_plus"],
                "type": "string"
              },
              "annual_revenue_cad": {
                "description": "Exact annual revenue in CAD, only when the user stated a figure.",
                "minimum": 0,
                "type": "number"
              },
              "employee_count": {
                "description": "Exact head count, only when the user stated a number (settles thresholds like \"at least 3 employees\" that a band cannot).",
                "minimum": 0,
                "type": "integer"
              },
              "employees": {
                "description": "Head count band, including the owner (just_me = solo).",
                "enum": ["just_me", "2_10", "11_50", "51_250", "251_plus"],
                "type": "string"
              },
              "founder_groups": {
                "description": "ONLY if the user has already said so in this conversation: the business is majority-owned by women, Indigenous, Black, youth (under ~39), newcomer, or disabled founders (\"none\" if they said none apply). Used solely to include programmes reserved for those founders. Never ask for this just to search, and never infer it from a name.",
                "items": {
                  "enum": ["women", "indigenous", "black", "youth", "newcomer", "disability", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "funding_purpose": {
                "description": "Main thing the money is for.",
                "enum": ["start_a_business", "hire_staff", "train_staff", "research_development", "export", "marketing", "equipment_facilities", "working_capital", "digital_technology"],
                "type": "string"
              },
              "industry": {
                "description": "Closest industry. Use \"other\" if none fit.",
                "enum": ["software_tech", "retail_ecommerce", "professional_services", "manufacturing", "food_beverage", "construction_trades", "health_biotech", "clean_energy_environment", "arts_media_culture", "agriculture", "tourism_hospitality", "other"],
                "type": "string"
              },
              "organization_type": {
                "description": "Legal form: incorporated (a corporation), sole_proprietor, partnership, nonprofit (incl. registered charities), not_yet_registered (idea stage), cooperative.",
                "enum": ["incorporated", "sole_proprietor", "partnership", "nonprofit", "not_yet_registered", "cooperative"],
                "type": "string"
              },
              "program": {
                "description": "Programme slug from search_grants (preferred) or its name, e.g. \"canexport-smes\" or \"CanExport SMEs\".",
                "type": "string"
              },
              "province": {
                "description": "Province or territory where the business or organization is based, e.g. \"Ontario\", \"BC\", \"Québec\". Omit if unknown — never guess.",
                "type": "string"
              },
              "years_in_business": {
                "description": "Exact years operating, only when the user stated a number (0 = not launched).",
                "minimum": 0,
                "type": "number"
              },
              "years_operating": {
                "description": "How long the business has been operating (not_started = pre-launch).",
                "enum": ["not_started", "under_1", "1_2", "3_5", "5_10", "10_plus"],
                "type": "string"
              }
            },
            "required": ["program"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check basic eligibility for a programme"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://grantcompass/cards-8bfc9e560f.html",
            "openai/toolInvocation/invoked": "Checked the basic requirements",
            "openai/toolInvocation/invoking": "Checking the basic requirements…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://grantcompass/cards-8bfc9e560f.html"
            },
            "ui/resourceUri": "ui://grantcompass/cards-8bfc9e560f.html"
          },
          "digest": "sha256:d910506eb1fd91ed75a9a96016db6f7ed1159d10a8a23f8073ad2be80ff887fb"
        },
        {
          "name": "get_grant",
          "title": "Get details of a funding programme",
          "description": "Use this when the user wants details about one specific Canadian funding programme: what it pays for, how much, who can apply, its current intake status and the application steps. Pass the programme name or the `slug` from a search result. Do not use for: scholarships, bursaries or student aid; personal loans, debt relief, mortgages or household benefits (EI, CPP, child benefit); funding outside Canada (US, UK, EU…); writing a business plan or grant application; investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "program": {
                "description": "Programme slug from search_grants (preferred) or its name.",
                "type": "string"
              }
            },
            "required": ["program"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get details of a funding programme"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
