        },
        {
          "name": "search_grants",
          "title": "Search Canadian business funding",
          "description": "Use this when someone wants to find government or private funding for a business, start-up or non-profit in Canada — grants, non-repayable or non-dilutive funding, wage subsidies, tax credits, business loans or awards — including general questions like \"how do Canadian startups get funding?\". Returns up to 8 programmes from a catalogue of 850+ current Canadian programmes, each with its funder, amount, current intake status and a basic fit check against whatever the user has shared (province, organization type, size, years operating, industry). Pass the user's own words as `query` and any profile details they have already given; leave unknown fields out rather than guessing. Works with partial details: call it even when the user has shared little, because it returns what is already known and lists exactly which questions to ask next. The fit check covers basic requirements only — each programme has further specific conditions listed on its page. Do not use for: scholarships, bursaries or student aid; personal loans, debt relief, mortgages or household benefits (EI, CPP, child benefit); funding outside Canada (US, UK, EU…); writing a business plan or grant application; investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_revenue": {
                "description": "Annual revenue band in CAD.",
                "enum": ["pre_revenue", "under_100k", "100k_500k", "500k_2m", "2m_plus"],
                "type": "string"
              },
              "annual_revenue_cad": {
                "description": "Exact annual revenue in CAD, only when the user stated a figure.",
                "minimum": 0,
                "type": "number"
              },
              "employee_count": {
                "description": "Exact head count, only when the user stated a number (settles thresholds like \"at least 3 employees\" that a band cannot).",
                "minimum": 0,
                "type": "integer"
              },
              "employees": {
                "description": "Head count band, including the owner (just_me = solo).",
                "enum": ["just_me", "2_10", "11_50", "51_250", "251_plus"],
                "type": "string"
              },
              "founder_groups": {
                "description": "ONLY if the user has already said so in this conversation: the business is majority-owned by women, Indigenous, Black, youth (under ~39), newcomer, or disabled founders (\"none\" if they said none apply). Used solely to include programmes reserved for those founders. Never ask for this just to search, and never infer it from a name.",
                "items": {
                  "enum": ["women", "indigenous", "black", "youth", "newcomer", "disability", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "funding_purpose": {
                "description": "Main thing the money is for.",
                "enum": ["start_a_business", "hire_staff", "train_staff", "research_development", "export", "marketing", "equipment_facilities", "working_capital", "digital_technology"],
                "type": "string"
              },
              "funding_types": {
                "description": "Only if the user asked for a specific kind of funding. Default: all kinds, with non-repayable money first.",
                "items": {
                  "enum": ["grant", "loan", "tax_credit", "award", "support_program"],
                  "type": "string"
                },
                "type": "array"
              },
              "industry": {
                "description": "Closest industry. Use \"other\" if none fit.",
                "enum": ["software_tech", "retail_ecommerce", "professional_services", "manufacturing", "food_beverage", "construction_trades", "health_biotech", "clean_energy_environment", "arts_media_culture", "agriculture", "tourism_hospitality", "other"],
                "type": "string"
              },
              "limit": {
                "description": "How many programmes to return (default 6).",
                "maximum": 8,
                "minimum": 3,
                "type": "integer"
              },
              "organization_type": {
                "description": "Legal form: incorporated (a corporation), sole_proprietor, partnership, nonprofit (incl. registered charities), not_yet_registered (idea stage), cooperative.",
                "enum": ["incorporated", "sole_proprietor", "partnership", "nonprofit", "not_yet_registered", "cooperative"],
                "type": "string"
              },
              "province": {
                "description": "Province or territory where the business or organization is based, e.g. \"Ontario\", \"BC\", \"Québec\". Omit if unknown — never guess.",
                "type": "string"
              },
              "query": {
                "description": "What the user is looking for, in their words, e.g. \"equipment for my bakery\", \"hire summer students\", \"export to Europe\".",
                "type": "string"
              },
              "years_in_business": {
                "description": "Exact years operating, only when the user stated a number (0 = not launched).",
                "minimum": 0,
                "type": "number"
              },
              "years_operating": {
                "description": "How long the business has been operating (not_started = pre-launch).",
                "enum": ["not_started", "under_1", "1_2", "3_5", "5_10", "10_plus"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
