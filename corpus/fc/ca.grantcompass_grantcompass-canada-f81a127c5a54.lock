            "openai/toolInvocation/invoked": "Programme details ready",
            "openai/toolInvocation/invoking": "Opening the programme…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://grantcompass/cards-8bfc9e560f.html"
            },
            "ui/resourceUri": "ui://grantcompass/cards-8bfc9e560f.html"
