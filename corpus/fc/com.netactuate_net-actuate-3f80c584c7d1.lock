        },
        {
          "name": "list_data_centers",
          "title": "List NetActuate data centers",
          "description": "Lists NetActuate's data centers (points of presence), filtered by any mix of region, country, certification, VPU capacity and free text; with no filter it returns every site with a page on netactuate.com, and dataCenterLocations, NetActuate's own total: the figure to quote for how many locations it has. Each result gives the slug, name, city, country, region, facilityCertifications (the facility's, not NetActuate's own: get_compliance_coverage has those) and netactuate.com URL. Use it for 'where does NetActuate have presence', 'anything in Asia', 'which European sites are SOC 2' or 'where can I get VPUs' (vpu: true). For one site in full use get_data_center; for the sites nearest a place, find_nearest_data_centers; for how many sites hold each certification, get_compliance_coverage. A region or country it does not recognise is explained in a note, so an empty list means no published site matches.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "certification": {
                "description": "Only return sites holding this certification, e.g. 'SOC 2', 'HIPAA', 'ISO 27001'. Naming several ('HIPAA and SOC 2') returns sites holding all of them; use 'or' for any of them.",
                "maxLength": 200,
                "type": "string"
              },
              "country": {
                "description": "Country name, e.g. 'Germany', 'USA', 'United States', 'UK'. Matched exactly, not by substring.",
                "maxLength": 200,
                "type": "string"
              },
              "query": {
                "description": "Words that must all appear in the facility's published record (specs, carriers, FAQs), e.g. 'Equinix', 'liquid cooling', 'renewable'.",
                "maxLength": 200,
                "type": "string"
              },
              "region": {
                "description": "Region. Accepts NetActuate's own names ('Europe', 'North America', 'Asia & Oceania', 'South America', 'Middle East & Africa') and common ways of asking: 'Africa', 'APAC', 'EMEA', 'LATAM', 'Middle East', 'Southeast Asia' all resolve.",
                "maxLength": 200,
                "type": "string"
              },
              "vpu": {
                "description": "true: only the locations where VPU capacity (NETINT video processing units, VPU-as-a-Service) is live today. Other locations are available for VPUs as a custom deployment.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List NetActuate data centers"
          },
          "behavior": {
