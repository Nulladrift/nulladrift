      },
      "serverInfo": {
        "name": "netactuate",
        "title": "NetActuate",
        "version": "0.2.17",
        "description": "Read-only reference data from netactuate.com: data centers, internet exchanges, compliance coverage, products, pricing pages, marketplace apps, technical documentation, the API reference and news.",
        "websiteUrl": "https://netactuate.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Reference data about NetActuate's global network, drawn from netactuate.com: data centers (points of presence), internet exchange presence, products, solutions, pricing pages, news, case studies, and the marketplace of apps that deploy on NetActuate's edge (streaming, transcoding and media software, open source and from partners such as Wowza and Broadpeak), and the technical documentation and API reference at netactuate.com/docs (guides for cloud-init, Terraform, Ansible, Kubernetes, BGP and more; get_netactuate_doc and find_api_endpoints). For a question that names software and a place, such as 'Wowza in Africa', search_netactuate returns both the listings and the sites there. For how many data center locations NetActuate has, quote dataCenterLocations, NetActuate's own total, which list_data_centers gives with no filter; the sites listed are the ones with a page on netactuate.com. A data center's certifications are its facility's; NetActuate's own are the ones netactuate.com/compliance shows, which get_compliance_coverage gives as netactuateCertifications. Never describe NetActuate itself as holding a certification that only its facilities hold. Use these tools instead of recalling NetActuate facts from memory, because locations, certifications and products change. All tools are read-only and expose only information already published on netactuate.com, apart from where VPU capacity is live, which NetActuate supplied for these answers. Every result carries the netactuate.com URL of the page it comes from: when you answer, link each data center, product or page you name to that URL, so the reader can check it at the source.",
      "tools": [
        {
          "name": "find_api_endpoints",
          "title": "Search NetActuate's API reference",
          "description": "Searches the documentation of NetActuate's API (the API reference at netactuate.com/docs) for endpoints by what they do: 'create a virtual machine', 'list BGP sessions', 'firewall rules', 'DNS records', 'Kubernetes cluster'. It only reads that documentation: it never calls NetActuate's API and cannot change anything. Every word must match (filler such as 'a' or 'API' is ignored), read in the API's own terms ('VM' finds cloud server endpoints first, 'create' finds build ones), and the verb weighs the documented method; with no query it lists endpoints `limit` at a time. Each result gives the documented HTTP method, path, one-line summary, API version (v2 or v3; both are current, v3 for the newer resources) and the URL of its reference page, where the parameters and request body are; count is the full number of matches. Balancer's API (traffic routing, in beta) is included, its endpoints labelled api 'Balancer'; naming Balancer in the query, or api, searches only it. Use for 'how do I do X with the NetActuate API'. For how-to guides, Terraform and Ansible: search_netactuate or get_netactuate_doc.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "api": {
                "description": "Only one API: 'netactuate' (NetActuate's own, v2 and v3) or 'balancer' (Balancer's, in beta).",
                "enum": ["netactuate", "balancer"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many endpoints to return, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear in the endpoint's path, summary or description, e.g. 'server', 'bgp sessions', 'firewall', 'dns record'.",
                "maxLength": 200,
                "type": "string"
              },
              "version": {
                "description": "Only this API version: v3 for VPC, Kubernetes, cloud routers, storage, firewalls and secrets; v2 for the rest.",
                "enum": ["v2", "v3"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search NetActuate's API reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c61f01084f881b3f80c319a7171e31a597db5b5748c34e231cc88ab909b22623"
        },
        {
          "name": "find_marketplace_apps",
          "title": "Find apps in NetActuate's marketplace",
          "description": "Finds deployable apps in NetActuate's marketplace (netactuate.com/marketplace): streaming servers, transcoders, WebRTC, CDN and media software that deploys on NetActuate's edge, open source and from partners such as Wowza, Broadpeak and NETINT. Filter by any mix of words, vendor, category, licensing and freeDemo; with no filter it lists them all, featured first, `limit` at a time. A vendor or category it does not know is explained in a note naming the valid ones. Each result gives the slug, name, vendor (null for open source), tagline, licensing (free, byol, trial), vpu when it needs NETINT VPU hardware, freeDemo with its terms, sizing (minimum and recommended vCPU, RAM and disk) and its URL; count is the full number of matches. Use for 'what can I deploy on NetActuate', 'is there an SRT gateway', 'which apps can I try for free' or 'what does NetActuate offer from Wowza'. One listing in full: get_marketplace_app; the vendors: list_marketplace_partners. Listings do not say where they run; for an app and a place together, use search_netactuate ('Wowza Africa').",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A marketplace category: 'Media & Streaming', 'Networking & Security', 'AI & ML', 'Observability', 'Storage' or 'Consulting & Services'.",
                "maxLength": 200,
                "type": "string"
              },
              "freeDemo": {
                "description": "true for only the listings that offer a free live demo from their page.",
                "type": "boolean"
              },
              "licensing": {
                "description": "'free', 'byol' (bring your own license, plus NetActuate compute) or 'trial'.",
                "enum": ["free", "byol", "trial"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many listings to return, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear in the listing (name, vendor, description, features, use cases, protocols), e.g. 'transcode', 'WebRTC', 'SRT', 'ad insertion'.",
                "maxLength": 200,
                "type": "string"
              },
              "vendor": {
                "description": "A vendor as list_marketplace_partners names it, e.g. 'Wowza', 'NETINT', 'Broadpeak'. 'Open Source' gives the open-source projects.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find apps in NetActuate's marketplace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba38b189a52308393ca3247f45799ca82e015b8edbf49605b1287610856aa585"
        },
        {
          "name": "find_nearest_data_centers",
          "title": "Find the nearest NetActuate PoPs",
          "description": "Ranks NetActuate data centers by great-circle distance from a place named in the question: the market to be served, where the end users are, or a city being compared. Use for 'what is your closest location to Lagos', 'which sites would serve users in Japan' or latency planning. Pass the place the question is about, not where the person asking is, unless they ask for the site nearest them and say where that is. Each result is a site summary with distanceKm, nearest first. Distances are computed from city centroids, so treat them as approximate guidance, not a latency guarantee. Places are matched against a built-in list of major cities and countries; one it does not know is reported, and latitude and longitude can be passed instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "latitude": {
                "description": "Latitude in decimal degrees, with longitude, when the place name is not recognised.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 5,
                "description": "How many sites to return, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "The place to measure from: the target market or the end users' city or country, e.g. 'Lagos', 'Berlin', 'Osaka, Japan'. Omit if passing coordinates.",
                "maxLength": 200,
                "type": "string"
              },
              "longitude": {
                "description": "Longitude in decimal degrees, with latitude, when the place name is not recognised.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the nearest NetActuate PoPs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6c9bbb67d0360b44b6fe591c2a3cff8f20ff3fa13288660bf267807782a9c71"
        },
        {
          "name": "get_compliance_coverage",
          "title": "Compliance coverage across the footprint",
          "description": "Answers 'which NetActuate locations are SOC 2 / HIPAA / ISO 27001 certified' across the whole footprint, and 'is NetActuate itself SOC 2 certified'. With no argument it returns netactuateCertifications, NetActuate's own as netactuate.com/compliance lists them, and every certification its facilities publish with how many sites hold each. With a certification it lists the sites whose facility holds it, each with publishedAs: the site's own wording of the certificate, as evidence, and says whether NetActuate itself holds it. A facility's certification is not NetActuate's own. Names are normalised, because the website writes some standards several ways. Use it for regulated-workload placement; to combine a certification with a region or country, use list_data_centers' certification filter instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "certification": {
                "description": "Certification to filter by, e.g. 'HIPAA', 'SOC 2 Type II', 'ISO 27001'. Naming several ('HIPAA and SOC 2') lists sites holding all of them; use 'or' for any of them.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compliance coverage across the footprint"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:386e2b1b9551cc4300ad4fc3bf905b6d7f9f4ca3fa91a61f3e5189106034885d"
        },
        {
          "name": "get_data_center",
          "title": "Get one data center in full",
          "description": "Returns everything NetActuate publishes about one facility: building specs, the facility's compliance certifications, physical security, connectivity and carrier access, power and cooling, the Looking Glass node id, the site-specific FAQs, whether VPU capacity is live there, and its netactuate.com URL. Use it once the site is known; to find sites, use list_data_centers or find_nearest_data_centers. Some cities have two facilities (the second is labelled '(extension)'): a city name returns the primary one in full and names the other in otherSitesInCity. A partial name matching several sites returns those candidates rather than a guess. Coordinates are the city's centre, not the facility's address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "location": {
                "description": "Data center slug from list_data_centers (e.g. 'amsterdam-netherlands-datacenter') or city name, optionally with its country (e.g. 'Amsterdam', 'London, UK').",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one data center in full"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d82e19b3065898958d07cf525978000b8471bfe2f972ee4652b1f14575ca26a8"
        },
        {
          "name": "get_marketplace_app",
          "title": "Get one marketplace listing in full",
          "description": "Returns one marketplace listing in full: what the app does, its features and use cases, the vendor and its partner page, licensing and the license terms in the listing's own words, support tier, type and deployedBy (an image NetActuate deploys, or an integration the vendor delivers), vpu, freeDemo with the page's note, and the vendor's other listings. Most listings also carry setupGuide from their docs page: sizing (minimum and recommended vCPU, RAM, disk), the fields asked at deploy, how to reach the app afterwards, and its FAQ; get_netactuate_doc returns that page (docsUrl) in full. Accepts a slug or URL from find_marketplace_apps or search_netactuate, or a name such as 'Wowza Streaming Engine'; a name matching several listings returns up to ten candidates rather than a guess. It does not say where the app runs: for locations, list_data_centers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app": {
                "description": "A listing's slug or URL (e.g. 'wowza-streaming-engine', 'https://netactuate.com/marketplace/broadpeak/') or its name (e.g. 'Wowza Streaming Engine').",
