{
  "lockfileVersion": 2,
  "subjects": {
    "ca.acrescout/land": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://acrescout.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "acrescout",
        "title": "AcreScout",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Land and acreages for sale across Canada, ranked by price per acre, with water frontage and a value check against similar-sized land nearby. Start with list_regions, then search_land; link the listing page (page) when you show a listing. Figures are asking prices in CAD.",
      "tools": [
        {
          "name": "get_listing",
          "title": "One listing",
          "description": "One AcreScout listing by its id (8 hex characters, as in https://acrescout.ca/#l=<id>) or its acrescout.ca/land/... page URL: price, size, price per acre, place, how exact the map point is, water, value check, listed date and price cuts, with links.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95d9920d628ba408ae707f881b2304f51ac7a71190e95099ff99d920b76df880"
        },
        {
          "name": "list_regions",
          "title": "Regions with land for sale",
          "description": "Canadian provinces (and the territories) with land for sale on AcreScout, each with its listing count, median asking price, median asking price per acre of bare land 10+ acres, and its regions (counties, regional districts, Quebec admin regions) with their listing counts. Use a region's slug in search_land.",
          "inputSchema": {
            "properties": {
              "province": {
                "description": "Two-letter code (BC, AB, SK, MB, ON, QC, NB, NS, PE, NL) or TERR for the territories; omit for all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:afeba75c54eec799c98541bd058caf35a41d0206f347cdadf4cef690b2633b1a"
        },
        {
          "name": "search_land",
          "title": "Search land for sale",
          "description": "Land and acreages for sale in one Canadian province, from Kijiji (realtor listings), Centris and Zillow ads, refreshed several times a day. Filters on region, price, acreage, water frontage, AcreScout's value check and how recently it was listed. Returns at most 20 listings with price, acres, price per acre, place, water, value check, listed date and links to the AcreScout listing page and the original ad.",
          "inputSchema": {
            "properties": {
              "below_market": {
                "description": "Only listings AcreScout's value check rates more than 25% below similar-sized land nearby.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "listed_within_days": {
                "description": "Only listings put up (or first seen by AcreScout) this recently.",
                "minimum": 1,
                "type": "integer"
              },
              "max_acres": {
                "type": "number"
              },
              "max_price": {
                "description": "CAD",
                "type": "number"
              },
              "min_acres": {
                "description": "Leaves out listings whose ad states no size (their acres is null).",
                "type": "number"
              },
              "min_price": {
                "description": "CAD",
                "type": "number"
              },
              "province": {
                "description": "Two-letter code (BC, AB, SK, MB, ON, QC, NB, NS, PE, NL) or TERR.",
                "type": "string"
              },
              "region": {
                "description": "A region slug from list_regions, e.g. kings-county.",
                "type": "string"
              },
              "sort": {
                "description": "Default price_per_acre (cheapest first).",
                "enum": ["price_per_acre", "price", "acres", "newest"],
                "type": "string"
              },
              "water": {
                "description": "Only land with this frontage (any: ocean, lake, river or creek).",
                "enum": ["any", "ocean", "lake", "river", "creek"],
                "type": "string"
              }
            },
            "required": ["province"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60c4f3af38232492105f54a779f099e700efae52c3c9b830de86d9f6adccbaf4"
        }
      ],
      "digest": "sha256:b60df6116ee38ac9aa2a3f872de85cbb3c27873674d480f5ca9731264429a6ee"
    }
  }
}
