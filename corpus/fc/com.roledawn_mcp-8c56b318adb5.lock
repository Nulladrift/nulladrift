{
  "lockfileVersion": 2,
  "subjects": {
    "com.roledawn/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://roledawn.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.roledawn/mcp",
        "title": "RoleDawn",
        "version": "0.4.0",
        "websiteUrl": "https://roledawn.com/api"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RoleDawn: public hiring and app-store data, read-only, no sign-up. Pick the tool by the question: \"which companies started hiring for X\" (sales triggers, prospect lists) -> list_hiring_signals; \"what jobs does <company> have open\" -> list_company_jobs; \"rating / installs / version of <app>\" -> get_app; \"what do users complain about in <app>\" -> list_app_reviews. Every result starts with a one-line summary, then the full JSON. Free use: 50 tool calls per IP per day. For list_hiring_signals a free personal key (roledawn.com/api/key; X-RoleDawn-Key header or ?key= on the server URL) gives 50 calls per key per day instead of per IP. Limits: 60 calls per minute; list_hiring_signals returns at most the top 20 companies per query (no paid API tier). A hiring signal is the first role of a family that RoleDawn observed on a company's public job board since it started tracking it on 2026-10-05 (basis=observed) or inferred on its first read (basis=inferred), not the company's first hire ever; job_posted_at can be null; closed posts are left out unless include_closed=true.",
      "tools": [
        {
          "name": "get_app",
          "title": "Get an App Store / Google Play app listing (rating, installs, version)",
          "description": "Use when the user asks about one mobile app's store listing - rating, ratings count, installs, price, latest version or release notes - e.g. \"what is Spotify's Google Play rating?\". id = App Store numeric id (324684580), Android package name (com.spotify.music) or the store URL; the store is inferred. Returns title, developer, rating, star histogram, ratings count, price, installs (Google Play), version, release notes, dates, genre and description. For what users say, use list_app_reviews.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter store country, default us.",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "id": {
                "description": "App Store id (e.g. 324684580), package name (e.g. com.spotify.music) or store URL.",
                "examples": ["com.spotify.music", "324684580"],
                "maxLength": 300,
                "type": "string"
              },
              "lang": {
                "description": "Google Play language, e.g. en, de, pt-BR. Default en.",
                "type": "string"
              },
              "store": {
                "description": "Optional; inferred from id (numeric = apple, package name = google).",
                "enum": ["apple", "google"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a24de2d32b5a4dfa77085026e525412ea91b1e8c6465da395d0d3b540db01b1a"
        },
        {
          "name": "list_app_reviews",
          "title": "Read App Store / Google Play reviews (complaints, feature requests)",
          "description": "Use when the user wants what people say about an app - complaints, bugs, feature requests, competitor research - e.g. \"recent 1- and 2-star reviews of WhatsApp in the UK App Store\". Returns the reviews shown on the store page (about 10 per App Store country, 20 per Google Play language) with rating, title, text, date, app version, thumbs-up and developer reply (Google Play). Filter with rating=[1,2], sort and country; page with offset. For ratings and metadata use get_app.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter store country, default us.",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "id": {
                "description": "App Store id, package name or store URL.",
                "maxLength": 300,
                "type": "string"
              },
              "lang": {
                "description": "Google Play language, default en.",
                "type": "string"
              },
              "limit": {
                "description": "Reviews per page (1-50). Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Reviews to skip; use next_offset.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "rating": {
                "description": "Only these star ratings, e.g. [1,2].",
                "items": {
                  "maximum": 5,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array"
              },
              "sort": {
                "description": "Default newest.",
                "enum": ["newest", "oldest", "rating_asc", "rating_desc", "relevant"],
                "type": "string"
              },
              "store": {
                "description": "Optional; inferred from id.",
                "enum": ["apple", "google"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List app reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:09fde4623342e72266728080729caadc583412aad49f7186edf360bf9e35750e"
        },
        {
          "name": "list_company_jobs",
          "title": "List one company's open jobs (Greenhouse, Lever, Ashby)",
          "description": "Use when the user names a company and wants its current open roles, e.g. \"is Stripe hiring engineers in London?\" or \"list this company's remote jobs\". Reads the public Greenhouse, Lever or Ashby job board and returns title, location, department, remote flag, job URL and posting date, newest first. company = board slug (stripe in boards.greenhouse.io/stripe); if not found on one ATS, retry the other two. For companies newly hiring across the market use list_hiring_signals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ats": {
                "description": "Applicant tracking system that hosts the job board. Unknown? Try greenhouse, then lever, then ashby.",
                "enum": ["greenhouse", "lever", "ashby"],
                "type": "string"
              },
              "company": {
                "description": "Job-board slug from the careers URL, e.g. stripe.",
                "examples": ["stripe"],
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$",
                "type": "string"
              },
              "limit": {
                "description": "Jobs per page (1-500). Default 25.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Text that must appear in the location, e.g. London.",
                "maxLength": 100,
                "type": "string"
              },
              "offset": {
                "description": "Jobs to skip; use next_offset from the previous result.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Text that must appear in the job title, e.g. engineer.",
                "maxLength": 100,
                "type": "string"
              },
              "remote": {
                "description": "true = only remote jobs, false = only non-remote jobs. Omit for all.",
                "type": "boolean"
              }
            },
            "required": ["ats", "company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List company jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6cb7e680a6e58939ec988cf04fc38589fdbc680008b996ce4ef7add641b2c715"
        },
        {
          "name": "list_hiring_signals",
          "title": "Find companies with a new role family on their job board (sales triggers)",
          "description": "Use when the user wants companies to prospect because a role in a function is new on their job board, e.g. \"companies that started hiring SDRs this week\". Up to 20 companies per call, each with job URL, ATS posting date, our first-seen and detection times and what we saw before. first_hire = first role of the family seen on their board since we began tracking it, not proof of a first-ever hire (founding_evidence quotes the company); surge = hiring jump. For one company: list_company_jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "Role family ids (1-5). Common: sdr (SDR/BDR), sales (AEs), revops, customer-success, marketing, security, data-engineering, ml-ai. All ids: sdr, sales, revops, sales-enablement, marketing-ops, sales-engineering, partnerships, customer-success, account-management, support, professional-services, marketing, product-marketing, growth-marketing, content, devrel, community, software-engineering, frontend, mobile, platform-sre, security, compliance, qa, engineering-management, hardware, it, data-engineering, data-analytics, ml-ai, product-management, design, ux-research, technical-writing, finance, legal, people, recruiting, bizops, workplace, executive, clinical, supply-chain.",
                "examples": [
                  ["sdr"],
                  ["revops", "sales-enablement"]
                ],
                "items": {
                  "pattern": "^[a-z-]+$",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "include_closed": {
                "description": "true = also return signals whose job post has since closed (still_open=false). Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "Companies per page (1-20). Default 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Companies to skip; use next_offset from the previous result.",
                "maximum": 19,
                "minimum": 0,
                "type": "integer"
              },
              "since": {
                "description": "Detected in the last 7, 14 or 30 days. Default 7d.",
                "enum": ["7d", "14d", "30d"],
                "type": "string"
              },
              "type": {
                "description": "first_hire (default) = first role of the family RoleDawn has observed on the board since tracking it (observed) or inferred on its first read (inferred), not the company's first hire ever; surge = hiring jump; all = both.",
                "enum": ["first_hire", "surge", "all"],
                "type": "string"
              }
            },
            "required": ["family"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List hiring signals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fc416a4f5ed0bc3161bcdcee11eb0dd7649c48b92a1a50f9ab0f2a2db079fc68"
        }
      ],
      "digest": "sha256:b4375f08c212734d512b4c9a3ce2ccdce74050c123b10d6132f6e26c077b52b8"
    }
  }
}
