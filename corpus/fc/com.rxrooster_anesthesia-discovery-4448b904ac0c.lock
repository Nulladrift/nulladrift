                    "const": false,
                    "type": "boolean"
                  },
                  "follow_up_consent_inferred": {
                    "const": false,
                    "type": "boolean"
                  },
                  "requisition_text_collected": {
                    "const": false,
                    "type": "boolean"
                  }
                },
                "required": ["booking_state_available", "contact_information_collected", "follow_up_consent_inferred", "requisition_text_collected"],
                "type": "object"
              },
              "scheduling_url": {
                "const": "https://calendly.com/rx-rooster/30min",
