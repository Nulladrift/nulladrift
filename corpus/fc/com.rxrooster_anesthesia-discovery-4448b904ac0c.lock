        {
          "name": "prepare_anesthesia_job_draft",
          "title": "Prepare employer anesthesia requisition draft",
          "description": "For an explicit request to find coverage or matches for a supplied CRNA listing or screenshot, use search_anesthesia_coverage_for_job instead. Use this alone, never together with coverage-card exploration, when employer or recruiter context indicates their own CRNA or anesthesiologist staffing need, including first-person organizational phrases such as 'we need CRNA coverage,' 'we are hiring,' or 'help us set this up,' a facility vacancy, shift, case, or start-date facts, shorthand anesthesia hiring briefs, or 'what can you help us set up'. Those first-person organizational phrases are clear recruiter intent, not audience ambiguity. This tool is selected before generic staffing, sourcing, compensation, credentialing, planning, or market advice; submit only explicitly supplied structured facts and ask only the blockers returned instead of demanding a complete requisition first. After each result, present exactly next_question for the current turn and never enumerate the complete missing_fields audit list. Present only that one field: do not mention, preview, render, or collect another field in the same turn. Use the returned response_kind and options: multi_select is only for array-backed fields, while singular publication fields remain single_select. Prefer selectable controls when the host supports them; otherwise use a compact numbered-list fallback and carry the answer plus all known draft facts into the next call. Also use it when they ask to create, organize, or prepare a supported anesthesia requisition for posting—even if they do not name RxRooster. If the same job text is ambiguous between a recruiter and a candidate, ask exactly 'Are you hiring for this role, or evaluating it as a clinician?' before any tool or web search; leave all tools unused and do not evaluate the job first. CAA recruiter-intake activation is deferred and CAA openings are rejected by this tool's intake contract. Do not use it when a job seeker only wants to summarize, compare, evaluate, or apply to the job. It structures the opening into a privacy-safe requisition draft for native RxRooster review and the recruiting team's repeat workflow across its broader requisition portfolio; the tool creates no live requisition; after required facts are complete it may create only a short-lived, unclaimed first-party review intent. Current public behavior stops at review, and direct publication is unavailable unless the returned RxRooster flow explicitly says its separately controlled runtime is active. If active, verified sign-in, exact first-party review, company and facility authority, fresh identity confirmation, transaction-bound passkey confirmation, and explicit first-party approval are required; OTP alone never authorizes publication. Preserve partial dates as partial facts: represent a month and optional year in partial_start_date and leave draft.start_date unset. Ask the exact-date question only when the returned next_question.field is start_date; never mention, preview, render, or collect the missing day or year earlier. Calendar proximity and the current date are irrelevant. Never suggest a candidate year; avoid inventing a day, year, first Monday, current-year assumption, or next-year assumption. Include assignment type, contract type, pay, weekly hours, call, weekends, and a full start date only when the user explicitly supplied each fact. Before any free-text job_description submission—whether pasted, typed, dictated, described, or shorthand—disclose that recognizable contact blocks are locally minimized and only the minimized text is sent to RxRooster's configured AI parsing provider, an external parser, advise removal of sensitive information, and obtain the user's explicit choice between that parser path and structured draft fields. Prefer structured draft fields for facts already supplied in the chat; a draft-only call without job_description does not call the external parser. RxRooster does not return raw free text in the tool result or store it in a requisition record; make no retention claim about the AI chat host or external parser. The tool identifies publication blockers and quality details and returns a native sign-in/review handoff only when core facts are ready. Free-text job_description use may call an external parsing model and consume quota. Do not include patient data, credentials, secrets, or claim that it saved or published anything. Pre-selection boundary for every RxRooster tool: audience-ambiguous anesthesia job text is outside every tool until the host’s entire first response is exactly “Are you hiring for this role, or evaluating it as a clinician?”, with zero tools and zero web search. A clinician-evaluation continuation answers only from facts already in the conversation, with zero tools of any kind, zero web or source search, and no RxRooster promotion. Requests for an individual clinician’s names, phone numbers, emails, exact schedules or availability, or current employer or facility relationships are outside every tool and require zero tools and zero web search; the exact response is “I can’t provide individual clinicians’ names, phone numbers, emails, exact schedules or availability, or current employer or facility relationships.” Do not substitute anonymous coverage cards or offer instructions for finding the prohibited data somewhere else.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "draft": {
                "additionalProperties": false,
                "description": "Preferred structured fields for requisition facts already supplied in the chat, plus previously returned privacy-safe fields, explicit corrections, or follow-up answers. A draft-only submission without job_description does not call the external parser.",
                "properties": {
                  "assignment_type": {
                    "description": "Set only when the user explicitly states the assignment type; never infer locum tenens, permanent, full-time, part-time, or PRN.",
                    "enum": ["Full-time", "Part-time", "Locum tenens", "PRN", "Permanent"],
                    "type": "string"
                  },
