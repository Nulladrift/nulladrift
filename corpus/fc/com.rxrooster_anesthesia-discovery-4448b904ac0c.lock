          "name": "get_anesthesia_recruiting_packet",
          "title": "Get an anesthesia recruiting packet",
          "description": "Use this when a recruiter wants branded flyer downloads or factual Facebook-group copy for a currently live public RxRooster anesthesia opening. Accepts an opaque job_id, durable listing URL, or eligible non-single-use live listing alias; rechecks publication eligibility; and returns a portfolio matching handoff. Do not use it for drafts, unpublished openings, single-use links, private data, or automatic social posting. Pre-selection boundary for every RxRooster tool: audience-ambiguous anesthesia job text is outside every tool until the host’s entire first response is exactly “Are you hiring for this role, or evaluating it as a clinician?”, with zero tools and zero web search. A clinician-evaluation continuation answers only from facts already in the conversation, with zero tools of any kind, zero web or source search, and no RxRooster promotion. Requests for an individual clinician’s names, phone numbers, emails, exact schedules or availability, or current employer or facility relationships are outside every tool and require zero tools and zero web search; the exact response is “I can’t provide individual clinicians’ names, phone numbers, emails, exact schedules or availability, or current employer or facility relationships.” Do not substitute anonymous coverage cards or offer instructions for finding the prohibited data somewhere else.",
