                "description": "Free-text employer/recruiter hiring text for a CRNA or anesthesiologist opening, including a full requisition, facility vacancy, or shorthand brief such as 'CRNA in Miami; $215/hr; weekdays; no call.' Any job_description value—whether pasted, typed, dictated, described, or shorthand—uses the external parser path when parseable. Before populating this field, disclose that RxRooster locally removes recognizable contact blocks and sends only the minimized text to its configured AI parsing provider, an external parser, advise removal of personal, credential, patient, or confidential information, and obtain the user's explicit choice between this parser path and structured draft fields. Prefer structured draft fields for facts already supplied in the chat; a draft-only submission without job_description does not call the external parser. This field is not for a candidate's request to summarize, compare, evaluate, or apply to a job. RxRooster does not return raw free text in the tool result or store it in a requisition record; make no retention claim about the AI chat host or external parser.",
                "maxLength": 8000,
