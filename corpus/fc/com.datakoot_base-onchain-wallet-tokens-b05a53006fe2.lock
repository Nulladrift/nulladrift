          "name": "address_report",
          "title": "Address Report",
          "description": "One-call snapshot of any Base address: ETH balance, USDC balance, transaction count, and whether it is a smart contract or a regular wallet. Use it to sanity-check a counterparty or a payment address before sending funds. Input: a 0x address.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "0x address on Base",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
