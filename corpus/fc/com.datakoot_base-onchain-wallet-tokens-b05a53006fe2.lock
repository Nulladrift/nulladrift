      "instructions": "Base Intel: read-only on-chain data for the Base network - address snapshots (ETH and USDC balance, tx count, contract check), ERC-20 token metadata and balances, live gas price, and transaction status. Have a wallet address? Call address_report first for a one-call overview, then token_balance for a specific ERC-20.",
      "tools": [
