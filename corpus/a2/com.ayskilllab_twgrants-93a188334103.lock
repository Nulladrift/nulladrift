      "serverInfo": {
        "name": "ayskilllab-grants",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free, read-only search of public grant notices on 補助雷達. Results are basic fields with the address of our page and of the official notice; check the notice before relying on a row. Up to 10 rows an answer and 3 pages; 300 rows a day per address.",
      "tools": [
        {
          "name": "get_grant",
          "title": "Get one grant",
          "description": "One grant's page: status, funder, who can apply, place, amount, dates, the official sentences each field was read from, and the expected next round when there is one. A field we could not read is null, which means not confirmed. Counts as one row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The id a search returned, such as us-360875, or the page address.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df9e13b1df6ed6175aa95446683434841a84e9caed6d75b2fff2635f513d5c49"
        },
        {
          "name": "next_round_forecasts",
          "title": "Expected next rounds",
          "description": "Programmes whose next round is already listed, or can be placed in a month because at least two past rounds opened in it. An estimate says so (basis: estimate) and is not an announcement. Up to 10 rows an answer and 3 pages; 300 rows a day per address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "basis": {
                "description": "listed: the next round is already announced; estimate: placed from past rounds.",
                "enum": ["listed", "estimate"],
                "type": "string"
              },
              "market": {
                "description": "tw = Taiwan, us = United States, uk = United Kingdom, eu = European Union. Leave it out for this site's own: tw.",
                "enum": ["tw", "us", "uk", "eu"],
                "type": "string"
              },
              "months_ahead": {
                "description": "How far ahead to look; 6 unless you say.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page of results, from 1; ten rows a page.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words in the programme's title or funder.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5897946ec906a3f98f4637cf3d8f96f83bfd8a2d0a10f021ee2b429472db972b"
        },
        {
          "name": "screen_grants",
          "title": "Eligibility screen (Taiwan)",
          "description": "Taiwan grants open now, opening soon or with no fixed deadline, screened by the rules of the free check at https://twgrants.ayskilllab.com/check: who can apply, then the county, then the limits a notice states in so many words (years since founding, capital, employees, the SME standard). Each row says why it is listed, with the notice's sentence, and is one of fits, unconfirmed (the notice doesn't say who or where) or may_not_fit (a stated limit disagrees; it can belong to one sub-item, so read the notice). Leave out what you don't know; it is then not compared. Reasons are in Chinese, as the notices are. Up to 10 rows an answer and 3 pages; 300 rows a day per address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "also": {
                "description": "Identities some grants are only for: 原住民 (indigenous person or group), 農漁民 (farmer, fisher, farmers' or fishers' association).",
                "items": {
                  "enum": ["原住民", "農漁民"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "capital_twd": {
                "description": "Paid-in capital in NT$ (元), not 萬.",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "county": {
                "description": "Where the applicant is registered. Grants open to the whole country count too.",
                "enum": ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "基隆市", "新竹市", "新竹縣", "苗栗縣", "彰化縣", "南投縣", "雲林縣", "嘉義市", "嘉義縣", "屏東縣", "宜蘭縣", "花蓮縣", "臺東縣", "澎湖縣", "金門縣", "連江縣"],
                "type": "string"
              },
              "employees": {
                "description": "Number of employees.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "founded_year": {
                "description": "Year founded, Western (2022) or ROC (111).",
                "maximum": 2100,
                "minimum": 1,
                "type": "integer"
              },
              "include": {
                "description": "Which results to list; fits_and_unconfirmed unless you say. The counts always cover all three.",
                "enum": ["fits", "fits_and_unconfirmed", "all"],
                "type": "string"
              },
              "organisation_type": {
                "description": "企業 = company or business, 個人 = individual, 團體 = association or co-operative, 法人 = foundation or incorporated association, 學校 = school, 政府機關 = government body.",
                "enum": ["企業", "個人", "團體", "法人", "學校", "政府機關"],
                "type": "string"
              },
              "page": {
                "description": "Page of results, from 1; ten rows a page.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["organisation_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87aaf3368ace9ca6a1f94505977c9f92b922e6d47d8b5c5d88541726140ac21c"
        },
        {
          "name": "search_open_grants",
          "title": "Search open grants",
          "description": "Grants open now or opening soon, soonest deadline first. Needs at least one of query, applicant, region or closes_within_days: there is no list of everything. Up to 10 rows an answer and 3 pages; 300 rows a day per address. Each row has our page (page_url) and the official notice (official_url).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "applicant": {
                "description": "Who can apply, as the list records it. Taiwan: 個人, 企業, 團體, 學校, 法人, 政府機關, 原住民, 農漁民. Elsewhere: Business, Nonprofits, Education, Government, Tribal, Individuals.",
                "enum": ["個人", "企業", "團體", "學校", "法人", "政府機關", "原住民", "農漁民", "Business", "Nonprofits", "Education", "Government", "Tribal", "Individuals"],
                "type": "string"
              },
              "closes_within_days": {
                "description": "Only open grants whose deadline is in this many days.",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "tw = Taiwan, us = United States, uk = United Kingdom, eu = European Union. Leave it out for this site's own: tw.",
                "enum": ["tw", "us", "uk", "eu"],
                "type": "string"
              },
              "page": {
                "description": "Page of results, from 1; ten rows a page.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words in the title or the funder's name.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "region": {
                "description": "A Taiwan county or city (market tw) or a UK nation (market uk). Grants open to the whole country count too.",
                "enum": ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "基隆市", "新竹市", "新竹縣", "苗栗縣", "彰化縣", "南投縣", "雲林縣", "嘉義市", "嘉義縣", "屏東縣", "宜蘭縣", "花蓮縣", "臺東縣", "澎湖縣", "金門縣", "連江縣", "England", "Scotland", "Wales", "Northern Ireland"],
                "type": "string"
              },
              "status": {
                "description": "open (the default) includes grants with no fixed deadline.",
                "enum": ["open", "opening_soon"],
                "type": "string"
              }
            },
            "type": "object"
          },
