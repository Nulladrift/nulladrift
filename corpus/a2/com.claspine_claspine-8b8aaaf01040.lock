      "instructions": "Claspine documentation, API reference and checks, generated from claspine.com and the platform build.\nClaspine runs as Claspine Atlas, the self-hosted engine and self-hosted Spring Boot, and they offer different capabilities: call what_runs_where before planning an integration. Claspine Atlas has no sign-in, permissions, push or custom domains (keep your own login there); it sends email and WhatsApp through the project's own provider accounts. Self-hosted Claspine has everything: Spring Boot adds it as a library, other languages run the engine image next to the app.\nAdding Claspine to a project: follow https://claspine.com/agent/start.md (prompts start_new_app and add_to_existing_app have the same steps). Before you build, tell the person what only they can do: the decisions (Atlas or self-hosted, whose login, which features), a Claspine Atlas account and project key or a self-hosted license and download token, and their provider accounts and keys; never ask them to paste keys into the chat. Once you know the stack and the decisions, call plan_integration and follow its plan step by step; every step says how to prove it worked. Existing apps: get_guide(\"add-to-existing-app\") (dependencies, database, whose login, Spring Security). Email, SMS, WhatsApp or push on self-hosted Claspine: get_guide(\"notifications-self-hosted\"). search_docs takes plain questions.\nUse get_recipe for exact calls, api_reference for the HTTP contract, java_api for Spring Boot types, explain_error for any Claspine error code, upgrade_notes or check_upgrade before changing versions, and check_code and check_config before committing. Code and settings sent to the check tools are analysed in memory and not stored.\nThe latest Claspine release is 0.38.0: use it (BOM com.grahmur:grahmur-platform-bom:0.38.0, application-scoped engine image api.claspine.com/applications/<application-id>/claspine/engine:0.38.0, npm @grahmur-org/claspine-client@0.38.0) unless the project pins another version; then call upgrade_notes first. Ask every decision, whose login included, before you build.",
      "tools": [
        {
          "name": "api_reference",
          "title": "Claspine HTTP API reference",
          "description": "The published HTTP contract shared by Claspine Atlas and the self-hosted engine (paths under /api/v1). Without path: every operation. With path (and method): parameters, request body and responses with schemas resolved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "method": {
                "description": "HTTP method (default: the path's first).",
                "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"],
                "type": "string"
              },
              "path": {
                "description": "For example /payments/orders/{orderId}/refund.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
