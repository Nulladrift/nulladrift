        {
          "name": "plan_integration",
          "title": "Plan a Claspine integration",
          "description": "An exact, ordered plan for adding Claspine to this project: what the person must do first, then each step with the files and settings to change (current release pinned) and how to prove it worked. Call it after you know the stack, new or existing, and the person's decisions (Atlas or self-hosted, whose login, which features), and follow it step by step.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "current_version": {
                "description": "Only if the project already uses Claspine: its version now (grahmur.platform.version or the BOM version), for example 0.12.0. The plan then upgrades first.",
                "type": "string"
              },
              "database": {
                "description": "Self-hosted: where Claspine keeps its own tables (default postgres).",
                "enum": ["postgres", "mongo", "firestore"],
                "type": "string"
              },
              "features": {
                "description": "What to add first.",
                "items": {
                  "enum": ["sign-in", "email", "sms", "whatsapp", "push", "files", "ai", "payments"],
                  "type": "string"
                },
                "type": "array"
              },
              "form": {
                "description": "Where Claspine runs: the person's choice.",
                "enum": ["atlas", "self-hosted"],
                "type": "string"
              },
              "login": {
                "description": "Self-hosted: keep the app's own login, or move sign-in to Claspine (default: claspine when sign-in is a feature).",
                "enum": ["keep", "claspine"],
                "type": "string"
              },
              "project": {
                "description": "new: little or no code yet; existing: an app that already runs.",
                "enum": ["new", "existing"],
                "type": "string"
              },
              "stack": {
                "description": "The backend.",
                "enum": ["spring-boot", "node", "python", "go", "other"],
