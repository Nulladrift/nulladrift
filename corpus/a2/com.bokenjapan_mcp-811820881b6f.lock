{
  "lockfileVersion": 2,
  "subjects": {
    "com.bokenjapan/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bokenjapan.com/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "bokenjapan",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_place",
          "title": "Get a place",
          "description": "Return one facility by the id from search_places. The id is stable for a published name and source URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68cab53acbdca522286d9b1337e39602be600057f4964d7e427fcd8c065a6b9a"
        },
        {
          "name": "get_town",
          "title": "Get a town",
          "description": "Return one published town record: canonical URL, official links, address, counts, access line, must-see names, and /go/ booking links. pref and town are slugs, for example fukui and awara.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "pref": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "town": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pref", "town"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05ccbf5ed94722ae121fefc9ccabcb2b5b0aa44fc8de70d01e0c6f3400bfd0de"
        },
        {
          "name": "list_prefectures",
          "title": "List prefectures",
          "description": "List every prefecture loaded into the guide, with its canonical URL and published counts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:452862290a50b3a59fc3c69b4b82ad446d763493097511ff241c67a633f42c70"
        },
        {
          "name": "list_towns",
          "title": "List towns",
          "description": "List municipalities for one prefecture slug, with canonical URLs and section counts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "pref": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b6f8d8ffe9a705a160105b26de1e461ecbff575884efc68718a20caccd27605"
        },
        {
          "name": "plan_trip",
          "title": "Plan a trip from listed places",
          "description": "Build a 1 to 7 day outline for one town using only places published on that town's BokenJapan pages. town may be a slug (awara) or pref/town (fukui/awara). interests is an optional comma-separated list of words to match. No prices, hours, or invented stops.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "interests": {
                "maxLength": 200,
                "type": "string"
              },
              "town": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["days", "town"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1aede55675c7f464c04b18648eb85b184727aa3414f45327cea64c784874f3a"
        },
        {
          "name": "search_places",
          "title": "Search places",
          "description": "Full-text search over BokenJapan towns and facilities (name, Japanese name, description, town, prefecture, category, town address, source URL, page URL, photo URL). Returns published rows only, with canonical bokenjapan.com URLs. Queries need at least 3 characters.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "prefecture": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "town": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24e78c82dbb42080932ec0715fbc75e12205f9a45bd9ed0799b40031b71d80cf"
        }
      ],
      "digest": "sha256:a4842d0dac22a53c0f6fbc0318947190bc6d54fe27e461316473998a70d9532e"
    }
  }
}
