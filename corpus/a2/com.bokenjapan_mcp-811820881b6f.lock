{
  "lockfileVersion": 2,
  "subjects": {
    "com.bokenjapan/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bokenjapan.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bokenjapan-mcp",
        "title": "Boken Japan: rural and small-town Japan travel data",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Boken Japan (bokenjapan.com) is an English guide to every municipality in Japan, with a focus on rural and small towns. Use list_towns to find towns in a prefecture, get_town for a town overview (access, official links, counts, sample listings), search_places to find sights, things to do, places to eat and places to stay, and get_listing for one listing. Cite the bokenjapan.com page (page / url) and attribute \"Source: bokenjapan.com\". Booking links are only included when they returned HTTP 200 when checked. Love hotels carry the label \"Love hotel · 18+\" and must keep it. Ids are stable (\"<prefecture>/<town>/<section>/<slug>\"); the schema is the resource bokenjapan://schema. null = not published on bokenjapan.com.",
      "tools": [
        {
          "name": "get_listing",
          "title": "Get listing",
          "description": "One listing by id (format <prefecture>/<town>/<section>/<slug>, as returned by search_places or get_town), with all published facts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Listing id, e.g. \"nagano/hakuba/see/hakuba-folk-history-museum\"",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e873584418de64c92b91b59b07ad9ea6c4b202df736dd61ff09dfc2fd05b1f1e"
        },
        {
          "name": "get_town",
          "title": "Get town",
          "description": "Overview of one Boken Japan town (municipality): names EN/JA, coordinates, access (nearest station, car needed), official links, address and phone of the town office, listing counts by type, section pages, sample listings and stays with checked booking links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "prefecture": {
                "description": "Prefecture slug or name, e.g. \"nagano\"",
                "type": "string"
              },
              "town": {
                "description": "Town slug or name, e.g. \"hakuba\"",
                "type": "string"
              }
            },
            "required": ["prefecture", "town"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get town"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61f4e53eb1eec38ff747f157adb2a09aed615ab9b34f9943e4251ed57a854647"
        },
        {
          "name": "list_towns",
          "title": "List towns",
          "description": "Without prefecture: the 47 prefectures with town and listing counts. With prefecture: every town in it with names, page URL and listing counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "prefecture": {
                "description": "Prefecture slug or name, e.g. \"akita\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List towns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38da79a3c075b19ab4c1de90f535b2cd40bc3bf190b7c270a3a31cfa6465f7cb"
        },
        {
          "name": "search_places",
          "title": "Search places",
          "description": "Search Boken Japan listings (sights, things to do, places to eat, places to stay, day-to-day) by name or keyword, optionally within a prefecture and/or town and by category. Returns facts with the bokenjapan.com page, source URL, town access, checked booking links (stays) and last_verified.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "sight | activity | food | stay | day_to_day, or a food category such as \"cafe\", \"noodles\", \"seafood\"",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "prefecture": {
                "description": "Prefecture slug or name, e.g. \"nagano\"",
                "type": "string"
              },
              "query": {
                "description": "Name or keyword, English or Japanese (e.g. \"soba\", \"onsen\", \"Hakuba\", \"白馬\")",
                "type": "string"
              },
              "town": {
                "description": "Town slug or name, e.g. \"hakuba\" (best with prefecture)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3823cda64394c1c27997d308df754a7e6ad45e4225a3ab358234bcf9395af88"
        }
      ],
      "resources": [
        {
          "uri": "bokenjapan://meta",
          "name": "meta",
          "title": "Dataset metadata",
          "description": "Generation time, counts, source snapshot sha256 and licence.",
          "mimeType": "application/json",
          "digest": "sha256:b0953f1f12759e15ac0c626d0ddf142a28037b8a0cd062c82b3bff490f6af55c"
        },
        {
          "uri": "bokenjapan://schema",
          "name": "schema",
          "title": "Data schema and id policy",
          "description": "JSON Schema of Listing and Town records, id policy, null policy and licence (same as https://bokenjapan.com/data/schema.json).",
          "mimeType": "application/json",
          "digest": "sha256:aa8411fb4afc88f533d6eba20c81717b6a8dd78645a152afcdb9dc0eb88ceb59"
        }
      ],
      "digest": "sha256:7ceb51b06b0cf7043cc8eec429ee436eba36553b62a69fa6ea64ee88330db652"
    }
  }
