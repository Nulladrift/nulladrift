        {
          "name": "find_combos",
          "description": "Detect known combos in a decklist using Commander Spellbook's curated database — combos fully present, plus near-misses one card away (with that card's price). Pass `format` (and `commander` for Commander) so near-miss suggestions are filtered to legal, in-color-identity adds. Use this instead of recalling combos from memory; also feeds rate_deck's compact-combo check.",
