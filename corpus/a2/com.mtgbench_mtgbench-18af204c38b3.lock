      "tools": [
        {
          "name": "check_deck_legality",
          "description": "Validate a decklist against a constructed format's rules (banned cards, deck size, copy limits, and in Commander the color-identity rule). Use this rather than recalling ban lists from memory: bans changed four times in 2026 alone, and a model's training cutoff makes stale ban data one of the most common wrong answers in Magic. Pass `commander` for Commander decks: it counts toward the 100, and it is what makes the color-identity check possible (without it the response says color identity went unchecked).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cards": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["count", "name"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "commander": {
                "type": "string"
              },
              "format": {
                "type": "string"
              }
            },
            "required": ["cards", "format"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "legal": {
                "type": "boolean"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "violations": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["legal"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check deck legality"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:592c2bac9175798c91be5a3047d4feb4b97a48af3a002943fb3601f801263a93"
        },
        {
          "name": "commander_staples",
          "description": "The cards most commonly played with a given commander, from EDHREC's aggregate inclusion data: 691,958 commander-card pairings across 2,631 commanders. Returns each card's deck count, the share of that commander's decks running it, and its synergy score. Synergy matters as much as popularity: a high deck count with LOW synergy is a card everyone plays anyway (Sol Ring), while high synergy is a card that is unusually good with this commander specifically. Lead with the latter when recommending. Use this to ground deckbuilding in what people actually play instead of guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "commander": {
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "minSynergy": {
                "type": "number"
              }
            },
            "required": ["commander"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "cards": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "card": {
                      "type": "string"
                    },
                    "category": {
                      "type": "string"
                    },
                    "decks": {
                      "type": "integer"
                    },
                    "pctOfDecks": {
                      "type": "number"
                    },
                    "synergy": {
                      "type": "number"
                    }
                  },
                  "required": ["card", "decks", "pctOfDecks"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "commander": {
                "type": "string"
              },
              "totalDecks": {
                "type": "integer"
              }
            },
            "required": ["cards", "commander", "totalDecks"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Commander staples"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:861172da23fd1d615e76459a5e37cdb7e6389e122a628ec70e06b2b968263f85"
        },
