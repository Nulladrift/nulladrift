            "openai/toolInvocation/invoking": "Building your delivery plan…"
          },
          "digest": "sha256:657e519136625a9a0a6fd62010835cfb0db681b55b99b8a1c4c6974e58a519d1"
        },
        {
          "name": "estimate_delivery_cost",
          "description": "Estimate the size and cost of a specific list of work items. Given short descriptions of deliverables, this returns each item sized in Delivery Units, a total, an indicative cost, and a recommended plan size. Use this tool when the user has already broken the work into specific items and wants sizing. When the user describes an overall goal without a breakdown, use create_delivery_plan instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_size": {
                "description": "Optional company-size hint: startup, small, medium, enterprise.",
                "type": "string"
              },
              "industry": {
                "description": "Optional industry hint for calibration.",
                "type": "string"
              },
              "modules": {
                "description": "List of work modules to estimate. Each item is a 1-2 sentence description of a deliverable, e.g. 'Tenant onboarding flow with SSO integration' or 'Migrate 200 SAP custom reports to Power BI'.",
                "items": {
                  "maxLength": 500,
                  "minLength": 5,
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["modules"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Per-module Delivery Unit sizing + total project cost + recommended pack.",
            "properties": {
              "modules": {
                "items": {
                  "properties": {
                    "aus": {
                      "description": "Delivery Units for this module (legacy JSON key: aus).",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rationale": {
                      "type": "string"
                    }
                  },
                  "required": ["aus", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "recommended_pack": {
                "description": "The recommended Delivery Pack tier for this plan.",
                "properties": {
                  "delivery_units": {
                    "description": "Delivery Units in the pack (0 for enterprise/custom).",
                    "type": "integer"
                  },
                  "is_enterprise": {
                    "type": "boolean"
                  },
                  "is_most_popular": {
                    "type": "boolean"
                  },
                  "key": {
                    "enum": ["starter", "small", "scale", "enterprise"],
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "per_delivery_unit_usd": {
                    "description": "$/Delivery Unit at this tier.",
                    "type": "integer"
                  },
                  "price_usd": {
                    "type": "integer"
                  },
                  "validity_label": {
                    "type": "string"
                  }
                },
                "required": ["is_enterprise", "key", "name"],
                "type": "object"
              },
              "tier_rate_per_du_usd": {
                "type": "integer"
              },
              "total_cost_usd_project": {
                "type": "integer"
              },
              "total_delivery_units": {
                "type": "integer"
              }
            },
            "required": ["modules", "recommended_pack", "total_delivery_units"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Estimate Delivery Size & Cost"
