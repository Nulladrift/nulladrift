      },
      "serverInfo": {
        "name": "AiDOOS Virtual Delivery Center",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AiDOOS turns a described initiative into a Virtual Delivery Center plan with teams, roles, AI agents, and work modules sized in Delivery Units. Use create_delivery_plan to create a plan, refine_delivery_plan to revise it, estimate_delivery_cost to size a specific list of work items, get_delivery_plan to retrieve a saved plan, and recommend_next_step to summarize how to proceed.",
      "tools": [
        {
          "name": "create_delivery_plan",
          "description": "Create a structured delivery plan for an initiative the user describes. Given a plain-language description of something to build, implement, modernize, migrate, or scale, this returns a plan with teams (pods), roles, AI agents, work modules sized in Delivery Units, a phased timeline, and a recommended plan size. Use this tool when a user describes a project or initiative and wants to understand the team, scope, timeline, or cost to deliver it. Returns a plan_id that the other tools use to reference this plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_size": {
                "description": "Optional company size hint: 'startup', 'small' (<200), 'medium' (200-1000), 'enterprise' (1000+).",
                "type": "string"
              },
              "industry": {
                "description": "Optional industry hint (for example FinTech, SaaS, Healthcare, Retail, Manufacturing, or Public Sector). Improves sizing accuracy.",
                "type": "string"
              },
              "initiative": {
                "description": "A plain-language description of what the user wants to build, implement, modernize, migrate, or scale. Pass through the user's own words when possible. For example: 'Build a customer portal in 12 weeks' or 'Modernize our reporting system'.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["initiative"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A complete Virtual Delivery Center plan: pods, roles, AI agents, modules sized in Delivery Units, phased timeline, total Delivery Units and project cost, plus the recommended Delivery Pack.",
            "properties": {
              "ai_agents": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "industry": {
                "type": "string"
              },
              "modules": {
                "items": {
                  "properties": {
                    "aus": {
                      "description": "Delivery Units for this module. JSON key is `aus` for legacy compatibility; semantically these are Delivery Units.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "depends_on": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "timeline_weeks": {
                      "type": "number"
                    }
                  },
                  "required": ["aus", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "plan_id": {
                "description": "Identifier for this plan; use it with refine_delivery_plan, get_delivery_plan, or recommend_next_step.",
                "type": "string"
              },
              "pods": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "purpose": {
                      "type": "string"
                    },
                    "roles": {
                      "items": {
                        "properties": {
                          "count": {
                            "type": "integer"
                          },
                          "key_skills": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "seniority": {
                            "enum": ["junior", "mid", "senior", "lead", "principal"],
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "required": ["count", "seniority", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["name", "roles"],
                  "type": "object"
                },
                "type": "array"
              },
              "project_name": {
                "type": "string"
              },
              "recommended_pack": {
                "description": "The recommended Delivery Pack tier for this plan.",
                "properties": {
                  "delivery_units": {
                    "description": "Delivery Units in the pack (0 for enterprise/custom).",
                    "type": "integer"
                  },
                  "is_enterprise": {
                    "type": "boolean"
                  },
                  "is_most_popular": {
                    "type": "boolean"
                  },
                  "key": {
                    "enum": ["starter", "small", "scale", "enterprise"],
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "per_delivery_unit_usd": {
                    "description": "$/Delivery Unit at this tier.",
                    "type": "integer"
                  },
                  "price_usd": {
                    "type": "integer"
                  },
                  "validity_label": {
                    "type": "string"
                  }
                },
                "required": ["is_enterprise", "key", "name"],
                "type": "object"
              },
              "summary": {
                "type": "string"
              },
              "tier_rate_per_du_usd": {
                "description": "$/Delivery Unit rate for this plan size, per the tier-band rate card.",
                "type": "integer"
              },
              "timeline_phases": {
                "items": {
                  "properties": {
                    "outcomes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "phase": {
                      "type": "string"
                    },
                    "weeks": {
                      "description": "Human-readable week range, e.g. 'Weeks 1-4'.",
                      "type": "string"
                    }
                  },
                  "required": ["phase", "weeks"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_aus": {
                "description": "Total Delivery Units across all modules. JSON key is `total_aus` for legacy compatibility.",
                "type": "number"
              },
              "total_cost_usd_project": {
                "description": "Project-flow USD cost at the tier-band rate.",
                "type": "integer"
              },
              "total_delivery_units": {
                "description": "Public-facing alias for total_aus. Same value.",
                "type": "number"
              }
            },
            "required": ["modules", "plan_id", "pods", "project_name", "recommended_pack", "summary", "total_delivery_units"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a Delivery Plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/vdc_plan_card.html",
