                "type": "string"
              },
              "plan_id": {
                "type": "string"
              },
              "project_cost_usd": {
                "type": "integer"
              },
              "project_deep_link": {
                "description": "Referral URL to the Project-flow page on AiDOOS; null when Enterprise is recommended.",
                "type": ["string", "null"]
              },
              "recommended_pack": {
                "description": "The recommended Delivery Pack tier for this plan.",
                "properties": {
                  "delivery_units": {
                    "description": "Delivery Units in the pack (0 for enterprise/custom).",
                    "type": "integer"
                  },
                  "is_enterprise": {
                    "type": "boolean"
                  },
                  "is_most_popular": {
                    "type": "boolean"
                  },
                  "key": {
