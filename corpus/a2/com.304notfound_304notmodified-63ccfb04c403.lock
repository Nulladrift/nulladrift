        {
          "name": "run_service",
          "description": "Exécute un service et renvoie un résultat structuré avec ses sources, ses limites et ce qui manque. max_price_eur : budget maximal (au-delà, rien n'est exécuté). quote_id : devis à utiliser. request_key : identifiant de votre demande, à réutiliser en cas de relance (même résultat, pas de double facturation). Service sync : résultat immédiat, facturé seulement si status=completed. Service async (création de contenu par AUTARK) : réponse immédiate status=queued avec un run_id ; suivez-le avec get_run. Facturé seulement à la livraison (delivered). Clé d'API nécessaire.",
          "inputSchema": {
            "properties": {
