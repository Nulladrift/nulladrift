{
  "lockfileVersion": 2,
  "subjects": {
    "com.agenttoolyard/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.agenttoolyard.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agenttoolyard",
        "title": "AgentToolyard",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "acceptance_gate",
          "title": "Run several verification checks as one pass or fail",
          "description": "Use this to run several verification checks and pass only if every one of them passes. Each item in checks must be {\"tool\": name, \"arguments\": {...}}. Allowed tools are reconcile, plus the legacy aliases exact_sum, required_fields, unique_ids, row_count, and reconcile_records. A check can also include a label of up to 100 characters. Do not put pricing or margin tools here. Do not call this with an empty list. If one check is malformed, prefer this tool anyway rather than calling the checks separately, unless you cannot form the checks array.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arguments": {
                      "type": "object"
                    },
                    "label": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "tool": {
                      "enum": ["reconcile", "exact_sum", "required_fields", "unique_ids", "row_count", "reconcile_records"],
                      "type": "string"
                    }
                  },
                  "required": ["arguments", "tool"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["checks"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4692ae1c6e74ce07d654b736205a202dd72a51a5e91f447c23a74a44095d9869"
        },
        {
          "name": "check_freshness",
          "description": "Tell whether a cited source page still says what you quoted. HTTPS URLs only. Up to 10 sources per call and 5 per host. Limit: 20 fetches per minute. Each source can expect quoted snippets or a SHA-256 of the page. Verdicts: unchanged means the quoted snippets are still on the page (or the hash matches). changed means the page answered but a snippet is missing or the hash differs. fail means the URL is not allowed, for example it is not HTTPS or points at a private address. inconclusive means the page could not be judged, for example a bot challenge, an error status, a timeout or a truncated body. Treat inconclusive as unknown.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expect_sha256": {
                      "pattern": "^[0-9A-Fa-f]{64}$",
                      "type": "string"
                    },
                    "expect_snippets": {
                      "items": {
                        "maxLength": 300,
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["sources"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d181318f69a1edb5dffb37f65df4bc22af109c80be55e834fcbae5ec1b334f12"
        },
        {
          "name": "reconcile",
          "title": "Reconcile lists and verify records",
          "description": "Call this when you need to prove two sets of records or transactions agree, such as a ledger against a bank export or a send list against a status sheet. Both sets need a shared ID field. It matches rows by that ID, flags duplicate IDs, missing fields and records found in only one set, and passes only when the unexplained difference is exactly zero. If the sets share no ID field, it returns NO_SHARED_ID instead of guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_field": {
                "description": "Field name holding the money amount (required for two-list reconciliation and for expected_total on rows).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "amounts": {
                "description": "Flat list of money amounts for a one-list exact sum check (pair with expected_total).",
                "items": {
                  "anyOf": [
                    {
                      "pattern": "^-?\\d{1,15}(\\.\\d{1,2})?$",
                      "type": "string"
                    },
                    {
                      "exclusiveMaximum": 1000000000000000,
                      "exclusiveMinimum": -1000000000000000,
                      "type": "number"
                    }
                  ],
                  "description": "Use decimal strings for exact values. Numbers must have magnitude below 1000000000000000, and String(n) must use plain decimal notation with at most 15 integer digits and 2 fractional digits. JSON numeric tokens must retain their decimal value when converted to Number."
                },
                "maxItems": 1000,
                "type": "array"
              },
              "check_unique_ids": {
                "description": "Optional unique-ID check: when true, reports duplicate IDs (123 and \"123\" collide; unsafe integers keep exact digits), missing IDs, and near-duplicate/mixed-type warnings.",
                "type": "boolean"
              },
              "expected_row_count": {
                "description": "Optional row-count check: expected number of rows (checks rows/amounts in one-list mode, or left in two-list mode).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "expected_total": {
                "anyOf": [
                  {
                    "pattern": "^-?\\d{1,15}(\\.\\d{1,2})?$",
                    "type": "string"
                  },
                  {
                    "exclusiveMaximum": 1000000000000000,
                    "exclusiveMinimum": -1000000000000000,
                    "type": "number"
                  }
                ],
                "description": "Optional exact-sum check in integer cents (checks amounts or rows[amount_field] in one-list mode, or left total in two-list mode). Use decimal strings for exact values. Numbers must have magnitude below 1000000000000000, and String(n) must use plain decimal notation with at most 15 integer digits and 2 fractional digits. JSON numeric tokens must retain their decimal value when converted to Number."
              },
              "id_field": {
                "description": "Field name holding the record ID (required for two-list reconciliation and for check_unique_ids).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "left": {
                "description": "Left list of records for two-list reconciliation (pair with right, id_field, amount_field). If left is empty, every right row is reported as missing_left.",
                "items": {
                  "description": "The selected ID field accepts a string or an integer (digits kept exactly). For the selected amount field, Use decimal strings for exact values. Numbers must have magnitude below 1000000000000000, and String(n) must use plain decimal notation with at most 15 integer digits and 2 fractional digits. JSON numeric tokens must retain their decimal value when converted to Number.",
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "record": {
                "description": "Single record object for a one-list required_fields check.",
                "type": "object"
              },
              "required_fields": {
                "description": "Optional required-fields check: field names that must exist as own properties and not be null (0, false, and \"\" count as present; no dot-paths).",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "right": {
                "description": "Right list of records for two-list reconciliation (pair with left, id_field, amount_field). If right is empty, every left row is reported as missing_right.",
                "items": {
                  "description": "The selected ID field accepts a string or an integer (digits kept exactly). For the selected amount field, Use decimal strings for exact values. Numbers must have magnitude below 1000000000000000, and String(n) must use plain decimal notation with at most 15 integer digits and 2 fractional digits. JSON numeric tokens must retain their decimal value when converted to Number.",
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "rows": {
                "description": "Single list of records for one-list checks (expected_row_count, expected_total with amount_field, check_unique_ids with id_field, required_fields).",
                "items": {
                  "description": "The selected ID field accepts a string or an integer (digits kept exactly). For the selected amount field, Use decimal strings for exact values. Numbers must have magnitude below 1000000000000000, and String(n) must use plain decimal notation with at most 15 integer digits and 2 fractional digits. JSON numeric tokens must retain their decimal value when converted to Number.",
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2fb3fb5d97bfde87f613643e83e4d145475a0c5d80638ba5b2e8bedfcf3ac003"
        },
        {
          "name": "verify_live",
          "description": "Call this after you deploy or change a web page, to confirm the live URL returns the status, redirect, title, headers and text you expect. It fetches the page from AgentToolyard's server and reports pass, fail or inconclusive (for example, when the site's bot protection blocks the check), with the evidence it saw.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expect_contains": {
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "expect_headers": {
                      "additionalProperties": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxProperties": 10,
                      "propertyNames": {
                        "pattern": "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$",
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "expect_location": {
                      "type": "string"
                    },
                    "expect_not_contains": {
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "expect_status": {
                      "maximum": 599,
                      "minimum": 100,
                      "type": "integer"
                    },
                    "expect_title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["checks"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:149540fdb2f51d2eda5bed1b663e3729aec286edc1af11064a6284acb9304f25"
        }
      ],
      "digest": "sha256:f2531133c439aa9f21621ad2fc2eb499b123bd1eaaba6f2d8bbc96676be565e7"
    }
  }
}
