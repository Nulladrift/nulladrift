            "additionalProperties": false,
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "admin_key": {
                    "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                    "type": "string"
                  },
                  "app": {
                    "description": "The active app id from gate_list_apps.",
                    "pattern": "^app_[0-9a-f]{16}$",
                    "type": "string"
                  },
                  "models": {
                    "description": "Exact names or prefixes ending in *; null for no limit",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": ["array", "null"]
                  },
                  "operation": {
                    "const": "models",
                    "description": "Perform exactly one operation: models, runs, response, add_route.",
                    "enum": ["models", "runs", "response", "add_route"],
                    "type": "string"
                  },
                  "project_id": {
                    "description": "The project id from gate_create_project, e.g. p1a2b3...",
                    "type": "string"
                  }
                },
                "required": ["admin_key", "app", "models", "project_id"]
              },
              {
                "additionalProperties": false,
