        {
          "name": "gate_audit",
          "title": "Read the audit log",
          "description": "Returns recent gateway calls (time, app, matched route, status, reason, duration); use it to investigate individual calls across the project rather than gate_metrics aggregates or a single gate_run_timeline. Newest first, with totals by status and refusal reason for the returned calls. This view never returns bodies, query values or headers. For 24-hour totals and anomaly scores use gate_metrics; for a signed export an auditor can check, gate_audit_proof; for one run's history, gate_run_timeline.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "app": {
                "description": "Optional: only this app id (app_...)",
                "type": "string"
              },
              "limit": {
                "description": "How many calls (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project id from gate_create_project, e.g. p1a2b3...",
                "type": "string"
              },
              "status": {
                "description": "Optional: only this HTTP status, e.g. \"403\"",
                "type": "string"
              }
            },
            "required": ["admin_key", "project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ec617feef6787ac093acf9dc974cb1f29b2edbf240f0c5c952ad27f2b11aaaf5"
        },
        {
          "name": "gate_audit_proof",
          "title": "Export a signed audit proof",
          "description": "Returns chained audit rows, decided-action feature snapshots and signed anchors; use it for a portable tamper-evident export instead of gate_audit's recent-call view, then check it with gate_audit_verify. No sealed paths/bodies, notes, keys or IPs in the action labels. Legacy actions lack snapshots and are excluded. store_audit=false has no chain. Follow next_from for audit rows and next_actions_after as actions_after for labels (10,000 each). Use API/SDK to verify exports above the MCP request size limit. The signature is HMAC-SHA256.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actions_after": {
                "description": "Action cursor from next_actions_after",
                "type": "string"
              },
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "from": {
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project id from gate_create_project, e.g. p1a2b3...",
                "type": "string"
              },
              "to": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["admin_key", "project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:af0568dbddb38b61c3827b54c1275a8983dfa65cf7df503e9e174c382a3e622a"
        },
        {
