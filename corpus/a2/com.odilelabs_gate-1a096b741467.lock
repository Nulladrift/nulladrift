      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Create and configure Gate here. Start with gate_create_project, then gate_create_app; store issued keys privately. gate_update_project changes project alert settings; gate_configure_app changes one app setting; gate_manage_app_key rotates or revokes an app key; gate_manage_members invites, lists or revokes teammates. gate_check_setup reads project protection settings. Create a dedicated human approval key with gate_create_approver, inspect it with gate_list_approvers, and read held actions with gate_list_actions. Approving or rejecting a held action is done by a person with an approver key in the dashboard, by design. No MCP tool can approve actions. For runs, audit, metrics and learned policy changes use the oversight endpoint, /mcp/oversight. Config-file tools require the deployment flag. The specialized OpenShell helper remains callable but unlisted; usage email configuration is also callable but unlisted when its feature flag is enabled. /mcp retains the full compatibility catalog; original names remain callable for capabilities this profile offers.",
      "tools": [
        {
          "name": "gate_check_setup",
          "title": "Check an agent integration setup",
          "description": "Read actual project protection settings and configuration gaps without changing them. Configuration analysis only: no upstream requests, runtime enforcement test or security certificate. Config-file validation and application are separate capabilities when enabled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "app": {
                "description": "Optional: check one active app id (app_...) instead of all active apps",
                "type": "string"
              },
              "project_id": {
                "description": "The project id from gate_create_project, e.g. p1a2b3...",
                "type": "string"
              }
            },
            "required": ["admin_key", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dde491115db7212b79167cd47dc3312395a1cafa0257d150a506fdce8409bd38"
        },
        {
          "name": "gate_configure_app",
          "title": "Configure one app setting",
          "description": "Set models, mandatory runs, response fields, or add one confirmed literal route to an existing app. Choose exactly one operation; models:null removes the model limit, response allow:null disables filtering, and runs:off removes the run requirement. Use gate_check_setup to inspect settings; apply learned routes and rate limits on the oversight endpoint, /mcp/oversight.",
