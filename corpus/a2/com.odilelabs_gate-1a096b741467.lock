        "name": "com.odilelabs/gate",
        "title": "Odile Gate by Odile Labs",
        "version": "1.8.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Odile Gate, from Odile Labs (communication infrastructure connecting people, businesses and AI agents), puts a key, an allow-list, a rate limit and an audit log in front of an HTTP API. 1) gate_create_project with the API base URL; save the admin_key in the project .env (gitignored), never in code. 2) gate_create_app once per app, listing only the calls that app makes (from the client code you wrote). 3) Point the app at the gateway URL with Authorization: Bearer <app key>; first test an allowed call and a forbidden method (403 route_not_allowed). 4) gate_audit shows what each app did; gate_explain_refusal explains a refused call. Gate Actions: for an agent that changes customer data, gate_create_run grants one session narrow, expiring permission (scope, limits, approvals); gate_set_app_runs makes runs mandatory. Before handing an integration production access, use gate_check_setup to show the human actual protection settings, configuration gaps and exact remedies. It is read-only configuration analysis, not runtime verification or a security certificate; keep upstream ownership checks and test the real integration. For native OpenShell v0.1.5, gate_openshell_setup returns a one-command local installer, exact hash and recipe schema. Default is an isolated Free read-only demo; obtain owner-authorized upstream/routes/scope before using a custom recipe. Setup preserves TLS/JWT and does not renew revoked permissions. The hosted MCP server never executes local setup.",
      "tools": [
        {
          "name": "gate_add_approver",
          "title": "Add an approver",
          "description": "Create an approver key for the person who approves held actions (shown once), before granting approval actions. Give it to that person, never to an agent. Only an active approver key can approve, reject or reopen actions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "name": {
                "description": "Who approves, e.g. \"Dana (support lead)\"",
                "type": "string"
              },
              "project_id": {
                "description": "The project id from gate_create_project, e.g. p1a2b3...",
                "type": "string"
              }
            },
            "required": ["admin_key", "name", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
