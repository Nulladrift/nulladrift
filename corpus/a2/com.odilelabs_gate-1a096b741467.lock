          "title": "List held actions",
          "description": "Which actions are waiting for a human decision? Read held actions (pending by default, or another requested state) and their exact calls; this tool cannot decide or resubmit them. Approving or rejecting a held action is done by a person with an approver key in the dashboard, by design. No MCP tool can approve actions.",
