        {
          "name": "gate_manage_members",
          "title": "Invite, list or revoke team members",
          "description": "Members are people with project administration access according to their role. Use the project owner key to invite, list or revoke them; viewer and approver roles have narrower access than admins. Invites expire after 72 hours and their links and accepted keys are shown once; listing returns no secrets. Revocation invalidates a key or pending invite and is safe to repeat. Gate sends no email. For dedicated approval keys use gate_create_approver, gate_list_approvers and gate_revoke_approver.",
          "inputSchema": {
            "additionalProperties": false,
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "admin_key": {
                    "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                    "type": "string"
                  },
                  "name": {
                    "description": "The person's name",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "operation": {
                    "const": "invite",
                    "description": "Perform exactly one operation: invite, list, revoke.",
                    "enum": ["invite", "list", "revoke"],
                    "type": "string"
                  },
                  "project_id": {
                    "description": "The project id from gate_create_project, e.g. p1a2b3...",
                    "type": "string"
                  },
                  "role": {
                    "description": "Invited member role: viewer, approver, or admin.",
                    "enum": ["viewer", "approver", "admin"],
                    "type": "string"
                  }
                },
                "required": ["admin_key", "name", "project_id", "role"]
              },
              {
                "additionalProperties": false,
                "properties": {
                  "admin_key": {
                    "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                    "type": "string"
