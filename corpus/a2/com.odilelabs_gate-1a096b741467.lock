        {
          "name": "gate_check_setup",
          "title": "Check an agent integration setup",
          "description": "Read actual Gate protection settings before giving an integration production access. Reports observe-only mode, writes without mandatory runs, missing user-token configuration, wildcard grants and approval separation, with evidence, exact remedies and explicit limits. Sends no upstream requests, changes no settings and uses no gateway quota. Configuration-only: not a security certificate or runtime enforcement test. Use it on a live project; to check an odile.yaml before applying it use gate_validate_config.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "app": {
                "description": "Optional: check one active app id (app_...) instead of all active apps",
                "type": "string"
              },
              "project_id": {
                "description": "The project id from gate_create_project, e.g. p1a2b3...",
                "type": "string"
              }
            },
            "required": ["admin_key", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:446fb9469c80aadd47d8a210cb38f2df75b8ecbd4de426b867aeae5096e022a0"
        },
        {
          "name": "gate_create_app",
          "title": "Register an app",
          "description": "Give one app its own key and the calls it may make. Routes are rules like \"GET /orders/:id\", \"POST /orders\", \"GET /users/{user}/orders\" (per-user), or example calls like \"GET /orders/42\", which become rules allowing any id. Returns key (shown once), app.id and normalized rules. Send key as Authorization: Bearer <key> to the project gateway; never send the admin key to the workload.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["routes"]
              },
              {
                "required": ["template"]
              }
            ],
            "properties": {
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "expires_at": {
                "description": "Pro: optional future ISO time with timezone, at most 30 days from creation. Rotation preserves this expiry.",
                "format": "date-time",
                "type": "string"
              },
              "max_calls": {
                "description": "Pro: optional lifetime call allowance for this app. Rotation preserves its count.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "models": {
                "description": "For a model API: the only models this app may ask for, exact names or a prefix ending in * (e.g. [\"gpt-4.1-mini\", \"claude-haiku-*\"]). Omit for no model limit.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "description": "The app name, e.g. \"storefront\" or \"nightly sync\"",
                "type": "string"
              },
              "per_minute": {
                "description": "Calls per minute for this app (default 60)",
                "maximum": 6000,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project id from gate_create_project, e.g. p1a2b3...",
                "type": "string"
              },
              "routes": {
                "description": "Only the calls this app makes, one \"METHOD /path\" per item",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "template": {
                "description": "Ready-made API policy: reads allowed, risky writes held, destructive calls refused. Explicit routes replace the entire template policy. Free and Pro; configure the project upstream first. See /templates.",
                "enum": ["stripe", "github", "shopify", "hubspot", "supabase", "slack", "recall", "quickbooks", "xero"],
                "type": "string"
              }
            },
            "required": ["admin_key", "name", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76129aacb45e8d630b5ae9a15fcd71b51cfe0e8fa1ce1e3c5bf3b07cdf29102b"
        },
        {
          "name": "gate_create_project",
          "title": "Create a Gate project",
          "description": "Create a Free project in front of an existing HTTPS API. No signup or payment required. For a credential-free demo use https://sandbox.gate.odilelabs.com with GET /customers/:cid/tickets/:id (customer A holds tickets 1-3, B holds 4-5: try GET /customers/A/tickets/1). Returns project_id, admin_key (shown once) and the gateway base URL apps call instead of the API. A real API and its credentials need owner authorization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "header_name": {
                "description": "Optional: the secret header your API expects, e.g. Authorization or apikey",
                "type": "string"
              },
              "header_value": {
                "description": "Optional: its value. Stored encrypted; apps never see it.",
                "type": "string"
              },
              "name": {
                "description": "A name for the project, e.g. \"Shop API\"",
                "type": "string"
              },
              "upstream": {
                "description": "The API base URL, https only, e.g. https://api.example.com/v1",
                "type": "string"
              }
            },
            "required": ["name", "upstream"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b109d281670d8d5612a44e5d71e7e68735ec16a283fa1067971f7ad6930030c7"
        },
        {
          "name": "gate_create_run",
          "title": "Grant one agent run",
          "description": "Gate Actions: give one agent session narrow, expiring permission. Actions are rules with {placeholders} bound by scope (e.g. \"PATCH /customers/{customer}/tickets/:id\" with scope {\"customer\":\"A\"}), each with an optional max and approval. Add a human approver with gate_add_approver before granting approval:true actions; without an active approver the grant is refused. Returns a run token (shown once) the agent sends as x-odile-run with its app key. Writes in a run need an Idempotency-Key. Give a write a check (\"GET /bookings?idempotency_key={key}\") and the agent can settle a lost answer with POST /g/<id>/_gate/recover.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actions": {
                "description": "Rules, or {rule, max, approval, check}",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "approval": {
                          "type": "boolean"
                        },
                        "check": {
                          "description": "For a write: the GET that finds it by key, e.g. \"GET /customers/{customer}/bookings?idempotency_key={key}\"; it must also be a GET action of the run",
                          "type": "string"
                        },
                        "idempotent": {
                          "description": "With check: the API dedupes on Idempotency-Key, so a not-found write may be retried",
                          "type": "boolean"
                        },
                        "max": {
                          "minimum": 1,
                          "type": "integer"
                        },
                        "rule": {
                          "type": "string"
                        }
                      },
                      "required": ["rule"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "admin_key": {
                "description": "The project admin key (ga_...). Read it from the .env; never print it.",
                "type": "string"
              },
              "app": {
                "description": "The app id (app_...) this run is for",
                "type": "string"
              },
              "label": {
                "description": "Optional: what the run is for, e.g. \"triage ticket 4411\"",
                "type": "string"
              },
              "max_calls": {
                "description": "Optional: calls allowed in the whole run",
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "The project id from gate_create_project, e.g. p1a2b3...",
                "type": "string"
              },
              "scope": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Values for the {placeholders}, e.g. {\"customer\":\"A\"}",
                "type": "object"
              },
              "ttl_seconds": {
                "description": "How long the run lasts (default 3600)",
                "maximum": 86400,
                "minimum": 60,
                "type": "integer"
              }
            },
            "required": ["actions", "admin_key", "app", "project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6a43cfb377eecc84866bb48fc3d3c4db8a0b625c431194efbb63ce59869e0f5e"
        },
