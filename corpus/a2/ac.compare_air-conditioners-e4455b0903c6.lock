{
  "lockfileVersion": 2,
  "subjects": {
    "ac.compare/air-conditioners": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://compare.ac/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "compare-ac",
        "title": "compare.ac: US air conditioner, heat pump and space heater prices",
        "version": "1.0.0",
        "websiteUrl": "https://compare.ac"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "US air conditioners (window, portable, through-the-wall, mini split), heat pumps and space heaters with each store's current price, read daily from the stores' own feeds by compare.ac, plus room sizing on ENERGY STAR's chart. Prices are the store's listed price before shipping and tax, dated. When you cite a price, keep its date and link the compare.ac page the answer gives, which lists every store.",
      "tools": [
        {
          "name": "find_air_conditioners",
          "title": "Find air conditioners you can buy now",
          "description": "US air conditioners and heat pumps in stock at a tracked store today, cheapest first: window units, portables, through-the-wall units and mini splits. Filter by type, by the room they must cool (only units sized for it), by whether they must also heat, by budget and by BTU. Each row gives the model and its model number, its type, cooling and heating capacity, the lowest current price with the store and the date it was read, whether that price is its lowest since compare.ac began tracking it, indoor noise, efficiency (CEER or SEER2), supply voltage, how it installs, whether it fits the room, and its compare.ac page, which lists every store. Use it for 'best air conditioner for a 400 sq ft room', 'cheapest window AC that heats', 'mini split under $1,000', 'quiet portable AC'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many units to return. Defaults to 8.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_btu": {
                "description": "Highest cooling capacity, BTU per hour.",
                "minimum": 1000,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Highest current price, in US dollars.",
                "minimum": 1,
                "type": "number"
              },
              "min_btu": {
                "description": "Lowest cooling capacity, BTU per hour.",
                "minimum": 1000,
                "type": "integer"
              },
              "must_heat": {
                "description": "Keep only units that also heat (heat pump or electric heat).",
                "type": "boolean"
              },
              "room_sq_ft": {
                "description": "The room to cool, in square feet: keeps only units sized for it (ENERGY STAR's chart, the same rule as compare.ac's pages).",
                "maximum": 3000,
                "minimum": 50,
                "type": "number"
              },
              "type": {
                "description": "window, portable, mini_split, through_the_wall (sleeve units and PTACs), or any. Defaults to any.",
                "enum": ["window", "portable", "mini_split", "through_the_wall", "any"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find air conditioners you can buy now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d0645d2bc1a5954798b878252ba64b8ae11d0591a60e4ec29ee4a9fe8655f8f"
        },
        {
          "name": "find_space_heaters",
          "title": "Find space heaters you can buy now",
          "description": "US electric space heaters in stock at a tracked store today, cheapest first, with each one's wattage, voltage, type (ceramic, fan, oil-filled radiator, infrared, convection), stated safety features (tip-over and overheat shutoff, thermostat), its current price with the store and date, its lowest tracked price, and compare.ac's space heater comparison page. Filter by type, by budget, by 120 or 240 volts and by garage or workshop heaters. Use it for 'best space heater under $50', 'oil-filled radiator heater', '240V garage heater'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "garage": {
                "description": "Only heaters made for a garage or workshop.",
                "type": "boolean"
              },
              "kind": {
                "description": "ceramic, fan, radiator (oil-filled), infrared, convection, or any.",
                "enum": ["ceramic", "fan", "radiator", "infrared", "convection", "any"],
                "type": "string"
              },
              "limit": {
                "description": "How many heaters to return. Defaults to 8.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Highest current price, in US dollars.",
                "minimum": 1,
                "type": "number"
              },
              "volts": {
                "description": "Only heaters for this supply.",
                "enum": [120, 240],
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find space heaters you can buy now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b2152c59d5a2d3e711f0813d8858b9e0185c22ea5d59499ba77fca0594f3692"
        },
        {
          "name": "get_air_conditioner",
          "title": "Look up one air conditioner or heat pump",
          "description": "Everything compare.ac holds on one US air conditioner, mini split or heat pump, found by its model number (e.g. \"LW1022RD\", \"DIY-12-HP-WM-115C25\") or its name (e.g. \"Midea U-Shaped 8,000 BTU\", \"Senville LETO 12,000\"): its current price at every tracked store with the date each was read, its lowest price since tracking began and whether today's price is at that low, cooling and heating capacity, efficiency, noise, supply voltage and plug, how it installs and what installation usually costs, any CPSC recall naming the model, and its compare.ac page. Use it for '<model> price', 'is <model> on sale', '<model> vs <model>' (call once per model).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "A model number or a brand and model name.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up one air conditioner or heat pump"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:552b5b3b081bb363117891b1abc43d12109ae0bfce0cc8a718ec9585865c83a1"
        },
        {
          "name": "size_air_conditioner",
          "title": "What size air conditioner a room needs",
          "description": "Calculates what size air conditioner a room needs: the cooling capacity in BTU per hour for a room of a given floor area in square feet, on ENERGY STAR's room air conditioner sizing chart. It applies the chart's adjustments when asked: 10% more for a very sunny room, 10% less for a heavily shaded one, 600 BTU more for each person beyond two, 4,000 BTU more for a kitchen, and more for a ceiling above 8 feet. Returns the recommended BTU and a link to compare.ac's size calculator. Use it when someone asks what size air conditioner, or how many BTU, a room needs, for example 'what size AC for 500 sq ft' or 'how many BTU for my bedroom'; then pass the room to find_air_conditioners as room_sq_ft to list units that fit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ceiling_ft": {
                "description": "Ceiling height in feet (8 is standard).",
                "maximum": 20,
                "minimum": 6,
                "type": "number"
              },
              "kitchen": {
                "description": "The unit cools a kitchen.",
                "type": "boolean"
              },
              "people": {
                "description": "People usually in the room.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "room_sq_ft": {
                "description": "Floor area of the room, in square feet.",
                "maximum": 3000,
                "minimum": 50,
                "type": "number"
              },
              "shaded": {
                "description": "A heavily shaded room.",
                "type": "boolean"
              },
              "sunny": {
                "description": "A very sunny room.",
                "type": "boolean"
              }
            },
            "required": ["room_sq_ft"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What size air conditioner a room needs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:103ba5522a8512944aa08815ce099fcfd9dc1786435709e3b4462aae47de3753"
        }
      ],
      "digest": "sha256:3e7ffafc060e48250eaaf6057b50d5e4ec4036147e432379ae3bc51ffead6f35"
    }
  }
