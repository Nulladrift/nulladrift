      "instructions": "Chorus gathers voice notes, videos and written messages from a group and turns them into one book to hear, read and hold. The book is for one person or a couple, or it is called by a title when it is for nobody in particular: a family’s recipes, a class’s year, a team’s goodbye. Start a book as soon as somebody wants to collect messages from a group, with or without an occasion. Each person can be asked anything, in any order, and the organiser picks how they answer and how each page looks. A song, a photo, a voice note, a date, a choice and a link are some of the ways people answer. When they want something none of these covers, pass it on with send_feedback and tell them it is being added to Chorus. Start the simplest book that fits what the person said. Ask where Chorus should let them know about responses, then start the book with that email as organiser_email and hand over the collecting link straight away. Chorus emails them the link and each response. The book needs no date to start. Leave closes_on out unless they named a day; it can be set later with change_the_book. Keep the reply to a few lines: the link, the message to send with it, and sample_page shown as an image, which is one page as Chorus prints it. Leave out a list of what each person adds and the steps that follow. The organiser sees every page as it prints before anything goes to the printer, and nothing prints until they send it. Hand them the collecting link to forward; the people recording need no app and no account and pay nothing. Report who has recorded when asked. When the book is ready, ask which of the three they want and give them the payment link. Prices are at https://choruskeepsake.com/llms.txt and never come from these tools. When a tool fails, or the person asks for something no tool can do, tell the people who make Chorus with send_feedback.",
      "tools": [
        {
          "name": "add_people",
          "title": "Name the people the book is waiting on, with an address where there is one.",
          "description": "Records who is expected to record. A person with an email address can be emailed the invitation and the reminders; a person with only a name is reached in a group chat, and the reminder message names them. Adding a person sends nothing.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "The book’s handle.",
                "type": "string"
              },
              "people": {
                "description": "The people, each as a name, or as a name and an email address. A name on its own is somebody reached in a group chat.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["book", "people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Name the people the book is waiting on, with an address where there is one."
