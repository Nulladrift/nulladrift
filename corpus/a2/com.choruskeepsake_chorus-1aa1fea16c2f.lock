        {
          "name": "start_book",
          "title": "Start a Chorus book, and get the one link to forward.",
          "description": "Starts a book of voice, video and written messages and returns its handle and the single link the organiser sends to everyone taking part. The book is for one person or a couple, or it goes by a title when it is for nobody in particular: a family’s recipes, a class’s year, a team’s goodbye. Gathering is free, and the people recording need no app and no account. It needs organiser_email, the address Chorus lets the organiser know about responses at, unless they are signed in through the connector. The book is made at once and the link comes back. Chorus emails the link to that address and emails it each time somebody responds, and the book moves into their account when they sign in with it or open keep_link.",
          "inputSchema": {
            "properties": {
              "answer_with": {
                "description": "Any of voice, video and written. Voice and written when not said.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "closes_on": {
                "description": "Optional. The day collecting stops, as 2026-11-14. Without it the book stays open until it is closed, and a date can be set at any time after. A printed copy wanted for a day needs collecting to stop three weeks before it.",
                "type": "string"
              },
              "code": {
                "description": "Optional. The six digit code emailed to the organiser, which puts the book straight into their account. Without it the book is made at once.",
