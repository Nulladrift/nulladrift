          "title": "Change the closing date, the questions and steps, or what people may send.",
          "description": "Changes the settings the organiser can change on the site: the day collecting stops, the questions people answer, whether they may send voice, video or writing, which one the button offers first, and whether the people recording are offered to chip in towards the printed book. Nobody is told about a change.",
