        },
        {
          "name": "arrange_the_book",
          "title": "Put the people in order, and set the title and the cover.",
          "description": "Sets the order the people print in, takes a person’s pages out or puts them back, and changes the book’s title and its cover: a photo or one of six colours on the front, the line under the title, and what the back carries. It moves pages and changes no word on them, and a person’s own pages stay together. Returns the people in their new order, the cover as it stands, anything refused with its reason, and a picture of the opening page. A book that has gone to the printer stays as it is.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "The book’s handle.",
                "type": "string"
              },
              "cover": {
                "description": "Any of: front, photo or colour; colour, one of forest, navy, black, grey, red and tan; title_colour, light or dark; from, the line under the title; back, one of line, names, photo, words and plain; back_words, the organiser’s own words for the back; back_line, one sentence from a message, word for word.",
                "properties": {
                  "back": {
                    "enum": ["line", "names", "photo", "words", "plain"],
                    "type": "string"
                  },
                  "back_line": {
                    "type": "string"
                  },
                  "back_words": {
                    "type": "string"
                  },
                  "colour": {
                    "enum": ["forest", "navy", "black", "grey", "red", "tan"],
                    "type": "string"
                  },
                  "from": {
                    "type": "string"
                  },
                  "front": {
                    "enum": ["photo", "colour"],
                    "type": "string"
                  },
                  "title_colour": {
                    "enum": ["light", "dark"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "leave_out": {
                "description": "Names whose pages come out of the book. The pages stay in the editor.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "order": {
                "description": "Names as they print on the pages, in the order they should come. Anybody not named follows in the order they had.",
                "items": {
                  "type": "string"
