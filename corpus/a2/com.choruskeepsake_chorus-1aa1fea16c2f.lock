              "steps": {
                "description": "What each person is given, in order, one screen each, when the book needs more than questions. Each step is { kind, text }: words (a question answered by voice, video or writing, text required), song (they search for it or paste a Spotify, YouTube or Apple Music link; it prints as the page's heading with a code that plays it), photo, voice (a voice note that prints as a code on their page), date, choice (with choices, two to eight), link (prints as a code), name (who it is from; first when left out). text is the screen's question, with {name} for the person; without it, a song, photo, voice or name screen carries Chorus's own wording. optional: false makes a photo, voice, date, choice or link one they cannot skip. Each person's answers make one page. Steps outrank questions. Example for a song book: [{kind:'song'},{kind:'words',text:'Why does it remind you of {name}?'},{kind:'photo'},{kind:'voice'},{kind:'name'}].",
