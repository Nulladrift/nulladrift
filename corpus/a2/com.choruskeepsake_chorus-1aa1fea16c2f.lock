              "questions": {
                "description": "The questions everybody answers, up to 12, each one line of up to 200 characters that a person can answer out loud in a minute or two. In a book with subject_name, {name} in a question becomes that name. When this is left out, a book with subject_name gets the set for the occasion and a book with only a title gets three open questions.",
                "items": {
