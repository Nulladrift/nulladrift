  "subjects": {
    "com.avahit/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://avahit.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "avahit-catalog",
        "version": "1.1.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only catalog of Amazon products by brand and category. Avahit returns no Amazon prices and keeps no Amazon price history: the current price is on Amazon. Every product links to the store; those links can be affiliate links and commissions never affect ranking.",
      "tools": [
        {
          "name": "compare_alternatives",
          "description": "Given an Avahit product id, return ranked alternatives with a match percentage explaining how close each one is (same category, price distance, product type, same store).",
          "inputSchema": {
            "properties": {
              "productId": {
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:95d4476da2c0f9ed23763cd05f2e7cd664ae3a0122a3623033e82f28dcdc057a"
        },
        {
          "name": "search_products",
          "description": "Search Avahit's catalog of Amazon products by brand and category. Returns title, store domain and a link to the product page on Avahit. Amazon prices are not returned: the current price is on Amazon, and Avahit keeps no Amazon price history.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results, 1-20 (default 8)",
                "type": "number"
              },
              "query": {
                "description": "What the shopper is looking for, e.g. 'white sneakers'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ae3ca93f978966017005f9035ac96158045584c0b43a0b4f4b7c1a83c386cd9"
        }
      ],
      "digest": "sha256:4d24d92b7efd34f99b7b39c987c24f30602af53e31724ec2daaf2d2303fbd79a"
    }
  }
