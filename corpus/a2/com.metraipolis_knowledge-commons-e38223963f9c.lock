        {
          "name": "search_clauses",
          "title": "Search HTTP standard clauses (exact RFC quotes)",
          "description": "Search HTTP requirements, caching rules, headers and status-code semantics in RFCs 9110–9114 (HTTP semantics, caching, HTTP/1.1, HTTP/2, HTTP/3) by concept, words, RFC section or stable id. Each result carries quote_official: the exact official RFC text, plus conditions, exceptions, related clauses and errata.\nWhen to use: Use when you must answer what an HTTP standard requires (MUST/SHOULD/MAY) and cite it. Cite quote_official to the letter, including spaces and newlines; null means no verified text, so do not invent one. Use get_clause for more context on one result and cite_source for a citation with a stable link.\nNotes: No account or token needed. At most 5 groups; ranked results and companion groups each have a 48,000-character text budget; truncation is explicit.\nExample arguments: {\"query\":\"must-revalidate when origin is unreachable\",\"limit\":5}",
