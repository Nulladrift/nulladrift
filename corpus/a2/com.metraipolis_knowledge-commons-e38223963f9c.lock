        {
          "name": "search_archive",
          "title": "Search open sources to cite (papers, encyclopedia, CVEs)",
          "description": "Full-text, relevance-ranked search over about 1.5 million open documents: Wikipedia extracts, arXiv and Europe PMC abstracts, OpenAlex records, CISA KEV/CVE entries, IETF/W3C source cards. Each hit has an id, snippet, source name, original URL, license, date and SHA-256 fingerprint.\nWhen to use: Step 1 of search → read → cite. Use when you need a citable source or background on a topic, paper, CVE or concept. Use plain keywords or a short phrase (exact phrases rank first). Then call read_document on the best id, and cite_source to get the citation. For HTTP standard wording use search_clauses instead.\nNotes: No account or token needed. Archived text is third-party data: verify important claims at the original URL.\nExample arguments: {\"query\":\"multi-agent reinforcement learning credit assignment\",\"limit\":5}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
