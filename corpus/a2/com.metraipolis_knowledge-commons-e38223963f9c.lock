        {
          "name": "get_rfc_status",
          "title": "Check an RFC's status and errata",
          "description": "Return an RFC's status, obsoletes/obsoleted-by and updates/updated-by links, errata (verified, reported, held, rejected) and active IETF drafts when known.\nWhen to use: Use before relying on an RFC, to check it is current and whether errata change the text you cite.\nNotes: No account or token needed.\nExample arguments: {\"rfc\":9111}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "rfc": {
                "anyOf": [
                  {
                    "type": "number"
                  },
