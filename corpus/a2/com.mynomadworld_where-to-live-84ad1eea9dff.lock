{
  "lockfileVersion": 2,
  "subjects": {
    "com.mynomadworld/where-to-live": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mynomadworld.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mynomadworld",
        "title": "MyNomadWorld: where should I live?",
        "version": "1.0.0",
        "websiteUrl": "https://mynomadworld.com/mcp/"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MyNomadWorld helps remote workers and digital nomads decide which country to move to. Use recommend_countries for \"where should I live / move next\" questions (it is the same engine as the MyNomadWorld quiz, ranking 197 countries relative to the user's home country), country_profile for one country, compare_countries for two, and digital_nomad_visas to list countries with a remote-work visa. Ask the user for their home country and, if they share it, their monthly income in euros; everything is relative to those. Always show the links returned so the user can see the full country page or take the full quiz. Figures are estimates for guidance, not tax or legal advice.",
      "tools": [
        {
          "name": "compare_countries",
          "title": "Compare two countries",
          "description": "Side-by-side comparison of two countries for someone deciding where to move: tax for their income, cost of living, climate, safety, healthcare, internet, time zone, language, digital nomad visa. With home_country it also gives each one's match score from the MyNomadWorld engine.",
          "inputSchema": {
            "properties": {
              "country_a": {
                "type": "string"
              },
              "country_b": {
                "type": "string"
              },
              "current_country": {
                "description": "Country the user lives in now, if different. Cost and current tax are compared with this one, and it is left out of the results.",
                "type": "string"
              },
              "home_country": {
                "description": "Country the user is from (English name or ISO code). Distance to family and language are measured from here. Required.",
                "type": "string"
              },
              "monthly_income_eur": {
                "description": "Monthly income in euros before tax. Used to estimate the income tax the user would pay in each country.",
                "type": "number"
              }
            },
            "required": ["country_a", "country_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea0144c0ef66ffe7267ad826e8b9d8bb3e4b1b4f5a40a7b8704738db09dd3e0b"
        },
        {
          "name": "country_profile",
          "title": "Country profile for a move",
          "description": "Key facts for living in one country as a remote worker or expat: income tax the user would pay (if income given), special newcomer tax regime, cost of living, climate by month, safety, healthcare, internet speed, languages and English level, time zone, digital nomad visa and residency minimum. Links to the full MyNomadWorld country page.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name or ISO code.",
                "type": "string"
              },
              "current_country": {
                "description": "Country the user lives in now, if different. Cost and current tax are compared with this one, and it is left out of the results.",
                "type": "string"
              },
              "home_country": {
                "description": "Country the user is from (English name or ISO code). Distance to family and language are measured from here. Required.",
                "type": "string"
              },
              "monthly_income_eur": {
                "description": "Monthly income in euros before tax. Used to estimate the income tax the user would pay in each country.",
                "type": "number"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b42962d89ec4a47c6140b589eb6133fbe3d3f20907247337c5f160b57c6bca8a"
        },
        {
          "name": "digital_nomad_visas",
          "title": "Countries with a digital nomad visa",
          "description": "Lists countries that offer a digital nomad or remote-work visa in the MyNomadWorld dataset, with the monthly income requirement, length and family option. Optionally only those the user qualifies for on income.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "monthly_income_eur": {
                "description": "If given, only visas whose income requirement is at or below this.",
                "type": "number"
              },
              "region": {
                "description": "Optional continent filter: Europe, Asia, Americas, Africa, Oceania.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49bca62e459bd5db2cfa004e32822c30d1a51e70646e279210b68cc33e573fb7"
        },
        {
          "name": "recommend_countries",
          "title": "Recommend countries to move to",
          "description": "Ranks the countries that best fit a person who wants to move abroad (\"where should I live?\", \"where should I move next?\", \"best country for me as a remote worker\"). Same algorithm and data as the MyNomadWorld quiz: tax the user would actually pay, cost of living versus where they live, safety, climate, sea, flight time to family, language, healthcare, ease of residency. Extra filters: digital nomad visa, minimum internet speed, time zone overlap. Returns the top matches with reasons, watch-outs and links.",
          "inputSchema": {
            "properties": {
              "age_band": {
                "enum": ["u30", "30-45", "45-60", "60+"],
                "type": "string"
              },
              "climate": {
                "description": "Wanted climates (any of them). warm = average 17 C or more, mild = 9 to 24 C, cold = 15 C or less. Empty = climate does not matter.",
                "items": {
                  "enum": ["warm", "mild", "cold"],
                  "type": "string"
                },
                "type": "array"
              },
              "current_country": {
                "description": "Country the user lives in now, if different. Cost and current tax are compared with this one, and it is left out of the results.",
                "type": "string"
              },
              "home_country": {
                "description": "Country the user is from (English name or ISO code). Distance to family and language are measured from here. Required.",
                "type": "string"
              },
              "household": {
                "description": "Who is moving: alone, with a partner, or with children.",
                "enum": ["solo", "couple", "kids"],
                "type": "string"
              },
              "limit": {
                "description": "How many countries to return (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_hours_difference": {
                "description": "Maximum hours of difference from work_timezone_utc_offset (default 3 when an offset is given).",
                "type": "number"
              },
              "min_internet_mbps": {
                "description": "Minimum fixed broadband speed in Mbps (approximate national median).",
                "type": "number"
              },
              "monthly_income_eur": {
                "description": "Monthly income in euros before tax. Used to estimate the income tax the user would pay in each country.",
                "type": "number"
              },
              "needs_digital_nomad_visa": {
                "description": "Only countries with a digital nomad or remote-work visa in our data (and, if income is given, whose income requirement the user meets).",
                "type": "boolean"
              },
              "priorities": {
                "description": "Ordered list, most important first. Values: tax (low taxes), cost (low cost of living), safety, near (close to home and family), lang (they speak my language), life (healthcare and long life expectancy).",
                "items": {
                  "enum": ["tax", "cost", "safety", "near", "lang", "life"],
                  "type": "string"
                },
                "type": "array"
              },
              "residency_budget_eur": {
                "description": "Money available for a residency deposit or investment. Hides countries whose minimum is higher.",
                "type": "number"
              },
              "sea": {
                "description": "coast = only countries with a coastline; near = sea is a plus; any = does not matter.",
                "enum": ["coast", "near", "any"],
                "type": "string"
              },
              "work_timezone_utc_offset": {
                "description": "UTC offset of the team or clients the user works with, for example -5 for New York in winter or 1 for Berlin.",
                "type": "number"
              }
            },
            "required": ["home_country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:067523e02303a09e3288d18e2d7649bc7c7abf43090a3c7f29ab1bd5971498db"
        }
      ],
      "digest": "sha256:941386e89c8e453200560565a8f1188f32e619b5458d10f423353da9e257bd3e"
    }
  }
}
