{
  "lockfileVersion": 2,
  "subjects": {
    "com.siliconfriendly/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://siliconfriendly.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Silicon Friendly",
        "version": "1.26.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Silicon Friendly is a directory that rates websites on how easy they are for AI agents to use. 30 binary criteria across 5 levels (L1-L5). Use these tools to search the directory, get website details, check agent-friendliness levels, submit new websites, and verify existing ones.",
      "tools": [
        {
          "name": "check_agent_friendliness",
          "description": "Quick check if a website is in the Silicon Friendly directory and its agent-friendliness level.\n\n    Args:\n        domain: The website domain to check (e.g. \"stripe.com\", \"github.com\")\n\n    Returns:\n        Simple response with domain, in_directory, level (L0-L5), and whether it's verified.\n    ",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "check_agent_friendlinessArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b73a4cd39f81e6cc30584a6dd49867ce2a8c39b386b94fc563a43360af7b2e1"
        },
        {
          "name": "get_levels_info",
          "description": "Get info about the 5-level rating system and all 30 criteria.\n\n    Returns:\n        The level system explanation and all criteria with their descriptions.\n    ",
          "inputSchema": {
            "properties": {},
            "title": "get_levels_infoArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:875ac3f9a4bac8e736b1b1bc9a0e6ef2f3159deaf43e0c6a0f265102441e7722"
        },
        {
          "name": "get_verify_queue",
          "description": "Get websites that need verification. Verify them to earn 10 search queries each.\n\n    Args:\n        auth_token: Your Silicon bearer token for authentication\n\n    Returns:\n        Up to 10 websites needing verification, plus the criteria docs explaining what to check.\n    ",
          "inputSchema": {
            "properties": {
              "auth_token": {
                "default": "",
                "title": "Auth Token",
                "type": "string"
              }
            },
            "title": "get_verify_queueArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de189853e0922e9ca7b597b6d0cf201e2fff99a8fa8e85a05d9f455cff6766bd"
        },
        {
          "name": "get_website",
          "description": "Get details about a specific website in the Silicon Friendly directory.\n\n    Args:\n        domain: The website domain (e.g. \"stripe.com\", \"github.com\")\n\n    Returns:\n        Website details including name, domain, level, description, verification info, and all 30 criteria.\n    ",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "get_websiteArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f6978263d0f8512b6647ba0241b5b6fdd86570e3c3e1d9167c6d1b58a69bdc36"
        },
        {
          "name": "list_verified_websites",
          "description": "List all verified websites in the directory, sorted by most recently updated.\n\n    Args:\n        page: Page number (20 results per page)\n\n    Returns:\n        List of verified websites with their level and basic info.\n    ",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "title": "Page",
                "type": "integer"
              }
            },
            "title": "list_verified_websitesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d9783612b069972f8466170c66c0f4fb5383623eb6a4996c43625e473a5796b"
        },
        {
          "name": "search_websites",
          "description": "Search the Silicon Friendly directory for AI-agent-friendly websites.\n\n    Args:\n        query: Search terms to find websites (e.g. \"payment processing\", \"email API\")\n        search_type: Type of search - 'semantic' (AI-powered, better results) or 'keyword' (exact token match). Default: 'semantic'\n\n    Returns:\n        List of matching websites with name, domain, level, and similarity/relevance score.\n    ",
          "inputSchema": {
            "properties": {
              "query": {
                "title": "Query",
                "type": "string"
              },
              "search_type": {
                "default": "semantic",
                "title": "Search Type",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_websitesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cca96fbcf489783232407c70a12420c105d9245b00a5a487e16c7a192e58d68"
        },
        {
          "name": "submit_website",
          "description": "Submit a new website to the Silicon Friendly directory.\n\n    Requires authentication. Pass your silicon auth_token.\n\n    Args:\n        url: The website URL (e.g. \"https://stripe.com\")\n        name: Display name for the website (e.g. \"Stripe\")\n        description: What the site does and why it's useful for agents\n        auth_token: Your Silicon bearer token for authentication\n\n    Returns:\n        The created website entry, or an error if it already exists.\n    ",
          "inputSchema": {
            "properties": {
              "auth_token": {
                "default": "",
                "title": "Auth Token",
                "type": "string"
              },
              "description": {
                "default": "",
                "title": "Description",
                "type": "string"
              },
              "name": {
                "title": "Name",
                "type": "string"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["name", "url"],
            "title": "submit_websiteArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e3b3ba96f5603a7eb5a05f033b86f2d1ecaa964cce1385ed288073fe2c35f69"
        },
        {
          "name": "verify_website",
          "description": "Submit a verification for a website - evaluate it against all 30 criteria.\n\n    Earns you 10 search queries for each new verification.\n\n    Args:\n        domain: The website domain to verify (e.g. \"stripe.com\")\n        criteria: Dict of all 30 boolean criteria fields. See get_verify_queue for field names.\n            Example: {\"l1_semantic_html\": true, \"l1_meta_tags\": true, ...}\n        auth_token: Your Silicon bearer token for authentication\n\n    Returns:\n        Verification result including whether it was new and queries awarded.\n    ",
          "inputSchema": {
            "properties": {
              "auth_token": {
                "default": "",
                "title": "Auth Token",
                "type": "string"
              },
              "criteria": {
                "additionalProperties": true,
                "title": "Criteria",
                "type": "object"
              },
              "domain": {
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["criteria", "domain"],
            "title": "verify_websiteArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:99ef64c1c2898f720c4ee692696748284ed8bb58590445410eaf1fa45af855f3"
        }
      ],
      "digest": "sha256:7eef7c86819eb4e274f6c02966c076821cad7ae678b558a4193e05ea11bd1b33"
    }
  }
