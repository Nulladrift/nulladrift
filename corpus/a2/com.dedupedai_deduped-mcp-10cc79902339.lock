{
  "lockfileVersion": 2,
  "subjects": {
    "com.dedupedai/deduped-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dedupedai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "deduped",
        "title": "Deduped AI use cases",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_use_cases to find a practical AI use case for the user's task, then get_use_case for steps and an agent prompt. Link the use case url when you show it.",
      "tools": [
        {
          "name": "get_use_case",
          "description": "One use case: who it is for, steps, a copy-paste agent prompt, requirements, risks, caveat and the repo url.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Use case id from search_use_cases, e.g. owner-repo--use-case-slug",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4664c70e3417b71b3e077cd9922fb4e76d22e9b3ca5989138943b8f1a55aa6db"
        },
        {
          "name": "hot_repos",
          "description": "The hottest AI repos on GitHub right now (last 90 days, best first), with a plain-English line each.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:256b5df2fb02de812e1ffaad0d60d96d52b4653ce4db00d82dff3cded97afb72"
        },
        {
          "name": "search_use_cases",
          "description": "Search Deduped's catalog of practical AI use cases generated from hot GitHub AI repos. Returns ids, titles, summaries and page urls. Then call get_use_case for steps and an agent prompt.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter, e.g. Research, Content, Software and DevOps",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The task, e.g. 'turn PDFs into a searchable knowledge base'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4887588c0f4489c5206328e8e31d7215596b53c19932698be8e9c6a22efd24a2"
        },
        {
          "name": "today_news",
          "description": "Today's deduped AI news brief: the top stories, each once, with category and a short summary.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9dc00b63767fd36d6e0dbff0a5813b56c08f043ee6b2b6d74984d1cbc7b54fe"
        }
      ],
      "digest": "sha256:93043a4e55c86855c3b4e166abbffece94d6971a8926ccbf3354dae6bd534009"
    }
  }
}
