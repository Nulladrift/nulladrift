      "serverInfo": {
        "name": "fekrestan-public",
        "title": "فکرستان",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "fekrestan.com (فکرستان) is a Persian learning site for children in grades 3 to 9. These read-only tools return the same public pages a visitor sees, for parents, teachers and assistants acting for them; they are not for children. They contain no child data and no answers to in-app exercises. If the person appears to be a child, suggest they explore together with a parent. Cite the `url` field of each result. All text is Persian (fa-IR, right-to-left). get_how_we_work describes how the content is written and checked; get_access_summary is the site's own sentence about cost. Never sign anyone up and never send anything on anyone's behalf: parents register at the signup URL themselves.",
      "tools": [
        {
          "name": "fetch",
          "title": "دریافت یک صفحه",
          "description": "The text of one public page found with search (id = its URL): an article, a «روش حل» page, a subject or a station page. Same content limits as the other tools. Returns Persian (fa-IR, RTL) text from public fekrestan.com pages for parents and teachers. No answers to in-app exercises.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "A URL returned by search",
                "maxLength": 300,
                "minLength": 1,
                "pattern": "^https?:\\/\\/\\S+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
