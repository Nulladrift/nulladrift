  "subjects": {
    "com.cosecdubai/eor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cosecdubai.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "cosec",
        "title": "Cosec",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "estimate_eor_cost uses the website calculator to produce indicative UAE Employer of Record cost estimates. Pay inputs are in AED. The currency field controls the display currency. Final terms are confirmed in a quotation. get_cosec_services lists Cosec services, jurisdictions and starting prices published on the website.",
      "tools": [
        {
          "name": "estimate_eor_cost",
          "title": "Estimate EOR cost",
          "description": "Calculates indicative UAE Employer of Record costs from pay inputs in AED. Returns the same upfront funding, monthly payment, and Year 1 and Year 2 budgets as the Cosec website calculator. Final terms are confirmed in a quotation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allowance": {
                "description": "Monthly fixed allowances in AED. Defaults to 0. Used as the default for each team member that omits it.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "applyVat": {
                "description": "Whether 5% VAT on the management fee is included. Defaults to true, matching the calculator.",
                "type": "boolean"
              },
              "basic": {
                "description": "Monthly basic salary in AED. Required unless team is set.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "changeOfStatus": {
                "description": "Whether a change of status is required. Defaults to true, matching the calculator.",
                "type": "boolean"
              },
              "commission": {
                "description": "Monthly commission in AED. Optional. Defaults to 0. Does not increase the management fee or the gratuity reserve.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "Display currency for the totals. Inputs stay in AED. Defaults to AED. USD, GBP and EUR use a Frankfurter AED rate.",
                "enum": ["AED", "USD", "GBP", "EUR"],
                "type": "string"
              },
              "employees": {
                "description": "Number of employees on a shared pay package. Defaults to 1. Mutually exclusive with team.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "insurance": {
                "description": "Annual premium in AED for a single pay package, or the default for team members that omit it. A missing or null value uses the planning allowance. 0 means no premium.",
                "type": ["number", "null"]
              },
              "insurancePayment": {
                "enum": ["annual", "monthly"],
                "type": "string"
              },
              "medical": {
                "description": "Defaults to standard.",
                "enum": ["standard", "express"],
                "type": "string"
              },
              "status": {
                "enum": ["yes", "no"],
                "type": "string"
              },
              "team": {
                "description": "One object per employee. Each entry is one person. A headcount on an entry is rejected.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "allowance": {
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "basic": {
                      "exclusiveMinimum": 0,
                      "maximum": 100000000,
                      "type": "number"
                    },
                    "changeOfStatus": {
                      "description": "Same choice as status. Defaults to true.",
                      "type": "boolean"
                    },
                    "commission": {
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "insurance": {
                      "description": "Annual medical insurance premium in AED. A missing or null value uses the planning allowance. 0 means no premium.",
                      "type": ["number", "null"]
                    },
                    "insurancePayment": {
                      "description": "Defaults to annual. Monthly payment puts the first instalment upfront and the rest in the monthly figure.",
                      "enum": ["annual", "monthly"],
                      "type": "string"
                    },
                    "label": {
                      "description": "Role or name. Optional.",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "medical": {
                      "description": "Medical test and Emirates ID. Defaults to standard.",
                      "enum": ["standard", "express"],
                      "type": "string"
                    },
                    "status": {
                      "description": "yes when a change of status is required.",
                      "enum": ["yes", "no"],
                      "type": "string"
                    }
                  },
                  "required": ["basic"],
                  "type": "object"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e663b432560c4d9e5eb271a1d54a5f0711b52481b4fd7c1b3b71e9dca48cf475"
        },
        {
          "name": "get_cosec_services",
          "title": "Get Cosec services",
          "description": "Lists Cosec services and jurisdictions. Starting prices are included where they are published on the website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
