        {
          "name": "create_webhook",
          "title": "Create Webhook",
          "description": "Have wx93 POST link events to an https URL (Automation plan): link.created when a link is made, link.clicked on every human click. Deliveries are signed CloudEvents (Standard Webhooks headers, plus x-wx93-signature). Returns the signing secret once. events: link.created, link.clicked, link.* or *; omit for all.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "type": "string"
              },
              "events": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "https URL that receives the POSTs.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
