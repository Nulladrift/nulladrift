      },
      "instructions": "Shorten URLs with shorten_url (or bulk_shorten). Make styled, trackable QR codes with create_qr_code and read their scans with qr_code_stats. Without credentials links are free and open through a short ad page for people; set WX93_API_KEY or run `wx93 login` for Pro/Automation links, stats and aliases.",
      "tools": [
        {
          "name": "bulk_shorten",
          "title": "Bulk Shorten URLs",
          "description": "Shorten up to 1,000 URLs in one call (Automation plan). Returns one result per input, in order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "links": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alias": {
                      "description": "Custom short code (Pro and up), 3-64 of A-Z a-z 0-9 - _.",
                      "type": "string"
                    },
                    "domain": {
                      "description": "Which host the short link uses: wx93.me (default), or a verified custom domain of yours (Automation).",
                      "type": "string"
                    },
                    "expires_in": {
                      "description": "Lifetime like 90m, 12h, 7d, 2w, 1y. Omit for never.",
                      "type": "string"
                    },
                    "redirect_type": {
                      "description": "Pro and up. Default 302.",
                      "enum": [301, 302, 307, 308],
                      "type": "integer"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The long http(s) URL to shorten.",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              }
            },
            "required": ["links"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:60e6034035d1c0c27b9540a7c9d630f89c7d3f3030c87d00fa3b4b1d0d3ad463"
        },
        {
          "name": "create_invite",
          "title": "Create Invite",
          "description": "Make one invite link (single use, 30 days). A new account that signs up through it gets a week of Pro, and so does the inviter. The link is shown once.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "note": {
                "description": "Who it is for; only the inviter sees it.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
