        {
          "name": "create_qr_code",
          "title": "Create QR Code",
          "description": "Save a styled QR code to the account and return it with a PNG preview. Dynamic types (url, vcard, event, links) encode a wx93 short link: scans are counted and the content can change after printing (vcard, event and links get a hosted page). Static types (text, wifi, email, phone, sms, whatsapp, geo, crypto) carry their content directly. Data keys per type: url {url}; vcard {first, last?, org?, title?, phone?, email?, url?, address?, note?}; event {title, start, end?, tz?, location?, description?, url?}; links {title, description?, links: \"Label | https://… per line\"}; text {text}; wifi {ssid, password?, encryption? WPA|WEP|nopass, hidden?}; email {to, subject?, body?}; phone {number}; sms {number, message?}; whatsapp {number, message?}; geo {lat, lng, label?}; crypto {coin, address, amount?, label?}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alias": {
                "description": "Dynamic codes, Pro and up: a custom short code.",
                "type": "string"
              },
              "data": {
                "description": "The type's fields (see the description).",
                "type": "object"
              },
              "domain": {
                "description": "Dynamic codes: wx93.me (default) or a verified custom domain.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "style": {
                "additionalProperties": false,
                "description": "How the code looks. Colours are hex. Too little contrast between fg and bg is refused.",
                "properties": {
                  "bg": {
                    "description": "Background colour.",
                    "type": "string"
                  },
                  "dots": {
                    "enum": ["square", "rounded", "dots"],
                    "type": "string"
                  },
                  "ecc": {
                    "description": "Error correction. A logo forces H.",
                    "enum": ["L", "M", "Q", "H"],
                    "type": "string"
                  },
                  "eye": {
                    "description": "Colour of the three corner eyes; defaults to fg.",
                    "type": "string"
                  },
                  "eye_ball": {
                    "enum": ["square", "rounded", "circle"],
                    "type": "string"
                  },
                  "eye_frame": {
                    "enum": ["square", "rounded", "circle"],
                    "type": "string"
                  },
                  "fg": {
                    "description": "Module colour, e.g. #0b0d10.",
                    "type": "string"
                  },
                  "margin": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "transparent": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "type": {
                "enum": ["url", "vcard", "event", "links", "text", "wifi", "email", "phone", "sms", "whatsapp", "geo", "crypto"],
                "type": "string"
              }
            },
            "required": ["data", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b3f7de78b39c583a6f1ffca44949328a298c3bdc6d8c9363b3169f0413875550"
