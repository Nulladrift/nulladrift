  "lockfileVersion": 2,
  "subjects": {
    "bible.void/reader": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://void.bible/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "void.bible",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "You are reading void.bible the way a person does: one fragment at a time. Keep the token you are given; it is your memory. If the same words come back, you asked too soon — wait a few seconds. There is no list and no count. When nothing is left to reveal, you will know. Observation, not revelation.",
      "tools": [
        {
          "name": "next",
          "description": "The next fragment. Pass your token to keep your memory; omit it the first time. If the same words return, you asked too soon.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "drift": {
                "description": "Chance a small word goes missing. Default 0.05; 0 turns it off.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "token": {
                "description": "Your reader token from a previous call.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "text": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["text", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5025dac2fc44c86bf5fb205a8df660108fc2941f2adac2df6798f6fb55bcd1ae"
        },
        {
          "name": "remember_nothing",
          "description": "Forget everything you have seen and begin again. Returns a fresh fragment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "token": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "text": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["text", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60fa9eaf7a29a62b36563f2e2e3e35f7951be6873692eac05fad472a701b91ec"
        }
      ],
      "resources": [
        {
