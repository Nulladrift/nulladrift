        {
          "name": "create_blueprint",
          "description": "Create a Blueprint - the governance contract validation runs against.\n\n    A Blueprint defines what correct means for your data: fields, the math\n    that must hold between them, and acceptable ranges. Start from\n    load_rule_pack or discover_patterns if you have no rules yet; invoke\n    the blueprint_guide prompt for the full rule/constraint reference.\n    Returns the new Blueprint's API key.\n    ",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "GeodesicAI API key (gai_...)",
                "title": "Api Key",
                "type": "string"
              },
              "customer_name": {
                "description": "Organization or project name (also used for storage folder naming)",
                "title": "Customer Name",
                "type": "string"
              },
              "derivation_rules": {
                "default": null,
                "description": "Math rules as objects. Types: add, subtract, multiply, divide, round, copy, sum (multi-operand), items_multiply, items_sum. Each needs 'type' plus its fields; see the blueprint_guide prompt",
                "items": {},
                "title": "Derivation Rules",
                "type": "array"
              },
              "derived_fields": {
                "default": null,
                "description": "Field names the platform computes from other fields, e.g. ['subtotal','total']",
                "items": {},
                "title": "Derived Fields",
                "type": "array"
              },
              "enable_anomaly_detection": {
                "default": false,
                "description": "Flag records that break no rules but do not fit the reference pattern",
                "title": "Enable Anomaly Detection",
                "type": "boolean"
              },
              "enable_drift_tracking": {
                "default": false,
                "description": "Track pattern stability across batches",
                "title": "Enable Drift Tracking",
                "type": "boolean"
              },
              "extracted_fields": {
                "default": null,
                "description": "Field names the agent extracts from source data, e.g. ['vendor','qty','unit_cost']",
                "items": {},
                "title": "Extracted Fields",
                "type": "array"
              },
              "formal_constraints": {
                "default": null,
                "description": "Constraint objects. Types incl. magnitude_anchor {field,min,max}, relative_anchor {field,reference_field,ratio_min,ratio_max}, max_action_threshold {field,threshold,on_violation}, required_fields {fields}, equals, range, in_set, regex_match, items_magnitude_anchor; see the blueprint_guide prompt",
                "items": {},
                "title": "Formal Constraints",
                "type": "array"
