      "instructions": "GeodesicAI is pre-execution governance for AI agents. Other tools do something; GeodesicAI decides whether it should happen — with deterministic, replayable verdicts, never a guess.\n\nGOVERNANCE (the core) — Validate agent outputs and authorize actions against Blueprint rules BEFORE they execute. Catches math errors, field inconsistencies, policy-limit breaches, and constraint violations. Every check returns PASS, FAIL, or REVIEW with plain-language reasons, repair suggestions, a tamper-evident determinism hash, and a proof certificate you can re-verify independently. Same input, same rules, same verdict — every time. Use authorize_execution for a go/no-go before real-world actions (payments, emails, filings, API writes); use validate for document and output checking. Requires a Blueprint (your governance contract): load_rule_pack for ready-made templates, create_blueprint for custom rules.\n\nDISCOVERY — Learn candidate rules and spot unusual records from batches of your own data, deterministically. Detect records that break no rules but don't fit the established pattern; track drift in a data stream over time. No Blueprint required. Discovered rules can be promoted into Blueprints.\n\nPROOF — verify_certificate re-computes every attested rule from the record's own numbers; verify_replay re-checks an execution's bound commitments (record, rules, reference context, result) so a re-run can be compared against them. It proves the bound decision was made by the rules under that context; it is not a claim of byte-identical replay across changed references or time-dependent rules. Trust nothing, recheck everything.\n\nNo machine learning. No probabilistic inference in the validation pipeline. Every verdict is reproducible and fully traceable.\n\nDOCUMENTATION — For the full user guide covering all tools, Blueprint design, Trajectory mode, and demo walkthroughs, read the 'user_guide' resource (geodesicai://docs/user-guide), or fetch https://app.geodesiclabs.ai/static/GeodesicAI_User_Guide.pdf. For Blueprint design specifics, invoke the 'blueprint_guide' prompt. To turn a validation result into plain English using your own LLM, invoke the 'explain_result' prompt.\n\nSign up at geodesiclabs.ai for an API key.",
