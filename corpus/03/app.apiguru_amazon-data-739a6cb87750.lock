              "seller_ids": {
                "description": "Comma-separated seller IDs, maximum 10. Each must be an Amazon seller id -- 'A' followed by 9-20 letters and digits, e.g. A294P4X9EWVXLJ -- or the whole call 400s.",
                "pattern": "^[Aa][A-Za-z0-9]{9,20}(,[Aa][A-Za-z0-9]{9,20})*$",
                "title": "Seller Ids",
                "type": "string"
