        {
          "name": "watch_product",
          "title": "Watch a product's price or stock (user's account; billed per check)",
          "description": "Watch an Amazon product for the user: Apiguru checks it on a schedule\n        and tells them when the price or stock changes. Needs the user's\n        Apiguru account (sign-in or API key); ask the user first, because the\n        checks spend their money on a schedule.\n\n        Cost: creating the watch is free. Each check is billed to the account\n        like the matching data call: price or availability 1 request, stock\n        (stock_below) 2, stock of every seller (stock_scope=\"all\") about one\n        per seller plus one per ten sellers. Automatic checks stop for the day\n        at the account's daily limit ($1 unless the user changes it).\n        Example: one stock watch every 6 hours = 8 requests a day.\n\n        asin:             ASIN or Amazon product URL.\n        alert_type:       price_below | price_above (need threshold, in the\n                          marketplace's currency) | price_change | in_stock |\n                          out_of_stock | stock_below (threshold = units).\n        geo:              marketplace, e.g. US, UK, DE, JP (a URL sets it).\n        check_interval_s: 60, 300, 900, 1800, 3600, 10800, 21600 (default,\n                          6 hours), 43200 or 86400 seconds.\n        stock_scope:      stock_below only: winner (buy-box seller) or all.\n\n        When a watch fires the user gets an email, plus a webhook call or a\n        Telegram message if they set one up at https://dash.apiguru.app/tools/alerts.\n        Returns the watch with its id (for delete_watch) and requests_per_check.\n        ",
