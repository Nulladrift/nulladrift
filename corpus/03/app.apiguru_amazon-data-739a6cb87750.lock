        {
          "name": "seller_profile_batch",
          "title": "Seller profiles for up to 10 seller IDs",
          "description": "Use to vet sellers: name, rating and feedback counts as Amazon displays them. Returns the storefront profile for each seller id: business name, rating, feedback counts, address and marketplace presence. Price: $0.0036 per item (max 10). Seller ID validation is all-or-nothing: one malformed id rejects the entire request with 400. Every row in results is an object with `status`: `ok` (the profile), `not_found` (Amazon has no page for that id on this marketplace; billed, like a 404) or `unavailable` (could not be retrieved right now; NOT billed on the keyed path, `retryable: true`). A row is never null. billable_requests_count counts ok + not_found rows; on the pay-per-call rail the per-item quote is settled up front, so retry `unavailable` ids in a separate call rather than expecting a partial refund. On agent.apiguru.app the answer also carries `success` and `_links.self`; `billable_requests_count` is there on your own key only. Amazon itself has no seller profile: the merchant id of an offer sold by Amazon (offers_stock marks those `sold_by_amazon`) answers `not_found`, billed like any other.",
          "inputSchema": {
            "properties": {
              "geo": {
                "default": "US",
                "description": "Marketplace country code.",
                "enum": ["US", "CA", "DE", "MX", "UK", "FR", "IT", "ES", "AU", "BR", "IN", "JP", "NL", "AE", "PL", "SA", "SG", "SE", "TR", "BE", "IE", "ZA", "EG"],
                "title": "Geo",
                "type": "string"
