                ],
                "default": null,
                "description": "Highest star rating to include, 1-5. from_rating=1&to_rating=3 keeps the critical ones among them.",
                "title": "To Rating"
              }
            },
            "required": ["asin"],
            "title": "product_reviewsArguments",
            "type": "object"
