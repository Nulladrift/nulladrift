        {
          "name": "offers_stock",
          "title": "Live offers and inventory for up to 10 ASINs",
          "description": "Use to compare sellers' current offers and see who holds the buy box, and, with check_inventory, how many units a buyer can add to the cart now. The stock number is not a sales estimate. Not for the listing's own details (product_details). Returns the current offer list per ASIN (seller, price, condition, buy-box winner) and, optionally, the actual purchasable stock quantity. The whole offer list comes by default; `page` returns it ten offers at a time. Price: $0.0045 per item (max 10). On an account, a call is billed per page of the offer list it delivers, plus the cart checks of check_inventory. Amazon lists ten offers a page, so an ASIN with up to ten offers is one request and each further page of its list is one more (a listing with 35 offers: 4). `page` (1, 2, ...) returns that page alone for one request per ASIN -- page 1 is the buy-box offer and the first ten of the list -- and each row then carries `page` and `total_pages`. A page past the end is answered like a not-found item: code `page_out_of_range`, billed, with `total_pages` and `offers_total` in the row; `total_pages` on any page says how far to go, so there is no need to ask. Without `page` the whole list comes, up to 10 pages (100 offers and the buy-box offer); a longer list says so in `coverage_note`, and `page=11` onward reaches the rest. `offers_total` is Amazon's own count of the offers under the condition filter, not the number returned; when fewer are returned, `coverage_note` says why (a page that could not be read this time, the 10-page limit, or offers that cannot be added to a cart). A condition filter covers the buy-box offer too: it is in the answer only when its own condition was asked for. offers_count=winner returns only the offer flagged is_buybox_winner (offers_total keeps the full count); it used to scope only the inventory check and return every offer. /scrape is a legacy alias for the same handler. When Amazon will not return the offer list for an ASIN, the result carries source=product_page: the featured (buy-box) offer read from the product page, offers_on_amazon (how many offers Amazon says exist) and a note; other sellers' offers and stock are then not included. With check_inventory, a cart check that cannot read a quantity is retried once on another session; one that still fails says so on the offer, inventory_response {\"error\": \"cart check failed\", \"code\": \"cart_check_failed\", \"retryable\": true}, is not billed, and never reads as a quantity of 0. An offer whose price Amazon shows only in the cart (\"Add to cart to see product details\") has `price` null and `price_hidden` true; it used to read as price 0. Each offer carries `ships_from` (the \"Ships from\" name: Amazon for FBA, else the seller), `delivery_message` (the offer's own delivery promise, e.g. \"FREE delivery Friday, October 16 on orders shipped by Amazon over $35\") and `delivery_message_secondary` (the \"Or fastest delivery ...\" line), null when the offer shows none. `delivery` is the same value as `ships_from`, kept for existing integrations; it never held delivery information. A row for an ASIN that could not be answered carries `error`, `code`, `http_status`, `billed`, `retryable` and `next_step`, like a top-level error: `upstream_unavailable` (not billed, retry that ASIN), `no_offers` (\"No offers found\": the offer list holds no offer that can be bought as is -- customizable listings have none; billed like a 404) or `asin_redirected` (Amazon answers the ASIN with another listing's offers; billed like a 404). On agent.apiguru.app the answer also carries `success` and `_links` (self, and `details_url` per row); `billable_requests_count` is there on your own key only. Each offer carries `merchant_id` and `sold_by_amazon`. Amazon lists its own offers (Amazon.com, Amazon Resale and their local names) without a seller link, so on those rows `seller_id` repeats the seller's name; `merchant_id` is the id to use: the linked seller's id, or for Amazon's own offers the merchant id the product page states (null when it states none). `sold_by_amazon` is true for Amazon's own offers, false for a linked seller and null when the row does not say. Amazon itself has no seller profile to look up.",
          "inputSchema": {
            "properties": {
              "asins": {
