        {
          "name": "product_details_batch",
          "title": "Product detail for up to 20 ASINs in one call",
          "description": "Use to enrich a list of ASINs in one call; compare the ASINs in `results` with the ones you sent. Batch variant of product_details. Accepts a comma-separated ASIN list, deduplicates it, and fetches all of them concurrently. Far cheaper and faster than N single calls. Price: $0.0024 per item (max 20). Billed per ASIN processed, including ones that come back not-found. More than 20 ASINs returns 413. Bullet points and specs are what Amazon shows for the listing; on multi-variant listings they can describe the product family rather than the exact variant. A null field means Amazon did not show it. ASINs Amazon has no record for on that marketplace are listed in not_returned (billed, like a not-found product_details call; retrying will not help). The batch record comes from Amazon's app, not the product page: price, rating, availability, images, bullets and variants, but no best-seller ranks, no best-seller badge, no category path and no merchant (seller) id (`is_best_seller` is false here whatever the product, because the source carries no badge, and is left out of the compact row). For those call product_details per ASIN. On an API key both cost one request per ASIN, so the batch saves calls and time, not money; keyless (x402) it is also cheaper per item. Compact rows carry brand, weight {raw, unit, value} and dimension {length, width, height, unit, raw} in product_details' shape, read from the row's product_attributes (package dimensions first); outside amazon.com Amazon's app prints centimetres under an inches label, so there dimension.unit is cm while raw keeps Amazon's text. Prices are decimal strings as each source prints them (\"179.0\" here, \"179.00\" on product_details): compare them as numbers.",
          "inputSchema": {
            "properties": {
              "asins": {
                "description": "Comma-separated ASIN list, maximum 20 after de-duplication. Each must be 10 uppercase alphanumeric characters. An Amazon product URL (…/dp/ASIN) works too, in place of an ASIN; lower case is fine. A URL's domain sets the marketplace unless geo says otherwise.",
                "title": "Asins",
                "type": "string"
              },
              "compact": {
                "default": true,
                "description": "Return the compact record (about 2-7 KB a row: title, brand, price, availability, rating summary, bullets, weight, dimension, variation_summary). false returns the full app record (15-150 KB a row: the product_attributes and product_details spec tables, images, the variation maps).",
                "title": "Compact",
                "type": "boolean"
              },
              "fields": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Comma-separated top-level fields to return instead of the compact set, e.g. \"weight,dimension,brand\" or \"product_attributes\" (the whole spec table). Any response lists what it left out under _omitted_fields.",
                "title": "Fields"
              },
              "geo": {
                "default": "US",
                "description": "Marketplace country code.",
                "enum": ["US", "CA", "DE", "MX", "UK", "FR", "IT", "ES", "AU", "BR", "IN", "JP", "NL", "AE", "PL", "SA", "SG", "SE", "TR", "BE", "IE", "ZA", "EG"],
                "title": "Geo",
                "type": "string"
              }
            },
            "required": ["asins"],
            "title": "product_details_batchArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "amazon_request_count": {
                "default": null,
                "title": "Amazon Request Count"
              },
              "billable_requests_count": {
                "default": null,
                "title": "Billable Requests Count"
              },
              "country_code": {
                "default": null,
                "title": "Country Code"
              },
              "request_id": {
                "default": null,
                "title": "Request Id"
              },
              "response_time": {
                "default": null,
                "title": "Response Time"
              },
              "results": {
                "default": null,
                "title": "Results"
              }
            },
            "title": "product_details_batch_output",
            "type": "object"
          },
          "annotations": {
