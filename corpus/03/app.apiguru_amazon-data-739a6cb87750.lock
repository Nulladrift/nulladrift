      "instructions": "Apiguru returns live, structured Amazon marketplace data across 23 country\nmarketplaces. Data is fetched at request time, not served from a cache.\n\nChoosing a tool:\n- One ASIN, full record            -> product_details\n- Many ASINs (up to 20)            -> product_details_batch (no ranks,\n                                      category path or merchant id)\n- Reviews and rating breakdown     -> product_reviews\n- Keyword discovery                -> search\n- Offers, buy box, live stock      -> offers_stock\n- Category rankings                -> best_sellers\n- Discounted items                 -> deals\n- Seller storefront / reputation   -> seller_products, seller_reviews,\n                                      seller_profile_batch\n- Prices, marketplaces, access mode -> list_capabilities (free, makes no\n                                      network request)\n- Watch price or stock over time   -> watch_product, list_watches,\n  (the user's account; ask first)     delete_watch\n\nRules that will save you money and failed calls:\n- Pass an ASIN (10 characters) or an Amazon product URL; lower case is\n  fine. A URL's domain sets the marketplace unless `geo` says otherwise;\n  what was rewritten is listed under `_input_interpreted`.\n- Every error is a JSON document with http_status, billed, retryable and\n  next_step. Retry only when retryable is true. A 404 IS billed; a 503 is\n  not.\n- Prefer the batch tools over looping single-item tools: fewer calls,\n  and cheaper per item without an account.\n- When the free calls run out, a tool returns an x402 PaymentRequired\n  result (`x402Version`, `accepts`). An x402-capable MCP client pays it and\n  resends the same call with the payment in `_meta[\"x402/payment\"]`.\n  Without a wallet, ask the user to connect\n  https://mcp.apiguru.app/account and sign in, then repeat the same call.\n- Identical calls within a few minutes are answered from a short cache\n  (`_cache` marks such answers) and cost nothing extra.\n\nKeeping answers small:\n- product_details and product_details_batch return a COMPACT record by\n  default and list what they left out under `_omitted_fields`. Ask for\n  more with fields= or compact=false; the full record is ~75 KB.\n- Variants come as `variation_summary`. The ASIN-keyed maps (`variation`,\n  `product_variations`) can be 50-130 KB on big families; ask for one by\n  name only when you must resolve a value to a sibling ASIN.\n- search, best_sellers, deals, seller_products and seller_reviews return\n  the first 10 rows as LIGHT records by default. Raise `limit` (0 = the\n  whole page), set `compact=false`, or name what you want with\n  `fields=\"asin,product_title,product_price\"`. `_truncated` gives the real\n  row count.\n- Filtering beats paging. Each tool's description lists its filters, and\n  every list answer says which took effect (`filters_applied`), which the\n  marketplace could not apply (`filters_ignored`) and what it offers\n  (`available_filters`).\n\nAmazon's own data will mislead you if you assume otherwise:\n- Rating counts are per listing family, not per ASIN: variants share one\n  review pool. Never read a count as \"this variant has that many reviews\".\n- A search row's title can be the parent's. When the exact variant\n  matters, call product_details on that ASIN.\n- `badges` is the source of truth for Amazon's Choice / Best Seller /\n  Overall Pick.\n- Bullet points and specs can describe the product family rather than the\n  exact variant. A null field means Amazon did not show that field.\n\nFound something wrong? Open an issue at\nhttps://github.com/apiguru-app/agent-kit/issues, or call the free\n`send_feedback` tool. Neither is billed.\n",
      "tools": [
        {
          "name": "best_sellers",
          "title": "Best-seller rankings for a category",
          "description": "Use for what sells best in a department right now. The rank is Amazon's, not a sales figure. Best-seller rankings for a department of one marketplace, 50 per page. Every answer carries the department it resolved to and how (category_resolution: by slug, name or a fragment of a name, with a hint when a fragment such as 'shoes' landed on the whole 'Clothing, Shoes & Jewelry' department, or 'subcategory' when a word such as 'camera' named a subcategory), available_categories (that marketplace's departments with slugs; MCP: with compact=false) and available_subcategories (the children of the node shown, with the ids subcategory_code takes). On amazon.com subcategory_code also takes any browse node id at any depth, or a name resolved under the department (\"women's shoes\", \"mules & clogs\"); category.subcategory_path gives the node's full path and category.heading the page's own title line. Price: $0.003 per call. No required parameters - calling it bare returns US appliances page 1. `category` accepts a slug, a display name, one of the older US department names, or a unique fragment; category_resolution.via says which, and a fragment match adds a hint naming the subcategories that carry the word, with ids. On amazon.com the whole browse tree is known: subcategory_code takes any node id or a name at any depth, subcategory_name and subcategory_path are filled without a fetch, and available_subcategories lists the node's real children (empty on a leaf). Other marketplaces name only what their navigation showed. page is capped at 5 (a 400 beyond, not a 500). `rank` is the position within the requested list on this page. Rows are the same for every marketplace; only the department vocabulary differs, and the answer carries it.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "appliances",
                "description": "Best-seller department, by slug or by name as Amazon shows it for that marketplace (case-insensitive; a unique fragment works, and the answer's category_resolution says when a fragment was used -- 'shoes' is the whole 'Clothing, Shoes & Jewelry' department, and the hint then lists the Shoes subcategories with their ids). Departments and their slugs differ per marketplace: amazon.com has electronics, amazon.de has ce-de (Electronics & Photo). A word that names a subcategory works too: category=camera on amazon.es is Electronics > Camera & Photo (category_resolution.via says 'subcategory'; several equally good matches are a free 400 listing each as category + subcategory_code). REST answers list the marketplace's departments under available_categories (the MCP tool with compact=false); an unknown name is a free 400 listing them.",
                "title": "Category",
                "type": "string"
              },
              "compact": {
                "default": true,
                "description": "Return light rows: identity, price, rating, badges and one delivery_date, dropping the long delivery prose that repeats itself across three fields. false returns every field the REST API sends (roughly 3x the size).",
                "title": "Compact",
                "type": "boolean"
              },
              "fields": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Comma-separated row fields to return instead of the light set, e.g. \"asin,product_title,product_price\". Rows list what they left out under _omitted_fields.",
                "title": "Fields"
              },
              "geo": {
                "default": "US",
                "description": "Marketplace country code.",
                "enum": ["US", "CA", "DE", "MX", "UK", "FR", "IT", "ES", "AU", "BR", "IN", "JP", "NL", "AE", "PL", "SA", "SG", "SE", "TR", "BE", "IE", "ZA", "EG"],
                "title": "Geo",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many ranked products to return from this page (0 = all of them). A full page is 50 rows, which most clients spill to a file instead of showing inline. The answer carries _truncated with the true count when it trims.",
                "minimum": 0,
                "title": "Limit",
                "type": "integer"
              },
              "page": {
