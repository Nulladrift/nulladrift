                "description": "Comma-separated condition filter: ALL, NEW, USED_LIKE_NEW, USED_VERY_GOOD, USED_GOOD, USED_ACCEPTABLE (case-insensitive). Omit for every offer. The filter covers the buy-box offer too: it is in the answer only when its own condition is among those asked for. An unknown value is a free 400 listing the allowed ones; it used to be silently treated as ALL.",
