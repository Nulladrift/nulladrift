        },
        {
          "name": "product_reviews",
          "title": "Customer reviews for a single ASIN",
          "description": "Use for what customers say about one product. Not for its full review history (Amazon serves full and star-filtered review lists only to signed-in accounts) or for seller feedback (seller_reviews). Returns the overall rating, rating count, review_histogram (percent of all ratings per star), Amazon's 'customers say' AI summary where that marketplace shows one, and the reviews on the product page (typically up to 8 from this marketplace and 5 from other countries; none on amazon.com at present, where Amazon shows review text only to signed-in visitors), each with rating, review_date, review_country, from_this_marketplace, verified flag and helpful_votes; from_rating/to_rating keep a star window. Price: $0.003 per call. Same 404-billed / 503-not-billed semantics as product_details. No paging or sort: the reviews are those on the product page; review_coverage says how many and from where. from_rating/to_rating filter them. review_histogram (here and on product_details) gives the share of every rating. customers_say is null where Amazon shows no summary (several marketplaces never do); customers_say_note then says so. Where Amazon shows review text on the product page only to signed-in visitors (amazon.com at present), `product_reviews` is empty and `review_coverage.note` says so; the rating, rating count, review_histogram and customers_say are returned as usual.",
          "inputSchema": {
            "properties": {
              "asin": {
                "description": "Single Amazon ASIN, 10 uppercase alphanumeric characters. An Amazon product URL (…/dp/ASIN) works too, in place of an ASIN; lower case is fine. A URL's domain sets the marketplace unless geo says otherwise.",
                "pattern": "^\\s*(?:[A-Za-z0-9]{10}|https?://\\S+)\\s*$",
                "title": "Asin",
                "type": "string"
              },
              "from_rating": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Lowest star rating to include, 1-5. Filters the reviews the product page shows (see review_coverage).",
                "title": "From Rating"
              },
              "geo": {
                "default": "US",
                "description": "Marketplace country code.",
                "enum": ["US", "CA", "DE", "MX", "UK", "FR", "IT", "ES", "AU", "BR", "IN", "JP", "NL", "AE", "PL", "SA", "SG", "SE", "TR", "BE", "IE", "ZA", "EG"],
                "title": "Geo",
                "type": "string"
              },
              "max_reviews": {
                "default": 10,
                "description": "Cap on individual reviews returned (0 = all). The rating summary, review_histogram and customers_say are always returned; _reviews_total is the number of reviews on the product page (not all reviews; see review_coverage).",
                "minimum": 0,
                "title": "Max Reviews",
                "type": "integer"
              },
              "to_rating": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
