{
  "lockfileVersion": 2,
  "subjects": {
    "com.dabugs/shop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dabugs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dabugs-shop",
        "title": "DABUGS Shop",
        "version": "1.0.0",
        "websiteUrl": "https://dabugs.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DABUGS (dabugs.com) is a Vietnamese Y2K women's fashion brand. Prices are in VND, shipping is Vietnam-only and free (standard). To buy for the user: 1) search_products / get_product to pick SKU (color + size) — check the size chart; 2) prepare_checkout with items, customer name + Vietnamese mobile phone, shipping address (street, ward, province) and payment_method (cod | bank | vnpay); 3) show the returned summary (items, size, color, total, payment, address) to the user and get explicit confirmation; 4) place_order with the quote_token and user_confirmed=true. For bank/vnpay give the user the QR or payment link. Free gifts / voucher codes / express delivery: see giftOffer, voucher_codes, shipping_method in prepare_checkout. Never invent SKUs, prices or policies; never place an order without the user's confirmation. If the user prefers to finish in their browser, use create_cart_link and give them the link.",
      "tools": [
        {
          "name": "create_cart_link",
          "title": "Create cart link",
          "description": "Build a dabugs.com link that fills the user's cart with these SKUs and opens checkout, so the user can finish the purchase in their own browser (works on phones).",
          "inputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "qty": {
                      "default": 1,
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Variant SKU",
                      "type": "string"
                    }
                  },
                  "required": ["sku"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0677caa635f65ba8ead54aad6513a7b6cfda72bc90c5abbe1c1946249f3576a"
        },
        {
          "name": "find_address",
          "title": "Find province / ward",
          "description": "Look up official Vietnamese province and ward/commune names (2-level system since 07/2025, same list the courier uses). Without province: list the 34 provinces. With province (+ optional query): list/search its wards. Use it when prepare_checkout returns unknown_province / unknown_ward.",
          "inputSchema": {
            "properties": {
              "province": {
                "description": "Province name, e.g. Hồ Chí Minh",
                "type": "string"
              },
              "query": {
                "description": "Part of the ward name, e.g. 'Tân Sơn'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2bcb98937df84c1e9af76979eff50f79c9fb16fa7d902df279c37d98fb23ca59"
        },
        {
          "name": "get_order_status",
          "title": "Order status",
          "description": "Status, payment state and tracking number of an order. Requires the order id and the recipient phone number used for the order.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "description": "e.g. DBMXXXXXXX",
                "type": "string"
              },
              "phone": {
                "description": "Recipient phone used for the order",
                "type": "string"
              }
            },
            "required": ["order_id", "phone"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3c6c98dd964ed8286c6f94954b6c13772ebd8b5ffa6d21d5932584b12b15fb2"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Full details of one product: every variant (sku, color, size, price, finalPrice, inStock), images, description and size chart (cm).",
          "inputSchema": {
            "properties": {
              "handle": {
                "description": "Product handle/code from search_products, e.g. QS-005",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c41290f8689dc35733587e4739994ec891e28d70bfbc770303022136457df8cb"
        },
        {
          "name": "get_store_policies",
          "title": "Store policies",
          "description": "Shipping, returns/exchange, payment methods, contact information and the promotions running right now (bundle sets, buy-more discounts, free gift thresholds).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9fdff1c20712192e8bb585591261770b6f9203b6938697a19b113f7862c071e"
        },
        {
          "name": "place_order",
          "title": "Place order",
          "description": "Create the real order from a quote_token. Call ONLY after the user has seen the prepare_checkout summary and explicitly confirmed. Returns order id + payment instructions (QR / payment link for bank / vnpay).",
          "inputSchema": {
            "properties": {
              "quote_token": {
                "description": "quote_token from prepare_checkout",
                "type": "string"
              },
              "user_confirmed": {
                "description": "Must be true: the user explicitly confirmed this exact order",
                "type": "boolean"
              }
            },
            "required": ["quote_token", "user_confirmed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e57bd2c89d4fe3b7bd37097766922c0d8e7dae2be067ae60f8906be7411803a"
        },
        {
          "name": "prepare_checkout",
          "title": "Prepare checkout (quote)",
          "description": "Validate items, stock, address and compute the exact total (auto vouchers + free shipping). Returns a summary and a quote_token valid 30 minutes. Does NOT create an order.",
          "inputSchema": {
            "properties": {
              "customer": {
                "properties": {
                  "email": {
                    "description": "Optional email",
                    "type": "string"
                  },
                  "name": {
                    "description": "Recipient full name",
                    "type": "string"
                  },
                  "phone": {
                    "description": "Vietnamese mobile number of the recipient, e.g. 0912345678",
                    "type": "string"
                  }
                },
                "required": ["name", "phone"],
                "type": "object"
              },
              "gift_sku": {
                "description": "SKU of the free gift the user picked, when the quote's giftOffer says eligible",
                "type": "string"
              },
              "items": {
                "items": {
                  "description": "One line. Use `sku` (preferred, from get_product) OR `handle` + `color` + `size`.",
                  "properties": {
                    "color": {
                      "description": "Color name as listed by get_product",
                      "type": "string"
                    },
                    "handle": {
                      "description": "Product code/handle, e.g. QS-005",
                      "type": "string"
                    },
                    "qty": {
                      "default": 1,
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "size": {
                      "description": "Size, e.g. XS, S, M, L, XL, XXL",
                      "type": "string"
                    },
                    "sku": {
                      "description": "Variant SKU from get_product, e.g. HOG-M-QS-005 (format: color-size-category-number)",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "note": {
                "description": "Optional note for the shop",
                "type": "string"
              },
              "payment_method": {
                "default": "cod",
                "description": "cod = cash on delivery · bank = bank transfer QR · vnpay = VNPAY payment link",
                "enum": ["cod", "bank", "vnpay"],
                "type": "string"
              },
              "shipping_address": {
                "properties": {
                  "district": {
                    "description": "Optional old district (quận/huyện) if the user gives one — kept in the street line only",
                    "type": "string"
                  },
                  "lat": {
                    "description": "Optional latitude of the delivery point — needed for express (Grab) delivery",
                    "type": "number"
                  },
                  "lng": {
                    "description": "Optional longitude of the delivery point",
                    "type": "number"
                  },
                  "province": {
                    "description": "Province / city, one of the 34 provinces, e.g. Hồ Chí Minh, Hà Nội (old province names are mapped automatically)",
                    "type": "string"
                  },
                  "street": {
                    "description": "House number + street (số nhà, tên đường)",
                    "type": "string"
                  },
                  "ward": {
                    "description": "Ward / commune (phường / xã) — NEW 2-level name (since 07/2025). Unsure? call find_address",
                    "type": "string"
                  }
                },
                "required": ["province", "street", "ward"],
                "type": "object"
              },
              "shipping_method": {
                "default": "standard",
                "description": "standard = free nationwide · express = same-day Grab, TP.HCM only (send lat/lng), fee shown in the quote",
                "enum": ["standard", "express"],
                "type": "string"
              },
              "voucher_codes": {
                "description": "Discount codes the user has (automatic vouchers are applied anyway; invalid codes are reported, not applied)",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["customer", "items", "shipping_address"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bddd5a6b960c17c03abc25603888dc44a782176fe3b8af0aebdbf911914a6f50"
        },
        {
          "name": "search_products",
          "title": "Search DABUGS products",
          "description": "Search the DABUGS catalog (women's tops, skirts, jeans, shorts…). Returns handle, title, category, price/finalPrice in VND, colors, sizes, inStock, url, image.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category name",
                "type": "string"
              },
              "in_stock_only": {
                "default": true,
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords in Vietnamese or English, e.g. 'chân váy jeans', 'pink shorts', 'baby tee'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa5886c2d4268ccbf544ec7dd9cbca5a88105658a0b045a55be3dd5cffbfd843"
        }
      ],
      "digest": "sha256:c4d84012577bc506598b26fb5c69c8fef5280b70f8878817349a30656ca3a73c"
    }
  }
}
