{
  "lockfileVersion": 2,
  "subjects": {
    "com.pactlio/contracts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.pactlio.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pactlio-contracts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_non_compete_enforceability",
          "title": "Check non-compete enforceability by US state",
          "description": "Whether a non-compete agreement is enforceable, limited, or void in a given US state (or DC), with salary thresholds and the key statute. Data covers all 50 states + DC.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "state": {
                "description": "US state name or slug, e.g. \"California\" or \"california\"",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1d1cc514cc732fc92533ff765fc7fff800d1340a15144160fde2cc6483a77de"
        },
        {
          "name": "get_checkout_link",
          "title": "Get checkout link for a drafted contract",
          "description": "Returns the URL where a human can view the preview and pay to unlock the full contract for a draft created with start_contract_draft. Share this link with your user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "preview_id": {
                "description": "The preview_id returned by start_contract_draft",
                "pattern": "^([a-f0-9]{24}|[a-f0-9]{32})$",
                "type": "string"
              }
            },
            "required": ["preview_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97731cd2adaf45e653e0922735360635fa2d4ebec10ca5a9b883c27a2ab79f48"
        },
        {
          "name": "get_draft_status",
          "title": "Get contract draft status / preview",
          "description": "Check a contract draft from start_contract_draft. Returns \"awaiting_human\" until a person opens the preview URL, \"pending\" while generating. When complete, returns the free preview (opening sections), the titles of locked sections, and the URL where a human can pay to unlock the full contract.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "preview_id": {
                "description": "The preview_id returned by start_contract_draft",
                "pattern": "^([a-f0-9]{24}|[a-f0-9]{32})$",
                "type": "string"
              }
            },
            "required": ["preview_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3eb26d6fd20b79f76a17235c2e6fba9db52fdda716327b73fd9f2f0877a2561"
        },
        {
          "name": "get_intake_questions",
          "title": "Get intake questions for a contract type",
          "description": "The questions Pactlio asks to draft a specific contract type — use these to collect the information needed before calling start_contract_draft. Returns fields, types, options, and validation rules.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "contract_type": {
                "description": "Contract type id from list_contract_types, e.g. \"nda_mutual\", \"contractor_agreement\"",
                "maxLength": 60,
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional jurisdiction filter, e.g. \"california\"",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["contract_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54037e7113e4717b6ae908fc42ff0ade532baee760cf4564d0c8aea35c9ecd9b"
        },
        {
          "name": "get_jurisdiction_requirements",
          "title": "Get jurisdiction-specific contract requirements",
          "description": "Statute-cited legal requirements, key differences, common pitfalls, terminology, and FAQs for a contract type in a specific US state or country. Use contract slug (e.g. \"contractor-agreement\") + jurisdiction slug (e.g. \"california\", \"us\", \"uk\", \"eu-gdpr\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "contract_slug": {
                "description": "Contract type slug, e.g. \"non-compete\", \"contractor-agreement\"",
                "maxLength": 60,
                "type": "string"
              },
              "jurisdiction_slug": {
                "description": "Jurisdiction slug, e.g. \"california\", \"texas\", \"us\", \"uk\", \"canada\"",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["contract_slug", "jurisdiction_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:029edead4b4e99dc6c5b26d2c7879594d28447dd4a01eb5d50d00465c3dd7b44"
        },
        {
          "name": "list_contract_types",
          "title": "List contract types",
          "description": "List all contract and legal document types Pactlio can generate, with descriptions, use cases, and USD prices. Start here to find the right contract type slug/id for other tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5efcfae9d31f127fa5b963a84a8fb1ae12a0ff8938ad96385e39b5b6722144e"
        },
        {
          "name": "start_contract_draft",
          "title": "Start drafting a contract (free preview)",
          "description": "Prepare a contract draft with Pactlio's multi-agent AI engine (drafter, critic, compliance checker). Returns a preview_id and a URL. Generation (3-5 minutes) starts only when a human opens that URL in a browser — share it with your user, then poll get_draft_status. Free preview shows the opening sections; the full contract is unlocked by a human via checkout. Provide deal_summary fields collected via get_intake_questions (at minimum: parties, plus the required fields for the contract type). REQUIRES accept_terms: true — first confirm with your user that they accept the Pactlio Terms of Use and understand the output is an AI-generated draft for review, not legal advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accept_terms": {
                "description": "Must be true. Confirms your end user accepts the Pactlio Terms of Use (https://www.pactlio.com/terms) and understands the result is an AI-generated draft for review — not legal advice, and no attorney-client relationship is created.",
                "type": "boolean"
              },
              "contract_type": {
                "description": "Contract type id, e.g. \"nda_mutual\" (see list_contract_types)",
                "maxLength": 60,
                "type": "string"
              },
              "deal_summary": {
                "additionalProperties": {},
                "description": "Answers keyed by field name from get_intake_questions, e.g. {\"parties\":{\"you\":\"Acme Inc\",\"other\":\"Jane Doe\"},\"customFields\":{...}}",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "jurisdiction": {
                "description": "Jurisdiction id, e.g. \"california\", \"us_general\", \"uk_england_wales\"",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["accept_terms", "contract_type", "deal_summary"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22ddb548c2b7e95c2de8e650b78983690ec6a0f5eb965ba731bc8f23665392cc"
        }
      ],
      "digest": "sha256:e7836450299bebf16a5cafcfe330f54ab9026e7f07e764f7e854ae133a1a9857"
    }
  }
}
