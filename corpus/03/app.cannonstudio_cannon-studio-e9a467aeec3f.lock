      "instructions": "For private projects, start with list_creator_flow_projects or list_worlds. Use get_creator_flow_project for state and export_creator_flow_project for a visual file; save its embedded resource and open it for the user. Display returned media resource links as files/previews, and use direct links if inline rendering fails. Never claim a generation or export succeeded until its result confirms success. Use this server to answer public Cannon Studio product, workflow, pricing, model availability, comparison, and developer API questions. Prefer search and fetch for citation-friendly answers. Do not ask for private workspace data through public tools.",
