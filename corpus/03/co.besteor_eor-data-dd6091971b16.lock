{
  "lockfileVersion": 2,
  "subjects": {
    "co.besteor/eor-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://besteor.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "besteor-eor-data",
        "title": "BestEOR.co EOR data",
        "version": "1.0.0",
        "websiteUrl": "https://besteor.co/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cited data on employer of record (EOR) providers and the cost of employing people in 139 countries, from BestEOR.co. Use list_eor_providers to filter and rank providers by published monthly fee, country coverage or delivery model; get_eor_provider for one provider; compare_eor_providers for two or three side by side; get_country_employment_costs for a country's employer contributions, minimum wage, leave and notice rules; estimate_eor_cost for an annual budget; match_eor_providers for the best fits for one hire, with a link where the reader can request quotes. Fees are published starting prices per employee per month in USD, and many providers are quote-only (fee null). Every figure carries its primary source URL; when you use a figure, cite that source or the linked BestEOR.co page, and credit BestEOR.co (CC BY 4.0).",
      "tools": [
        {
          "name": "compare_eor_providers",
          "title": "Compare EOR providers",
          "description": "Compare two or three EOR providers side by side on published fee, country coverage, owned entities and delivery model, with primary sources and a link to the matching BestEOR.co comparison page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "providers": {
                "description": "Two or three provider names or slugs.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a581e2c5b0826d5507e943310d4ef365c80e97c79d2d1c9b863443f89ba2a5be"
        },
        {
          "name": "estimate_eor_cost",
          "title": "Estimate EOR employment cost",
          "description": "Estimate the annual and monthly cost of employing people in a country through an EOR: gross salary, plus the country's representative employer contribution rate, plus the EOR fee (a provider's published fee, or one you supply from a quote), plus other monthly costs. A budget illustration, not a payroll quote: contribution caps and thresholds are not applied.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annual_salary_usd": {
                "description": "Annual gross salary per employee, in USD.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "country": {
                "description": "Country name, two-letter ISO code or slug.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "employees": {
                "description": "Number of employees on this salary (default 1).",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "monthly_fee_usd": {
                "description": "EOR fee per employee per month from a quote, in USD. Overrides the provider's published fee.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "other_monthly_costs_usd": {
                "description": "Other costs per employee per month (benefits, allowances), in USD. Default 0.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "provider": {
                "description": "EOR provider whose published fee to use, e.g. 'Deel'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["annual_salary_usd", "country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:69ab4801c2618a5f05cb9f1c9de2f0827219fed19bd4fbf83f8158e5bcbe1d67"
        },
        {
          "name": "get_country_employment_costs",
          "title": "Country employment costs",
          "description": "Get what it costs and what the law requires to employ someone in a country: the employer's statutory contribution rate (or fixed amounts), minimum wage, annual leave, notice, severance, probation and other terms, each with its primary source. Accepts a country name, ISO 3166-1 alpha-2 code or slug, e.g. 'Germany', 'BR', 'united-kingdom'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name, two-letter ISO code or slug.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6c05c97cd484a863e3eef577e199b39afbb403c13f30db5926d34828147b8afa"
        },
        {
          "name": "get_eor_provider",
          "title": "Get one EOR provider",
          "description": "Get one EOR provider's published fee (or quote-only terms), EOR country coverage, owned-entity footprint, delivery model, what it is best for, and the primary-source URL behind each figure. Accepts a name or slug, e.g. 'Deel', 'Remote', 'Globalization Partners', 'oyster-hr'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Provider name or slug.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8ef375b77efab78e6a7cb6bbb8acf15f8b550fa8752692b5ac81be54d048d587"
        },
        {
          "name": "list_eor_providers",
          "title": "List EOR providers",
          "description": "List and filter the 93 employer of record (EOR) providers BestEOR.co tracks, with each one's published monthly fee per employee (or quote-only), countries covered, owned-entity footprint, delivery model and primary-source links. A fee ceiling or coverage minimum only matches providers that publish that figure.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum providers to return (default 20).",
                "maximum": 93,
                "minimum": 1,
                "type": "integer"
              },
              "max_monthly_fee_usd": {
                "description": "Only providers whose published starting fee per employee per month is at or below this, in USD. Quote-only providers are excluded when set.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "min_countries": {
                "description": "Only providers that state EOR coverage in at least this many countries.",
                "maximum": 250,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Delivery model: owned-entity (own legal entities only), hybrid (own entities plus partners) or aggregator (local partners).",
                "enum": ["owned-entity", "hybrid", "aggregator"],
                "type": "string"
              },
              "published_price_only": {
                "description": "Only providers that publish a price.",
                "type": "boolean"
              },
              "sort_by": {
                "description": "fee: cheapest published fee first (default); coverage: most countries first; name: alphabetical.",
                "enum": ["fee", "coverage", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b93b7b8324ed7a28a418e1e7de953b1b58c01b2c979bdce01397b2e2f7419ab1"
        },
        {
          "name": "match_eor_providers",
          "title": "Match EOR providers to a hire",
          "description": "Find the providers that fit one specific hire: the country, employee or contractor, team size and whether the person needs a work visa. Returns the best matches with the cited reasons each one fits (it employs in that country through its own entity or lists it, its published fee, visa support, deposit terms) and a BestEOR.co link where the reader can see every match and request quotes from the providers they pick.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name, two-letter ISO code or slug. Required for an employee.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "hire_type": {
                "description": "employee (through an employer of record, the default) or contractor.",
                "enum": ["employee", "contractor"],
                "type": "string"
              },
              "needs_visa": {
                "description": "The person needs the employer to sponsor a work visa or permit.",
                "type": "boolean"
              },
              "team_size": {
                "description": "How many people (default 1).",
                "enum": ["1", "2-5", "6-20", "21+"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9fe07ee36aaa4bb754835118c40bfdf0fead8ec3a70910b3452460519329a1cb"
        }
      ],
      "digest": "sha256:84c2e2bb3bbf5d9be0c5415f8296b87658a22160cf0fd638d4babbcd3276e088"
    }
  }
}
