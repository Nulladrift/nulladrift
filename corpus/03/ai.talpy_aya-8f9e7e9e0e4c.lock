{
  "lockfileVersion": 2,
  "subjects": {
    "ai.talpy/aya": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://talpy.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "talpy",
        "title": "Talpy.ai — Aya, AI recruiter",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Talpy.ai — Aya, the AI recruiter that interviews candidates on WhatsApp. To use the tools, send your Talpy API key in Authorization: Bearer sk_... (scope mcp:read; add mcp:write to create jobs and invite candidates). Create the key in the Talpy dashboard under Settings › API and integrations, and enable the AI assistant (MCP) for your company there.",
      "tools": [
        {
          "name": "criar_vaga",
          "title": "Create job",
          "description": "Creates a new job opening in the company's Talpy account and generates the interview profile Aya will use (competencies and weights). By default the job is created as a DRAFT (not public); set publish=true to open it right away. Counts against the plan's open-job limit. Requires an API key with the mcp:write scope. Returns in a few seconds with the job id, its status, the dashboard link and profileStatus: \"generating\" means the full competency profile is still being built in the background (usually under a minute) — call detalhar_vaga later to see it.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Job description (at least 20 characters): responsibilities and requirements. Aya's evaluation criteria are derived from it.",
                "minLength": 20,
                "type": "string"
              },
              "language": {
                "description": "Optional. Language of the job: Aya opens the candidate interview in it. Also used for the text of this response. Defaults to the account's language.",
                "enum": ["pt-BR", "pt-PT", "en", "es", "de", "fr"],
                "type": "string"
              },
              "publish": {
                "description": "Optional. true = publish the job now (status ATIVA, open to applications). Default false = draft (RASCUNHO) for a human to review.",
                "type": "boolean"
              },
              "seniority": {
                "description": "Optional seniority level, e.g. \"Junior\", \"Mid-level\", \"Senior\".",
                "type": "string"
              },
              "title": {
                "description": "Job title, e.g. \"Sales Representative\".",
                "type": "string"
              }
            },
            "required": ["description", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:195d6f1687c2c83d4914c15ad1f6bc181acc92cfb7efbf9064a5a4cc1d45de0c"
        },
        {
          "name": "detalhar_candidato",
          "title": "Candidate evaluation",
          "description": "Full evaluation of one candidate: score per competency, the evidence behind each score, red flags, highlights and the human decision if there is one. Read-only. Does NOT return phone, e-mail or résumé.",
          "inputSchema": {
            "properties": {
              "candidateId": {
                "description": "Candidate id, from listar_candidatos.",
                "type": "string"
              },
              "language": {
                "description": "Optional. Language for the text in this tool's response (labels, notes, messages). Defaults to the account's language.",
                "enum": ["pt-BR", "pt-PT", "en", "es", "de", "fr"],
                "type": "string"
              }
            },
            "required": ["candidateId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Candidate evaluation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fba5985daaf69041f8e858dc595a4746b16d597a0695a9b3ff72616c0957f89"
        },
        {
          "name": "detalhar_vaga",
          "title": "Job details",
          "description": "Shows one job in detail, including the competencies Aya (the AI interviewer) evaluates and the weight of each — the criteria behind every candidate score. Read-only.",
          "inputSchema": {
            "properties": {
              "jobId": {
                "description": "Job id, from listar_vagas.",
                "type": "string"
              },
              "language": {
                "description": "Optional. Language for the text in this tool's response (labels, notes, messages). Defaults to the account's language.",
                "enum": ["pt-BR", "pt-PT", "en", "es", "de", "fr"],
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Job details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c8f98fe5bcb77dd52020fd033197e55254a8f8001af07672f5a8676e28c9763"
        },
        {
          "name": "entrevistar_candidato",
          "title": "Send candidate to Aya's interview",
          "description": "Adds a candidate to a job and immediately invites them to an interview with Aya, the AI recruiter. SIDE EFFECTS: with a phone number it sends a real WhatsApp invite to the candidate; without a phone but with an e-mail it sends a real e-mail with the link to the web interview. Uses one interview from the company's balance when the interview happens. Requires an API key with the mcp:write scope. Only invite people who applied or agreed to be contacted. Returns candidateId, interviewId and the invite channel.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Candidate's e-mail. Used for the invite (web interview link) when there is no phone.",
                "type": "string"
              },
              "jobId": {
                "description": "Job id, from listar_vagas or criar_vaga.",
                "type": "string"
              },
              "language": {
                "description": "Optional. Language for the text in this tool's response (labels, notes, messages). Defaults to the account's language.",
                "enum": ["pt-BR", "pt-PT", "en", "es", "de", "fr"],
                "type": "string"
              },
              "name": {
                "description": "Candidate's full name.",
                "type": "string"
              },
              "phone": {
                "description": "Candidate's WhatsApp number in international format with country code, e.g. +5511912345678. If given, the invite goes by WhatsApp.",
                "type": "string"
              },
              "resumeText": {
                "description": "Optional résumé as plain text. Used to pre-score the candidate against the job profile.",
                "type": "string"
              }
            },
            "required": ["jobId", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send candidate to Aya's interview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66f23b90f232619f59a945ab89b12bd17e7a96158baa07f6b1c7ad0d0ca948b2"
        },
        {
          "name": "listar_candidatos",
          "title": "List candidates",
          "description": "Lists the candidates of a job with their interview score, profile fit and pipeline stage, highest score first. Read-only. Does NOT return phone, e-mail or résumé.",
          "inputSchema": {
            "properties": {
              "jobId": {
                "description": "Job id, from listar_vagas.",
                "type": "string"
              },
              "language": {
                "description": "Optional. Language for the text in this tool's response (labels, notes, messages). Defaults to the account's language.",
                "enum": ["pt-BR", "pt-PT", "en", "es", "de", "fr"],
                "type": "string"
              },
              "minScore": {
                "description": "Only candidates whose interview score is at least this value (0 to 10).",
                "type": "number"
              },
              "stage": {
                "description": "Filter by pipeline stage (NOVO = new, CONVIDADO = invited, EM_ENTREVISTA = interviewing, AVALIADO = evaluated, APROVADO = approved, REJEITADO = rejected). Defaults to all.",
                "enum": ["NOVO", "CONVIDADO", "EM_ENTREVISTA", "AVALIADO", "APROVADO", "REJEITADO", "all"],
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List candidates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf0274a173bddffc8882f00ff6b2eeb0a1e3f9c61e1044465f622fb17510f146"
        },
        {
          "name": "listar_vagas",
          "title": "List jobs",
          "description": "Lists the company's job openings with their status and how many candidates each one has. Read-only. Use it to find a job id before looking at candidates or inviting someone.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional. Language for the text in this tool's response (labels, notes, messages). Defaults to the account's language.",
                "enum": ["pt-BR", "pt-PT", "en", "es", "de", "fr"],
                "type": "string"
              },
              "status": {
                "description": "Filter by job status. ATIVA = open/published, RASCUNHO = draft. Defaults to ATIVA.",
                "enum": ["ATIVA", "RASCUNHO", "EM_APROVACAO", "PAUSADA", "CONCLUIDA", "ENCERRADA", "REJEITADA", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05bd25c32693c4afd3224b29676dddbeea8829278dcc1695639785a4df3e85c9"
        },
        {
          "name": "planos_e_assinatura",
          "title": "Plans and subscription",
          "description": "Shows the company's current plan, this cycle's usage (interviews and open jobs against the limits), the plans available with prices, and the link to subscribe or change plan in the Talpy dashboard. Read-only: it never charges or changes the subscription — payment happens only in the dashboard.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional. Language for the text in this tool's response (labels, notes, messages). Defaults to the account's language.",
                "enum": ["pt-BR", "pt-PT", "en", "es", "de", "fr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plans and subscription"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4023e22ea3a47a25ec765f75376b76e7a85b5d584061d091d44900fff251a7fa"
        },
        {
          "name": "resumo_do_recrutamento",
          "title": "Recruiting summary",
          "description": "Company-wide recruiting numbers: open jobs, candidates, completed interviews, average score and plan usage. Read-only. Contains no personal data.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional. Language for the text in this tool's response (labels, notes, messages). Defaults to the account's language.",
                "enum": ["pt-BR", "pt-PT", "en", "es", "de", "fr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recruiting summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c46db7cad459585eac5a661de7818286a8c06ada4ac0742508887ed94192555a"
        }
      ],
      "digest": "sha256:30620e92e873bbf3dc895571f5cd06644cda0d4dd192053fba168d2fae39ae03"
    }
  }
}
