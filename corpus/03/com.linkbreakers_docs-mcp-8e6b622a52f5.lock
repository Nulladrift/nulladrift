{
  "lockfileVersion": 2,
  "subjects": {
    "com.linkbreakers/docs-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://linkbreakers.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.linkbreakers/docs-mcp",
        "title": "Linkbreakers Docs",
        "version": "1.0.0",
        "description": "Search and read Linkbreakers docs, pricing and QR code templates. Read-only, no auth.",
        "websiteUrl": "https://linkbreakers.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "Read-only access to the public Linkbreakers website: help center articles, guides, pricing and QR code templates. Start with search_docs, then call get_article with a result slug to read the full Markdown. To act on a Linkbreakers workspace (create links, read analytics), use the authenticated product server at https://mcp.linkbreakers.com instead.",
      "tools": [
        {
          "name": "get_article",
          "title": "Read a Linkbreakers article",
          "description": "Return the full Markdown of a Linkbreakers help center article by slug (the last segment of https://linkbreakers.com/help/article/<slug>).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Article slug",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Linkbreakers article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ea41f0ea94212d35b7f8d1fa15da90bf2d202a2b12cb16dc3eaf04b5132a3b0"
        },
        {
          "name": "get_pricing",
          "title": "Get Linkbreakers pricing and features",
          "description": "Return the current Linkbreakers plans with prices in USD per month, plan limits, signup links, how to reach sales for Enterprise, and the features included in every plan with the help article that explains each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "billing_cycle": {
                "description": "Billing cycle to price the plans with. Omit to get both.",
                "enum": ["yearly", "monthly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Linkbreakers pricing and features"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:adc569f97b52faf7fee7a13afc9273ac16e036ab3a4aaee4fa39b4c0224445b7"
        },
        {
          "name": "search_docs",
          "title": "Search Linkbreakers docs",
          "description": "Search the Linkbreakers help center, guides, integrations and product news, the public QR code design templates or the public page theme templates. Returns ranked results with their URL, Markdown URL and a snippet; read a help article in full with get_article.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Restrict help results to one help center category",
                "enum": ["overview", "use-cases", "dashboard", "developer", "legal", "workflow", "guides", "alternatives", "research", "partnerships", "integrations", "news"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Maximum number of results",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural language question or keywords",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "source": {
                "default": "help",
                "description": "help searches help center articles; qr_templates searches public QR code design templates; page_themes searches public page theme templates (styling for forms, chat bots and other visitor pages)",
                "enum": ["help", "qr_templates", "page_themes"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Linkbreakers docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://linkbreakers-docs/search-results.html",
            "ui": {
              "resourceUri": "ui://linkbreakers-docs/search-results.html"
            },
            "ui/resourceUri": "ui://linkbreakers-docs/search-results.html"
          },
          "digest": "sha256:0b2d633a9566b106a2712c1fcdc98effcec478374723ce00c9660771d0748b40"
        }
      ],
      "resources": [
        {
          "uri": "ui://linkbreakers-docs/search-results.html",
          "name": "docs_search_results",
          "title": "Linkbreakers docs results",
          "description": "Search results from the Linkbreakers help center and QR code templates, each opening the page it links to.",
          "mimeType": "text/html;profile=mcp-app",
          "digest": "sha256:a62a633bd9c96b458b9dfc503f6e2b63e5c436325f7383fe587eeac6c5d7bf8f"
        },
        {
          "uri": "https://linkbreakers.com/llms.txt",
          "name": "llms.txt",
          "title": "Linkbreakers llms.txt",
          "description": "Curated index of Linkbreakers documentation for language models",
          "mimeType": "text/markdown",
          "digest": "sha256:6f5252f733cbfeb565c2cb667f0027f738172203c3c3c9bc9683168897105f7a"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "https://linkbreakers.com/help/article/{slug}.md",
          "name": "help-article",
          "title": "Help center article",
          "description": "Markdown source of a Linkbreakers help center article",
          "mimeType": "text/markdown",
          "digest": "sha256:604ab6523027e7b83ab6980f684b7c358f0473702853ff84f3a818e0be0a8e57"
        }
      ],
      "digest": "sha256:4410c9dabf58c7cd49ff7cff48ef03fdd80c9a8026ad3aad3ec36c7950cd716f"
    }
  }
}
