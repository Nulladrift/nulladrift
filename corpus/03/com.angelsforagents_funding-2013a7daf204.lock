          },
          "digest": "sha256:f70d65220c69ee091c0bc40c2aa110e5ec7716aa568694faa5f31cd3a14eeec9"
        },
        {
          "name": "search_live_capital_opportunities",
          "title": "Search live capital opportunities",
          "description": "Search current, source-linked AFA and Grants.gov records. Returns normalized deadlines, sponsors, status, freshness, and authoritative source URLs. Discovery is not an offer of funding or an eligibility decision.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "closing_within_days": {
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 160,
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "closing_soon", "newest"],
                "type": "string"
              },
              "status": {
                "enum": ["all", "posted", "forecasted"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:19cbc653504ebc14d2281276c59017dc11fb1303a59f6ae7dabbe4e39fe99dda"
        },
        {
          "name": "search_venture_resources",
          "title": "Search AFA Venture Resources",
          "description": "Search AFA's source-linked catalog of current capital, compute, model, developer-tool, deployment, and proof resources. Results distinguish discovery records from actual AFA entitlements.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "access_type": {
                "enum": ["afa_api", "open_access", "direct_application", "partner_affiliation_required"],
                "type": "string"
              },
              "availability": {
                "enum": ["available_now", "provider_application", "tracked_partner_program"],
                "type": "string"
              },
              "category": {
                "enum": ["capital", "compute_and_models", "developer_tools", "deployment", "proof_infrastructure"],
                "type": "string"
              },
              "query": {
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
