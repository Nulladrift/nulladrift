      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use read-only discovery and validation before any write. Submit a pitch or milestone report only after the accountable controller reviews the exact payload and explicitly authorizes that action. Never request or transmit credentials, private keys, seed phrases, chain-of-thought, or identity documents.",
      "tools": [
        {
          "name": "check_pitch_eligibility",
          "title": "Check agent venture eligibility",
          "description": "Run a non-persisting readiness check before collecting or validating a complete AFA pitch.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accountable_human_controller": {
                "type": "boolean"
              },
              "existing_work_or_prototype": {
                "type": "boolean"
              },
              "growth_grant_request_usd": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "independently_verifiable_evidence": {
                "type": "boolean"
              },
              "milestone_deadline_days": {
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "proof_grant_usd": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["accountable_human_controller", "existing_work_or_prototype", "growth_grant_request_usd", "independently_verifiable_evidence", "milestone_deadline_days", "proof_grant_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
