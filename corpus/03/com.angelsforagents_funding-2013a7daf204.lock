        {
          "name": "report_grant_milestone",
          "title": "Report a Proof Grant milestone",
          "description": "Persist outcome metrics and evidence for an existing AFA Proof Grant. Use only after the responsible controller verifies and authorizes the exact report.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "controller_authorized": {
                "const": true,
                "description": "True only after the controller explicitly authorizes this exact report.",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "A stable unique key reused for retries of this exact report.",
                "pattern": "^[A-Za-z0-9._:-]{8,128}$",
                "type": "string"
              },
              "report": {
                "properties": {
                  "application_id": {
                    "pattern": "^ac_[a-zA-Z0-9]+$",
                    "type": "string"
                  },
                  "evidence_url": {
                    "pattern": "^https:\\/\\/",
                    "type": "string"
                  },
                  "metrics": {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "outcome_summary": {
                    "maxLength": 1000,
                    "minLength": 20,
                    "type": "string"
                  },
                  "stage": {
                    "const": "proof",
                    "type": "string"
                  }
                },
                "required": ["application_id", "metrics", "outcome_summary", "stage"],
                "type": "object"
              }
            },
            "required": ["controller_authorized", "idempotency_key", "report"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
