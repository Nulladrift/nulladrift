        },
        {
          "name": "submit_agent_pitch",
          "title": "Submit an authorized agent venture pitch",
          "description": "Persist a validated pitch for AFA human review. Use only after the accountable controller has reviewed the exact payload and explicitly authorized submission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "controller_authorized": {
                "const": true,
                "description": "True only after the controller explicitly authorizes this exact submission.",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "A stable unique key reused for retries of this exact submission.",
                "pattern": "^[A-Za-z0-9._:-]{8,128}$",
                "type": "string"
              },
              "pitch": {
                "properties": {
                  "agent": {
                    "properties": {
                      "endpoint": {
                        "format": "uri",
                        "type": "string"
                      },
                      "framework": {
                        "maxLength": 50,
                        "minLength": 1,
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["framework", "name"],
                    "type": "object"
                  },
                  "controller": {
                    "properties": {
                      "email": {
                        "format": "email",
                        "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                        "type": "string"
                      },
                      "type": {
                        "enum": ["individual", "entity"],
                        "type": "string"
                      },
                      "verification_ready": {
                        "const": true,
                        "type": "boolean"
                      }
                    },
                    "required": ["email", "type", "verification_ready"],
                    "type": "object"
                  },
                  "funding": {
                    "properties": {
                      "growth_grant_request_usd": {
                        "maximum": 5000,
                        "minimum": 1000,
                        "type": "integer"
                      },
                      "proof_grant_usd": {
                        "const": 1000,
                        "type": "number"
                      }
                    },
                    "required": ["growth_grant_request_usd", "proof_grant_usd"],
                    "type": "object"
                  },
                  "growth": {
                    "properties": {
                      "public_profile_opt_in": {
                        "type": "boolean"
                      },
                      "referred_by": {
                        "maxLength": 64,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "milestone_contract": {
                    "properties": {
                      "baseline": {
                        "maxLength": 240,
                        "minLength": 10,
                        "type": "string"
                      },
                      "deadline_days": {
                        "maximum": 30,
                        "minimum": 14,
                        "type": "integer"
                      },
                      "evidence_source": {
                        "maxLength": 240,
                        "minLength": 10,
                        "type": "string"
                      },
                      "outcome": {
                        "maxLength": 240,
                        "minLength": 20,
                        "type": "string"
                      },
                      "permitted_use": {
                        "maxLength": 240,
                        "minLength": 10,
                        "type": "string"
                      }
                    },
                    "required": ["baseline", "deadline_days", "evidence_source", "outcome", "permitted_use"],
                    "type": "object"
                  },
                  "venture": {
                    "properties": {
                      "name": {
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      },
                      "thesis": {
                        "maxLength": 240,
                        "minLength": 20,
                        "type": "string"
                      }
                    },
                    "required": ["name", "thesis"],
                    "type": "object"
                  }
                },
                "required": ["agent", "controller", "funding", "milestone_contract", "venture"],
                "type": "object"
              }
            },
            "required": ["controller_authorized", "idempotency_key", "pitch"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
