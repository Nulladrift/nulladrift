{
  "lockfileVersion": 2,
  "subjects": {
    "com.corpusfetch/corpusfetch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.corpusfetch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "corpusfetch-mcp",
        "version": "1.0.6"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "CorpusFetch MCP server. Use lookup tools to resolve a symptom or exception to candidate record addresses, then fetch the warrant before the record.",
      "tools": [
        {
          "name": "corpusfetch_fetch_record",
          "description": "Fetch the full resolved experience record. Format `md` (~1,500 tokens, includes reasoning) or `py` (~300 tokens, zero-prose executable invariants).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "default": null,
                "description": "Format: \"md\" (default, ~1500 tokens) or \"py\" (~300 tokens)",
                "type": ["string", "null"]
              },
              "slug": {
                "description": "Slug of the record",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "FetchRecordParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fbabb11d3cf62aedbb1553d84c08bf7a96428366ace0fa5f3bbc37459b53fdad"
        },
        {
          "name": "corpusfetch_fetch_warrant",
          "description": "Fetch the compact ~220-token precondition seal for a resolved record. Always call this before `corpusfetch_fetch_record`—check the seal first; if it fails, the record does not apply to your current state.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Slug of the record (the URL path segment after /c/ and before .md)",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "FetchWarrantParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5985d59722e8073fa3e78a386727716153bc8514ca3d7e335442f849c796520"
        },
        {
          "name": "corpusfetch_lookup_exception",
          "description": "Look up operational experience for an exact Python exception class (e.g., KeyError, TimeoutError, ConnectionError). Use when you encounter an unexpected runtime error and need an empirically verified boundary decision rather than a guess. Prefer `corpusfetch_search` when you have a symptom description but not an exact exception name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "exception_class": {
                "description": "Python exception class, e.g. KeyError, TimeoutError, ValueError",
                "type": "string"
              }
            },
            "required": ["exception_class"],
            "title": "LookupExceptionParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbd7fa2a1a2ecd5aca0589ab097ef1448c84ea195c0b35f27fe847ff9159a73f"
        },
        {
          "name": "corpusfetch_lookup_symptom",
          "description": "Look up operational experience for a specific runtime symptom or boundary failure (e.g., UNICODE_HOMOGLYPH_OR_MOJIBAKE). Use when facing an ambiguous failure state or unbounded reasoning loop. Prefer `corpusfetch_search` if you only have a loose description.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symptom": {
                "description": "Runtime symptom key, e.g. UNICODE_HOMOGLYPH_OR_MOJIBAKE, or a DOMAIN_* key",
                "type": "string"
              }
            },
            "required": ["symptom"],
            "title": "LookupSymptomParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a42a586a18a8c509a5fe2b668412cea4b76a15de99039ef25de72e37a12d425"
        },
        {
          "name": "corpusfetch_request_experience",
          "description": "Request a new operational experience when `corpusfetch_search` returns no match. The corpus will generate and publish a record for your specific error or symptom within minutes. Use this instead of guessing when the problem is novel and no existing record applies.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "The specific error, missing symptom, or query you need operational experience for",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "RequestExperienceParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b07ca4107b00f6f281423a5892d5d123e2e3d076e9022ba3ae43d27dc428f5a"
        },
        {
          "name": "corpusfetch_search",
          "description": "Search operational records for distributed systems failures, AI agent protocol issues, MCP/A2A problems, database anomalies, concurrency bugs, and runtime errors. Use when the user's problem involves infrastructure, agent-to-agent coordination, authentication, memory management, or observability. Do not use for general programming questions—only for boundary decisions and failure modes that have been empirically recorded.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Natural language query or keywords to search for (e.g., \"taint tracking\", \"Byzantine\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "SearchParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a31f759d723fd11010fb1fc7d08e3ed2c9ffd913faa2676a626b995792abb098"
        }
      ],
      "prompts": [
        {
          "name": "debug_with_corpusfetch",
          "description": "Injects a system instruction to force the AI to use CorpusFetch tools.",
          "arguments": [
            {
              "name": "question",
              "description": "The current user question or error you are debugging",
              "required": true
            }
          ],
          "digest": "sha256:374b210ab991ad08d383538b1eb1802629f6dfb6e723061e190e4662274b7624"
        }
      ],
      "digest": "sha256:a771a886a8308055e398f70e2c099fa4a326121029b62e2f69f6dda6f1aae2cf"
    }
  }
}
