{
  "lockfileVersion": 2,
  "subjects": {
    "com.corpusfetch/corpusfetch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.corpusfetch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "corpusfetch-mcp",
        "version": "1.0.8"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "CorpusFetch MCP server. Use lookup tools to resolve a symptom or exception to candidate record addresses, then fetch the warrant before the record.",
      "tools": [
        {
          "name": "corpusfetch_fetch_record",
          "description": "Call only after `corpusfetch_fetch_warrant` confirms the record applies to your state. Fetches the full resolved experience record in `md` format (~1,500 tokens, includes reasoning) or `py` format (~300 tokens, zero-prose executable invariants).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "default": null,
                "description": "Format: \"md\" (default, ~1500 tokens) or \"py\" (~300 tokens)",
                "type": ["string", "null"]
              },
              "slug": {
                "description": "Slug of the record",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "FetchRecordParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2660c16b87bda7957a65c307abf40ed509ab3f5a35012218e5facb03c284eeaf"
        },
        {
          "name": "corpusfetch_fetch_warrant",
          "description": "Call immediately after resolving a candidate record and always before `corpusfetch_fetch_record` to fetch the compact ~220-token precondition seal. Check the seal first; if it fails, the record does not apply to your current state.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Slug of the record (the URL path segment after /c/ and before .md)",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "FetchWarrantParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66a86cdc6f5c18b7fc09089e6334164f0de86b8b907c024c13e20880dffec783"
        },
        {
          "name": "corpusfetch_lookup_exception",
          "description": "Call when you have an exact Python exception class name (e.g., KeyError, TimeoutError, ConnectionError) and need an empirically verified boundary decision rather than a guess. Prefer `corpusfetch_search` when you only have a symptom description without an exact exception class.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "exception_class": {
                "description": "Python exception class, e.g. KeyError, TimeoutError, ValueError",
                "type": "string"
              }
            },
            "required": ["exception_class"],
            "title": "LookupExceptionParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b786afc31d36910874fc99386cfcf9ccfb0079135742a30ebac832a392a006db"
        },
        {
          "name": "corpusfetch_lookup_symptom",
          "description": "Call when facing a specific runtime symptom or boundary failure key (e.g., UNICODE_HOMOGLYPH_OR_MOJIBAKE), an ambiguous failure state, or an unbounded reasoning loop. Prefer `corpusfetch_search` if you only have a loose description.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symptom": {
                "description": "Runtime symptom key, e.g. UNICODE_HOMOGLYPH_OR_MOJIBAKE, or a DOMAIN_* key",
                "type": "string"
              }
            },
            "required": ["symptom"],
            "title": "LookupSymptomParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27982964ac5113f7b60243810968d3fd3bd72ae4e800c7b23762e929c777d335"
        },
        {
          "name": "corpusfetch_request_experience",
          "description": "Call only when `corpusfetch_search` returns no match and you have a specific error/failure name or UPPER_SNAKE_CASE symptom key for a novel problem. Generates and publishes a record within minutes instead of guessing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "The specific error, missing symptom, or query you need operational experience for",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "RequestExperienceParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad8f736928e363650669dd2fc2b9db05d970eb9f844d4e54ef098cc27b31aa83"
        },
        {
          "name": "corpusfetch_search",
          "description": "Call when searching by keywords or a loose failure description for distributed systems failures, AI agent protocol issues, MCP/A2A problems, database anomalies, concurrency bugs, infrastructure, agent-to-agent coordination, authentication, memory management, or observability. Do not use for general programming questions—only for empirically recorded boundary decisions and failure modes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Natural language query or keywords to search for (e.g., \"taint tracking\", \"Byzantine\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "SearchParams",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:855f2e4c8a854aace25c52df62a0727f6fb61084b90d5c6add3f17fc91ce2c30"
        }
      ],
      "prompts": [
        {
          "name": "debug_with_corpusfetch",
          "description": "Injects a system instruction to force the AI to use CorpusFetch tools.",
          "arguments": [
            {
              "name": "question",
              "description": "The current user question or error you are debugging",
              "required": true
            }
          ],
          "digest": "sha256:374b210ab991ad08d383538b1eb1802629f6dfb6e723061e190e4662274b7624"
        }
      ],
      "digest": "sha256:5a1a7b0461ca5b4bfa5c87f872bb160502e06235c7eac29462654421be4b8d46"
    }
  }
}
