        {
          "name": "x402_q_verdict_v1__dao_proposal_preview",
          "description": "DAO Proposal Preview: decoded targets, proposal state, votes and timelock delay for one OpenZeppelin Governor proposal on Ethereum or Base. Check this first.  Returns: a DAO proposal preview on one OpenZeppelin Governor proposal: the decoded targets and call data the buyer posts, the proposal state, vote totals, quorum and timelock delay read from the chain, and whether each target is verified. No verdict, no model.\n\nPrice: $0.002 USDC per call, paid by x402 (Base, Polygon or Arbitrum).\nPOST https://api.arysphere.com/v1/ventures/x402_q_verdict_v1/dao_proposal_preview. Same payment terms as that HTTP route.\nCall once with no payment. The result is the payment terms. Retry the same call with the signed payment at _meta[\"x402/payment\"].",
          "inputSchema": {
            "description": "One OpenZeppelin Governor proposal, named by the chain, the Governor and the exact propose() arguments (they hash to the proposal id, checked on chain). Copy them from the ProposalCreated event or the proposal page.",
            "properties": {
              "calldatas": {
                "description": "the call data for each target, 0x hex, one per target",
                "items": {
                  "pattern": "^0x([0-9a-fA-F]{2})*$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "chain": {
                "description": "the chain the Governor is on",
                "enum": ["ethereum", "base"]
              },
              "description": {
                "description": "optional, the description text, for display only",
                "maxLength": 2000,
                "type": "string"
              },
              "descriptionHash": {
                "description": "keccak256 of the proposal description, 0x + 64 hex",
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "governor": {
                "description": "the Governor contract, 0x + 40 hex",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "targets": {
                "description": "the proposal's target contracts, in order, 0x + 40 hex each",
                "items": {
                  "pattern": "^0x[0-9a-fA-F]{40}$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "values": {
                "description": "the wei sent with each call, decimal strings, one per target",
                "items": {
                  "pattern": "^[0-9]{1,78}$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["calldatas", "chain", "descriptionHash", "governor", "targets", "values"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:74a86f3270d7243bf3b8feecca9623ba092570c48acaeb70cf0fd49bd8f7bd74"
        },
