          "description": "Change an owned ticket's status through the existing lifecycle gate. For an epic completion, persist completion_idempotency_key before calling and retry the same request after an uncertain response. Reopening a terminal epic requires the exact expected_completed_at and, for an attested completion, expected_completion_record_id from ticket_authority. Stale coordinates and unready completions refuse without changing status. Reconcile uncertain reopen responses with ticket_authority. Returns committed transition and ticket JSON. Requires tickets:write.",
