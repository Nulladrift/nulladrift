        {
          "name": "supersede_portfolio_report",
          "title": "Supersede Portfolio Report",
          "description": "Record that one owned saved report replaces another, with a required reason and both fetched payload hashes. This is an immutable owner declaration, not approval, sharing or a claim of accuracy. Both reports must have no replacement recorded. Use the same key and exact payload after an uncertain response; exact retries return the original receipt even after later replacements. Conflicting keys, self-links and cycles are refused. Original exports stay unchanged. tickets:write.",
