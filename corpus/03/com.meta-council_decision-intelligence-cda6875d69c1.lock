        {
          "name": "update_workflow_template",
          "title": "Update Workflow Template",
          "description": "Replace an existing custom workflow template's definition. This is a full replacement, not a patch: supply name and steps as you want them to end up, because anything omitted is not carried over. Built-in templates are read-only, and only the template's owner may change it. Legacy workflows run in dependency order; steps ready together share one bounded parallel layer, while no depends_on keeps authored list order. Explicitly routed workflows use next_step and bounded quality-gate transitions and cannot mix those fields with depends_on. Requires authentication and the workflows:write scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "Description after the update.",
                "maxLength": 4000,
                "type": "string"
              },
              "domain": {
                "description": "Grouping domain after the update.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "expected_template_fingerprint": {
                "description": "Optional. The definition fingerprint you last saw for this template, returned by update_workflow_template when it last succeeded. Supply it and the write refuses, changing nothing, if the stored template is no longer the one that fingerprint names -- someone else edited or deleted it since you read it. Omit it and the write proceeds as it always has, overwriting whatever is there. This is not the definition_sha reported for a run: that one also reflects global configuration, this one names the stored file alone.",
                "maxLength": 64,
                "minLength": 64,
                "type": "string"
              },
              "name": {
                "description": "Template name after the update.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Slug of the template to replace, from list_workflows.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "steps": {
                "description": "The complete step list after the update, in run order.",
                "items": {
                  "additionalProperties": false,
                  "allOf": [
                    {
                      "not": {
                        "required": ["id", "step_id"]
                      }
                    }
                  ],
                  "properties": {
                    "agent_template": {
                      "description": "Slug of the agent template this step runs, from list_agents.",
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^[a-z0-9][a-z0-9_-]*$",
                      "type": "string"
                    },
                    "checkpoint": {
                      "description": "Whether the run pauses for human approval after this step. Defaults to true when omitted.",
                      "type": "boolean"
                    },
                    "depends_on": {
                      "description": "Optional ids of steps this one builds on. A step starts only once every id it names has finished. Steps ready together share one bounded parallel layer in authored order. A definition with no arrows still runs in list order. Do not combine depends_on with routed fields.",
                      "items": {
                        "maxLength": 100,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]*$",
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "human_gate": {
                      "description": "Require approval from the authenticated human review UI. API-key and MCP callers cannot cross this gate.",
                      "type": "boolean"
                    },
                    "id": {
                      "description": "Optional stable identifier for this step. Supply one only if another step names it in depends_on.",
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "instruction": {
                      "description": "Optional step-specific instruction for the agent.",
                      "maxLength": 20000,
                      "type": "string"
                    },
                    "max_tokens": {
                      "description": "Optional output token cap for this step.",
                      "maximum": 65536,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "model": {
                      "description": "Optional model id override for this step; omit to use the agent template's own model.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "name": {
                      "description": "Human-readable step name, e.g. 'Draft the brief'.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "next_step": {
                      "description": "Optional next step id for an explicitly routed workflow. Do not combine routed fields with depends_on.",
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^(?:__end__|[A-Za-z0-9][A-Za-z0-9_.:-]*)$",
                      "type": "string"
                    },
                    "params": {
                      "description": "Optional configuration for a non-agent step. Must be omitted or empty for an 'agent' step, whose configuration is the named fields above (model, temperature, instruction, ...); params would be silently ignored there, so it is refused.",
                      "type": "object"
                    },
                    "quality_gate": {
                      "additionalProperties": false,
                      "allOf": [
                        {
                          "if": {
                            "properties": {
                              "schema": {
                                "const": "scope_decision/v1"
                              }
                            },
                            "required": ["schema"]
                          },
                          "then": {
                            "properties": {
                              "blocking_severities": {
                                "const": ["P0", "P1"]
                              },
                              "max_iterations": {
                                "const": 1
                              }
                            }
                          }
                        }
                      ],
                      "properties": {
                        "blocking_severities": {
                          "items": {
                            "enum": ["P0", "P1", "P2", "P3", "P4", "P5"],
                            "type": "string"
                          },
                          "maxItems": 6,
                          "minItems": 1,
                          "type": "array",
                          "uniqueItems": true
                        },
                        "loop_to": {
                          "maxLength": 100,
                          "minLength": 1,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]*$",
                          "type": "string"
                        },
                        "max_iterations": {
                          "maximum": 5,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "pass_to": {
                          "maxLength": 100,
                          "minLength": 1,
                          "pattern": "^(?:__end__|[A-Za-z0-9][A-Za-z0-9_.:-]*)$",
                          "type": "string"
                        },
                        "schema": {
                          "enum": ["severity_findings/v1", "scope_decision/v1"],
                          "type": "string"
                        }
                      },
                      "required": ["loop_to", "max_iterations", "pass_to", "schema"],
                      "type": "object"
                    },
                    "requires_distinct_provider_from": {
                      "description": "Require this step's actual provider to differ from the provider that produced the named earlier step.",
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "role": {
                      "description": "Optional short role label shown alongside the step.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "step_id": {
                      "description": "Canonical stable identifier for routed steps. Do not supply both step_id and the legacy id field.",
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]*$",
                      "type": "string"
                    },
                    "temperature": {
                      "description": "Optional sampling temperature override for this step.",
                      "maximum": 2,
                      "minimum": 0,
                      "type": "number"
                    },
                    "tools": {
                      "description": "Optional subset of persona tools. [] disables tools for supplied-evidence drafts; omission inherits.",
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 100,
                      "type": "array",
                      "uniqueItems": true
                    },
                    "type": {
                      "description": "Optional executable node kind. Defaults to 'agent', which asks a model a question. 'transform' runs a supported deterministic local operation; 'connector' invokes the configured connector runtime and fails that step if the runtime is unavailable.",
                      "enum": ["agent", "transform", "connector"],
                      "type": "string"
                    }
                  },
                  "required": ["agent_template", "name"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "tags": {
                "description": "Tags after the update.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "meta-council.dev/capability": {
              "conditionalScopes": [],
              "costClass": "write",
              "limitations": ["runtime_authorization_required", "not_a_price_quote", "existing_automations_not_evaluated"],
              "mutating": true,
              "publicAccess": false,
              "requiredScopes": ["workflows:write"],
              "schemaVersion": 1,
              "scopeAlternatives": {}
            }
          },
          "digest": "sha256:7bb07d2f5418281ebede5191b3795c9187e2081d88a17c8fc5921c65bcbd908c"
