                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              }
            },
            "required": ["expected_evidence_digest", "expected_review_revision", "idempotency_key", "ticket_id"],
