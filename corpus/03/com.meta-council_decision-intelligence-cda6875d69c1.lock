        {
          "name": "get_site_analytics",
          "title": "Get Site Analytics",
          "description": "OPERATOR ONLY: visitor traffic for the META COUNCIL PLATFORM's own website — every visitor added together, NOT the caller's workspace (use get_workspace_metrics for that) and NOT the business rollup (use get_meta_council_platform_metrics for that). Requires both the platform:admin scope AND an ADMIN_EMAILS operator account; everyone else gets a permission error naming which of the two requirements failed. Covers a window of whole UTC days ending today, set by days. Returns human total views, unique visitors, the authenticated/anonymous split, the busiest public paths, the busiest in-app sections, top referrers and a per-day series, separate bot page/section view counts, plus the window it covers so the caller need not track what it asked for. Page paths and in-app sections are counted separately and are not comparable to one another. It never returns per-visitor rows, email addresses, IP hashes, user agents, session identifiers or query text — the rollup reports how many, never who. Also returns recorded account activation cohorts by creation-event source and signed-in weekly distinct account/section usage. These are prospective observations, not visitor conversion: campaign attribution, visit-to-account conversion and visit entry pages are explicitly unavailable. No named account activity is returned. Optional digest_limit includes retained weekly aggregate snapshots and delivery counts; digest_before_week pages strictly before a scheduled Monday YYYY-MM-DD. This read never captures or sends a digest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Whole UTC days to cover, ending today. Defaults to 7.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "digest_before_week": {
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "digest_limit": {
                "maximum": 52,
                "minimum": 1,
                "type": "integer"
              }
