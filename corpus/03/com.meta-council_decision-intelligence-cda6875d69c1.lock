        {
          "name": "decide_approval",
          "title": "Decide Approval",
          "description": "Answer a waiting checkpoint by request id: approve, reject, or amend. 'amend' means send the step back to be redone with the change described in notes, so notes are required for it. Spends money: approve continues the run and amend re-runs the step, both billed. Fails with a clear error, rather than silently doing nothing, if the run is no longer waiting. Requires authentication and the workflows:approve scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
