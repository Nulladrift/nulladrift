          "description": "Create an expiring read-only bearer link for the exact previewed report projection. Anyone possessing the link can read it; copied content cannot be recalled. Requires explicit reports:share and independent human approval. Expiry must be UTC Z, 60 seconds to 30 days from creation. Acknowledge public visibility explicitly. Keep request_id and exact arguments after an uncertain reply; retrieve the original receipt with get_portfolio_report_share_receipt and read current link state. No link is sent.",
