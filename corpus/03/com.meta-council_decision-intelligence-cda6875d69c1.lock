        {
          "name": "create_portfolio_snapshot_note",
          "title": "Create Portfolio Snapshot Note",
          "description": "Record a decision or comment against one of YOUR OWN portfolio snapshots. Pass expected_content_hash -- the hash you saw when you read the snapshot -- and a mismatch is REFUSED rather than quietly filed against a different revision; that check is the point of this tool. Omitting it still records the note, it just does not assert which revision was on the screen. This writes down what was decided; it does not approve, reject or block anything, and nothing downstream gates on it. A lost reply may have committed; this write has no replay key and must not be automatically retried. Requires authentication and the tickets:write scope.",
