        {
          "name": "save_ticket_attention_review",
          "title": "Save Ticket Attention Review",
          "description": "Record an owner-private review of current attention evidence, with optional note (2000 characters) and follow_up_date plus explicit IANA follow_up_timezone, or null for both. Requires tickets:write. Supply the current evidence digest, current review revision (0 first), and caller-stable idempotency key. Exact retries return the original receipt; changed requests, revision or evidence conflict. Retains immutable history; omitted fields clear note/date. Does not hide/reorder queue items, reset clocks/status, approve consequential actions, notify or call providers. Retained evidence discloses omitted prerequisite detail.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expected_evidence_digest": {
                "pattern": "^[0-9a-f]{64}$",
