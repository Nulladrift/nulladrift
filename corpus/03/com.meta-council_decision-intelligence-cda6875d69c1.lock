                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "tickets": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "acceptance_criteria": {
                      "maxLength": 10000,
                      "type": ["string", "null"]
                    },
