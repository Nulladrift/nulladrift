        {
          "name": "void_invoice",
          "title": "Void Invoice",
          "description": "Void a draft or sent invoice. Cannot be applied to an already-paid invoice (issue a credit note instead). invoice_id is required. No delete tool is exposed over MCP — void is the terminal non-destructive state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "invoice_id": {
                "type": "string"
              }
            },
            "required": ["invoice_id"],
            "type": "object"
          },
          "annotations": {
