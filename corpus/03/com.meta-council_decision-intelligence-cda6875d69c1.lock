          "description": "Settle one uncertain create effect by reading the remote item you name in the effect’s own connection: GitHub issue_number, GitLab issue_iid or Asana task_gid, exactly one, for the effect’s provider. Bounded read-only provider requests. Only when that item carries the effect’s correlation marker does one local commit record the link and an immutable settlement; otherwise nothing is recorded. Never writes to the provider, retries, recreates or replays the effect. Refused until the deploy-owned settlement activation (graph v3). An effect left cancelled with attempt_count 1 cannot be settled. If an outcome is unconfirmed, read list_ticket_integration_effects_v2 before another action. Requires integrations:write and tickets:write.",
