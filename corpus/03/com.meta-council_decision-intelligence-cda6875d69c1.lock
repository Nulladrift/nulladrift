        {
          "name": "ticket_list",
          "title": "Ticket List",
          "description": "Page through the caller's tickets on the Meta Council board. The opaque next_cursor is owner- and filter-bound; keep every filter unchanged on the next call. Immutable cursor ordering keeps a stable full-board traversal exact while returned tickets are edited or reordered. Filter by status, assignee, action_type, priority, parent_id (a ticket UUID, or 'none' for root tickets only), or free-text q over title/description. With recursive=true, parent_id must be an owned UUID and all descendants (not the anchor) are returned as one flat, cycle-safe traversal. Session/workflow links are opaque metadata filters, not access grants. Start here to find work, then use ticket_get for detail and ticket_claim to take a ticket. output_format=json returns a minimized machine-readable page inside text, including labels and stored update timestamps, for read-only board mirrors. It is not a full ticket backup.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_type": {
                "enum": ["strategy", "implementation", "research", "validation", "testing", "coordination"],
                "type": "string"
              },
              "assignee": {
                "maxLength": 100,
                "type": "string"
              },
              "cursor": {
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "labels_all": {
                "items": {
                  "maxLength": 50,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "labels_any": {
                "items": {
                  "maxLength": 50,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "labels_none": {
                "items": {
                  "maxLength": 50,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "limit": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "output_format": {
                "default": "markdown",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "parent_id": {
                "description": "Parent ticket UUID, or 'none' for roots only.",
                "type": "string"
              },
              "priority": {
                "enum": ["critical", "high", "medium", "low"],
                "type": "string"
              },
              "q": {
                "maxLength": 200,
                "type": "string"
              },
              "recursive": {
                "type": "boolean"
              },
              "scope": {
                "default": "active",
                "description": "Archived tickets are out of the working set and hidden by default. Archiving never changed their status, so an archived ticket listed under scope='archived' still shows the status it had.",
                "enum": ["active", "archived", "all"],
                "type": "string"
              },
              "session_id": {
                "maxLength": 64,
                "type": "string"
              },
              "status": {
                "enum": ["backlog", "todo", "in_progress", "blocked", "in_review", "done", "cancelled"],
                "type": "string"
              },
              "workflow_session_id": {
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
