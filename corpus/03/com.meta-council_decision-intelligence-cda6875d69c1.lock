        {
          "name": "ticket_batch_create",
          "title": "Ticket Batch Create",
          "description": "Preview or idempotently commit one atomic owner-private batch of structured tickets and nested subtickets. Preview is non-mutating and returns the normalized commit payload, exact preview_token, and deterministic predicted IDs as JSON. Commit requires that exact token: combine commit_payload with mode=commit, the caller-held idempotency_key, and preview_token. It returns the same IDs plus replay status. A caller-stable visible-ASCII idempotency_key is always required. MCP authorship is stamped by the server; callers cannot spoof it. Nested subtickets are bounded and validated by the ticket handler before any write. This never executes, sends, publishes, deletes, or mutates an external provider.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "mode": {
                      "const": "commit"
                    }
                  },
                  "required": ["mode"]
                },
                "then": {
                  "required": ["preview_token"]
                }
              }
            ],
            "properties": {
              "idempotency_key": {
                "description": "Caller-stable visible-ASCII key. Reuse only for the exact same operation and payload.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[!-~]+$",
                "type": "string"
              },
              "mode": {
                "enum": ["preview", "commit"],
                "type": "string"
              },
              "parent_id": {
                "format": "uuid",
                "maxLength": 36,
                "minLength": 36,
                "type": ["string", "null"]
              },
              "preview_token": {
