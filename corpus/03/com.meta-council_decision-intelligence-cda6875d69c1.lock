                    "type": "string"
                  },
                  "priority": {
                    "description": "Saved-view filter: priority.",
                    "type": "string"
                  },
                  "q": {
                    "description": "Saved-view filter: q.",
                    "type": "string"
                  },
                  "reader": {
                    "default": "tickets",
                    "description": "Saved-view filter: reader.",
                    "enum": ["tickets", "attention", "reviewed_attention"],
                    "type": "string"
                  },
                  "reason": {
                    "description": "Saved-view filter: reason.",
                    "enum": [null, "stale", "aging", "blocked", "dependency_blocked", "completion_blocked", "missed_due_date", "integration_drift", "forecast_degradation"],
