        {
          "name": "update_saved_view",
          "title": "Update Saved View",
          "description": "Revise one of YOUR OWN saved views in place, keeping its id and any existing team share. Only the fields you send change; the rest are left exactly as they were, while scorecard-enrolled views require the current definition_revision; after a conflict or uncertain reply, read current state and deliberately reconcile. Sharing a view does not let its readers revise it -- only the owner may. Requires authentication and the tickets:write scope.",
          "inputSchema": {
