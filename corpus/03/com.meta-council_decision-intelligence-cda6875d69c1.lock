      "instructions": "Authenticated tools operate on the API-key owner's tenant. Do not submit passwords, access tokens, or other secrets. Do not submit protected health information (PHI) unless your organization has a signed BAA with Meta Council and written approval for a HIPAA-configured environment; de-identify all behavioral-health/LOCUS cases used on the standard service.",
      "tools": [
        {
          "name": "account_export",
          "title": "Account Export",
          "description": "Export this account's own data across every table the account owns, as the same JSON envelope the REST route returns. The set of tables served is derived from the same ownership reflection that decides what an account deletion removes, so a table the account can destroy is a table it can also read. Credentials never appear: columns held encrypted at rest are withheld unless recorded as the account's own content, and password hashes, reset and verification tokens, and API key hashes are withheld by name. Some tables are deliberately excluded -- see docs/ACCOUNT_DATA_EXPORT.md, and note that the coverage block on every response lists exactly which models are served and which are excluded with their reasons. Artifacts are described by their metadata rows rather than inlined. Bounded rather than streamed: each model reports truncated and the envelope reports complete, so narrow to one model and raise rows_per_model rather than re-reading everything. This is a data export, not an erasure request and not a claim of regulatory compliance. Requires authentication and the account:export scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "models": {
                "description": "Model names to narrow to, which is how a caller pages a table that truncated without re-reading the others. Omit to export every model the coverage block lists as served.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "rows_per_model": {
                "description": "Row ceiling applied to each model separately. Defaults to 500, maximum 5000.",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
