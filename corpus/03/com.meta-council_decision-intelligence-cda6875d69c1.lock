              },
              "name": {
                "description": "Label for the child key (default 'delegated key').",
                "type": "string"
              },
              "scopes": {
                "description": "Scopes to grant the child. Must be a subset of the calling key's own scopes and may not include keys:mint.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["scopes"],
            "type": "object"
          },
