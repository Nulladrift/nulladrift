        {
          "name": "ask_legal",
          "title": "Ask Legal",
          "description": "Request fixed legacy Themis source/citation records and attach a proposed Laws & Regulations agent/source/synthesis plan whose routes are planned_not_run. Check the law uses fixed legacy provider-record retrieval, but returned records do not prove exact citation identity, relevance, authority, or corpus coverage. Generated research requires authentication, exact THEMIS_NEUTRAL_SCHEMA_VERSION=themis_neutral_research/v1, the operator gate, a verified authenticated corpus manifest, and an atomic spend reservation. The manifest verifier is not available yet, so generated mode remains disabled. Provider assertions/gaps are enum codes linked to evidence whose quote-fidelity state is provider-reported and rendered with fixed server text; any legacy verdict or answer prose is withheld. Returns legal_evidence_graph/v1. Automated research only, not legal advice. Requires legal:run.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "default": "",
                "description": "Optional factual context; treated as unverified input. The normalized question plus context must fit 2,000 characters total.",
                "maxLength": 2000,
                "type": "string"
              },
              "domains": {
                "default": [],
                "description": "Optional domain hints such as OSHA, building_codes, or sports_regulation.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "jurisdiction": {
                "default": "auto",
                "description": "Request hint forwarded to the legacy provider; it does not prove corpus coverage.",
                "enum": ["auto", "federal", "california", "both"],
                "type": "string"
              },
              "max_sections": {
                "description": "Optional maximum number of provider-returned source/citation records.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "model_overrides": {
                "additionalProperties": {
                  "maxLength": 160,
                  "minLength": 1,
                  "type": "string"
                },
                "default": {},
                "description": "Optional model-id overrides for proposed, unexecuted agent routes.",
                "maxProperties": 8,
                "propertyNames": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "quality": {
                "default": "balanced",
                "description": "Policy for proposed, unexecuted model-quality and reasoning-effort routes.",
                "enum": ["fast", "balanced", "deep"],
                "type": "string"
              },
              "question": {
                "description": "Laws or regulations research question (no credentials or secrets). After normalized context is appended, the combined provider question must fit 2,000 characters.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "reasoning_effort_overrides": {
                "additionalProperties": {
                  "enum": ["low", "medium", "high", "max"],
                  "type": "string"
                },
                "default": {},
                "description": "Optional effort overrides for proposed, unexecuted agent routes.",
                "maxProperties": 8,
                "propertyNames": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "requested_agents": {
                "default": [],
                "description": "Up to seven catalog agent additions for the proposed plan; one of the eight total agent slots is reserved for its baseline agent.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "research_mode": {
                "default": "check_law",
                "description": "Fixed legacy provider-record retrieval or an explicit request for fail-closed, neutral Themis generation.",
                "enum": ["check_law", "themis"],
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
