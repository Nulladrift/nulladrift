                "description": "Recovery Environment — Stress (1-5).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "D4B_Support": {
                "description": "Recovery Environment — Support (1-5).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
