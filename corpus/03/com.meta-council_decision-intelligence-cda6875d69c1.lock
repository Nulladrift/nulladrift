                "description": "Current definition_revision, required to configure a scorecard or change any previously enrolled view. On conflict or uncertain reply, read current state and deliberately reconcile; this is not an exact-retry receipt.",
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              },
              "filters": {
                "additionalProperties": false,
                "description": "Saved question. Omitted reader selects ordinary tickets. Attention accepts reason; reviewed_attention accepts state and follow_up. Triage refuses other non-default ticket filters, grouping and sorting. Save intent only, never result pages.",
                "properties": {
                  "action_type": {
                    "description": "Saved-view filter: action_type.",
