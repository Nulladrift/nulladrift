                "description": "Treatment & Recovery History (1-5).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "D6_Engagement": {
                "description": "Engagement & Recovery Status (1-5).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "agent_scores": {
