              "mutating": true,
              "publicAccess": false,
              "requiredScopes": ["workflows:write"],
              "schemaVersion": 1,
              "scopeAlternatives": {}
            }
          },
          "digest": "sha256:8e313adb677a48e477b70bcc750edf20feb4afebd0d435d50f907f8280e9dfc8"
