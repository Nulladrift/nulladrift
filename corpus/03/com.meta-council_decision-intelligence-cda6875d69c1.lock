                  },
                  "status": {
                    "description": "Saved-view filter: status.",
                    "type": "string"
                  },
                  "workflow_session_id": {
                    "description": "Saved-view filter: workflow_session_id.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "group_by": {
                "description": "New grouping field; null clears it. Clear explicit grouping and sorting when switching to triage.",
                "type": ["string", "null"]
              },
              "name": {
                "description": "New name for the view.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "scorecard": {
