          "name": "save_ticket_attention_policy",
          "title": "Save Ticket Attention Policy",
          "description": "Save owner-private attention thresholds in UTC days (finite 0–3650), status overrides and optional paused_statuses. Requires tickets:write. Supply full base thresholds, sparse overrides, expected_revision and caller-stable idempotency_key. paused_statuses specifies all four timed reasons with unique status lists including done/cancelled; pauses apply prospectively from this save. Explicit empty lists restore elapsed counting while retaining prior deductions. Omission cannot clear active pauses. Null overrides disable rules without pausing clocks. Saves require fresh reviews; exact retries retain original receipts. Missing history makes adjusted age unknown. Original anchors, follow-up dates and completion blockers are unchanged; no notification or provider calls.",
