        {
          "name": "get_ticket_attention_queue",
          "title": "Get Ticket Attention Queue",
          "description": "Read the same ranked Needs attention queue as the browser and REST. Returns complete JSON with reasons, UTC clock evidence, effective owner policy thresholds and revision, approximation flags, unmet prerequisites and suggested next actions. Ordinary attention covers open active owned tickets; integration recovery also includes retained risks on terminal, archived or deleted-source work. Historical provider observations are not current provider truth. Limit 1–500 (default 100), offset 0–2147483647 (default 0). Continue with next_offset when has_more; refresh at offset 0. Membership/rank can shift between live pages. total_flagged/truncated disclose partial coverage. Filter reason before the limit, including missed_due_date with saved date/timezone/calendar/version after its entire local day. Weekends and status pauses never extend commitments; age is elapsed 24-hour days. Completion blockers have no age or threshold. Blocked work with unproven history remains visible with an unknown age and its configured threshold. Ranked by greatest known days over threshold, then ticket UUID; items with no elapsed clock sort last. No state changes, acknowledgments, notifications or provider calls. Requires tickets:read.",
