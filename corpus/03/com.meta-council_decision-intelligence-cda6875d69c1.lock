        {
          "name": "create_monitor",
          "title": "Create Monitor",
          "description": "Save a standing watch that fires later, on its own: when a count you name crosses a line you set, do the thing you chose. Lets an agent bank a condition and stop polling for it. The watch survives the conversation that created it. Note that start_workflow spends the account's credits unattended each time it fires, so the cooldown is the only thing bounding what it costs. Requires authentication, a Pro or Enterprise account, and the monitors:write scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What to do when the condition holds.",
                "enum": ["start_workflow", "notify_slack"],
                "type": "string"
              },
              "action_config": {
                "additionalProperties": false,
                "description": "Settings for the chosen action. start_workflow needs workflow_slug; notify_slack needs message.",
                "properties": {
                  "message": {
                    "description": "notify_slack only: the message to send.",
                    "maxLength": 2000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "query": {
                    "description": "start_workflow only: optional query handed to the workflow.",
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "workflow_slug": {
                    "description": "start_workflow only: slug of the workflow to run, from list_workflows.",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "comparator": {
                "description": "How the count is compared against threshold.",
                "enum": ["gt", "gte", "lt", "lte", "eq"],
                "type": "string"
              },
              "cooldown_seconds": {
                "description": "Minimum gap between firings. Defaults to 3600. Values below one scheduler tick are raised to 60, and the stored value reflects that.",
                "minimum": 0,
                "type": "integer"
              },
              "name": {
                "description": "Human label for the watch, e.g. 'Backlog over 50'.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "status_filter": {
                "description": "Optional: count only rows in this status, e.g. 'todo'. Omit to count them all.",
                "maxLength": 40,
                "type": "string"
              },
              "subject": {
                "description": "Which of your counts to watch.",
                "enum": ["tickets", "leads", "invoices"],
                "type": "string"
              },
              "threshold": {
                "description": "The line the count must cross.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["action", "comparator", "name", "subject", "threshold"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
