{
  "lockfileVersion": 2,
  "subjects": {
    "com.birchbracken/store": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://birchbracken.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "birch-bracken",
        "title": "Birch & Bracken",
        "version": "1.0.0",
        "websiteUrl": "https://birchbracken.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Birch & Bracken: knitwear and layers for men and women. This server is the United States store (birchbracken.com), prices in USD, delivery included in the price. Use search_products, then get_product for sizes, the size chart and delivery. To buy, open the product's url: the shopper chooses a size and pays with PayPal on that page. Order questions: track_order needs the order reference and the checkout email. Contact: hello@birchbracken.com.",
      "tools": [
        {
          "name": "get_product",
          "title": "Read one piece",
          "description": "Everything the product page says about one piece: price, sizes, colour, story and details, the supplier's size chart (garment measurements), delivery estimate, returns, customer reviews and the page to buy it on.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The piece's slug, from search_products (e.g. the-otter-sweater)",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one piece"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:257f78f23d3747bd749e558e060d34820bd256b878b1f9e0d1db61e885c1710e"
        },
        {
          "name": "search_products",
          "title": "Search the catalogue",
          "description": "Find pieces in this store by words (e.g. 'wool sweater', 'cardigan', 'rust'), optionally filtered by department, size and maximum price. Empty query lists every piece.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "department": {
                "enum": ["men", "women"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in the store's currency (major units)",
                "type": "number"
              },
              "query": {
                "description": "Words to search for; empty lists every piece",
                "maxLength": 200,
                "type": "string"
              },
              "size": {
                "description": "e.g. M or XL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the catalogue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3d7ddf019955591e2b04f1f53ad869284cda9a895db3cfb36f56ba5947f928b"
        },
        {
          "name": "store_policies",
          "title": "Read the store policies",
          "description": "Shipping, returns, privacy, terms or contact policy, in full, as published.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "enum": ["shipping", "returns", "privacy", "terms", "contact"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the store policies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:37b029c4700efe2a98c37a934e5366b9b7b2abb575f4f39d9e5ee87243a77f59"
        },
        {
          "name": "track_order",
          "title": "Check an order",
          "description": "The status of one order (preparing, shipped, delivered), its items, delivery estimate and tracking. Needs the 8-character order reference from the confirmation email and the email used at checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email used at checkout",
                "type": "string"
              },
              "reference": {
                "description": "Order reference, 8 characters, e.g. 1A2B3C4D",
                "type": "string"
              }
            },
            "required": ["email", "reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b8a96ea2e709b135a4e13633f2d7c933e21d5c89123c83ff08ca69c0cc09577"
        }
      ],
      "digest": "sha256:3920b5dd5f02276fbd709b95494d8f459cdfdca7e563a2cecfd0994b72ab754f"
    }
  }
}
