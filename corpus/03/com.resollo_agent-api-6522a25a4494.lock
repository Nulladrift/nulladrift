        {
          "name": "products.create",
          "title": "Create a Resollo product listing from photos",
          "description": "Starts creating a new Resollo listing from photos. It opens a photo upload (no photos in the call), which can be completed in two ways. (1) Resollo's photo picker: in clients that support MCP Apps (e.g. Claude, ChatGPT) it appears right in the chat; otherwise give the seller upload_url, a Resollo page where they pick the photos (signed in; phone gallery or camera works). (2) Direct upload, for agents that have a tool to create the WebP files (e.g. the free photo MCP servers at github.com/resollo/mcp-servers, ImageMagick, cwebp) and can send an HTTP PUT: call with upload: 'direct' -- only then does the result include upload_id and direct_upload, and the picker stays hidden. Create each photo as WebP as direct_upload.requirements says, PUT it to direct_upload.put_urls with direct_upload.headers, then call products.createFromUpload with upload_id. Resollo never converts photos -- if you can't, use (1). Never put photo bytes into a tool argument. A photo that arrives as a file (attached, or a file pasted from the seller's file manager) reaches your tools as that file and can go through (2). Only an inline image (e.g. a screenshot or a copied image) is just pixels, not a file -- for that one, use the picker. After the upload, Resollo's own AI writes the title, description, category, condition, and a suggested price, and creates the listing as an INACTIVE draft that is NOT publicly visible. The seller MUST review and activate it themselves on resollo.com. Never tell the user the listing is 'live' or 'published'. When a picker upload finishes, the picker itself shows the seller the draft and its activation link, so you don't need to look it up or wait for it; if you need its details later, it's the newest 'inactive' listing in sellers.listings. Requires a signed-in Resollo user (OAuth sign-in, or an 'Authorization: Bearer <agent api key>' header).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "upload": {
                "default": "picker",
                "description": "'picker' (default): the seller picks the photos in Resollo's photo picker. 'direct': you will upload the photos yourself (see direct_upload in the result); the picker panel then stays hidden.",
                "enum": ["picker", "direct"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "direct_upload": {
                "additionalProperties": false,
                "description": "For agents that have a tool to create the WebP files (e.g. the free photo MCP servers at github.com/resollo/mcp-servers, ImageMagick or cwebp) and can send an HTTP PUT: upload the photos yourself instead of the picker. Create each photo as WebP, at most max_dimension_px on its longest side, under max_bytes, with metadata stripped, then PUT the raw bytes to put_urls[i] (e.g. `curl -X PUT -H 'Content-Type: image/webp' -H 'apikey: …' --data-binary @0.webp '<put_url>'`), and call products.createFromUpload with upload_id. Resollo never converts photos: if you can't produce such files, let the seller use the photo picker or upload_url. Only returned for upload: 'direct' (and always over REST).",
                "properties": {
                  "expires_in_seconds": {
                    "type": "number"
                  },
                  "headers": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Send these headers with every PUT.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "put_urls": {
                    "description": "One signed URL per photo slot, in photo order (index 0 is the cover). Upload with HTTP PUT.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "requirements": {
                    "additionalProperties": false,
                    "properties": {
                      "format": {
                        "const": "image/webp",
                        "type": "string"
                      },
                      "max_bytes": {
                        "type": "number"
                      },
                      "max_dimension_px": {
                        "type": "number"
                      }
                    },
                    "required": ["format", "max_bytes", "max_dimension_px"],
                    "type": "object"
                  }
                },
                "required": ["expires_in_seconds", "headers", "put_urls", "requirements"],
                "type": "object"
              },
              "max_images": {
                "description": "How many photos the seller's plan allows per listing.",
                "type": "number"
              },
              "status": {
                "const": "awaiting_photos",
                "type": "string"
              },
              "upload_id": {
                "description": "Identifies this upload; pass it to products.createFromUpload after a direct upload. Only returned for upload: 'direct' (and always over REST).",
                "type": "string"
              },
              "upload_url": {
                "description": "Resollo page where the seller can pick the photos instead (signed in on resollo.com; phone gallery or camera works too). Give it to the user if your client didn't show Resollo's photo picker panel. It is not tied to this call: an upload there creates its own draft -- find it with sellers.listings.",
                "type": "string"
              }
            },
            "required": ["max_images", "status", "upload_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
