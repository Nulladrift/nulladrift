{
  "lockfileVersion": 2,
  "subjects": {
    "com.resollo/agent-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.resollo.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "resollo-agent-api",
        "title": "Resollo Agent API",
        "version": "3.3.11",
        "description": "Resollo marketplace: search, seller lookup, offers, orders, draft listings. All human-approved.",
        "websiteUrl": "https://www.resollo.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for searching the Resollo marketplace, looking up a seller's public profile, reading the marketplace taxonomy/metadata, reserving products on a buyer's behalf, creating new listings from a seller's photos, checking a seller's current listing status, bargaining (make/respond to offers), tracking and reacting to order status, checking out a dispatched order, and reading/asking product Q&A and reviews. Call marketplace.info once up front for the numeric category ids, condition codes, and supported currencies rather than guessing them. Use products.search's seller_id filter (with a seller id from products.get or sellers.get) to list everything one seller offers. Use orders.list, offers.list and sellers.listings to see the authenticated user's own orders, offers and listings (orders.list and offers.list cover both buyer and seller side when role is omitted) -- sellers.listings is also how you recover a products.create draft's id later, since those drafts stay in state 'inactive'. orders.place only ever creates a RESERVED order -- it never charges a payment method. products.create only ever creates an INACTIVE draft listing from photos, using Resollo's own AI to generate the content -- it never goes live automatically; the seller must review and activate it themselves. The seller picks the photos in the Resollo photo picker that products.create opens. To create a listing, use products.create only -- never fill in Resollo's web listing form with a browser or other automation; Resollo's AI policy does not allow third-party AI form-filling. Call sellers.status before products.create to check plan limits, payment/shipment method setup, and AI credit balance upfront. offers.make/offers.respond never move money -- accepting an offer only creates a confirmed order, payment still happens afterwards through the normal flow. orders.reject only works while an order is still RESERVED (before any payment). orders.checkoutLink never charges a payment method either -- it only returns a Stripe-hosted checkout URL a human must open and pay through themselves. Payment always requires the human buyer to complete checkout themselves on resollo.com.",
      "tools": [
        {
          "name": "marketplace.info",
          "title": "Get Resollo marketplace taxonomy and metadata",
          "description": "Returns the static reference data an agent needs to build valid searches and read responses without guessing: the numeric category ids and their keys/English names (use these for search's category filter), the condition codes, the list of supported ISO currency codes and the fallback default currency (search and product tools default to the caller's own currency when known), the payment- and shipment-method codes, the available sort options, the max search page size, and policy URLs (AI policy, OpenAPI spec). The photo limit per listing depends on the seller's plan -- see sellers.status max_images. Read-only, no authentication required. Safe to call once and cache for the session.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "categories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "number"
                    },
                    "key": {
                      "type": "string"
                    },
                    "name_en": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "key", "name_en"],
                  "type": "object"
                },
                "type": "array"
              },
              "conditions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "name_en": {
                      "type": "string"
                    },
                    "value": {
                      "type": "number"
                    }
                  },
                  "required": ["key", "name_en", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "currencies": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "default_currency": {
                "description": "Last-resort fallback only, used when the caller's currency can't be determined. A signed-in caller gets prices in their own currency (sellers.status.currency); an anonymous one in a currency derived like on the website (country, then browser language).",
                "type": "string"
              },
              "limits": {
                "additionalProperties": false,
                "properties": {
                  "search_max_limit": {
                    "type": "number"
                  }
                },
                "required": ["search_max_limit"],
                "type": "object"
              },
              "payment_methods": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "policy_urls": {
                "additionalProperties": false,
                "properties": {
                  "ai_policy": {
                    "type": "string"
                  },
                  "openapi_spec": {
                    "type": "string"
                  }
                },
                "required": ["ai_policy", "openapi_spec"],
                "type": "object"
              },
              "shipment_methods": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sort_options": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["categories", "conditions", "currencies", "default_currency", "limits", "payment_methods", "policy_urls", "shipment_methods", "sort_options"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4f374d293523be1f6598d4b1aac033a8309a4b1c6555fdc9d4faa7beb3f4f87"
        },
        {
          "name": "offers.list",
          "title": "List the authenticated user's own Resollo offers",
          "description": "Returns the caller's most recent Make-an-Offer / bargaining offers. Pass role: 'buyer' for offers you sent, or role: 'seller' for offers received on your own listings; omit role for both. Optionally filter to a single state (pending / accepted / rejected / countered / buyer_accepted / expired). Each entry has the product, the offered price, the seller's counter price if any, and timestamps. Read-only, no side effects. Requires a signed-in Resollo user (OAuth sign-in, or an 'Authorization: Bearer <agent api key>' header).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of most-recent offers to return (1-50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "role": {
                "description": "Whose side to list from: 'buyer' returns offers you sent, 'seller' returns offers received on your listings. Omit for both, newest first (each entry's role says which side it is).",
                "enum": ["buyer", "seller"],
                "type": "string"
              },
              "state": {
                "description": "Optional filter to a single offer state. When omitted, offers in every state are returned.",
                "enum": ["pending", "accepted", "rejected", "countered", "buyer_accepted", "expired"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": ["number", "null"]
              },
              "offers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "counter_price": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "amount": {
                              "type": "number"
                            },
                            "currency": {
                              "type": "string"
                            }
                          },
                          "required": ["amount", "currency"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "created_at": {
                      "type": ["string", "null"]
                    },
                    "expires_at": {
                      "type": ["string", "null"]
                    },
                    "offer_id": {
                      "type": "string"
                    },
                    "offered_price": {
                      "additionalProperties": false,
                      "properties": {
                        "amount": {
                          "type": "number"
                        },
                        "currency": {
                          "type": "string"
                        }
                      },
                      "required": ["amount", "currency"],
                      "type": "object"
                    },
                    "product_id": {
                      "type": "string"
                    },
                    "product_name": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["buyer", "seller"],
                      "type": "string"
                    },
                    "state": {
                      "enum": ["pending", "accepted", "rejected", "countered", "buyer_accepted", "expired"],
                      "type": "string"
                    }
                  },
                  "required": ["counter_price", "created_at", "expires_at", "offer_id", "offered_price", "product_id", "product_name", "role", "state"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "offers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72540c1d499495ffba59e2bb61d5d4269deb1932422c60013426b0f294a8b0f4"
        },
        {
          "name": "offers.make",
          "title": "Make an offer (bargain) on a Resollo product",
          "description": "Submits a price offer (Make an Offer / bargaining) on a fixed-price Resollo listing, on behalf of the authenticated buyer. Only works on fixed-price listings where the seller has offers enabled and a fully active Stripe Connect account -- never on auctions. A product can only have one active offer at a time; if it's currently locked by someone else's in-flight offer, or isn't otherwise eligible, this returns product_not_eligible. This does NOT move any money -- it only creates a PENDING offer the seller must respond to (see offers.respond). Requires a signed-in Resollo user (OAuth sign-in, or an 'Authorization: Bearer <agent api key>' header).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency_code": {
                "description": "ISO 4217 code for offered_price. Defaults to the product's own listing currency if omitted.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "offered_price": {
                "description": "The price the buyer offers, in `currency_code` (or the listing's own currency if that is omitted).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "product_id": {
                "description": "The uuid of the fixed-price listing to bid on.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["offered_price", "product_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "created_at": {
                "type": "string"
              },
              "offer_id": {
                "type": "string"
              },
              "offered_price": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "currency": {
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "product_id": {
                "type": "string"
              },
              "state": {
                "const": "pending",
                "type": "string"
              }
            },
            "required": ["created_at", "offer_id", "offered_price", "product_id", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8e5bfd6a74d65ad1357f137277d8726c2fe9755bcba272350a2554e03c91eb14"
        },
        {
          "name": "offers.respond",
          "title": "Respond to a Resollo offer",
          "description": "Responds to a pending Make an Offer / bargaining offer. If the caller is the SELLER of the offer, action must be 'accept', 'reject', or 'counter' (counter_price required for 'counter') and the offer must currently be pending. If the caller is the BUYER, action must be 'accept_counter' and the offer must currently be countered. Accepting an offer or a counter-offer immediately creates a confirmed order at the agreed price -- it does NOT charge any payment method, the buyer still completes payment themselves afterwards through the normal flow, exactly like after orders.place. Requires a signed-in Resollo user (OAuth sign-in, or an 'Authorization: Bearer <agent api key>' header).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "description": "Seller actions on a pending offer: accept | reject | counter (counter_price required). Buyer action on a countered offer: accept_counter.",
                "enum": ["accept", "reject", "counter", "accept_counter"],
                "type": "string"
              },
              "counter_price": {
                "description": "The seller's counter-offer price. Required when action is `counter`.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "offer_id": {
                "description": "The uuid of the offer to respond to.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["action", "offer_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "offer_id": {
                "type": "string"
              },
              "state": {
                "enum": ["accepted", "rejected", "countered", "buyer_accepted"],
                "type": "string"
              }
            },
            "required": ["offer_id", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e0886b75c7a8a4ff3ada303a1766f2a28dc9259dad870c31feff6f5358dff8bb"
        },
        {
          "name": "orders.checkoutLink",
          "title": "Get a Stripe checkout link for a dispatched Resollo order",
          "description": "Creates and returns a Stripe-hosted checkout URL for a DISPATCHED, not-yet-paid order, on behalf of the BUYER -- exactly what the 'Pay with Stripe' button on the Resollo order page does. This tool NEVER charges any payment method and NEVER completes a payment itself -- it only produces a link. The human buyer must open that URL themselves and complete payment on Stripe's own hosted page. Never tell the user their order is 'paid' after calling this tool -- give them the link and tell them they still need to complete payment there. Fails with not_ready_for_payment if the seller hasn't dispatched the order yet, or already_paid if it's already been paid. Requires a signed-in Resollo user (OAuth sign-in, or an 'Authorization: Bearer <agent api key>' header).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "orderId": {
                "description": "The uuid of the dispatched, not-yet-paid order.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checkout_url": {
                "type": "string"
              },
              "order_id": {
                "type": "string"
              }
            },
            "required": ["checkout_url", "order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6b8fb240c2a4ffd07458ac432577e72818ad90c865a5bebb2f3b3ecd0839c065"
        },
        {
          "name": "orders.list",
          "title": "List the authenticated user's own Resollo orders",
          "description": "Returns the caller's most recent orders. Pass role: 'buyer' for orders you placed, or role: 'seller' for orders on your own listings; omit role for both. Each entry has the same decoded status booleans as orders.status (reserved / dispatched / paid / received / rejected / closed), plus the product name, item count, total price (converted to the requested currency, default: your own), the other party's name, and a link to the order page. Read-only, no side effects. Requires a signed-in Resollo user (OAuth sign-in, or an 'Authorization: Bearer <agent api key>' header).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "ISO 4217 code for the returned price fields. Same default as in search_products (the caller's own currency, else derived like on the website, else marketplace.info default_currency).",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of most-recent orders to return (1-50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "role": {
                "description": "Whose side to list from: 'buyer' returns orders you placed, 'seller' returns orders on your listings. Omit for both, newest first (each entry's role says which side it is).",
                "enum": ["buyer", "seller"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": ["number", "null"]
              },
              "orders": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "closed": {
                      "type": "boolean"
                    },
                    "completed_at": {
                      "type": ["string", "null"]
                    },
                    "counterparty": {
                      "type": ["string", "null"]
                    },
                    "created_at": {
                      "type": ["string", "null"]
                    },
                    "dispatched": {
                      "type": "boolean"
                    },
                    "item_count": {
                      "type": "number"
                    },
                    "order_id": {
                      "type": "string"
                    },
                    "paid": {
                      "type": "boolean"
                    },
                    "product_name": {
                      "type": "string"
                    },
                    "received": {
                      "type": "boolean"
                    },
                    "rejected": {
                      "type": "boolean"
                    },
                    "reserved": {
                      "type": "boolean"
                    },
                    "role": {
                      "enum": ["buyer", "seller"],
                      "type": "string"
                    },
                    "total_price": {
                      "additionalProperties": false,
                      "properties": {
                        "amount": {
                          "type": "number"
                        },
                        "currency": {
                          "type": "string"
                        }
                      },
                      "required": ["amount", "currency"],
                      "type": "object"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["closed", "completed_at", "counterparty", "created_at", "dispatched", "item_count", "order_id", "paid", "product_name", "received", "rejected", "reserved", "role", "total_price", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "orders"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:711a694bdeadefd7bdf1c8b1ea324717b2fb4f88866f29de94835428554fc0e5"
        },
        {
          "name": "orders.place",
          "title": "Reserve a Resollo product",
          "description": "Creates a RESERVATION for the given product -- it does NOT complete a purchase and does NOT charge any payment method. After calling this tool, a human (the buyer) MUST log in to Resollo and complete payment manually through the normal checkout flow (Stripe-hosted checkout page, or cash-payment confirmation). Never tell the user their order is 'placed' or 'paid' after calling this tool -- tell them the item is reserved and they need to complete payment themselves at resollo.com to finalize it. Only fixed-price listings can be reserved this way (not auctions). Requires a signed-in Resollo user (OAuth sign-in, or an 'Authorization: Bearer <agent api key>' header). The buyer must have explicitly approved this specific order before you call this tool (confirm must be true).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address_key": {
                "description": "Key of one of the buyer's own saved addresses (never a free-text address). Required unless shipment_method is `personal`; defaults to the buyer's active address when omitted.",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "comment": {
                "description": "Optional note to the seller, attached to the order chat.",
                "maxLength": 500,
                "type": "string"
              },
              "confirm": {
                "const": true,
                "description": "Human-confirmation gate. Must be true, and only set it after the user has explicitly approved this specific order having seen the payment-safety text. An agent must never set this on its own initiative.",
                "type": "boolean"
              },
              "currency": {
                "description": "Informational only, used solely to detect a currency mismatch worth surfacing to the buyer (payment_safety.currency_mismatch). Does NOT change what gets charged -- the order is always recorded and settled in the listing's own native currency regardless of this value.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "payment_method": {
                "description": "How buyer and seller will settle payment off-platform. Must be one the seller accepts (see get_product.seller.accepted_payment_methods).",
                "enum": ["cash", "card", "bank", "paypal", "stripe"],
                "type": "string"
              },
              "product_id": {
                "description": "The uuid of the fixed-price listing to reserve.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "Units to reserve (1-20, default 1).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "shipment_method": {
                "description": "How the item will be handed over. Must be one the seller accepts (see get_product.seller.accepted_shipment_methods).",
                "enum": ["personal", "courier", "postal", "locker"],
                "type": "string"
              }
            },
            "required": ["confirm", "payment_method", "product_id", "shipment_method"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "created_at": {
                "type": "string"
              },
              "order_id": {
                "type": "string"
              },
              "payment_method": {
                "enum": ["cash", "card", "bank", "paypal", "stripe"],
                "type": "string"
              },
              "payment_safety": {
                "additionalProperties": false,
                "properties": {
                  "currency_mismatch": {
