        {
          "name": "products.search",
          "title": "Search Resollo products",
          "description": "Search active, publicly available product listings on the Resollo marketplace. Use this to browse or filter by keyword (matched at the start of a word: 'phone' finds 'phones' but not 'headphone'), category, price range, currency, or seller location. Returns only currently active, purchasable listings (never sold, expired, or moderation-hidden ones). For full details on one specific product you already have the ID for (including its Semantic Profile fields -- suitable_for, not_ideal_for, target_audience, key_strengths, evokes, is_similar_to -- which this search tool does NOT return), call products.get instead. Results are paginated via next_cursor; pass it back as the cursor argument to fetch the next page. count is the total number of matching listings across all pages, not the number returned on this page. No authentication required.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Numeric top-level category id (see getMarketplaceInfo.categories). Subcategory ids are accepted but rolled up to their top-level parent in the response.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "currency": {
                "description": "ISO 4217 code used for price filtering and each result's converted_price. Defaults to the signed-in caller's own currency; for an anonymous caller it's derived like on the website (country, then browser language), falling back to marketplace.info default_currency. Must be one of getMarketplaceInfo.currencies.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque pagination cursor from a previous response's next_cursor.",
                "maxLength": 2000,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of results to return per page (1-50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Comma-separated seller-location filters. Each entry is a 2-letter ISO country code (\"HU\") or a \"COUNTRY:REGION\" pair (\"HU:BU\"). Reflects the seller's profile location, not a per-listing field.",
                "maxLength": 200,
                "type": "string"
              },
              "price_max": {
                "description": "Maximum price in the resolved `currency`.",
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Minimum price in the resolved `currency` (converted price, not the seller's native currency).",
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Free-text search across the listing's canonical name and description, matched at the start of a word: 'phone' finds 'phone' and 'phones' but not 'headphone'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "seller_id": {
                "description": "Restrict results to one seller's listings. The uuid is the seller.id from any search or getProduct result.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "sort": {
                "default": "newest",
                "description": "Result ordering. Never influenced by paid placement.",
                "enum": ["newest", "price_asc", "price_desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Total number of matching listings across all pages (exact when the query is narrowed, an estimate otherwise) -- not the number returned on this page.",
                "type": ["number", "null"]
              },
              "next_cursor": {
                "description": "Pass as `cursor` to get the next page; null when this is the last page.",
                "type": ["string", "null"]
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "auction_ends_at": {
                      "type": ["string", "null"]
                    },
                    "category": {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "type": "number"
                        },
                        "key": {
                          "type": "string"
                        },
                        "name_en": {
                          "type": "string"
                        }
                      },
                      "required": ["id", "key", "name_en"],
                      "type": "object"
                    },
                    "condition": {
                      "additionalProperties": false,
                      "properties": {
                        "key": {
                          "type": "string"
                        },
                        "name_en": {
                          "type": "string"
                        },
                        "value": {
                          "type": "number"
                        }
                      },
                      "required": ["key", "name_en", "value"],
                      "type": "object"
                    },
                    "converted_price": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "amount": {
                              "type": "number"
                            },
                            "currency": {
                              "type": "string"
                            }
                          },
                          "required": ["amount", "currency"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "created_at": {
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image_url": {
                      "type": ["string", "null"]
                    },
                    "listing_type": {
                      "enum": ["fixed_price", "auction"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price": {
                      "additionalProperties": false,
                      "properties": {
                        "amount": {
                          "type": "number"
                        },
                        "currency": {
                          "type": "string"
                        }
                      },
                      "required": ["amount", "currency"],
                      "type": "object"
                    },
                    "quantity_available": {
                      "type": "number"
                    },
                    "seller": {
                      "additionalProperties": false,
                      "properties": {
                        "alias": {
                          "type": ["string", "null"]
                        },
                        "country_code": {
                          "type": ["string", "null"]
                        },
                        "id": {
                          "type": "string"
                        },
                        "is_verified": {
                          "type": "boolean"
                        },
                        "region_code": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["alias", "country_code", "id", "is_verified", "region_code"],
                      "type": "object"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["auction_ends_at", "category", "condition", "converted_price", "created_at", "description", "id", "image_url", "listing_type", "name", "price", "quantity_available", "seller", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "next_cursor", "products"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e7aa2a806461bacec9a80753c22b2a93bb72592650ebba982adaf6b1882ca06"
