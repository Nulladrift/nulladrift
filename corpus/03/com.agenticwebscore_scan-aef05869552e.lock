{
  "lockfileVersion": 2,
  "subjects": {
    "com.agenticwebscore/scan": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agenticwebscore.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "com.agenticwebscore/scan",
        "title": "AgenticWebScore",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call scan_site with a domain to measure it, or get_score to read a stored scan record without a new scan. get_report returns the record as markdown, or one check of it. list_checks lists the scored and unscored checks of the rubric. New scans are limited to 10 per client per minute and 3 running at once.",
      "tools": [
        {
          "name": "get_report",
          "title": "Read a report",
          "description": "Return the markdown status report of a host's stored scan record, or one check of it by check id. It starts no scan.",
          "inputSchema": {
            "properties": {
              "check": {
                "description": "A check id, for example \"llms-txt\". Leave it out for the whole report.",
                "type": "string"
              },
              "host": {
                "description": "Domain, host:port, or origin of a scanned site, for example \"example.com\".",
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98980f55d64399a5374bf2b9c1c07743a18f4663b1e888df7a03324e2fdbf90a"
        },
        {
          "name": "get_score",
          "title": "Read a stored score",
          "description": "Return the stored scan record for a host. It starts no scan. A host with no stored record is answered with an error that says so.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "Domain, host:port, or origin of a scanned site, for example \"example.com\".",
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a stored score"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c0042ef283e8f3c923793dff4e562dd6bb8773cf886a5160b3405a95ecfe332"
        },
        {
          "name": "list_checks",
          "title": "List the checks",
          "description": "List the 60 checks of rubric v0.9.1 across 5 dimensions, each with its kind, module, dimension, and rationale. A scored check also has a part, a tier and a weight. An unscored check earns 0 points.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the checks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:556dbbab5368db0c5db628abc9f2048763c677668b40e509256729a0f07dc976"
        },
        {
          "name": "scan_site",
          "title": "Scan a site",
          "description": "Scan a public domain and return the full scan record: score and its two parts, level, per-check status, evidence, and fingerprint. A stored record younger than 6 hours is returned without a new scan, unless fresh is true. New scans are limited to 10 per client per minute and 3 running at once. A new scan runs for up to 60 s. If the call times out first, the scan still finishes and is stored, and a later call returns it.",
          "inputSchema": {
            "properties": {
              "fresh": {
                "description": "Scan again instead of returning a stored record younger than 6 hours (default false).",
                "type": "boolean"
              },
              "target": {
                "description": "Domain or URL to scan, for example \"example.com\".",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Scan a site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0ddd93d142c3efcdef2e3eb8037e28acfe449b53114df9742326a4c428135081"
        }
      ],
      "digest": "sha256:ecf91a3eb8e2da962300e852135ed456786c348a3d3114c02425cd52ef26ba83"
    }
  }
}
