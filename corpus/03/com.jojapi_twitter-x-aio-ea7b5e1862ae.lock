        {
          "name": "get_search_searchTerm",
          "title": "Search",
          "description": "With the search endpoint you can search all of twitter. You just need to provide a search term. ⚠ If you have a large cursor the GET-request will limit at some length. For that you can use a POST-request which has no limits. Billing per call: 1 Credits. Agents can pay per call ($0.01 via x402/MPP, no API key).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "ENUM\nTop,Latest,People,Photos,Videos",
                "example": "Latest",
                "title": "category",
                "type": "string"
              },
              "count": {
                "description": "The default count is 20. You can specify a custom one here.",
                "example": "20",
                "title": "count",
                "type": "string"
              },
              "cursor": {
                "description": "At the end of the entries array you'll find two objects with the type TimelineTimelineCursor. There is one cursor to go up (Top) and one for going down (bottom) the list.",
                "title": "cursor",
                "type": "string"
              },
              "filters": {
                "description": "Learn more about all filters by reading the docs or contact me on telegram @benagain :)",
                "example": "{\"since\": \"2020-10-01\"}",
                "title": "filters",
                "type": "string"
              },
              "includeTimestamp": {
                "description": "Decide if you need a unix created_at timestamp. This will slightly increase the speed of the request.",
                "example": "false",
                "title": "includeTimestamp",
                "type": "string"
              },
              "searchTerm": {
                "type": "string"
              }
            },
            "required": ["searchTerm"],
            "type": "object"
