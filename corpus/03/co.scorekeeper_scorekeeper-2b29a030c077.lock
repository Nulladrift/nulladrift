        {
          "name": "create_scoreboard",
          "title": "Create a scoreboard",
          "description": "Create a public, shareable two-team scoreboard at zero. Requires explicit user intent to create; title and team names are public. Works without signing in: the result then includes a private claim.url (valid up to seven days) for the person who will keep score; it lets them score in the browser and keep the board. Share links.spectator with viewers. A board made without a connection cannot be updated by later tool calls; connect an account first if you need to keep score. Free boards allow 50 total spectator views and show branding. With a connection, retry the identical requestId and input after a timeout; without one, a retry creates another board.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "requestId": {
                "pattern": "^[A-Za-z0-9_-]{8,128}$",
                "type": "string"
              },
              "teams": {
                "items": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "name": {
                        "$ref": "#/properties/title"
                      }
                    },
                    "required": ["name"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "name": {
                        "$ref": "#/properties/title"
                      }
                    },
                    "required": ["name"],
                    "type": "object"
                  }
                ],
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              },
              "title": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["requestId", "teams", "title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "capabilities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "claim": {
                "additionalProperties": false,
                "properties": {
                  "expiresAt": {
                    "type": "number"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["expiresAt", "url"],
                "type": "object"
              },
              "connection": {
                "const": "guest",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "limits": {
                "additionalProperties": false,
                "properties": {
                  "spectatorViews": {
                    "type": ["number", "null"]
                  },
                  "watermark": {
                    "type": "boolean"
                  }
                },
                "required": ["spectatorViews", "watermark"],
                "type": "object"
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "manage": {
                    "type": ["string", "null"]
                  },
                  "overlay": {
                    "type": "string"
                  },
                  "spectator": {
                    "type": "string"
                  }
                },
                "required": ["manage", "overlay", "spectator"],
                "type": "object"
              },
              "revision": {
                "type": "string"
              },
              "teams": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    }
                  },
                  "required": ["id", "name", "score"],
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["capabilities", "id", "limits", "links", "revision", "teams", "title"],
            "type": "object"
          },
