        },
        {
          "name": "search_entries",
          "title": "Search the map",
          "description": "Search entries (terms, tools, organizations, investors, programs, schools, user groups, places) by name, alias or rough spelling. Returns the best matches with a one-line summary and the id to pass to get_entry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kinds": {
                "description": "Only entries of all these kinds, e.g. ['investor'].",
                "items": {
                  "enum": ["concept", "tool", "organization", "investor", "user-group", "nonprofit", "program", "place", "school", "government"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, e.g. 'SAFE note' or 'venture studio'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
