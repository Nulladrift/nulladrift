        "name": "tulsa-ecosystem-map",
        "title": "Tulsa Ecosystem Map",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "A plain-language map of the Tulsa and Oklahoma tech ecosystem for founders building an AI company: the standard terms, the well-established tools, and the local organizations, investors, programs and user groups, with how they connect. Use search_entries to find a term, tool, organization, investor, program or place by name or rough spelling; get_entry for its definition, example, published application status and check date, official site, public connections and sources; list_open_opportunities for currently checked intakes; list_categories, get_category, list_kinds and get_kind to browse. Connections are limited to what the organizations announced publicly. Not legal, tax or financial advice.",
      "tools": [
        {
          "name": "get_category",
          "title": "Browse a category",
          "description": "List the entries in one category, Tulsa entries first, then by connections, with a one-line summary each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A category id from list_categories, e.g. 'fundraising'.",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58b1eb6aa4bd09ff2b1c7dba944d8ead74e53e63f9e7902a5dff3af2c79692a0"
        },
        {
          "name": "get_entry",
          "title": "Read an entry",
          "description": "Get one entry by id: its definition, example, published funding evidence with source URLs, computed application status, eligibility and last check, official site, public connections and their sources, and its page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An entry id from search_entries, e.g. 'techlahoma'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0355fa634d3bc98ea6d58b141914263ff5abfea676ba6c0a5e68a43a2929867d"
        },
        {
          "name": "get_kind",
          "title": "Browse a kind",
          "description": "List entries of one kind, Tulsa entries first, then by connections, with a one-line summary each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "enum": ["investor", "organization", "nonprofit", "program", "school", "government"],
                "type": "string"
              },
              "limit": {
                "default": 50,
