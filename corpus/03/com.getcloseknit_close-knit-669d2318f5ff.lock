              },
              "rent_period": {
                "default": "month",
                "description": "[option] The rent's period: month = £ per calendar month, week = £ per week (converted ×52/12 for the comparison).",
                "enum": ["month", "week"],
                "title": "Rent Period",
                "type": "string"
              },
              "share_percent": {
