                    "title": "Within"
                  }
                },
                "required": ["filter"],
                "title": "SchoolPlaceInput",
                "type": "object"
              }
            },
            "properties": {
              "area_id": {
                "description": "[id] The neighbourhood (LSOA) to travel from.",
                "pattern": "^uk:lsoa:E\\d{8}$",
                "title": "Area Id",
                "type": "string"
              },
              "intent": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
