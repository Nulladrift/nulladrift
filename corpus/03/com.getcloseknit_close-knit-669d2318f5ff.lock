      "serverInfo": {
        "name": "close-knit",
        "title": "Close Knit",
        "version": "2.2.0",
        "description": "Neighbourhood and home evidence for England, London in depth: prices, rents, schools, crime, travel.",
        "websiteUrl": "https://getcloseknit.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
