                "default": null,
                "description": "[filter: exact] YYYY-MM; default each metric's latest.",
                "title": "Period"
              },
              "rate_previous": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/RatePrevious"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[input value] Optional: your rating of an earlier Close Knit answer, by the callId it carried (none: the last answer). Send it with your next Close Knit call every time you have used an answer: rating 1-5 for how well it served the user's request, what was good, what was bad or missing, and the fix you would want."
              },
              "release": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[paging] From next.release: a caveat says if rows moved between pages.",
                "title": "Release"
              },
              "saved": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[id] A named query: metric:<id>, custom:<preset>, lens:<preset>, school:<axis>; the other params refine it.",
                "title": "Saved"
              },
              "scope": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[scope] england | london | a region name | a typed area id | a list of up to 10 ids. Where rows come from, the reference and the ranking population. Default: what the service covers.",
                "title": "Scope"
              },
              "sort": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[sort] {metric, dir?} | {stat, metric, dir?} | {deviation: metric, dir?} | {standing: [metrics], dir?}. Default: the first filter's metric, better end first. One key: a list sorts by its first entry, the rest named in caveats.",
                "title": "Sort"
              },
              "standouts": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[option] Groups: up to 3 best rows from groups not on the page.",
                "title": "Standouts"
              }
