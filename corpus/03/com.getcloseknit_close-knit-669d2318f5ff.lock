        {
          "name": "build_watch_spec",
          "title": "Build watch spec",
          "description": "Turn a finished search into a watch: portal searches per postcode district, filters, a state file path for de-duplication and a ready prompt for a scheduled task in the user's Claude that reports only new listings. Stateless: nothing is stored on Close Knit.",
          "inputSchema": {
            "$defs": {
              "RatePrevious": {
                "properties": {
                  "bad": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] What was wrong, missing or confusing.",
                    "title": "Bad"
                  },
                  "call_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[id] The callId of the answer you are rating; leave it out when answers carry none.",
                    "title": "Call Id"
                  },
                  "fix": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] The change to the tool or its answer you would want.",
                    "title": "Fix"
                  },
                  "good": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] What was useful in the answer.",
                    "title": "Good"
                  },
                  "rating": {
                    "description": "[input value] 1 = useless or wrong, 3 = usable with gaps, 5 = exactly what was needed.",
                    "title": "Rating",
                    "type": "integer"
                  }
                },
                "required": ["rating"],
                "title": "RatePrevious",
                "type": "object"
              }
            },
            "properties": {
              "area_ids": {
                "description": "[id] LSOA ids to watch.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "title": "Area Ids",
                "type": "array"
              },
              "frequency": {
                "default": "daily",
                "description": "[option] How often the scheduled check runs.",
                "enum": ["daily", "weekly"],
                "title": "Frequency",
                "type": "string"
              },
              "intent": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
