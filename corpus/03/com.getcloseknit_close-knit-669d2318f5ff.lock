                  "good": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] What was useful in the answer.",
                    "title": "Good"
                  },
                  "rating": {
                    "description": "[input value] 1 = useless or wrong, 3 = usable with gaps, 5 = exactly what was needed.",
                    "title": "Rating",
                    "type": "integer"
                  }
                },
                "required": ["rating"],
                "title": "RatePrevious",
                "type": "object"
              }
            },
            "properties": {
              "fields": {
                "anyOf": [
                  {
                    "items": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "additionalProperties": true,
                          "type": "object"
                        }
                      ]
                    },
                    "maxItems": 12,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[select fields] Facts per row: metric ids, or group stats {stat, metric}. Default: the filter and sort metrics.",
                "title": "Fields"
              },
              "filters": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "maxItems": 12,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[filter: range] Row conditions, ANDed: {metric, min?, max?} | {metric, pct_min?, pct_max?} | {metric, vs: above|below, ref?: scope|london|england, by?} | {metric, change: {years, min?, max?, unit?: abs|pct}} | {places: {category?, brand?, min?, max?, within_m?}} | {in: [ids]} | {not_in: [ids]} | {custom, min?, max?}. Schools: {phase} | {ofsted: [grades]} | {measure, min?, max?} | {near, within_m?}.",
                "title": "Filters"
              },
              "group_filters": {
                "anyOf": [
                  {
                    "items": {
