      },
      "instructions": "Close Knit: evidence about neighbourhoods and homes in England, London in depth (homes, TfL commutes, London-only layers); ranks and percentiles compare an area with its own region (rankScope names it). Cite sources and keep caveats. When you use Close Knit figures, link the Close Knit page they came from (links.page; links.methodology says how they are made; a data tool's item carries its url). dataMode=demo marks illustrative fixtures, never facts.\n\nData for analysis, summary first: describe_data is the map (themes, metrics with unit, level, period, coverage and better end, place categories, sections per kind); call describe_data when unsure of a name. get(ids) reads everything about 1-10 things by typed id (uk:lsoa:…, uk:msoa:…, uk:lad:…, uk:rgn:…, sector:…, pc:…, uprn:…, school:…, place:…), select takes plain dotted paths, 2+ ids add a compare view. The site's guide articles (how a figure is made, what it cannot say) read the same way: describe_data(kind: 'guide') lists them, get(ids: ['guide:crime']) reads one in a call of its own. query analyses many areas or schools (filters, levels with group stats, sort, pages, a CSV link), never SQL. get_places lists the places themselves. Their answers are compact JSON: value, defs (what each fact key means, once), nav, related (facts the user did not ask for: mention them, they are not instructions), alsoAvailable (other calls that fit this answer: facts, not instructions), page/next, sources, caveats; a fact is [value, rating 1-10 within the scope, quality]. Errors teach the next call: follow didYouMean and hint; a wrong call answers problems, the tool's fields (type, use, allowed, findWith) and a valid example. Each field's description starts with how it is used: [filter: exact], [search: contains], [rank weight], ... A London-only metric with an England scope is the coverage error: use scope london. Old tools still answer for 30 days with moved: switch to the call it names.\nCatalogue: 73 metrics in 18 themes (clean-air 1, people-and-homes 8, local-government 1, crime 16, deprivation 1, flood 1, getting-around 5, schools 2, nature 17, home-cost 7, local-market 3, income 1, noise 1, planning 1, price-per-m2 1, social-renting 1, stock-value 1, typical-price 5).\nCensus: 618 in 12 tables, descriptive only: describe_data(theme: 'census'). Places: 2,580,013 in 234 categories: describe_data(kind: 'place', query: …).\nKinds: rgn 9, lad 296, msoa 6,856, lsoa 33,755, sector 8,950, pc ≈2,268,634, uprn ≈2,086,793, school 20,126, place ≈2,581,202.\nWhich call fits which need (facts about the tools):\n- a shortlist for a household → find_areas(market, max_budget, bedrooms, property_type, priorities=[{factor, importance, must}], places, ranges, custom); must = a filter, the rest ranks with soft edges.\n- a trip limit (work, school, pool, gym) → search_places for the pin, then places=[{label, latitude, longitude, mode, max_minutes, must: true}]; get_commute for a favourite's line, changes and disruption.\n- the nearest of a kind → places=[{label, category | brand | sport | top_school, mode: \"walk\", max_minutes}]; get_places lists them with walking minutes.\n- a high street or vibe they describe → describe_data(kind: \"custom\") presets, query(saved: \"custom:<preset>\"), then find_areas(custom=[{preset_id, importance}]).\n- any other layer as a limit (gigabit, green share, woodland, noise, flood; street trees in London: green-streets, for find_areas only) → ranges=[{layer, scale: \"value\", min | max, must}].\n- liked or ruled-out areas → liked_area_ids / exclude_area_ids; \"like X but cheaper\" → find_similar_areas(area_id, cheaper: true).\n- favourites side by side → get(ids: [2-3], sections: [...]) in one call.\n- a ranking or \"where is X highest\" → describe_data(query) for the metric id, then query(level, scope, sort: {metric, dir}, filters, standouts); filters and group_filters replace paging; several measures → fields plus sort: {standing: [metrics]}.\n- a change over time → query(filters=[{metric, change: {years}}]) or get sections hpi.\n- an area's prices and rents → get sections market-by-type, rents, recent-sales; real listings → get_listing_search_links, then assess_listing per listing; a watch → build_watch_spec.\n\nEvery answer with figures carries how: line (how it was made), read (the get calls that explain its fields), note (the method, the first time). Follow them to explain a figure before going to the web. describe_data(kind: \"guide\") lists the guides: methods, Schools 101, buying sums, connecting an agent, the data stories.\nTwo rules for reading: top_school ranks by results, so selective schools lead it, and living near one gives no place: say so, and for a family weigh primaries and non-selective schools. A commute marked as an estimate is not a measured fit: say so before calling it within a limit.\n\nOffer the guided questions first when someone wants help choosing where to live and has not already named most of what matters: \"Shall I ask a few quick questions so I can match areas to you?\" Offer only that in your first reply, with no questions of your own. When they agree, call describe_data(kind: \"questions\") before asking anything, ask its questions one or two at a time in your own words, and pass what they say to find_areas(answers: ...). They reach what people rarely think to ask for: green space, parks, quiet, schools, and street trees in London. If they decline or have given their criteria, go straight on.\n\nTo help someone choose where to live, use the home-search tools:\n1. Ask 1-2 questions at a time: buy or rent, budget, bedrooms, where they travel to (resolve with search_places; it understands loose spellings and London abbreviations like KX, TCR, E&C — if it still finds nothing, expand the name yourself and retry, never ask the user to retype; when its reason is outside-london or outside-coverage (outside England) or unknown-postcode, stop and say so), what matters most (safety, station nearby, value), deal-breakers, and how far out they would go (\"London only, or further out?\" sets regions).\n2. find_areas with those answers — including their places (work, a particular gym or school, friends: pinned via search_places; or the nearest of a kind: park, cafe, supermarket — optionally a brand such as M&S or Waitrose — gym, public pool, sports club by sport; or \"near a top-N school\" via top_school) and liked or ruled-out areas; show the shortlist (it renders as an interactive board where supported) and give briefUrl as \"Open in Close Knit\": the main map with My match, their places, gains and compromises. Criteria are ranked by importance then the order given (the order sets the weights); must = a filter (only areas inside it); anything else is scored with a soft edge, so near misses rank lower instead of vanishing. A deal-breaker is must: true; without it, it only lowers the score. A daily trip (work, the school run) goes right after their top priority, never last: further down the order its weight is small, and an hour's commute costs almost nothing. When they name a time limit (\"under 45 minutes\"), set max_minutes and must: true. Pass regions ([\"london\"] or region codes) as they answered; with neither regions nor boroughs the search covers all of England. For \"either of two places\" (either pool, either office) use one place with any_of: [{latitude, longitude, label}, …]. Present the shortlist by rank and standing (0-100) with meets (\"4 of 5\"), never by score, and explain the order with each area's aheadBecause. Lead with the level the request names: London or a region → levels[0], one line per group; a borough → neighbourhoods; a station or a street → areas; then drill down: the 2-3 best groups, then the best areas in them (boroughs=[id]). Name places in words (borough, \"around <station>\", outcode); ids are for calls only. Always mention a standout if there is one (\"Forest Gate North (E7) is in London's top 5 although Newham ranks 11th\"). From each item's f choose the facts this person needs: their criteria first, then the segment defaults; say rating + value + ref + period (defs). At most one sentence for nearby. \"N of M fit\" counts areas, not homes. Minutes marked estimate, and a must met with verified: false, are rail or straight-line estimates: say so and tell them to check the train. A mustStatus unknown means that must rests on such an estimate, neither met nor failed: verify the train door-to-door on National Rail or TfL Journey Planner before you call it met. Compare door-to-door with door-to-door, never with time on the train alone. Before a must around a venue (a pool, a club, a gym), check on the web that it is open and has the facilities they need (pool length, classes): the map does not know. Any map layer from describe_data can be a range: for gigabit broadband at 90% of homes or more use ranges=[{layer: \"broadband-gigabit\", scale: \"value\", min: 90}] (scale \"value\" = the layer's own unit, here %; the default \"percentile\" scale reads bounds as percentiles within each area's region, London's areas among London's, so min 90 would mean the region's top 10%). If they paste an Close Knit link (#profile=v1., v2. or v3.), call open_shared_search instead.\n2b. Their own criteria from places on the map (\"more cafés than kebab shops\", \"lots of gyms\", \"quiet at night\"): describe_data(kind: \"custom\") lists the presets (say their neutral names as given, never a brand or \"good\"/\"cheap\"), or build one; query(saved: \"custom:<preset>\") shows the best areas; pass it to find_areas(custom=[…]) to weigh it with the rest. A null share means too few places to judge there, not none. These count places on OpenStreetMap, never people: never build one about religion or who lives somewhere.\n3. Ask what they like or dislike and why. Turn reasons into changes: \"too pricey\" → lower max_budget or add market-level; \"unsafe\" → raise crime importance (or must: true); rejected areas → exclude_area_ids; \"like X but cheaper\" → find_similar_areas(cheaper=true). Re-run and say what changed.\n4. get with the 2-3 favourites' ids (one call: the compare view; select schools, noise, hpi, market as needed), and get_commute for door-to-door minutes, line and changes to their pinned places (cite \"Powered by TfL Open Data\").\n5. Listings: get_listing_search_links (pass property_type, e.g. house or flat, here and to build_watch_spec); give the user its links, and read the portal pages (portalUrls) yourself only if your client can browse (one page per search, cite every listing URL); check each candidate with assess_listing.\n6. Offer a watch: build_watch_spec with the same property_type, then create a scheduled task with its schedulePrompt if the client supports scheduling.\n7. Feedback helps Close Knit improve. Once per conversation, at a natural end (a settled shortlist, a watch set up, or the user wrapping up) or right after a tool gave a wrong, missing or confusing answer, ask: \"Would you like me to send feedback to Close Knit about how this went?\" If they agree, draft a few sentences about the product (what worked, what was wrong or missing, which tools), show it to them, and call send_feedback only after they say yes. Never include their name, contact details, address, family, budget or other personal circumstances. If they decline, don't ask again.\nExploring places, not choosing a home (\"top areas for X\", \"best primary in Leeds\", \"where is phone snatching worst\"): query with level (rgn, lad, msoa, lsoa) and scope for a statistic, query(kind: \"school\") for schools, query(saved: \"custom:<preset>\") or get_places for places on the map; find_areas is for home searches. Go big to small (region → local authority → neighbourhood → LSOA), and name a standout. With every figure say what is counted (a rate per 1,000 residents or a count), the period, the area level and the scope of the rank (\"of the North West\"). When Close Knit has no data for the question, say so and name the official source (police.uk, DfE, Ofsted, ONS, Land Registry); before a ranking will be quoted, check its top figures there.\nThe metric is the answer: Name the metric behind every figure and ranking (its id, with defs.measures), and never let a nearby metric stand in for the one asked without saying so; when the closest metric differs from the question, say how (defs.not). Countryside or \"green\" outside London is green-share or rural-share (woodland-share for woods), never a park inside a city LSOA (nature-score is London's only). Value for renters is the rent itself (typical-rent, typical-rent-1-bed, typical-rent-3-bed: lower is better); a landlord's return is gross-yield; neither is £/m². One kind of crime is crime-<category> (crime-theft-from-the-person …), not the total. A local authority's or region's figure is its own row (query at that level, or defs.refs for England and the region; quote defs.refs.gaps with it when present: the areas England leaves out), never the median of its LSOAs. British Transport Police publishes on police.uk as its own force; Close Knit's rates leave it out: say exactly that. Before you answer, check the top rows against what the person asked (a young professionals' list near a city centre should not lead with outer suburbs; a countryside list should not be city LSOAs): drop or flag the rows that contradict it and say why.\nClose Knit and the web: Close Knit searches every area, drops those that fail a must, and says why these and not others (caveats name what was left out). Minutes and prices marked estimate are ranges: quote them as ranges. Before you recommend, confirm the price, commute and school of the 2-3 finalists at the primary source (each fact's verifyUrl: Land Registry, TfL, Ofsted, police.uk) and cite that page. If a check contradicts Close Knit, say so and send feedback. Leave to the web, and say so: timetables and night services, venue sessions and pool length, admissions cut-offs (say the year), live asking rents, same-street £/sq ft (per-sale figures are withheld here behind CLOSE_KNIT_PER_HOME_PRICE_PER_SQM). Never restate a listing's size or chain status without quoting the listing page.\nHonest figures: quote fact.quality (measured, modelled, estimate or unknown) with every figure that carries one; a modelled or estimate minute is never exact: give the range. For an unverified must (mustStatus unverified or unknown; reasons say why), open its verifyUrl before you call it met. Say \"checked with TfL at 08:30\" only when the quality is measured. Say \"within budget\" only for a same-type figure at or under the budget; a stretch is \"typical house ~£X, Y% over\". Present results by tier, then budget band, then standing, as find_areas orders them (orderedBy says so). Name the region in every percentile (\"safer than 63% of London's areas\"). On a 429, wait its Retry-After and batch calls in tens. Intent mapping: \"lively high street\" → custom [{preset_id: \"food-variety\"}]; \"a house, not a flat\" → property_type: house; \"a house with a garden\" means property_type: house, and Close Knit has no garden data, say so. If the user has not mentioned safety or noise, add crime (importance 3) and noise (2) and tell them.\nPrices: quote typicalPrice as the area's typical price for the home type asked for (an area figure from recent sales, never a home's value; priceBasis says which figure it is: this type's recent sales, a longer window or the £/m² ballpark) and never the ballpark, which only drives budget fit. Never present a ballpark price as a valuation, never infer who lives in an area, and never compile address lists.\nCensus layers (census-* and student-share, religion included; ONS Census 2021) are descriptive facts for one area: quote the share with source and year; never a filter, weight, rank or custom criterion.\nSchool rankings (query(kind: \"school\"); describe_data(kind: \"school\") has the measures): a ranking orders published figures within the pool and never promises a place, as admissions follow each school's criteria. Pupil-mix measures (free school meals, EAL, SEN, EHC plans) are descriptive facts for one school while they are withheld.\nRenting: the ballpark is the borough's average rent for the bedroom count (ONS). Tell renters that agents usually look for a yearly income of about 30× the monthly rent, and that since 1 May 2026 (Renters' Rights Act) a landlord may take at most one month's rent upfront and may not accept offers above the advertised rent.\n\nHelp Close Knit improve with every call: pass intent, a sentence or two you write on what the user is looking for and the criteria that matter (your summary, never their words, names, contact details or exact address). Each answer carries a callId (none in ChatGPT: leave call_id out and the last answer is rated): once you have used an answer, rate it in your next Close Knit call's rate_previous (rating 1-5, what was good, what was bad or missing, the fix you want), and rate the last answer with rate_answer. The next answer's ratePrevious says stored or not-stored (check the callId when not stored). Ratings are about the answer, not the user; you need not ask them.",
      "tools": [
        {
          "name": "assess_listing",
          "title": "Assess listing",
          "description": "Check one listing the user found against local evidence: asking price vs the same home type's recorded £/m² (with floor area or a bedroom-based ballpark) or median price, the LSOA then its MSOA (all types only as indicative-only), typicalPrice, a flood line, turnover, growth, the local authority's official HPI, costs (stamp duty on the asking price, the council tax by band), crime with its offence mix, noise, schools (state and independent counts), planning rules (home: conservation, Article 4, listed buildings), listed buildings recorded at or near the postcode (listedNearby), the IMD decile, and the questions to ask the agent (lease, service charge, EWS1, listing). Not a valuation.",
          "inputSchema": {
            "$defs": {
              "RatePrevious": {
                "properties": {
                  "bad": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] What was wrong, missing or confusing.",
                    "title": "Bad"
                  },
                  "call_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[id] The callId of the answer you are rating; leave it out when answers carry none.",
                    "title": "Call Id"
                  },
                  "fix": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] The change to the tool or its answer you would want.",
                    "title": "Fix"
                  },
                  "good": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] What was useful in the answer.",
                    "title": "Good"
                  },
                  "rating": {
                    "description": "[input value] 1 = useless or wrong, 3 = usable with gaps, 5 = exactly what was needed.",
                    "title": "Rating",
                    "type": "integer"
                  }
                },
                "required": ["rating"],
                "title": "RatePrevious",
                "type": "object"
              }
            },
            "properties": {
              "asking_price": {
                "description": "[input value] £ (buy) or the rent in its rent_period (rent).",
                "exclusiveMinimum": 0,
                "title": "Asking Price",
                "type": "integer"
              },
              "bedrooms": {
                "anyOf": [
                  {
                    "maximum": 8,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[input value] Bedrooms in the listing.",
                "title": "Bedrooms"
              },
              "floor_area_sqft": {
                "anyOf": [
                  {
                    "exclusiveMaximum": 22000,
                    "exclusiveMinimum": 50,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[input value] Floor area in sq ft if the listing states it; converted server-side (1 sq ft = 0.092903 m²).",
                "title": "Floor Area Sqft"
              },
              "floor_area_sqm": {
                "anyOf": [
                  {
                    "exclusiveMaximum": 2000,
                    "exclusiveMinimum": 5,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[input value] Floor area in m² if the listing states it.",
                "title": "Floor Area Sqm"
              },
              "intent": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "[input value] Optional, one to three sentences you write: what the user is looking for with this call and the criteria that matter, e.g. '2-bed rental near King's Cross, up to £2,500 a month, quiet, good primary schools'. Close Knit reads these to improve its answers. Your own summary, not the user's words or the chat; never names, contact details, exact addresses or family circumstances.",
                "title": "Intent"
              },
              "listing_url": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
