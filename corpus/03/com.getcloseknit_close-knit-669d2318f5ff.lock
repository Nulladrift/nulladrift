        {
          "name": "get_commute",
          "title": "Get commute",
          "description": "Door-to-door minutes from one neighbourhood to the user's places on a weekday morning, by public transport (R5 on TfL timetables), bike (at the speed Santander Cycles riders reach; checked against TfL), car (typical morning traffic, no parking) and walking, each with a range. Places within 1.5 km of a commute hub (King's Cross, Bank, Canary Wharf, Oxford Circus…) are routed through it; others in Greater London get a straight-line estimate (estimate: true); places outside Greater London, and every place from a neighbourhood outside London (the routing is London only), get straight-line estimates in every mode, long trips at a main-line speed (estimate: true, reason 'outside-routing'). A neighbourhood served by National Rail only also gets a rail estimate (modes.rail, estimate: true). Example routes start at the neighbourhood's MSOA centre (origin); one far from the headline minutes is representative: false and lists its lines only. Journeys over 120 minutes are not timed (minutes null, capped: true). A place takes latitude/longitude or center [longitude, latitude] from search_places; quote estimate minutes as estimates. Each mode's confidence: 'timetable' (TfL), 'routed' (London streets) or 'approximate' (straight-line estimates). googleMapsUrl opens Google Maps' own route for the user to check: its time, leaving now, not ours.",
          "inputSchema": {
            "$defs": {
              "AnyOfPointInput": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "anyOf": [
                      {
                        "maxLength": 60,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] What the point is, e.g. 'Crystal Palace NSC'.",
                    "title": "Label"
                  },
                  "latitude": {
                    "description": "[input value] The point's latitude (from search_places).",
                    "maximum": 90,
                    "minimum": -90,
                    "title": "Latitude",
                    "type": "number"
                  },
                  "longitude": {
                    "description": "[input value] The point's longitude.",
                    "maximum": 180,
                    "minimum": -180,
                    "title": "Longitude",
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "title": "AnyOfPointInput",
                "type": "object"
              },
              "PlaceInput": {
                "additionalProperties": false,
                "properties": {
                  "any_of": {
                    "anyOf": [
                      {
                        "items": {
                          "$ref": "#/$defs/AnyOfPointInput"
                        },
                        "maxItems": 3,
                        "minItems": 2,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] Near either of 2-3 pinned points ('either pool', 'either office'): each area counts the quickest one.",
                    "title": "Any Of"
                  },
                  "brand": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[search: prefix] With a category: brands starting with this, any case, e.g. 'M&S', 'Waitrose' (supermarket), 'PureGym' (gym); 'A or B' for either.",
                    "title": "Brand"
                  },
                  "category": {
                    "anyOf": [
                      {
                        "enum": ["park", "cafe", "supermarket", "convenience", "gp", "pharmacy", "pub", "restaurant", "gym", "pool", "sports_club", "step_free_station"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] Instead of a point: the nearest place of this kind (pool = public pool; step_free_station = a station TfL lists with lift access, or any DLR station or tram stop).",
                    "title": "Category"
                  },
                  "center": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "number"
                        },
                        "maxItems": 2,
                        "minItems": 2,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] Instead of latitude/longitude: [longitude, latitude], the `center` search_places returns.",
                    "title": "Center"
                  },
                  "importance": {
                    "default": 3,
                    "description": "[rank weight] 1 nice to have … 5 essential. A daily trip (work, the school run) goes right after their top priority, never last: lower in the order its weight is small.",
                    "maximum": 5,
                    "minimum": 1,
                    "title": "Importance",
                    "type": "integer"
                  },
                  "label": {
                    "description": "[input value] What the place is, e.g. 'Office', 'PureGym Angel', 'Any park' (name reads as label, lat/lng as latitude/longitude).",
                    "maxLength": 60,
                    "minLength": 1,
                    "title": "Label",
                    "type": "string"
                  },
                  "latitude": {
                    "anyOf": [
                      {
                        "maximum": 90,
                        "minimum": -90,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] A pinned place: its latitude (from search_places). For an address, `center` is its area's centre unless `centerPrecision` is `uprn`; never pin an LSOA centroid as the home.",
                    "title": "Latitude"
                  },
                  "longitude": {
                    "anyOf": [
                      {
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] A pinned place: its longitude.",
                    "title": "Longitude"
                  },
                  "max_minutes": {
                    "default": 30,
                    "description": "[rank weight] The longest trip they accept.",
                    "maximum": 120,
                    "minimum": 1,
                    "title": "Max Minutes",
                    "type": "integer"
                  },
                  "mode": {
                    "anyOf": [
                      {
                        "enum": ["walk", "cycle", "transit", "car"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[option] How they get there (default transit for a pin, walk for a kind). car = typical weekday-morning traffic, no parking or charges: say so.",
                    "title": "Mode"
                  },
                  "must": {
                    "default": false,
                    "description": "[option] True when an area beyond max_minutes is out of the question.",
                    "title": "Must",
                    "type": "boolean"
                  },
                  "school": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/SchoolPlaceInput"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] Instead of top_school: the nearest school matching a filter (phase, Ofsted, type, intake, faith, one results measure ≥ a threshold), optionally within N metres; max_minutes still sets the trip."
                  },
                  "school_gender": {
                    "anyOf": [
                      {
                        "enum": ["mixed", "girls", "boys"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] With top_school: only this intake.",
                    "title": "School Gender"
                  },
                  "school_phase": {
                    "default": "secondary",
                    "description": "[filter: exact] With top_school.",
                    "enum": ["primary", "secondary"],
                    "title": "School Phase",
                    "type": "string"
                  },
                  "school_rank_by": {
                    "default": "results",
                    "description": "[option] With top_school: rank by published results (default) or by Progress 8 (secondary only: progress pupils make from their primary results, latest published year 2023/24).",
                    "enum": ["results", "progress8"],
                    "title": "School Rank By",
                    "type": "string"
                  },
                  "school_selective": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] With top_school: false leaves grammars out, true keeps only them; N counts those.",
                    "title": "School Selective"
                  },
                  "sport": {
                    "anyOf": [
                      {
                        "maxLength": 30,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[search: contains] With sports_club: the sport, e.g. 'tennis', 'football'.",
                    "title": "Sport"
                  },
                  "top_school": {
                    "anyOf": [
                      {
                        "maximum": 200,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] Instead of a point or category: near one of the region's top N state schools (by published results), e.g. 10. Top lists hold grammars and single-sex schools; a family starts with good-primaries. Living nearby never guarantees a place: say so.",
                    "title": "Top School"
                  }
                },
                "required": ["label"],
                "title": "PlaceInput",
                "type": "object"
              },
              "RatePrevious": {
                "properties": {
                  "bad": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] What was wrong, missing or confusing.",
                    "title": "Bad"
                  },
                  "call_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[id] The callId of the answer you are rating; leave it out when answers carry none.",
                    "title": "Call Id"
                  },
                  "fix": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] The change to the tool or its answer you would want.",
                    "title": "Fix"
                  },
                  "good": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[input value] What was useful in the answer.",
                    "title": "Good"
                  },
                  "rating": {
                    "description": "[input value] 1 = useless or wrong, 3 = usable with gaps, 5 = exactly what was needed.",
                    "title": "Rating",
                    "type": "integer"
                  }
                },
                "required": ["rating"],
                "title": "RatePrevious",
                "type": "object"
              },
              "SchoolFilterInput": {
                "additionalProperties": false,
                "properties": {
                  "a_level_only": {
                    "default": false,
                    "description": "[filter: exact] Only sixth forms with a combined A-level rank.",
                    "title": "A Level Only",
                    "type": "boolean"
                  },
                  "establishments": {
                    "anyOf": [
                      {
                        "items": {
                          "enum": ["academy", "free", "community", "voluntary", "foundation"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] Type of establishment (absent = any).",
                    "title": "Establishments"
                  },
                  "faith": {
                    "anyOf": [
                      {
                        "enum": ["faith", "none"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] Faith school or not (absent = any).",
                    "title": "Faith"
                  },
                  "gender": {
                    "anyOf": [
                      {
                        "enum": ["mixed", "girls", "boys"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] Intake (absent = any).",
                    "title": "Gender"
                  },
                  "measure": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/SchoolMeasureInput"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: range] One results measure and its threshold."
                  },
                  "ofsted": {
                    "anyOf": [
                      {
                        "items": {
                          "enum": ["outstanding", "good", "report-card", "requires-improvement", "inadequate", "not-inspected"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] Ofsted standing kept, state schools only (absent = any).",
                    "title": "Ofsted"
                  },
                  "phases": {
                    "anyOf": [
                      {
                        "items": {
                          "enum": ["primary", "secondary", "all-through", "private"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "[filter: exact] Phases kept (absent = all).",
                    "title": "Phases"
                  }
                },
                "title": "SchoolFilterInput",
                "type": "object"
              },
              "SchoolMeasureInput": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "description": "[id] englandTopPercent = England top % (lower is better: at most the threshold); progress8, attainment8, grade5EngMaths (%), ks2RwmExpected (%) = at least the threshold; fsm6Share = free school meals % (at most). Latest published year per school; cohorts under 30 and suppressed cells have no value and never pass.",
                    "enum": ["englandTopPercent", "progress8", "attainment8", "grade5EngMaths", "ks2RwmExpected", "fsm6Share"],
                    "title": "Id",
                    "type": "string"
                  },
                  "threshold": {
                    "description": "[filter: range] The threshold in the measure's own unit, e.g. 75 for KS2 RWM 75%.",
                    "title": "Threshold",
                    "type": "number"
                  }
                },
                "required": ["id", "threshold"],
                "title": "SchoolMeasureInput",
                "type": "object"
              },
              "SchoolPlaceInput": {
                "additionalProperties": false,
                "properties": {
                  "filter": {
                    "$ref": "#/$defs/SchoolFilterInput",
                    "description": "[filter: exact] Which schools count (the same filter as the map's Schools filter)."
                  },
                  "within": {
                    "anyOf": [
                      {
                        "maximum": 10000,
                        "minimum": 100,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
