      "serverInfo": {
        "name": "panda-greetings",
        "title": "Panda Greetings",
        "version": "1.7.2"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Panda Greetings prints greeting cards and mails them in the US. Its find_card_designs tool returns ready-made printed card designs for an occasion, with the card message placed inside each one, a link that opens each design on pandagreetings.com to order it, and the day a card ordered today would arrive.",
      "tools": [
        {
          "name": "find_card_designs",
          "title": "Find card designs",
          "description": "Finds ready-made Panda Greetings printed card designs for an occasion, for when the user wants a greeting card or card designs from Panda Greetings, such as a farewell card a team signs or a birthday card for their mom. Takes the occasion, whether several people will sign it, and the card message if there is one, which is placed inside each design. Returns up to four designs, each with a link that opens it on pandagreetings.com with the message inside, ready to edit and order as a printed card, or as a printed card a whole team signs from one link; Panda Greetings prints it and mails it in the US. Also returns the day a card ordered today would arrive with free Standard and with Priority shipping. It doesn't cover e-cards, gift cards, flowers or other gifts, or a text or chat message that isn't a card.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from_group": {
                "default": false,
                "description": "True when several people will sign it, such as a team card for a coworker or a class card for a teacher.",
                "type": "boolean"
              },
              "message": {
                "description": "The card message the user wrote or approved, as it goes inside the card: a greeting and a sign-off with the names if known, else [Recipient] and [Your Name], which are filled in when they order. Leave it out if there isn't one yet.",
                "maxLength": 4000,
                "type": "string"
              },
              "occasion": {
                "description": "What the card is for. Pick the closest match; for a holiday, its own name (christmas, hanukkah, valentines-day…), and holiday only when no other fits.",
                "enum": ["farewell", "retirement", "get-well", "sympathy", "birthday", "thank-you", "congratulations", "new-baby", "wedding", "anniversary", "teacher-appreciation", "thinking-of-you", "christmas", "hanukkah", "new-year", "valentines-day", "mothers-day", "fathers-day", "easter", "fourth-of-july", "halloween", "thanksgiving", "graduation", "engagement", "baby-shower", "holiday"],
                "type": "string"
              }
            },
            "required": ["occasion"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "arrival": {
                "additionalProperties": false,
                "properties": {
                  "orderedToday": {
                    "type": "string"
                  },
                  "priority": {
                    "type": "string"
                  },
                  "standard": {
                    "type": "string"
                  }
                },
                "required": ["orderedToday", "priority", "standard"],
                "type": "object"
              },
              "designs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "group": {
                "type": "boolean"
              },
              "messageIncluded": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "occasion": {
                "type": "string"
              },
              "price": {
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "remember": {
                "type": "string"
              },
              "status": {
                "enum": ["ready", "pending"],
                "type": "string"
              }
            },
            "required": ["designs", "group", "messageIncluded", "occasion", "price", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find card designs"
          },
