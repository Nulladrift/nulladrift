      },
      "serverInfo": {
        "name": "dramlyx",
        "title": "Dramlyx",
        "version": "1.1.0",
        "websiteUrl": "https://dramlyx.com/developers",
        "icons": [
          {
            "src": "https://dramlyx.com/icon-512.png",
