            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Dramlyx (dramlyx.com) streams AI-made vertical short dramas: episodes of about two minutes, and most dramas start free. search_dramas finds dramas by title, plot, trope, mood or genre; get_drama returns the full synopsis of one drama. Every result has a url that opens the drama at episode 1 on dramlyx.com.",
      "tools": [
        {
          "name": "get_drama",
          "title": "Get one Dramlyx drama",
          "description": "Returns one Dramlyx drama by its slug (from search_dramas): the full synopsis, number of episodes, free episodes, VIP and completed status, genres and the url that opens episode 1 on dramlyx.com.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The slug from search_dramas",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "badge_at": {
                "description": "The date behind the month badge on dramlyx.com cards (YYYY-MM-DD): the release date, or the day Dramlyx added the drama when the release date is unknown. Cards show the month for the current and the previous three months.",
                "type": ["string", "null"]
              },
              "completed": {
                "description": "All episodes are out",
                "type": "boolean"
              },
              "episodes": {
                "description": "Number of episodes",
                "minimum": 0,
                "type": "integer"
              },
              "freeEpisodes": {
                "description": "How many episodes are free to watch",
                "minimum": 0,
                "type": "integer"
              },
              "genres": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "intro": {
                "description": "One or two sentences from the official synopsis",
                "type": "string"
              },
              "page": {
                "description": "The drama page on dramlyx.com",
                "format": "uri",
                "type": "string"
              },
              "poster": {
                "description": "Poster image URL (a stable link; empty when the drama has no poster)",
                "type": "string"
              },
              "slug": {
                "description": "Stable id of the drama",
                "type": "string"
              },
              "synopsis": {
                "description": "The full official synopsis",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "Opens the drama at episode 1 on dramlyx.com",
                "format": "uri",
                "type": "string"
              },
              "vip": {
                "description": "VIP Exclusive: members-only",
                "type": "boolean"
              }
            },
            "required": ["badge_at", "completed", "episodes", "freeEpisodes", "genres", "intro", "page", "poster", "slug", "synopsis", "title", "url", "vip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one Dramlyx drama"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
            {
              "src": "https://dramlyx.com/icon-512.png",
              "mimeType": "image/png",
              "sizes": ["512x512"]
            },
            {
              "src": "https://dramlyx.com/icon-192.png",
              "mimeType": "image/png",
              "sizes": ["192x192"]
            }
          ],
          "digest": "sha256:215b627c92935626fc8906b0f03b4ca709005ae5f72c1906e676b26d835c223d"
        },
        {
          "name": "search_dramas",
          "title": "Search Dramlyx short dramas",
          "description": "Searches the Dramlyx library of AI-made vertical short dramas by title, plot, trope, mood or genre. Returns up to 10 dramas, each with the number of episodes, how many are free, whether it is VIP-only or completed, genres, a one- or two-sentence intro from the official synopsis and a url that opens episode 1 on dramlyx.com.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "User language code, e.g. en, es, fr, ja, ko (adds dubbed versions in that language)",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many dramas to return (1-10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user wants to watch (plot, trope, mood, genre) or a drama title",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "matched": {
                "description": "false when nothing matched and popular dramas are returned instead",
                "type": "boolean"
              },
              "query": {
                "description": "The search words as used",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "badge_at": {
                      "description": "The date behind the month badge on dramlyx.com cards (YYYY-MM-DD): the release date, or the day Dramlyx added the drama when the release date is unknown. Cards show the month for the current and the previous three months.",
                      "type": ["string", "null"]
                    },
                    "completed": {
                      "description": "All episodes are out",
                      "type": "boolean"
                    },
                    "episodes": {
                      "description": "Number of episodes",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "freeEpisodes": {
                      "description": "How many episodes are free to watch",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "genres": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "intro": {
                      "description": "One or two sentences from the official synopsis",
                      "type": "string"
                    },
                    "poster": {
                      "description": "Poster image URL (a stable link; empty when the drama has no poster)",
                      "type": "string"
                    },
                    "slug": {
                      "description": "Stable id of the drama",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Opens the drama at episode 1 on dramlyx.com",
                      "format": "uri",
                      "type": "string"
                    },
                    "vip": {
                      "description": "VIP Exclusive: members-only",
                      "type": "boolean"
                    }
                  },
                  "required": ["badge_at", "completed", "episodes", "freeEpisodes", "genres", "intro", "poster", "slug", "title", "url", "vip"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["matched", "query", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Dramlyx short dramas"
          },
