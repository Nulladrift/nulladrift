      "instructions": "Angling Lines sells carp fishing holidays at private lakes in France, booked as\nfixed 7-day weeks running Saturday to Saturday. There is no per-night booking.\n\nUse `list_venues` to get the full catalogue of bookable lakes with their headline\nfacts (size, capacity, lake record, accommodation) and the features each lake HAS\n(as a compact list of the same keys search_venues filters on). Build links from\nits `url_templates` by replacing {slug}; fetch a venue's fact-sheet URL when you\nneed full detail (facilities, ferry-port drive times, example prices). Prefer\n`search_venues` when the customer has criteria — it is smaller and filtered.\n\nThis catalogue is not an availability check: it lists every lake that can be\nbooked, not the ones free on a given date. Use `venues_available_on_date` for\nthat: give it a party size plus either a Saturday arrival date (`YYYY-MM-DD`) or\na month (`YYYY-MM`), and it returns only the lakes genuinely free then, with\ntheir remaining arrival dates and capacity.\n\nUse `get_quote` to price one venue for one Saturday arrival week and one party. It\nquotes the live booking engine — the venue price plus the cheapest Channel crossing\nfor the vehicles given — and reports back `unavailable` when that week is not free.\n\nUse `search_categories` to browse the themed collections of lakes that Angling Lines\ncurates by hand (big carp lakes, family-friendly lakes, lakes close to Calais and so\non) — with no arguments it lists the categories, with a category slug it returns the\nbookable lakes in that one.\n\nUse `search_venues` for any \"find me a lake\" request: it runs the same search the\nwebsite does, combining party size, lake facts (carp record, acres) and facilities\n(accommodation, all-inclusive, pool or hot tub, catfish, dogs, bait boats and more)\nwith optional availability — give it a Saturday `date` and it returns the lakes free\nthat week plus `alternatives` free on the nearest earlier and later Saturdays.\n\nUse `list_crossings` when a trip is confirmed and the customer might care how they\ncross the Channel: it prices every route pair (ferry and tunnel, day and overnight)\nas whole-holiday totals, cheapest first, with the route ids `prepare_booking`\naccepts. Crossing choice is always subject to sailing availability at checkout.\nSet `include_crossing=true` when a customer requests a crossing, including at\ncrossing-optional lakes; `false` means the customer chose a venue-only trip.\n\nUse `list_swims` when a venue has designated swims (fishing spots) and a week is\nchosen: it shows which swims are free that week, their single/double type and a\nlake-map URL for the customer, accommodation choices and venue-specific rules.\nGolden Carp Lake returns its four `booking_options`: ask the customer which\navailable package they want and pass its `booking_option` ID to get_quote,\nlist_crossings and prepare_booking. It can be booked entirely through chat.\nPass the same `swims` and `accommodation_ids` through all pricing and booking\ncalls: linked lodges and single-angler-on-double-swim rules can affect prices.\n\nUse `prepare_booking` once — and only once — the customer has confirmed a venue, a\nSaturday arrival date and the party size. It returns the live quote plus a signed,\nexpiring link to the Angling Lines review page with that booking pre-filled; the\ncustomer opens it, logs in and pays there. Pass `outbound_route_id` and\n`inbound_route_id` from `list_crossings` to book a specific crossing; omit them\nfor the cheapest. Pass `swims` (swim numbers from list_swims) to book specific\nswims; omit it and good free swims are picked automatically. It creates nothing\nby itself. Resolve missing or unavailable choices using these tools and ask\nthe customer in chat; only short-notice phone-only bookings need the office.\n\nAnswer only from what these tools return. Prices are in GBP and always cover the\nwhole week for the whole party.",
      "tools": [
        {
          "name": "get_quote",
          "title": "Get Quote",
          "description": "Quote one Angling Lines venue for one fixed 7-day week: give a venue name or slug, a Saturday arrival date (YYYY-MM-DD) and the party, and get the total price for the whole party for the whole week. Prices come from the live booking engine — the venue price plus the cheapest Channel crossing for the vehicles quoted — and are in GBP. Returns a structured \"unavailable\" result, not a price, when that week is not free for that party.",
          "inputSchema": {
            "properties": {
              "accommodation_ids": {
                "description": "Selected accommodation IDs returned by list_swims for this date. GCL booking_option includes the matching cabin automatically.",
                "items": {
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "anglers": {
                "description": "Actual number of fishing guests supplied by the customer, never a package or swim capacity. Keep 2 guests as 2 even for a package with capacity 5.",
                "minimum": 1,
                "type": "integer"
              },
              "booking_option": {
                "description": "Golden Carp Lake whole package explicitly chosen by the customer after seeing available list_swims options: 1 cabin & swim 1; 2 all of swims 2,3,4; 3 exclusive without cabin; 4 exclusive with cabin. Never infer a package from a single swim preference such as swim 4. Required for GCL.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "cars": {
                "description": "Number of cars travelling — crossing costs are per vehicle. Ask when unknown for a crossing quote; do not silently assume 1. Pass 0 for a van-only party. Defaults to 1 for older callers.",
                "minimum": 0,
                "type": "integer"
              },
              "date": {
                "description": "The Saturday arrival date of the 7-day week, as YYYY-MM-DD. Every stay runs Saturday to Saturday.",
                "type": "string"
              },
              "exclusive": {
                "description": "Quote the venue exclusively for this party. Some party sizes force exclusive use anyway.",
                "type": "boolean"
              },
              "include_crossing": {
                "description": "True when the customer wants a crossing, including cheapest crossing at a crossing-optional venue. False for venue-only. Omit to use the venue default.",
                "type": "boolean"
              },
              "non_anglers": {
                "description": "Number of non-fishing guests. Defaults to 0.",
                "minimum": 0,
                "type": "integer"
              },
              "swims": {
                "description": "Chosen swim numbers from list_swims; omit for suitable available defaults. Requote after changing swims.",
                "items": {
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "vans": {
                "description": "Number of vans travelling. Preserve the customer's count in all crossing and booking calls. Defaults to 0.",
                "minimum": 0,
                "type": "integer"
              },
              "venue": {
                "description": "The venue to quote, by name or slug, e.g. \"Beaurepaire\".",
                "type": "string"
              }
            },
            "required": ["anglers", "date", "venue"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a666c5efb74ca421264b1f5bd9d6849c3a6fc69cd51c0f598029966d0ae52f49"
        },
        {
