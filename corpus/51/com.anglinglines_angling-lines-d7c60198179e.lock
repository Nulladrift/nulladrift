        },
        {
          "name": "search_venues",
          "title": "Search Venues",
          "description": "The tool for \"find me a lake\": search the Angling Lines catalogue by party size, features and availability, exactly the way the website search does. Every filter is optional — call it with nothing for the whole catalogue, or combine party size (\"anglers\", \"non_anglers\"), lake facts (\"min_carp_lb\", \"min_lake_acres\") and facilities (\"accommodation\", \"all_inclusive\", \"meals\", \"pool_or_hot_tub\", \"tackle_hire\", \"catfish\", \"dogs_allowed\", \"campervans\", \"rowing_boats\", \"bait_boats\", \"bait_on_site\"). Add a Saturday \"date\" (YYYY-MM-DD) to get real availability plus \"alternatives\" — venues that match everything but that week, each with the nearest earlier and later free Saturday — or \"months\" ([\"YYYY-MM\"]) to scan whole months. Narrow to a curated theme with \"category\", whose slugs come from search_categories.",
          "inputSchema": {
            "properties": {
              "accommodation": {
                "description": "Only lakes with on-site accommodation, rather than bivvy fishing.",
                "type": "boolean"
              },
              "all_inclusive": {
                "description": "Only all-inclusive venues.",
                "type": "boolean"
              },
              "anglers": {
                "description": "Number of anglers (fishing guests) in the party. Defaults to 1.",
                "minimum": 1,
                "type": "integer"
              },
              "bait_boats": {
                "description": "Only venues where bait boats are allowed.",
                "type": "boolean"
              },
              "bait_on_site": {
                "description": "Only venues selling bait on site.",
                "type": "boolean"
              },
              "campervans": {
                "description": "Only venues that take campervans and motorhomes.",
                "type": "boolean"
              },
              "category": {
                "description": "Narrow to a curated search category by slug, e.g. \"big-carp-lakes\". Call search_categories for the slugs that exist.",
                "type": "string"
              },
              "catfish": {
                "description": "Only venues stocked with catfish.",
                "type": "boolean"
              },
              "crossing_optional": {
                "description": "Only venues bookable WITHOUT a Channel crossing — the holiday is priced venue-only and the customer arranges their own travel.",
                "type": "boolean"
              },
              "date": {
                "description": "A single Saturday arrival date as \"YYYY-MM-DD\", e.g. \"2026-09-05\". Give this to get real availability plus earlier/later alternatives. Stays run Saturday to Saturday, so any other weekday is rejected.",
                "type": "string"
              },
              "dogs_allowed": {
                "description": "Only venues that accept dogs and other pets.",
                "type": "boolean"
              },
              "fish_from_accommodation": {
                "description": "Only lakes where you can fish from the accommodation. Applies with \"accommodation\".",
                "type": "boolean"
              },
              "meals": {
                "description": "Only venues where meals are available.",
                "type": "boolean"
              },
              "min_carp_lb": {
                "description": "Only lakes whose carp record is at least this many pounds, e.g. 60.",
                "minimum": 0,
                "type": "integer"
              },
              "min_lake_acres": {
                "description": "Only lakes of at least this many acres, e.g. 10.",
                "minimum": 0,
                "type": "number"
              },
              "months": {
                "description": "Whole months to scan, each as \"YYYY-MM\", e.g. [\"2026-09\", \"2026-10\"]. Use this OR \"date\". Returns venues with at least one free week in those months.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "non_anglers": {
                "description": "Number of non-fishing guests travelling with the party. Defaults to 0.",
                "minimum": 0,
                "type": "integer"
              },
              "pool_or_hot_tub": {
                "description": "Only venues with a swimming pool or a hot tub.",
                "type": "boolean"
              },
              "rowing_boats": {
                "description": "Only venues with rowing boats.",
                "type": "boolean"
              },
              "sleeps": {
                "description": "Only lakes whose accommodation sleeps at least this many. Applies with \"accommodation\".",
                "minimum": 1,
                "type": "integer"
              },
              "tackle_hire": {
                "description": "Only venues where tackle can be hired.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a4afd33f94755c3dacc224dfc80d66288f19554d89b367e42a6d472ca364907c"
        },
        {
          "name": "venues_available_on_date",
          "title": "Venues Available On Date",
          "description": "Check which Angling Lines venues genuinely have space for a party, either on one specific Saturday or across a whole month. Stays are fixed 7-day weeks, so an arrival date must be a Saturday in \"YYYY-MM-DD\" form; pass \"month\" as \"YYYY-MM\" instead to scan a whole month (defaults to the current month). Returns only venues with real availability, each with its free arrival dates and remaining capacity. Use this — not list_venues — whenever the question is about what is free or bookable.",
          "inputSchema": {
            "properties": {
              "anglers": {
                "description": "Number of anglers (fishers) in the party.",
                "minimum": 1,
                "type": "integer"
              },
              "date": {
                "description": "A single Saturday arrival date as \"YYYY-MM-DD\", e.g. \"2026-09-05\". Use this OR \"month\". Stays run Saturday to Saturday, so any other weekday is rejected.",
                "type": "string"
              },
              "month": {
                "description": "A whole month to scan as \"YYYY-MM\", e.g. \"2026-09\". Use this OR \"date\". Defaults to the current month when neither is given.",
                "type": "string"
              },
              "non_anglers": {
                "description": "Number of non-fishing guests travelling with the party. Defaults to 0.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["anglers"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4c78f465a9607269f236512d70e30509abae2bdf9d31cec88e88cfb8e01f0812"
        }
      ],
      "digest": "sha256:08f5dfad774ab712f59b6c245bb04e4bbb3bddcaff3a5479fac205665d5138d4"
    }
