      "serverInfo": {
        "name": "aremes",
        "title": "AREMES ENTERPRISES and RSMAD",
        "version": "1.0.0",
        "websiteUrl": "https://aremes-enterprises.com/mcp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AREMES ENTERPRISES and RSMAD (the Ryan Seslow Museum of Art & Design) are walkable 3D places by the artist Ryan Seslow, in a building on Union Street in Brooklyn you can visit in any web browser or VR headset. The connector lists the places to visit, the spaces, apartments and artworks for license with their prices, every offer, and the museum memberships. The start_ tools place an order under the license named in each tool and return a Stripe checkout link for the person to pay by card. Nothing is charged until they pay.",
      "tools": [
        {
          "name": "get_membership",
          "title": "RSMAD museum membership",
          "description": "RSMAD membership opens the Members' Wing, four galleries on the second floor of AREMES HQ. Annual $50, Seasonal (6 months) $30 and Quarterly (3 months) $18 also include early access to new original works and 10% off original art; the Day Pass ($5) opens the Members' Wing for one day. Returns the tiers with their Stripe checkout links. After paying, the member lands on a welcome page that opens the doors.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "RSMAD museum membership"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7e639661df7a0f896cda360b6571637156f38020fd9579247eb1c751d176172"
        },
        {
          "name": "get_offers",
          "title": "Everything AREMES and RSMAD sell, with prices and how to buy",
          "description": "The full list of offers from Ryan Seslow Art & Design LLC (AREMES ENTERPRISES and RSMAD): AREMES Worlds (a walkable exhibition of your own art), spaces for license, 3D model and image licenses, the AR Asset Mega Pack, RSMAD membership, museum passes and more. Returns each offer with what it is, its page, prices and how a person or an agent buys it. People pay by card at Stripe checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Everything AREMES and RSMAD sell, with prices and how to buy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7bde28ca644c951814e784e084d807c8dbf948abac4cb45aa353cced5b7b3f4e"
        },
        {
          "name": "list_artworks",
          "title": "Artworks by Ryan Seslow for image and 3D license",
          "description": "Works by Ryan Seslow on aremes-enterprises.com/work/, each with its own page and image. Every work can be licensed as an image (one month, one year, or own it forever); some also as a 3D model. Returns slug, title, series, page, image, how it was made, and the license prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional words to match in the title or series.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Artworks by Ryan Seslow for image and 3D license"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:afe0e5366c11dc4a65dd99c77de5909ceec281f52fa32ef393fea6950fd4c3c3"
        },
        {
          "name": "list_spaces",
          "title": "Walkable spaces in AREMES HQ and the RSMAD museum",
          "description": "Every walkable 3D space by the artist Ryan Seslow: the floors and rooms of AREMES HQ in Brooklyn, the eleven galleries of RSMAD (the Ryan Seslow Museum of Art & Design), the Sculpture Park and the street outside. Each opens in any web browser, on a phone or in a VR headset. Returns name, link, description, floor and access (most are free).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional words to filter by name or description, e.g. \"museum\", \"vaults\", \"third floor\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Walkable spaces in AREMES HQ and the RSMAD museum"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b23d159989041fc12c8cebf086c4ba2cbb34c1b3e705c520ab167d83ad69d8bd"
        },
        {
          "name": "list_spaces_for_license",
          "title": "Virtual spaces and apartments for license",
          "description": "Virtual spaces and apartments for license in three WebXR buildings on Union Street, Brooklyn (AREMES HQ, AREMES Commercial, AREMES Residential). A licensee fills a space with their own images, videos and 3D models. These are licenses for virtual spaces, not physical premises or housing. Returns each unit with its building, floor, kind, size, page, prices for one month, six months and one year (paid in full), and whether it is open.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "building": {
                "description": "Optional: one building.",
                "enum": ["AREMES HQ", "AREMES Commercial", "AREMES Residential"],
                "type": "string"
              },
              "kind": {
                "description": "Optional: \"Space for License\", \"Studio\", \"One Bedroom\", \"Two Bedroom\" or \"Penthouse\".",
                "type": "string"
              },
              "open_only": {
                "description": "Only units that are open. Default true.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Virtual spaces and apartments for license"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc16298a043c380054b803a6d17491819335f2a4ca92100ac8bd298e0bcbc20b"
        },
        {
          "name": "start_image_license",
          "title": "Start an image license for an artwork",
          "description": "Places an order to license the image of one work by Ryan Seslow, for the person or business you act for, and returns the order number, the total and a Stripe checkout link for the licensee to pay by card. Nothing is charged until it is paid; once paid, the download opens. The order is governed by the AREMES Image License (https://aremes-enterprises.com/work/license/) and is accepted only when agree is true, meaning the licensee has agreed to it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agree": {
                "description": "True only if the licensee read and agreed to the AREMES Image License.",
                "type": "boolean"
              },
              "business": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "project": {
                "description": "Optional: what the image will be used for.",
                "type": "string"
              },
              "term": {
                "description": "1m = one month ($25), 1y = one year ($150), own = own it forever ($450).",
                "enum": ["1m", "1y", "own"],
                "type": "string"
              },
              "work": {
                "description": "The work's slug, e.g. \"crown\".",
                "type": "string"
              }
            },
            "required": ["agree", "email", "name", "term", "work"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start an image license for an artwork"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c9767bb16de31a56fd37baa6b9dcfa6ac6d1d8ce9fb37f325d171a17a76abdd3"
        },
        {
          "name": "start_model_license",
          "title": "Start a 3D model license",
          "description": "Places an order to license one AREMES 3D model (the GT, the Sport Bike, the V-Twin Cruiser, the three Interdimensional Suits, the Parts in the Round and two relief sculptures) as GLB and USDZ files, for the person or business you act for. Returns the order number, the total and a Stripe checkout link for the licensee to pay by card; nothing is charged until it is paid. The order is governed by the AREMES 3D Model License (https://aremes-enterprises.com/vehicles/license/) and is accepted only when agree is true, meaning the licensee has agreed to it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agree": {
                "description": "True only if the licensee read and agreed to the AREMES 3D Model License.",
                "type": "boolean"
              },
              "business": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "model": {
                "enum": ["gt", "bike", "cruiser", "suit", "suit-helmet", "suit-headset", "crown", "shoulder", "yoke", "hip-block", "shin", "pod", "helmet-4", "chest", "wood-wall", "cardboard"],
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "project": {
                "type": "string"
              },
              "term": {
                "description": "1m = one month ($25), 1y = one year ($150), own = perpetual ($450).",
                "enum": ["1m", "1y", "own"],
                "type": "string"
              }
            },
            "required": ["agree", "email", "model", "name", "term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a 3D model license"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:92eecb6abbb44c51070ece3f664f8ca76b38390dfb710ee8a30b2f94db746e9a"
        },
        {
          "name": "start_space_license",
          "title": "Start a license for a virtual space or apartment",
          "description": "Places a license request for one unit and term, for the person or business you act for, and returns the request number, the total and a Stripe checkout link for the licensee to pay by card. Nothing is charged until it is paid. The order is governed by the AREMES Space License (https://aremes-enterprises.com/lease/license/) and is accepted only when agree is true, meaning the licensee has agreed to it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agree": {
                "description": "True only if the licensee read and agreed to the AREMES Space License.",
                "type": "boolean"
              },
              "business": {
                "description": "Optional business name.",
                "type": "string"
              },
              "email": {
                "description": "The licensee's e-mail address.",
                "type": "string"
              },
              "name": {
                "description": "The licensee's full name.",
                "type": "string"
              },
              "notes": {
                "description": "Optional notes for the artist.",
                "type": "string"
              },
              "start": {
                "description": "Optional start date, YYYY-MM-DD.",
                "type": "string"
              },
              "term": {
                "description": "1m = one month; 6m-up = six months paid in full (10% off); 1y-up = one year paid in full (20% off).",
                "enum": ["1m", "6m-up", "1y-up"],
                "type": "string"
              },
              "unit": {
                "description": "Unit id, e.g. \"A\", \"C-204\", \"R-101\", \"PH-A\".",
                "type": "string"
              }
            },
            "required": ["agree", "email", "name", "term", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
