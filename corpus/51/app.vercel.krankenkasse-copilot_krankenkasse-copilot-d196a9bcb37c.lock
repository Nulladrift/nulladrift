{
  "lockfileVersion": 2,
  "subjects": {
    "app.vercel.krankenkasse-copilot/krankenkasse-copilot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://krankenkasse-copilot.vercel.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "krankenkasse-copilot",
        "title": "Krankenkasse Copilot",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Swiss basic health insurance (KVG) for 2027, from the official BAG premium data.\nUse find_postcode first if the person's postcode covers several municipalities. Then compare_insurance ranks every insurer, model and deductible (called Franchise on Swiss policies) by the full yearly cost (premiums + deductible + 10% Selbstbehalt up to CHF 700), not by premium alone.\nAsk for the age group (19 to 25, or 26+), whether they work 8+ hours a week for one employer (then accident cover can be left out), and roughly how often they see a doctor.\ndraft_switch_letter writes the German letter they sign and post. The letter must ARRIVE by 30 November 2026. Basic insurance covers the same treatments at every insurer by law.",
      "tools": [
        {
          "name": "compare_insurance",
          "title": "Compare basic insurance 2027",
          "description": "Rank every insurer, model and deductible for one person by the full yearly cost for 2027 (premiums plus the bills they pay themselves). Returns the best options, the best deductible, the break-even point, the worst case and the saving against their current insurance.",
          "inputSchema": {
            "properties": {
              "age_group": {
                "description": "Age in 2027",
                "enum": ["19-25", "26+"],
                "type": "string"
              },
              "current_franchise": {
                "description": "Their deductible today",
                "type": "integer"
              },
              "current_insurer": {
                "description": "Name of the current insurer, e.g. \"Helsana\"",
                "type": "string"
              },
              "current_monthly_premium": {
                "description": "What they pay today per month for basic insurance",
                "maximum": 3000,
                "minimum": 0,
                "type": "number"
              },
              "franchise": {
                "description": "Only show this deductible (300, 500, 1000, 1500, 2000 or 2500)",
                "type": "integer"
              },
              "gp_visits": {
                "description": "Family doctor visits per year (about CHF 150 each)",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "description": "How many options to return, default 5, best per insurer",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "medication_per_month": {
                "description": "Medication in CHF per month",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "model": {
                "description": "Only show this insurance model",
                "enum": ["standard", "hausarzt", "hmo", "telmed", "flex"],
                "type": "string"
              },
              "municipality_bfs": {
                "description": "BFS number from find_postcode, only needed if the postcode covers several municipalities",
                "minimum": 0,
                "type": "integer"
              },
              "postcode": {
                "description": "Swiss 4 digit postcode, e.g. 8001",
                "maximum": 9999,
                "minimum": 1000,
                "type": "integer"
              },
              "specialist_visits": {
                "description": "Specialist or therapy sessions per year (about CHF 280 each)",
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "works_8h_per_week": {
                "description": "Works at least 8 hours a week for one employer. If true, accident cover is left out because the employer covers it",
                "type": "boolean"
              },
              "yearly_health_costs": {
                "description": "Expected doctor bills per year in CHF. If missing, estimated from the visit counts below",
                "maximum": 200000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["age_group", "postcode", "works_8h_per_week"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fba0157fb5ce94f3de5832a80e69b473b31303904ee17f0403556b000bb72ed0"
        },
        {
          "name": "draft_switch_letter",
          "title": "Draft switch letter",
          "description": "Write the German letter to cancel basic insurance (Kündigung) or to change deductible or model with the same insurer. The person prints it, signs it by hand and posts it so it arrives by 30 November. Nothing is stored.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "type": "string"
              },
              "current_insurer": {
                "type": "string"
              },
              "full_name": {
                "type": "string"
              },
              "insurance_number": {
                "type": "string"
              },
              "insurer_address": {
                "type": "string"
              },
              "kind": {
                "description": "\"cancel\" to leave the current insurer, \"change\" to stay and change deductible or model",
                "enum": ["cancel", "change"],
                "type": "string"
              },
              "new_franchise": {
                "description": "Only for kind \"change\"",
                "type": "integer"
              },
              "new_model": {
                "description": "Only for kind \"change\"",
                "type": "string"
              },
              "postcode_town": {
                "description": "e.g. \"8008 Zürich\"",
                "type": "string"
              },
              "street": {
                "type": "string"
              }
            },
            "required": ["current_insurer", "full_name", "kind", "postcode_town", "street"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec31364c94d145848dffffefe3968ed5c48f6976c288a8054f1db6f5302fdee4"
        },
        {
          "name": "find_postcode",
          "title": "Find postcode",
          "description": "Look up a Swiss postcode: municipalities, canton and BAG premium region. Use it when a postcode may cover several municipalities.",
          "inputSchema": {
            "properties": {
              "postcode": {
                "description": "Swiss 4 digit postcode",
                "maximum": 9999,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a93f63ec00675fa321ce532c28f98828ac724175da48aad81ce806ebe9ebe319"
        },
        {
          "name": "switching_deadlines",
          "title": "Switching deadlines",
          "description": "The dates that matter for changing Krankenkasse, model or deductible for 2027, with days left from today.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ad9780b0148e3bae885968c214624d769e334af86b15d91a39a3232a4f8a708"
        }
      ],
      "digest": "sha256:42199ec579eb65e110c871dc3aec924a96a8221177ffc3218d5cfa5b34354272"
    }
  }
}
