                      {
                        "additionalProperties": false,
                        "properties": {
                          "period": {
                            "description": "Month in YYYY-MM format.",
                            "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                            "type": "string"
                          },
                          "value": {
                            "pattern": "^\\d+(?:\\.\\d+)?$",
                            "type": "string"
                          }
