          "inputSchema": {
            "properties": {
              "crime_type": {
                "default": "violent-crime",
                "title": "Crime Type",
                "type": "string"
              },
              "from_year": {
                "default": 2015,
                "title": "From Year",
                "type": "integer"
              },
              "to_year": {
                "default": 2023,
                "title": "To Year",
                "type": "integer"
              }
            },
            "title": "get_national_crime_estimatesArguments",
            "type": "object"
          },
          "outputSchema": {
