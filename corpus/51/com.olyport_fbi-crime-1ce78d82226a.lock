        {
          "name": "compare_state_crime",
          "description": "Compare crime rates across multiple US states for a single year.\n\n    Fetches crime estimates for each state and returns them side by side\n    for easy comparison. Useful for grant narratives requiring regional context.\n\n    Args:\n        states: Comma-separated two-letter state abbreviations (e.g. 'CA,TX,NY').\n        crime_type: Type of crime to compare. Options: violent-crime, property-crime,\n            burglary, larceny, motor-vehicle-theft, homicide, robbery,\n            aggravated-assault. Default: violent-crime.\n        year: The year to compare (default 2022).\n    ",
          "inputSchema": {
            "properties": {
              "crime_type": {
                "default": "violent-crime",
                "title": "Crime Type",
                "type": "string"
              },
              "states": {
                "title": "States",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["states"],
            "title": "compare_state_crimeArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "compare_state_crimeOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cbfc5f05c13ac680b4e4b82c9f068a0f8d6a64ced59d8f61c7a6bf55712f6432"
        },
        {
