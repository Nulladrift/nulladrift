{
  "lockfileVersion": 2,
  "subjects": {
    "br.com.scrypta/scrypta-mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scrypta.com.br/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "scrypta",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Este servidor expõe o catálogo de Scrypta. Use \"buscar_produtos\" para buscar por nome/categoria/faixa de preço — aceita filtros combinados. Use \"listar_categorias\" para descobrir categorias válidas antes de filtrar. Use \"produtos_por_categoria\" para listar uma categoria inteira. Use \"listar_planos\" para planos e assinaturas. Todos os preços estão em BRL. Paginação via \"limite\" (máx 100) e \"offset\". Prefira filtros server-side a listar tudo — respostas mais rápidas e precisas.",
      "tools": [
        {
          "name": "buscar_produtos",
          "title": "Buscar Produtos",
          "description": "Busca produtos no catálogo. Aceita filtros combinados: termo no nome, categoria, faixa de preço e apenas em estoque. Retorna lista paginada com nomes, preços e URLs.",
          "inputSchema": {
            "properties": {
              "apenas_em_estoque": {
                "description": "Se true, retorna apenas produtos em estoque. Default: false.",
                "type": "boolean"
              },
              "categoria": {
                "description": "Nome exato da categoria (ex: 'Colares'). Use listar_categorias antes para descobrir nomes válidos.",
                "type": "string"
              },
              "limite": {
                "description": "Número máximo de produtos por resposta (1 a 100). Default: 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Quantos resultados pular (paginação). Default: 0.",
                "minimum": 0,
                "type": "integer"
              },
              "preco_max": {
                "description": "Preço máximo em BRL (inclusivo). Ex: 100.00 para até R$ 100.",
                "type": "number"
              },
              "preco_min": {
                "description": "Preço mínimo em BRL (inclusivo). Ex: 50.00 para a partir de R$ 50.",
                "type": "number"
              },
              "query": {
                "description": "Termo de busca por nome do produto (ex: 'colar', 'vestido'). Aceita acentos ou não.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "has_more": {
                "description": "True se há mais páginas.",
                "type": "boolean"
              },
              "products": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "in_stock": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price": {
                      "type": "number"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "price"],
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "description": "Quantos vieram nesta página.",
                "type": "integer"
              },
              "total": {
                "description": "Total de produtos que casam com os filtros.",
                "type": "integer"
              }
            },
            "required": ["has_more", "products", "returned", "total"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58c5a5b6fcc83b058e3dc78264b462e8e3c22d7da507acb1ad1f476831d10945"
        },
        {
          "name": "info_empresa",
          "title": "Informações da Empresa",
          "description": "Retorna informações gerais sobre a empresa: URL, total de produtos, categorias, planos e faixa de preço.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "categories_count": {
                "type": "integer"
              },
              "plans_count": {
                "type": "integer"
              },
              "price_range": {
                "properties": {
                  "max": {
                    "type": "number"
                  },
                  "min": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "products_count": {
                "type": "integer"
              },
              "slug": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["categories_count", "plans_count", "products_count", "slug", "url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:482093bf933bdf9153b58806d47efea91f87ff7fee4cebfdb4d868634ba6c2f2"
        },
        {
          "name": "listar_categorias",
          "title": "Listar Categorias",
