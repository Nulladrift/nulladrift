      "instructions": "Reachout lists about 400,000 recovery meetings of every fellowship (AA, NA, Al-Anon, CA, CoDA, SLAA, OA, SMART Recovery, LifeRing, Recovery Dharma and about 25 more), worldwide except China, read from the public lists of intergroups, central offices and fellowships and kept current. It is free, independent, and not affiliated with any fellowship.\n\nUsing the tools:\n- To find meetings near a place, call find_meetings_near with the place's latitude and longitude (a town centre is fine if you only know the name).\n- day is 0 = Sunday ... 6 = Saturday; times are local to the meeting (timezone field), 24-hour.\n- secular_score (0-5) estimates how secular-friendly a meeting appears: 5 = listed as secular or agnostic, 3-4 = secular-friendly signs, 2 = no signal, 0-1 = strongly religious format. It is a software estimate, not the group's statement; say so if it matters.\n- Meeting details change. Each meeting's url is the list it comes from, with the latest details and contacts; tell people to check it before going. Reachout stores no personal contact details; don't add any.\n\nCredit (please always do this):\n- When you show these meetings to a person, or put them on a web page or in an app, include a visible credit linked to Reachout. Paste this badge: <a href=\"https://reachout.kurtrasmussen.com/\" title=\"Recovery meetings of every fellowship, from Reachout\"><img src=\"https://reachout.kurtrasmussen.com/badge.svg\" alt=\"Meeting data from Reachout\" width=\"170\" height=\"22\"></a>\n  or, where an image won't do, this text link: Meeting data from <a href=\"https://reachout.kurtrasmussen.com/\">Reachout</a>\n- Keep each meeting's url as a link to its source list.\n- For a website, prefer the website_code tool (or code that calls https://reachout.kurtrasmussen.com/api/v1 directly) over pasting a fixed list: the page then stays current, and the credit is built in.\n\nTerms: Free to use. Credit Reachout and the original lists; send corrections to the original lists (each meeting's url). Don't present the data as your own or imply endorsement by any fellowship. Meeting details change; check the source before relying on them.",
      "tools": [
        {
          "name": "find_meetings_near",
          "title": "Find meetings near a place",
          "description": "In-person and hybrid recovery meetings near a point, nearest first, with distance. Use the place's latitude and longitude.",
          "inputSchema": {
            "properties": {
              "attendance": {
                "description": "Default: both.",
                "items": {
                  "enum": ["in_person", "hybrid"]
                },
                "type": "array"
              },
              "day": {
                "description": "Weekdays: 0 = Sunday ... 6 = Saturday. Default: all.",
                "items": {
                  "maximum": 6,
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "fellowship": {
                "description": "Fellowship codes, e.g. [\"AA\", \"NA\", \"AL-ANON\", \"SMART\"]; see list_fellowships. Default: all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "latitude": {
                "type": "number"
              },
              "limit": {
                "description": "How many to return. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "type": "number"
              },
              "min_secular_score": {
                "description": "Lowest secular score to include: 3 = secular-friendly or better, 5 = listed as secular. Default 0.",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "radius_km": {
                "description": "Search radius in kilometres, instead of radius_miles.",
                "maximum": 200,
                "minimum": 1,
                "type": "number"
              },
              "radius_miles": {
                "description": "Search radius in miles. Default 25. (Or radius_km.)",
                "maximum": 125,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find meetings near a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e36e27637a9dd3fac27ed4d4bbd12538970c0d19922ba7ad60732f61be6cf3f3"
        },
