{
  "lockfileVersion": 2,
  "subjects": {
    "com.igdigi/ai-use-policy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://igdigi.com/mcp/ai-policy"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.igdigi/ai-use-policy",
        "title": "AI Use Policy Draft",
        "version": "1.0.0",
        "websiteUrl": "https://igdigi.com/ai/mcp-development/ai-use-policy-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Drafts a short AI use policy for a small business. Call get_policy_questions for the questionnaire, ask the person for their answers (do not invent them), then call draft_ai_use_policy with those answers to get the policy as Markdown, followed by a list of the parts still to fill in or check: show that list to the person. The tools fill a fixed template: no AI model is called, and this server does not store or log what the person says. The draft is for internal use and is not legal advice; tell the person to have their counsel review it. Run by IG Digital Lab, Sacramento, CA.",
      "tools": [
        {
          "name": "draft_ai_use_policy",
          "title": "Draft a short AI use policy",
          "description": "Builds a short AI use policy draft in Markdown (ten sections, about two pages) from the answers to get_policy_questions: purpose, scope, approved tools, data rules (what never goes into free or unapproved AI tools), allowed and prohibited uses, human review of AI output, approval of new tools, incident reporting and a review date. It is a fixed template filled with the answers: no AI model is called, there is no network access, and this server does not store or log the answers. Only company_name is required. Every other answer left out becomes a bracketed placeholder in the draft, and after the policy the result lists them, together with any free plan or kind of data that needs a second look (show that list to the person). Ask the person for the answers, do not invent them. Optional effective_date (YYYY-MM-DD) defaults to today (UTC). The output is a draft for internal use, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai_tools": {
                "description": "Which AI tools does the team use or plan to use? Name the product and, if you know it, the plan.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "allowed_uses": {
                "description": "What may people use AI for? One use per entry.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "approver": {
                "description": "Who approves new AI tools and receives incident reports? A role or a name.",
                "maxLength": 100,
                "type": "string"
              },
              "company_name": {
                "description": "What is the company's name?",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "data_handled": {
                "description": "What kinds of non-public data does the team handle? The policy already covers client confidential information, personal data and credentials; add anything else.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "effective_date": {
                "description": "Date the policy takes effect, YYYY-MM-DD. Defaults to today (UTC).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "industry": {
                "description": "What industry or kind of work is it?",
                "maxLength": 100,
                "type": "string"
              },
              "prohibited_uses": {
                "description": "What is off limits beyond the standard rules? One item per entry.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "review_cadence": {
                "description": "How often will the policy be reviewed?",
                "enum": ["every three months", "every six months", "once a year"],
                "type": "string"
              }
            },
            "required": ["company_name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "effective_date": {
                "type": "string"
              },
              "next_review_date": {
                "description": "Null when review_cadence was not given.",
                "type": ["string", "null"]
              },
              "placeholders": {
                "description": "Parts of the draft still to be filled in or checked; the same list is printed after the policy in the text content.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "policy_markdown": {
                "description": "The policy draft alone, Markdown. The text content of the result is this draft followed by a list headed 'Still to fill in or check'.",
                "type": "string"
              }
            },
            "required": ["disclaimer", "effective_date", "next_review_date", "placeholders", "policy_markdown"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft a short AI use policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c899022cbf0dce2ac496b424eabe51a1f3dc4f4e62e9617e92674e67fbddb79"
        },
        {
          "name": "get_policy_questions",
          "title": "Get the AI use policy questionnaire",
          "description": "Returns the short questionnaire behind draft_ai_use_policy: eight questions for a small business (company name, industry, AI tools in use, kinds of data the team handles, allowed uses, prohibited uses, who approves new tools, review cadence). Each question has an id, plain wording, type, limits and an example. Call this first, ask the person the questions, then pass their answers to draft_ai_use_policy. Takes no arguments, makes no network calls, stores nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "howToUse": {
                "type": "string"
              },
              "nextTool": {
                "type": "string"
              },
              "purpose": {
                "type": "string"
              },
              "questions": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["questions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the AI use policy questionnaire"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eef9ee03ccfeef79c12229218e1c0d14a95e12756ebb43c912700cea2f7171c3"
        }
      ],
      "digest": "sha256:dcedc5a6d0f72f2a0793d16737e0dd153d2672be639289a22268cf4534b47f3c"
    }
  }
}
