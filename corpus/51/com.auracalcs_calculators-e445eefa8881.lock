{
  "lockfileVersion": 2,
  "subjects": {
    "com.auracalcs/calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.auracalcs.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "auracalcs",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_1099_tax",
          "title": "Estimate 2026 1099 and self-employment tax",
          "description": "Estimate 2026 tax on 1099 / self-employment income: self-employment tax (Social Security and Medicare, with its full breakdown), federal income tax, optional flat state tax, the percent of each payment to set aside, and the quarterly payment. Same math as the auracalcs.com 1099 tax and self-employment tax calculators. Returns a link to the page, sources, the date checked, and a disclaimer. Estimate only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "applyQbiDeduction": {
                "description": "Apply the 20% qualified business income deduction. Defaults to true, like the website.",
                "type": "boolean"
              },
              "businessExpenses": {
                "description": "Deductible business expenses for the year. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "filingStatus": {
                "description": "single or married (filing jointly). Defaults to single.",
                "enum": ["single", "married"],
                "type": "string"
              },
              "grossIncome": {
                "description": "Total 1099 / self-employment income for 2026, before expenses.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "healthInsurancePremiums": {
                "description": "Self-employed health insurance premiums. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "retirementContributions": {
                "description": "SEP IRA or solo 401(k) contributions. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "stateTaxRate": {
                "description": "Flat state income tax rate in percent, applied to AGI. Use 0 for no-income-tax states. Defaults to 0, so state tax is left out unless given.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "w2Wages": {
                "description": "Other W-2 wages this year. They use up the Social Security wage base first. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["grossIncome"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate 2026 1099 and self-employment tax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d7705b1627af75cc7edb514ae16aa41f84972c62f26c03a331a05fc00c95354"
        },
        {
          "name": "calculate_paycheck",
          "title": "Estimate a 2026 paycheck",
          "description": "Estimate 2026 take-home pay for one paycheck in California, New York, Illinois, Texas, Florida, Nevada, Tennessee, Wyoming, South Dakota, Alaska, New Hampshire, or Washington. Federal income tax, Social Security, Medicare, and that state's withholding use the same figures as auracalcs.com. Returns the paycheck lines, a link to the matching page, the publications and the date they were checked, and a disclaimer. Estimate only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Pay amount in dollars, before tax. Annual salary, one gross paycheck, or an hourly wage.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "fedStep2Checkbox": {
                "description": "Form W-4 Step 2 checkbox.",
                "type": "boolean"
              },
              "fedStep3Credits": {
                "description": "Form W-4 Step 3 credits for the year.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "fedStep4a": {
                "description": "Form W-4 Step 4(a) other income for the year.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "fedStep4b": {
                "description": "Form W-4 Step 4(b) deductions for the year.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "fedStep4cExtra": {
                "description": "Form W-4 Step 4(c) extra withholding on this paycheck.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "filingStatus": {
                "description": "Form W-4 Step 1(c). New York estimates single and married filing jointly only.",
                "enum": ["single", "married", "hoh"],
                "type": "string"
              },
              "hoursPerWeek": {
                "description": "Used when payBasis is hourly. Defaults to 40.",
                "maximum": 168,
                "minimum": 0,
                "type": "number"
              },
              "ilLine2Allowances": {
                "description": "Illinois IL-W-4 line 2 allowances.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "nyLocality": {
                "description": "New York local tax. Ignored for other states.",
                "enum": ["none", "nyc", "yonkers_resident", "yonkers_nonresident"],
                "type": "string"
              },
              "nySdiDeducted": {
                "description": "Whether the New York employer deducts SDI. Paid Family Leave is still estimated.",
                "type": "boolean"
              },
              "payBasis": {
                "description": "How amount is entered.",
                "enum": ["annual", "paycheck", "hourly"],
                "type": "string"
              },
              "payFrequency": {
                "description": "How often this paycheck is paid.",
                "enum": ["weekly", "biweekly", "semimonthly", "monthly", "daily"],
                "type": "string"
              },
              "state": {
                "description": "Work state. The page for that state is linked in the result.",
                "enum": ["CA", "NY", "IL", "TX", "FL", "NV", "TN", "WY", "SD", "AK", "NH", "WA"],
                "type": "string"
              },
              "stateAllowances": {
                "description": "California DE 4 allowances, New York IT-2104 exemptions (0 to 10), or Illinois IL-W-4 line 1. States without an income tax ignore this.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "weeksPerYear": {
                "description": "Used when payBasis is hourly. Defaults to 52.",
                "maximum": 52,
                "minimum": 0,
                "type": "number"
              },
              "ytdGross": {
                "description": "Gross pay already received this year. Used only for Social Security and Additional Medicare on this paycheck.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["amount", "filingStatus", "payBasis", "payFrequency", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a 2026 paycheck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a63d86962069052684dae31b52b3e82bb0da792a417e22321946e824d1475f22"
        },
        {
          "name": "calculate_quarterly_estimated_tax",
          "title": "Plan 2026 quarterly estimated tax",
          "description": "Work out 2026 federal quarterly estimated tax payments with the IRS safe harbor rules (90% of this year's tax or 100%/110% of last year's), minus withholding, with the four due dates. Same math as the auracalcs.com quarterly estimated tax calculator. Estimate only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "expectedTax2026": {
                "description": "Expected total 2026 tax: federal income tax plus self-employment tax. calculate_1099_tax can estimate it.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "paymentsMade": {
                "description": "Estimated payments already made for 2026. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "priorYearAgiOver150k": {
                "description": "Was 2025 AGI over $150,000 ($75,000 if married filing separately)? Then the prior-year safe harbor is 110%. Defaults to false.",
                "type": "boolean"
              },
              "priorYearTax2025": {
                "description": "Total tax on the 2025 return (Form 1040 line 24). Use 0 only if 2025 had no tax liability and was a full 12-month year.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "withholding": {
                "description": "Federal tax withheld from W-2 jobs in 2026. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["expectedTax2026", "priorYearTax2025"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan 2026 quarterly estimated tax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fce667bae32d4476805547b4f6b7764a8fafe255b3b64b49ce8b038ec489f4c"
        },
        {
          "name": "compare_1099_vs_w2",
          "title": "Compare a 1099 contract with a W-2 salary",
          "description": "Compare a 1099 hourly contract with a W-2 salary offer, counting the extra self-employment tax, 401(k) match, health insurance and business expenses. Returns which pays more, by how much, and the break-even 1099 hourly rate. Same math as the auracalcs.com 1099 vs W-2 calculator. Estimate only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "billableHoursPerWeek": {
                "description": "Billable hours per week on the contract. Defaults to 40.",
                "maximum": 168,
                "minimum": 0.01,
                "type": "number"
              },
              "businessExpenses": {
                "description": "Business expenses as a contractor per year. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "employer401kMatchPercent": {
                "description": "Employer 401(k) match as a percent of salary. Defaults to 0.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "employerHealthInsurance": {
                "description": "Employer-paid health insurance per year. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "hourlyRate1099": {
                "description": "1099 hourly contract rate offered.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "paidDaysOff": {
                "description": "Paid vacation and holiday days in the W-2 job. Defaults to 0.",
                "maximum": 260,
                "minimum": 0,
                "type": "number"
              },
              "w2Salary": {
                "description": "W-2 annual salary offered.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "weeksWorkedPerYear": {
                "description": "Weeks worked per year on the contract. Defaults to 48, like the website.",
                "maximum": 52,
                "minimum": 0.01,
                "type": "number"
              }
            },
            "required": ["hourlyRate1099", "w2Salary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare a 1099 contract with a W-2 salary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:660a2ad2504034e3ac29eae752f3a68e0ca4b2b9c30b6df4bd3813902a2364b3"
        },
        {
          "name": "convert_hourly_to_salary",
          "title": "Convert hourly pay to gross salary",
          "description": "Convert an hourly wage into gross annual, monthly, semimonthly, biweekly, weekly, and daily pay, including overtime. Uses the same formula as the AuraCalcs hourly to salary page. This is gross pay before tax. Estimate only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hourly": {
                "description": "Hourly wage in dollars. Same field as the website.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "hourlyRate": {
                "description": "Alias for hourly.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "hours": {
                "description": "Hours per week. Defaults to 40.",
                "maximum": 168,
                "minimum": 0,
                "type": "number"
              },
              "hoursPerWeek": {
                "description": "Alias for hours.",
                "maximum": 168,
                "minimum": 0,
                "type": "number"
              },
              "ot": {
                "description": "Overtime hours per week. Defaults to 0.",
                "maximum": 80,
                "minimum": 0,
                "type": "number"
              },
              "otx": {
                "description": "Overtime multiplier. Defaults to 1.5.",
                "maximum": 3,
                "minimum": 1,
                "type": "number"
              },
              "unpaidWeeks": {
                "description": "If paid weeks are omitted, paid weeks are 52 minus this number.",
                "maximum": 52,
                "minimum": 0,
                "type": "number"
              },
              "weeks": {
                "description": "Paid weeks per year. Defaults to 52.",
                "maximum": 52,
                "minimum": 0,
                "type": "number"
              },
              "weeksPerYear": {
                "description": "Alias for weeks.",
                "maximum": 52,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert hourly pay to gross salary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1450dadd411692c5eaa8e317aa834f7f3e1a7a7fe856060ebec216d8f7e608f"
        }
      ],
      "digest": "sha256:86e8e75c08aed7f700d065a3c098eae21b84f2a63a06498bd39f088c7f568153"
    }
  }
}
