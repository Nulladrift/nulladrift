{
  "lockfileVersion": 2,
  "subjects": {
    "com.citefiles/citefiles": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://citefiles.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "citefiles",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Cite Files measures whether AI assistants can reach, read and cite a public website, and tells you exactly what to change. Free, no account needed for these tools. Typical use: citefiles_scan to measure, citefiles_fix_prompt to plan the work, then citefiles_scan again to verify — do not claim a site improved without re-running it. Full docs at https://citefiles.com/llms.txt",
      "tools": [
        {
          "name": "citefiles_agent_commerce",
          "description": "Requires an API token (Authorization: Bearer cf_…). Read the stored Agent Commerce Readiness audit for a scan on your citefiles account: whether an AI agent can authenticate without a human's password, discover an API, read prices as text, and be offered a machine-payable challenge — as a tier from T0 to T5. Create a token at https://citefiles.com/account. Only returns audits for scans your account owns. This tool never runs a new audit — run it from the scan's report page first, then call this tool to read the result.",
          "inputSchema": {
            "properties": {
              "scan": {
                "description": "The scan's public id, from a citefiles.com/report/<id> URL.",
                "type": "string"
              }
            },
            "required": ["scan"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ef2b0294202d33bb8e839e44e19cf8042985a99ff65560aba57b484c21e6334"
        },
        {
          "name": "citefiles_check_files",
          "description": "Check which AI-facing discovery files a website actually serves: llms.txt, llms-full.txt, ai.txt, robots.txt, sitemap.xml, AGENTS.md, .well-known/mcp.json and others. Distinguishes a real file from a single-page app returning its HTML shell for every unknown path, which is the usual reason a file appears to exist but does not. Use this to verify a file you just published is being served correctly.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The public website address.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9d54d189bd1f9aa9292e75040de2bd102ffb3cb5cdee1eec7456fe981726042b"
        },
        {
          "name": "citefiles_crawler_access",
          "description": "Test how a website answers requests that carry the user-agent strings of four AI crawlers — GPTBot, OAI-SearchBot, ClaudeBot and PerplexityBot — by requesting its homepage as a browser and again as each, then comparing. The requests come from our server, not the vendors' networks, so a rule that checks the sender's address is not tested. Catches CDN and WAF rules that block assistants without the owner knowing. Use when a site looks correct but is not being cited.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The public website address.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc165ba05b4d1f5411aaeaa89ad8561acf8fdcc93c2e0cfaa119c7a8819b1945"
        },
        {
          "name": "citefiles_fix_prompt",
          "description": "Get a task list for making a website readable and citable by AI assistants, derived from a real scan of it. Returns the findings with the evidence behind each, and the rules to follow while fixing them — most importantly that you must not invent facts about the business, and must leave a visible TODO instead. Use this to plan the work after citefiles_scan.",
          "inputSchema": {
            "properties": {
              "style": {
                "description": "Prose instruction (claude) or a task list with acceptance criteria (codex). Defaults to claude.",
                "enum": ["claude", "codex"],
                "type": "string"
              },
              "url": {
                "description": "The public website address.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e9bd129ca808229a7b5376b52ab7c4e462e85fbff8e04a9e093d4b588ae733e1"
        },
        {
          "name": "citefiles_scan",
          "description": "Check whether AI assistants can reach, read and cite a public website. Returns a citation-readiness score out of 100, the category breakdown, and the specific problems found — crawler blocks, missing llms.txt/ai.txt/sitemap, thin or JavaScript-only content, missing structured data. Use this before changing a site for AI visibility, and again afterwards to check the change worked. Scans of the same site within six hours are reused.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The public website address, e.g. example.com or https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:116b6d44b63dfaf43e886e87a6ddc5399e61fb7d0e3627cc4d397a2247344455"
        }
      ],
      "digest": "sha256:b7bc449dc08a0cad85adb661a90f619225df5dcd553090de42ef3577d5302b3b"
    }
  }
}
