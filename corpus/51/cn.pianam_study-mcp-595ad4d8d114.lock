        {
          "name": "physics_calc",
          "title": "Physics Calc",
          "description": "中学物理公式计算器（力学+电学）：传入已知物理量，自动匹配公式求未知量。覆盖公式族：牛顿第二定律 F=ma（F力N/m质量kg/a加速度m/s²）、重力 G=mg（g默认9.8N/kg，可传g=10）、压强 p=F/S（Pa/N/m²）、欧姆定律 I=U/R（A/V/Ω）、电功 W=UIt（J/V/A/s）、电功率 P=UI（W/V/A）、动能 Ek=½mv²（J/kg/m·s⁻¹）、匀变速直线运动 v=v0+at 与 s=v0t+½at²。用法：直接传参如 m=2,a=3 求 F；或传 expr=\"m=2,a=3\" / \"质量=50\"；也可用 formula 指定公式族。全部使用国际单位制，结果带单位与解题步骤。",
