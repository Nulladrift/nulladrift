        {
          "name": "balance_equation",
          "title": "Balance Equation",
          "description": "化学方程式配平：输入未配平的化学方程式（反应物=生成物，用 = 或 → 连接，物质间用 + 连接），自动用线性代数（齐次线性方程组整数解）求出最简整数系数，返回配平后的方程式、各物质系数与原子守恒校验。示例：\"Fe+O2=Fe3O4\"、\"C2H6+O2=CO2+H2O\"、\"KMnO4=K2MnO4+MnO2+O2\"、\"Cu+HNO3=Cu(NO3)2+NO+H2O\"。支持括号（如 Ca(OH)2、Fe2(SO4)3）。注意：仅支持分子反应方程式，不支持离子方程式与电极反应。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "equation": {
                "description": "化学方程式字符串，如 \"Fe+O2=Fe3O4\"、\"C2H6+O2=CO2+H2O\"",
                "type": "string"
              }
            },
            "required": ["equation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3fd32f6f1e2f113537c2ff41f642b505192b348dfd5024e40f25f1efee04574f"
        },
        {
          "name": "chemistry_calc",
          "title": "Chemistry Calc",
          "description": "化学式摩尔质量计算：输入化学式（如 H2SO4、Ca(OH)2、Fe2(SO4)3、CuSO4·5H2O），返回摩尔质量（g/mol）、各元素的原子个数、质量贡献与质量分数（%）。支持括号嵌套与结晶水合物（用 · 连接）。放射性元素无标准原子量时会提示。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "formula": {
                "description": "化学式，如 \"H2SO4\"、\"Ca(OH)2\"、\"CuSO4·5H2O\"",
                "type": "string"
              }
            },
            "required": ["formula"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:50e8a80212a33d19ffd576e9a0ee47df9b22180f4565c8df3686506256348855"
        },
        {
          "name": "element_lookup",
          "title": "Element Lookup",
          "description": "元素周期表查询（118 种元素全量本地数据）：按中文名（如 氧、铁、金）、元素符号（如 O、Fe、Au，大小写不敏感）或原子序数（1-118）查询，返回原子序数、符号、中文名、相对原子质量、族/周期、元素类别与常见化合价。不传 query 时返回全部 118 种元素。数据为本地 SQLite，无需联网。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "模糊匹配时最多返回条数，默认 20",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "中文名 / 元素符号 / 原子序数；留空返回全部元素"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:72702b3f6b8ffcc9577b98e8dbf1aa7f966b42a19256737a0dac03ab5081b9ca"
        },
        {
          "name": "math_solve",
          "title": "Math Solve",
          "description": "中小学数学求解器，支持五类问题（结果尽量给出分数/根式精确形式+小数近似）：① kind='quadratic' 一元二次方程求根：传 expr 如 \"x²-5x+6=0\"、\"2x^2+3x-2=0\"，或系数 a,b,c（ax²+bx+c=0），返回判别式 Δ 分析（两实根/重根/无实根）与精确根、复数根提示；② kind='linear2' 二元一次方程组：传 eq1/eq2 如 eq1='2x+3y=8', eq2='x-y=1'，或系数 a1,b1,c1,a2,b2,c2；③ kind='combination' 组合数 C(n,k)：传 n,k 或 expr='C(5,2)'；④ kind='permutation' 排列数 A(n,k)：传 n,k 或 expr='A(5,2)'；⑤ kind='sequence' 数列：seq_type='arithmetic'/'geometric'，传 first(首项)、common(公差d/公比q)、terms(项数n)，返回第 n 项与前 n 项和。不传 kind 直接传 expr 可自动识别题型。",
