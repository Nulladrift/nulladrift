{
  "lockfileVersion": 2,
  "subjects": {
    "com.flightmapworld/flights": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://flightmapworld.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "flightmapworld",
        "title": "FlightMapWorld",
        "version": "1.0.0",
        "websiteUrl": "https://flightmapworld.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FlightMapWorld answers questions about flight routes worldwide: which airports and airlines fly where, nonstop or with stops, flight times, and the lowest one-way fares recently found (US dollars, from cached searches, so they change). Airports are named by IATA code; search_airports finds the code for a city or airport name. Every answer carries links to flightmapworld.com: route_url is the route page and book_url a flight search, where the live price is shown. Booking links go to the Aviasales flight search and are affiliate links.",
      "tools": [
        {
          "name": "find_connections",
          "title": "Routings with stops",
          "description": "Ways to get between two airports that have no convenient nonstop flight, built from nonstop legs seen in recent fare results: where to change planes, the airlines, flight time and lowest fare of each leg. The legs are separate tickets, with no guaranteed connection between them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "IATA code of the arrival airport, three letters, for example OTP or LHR.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "max_stops": {
                "description": "Most stops allowed, 1 or 2 (default 2).",
                "maximum": 2,
                "minimum": 1,
                "type": "integer"
              },
              "origin": {
                "description": "IATA code of the departure airport, three letters, for example OTP or LHR.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Routings with stops"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:61d9228f19893a7c63ce60328e3216fdcafca732f7e08fbdea65ea731fa80b23"
        },
        {
          "name": "get_route",
          "title": "Flight route details",
          "description": "Everything known about flying from one airport to another: whether a nonstop flight exists and which airlines fly it, flight time, distance, the cheapest dates with their fares, the lowest fare per month, and where fares with stops change planes. Fares come from cached searches; route_url is the route page and book_url a flight search for that date, where the live price is shown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "IATA code of the arrival airport, three letters, for example OTP or LHR.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "month": {
                "description": "Optional month to look at, as YYYY-MM. Without it the cheapest dates of the whole year ahead are returned.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "origin": {
                "description": "IATA code of the departure airport, three letters, for example OTP or LHR.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flight route details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9f0a91056a273317f938ba8f1ee3d7b77a98a9d5d971eb49aa459600d5733650"
        },
        {
          "name": "list_destinations",
          "title": "Destinations from an airport",
          "description": "Where you can fly from an airport, cheapest first: each destination with its lowest one-way fare, whether the flight is nonstop, the airline and the flight time. Answers questions like \"where can I fly from Cluj for under 50 dollars\" or \"nonstop destinations from Lisbon\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Only destinations in this country, as a two-letter ISO code, for example ES or IT.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "How many destinations to return (1 to 50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Only destinations with a one-way fare at or under this many US dollars.",
                "minimum": 1,
                "type": "number"
              },
              "nonstop_only": {
                "description": "Only destinations with a nonstop flight (default false).",
                "type": "boolean"
              },
              "origin": {
                "description": "IATA code of the departure airport, three letters, for example OTP or LHR.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Destinations from an airport"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cab8c740ea3672872b4de7ba757074053faa7551efdb12090e0654163b73ed9c"
        },
        {
          "name": "search_airports",
          "title": "Search airports",
          "description": "Finds airports by city, airport name, country or IATA code. Returns each airport with its three-letter IATA code, city, country and a link to the airport page with every destination served from it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many airports to return (1 to 10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "City, airport name, country or IATA code, for example \"Bucharest\", \"Heathrow\" or \"OTP\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search airports"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9238fe66d52f0ab434457d3fe5ac2e13da8aec19871538e9b13dfa011b2ef39f"
        }
      ],
      "digest": "sha256:938c4c48f18e1e30ca5aabafe4faaf76ca55e69a80812e95ca8bd692a8fcb44f"
    }
  }
}
