        {
          "name": "get_climate_profile",
          "title": "Long-term climate risk of one place: floods, heat, drought, sea level",
          "description": "Long-term climate risk of one place or property in depth, from 57 global layers: river and coastal flood depth of a 100-year flood now, 2050 and 2080; sea level rise; extreme heat and cold days; heavy rain; drought; water stress; wildfire; warming and rainfall change to 2050 and 2080 with the models' range; NDVI vegetation; earthquake hazard, subsidence, elevation, land cover and the climate zone. Narrow it with categories or layer ids (fetch catalog:layers).\n\nUse for buying, renting or building a home or moving somewhere: \"does this area flood\", \"how hot will it get here by 2050\". Two or more places, a list of sites or a portfolio: get_climate_table, up to 200 in one call. Not for this week's weather (get_forecast) or events now (get_hazards_near).",
          "inputSchema": {
            "properties": {
              "categories": {
                "description": "Only the layers of these categories; every layer when omitted. misc holds Köppen climate zone, now and in 2050 and 2080, solar radiation, solar radiation of the sunniest month, surface runoff; fetch catalog:layers lists every layer",
                "items": {
                  "enum": ["temperature", "precipitation", "wind", "water", "flooding", "vegetation", "misc", "terrain", "landcover"],
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Language code for the name of the place found (resolved_from); the rest of the answer is English",
                "enum": ["en", "de", "fr", "it", "es", "nl", "pl", "uk", "ro", "sr", "ru"],
                "type": "string"
              },
              "latitude": {
                "description": "Latitude, WGS84; or give place_name",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "layers": {
                "description": "Only these layers, by id, e.g. ndvi/annual for the NDVI vegetation index or flood_riverine/inundation for river flood depth; fetch catalog:layers lists every id. Combined with categories, both are given",
                "items": {
                  "type": "string"
