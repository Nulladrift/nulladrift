        {
          "name": "get_hazards_near",
          "title": "Natural disasters happening near a place",
          "description": "Disasters, hazards and official warnings happening now or recently near a place: wildfires, earthquakes, tsunamis, tropical cyclones with cone and track, floods, eruptions and volcano alert levels, ash clouds, droughts, official weather warnings and air quality. Each has Criora Severity (severity_rank, 0 to 100) beside the issuer's own level, its distance, and for a warning whether the place is inside it.\n\nUse for \"what is happening in or near X\", \"what happened in Valencia\", \"is it safe to go there now\". Narrow with radius_km, event_types, min_severity or days (up to 30). Forecast: get_forecast; long-term risk: get_climate_profile.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Every event active in the last N days, 1 to 30, each marked current or over; for this week, 7. Omitted, only what is current now, which drops most earthquakes a day to four days after they struck",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "event_types": {
                "description": "Only these kinds of event; every kind when omitted",
                "items": {
                  "enum": ["wildfire", "earthquake", "flood", "cyclone", "volcano", "drought", "air_quality", "wind", "snow_ice", "thunderstorm", "fog", "heat", "cold", "coastal", "avalanche", "rain", "tsunami"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Language code for the name of the place found (resolved_from); the rest of the answer is English",
                "enum": ["en", "de", "fr", "it", "es", "nl", "pl", "uk", "ro", "sr", "ru"],
                "type": "string"
              },
              "latitude": {
