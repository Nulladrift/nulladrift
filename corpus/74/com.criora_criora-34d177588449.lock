        {
          "name": "get_place_history",
          "title": "What has happened at a place in the past",
          "description": "What has hit a place before: \"has Lisbon had a big earthquake\", \"how often do typhoons reach Manila\", \"what floods has Valencia had\". Earthquakes, tropical cyclones, tsunamis, floods and eruptions near it: how many by decade and the largest, with date, distance, deaths and damage.\n\nA count is complete only from `complete_from` (quakes of M5 and up 1976, cyclones 1980, floods 2021, and its `note` says so: a rise in floods before then is no trend). Ask for more years to reach the great events: the record goes back to 1700 for those that cost lives, and to 1870 for Europe's floods. What is happening now: get_hazards_near.",
          "inputSchema": {
            "properties": {
