        {
          "name": "show_risk_map",
          "title": "Interactive climate risk and weather map",
          "description": "Shows an interactive map in clients that render apps (Claude, ChatGPT): this week's forecast risk, hazard events and official warnings for a place, several places side by side, one event (its area, a storm's cone and track) or the whole world; layer opens it on rain, temperature or wind instead. A client without apps gets a text summary and a link.\n\nUse it when the user wants to see a place, a storm or the world on a map.",
          "inputSchema": {
            "$defs": {
              "PlaceGiven": {
                "additionalProperties": false,
                "description": "One place, by its name or its coordinates.",
                "properties": {
                  "latitude": {
                    "description": "Latitude, WGS84; or give place_name",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "description": "Longitude, WGS84; or give place_name",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "place_name": {
                    "description": "A place name or street address; add the country after a comma when ambiguous (Portland, Maine)",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "properties": {
              "event_id": {
                "description": "An event's id from list_hazards or get_hazards_near, for the map of that event",
                "minimum": 1,
                "type": "integer"
              },
              "focus": {
                "default": "both",
                "description": "What a place's map shows: this week's forecast risk, the hazard events nearby, or both; an event's map leaves the events around it out for week",
                "enum": ["both", "week", "hazards"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language code for the name of the place found (resolved_from); the rest of the answer is English",
                "enum": ["en", "de", "fr", "it", "es", "nl", "pl", "uk", "ro", "sr", "ru"],
                "type": "string"
              },
              "latitude": {
                "description": "Latitude, WGS84; or give place_name",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "layer": {
                "default": "risk",
                "description": "The forecast field the map opens on, under the hazard events: the risk (default), or the precipitation, temperature or wind forecast when the question is about the weather itself. The reader can switch between them on the map",
                "enum": ["risk", "precipitation", "temperature", "wind"],
                "type": "string"
              },
              "longitude": {
                "description": "Longitude, WGS84; or give place_name",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place_name": {
                "description": "A place name or street address; add the country after a comma when ambiguous (Portland, Maine)",
                "type": "string"
              },
              "places": {
                "description": "2 to 10 places to set side by side, each a place_name or latitude and longitude",
                "items": {
                  "$ref": "#/$defs/PlaceGiven"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "type": "object"
          },
