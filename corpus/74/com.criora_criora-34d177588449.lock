          "title": "The weather ahead and the long-term climate over a country or a region",
          "description": "The next 1 to 7 days' weather danger over a whole country or region, day by day: the worst class reached, its hazard, the share of the area at each class, the worst point and the cities most at risk; with categories or layers, also long-term climate layers over the area (mean, 10th and 90th percentile, share at or above a value).\n\nUse for \"how bad is the weather in Japan this week\", \"how much of Spain faces high heat tomorrow\", \"how much of Bangladesh floods in a 100-year flood\". One place: get_forecast or get_climate_profile.",
