        {
          "name": "estimate_financial_impact",
          "title": "Indicative flood and cyclone damage to a building or asset",
          "description": "Indicative damage to a building or asset at a place from river and coastal flooding and tropical cyclone wind: expected annual damage as a share of its value and in money, and the 50 to 500-year events, low, central and high; today, or RCP4.5 or RCP8.5 in 2050 and 2080 (wind to 2050).\n\nUse for what flooding could cost a home, a property or loan collateral, and ESRS E1, IFRS S2, TCFD or EU Taxonomy screening. Give asset_value for money in its currency, which any one building needs; without it the money is for all buildings of its class in the point's 1 km cell, in euros, never one building's. A town or city asked by name resolves to one point of it: `built_ground` then says how its built ground shares out among the bands, which is the answer for the place; the money and band are the point's. Indicative, not a valuation: pass the caveats on.",
          "inputSchema": {
            "properties": {
              "asset_class": {
                "description": "What the asset is: residential, commercial or industrial buildings, transport, roads or agriculture",
                "enum": ["residential", "commercial", "industrial", "transport", "roads", "agriculture"],
                "type": "string"
              },
              "asset_value": {
                "description": "The asset's replacement value, to have the damage in money; without it a building's damage is priced at the replacement cost of its class's buildings in the point's 1 km cell, in euros",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "ISO 4217 code of asset_value, echoed; nothing is converted",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language code for the name of the place found (resolved_from); the rest of the answer is English",
                "enum": ["en", "de", "fr", "it", "es", "nl", "pl", "uk", "ro", "sr", "ru"],
                "type": "string"
              },
              "latitude": {
                "description": "Latitude, WGS84; or give place_name",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude, WGS84; or give place_name",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place_name": {
                "description": "A place name or street address; add the country after a comma when ambiguous (Portland, Maine)",
                "type": "string"
              },
              "protection_rp": {
                "description": "The return period in years the site's flood defences hold; FLOPROS's when omitted",
                "minimum": 1,
                "type": "number"
              },
              "response_format": {
                "default": "concise",
                "description": "concise (default) answers the question; detailed adds every field the sources give",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "scenario": {
                "default": "historical",
                "description": "historical for today, or rcp4p5 or rcp8p5 with a year",
                "enum": ["historical", "rcp4p5", "rcp8p5"],
                "type": "string"
              },
              "year": {
                "description": "2050 or 2080, with rcp4p5 or rcp8p5",
                "enum": [2050, 2080],
                "type": "integer"
              }
            },
            "required": ["asset_class"],
            "type": "object"
          },
