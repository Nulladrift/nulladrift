      "instructions": "Criora (https://criora.com) publishes climate and disaster risk for any place on Earth.\n\n- assess_place answers a general question about a place or a trip (\"is it safe\", \"what are the\n  risks\", \"how risky is this trip in March\") in one call for up to ten places, each on the days\n  asked: each day's forecast risk for 7 days, the ECMWF ensemble's chances to two weeks and the\n  month's 1991-2020 normal past it, hazard events nearby, the headline climate exposures and the\n  country's risk profile.\n- get_forecast is this week's weather and weather risk; get_hazards_near, the events happening now near\n  a place; get_place_history, what has hit it in past decades; get_climate_profile, long-term exposure (floods, sea level rise, heat, drought, water\n  stress), and get_climate_table, the same for many sites, up to 200 at once; get_climate_twin, the city whose\n  climate today a city will have in the 2050s.\n- list_hazards is the events in force across a country, a region or the world, the world's with the\n  Earth's pulse; rank_by_forecast, the places or countries the days ahead put most at risk;\n  get_area_risk, the days ahead and the climate layers over a country or a region.\n- get_country_profile is one country; compare_countries, named countries side by side;\n  rank_countries, countries most or least at risk, overall or on a hazard (floods, cyclones),\n  in a region or income group;\n  get_enso_outlook, El Niño now and what it brings a country.\n- estimate_financial_impact is indicative flood and cyclone damage to a building or asset, low to high\n  with its caveats, for ESRS E1, IFRS S2 or TCFD screening.\n- find_place resolves a name to candidates; show_risk_map opens the map in the chat.\n- search and fetch find and read a country, a place, the methodology and data sources pages, or the\n  data catalogue (catalog:layers, catalog:indicators) as a markdown document with the Criora page to cite.\n- The resources criora://country/{iso3}, criora://methodology, criora://sources, criora://layers,\n  criora://indicators and criora://changelog attach the same as context without a tool call.\n- Data: 57 long-term layers in get_climate_profile (ERA5 heat, cold, rain, wind and storm days; CMIP6\n  warming and rainfall change to 2050 and 2080; WRI Aqueduct flood depth, water stress and drought; IPCC\n  AR6 sea level rise; GloFAS; SPI-12 and aridity; MODIS NDVI and land cover; ERA5 soil moisture and snow;\n  GFED burned area; JRC surface water and built-up share; Copernicus DEM; subsidence; GSHAP earthquake\n  hazard; Köppen zones), the ECCC GDPS forecast and the ECMWF ensemble, hazard events from FIRMS, GDACS,\n  USGS, EMSC, NOAA, NHC, JMA, JTWC, GeoNet, the VAACs, NWS, MeteoAlarm, ECCC, SMN, IMD, INMET, KMA, PAGASA,\n  AirNow and CAMS, and country indicators from INFORM, ND-GAIN and the World Bank. A layer is asked for by\n  category or id (ndvi/annual).\n- Data tools answer concise by default; response_format=detailed adds provenance, a warning's full\n  text, the source's facts, every forecast step and indicators. Past 32,000 characters an\n  answer's main list is cut, and truncated says how many rows were left out and how to narrow it.\n- The place tools take latitude and longitude, or a place_name resolved to its best match in Criora's\n  GeoNames gazetteer (an address by OpenStreetMap's Nominatim); the answer says what it was resolved\n  to. A name is found best alone or with its country after a comma (Córdoba, Spain).\n- credit is how to credit an answer retold: \"Source: Criora\" with its link, and each originator's\n  words. criora_url opens the place on the Criora map.\n- Forecast risk is graded on five classes (Very low, Low, Medium, High, Critical); rain, snow and wind\n  take precedence over temperature, and heat and cold are graded on UTCI, the felt temperature outdoors\n  in the sun.\n- A climate layer with applicable=false does not describe the place (sea-level rise inland), and\n  its note says why. A layer with available=false has no value there, which is not a value of zero.\n- Criora's figures are data, not personal, financial or insurance advice.\n",
      "tools": [
        {
          "name": "assess_place",
          "title": "Climate and disaster risk of places, on given days",
          "description": "Everything about one to ten places in one call: each day's risk on the dates asked (the 7-day forecast, then ECMWF ensemble chances as far as its run reaches, about two weeks, then the month's normal), hazards happening nearby, the headline long-term exposures, a home's damage band and the country's risk. headline is the line that matters most.\n\nUse it first for open questions: a trip (\"I'm flying to Tokyo on the 25th\": one call with every stop and its dates), moving or buying a home (\"is it safe to live in...\"), \"what are the risks in...\". For one specific question the matching tool answers in full.",
          "inputSchema": {
            "$defs": {
              "PlaceAsked": {
                "additionalProperties": false,
                "description": "One place assess_place is asked about, on the days asked.",
                "properties": {
                  "end_date": {
                    "description": "The last day asked about, at most 31 days from start_date",
                    "format": "date",
                    "type": "string"
                  },
                  "latitude": {
                    "description": "Latitude, WGS84; or give place_name",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "description": "Longitude, WGS84; or give place_name",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "place_name": {
                    "description": "A place name or street address; add the country after a comma when ambiguous (Portland, Maine)",
                    "type": "string"
                  },
                  "start_date": {
                    "description": "The first day asked about, YYYY-MM-DD, today or later; alone it asks about that one day",
                    "format": "date",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "properties": {
              "language": {
                "default": "en",
                "description": "Language code for the name of the place found (resolved_from); the rest of the answer is English",
                "enum": ["en", "de", "fr", "it", "es", "nl", "pl", "uk", "ro", "sr", "ru"],
                "type": "string"
              },
              "places": {
                "description": "1 to 10 places, each a place_name or latitude and longitude, with the days asked",
                "items": {
                  "$ref": "#/$defs/PlaceAsked"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "response_format": {
                "default": "concise",
                "description": "concise (default) answers the question; detailed adds every field the sources give",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["places"],
            "type": "object"
          },
