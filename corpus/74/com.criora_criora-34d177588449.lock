      "serverInfo": {
        "name": "criora",
        "title": "Criora climate risk",
        "version": "2.2.2",
        "description": "Climate and disaster risk for any place or trip: forecasts, warnings, floods, quakes, countries, map",
        "websiteUrl": "https://criora.com/docs/references/api-and-agents"
      },
      "capabilities": {
        "completions": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
