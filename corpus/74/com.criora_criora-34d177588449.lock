          "description": "A list of sites, a portfolio, addresses or spreadsheet rows screened in one call: the long-term layers of get_climate_profile at up to 200 places, as a table, a row per place and a column per layer and band. By default the headline exposures: river and coastal flood depth, sea level rise, heat, heavy rain, water stress, drought, wildfire, earthquake hazard and the climate zone; narrow it with categories (flooding...) or layer ids. Each row carries a home's damage band there.\n\nUse it whenever two or more places are asked about, rather than a profile per place: rank sites on the bands and columns, or compare places on the same layers. One place in depth: get_climate_profile.",
