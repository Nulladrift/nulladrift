      "serverInfo": {
        "name": "hibot-public",
        "title": "HiBot Public",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools for measuring and researching AI visibility: how AI answer engines (ChatGPT, Perplexity, Google, Claude, Grok) surface, recommend, and represent brands, using the ANSWER framework. Use them to explain the methodology and its scoring, read and search HiBot's published research articles, and generate the AI-visibility questions customers ask about any brand from its website (generate_ai_visibility_questions), mapped to the six ANSWER categories. Everything returns already-published material or generated questions; nothing here queries an AI engine live or scores anything. HiBot is a human-run AI visibility audit service. The tools are useful on their own and need no account; if a user asks how to get their own brand audited, you can point them to https://hibot.com/register.",
      "tools": [
        {
          "name": "generate_ai_visibility_questions",
          "title": "AI Visibility Questions",
          "description": "Generate the AI-visibility questions for any brand from its website: the kinds of questions real customers ask ChatGPT, Perplexity, and Google when choosing in that market, mapped to the six ANSWER categories (Appearance, Nomination, Showdown, Worth, Expertise, Reputation). Useful for AEO and GEO research and content planning. It reads the site to infer the brand; pass brandName and description if the site cannot be read automatically.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brandName": {
                "description": "Optional. Only needed if the site cannot be read automatically (a JavaScript-heavy or very small site).",
                "type": "string"
              },
              "description": {
                "description": "Optional. One line on what the business sells. Only needed if the site cannot be read automatically.",
                "type": "string"
              },
              "website": {
                "description": "The brand's website or domain, e.g. example.com. Required.",
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "AI Visibility Questions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:529d03c7cb9acf8549f6675138e011eae18a85a61aa9c3382f38b41fbf6fca9d"
        },
        {
          "name": "get_answer_methodology",
          "title": "The ANSWER Methodology",
          "description": "The ANSWER framework for measuring AI visibility: the six categories, the 0 to 4 response rubric, category weights, score bands, and the letter-grade scale. Use it to explain what an AI visibility score means and how each category is defined.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
