          },
          "digest": "sha256:f13599829965690b419b22e8eb94180655eb7dbcc748a17dd045597d976e57cf"
        }
      ],
      "digest": "sha256:fca0c911cfc6f2a0117b4e03e327c53eba2be5f0c4b4ed791e1555bc161a9aa6"
    }
  }
