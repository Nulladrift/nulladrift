  "subjects": {
    "com.spocont/booboooking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://booboooking.com/api/slot/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "booboooking",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "booboooking: appointment booking with individual service providers.\n\n## Booking flow\n1. The provider is the identifier in its booking URL (e.g. \"radnaimark\" in booboooking.com/radnaimark).\n2. booboooking_list_services(provider) returns the services, with price and currency (payment is in cash at the appointment).\n3. booboooking_check_availability(provider, service_id) returns slots; each has a \"time\" (pass it unchanged to booboooking_book) and a \"display\" text. booboooking_find_next_available returns the next openings without a date range.\n4. booboooking_book needs the customer's name, email and phone, confirmed by the user. The phone is validated as E.164 (`+` and country code, no separators, e.g. `+36201234567`); a local-format number is rejected.\n\n## Booking response\nIt contains the reservation `id` and a `pin`. Both are needed to look up (booboooking_get_booking) or cancel (booboooking_cancel) the booking, and the pin is also in the customer's confirmation email. `cash_due`, when present, is the amount payable in cash.\n\n## Cancelling\nbooboooking_cancel(provider, reservation_id, pin) cancels and emails the customer. Without the pin a booking cannot be cancelled: the customer can find it in the confirmation email, or cancel on the provider's booking page.",
      "tools": [
        {
          "name": "booboooking_book",
          "description": "Book an appointment on booboooking.com (free OR paid services — payment is always in cash at the appointment, no online payment). customer_name, customer_email and customer_phone are the customer's own details, confirmed by the user. customer_phone is validated as international E.164 (`+` and country code, no spaces or dashes, e.g. `+36201234567`); a local-format number is rejected. On success the response includes the reservation `id` and `pin`, both needed to look up or cancel the booking, and optionally `cash_due: { amount, currency }`, the amount payable in cash at the appointment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "customer_email": {
                "description": "Customer email address",
                "type": "string"
              },
              "customer_name": {
                "description": "Customer full name",
                "type": "string"
              },
              "customer_phone": {
                "description": "Customer phone number in international E.164 format, e.g. \"+36201234567\" — convert local-format numbers (e.g. \"06201234567\") before calling this tool.",
                "pattern": "^\\+[1-9]\\d{6,14}$",
                "type": "string"
              },
              "date": {
                "description": "Date in YYYYMMDD format (e.g. \"20260415\")",
                "type": "string"
              },
              "provider": {
                "description": "Provider identifier",
                "type": "string"
              },
              "service_id": {
                "description": "Service ID from booboooking_list_services",
                "type": "string"
              },
              "time": {
                "description": "Start time in HH:MM format (e.g. \"09:30\") — use the \"time\" field from booboooking_check_availability results",
                "type": "string"
              }
            },
            "required": ["date", "provider", "service_id", "time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8baa59f4d876b7472fb940a3ec41dd50aa3bc7be0290203c5e5cc6fd81818610"
        },
        {
          "name": "booboooking_cancel",
          "description": "Cancel a reservation on booboooking.com. Requires the reservation_id AND pin that were returned from the original booboooking_book call — both are needed as proof of booking ownership. The pin is also in the customer's confirmation email; a wrong pin is refused.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "pin": {
                "description": "The PIN returned from the original booking",
                "type": "string"
              },
              "provider": {
                "description": "Provider identifier (same as the one used for booking)",
                "type": "string"
              },
              "reservation_id": {
                "description": "The `id` returned from the original booking (24-hex MongoDB ObjectId)",
                "type": "string"
              }
            },
            "required": ["pin", "provider", "reservation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e7e8beaf4b4e7694a1c71bff4dcbf56f91a7475b006810bfd36d99691b912b28"
        },
        {
          "name": "booboooking_check_availability",
          "description": "Check available time slots for a provider and service on booboooking.com. Returns available dates with slots — each slot has a \"time\" field (use this for booboooking_book) and a \"display\" field (show this to the user). Use this before booking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days_ahead": {
                "description": "How many days to check (default: 14, max: 30)",
                "type": "number"
              },
              "provider": {
                "description": "Provider identifier",
                "type": "string"
              },
              "service_id": {
                "description": "Service ID from booboooking_list_services (the \"id\" field)",
                "type": "string"
              },
              "start_date": {
                "description": "Start date in YYYYMMDD format (default: today)",
                "type": "string"
              }
            },
            "required": ["provider", "service_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd9fdaaa7721ebadb7c8b24d6ee9c5e37c9e9ae71f6ea4f87b39b8ff3948fc38"
        },
        {
          "name": "booboooking_find_next_available",
          "description": "Search forward for the next available appointment slots for a provider and service on booboooking.com. Returns up to `count` openings sorted chronologically. Useful when you need \"the next available appointment\" without a specific date in mind.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "Number of openings to return (default: 3, max: 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "from_date": {
                "description": "Start search from this date in YYYYMMDD format (default: today)",
                "type": "string"
              },
              "provider": {
                "description": "Provider identifier",
                "type": "string"
              },
              "search_days": {
                "description": "Days to search ahead (default: 30, max: 60)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "service_id": {
                "description": "Service ID from booboooking_list_services",
                "type": "string"
              }
            },
            "required": ["provider", "service_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:196440baed51bdb3769298e714a79053b3ef99f68584dd4210c0937752a64de2"
        },
        {
          "name": "booboooking_get_booking",
          "description": "Retrieve a booking by its reservation ID. Requires the PIN from the original booking response to prove ownership. Returns full booking details including payment state if the reservation was created via the payment flow.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "pin": {
                "description": "The PIN returned from the original booboooking_book call",
                "type": "string"
              },
              "provider": {
                "description": "Provider identifier (same as used for booking)",
                "type": "string"
              },
              "reservation_id": {
                "description": "The reservation ID returned from booboooking_book (24-char hex MongoDB ObjectId)",
                "type": "string"
              }
            },
            "required": ["pin", "provider", "reservation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
