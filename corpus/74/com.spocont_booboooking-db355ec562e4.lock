            "readOnly": true
          },
          "digest": "sha256:3c0cda15ad66ba6c1995ab39ea6bd8d7caa57859665d711e68f6760c66cd3961"
        },
        {
          "name": "booboooking_list_services",
          "description": "List available services for a provider on booboooking.com. Returns service names, IDs, duration, and price. Call this first to find the service ID needed for availability and booking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "provider": {
                "description": "Provider identifier (e.g. \"radnaimark\", \"tomi\")",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
