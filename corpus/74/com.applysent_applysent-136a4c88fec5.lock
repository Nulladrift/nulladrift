                    "type": "array"
                  },
                  "line": {
                    "description": "One sentence saying what this page holds, what was left out and what was not read; show it to the user as it is.",
                    "type": "string"
                  },
                  "total": {
                    "description": "How many rows the filters match in all, when that is known.",
                    "type": ["integer", "null"]
                  }
                },
                "required": ["complete", "gaps", "line"],
                "type": "object"
              },
              "filters": {
                "description": "The filters this page was read under.",
                "properties": {
                  "before": {
                    "description": "The ISO date applications were recorded before.",
                    "type": ["string", "null"]
                  },
                  "company": {
                    "description": "The employer filtered on.",
                    "type": ["string", "null"]
                  },
                  "q": {
                    "description": "The words matched in the job title or employer.",
                    "type": ["string", "null"]
                  },
                  "since": {
                    "description": "The ISO date applications were recorded on or after.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["before", "company", "q", "since"],
                "type": "object"
              },
              "offset": {
                "description": "The offset this page starts at.",
                "type": "integer"
              },
              "rows": {
                "description": "The light rows of one column's page, or the first rows of every column.",
                "items": {
                  "description": "One light application row of the board.",
                  "properties": {
                    "ats": {
                      "description": "The employer's hiring system.",
                      "type": "string"
                    },
                    "awaiting_fix": {
                      "description": "True while ApplySent is fixing a problem on its side before retrying.",
                      "type": "boolean"
                    },
                    "brand_color": {
                      "description": "The employer's brand colour, when one is known.",
                      "type": ["string", "null"]
                    },
                    "bucket": {
