        {
          "name": "search_jobs",
          "title": "Search matching jobs",
          "description": "Search the jobs that match the user's résumé and filters, best match first, a page at a time. Leaves out jobs already applied to unless include_applied is true, and postings open only to nationals unless the profile lists a nationality or nationals_only says otherwise. Reads only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City the posting is in, e.g. \"Dubai\" or \"London\".",
                "type": "string"
              },
              "country": {
                "description": "Country name or ISO code, e.g. \"US\", \"United Kingdom\", \"AE\".",
                "type": "string"
              },
              "employment_type": {
                "description": "e.g. full_time, part_time, contract.",
                "type": "string"
              },
              "include_applied": {
                "description": "Include jobs already applied to; they are left out otherwise.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "How many jobs to return.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_salary": {
                "description": "Only jobs stating pay of at least this; a job with no stated salary is left out.",
                "minimum": 0,
                "type": "number"
              },
              "min_score": {
                "description": "Only jobs the résumé matches at least this well; leave it out for no floor.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "nationals_only": {
                "description": "Whether postings open only to a country's nationals are left out, included, or the only ones kept; leaving it out excludes them unless the profile lists a nationality.",
                "enum": ["exclude", "include", "only"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip for the next page: the previous page's coverage names the offset to pass.",
                "minimum": 0,
                "type": "integer"
              },
              "posted_since": {
                "description": "ISO date; only jobs posted on or after it. Jobs with no known posting date are left out.",
                "type": "string"
              },
              "query": {
                "description": "Words in the title, employer or description.",
                "type": "string"
              },
              "salary_currency": {
                "description": "ISO code of the currency the stated pay must be in: with min_salary the floor is read in that currency, on its own it keeps the jobs that state pay in it.",
                "type": "string"
              },
              "seniority": {
                "description": "Seniority as postings state it, e.g. \"senior\", \"junior\", \"lead\".",
                "type": "string"
              },
              "sort": {
                "default": "score",
                "description": "Order of the page: best match first, or newest posting first.",
                "enum": ["score", "recent"],
                "type": "string"
              },
              "workplace": {
                "description": "Where the work is done; leave it out for any.",
                "enum": ["remote", "hybrid", "onsite"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "coverage": {
                "description": "What this page covers, so the assistant can say honestly what it read.",
                "properties": {
                  "complete": {
                    "description": "True when this page holds every matching row and no earlier page was skipped.",
                    "type": "boolean"
                  },
                  "empty_reason": {
                    "description": "Why nothing came back, when the page is empty; null when it holds rows.",
                    "type": ["string", "null"]
                  },
                  "gaps": {
                    "description": "What this result does not hold, one entry per gap.",
                    "items": {
                      "description": "One kind of row this result does not hold.",
                      "properties": {
                        "kind": {
                          "description": "Why the row is missing: \"page\" for later rows, \"earlier_pages\" for rows before this page, \"filtered\" for rows a filter left out.",
                          "type": "string"
                        },
                        "what": {
                          "description": "The gap in words: the offset to ask for next, or what was filtered out.",
                          "type": "string"
                        }
                      },
                      "required": ["kind", "what"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "line": {
                    "description": "One sentence saying what this page holds, what was left out and what was not read; show it to the user as it is.",
                    "type": "string"
                  },
                  "total": {
                    "description": "How many rows the filters match in all, when that is known.",
                    "type": ["integer", "null"]
                  }
                },
                "required": ["complete", "gaps", "line"],
                "type": "object"
              },
              "jobs": {
                "description": "The page of matching jobs, best match first or newest first as asked.",
                "items": {
                  "description": "One job row: its facts, its match assessment and the start of its text.",
                  "properties": {
                    "apply_supported": {
                      "description": "Whether ApplySent can fill and submit this posting's form by itself.",
                      "type": "boolean"
                    },
                    "apply_url": {
                      "description": "The employer's posting URL, where the application is filled.",
                      "type": "string"
                    },
                    "city": {
                      "description": "City the posting is in.",
                      "type": ["string", "null"]
                    },
                    "company": {
                      "description": "The employer's name.",
                      "type": "string"
                    },
                    "country": {
                      "description": "Country the posting is in, as the catalogue recorded it.",
                      "type": ["string", "null"]
                    },
                    "excerpt": {
                      "description": "The start of the posting's text, plain, for a list row.",
                      "type": "string"
                    },
                    "id": {
                      "description": "The job id the other job tools take.",
                      "type": "string"
                    },
                    "match": {
                      "description": "The assessment of this job against the user's résumé, targets and eligibility.",
                      "properties": {
                        "breakdown": {
                          "additionalProperties": {
                            "description": "Points this factor added to the score.",
                            "type": "integer"
                          },
                          "description": "Points each match factor added; a full job read carries them, a list row does not.",
                          "type": "object"
                        },
                        "eligible": {
                          "description": "Whether the user may take this job: work authorization, language and the posting's stated requirements all pass.",
                          "type": "boolean"
                        },
                        "missing": {
                          "description": "What the assessment could not establish about the user for this posting; a full job read carries it, a list row does not.",
                          "items": {
                            "description": "One fact the assessment could not establish about the user.",
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "notes": {
                          "description": "Notes the assessment kept beside the score; a full job read carries them, a list row does not.",
                          "items": {
                            "description": "One note the assessment kept beside the score.",
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "reasons": {
                          "description": "Why the job scores what it does, in words.",
                          "items": {
                            "description": "One reason the job scored as it did.",
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "score": {
                          "description": "Match score from 0 to 100 against the user's résumé and targets; higher is better.",
                          "type": "integer"
                        }
                      },
                      "required": ["eligible", "reasons", "score"],
                      "type": "object"
                    },
                    "posted_at": {
                      "description": "When the posting went up, ISO 8601 in UTC, when the catalogue knows it.",
                      "type": ["string", "null"]
                    },
                    "provider": {
                      "description": "The employer's hiring system the posting came from, e.g. workday, greenhouse or ashby.",
                      "type": "string"
                    },
                    "salary": {
                      "description": "The pay the posting states, or null when it states none.",
                      "properties": {
                        "currency": {
                          "description": "ISO code of the stated pay.",
                          "type": "string"
                        },
                        "max": {
                          "description": "Highest amount the posting states, in the currency's units.",
                          "type": ["number", "null"]
                        },
                        "min": {
                          "description": "Lowest amount the posting states, in the currency's units.",
                          "type": ["number", "null"]
                        },
                        "period": {
                          "description": "What the amounts are for (year, month, week, day or hour) when the posting states a period ApplySent recognizes.",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["currency", "max", "min", "period"],
                      "type": ["object", "null"]
                    },
                    "saved": {
                      "description": "Whether the user saved this job.",
                      "type": "boolean"
                    },
                    "title": {
                      "description": "The posting's title as the employer states it.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "match"],
                  "type": "object"
                },
                "type": "array"
              },
              "more": {
                "description": "True when later pages hold more jobs.",
                "type": "boolean"
              },
              "offset": {
                "description": "The offset this page starts at.",
                "type": "integer"
              },
              "total": {
                "description": "How many jobs the filters match in all.",
                "type": "integer"
              }
            },
            "required": ["coverage", "jobs", "more", "offset", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search matching jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
