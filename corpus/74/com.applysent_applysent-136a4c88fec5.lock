{
  "lockfileVersion": 2,
  "subjects": {
    "com.applysent/applysent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://applysent.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "applysent",
        "title": "ApplySent",
        "version": "1.5.0",
        "description": "ApplySent finds jobs that match the user's résumé and applies to them on the employer's own site, one job at a time, only after the user approves that application's preview in the conversation. It also reads the user's applications, receipts, employer emails and open questions.",
        "websiteUrl": "https://applysent.com",
        "icons": [
          {
            "src": "https://applysent.com/apple-icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ApplySent finds jobs that match the user's résumé and applies to them on the employer's own site, using automation and AI on the user's behalf. Reading changes nothing. Every application is a separate decision of the user: preview_application shows what will be sent and returns a single-use confirmation token for that one job, and apply_to_job sends only with that token. Answers to employer questions are stored exactly as given; ApplySent never invents facts about the user.",
      "tools": [
        {
          "name": "answer_question",
          "title": "Answer an employer question",
          "description": "Saves the given answer to one open question and applies it to every application asking it; those applications then continue. The answer is stored exactly as given, as the user's own words or the option they chose. Returns the applications answered and those now ready to continue. Sends nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "The user's own answer, or the exact option they picked.",
                "type": "string"
              },
              "batch_id": {
                "description": "The question group from list_pending_questions the question belongs to.",
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Repeating a call with the same key and arguments returns its first result instead of acting again.",
                "type": "string"
              },
              "question_index": {
                "description": "Which question of that group to answer, as list_pending_questions numbers it.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["answer", "batch_id", "question_index"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answered": {
                "description": "The applications the answer was applied to.",
                "items": {
                  "description": "One job id answered.",
                  "type": "string"
                },
                "type": "array"
              },
              "banked": {
                "description": "How many reusable answers the answer was stored as.",
                "type": "integer"
              },
              "profile_field": {
                "description": "The profile field the answer was saved to, when it is a fact the profile keeps.",
                "type": ["string", "null"]
              },
              "ready": {
                "description": "The applications left with nothing to ask, now ready to go on.",
                "items": {
                  "description": "One job id now ready.",
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["answered", "ready"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Answer an employer question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:954f644ab173b9fb2f20cdc0b19e5e7eb7c2f8ae0d01a477118b01e41a26d986"
        },
        {
          "name": "apply_to_job",
          "title": "Apply to a job",
          "description": "Sends one real application to one job on the employer's site, only after the user said yes to this job in the conversation, and uses one application from the account's allowance. Requires the confirmation_token preview_application returned for this job. A job already applied to, or sent with an uncertain outcome, is never sent again. A posting held on an employer account that is connected now is woken and reported as applying (status queued, no hold, poll suggested) instead of returning the old hold.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "From preview_application for this job.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Repeating a call with the same key and arguments returns its first result instead of acting again.",
                "type": "string"
              },
              "job_id": {
                "description": "A job id from search_jobs, get_job_from_link or list_applications.",
                "type": "string"
              }
            },
            "required": ["confirmation_token", "job_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "One application: where it stands, what it waits on and what to do next.",
            "properties": {
              "answer_batches": {
                "description": "The open question batches this application waits on.",
                "items": {
                  "description": "A batch of open questions the employer's form raised for this application.",
                  "properties": {
                    "id": {
                      "description": "The batch id answer_question takes as batch_id.",
                      "type": "integer"
                    },
                    "questions": {
                      "description": "The questions this batch asks.",
                      "items": {
                        "description": "One open question of this batch.",
                        "properties": {
                          "kind": {
                            "description": "The answer kind the form expects, e.g. text, choice or file.",
                            "type": ["string", "null"]
                          },
                          "options": {
                            "description": "The options the form offers; empty for an open-text question.",
                            "items": {
                              "description": "One offered option.",
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "prompt": {
                            "description": "The employer's question, in words.",
                            "type": "string"
                          },
                          "required": {
                            "description": "Whether the form requires an answer.",
                            "type": "boolean"
                          }
                        },
                        "required": ["prompt"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "revision": {
                      "description": "The batch revision these questions belong to.",
                      "type": "integer"
                    }
                  },
                  "required": ["id", "questions"],
                  "type": "object"
                },
                "type": "array"
              },
              "answers": {
                "description": "The answers this application sends.",
                "items": {
                  "description": "One answer this application sends.",
                  "properties": {
                    "answer": {
                      "description": "The answer the application sends, as the user gave it.",
                      "type": "string"
                    },
                    "question": {
                      "description": "The employer's question as it was asked.",
                      "type": "string"
                    },
                    "source": {
                      "description": "Where the answer came from, such as the profile field it was taken from.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "apply_url": {
                "description": "The employer's posting URL.",
                "type": "string"
              },
              "company": {
                "description": "The employer's name, when the ledger has it.",
                "type": ["string", "null"]
              },
              "hold": {
                "description": "What the employer waits on before this application can go on, when it waits on something ApplySent recognizes.",
                "properties": {
                  "kind": {
                    "description": "The kind of hold, e.g. account_required or account_creation_required.",
                    "type": ["string", "null"]
                  },
                  "message": {
                    "description": "The hold in words, for the user.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["kind", "message"],
                "type": ["object", "null"]
              },
              "id": {
                "description": "The job id of this application.",
                "type": "string"
              },
              "missing_prerequisites": {
                "description": "What still stops this application from being sent, in words.",
                "items": {
                  "description": "One thing still missing.",
                  "type": "string"
                },
                "type": "array"
              },
              "not_sent_reason": {
                "description": "Why a failed application was not sent, when ApplySent refused it.",
                "type": ["string", "null"]
              },
              "poll_after_seconds": {
                "description": "Seconds to wait before reading this application again; null when nothing will change by itself.",
                "type": ["integer", "null"]
              },
              "receipt": {
                "description": "The employer's confirmation of this application, or null when none was recorded.",
                "properties": {
                  "evidence": {
                    "description": "The evidence the confirmation rests on.",
                    "type": "string"
                  },
                  "job_ref": {
                    "description": "The reference the employer's system gave the submission.",
                    "type": ["string", "null"]
                  },
                  "kind": {
                    "description": "What the confirmation is, e.g. a submission page or an employer email.",
                    "type": "string"
                  },
                  "observed_at": {
                    "description": "When the confirmation was observed, ISO 8601.",
                    "type": "string"
                  },
                  "packet_revision": {
                    "description": "The packet revision that was sent.",
                    "type": ["integer", "null"]
                  },
                  "provider": {
                    "description": "The hiring system that confirmed the submission.",
                    "type": "string"
                  }
                },
                "required": ["evidence", "kind", "observed_at", "provider"],
                "type": ["object", "null"]
              },
              "recorded_at": {
                "description": "When the user started this application, ISO 8601.",
                "type": ["string", "null"]
              },
              "retry_at": {
                "description": "When ApplySent retries a blocked application, ISO 8601.",
                "type": ["string", "null"]
              },
              "review": {
                "description": "How far the review of this application has come.",
                "properties": {
                  "answers_filled": {
                    "description": "How many answers the application holds.",
                    "type": "integer"
                  },
                  "details_needed": {
                    "description": "The employer questions still waiting on the user.",
                    "items": {
                      "description": "One question waiting on the user.",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "line": {
                    "description": "The same in one sentence, for the user.",
                    "type": "string"
                  }
                },
                "required": ["answers_filled", "details_needed", "line"],
                "type": "object"
              },
              "review_reasons": {
                "description": "Why the application waits for the user's review.",
                "items": {
                  "description": "One reason the application waits for the user.",
                  "type": "string"
                },
                "type": "array"
              },
              "stage": {
                "description": "The hiring stage the employer's messages established (applied, interview, offer, rejected), when known.",
                "type": ["string", "null"]
              },
              "status": {
                "description": "The application's ledger status, e.g. queued, submitted, uncertain or failed.",
                "type": "string"
              },
              "step": {
                "description": "Where the application stands in ApplySent's pipeline, e.g. preparing_application, needs_answer or sent.",
                "type": "string"
              },
              "suggested_next_tool": {
                "description": "The tool that answers what this application needs next.",
                "type": "string"
              },
              "title": {
                "description": "The posting's title, when the ledger has it.",
                "type": ["string", "null"]
              },
              "uncertain": {
                "description": "True when the send went out without a confirmed receipt; ApplySent never sends such a job again.",
                "type": "boolean"
              },
              "waiting": {
                "description": "Set while the background worker is on this application right now.",
                "type": ["string", "null"]
              }
            },
            "required": ["id", "status", "step", "suggested_next_tool", "uncertain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply to a job"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
