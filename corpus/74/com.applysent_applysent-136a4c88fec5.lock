                    },
                    "company": {
                      "description": "The employer's name.",
                      "type": "string"
                    },
                    "company_domain": {
                      "description": "The employer's domain, when the catalogue resolved one.",
                      "type": ["string", "null"]
                    },
                    "company_domain_source": {
                      "description": "How that domain was resolved.",
                      "type": ["string", "null"]
                    },
                    "job_id": {
                      "description": "The job id of this application.",
                      "type": "string"
                    },
                    "link": {
                      "description": "The employer's posting URL.",
                      "type": "string"
                    },
                    "location": {
                      "description": "Where the posting is.",
                      "properties": {
                        "city": {
                          "description": "City the posting is in.",
