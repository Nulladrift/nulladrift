        {
          "name": "fetch",
          "title": "Fetch a job's text",
          "description": "The full text of one job from search, with its posting URL and match details, for citing it. Reads only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A job id from a search result.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "description": "The job id.",
                "type": "string"
              },
              "metadata": {
                "description": "The posting's facts beside its text.",
                "properties": {
                  "application_status": {
                    "description": "The application's ledger status when the user applied, else null.",
                    "type": ["string", "null"]
                  },
                  "city": {
                    "description": "City the posting is in.",
                    "type": ["string", "null"]
                  },
                  "company": {
                    "description": "The employer's name.",
                    "type": "string"
                  },
                  "country": {
                    "description": "Country the posting is in.",
                    "type": ["string", "null"]
                  },
                  "match_score": {
                    "description": "The match score against the user, from 0 to 100.",
                    "type": "integer"
                  },
                  "posted_at": {
                    "description": "When the posting went up, ISO 8601 in UTC.",
                    "type": ["string", "null"]
                  },
                  "salary": {
                    "description": "The pay the posting states, or null when it states none.",
