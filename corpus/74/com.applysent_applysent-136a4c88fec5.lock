                "type": "string"
              },
              "company": {
                "description": "Only applications at this employer, matched without case.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Rows per bucket.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip for the next page: the previous page's coverage names the offset to pass.",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to match in the job title or employer.",
                "type": "string"
              },
              "since": {
                "description": "Only applications recorded on or after this ISO date.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bucket": {
                "description": "The column paged through, or null when every column's first rows came back.",
