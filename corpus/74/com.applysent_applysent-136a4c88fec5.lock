      "serverInfo": {
        "name": "applysent",
        "title": "Applysent",
        "version": "1.1.0",
        "websiteUrl": "https://applysent.com",
        "icons": [
          {
            "src": "https://applysent.com/apple-icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Applysent finds jobs that match the user's résumé and applies to them on the employer's own site, using automation and AI on the user's behalf. Reading is free. Every application is a separate decision of the user: preview_application shows what will be sent and returns a single-use confirmation token for that one job, and apply_to_job sends only with that token. Answers to employer questions are stored exactly as given; Applysent never invents facts about the user.",
      "tools": [
        {
          "name": "answer_question",
          "title": "Answer an employer question",
          "description": "Saves the given answer to one open question and applies it to every application asking it; those applications then continue. The answer is stored exactly as given, as the user's own words or the option they chose.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "The user's own answer, or the exact option they picked.",
                "type": "string"
              },
              "batch_id": {
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Optional. Repeating a call with the same key and arguments returns its first result instead of acting again.",
                "type": "string"
              },
              "question_index": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["answer", "batch_id", "question_index"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answered": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "banked": {
                "type": "integer"
              },
              "profile_field": {},
              "ready": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["answered", "ready"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Answer an employer question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b2481ecdee1a01ac8a48861f49877eda5d6915469a3c50336153b480a9f4ac1d"
        },
        {
          "name": "apply_to_job",
          "title": "Apply to a job",
          "description": "Sends a real application to one job on the employer's site and uses one application from the user's plan. Requires the confirmation_token preview_application returned for this job. A job already applied to, or sent with an uncertain outcome, is never sent again. A posting held on an employer account that is connected now is woken and reported as applying (status queued, no hold, poll suggested) instead of returning the old hold.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_token": {
                "description": "From preview_application for this job.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Repeating a call with the same key and arguments returns its first result instead of acting again.",
                "type": "string"
              },
              "job_id": {
                "description": "A job id from search_jobs, get_job_from_link or list_applications.",
                "type": "string"
              }
            },
            "required": ["confirmation_token", "job_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer_batches": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "answers": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "apply_url": {
                "type": ["string", "null"]
              },
              "company": {
                "type": ["string", "null"]
              },
              "hold": {
                "type": ["object", "null"]
              },
              "id": {
                "type": "string"
              },
              "missing_prerequisites": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "not_sent_reason": {},
              "poll_after_seconds": {
                "type": ["integer", "null"]
              },
              "receipt": {
                "type": ["object", "null"]
              },
              "recorded_at": {},
              "retry_at": {
                "type": ["string", "null"]
              },
              "review": {
                "properties": {
                  "answers_filled": {
                    "type": "integer"
                  },
                  "details_needed": {
                    "items": {
