                      "required": ["city", "country", "remote"],
                      "type": "object"
                    },
                    "logo_url": {
                      "description": "The employer's logo URL, when one is known.",
                      "type": ["string", "null"]
                    },
                    "questions": {
                      "description": "How many employer questions wait on the user for this application.",
                      "type": "integer"
                    },
                    "reason_code": {
                      "description": "A stable code for why the application stands where it does.",
                      "type": ["string", "null"]
                    },
                    "retryable": {
                      "description": "True when the user may send this application again.",
                      "type": "boolean"
                    },
                    "stage": {
                      "description": "The hiring stage the employer's messages established, when known.",
                      "type": ["string", "null"]
                    },
                    "stage_at": {
                      "description": "When the current stage was reached, ISO 8601.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "The application's ledger status.",
                      "type": ["string", "null"]
                    },
                    "step": {
                      "description": "What an application in progress is doing or waiting for; null for a column that reports no step.",
                      "properties": {
                        "board_hold": {
                          "description": "True when the employer is holding this board until a time.",
                          "type": "boolean"
                        },
                        "label": {
                          "description": "What the application is doing or waiting for, in words.",
                          "type": "string"
                        },
                        "live": {
                          "description": "True while work on this application is running now.",
                          "type": "boolean"
                        },
                        "retry_at": {
                          "description": "When ApplySent tries again, ISO 8601.",
                          "type": ["string", "null"]
                        },
                        "since": {
                          "description": "When that step started, ISO 8601.",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["label", "live", "retry_at", "since"],
                      "type": ["object", "null"]
                    },
                    "title": {
                      "description": "The posting's title.",
                      "type": "string"
                    },
                    "uncertain": {
                      "description": "True when the send went out without a confirmed receipt.",
                      "type": "boolean"
                    },
                    "updated_at": {
                      "description": "When the application last changed, ISO 8601.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["bucket", "company", "job_id", "link", "title", "uncertain"],
                  "type": "object"
                },
                "type": "array"
              },
              "working": {
                "description": "How many applications are being worked on right now.",
                "type": "integer"
              }
            },
            "required": ["bucket", "counts", "coverage", "filters", "offset", "rows", "working"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
