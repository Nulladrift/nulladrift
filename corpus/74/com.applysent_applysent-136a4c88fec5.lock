              },
              "url": {
                "description": "The employer's posting URL, for citing it.",
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a job's text"
          },
          "behavior": {
            "destructive": false,
