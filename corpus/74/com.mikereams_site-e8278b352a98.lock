{
  "lockfileVersion": 2,
  "subjects": {
    "com.mikereams/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mikereams.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.mikereams/site",
        "title": "Mike Reams: architecture writing, diagrams and toolbox",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to Mike Reams's public site (enterprise architecture, CMDB and CSDM, AI in the architecture practice). Cite the canonical https://mikereams.com URL a result gives. Search first, then read a page as Markdown.",
      "tools": [
        {
          "name": "get_page",
          "title": "Read a page as Markdown",
          "description": "Read one public page (a post, work item, diagram, /about or /toolbox) as Markdown, with its canonical URL. Pass a path such as /writing/<slug> or a full mikereams.com URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "description": "Path or https://mikereams.com URL of the page",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:398d0d81568d461c12dfe95cc84b74d1566f7893022867b903b298a1be3edd99"
        },
        {
          "name": "list_diagrams",
          "title": "List the diagrams",
          "description": "List the reference diagrams, including the CSDM models drawn in Blueprint Modeler, with each one's summary, page, downloadable model file and Open-in-Blueprint-Modeler link where there is one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7aad78ada0597df7c6a9df66b27f21ecccf4b48f739211080bf5018b9485ab80"
        },
        {
          "name": "list_toolbox",
          "title": "Look up the Architect's Toolbox",
          "description": "Find tools, methods and learning resources from the Architect's Toolbox Guide, filtered by architecture role, kind or keyword. Returns access and license notes and a link to each entry's details and sources.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "tool, method or learning",
                "enum": ["tool", "method", "learning"],
                "type": "string"
              },
              "query": {
                "description": "Keyword in the name, publisher or summary",
                "maxLength": 100,
                "type": "string"
              },
              "role": {
                "description": "Architecture role",
                "enum": ["enterprise", "business", "solution", "software", "data", "cloud-platform", "security", "ai"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae9a721b10ebaa8d91e77a83a4973de5631945c3a20aa1221d718547038d8f01"
        },
        {
          "name": "search_site",
          "title": "Search the site",
          "description": "Search Mike Reams's posts, work items and diagrams by keyword. Returns titles, one-line summaries and canonical URLs, best match first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Maximum results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. 'CSDM application service' or 'AI governance'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Limit to one kind of page",
                "enum": ["post", "work", "diagram", "page"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94c6777015c874db29e87535cfa8967fbac4a4b0fac9660edb24361832124b8f"
        }
      ],
      "digest": "sha256:3ce59645e96a339e01672d37cbee4034f71af254715d125508832fc01c1a8c90"
    }
  }
}
