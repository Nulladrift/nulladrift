{
  "lockfileVersion": 2,
  "subjects": {
    "com.mikereams/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mikereams.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.mikereams/site",
        "title": "Mike Reams: architecture writing, diagrams and toolbox",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to Mike Reams's public site (enterprise architecture, CMDB and CSDM, AI in the architecture practice). Cite the canonical https://mikereams.com URL a result gives. Search first, then read a page as Markdown.",
      "tools": [
        {
          "name": "get_page",
          "title": "Read a page as Markdown",
          "description": "Read one public page (a post, work item, diagram, skill, /about or /toolbox) as Markdown, with its canonical URL. Pass a path such as /writing/<slug> or a full mikereams.com URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "description": "Path or https://mikereams.com URL of the page",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5cf4c8bac586036d05c69c959aea8d78f38f8ad018c6f6cab9973f45829079e"
        },
        {
          "name": "list_diagrams",
          "title": "List the diagrams",
          "description": "List the reference diagrams, including the CSDM models drawn in Blueprint Modeler, with each one's summary, page, downloadable model file and Open-in-Blueprint-Modeler link where there is one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7aad78ada0597df7c6a9df66b27f21ecccf4b48f739211080bf5018b9485ab80"
        },
        {
          "name": "list_skills",
          "title": "List the agent skills",
          "description": "List the skills in the AI Library, filtered by origin, category or keyword. An original (written by Mike) comes with its install command; a curated one (someone else's work that he reviewed) with its author and source. Each has a page with the details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category",
                "enum": ["Enterprise architecture", "Review & QA", "Security", "Diagrams", "Frontend", "Design systems", "Debugging", "Planning"],
                "type": "string"
              },
              "origin": {
                "description": "Written by Mike, or reviewed by him",
                "enum": ["original", "curated"],
                "type": "string"
              },
              "query": {
                "description": "Keyword in the name, summary, outcome or author",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43d27b3f107b846c641e9556c05b2a801869e73dc57ee7abf3385dc05ffe0e58"
        },
        {
          "name": "list_toolbox",
          "title": "Look up the Architect's Toolbox",
          "description": "Find tools, methods and learning resources from the Architect's Toolbox Guide, filtered by architecture role, kind or keyword. Returns access and license notes and a link to each entry's details and sources.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "tool, method or learning",
                "enum": ["tool", "method", "learning"],
                "type": "string"
              },
              "query": {
                "description": "Keyword in the name, publisher or summary",
                "maxLength": 100,
                "type": "string"
              },
              "role": {
                "description": "Architecture role",
                "enum": ["enterprise", "business", "solution", "software", "data", "cloud-platform", "security", "ai"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae9a721b10ebaa8d91e77a83a4973de5631945c3a20aa1221d718547038d8f01"
        },
        {
          "name": "search_site",
          "title": "Search the site",
          "description": "Search Mike Reams's posts, work items, diagrams and agent skills by keyword. Returns titles, one-line summaries and canonical URLs, best match first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Maximum results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. 'CSDM application service' or 'AI governance'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Limit to one kind of page",
                "enum": ["post", "work", "diagram", "skill", "page"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c62348eb855189567b3a6e5e8bc87692de2e7c8e2210bdb7628d57ad37ee2fab"
        }
      ],
      "digest": "sha256:3c6ea808ebde48b61714f39c3486abc5582449c517f8358d78f68590d4ec4bd1"
    }
  }
}
