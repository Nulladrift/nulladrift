      "tools": [
        {
          "name": "check_facts",
          "title": "AI Fact-Check",
          "description": "Find what AI assistants get WRONG about a local business. Asks ChatGPT and Perplexity live (with web search) about the business's hours, address, phone, and category, then verifies each stated fact against Google Business ground truth. Returns a severity-ranked list of conflicts (with the AI's value vs. the trusted value and source) plus discrepancies to check. Conservative by design: a claim with no trusted source is 'unverifiable' (never an error), and a conflict is only counted when it reproduces across engines — so it won't cry wolf. Call this when a user asks whether AI has the right info about a business, or 'why does ChatGPT say we're closed'. Takes ~15-30 seconds. Price: $1.49 per delivered check.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "businessName": {
                "description": "The local business to fact-check",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "businessType": {
                "description": "Optional category anchor, e.g. \"restaurant\" — helps resolve the business; not required",
                "maxLength": 80,
                "type": "string"
              },
              "location": {
                "description": "City and state/region, e.g. \"Cincinnati, OH\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "website": {
                "description": "Optional: the business website — if an AI answer cites this domain, a mismatch is treated as a possibly-stale discrepancy rather than an error",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["businessName", "location"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ca78c57e8b689f62ea3d8c7c642156fc9518846b8fb1569e5f72f2944d47121b"
        },
