        {
          "name": "review_gap",
          "title": "Review Gap Check",
          "description": "Compare a local business's Google rating and review count against the top same-category rivals nearby, with the gap math done: who leads, the rating delta, the review-volume ratio, and a verdict (leading / rated_equal_or_better_but_outreviewed / trailing). Live Google Maps lookup at call time. Call this when a user wants to know how a business's reviews stack up against local competitors. Takes a few seconds. Price: $0.39 per delivered comparison.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Optional: street address of the SPECIFIC location to compare, e.g. \"332 Ludlow Ave\" — use for chains/multi-location businesses so the right branch anchors the comparison",
                "maxLength": 200,
                "type": "string"
              },
              "businessName": {
                "description": "The local business to check",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "businessType": {
                "description": "Category anchor, e.g. \"dentist\" — rivals are the top Google Maps results for this category nearby",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "location": {
                "description": "City and state/region, e.g. \"Cincinnati, OH\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["businessName", "businessType", "location"],
