            "readOnly": true
          },
          "digest": "sha256:335afb6a459e302154d596424bbaa65cfdfb14dc68e570e01f564d640bd7b4fa"
        },
        {
          "name": "check_visibility",
          "title": "AI Visibility Check",
          "description": "Ask ChatGPT and Perplexity live (with web search) who they'd recommend in a business's category and city, and report whether THIS business appears. Returns honest appearance counts (never an invented metric), a per-engine split, who gets recommended instead, and which local sites the AI answers cite. AI answers vary substantially between runs — one check is a snapshot, not a stable measurement; re-check over time for the real picture. Call this when a user wants to know if AI assistants recommend a local business. Takes ~10-30 seconds. Price: $0.79 per delivered check.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "businessName": {
                "description": "The local business to check",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "businessType": {
                "description": "Category anchor, e.g. \"gym\" — the AI assistants are asked category questions, so this is required",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "location": {
                "description": "City and state/region, e.g. \"Cincinnati, OH\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "website": {
                "description": "Optional: the business website — a cited domain counts as an appearance",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["businessName", "businessType", "location"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
