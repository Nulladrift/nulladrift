        {
          "name": "run_scan",
          "title": "Competitor Quick Scan",
          "description": "A live competitor scan: a research agent finds the business's strongest same-category rival nearby and scouts it (offer, pricing signals, review positioning, what they do that this business doesn't), while two ground-truth lookups run in parallel: ChatGPT/Perplexity sampling for AI-assistant visibility, and a direct Google Places review comparison (reviewSnapshot — the authoritative numbers; finding source URLs are verified against what the agent actually retrieved). The AI-visibility portion is a single-run snapshot — AI answers vary substantially between runs. BLOCKING and slow: typically 2-4 minutes — only call it from contexts that tolerate a long tool call. Price: $1.99 per delivered scan; a failed scan is never charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Optional: street address of the SPECIFIC location to scan, e.g. \"332 Ludlow Ave\" — use for chains/multi-location businesses so the right branch anchors the review comparison",
                "maxLength": 200,
                "type": "string"
              },
              "businessName": {
                "description": "The local business to scan",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "businessType": {
                "description": "Category anchor, e.g. \"ice cream shop\" — rival discovery and AI sampling are both category-anchored",
                "maxLength": 80,
