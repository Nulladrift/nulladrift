{
  "lockfileVersion": 2,
  "subjects": {
    "com.hiringcensus/hiring-census": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hiringcensus.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "hiringcensus",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Licensed service: 10 trial calls in total, then a licence is required (https://hiringcensus.com/pricing/). Pass it as a bearer token. HiringCensus reads employers' own applicant-tracking boards every morning and keeps the publish date on every role. Use check_company before trusting that a company is hiring -- a third of open postings are over 90 days old and some boards have not been touched in a year.",
      "tools": [
        {
          "name": "check_company",
          "description": "Ask whether a company is ACTUALLY hiring, not just whether it has jobs listed. Returns a verdict on the board -- actively_hiring, still_open, gone_quiet or likely_abandoned -- with the age of the newest posting, the median role age, and how many reqs have sat open over 90 days and over a year. This is the check that tells you whether an application or a sales approach is worth the time.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company name",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c3abf54d9277653d97acfd8e243a251742763ed6bba402fce995a45cc7a4b72"
        },
        {
          "name": "find_fresh_boards",
          "description": "Companies where EVERY currently open role was posted in the last 30 days -- no backlog of applicants ahead of you, and usually a team that just started hiring. For sales, a company that just opened its first roles in a function is one whose budget has recently moved.",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a21769738c48c5c3e2786d19037f4bfca8daab4e8b7e11bea2ba6a3ae1534d05"
        },
        {
          "name": "find_quiet_boards",
          "description": "Companies still advertising open roles while having posted nothing new in over six months. Strong evidence of a board nobody tidied up after the hiring finished. Useful for striking dead accounts off a prospect list, or for avoiding applications that will never be read.",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff1f225a26c5f0a903b4c77e74fe879690a6a638842681e6fdb594779ae1a9e6"
        },
        {
          "name": "hiring_stats",
          "description": "Market-level hiring numbers measured this morning across every board we read: employers hiring, open roles, how many went up in the last 24 hours, how many have been open over 90 days and over a year, how many boards have gone quiet, and the most in-demand technologies.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac12a239412c971bce32ebbe58cd68df1ad5a9c437d4f7826cf4dd73eb9d9d1f"
        },
        {
          "name": "search_jobs",
          "description": "Search open job postings read directly from employers' own Greenhouse, Ashby and Lever boards. Unlike a job board, every result carries the employer's real publish date and age in days, so you can tell a role posted this morning from one that has been open two years.",
          "inputSchema": {
            "properties": {
              "department": {
                "description": "Function, e.g. 'Engineering', 'Sales'",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 25)",
                "type": "integer"
              },
              "location": {
                "description": "Any part of the location string, e.g. 'Berlin', 'California'",
                "type": "string"
              },
              "max_age_days": {
                "description": "Only roles posted within this many days",
                "type": "integer"
              },
              "min_age_days": {
                "description": "Only roles OLDER than this many days -- use to hunt stale listings",
                "type": "integer"
              },
              "query": {
                "description": "Words in the job title, e.g. 'staff backend engineer'",
                "type": "string"
              },
              "remote": {
                "description": "Only roles flagged remote",
                "type": "boolean"
              },
              "technology": {
                "description": "Technology named in the posting, e.g. 'Python', 'Kubernetes'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db1003765f51da5c662f4610246060aebdb4dc1a3dce130fbf8bb291ee4b8145"
        },
        {
          "name": "whats_changed",
          "description": "What actually MOVED, on a list of companies you name or across the whole record. Answers the question a person with a book of accounts has every morning: which of mine changed, and is anyone suddenly ramping? Returns NET movement, because a company that opened 342 roles and closed 317 is churning and one that opened 261 and closed 41 is hiring -- and flags a board whose VERDICT flipped, which is a budget unfreezing and the strongest signal in this data.",
          "inputSchema": {
            "properties": {
              "companies": {
                "description": "Company names to watch. Omit for the whole market.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "description": "Window, default 7",
                "type": "integer"
              },
              "limit": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a0461373bf3952be7f9de5a34d0576c8d5344514bdea2be86298f79b3042b71"
        }
      ],
      "digest": "sha256:637c036829d14a7503b6ab176927facbb1bf13c450a3affbc9d518530c5d456c"
    }
  }
}
