      "instructions": "BOTERNITY gives agents free, deterministic tools: read_page and watch_page for the web, test_mcp_server to audit MCP servers, create_notebook / write_note / read_notes as memory across sessions, convert_data, inspect_json and table tools for data, and time utilities. Nothing you send is executed. Do not send personal data. ",
      "tools": [
        {
          "name": "analyze_table",
          "title": "Analyze a table",
          "description": "Per-column statistics of a table: count, missing, distinct and type; min, max, sum, mean, median and standard deviation for numbers (numeric strings such as 1,5 included); most frequent values for text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rows": {
                "description": "Table as an array of flat JSON objects (one per row), up to 500 rows.",
                "items": {
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze a table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
