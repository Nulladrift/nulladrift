                "type": "boolean"
              },
              "empty_to_null": {
                "description": "Empty strings become null (default true).",
                "type": "boolean"
              },
              "normalize_keys": {
                "description": "Rename columns to snake_case (default false).",
                "type": "boolean"
              },
              "parse_numbers": {
                "description": "Convert numeric strings to numbers (default false).",
                "type": "boolean"
              },
              "rows": {
                "description": "Table as an array of flat JSON objects (one per row), up to 500 rows.",
                "items": {
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "trim": {
                "description": "Trim spaces (default true).",
                "type": "boolean"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
