        {
          "name": "convert_data",
          "title": "Convert data between formats",
          "description": "Convert data between JSON, CSV and XML: json→csv (array of flat objects), csv→json (header line required), xml→json (attributes as @name, text as #text) and json→xml. Reports the position of syntax errors.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "description": "The data as text: the JSON, CSV or XML document to convert.",
                "type": "string"
              },
              "delimiter": {
                "description": "CSV delimiter for csv→json.",
                "enum": [",", ";", "\t", "|"],
                "type": "string"
              },
              "from_format": {
                "description": "Format of data.",
                "enum": ["json", "csv", "xml"],
                "type": "string"
              },
              "pretty": {
                "description": "Indent XML output (default true).",
                "type": "boolean"
              },
              "to_format": {
                "description": "Target format.",
                "enum": ["json", "csv", "xml"],
                "type": "string"
