{
  "lockfileVersion": 2,
  "subjects": {
    "com.boternity/boternity": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://boternity.com/api/public/v4/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "boternity",
        "title": "BOTERNITY",
        "version": "3.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BOTERNITY gives agents 9 free, deterministic tools: read_page and watch_page for the web, check_site_for_agents to grade a site for AI agents, test_mcp_server and find_mcp_server for MCP servers, get_data for fresh public data feeds, notebook as memory across sessions, process_data for JSON/CSV/XML and tables, and time. Nothing you send is executed. Do not send personal data.",
      "tools": [
        {
          "name": "check_site_for_agents",
          "description": "Can AI agents use a website? Grade A-F with fixes: bot walls, robots.txt, no-JS text, schema.org, forms, APIs.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Site or page URL.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a website for AI agents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:97fbc331319070b656312a50e529381b6d6a5bfcd7e8387b93589561636e7208"
        },
        {
          "name": "find_mcp_server",
          "description": "Best public MCP servers for a need (postgres, github...) from nightly registry checks, or live status of one server. No argument: current incidents.",
          "inputSchema": {
            "properties": {
              "include_auth": {
                "description": "Also list servers needing sign-in.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_score": {
                "description": "Minimum score.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "need": {
                "description": "e.g. postgres, github, web search.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "server": {
                "description": "Registry name or URL: is it up, slow or down?",
                "type": "string"
              },
              "up_now": {
                "description": "With need: only servers up right now.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a reliable MCP server"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:567655d5d0ad05da406dd6a57bb305496e06e2f113de37064aa28963fe3219ec"
        },
        {
          "name": "get_data",
          "description": "Fresh open data feeds: weather, exchange rates, earthquakes, disaster alerts, public holidays, trending topics, exploited CVEs, package versions, service status, AI papers, Hacker News, and key_numbers: BOTERNITY's own citable numbers on the MCP ecosystem.",
          "inputSchema": {
            "properties": {
              "feed": {
                "description": "Data feed.",
                "enum": ["weather", "exchange_rates", "earthquakes", "disaster_alerts", "public_holidays", "trending_topics", "exploited_vulnerabilities", "package_info", "service_status", "ai_papers", "hacker_news", "key_numbers", "feeds_status"],
                "type": "string"
              },
              "params": {
                "description": "weather: city or latitude+longitude, days. exchange_rates: base, symbols[], amount, date. earthquakes: min_magnitude, hours, latitude, longitude, radius_km, sort, limit. disaster_alerts: type, min_alert_level, country, current_only, limit. public_holidays: country (ISO2, required), year, upcoming_only, date (business day check). trending_topics: language, limit. exploited_vulnerabilities: cve, query, since, ransomware_only, limit. package_info: ecosystem (npm|pypi), name. service_status: service (omit: incidents). ai_papers: category, query, limit. hacker_news: list (top|best|ask|show), limit. key_numbers: group or id (omit: all).",
                "type": "object"
              }
            },
            "required": ["feed"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get fresh public data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:494d50c36c66039304c37ed2069c96db4ae75c40ce75d8b07577e8bbc1f5bc6a"
        },
        {
          "name": "notebook",
          "description": "Memory across sessions. action create returns a secret notebook token; then write, read (one key, or list) or delete notes. Notes expire 30 days after last use.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Operation.",
                "enum": ["create", "write", "read", "delete"],
                "type": "string"
              },
              "key": {
                "description": "Note name, e.g. todo (letters, digits, _.:/-).",
                "type": "string"
              },
              "notebook": {
                "description": "Token from action create.",
                "type": "string"
              },
              "prefix": {
                "description": "Read: list names with this prefix.",
                "type": "string"
              },
              "value": {
                "description": "Note text (write, up to 8000 characters).",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Private notebook memory"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:140a7925c19f15d820e8a77d63fc97785f64fa7177bfb79ca343bdd5a5bbfc40"
        },
        {
          "name": "process_data",
          "description": "Convert JSON/CSV/XML, validate or query JSON, analyze or clean a table, compare two tables or two texts. Errors give line and column.",
          "inputSchema": {
            "properties": {
              "after": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "array"
                  }
                ],
                "description": "compare: new text or rows."
              },
              "before": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "array"
                  }
                ],
                "description": "compare: old text or rows."
              },
              "data": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "array"
                  }
                ],
                "description": "Document text, or table rows (array of flat objects)."
              },
              "from_format": {
                "description": "convert: source.",
                "enum": ["json", "csv", "xml"],
                "type": "string"
              },
              "key": {
                "description": "compare: key column of rows, e.g. id.",
                "type": "string"
              },
              "operation": {
                "description": "Operation.",
                "enum": ["convert", "inspect_json", "analyze_table", "clean_table", "compare"],
                "type": "string"
              },
              "options": {
                "description": "delimiter, pretty (convert); trim, empty_to_null, dedupe, parse_numbers, normalize_keys (clean_table, booleans).",
                "type": "object"
              },
              "pointer": {
                "description": "inspect_json: RFC 6901 pointer, e.g. /items/0.",
                "type": "string"
              },
              "to_format": {
                "description": "convert: target.",
                "enum": ["json", "csv", "xml"],
                "type": "string"
              }
            },
            "required": ["operation"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert, check and compare data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:639a08b363981db1454e6e6dc90a275a80df70f2ec5cf58699a277e473d3ff35"
        },
        {
          "name": "read_page",
          "description": "Read a public web page as clean Markdown with metadata and outline. Paginated; robots.txt respected.",
          "inputSchema": {
            "properties": {
              "include_links": {
                "description": "Also return links.",
                "type": "boolean"
              },
              "max_length": {
                "description": "Default 8000.",
                "maximum": 20000,
                "minimum": 500,
                "type": "integer"
              },
              "start_index": {
                "description": "Offset to continue a long page.",
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "Public http(s) URL.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a web page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83f00fb5f7dcfc3e4adf72816a6bf20526999614fcd9473f4a8ee2e05d77e8a0"
        },
        {
          "name": "test_mcp_server",
          "description": "Audit a remote MCP server you may test: score /100 with fixes (schemas, tokens, CORS, latency). Returns report_id; call again with report_id for the full report.",
          "inputSchema": {
            "properties": {
              "probe_tool": {
                "description": "Optional tool call to try.",
                "properties": {
                  "arguments": {
                    "description": "Its arguments.",
                    "type": "object"
                  },
                  "name": {
                    "description": "Tool name.",
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "report_id": {
                "description": "Id of an earlier audit: returns its report.",
                "type": "string"
              },
              "url": {
                "description": "MCP endpoint URL.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Audit an MCP server"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12997bc7e767f55186f2b989ae25d1c517d1e020001540dab74dd18d1aa8c15a"
        },
        {
          "name": "time",
          "description": "Current time in any IANA timezone, timezone conversion (daylight saving aware), exact duration between two date-times, next runs of a cron expression.",
          "inputSchema": {
            "properties": {
              "after": {
                "description": "cron: start (default now).",
                "type": "string"
              },
              "count": {
                "description": "cron: runs (default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "datetime": {
                "description": "convert: e.g. 2026-03-29T01:30:00Z.",
                "type": "string"
              },
              "end": {
                "description": "duration: ISO 8601.",
                "type": "string"
              },
              "expression": {
                "description": "cron: e.g. */15 9-17 * * mon-fri.",
                "type": "string"
              },
              "from_timezone": {
                "description": "convert: if no offset.",
                "type": "string"
              },
              "operation": {
                "description": "Default now.",
                "enum": ["now", "convert", "duration", "cron"],
                "type": "string"
              },
              "start": {
                "description": "duration: ISO 8601.",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone (target of convert), default UTC.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Time, timezones and cron"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7d0e3d70ae5a007474a3dd725b9fed3769f2e19f827a193c026904d3363dccb"
        },
        {
          "name": "watch_page",
          "description": "Watch a public page and keep each diff. action start (url, optional selector, keywords, webhook) returns an id; then get, check_now or stop with that id.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Default start.",
                "enum": ["start", "get", "check_now", "stop"],
                "type": "string"
              },
              "history": {
                "description": "Diffs for get (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "id": {
                "description": "Watch id, for get, check_now, stop.",
                "type": "string"
              },
              "interval_minutes": {
                "description": "Default 360.",
                "maximum": 10080,
                "minimum": 60,
                "type": "integer"
              },
              "keywords": {
                "description": "Words to track.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "selector": {
                "description": "CSS selector to watch, e.g. 'main .price'.",
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL.",
                "type": "string"
              },
              "webhook_url": {
                "description": "https URL POSTed on change.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Watch a web page for changes"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce92372cd5d27109b34e20169753e15cdbb515469968b2c83b8b2bc898a56524"
        }
