        {
          "name": "clean_table",
          "title": "Clean a table",
          "description": "Clean a table: trim spaces, turn empty strings into null, remove duplicate rows, and optionally parse numeric strings (1,5 or 1 234) and normalize column names to snake_case. Returns the cleaned rows and a report.",
