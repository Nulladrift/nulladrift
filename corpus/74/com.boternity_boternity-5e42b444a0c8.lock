        {
          "name": "find_mcp_server",
          "title": "Find a reliable MCP server",
          "description": "Find the most reliable public remote MCP servers for a need, e.g. postgres, github, web search, send email, weather, payments. Uses the BOTERNITY MCP Index, which checks every server of the official MCP Registry each night: returns endpoint URL, score out of 100, grade, tool count, context tokens, latency, 30-day availability and a link to a comparison page. Use it before adding an MCP server to an agent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_auth": {
                "description": "Also list servers that require sign-in (not scored) after the healthy ones (default false).",
                "type": "boolean"
              },
              "limit": {
                "description": "Number of servers to return (default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_score": {
                "description": "Only servers scoring at least this (default 0).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "need": {
                "description": "What the server should do or connect to, e.g. postgres, github, web search, send email, weather.",
