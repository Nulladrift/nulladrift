{
  "lockfileVersion": 2,
  "subjects": {
    "com.euroflation/euroflation": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://euroflation.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "euroflation",
        "title": "Euroflation",
        "version": "1.0.0",
        "websiteUrl": "https://euroflation.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "European price, interest-rate and wage statistics from Eurostat, the ECB, the European Commission and Energinet, as shown on euroflation.com: inflation (HICP), ECB key rates, minimum wages and salaries, weekly fuel prices, day-ahead electricity prices for Denmark and Sweden, and country comparisons. Every result names its source, its reuse terms and the euroflation.com page that shows the figure.",
      "tools": [
        {
          "name": "compare_countries",
          "title": "Compare European countries on one indicator",
          "description": "Ranks European countries by the latest figure of one indicator: inflation, unemployment, GDP growth, minimum wage, average salary, petrol and diesel prices, household electricity and gas prices, mortgage and deposit rates, government debt, house prices and more. Each row has the country, the value and the period it refers to.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "indicator": {
                "description": "What to compare, for example inflation, unemployment, minimum-wage, average-salary, petrol-prices, electricity-prices, mortgage-rates, government-debt",
                "enum": ["inflation", "food-inflation", "unemployment", "gdp-growth", "industrial-production", "retail-sales", "youth-unemployment", "government-debt", "government-deficit", "mortgage-rates", "business-lending-rates", "deposit-rates", "10-year-bond-yield", "bund-spread", "economic-sentiment", "industry-confidence", "services-confidence", "retail-confidence", "construction-confidence", "consumer-confidence", "rent-inflation", "house-prices", "grocery-prices", "new-home-prices", "existing-home-prices", "housing-cost-overburden", "home-ownership-rate", "building-permits", "petrol-prices", "diesel-prices", "minimum-wage", "average-salary", "electricity-prices", "gas-prices"],
                "type": "string"
              }
            },
            "required": ["indicator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare European countries on one indicator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a880d4505a8bb34c891e87df0ac4ff6d4e26eeac1adfade65fe993d664d8aae1"
        },
        {
          "name": "get_ecb_rates",
          "title": "ECB key interest rates",
          "description": "The European Central Bank's three key interest rates (deposit facility, main refinancing operations, marginal lending facility) with the date each took effect and the previous rate, plus the forward rates the AAA euro-area government bond curve implies for 3 months to 2 years ahead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ECB key interest rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:994c5e8f653c8f278192f33c5b9c3d2ebb4ab4fcfe53ab128385015eb684705a"
        },
        {
          "name": "get_electricity_spot_prices",
          "title": "Electricity spot prices today and tomorrow",
          "description": "Day-ahead wholesale electricity prices for a Danish or Swedish bidding zone (DK1, DK2, SE3, SE4) for today or tomorrow: the day's average, the lowest and highest interval, the price now and the hourly averages, in euro per MWh and in the local currency per kWh. Before VAT, tax and grid fees. Data: Energinet, CC BY 4.0.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "day": {
                "description": "The zone's own calendar day. Tomorrow's prices are usually published between 13:00 and 14:00 Central European Time. Default: today.",
                "enum": ["today", "tomorrow"],
                "type": "string"
              },
              "zone": {
                "description": "Bidding zone: DK1 (western Denmark), DK2 (eastern Denmark), SE3 (Stockholm area), SE4 (southern Sweden)",
                "enum": ["DK1", "DK2", "SE3", "SE4"],
                "type": "string"
              }
            },
            "required": ["zone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Electricity spot prices today and tomorrow"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1321489be3baf4ddb116d7c9844a06d67f6afc740f5cb9e383feafdb3b40fc1"
        },
        {
          "name": "get_fuel_prices",
          "title": "Petrol and diesel prices",
          "description": "The latest weekly consumer pump price of petrol (Euro-super 95) and diesel in one EU country, in euro per litre including taxes, from the European Commission's Weekly Oil Bulletin: the change on the previous week and on a year earlier, the price in the national currency for countries outside the euro, and the EU average and the cheapest and most expensive country of the same week.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code (Greece is GR), or EA for the euro area, or EU for the European Union. The bulletin covers the 27 EU member states and the two averages.",
                "enum": ["AT", "BE", "BG", "HR", "CY", "EE", "FI", "FR", "DE", "GR", "IE", "IT", "LV", "LT", "LU", "MT", "NL", "PT", "SK", "SI", "ES", "PL", "CZ", "HU", "RO", "SE", "DK", "NO", "CH", "IS", "EA", "EU"],
                "type": "string"
              },
              "fuel": {
                "description": "petrol (Euro-super 95) or diesel. Omit for both.",
                "enum": ["petrol", "diesel"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Petrol and diesel prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b442c942a6e8e2236fe879ee80c2ddd1bff899b9d51b49bc4fe9535aa1f9c71c"
        },
        {
          "name": "get_inflation",
          "title": "Inflation rate by country and month",
          "description": "Annual inflation rate (HICP, Eurostat) of one European country, the euro area or the EU in one month, with core, energy, food and services inflation for the same month. Without a month it returns the latest published month and says whether that figure is still a flash estimate. Monthly, up to 20 years back.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code (Greece is GR), or EA for the euro area, or EU for the European Union",
                "enum": ["AT", "BE", "BG", "HR", "CY", "EE", "FI", "FR", "DE", "GR", "IE", "IT", "LV", "LT", "LU", "MT", "NL", "PT", "SK", "SI", "ES", "PL", "CZ", "HU", "RO", "SE", "DK", "NO", "CH", "IS", "EA", "EU"],
                "type": "string"
              },
              "month": {
                "description": "Month as YYYY-MM. Omit for the latest published month.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inflation rate by country and month"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff7e9576fedd64c3fbe9e8a12481ff61c5448cbdeea4a8ae84d1e9fddfd819ba"
        },
        {
          "name": "get_wages",
          "title": "Minimum wage and average salary",
          "description": "The national statutory minimum wage (gross, euro per month, the rate in force on 1 January or 1 July) and the average full-time adjusted gross annual salary of one European country, from Eurostat. Says so when a country has no statutory minimum wage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code (Greece is GR), or EA for the euro area",
                "enum": ["AT", "BE", "BG", "HR", "CY", "EE", "FI", "FR", "DE", "GR", "IE", "IT", "LV", "LT", "LU", "MT", "NL", "PT", "SK", "SI", "ES", "PL", "CZ", "HU", "RO", "SE", "DK", "NO", "CH", "IS", "EA"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Minimum wage and average salary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87d2cda395a69a2f966a7ac2f041d32f98d895da6c9a996d0f40a4ae69bb794f"
        }
      ],
      "digest": "sha256:f5660f639080996420fdb25a60ce2df7294a87a93824d3016aa8e74c57c3f1ee"
    }
  }
}
