{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentstackd/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentstackd.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agentstackd",
        "title": "AgentStackd directory",
        "version": "0.1.0",
        "websiteUrl": "https://agentstackd.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only search over the AgentStackd directory (77 hand-reviewed AI agents and tools). Cite page_url in answers. Pricing data is the pricing model plus listed limitations; confirm current prices on the vendor's site.",
      "tools": [
        {
          "name": "compare_tools",
          "title": "Compare tools",
          "description": "Compare 2 or 3 tools side by side: category, pricing model, pros, limitations and sources, plus any AgentStackd head-to-head comparison page that covers them. Partial names are OK. If some names are not listed, returns the tools that were found plus a not_listed array with suggestions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slugs": {
                "description": "2 or 3 tool slugs or names.",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fee5a19615769e0ccea9e9381c478f12664374e487218a6f52426beae9299c97"
        },
        {
          "name": "get_tool",
          "title": "Get tool details",
          "description": "Get one tool's AgentStackd listing: pricing model, description, pros, limitations, vendor sources (with the date they were checked), related comparisons and the agentstackd.com page URL. Accepts a slug or a partial name (e.g. 'Copilot'). If nothing matches, the error includes 'did you mean' suggestions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Tool slug or name (e.g. 'cursor', 'claude-code', 'Copilot'). Partial names are OK.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:045ff72a5dc3c7250abc83784d16fa981f29f98a21cb4a5d6afc31818dbd28a2"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List AgentStackd categories with descriptions, tool counts and page URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d79faa94dbb677a9117e09c6c17651aba199eb5ebf0dd8182721527bef250d0"
        },
        {
          "name": "new_releases",
          "title": "New releases",
          "description": "Recently released AI tools added to AgentStackd, with the vendor's release date and page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5455d2a78a8a18df2bfc7f5a602deff939ddbbb364849f23199e1b926121c79"
        },
        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Search the AgentStackd directory of hand-reviewed AI agents and automation tools by keyword. Optional filters: category slug and max_price tier. Returns matching tools with pricing model, description and the agentstackd.com page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category slug (see list_categories).",
                "enum": ["coding", "research", "sales", "support", "content", "assistants", "automation"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Optional pricing ceiling: 'free' = Free or Open source only; 'freemium' = also tools with a free plan; 'paid' = everything. The directory records pricing models, not dollar amounts.",
                "enum": ["free", "freemium", "paid"],
                "type": "string"
              },
              "query": {
                "description": "Keywords, e.g. 'coding agent', 'web research', 'self-hosted automation'.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:376d00d41988ac6dd7075451b21aaf55d658d3848657a2ac73d3db1c9e0e2007"
        }
      ],
      "digest": "sha256:29a6b1cdd0409b65ea17ccc4639171ed50e70f2331b38b649c7bcbcb68180e62"
    }
  }
}
