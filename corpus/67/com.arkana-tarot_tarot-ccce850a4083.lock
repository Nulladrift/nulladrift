{
  "lockfileVersion": 2,
  "subjects": {
    "com.arkana-tarot/tarot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://arkana-tarot.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "arkana-tarot",
        "title": "Arkana tarot",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tarot deck with a fair, cryptographically random shuffle. Meanings follow the Rider–Waite–Smith tradition. Names and meanings are in Lithuanian (lt, default) or English (en).",
      "tools": [
        {
          "name": "draw_cards",
          "title": "Draw tarot cards",
          "description": "Shuffles a 78-card Rider–Waite–Smith deck with a cryptographic random generator and deals a spread. Returns each position with the card, its orientation, the meaning for that orientation and a link that shows the spread with card pictures.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of cards for spread=custom when positions are not given.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "description": "Language of names and meanings. Default lt.",
                "enum": ["lt", "en"],
                "type": "string"
              },
              "majors_only": {
                "description": "Use only the 22 Major Arcana. Default false.",
                "type": "boolean"
              },
              "positions": {
                "description": "For spread=custom: one position or question per card.",
                "items": {
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "question": {
                "description": "The user's question, stored in the share link.",
                "maxLength": 500,
                "type": "string"
              },
              "reversals": {
                "description": "Allow reversed cards. Default true.",
                "type": "boolean"
              },
              "spread": {
                "description": "Spread id. Default ppf (past, present, future). custom takes positions or count.",
                "enum": ["one", "ppf", "soa", "cross", "rel", "paths", "celtic", "year", "custom"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draw tarot cards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57b43b69378d2cc614ba7dd8c0d2389be27b98027eceb71f6fccabf269ea3d0e"
        },
        {
          "name": "draw_clarifier",
          "title": "Draw a clarifying card",
          "description": "Draws one or more clarifying cards from the rest of the deck, leaving out the cards given in exclude.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Default 1.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "exclude": {
                "description": "Ids of cards already drawn; these are left out of the deck.",
                "items": {
                  "maximum": 77,
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "lang": {
                "description": "Language of names and meanings. Default lt.",
                "enum": ["lt", "en"],
                "type": "string"
              },
              "majors_only": {
                "description": "Default false.",
                "type": "boolean"
              },
              "reversals": {
                "description": "Default true.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draw a clarifying card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6406b9e99dd3a2eeaca29e242b315b5d13991b1289666ae6448308cadcceb665"
        },
        {
          "name": "get_card",
          "title": "Look up a card",
          "description": "Meaning of one tarot card, upright and reversed, with its element and a short description of the image. Accepts a card name in English or Lithuanian, or an id 0–77.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card": {
                "description": "e.g. \"The Tower\", \"Taurių dvejetas\", \"Queen of Swords\", 16",
                "type": ["string", "integer"]
              },
              "lang": {
                "description": "Language of names and meanings. Default lt.",
                "enum": ["lt", "en"],
                "type": "string"
              }
            },
            "required": ["card"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3001422cc1f77738ef0eb73de6e5c62e584ceed5b2b21a103a4449d2440227bc"
        },
        {
          "name": "list_spreads",
          "title": "List spreads",
          "description": "The available spreads with their number of cards and the meaning of each position.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of names and meanings. Default lt.",
                "enum": ["lt", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List spreads"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8777419389d93c1c74f750ce5bde3cbba498337583310230251a6205fbf511fb"
        }
      ],
      "digest": "sha256:4cbf56e38ee461ab61b3e86463c2c04c371e99e5c342fac9f2394f7d15a1f918"
    }
  }
}
