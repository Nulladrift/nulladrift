        {
          "name": "analyst_archive",
          "description": "Analyst signal archive — paginated 1-year history (public, MCP-compatible) — Returns a paginated archive of signals attributed to a single analyst, covering up to 1 year (365 days). This is the MCP-tool-compatible variant of the analyst archive — it uses query params instead of path params so AI agents can call it directly without resolving a URL template. Analyst IDs: chain_hawk (ChainHawk, BTC & macro on-chain), whale_watch (WhaleWatch, multi-chain whale moves), alpha_scout (AlphaScout, emerging tokens), defi_pulse (DeFiPulse, DeFi/stables/bridges), quant_edge (QuantEdge, signal risk/convergence), rate_hawk (RateHawk, funding rates & derivatives), flow_tracer (FlowTracer, stablecoin & capital flows), unlock_guard (UnlockGuard, token unlock risk), sentiment_edge (SentimentEdge, social sentiment extremes), narrative_pulse (NarrativePulse, sector rotation & narratives). Filters: period (7d | 30d | 90d | 365d, default 90d), outcome (all | win | loss | neutral | pending, default all), page (1-indexed, default 1)",
          "inputSchema": {
            "properties": {
              "analystId": {
                "description": "Analyst slug. Valid values: chain_hawk, whale_watch, alpha_scout, defi_pulse, quant_edge, rate_hawk, flow_tracer, unlock_guard, sentiment_edge, narrative_pulse.",
                "enum": ["chain_hawk", "whale_watch", "alpha_scout", "defi_pulse", "quant_edge", "rate_hawk", "flow_tracer", "unlock_guard", "sentiment_edge", "narrative_pulse"],
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Results per page (10–100, default 100).",
                "maximum": 100,
                "minimum": 10,
                "type": "integer"
              },
              "outcome": {
                "default": "all",
                "description": "Filter by outcome: all | win | loss | neutral | pending (default all).",
                "enum": ["all", "win", "loss", "neutral", "pending"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number (1-indexed, default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "90d",
                "description": "Time window: 7d | 30d | 90d | 365d (default 90d). Use 365d to access up to 1 year of history.",
                "enum": ["7d", "30d", "90d", "365d"],
                "type": "string"
              }
            },
            "required": ["analystId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analystId": {
                "description": "Echoed analyst slug",
                "type": "string"
              },
              "attribution": {
                "$ref": "#/components/schemas/Attribution"
              },
              "page": {
                "description": "Current page number (1-indexed)",
                "type": "number"
              },
              "pages": {
                "description": "Total number of pages",
                "type": "number"
              },
              "signals": {
                "description": "Signals attributed to the requested analyst in reverse-chronological order.",
                "items": {
                  "properties": {
                    "analystId": {
                      "description": "Analyst slug",
                      "type": "string"
                    },
                    "createdAt": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "id": {
                      "description": "Unique signal row ID",
                      "type": "number"
                    },
                    "outcome": {
                      "description": "'win' | 'loss' | 'neutral' | null (pending)",
                      "nullable": true,
                      "type": "string"
                    },
                    "returnPct": {
                      "description": "Percentage-point return, e.g. 8.4 = +8.4%. Null if unresolved.",
                      "nullable": true,
                      "type": "number"
                    },
                    "tokens": {
                      "description": "Symbols involved, e.g. ['BTC']",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "typeLabel": {
                      "description": "Human-readable signal type, e.g. 'Whale Move', 'Volume Breakout'",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "tier": {
                "description": "Always 'starter' (up to 365-day depth) for this public endpoint",
                "type": "string"
              },
              "total": {
                "description": "Total number of matching signals in the window",
                "type": "number"
              },
              "updatedAt": {
                "format": "date-time",
                "type": "string"
              }
            },
            "type": "object"
