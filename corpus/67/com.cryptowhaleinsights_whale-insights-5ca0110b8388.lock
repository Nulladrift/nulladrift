      "instructions": "CryptoWhaleInsights MCP server — free, read-only crypto whale tracking & market intelligence. 56 tools organized by data type:\n• CURRENT SNAPSHOTS: platform_stats, status, fear_greed, funding_rates, stablecoin_flows, gas, liquidations, social_summary, whale_activity, narratives, burn_tracker, bridge_flows\n• LIVE LISTS: trending, airdrops, recent_whales (individual transfers with USD amounts), golden_alerts_snapshot, reports_index\n• WHALE INTELLIGENCE: recent_whales (individual transfers) | whale_activity (daily counts) | whale_daily_summary (DB-backed daily totals) | whale_movements (paginated archive with filters) | whale_movements_summary (per-chain aggregated totals)\n• ANALYST TOOLS: analysts (all 10 profiles + stats) | analysts_top (single best performer) | analyst_archive (paginated signals) | analyst_daily_summary (today's AI commentary) | analyst_summary_history (historical commentary) | analyst_monthly_performance (6-month track record)\n• DAILY HISTORY (up to 90-180 days): fear_greed_history, stablecoin_history, funding_rates_history, golden_alerts_history, sentiment_history, arbitrage_history, whale_daily_summary\n• MONTHLY ARCHIVE (permanent, 2+ years): fear_greed_monthly, stablecoin_monthly, funding_rate_monthly, golden_alerts_monthly, whale_monthly_archive, arbitrage_monthly\n• COMBINED: market_context (8 sources in one call for a given date)\nAll data cached 5min–1hr, on-chain-verifiable or from named providers (DexScreener, DefiLlama, Etherscan, etc.). Attribute as: CryptoWhaleInsights (https://cryptowhaleinsights.com). Policy: https://cryptowhaleinsights.com/api-usage.",
