      "instructions": "Machine Inbox sells task-scoped email inboxes. Buying requires an HTTP payment (Stripe MPP or x402); every read and reply tool works with the mi_live_ bearer token from the purchase.",
      "tools": [
        {
          "name": "create_inbox",
          "description": "Request a new paid inbox. Buying requires an out-of-band payment (Stripe MPP or x402 USDC on Base); this tool returns the live HTTP 402 payment challenge plus exact instructions to complete the purchase. Standard inbox: $2.00.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "High-entropy key to bind the eventual paid retry to this request.",
