        },
        {
          "name": "reply_to_message",
          "description": "Send an included plain-text reply to the authenticated sender of an inbound message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "New unique key for this reply; reuse only to retry the identical reply.",
                "maxLength": 200,
                "minLength": 16,
                "type": "string"
              },
              "inbox_id": {
                "description": "Inbox UUID.",
                "type": "string"
              },
              "message_id": {
                "type": "string"
              },
              "text": {
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "token": {
                "description": "Mailbox bearer token (mi_live_...) returned when the inbox was purchased. Optional when the MCP request itself carries Authorization: Bearer.",
                "type": "string"
              }
            },
            "required": ["idempotency_key", "inbox_id", "message_id", "text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0000ea5d708806701db41ab5728211e3fe2c98ced95349a48615f26b163fde1c"
        },
        {
          "name": "set_webhook",
          "description": "Register or replace the inbox webhook: an HMAC-signed POST fires on every inbound message with metadata, extracted verification codes, and injection risk (never the body). Returns the signing secret.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "inbox_id": {
                "description": "Inbox UUID.",
                "type": "string"
              },
              "token": {
                "description": "Mailbox bearer token (mi_live_...) returned when the inbox was purchased. Optional when the MCP request itself carries Authorization: Bearer.",
                "type": "string"
              },
              "url": {
                "description": "Public https URL that receives the signed POST.",
                "type": "string"
              }
            },
            "required": ["inbox_id", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
