{
  "lockfileVersion": 2,
  "subjects": {
    "com.candidcost/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://candidcost.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "candidcost",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these tools to answer home-buying questions with sourced data. Every response is educational_only and cites its public source, methodology version, and ledger receipt — prefer citing those fields verbatim. Money is integer cents; rates are fixed-precision percent strings. Nothing here is financial advice, and no tool accepts or stores personal information.",
      "tools": [
        {
          "name": "affordability_estimate",
          "description": "Compute front-end (housing) and back-end (total debt) DTI budgets from income and debts, and the home price implied by the binding limit. Reports the standard 28/36 thresholds without ever telling the user what they \"can afford\". Dollar inputs are US dollars; money in the response is integer cents.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "backEndLimitPct": {
                "default": 36,
                "description": "Total DTI ceiling percent (default 36)",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "downPayment": {
                "default": 45000,
                "description": "Down payment available, US dollars",
                "minimum": 0,
                "type": "number"
              },
              "frontEndLimitPct": {
                "default": 28,
                "description": "Housing DTI ceiling percent (default 28)",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "grossMonthlyIncome": {
                "description": "Gross monthly income, US dollars",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "insuranceAnnual": {
                "default": 1584,
                "description": "Annual homeowners insurance premium, US dollars",
                "minimum": 0,
                "type": "number"
              },
              "monthlyDebts": {
                "default": 0,
                "description": "Recurring monthly debt payments (cards, autos, student loans), US dollars",
                "minimum": 0,
                "type": "number"
              },
              "propertyTaxRatePct": {
                "default": 1.26,
                "description": "Annual property tax rate, % of value",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "rateAnnualPct": {
                "default": 6.5,
                "description": "Annual interest rate percent",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "termYears": {
                "default": 30,
                "description": "Loan term in years (default 30)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["grossMonthlyIncome"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Affordability / DTI Estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5b292cf4e797ff7d4ae2a34d5d8e225cb0703a1476e1b2ca721a1028d90f284"
        },
        {
          "name": "benchmark_rates",
          "description": "Return the latest benchmark mortgage rates (e.g. 30-year and 15-year fixed) from the Federal Reserve (FRED), each with its observation date and ledger receipt. Rates are fixed-precision percent strings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Current Benchmark Mortgage Rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6a53705004cfd77d345e046abcf359e22fe55e10f17e9ed0efe6351cb84b5fde"
        },
        {
          "name": "decode_loan_estimate_fee",
          "description": "Classify a mortgage Loan Estimate fee by CFPB section and control class (set by lender, shoppable, third-party, government, or prepaid), with a plain-language explanation and an educational question a buyer could ask. Omit \"fee\" to list the full catalog.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fee": {
                "description": "Fee name or keyword, e.g. \"origination\", \"title\"",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Decode a Loan Estimate Fee"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f10d20c9a580a1134a356764f057f91f4d0c8fd449c81159a801aea66556d596"
        },
        {
          "name": "fee_benchmarks",
          "description": "Return closing-cost and rate-spread percentile distributions (p25/p50/p75 + mean) for a US state, computed from the row-level CFPB HMDA LAR for originated, first-lien, home-purchase loans. Cells with fewer than 25 records are suppressed. Dollar metrics are integer cents (…Cents); percent metrics are fixed-precision strings (…Pct). Each distribution carries a ledger receipt hash for verification.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "metric": {
                "description": "One of: total_loan_costs, origination_charges, rate_spread, interest_rate. Omit to return all metrics.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. \"MA\"",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "HMDA Fee & Rate-Spread Benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd36155dbd8cd58c90db85269c17c664132aad2bc0dc6c5f12afdf5a9cf3bc5c"
        },
        {
          "name": "payment_shock_estimate",
          "description": "Estimate why a mortgage payment often jumps in year two: escrow at closing is sized from the seller's current tax bill, but the county reassesses at your purchase price, and RESPA spreads the resulting escrow shortage over 12 months. Given the purchase price, the seller's current annual tax (from the listing), a state (or county FIPS) for the reassessment rate, and insurance, returns the year-1 escrow, the year-2 ongoing escrow, the temporary catch-up peak, and the jump. Money is integer cents. This decomposes the mechanics; it is not a prediction of your specific bill.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "county": {
                "description": "5-digit county FIPS; its Census effective rate takes priority over the state rate",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "insuranceAnnual": {
                "default": 1584,
                "description": "Annual homeowners insurance, US dollars",
                "minimum": 0,
                "type": "number"
              },
              "purchasePrice": {
                "description": "Purchase price in US dollars",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "reassessRatePct": {
                "description": "Effective annual property-tax rate at reassessment, %. Overrides county/state.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "sellersCurrentAnnualTax": {
                "description": "Seller's current annual property tax in US dollars (from the listing)",
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "description": "Two-letter US state code for the reassessment rate",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["purchasePrice", "sellersCurrentAnnualTax"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Year-2 Property-Tax Payment-Shock Estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dbd06da4b788bf7d0ed133b02a445ccb34c5ef00c08718d0ba177533b78b076d"
        },
        {
          "name": "pressure_check",
          "description": "Decompose the tradeoff a rushed buyer faces: the earnest money at risk by walking away versus what overpaying to \"win\" costs over the life of the loan. Given the earnest money at risk, the overpay amount over your walk-away price, down-payment percent, rate, and term, returns the cash and financed shares of the overpay, the extra monthly P&I, the lifetime cost of overpaying, and its ratio to the earnest money. Money is integer cents. Educational decomposition — it names the two numbers so they can be compared; it never tells the user to walk or stay.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "downPaymentPct": {
                "default": 10,
                "description": "Down payment as a percent of price (0–100); splits the overpay into cash-at-close vs. financed",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "earnestMoney": {
                "description": "Earnest money at risk if you walk away after removing contingencies, US dollars",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "overpay": {
                "description": "How much over your walk-away price the pressure would push you to pay, US dollars",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "rateAnnualPct": {
                "default": 6.5,
                "description": "Annual interest rate percent, e.g. 6.5",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "termYears": {
                "default": 30,
                "description": "Loan term in years (default 30)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["earnestMoney", "overpay"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Pressure Check — Walk-Away Math"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:446f02273d5cf97b2f14eabd03b203c5727b5f5bc7fe3bb78a759c2c0cf75c99"
        },
        {
          "name": "rent_vs_buy_estimate",
          "description": "Compare the net cost of owning against renting over a holding period and find the break-even year. Owning nets upfront cash and recurring carrying costs against sale proceeds (appreciated value − selling costs − remaining loan); renting nets rent paid against the investment gain on the cash a buyer would tie up. Dollar inputs are US dollars; money in the response is integer cents. Appreciation, rent growth, and investment return are user-set assumptions. Tax deductions are excluded (documented simplification). Educational decomposition — it reports both net costs and the break-even year; it never says rent or buy.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annualAppreciationPct": {
                "default": 3,
                "description": "Assumed annual home-price appreciation percent",
                "maximum": 30,
                "minimum": -20,
                "type": "number"
              },
              "annualRentIncreasePct": {
                "default": 3,
                "description": "Assumed annual rent increase percent",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "closingCostPct": {
                "default": 3,
                "description": "Upfront buy-side closing costs, % of price",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "downPaymentPct": {
                "default": 10,
                "description": "Down payment as a percent of price",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "hoaMonthly": {
                "default": 0,
                "description": "Monthly HOA dues, US dollars",
                "minimum": 0,
                "type": "number"
              },
              "holdingYears": {
                "default": 7,
                "description": "How many years you plan to stay before selling",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "homePrice": {
                "description": "Home price in US dollars",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "insuranceAnnual": {
                "default": 1800,
                "description": "Annual homeowners insurance, US dollars",
                "minimum": 0,
                "type": "number"
              },
              "investmentReturnPct": {
                "default": 5,
                "description": "Assumed annual return a renter earns on invested cash percent",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "maintenanceRatePct": {
                "default": 1,
                "description": "Annual maintenance reserve, % of home value",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "monthlyRent": {
                "description": "Comparable monthly rent in US dollars",
                "minimum": 0,
                "type": "number"
              },
              "propertyTaxRatePct": {
                "default": 1.1,
                "description": "Annual property tax rate, % of value",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "rateAnnualPct": {
                "default": 6.5,
                "description": "Annual interest rate percent",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "sellingCostPct": {
                "default": 6,
                "description": "Selling costs at exit, % of future value",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "termYears": {
                "default": 30,
                "description": "Loan term in years",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["homePrice", "monthlyRent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Rent vs. Buy Net-Cost Estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:11ed4799a37825962c8d50ea97a7af52ff71b3ec055320a253833070c44b13f5"
        },
        {
          "name": "search_dpa_programs",
          "description": "Find down payment assistance (DPA) programs by US state and/or buyer type. Includes national programs. Each result links to its official government source and carries a ledger receipt and last-verified date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyer": {
                "description": "Buyer type filter, e.g. \"first-time\", \"veteran\", \"rural\", \"teacher\"",
                "maxLength": 40,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code to filter by",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Search Down Payment Assistance Programs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:99de226089e548d16e93d5351fd17bf8120ac8f9f96a8d58b4fd16b20d976f5f"
        },
        {
          "name": "true_cost_estimate",
          "description": "Estimate the full monthly cost of owning a home — principal & interest, property tax, insurance, PMI, HOA, and maintenance — and contrast it with the lender \"approval\" payment (PITI+PMI) to reveal the hidden monthly gap. Dollar inputs are US dollars; all money in the response is integer cents; rates are fixed-precision percent strings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "county": {
                "description": "5-digit county FIPS code. When provided and its Census county rate is available, it takes priority over the state rate (more accurate).",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "downPaymentPct": {
                "default": 10,
                "description": "Down payment as a percent of price (0–100)",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "hoaMonthly": {
                "default": 0,
                "description": "Monthly HOA dues, US dollars",
                "minimum": 0,
                "type": "number"
              },
              "homePrice": {
                "description": "Home price in US dollars",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "homeYearBuilt": {
                "description": "Year the home was built. Scales the maintenance reserve by age band: ×1.5 pre-1980, ×1.2 1980–2005, ×1.0 2006+.",
                "maximum": 2100,
                "minimum": 1800,
                "type": "integer"
              },
              "insuranceAnnual": {
                "default": 1584,
                "description": "Annual homeowners insurance premium, US dollars",
                "minimum": 0,
                "type": "number"
              },
              "maintenanceRatePct": {
                "default": 1,
                "description": "Annual maintenance reserve, % of home value (baseline before age adjustment)",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "pmiAnnualRatePct": {
                "default": 0.5,
                "description": "Annual PMI rate, % of loan, applied while LTV > 80%",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "propertyTaxRatePct": {
                "description": "Annual property tax rate, % of value. Overrides county/state-derived rates when supplied.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "rateAnnualPct": {
                "default": 6.5,
                "description": "Annual interest rate percent, e.g. 6.5",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "state": {
                "description": "Two-letter US state code (e.g. \"NJ\"). When provided and propertyTaxRatePct is omitted, the Census ACS effective property-tax rate for that state is used.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "termYears": {
                "default": 30,
                "description": "Loan term in years (default 30)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["homePrice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "True Cost of Ownership Estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f24b1622ac94b6ad6adb5c7f018ef380aa04c63468b1987d4a201f84ceaa42d"
        },
        {
          "name": "verify_receipt",
          "description": "Verify a CandidCost ledger receipt hash (full sha256 or short \"3f9a…c21e\" form). Confirms the receipt exists and that its dataset hash chain is intact, proving the underlying data has not been altered since ingestion.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hash": {
                "description": "The receipt content hash to verify",
                "maxLength": 80,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Verify a Data Receipt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5520076831f77dab2103d0a3a77b3941e409fee9a89809187f13e327259021a0"
        }
