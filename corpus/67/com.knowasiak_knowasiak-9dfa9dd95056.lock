        {
          "name": "people_in_place",
          "title": "Who is in a city",
          "description": "Members or businesses in one city (or country) on the Knowasiak map, with what they do and what they are here for. On a signed-in connection, people the member follows or who follow them come first.",
          "inputSchema": {
            "properties": {
              "here_for": {
                "description": "Only members here for this.",
                "enum": ["learn", "connect", "share", "market", "customers"],
                "type": "string"
              },
              "industry": {
                "description": "Only this industry.",
                "enum": ["software", "ecommerce", "marketing", "consulting", "finance", "health", "education", "real_estate", "manufacturing", "food", "travel", "media", "creative", "logistics", "energy", "legal", "nonprofit", "home_services", "beauty", "automotive", "sports", "events", "pets", "export_import", "coaching", "textiles", "agriculture", "interiors"],
                "type": "string"
              },
              "limit": {
                "description": "How many. Default: 20.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many (next page).",
                "minimum": 0,
                "type": "integer"
              },
              "place": {
                "description": "A city (\"Mumbai\", \"Austin, US\"), a country name, or a place_id from people_map.",
                "type": "string"
              },
              "type": {
                "description": "People (members) or businesses. Default: people.",
                "enum": ["people", "businesses"],
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
