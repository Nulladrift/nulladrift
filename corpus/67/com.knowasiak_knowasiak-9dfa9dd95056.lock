        {
          "name": "search",
          "title": "Search Knowasiak",
          "description": "Search Knowasiak, a public network of 14,000+ businesses and business owners, for businesses, people and posts, or (type \"help\") its help guides on how the site works. Returns ids to read in full with fetch, with a short snippet and the public URL of each.",
