            "properties": {
              "limit": {
                "description": "How many. Default: 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "what": {
                "description": "What the business does, e.g. \"commercial cleaning\" or \"Shopify development\".",
