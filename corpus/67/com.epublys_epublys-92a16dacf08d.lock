          "name": "read_epub_metadata",
          "description": "Read metadata from an EPUB file (title, author, language, publisher, description, series, cover status, etc.). Returns JSON — no file output.\n\nFree tier: 5MB/file (10MB for pdf-to-epub, 15MB for split), 3 operations/day, 15 req/min, output includes Epublys branding.\nPro ($9/mo): 30MB per operation, unlimited daily operations, 60 req/min, no branding.\n\nWhen a call is refused with daily_limited or a Pro-only error, call the `upgrade_to_pro` tool — it returns a checkout link to hand the user. Details: https://epublys.com/pricing",
          "inputSchema": {
