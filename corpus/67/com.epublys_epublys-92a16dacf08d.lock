        {
          "name": "epub_to_markdown",
          "description": "Convert an EPUB ebook to Markdown. Returns a ZIP with one Markdown file per chapter (YAML frontmatter with title/book/author/chapter), an index.md with book metadata and a linked table of contents, and the referenced images. Plain CommonMark — drops straight into an Obsidian vault or any notes pipeline.\n\nFree tier: 5MB/file (10MB for pdf-to-epub, 15MB for split), 3 operations/day, 15 req/min, output includes Epublys branding.\nPro ($9/mo): 30MB per operation, unlimited daily operations, 60 req/min, no branding.\n\nWhen a call is refused with daily_limited or a Pro-only error, call the `upgrade_to_pro` tool — it returns a checkout link to hand the user. Details: https://epublys.com/pricing",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "Base64-encoded EPUB file content",
                "type": "string"
              },
              "includeImages": {
                "default": true,
                "description": "Copy referenced images into an images/ folder",
                "type": "boolean"
              },
              "name": {
                "description": "Original filename — the output is named after its stem (e.g. \"Book.epub\" gives \"Book (compressed).epub\"); without it the output keeps a fixed name",
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fa6dce6d1708309fa59f75319f0cb38ee0d2f94504a69335ac001a8f41610e1"
        },
        {
          "name": "epub_to_pdf",
          "description": "Convert an EPUB ebook to PDF. Supports page size, margins, font, and page number options.\n\nPro ($9/mo) is strongly recommended for PDF conversion — the 30MB limit handles illustrated or academic books that exceed the free 5MB cap.\nUpgrade at https://epublys.com/pricing",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "Base64-encoded EPUB file content",
                "type": "string"
              },
              "fontFamily": {
                "default": "serif",
                "enum": ["serif", "sans"],
                "type": "string"
              },
              "fontSize": {
                "default": 11,
                "description": "Font size in points",
                "maximum": 48,
                "minimum": 6,
                "type": "integer"
              },
              "margins": {
                "default": 60,
                "description": "Page margins in points",
                "type": "integer"
              },
              "name": {
                "description": "Original filename — the output is named after its stem (e.g. \"Book.epub\" gives \"Book (compressed).epub\"); without it the output keeps a fixed name",
                "type": "string"
              },
              "pageNumbers": {
                "default": true,
                "type": "boolean"
              },
              "pageSize": {
                "default": "a4",
                "enum": ["a4", "letter"],
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f348597cb6fe3b87f08474bed13d85b91496fd3dad67f8cfed44185b5110f45"
        },
        {
          "name": "generate_cover",
          "description": "Generate an AI book cover image using FLUX. Describe your vision, pick a genre, and get a portrait JPEG cover — 768×1152 when the model honours the requested size, otherwise its default square. The AI enhances your prompt with professional composition guidance while preserving your creative vision.\n\nPro only ($9/mo). Upgrade at https://epublys.com/pricing",
          "inputSchema": {
            "properties": {
              "author": {
                "description": "Author name (for context, not rendered on cover)",
                "maxLength": 200,
                "type": "string"
              },
              "description": {
                "description": "Creative description of the desired book cover (max 2000 chars). Either description or title is required.",
                "maxLength": 2000,
                "type": "string"
              },
              "genre": {
                "description": "Book genre — affects style and composition",
                "enum": ["fantasy", "romance", "thriller", "sci-fi", "literary", "non-fiction", "horror", "children", "poetry", "minimalist"],
                "type": "string"
              },
              "seed": {
                "description": "Random seed for reproducible generation",
                "type": "integer"
              },
              "title": {
                "description": "Book title — used to synthesize a cover concept when no description is given (not rendered on cover)",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f62eb25fe886e275da9f03d919cdf45ea671d58031f149b1cdd1bb800e40c31"
        },
        {
          "name": "markdown_to_epub",
          "description": "Build a valid EPUB3 ebook from Markdown files — one file per chapter, in array order. Understands YAML frontmatter (title/author) and Obsidian [[wikilinks]]; cross-file .md links are rewritten to chapter links inside the book. No Pandoc required.\n\nFree tier: 5MB/file (10MB for pdf-to-epub, 15MB for split), 3 operations/day, 15 req/min, output includes Epublys branding.\nPro ($9/mo): 30MB per operation, unlimited daily operations, 60 req/min, no branding.\n\nWhen a call is refused with daily_limited or a Pro-only error, call the `upgrade_to_pro` tool — it returns a checkout link to hand the user. Details: https://epublys.com/pricing",
          "inputSchema": {
            "properties": {
              "author": {
                "description": "Author (defaults to frontmatter)",
                "maxLength": 300,
                "type": "string"
              },
              "files": {
                "description": "Markdown files, one per chapter, in reading order",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Base64-encoded Markdown content",
                      "type": "string"
                    },
                    "name": {
                      "description": "Filename (used for chapter title fallback and cross-file link rewrites; the first one names the output)",
                      "type": "string"
                    }
                  },
                  "required": ["content"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "default": "en",
                "type": "string"
              },
              "title": {
                "description": "Book title (defaults to frontmatter or first heading)",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6515fa278dc0f0d9857b02e515a724ddebb72236a5aaa77ae387cd285270bdf2"
        },
        {
          "name": "merge_epub",
          "description": "Merge multiple EPUB files into a single ebook with table of contents and chapter dividers. Accepts 2+ base64-encoded EPUB files.\n\nFree tier: 5MB/file (10MB for pdf-to-epub, 15MB for split), 3 operations/day, 15 req/min, output includes Epublys branding.\nPro ($9/mo): 30MB per operation, unlimited daily operations, 60 req/min, no branding.\n\nWhen a call is refused with daily_limited or a Pro-only error, call the `upgrade_to_pro` tool — it returns a checkout link to hand the user. Details: https://epublys.com/pricing",
          "inputSchema": {
            "properties": {
              "author": {
                "description": "Author for the merged EPUB (optional)",
                "maxLength": 300,
                "type": "string"
              },
              "dividers": {
                "default": true,
                "description": "Insert divider pages between books",
                "type": "boolean"
              },
              "files": {
                "description": "Array of base64-encoded EPUB files to merge (order preserved)",
                "items": {
                  "description": "Base64-encoded EPUB file content",
                  "type": "string"
                },
                "minItems": 2,
                "type": "array"
              },
              "names": {
                "description": "Original filenames, in the same order as files — the output is named after them (\"A + B.epub\", or \"A + N more.epub\" past two); without them it is merged.epub",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Title for the merged EPUB (optional)",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4458f13da4663a8f49a534dfedd5de09768515de79fbfaa28c7b32b6db46e98"
        },
        {
          "name": "pdf_to_epub",
          "description": "Convert a PDF document to EPUB ebook format. Supports automatic chapter detection, image extraction (Pro), and custom chapter grouping.\n\nFree tier supports up to 10MB per PDF. Pro ($9/mo) is strongly recommended for PDF conversion — the 30MB limit handles most scanned or illustrated PDFs.\nUpgrade at https://epublys.com/pricing",
          "inputSchema": {
            "properties": {
              "chapterMode": {
                "default": "auto",
                "description": "How to split into chapters",
                "enum": ["auto", "every-n", "single"],
                "type": "string"
              },
              "extractImages": {
                "default": true,
                "description": "Pro only — ignored on free tier",
                "type": "boolean"
              },
              "file": {
                "description": "Base64-encoded PDF file content",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language code for the output EPUB",
                "type": "string"
              },
              "name": {
                "description": "Original filename — the output is named after its stem (e.g. \"Book.epub\" gives \"Book (compressed).epub\"); without it the output keeps a fixed name",
                "type": "string"
              },
              "pagesPerChapter": {
                "default": 10,
                "description": "Pages per chapter (only for every-n mode)",
                "type": "integer"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
