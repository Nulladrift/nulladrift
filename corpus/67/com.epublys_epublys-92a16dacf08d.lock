        },
        {
          "name": "split_epub",
          "description": "Split an EPUB. With a chapter range (chapterStart and/or chapterEnd) the result is ONE base64-encoded EPUB of exactly those chapters, in order, with the book's metadata, a table of contents limited to them and the fonts and images they use. Without a range the result is a base64-encoded ZIP archive holding one EPUB per chapter.\n\nFree tier: 5MB/file (10MB for pdf-to-epub, 15MB for split), 3 operations/day, 15 req/min, output includes Epublys branding.\nPro ($9/mo): 30MB per operation, unlimited daily operations, 60 req/min, no branding.\n\nWhen a call is refused with daily_limited or a Pro-only error, call the `upgrade_to_pro` tool — it returns a checkout link to hand the user. Details: https://epublys.com/pricing",
          "inputSchema": {
            "properties": {
              "chapterEnd": {
                "description": "Last chapter to include (inclusive, optional)",
                "minimum": 1,
                "type": "integer"
              },
              "chapterStart": {
                "description": "First chapter to include (1-indexed, optional). Giving either bound returns one EPUB of the range instead of a ZIP",
                "minimum": 1,
                "type": "integer"
              },
              "file": {
                "description": "Base64-encoded EPUB file content",
                "type": "string"
              },
              "keepMetadata": {
                "default": true,
                "description": "Preserve the original author, publisher and description in the output",
                "type": "boolean"
              },
              "name": {
                "description": "Original filename — the output is named after its stem (e.g. \"Book.epub\" gives \"Book (compressed).epub\"); without it the output keeps a fixed name",
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc3ef1d71f4091daef2ec15659a62934e67aff2c2550f0c9050038af048c6bbe"
        },
        {
          "name": "upgrade_to_pro",
          "description": "Get a checkout link so the user can upgrade THIS account to Epublys Pro.\n\nCall this when another tool is refused with `daily_limited` or a Pro-only error, or when the\nuser asks to upgrade. Returns a Stripe checkout URL to hand to the user — they complete payment\nin their own browser.\n\nCreates no charge by itself, and the link is bound to the account that owns the API key being\nused, so it cannot be used to pay for anyone else. If the account is already Pro it says so and\nreturns no link. Needs an API key: without one it returns the pricing URL instead of a checkout\nlink. Free: 3 operations/day, 5MB per file. Pro: unlimited\ndaily operations, 30MB per operation, 60 req/min, no branding on output.",
          "inputSchema": {
            "properties": {
              "plan": {
                "default": "monthly",
                "description": "monthly is $9/month; yearly is $72/year (4 months free, 33% off). Defaults to monthly.",
                "enum": ["monthly", "yearly"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bd73ce30118a30a31a586ff7cc45e7a115e0435c61261025d1cdc42777f2eb96"
        },
        {
          "name": "validate_epub",
          "description": "Validate an EPUB file for errors, compatibility issues, and spec compliance. Returns JSON with check results. Can optionally auto-fix common issues.\n\nFree tier: 5MB/file (10MB for pdf-to-epub, 15MB for split), 3 operations/day, 15 req/min, output includes Epublys branding.\nPro ($9/mo): 30MB per operation, unlimited daily operations, 60 req/min, no branding.\n\nWhen a call is refused with daily_limited or a Pro-only error, call the `upgrade_to_pro` tool — it returns a checkout link to hand the user. Details: https://epublys.com/pricing",
          "inputSchema": {
