        {
          "name": "comms_embed_create",
          "description": "Embed a LIVE mosadd chat channel into an app/site you're building (great for builder-agents on Lovable/Bolt/Cursor/v0). Mints a publishable embed key scoped to a channel + the app's domain(s) and returns a ready-to-paste HTML snippet (a <div> + <script src=embed.mosadd.com/v1.js data-key=…>). Visitors of the host page chat in real time (anonymous nick or mosadd login). REQUIRES `allowed_origins` — the domain(s) the app is served from (the key only works there). The publishable key is browser-safe (mints only channel-scoped JWTs); your hub key never leaves the server. Returns { embed_key, channel, allowed_origins, snippet }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "allowed_origins": {
                "description": "REQUIRED. Domain(s) where the widget will be served — the key only works from these origins. Use the host(s) of the app you're building, e.g. ['app.acme.com','*.acme.com']. For local testing use mode:'test' and e.g. 'localhost:3000'.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "anon": {
                "description": "Allow visitors to join with just a nick (no mosadd account). Default true.",
                "type": "boolean"
              },
              "channel": {
                "description": "The mIRC channel id everyone on the embed shares (e.g. 'acme-support'). Auto-created on first message if new.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "locale": {
                "description": "Widget UI language. Default 'en'.",
                "enum": ["en", "pl"],
                "type": "string"
              },
              "mode": {
                "description": "Key mode — 'test' for local/dev origins, 'live' for production. Default 'live'.",
                "enum": ["live", "test"],
                "type": "string"
              },
              "name": {
                "description": "Label for the key in the owner's dashboard. Default 'embed: <channel>'.",
                "maxLength": 64,
                "type": "string"
              },
              "position": {
                "description": "Where the widget renders. Default 'inline'.",
                "enum": ["inline", "sidebar-left", "sidebar-right", "floating-bl", "floating-br", "fullscreen"],
                "type": "string"
              },
              "skin": {
                "description": "Visual skin. Default 'default' (mosadd-branded retro mIRC).",
                "enum": ["default", "retro-irc-1990", "terminal", "minimal-dark", "minimal-light"],
                "type": "string"
              },
              "title": {
                "description": "Header title shown in the widget. Default 'mIRC'.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["allowed_origins", "channel"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Create website embed"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
