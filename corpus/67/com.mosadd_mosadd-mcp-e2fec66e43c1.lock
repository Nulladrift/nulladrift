        {
          "name": "mRAG_search",
          "description": "Search and answer questions over the USER'S OWN mosadd data (messages, emails, calls, notes) with a private per-user RAG index — hybrid vector + keyword retrieval, reranked, grounded in cited sources (no fabrication). Use it to recall 'what did X say about Y', summarize a thread, or pull facts the user has received. Returns an answer plus the source snippets it used. This is agent memory (mRAG = RAG over your own data) over the user's communications, available outside the mosadd app. NOTE: RAG requires content to be indexed server-side in plaintext, so anything searchable here is NOT covered by the zero-knowledge / E2EE guarantee — only data the user has explicitly opted into indexing is searchable. See docs/security/e2ee-posture.md.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Natural-language question to answer from the user's own indexed messages/emails/calls/notes.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "source_types": {
                "description": "Restrict retrieval to these source types. Omit to search everything. 'file' covers anything added with mRAG_ingest (its default, and where 'note' ingests land); 'ptt' covers push-to-talk transcripts ingested by mTALK_ingest_ptt.",
                "items": {
                  "enum": ["message", "email", "call", "note", "contact", "file", "ptt"],
                  "type": "string"
                },
                "type": "array"
              },
              "thread_id": {
                "description": "Optional: restrict retrieval to a single thread id (e.g. a dm:/chat: thread).",
                "type": "string"
              },
              "top_k": {
                "description": "Max number of source chunks to retrieve and ground the answer in. Default 8.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search memory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5ae2091978531b8c37d868687f7e8c5dc7b7adc1783d216c974fb2451418714d"
        },
        {
          "name": "mTALK_ingest_ptt",
          "description": "Submit a finished PTT 'over' (push-to-talk audio segment) for transcription into the caller's RAG index — so 'what did X say on PTT?' is searchable later. The PERSISTENCE of the voice message itself (the message_meta row + fan-out) is handled by mDM_send_voice / mIRC_send_voice; this tool is the transcription bridge only. Honors per-user RAG opt-in: opted-out callers get status='skipped_optout' (no transcript stored). Auth: Supabase session JWT.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audio_base64": {
                "description": "Recorded PTT 'over' as base64 (a 'data:audio/…;base64,…' prefix is stripped if present).",
                "maxLength": 20000000,
                "minLength": 1,
                "type": "string"
              },
              "direction": {
                "description": "Direction the PTT crossed: who originated, who received. 'human_to_agent' = user spoke to an agent; 'agent_to_human' = agent spoke to the user.",
                "enum": ["human_to_agent", "agent_to_human"],
                "type": "string"
              },
              "message_id": {
                "description": "Optional id of the messages_meta row this PTT belongs to. When present, links the transcript back to the message for jump-to-source from RAG.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "mime_type": {
                "default": "audio/webm",
                "description": "MIME type of the audio. Default audio/webm (browser MediaRecorder default).",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "thread_id": {
                "description": "Optional thread id (e.g. `chat:<channel_id>` or `dm:<a>:<b>`) so the transcript carries its conversational scope into RAG.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["audio_base64", "direction"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Transcribe PTT audio into memory"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2882feb5957fa7384b743407809bc5927dabc7cd78dcf651ea94ca8581717019"
        },
