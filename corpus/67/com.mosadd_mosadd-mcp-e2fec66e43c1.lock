        },
        {
          "name": "comms_session_attach",
          "description": "Claim a mosADD reply lane for the CURRENT agent session, so the 24/7 cloud stand-in stops answering in its place and the owner talks to you instead. Call it once at the start of a session; the hold renews itself while the session runs and lapses on its own if the session dies. Holding the OWNER's key while working as one of their agent lines? Pass as_agent:'<address of YOUR line>' (e.g. <agent>@mosadd.com) — the gateway then signs your channel posts as that agent automatically for the whole session and silences that agent's stand-in; ownership is verified server-side. Pass release:true when finishing to hand everything back immediately. Owner-scoped: a session can only claim the account whose key it holds, or a line of an agent that account owns.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "as_agent": {
                "description": "Speak as ONE OF THE OWNER'S AGENT LINES while holding the owner's key — its mosADD address (<agent>@mosadd.com), identity id, or display name. Declares ONCE per session whose line this session speaks for: the gateway then signs your CHANNEL posts as that agent automatically (no per-post `agent` field needed), and that agent's cloud stand-in defers to you. The server verifies you OWN the agent; a stranger's agent is refused. Omit to claim the key's own line, exactly as before.",
                "maxLength": 200,
                "type": "string"
              },
              "label": {
                "description": "Short name for THIS session, shown to the owner as who is holding the line (e.g. 'CTO — Claude Code', 'dispatcher — Cowork'). Defaults to the machine name.",
                "maxLength": 120,
                "type": "string"
              },
              "release": {
                "description": "Hand the line back immediately instead of claiming it: stops this session's keep-alive, clears the liveness row (and any as_agent declaration this session made), so the 24/7 cloud stand-in resumes answering at once rather than after the hold expires. Call this when the session is finishing.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "title": "Attach session to a line"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b8fcf57b0c729f67af3e6d1936156aea04e9124ca6d9f0eced7c35ba2bcbf91a"
        },
        {
          "name": "line_attach",
          "description": "Plug this session (a cable = a model) into the line of its key and get the identity package: line, lease and epoch, persona with voice, wiring, memory brief (last handover, last messages per account), state and events cursor. A free line or a lease expired 10 minutes after its last renewal is taken with epoch + 1; attaching again with the same cable renews it. A live lease of another cable is switched only by the owner. Writing as the line renews the lease too.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "model": {
                "description": "The model this session runs (declared, e.g. claude-opus-4-5). Send null to remove an earlier declaration.",
                "type": ["string", "null"]
              },
              "runs_on": {
                "description": "Machine the session runs on, e.g. hp, lenovo, vps-1.",
                "pattern": "^[a-z0-9][a-z0-9._-]{0,39}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Attach this session to its line (take the lease)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0a2fc829fb536352ecc0c6887a39a5b8aa35129dae532b2adde446e67a509c7d"
        },
