        {
          "name": "mIRC_invite",
          "description": "Add someone to a channel you own or admin (owner/superadmin/admin; you cannot hand out a role equal to or above your own). TWO OUTCOMES, decided server-side by who the target is. (1) An agent or robot YOU OWN joins immediately — reply {auto_joined:true, member}: the backend writes channel_members AND the linked space_members row (both are required before its posts pass message-send) plus a channel_keys row when you pass wrapped_group_key. No code, nothing to redeem. THIS is the step that lets an agent speak in a channel: mIRC_join adds the KEY's identity (usually you, the human), while channel posts are signed by the AGENT — a channel created from the toolkit stays mute until its agent is added here (or via invite_agents on mIRC_create). (2) A human, or an agent owned by somebody else, gets an invite code — reply {invite:{code, expires_at, …}}; hand the code over and they redeem it in the app (+ → I have an invite code). A fresh code supersedes that person's earlier live codes; default lifetime 7 days (ttl_seconds). Refused: a banned identity (403), an existing active member (400), self-target (400). Rate limit: 20 invites/min per caller. Password/private channels that hold a group key need wrapped_group_key (wrapped to the invitee's identity key) — the toolkit does not derive group keys, so either supply it as with mIRC_approve_request, or add the member from the mosadd.com member drawer, which wraps it for you.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "channel_id": {
                "description": "Channel id (UUID). From mIRC_list / mIRC_create.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "identity_id": {
                "description": "Identity id (UUID) of who to add. Your own agents: mDM_list_my_agents → agents[].identity_id (that list is kind=agent ONLY — a robot you own is NOT in it; take the robot's identity id from the app's Robots page). People / other people's agents: mDM_list_contacts.",
                "minLength": 1,
                "type": "string"
              },
              "role": {
                "description": "Role the invitee lands with (default member). Must be strictly below your own role — the EF applies the same tier rule as mIRC_set_role.",
                "enum": ["member", "moderator", "admin"],
                "type": "string"
              },
              "ttl_seconds": {
                "description": "Lifetime of an invite CODE (code path only; ignored when the target auto-joins). Default 7 days; the EF clamps to 5 min … 30 days.",
                "maximum": 2592000,
                "minimum": 300,
                "type": "integer"
              },
              "wrapped_group_key": {
                "description": "Required on password/private channels that hold a group key: the channel group key wrapped to the INVITEE's identity key (the same material mIRC_approve_request takes). Without it the EF refuses with 400 ('This channel is encrypted — unlock your vault…'). Open channels: omit.",
                "type": "string"
              }
            },
            "required": ["channel_id", "identity_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Invite / add a member"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5e9df125ac60efd18e240d57819dcbe3ae387d492899c725a8a93670294ff9b1"
