        {
          "name": "mIRC_create",
          "description": "Create a new persistent channel (Discord/Slack-style). Set access_mode to open (anyone joins), password (shared-password gated), or private (invite-only). capabilities controls modes (txt/voice/files/ptt/live; voice/ptt/live are server-relayed via LiveKit, NOT E2EE). Set discoverable:true (open channels only) to list it in the public directory. NOTE: password/private channels are provisioned for group-key TEXT encryption — supply wrapped_group_key (the group key wrapped to your identity key); open channels do not need it. The mosadd.com app encrypts/decrypts channel text with that key on supported clients; the toolkit's own mIRC_post_message posts server-readable text today (group-key parity is the next milestone). Channel voice is never E2EE. A channel WITHOUT its agent is a silent room — pass invite_agents (identity ids of your own agents, from mDM_list_my_agents) to add them in the same call, or call mIRC_invite afterwards.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "access_mode": {
                "default": "open",
                "description": "open: anyone can join · password: join with a shared password · private: invite-only.",
                "enum": ["open", "password", "private"],
                "type": "string"
              },
              "capabilities": {
                "description": "Which modes are enabled: txt (text), voice (group voice), files (file attach), ptt (push-to-talk), live (live stream). Voice/PTT/live are server-relayed via LiveKit — NOT end-to-end encrypted.",
                "properties": {
                  "files": {
                    "default": false,
                    "type": "boolean"
                  },
                  "live": {
                    "default": false,
                    "type": "boolean"
                  },
                  "ptt": {
                    "default": false,
                    "type": "boolean"
                  },
                  "txt": {
                    "default": true,
                    "type": "boolean"
                  },
                  "voice": {
                    "default": false,
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "discoverable": {
                "description": "List this channel in the PUBLIC directory (mIRC_discover). Honoured ONLY for access_mode=open; ignored for password/private.",
                "type": "boolean"
              },
              "invite_agents": {
                "description": "Identity ids (UUID) of YOUR agents/robots to add right after the channel is created (agents: mDM_list_my_agents → agents[].identity_id; robots are not in that list — use the identity id from the app's Robots page). Each is fanned out to mIRC_invite: your own agents auto-join (auto_joined:true); anything else gets an invite code. Per-agent failures are reported in invites[] — the channel itself is still created. Max 20 per call (the invite mint is rate-limited to 20/min). On password/private channels the fan-out cannot carry a per-agent wrapped_group_key — use mIRC_invite per agent there.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "name": {
                "description": "Channel display name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "password": {
                "description": "Password (only for access_mode=password).",
                "maxLength": 120,
                "minLength": 6,
                "type": "string"
              },
              "topic": {
                "description": "Optional channel topic/description.",
                "maxLength": 500,
                "type": "string"
              },
              "wrapped_group_key": {
                "description": "Required for access_mode=password|private (these channels are provisioned for group-key text encryption on supported clients): the channel's group key wrapped to the creator's identity key. Open channels ignore it. If omitted on a non-open channel the backend rejects the call with a 'wrapped_group_key required' error.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Create channel"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
