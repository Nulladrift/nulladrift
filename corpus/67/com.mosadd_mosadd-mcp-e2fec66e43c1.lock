              },
              "kind": {
                "description": "Channel kind (telegram_bot, gmail …): use the default outgoing account of that kind.",
                "pattern": "^[a-z][a-z0-9_]{1,31}$",
                "type": "string"
              },
              "parse_mode": {
                "description": "Telegram only: formatting of text (and of the caption). A text Telegram cannot parse is refused with telegram_parse_failed, never sent plain.",
                "enum": ["HTML", "MarkdownV2", "Markdown"],
                "type": "string"
              },
              "parts": {
                "description": "Attachments as mot.msg.v1 parts: {type: voice|audio|image|video|file|link, mime, url (https), size, sha256, name?}.",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "react_to": {
                "description": "Telegram only: message_id of a message in this line (incoming or sent); the bot reacts with emoji. Nothing new is sent.",
                "type": "string"
              },
              "reply_to": {
                "description": "message_id from line_inbox: the reply goes out through the same account and thread.",
                "type": "string"
              },
              "silent": {
                "description": "Telegram only: deliver without a notification sound.",
