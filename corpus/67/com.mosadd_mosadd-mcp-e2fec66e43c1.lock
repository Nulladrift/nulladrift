        {
          "name": "mDM_send",
          "description": "Send a direct message via mosadd mDM. Conversations with fleet lines and with the King: ALWAYS in the clear — when either side is an agent line, or you write to yourself, the message goes as plain text (result `encrypted: false, reason: \"fleet_plaintext\"`), exactly like the mosadd app. Only between two PEOPLE is it END-TO-END-ENCRYPTED (X3DH + Double Ratchet; the recipient must have published keys). Pass `to` as the recipient's mosadd identity_id (look it up with mDM_list_contacts). Optional thread_label puts the message in a named thread — mosadd USP: multiple threads per contact, unlike WhatsApp/Telegram.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "reply_to_id": {
                "description": "Optional id of the message being replied to.",
                "type": "string"
              },
              "text": {
                "description": "Message body (UTF-8). Max 64 KB.",
                "maxLength": 64000,
                "minLength": 1,
                "type": "string"
              },
              "thread_label": {
                "description": "Optional thread label. If omitted, uses the default thread for this contact.",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9._-]+$",
                "type": "string"
              },
              "to": {
                "description": "Recipient identity id (UUID). Use mDM_list_contacts first to find the right id. Future versions will accept handle/email/phone directly.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text", "to"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Send DM"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a8a12b9b28da54782d0becf35cf3ca8e7ecc2eba1d1a7fe7a7f145e3d2c6ea9e"
        },
        {
          "name": "mDM_send_as_agent",
          "description": "Send a direct message AS ONE OF YOUR OWN AGENTS instead of as yourself. Use this when you are an agent runtime (Dispatch, Hermes, a CTO agent) connected with your owner's key: without it every message you send appears to come FROM the owner, so the owner has no thread with you. Names the agent by mosADD address, identity id or display name; `to` defaults to the key's owner. Optional `thread_label` selects a named thread (omit = MAIN unlabeled — required for King/SOVEREIGN until rename lands). The server verifies you OWN that agent — speaking as someone else's agent, or as another person, is refused. Recipient must be a person: agent-to-agent DM stays blocked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent": {
                "description": "Which of YOUR agents to speak as — its mosADD address (<agent>@mosadd.com), its identity id, or its display name. Must be an agent you own.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "silent": {
                "description": "Deliver without waking a phone: the message still arrives and shows unread, only the OS push is skipped.",
                "type": "boolean"
              },
              "text": {
                "description": "The message body, as the agent would write it.",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "thread_label": {
                "description": "Optional thread label (same as mDM_send). Omit for the MAIN unlabeled thread — required for SOVEREIGN/King traffic until rename/UI merge (LINEAR-6577). A new label opens a new thread.",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9._-]+$",
                "type": "string"
              },
              "to": {
                "description": "Recipient identity id or mosADD address. Defaults to YOU (the key's owner) — the common case is an agent reporting to its owner. Must be a person, not another agent.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["agent", "text"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Send DM as your agent"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cf0f402c0e12a97f68873158effa05141ea988e34e6d3c9366d5cc7abef4742c"
