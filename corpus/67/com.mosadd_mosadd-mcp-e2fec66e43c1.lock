              },
              "bcc": {
                "items": {
                  "description": "RFC 5321 email address.",
                  "format": "email",
                  "maxLength": 254,
                  "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "body_html": {
                "description": "HTML body. Max 1 MB.",
                "maxLength": 1048576,
                "type": "string"
              },
              "body_text": {
                "description": "Plain text body. Max 1 MB.",
                "maxLength": 1048576,
                "type": "string"
              },
              "cc": {
                "items": {
                  "description": "RFC 5321 email address.",
                  "format": "email",
                  "maxLength": 254,
                  "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "disclose_tracking": {
                "description": "Default false. If true (and tracking on), append a tracking-disclosure footer to the email — recommended for GDPR/ePrivacy compliance.",
                "type": "boolean"
              },
              "force_reader": {
                "description": "Default false. If true, the email body is a stub only and the recipient must open it in mosadd's secure reader — maximizes tracking (print/copy/time-on-read become observable). Best for confidential / legal mail.",
                "type": "boolean"
              },
              "reply_to": {
                "description": "RFC 5321 email address.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "subject": {
                "description": "Email subject line. Max 998 chars (RFC 5322).",
                "maxLength": 998,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "anyOf": [
                  {
                    "description": "RFC 5321 email address.",
                    "format": "email",
                    "maxLength": 254,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  {
                    "items": {
                      "description": "RFC 5321 email address.",
                      "format": "email",
                      "maxLength": 254,
                      "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                      "type": "string"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Recipient(s). Single address or array of up to 50."
              },
              "tracking": {
                "description": "Open-pixel + link-click tracking. Default true. Set false to send with NO tracking (privacy / GDPR-friendly).",
                "type": "boolean"
              },
              "watermark": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "maxLength": 120,
                    "type": "string"
                  }
                ],
                "description": "Inject a faint recipient watermark into the secure reader (shows in screenshots/prints). Pass true to watermark with the recipient address, or a custom string."
              }
            },
            "required": ["subject", "to"],
            "type": "object"
