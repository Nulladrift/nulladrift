        {
          "name": "mRAG_ingest",
          "description": "Add text to the USER'S OWN private knowledge base so mRAG_search can recall it later. Pass content_text (a note, document, transcript, pasted page); it is semantically chunked, embedded (1536-d) and stored in the per-user vector index mRAG_search reads. Returns how many chunks were indexed. ⚠ IF YOU ARE INDEXING A CORPUS you want to TRAVERSE (who is connected to whom, when), also pass sender / recipient / occurred_at: the knowledge graph builds its nodes from those fields alone, so documents ingested without them are searchable but contribute NOTHING to mRAG_graph_overview / _neighbors / _timeline — the graph comes back empty however many documents you loaded. Reuse the same party `ref` across documents to merge them into one node. NOTE: indexed content and metadata are stored server-side in plaintext — NOT covered by the zero-knowledge / E2EE guarantee. Only ingest what the user opted to make searchable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content_text": {
                "description": "Text to index into the user's private knowledge base (a note, document, transcript, pasted page…). Chunked + embedded server-side.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              },
              "direction": {
                "description": "Direction relative to the account owner: received, sent, or the owner's own note.",
                "enum": ["in", "out", "self"],
                "type": "string"
              },
              "labels": {
                "description": "Free-text tags to attach (e.g. a case id, a jurisdiction) for later filtering.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "metadata": {
                "additionalProperties": {},
                "description": "Any extra fields to store alongside the row (case id, docket number, jurisdiction, file path, checksum, sensitivity flag…). Stored verbatim and returned with search hits. NOTE: this is stored server-side in plaintext like the content itself.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "mime": {
                "description": "MIME type of the original file, if known.",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "Original filename, if this came from a file (e.g. 'pozew-2019-03-11.pdf'). Its extension is what classifies the row as a document/image/audio in the file view. Distinct from `title`, which is free prose.",
                "maxLength": 400,
                "type": "string"
              },
              "occurred_at": {
                "description": "ISO-8601 timestamp of WHEN the document happened (letter date, filing date, email Date header) — not when you indexed it. Drives mRAG_graph_timeline; defaults to now if omitted, which makes a 2019 filing look like it happened today.",
                "type": "string"
              },
              "recipient": {
                "description": "Who the document is TO (addressee, court, counterparty). Becomes a node in the knowledge graph, connected to `sender`.",
                "properties": {
                  "kind": {
                    "description": "How to read `ref`: a mosadd identity UUID, an account id, an email address, a phone number, a URL, or a plain name ('unknown').",
                    "enum": ["identity", "account", "email", "phone", "url", "unknown"],
                    "type": "string"
                  },
                  "label": {
                    "anyOf": [
                      {
                        "maxLength": 300,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Human name to display for this party."
                  },
                  "ref": {
                    "description": "The stable key this party is recognised by — identity UUID, email address, phone number, or the party's canonical name. Use the SAME ref for the same party across documents; that is what merges them into one node in the knowledge graph.",
                    "maxLength": 400,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["kind", "ref"],
                "type": "object"
              },
              "sender": {
                "description": "Who the document is FROM (author, filing party, sender). Becomes a node in the knowledge graph — without it this document adds no party to mRAG_graph_overview.",
                "properties": {
                  "kind": {
                    "description": "How to read `ref`: a mosadd identity UUID, an account id, an email address, a phone number, a URL, or a plain name ('unknown').",
                    "enum": ["identity", "account", "email", "phone", "url", "unknown"],
                    "type": "string"
                  },
                  "label": {
                    "anyOf": [
                      {
                        "maxLength": 300,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Human name to display for this party."
                  },
                  "ref": {
                    "description": "The stable key this party is recognised by — identity UUID, email address, phone number, or the party's canonical name. Use the SAME ref for the same party across documents; that is what merges them into one node in the knowledge graph.",
                    "maxLength": 400,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["kind", "ref"],
                "type": "object"
              },
              "size": {
                "description": "Size of the original file in bytes, if known.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "source_id": {
                "description": "Optional stable id for the source so re-ingests of the SAME document group together (and can be removed later with mRAG_delete). Any string works — a file path, a case number, a checksum: a non-UUID is folded into a stable id derived from it, deterministically, and the original is kept as metadata.source_ref.",
                "maxLength": 500,
                "type": "string"
              },
              "source_type": {
                "description": "What kind of source this is. Default 'file' (a document/note). Use 'note' for ad-hoc text.",
                "enum": ["file", "note", "message", "email", "contact", "call"],
                "type": "string"
              },
              "thread_id": {
                "description": "Optional thread id to associate this knowledge with (e.g. a dm:/chat: thread).",
                "type": "string"
              },
              "title": {
                "description": "Optional human title, stored in metadata.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["content_text"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Ingest into memory"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dd88830868ce6aace90bfe19f9351a754f04f21b59554b44cf70a9d48c13fcc0"
        },
