      "tools": [
        {
          "name": "cable_commands",
          "description": "The owner can ask a cable to start a new session, compact its conversation or clear it. Declare which of new_session, compact, clear THIS agent really does (verbs), pick up the commands waiting for you (they come back in commands) and answer the ones you carried out (done). Carry out a command in your own conversation only; clear and new_session never touch the tunnel's MOM memory, vault or mail. Commands expire after 10 minutes. Call it whenever you check in. Only a cable key of the tunnel uses it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "done": {
                "description": "Answers to commands you already carried out.",
                "items": {
                  "properties": {
                    "command_id": {
                      "description": "The command_id you received.",
                      "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                      "type": "string"
                    },
                    "note": {
                      "description": "One short sentence for the owner, e.g. why it failed.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "ok": {
                      "description": "true when you did it, false when you could not.",
                      "type": "boolean"
                    }
                  },
                  "required": ["command_id", "ok"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "verbs": {
                "description": "Declare which of new_session, compact, clear THIS agent really does. Send it on the first call and whenever it changes; an empty list = none. The owner only sees buttons for what you declare.",
                "items": {
                  "enum": ["new_session", "compact", "clear"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Declare and carry out session commands (new session, compact, clear)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e41ccbf717c2bed108a65e71bee2fdea54ba9e42a0dde9cdf14a299fd32aaf07"
        },
        {
          "name": "cable_report_limits",
          "description": "Report a limit reading of the model account of this cable from the owner's machine (get_usage of Claude, rate limits of Codex, a 402 or 429 from the provider), with source and hour. used_pct 100, error_code 402 or monthly_cap mark the account exhausted: its cables go dark on all lines. 429 is a jam, not exhaustion.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "error_code": {
                "description": "402 = the account is empty (its cables go dark on all lines), 429 = a jam (wait and retry, not exhausted), monthly_cap.",
                "enum": ["402", "429", "monthly_cap"],
                "type": "string"
              },
              "exhausted": {
                "description": "The provider says the account is exhausted.",
                "type": "boolean"
              },
              "reset_at": {
                "description": "When the window resets (ISO 8601 UTC).",
                "type": ["string", "null"]
              },
              "source": {
                "description": "Where the reading comes from, e.g. get_usage, codex.rate_limits, provider_402.",
                "type": "string"
              },
              "used_pct": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Used part of the window, 0..100 (100 = exhausted)."
              },
              "window": {
                "description": "Limit window of the model account: 5h, day, week, month or balance.",
                "enum": ["5h", "day", "week", "month", "balance"],
                "type": "string"
              }
            },
            "required": ["source", "window"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report model account limits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:099ec2f6c6c9c6c448c628fec26ed78cdfaba11b264c7b3c32156e2660d41e7f"
        },
        {
          "name": "comms_action_create",
          "description": "Mint a single-use, expiring action link (https://mosadd.com/do/<token>) that asks a human to DO something in their browser, with explicit consent. action_type: 'confirm' (yes/no) | 'file_request' (recipient picks a file from their computer) | 'form' (recipient fills fields you define) | 'open_url' (recipient opens a vetted https URL). Returns { action_id, token, link, expires_at }. Send the `link` to the person via mDM/mIRC/mp0st; they open it, consent, and the browser performs the action in its sandbox (no install, no OS access). The action is owned by you (the calling user). HONEST LIMITS: this is browser-sandbox only — it cannot click other apps, run programs, or read files the user didn't pick; and file_request payloads are not yet end-to-end encrypted (don't request sensitive files until Tier 1.1).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accept": {
                "description": "[file_request] Accepted file types (HTML accept attr, e.g. 'image/*,.pdf').",
                "maxLength": 200,
                "type": "string"
              },
              "action_type": {
                "description": "What you want the recipient to do: 'confirm' (yes/no), 'file_request' (pick a file from their computer), 'form' (fill fields), 'open_url' (open a vetted https URL), 'screen_share' (recipient shares their screen so you can SEE it via comms_action_frame_get — view only).",
                "enum": ["confirm", "file_request", "form", "open_url", "screen_share"],
                "type": "string"
              },
              "creator_label": {
                "description": "How you're identified to the recipient (e.g. your agent name). Default 'Agent'.",
                "maxLength": 80,
                "type": "string"
              },
              "fields": {
                "description": "[form] Fields to collect from the recipient.",
                "items": {
                  "properties": {
                    "label": {
                      "description": "Human label shown to the recipient. Defaults to `name`.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "name": {
                      "description": "Field key — returned verbatim in the result.",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "required": {
                      "description": "Whether the recipient must fill this field.",
                      "type": "boolean"
                    },
                    "type": {
                      "description": "Input type. Default 'text'.",
                      "enum": ["text", "email", "number", "textarea", "tel", "url"],
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "max_bytes": {
                "description": "[file_request] Max file size in bytes (≤ 5 MB). NOTE: the returned file is NOT yet end-to-end encrypted — do not request sensitive files until Tier 1.1 ships.",
                "exclusiveMinimum": 0,
                "maximum": 5242880,
                "type": "integer"
              },
              "max_uses": {
                "description": "How many times the link can be redeemed. Default 1 (single-use).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_width": {
                "description": "[screen_share] Max captured frame width in px (default 1280). Frames are downscaled JPEGs.",
                "exclusiveMinimum": 0,
                "maximum": 1920,
                "type": "integer"
              },
              "message": {
                "description": "What you're asking — shown on the consent screen above the action UI.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "no_label": {
                "description": "[confirm] Negative button label. Default 'Nie'.",
                "maxLength": 40,
                "type": "string"
              },
              "ttl_ms": {
                "description": "Link lifetime in milliseconds. Default 24h, capped at 7d.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "url": {
                "description": "[open_url] The https URL to open. The full URL is shown to the recipient before they open it.",
                "format": "uri",
                "type": "string"
              },
              "yes_label": {
                "description": "[confirm] Affirmative button label. Default 'Tak'.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["action_type", "message"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Create one-click action link"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6782e4792a46e35d90d7bc6efa1ab2608ac79febc0005a6c8cadac775d3a2ffa"
        },
        {
          "name": "comms_action_frame_get",
