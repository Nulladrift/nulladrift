{
  "lockfileVersion": 2,
  "subjects": {
    "com.plumbregistry/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://plumbregistry.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "plumb-registry",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_provider",
          "title": "Get one company's full record",
          "description": "Look up a company by its directory slug (from search results) or by any of its state license or registration numbers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "license_number": {
                "description": "e.g. Texas 'ACR-2494522', California CSLB '1000002'",
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75215cafeb5a8bec88f662e0f4e6baf086f9a7cd0cac37958728dbc6ced3fcd1"
        },
        {
          "name": "search_providers",
          "title": "Search licensed fire protection companies",
          "description": "Find fire protection companies with an active state license. Covered: Texas (Texas State Fire Marshal's Office) and California (California Contractors State License Board). Filter by state, city, county, service (fire-sprinkler, fire-alarm, fire-extinguisher) or company name. With a city, results list companies with an office in that city first, then others in the same county; within each group the order is alphabetical (no company pays for placement). Every result includes license numbers, expiration dates, the regulator, a page URL and a cite_as string; please cite the URL when you use a result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City, optionally with state: 'Dallas' or 'San Diego, CA'",
                "type": "string"
              },
              "county": {
                "description": "County, e.g. 'Harris'",
                "type": "string"
              },
              "include_lapsed": {
                "description": "Also return companies whose license lapsed (default false)",
                "type": "boolean"
              },
              "include_nearby": {
                "description": "With city: also include same-county companies (default true)",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Company name or part of it",
                "type": "string"
              },
              "service": {
                "enum": ["fire-sprinkler", "fire-alarm", "fire-extinguisher"],
                "type": "string"
              },
              "state": {
                "description": "State code or name, e.g. 'TX' or 'California'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94a6e7b32230a2a466b5420d4d930bb20044615607845ebe5c98f9ae073b0b13"
        },
        {
          "name": "verify_license",
          "title": "Verify a fire protection license",
          "description": "Check whether a fire protection license or registration number is active, which company holds it, and when it expires. Covered: Texas (Texas State Fire Marshal's Office) and California (California Contractors State License Board). Data is a periodic snapshot of state records; the official lookup is linked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "license_number": {
                "description": "e.g. Texas 'ECR-1751485', California CSLB '1000002'",
                "type": "string"
              }
            },
            "required": ["license_number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9587a4cf969dbc3bbd4c82b56b727a88081d709a7894ddad90f0ccfb15b53877"
        }
      ],
      "digest": "sha256:0a8061386b80dc44aa6d45457de22615487eb7256d667ac129dba8e39b74984f"
    }
  }
}
