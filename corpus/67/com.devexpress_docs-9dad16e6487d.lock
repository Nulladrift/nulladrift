      "instructions": "DevExpress MCP server provides accurate and up-to-date information about DevExpress products.\n\n## Workflow\n\nUse this workflow to query DevExpress documentation content:\n\n1. Call `devexpress_docs_search(technologies, question)`. The response contains results with valid 'url' fields.\n2. Pick a result and call `devexpress_docs_get_content(url)` with that exact URL to fetch the complete markdown text.\n3. Repeat steps 1 and 2 as needed to gather more information.\n\nIMPORTANT:\n- Always call `devexpress_docs_search` before `devexpress_docs_get_content` to obtain documentation URLs.\n- Never construct URLs using your general knowledge; use documentation URLs from the search response.\n- You can pass multiple technologies to broaden the search, if needed.\n- You must strictly follow the list of allowed technologies: Angular, AspNet, AspNetBootstrap, AspNetCore, AspNetMvc, ASPxThemeBuilder, ASPxThemeDeployer, Blazor, CodedUIExtension, CoreLibraries, Dashboard, DesignSystem, DevExtremeAspNetMvc, eud, eXpressAppFramework, GeneralInformation, jQuery, MAUI, OfficeFileAPI, OfficeFileApiJava, React, ReportServer, SkinEditor, VCL, Vue, WindowsForms, WPF, WpfThemeDesigner, XPO, XpoProfiler, XtraReports.",
      "tools": [
        {
          "name": "devexpress_docs_get_content",
          "title": "Get DevExpress Documentation Content",
          "description": "Get full document content by URL from DevExpress documentation.\nUse this tool to retrieve the complete markdown content of a specific documentation page.\nPREREQUISITE: ALWAYS call `devexpress_docs_search` before using this tool to get valid URLs.\nThe URL parameter must be obtained from the results of the `devexpress_docs_search` tool.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Full URL of a DevExpress documentation article.\nREQUIRED: This URL must be obtained from a previous call to `devexpress_docs_search` tool.\nDo not construct URLs using your general knowledge.\nExample: https://docs.devexpress.com/CoreLibraries/405204",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "devexpress_docs_get_contentArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8fe604a396bf846e1733701fe248a435a60031428354d69ef7a368cc92b08726"
        },
        {
          "name": "devexpress_docs_search",
          "title": "Search DevExpress Documentation",
          "description": "Search DevExpress documentation for a given technology and a question.\nIf you want to search for multiple technologies, pass them as a list.\nThis tool returns only snippets/excerpts; full content requires a follow-up `devexpress_docs_get_content` call on a chosen URL.\nALWAYS call `devexpress_docs_search` before ANY `devexpress_docs_get_content` call in a user request chain.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "Your specific question, phrased in natural language.\nDescribe what you're trying to accomplish and name the relevant controls, APIs, or features.\nThis tool performs semantic search using a text embedding model, so the query must be semantically meaningful.",
                "title": "Question",
                "type": "string"
              },
              "technologies": {
                "description": "List of DevExpress technologies to search within.\nUse specific technology names like 'WindowsForms', 'XtraReports', 'OfficeFileAPI' etc. You must choose from the allowed set.",
                "items": {
                  "enum": ["Angular", "AspNet", "AspNetBootstrap", "AspNetCore", "AspNetMvc", "ASPxThemeBuilder", "ASPxThemeDeployer", "Blazor", "CodedUIExtension", "CoreLibraries", "Dashboard", "DesignSystem", "DevExtremeAspNetMvc", "eud", "eXpressAppFramework", "GeneralInformation", "jQuery", "MAUI", "OfficeFileAPI", "OfficeFileApiJava", "React", "ReportServer", "SkinEditor", "VCL", "Vue", "WindowsForms", "WPF", "WpfThemeDesigner", "XPO", "XpoProfiler", "XtraReports"],
                  "type": "string"
                },
                "minItems": 1,
                "title": "Technologies",
                "type": "array"
              }
            },
            "required": ["question", "technologies"],
            "title": "devexpress_docs_searchArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2e874e22e3f04ed97e99331ec1baaaef246ff00b27b7fedb27cca36c717901da"
        }
      ],
      "prompts": [
        {
          "name": "devexpress_docs_query_workflow",
          "title": "DevExpress Docs Query Workflow",
          "description": "Query DevExpress documentation",
          "arguments": [
