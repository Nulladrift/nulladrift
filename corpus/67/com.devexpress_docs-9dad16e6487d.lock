      "serverInfo": {
        "name": "DevExpress Documentation Search",
        "version": "1.30.0",
        "websiteUrl": "https://docs.devexpress.com/GeneralInformation/405551/help-resources/dev-express-documentation-mcp-server-configure-an-ai-powered-assistant"
      },
      "capabilities": {
        "experimental": {},
