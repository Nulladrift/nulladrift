      "serverInfo": {
        "name": "alalanet-guard",
        "title": "alalanet guard — check before you install",
        "version": "1.5.6",
        "websiteUrl": "https://alalanet.com",
        "icons": [
          {
            "src": "https://alalanet.com/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
