            },
            "required": ["advice", "note", "releases", "sha256"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who signed this skill / MCP package?"
          },
