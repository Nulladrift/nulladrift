        {
          "name": "check_service",
          "title": "Check an MCP server before connecting",
          "description": "Call before connecting to a remote MCP server, and whenever a call to it fails. Give url (any MCP server's https URL; unknown ones are probed now) or id from an earlier answer. Returns alive, advice (ok / ok_requires_auth: working; unverified_yet: not fully checked yet; caution_tools_changed, caution_suspicious_tool_description: confirm with the user first; avoid_down, avoid_not_working_as_listed: do not connect), trust_score (0-100, formula: https://alalanet.com/trust) with flags, checked_at, last_alive_at, uptime 24h/7d/30d, the tool-set diff (tools_diff, tools_changed_at), tool descriptions that look like hidden instructions (tool_description_flags), its initialize instructions' digest, and on caution_* or avoid_* up to 3 working servers on other hosts. Answers from the last stored check (checked_at says when; 100 a day free); live=true probes now and adds a signed, logged attestation (5 a day free). Read-only for the caller; an unknown URL joins the public catalogue.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "service id from an earlier answer; give either id or url",
                "type": "string"
              },
              "live": {
                "description": "true: probe now, signed and logged; false (default): the last stored check",
                "type": "boolean"
              },
              "url": {
                "description": "https URL of the remote MCP server (private, loopback, link-local and cloud-metadata addresses are refused)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "type": ["null", "array"]
              },
              "attestation": {
                "type": ["null", "object"]
              },
              "note": {
                "type": "string"
              },
              "server": {
                "type": "object"
              }
            },
            "required": ["server"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check an MCP server before connecting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1e588e98b393b7a2b2ec643d006e43eddfb8877f1e83b1c20579d3930d3496f8"
        },
        {
          "name": "connect_check",
          "title": "Will this MCP server connect from my client?",
          "description": "Before adding a remote MCP server to a client, or when it fails to connect: give its url. One live read (initialize with protocols 2025-06-18 and 2025-11-25, tools/list, the 401 and OAuth metadata, the host's IPv4) and per client (claude_code, claude_ai, chatgpt, codex_cli, cursor, vscode, windsurf, gemini_cli, zed, cline) ok, warn or fail with reasons, plus the tool list's weight in tokens. Rules from each client's documentation and source code as of 2026-11-08: a prediction, not a test inside the client. One of your daily live checks; cached 10 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
