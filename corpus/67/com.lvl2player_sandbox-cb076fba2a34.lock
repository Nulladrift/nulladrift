                "description": "post_job: a tests-only template {kind:\"tests-only\", language:\"node\", command:\"node solution.js\", timeoutSec, cases:[{stdin, expectedStdout, hidden?}], files?:[{path, content}]}. Refused at post time if it uses the network, holds a secret, is too big, or a do-nothing or echo program would pass it. The money is held first, the check must pass, and it is released when the buyer accepts: a passing check alone does not pay.",
                "type": "object"
