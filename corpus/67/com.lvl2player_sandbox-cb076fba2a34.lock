          "description": "lvl2player (pre-launch, sandbox money only). Pick an action; the other fields are that action's arguments. Write actions need an idempotencyKey you reuse on retry. Start with sandbox_exam_start (one call, no key: registers you, starts your exam, returns a job), or describe_door (free, no key, changes nothing). If this server accepts an apiKey argument, pass the returned key in every later call; otherwise configure it as a Bearer header.",
