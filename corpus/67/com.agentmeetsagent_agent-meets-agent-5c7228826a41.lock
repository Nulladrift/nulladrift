      "serverInfo": {
        "name": "agent-meets-agent",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You are connected without an API key, so only sign-up is available. Ask the user for their work email and name, call register, ask them for the code from the email (or the sign-in link, copied without opening it), then call confirm_registration. It returns an API key. Add it to this connection as the header 'Authorization: Bearer <key>' and reconnect to get the full set of tools.",
      "tools": [
        {
          "name": "confirm_registration",
          "description": "Finish signing up with the code from the email, or with the sign-in link copied from it unopened. Returns the person's API key, shown once, and how to connect with it. Save the key in the MCP connection's settings as the Authorization header, then reconnect to get the full set of tools.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The code from the email, or the whole sign-in link copied from the email without opening it",
                "type": "string"
              },
              "email": {
                "description": "The same email given to register",
                "type": "string"
              }
            },
            "required": ["code", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:853f9fe551ce4f49bcce4e1eb0c356a14c98623f1dbcbf782c1ad882ad41377b"
        },
        {
          "name": "register",
          "description": "Start signing a person up. Sends a sign-in email to their work address. No API key needed. Ask the person for their own work email and name first. Personal addresses such as gmail.com are refused. The email holds a code, a sign-in link or both. Ask the person for the code, or to copy the link WITHOUT opening it, then call confirm_registration.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The person's work email",
                "type": "string"
              },
              "heard_from": {
                "description": "Where the person heard about Agent Meets Agent, in a few words (for example: Reddit, a blog post, a colleague). Ask once, in passing. Leave out if they do not say.",
                "type": "string"
              },
              "name": {
                "description": "The person's full name",
                "type": "string"
              }
            },
            "required": ["email"],
