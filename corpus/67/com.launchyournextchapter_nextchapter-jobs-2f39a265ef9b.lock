{
  "lockfileVersion": 2,
  "subjects": {
    "com.launchyournextchapter/nextchapter-jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://launchyournextchapter.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "nextchapter-jobs",
        "title": "NextChapter jobs, résumé and layoff help",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Career help for professionals, from NextChapter’s own live data: job openings with AI exposure and employer layoff signals, a résumé score with fixes, layoff notices, unemployment benefits by state, programs for laid-off workers, AI exposure by job title and career guides. Each tool says when to call it. Public data only; no model calls.",
      "tools": [
        {
          "name": "ai_exposure_for_job_title",
          "title": "AI exposure for a job title",
          "description": "Call this when someone asks whether their job is safe from AI, which careers are less exposed, or what AI means for a role, for example \"is my job safe from AI\" or \"how exposed are accountants\". Gives how much of a job’s work AI is already used for, from the Anthropic Economic Index, matched from a plain job title. Returns the matched occupation, the exposure share and band, median pay, projected growth, yearly openings, related jobs that pay more or are less exposed, and a link to the full check. It measures observed use now; it is not a forecast of job loss.",
          "inputSchema": {
            "properties": {
              "title": {
                "description": "A job title, e.g. \"marketing manager\" or \"accountant\".",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI exposure for a job title"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da7bfbb587d750eb36fe890abe8355ae123db9d8b1d6546363187c9f2572e167"
        },
        {
          "name": "find_career_guide",
          "title": "Find a career guide",
          "description": "Call this when someone asks how to handle a job loss or job search, for example \"how do I negotiate severance\", \"what do I do first after a layoff\" or \"how do I network\". Finds NextChapter’s plain-language guides on layoffs and job search: severance, unemployment, resumes and ATS, networking, LinkedIn, interviews, career pivots, executive search. Returns the guide title, a short answer and its link.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "The question or topic, e.g. \"how do I negotiate severance\".",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a career guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e883c689d0ce06ef52c01f97b6451a375cfe5f114dfe8c0f4f2201338ddb5d44"
        },
        {
          "name": "laid_off_benefits_and_programs",
          "title": "Aid and retraining programs",
          "description": "Call this when someone who lost a job asks what help, money or programs exist, for example \"what benefits can I get after a layoff\", \"is there money to retrain\" or \"help to relocate for work\". Verified programs that help a laid-off professional: health-coverage and cost relief while out of work, relocation money, retraining and tuition funds, tax credits, and free courses. Returns programs open to anyone in the state plus nationwide ones, each with the amount, who is eligible, status, the official page and the date it was last checked. Only programs checked against their official page are returned; programs restricted to a group or profession are left out. Filter by goal to ask for retraining or relocation funding.",
          "inputSchema": {
            "properties": {
              "goal": {
                "description": "support = help while out of work, move = relocation money, retrain = tuition and training funds, tax = credits and deductions, learn = free courses. Omit for all.",
                "enum": ["support", "move", "retrain", "tax", "learn"],
                "type": "string"
              },
              "limit": {
                "description": "Most programs to return (1 to 25, default 10).",
                "type": "integer"
              },
              "state": {
                "description": "Two-letter U.S. state code. State programs for that state come first, then nationwide programs.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Aid and retraining programs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bb829590dd0447c8cb37b8b93c6ea4d0a00153a31bab2579ad8d96861dea914"
        },
        {
          "name": "recent_layoff_notices",
          "title": "Recent layoff notices",
          "description": "Call this when someone says they were laid off from a company or asks whether a company or state has layoffs. Layoff notices (WARN Act filings) collected from U.S. state labor departments, newest first. Filter by employer, state and days back. Use it to answer \"is [company] laying people off?\" or \"which employers filed layoff notices in [state]?\". Each notice has the employer, place, workers named, filing date, the state record and a NextChapter page to link to. A notice states the number of workers and dates the employer reported; it does not say why. Free to cite under CC BY 4.0 with a link back.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "How many days back to look (1 to 365, default 30).",
                "type": "integer"
              },
              "employer": {
                "description": "Employer name or part of it, e.g. \"Comcast\".",
                "type": "string"
              },
              "limit": {
                "description": "Most notices to return (1 to 100, default 10).",
                "type": "integer"
              },
              "state": {
                "description": "Two-letter U.S. state code, e.g. \"TX\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent layoff notices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc7501295e7f3b4db5d714c8249f4c0c012522edb1c50eea1f451c5d06b8dc23"
        },
        {
          "name": "score_resume",
          "title": "Score a résumé",
          "description": "Call this when someone shares or asks about their résumé, for example \"check my résumé\", \"will this get past applicant tracking systems\" or \"what is wrong with my résumé\". Pass the résumé as plain text. Scores it out of 100 with fixed rules, the same text always gets the same score, and returns a pass, partial or fail for each of eleven checks with what was seen and the exact fix. It checks structure and wording (contact details, length, headings, results with numbers, weak phrases, summary, dates, layout). It cannot judge whether experience suits a role. Use the findings to rewrite the résumé; the text is scored once and not stored.",
          "inputSchema": {
            "properties": {
              "resume_text": {
                "description": "The résumé as plain text, 400 to 20,000 characters.",
                "type": "string"
              }
            },
            "required": ["resume_text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Score a résumé"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:caa11e2b8190981b257e8a8618822caff5d535289040ce8254d93a6ef3ee176e"
        },
        {
          "name": "search_jobs",
          "title": "Search professional jobs",
          "description": "Call this when someone wants job openings, for example \"jobs for a senior finance manager in Denver\", \"remote director roles\" or \"who is hiring after my layoff\". Searches NextChapter’s own deduplicated board of current professional openings at U.S. employers, newest first; hourly, per-diem and internship roles are excluded. Needs no login. Each job returns the title, company, location, posted date, annual pay when listed, level, how much of that occupation’s work AI is already used for, whether the employer has filed layoff notices in the last 12 months, our page for the job and the employer’s own apply link.",
          "inputSchema": {
            "properties": {
              "level": {
                "description": "Seniority: entry, early, mid, senior, manager, director or vp (vp includes executives).",
                "enum": ["entry", "early", "mid", "senior", "manager", "director", "vp"],
                "type": "string"
              },
              "location": {
                "description": "City or state to match, e.g. \"Denver\" or \"TX\".",
                "type": "string"
              },
              "query": {
                "description": "Words to match in the job title or company, e.g. \"director of finance\".",
                "type": "string"
              },
              "remote": {
                "description": "Only remote roles.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search professional jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16fdb7a2ab0222413632178b93f866d5663c83d8935fc31a689696051e0dd8ce"
        },
        {
          "name": "unemployment_benefits_by_state",
          "title": "Unemployment benefits by state",
          "description": "Call this when someone asks about unemployment benefits after a layoff or job loss, for example \"can I get unemployment in Texas\" or \"does severance affect my unemployment\". Unemployment insurance basics for one U.S. state: the state agency and where to file, maximum and minimum weekly benefit, maximum weeks, whether there is a waiting week, how severance and pay in lieu of notice are treated, and the work-search rule. Each fact carries its official source and the date it was checked. ",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "Two-letter U.S. state code, e.g. \"TX\".",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Unemployment benefits by state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b8181ea56bce5a75855a46fd5b2b96b753b0cd6fc752214cfb343b6842a13f5"
        }
      ],
      "digest": "sha256:0e41898e0b4dbe466ceece4ba960540bbc600fb300200b4faf37a9ac77c9355e"
    }
  }
}
