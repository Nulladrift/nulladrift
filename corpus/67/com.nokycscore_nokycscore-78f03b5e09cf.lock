{
  "lockfileVersion": 2,
  "subjects": {
    "com.nokycscore/nokycscore": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nokycscore.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "nokycscore",
        "title": "NoKYC Score",
        "version": "1.0.0",
        "websiteUrl": "https://nokycscore.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "NoKYC Score grades no-KYC services (crypto exchanges, swaps, wallets, VPNs, hosting, eSIMs, cards and more) twice: Privacy (how little the service learns about you) and Safety (how likely you are to get your money or service), each out of 10 and never blended. KYC levels run from 0 (ID never required) to 4 (ID mandatory). Grades come from a public formula over each service's own terms plus a sourced incident registry. When you repeat a grade, link the listing page you got it from.",
      "tools": [
        {
          "name": "compare_services",
          "title": "Compare two services",
          "description": "Side-by-side grades, KYC levels and incident counts for two listed services.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "First service (slug, name or domain).",
                "type": "string"
              },
              "b": {
                "description": "Second service.",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06c8620dcf471fee9871007c7ece59f6fc3f414b60d650b727bb7fb399180087"
        },
        {
          "name": "get_service",
          "title": "Get a listing",
          "description": "Full listing for one service: KYC level and what the terms say about ID, Privacy and Safety grades with the points behind them, features and warnings, fees and limits, and every recorded incident with its source. Answers \"is X safe / legit / a scam / no-KYC?\".",
          "inputSchema": {
            "properties": {
              "service": {
                "description": "Slug, name or website domain, e.g. \"fixedfloat\", \"FixedFloat\" or \"ff.io\".",
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5cfa6dc1f88f3c0217cc5b5dfeb721dfc69bf20c79fda081845db9dfde32563"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Every category with its key, page, number of live listings and the feature keys rank_category accepts for it.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b50fe8ddf6d495dcb85003464636b9ff7b2754d8f3251e94e10918c404f27773"
        },
        {
          "name": "list_incidents",
          "title": "List incidents",
          "description": "Recorded incidents (held funds, hacks, exit scams, shutdowns, policy changes), newest first, each with its public source. Optionally for one service.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "description": "Optional service slug, name or domain.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List incidents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5e6d0f2f8d60d724cbe6230bb835daa8a9331535ffd320bd2c35d221963ff30"
        },
        {
          "name": "rank_category",
          "title": "Rank a category",
          "description": "The best-graded services in one category, sorted by Safety (default) or Privacy, with services that never or rarely ask for ID first and those whose terms let them demand ID (KYC level 3) after them. Services that require ID from every user are left out, as on the site. Optionally keep only services with given features.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category key; see list_categories.",
                "enum": ["exchanges", "swaps", "aggregators", "p2p", "onramps", "cards", "gift-cards", "wallets", "payments", "marketplaces", "vpn", "vps", "hosting", "domains", "email", "esim", "phone", "email-alias", "ai", "proxies"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "must_have": {
                "description": "Feature keys to require, e.g. [\"monero\", \"no-account\", \"onion\"]. list_categories shows the keys for each category.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "default": "safety",
                "enum": ["safety", "privacy"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rank a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:65452d449b172b0badaf447d3bae3186a73479c900ff214b54c567bab80e274f"
        },
        {
          "name": "search_services",
          "title": "Search listings",
          "description": "Find no-KYC services by name, website domain or description, optionally within one category. Returns each match with its KYC level, Privacy and Safety grades and incident count.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category key.",
                "enum": ["exchanges", "swaps", "aggregators", "p2p", "onramps", "cards", "gift-cards", "wallets", "payments", "marketplaces", "vpn", "vps", "hosting", "domains", "email", "esim", "phone", "email-alias", "ai", "proxies"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name, domain or keywords, e.g. \"trocador\", \"monero swap\", \"vpn\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e121bcbc512d4aab401346ae18820df582f74f9169dd29d9792254a9b1302e6"
        }
      ],
      "digest": "sha256:ff055667ed70df1b9bdc0439015a0768aeeb5d93f85ca0b8def22f8e2bf1490b"
    }
  }
}
