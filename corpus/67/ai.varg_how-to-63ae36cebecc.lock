{
  "lockfileVersion": 2,
  "subjects": {
    "ai.varg/how-to": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.varg.ai/how-to"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "varg-how-to",
        "title": "varg how to",
        "version": "1.2.0",
        "websiteUrl": "https://varg.ai/how-to"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "varg how to is a catalog of 2,000+ AI video agent skills, how-to tutorials, FFmpeg recipes, video formats, prompts and styles, ranked for the task (varg.ai/how-to).\n\nBefore you build any video, image, audio or editing pipeline (UGC ad, captions, lyric or music video, talking avatar, product video, explainer, faceless short, edit a video, FFmpeg…), call search_how_to with the person's request in their own words (any language). Then call get_how_to on the best how_to card: it returns the tutorial as Markdown, with the best skills and their install commands, the 2–4 choices to put to the person before spending anything (with example videos), and the steps.\n\nTo generate, connect the varg MCP (https://mcp.varg.ai/mcp, sign in with OAuth) or install the varg-ai skill: one key and one credit balance for every image, video, voice, music and lip-sync model. To list a skill you built on varg how to, use publish_skill on the varg MCP or the form at https://varg.ai/how-to/publish.\n\nAfter a card's advice was used, rate it once with rate_how_to (1–5, did it work: yes / partly / no, one line on why). Your own judgment is welcome; add the person's opinion when they gave one. Ratings tell the catalog which skills really work.",
      "tools": [
        {
          "name": "get_how_to",
          "title": "Read a varg how to page",
          "description": "Read one varg how to card in full as Markdown: a how-to tutorial (best skills with install commands, the options to show the person with example videos, the steps, how it runs on varg) or a skill, component or video type page. Pass the kind and slug from search_how_to.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "The card's kind, exactly as search_how_to returned it (usually how_to).",
                "enum": ["skill", "how_to", "component", "video_type", "prompt", "style", "preset"],
                "type": "string"
              },
              "slug": {
                "description": "The card's slug, exactly as search_how_to returned it, e.g. make-a-lyric-video.",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a varg how to page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b6a488fe64b7f3cc157609f0b3fbb012e3b4b0cc8b3e2a4abb787f0640669210"
        },
        {
          "name": "rate_how_to",
          "title": "Rate a varg how to card",
          "description": "Rate how well a varg how to skill or tutorial worked, 1–5, after it was used: did it work (yes / partly / no) and one line on what was great or wrong. Your own judgment as the agent is welcome; include the person's opinion when they gave one. One rating per caller per card — rating again updates it.",
          "inputSchema": {
            "properties": {
              "comment": {
                "description": "One or two lines: what worked, what broke, what was missing. No personal data.",
                "maxLength": 2000,
                "type": "string"
              },
              "kind": {
                "description": "The card's kind, as search_how_to returned it (skill, how_to…).",
                "enum": ["skill", "how_to", "component", "video_type", "prompt", "style", "preset"],
                "type": "string"
              },
              "model": {
                "description": "The model you generated with, if any (e.g. kling-v3, seedance-2).",
                "maxLength": 80,
                "type": "string"
              },
              "rating": {
                "description": "1 = did not help at all, 5 = worked perfectly.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The card's slug, as search_how_to returned it.",
                "maxLength": 160,
                "type": "string"
              },
              "task": {
                "description": "What you were making with it, in a few words (\"30s UGC ad for a serum\").",
                "maxLength": 300,
                "type": "string"
              },
              "worked": {
                "description": "Did following the card get the result: yes, partly or no.",
                "enum": ["yes", "partly", "no"],
                "type": "string"
              }
            },
            "required": ["kind", "rating", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Rate a varg how to card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:635e42dd730c8b3cd0e7c0c80f4abf4f823b07e41d23bd246c1f59484eea846d"
        },
        {
          "name": "search_how_to",
          "title": "Search varg how to",
          "description": "Find how to make any AI video: searches 2,000+ agent skills, step-by-step how-to tutorials, FFmpeg recipes, video formats, prompts and styles by the task in plain words, in any language (\"ugc ad for my serum\", \"burn captions into a reel\", \"субтитры для рилс\"). Returns ranked cards with a Markdown link to read next. Call it before improvising a video pipeline.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Only these kinds. Default: all but single presets.",
                "items": {
                  "enum": ["skill", "how_to", "component", "video_type", "prompt", "style"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 8,
                "description": "How many cards to return, best first (1–20, default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the person wants, in their words.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search varg how to"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:767b908d2b5cb2675ff7e773bcd13e0bba70b83fea0600bebc83462fa9aa3c51"
        }
      ],
      "digest": "sha256:26079030817f97086ec2ee97efd1dc0b9319affa36a703593c6a287db305d329"
    }
  }
}
