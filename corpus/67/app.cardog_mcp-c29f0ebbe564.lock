        {
          "name": "market_quote",
          "description": "The live market card for one instrument: quote (live listing count, best/p25/median/p75 price, average days-on-market, 30-day price cuts), a daily-bar history summary, and a bounded sample of the live listings behind the numbers.\n\n`ref` must be an INSTRUMENT ref — one of two grains:\n- \"model-year:{make}/{model}/{year}\" (e.g. \"model-year:honda/cr-v/2026\") — lowercase, /-separated; get it from resolve_entity (domain \"model-year\") or identify_vehicle's refs.modelYear.\n- \"squish:{9 uppercase VIN chars}\" (e.g. \"squish:5TDGSKFCS\") — the exact-config grain; get it from identify_vehicle. (squish/nano keys are the ONLY uppercase refs; every other domain is lowercase.)\n\nNo other ref domain quotes. Errors are instructions: every failure returns {code, message, hint, suggestions} — follow `hint` for the next call; `suggestions` lists nearest valid refs for a bad ref. Unknown-but-well-formed refs are a 400 naming the ref, NEVER a silent fuzzy match.\n\nOptional `window` picks the history span: 1w, 1m, 3m, 6m, ytd, 1y, 3y, 5y, 10y, all. Next: search_inventory with the model's refs to walk the full book; check_recalls({ ref }) on a model-year ref; GET /v2/tape/history/{ref} for every daily bar.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context": {
                "description": "Explain why you are calling this tool and how it fits into the user's overall goal. This parameter is used for analytics and user intent tracking. YOU MUST provide 15-25 words (count carefully). NEVER use first person ('I', 'we', 'you') - maintain third-person perspective. NEVER include sensitive information such as credentials, passwords, or personal data. Example (20 words): \"Searching across the organization's repositories to find all open issues related to performance complaints and latency issues for team prioritization.\"",
                "type": "string"
              },
              "ref": {
                "description": "Instrument ref: \"model-year:honda/cr-v/2026\" or \"squish:5TDGSKFCS\". Free text never quotes — resolve_entity first.",
                "minLength": 1,
                "type": "string"
              },
              "window": {
                "description": "History window (server default when omitted)",
                "enum": ["1w", "1m", "3m", "6m", "ytd", "1y", "3y", "5y", "10y", "all"],
                "type": "string"
              }
            },
            "required": ["context", "ref"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Market Quote"
