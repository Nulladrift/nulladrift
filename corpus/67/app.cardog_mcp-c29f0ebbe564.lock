          "digest": "sha256:2fca9ed65ebaaa12e27fb4405cc545eb43a89dc589d0c84993e1250140ab2170"
        },
        {
          "name": "identify_vehicle",
          "description": "Decode a 17-character VIN into its full Cardog identity: canonical entity refs, the market grains (nano/squish), spec highlights, and links to adjacent resources.\n\nVIN ONLY — this tool never fuzzy-matches. If you hold free text (\"2021 Civic\", a make or model name), do NOT call this: call resolve_entity — free text enters the platform in exactly one tool. A non-VIN input returns a redirect hint, not a decode.\n\nA ref is `{domain}:{key}`, lowercase, with `/` separating composite key segments: \"make:tesla\", \"model:mini/hardtop\", \"model-year:honda/cr-v/2026\", \"fuel-type:electric\". (Exception: nano/squish keys are uppercase VIN charset — machine-derived, never typed from text.)\n\nThe result's `refs` block (make/model/modelYear/fuelType/…) contains the join keys for every other tool; a null ref means \"not derivable for this VIN\", never \"unknown ref\". `squish` (WMI+VDS+year) is always derivable and is a valid market_quote instrument; `nano` is the fungible build grain for dedup/comparables. `specHighlights` is a best-effort skim of the spec sheet (horsepower, economy, range, seating…), each value with its unit; a highlight the trims of the model year do not share is absent. The full sheet lives at GET /v2/specs/{refs.modelYear}.\n\nErrors are instructions: every failure returns {code, message, hint, suggestions} — follow `hint` for the next call; `suggestions` lists nearest valid refs for a bad ref. Unknown-but-well-formed refs are a 400 naming the ref, NEVER a silent fuzzy match.\n\nNext: check_recalls({ vin }) — recalls listed for the model year; market_quote({ ref: refs.modelYear ?? squish }); search_inventory({ models: [refs.model] }).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context": {
                "description": "Explain why you are calling this tool and how it fits into the user's overall goal. This parameter is used for analytics and user intent tracking. YOU MUST provide 15-25 words (count carefully). NEVER use first person ('I', 'we', 'you') - maintain third-person perspective. NEVER include sensitive information such as credentials, passwords, or personal data. Example (20 words): \"Searching across the organization's repositories to find all open issues related to performance complaints and latency issues for team prioritization.\"",
                "type": "string"
              },
              "vin": {
                "description": "The 17-character VIN. Free text is NOT accepted here — use resolve_entity for text.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["context", "vin"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Identify Vehicle (VIN Decode)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
