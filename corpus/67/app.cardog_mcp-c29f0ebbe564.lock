          "digest": "sha256:a249636ede52aab9826db00fca05f6d577de6c9f1f3eff409533b5d81e2da6c8"
        },
        {
          "name": "resolve_entity",
          "description": "Turn free text into canonical Cardog entity refs — THE text entry point for every other tool.\n\nA ref is `{domain}:{key}`, lowercase, with `/` separating composite key segments: \"make:tesla\", \"model:mini/hardtop\", \"model-year:honda/cr-v/2026\", \"fuel-type:electric\". (Exception: nano/squish keys are uppercase VIN charset — machine-derived, never typed from text.)\n\nEvery other tool takes refs, never names. Call this FIRST whenever you hold text — \"Civic\", \"2024 Model Y\", a misspelling like \"teslla\" — then reuse the refs for the rest of the session. Returns candidates with confidence, best-first. `best` is the top candidate ONLY when it clears the confidence floor; otherwise it is null and YOU choose from `candidates` (or ask the user) — the API never guesses. Pass `domain` to constrain the search (use domain \"model-year\" when you need a market_quote instrument).\n\nErrors are instructions: every failure returns {code, message, hint, suggestions} — follow `hint` for the next call; `suggestions` lists nearest valid refs for a bad ref. Unknown-but-well-formed refs are a 400 naming the ref, NEVER a silent fuzzy match.\n\nNext steps (also echoed in each result's `next` block): search_inventory with make/model refs; market_quote with a model-year: ref; check_recalls with any make/model/model-year ref; dereference a ref (parents, children, counts) at GET /v2/entities/{ref}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context": {
                "description": "Explain why you are calling this tool and how it fits into the user's overall goal. This parameter is used for analytics and user intent tracking. YOU MUST provide 15-25 words (count carefully). NEVER use first person ('I', 'we', 'you') - maintain third-person perspective. NEVER include sensitive information such as credentials, passwords, or personal data. Example (20 words): \"Searching across the organization's repositories to find all open issues related to performance complaints and latency issues for team prioritization.\"",
                "type": "string"
              },
              "domain": {
                "description": "Constrain candidates to one domain: \"make\", \"model\", \"model-year\", \"body-style\", \"fuel-type\", \"drive-type\", \"transmission\", \"electrification-level\", \"vehicle-type\". Omit to search across domains.",
                "type": "string"
              },
              "limit": {
                "description": "Max candidates (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text to resolve, e.g. \"2021 Civic\", \"teslla\", \"plug-in hybrid\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["context", "query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Resolve Entity"
