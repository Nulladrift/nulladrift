        {
          "name": "carrier_lookup",
          "description": "Find a motor carrier and read its record: name → US DOT number → every unit observed under it. Guide: https://cardog.app/docs/carriers.\n\nPass `q`: a carrier name or part of one (\"bison transport\"), a US DOT number (\"245330\"), or a 17-character VIN (the carriers that unit was observed under). Optional `state` and `country` (two letters) narrow a name match; `limit` caps matches (default 5, max 50).\n\nThe result lists matches, best first, each with `dotNumber`, `legalName`, `dbaName`, `domicile` (city, state, country), `operation` and declared `powerUnits`. When exactly one carrier matches, or `q` was a DOT number, the result also carries `carrier`: the full read with `declared` (what it filed about itself, dated by `filedOn`, self-reported) and `observed` (what roadside inspections and crash reports recorded: distinct units, inspections, crashes, first and last seen). Declared and observed never mix. The carrier's ref is `org:usdot/{dotNumber}`, the `{domain}:{key}` grammar every Cardog ref uses. Pass `vehicles: true` to also return the first page of units observed under that carrier, most recently seen first, each with a link to every carrier it ran under. A DOT number the road record names but the register does not still reads: `legalName` and every `declared` field null, `observed` filled.\n\nCOVERAGE: the US federal register and roadside record: US DOT-regulated carriers, including Canadian and Mexican carriers that cross the border. A fleet that only runs inside one province is absent. Fleet rows are observed associations on dated rows, not a confirmed current fleet and not ownership. COST: the tool chains the calls. The search is 1 credit. When it narrows to one carrier (a DOT number, or exactly one name match) the tool also reads the carrier, 5 more, so that call is 6; with `vehicles: true` it also fetches the first fleet page, 5 more, so up to 11. A name search with several matches is 1.\n\nErrors are instructions: every failure returns {code, message, hint, suggestions} — follow `hint` for the next call; `suggestions` lists nearest valid refs for a bad ref. Unknown-but-well-formed refs are a 400 naming the ref, NEVER a silent fuzzy match.\n\nNext: vehicle_operators({ vin }) for every carrier a unit in the fleet ran under.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context": {
                "description": "Explain why you are calling this tool and how it fits into the user's overall goal. This parameter is used for analytics and user intent tracking. YOU MUST provide 15-25 words (count carefully). NEVER use first person ('I', 'we', 'you') - maintain third-person perspective. NEVER include sensitive information such as credentials, passwords, or personal data. Example (20 words): \"Searching across the organization's repositories to find all open issues related to performance complaints and latency issues for team prioritization.\"",
                "type": "string"
              },
              "country": {
                "description": "US, CA or MX",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Match cap, default 5",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Carrier name, US DOT number, or 17-character VIN",
                "type": "string"
              },
              "state": {
                "description": "State or province, two letters",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "vehicles": {
                "description": "Also return the first page of units under the one matched carrier",
                "type": "boolean"
              }
            },
            "required": ["context", "q"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Carrier Lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:69ad4ad52db71af306a58b73c74e91848582a35c55c7404535b1b7a571ec930d"
        },
        {
          "name": "check_recalls",
          "description": "Recall campaigns LISTED for a vehicle's model year in its market of sale, ref-keyed, one record per authority, never merged. Default market CA: Transport Canada safety recalls and ECCC emissions notices (each row carries `regime`; never call an emissions notice a safety recall). Pass `market` when the user's market is known (US, AU, …), `include_other: true` to see other markets' records (NHTSA for a Canadian car) uncounted, `authority` to pick authorities. This is a possible-recall list, not a VIN-level determination: campaigns match by model year, not by the campaign's VIN range, and Cardog does not see remedy status. Every result carries `applicability: \"listed_for_model_year\"`. When you tell a user about these, say they MAY apply and that the manufacturer's own VIN recall lookup (in Canada) or a dealer confirms; never say \"open\", \"outstanding\" or \"critical\", and never say \"no recalls\" as a clearance. Compliance guide: https://cardog.app/docs/compliance.\n\nPass EXACTLY ONE of:\n- `vin` (17 characters) — resolves the VIN to its model year, then lists that model year's campaigns. In the result, `resolved: false` means the VIN is not bridged into the graph yet; `resolved: true, total: 0` means none are listed for the model year (not that the vehicle is clear).\n- `ref` — an entity ref scoping campaigns: \"make:honda\", \"model:honda/cr-v\", or \"model-year:honda/cr-v/2026\". A ref is `{domain}:{key}`, lowercase, with `/` separating composite key segments: \"make:tesla\", \"model:mini/hardtop\", \"model-year:honda/cr-v/2026\", \"fuel-type:electric\". (Exception: nano/squish keys are uppercase VIN charset — machine-derived, never typed from text.) Get refs from resolve_entity or identify_vehicle — never construct them from guessed names.\n\nEach campaign carries: authority (tc, eccc, nhtsa, au, …), market and regime + campaign number, component, defect/consequence summaries, the corrective action, recall date, units affected, and `affects` — the affected model-years as refs. `asOf` (VIN checks) is when the recall data was last updated, citable.\n\nErrors are instructions: every failure returns {code, message, hint, suggestions} — follow `hint` for the next call; `suggestions` lists nearest valid refs for a bad ref. Unknown-but-well-formed refs are a 400 naming the ref, NEVER a silent fuzzy match.\n\nNext: identify_vehicle({ vin }) for the vehicle's full identity; market_quote({ ref: \"model-year:…\" }); GET /v2/recalls/{recall-ref} for one campaign; GET /v2/recalls/feed for the newest campaigns.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "authority": {
                "description": "Authority codes to pick, e.g. [\"nhtsa\"]. Without `market`, picks across every market.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "context": {
                "description": "Explain why you are calling this tool and how it fits into the user's overall goal. This parameter is used for analytics and user intent tracking. YOU MUST provide 15-25 words (count carefully). NEVER use first person ('I', 'we', 'you') - maintain third-person perspective. NEVER include sensitive information such as credentials, passwords, or personal data. Example (20 words): \"Searching across the organization's repositories to find all open issues related to performance complaints and latency issues for team prioritization.\"",
                "type": "string"
              },
              "include_other": {
                "description": "Also return `otherRecalls`: the records of other markets (e.g. NHTSA for a Canadian car), never counted.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max campaigns for a ref-scoped query (default 25, max 100)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Where the vehicle was sold. Default CA (Transport Canada recalls and ECCC emissions notices). Pass the user's market when known; never guess it from the VIN.",
                "enum": ["CA", "US", "AU", "GB", "JP", "KR", "CN", "IL", "all"],
                "type": "string"
              },
              "ref": {
                "description": "Entity ref scope: \"make:honda\", \"model:honda/cr-v\", or \"model-year:honda/cr-v/2026\". Exclusive with `vin`.",
                "type": "string"
              },
              "regime": {
                "description": "`safety` recalls, `emissions` notices, or `all` (default).",
                "enum": ["safety", "emissions", "all"],
                "type": "string"
              },
              "vin": {
                "description": "17-character VIN — resolved to its model year; campaigns listed for that model year are returned. Exclusive with `ref`.",
                "type": "string"
              }
            },
            "required": ["context"],
            "type": "object"
          },
