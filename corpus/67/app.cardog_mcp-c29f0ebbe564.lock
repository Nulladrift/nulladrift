        {
          "name": "vehicle_operators",
          "description": "Every motor carrier a commercial vehicle was observed running under, from the US federal roadside record. Guide: https://cardog.app/docs/carriers.\n\nPass `vin` (17 characters). The result is one item per day a roadside inspection or crash report put a carrier on the unit, most recent first. Each item has `observedAt`, `source` and `value` (`dotNumber`, and `ref` in the `{domain}:{key}` grammar every Cardog ref uses: `org:usdot/{dotNumber}`). The tool always asks for `detail` (which record it was, an inspection or a crash, and the carrier as it stands on the register: legal name, domicile, declared power units). These are observed associations on dated records, not ownership: a leased unit is run by a carrier that does not own it.\n\nCovers the power unit (tractor or straight truck). A trailer's carriers come from carrier_lookup({ q: vin }). A consumer car returns no items; that is not evidence of anything. Costs 3 credits when there is at least one item, 0 when there is none.\n\nErrors are instructions: every failure returns {code, message, hint, suggestions} — follow `hint` for the next call; `suggestions` lists nearest valid refs for a bad ref. Unknown-but-well-formed refs are a 400 naming the ref, NEVER a silent fuzzy match.\n\nNext: carrier_lookup({ q: \"<dotNumber>\" }) for the carrier and everything else it ran; identify_vehicle({ vin }) for what the unit is.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
