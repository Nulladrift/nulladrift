{
  "lockfileVersion": 2,
  "subjects": {
    "com.miconvert/file-converter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://miconvert.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "miconvert",
        "title": "MiConvert File Converter",
        "version": "1.0.0",
        "websiteUrl": "https://miconvert.com/en/api-docs#mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MiConvert converts files between 145 formats (documents, images, audio, video, 3D/CAD, archives, fonts, ebooks, OFD and more). convert_file needs a publicly downloadable https URL to the file (`file_url`). In ChatGPT, a file the user attached to the chat can be passed as `file` instead. Other clients cannot hand this server a file from the chat or the user's computer: ask the user to share it by link (Google Drive \"Anyone with the link\", Dropbox, OneDrive, a GitHub raw URL, ...), or point them to https://miconvert.com to upload it there. The MiConvert plugin for ChatGPT desktop and Codex (https://miconvert.com/en/chatgpt) also converts local files. Google Drive and Dropbox share links are accepted as they are. When the URL has no file extension, pass `from`. Files up to 50 MB. Download links expire after about 4 hours, so give them to the user as soon as the job completes. Call list_supported_formats when unsure whether a conversion exists.",
      "tools": [
        {
          "name": "convert_file",
          "title": "Convert a file",
          "description": "Convert a file to another format, e.g. OFD→PDF, HEIC→JPG, STEP→STL, WEM→MP3, DOCX→PDF. Give either a public file_url or, in ChatGPT, the attached file as `file`. Downloads the file, converts it, and returns a download link (valid ~4 hours). Most conversions finish within the call; if not, the result has status \"processing\" and a job_id for get_conversion_status. Up to 50 MB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file": {
                "description": "A file the user attached in ChatGPT. ChatGPT fills this in; other clients use file_url.",
                "properties": {
                  "download_url": {
                    "description": "Temporary download URL of the attached file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "ChatGPT file id.",
                    "type": "string"
                  },
                  "file_name": {
                    "description": "Original file name, with extension, if known.",
                    "type": "string"
                  },
                  "mime_type": {
                    "description": "MIME type of the file, if known.",
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "file_url": {
                "description": "Public http(s) URL of the file to convert. Google Drive and Dropbox share links work. Leave out when passing `file`.",
                "type": "string"
              },
              "filename": {
                "description": "Name for the file, with extension, e.g. \"invoice.ofd\". Optional.",
                "type": "string"
              },
              "from": {
                "description": "Source format extension. Only needed when the URL and filename do not end in one.",
                "type": "string"
              },
              "to": {
                "description": "Target format extension, e.g. \"pdf\", \"jpg\", \"stl\", \"mp3\".",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert a file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["file"]
          },
          "digest": "sha256:12ae4ff0318b9720e959e3da5bdba814e45a50d364fd934010af20f5adfee5b8"
        },
        {
          "name": "get_conversion_status",
          "title": "Get conversion status",
          "description": "Check a conversion started by convert_file that was still processing, and get its download links once complete. Waits up to ~25 seconds for the job to finish.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "The job_id returned by convert_file.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get conversion status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fba7afdb9c6a81f97c6e500c3f9b16aed596a63969a0077d0645f067478555a0"
        },
        {
          "name": "list_supported_formats",
          "title": "List supported formats",
          "description": "List the formats MiConvert converts between. With `from`, returns the target formats for that source format; without it, returns every source format. Use it to check that a conversion exists before calling convert_file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Source format extension, e.g. \"ofd\", \"heic\", \"step\". Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List supported formats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:976b9a2cc3120de09a6b1091800199b95e35731768e0d567f23fd605ea425b4c"
        }
      ],
      "digest": "sha256:82761396f1e2ab6230984ca09cdd21ee9f1889d6b5e7c35fdb557d56abb80bf5"
    }
  }
}
