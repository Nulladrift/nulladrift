{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/web-reader": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/reader"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-reader",
        "title": "Faceabot Reader",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Reader: read any public web page as clean text (read_web_page {\"url\":…}) and files of public GitHub repositories (read_github_file {\"repo\":\"owner/name\"}). Free, no key. Pages that need a login cannot be read. PDFs: https://pdf.faceabot.com/mcp. YouTube transcripts: https://youtube.faceabot.com/mcp. Part of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "read_github_file",
          "title": "Read a file from a public GitHub repository",
          "description": "Returns a file from a public GitHub repository (default: its README).\nUse when: you need a project's README, documentation or source file.\nExample: {\"repo\":\"cloudflare/workers-sdk\",\"path\":\"README.md\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_chars": {
                "default": 20000,
                "maximum": 50000,
                "minimum": 500,
                "type": "integer"
              },
              "path": {
                "description": "File path. Default: the README",
                "type": "string"
              },
              "ref": {
                "description": "Branch, tag or commit. Default: the default branch",
                "type": "string"
              },
              "repo": {
                "description": "owner/name, e.g. cloudflare/workers-sdk",
                "examples": ["cloudflare/workers-sdk"],
                "type": "string"
              },
              "start": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["repo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ceb579d671e04fefe9257a7e187c1db8545a783c7566571cf70012bfc36e2f31"
        },
        {
          "name": "read_web_page",
          "title": "Read a web page",
          "description": "Reads a public web page and returns its title and main text as clean plain text (menus, scripts and ads removed), in pages of up to 50,000 characters.\nUse when: you need the content of an article, a documentation page, a blog post or any public page.\nNot for: pages that need a login; PDFs (use the Faceabot PDF tool).\nExample: {\"url\":\"https://example.com\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_chars": {
                "default": 15000,
                "maximum": 50000,
                "minimum": 500,
                "type": "integer"
              },
              "start": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "Public https address of the page",
                "examples": ["https://example.com"],
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9fbc2ba54ad39c1085532f49894d79219dda4da145225c2a7e27d40744957c3b"
        }
      ],
      "digest": "sha256:f4722d17d502427798335d0e627c5e15bd874a12abaeb97c294966eada6f49b4"
    }
  }
}
