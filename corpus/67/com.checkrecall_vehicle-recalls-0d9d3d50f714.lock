{
  "lockfileVersion": 2,
  "subjects": {
    "com.checkrecall/vehicle-recalls": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.checkrecall.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "recallchecker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_vehicle_recalls",
          "title": "Check vehicle safety recalls (NHTSA)",
          "description": "Check U.S. NHTSA safety recall campaigns for a vehicle by make, model, and model year. Returns official NHTSA recall campaigns (component, hazard, remedy, campaign number, official notice link) plus the date the data was fetched. Results are model-year campaign matches, NOT VIN-specific repair status — an empty result means no open recalls were found in NHTSA as of the returned date, which is not a guarantee the vehicle is safe.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "make": {
                "description": "Vehicle make, e.g. Honda, Ford, Toyota",
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Vehicle model, e.g. Civic, F-150, Camry",
                "minLength": 1,
                "type": "string"
              },
              "year": {
                "description": "Four-digit model year, e.g. 2021",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:677c186be1333c6c39a7b939e183f38cb2ed3ef59447fd568744f914eb5dc4fe"
        }
      ],
      "digest": "sha256:ec7739590d0619c7282e8c70fa71687bc2b23546218886a22a38c5bc7fccfaea"
    }
  }
}
