        "name": "jojapi-swift-ai",
        "title": "Swift AI API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of Swift AI on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/swift-ai/pricing · Docs: https://jojapi.com/hub/api/swift-ai",
      "tools": [
        {
          "name": "get_models",
          "title": "List Models",
          "description": "Return a list of available models on this API Group: List Models. Billing per call: Credits: metered (~1 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a2a91a846560368bc0451a27055ea2426ffc2c391682ee04afd1f4f2489722f"
        },
        {
          "name": "post_audio_speech",
          "title": "Create Speech",
          "description": "Generates audio from the input text. Group: Audio. Billing per call: Credits: metered (~187 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body. Example: {\"model\":\"tts-1\",\"input\":\"Today is a wonderful day!\",\"voice\":\"alloy\"}",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:84c4e53d92a3f34032bf6ed5e43b17328adb19b3c5712426a856d6d1d8e6d354"
        },
        {
          "name": "post_chat_completions",
          "title": "Create Chat Completion",
          "description": "Creates a model response for the given chat conversation. Group: OpenAI Endpoints. Billing per call: Credits: metered (~23.29 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body. Example: {\"model\":\"gpt-6.1-sol\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"There are ten birds in a tree. A hunter shoots one. How many are left in the tree?\"}]}",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:969f08ef79f3649d264c037f10f0d4d89eec699ecb1ad0ac85cff905b8b14970"
        },
        {
          "name": "post_embeddings",
          "title": "Create Embeddings",
          "description": "Creates an embedding vector representing the input text. Group: Embeddings. Billing per call: Credits: metered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body. Example: {\"input\":\"Today is a wonderful day\",\"model\":\"text-embedding-3-large\"}",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:617a1de64a78beb368a91806ce02c2c280456f5ca7d10393ad2bc004993de056"
        },
        {
          "name": "post_generateContent",
          "title": "Generate Content",
          "description": "The official Google Gemini API endpoint for generating content using Gemini models. This endpoint supports multimodal inputs, including text, images, audio, video, and documents, depending on the capabilities of the selected model. It also supports conversation history, system instructions, function calling, structured JSON output, safety settings, and configurable generation parameters. Group: Google Endpoints. Billing per call: Credits: metered (~235.33 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body. Example: {\"model\":\"gemini-4-carbon\",\"contents\":[{\"role\":\"user\",\"parts\":[{\"text\":\"There are ten birds in a tree. A hunter shoots one. How many are left in the tree?\"}]}]}",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf67f39246e7286e2bf711d4e64367e053f77c4234ccd9c2a311d13f93163a91"
        },
        {
          "name": "post_messages",
          "title": "Messages",
          "description": "The official Anthropic API endpoint for generating conversational responses using Claude models. This endpoint supports text and multimodal inputs, including images and documents, depending on the capabilities of the selected model. It also supports multi-turn conversations, system instructions, tool use (function calling), extended thinking, prompt caching, structured content blocks, and configurable generation parameters. Group: Anthropic Endpoints. Billing per call: Credits: metered (~1344 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body. Example: {\"model\":\"claude-opus-5-5\",\"messages\":[{\"role\":\"user\",\"content\":\"There are ten birds in a tree. A hunter shoots one. How many are left in the tree?\"}]}",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87b4eedfe5fa83e1e876611d30bef5705b812a2e6f0b2c1ae892fa91fcf83c6d"
        },
        {
          "name": "post_moderations",
          "title": "Create Moderation",
          "description": "Classifies if text is potentially harmful. Group: Moderations. Billing per call: Credits: metered (~0.33 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body. Example: {\"model\":\"omni-moderation-latest\",\"input\":\"Today is a wonderful day to build something people love!\"}",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2fe025146817eec8cda416726ca424bb9dd5662426c730fa4e51d530f6a26450"
        },
        {
          "name": "post_responses",
          "title": "Responses",
          "description": "Creates a model response. Provide text or image inputs to generate text or JSON outputs. Have the model call your own custom code or use built-in tools like web search or file search to use your own data as input for the model’s response. Group: OpenAI Endpoints. Billing per call: Credits: metered (~207 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON request body. Example: {\"model\":\"gpt-6.1-sol\",\"input\":\"There are ten birds in a tree. A hunter shoots one. How many are left in the tree?\"}",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22767fa48411f52b2566bbbf2a4a56744d86b1c82009d82b87cc098451ff1cd1"
        }
      ],
