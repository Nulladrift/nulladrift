        {
          "name": "estimate_campaign",
          "title": "Estimation d'une campagne",
          "description": "Estimates the money of a campaign from its ticket price and the number of tickets expected: gross amount, plan fee, Flex fee beyond the plan caps, payment provider fee, net amount after the value of the prizes, and the cheapest plan. Amounts are integers in minor units (cents) of the pricing currency. The result is an estimate, dated by the prices it uses.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["fr", "en"],
                "type": "string"
              },
              "plan": {
                "pattern": "^[a-z0-9][a-z0-9_-]{0,31}$",
                "type": "string"
              },
              "prizes_value_minor": {
                "maximum": 100000000000,
                "minimum": 0,
                "type": "integer"
              },
              "provider": {
                "pattern": "^[a-z0-9][a-z0-9_-]{0,31}$",
                "type": "string"
              },
              "ticket_price_minor": {
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "integer"
              },
              "tickets_expected": {
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "integer"
              },
              "tickets_per_sale": {
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "integer"
              }
            },
            "required": ["ticket_price_minor", "tickets_expected"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fees": {
                "additionalProperties": false,
                "properties": {
                  "flex": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "payment": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "plan": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["flex", "payment", "plan"],
                "type": "object"
              },
              "gross": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "inputs": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "plan": {
                    "type": ["string", "null"]
                  },
                  "prizes_value_minor": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "provider": {
                    "type": "string"
                  },
                  "ticket_price_minor": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "tickets_expected": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "tickets_per_sale": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["currency", "plan", "prizes_value_minor", "provider", "ticket_price_minor", "tickets_expected", "tickets_per_sale"],
                "type": "object"
              },
              "net": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "notice": {
                "type": "string"
              },
              "plan_suggested": {
                "type": "string"
              },
              "prices_dated": {
                "type": "string"
              }
            },
            "required": ["fees", "gross", "inputs", "net", "notice", "plan_suggested", "prices_dated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
