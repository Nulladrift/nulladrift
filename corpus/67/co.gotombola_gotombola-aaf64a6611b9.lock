        {
          "name": "find_authority",
          "title": "Autorité compétente",
          "description": "Returns the French authority a raffle is filed with for a postcode (the town hall of the commune, or the Préfecture de police for Paris): name, public address, e-mail, phone, website, online form, and the public directory source with the date it was read. When a postcode covers several communes, the commune name selects one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "commune": {
                "description": "Commune name, when the postcode covers several.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language of the notice.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "postcode": {
                "description": "French postcode of the head office, five digits.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "city": {
                        "maxLength": 150,
                        "type": "string"
                      },
                      "line": {
                        "maxLength": 300,
                        "type": "string"
                      },
                      "postcode": {
                        "type": "string"
                      }
                    },
                    "required": ["city", "line", "postcode"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "email": {
                "anyOf": [
                  {
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "form_url": {
                "type": ["string", "null"]
              },
              "kind": {
                "enum": ["commune", "prefecture_police"],
                "type": "string"
              },
              "name": {
                "maxLength": 200,
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "phone": {
                "anyOf": [
                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "read_at": {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  },
                  "url": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["read_at", "url"],
                "type": "object"
              },
              "website": {
                "type": ["string", "null"]
              }
            },
            "required": ["address", "email", "form_url", "kind", "name", "notice", "phone", "source", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:14ff4e29c8e8340da3eac805e6aee940bbdd6b5ff2eca8b4b19822f77a9cd243"
        },
        {
          "name": "get_campaign_figures",
          "title": "Chiffres de la campagne",
          "description": "Returns the aggregated sales figures of one shared campaign: tickets sold, amount collected, and a daily series over the requested number of days. The figures are totals only, with no detail per sale or per buyer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Public campaign code, for example GABC123.",
                "pattern": "^G[A-Z]{3}[0-9]{3}$",
                "type": "string"
              },
              "days": {
                "description": "Length of the daily series, 1 to 90 days.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount_collected": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "as_of": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "series": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "period_start": {
                      "anyOf": [
                        {
                          "format": "date",
                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                          "type": "string"
                        },
                        {
                          "format": "date-time",
                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                          "type": "string"
                        }
                      ]
                    },
                    "tickets": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["amount", "period_start", "tickets"],
                  "type": "object"
                },
                "maxItems": 91,
                "type": "array"
              },
              "tickets_sold": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["amount_collected", "as_of", "currency", "series", "tickets_sold"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["figures:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f927e8ea1760703acc64bcddadac4af081d2e01ef553becd24545378d3db2344"
        },
        {
