            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:29b6f6901f475f68be683ea5ef57677de6d7810cfd982fef1b432e9ad1fc3af8"
