{
  "lockfileVersion": 2,
  "subjects": {
    "com.openmapp/openmapp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.openmapp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "openmapp",
        "title": "OpenMapp",
        "version": "0.1.0",
        "description": "Find US BJJ gyms, drop-ins, and class times.",
        "websiteUrl": "https://www.openmapp.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OpenMapp lists US BJJ gyms with published weekly schedules. dropInFee is the visitor drop-in / day-pass only — never a trial or membership. Unknown stays unknown; do not invent prices or class times. Use list_cities to check coverage, find_gyms for a city, then get_gym for the full week. When citing a gym or class time, include profileUrl and mapUrl so the user can open OpenMapp. Do not construct your own OpenMapp URLs — use the links in the tool response. When a gym has booking (or a class has reserveUrl), it takes reservations through OpenMapp. Once the visitor picks a class, call start_reservation with its day and time to confirm it and get the class's date, price, and a reserveUrl with the class filled in; give the visitor that link and price (0 is free). The visitor must sign the gym's waiver and pay themselves; never sign or submit for them. verificationStatus \"verified\" means OpenMapp checked the timetable against the gym's own scheduleSource (website, instagram, or facebook) on lastVerifiedDate; \"likely\" and \"unknown\" are unverified timetables. gymConfirmedDate is set when the gym itself confirmed its listing.",
      "tools": [
        {
          "name": "find_gyms",
          "title": "Find BJJ gyms",
          "description": "Find BJJ gyms near a US city, neighborhood, or ZIP. Defaults: open to drop-ins, classes today. Returns drop-in policy, visitor fee when known, matching class times, and online booking (reservePrice, reserveUrl) when the gym takes reservations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "day": {
                "description": "Restrict to this weekday or tomorrow. Overrides today",
                "enum": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun", "tomorrow"],
                "type": "string"
              },
              "drop_ins": {
                "description": "Only gyms marked Drop-ins (known welcome or a listed visitor/open-mat price). Default true",
                "type": "boolean"
              },
              "kinds": {
                "description": "Filter to Gi, No-Gi, and/or open mat",
                "items": {
                  "enum": ["gi", "nogi", "openmat"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Max gyms to return. Default 8",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "City, neighborhood, address, or ZIP, same as the OpenMapp search box",
                "minLength": 2,
                "type": "string"
              },
              "today": {
                "description": "Only gyms with a listed class or open mat today. Default true",
                "type": "boolean"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Find BJJ gyms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e69a96ccf6a7529580a522ecedd8fc420247ebd3d18745c7ffbea79997e306ab"
        },
        {
          "name": "get_gym",
          "title": "Get gym details",
          "description": "Full public gym card: address, drop-in policy, visitor fee, the weekly timetable, and online booking when the gym takes reservations (price and reserveUrl per class). Use an id or slug from find_gyms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Gym id or slug from find_gyms, e.g. 10th-planet-allentown",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get gym details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:839d99c6033dfa695e5c316937ef27aba8867ce3bc6dfd0ffd4256002612dca1"
        },
        {
          "name": "list_cities",
          "title": "List covered cities",
          "description": "US cities OpenMapp covers, with gym counts, how many welcome class drop-ins, and how many list an open mat. Use this to check coverage before find_gyms. Filter by city name or two-letter state.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max cities to return. Default all matching, max 500",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Filter by city name, e.g. Austin",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state, e.g. TX",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "List covered cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:667b56b6ae6b56701957426462f5917bc5fe1b0157874903d3578acce9fa8908"
        },
        {
          "name": "map_url",
          "title": "OpenMapp map link",
          "description": "OpenMapp map link for a city search, optionally with a gym drawer already open.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "gym_id": {
                "description": "Gym id from find_gyms to open the details drawer",
                "type": "string"
              },
              "q": {
                "description": "City or search text for the map search box",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "OpenMapp map link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0ad43a150b3b730600db1051e208b080dcdfea1beee709d0fb47356ebe5518be"
        },
        {
          "name": "start_reservation",
          "title": "Start a drop-in reservation",
          "description": "Check that a class at a gym can be reserved online right now and get the link where the visitor signs the gym's waiver and pays (or reserves free). Returns the class's next date and start time, price, cancellation policy, and reserveUrl. It does not book anything: the visitor must open reserveUrl and sign and pay themselves. When status is unavailable, reason says why and reservableClasses lists classes that can be reserved instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD within the next 7 days, on the class's weekday. Default: the next time the class runs",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "day": {
                "description": "Weekday of the class, as listed in sessions",
                "enum": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                "type": "string"
              },
              "id": {
                "description": "Gym id or slug from find_gyms or get_gym",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Class name from sessions. Needed only when the gym lists two classes at the same day and time",
                "type": "string"
              },
              "time": {
                "description": "Class start time as listed in sessions, e.g. \"6:30 PM\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["day", "id", "time"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Start a drop-in reservation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:93f0d5de1c88aa3765d0a9f498459622940f50813fdc55a4f0a9c2034ad2b1db"
        }
      ],
      "digest": "sha256:5feb880c8456a64745984913544a2471bffa1da9cbd6b9a9d478b6a06ab243b2"
    }
  }
}
