{
  "lockfileVersion": 2,
  "subjects": {
    "com.mudko/onramperx": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://router.mudko.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "onramperx-mcp",
        "title": "OnRamperX Value Router MCP Server",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OnRamperX is a non-custodial value router (fiat <-> crypto) for humans and AI agents. Typical flow: get_route_quote(source, destination, constraints) returns ranked, non-custodial paths across every eligible rail with reasoning. For a crypto->crypto swap, create_swap returns a Relay deposit address (headless, no signing) or an on-chain intent. For a US card->USDC onramp, create_onramp_session returns an Apple/Google Pay link that a HUMAN must tap (fiat legs cannot be programmatically triggered) — the platform notifies a human. provision_wallet returns a gasless CDP Embedded Wallet address on Base. check_swap reconciles a Relay request + app-fee collection. The platform never holds funds mid-flow; settlement centers on USDC on Base.",
      "tools": [
        {
          "name": "check_swap",
          "title": "Check a swap + fee collection",
          "description": "Use this to check a Relay swap's status by requestId and confirm app-fee collection (appFees vs paidAppFees).",
          "inputSchema": {
            "properties": {
              "requestId": {
                "type": "string"
              }
            },
            "required": ["requestId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f7e39dcd70a131da9388fbe0d93de6052cd48a1c69a6eab2535a46a228f9e44d"
        },
        {
          "name": "create_onramp_session",
          "title": "Create a US card onramp session (HITL)",
          "description": "Use this when a US user wants to buy USDC on Base with a card / Apple Pay / Google Pay. Returns a payment link a HUMAN must physically tap (fiat legs cannot be programmatically triggered); a human is notified. US-only guest checkout, <= $500/week.",
          "inputSchema": {
            "properties": {
              "amountUsd": {
                "type": "number"
              },
              "destinationAddress": {
                "type": "string"
              },
              "geo": {
                "type": "string"
              }
            },
            "required": ["amountUsd", "destinationAddress"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf17a6036fd66edb81c5f275c86a333e280905a1f212b707e1765cafcd6d762b"
        },
        {
          "name": "create_swap",
          "title": "Create a crypto swap (Relay)",
          "description": "Use this to swap any token on any chain into USDC on Base via Relay. Returns a headless deposit address (no signing) or an on-chain intent. App fees accrue on swaps.",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "string"
              },
              "fromChain": {
                "type": "string"
              },
              "fromToken": {
                "type": "string"
              },
              "humanPresent": {
                "type": "boolean"
              },
              "recipient": {
                "type": "string"
              },
              "toChain": {
                "type": "string"
              }
            },
            "required": ["amount", "fromChain", "fromToken", "recipient"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6711d96fe33489b913d200b7144ec060371759bc40be2c44be089bf82258e92a"
        },
        {
          "name": "get_route_quote",
          "title": "Get a ranked value-routing quote",
          "description": "Use this when a human or agent wants the best non-custodial way to move value between fiat and crypto (or crypto to crypto). Returns ranked rails with fees, ETA, KYC burden, limits, and reasoning.",
          "inputSchema": {
            "properties": {
              "amountUsd": {
                "type": "number"
              },
              "destination": {
                "type": "object"
              },
              "geo": {
                "type": "string"
              },
              "humanPresent": {
                "type": "boolean"
              },
              "kycTolerance": {
                "enum": ["none", "guest", "light", "full"],
                "type": "string"
              },
              "source": {
                "type": "object"
              },
              "speed": {
                "enum": ["cheapest", "fastest", "balanced"],
                "type": "string"
              }
            },
            "required": ["amountUsd", "destination", "source"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ef011071120f35635942cf4e3c7be1434e0cf644316394a42cd36d1bf6e9ad50"
        },
        {
          "name": "provision_wallet",
          "title": "Provision a gasless Base wallet",
          "description": "Use this to create a gasless, non-custodial CDP Embedded Wallet address on Base (TEE keys, user-exportable) to receive routed value.",
          "inputSchema": {
            "properties": {
              "owner": {
                "type": "string"
              }
            },
            "required": ["owner"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5f399c9a5166cc6adf930b9a1dfb2d412ac8275747ea2fbb720c06b0410fd9e"
        }
      ],
      "digest": "sha256:9267a0528e61b106ec05370e58d3cf6cc844b21686ea44cb24fed441af6acd3d"
    }
  }
}
