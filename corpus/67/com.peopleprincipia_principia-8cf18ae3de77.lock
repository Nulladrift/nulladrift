          "description": "Retrieve the full causal chain from a construct, condition, or problem to interventions, with evidence grades at each hop. problem_id accepts pf.* addresses from the problemframe-2026-v1 frozen registry (cert d0770859) and resolves construct mappings via the MF-711 pf→construct join (landed 2026-09-11); an address with no join coverage yet resolves the problem frame with an honestly empty linked_constructs[], not an error. condition_id accepts bicycle-guide's minted cond_<slug> ConditionFrame ids and resolves via the PRN-281 crosswalk (landed 2026-09-11); a condition with no construct match yet resolves honestly empty the same way. All three entry points are fully resolved today — no path is gated.",
