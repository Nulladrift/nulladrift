        {
          "name": "principia.interventions.search",
          "description": "Search Intervention rows by composite filter (`construct_id` — matches when `targets_constructs[]` includes the id; `problem_id` — a ProblemFrame pf.* address, resolved via the MF-711 pf→construct join to one or more construct ids and then matched the same way as `construct_id`; `modality` — matches when `delivery_modality[]` includes the modality; `cost_band` — exact match on `typical_cost_band`; `family` — an InterventionFrame L1 family slug). All filters AND together; any subset is valid. Each match carries a computed `frame` block. `view: \"families\"` adds `families[]` (every L1 family with its definition and the frame nodes under it) and `unplaced[]` (address exceptions). Read-only (curator-policy D4).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "construct_id": {
                "type": "string"
              },
              "cost_band": {
                "enum": ["low", "medium", "high", "enterprise"],
                "type": "string"
              },
              "family": {
                "type": "string"
