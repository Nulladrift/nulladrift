        {
          "name": "get_buyers_guide",
          "title": "Get buyer's guide",
          "description": "Find the Man of Many buyer's guide for a product type and return its ranked picks.\n\n    Use when someone asks \"what's the best X\" (dive watch, running shoe, espresso machine,\n    cologne, whisky). Returns the best-matching guide with each pick's name, price as\n    published, a short verdict and the retailer link exactly as it appears in the article,\n    plus other related guides.\n    ",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "The product type to find a buyer's guide for, e.g. \"dive watches\", \"white sneakers\", \"beard trimmer\", \"espresso machine\". Use a product category: bare brand names usually match no guide, so use search_articles for brands.",
                "title": "Topic",
                "type": "string"
              }
            },
            "required": ["topic"],
            "title": "get_buyers_guideArguments",
            "type": "object"
          },
