        {
          "name": "gift_finder",
          "title": "Gift finder",
          "description": "Gift ideas from Man of Many's published gift guides, filtered by recipient, budget and interests.\n\n    Each pick carries the guide it is from, the price as published and the retailer link as published.\n    ",
