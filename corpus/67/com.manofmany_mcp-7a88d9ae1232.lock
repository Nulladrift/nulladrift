      "instructions": "Man of Many is Australia's leading men's lifestyle publisher (watches, style, grooming, cars, drinks, tech, travel, gifts). Use these tools to answer with Man of Many's own published verdicts and buyer's guides. Always cite the article title and link the URL exactly as returned with each result (keep its query string), and credit 'Man of Many'. Results are excerpts: send readers to the article for the full story. Prices are as published and may have changed; product links are the retailer links as they appear in the article.",
      "tools": [
        {
          "name": "deals",
          "title": "Deals",
          "description": "Current sales, discount codes and Man of Many's deal roundups (Black Friday, Cyber Monday, Christmas).\n\n    Use when someone asks about sales, deals, discount codes or where to buy for less. Returns Man of\n    Many's recent deal articles plus live offers and coupon codes from its Australian retail partners.\n\n    Args:\n        query: optional product or retailer, e.g. \"headphones\", \"Apple\", \"The Iconic\".\n        limit: number of articles, 1 to 15 (default 10).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query"
              }
            },
            "title": "dealsArguments",
            "type": "object"
          },
