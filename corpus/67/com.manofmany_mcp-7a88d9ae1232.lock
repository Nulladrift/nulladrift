        {
          "name": "mci_report_search",
          "title": "Male Confidence Index: search the report",
          "description": "Search the Male Confidence Index 2025 research report for passages on a topic, with page numbers.\n\n    Returns the report's own findings and interpretation as short excerpts, plus any matching key\n    figures (generational percentages read from the report's charts). Passages list survey_questions:\n    pass those ids to mci_results for the full weighted answers or other cuts.\n    ",
          "inputSchema": {
            "properties": {
              "chapter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional chapter to search within: a number 1 to 7, or words from a section or chapter title, e.g. \"Opportunities\". Omit to search the whole report.",
                "title": "Chapter"
              },
              "limit": {
                "default": 4,
                "description": "Number of passages to return, 1 to 6. Default 4.",
                "maximum": 6,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "Topic to find in the report, e.g. \"midlife confidence\", \"social media and Gen Z\", \"fatherhood\", \"asking for help\".",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "mci_report_searchArguments",
            "type": "object"
          },
