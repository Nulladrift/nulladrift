        {
          "name": "mci_results",
          "title": "Male Confidence Index: results",
          "description": "Weighted results for one Male Confidence Index 2025 question, optionally split by a demographic.\n\n    Returns weighted percentages (single choice and multi-select) or weighted means (numeric), with the\n    unweighted n for each cell. Cells under 30 respondents return suppressed: true.\n\n    Args:\n        question_id: e.g. \"Q15\", \"Q11\" (multi-select group), \"F9\", \"D9\". See mci_questions.\n        by: optional split, e.g. \"age_group\", \"state\", \"income\", \"gender\", \"employment\", or any single-choice id.\n        gender: optional \"men\", \"women\" or \"all\" (default: whoever answered the question).\n        filter: optional {variable: value} to restrict the base, e.g. {\"age_group\": \"18-28\"} or\n            {\"S2_age\": \"30-39\"}; use \"a|b\" for several values.\n    ",
          "inputSchema": {
            "properties": {
              "by": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "By"
