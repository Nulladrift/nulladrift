                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "recipient": {
                "description": "Who the gift is for, e.g. \"dad\", \"boyfriend\", \"groomsmen\", \"coffee lover\".",
