        {
          "name": "mci_results",
          "title": "Male Confidence Index: results",
          "description": "Weighted results for one Male Confidence Index 2025 question, optionally split by a demographic.\n\n    Returns weighted percentages (single choice and multi-select) or weighted means (numeric), with the\n    unweighted n for each cell. Cells under 30 respondents return suppressed: true.\n    ",
          "inputSchema": {
            "properties": {
              "by": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional demographic to split results by: \"age_group\", \"state\", \"income\", \"gender\", \"employment\", or any single-choice question id. Omit for the overall result only.",
                "title": "By"
              },
              "filter": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional {variable: value} map restricting the base, e.g. {\"age_group\": \"18-28\"} or {\"S2_age\": \"30-39\"}. Use \"a|b\" in a value to match several.",
                "title": "Filter"
              },
              "gender": {
                "anyOf": [
                  {
                    "enum": ["men", "women", "all"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional base: \"men\", \"women\" or \"all\". Default: whoever was asked the question.",
                "title": "Gender"
              },
              "question_id": {
                "description": "Survey question id from mci_questions, e.g. \"Q15\", \"Q11\" (a multi-select group), \"F9\", \"D9\". Q* = asked of men, F* = women, S*/D* = everyone.",
                "title": "Question Id",
                "type": "string"
              }
            },
            "required": ["question_id"],
            "title": "mci_resultsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
