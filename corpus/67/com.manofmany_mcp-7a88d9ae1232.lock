        {
          "name": "mci_report_search",
          "title": "Male Confidence Index: search the report",
          "description": "Search the Male Confidence Index 2025 research report for passages on a topic, with page numbers.\n\n    Returns the report's own findings and interpretation as short excerpts, plus any matching key\n    figures (generational percentages read from the report's charts). Passages list survey_questions:\n    pass those ids to mci_results for the full weighted answers or other cuts.\n\n    Args:\n        query: topic, e.g. \"midlife confidence\", \"social media and Gen Z\", \"fatherhood\", \"asking for help\".\n        chapter: optional chapter number (1 to 7) or words from a section/chapter title, e.g. \"Opportunities\".\n        limit: passages to return, 1 to 6 (default 4).\n    ",
          "inputSchema": {
            "properties": {
              "chapter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
