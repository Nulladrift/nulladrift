        {
          "name": "mci_rows",
          "title": "Male Confidence Index: respondent rows",
          "description": "Anonymised respondent-level rows from the Male Confidence Index 2025, for your own analysis.\n\n    Each row has row_id, the requested columns and Weight (always use it). Page with offset and\n    next_offset. Rows are anonymised (no identifiers, shuffled, free text redacted) and carry only gender,\n    age band and state as demographics (Tasmania, ACT and NT grouped; small groups withheld). For splits\n    by other demographics use mci_results or mci_scores.\n    ",
          "inputSchema": {
            "properties": {
              "columns": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Variable ids or question groups to include, e.g. [\"S1\", \"age_group\", \"Q11\", \"Male_Confidence_Index\"]. Default: gender, age band, state, index and domain scores. Demographics other than gender, age band and state (exact age, region, education, employment, household, housing, sexuality, income) are not available at row level: use mci_results for those.",
                "title": "Columns"
              },
              "filter": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional {variable: value} map restricting rows, e.g. {\"gender\": \"Male\", \"state\": \"Victoria\"}. Filters on gender, age band, state or any survey answer; a filter matching fewer than 30 respondents is refused.",
                "title": "Filter"
              },
              "labels": {
                "default": true,
                "description": "True returns answer labels (default). False returns numeric codes, which are smaller; decode them with mci_questions.",
                "title": "Labels",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "Rows per page, 1 to 200. Default 50. Pages are capped at about 60kB.",
                "maximum": 200,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Index of the first row to return, for paging. Pass the previous page's next_offset. Default 0.",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              }
            },
            "title": "mci_rowsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
