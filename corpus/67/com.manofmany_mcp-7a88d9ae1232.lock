        {
          "name": "get_article",
          "title": "Get article summary",
          "description": "Get the summary of one Man of Many article: standfirst, outline and key picks.\n\n    Returns the article's headline, author, dates, standfirst, section outline and (for\n    buyer's guides) the ranked picks. Never the full text: link readers to the url.\n    ",
          "inputSchema": {
            "properties": {
              "url_or_slug": {
                "description": "A full manofmany.com article URL, or just its slug (the last path segment), e.g. \"https://manofmany.com/watches/dive-watches\" or \"dive-watches\". Use a url returned by search_articles.",
                "title": "Url Or Slug",
                "type": "string"
              }
            },
            "required": ["url_or_slug"],
            "title": "get_articleArguments",
            "type": "object"
