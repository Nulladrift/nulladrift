        {
          "name": "mci_rows",
          "title": "Male Confidence Index: respondent rows",
          "description": "Anonymised respondent-level rows from the Male Confidence Index 2025, for your own analysis.\n\n    Each row has row_id, the requested columns and Weight (always use it). Page with offset and\n    next_offset. Rows are anonymised (no identifiers, shuffled, free text redacted).\n\n    Args:\n        columns: variable ids or question groups, e.g. [\"S1\", \"age_group\", \"Q11\", \"Male_Confidence_Index\"].\n            Default: gender, age, state, index and domain scores.\n        filter: optional {variable: value}, e.g. {\"gender\": \"Male\", \"state\": \"Victoria\"}.\n        offset: start row (default 0).\n        limit: rows per page, 1 to 200 (default 50); pages are capped at about 60kB.\n        labels: true for answer labels (default), false for numeric codes (smaller; see mci_questions).\n    ",
