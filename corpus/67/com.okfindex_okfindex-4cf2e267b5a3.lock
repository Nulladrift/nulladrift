        {
          "name": "submit_bundles",
          "title": "Submit bundles",
          "description": "Queue bundle root URLs served by a host you own. IndexNow rules: the key file at https://<host>/<key>.txt has to match, the answer is 202, and nothing of yours is read before the collector checks that file. No account, no payment: ownership is proved by a key file on the host, exactly as IndexNow does it. Host `https://<host>/<key>.txt` containing the key (or point `keyLocation` at another path on the SAME host), then send the bundle URLs. We answer **202**: the key has not been checked yet. Verification and reading happen on our collector, never at the edge — so nothing is published, and no URL of yours is fetched, before the key matches. Re-sending a URL is how you say the bundle changed; it goes back in line to be re-read. At most 100 URLs per request and 200 per host per UTC day. Bundles in public GitHub repositories need no ping: the sweep finds them.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "The domain that serves the bundles and the key file.",
                "type": "string"
              },
              "key": {
                "description": "The IndexNow key: 8 to 128 characters of [a-zA-Z0-9-].",
                "type": "string"
              },
              "keyLocation": {
                "description": "Alternative location of the key file, on the SAME host. Default: `https://<host>/<key>.txt`.",
                "type": "string"
              },
              "urlList": {
                "description": "The bundle roots (`index.md` files): https, on `host`, ending in .md — any path, since the spec fixes none.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["host", "key", "urlList"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Submit bundles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
