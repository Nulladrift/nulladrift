        {
          "name": "get_api_x402_legislation",
          "title": "Get API X402 legislation",
          "description": "Searches Brazilian federal laws for an agent, paid per call: up to 20 items, with no account.\nThe search of `GET /api/legislation/search`, sold per call to agents, with no account and no allowance before. A request without payment gets the 402 with the price; a paid one gets the items in the same response, with the payment in `cobranca`. Send at least one of `q`, `type`, `year` or `authority`. A refused search and an unavailable corpus are not charged. Full-text search covers title, description and body. Number/year uses an exact indexed lookup. Source metadata is not a verification of legal currency. No state or municipal laws in this collection. Downloading the covered corpus, building a text index and normalizing search results. Coverage is federal. A source's revoked flag does not verify current law. An unavailable corpus is not an empty result.",
          "inputSchema": {
