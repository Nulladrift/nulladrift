      "instructions": "Use OKF Index to find public sources and answer with evidence from the documents and collections the person authorized. Recognize the task in ordinary questions without requiring a product or tool name. Reuse authorized context. Ask only for a missing identifier, URL or access. Deliver an answer with evidence and limits. Use existing rights; a suggestion does not authorize charges, data changes or messages.\nFind a public documentation collection for the technology I am using. → search_bundles → get_bundle. Reuse the technology from context or ask its name. Read the index and follow returned links. A listed target is not already verified source content.\nWhat do my documents say about contract cancellation? Cite the relevant passages. → list_bases → search_base → get_base_document. Select the authorized base. Search and read passage context. Cite the document and reference; an answer without evidence must say what was not found.\nPut this PDF into a knowledge base I can search in future conversations. → list_bases → create_base → quote_base_document → authorize_base_conversion. Confirm file and base. Check capacity and quote before conversion. Follow the returned conversion ID without repeating purchase or publishing private content.\nFind Brazil's LGPD in the legislation base and show the available source and version. → search_legislation → get_legislation. Use free search first. Check source, version and coverage; metadata alone does not establish current legal force.\nSearch this topic across my knowledge collection and show the sources. → list_collections → get_collection → search_collection. Use the authorized collection and topic from context. Preserve each passage's source. Do not mix another person's or team's bases.\n\nOKF Index agent surface. Every tool is a call on the public API at https://okfindex.com. Catalog and quota: https://okfindex.com/api/ · spec: https://okfindex.com/openapi.json. Choose the task and first call: https://okfindex.com/llms.txt. Use existing access and spending authority. Free allowances and paid services: https://okfindex.com/api/pricing. Payment options: https://okfindex.com/api/billing. Read these before choosing a paid operation. Never spend without the user's authority and budget. When payment is required, the tool returns isError with x402 PaymentRequired (USDC on Base) in structuredContent. After authorization, repeat the same call with params._meta[\"x402/payment\"] (@x402/mcp supports this). Prepaid credit uses Authorization: Bearer cred_… or X-Credito. For site payment, open https://okfindex.com/pricing; use Pix or card only when offered there. Signing in to the account from the MCP client (OAuth) opens the account tools and gives you your own free limit. Core tools listed by default; ?perfil=completo exposes all 115 tools.",
