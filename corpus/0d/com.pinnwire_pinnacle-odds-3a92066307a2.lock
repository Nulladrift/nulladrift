          },
          "digest": "sha256:2ed88027804e537be40ed4cddce2c3dfa9f0114675479f9a826ae8906900bb4f"
        },
        {
          "name": "get_prematch_odds",
          "description": "Current prematch (pregame / upcoming-match) Pinnacle odds for one sport — sharp lines for handicapping, expected-value screens and model features. Same shape as get_live_odds. Callers can store snapshots for their own line-history or closing-line-value analysis; this is not a historical opening/closing-odds archive.",
          "inputSchema": {
            "properties": {
              "include_specials": {
                "description": "Also include currently published props & specials",
                "type": "boolean"
              },
              "max_events": {
                "description": "Max events returned. Default 25, max 100",
                "type": "integer"
              },
              "sport_id": {
                "description": "Sport identifier: 1 Soccer, 2 Tennis, 3 Basketball, 4 Hockey, 5 Football, 6 Baseball, 7 Rugby, 8 MMA, 9 Boxing, 10 Volleyball/Handball, 11 Esports, 12 Golf, 13 Cricket. Call list_sports when unknown.",
                "type": "integer"
              }
            },
            "required": ["sport_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
