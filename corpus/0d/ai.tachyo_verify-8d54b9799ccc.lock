{
  "lockfileVersion": 2,
  "subjects": {
    "ai.tachyo/verify": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://auth.xbarry.ai/api/mcp/verify"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tachyo-wallet-verify",
        "version": "1.30.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "request_verification_challenge",
          "description": "Step 1 of wallet verification: get a fresh challenge for the user to sign.\n\n    chain: \"evm\" or \"solana\". Pass agent_id (your marketplace identity) so the proof is bound to you.\n    Present `challenge` to the user, have their wallet sign it (EVM personal_sign / Solana signMessage),\n    then call verify_wallet_ownership with the returned `nonce` + signature. The challenge is single-use\n    and expires (~10 min). Returns {challenge, nonce, expires_at}.\n    ",
          "inputSchema": {
            "properties": {
              "address": {
                "title": "Address",
                "type": "string"
              },
              "agent_id": {
                "default": "",
                "title": "Agent Id",
                "type": "string"
              },
              "chain": {
                "default": "evm",
                "title": "Chain",
                "type": "string"
              }
            },
            "required": ["address"],
            "title": "request_verification_challengeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:741a7fd1d9d8ffc0b6dd99586f83213fac0960feb08896fd0790e2005115ba0b"
        },
        {
          "name": "verify_wallet_ownership",
          "description": "Step 2 of wallet verification: prove control by signing the challenge from step 1.\n\n    chain: \"evm\" (secp256k1, 0x-hex signature) or \"solana\" (ed25519, base58/base64/hex). `nonce` is\n    from request_verification_challenge; the signature must be over that exact challenge text. Pass the\n    same agent_id you requested the challenge with — on success the wallet is linked to you and you get a\n    session_token to pass to Tachyo's other agents (e.g. check_token_safety) to unlock connected/premium\n    tiers. Returns {verified, address, chain, linked, session_token?, session_expires?}. Does not move\n    funds or expose keys.\n    ",
          "inputSchema": {
            "properties": {
              "address": {
                "title": "Address",
                "type": "string"
              },
              "agent_id": {
                "default": "",
                "title": "Agent Id",
                "type": "string"
              },
              "chain": {
                "default": "evm",
                "title": "Chain",
                "type": "string"
              },
              "nonce": {
                "title": "Nonce",
                "type": "string"
              },
              "signature": {
                "title": "Signature",
                "type": "string"
              }
            },
            "required": ["address", "nonce", "signature"],
            "title": "verify_wallet_ownershipArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d011e75a1d7cdfd095e1660b603a5541062065adcf9b5d7de128df41dcd41730"
        }
      ],
      "digest": "sha256:e1158d61b1c0e4a9257425736db9ca9bd19b9839a6acf479fcef353307738723"
    }
  }
}
