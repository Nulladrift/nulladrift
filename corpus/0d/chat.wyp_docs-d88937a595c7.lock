{
  "lockfileVersion": 2,
  "subjects": {
    "chat.wyp/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://wyp.chat/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "chat.wyp/docs",
        "title": "WYP.chat documentation",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only documentation of WYP.chat, team messaging software for WhatsApp and other channels (publisher: WYP.agency, Barcelona): the in-app help centre, the guides (WhatsApp rules, consent, prices), the glossary, the pages on industries (how each trade uses it) and the pages on channels (WhatsApp, Instagram, Messenger, Telegram, email, website chat), in French, Spanish and English. Competitor comparisons are not included. No account is needed and no customer workspace or personal data is reachable. Use search_docs first, then get_doc_page with the url of a result; list_doc_pages browses by type and language.",
      "tools": [
        {
          "name": "get_doc_page",
          "title": "Read a WYP.chat documentation page",
          "description": "Returns the Markdown of one documentation page, as published at its .md address. Pass the url from search_docs or list_doc_pages (https://wyp.chat/... with or without .md, or just the path). With lang, returns the same page in that language when it exists. Long pages are cut: continue with offset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Return the same page in this language (optional).",
                "enum": ["fr", "es", "en"],
                "type": "string"
              },
              "max_chars": {
                "default": 30000,
                "description": "Largest part to return.",
                "maximum": 60000,
                "minimum": 1000,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Character to start from, to read a long page in parts.",
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "Address of a page, for example https://wyp.chat/aide/premiers-pas or /aide/premiers-pas.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f5a9c1cecf8e4950904010009430083dffc76478c76463f59d72d272d537bf9"
        },
        {
          "name": "list_doc_pages",
          "title": "List the WYP.chat documentation pages",
          "description": "Lists documentation pages by type (help, guides, glossary, industries, channels) and language (fr, es, en), in a stable order, with title, url and a one-sentence description. Both filters are optional; use offset to page through long lists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the pages.",
                "enum": ["fr", "es", "en"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Page size (1 to 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of pages to skip.",
                "minimum": 0,
                "type": "integer"
              },
              "type": {
                "description": "help (app help centre), guides, glossary, industries or channels.",
                "enum": ["help", "guides", "glossary", "industries", "channels"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3934a35f87d7802b68130f7baaa974e9bb9179bbc09d89df205af1f46a6cc013"
        },
        {
          "name": "search_docs",
          "title": "Search the WYP.chat documentation",
          "description": "Free-text search in the WYP.chat help centre, guides, glossary, industry pages and channel pages (French, Spanish, English). Returns the best matching pages with title, canonical url, Markdown url, type, language, last update and an excerpt. Read a result with get_doc_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Only pages in this language (optional).",
                "enum": ["fr", "es", "en"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of results (1 to 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, in any of the three languages.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Only this kind of page: help (app help centre), guides, glossary, industries (pages by trade) or channels (WhatsApp, Instagram, Messenger, Telegram, email, website chat) (optional).",
                "enum": ["help", "guides", "glossary", "industries", "channels"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62b4d543b67ad3eaf8413998a958cca960304b938675ebdeff8c6938080fba88"
        }
      ],
      "digest": "sha256:1c5ddf92f91d94f64265ffd1b6a4166cf193c65c8d1a55025f26ae7f2420c128"
    }
  }
}
