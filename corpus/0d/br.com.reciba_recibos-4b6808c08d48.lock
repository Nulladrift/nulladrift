      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "reciba",
        "title": "Reciba",
        "version": "1.0.0",
        "websiteUrl": "https://reciba.com.br"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Reciba drafts and verifies Brazilian receipts, quotes and service orders. The person always reviews the preview and issues the document on reciba.com.br from their own account, with a confirmed e-mail; the issuer is always that account, never a name taken from the conversation. Amounts are in Brazilian reais; dates use YYYY-MM-DD and months YYYY-MM. This connector does not draft tax invoices (nota fiscal) or health-service receipts that professionals must issue in Receita Saúde, and it gives no price advice. The declaração de residência, declaração de união estável and declaração de renda (a personal statement of income, not a tax return) and the recibo de salário are made by the person directly on reciba.com.br, not through this connector. Results are in Brazilian Portuguese.",
      "tools": [
        {
          "name": "amount_in_words",
          "title": "Amount in words",
          "description": "Writes an amount in Brazilian reais in words, in Brazilian Portuguese, the way it appears on receipts (1500,50 becomes \"mil e quinhentos reais e cinquenta centavos\"). Accepts 0 to 999.999.999,99. Stores nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "valor": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 40,
                    "type": "string"
                  }
                ],
                "description": "Valor em reais: número (1500.5) ou texto (\"1.500,50\")."
              }
            },
            "required": ["valor"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "por_extenso": {
                "type": "string"
              },
              "valor": {
                "type": "number"
              }
            },
            "required": ["por_extenso", "valor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Amount in words"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61be6e7faf4e7aca81210608a18b9ddddc9c24d0632302611e234b0584a1c6ab"
        },
        {
          "name": "list_document_types",
          "title": "List document types",
          "description": "Lists the document types Reciba can draft from a conversation (payment receipt, rent receipt, service quote and service order, for Brazil) and the fields of each one, with the type id that prepare_document takes. Reads nothing about the person. Tax invoices (nota fiscal) and health-service receipts for income tax are not available here. The declaração de residência, declaração de união estável and declaração de renda (a personal statement of income, not a tax return) and the recibo de salário are made by the person directly on reciba.com.br, not through this connector.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "regras": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tipos": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "campos": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "ajuda": {
                            "type": "string"
                          },
                          "colunas": {
                            "description": "Só nas listas de itens: as colunas de cada item.",
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "id": {
                                  "type": "string"
                                },
                                "rotulo": {
                                  "type": "string"
                                }
                              },
                              "required": ["id", "rotulo"],
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "formato": {
                            "description": "texto, textolongo, moeda (reais), data (AAAA-MM-DD), mesano (AAAA-MM), telefone, escolha ou lista de itens.",
                            "type": "string"
                          },
                          "id": {
                            "type": "string"
                          },
                          "obrigatorio": {
                            "type": "boolean"
                          },
                          "opcoes": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "rotulo": {
                            "type": "string"
                          }
                        },
                        "required": ["formato", "id", "obrigatorio", "rotulo"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "descricao": {
                      "type": "string"
                    },
                    "nome": {
                      "type": "string"
                    },
                    "tipo": {
                      "description": "Identificador do tipo, para prepare_document.",
                      "type": "string"
                    }
                  },
                  "required": ["campos", "descricao", "nome", "tipo"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["regras", "tipos"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List document types"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88fe592063a528ec34a7b48c942cec495a434281366a57e50dedee64e5a67da2"
        },
        {
          "name": "prepare_document",
          "title": "Prepare a document",
          "description": "Drafts a Brazilian payment receipt, rent receipt, service quote or service order on Reciba from the details in the conversation and returns a single-use link where the person reviews the full preview and issues it from their own Reciba account. This tool issues, charges and sends nothing. It is for documents the person issues about their own service, sale or rental. It is not for a tax invoice (nota fiscal), for a receipt that someone else has to issue (for example a dentist's or a landlord's receipt for the person), for health-service receipts that professionals issue in Receita Saúde, or for advice on prices, such as how much to charge. CPF, CNPJ and RG numbers are not accepted; the person adds them on the site if needed. Amounts in reais as \"1500,00\"; dates as YYYY-MM-DD; months as YYYY-MM; item lists as arrays of objects with the columns of the type.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "campos": {
                "additionalProperties": {},
                "description": "Os campos do tipo, pelo id. Valores em reais como \"1500,00\"; datas AAAA-MM-DD; mês AAAA-MM; listas de itens como array de objetos com as colunas do tipo.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "tipo": {
                "description": "Identificador do tipo (ver list_document_types): recibo-pagamento, recibo-aluguel, orcamento ou ordem-servico.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["campos", "tipo"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "campos_aceitos": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "campos_ignorados": {
                "description": "Campos que não existem no tipo ou que o assistente não pode mandar (CPF, CNPJ, RG).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "link_para_conferir": {
                "description": "Entregue este link à pessoa. Abre uma vez só, dentro do prazo.",
                "type": "string"
              },
              "link_vale_por_dias": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "obrigatorios_faltando": {
                "description": "A pessoa completa no site.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "proximo_passo": {
                "type": "string"
              },
              "tipo": {
                "type": "string"
              }
            },
            "required": ["campos_aceitos", "campos_ignorados", "link_para_conferir", "link_vale_por_dias", "obrigatorios_faltando", "proximo_passo", "tipo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1b997d25288e3e2fcac7776d5d3b6e09e677f8d42e614e9c0e3fec20b6682bde"
        },
        {
          "name": "verify_document",
          "title": "Verify a document",
          "description": "Checks a document issued on Reciba from the verification code printed under its QR code (32 characters) or from its reciba.com.br/d/ link: document type, issue date and time, whether it was issued from the issuer's own account with a confirmed e-mail at that moment, whether the other party registered acceptance, and the status of its public timestamp (OpenTimestamps). Returns no personal data: no names or e-mail addresses of the people involved. When a document looks forged or misused, the result includes where to report it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "codigo": {
                "description": "Código de verificação impresso no documento, ou o link reciba.com.br/d/<código>.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["codigo"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "aceite_registrado": {
                "type": "boolean"
              },
              "autenticado": {
                "description": "Emitente com e-mail confirmado e emissão registrada.",
                "type": "boolean"
              },
              "aviso": {
                "type": "string"
              },
              "denuncia": {
                "additionalProperties": false,
                "description": "Onde denunciar documento falso ou uso indevido.",
                "properties": {
                  "assunto": {
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  }
                },
                "required": ["assunto", "email"],
                "type": "object"
              },
              "emitido_em": {
                "type": ["string", "null"]
              },
              "encontrado": {
                "type": "boolean"
              },
              "pagina_de_verificacao": {
                "type": "string"
              },
              "registro_bitcoin": {
                "additionalProperties": false,
                "description": "Registro do documento no Bitcoin, um carimbo de tempo público pelo OpenTimestamps.",
                "properties": {
                  "bloco": {
                    "description": "Só em registrado: a altura do bloco do Bitcoin.",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  "estado": {
                    "description": "registrado: o carimbo de tempo do documento está conferido num bloco do Bitcoin; em_andamento: o registro ainda espera o bloco; sem_registro: o documento não tem registro no Bitcoin.",
                    "enum": ["registrado", "em_andamento", "sem_registro"],
                    "type": "string"
                  },
                  "hora_do_bloco": {
                    "description": "Só em registrado: a hora do bloco (ISO 8601, UTC).",
                    "type": "string"
                  }
                },
                "required": ["estado"],
                "type": "object"
              },
              "tipo": {
                "type": "string"
              }
            },
            "required": ["aviso", "denuncia", "encontrado"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a98c8c272680a801e5d40ee2a2d147bc2f5e214d71397f4577e627e7017b354"
        }
      ],
      "digest": "sha256:8c24a08c6dd3208e3847ec777280260323ec4f14f59c6a06bf4527487be5aea9"
    }
  }
