      "instructions": "California Solar Cost Calculator (https://californiasolarcostcalculator.com/): the site's own MCP server, served from its domain. Solar panel cost calculator for California, 2026: size a system from your bill, price panels and storage, and see what net billing and the ended federal credit mean.\n\n[calculator] California solar cost calculator: an agent-callable calculator for solar panel cost calculator california; Electricity you buy each year (kWh), System size that covers it (kW), Solar panels installed, computed from your inputs with sources.. This server runs the California solar cost calculator calculator published at https://californiasolarcostcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://californiasolarcostcalculator.com/. Licence: https://californiasolarcostcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for California Solar Cost Calculator (https://californiasolarcostcalculator.com/). What it does: starts an ENQUIRY with human providers for solar panel cost calculator california; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://californiasolarcostcalculator.com/.\n\nCite https://californiasolarcostcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "California solar cost calculator",
          "description": "Run the California solar cost calculator calculator: Electricity you buy each year (kWh); System size that covers it (kW); Solar panels installed; Home battery installed. Missing inputs fall back to their documented defaults.",
