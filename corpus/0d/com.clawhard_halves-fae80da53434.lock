      "serverInfo": {
        "name": "com.clawhard/halves",
        "title": "Halves",
        "version": "1.1.0",
        "description": "Halves splits group costs. Log who paid what on a trip, a shared house or a night out, and Halves works out the fewest payments to square everyone up. One link for the group, any currency, no sign-up.",
        "websiteUrl": "https://halves.clawhard.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Halves: Halves splits group costs. Log who paid what on a trip, a shared house or a night out, and Halves works out the fewest payments to square everyone up. One link for the group, any currency, no sign-up. Use it when you need to split shared costs and settle up in the fewest payments. Tools: halves_settle_up (Work out who owes whom in the fewest payments); halves_create_group_link (Create a shared expense group link). Results include a link (open_url) that the user can open to see the same result on the website. Share the group link with the user and tell them anyone with the link can add expenses.",
      "tools": [
        {
          "name": "halves_create_group_link",
          "title": "Create a shared expense group link",
          "description": "Use when the user wants a shared place for a group (trip, flat, event) to keep adding expenses and see who owes whom, not just a one-time calculation. Creates a group and returns a link anyone can open without signing up to add and edit expenses. Anyone with the link can edit it, so share it only with the group. Each call creates a new saved group; halves_settle_up gives a one-off answer without saving anything. Example: {\"name\": \"Lisbon trip\", \"currency\": \"EUR\", \"people\": [\"Ana\", \"Ben\", \"Cy\"]}.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Main currency, default USD.",
                "type": "string"
              },
              "expenses": {
                "description": "Optional starting expenses (up to 50), same shape as the settle tool.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "description": "Group name, e.g. \"Lisbon trip\".",
                "type": "string"
              },
              "people": {
                "description": "Names (2 to 40).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a shared expense group link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/halves/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/halves/result"
          },
          "digest": "sha256:f338d535fe926c10e4e05f4a96bdb279bc865f72cfcdbc12cb6ab529de3af538"
        },
        {
          "name": "halves_settle_up",
          "title": "Work out who owes whom in the fewest payments",
          "description": "Use when the user shares a trip, dinner, household or group expense list and asks who owes whom, how to split costs, or how to settle up. Returns each person's paid, share and net balance, and the smallest set of payments that squares everyone up. Handles equal splits, splits among a subset, exact amounts and payments already made, with correct rounding. Nothing is saved. Example: {\"people\": [\"Ana\", \"Ben\", \"Cy\"], \"expenses\": [{\"what\": \"Dinner\", \"amount\": 90, \"paid_by\": \"Ana\"}, {\"what\": \"Taxi\", \"amount\": 24, \"paid_by\": \"Ben\", \"split_between\": [\"Ben\", \"Cy\"]}]}. Amounts are exact to the cent.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "ISO currency code, default USD.",
                "type": "string"
              },
              "expenses": {
                "description": "What was paid.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Total in normal units, e.g. 45.50",
                      "type": "number"
                    },
                    "exact": {
                      "additionalProperties": {
                        "type": "number"
                      },
                      "description": "Optional exact amount per person (must add up to amount). Overrides split_between.",
                      "type": "object"
                    },
                    "paid_by": {
                      "type": "string"
                    },
                    "split_between": {
                      "description": "Who shared it. Default: everyone, equally.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "what": {
                      "type": "string"
                    }
                  },
                  "required": ["amount", "paid_by"],
                  "type": "object"
                },
                "type": "array"
              },
              "payments": {
                "description": "Payments already made between people to settle up.",
                "items": {
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "from": {
                      "type": "string"
                    },
                    "to": {
                      "type": "string"
                    }
                  },
                  "required": ["amount", "from", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "people": {
                "description": "Names of everyone in the group (2 to 40, unique).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["expenses", "people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Work out who owes whom in the fewest payments"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
