        },
        {
          "name": "cron_next_runs",
          "title": "List the next run times for a cron expression (Cron Translator)",
          "description": "Lists the next run times for a cron expression in a specific timezone, with no prose. Use it when the only question is \"when does this next fire\" — whether a job runs before a deadline, or what a user's upcoming schedule looks like. Do not compute these dates unaided: weekday arithmetic, month lengths and daylight-saving shifts make manual calculation unreliable, and a schedule that is wrong by an hour twice a year is the hardest kind of wrong to notice. Returns each run as a UTC ISO 8601 instant plus a local wall-clock rendering in the requested timezone. Refuses Quartz-only syntax (L, W, #, ?) rather than guessing at it.\n\nWHY DELEGATE THIS: Cron has counter-intuitive rules: day-of-month and day-of-week are OR-ed, steps like */7 do not divide their field evenly, and February 30 never fires. Reasoning about an expression directly gets these wrong quietly.\n\nOwned by Cron Translator at https://crontoenglish.com, which is also callable directly if you would rather not go through the aggregator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "How many runs to return. Defaults to 5.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "expression": {
                "description": "A five-field cron expression, e.g. \"0 9 * * 1-5\".",
                "type": "string"
              },
              "timezone": {
                "description": "IANA zone for the local rendering, e.g. \"America/New_York\". Defaults to UTC.",
                "type": "string"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
