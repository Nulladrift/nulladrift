        {
          "name": "body_metrics",
          "title": "BMI, calories, and protein with error bounds (Body Metrics)",
          "description": "Compute BMI, energy expenditure, and protein targets from height and weight. Height and weight MUST carry units — a bare number is REFUSED rather than guessed, because a unit mix-up produces a plausible-looking answer that is badly wrong. Returns every standard BMR formula plus the spread between them, because the spread IS the precision of the estimate. Do not relay a single calorie figure as though it were exact. Not medical advice, and the response says so in its payload.\n\nWHY DELEGATE THIS: Two failure modes at once. A bare number is ambiguous — \"170\" is a height in centimetres or a weight in pounds — and a wrong unit yields a plausible BMI that is off by a factor of two. And the standard energy formulas disagree by hundreds of calories, so any single figure is false precision.\n\nOwned by Body Metrics at https://body-metrics.gumballtools.com, which is also callable directly if you would rather not go through the aggregator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "activity": {
                "description": "The largest source of error. Most people overestimate; take the lower band.",
                "enum": ["sedentary", "light", "moderate", "active", "extreme"],
                "type": "string"
              },
              "age": {
                "description": "Years, 15-100.",
                "type": "number"
              },
              "bodyFatPercent": {
                "description": "Adds the Katch-McArdle estimate.",
                "type": "number"
              },
              "height": {
                "description": "WITH a unit: 178cm, 1.78m, 5'10\", 70in. Bare numbers refused.",
                "type": "string"
              },
              "sex": {
                "description": "The BMR equations are fitted separately.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "targetBmi": {
                "type": "number"
              },
              "weight": {
                "description": "WITH a unit: 75kg, 165lb, 11st 8lb. Bare numbers refused.",
                "type": "string"
              }
            },
            "required": ["age", "height", "sex", "weight"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
