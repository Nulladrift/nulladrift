        {
          "name": "validate_csv",
          "title": "Validate CSV (Payload Validator)",
          "description": "Validates CSV against RFC 4180 and reports ragged rows individually with both field counts, because \"row 4813 has 6 fields, the header has 5\" is the entire answer. A ragged row loads without complaint almost everywhere — pandas pads or throws by engine, Excel shifts the columns, split(\",\") mis-assigns every field after the extra one — so nobody notices until a figure is wrong. Sniffs the delimiter from the header ignoring quoted regions, and always reports it, because a semicolon-separated European export read as comma-separated yields one column and no error. Also unterminated quotes, duplicate and unnamed and space-padded column names, mixed line endings, and a byte order mark that makes the first column impossible to look up by name.\n\nWHY DELEGATE THIS: Syntax errors are the easy half. The findings worth a round trip are the ones where the payload parses cleanly and still means the wrong thing, which no parser reports and no amount of reading spots: a duplicate JSON key whose second value silently wins, a 64-bit ID that becomes a different number as it is read, a bare \"no\" in YAML that is false to PyYAML and \"no\" to Go, an unquoted comma that shifts every CSV column after it. Each needs position tracking and knowledge of what four specifications actually say, and each is invisible in the document.\n\nOwned by Payload Validator at https://payload-validator.gumballtools.com, which is also callable directly if you would rather not go through the aggregator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "delimiter": {
                "description": "Field delimiter, one character. Omit to sniff it from the header.",
                "maxLength": 1,
                "minLength": 1,
                "type": "string"
              },
              "hasHeader": {
                "description": "Whether the first row names the columns. Default true. False compares rows against the first row and skips header checks.",
                "type": "boolean"
