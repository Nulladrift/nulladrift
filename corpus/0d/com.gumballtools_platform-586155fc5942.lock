        {
          "name": "offside",
          "title": "Work an offside call through IFAB Law 11 or NHL Rule 83 (Sports Rules)",
          "description": "Returns a verdict plus every step taken. THREE verdicts, not two: offside, onside, and no-offside-offence — the last is real and common, because in soccer an offside POSITION is not an offence without involvement in active play. Soccer: hands and arms never count (boundary at the bottom of the armpit), there is no offence direct from a throw-in, goal kick or corner, and a DELIBERATE play by an opponent resets it while a deflection does not. Hockey: skates decide it, not the stick, and since 2021 a skate in the air above the blue line is onside — but NOT when tagging up on a delayed offside. Not an official ruling.\n\nWHY DELEGATE THIS: The two sports use the same word for structurally opposite rules and are routinely conflated. Soccer excludes hands and arms and treats an offside position as no offence without involvement; hockey judges skates against the blue-line plane, where since 2021 a skate in the air is onside — except when tagging up.\n\nOwned by Sports Rules at https://sports-rules.gumballtools.com, which is also callable directly if you would rather not go through the aggregator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attacker": {
                "description": "SOCCER. Position along the attacking axis; larger is nearer the opponents' goal.",
                "type": "number"
              },
              "ball": {
                "description": "SOCCER. Same scale.",
                "type": "number"
              },
              "involvement": {
                "description": "SOCCER. REQUIRED once the player is in an offside position; the call errors without it.",
                "enum": ["none", "interfering-with-play", "interfering-with-opponent", "gaining-advantage"],
                "type": "string"
              },
              "rearSkate": {
                "description": "HOCKEY. Trailing skate in cm from the blue line leading edge; negative is behind.",
                "type": "number"
              },
              "restart": {
                "description": "SOCCER. No offence direct from throw-in, goal-kick, or corner-kick.",
                "enum": ["open-play", "throw-in", "goal-kick", "corner-kick", "free-kick", "kick-off", "drop-ball"],
                "type": "string"
              },
              "secondLastDefender": {
                "description": "SOCCER. The SECOND-last opponent. Level is onside.",
                "type": "number"
              },
              "situation": {
                "enum": ["zone-entry", "tag-up"],
                "type": "string"
              },
              "skateOnIce": {
                "description": "HOCKEY. Irrelevant on a zone entry since 2021; decisive when tagging up.",
                "type": "boolean"
              },
              "sport": {
