          },
          "digest": "sha256:6a5eb21a0fcf592b3eba5b3c1ad2c05b3306d04834a1cb2d9e7efabc16be9cf4"
        },
        {
          "name": "due_date",
          "title": "Due date and gestational age, with ACOG redating applied (Due Date)",
          "description": "Estimate a due date from a last menstrual period, a known conception date, an IVF transfer, or an ultrasound measurement. Gestational age is counted from the LAST PERIOD, not conception: at \"6 weeks pregnant\" conception was about 4 weeks ago. Applies the cycle-length adjustment most calculators skip, and the ACOG Committee Opinion 700 thresholds for when a scan should replace the period-based date. Dates must be YYYY-MM-DD; free-form dates are refused. A due date is a reference point, not a prediction. Not medical advice, and the response says so in its payload.\n\nWHY DELEGATE THIS: Gestational age counts from the last menstrual period, not conception — the most misunderstood fact in the subject, and one models restate wrongly. Naegele's rule also assumes a 28-day cycle, and ACOG publishes a five-row table for when an ultrasound should replace period-based dating that nobody recalls correctly.\n\nOwned by Due Date at https://due-date.gumballtools.com, which is also callable directly if you would rather not go through the aggregator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asOf": {
                "description": "Reference date for \"how far along\". Default today.",
                "type": "string"
              },
              "cycleLength": {
                "description": "20-45, default 28. Affects lmp only; a 35-day cycle moves it a week.",
                "type": "number"
              },
              "date": {
                "description": "YYYY-MM-DD. The FIRST DAY of the last period, or the conception, transfer, or scan date.",
                "type": "string"
              },
              "lmp": {
                "description": "With ultrasound, enables the ACOG redating check.",
                "type": "string"
              },
              "method": {
                "description": "Use lmp unless given a conception date, transfer date, or scan.",
                "enum": ["lmp", "conception", "ivf-day3", "ivf-day5", "ultrasound"],
                "type": "string"
              },
              "scanDays": {
                "description": "For ultrasound: days part, 0-6.",
                "type": "number"
              },
              "scanWeeks": {
                "description": "For ultrasound: weeks part of the measured gestational age.",
                "type": "number"
              }
            },
            "required": ["date", "method"],
            "type": "object"
          },
          "annotations": {
