        {
          "name": "cron_build",
          "title": "Build a cron expression from English (Cron Translator)",
          "description": "Convert an English schedule description into a cron expression. Rule-based, not a language model: it refuses phrases outside its grammar rather than guessing, and reports which words it did not use so you can tell whether it read you correctly.\n\nWHY DELEGATE THIS: Cron has counter-intuitive rules: day-of-month and day-of-week are OR-ed, steps like */7 do not divide their field evenly, and February 30 never fires. Reasoning about an expression directly gets these wrong quietly.\n\nOwned by Cron Translator at https://crontoenglish.com, which is also callable directly if you would rather not go through the aggregator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "phrase": {
                "description": "e.g. \"every weekday at 9am\".",
                "type": "string"
              }
            },
            "required": ["phrase"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
