      "serverInfo": {
        "name": "stat-api",
        "title": "stat-api — sports data API",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "stat-api serves NFL, NBA, MLB, NHL, and PGA data plus DFS salaries. Workflow: list_leagues → list_tables(league) → describe_table(league, table) → query_table. Catalog tools work without credentials; data tools need a stat-api account: sign in when your app asks (free account at https://stat-api.com), or send an API key as 'Authorization: Bearer <key>'. Every returned row counts against the account's monthly record quota — check api_usage to see your position.",
      "tools": [
        {
          "name": "api_usage",
          "title": "API usage",
          "description": "Your account's quota position: plan, monthly record limit, records used, remaining, and when the quota resets. Requires a stat-api sign-in or API key; costs 1 record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "API usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d6fd14cf3d2a922321d0345799b6e270f21aa7febbe95908d40cce7fcd690c9"
        },
        {
          "name": "describe_table",
          "title": "Describe table",
          "description": "Full contract for one table: fields with types and descriptions, the filters query_table accepts (with operators like __gte/__lte/__between/__like and required filter combinations), page-size limits, primary key, and a runnable example URL. No credentials needed. Always call this before query_table — filters not listed here are rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "league": {
                "enum": ["nfl", "nba", "mlb", "nhl", "pga", "dfs", "reference"],
                "type": "string"
              },
              "table": {
                "type": "string"
              }
            },
            "required": ["league", "table"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49f3a4e24b727a1bbd175eb10c63bdd10c4f7ba3543716a58ebe07845c553534"
        },
        {
          "name": "games_on_date",
          "title": "Games on date",
          "description": "Games scheduled/played on one calendar date (US-Eastern) for nba, mlb, or nhl; defaults to today. Returns the same envelope as query_table on the games table. NFL is week-based, not date-based — for nfl, use query_table on nfl/games with season_id + week filters instead. Requires a stat-api sign-in or API key; rows count against quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD; defaults to today in US-Eastern time",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "league": {
                "enum": ["nba", "mlb", "nhl"],
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Games on date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4decf91fb43336dd8c597ab4357ba89c044a409ae51eedfdba0b3c353b1fcf84"
        },
        {
          "name": "get_record",
          "title": "Get record",
          "description": "Fetch a single row by primary key. Returns the row object. Requires a stat-api sign-in or API key; costs 1 record of quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "primary-key value (integer or text PK)",
                "type": "string"
              },
              "league": {
                "enum": ["nfl", "nba", "mlb", "nhl", "pga", "dfs", "reference"],
                "type": "string"
              },
              "table": {
                "type": "string"
              }
            },
            "required": ["id", "league", "table"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c7207eb9f4dfff944d59a970d5dcc3b281468f26cf91524bd8b2b5c67a9b6bb"
        },
        {
          "name": "graphql_query",
          "title": "GraphQL query",
          "description": "Run a GraphQL query against the same data with relations — nest from a game to its teams/players/odds in one call. Root fields are leagues (nfl, nba, …), each exposing its tables with the same filter arguments as REST plus `first`/`after` pagination. Do NOT send introspection queries (the schema is huge) — use describe_table instead; the SDL is at https://api.stat-api.com/api/v1/graphql/sdl. Requires a stat-api sign-in or API key; every row resolved anywhere in the tree counts against quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "type": "string"
              },
              "variables": {
                "type": "object"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GraphQL query"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a33488e2a588d22a65d8a19178593e7e437429cceeb55b6a80b663f51d4e4790"
        },
        {
          "name": "list_leagues",
          "title": "List leagues",
          "description": "List every league/data group this API serves (nfl, nba, mlb, nhl, pga, dfs, reference) with table counts and availability. No credentials needed. Start here, then call list_tables.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List leagues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fe512e45191ea8e1ddba299852a6104cc813f4c27921717d0a86a77731bdc69"
        },
        {
          "name": "list_tables",
          "title": "List tables",
          "description": "List every queryable table in one league with a one-line summary each. No credentials needed. Follow with describe_table before querying.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "league": {
                "enum": ["nfl", "nba", "mlb", "nhl", "pga", "dfs", "reference"],
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List tables"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:424a50a0237fd621de6b611bd9ddb9abc1b192ec55ef4c9afa3566054972de6c"
        },
        {
          "name": "query_table",
          "title": "Query table",
          "description": "Query any table. Returns `{\"<table>\": [rows], \"limit\": N, \"next_from_id\": M|null, \"has_more\": bool}`. To read every row, start with from_id=0 and re-call with from_id set to the previous next_from_id until it is null. A call without from_id returns the first page in the table's default sort with next_from_id null. filters is a flat object of `field` or `field__op` keys from describe_table (e.g. {\"season_id\": 2024, \"day__between\": \"20250101,20250131\"}). Requires a stat-api account: sign in when the app asks (free account at https://stat-api.com), or send an API key as Authorization: Bearer <key>. Every returned row counts against the monthly record quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filters": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "field or field__op keys → scalar values; see describe_table",
                "type": "object"
              },
              "from_id": {
                "description": "keyset cursor: 0 for the first page of a full walk, then the previous next_from_id",
                "type": "integer"
              },
              "league": {
                "enum": ["nfl", "nba", "mlb", "nhl", "pga", "dfs", "reference"],
                "type": "string"
              },
              "limit": {
                "minimum": 1,
                "type": "integer"
              },
              "table": {
                "type": "string"
              }
            },
            "required": ["league", "table"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f5799997c4210eb3b206a7b8a50616c1e2c158482a9352bf649174f6b2284b4"
        },
        {
          "name": "search_players",
          "title": "Search NBA players",
          "description": "Fuzzy player-name search (typo-tolerant). Currently NBA only — for other leagues query the players table with a name filter via query_table. Returns player rows ordered by match quality. Requires a stat-api sign-in or API key; rows count against quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "league": {
                "default": "nba",
                "enum": ["nba"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search NBA players"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:caaf2d892e06dc0089245168710d0b95cc1dbe53084629c2eaa7f5a87b9275a1"
        }
      ],
      "digest": "sha256:0b98142420ed6cd18097af92c0080059af653cac8952b07efda8270523ad8c99"
    }
  }
