                            "must_be_shown_with_link": {
                              "type": "boolean"
                            },
                            "required": {
                              "description": "True for affiliate links. When true, `text` must be shown wherever `url` is.",
                              "type": "boolean"
                            },
                            "text": {
                              "anyOf": [
                                {
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "The exact wording to show. Null when not required."
                            }
                          },
                          "required": ["must_be_shown_with_link", "required", "text"],
                          "type": "object"
                        },
                        "kind": {
                          "description": "What is on sale: ticket, tour, buy, hotel, …",
                          "type": "string"
                        },
                        "label": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "The seller's own call to action, if we have one."
                        },
                        "link_rel": {
                          "description": "The rel attribute to use if the link is rendered as HTML.",
                          "type": "string"
                        },
                        "mode": {
                          "description": "affiliate = we earn a commission if the reader books through `url`, and `disclosure` must be shown with the link. direct = a plain link to the seller, we earn nothing, no disclosure needed. own = the seller is a service this publisher also operates, which is a commercial interest of a different kind, and `disclosure` must be shown with the link.",
                          "enum": ["affiliate", "direct", "own"],
                          "type": "string"
                        },
                        "price": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "as_of": {
                                  "description": "When this price was last verified with the seller (ISO 8601). A price older than 24 hours is omitted entirely rather than shown stale.",
                                  "type": "string"
                                },
                                "currency": {
                                  "description": "ISO 4217 code.",
                                  "type": "string"
                                },
                                "from": {
                                  "description": "Lowest price we have seen, in `currency`.",
                                  "type": "number"
                                }
                              },
                              "required": ["as_of", "currency", "from"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Null when we have no price or cannot vouch for its age."
                        },
                        "provider": {
                          "description": "Who sells it.",
                          "type": "string"
                        },
                        "url": {
                          "description": "Where to book. For mode=affiliate this is a redirect on our domain that forwards to the seller; link to it as given rather than resolving it.",
                          "type": "string"
                        }
                      },
                      "required": ["disclosure", "kind", "label", "link_rel", "mode", "price", "provider", "url"],
                      "type": "object"
                    },
                    "data": {
                      "description": "Data allowance as sold, e.g. '10 GB' or 'Unlimited'.",
                      "type": "string"
                    },
                    "days": {
                      "description": "How many days the plan is valid for.",
                      "type": "number"
                    },
                    "provider": {
                      "description": "Who sells the plan.",
                      "type": "string"
                    },
                    "unlimited": {
                      "type": "boolean"
                    }
                  },
                  "required": ["best_value", "booking", "data", "days", "provider", "unlimited"],
                  "type": "object"
                },
                "type": "array"
              },
              "requested": {
                "additionalProperties": false,
                "description": "What was actually asked of the catalogue, after snapping.",
                "properties": {
                  "data": {
                    "description": "The ladder rung the query snapped to.",
                    "type": "string"
                  },
                  "days": {
                    "type": "number"
                  }
                },
                "required": ["data", "days"],
                "type": "object"
              },
              "total": {
                "description": "How many plans are in `items`.",
                "type": "number"
              },
              "unavailable": {
                "description": "True when the plan source could not be reached, or returned only prices too old to publish. An empty `items` with this false means there genuinely are none.",
                "type": "boolean"
              },
              "url": {
                "description": "The page a reader can open to do this themselves.",
                "type": "string"
              }
            },
