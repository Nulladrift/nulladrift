      "instructions": "Read-only access to the Paris catalogue behind C'est Chaud à Paris: events and their dates, places and how cool they stay, today's free and discounted things, and whichever seasonal moment is running. Every record carries the URL of its own page.  Two things the data asks of you. Where a record has a `booking` block with `disclosure.required` true, show `disclosure.text` wherever you show the link — we are paid a commission on it and the reader is entitled to know. And `attribution` names the open datasets underneath; the ODbL ones require credit wherever the data is used, including inside an answer you write.  Titles of events and names of places are given in their own language and are not translated; `locale` changes our own prose only. A price is sent only when we verified it within the last 24 hours — an absent price means we do not know it today, not that it is free.",
      "tools": [
        {
          "name": "esim_plans",
          "title": "France eSIM data plans",
          "description": "Returns prepaid eSIM data plans that work in France, for a given amount of data and trip length. Each plan carries its price with the date that price was checked, and a booking link. Relevant when a reader is travelling to Paris from outside the EU and needs mobile data on arrival.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "How many days the trip lasts. Snaps to the nearest of 7, 15, 30; omit for 15.",
                "type": "number"
              },
              "gb": {
                "description": "Gigabytes wanted. Snaps to the nearest of 1, 3, 5, 10, 20, 50; omit for 10. Use `unlimited` instead for an unmetered plan.",
                "type": "number"
              },
              "locale": {
                "description": "Language for the disclosure wording.",
                "enum": ["fr", "en", "es"],
                "type": "string"
              },
              "unlimited": {
                "description": "Ask for unmetered plans instead of a size.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "approximate": {
                "description": "True when nothing matched the requested combination and these are the nearest plans instead. Say so when relaying them.",
                "type": "boolean"
              },
              "attribution": {
                "additionalProperties": false,
                "description": "Who to credit and under what licence. The ODbL datasets behind most of this data require attribution wherever the data is used, including inside an answer you generate.",
                "properties": {
                  "data": {
                    "description": "Upstream datasets and their licences. ODbL requires naming them wherever the data is used.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "licence": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["licence", "name"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "source": {
                    "description": "Who assembled this answer.",
                    "type": "string"
                  },
                  "terms": {
                    "description": "Terms for using this surface.",
                    "type": "string"
                  },
                  "url": {
                    "description": "The site these records come from.",
                    "type": "string"
                  }
                },
                "required": ["data", "source", "terms", "url"],
                "type": "object"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2. Always FR — this is a Paris guide.",
                "type": "string"
              },
              "items": {
                "description": "Matching plans, best match first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "best_value": {
                      "description": "The best price-per-gigabyte of the plans returned for this query.",
                      "type": "boolean"
                    },
                    "booking": {
                      "additionalProperties": false,
                      "properties": {
                        "disclosure": {
                          "additionalProperties": false,
