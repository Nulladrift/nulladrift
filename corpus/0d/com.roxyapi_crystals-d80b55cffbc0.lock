        {
          "name": "get_crystals",
          "title": "List all crystals - Crystal healing database API",
          "description": "Retrieve healing crystals and gemstones with pagination. Supports optional filtering by chakra, zodiac sign, element, color, or planet. Returns minimal summary fields per crystal. Use the detail endpoint for full healing properties. Perfect for building crystal explorer apps, healing stone guides, and personalized crystal recommendation engines.",
          "inputSchema": {
            "examples": [
              {}
            ],
            "properties": {
              "chakra": {
                "description": "Filter by chakra association, case-insensitive. Valid values: Root, Sacral, Solar Plexus, Heart, Throat, Third Eye, Crown.",
                "enum": ["Root", "Sacral", "Solar Plexus", "Heart", "Throat", "Third Eye", "Crown"],
                "example": "Heart",
                "type": "string"
              },
              "color": {
                "description": "Filter by crystal color (partial match, case-insensitive). E.g., \"pink\", \"green\", \"blue\", \"purple\". Use GET /colors for valid values.",
                "example": "pink",
                "type": "string"
              },
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "element": {
                "description": "Filter by elemental association, case-insensitive. Valid values: Earth, Water, Fire, Air, Storm.",
                "enum": ["Earth", "Water", "Fire", "Air", "Storm"],
                "example": "Water",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum items to return per page. Range: 1-100, default 20.",
                "example": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of items to skip for pagination. Default 0.",
                "example": 0,
                "minimum": 0,
                "type": "integer"
              },
              "planet": {
