            "readOnly": true
          },
          "digest": "sha256:ebcdd84d65f0685b1d0223510ef1b37386f60d434554696fd505cb9f945f6850"
        },
        {
          "name": "axes_lookup_profile",
          "title": "Look up a reference profile",
          "description": "Look up a country, personality, ideology, or political party in the 12 Axes catalog, and optionally compare it against a result_url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "enum": ["en", "es", "pt", "fr", "de", "it", "ru", "zh", "zh-hant", "ja", "ko", "hi", "ar"],
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "result_url": {
                "description": "A compatible 12 Axes result URL containing all 12 axis scores.",
                "maxLength": 4096,
                "minLength": 4,
                "type": "string"
              },
              "type": {
                "enum": ["country", "personality", "ideology", "party"],
                "type": "string"
              }
            },
            "required": ["name", "type"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
