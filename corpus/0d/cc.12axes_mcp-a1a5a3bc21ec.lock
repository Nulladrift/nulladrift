      "serverInfo": {
        "name": "12axes",
        "title": "12 Axes",
        "version": "1.2.0",
        "websiteUrl": "https://12axes.cc"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "axes_compare_results",
          "title": "Compare two 12 Axes results",
          "description": "Compare two 12 Axes result URLs across all 12 axes, reporting overall similarity, closest axes, and sharpest contrasts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "first_url": {
                "description": "A compatible 12 Axes result URL containing all 12 axis scores.",
                "maxLength": 4096,
                "minLength": 4,
                "type": "string"
              },
              "language": {
                "enum": ["en", "es", "pt", "fr", "de", "it", "ru", "zh", "zh-hant", "ja", "ko", "hi", "ar"],
                "type": "string"
              },
              "second_url": {
                "description": "A compatible 12 Axes result URL containing all 12 axis scores.",
                "maxLength": 4096,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["first_url", "second_url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8260fe6c210122cf61d0fffe244599223b343cab1c2eac04eed29df45a01834c"
        },
        {
          "name": "axes_explain_result",
          "title": "Explain a 12 Axes result URL",
          "description": "Decode a 12 Axes result link and return all 12 axis scores, closest ideology, personalities, countries, parties, and recommended reading.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "enum": ["en", "es", "pt", "fr", "de", "it", "ru", "zh", "zh-hant", "ja", "ko", "hi", "ar"],
                "type": "string"
              },
              "result_url": {
                "description": "A compatible 12 Axes result URL containing all 12 axis scores.",
                "maxLength": 4096,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["result_url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf199be3c2b8413bc4a2c758f3ebd641ddfea3fc61024dba92296db3c28ba747"
        },
        {
          "name": "axes_generate_share_card",
          "title": "Generate 12 Axes share card PNG",
          "description": "Render a 4:5 or 9:16 PNG share card with QR code for a 12 Axes result URL, returning both the download URL and inline PNG image.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "enum": ["en", "es", "pt", "fr", "de", "it", "ru", "zh", "zh-hant", "ja", "ko", "hi", "ar"],
                "type": "string"
              },
              "ratio": {
                "default": "4:5",
                "enum": ["4:5", "9:16"],
                "type": "string"
              },
              "result_url": {
                "description": "A compatible 12 Axes result URL containing all 12 axis scores.",
                "maxLength": 4096,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["result_url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8eac4dfde97d5d9108470bdf20aaa5059de4a00905d3b74ef7f160a9a773089"
        },
        {
          "name": "axes_get_report",
          "title": "Get structured 12 Axes report",
          "description": "Read one section or all sections of a structured 12 Axes report: overview, axis_analysis, matches, political_values, books, government, timeline, or paginated ranking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "enum": ["en", "es", "pt", "fr", "de", "it", "ru", "zh", "zh-hant", "ja", "ko", "hi", "ar"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "ranking_type": {
                "default": "ideologies",
                "enum": ["ideologies", "personalities", "countries", "parties"],
                "type": "string"
              },
              "result_url": {
                "description": "A compatible 12 Axes result URL containing all 12 axis scores.",
                "maxLength": 4096,
                "minLength": 4,
                "type": "string"
              },
              "section": {
                "default": "overview",
                "enum": ["overview", "axis_analysis", "matches", "political_values", "books", "government", "timeline", "ranking", "all"],
                "type": "string"
              }
            },
            "required": ["result_url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c97a3763dc083b484bb86de1e8200955ab5318da68c561352407520afdb3df43"
        },
        {
          "name": "axes_get_test_link",
          "title": "Get 12 Axes web test link",
          "description": "Return the official 12axes.cc browser test link and available test lengths (Quick 36, Full 60, Extreme 288). Use this when a user wants to take the 12 Axes Political Test; after finishing in the browser, they can paste their result link or QR share card back here for analysis.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "enum": ["en", "es", "pt", "fr", "de", "it", "ru", "zh", "zh-hant", "ja", "ko", "hi", "ar"],
                "type": "string"
              },
              "variant": {
                "default": "full",
                "enum": ["short", "full", "extreme"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
