        {
          "name": "axes_record_answers",
          "title": "Save or revise quiz progress",
          "description": "Record chosen answers and return a compact client-held resume token, progress count and next statement. Call after each answer or batch and before pausing. Reuse the latest token to append or revise choices; a bare quiz_id starts an empty record. The token contains answers: save it privately in the client and never add it to public links. No server-side account or answer history is created.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answers": {
                "items": {
                  "properties": {
                    "answer": {
                      "enum": ["STRONGLY_AGREE", "AGREE", "NEUTRAL", "DISAGREE", "STRONGLY_DISAGREE"],
                      "type": "string"
                    },
                    "question_id": {
                      "description": "Exact statement id returned for this quiz, not its number or a made-up id.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question_id"],
                  "type": "object"
                },
                "maxItems": 240,
                "minItems": 1,
                "type": "array"
              },
              "quiz_id": {
                "description": "The exact quiz_id returned by axes_get_questions. Identifies the selected statements; does not store answers. Use the latest resume_token to preserve progress.",
                "maxLength": 96,
                "pattern": "^(?:q2\\.([0-9a-f]{16})\\.([0-9a-f]{16})|([0-9a-f]{16}))\\.([a-z-]+)\\.(short|extended|extreme)\\.([0-9a-f]{8}|[0-9a-f]{32})$",
                "type": "string"
              },
              "resume_token": {
                "description": "Latest resume_token. It contains the recorded choices: keep it in the client, not in public links.",
                "maxLength": 704,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["answers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:864c6e5e9540d10ced76188b69c8c4a4a70982d25177bbc1ade49d13cca35e1d"
        },
