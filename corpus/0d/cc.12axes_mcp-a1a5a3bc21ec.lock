      "instructions": "Explain the twelve axis scores using the returned poles and link to the source pages. Set language to the user's conversation language unless they request another; the query may use a different language. Catalogue matches describe similarity to editorial estimates. A match says nothing about voting eligibility or intent. Use axes_search_profiles for names, aliases, keywords or spelling mistakes, then axes_lookup_profile with the returned id. Ask which profile the user means if the results are ambiguous. Use axes_search_questions for question text, explanations, terms or axes without starting a quiz. Search results do not form a scored quiz. Use axes_get_report for the official full report, sections, rankings and reading recommendations. Use axes_generate_share_card to return our branded PNG in 4:5 or 9:16. For a full-report request, use section all or read its sections; do not present the overview alone as a full report. Use axes_lookup_profile with result_url to compare a user with a country, person, ideology or party. Check connectivity with initialize or tools/list; never test a tool by submitting empty or invented inputs. Record answers with axes_record_answers after each answer or batch, and before pausing. Save its latest resume_token in a client file if available, or offer it to the user privately. Resume with that token instead of reconstructing a long answer list. Never put a resume token in a public result link. A quiz_id identifies statements, not saved answers. Score only when complete is true and answered equals total_questions, using the latest resume_token. A final question page alone does not mean the quiz was answered. For tool errors, follow the message and details.next_tool. Change invalid input or recover progress before retrying; retry identical inputs automatically only when retryable is true. Explain recovery in the user's conversation language. An input, state or unsupported-input error does not mean the service is offline. Forward the random attempt_id from a quiz when requesting its full report or share card. For image results, call axes_read_result_qr, then use its result_url with axes_explain_result or axes_compare_results. Images without a compatible result QR are unsupported. Do not infer missing scores from labels or portraits. Matches are recalculated using the 12axes.cc catalogue and may differ from a source card. For a test with a person, explain that recording progress and scoring through MCP sends their answers to 12axes.cc for processing and wait for their agreement. Progress is returned in a client-held token, not saved in a server account. Ask one statement at a time and record only their chosen answers. Offer the website for a test scored in the browser.",
