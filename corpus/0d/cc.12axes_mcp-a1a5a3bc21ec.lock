          },
          "digest": "sha256:f5cf259cb7918d265b1cdc2e6a46f587195c0504c6e4fdc799bc2a3b57506238"
        },
        {
          "name": "axes_read_result_qr",
          "title": "Read 12 Axes result QR code",
          "description": "Decode a 12 Axes result URL from a Base64-encoded PNG or JPEG image containing a result QR code.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "image_base64": {
                "maxLength": 5592472,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": ["image_base64"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6771a3bc2bed4f7dbb2a9efc24b32ea699980cb621e33d5c0554566cb429b61d"
        },
