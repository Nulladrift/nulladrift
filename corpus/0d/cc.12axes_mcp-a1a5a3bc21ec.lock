        {
          "name": "axes_search_profiles",
          "title": "Search catalogue profiles",
          "description": "Search countries, political figures, ideologies and parties by multilingual names, aliases, abbreviations, descriptive keywords or common spelling mistakes. Searches all twelve languages by default and returns content in language. Exact names rank before partial names, keywords and fuzzy suggestions. Use the selected type and id with axes_lookup_profile for its twelve axes. Fuzzy results are candidates, not confirmed identities.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the returned content. It is independent of the query language.",
                "enum": ["en", "pt", "es", "de", "it", "ru", "zh", "zh-hant", "ko", "ja", "fr", "hi"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "A name, alias, partial phrase, keyword or question ID. Common spelling mistakes are tolerated. This is text matching, not semantic search.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "search_language": {
                "description": "Optionally restrict matching to one language. By default all twelve languages are searched.",
                "enum": ["en", "pt", "es", "de", "it", "ru", "zh", "zh-hant", "ko", "ja", "fr", "hi"],
                "type": "string"
              },
              "type": {
                "enum": ["country", "personality", "ideology", "party"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["en", "pt", "es", "de", "it", "ru", "zh", "zh-hant", "ko", "ja", "fr", "hi"],
                "type": "string"
              },
              "next_offset": {
                "type": ["number", "null"]
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "caption": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "match_type": {
                      "enum": ["exact", "prefix", "partial", "keyword", "fuzzy"],
                      "type": "string"
                    },
                    "matched_language": {
                      "anyOf": [
                        {
                          "enum": ["en", "pt", "es", "de", "it", "ru", "zh", "zh-hant", "ko", "ja", "fr", "hi"],
                          "type": "string"
                        },
                        {
                          "type": "null"
