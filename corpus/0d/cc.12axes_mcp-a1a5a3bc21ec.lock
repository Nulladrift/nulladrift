                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["country", "personality", "ideology", "party"],
                      "type": "string"
                    }
                  },
                  "required": ["caption", "description", "id", "match_type", "matched_language", "matched_name", "name", "source_url", "type"],
                  "type": "object"
                },
                "type": "array"
              },
