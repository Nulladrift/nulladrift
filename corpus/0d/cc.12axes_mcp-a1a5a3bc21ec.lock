                      "enum": ["country", "personality", "ideology", "party"],
                      "type": "string"
                    }
                  },
                  "required": ["compatibility", "name", "source_url", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "complete": {
                "type": "boolean"
