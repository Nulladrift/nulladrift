                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["kind", "name", "slug"],
                "type": "object"
              },
              "state": {
                "type": "string"
              },
              "suggestion": {
                "additionalProperties": false,
                "description": "Closest known city/role for a miss. Confirm with the user before using it; do not auto-apply.",
                "properties": {
