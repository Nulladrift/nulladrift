                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["kind", "name", "slug"],
                "type": "object"
              },
              "typical_lead_time_hours": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["city_found"],
            "type": "object"
          },
