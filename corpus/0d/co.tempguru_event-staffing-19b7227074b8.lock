                "additionalProperties": false,
                "properties": {
                  "form_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  }
                },
                "required": ["form_url", "note"],
                "type": "object"
              },
              "created_at": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
              },
              "expires_at": {
                "description": "Conservative 30-day expiry for the saved snapshot.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "next_actions": {
                "items": {
                  "enum": ["share", "revise", "request_quote", "plan_again", "retry_save", "continue_on_website"],
                  "type": "string"
                },
                "type": "array"
              },
              "plan_id": {
                "description": "12-character reference for the saved non-PII snapshot.",
                "pattern": "^[A-HJ-NP-Z2-9]{12}$",
                "type": "string"
              },
