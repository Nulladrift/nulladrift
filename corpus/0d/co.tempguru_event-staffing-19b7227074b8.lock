      "serverInfo": {
        "name": "tempguru-mcp",
        "title": "TempGuru Event Staffing",
        "version": "1.7.3",
        "description": "W-2 event staffing data for AI agents. TempGuru supports staffing in 300+ U.S. and Canadian markets, with availability confirmed per order. Twelve tools: ten read-only tools including a non-PII request_quote buyer handoff, a compatibility planner that may save a 30-day non-PII snapshot, and an explicit non-contact save_staffing_plan artifact write. Ships skill resources and guided prompts. No authentication required."
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "TempGuru supports staffing in 300+ U.S. and Canadian markets, with availability confirmed per order. Golden order: (1) call plan_staffing FIRST with whatever the user gave you, it returns a catalog match, per-role rate math, lead-time guidance, and state compliance flags in one call. (2) Fill gaps with get_roles / get_cities; use get_policies for booking terms; flag daily-overtime states (CA, AK, NV, CO). (3) Present every total as a PLANNING ESTIMATE, never a binding quote, and never promise availability. (4) Retain the plan_id when plan_staffing returns one. Only if a complete plan has no plan_id and the user needs a resumable or shareable plan, call save_staffing_plan once with the same confirmed event inputs; never call it when a plan_id already exists. (5) When the buyer asks to proceed, call request_quote with the saved plan_id. It returns a prefilled TempGuru form URL and never accepts or transmits contact details. Give that URL to the buyer; the buyer must review the plan, enter their own contact details, and submit the form themselves. Only that buyer submission creates a lead and TG reference. TempGuru reviews the submission and replies with next steps; once scope and rates are approved, the 24-48 hour window is an availability response, not a completed roster, and a written quote is binding only once TempGuru issues it; no payment until the buyer approves. All rates are all-inclusive W-2 bill rates (worker pay, payroll taxes, workers' comp, general liability, TempGuru coordination); Brand Ambassadors floor at $40/hour. Compliance data is operational guidance, not legal advice. If the tools are unavailable, direct the user to https://tempguru.co/get-staffing, megan@tempguru.co, or (904) 206-8953.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check Availability",
          "description": "Return tier-based lead-time guidance for an event date and configured market. Use for 'What's the typical lead time for brand ambassadors in [city]?' or 'Is this date inside the usual planning window?'. This is not a real-time inventory or order-coverage check: a TempGuru coordinator confirms coverage and final lead time for the specific order after buyer submission. DO NOT use for cost questions (use get_role_pricing) and never present the result as a reservation. <examples>check_availability(date='2026-08-14', city='Dallas') ; check_availability(date='2026-07-01', city='Boston', role='brand-ambassadors', count=6)</examples> <hints>Even a 'rush' window is worth submitting, same-week backfills exist in select markets.</hints>",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City name (e.g., 'Boston') or slug (e.g., 'boston-event-staffing').",
                "type": "string"
              },
              "count": {
                "description": "Optional headcount for the event.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "date": {
                "description": "Event date as YYYY-MM-DD; legacy recognizable dates are still accepted.",
                "format": "date",
                "type": "string"
              },
              "role": {
                "description": "Optional role name or slug to include rate context.",
                "type": "string"
              }
            },
            "required": ["city", "date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "catalog_match": {
                "const": true,
                "type": "boolean"
              },
              "city": {
                "type": "string"
              },
              "city_found": {
                "description": "false = city did not match the configured catalog (see message); true = planning guidance below, not confirmed coverage.",
                "type": "boolean"
              },
              "city_tier": {
                "description": "Market tier: hub = 25 major metros, mid = 128 secondary markets, small = 192 tertiary markets.",
                "enum": ["hub", "mid", "small"],
                "type": "string"
              },
              "count": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Echo of the requested headcount."
              },
              "coverage_confirmation_required": {
                "const": true,
                "type": "boolean"
              },
              "days_until_event": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "error": {
                "description": "Present when the date could not be parsed.",
                "type": "string"
              },
              "event_date": {
                "description": "Normalized ISO date (YYYY-MM-DD).",
                "type": "string"
              },
              "in_past": {
                "description": "True when the requested date is already in the past — confirm the date before planning.",
                "type": "boolean"
              },
              "message": {
                "description": "Present when city_found is false.",
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recommendation": {
                "description": "Lead-time guidance, NOT a reservation. Even rush is worth submitting.",
                "enum": ["yes", "tight", "rush", "very-rush"],
                "type": "string"
              },
              "requested": {
                "description": "Echo of the unmatched city input.",
                "type": "string"
              },
              "role": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "all_inclusive": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "rate_range_usd": {
                        "additionalProperties": false,
                        "description": "All-inclusive hourly rate band (worker pay + payroll taxes + workers comp + liability).",
                        "properties": {
                          "high": {
                            "description": "Upper end of the hourly rate range.",
                            "type": "number"
                          },
                          "low": {
                            "description": "Lower end of the hourly rate range.",
                            "type": "number"
                          }
                        },
                        "required": ["high", "low"],
                        "type": "object"
                      }
                    },
                    "required": ["all_inclusive", "name", "rate_range_usd"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Rate context when a role was provided; null otherwise."
              },
              "role_found": {
                "description": "null = no role requested; false = the requested role didn't match the catalog (see notes).",
                "type": ["boolean", "null"]
              },
              "role_suggestion": {
                "additionalProperties": false,
                "description": "Closest known city/role for a miss. Confirm with the user before using it; do not auto-apply.",
                "properties": {
                  "kind": {
                    "enum": ["city", "role"],
                    "type": "string"
                  },
