        {
          "name": "get_compliance_by_state",
          "title": "Get Compliance By State",
          "description": "Get the event staffing compliance summary for a US state. Returns minimum wage, overtime rules, and state-specific quirks. Perfect for 'What are the W-2 vs 1099 rules for event workers in [state]?', 'What's the minimum wage for event staff in [state]?', or 'Are there compliance gotchas for hiring event workers in [state]?' questions. NOT legal advice, consult employment counsel for binding interpretation. DO NOT use for rates (use get_role_pricing). <examples>get_compliance_by_state(state='CA') ; get_compliance_by_state(state='Tennessee')</examples> <hints>Daily-overtime states (CA, AK, NV, CO) change shift budgeting, flag them in any plan.</hints>",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "state": {
                "description": "Two-letter state code (e.g., 'CA') or full state name (e.g., 'California').",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "available_states": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "abbr": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["abbr", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "citation_note": {
                "description": "Operational guidance, not legal advice.",
                "type": "string"
              },
              "currency_note": {
                "description": "Reminder that wages change annually; verify before relying.",
                "type": "string"
              },
              "data_current_as_of": {
