        {
          "name": "save_staffing_plan",
          "title": "Save Staffing Plan",
          "description": "Explicitly save a complete non-contact staffing plan for 30 days so it can be shared, resumed, or linked to a later quote request. Use only when plan_staffing returned plan_complete:true without a plan_id and the user needs persistence. Never call this tool when plan_staffing already returned a plan_id. Provide the same confirmed city, date, event type, attendees, roles, headcount, hours, and days; the server recomputes rates, totals, lead time, and compliance before saving and does not accept caller-supplied pricing or totals. This does not reserve staff, submit contact details, or request a quote. <hints>Branch on status: saved is the only outcome with a durable plan_id; plan_incomplete requires revising the inputs; for rate_limited or storage_unavailable, give the buyer continuation.form_url directly because request_quote requires a saved plan_id.</hints>",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attendees": {
                "description": "Expected attendee count.",
                "exclusiveMinimum": 0,
                "maximum": 5000000,
                "type": "integer"
              },
              "city": {
                "description": "Event city, name or slug (e.g. Chicago).",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "event_date": {
                "description": "Event date as YYYY-MM-DD; legacy recognizable dates are still accepted.",
                "format": "date",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "event_type": {
                "description": "trade-show, conference, festival, concert, sporting-event, corporate, brand-activation, or other.",
                "enum": ["trade-show", "conference", "festival", "concert", "sporting-event", "corporate", "brand-activation", "other"],
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "roles": {
                "description": "Confirmed roles, headcount, hours, and days to recompute and save.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "days": {
                      "description": "Number of event days (default 1).",
                      "exclusiveMinimum": 0,
                      "maximum": 365,
                      "type": "integer"
                    },
                    "headcount": {
                      "description": "Staff needed for this role.",
                      "exclusiveMinimum": 0,
                      "maximum": 10000,
                      "type": "integer"
                    },
                    "hours_per_shift": {
                      "description": "Hours per shift (default 8, max 24).",
                      "exclusiveMinimum": 0,
                      "maximum": 24,
                      "type": "number"
                    },
                    "role": {
                      "description": "Role name or slug.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["headcount", "role"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["city", "roles"],
            "type": "object"
          },
