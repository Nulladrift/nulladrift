        {
          "name": "request_quote",
          "title": "Request Quote",
          "description": "Use only after the buyer reviews a staffing plan and asks to proceed. Requires the saved non-PII plan_id from plan_staffing or save_staffing_plan and returns a prefilled TempGuru-owned review form. This tool never accepts or transmits names, email, phone, company, or other contact details and never creates a CRM lead or quote reference. The buyer must open form_url, review the plan, enter their own details, and submit it; only that submission creates a lead. This is not a reservation and does not guarantee pricing or availability. If a complete plan has continuation.form_url but no plan_id, give that URL directly instead. Never collect contact details for an MCP call; re-run an expired plan.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "plan_id": {
                "description": "Saved non-PII plan reference returned by plan_staffing or save_staffing_plan.",
                "maxLength": 12,
                "pattern": "^[A-HJ-NP-Z2-9]{12}$",
                "type": "string"
              },
              "skill_id": {
                "description": "Optional canonical TempGuru skill that assembled the plan.",
                "enum": ["event-staffing-ordering", "event-staffing-compliance", "staffing-plan-from-event-brief", "urgent-event-backfill", "staffing-agency-partner-growth", "multi-city-activation-planner", "event-staffing-procurement", "tempguru-pro-operations"],
                "type": "string"
              },
              "skill_version": {
                "description": "Optional version of the TempGuru staffing skill used.",
                "maxLength": 40,
                "minLength": 1,
                "pattern": "^[0-9]{1,4}\\.[0-9]{1,4}\\.[0-9]{1,4}(?:-[0-9A-Za-z.-]{1,24})?(?:\\+[0-9A-Za-z.-]{1,24})?$",
                "type": "string"
              },
              "source_platform": {
                "description": "Optional agent/platform attribution, e.g. claude-ai, openclaw, or hermes.",
                "enum": ["ai-agent", "ai-page", "ai-page-zh", "baidu-agent", "chatgpt-app", "chatgpt-gpt", "claude-ai", "claude-code", "claude-desktop", "cn-agent", "copilot-agent", "coze", "coze-bot", "custom-gpt", "gemini", "gemini-cli", "gemini-gem", "hermes", "kimi", "langchain", "lechat-agent", "llamaindex", "manual-test", "meta-ai", "mcp-handoff", "open-webui", "openai-codex", "openclaw", "perplexity-space", "pi", "poe-bot", "postman", "prime-agent", "python-client", "skill", "team-demo", "website", "website-widget", "zhipu-agent", "openai-chatgpt", "openai-agents-sdk", "openai-mcp", "cursor", "cline", "windsurf", "perplexity", "qwen-ecosystem", "deepseek", "doubao", "mcp-client"],
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "buyer_submission_required": {
                "const": true,
                "description": "Always true. The buyer, not the agent, must enter contact details and submit the form.",
                "type": "boolean"
              },
              "form_url": {
                "description": "Prefilled TempGuru-owned review form. Present only when handoff_ready is true.",
                "format": "uri",
                "type": "string"
              },
              "handoff_ready": {
                "description": "true when the saved plan resolved and a prefilled buyer form URL was created.",
                "type": "boolean"
              },
              "message": {
                "description": "Human-readable outcome to relay to the buyer.",
                "type": "string"
              },
              "next_steps": {
                "description": "Safe next actions; no agent-side contact collection.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "plan_found": {
                "description": "Whether the supplied non-PII plan_id resolved before expiry.",
                "type": "boolean"
              },
              "plan_id": {
                "pattern": "^[A-HJ-NP-Z2-9]{12}$",
                "type": "string"
              }
            },
            "required": ["buyer_submission_required", "handoff_ready", "message", "next_steps", "plan_found", "plan_id"],
            "type": "object"
