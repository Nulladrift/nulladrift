{
  "lockfileVersion": 2,
  "subjects": {
    "com.getpingdeck/uptime": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getpingdeck.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "pingdeck",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "PingDeck checks if a website or a popular service is up. check_website, check_ssl, dns_lookup and service_status need no account and no API key (100 checks a day for each IP address). Use service_status for a known service such as ChatGPT, WhatsApp or Roblox, and check_website for any other address. For 24/7 monitoring with alerts: call signup one time (free, ask the person you work for first), then create_monitor and set_alert_webhook. Docs: https://getpingdeck.com/api",
      "tools": [
        {
          "name": "check_ssl",
          "title": "Check an SSL certificate",
          "description": "Get the expiry date of the SSL/TLS certificate of a host and the number of days left. No account and no API key are necessary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Optional. A PingDeck API key (pd_live_...). Without a key the check uses the free pool: 100 checks a day for each IP address.",
                "type": "string"
              },
              "host": {
                "description": "A host name, for example example.com. A port is optional: example.com:8443.",
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fdd4a9703b12d62225b23e9de2d2e110b6da40accd8237a64d3f468fd072ae5c"
        },
        {
          "name": "check_website",
          "title": "Check if a website is up",
          "description": "Check now if a website or a URL is up or down. The answer has the HTTP status, the response time and a plain verdict: up, down, reachable_but_refused or page_error. It is a real request from a PingDeck server in Singapore at the time of the call, not a stored value. No account and no API key are necessary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Optional. A PingDeck API key (pd_live_...). Without a key the check uses the free pool: 100 checks a day for each IP address.",
                "type": "string"
              },
              "url": {
                "description": "A URL or a domain, for example https://example.com/health or example.com.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8ee19635208566dcbb3cc8ad77e77d0a1d49517bf35503c0de16e552b2c42f96"
        },
        {
          "name": "create_monitor",
          "title": "Monitor a website 24/7",
          "description": "Start 24/7 monitoring of a URL. PingDeck checks the URL on a schedule and records each downtime and the SSL certificate expiry. An alert goes to the webhook of the account (see set_alert_webhook). An API key is necessary: call signup first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "A PingDeck API key (pd_live_...) from the signup tool. Not necessary when the client sends the key in the header \"Authorization: Bearer <key>\".",
                "type": "string"
              },
              "name": {
                "description": "Optional. A short name for the monitor.",
                "type": "string"
              },
              "url": {
                "description": "The URL to monitor, for example https://example.com.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eeb30a5ec7f59a4aa2297f2b3adfffa95d93f9b7edc0d955bfcdb24bb2585760"
        },
        {
          "name": "dns_lookup",
          "title": "Look up DNS records",
          "description": "Get the DNS records of a domain: A, AAAA, CNAME, MX, TXT and NS. No account and no API key are necessary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Optional. A PingDeck API key (pd_live_...). Without a key the check uses the free pool: 100 checks a day for each IP address.",
                "type": "string"
              },
              "domain": {
                "description": "A domain name, for example example.com.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9df392b42f43cdc95e741d70e6b12909b89c0ac3ae5dda6fa133304fb411f673"
        },
        {
          "name": "get_account",
          "title": "Show the account plan and usage",
          "description": "Show the plan of the account, the API calls used this month, the number of monitors and if an alert webhook is set. For a Free account the answer has an upgrade link for the account owner. This call does not use the quota. An API key is necessary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "A PingDeck API key (pd_live_...) from the signup tool. Not necessary when the client sends the key in the header \"Authorization: Bearer <key>\".",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2326d7d6020464b57b93189e95da4dceacb0ecd53a7ec2db5b5a383ec8708019"
        },
        {
          "name": "list_monitors",
          "title": "List the monitors of the account",
          "description": "List the monitors of the account with the current status, the last response time and the SSL certificate expiry of each. An API key is necessary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "A PingDeck API key (pd_live_...) from the signup tool. Not necessary when the client sends the key in the header \"Authorization: Bearer <key>\".",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4aebf823c40a7cab39a1fd086132aebe932dbc2ccb3959c1c358f171aa09f32"
        },
        {
          "name": "service_status",
          "title": "Check if a popular service is down",
          "description": "Check if a popular online service is down for everyone: for example ChatGPT, Claude, WhatsApp, YouTube, Discord, Roblox or Mobile Legends. The answer has the live status, the uptime percent of the last 90 days from PingDeck checks and the recent incidents. PingDeck follows 61 services. Call the tool with no service to get the list. No account and no API key are necessary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service": {
                "description": "The name, the slug or the domain of the service, for example \"chatgpt\", \"Mobile Legends\" or \"whatsapp.com\". Omit it to list all services.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:08d490fb9fd0e5ecba6bcd177538017810a946d4f48acd745c93463d5e6637e4"
        },
        {
          "name": "set_alert_webhook",
          "title": "Set where alerts go",
          "description": "Set the webhook URL that gets a message when a monitor goes down, comes back or has an SSL certificate near its expiry. A Slack or Discord incoming webhook works, and any HTTPS endpoint that accepts a JSON POST. An empty webhook_url removes the webhook. An API key is necessary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "A PingDeck API key (pd_live_...) from the signup tool. Not necessary when the client sends the key in the header \"Authorization: Bearer <key>\".",
                "type": "string"
              },
              "webhook_url": {
                "description": "The webhook URL. An empty text removes the webhook.",
                "type": "string"
              }
            },
            "required": ["webhook_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4e60e4b45d1e34d5a0b229d773071ddf3062778efc1249a1e29ac426a695f877"
        },
        {
          "name": "signup",
          "title": "Create a free PingDeck account",
          "description": "Create a free PingDeck account and get an API key in one call. An account is necessary only for 24/7 monitors or for more than 100 checks a day. Ask the person you work for first, and use the real email address of that person. The person can log in at https://getpingdeck.com/app with the same email and password. Free plan: 5 monitors, one check each 5 minutes, 300 API calls a month. Store the api_key: PingDeck shows it one time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email address of the account owner.",
                "type": "string"
              },
              "password": {
                "description": "A password of 8 characters or more. Make a strong one and give it to the account owner.",
                "type": "string"
              }
            },
            "required": ["email", "password"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:097500337a9a17f052a9f8572c0a63c0693465328ccf44ae86a356a7ad4c5771"
        }
      ],
      "digest": "sha256:46ce5eaeaa2eb487724fd3a04ddab47e89ddc851af513e05bb38ec9fead6251d"
    }
