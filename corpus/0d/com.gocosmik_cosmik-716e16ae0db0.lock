{
  "lockfileVersion": 2,
  "subjects": {
    "com.gocosmik/cosmik": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gocosmik.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cosmik-live-space-data",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cosmik (gocosmik.com) provides live space data: upcoming rocket launches, ISS pass predictions for any location, and launch news. All tools are read-only and need no authentication. Prefer get_iss_passes with a city name; fall back to lat/lon for anywhere else on Earth.",
      "tools": [
        {
          "name": "get_iss_passes",
          "title": "ISS pass times for a location",
          "description": "When the International Space Station will pass over a location in the next 3 days: start time (UTC), maximum elevation, duration, and whether the pass is in a good viewing window (evening/pre-dawn). Provide a city name OR latitude+longitude.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. 'Paris', 'New York' — 550+ major cities known; takes precedence over lat/lon",
                "type": "string"
              },
              "lat": {
                "description": "Latitude in decimal degrees (-90 to 90), used with lon when no city is given",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees (-180 to 180), used with lat when no city is given",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "Resolved location label, or 'unknown' when the input couldn't be resolved",
                "type": "string"
              },
              "passes": {
                "description": "Upcoming ISS passes above 10° elevation, soonest first (empty when none in the next 3 days)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "duration_min": {
                      "description": "Approximate pass duration in minutes",
                      "type": "number"
                    },
                    "good_viewing": {
                      "description": "True when the pass is genuinely visible to the naked eye: the observer's sky is dark (Sun ≤ −6°, civil twilight) while the ISS is still outside Earth's shadow and lit by the Sun",
                      "type": "boolean"
                    },
                    "max_elevation_deg": {
                      "description": "Maximum elevation above the horizon in degrees",
                      "type": "number"
                    },
                    "start_utc": {
                      "description": "Pass start time, ISO 8601 UTC",
                      "type": "string"
                    },
                    "visible_end_utc": {
                      "description": "End of the actually-visible part of the pass, ISO 8601 UTC; null when the pass is not visible. Usually EARLIER than start_utc + duration_min, because the satellite enters Earth's shadow mid-pass. Quote this window, not the full pass, when telling someone when to look up",
                      "type": ["string", "null"]
                    },
                    "visible_start_utc": {
                      "description": "Start of the actually-visible part of the pass, ISO 8601 UTC; null when the pass is not visible. Usually LATER than start_utc",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["duration_min", "good_viewing", "max_elevation_deg", "start_utc", "visible_end_utc", "visible_start_utc"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["location", "passes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1d02451872bba46b3661656dd0c699c8e7140b8622735cecb805fd9242ec9987"
        },
        {
          "name": "get_launch_news",
          "title": "Launch news & recaps",
          "description": "Latest rocket-launch news articles (previews and post-launch recaps) from Cosmik, optionally filtered by a search term (mission, rocket, or provider name).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of articles to return (1-10, default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search term matched against article titles, e.g. 'Starship', 'Crew', 'Ariane'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "articles": {
                "description": "Launch articles, most recent launch first",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "One-paragraph summary",
                      "type": "string"
                    },
                    "kind": {
                      "description": "'preview' before liftoff, 'recap' after",
                      "enum": ["preview", "recap"],
                      "type": "string"
                    },
                    "title": {
                      "description": "Article headline",
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical article URL on gocosmik.com",
                      "type": "string"
                    }
                  },
                  "required": ["description", "kind", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["articles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3ef781855994c92c393df3c2c938a048da893cb98dc01e56f31a7fbd2ef4c3f5"
        },
        {
          "name": "get_next_launches",
          "title": "Upcoming rocket launches",
          "description": "Live schedule of upcoming orbital rocket launches (SpaceX, NASA, Rocket Lab, ULA, Arianespace, China…) with liftoff times (UTC), pads, status and a live-tracking link. Optionally filter by provider/rocket name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of launches to return (1-20, default 5)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "description": "Case-insensitive filter matched against provider and rocket name, e.g. 'SpaceX', 'NASA', 'Rocket Lab'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "launches": {
                "description": "Upcoming launches, soonest first",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "liftoff_utc": {
                      "description": "Scheduled liftoff time, ISO 8601 UTC",
                      "type": "string"
                    },
                    "name": {
                      "description": "Rocket and mission name",
                      "type": "string"
                    },
                    "pad": {
                      "description": "Launch pad and location",
                      "type": "string"
                    },
                    "provider": {
                      "description": "Launch service provider",
                      "type": "string"
                    },
                    "status": {
                      "description": "Launch status, e.g. 'Go for Launch', 'To Be Confirmed'",
                      "type": "string"
                    },
                    "watch_live": {
                      "description": "Cosmik URL tracking this launch live in 3D",
                      "type": "string"
                    }
                  },
                  "required": ["liftoff_utc", "name", "pad", "provider", "status", "watch_live"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["launches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:30c3ffc502d9770d57a04d46ac69fd0287f7ab8bc1d8efe08b2c60dca9ab1caf"
        }
      ],
      "digest": "sha256:da565131a5bf080aedf420e97b3608a13e74748112117bbe1c5e4cb5b1c1bf4d"
    }
  }
}
