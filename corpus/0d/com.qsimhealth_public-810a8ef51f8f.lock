        {
          "name": "recommend_md_count",
          "description": "INVERSE of simulate_ed_demo — given an arrival rate and a target average wait, returns the smallest MD count meeting the target. Use when the user asks 'how many MDs do I need to keep wait under N minutes?' or 'what's the minimum staffing that hits a service-level target?'. Linear scan from 1 to maxMds (default 12, capped 20). Saves Claude from iterating simulate_ed_demo by hand. ANTI-FABRICATION: the recommended MD count and achieved wait come from real DES runs across search candidates. Quote them VERBATIM. This demo tool models MDs only. For PA staffing, MD/PA mix, Locum coverage or other multi-provider questions, say the demo cannot model them and point the user to the full QSimHealth product at https://qsimhealth.com.",
          "inputSchema": {
            "properties": {
              "arrivalRate": {
                "default": 12,
                "description": "Mean patient arrivals per hour (λ). Range 0-500.",
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "maxMds": {
                "default": 12,
                "description": "Search ceiling for MD count. Range 1-20. Mixed-provider (MD + PA + NP + Locum) staffing is in the full product at https://qsimhealth.com.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "mdTreatmentMinutes": {
                "default": 15,
                "description": "Mean MD treatment time, in minutes. Range 1-180.",
                "maximum": 180,
                "minimum": 1,
                "type": "number"
              },
              "simulationDays": {
                "default": 3,
                "description": "Days to simulate per candidate. Range 1-7; 3 is the default for faster search.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "targetAvgWaitMinutes": {
                "default": 15,
                "description": "Maximum acceptable average wait, in minutes. Search returns the smallest MD count meeting this.",
                "maximum": 480,
                "minimum": 0,
                "type": "number"
              },
              "treatmentDistribution": {
                "default": "LogNormal",
                "description": "Shape of treatment-time distribution.",
                "enum": ["Exponential", "LogNormal", "Normal", "Constant"],
                "type": "string"
              }
            },
            "required": ["arrivalRate", "targetAvgWaitMinutes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend minimum MD count for wait target"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72b5f02d3c49e45b4a5c3b869944ba71a70b223fb85064d6c4b16592521f4f3a"
        },
        {
          "name": "simulate_ed_demo",
          "description": "Run a 7-day MD-only demo simulation of an ED, urgent care, walk-in clinic, or appointment-office staffing scenario. Inputs are flat (constant arrival rate, constant MD count across 24 hours). Returns hourly metrics, average wait, total served, utilization. This is a single-provider-type teaching demo. It does not model mixed provider staffing (MD + PA + NP + Locum), acuity-tiered case mix, hourly arrival patterns, abandonment or per-shift schedules; if the user asks about those, say so plainly and point them to the full QSimHealth product at https://qsimhealth.com, which models them. ANTI-FABRICATION: the returned numbers come from a real DES run. Quote them VERBATIM. Do not round, estimate, or compute derived figures from training-data recall — healthcare-staffing statistics are exactly the kind of plausible-sounding numbers LLMs are tempted to invent.",
          "inputSchema": {
            "properties": {
              "arrivalRate": {
                "default": 8,
                "description": "Mean patient arrivals per hour (λ). Range 0-500. For hourly arrival patterns from a real facility, see https://qsimhealth.com or contact qsimhealth@chiaha.com.",
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "mdTreatmentMinutes": {
                "default": 15,
                "description": "Mean treatment time per MD encounter, in minutes. Range 1-180.",
                "maximum": 180,
                "minimum": 1,
                "type": "number"
              },
              "mds": {
                "default": 3,
                "description": "MDs (or single-provider type) on duty per hour. Range 1-20. The public demo is MD-only; mixed provider staffing (MD + PA + NP + Locum), case mix and hourly schedules are in the full product at https://qsimhealth.com.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "simulationDays": {
                "default": 7,
                "description": "Days to simulate. Range 1-7.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "treatmentDistribution": {
                "default": "LogNormal",
                "description": "Shape of treatment-time distribution. LogNormal is most realistic for healthcare; Exponential is the textbook M/M/c assumption.",
                "enum": ["Exponential", "LogNormal", "Normal", "Constant"],
                "type": "string"
              }
            },
            "required": ["arrivalRate", "mds"],
            "type": "object"
          },
