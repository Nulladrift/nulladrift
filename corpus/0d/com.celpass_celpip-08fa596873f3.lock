{
  "lockfileVersion": 2,
  "subjects": {
    "com.celpass/celpip": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://celpass.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "celpass",
        "title": "CELPass: CELPIP practice and CRS calculator",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free tools from CELPass (https://celpass.com) for Canada's Express Entry CRS changes effective November 3, 2026, following IRCC's rules published October 16, 2026. Use find_high_wage_occupation to check whether a job is on IRCC's high-wage list, and calculate_crs_november_2026 to estimate how many CRS points a candidate gains; results are estimates, not immigration advice, so link the user to https://celpass.com/new-crs-points-calculator-express-entry-changes-november-3-2026 for the full explanation. For CELPIP practice, get_celpip_practice_question gives one Reading, Listening, Speaking or Writing item without answers: let the learner answer, then mark Reading and Listening with check_celpip_answers, or compare Speaking and Writing with get_celpip_sample_answers.",
      "tools": [
        {
          "name": "calculate_crs_november_2026",
          "title": "New CRS points (November 3, 2026)",
          "description": "Estimate the CRS points an Express Entry candidate gains on November 3, 2026, when Canadian work experience becomes the Labour Market Integration factor: unchanged work-length points plus 70/40/20 extra points after 12+ months in a 2×/1.5×/1.3× high-wage occupation, or 100/70/50 points for a job offer in one (no LMIA needed), whichever is higher, never both. Max 150 (140 with a spouse). Give NOC codes; the tool looks up each occupation's level on IRCC's list. Only this factor changes.",
          "inputSchema": {
            "properties": {
              "canadian_work_years": {
                "description": "Years of skilled (TEER 0–3) work in Canada in the last 10 years, as counted today; 5 means 5 or more",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "current_crs_score": {
                "description": "CRS score in the profile today (optional)",
                "maximum": 1200,
                "minimum": 0,
                "type": "integer"
              },
              "high_wage_jobs": {
                "description": "Canadian jobs (part of that work experience) and the months spent in each. Omit if none.",
                "items": {
                  "properties": {
                    "months": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "noc_code": {
                      "description": "5-digit NOC 2021 code, e.g. 21231",
                      "pattern": "^\\d{5}$",
                      "type": "string"
                    }
                  },
                  "required": ["months", "noc_code"],
                  "type": "object"
                },
                "type": "array"
              },
              "job_offer_noc_code": {
                "description": "NOC code of a qualifying full-time job offer, if any",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "spouse_counted": {
                "description": "True if a spouse or common-law partner is coming to Canada and isn't a citizen or PR",
                "type": "boolean"
              }
            },
            "required": ["canadian_work_years", "spouse_counted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4572e2a17f70b6064d373f2a99b9d3d8bcf9641fac26575f052ef7be46242a4"
        },
        {
          "name": "check_celpip_answers",
          "title": "Check CELPIP practice answers",
          "description": "Mark a learner's answers to a Reading or Listening item from get_celpip_practice_question: returns the score and, for each question the learner answered, whether it is right and the correct letter. Each question_id can be marked once, so send all the learner's answers together; explanations are in the CELPass app.",
          "inputSchema": {
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Question number → chosen letter, e.g. {\"1\": \"C\", \"2\": \"A\"}",
                "type": "object"
              },
              "question_id": {
                "description": "question_id returned with the question",
                "type": "string"
              }
            },
            "required": ["answers", "question_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0b3a72e9e1ede457784c84230a3bd0333fa2145f142d8733f6237469f6f6676"
        },
        {
          "name": "find_high_wage_occupation",
          "title": "Find a high-wage occupation",
          "description": "Search IRCC's high-wage occupation list (in effect November 3, 2026; 186 NOC 2021 codes) by job title words or NOC code. Returns each match's level (2×, 1.5× or 1.3× the average median wage) and the CRS points it earns. An occupation that isn't listed earns no high-wage or job offer points.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Job title words or a NOC code, e.g. 'software engineer' or '72201'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d002e7d444717ee9f5cfd53dade3abae1b0e2e24d298abcd2ed1f87a28029cf"
        },
        {
          "name": "get_celpip_practice_question",
          "title": "CELPIP practice question",
          "description": "Get one random CELPIP practice item from CELPass in the real test format. Reading (parts 1–4): a passage or diagram with multiple-choice questions and fill-in blanks shown as ____(n). Listening (parts 1–6): the questions plus a listen_url where the learner plays the recording (no transcript). Speaking (parts 1–8): the task, any picture, and the preparation and speaking times. Writing (tasks 1–2): the email or survey task with its time limit and word count. No answers are included: mark Reading and Listening with check_celpip_answers, and compare Speaking and Writing with get_celpip_sample_answers. Each day has a new set of items (3 per part), the same for everyone; calls return a random one from today's set.",
          "inputSchema": {
            "properties": {
              "part": {
                "description": "Part number (Reading 1–4, Listening 1–6, Speaking 1–8, Writing 1–2); omit for any part",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "skill": {
                "description": "Default reading",
                "enum": ["reading", "listening", "speaking", "writing"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58d0a39c2555c8bd0f349c792155c117336397b0f6c438ab5fcdedc74c236d80"
        },
        {
          "name": "get_celpip_sample_answers",
          "title": "CELPIP Speaking and Writing sample answers",
          "description": "Sample answers at several CELPIP levels (4–5, 7–8, 9–10, 11–12) for a Speaking or Writing task from get_celpip_practice_question, with how CELPIP rates it. Use them to give the learner feedback on their own answer.",
          "inputSchema": {
            "properties": {
              "question_id": {
                "description": "question_id returned with the Speaking or Writing task",
                "type": "string"
              }
            },
            "required": ["question_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:724bcd4858d151c9bfb868f2f43052bbf715002e384ec278ea982256c8f82126"
        }
      ],
      "digest": "sha256:94eb95da51da9fc56190e1292a71e6c1248b45b2d0dae47e3b12ecc9cba290ce"
    }
  }
