        {
          "name": "news_search",
          "title": "Search news",
          "description": "Finds news articles by key words among every article NestDaddy collected worldwide in the last 120 days, best match and newest first. Works best with the words a headline would use, in the local language for local news (e.g. \"banjir Jakarta\"). country: optional two-letter code (US, GB, SG ...). days: 1-120 (default 30). limit: 1-50 (default 10). full_text: true adds the full text of the first 5 articles (2 extra credits each). Never empty: `match` says how close the articles are (exact, partial, older or live = on topic; related = only the closest recent news).",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "",
                "description": "Optional two-letter country code, e.g. US, GB, SG. Empty searches every country.",
