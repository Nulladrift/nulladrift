      },
      "instructions": "NestDaddy gives you fresh, real-world information. How to use it well:\n1. Pick the right tool. Questions about events, people, companies or anything recent: news_search with the key words (add country for local news). \"What is happening\" in a topic or a country: news / country_news. General facts, how-tos, products, docs: web_search (it mixes in fresh news for time-sensitive queries). Science: research_papers. Newest AI models and apps, games, software versions: ai_tools / games / software (updated daily from OpenRouter, Hugging Face, GitHub, Steam and Homebrew).\n2. Headlines and snippets are short. Before you explain details, read the 1-3 best articles in full: read_page on their url, or full_text=true on news_search, news or country_news.\n3. Search with key words in the language of the place (for example Indonesian for Indonesian news), not a whole sentence. If two searches do not help, answer with what you have and say what is missing.\n4. Check dates (published_timestamp, release_date): prefer the newest sources and say when a fact is from.\n5. Cite the url of every source you use.",
      "tools": [
        {
          "name": "ai_tools",
          "description": "AI models, apps and open-source projects, updated daily: every new model on OpenRouter (with prices per\n    million tokens), trending Hugging Face models and apps, fast-growing GitHub AI / agent / MCP projects, and\n    the big assistants with their newest models. query: optional words (name, use or vendor, e.g. \"video\",\n    \"claude\", \"mcp server\"). category: all, llm, image, video, audio, code, writing, design, 3d, data, agents,\n    education. sort: latest (newest releases first), trending (most used or starred) or name. limit: 1-50.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "all",
                "description": "all, llm, image, video, audio, code, writing, design, 3d, data, agents or education.",
