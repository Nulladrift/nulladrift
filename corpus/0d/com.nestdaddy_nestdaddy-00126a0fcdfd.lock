        "name": "nestdaddy",
        "title": "NestDaddy",
        "version": "1.1.0",
        "description": "Live web search, news from 45+ countries with full article text, research papers and fresh AI, game and software directories.",
        "websiteUrl": "https://nestdaddy.com/mcp"
      },
      "capabilities": {
        "prompts": {
