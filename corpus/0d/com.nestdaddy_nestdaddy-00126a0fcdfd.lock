          "name": "web_search",
          "title": "Search the web",
          "description": "Searches the web with NestDaddy's own index and returns the title, url, snippet and domain of each page. For time-sensitive queries (a year, \"latest\", \"today\") fresh news articles are included (type \"news\"). Stack Overflow answers for programming errors (type \"qa\") and Wikipedia for people, places and \"what is\" questions (type \"wiki\") are included too, and, when one fits, an `answer` card with live numbers: weather, crypto prices, software versions and release or end-of-life dates, and Malaysian fuel, gold and exchange rates. query: short key words. limit: 1-50 results (default 10).",
