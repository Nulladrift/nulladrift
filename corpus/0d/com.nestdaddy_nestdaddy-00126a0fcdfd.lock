        {
          "name": "web_search",
          "description": "Search the web with NestDaddy's own index: title, url, snippet and domain of each page. For time-sensitive\n    queries (a year, \"latest\", \"today\", \"harga ...\") fresh news articles are mixed in on top (type \"news\").\n    Official sources are mixed in too: Stack Overflow answers for programming errors (type \"qa\"), Wikipedia for\n    people, places and \"what is\" questions (type \"wiki\"), and an `answer` card with live official numbers for\n    Malaysian fuel prices (data.gov.my), gold and exchange rates (Bank Negara) and weather (MET Malaysia).\n    Use short key words, not a whole sentence. Read the best pages with read_page before explaining details.\n    query: what to search for. limit: 1-50 results (default 10).",
