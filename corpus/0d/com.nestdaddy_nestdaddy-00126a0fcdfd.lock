        "name": "nestdaddy",
        "title": "NestDaddy",
        "version": "1.1.1",
        "description": "Give your AI today's internet: live web search, real-time breaking news from around the world with full article text, research papers and fresh AI, game and software directories.",
        "websiteUrl": "https://nestdaddy.com/mcp"
      },
