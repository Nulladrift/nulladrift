          "name": "priority_intro",
          "title": "Priority intro ($0.01 USDC)",
          "description": "Send Anto a priority message that lands in his inbox flagged PRIORITY, with a reply within 48 hours. Costs $0.01 USDC on Base, paid via x402. You are only charged if the message is delivered. Only call when the user explicitly asks to reach out and has approved the payment; use the user's real email so Anto can reply. For a free option, use book_call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company or project, e.g. 'Acme — Senior PM role'",
                "maxLength": 150,
                "type": "string"
              },
              "email": {
                "description": "Sender's email, used as reply-to",
