      "tools": [
        {
          "name": "dns_lookup",
          "title": "DNS Lookup",
          "description": "Look up DNS records for a domain via Cloudflare DNS-over-HTTPS. Returns A, AAAA, MX, NS, TXT, CNAME, and SOA records. Use to see where a domain is hosted, who runs its mail and DNS, and what verification/policy TXT records it publishes.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain name, e.g. stripe.com",
                "type": "string"
              },
              "types": {
                "description": "Optional subset of record types, e.g. [\"MX\",\"TXT\"]. Defaults to all common types.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "domain": {},
              "provenance": {
                "description": "Where this answer came from. served_at is when Datakoot answered (UTC); upstream lists the official sources consulted. Datakoot may serve a briefly cached copy, so the source's own observation can be older than served_at.",
