                "description": "Slides whose text 6ix stored only in part (the first 4,000 characters)",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "textNotStored": {
                "description": "Characters of slide text the deck holds that 6ix did not store (0 when it stored all of it)",
                "type": "integer"
              },
              "version": {
                "description": "Changes when the stored text changes; parts of one version join into the whole text",
                "type": "string"
              }
            },
            "required": ["deck", "hasMore", "part", "parts", "slides"],
            "type": "object"
