                              "title": {
                                "type": "string"
                              },
                              "url": {
                                "type": ["string", "null"]
                              }
                            },
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "removedSlides": {
                        "type": "integer"
                      },
                      "summary": {
                        "type": ["string", "null"]
                      },
                      "unchangedSlides": {
                        "type": "integer"
                      },
                      "updatedSlides": {
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "company": {
                "anyOf": [
                  {
                    "properties": {
                      "exchange": {
                        "type": ["string", "null"]
                      },
                      "name": {
                        "type": "string"
                      },
                      "ticker": {
                        "type": ["string", "null"]
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "companyName": {
                "type": ["string", "null"]
              },
              "deck": {
                "properties": {
                  "date": {
                    "description": "The deck's date, YYYY-MM-DD",
                    "type": ["string", "null"]
                  },
                  "deckType": {
                    "type": ["string", "null"]
                  },
                  "id": {
                    "description": "Pass to get_deck",
                    "type": "string"
                  },
                  "slides": {
                    "type": ["integer", "null"]
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": ["string", "null"]
                  },
                  "whatChanged": {
                    "description": "What changed from the company's previous version of this deck",
                    "type": ["string", "null"]
                  }
                },
                "required": ["id", "title", "url"],
                "type": "object"
              },
              "hasMore": {
                "description": "Later parts follow: ask for part + 1, or pass nextCursor as cursor",
