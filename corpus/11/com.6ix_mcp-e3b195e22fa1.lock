                      "type": "boolean"
                    },
                    "part": {
                      "description": "The part holding the whole paragraph",
                      "type": "integer"
                    },
                    "speaker": {
                      "description": "Who the replay names as speaking; empty when no speaker is identified",
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["at", "part", "text"],
                  "type": "object"
