                "type": "integer"
              },
              "parts": {
                "description": "How many parts the whole text has",
                "type": "integer"
              },
              "slides": {
                "items": {
                  "properties": {
                    "change": {
                      "enum": ["new", "updated", null],
                      "type": ["string", "null"]
