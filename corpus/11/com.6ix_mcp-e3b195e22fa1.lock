          "name": "search_news_releases",
          "title": "Search news releases",
          "description": "Use this when someone wants news releases about a topic, person, deal, product or result across all companies, for example acquisitions, financings, guidance changes or a named executive. Give it the words to find (quotes for an exact phrase). Returns matching releases from the full text of every release on 6ix, with date, company, a short excerpt and 6ix.com link, 20 at a time; pass the answer's nextCursor as cursor for the next 20. A search lists at most 1,200 releases: when more match, the answer says so; add words, a company name or a year to reach the rest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "To read on: nextCursor from this tool's last answer, exactly as given, with the same other arguments",
                "maxLength": 700,
                "minLength": 8,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Pages of 20; the answer says how many there are (at most 60)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find; the company name can be part of it",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "sort": {
                "default": "best",
                "description": "best: headline matches first, newest first within; newest: date only; relevance: text score only",
                "enum": ["best", "newest", "relevance"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "When 6ix answered (ISO 8601, UTC)",
                "type": "string"
              },
              "closest": {
                "description": "No release holds every word asked for; these come closest",
                "type": "boolean"
              },
              "hasMore": {
                "description": "More follow: ask again with cursor set to nextCursor",
                "type": "boolean"
              },
              "headlinesOnly": {
                "description": "The full-text index was unavailable, so only headlines were searched",
                "type": "boolean"
              },
              "listChanged": {
                "description": "The list changed since the cursor was made and the last item shown is no longer in it, so an item may repeat or be missed here",
                "type": "boolean"
              },
              "nextCursor": {
                "description": "Pass as cursor to read on from the last item shown; null at the end",
                "type": ["string", "null"]
              },
              "page": {
                "type": "integer"
              },
              "pages": {
                "description": "Pages that can be read, 20 releases each",
                "type": "integer"
              },
              "releases": {
                "items": {
                  "properties": {
                    "company": {
                      "anyOf": [
                        {
                          "properties": {
                            "exchange": {
                              "type": ["string", "null"]
                            },
                            "name": {
                              "type": "string"
                            },
                            "ticker": {
                              "type": ["string", "null"]
                            },
                            "url": {
                              "type": "string"
                            }
                          },
                          "required": ["name", "url"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "excerpt": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "published": {
                      "description": "ISO 8601 date or date-time",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Releases that can be listed for this search (at most 1,200); see totalExact",
                "type": "integer"
              },
              "totalExact": {
                "description": "false: more releases match than can be listed (or, for a headline-only search, the count is not known yet)",
                "type": "boolean"
              }
            },
            "required": ["hasMore", "nextCursor", "page", "pages", "releases", "total", "totalExact"],
            "type": "object"
          },
