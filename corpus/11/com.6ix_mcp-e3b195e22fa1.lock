                    "enum": ["upcoming", "live", "replay", "ended"],
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "transcript": {
                    "description": "The call's text can be read with get_earnings_call_transcript",
                    "type": "boolean"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["status", "title", "url"],
                "type": "object"
              },
              "hasMore": {
                "description": "More parts, or more passages with find, follow",
                "type": "boolean"
              },
              "matches": {
                "description": "With find: how many passages mention the words (in the part searched)",
                "type": "integer"
              },
              "nextCursor": {
                "description": "Pass as cursor to read on; null at the end",
                "type": ["string", "null"]
              },
              "part": {
                "description": "The part read, or the part searched with find (absent when find searched the whole call)",
                "type": "integer"
              },
