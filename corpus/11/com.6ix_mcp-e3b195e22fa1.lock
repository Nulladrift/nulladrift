      "instructions": "6ix: earnings calls, news releases, decks, share prices and shareholders for 54,631 listed companies on 100 exchanges in 71 countries. It holds 118k earnings calls with their replay (nearly all with their text), 1.96M news releases (Nov-9-2026) added as they are issued, and 638k decks (Nov-9-2026) with what changed from each company's previous version. Use it when someone asks what a listed company announced, what was said on its earnings call, when its next call is, what its latest deck shows and what changed in it, or what its shares trade at and how they moved; or wants releases, calls or slides about a topic across companies, or mining companies' drill results. Answers are short lists first; ask for a release's full text, a call's text or a deck's slides with the follow-up tool each answer names. Every result carries its 6ix.com link and date: cite the link for each release, call or deck you mention, and use the date to say how recent it is. Each answer starts with today's date. Call text is a machine transcript of the replay: names and figures may be misheard, so quote it as said on the call and check figures against the company's release or deck. It also gives share prices: the last price (delayed at least 15 minutes, or the day's close) with change, day range, volume and market cap, and daily closes from Oct-6-2025 for most listings (each answer names the first day 6ix holds for its listing). Each price names its exchange, currency and the time it is from; prices for Japan, Singapore, New Zealand and Milan come from public quote pages (Kabutan, SGX, NZX, Euronext) and name the page. And it shows who owns a listed company: its largest shareholders, insiders' buying and selling, big stakes and what an investor or insider holds, each dated and linked to its 6ix page and its filing. Each answer says what 6ix reads for the company's market, so an empty list is never read as none; US institutions' quarterly reports are on 6ix from the quarter ending Jun-30-2026. 6ix provides information only; it does not give investment advice or recommendations.",
      "tools": [
        {
          "name": "compare_peer_ownership",
          "title": "Investors in the peers",
          "description": "Use this when someone wants the investors who hold a company's peers but not the company, or the overlap between two companies' holders, for example to find investors to approach. Give it the company and up to 10 peer tickers; mode missing (default) or overlap. Returns institutions ranked by how many peers they hold, with their position in each peer and in the company and their 6ix page.",
