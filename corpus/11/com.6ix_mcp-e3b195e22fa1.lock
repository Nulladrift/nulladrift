              "changes": {
                "anyOf": [
                  {
                    "properties": {
                      "newSlides": {
                        "type": "integer"
                      },
                      "previous": {
                        "anyOf": [
                          {
                            "properties": {
                              "date": {
                                "type": ["string", "null"]
                              },
                              "id": {
                                "type": "string"
