            "additionalProperties": false,
            "properties": {
              "commodity": {
                "description": "The study's main commodity as its price deck names it: gold, copper, silver, uranium…",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "PEA, pre-feasibility (pfs), feasibility (fs) or a filed NI 43-101 technical report (report)",
                "enum": ["pea", "pfs", "fs", "report"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "When 6ix answered (ISO 8601, UTC)",
                "type": "string"
              },
              "commodities": {
                "items": {
                  "properties": {
                    "commodity": {
                      "type": "string"
                    },
                    "n": {
                      "type": "integer"
                    }
                  },
                  "required": ["commodity", "n"],
                  "type": "object"
                },
                "type": "array"
              },
              "commodity": {
                "type": ["string", "null"]
              },
              "studies": {
                "items": {
                  "properties": {
                    "caution": {
                      "description": "NI 43-101's cautionary statement: a PEA using Inferred resources, or a technical report's resources; quote it with the figures",
                      "type": ["string", "null"]
                    },
                    "company": {
                      "anyOf": [
                        {
                          "properties": {
                            "exchange": {
                              "type": ["string", "null"]
                            },
                            "name": {
                              "type": "string"
                            },
                            "ticker": {
                              "type": ["string", "null"]
                            },
                            "url": {
                              "type": "string"
                            }
                          },
                          "required": ["name", "url"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "cutoff": {
                      "description": "The cut-off grade, as printed",
                      "type": ["string", "null"]
                    },
                    "date": {
                      "description": "The release's date, YYYY-MM-DD (Toronto)",
                      "type": ["string", "null"]
                    },
                    "effectiveDate": {
                      "description": "The estimate's effective date, as printed",
                      "type": ["string", "null"]
                    },
                    "figures": {
                      "items": {
                        "properties": {
                          "basis": {
                            "description": "after-tax or pre-tax, as printed",
                            "type": ["string", "null"]
                          },
                          "field": {
                            "description": "npv, irr, payback, initialCapex, sustainingCapex, aisc, cashCost, mineLife, production, throughput, recovery, stripRatio, headGrade or fcf",
                            "type": "string"
                          },
                          "label": {
                            "type": "string"
                          },
                          "period": {
                            "description": "The period the figure covers, as printed (life of mine, years 1–5…)",
                            "type": ["string", "null"]
                          },
                          "rate": {
                            "description": "The NPV's discount rate as printed",
                            "type": ["string", "null"]
                          },
                          "result": {
                            "description": "The figure in words, e.g. NPV C$1,856M (after-tax, 5%)",
                            "type": "string"
                          },
                          "unit": {
                            "description": "Its unit as printed (C$M, %, US$/oz, years…)",
                            "type": "string"
                          },
                          "value": {
                            "description": "The number as printed",
                            "type": "string"
