{
  "lockfileVersion": 2,
  "subjects": {
    "app.workfinds/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://workfinds.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "app.workfinds/jobs",
        "title": "workfinds.app",
        "version": "1.0.1",
        "websiteUrl": "https://workfinds.app/mcp",
        "icons": [
          {
            "src": "https://workfinds.app/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search open jobs on workfinds.app, collected directly from company career sites and applicant tracking systems. Use search_jobs to find jobs (filter by the country the person will work from, work arrangement, employment type and posting date), get_job for one job with its apply link, and get_company for an employer. Every result has a workfinds.app page URL: share it with the user. Listings change, so tell users to confirm details on the employer site before applying. All data is public; no sign-in.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a company",
          "description": "One employer by its id or page slug: name, number of open jobs, its workfinds.app page and, when known, its profile (industry, size, headquarters, founded, website, short description). Use search_jobs with company_id for its jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company id or slug, e.g. a job's company.id.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_.:-]{1,128}$",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "jobs_url": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "open_job_count": {
                "type": "integer"
              },
              "profile": {
                "type": ["object", "null"]
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "jobs_url", "name", "open_job_count", "profile", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18ea3df5bfa3fecfc2a8856ed9aad434e30b603213045c46b1521035c555cf05"
        },
        {
          "name": "get_job",
          "title": "Get a job",
          "description": "One job by its id or its workfinds.app job URL: title, company, location, work arrangement, employment type, the countries it accepts applicants from, salary when listed, when it was posted, whether it is still open, its apply URL on the employer site and its workfinds.app page. A closed job answers with status \"closed\" and when it closed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job": {
                "description": "The job id from search_jobs, or a https://workfinds.app/jobs/... URL.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "status": {
                "enum": ["open", "closed"],
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "The job page on workfinds.app.",
                "type": "string"
              }
            },
            "required": ["id", "status", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:778971cb678e13e3620228ce3279185846bc3849ec3b2832e18d228c3c589584"
        },
        {
          "name": "list_countries",
          "title": "List countries",
          "description": "The country codes search_jobs accepts, with their English names.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "countries": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["countries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c50b937c95b90b58e2fe959e4a68809867dc148dd54623e1168563b4c34c5ccb"
        },
        {
          "name": "list_roles",
          "title": "List role families",
          "description": "The role families search_jobs accepts as role.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "roles": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "role"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["roles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List role families"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36ef11f1d9e22c0d687088c72a4d979ebf58b19bab6eea054f8c52f7cb76bff3"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search open jobs on workfinds.app. Returns at most 50 jobs per search, in pages of 20 (pages 1 to 3), newest first unless sort is \"relevance\", each with a workfinds.app page URL, plus the total and a search_url that opens the same search on the site. Every argument is optional; combine them to narrow the search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_id": {
                "description": "Only this company's jobs: the id or page slug from get_company or a job's company.",
                "maxLength": 128,
                "pattern": "^[A-Za-z0-9_.:-]{1,128}$",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code of the country the person will work from, e.g. \"PH\". Returns jobs open to applicants from that country, worldwide remote jobs included. See list_countries.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "employment_type": {
                "description": "Any of full_time, part_time, contract, temporary, internship.",
                "items": {
                  "enum": ["full_time", "part_time", "contract", "temporary", "internship"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "page": {
                "description": "Result page, 1 to 3.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "posted_within": {
                "description": "Only jobs published within the last 24h, 3d, 7d, 14d or 30d.",
                "enum": ["24h", "3d", "7d", "14d", "30d"],
                "type": "string"
              },
              "query": {
                "description": "Words to search for: a job title, skill or company name, e.g. \"data engineer\".",
                "maxLength": 80,
                "type": "string"
              },
              "role": {
                "description": "A role family, see list_roles.",
                "enum": ["sales", "finance-accounting", "nursing", "sports-wellness"],
                "type": "string"
              },
              "salary_listed": {
                "description": "Only jobs whose employer lists a salary.",
                "type": "boolean"
              },
              "sort": {
                "description": "newest (default) or relevance (only with a query).",
                "enum": ["newest", "relevance"],
                "type": "string"
              },
              "work_arrangement": {
                "description": "Any of remote, hybrid, onsite.",
                "items": {
                  "enum": ["remote", "hybrid", "onsite"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array",
                "uniqueItems": true
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "jobs": {
                "items": {
                  "properties": {
                    "company": {
                      "properties": {
                        "id": {
                          "type": ["string", "null"]
                        },
                        "name": {
                          "type": ["string", "null"]
                        },
                        "url": {
                          "description": "The company page on workfinds.app.",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["id", "name", "url"],
                      "type": "object"
                    },
                    "eligibility": {
                      "description": "Countries people may apply from, as the employer states them.",
                      "properties": {
                        "countries": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "countries_truncated": {
                          "type": "boolean"
                        },
                        "scope": {
                          "enum": ["worldwide", "worldwide_except", "countries", "unknown"],
                          "type": "string"
                        }
                      },
                      "required": ["countries", "countries_truncated", "scope"],
                      "type": "object"
                    },
                    "employment_types": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "location": {
                      "type": "string"
                    },
                    "posted_at": {
                      "description": "ISO 8601, when the employer published it.",
                      "type": ["string", "null"]
                    },
                    "salary": {
                      "description": "As the employer lists it; null when not listed.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The job page on workfinds.app.",
                      "type": "string"
                    },
                    "work_arrangements": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["company", "eligibility", "employment_types", "id", "location", "posted_at", "salary", "title", "url", "work_arrangements"],
                  "type": "object"
                },
                "type": "array"
              },
              "page": {
                "type": "integer"
              },
              "search_url": {
                "description": "The same search on workfinds.app.",
                "type": "string"
              },
              "total": {
                "description": "Matching open jobs.",
                "type": "integer"
              },
              "total_is_lower_bound": {
                "type": "boolean"
              },
              "total_pages": {
                "type": "integer"
              }
            },
            "required": ["jobs", "page", "search_url", "total", "total_is_lower_bound", "total_pages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09ab5e1a6d9254d32c851adc8c3f42f054bb19a89506566df2aa49f3e2faab77"
        }
      ],
      "digest": "sha256:8e80fef350b0b0ff12f02c32e7e3b1579bb3a562777a90a44a9f32d02dbb8e8c"
    }
  }
}
