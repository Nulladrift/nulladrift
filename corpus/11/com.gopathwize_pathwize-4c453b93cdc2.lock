{
  "lockfileVersion": 2,
  "subjects": {
    "com.gopathwize/pathwize": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.gopathwize.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pathwize",
        "title": "Pathwize",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pathwize runs data annotation and evaluation tasks with vetted domain experts (strong in German-speaking experts). Create a task as a draft, add items, then publish only after the user confirms, because publishing emails the experts. Authenticate with a Pathwize API key (Authorization: Bearer pw_live_...).",
      "tools": [
        {
          "name": "add_items",
          "title": "Add items to an AI task",
          "description": "Add items by public URL; Pathwize copies the files into its own storage. reference: true adds them to the qualification set (optionally with gold_label for automatic scoring). Idempotent per id, up to 1000 per call.",
          "inputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "gold_label": {
                      "type": "string"
                    },
                    "id": {
                      "description": "Defaults to the file name in the URL",
                      "type": "string"
                    },
                    "mime": {
                      "description": "Defaults from the file extension",
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              },
              "reference": {
                "type": "boolean"
              },
              "taskId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["items", "taskId"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b84dca05b00ec5c21af56c5caaaf6b3ea363fa30c9e486bf5798d142ab60d34"
        },
        {
          "name": "close_task",
          "title": "Close or pause an AI task",
          "description": "closed ends the task, draft pauses it. Experts are not emailed.",
          "inputSchema": {
            "properties": {
              "status": {
                "enum": ["closed", "draft"],
                "type": "string"
              },
              "taskId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["taskId"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b02ed60115ba3bc96f787bfe992492004035f34dbe69628f3e0a1cf083566dde"
        },
        {
          "name": "create_task",
          "title": "Create an AI task (draft)",
          "description": "Create a labeling or evaluation task as a draft; nobody is notified until publish_task. Typical order: list_pools, create_task with instructions, classes, rate, pool_ids and one example image per class, add_items, then publish_task after the user confirms.",
          "inputSchema": {
            "properties": {
              "allow_cant_tell": {
                "description": "Let experts skip an item without a class (default true)",
                "type": "boolean"
              },
              "allow_note": {
                "type": "boolean"
              },
              "annotation": {
                "description": "Default classification",
                "enum": ["classification", "bounding_box", "segmentation", "attributes"],
                "type": "string"
              },
              "classes": {
                "description": "Class names experts choose from",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "deadline": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "examples": {
                "description": "Example images by public URL with the class they show. Labeling tasks need one per class before they can open.",
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "maxItems": 40,
                "type": "array"
              },
              "expertise": {
                "description": "What experts need to know, one line",
                "type": "string"
              },
              "instructions": {
                "description": "Instructions for the experts in Markdown. A table whose first column names the classes becomes the per-class briefing.",
                "type": "string"
              },
              "language": {
                "description": "Language of the instructions",
                "enum": ["en", "de"],
                "type": "string"
              },
              "members_only": {
                "description": "Only members of these pools see the task, even on public pools",
                "type": "boolean"
              },
              "multi_select": {
                "type": "boolean"
              },
              "pool_ids": {
                "description": "Pools the task runs on (see list_pools)",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "type": "array"
              },
              "qualification": {
                "properties": {
                  "days_to_complete": {
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "enabled": {
                    "type": "boolean"
                  },
                  "sample": {
                    "description": "Test items per candidate (default 50)",
                    "maximum": 1000,
                    "minimum": 5,
                    "type": "integer"
                  },
                  "scoring": {
                    "description": "auto: scored against reference labels; customer: you approve each candidate",
                    "enum": ["auto", "customer"],
                    "type": "string"
                  },
                  "threshold": {
                    "description": "Pass mark in percent",
                    "maximum": 100,
                    "minimum": 50,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "rate": {
                "description": "Hourly pay for the expert in EUR",
                "maximum": 500,
                "minimum": 5,
                "type": "number"
              },
              "seconds_per_item": {
                "maximum": 3600,
                "minimum": 1,
                "type": "integer"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Default data_labeling",
                "enum": ["data_labeling", "preference", "evaluation", "red_team", "domain"],
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a1ba97c30f3e1925087a26b556c81bec115e7c422a8844e6972a0ea9da72fb9"
        },
        {
          "name": "get_results",
          "title": "Get labeled results",
          "description": "Finished items with final label, agreement, notes and flags. Page with starting_after (the last item id).",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "type": "string"
              },
              "starting_after": {
                "type": "string"
              },
              "taskId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["taskId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:325b08181bfd169a35a2ad55e193905d069c5577cf9ec1831203bf3c6f5b5279"
        },
        {
          "name": "get_task",
          "title": "Get an AI task",
          "description": "One task with settings, classes, examples, qualification, reference item count and item counts by status.",
          "inputSchema": {
            "properties": {
              "taskId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["taskId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:73f8a9ee653583d3fabf7d011867afd712ac3e5a8411cc1c61dce62dadb2d2a1"
        },
        {
          "name": "list_pools",
          "title": "List expert pools",
          "description": "Pools a task can run on: active curated pools plus your own, with member counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:21e8b8c671fab29530c5602701e30e57e5a480f531d679992216d0af0a8b7740"
        },
        {
          "name": "list_tasks",
          "title": "List AI tasks",
          "description": "Your AI tasks, newest first, with status and item counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:586d31b7aabb0fb2be142a86daf4c2fdd121c53db7e4db3348026ef147459ba0"
        },
        {
          "name": "open_dashboard",
          "title": "Open the business dashboard, signed in",
          "description": "One-time link that opens the Pathwize business dashboard signed in as this business (optionally one task). Single use, one hour; give it only to the user.",
          "inputSchema": {
            "properties": {
              "taskId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dce5eae930cdf6de63251dade61338e182a6f1bd5e8eaabdcbf45a446fa2bb83"
        },
        {
          "name": "publish_task",
          "title": "Publish an AI task",
          "description": "Open a task for experts. This emails every expert in the task's pools once and cannot be undone, so call it only after the user explicitly confirmed, with confirm: true. Fails with a list of anything missing.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "const": true,
                "type": "boolean"
              },
              "taskId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["confirm", "taskId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8efcc297397b76ac10b64f477117c3c94a7d25866ff6f92f8531748bf7edaaaa"
        },
        {
