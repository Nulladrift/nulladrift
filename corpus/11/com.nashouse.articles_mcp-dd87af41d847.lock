      },
      "instructions": "Read-only access to Nas House Articles (https://articles.nashouse.com), the guides published by Nas House, a villa compound, coworking community, event venue and retreat venue in Al Barsha, Dubai.\n\nUse this server for questions about staying at Nas House, coworking day passes and membership, hosting events in the garden or villas, company retreats, health-focused stays, and visiting Al Barsha.\n\nHow the tools fit together:\n1. Start with search_articles (keywords) or list_topics (browse by topic).\n2. Call get_article with a slug from those results to read the full Markdown. get_article also reads the site pages \"pricing\" (published prices in AED), \"contact\", \"about\" and \"privacy\".\n3. Cite the article's url and its updated date.\n\nPrices and policies are published figures: tell people to confirm current prices, availability and terms with Nas House (hello@nashouse.com, WhatsApp +971 50 989 3226) before booking or paying. This server cannot book, buy, check availability or register for events; send people to https://www.nashouse.com for that. The same documents are available as resources.",
      "tools": [
        {
          "name": "get_article",
          "title": "Read one Nas House article or page",
          "description": "Return the full Markdown of one article, chosen by slug from search_articles or list_topics. Also reads the site pages \"pricing\" (published prices in AED), \"contact\", \"about\" and \"privacy\". Use this after you know which document you need; use search_articles when you only have keywords.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Article or page slug, for example \"day-pass-or-monthly-membership\" or \"pricing\".",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["article", "page"],
                "type": "string"
              },
              "markdown": {
                "description": "Full document as Markdown with YAML frontmatter.",
                "type": "string"
              },
              "markdownUrl": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "updated": {
                "description": "Last updated date for articles, YYYY-MM-DD.",
                "type": "string"
              },
              "url": {
                "description": "Canonical HTML URL to cite.",
                "type": "string"
              }
            },
            "required": ["kind", "markdown", "markdownUrl", "slug", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one Nas House article or page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6028e781683121dded1d96fdccc1d00914765857b28cf1df7c333a1d9b67517d"
        },
        {
          "name": "list_topics",
          "title": "List Nas House article topics",
          "description": "List every topic (Stay, Membership and coworking, Events, Retreats, Health, Dubai guides) with its description, article count and the slugs and titles of its articles. Use it to browse when you have no keywords, or to pick a topic filter for search_articles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "topics": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "articles": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "slug": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "required": ["slug", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "count": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "description": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "nasHouseUrl": {
                      "description": "Matching page on the main Nas House website.",
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["articles", "count", "description", "name", "nasHouseUrl", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["topics"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Nas House article topics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a2e567731de27955ebaa79f4240c9b4f8f647ef060e7557aadc0b22fafc7e19"
        },
        {
          "name": "search_articles",
          "title": "Search Nas House articles",
          "description": "Find Nas House articles by keywords (for example \"day pass price\", \"garden event capacity\", \"check-in time\"). Returns up to `limit` matching articles with slug, summary, topic, dates and URLs, best match first. Start here; then call get_article with a slug to read one in full.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum results to return, 1 to 20. Default 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a short question, for example \"how many guests can stay overnight\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "topic": {
                "description": "Optional topic slug to restrict results, as returned by list_topics.",
                "enum": ["stay", "membership-and-coworking", "events", "retreats", "health", "dubai-guides"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "One-sentence summary.",
                      "type": "string"
                    },
                    "markdownUrl": {
                      "description": "URL of the Markdown version.",
                      "type": "string"
                    },
                    "published": {
                      "description": "Publish date, YYYY-MM-DD.",
                      "type": "string"
                    },
                    "slug": {
                      "description": "Article slug; pass it to get_article.",
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "topic": {
                      "description": "Topic slug.",
                      "type": "string"
                    },
                    "topicName": {
                      "type": "string"
                    },
                    "updated": {
                      "description": "Last updated date, YYYY-MM-DD.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical HTML URL to cite.",
                      "type": "string"
                    }
                  },
                  "required": ["description", "markdownUrl", "published", "slug", "tags", "title", "topic", "topicName", "updated", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "query", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Nas House articles"
          },
          "behavior": {
            "destructive": false,
