        {
          "name": "search_articles",
          "title": "Search Nas House articles",
          "description": "Find Nas House articles by keywords (for example \"day pass price\", \"garden event capacity\", \"check-in time\"). Returns up to `limit` matching articles with slug, summary, tags, dates and URLs, best match first. Start here; then call get_article with a slug to read one in full.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum results to return, 1 to 20. Default 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a short question, for example \"how many guests can stay overnight\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "tag": {
                "description": "Optional tag slug to restrict results, as returned by list_tags (for example \"events\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "One-sentence summary.",
                      "type": "string"
                    },
                    "markdownUrl": {
                      "description": "URL of the Markdown version.",
                      "type": "string"
                    },
                    "published": {
                      "description": "Publish date, YYYY-MM-DD.",
                      "type": "string"
                    },
                    "slug": {
                      "description": "Article slug; pass it to get_article.",
                      "type": "string"
                    },
                    "tags": {
                      "description": "Tag names; the first is the main tag.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "updated": {
                      "description": "Last updated date, YYYY-MM-DD.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical HTML URL to cite.",
                      "type": "string"
                    }
                  },
                  "required": ["description", "markdownUrl", "published", "slug", "tags", "title", "updated", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "query", "results"],
            "type": "object"
          },
