                        "type": "object"
                      },
                      "type": "array"
                    },
                    "count": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "name": {
                      "description": "Display name.",
                      "type": "string"
                    },
                    "slug": {
                      "description": "Tag id; pass it as tag to search_articles.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Tag page on the website.",
                      "type": "string"
                    }
                  },
                  "required": ["articles", "count", "name", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["tags"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
