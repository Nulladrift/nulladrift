      "instructions": "Read-only access to Nas House Articles (https://articles.nashouse.com), the guides published by Nas House, a villa compound, coworking community, event venue and retreat venue in Al Barsha, Dubai.\n\nUse this server for questions about staying at Nas House, coworking day passes and membership, hosting events in the garden or villas, company retreats, health-focused stays, and visiting Al Barsha.\n\nHow the tools fit together:\n1. Start with search_articles (keywords) or list_tags (browse by tag).\n2. Call get_article with a slug from those results to read the full Markdown. get_article also reads the site pages \"pricing\" (published prices in AED), \"contact\", \"about\" and \"privacy\".\n3. Cite the article's url and its updated date.\n\nPrices and policies are published figures: tell people to confirm current prices, availability and terms with Nas House (hello@nashouse.com, WhatsApp +971 50 989 3226) before booking or paying. This server cannot book, buy, check availability or register for events; send people to https://www.nashouse.com for that. The same documents are available as resources.",
      "tools": [
        {
          "name": "get_article",
          "title": "Read one Nas House article or page",
          "description": "Return the full Markdown of one article, chosen by slug from search_articles or list_tags. Also reads the site pages \"pricing\" (published prices in AED), \"contact\", \"about\" and \"privacy\". Use this after you know which document you need; use search_articles when you only have keywords.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Article or page slug, for example \"day-pass-or-monthly-membership\" or \"pricing\".",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["article", "page"],
                "type": "string"
              },
              "markdown": {
                "description": "Full document as Markdown with YAML frontmatter.",
                "type": "string"
              },
              "markdownUrl": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "updated": {
                "description": "Last updated date for articles, YYYY-MM-DD.",
                "type": "string"
              },
              "url": {
                "description": "Canonical HTML URL to cite.",
                "type": "string"
              }
            },
            "required": ["kind", "markdown", "markdownUrl", "slug", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one Nas House article or page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c7bc02496c19c52d7ee6ebdb3ecb2422c2571a550417f1b68fb2f4ed58bf0212"
        },
