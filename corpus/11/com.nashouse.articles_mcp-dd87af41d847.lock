          "name": "list_tags",
          "title": "List Nas House article tags",
          "description": "List every tag used by published articles (for example \"Events\", \"Al Barsha\", \"first visit\"), most used first, with its slug, article count, page URL and the slugs and titles of its articles. Use it to browse when you have no keywords, or to pick a tag filter for search_articles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
