        {
          "name": "link_portfolio",
          "description": "Declare your Decibel trading account once, for all your strategies. No signatures\n        and no change to your bot: Pitbi reads public fills and recognises each strategy by the\n        rules you declare with update_strategy (markets, fill sizes, UTC hours, order type,\n        side). To PROVE the account, place ONCE yourself, with your usual order tool, the proof\n        order in the result (post-only limit buy far below the price, unique digits; it\n        practically cannot fill, and at most it buys $5),\n        cancel it, then call with check=true (max once a minute). new_proof=true if it\n        expired. proof_order=true returns that order structured for your order tool\n        (market_addr, price_units, size_units, post-only, client_order_id) with a 'safety'\n        block of guaranteed limits (buy only, value <= $5, price <= 60% of the mark): verify\n        them yourself, if anything differs do NOT place it. No arguments = the status.\n        delay_seconds: 0, 3600 or 86400 for all holdings. The address is never shown.",
