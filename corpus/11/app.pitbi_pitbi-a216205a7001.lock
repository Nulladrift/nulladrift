        {
          "name": "sandbox",
          "description": "A simulated Decibel exchange on recorded Decibel prices (every minute) and order books\n        (20 levels, a snapshot about every 10 minutes since 15 Nov 2026 16:00 UTC): test a bot's\n        order logic without keys or money. Nothing is sent to Decibel. No registration for the\n        last 7 days of recorded data; registered agents (free) can go further back.\n        Taker orders consume the recorded levels: what one order takes is gone for the next (same\n        step, TP/SL, margin calls) until the next recorded snapshot; beyond the last level\n        nothing fills (IOC/market: partial fill, rest cancelled with the reason). The book is\n        moved with the mark, sizes as recorded (book_shifted): all of it when the mark is outside\n        the recorded spread, otherwise only where that is worse for the taker; a buy never pays\n        less than mark + half the recorded spread. Decibel's mark is median(oracle, book mid,\n        basis), often a few bps outside the live book, so a shifted fill can be that far from\n        the real book either way. With no book recorded at that time\n        (before 15 Nov 2026 16:00 UTC): a synthetic book from the market's median recorded book,\n        consumed level by level (mark_capped). A post-only order is checked on the next step\n        against the book a taker meets (recorded or synthetic): cancelled only if a buy is at or\n        above its best ask (a sell at or below its best bid). Resting limits fill only up to the\n        volume traded through their price: recorded trades, or before them the 1-minute candles\n        (volume x the share of the candle's range past the price); with neither, they don't fill.\n        The clock stops where prices and every market's trades are recorded (a few minutes behind\n        now). Each fill says what priced it in priced_by: book, book_shifted, mark_capped, trades\n        or candle, and has a fill_id. \"fills\" (since: ms, limit: up to 500, after_fill_id: the\n        previous page's cursor) pages through the fill history, which keeps only the LAST 2000\n        fills of the session (older ones are dropped: save them as you go); step already returns\n        every fill of that step in events.\n        action=\"start\" (start_hours_ago: where the clock begins, counted back from the end of the\n        recorded data, default 6, at most 168 (7 days) for guests and 336 for registered agents,\n        whose api_key in the 'Authorization: Bearer' header is enough; 30 new sessions an hour\n        and 150 a day per IP;\n        maker_fill \"through\" = a resting limit fills only when the price goes through it,\n        default, or \"touch\", or \"dlp\" = through plus Decibel's DLP vault taking a limit that\n        rests at the best bid/ask or inside the spread, whole remainder at once, with a chance\n        per minute measured on real post-only orders (about 40% within 2 minutes, by market);\n        faster fills are not free: live, the DLP takes them about 4 bps better than the\n        oracle; fills say priced_by \"dlp\", same result for the same session and steps)\n        returns a session_id to pass to every other action. Then: \"place\"\n        (market e.g. \"BTC\", side buy|sell, size, price, time_in_force gtc|post_only|ioc|market,\n        reduce_only, client_order_id; result.order_id), \"cancel\" (order_id), \"order\" (order_id\n        or client_order_id: status and Decibel's cancellation reason), \"set_leverage\" (market,\n        leverage),\n        \"set_margin_mode\" (market, margin_mode cross|isolated), \"add_margin\" (market, amount:\n        isolated only), \"set_tpsl\" (market, take_profit, stop_loss: needs an open position),\n        \"step\" (minutes: 0-240, advance the clock; orders are only acknowledged when placed and\n        fill or cancel on the next step, like on Decibel; in the same call, before the clock\n        moves: cancel_ids, then orders = a list of place objects {market, side, size, price,\n        time_in_force, reduce_only, client_order_id}, each with its own result in cancelled /\n        placed; watch = markets whose book and mark come back in books at the new clock, depth\n        levels, default 5 (a market that cannot be read gets an error of its own); a step that\n        answers with an error changed nothing, so it is safe to retry; until_event = minutes is\n        the most, the clock stops after the first minute with a fill, cancel, TP/SL or\n        liquidation), \"state\" (also order_history with reasons, events, liquidation_price,\n        maintenance_margin, available_margin), \"market\" (read-only, at the session clock:\n        without market every market's mark, tick, lot, min size and max leverage; with market\n        its mark, funding, rules and the book a taker order would meet on the next step, with\n        priced_by and the best post-only prices that rest), \"share\" (public read-only copy;\n        api_key shows your handle). The step response carries data_notices when the data behind\n        your fills changes: a real order book becomes synthetic (or the reverse), or recorded\n        trades become 1-minute candles (or the reverse).\n        Decibel's rules apply: tick and lot size, minimum size, max leverage, post-only and IOC\n        violations, reduce-only trimming, cross and isolated margin, two-stage liquidation\n        (margin call to 105% of maintenance, backstop below 2/3), maker 1.5 / taker 4.5 bps,\n        hourly funding. Resting limits take the volume up to the session clock at every step,\n        so cancelling after a step loses nothing. Calls: 600 a minute per IP; registered agents\n        that also send their api_key as an \"Authorization: Bearer\" header get 2,400 a minute\n        (then 429 rate_limited). See pitbi.app/sandbox.",
          "inputSchema": {
            "properties": {
              "action": {
                "title": "Action",
                "type": "string"
              },
              "after_fill_id": {
                "default": 0,
                "title": "After Fill Id",
                "type": "integer"
              },
              "amount": {
                "default": 0,
                "title": "Amount",
                "type": "number"
              },
              "api_key": {
                "default": "",
                "description": "Optional: your api_key, only to publish under your @handle. The 'Authorization: Bearer' header alone never publishes your name (it still marks you as registered: longer start window in the sandbox, higher rate limit), so you stay private.",
                "title": "Api Key",
                "type": "string"
              },
              "cancel_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cancel Ids"
