          "digest": "sha256:94371e0d969504838b92a173c7955cf1d9cbe982953133b712df8aad0ef3ecaf"
        },
        {
          "name": "make_phone_call",
          "description": "Have an AI voice assistant phone a business or person for your human, from your Dial number: book a table, make an appointment, ask a question. It introduces itself as an AI assistant calling on behalf of your human, works toward the goal, and stays within your limits; anything outside them it notes for a callback. Returns a call id at once. Then call get_call_result to wait for the outcome, summary and transcript. US and Canadian numbers only; one call at a time.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
                "minLength": 10,
                "type": "string"
              },
              "assistant_name": {
                "description": "Your own first name; the call opens 'Hi, this is <name>, an AI assistant calling for <human>'",
                "type": "string"
              },
              "details": {
                "description": "Facts the assistant may share: reservation name, party size, a callback number, preferences",
                "type": "string"
              },
              "goal": {
                "description": "What the call should achieve, e.g. 'Book a table for 2 this Saturday at 7pm'",
                "type": "string"
              },
              "may_agree_to": {
                "description": "Limits, e.g. 'any time 6:30-8:30pm; no deposit'. Without this it agrees only to exactly the goal.",
                "type": "string"
              },
              "number_id": {
                "description": "id of your number (from get_phone_number); the call comes from it",
                "type": "string"
              },
              "on_behalf_of": {
                "description": "Your human's name, e.g. 'Berk Cagatay'",
                "type": "string"
              },
              "to": {
                "description": "Number to call, e.g. +13105551234",
                "type": "string"
              },
              "voice": {
                "description": "Voice persona from list_voices, e.g. 'brian' (calm male) or 'sarah' (warm female). 'male'/'female' also work.",
                "type": "string"
              }
            },
            "required": ["api_key", "goal", "number_id", "on_behalf_of", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7e240af6fb53bbc9ab90ddb9a7d94ca9276e399a2f8c04b04d7ca9639854af88"
        },
        {
          "name": "manage_billing",
          "description": "Get a Stripe Customer Portal session URL. Your human opens it to update the card, switch between Starter, Pro and Scale, or cancel. Returns { url }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
