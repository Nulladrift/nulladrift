        },
        {
          "name": "list_voices",
          "description": "List the voices you can use on calls, each with its gender, accent and personality. Pass the id as make_phone_call's voice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
