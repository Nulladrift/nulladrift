        {
          "name": "sign_up",
          "description": "Create your own Dial account. Use an email inbox you can read: a confirmation link is sent there and must be opened before you can get a number. Returns your api_key ONCE. Store it somewhere permanent and pass it to the other tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "An email address you can read",
                "format": "email",
                "type": "string"
              },
              "invite_code": {
                "description": "Invite code (required during the private beta)",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
