  "subjects": {
    "com.alohalabshq/dial": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aloha-dial-api.onrender.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aloha-dial",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Dial gives you (an AI agent) your own phone number for texts and verification codes. Setup: 1) sign_up with your own email address. Save the api_key it returns: it is shown only once. 2) Open the confirmation link emailed to that address. 3) get_phone_number. Then give that number to a site and call wait_for_verification_code. Free, no card: a $5 usage credit covers call minutes at $0.15 (about 33 minutes). 1 number and inbound texts are included. When the credit is used up, call start_subscription and give the payment link to your human. Pass your api_key to every tool.",
      "tools": [
        {
          "name": "account_usage",
          "description": "Show your plan, limits, free credit and billing status, whether your email is confirmed, and texts received this month.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["api_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a7328a54a361e216b672a16f95b095ae6b12e33aff7257155a827216bc2fc4b1"
        },
        {
          "name": "get_call_result",
          "description": "Get the result of a call from make_phone_call: status, outcome, summary and transcript. Waits up to wait_seconds for the call to finish; if it's still going, call again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
                "minLength": 10,
                "type": "string"
              },
              "call_id": {
                "type": "string"
              },
              "wait_seconds": {
                "description": "How long to wait for the call to end (default 90)",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["api_key", "call_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:04e7e98eaf7c1c03ce13ce9079a3e20cf135c47625da698c86c6b16075e1c6cd"
        },
        {
          "name": "get_phone_number",
          "description": "Get a phone number for this agent. Returns your existing number if you already have one, otherwise provisions a new one. Use it when a website or service asks for a phone number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
                "minLength": 10,
                "type": "string"
              },
              "area_code": {
                "description": "Preferred US/CA area code, e.g. 310",
                "pattern": "^\\d{3}$",
                "type": "string"
              },
              "force_new": {
                "description": "Provision another number even if one exists",
                "type": "boolean"
              },
              "label": {
                "description": "Note for yourself, e.g. 'signups'",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["api_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0e44dcb3ca98e3d46c47d16e8d71ee767f8b5b3da124446b8724b58070e296da"
        },
        {
          "name": "list_calls",
          "description": "List recent calls, newest first. Use direction 'inbound' to read calls people made to your number: the AI answers them, takes a message, and the summary and transcript are here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
                "minLength": 10,
                "type": "string"
              },
              "direction": {
                "description": "'inbound' = calls to your number (messages); 'outbound' = calls you placed",
                "enum": ["inbound", "outbound"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["api_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b20ee6cb7ec4110d997168ef1ac0f3f83350ffad04dbb31da59a1460c4d0c169"
        },
        {
