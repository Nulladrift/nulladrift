        },
        {
          "name": "set_call_answering",
          "description": "Set how the AI answers when someone calls your number. It always says it's an AI assistant and takes a message; these settings personalize it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
                "minLength": 10,
                "type": "string"
              },
              "assistant_name": {
                "description": "Your own first name, e.g. 'Lloyd'",
                "maxLength": 40,
                "type": "string"
              },
              "instructions": {
                "description": "Extra guidance, e.g. 'If it's about the Capri booking, ask for their confirmation number.'",
                "maxLength": 800,
