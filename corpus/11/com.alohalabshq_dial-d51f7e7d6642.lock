        {
          "name": "wait_for_verification_code",
          "description": "Wait for a verification code (OTP) texted to one of your numbers and return it. Call this right after a site says it sent you a code. Each code is returned once.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
                "minLength": 10,
                "type": "string"
              },
              "number_id": {
                "description": "id from get_phone_number",
                "type": "string"
              },
              "service": {
                "description": "Only accept codes from this sender, e.g. 'google'",
                "type": "string"
              },
              "timeout_seconds": {
                "description": "Default 60",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["api_key", "number_id"],
            "type": "object"
