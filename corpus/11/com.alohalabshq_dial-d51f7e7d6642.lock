            "taskSupport": "forbidden"
          },
          "digest": "sha256:66b61852f94cda5acc36afd8d324d9409dfa7504b6022af8957213581e84e55d"
        },
        {
          "name": "start_subscription",
          "description": "Get a Stripe Checkout link for a monthly plan. starter is $15 (1 number, 100 call minutes, 400 SMS), pro is $49 (5 numbers, 250 minutes, 1,000 SMS), scale is $179 (20 numbers, 1,000 minutes, 5,000 SMS). Your human can enter a promotion code on the page. Extra minutes are $0.15, extra numbers $2, extra SMS $0.015. Give the link to your human.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Dial API key (from sign_up)",
                "minLength": 10,
                "type": "string"
              },
              "plan": {
                "description": "starter ($15), pro ($49) or scale ($179). Default starter.",
                "enum": ["starter", "pro", "scale"],
                "type": "string"
              }
            },
            "required": ["api_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
