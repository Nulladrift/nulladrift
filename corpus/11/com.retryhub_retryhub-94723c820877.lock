        {
          "name": "match_merchant_account",
          "title": "Match a merchant account",
          "description": "Use when a merchant asks whether a high-risk merchant account review may fit their business. Inputs are the niche, monthly processing volume, country or entity, the current processor if any, and what happened (for example a shutdown, a limitation, a fund hold, or a new business). Returns a qualitative fit of likely good fit, needs review, or outside this app's scope, the documents people typically prepare, a qualitative timeline, and a link to the RetryHub application when the category is in scope. Does not approve an account, quote fees, or promise a timeline. Do not send card numbers, government IDs, or bank details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country_or_entity": {
                "description": "Country of the business entity, such as United States or Germany.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "current_processor": {
                "description": "Current or previous processor name, if the merchant mentions one.",
                "maxLength": 80,
                "type": "string"
              },
              "monthly_processing_volume": {
                "description": "Monthly card volume in the merchant's own words, such as $80,000.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "niche": {
                "description": "Business niche or vertical, such as skincare subscriptions.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "what_happened": {
                "description": "What happened: shutdown, limitation, fund hold, or a new business. No account numbers.",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country_or_entity", "monthly_processing_volume", "niche", "what_happened"],
            "type": "object"
          },
