        {
          "name": "build_shutdown_checklist",
          "title": "Build a shutdown checklist",
          "description": "Use when a merchant asks what to do after a Stripe, PayPal, or Shopify Payments shutdown, limitation, account review, or fund hold. Returns a practical checklist: what to save, how to answer the processor, how reserves and holds work in general, how to keep legitimate sales from stalling, and a backup-processor step that links to RetryHub when the situation is in scope. This is not legal advice and it does not predict when held funds will be released. Do not send card numbers, government IDs, or bank details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "notes": {
                "description": "Optional short context. Do not include names, emails, card numbers, or government IDs.",
                "maxLength": 500,
                "type": "string"
              },
              "processor": {
                "description": "The processor involved. Use other when it is not Stripe, PayPal, or Shopify Payments.",
                "enum": ["stripe", "paypal", "shopify_payments", "other"],
                "type": "string"
              },
              "situation": {
                "description": "What the merchant is dealing with.",
                "enum": ["shutdown", "fund_hold", "limitation", "account_review", "other"],
                "type": "string"
              },
              "still_selling": {
                "description": "True when checkout is still taking orders.",
                "type": "boolean"
              }
            },
            "required": ["processor", "situation"],
            "type": "object"
          },
          "outputSchema": {
