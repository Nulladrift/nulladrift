        {
          "name": "start_application",
          "title": "Start a RetryHub application",
          "description": "Send the merchant's application request to the RetryHub team so they can follow up. This is the only tool that sends data. Before calling it you MUST: (1) ask whether the merchant wants RetryHub to contact them about an application; (2) collect only name, business name, email, an optional Telegram handle, monthly card volume, the current processor, and what happened (shutdown, hold, or other); (3) show the merchant every value you will send, exactly as you will send it; (4) get an explicit yes in chat. Set consent and user_confirmed to true only after that yes; otherwise the server rejects the request. Never include SSNs or tax IDs, bank account, routing, or IBAN numbers, card numbers, passwords, or ID documents, and do not add other fields. If sending is not available, the result gives the application link and the Telegram bot instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "Business name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "consent": {
                "description": "True only if the merchant explicitly agreed in chat to send these details to RetryHub and be contacted.",
                "type": "boolean"
              },
              "current_processor": {
                "description": "Current or previous processor, such as Stripe.",
                "maxLength": 80,
                "type": "string"
              },
              "email": {
                "description": "Contact email for the follow-up.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "monthly_volume": {
                "description": "Monthly card volume in the merchant's words, such as $80,000 or 80k.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Contact name.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "telegram": {
                "description": "Optional Telegram username, such as @shopowner.",
                "maxLength": 33,
                "type": "string"
              },
              "user_confirmed": {
                "description": "True only after you showed the merchant every value below and they confirmed it is correct.",
                "type": "boolean"
              },
              "what_happened": {
                "description": "shutdown, hold (fund hold or limitation), or other.",
                "enum": ["shutdown", "hold", "other"],
                "type": "string"
              }
            },
            "required": ["business", "consent", "email", "monthly_volume", "name", "user_confirmed", "what_happened"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "apply_url": {
                "type": "string"
              },
              "error": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "product": {
                "const": "retryhub",
                "type": "string"
              },
              "reference": {
                "type": ["string", "null"]
              },
              "sent_fields": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "const": "chatgpt_app",
                "type": "string"
              },
              "status": {
                "enum": ["submitted", "consent_required", "sensitive_data_rejected", "invalid_input", "not_configured", "intake_unavailable"],
                "type": "string"
              },
              "submitted": {
                "type": "boolean"
              },
              "telegram_url": {
                "type": "string"
              }
            },
            "required": ["apply_url", "error", "message", "ok", "product", "reference", "sent_fields", "source", "status", "submitted", "telegram_url"],
            "type": "object"
          },
