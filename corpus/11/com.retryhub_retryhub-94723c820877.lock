        {
          "name": "compare_processor_fit",
          "title": "Compare processor fit",
          "description": "Use when a merchant asks whether to stay with their current processor (such as Stripe, PayPal, Shopify Payments, or Square) or move to a high-risk merchant account. Inputs are the current processor, the niche, and the current situation. Returns a qualitative side-by-side on onboarding, category tolerance, account stability, reserves, paperwork, pricing approach, and disputes, with a plain-language reading of which path to look at first. Gives no fee numbers or approval odds and is not financial advice. Do not send card numbers, government IDs, or bank details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "current_processor": {
                "description": "The processor the merchant uses now. Use none for a business that has not processed yet.",
                "enum": ["stripe", "paypal", "shopify_payments", "square", "other", "none"],
                "type": "string"
              },
              "niche": {
                "description": "Business niche, such as supplement subscriptions.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "situation": {
                "description": "How things stand with the current processor.",
                "enum": ["running_fine", "worried_about_shutdown", "shutdown", "fund_hold", "limitation", "new_business"],
                "type": "string"
              }
            },
            "required": ["current_processor", "niche", "situation"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cta": {
                "additionalProperties": false,
                "properties": {
                  "apply_label": {
                    "type": "string"
                  },
                  "apply_url": {
                    "type": "string"
                  },
                  "body": {
                    "type": "string"
                  },
                  "heading": {
                    "type": "string"
                  },
                  "show": {
                    "type": "boolean"
                  },
                  "telegram_label": {
                    "type": "string"
                  },
                  "telegram_url": {
                    "type": "string"
