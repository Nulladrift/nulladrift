        {
          "name": "check_dispute_ratio",
          "title": "Check a dispute ratio",
          "description": "Use when a merchant gives a monthly transaction count and dispute count, or pastes a short summary of those figures, and wants the dispute ratio. Computes disputes divided by transactions, explains how that simple ratio differs from Visa VAMP and Mastercard ECM, and summarizes publicly described monitoring thresholds with source links. Suggests ordinary operational fixes. Does not determine whether a card network has identified the business, and it is not legal or financial advice. Do not send card numbers or other account credentials.",
