      "instructions": "RetryHub is a read-only assistant for merchant-account preparation. It has eight tools: match_merchant_account, build_shutdown_checklist, check_dispute_ratio, build_application_checklist, start_application_handoff, compare_processor_fit, check_policy_readiness, and start_application. Call a tool only when the user is asking for that kind of help. start_application is the only tool that sends data. Call it only after the user asked to apply or be contacted, you showed them every field you will send, and they explicitly agreed in chat. The tools do not approve accounts, set prices or fees, or give legal, financial, or underwriting advice. Never put payment card numbers, government identifiers, bank account numbers, or passwords into tool arguments. If the user includes them, ask them to remove that data and resend only the business facts. Results already include a disclaimer. Do not add approval odds, fees, or day-count timelines that the tool did not return.",
      "tools": [
        {
          "name": "build_application_checklist",
          "title": "Build an application checklist",
          "description": "Use when a merchant asks what documents to prepare before applying for a high-risk merchant account. Inputs are the business type, the country or entity, and the processing history (new business, processing now, recently shut down, or under a fund hold or limitation). Returns a document checklist tailored to those answers, a list of things never to paste into the chat, and a link to the RetryHub application. Describes documents by type only. Does not collect or review documents, approve an account, or quote fees. Do not send card numbers, government IDs, or bank details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_type": {
                "description": "Business type or niche, such as supplement subscriptions or online coaching.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "country_or_entity": {
                "description": "Country of the business entity, such as United States or Germany.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "processing_history": {
                "description": "Whether the business is new, processing now, recently shut down, or under a hold or limitation.",
                "enum": ["new_business", "processing_now", "recently_shut_down", "fund_hold_or_limitation"],
                "type": "string"
