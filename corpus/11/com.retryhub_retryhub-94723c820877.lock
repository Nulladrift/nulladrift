        {
          "name": "check_policy_readiness",
          "title": "Check policy readiness",
          "description": "Use when a merchant pastes the refund, cancellation, shipping, or terms text from their website and asks whether it is ready for a merchant account review. Inputs are the business type, the pasted policy text, and optionally whether they sell subscriptions, how they deliver (physical goods, digital or service, or both), and their card statement descriptor. Returns a found or missing result for the gaps reviewers commonly ask about (refund policy and window, how to cancel, renewal terms, delivery or access timing, contact method, descriptor) with a suggested fix for each. It is a keyword check, not a legal review, and it does not approve an account. The pasted text is not stored or repeated back. Do not include customer names, order details, card numbers, or bank details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_type": {
                "description": "Business type or niche, such as supplement subscriptions or online coaching.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "delivery_model": {
                "description": "How customers receive what they buy. Leave unset if unknown.",
                "enum": ["physical_goods", "digital_or_service", "both"],
                "type": "string"
              },
              "policy_text": {
                "description": "Refund, cancellation, shipping, or terms text pasted from the merchant's own site. No customer names or order details.",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "sells_subscriptions": {
                "description": "True when the business bills customers on a recurring basis. Leave unset if unknown.",
                "type": "boolean"
              },
              "statement_descriptor": {
                "description": "The name that appears on the customer's card statement, if the merchant knows it.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["business_type", "policy_text"],
            "type": "object"
          },
          "outputSchema": {
