      },
      "tools": [
        {
          "name": "lookup_word",
          "title": "Lookup Word",
          "description": "新华字典/汉语词语查询。输入单个汉字（如'龙'）返回拼音、笔画数、部首、释义、笔顺编号与可读笔顺（横/竖/撇/点/折）；输入词语或成语（如'画蛇添足'、'天气'、'一帆风顺'）返回该词条释义（成语附拼音与出处），并逐字拆解返回每个字的拼音/笔画/部首；库内含约1.5万汉字、26万条词语、3万条成语。detail=false 可关闭逐字拆解。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "default": true,
                "description": "是否逐字拆解返回单字信息，默认 True",
                "type": "boolean"
              },
              "query": {
                "description": "单个汉字或词语/成语，如 龙、画蛇添足、天气、一帆风顺",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:b7486ecf25b2a3a2de15c1c88a29947c8c23d3ebf02b1c83e13880f1098c93e3"
        },
        {
          "name": "search_char",
          "title": "Search Char",
          "description": "按拼音、释义关键词或部首检索汉字列表。拼音带不带声调均可：keyword='long' 或 'lóng' 查拼音为 long 的字（龙/隆/笼等）；keyword='木' 查部首为木或释义含木的字；keyword='常绿乔木' 按释义检索。返回汉字列表（含拼音、笔画、部首、笔顺）。limit 默认20（1-100）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keyword": {
                "description": "拼音（long / lóng）、释义关键词或部首",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "返回条数，1-100，默认 20",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:9d676e2ae200a251dec5b6e7e762e14935f9e8d4a548b1673c8b416ab5599f97"
        }
      ],
      "digest": "sha256:200a3042d3753ee8aab42288386fa6d6a2fe198fb01b30aea8ed76ec94bae1ce"
    }
