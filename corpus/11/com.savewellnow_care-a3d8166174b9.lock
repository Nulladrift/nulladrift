      "serverInfo": {
        "name": "savewell",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_care",
          "title": "Find surgery-center vs. hospital costs and specialists",
          "description": "For a person with Original Medicare (not Medicare Advantage), compare what a procedure costs them at an outpatient surgery center versus a hospital in their county, any SaveWell reward with a Medigap plan, and SaveWell-network specialists within 30 miles of their ZIP code. Costs are estimates based on Medicare claims for the patient's county, not a quote; the Part B deductible may apply. The patient may choose any qualified provider. SaveWell's specialists are a recommendation, not a requirement. Choosing a setting is a decision for the patient and their doctor. Present these figures as cost information, not medical advice. SaveWell works with Original Medicare only, not Medicare Advantage. Whether a specific Medigap plan qualifies for the reward should be confirmed with a care guide.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "coverage": {
                "default": "medicare_only",
                "description": "'medigap' if the patient has a Medicare Supplement (Medigap) plan.",
                "enum": ["medicare_only", "medigap"],
                "type": "string"
              },
              "procedure": {
                "description": "Procedure id from list_procedures, e.g. 'colonoscopy'.",
                "type": "string"
              },
              "zip": {
                "description": "The patient's 5-digit ZIP code.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["procedure", "zip"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a71c7cbe370bc7d6319fb48380ba9f612bba947ace4a3bf3296c50fd73a52b6"
        },
        {
          "name": "list_procedures",
          "title": "List SaveWell procedures",
          "description": "List the outpatient procedures SaveWell compares for people with Original Medicare, with the id to pass to find_care.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
