      "instructions": "ClaraConverts puts Clara on a website: an AI agent that visitors talk to, out loud or by text, and that talks back like a person, in English, German, Spanish, French, Italian, Portuguese, Hindi, Japanese, Chinese, or Arabic. Clara reads the business's own site, answers visitors' questions from it, and turns visitors into customers by guiding them to what the business wants: booking or buying via the site's connected tools, signing up, or leaving their contact details. She works 24/7, with no staff in the loop. Installs on any website with one line of code. Free trial, no card needed. No API key or credential is needed to connect to this server, or to call get_pricing, list_integrations, or create_trial_tenant — those three need nothing. ClaraConverts also has a web dashboard called Studio — captured leads, conversation history, analytics, and every setting these tools expose live there, but no tool here reads it; that data is intentionally human-only. To install Clara: (1) create_trial_tenant with the site owner's real, monitored email, not an invented or reused one — it's the only way they receive their Studio login link and trial-expiry reminders; never construct or guess that URL yourself. Returns a secret_key needed for every later step (never for connecting, or for create_trial_tenant itself), the embed snippet, and an optional agents_txt_snippet for the site's own /agents.txt. (2) refresh_site_knowledge once, since trials skip the crawl at creation and Clara knows nothing about the business until this runs — or, if the site isn't published yet, set_site_knowledge with its pages' content so Clara can be tested before launch. (3) update_tenant_settings / configure_integration as needed — get_tenant_settings reads back current settings and connected integrations anytime, e.g. to confirm a change took. (4) get_upgrade_link when ready to go paid. Send secret_key as an \"Authorization: Bearer <secret_key>\" header if you can, otherwise pass it as each tool's own secret_key argument.",
      "tools": [
        {
          "name": "configure_integration",
          "title": "Configure Integration",
          "description": "Connect an integration from list_integrations to your trial tenant. For API-key providers, pass api_key and any required config fields and it connects immediately (for Cal.com, event_type_id is an id from list_calcom_event_types — every other provider's config fields are typed directly from that provider's own dashboard). For OAuth providers (Shopify, HubSpot, Google Calendar, Square, ...), returns a connect_url a human must open and approve — it can't be completed headlessly. Requires the secret_key from create_trial_tenant, either as the secret_key argument or an \"Authorization: Bearer <secret_key>\" header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "The provider's API key/token, for API-key-based providers.",
                "type": "string"
              },
              "config": {
                "description": "Provider-specific config fields (see the provider's configFields — e.g. Cal.com needs event_type_id).",
                "type": "object"
              },
              "provider": {
                "description": "The integration name from list_integrations, e.g. \"calcom\".",
                "type": "string"
              },
              "secret_key": {
                "description": "The secret_key returned by create_trial_tenant, if your client can't send it as an \"Authorization: Bearer <secret_key>\" header instead.",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Configure Integration"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:662e19f64e3e9da57df0219cf080230d0f06c3ec12c9eab3a473a3887801f492"
        },
        {
          "name": "create_trial_tenant",
          "title": "Create Free Trial",
          "description": "Create a free, no-card ClaraConverts trial for a website, with every Pro feature (voice conversations included). Returns a working embed snippet and a bearer token for follow-up calls (get_embed_snippet, get_upgrade_link). Trial lasts 30 days. One live trial per owner_email — provisioning multiple sites (e.g. for an agency's clients) isn't supported by these tools yet; each site needs its own contact email for now.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conversion_goal": {
                "description": "Optional: what Clara should drive (e.g. \"book a demo\", \"capture a lead\").",
                "type": "string"
              },
              "display_name": {
                "description": "Optional display name for the business.",
                "type": "string"
              },
              "owner_email": {
                "description": "The site owner's real, monitored email (required). The Studio login link and trial-expiry reminders go only to this address.",
                "type": "string"
              },
              "site_url": {
                "description": "URL of the site Clara will be installed on (required).",
                "type": "string"
              }
            },
            "required": ["owner_email", "site_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Free Trial"
          },
          "behavior": {
            "destructive": false,
