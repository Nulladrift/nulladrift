            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:928b8eb81e5237032d3b957939e030497930599916a3662ef1765994db0b16d3"
        },
        {
          "name": "update_tenant_settings",
          "title": "Update Tenant Settings",
          "description": "Update your trial tenant's persona and widget settings (name, goal, branding, position, lead notification email). Only the fields you pass are changed. Requires the secret_key from create_trial_tenant, either as the secret_key argument or an \"Authorization: Bearer <secret_key>\" header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand_color": {
                "description": "Hex color, e.g. \"#0b5ed7\".",
                "type": "string"
              },
              "chatbot_avatar_url": {
                "description": "URL of a custom avatar image for the widget.",
                "type": "string"
              },
              "chatbot_name": {
                "description": "Override the AI's name (defaults to \"Clara\").",
                "type": "string"
              },
              "conversion_goal": {
                "description": "What Clara should drive (e.g. \"book a demo\", \"capture a lead\").",
                "type": "string"
              },
              "display_name": {
                "description": "Business/display name shown in the widget chrome.",
                "type": "string"
              },
              "language": {
                "description": "\"auto\" detects from the visitor's browser, or pin a fixed language.",
                "enum": ["auto", "en-us", "en-gb", "es-es", "es-419", "fr", "it", "pt", "hi", "ja", "zh", "de", "ar"],
                "type": "string"
              },
              "lead_destination": {
                "description": "Email address captured leads are sent to.",
                "type": "string"
              },
              "outbound_webhook": {
                "description": "Optional webhook URL for lead notifications (Zapier/Make/etc.).",
                "type": "string"
              },
              "secret_key": {
                "description": "The secret_key returned by create_trial_tenant, if your client can't send it as an \"Authorization: Bearer <secret_key>\" header instead.",
                "type": "string"
              },
              "site_url": {
                "description": "The site Clara is installed on.",
                "type": "string"
              },
              "voice_id": {
                "description": "The voice Clara speaks in (a Pro feature; every trial is Pro).",
                "type": "string"
              },
              "widget_position": {
                "description": "Where the widget bubble docks.",
                "enum": ["top_left", "top_center", "top_right", "middle_left", "middle_center", "middle_right", "bottom_left", "bottom_center", "bottom_right"],
                "type": "string"
              }
            },
            "type": "object"
