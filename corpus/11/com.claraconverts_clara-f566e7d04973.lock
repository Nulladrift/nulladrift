        },
        {
          "name": "set_site_knowledge",
          "title": "Set Site Knowledge",
          "description": "Give Clara the site's content directly, for a site that isn't published yet (localhost, a preview URL, or still being built) so you can test Clara answering real questions before launch. Pass each page's text, markdown, or HTML. Replaces what Clara currently knows about the site; once the site is live, refresh_site_knowledge crawls it and replaces this. Requires the secret_key from create_trial_tenant, either as the secret_key argument or an \"Authorization: Bearer <secret_key>\" header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pages": {
                "description": "The site's pages (at most 300).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "description": "The page's content as text, markdown, or HTML (required).",
                      "type": "string"
                    },
                    "title": {
                      "description": "Optional page title.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The page's URL or path on the site, e.g. \"/\" or \"/menu\".",
                      "type": "string"
                    }
                  },
                  "required": ["content"],
                  "type": "object"
                },
                "type": "array"
              },
              "secret_key": {
                "description": "The secret_key returned by create_trial_tenant, if your client can't send it as an \"Authorization: Bearer <secret_key>\" header instead.",
                "type": "string"
              }
            },
            "required": ["pages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
