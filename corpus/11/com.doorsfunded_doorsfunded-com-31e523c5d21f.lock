{
  "lockfileVersion": 2,
  "subjects": {
    "com.doorsfunded/doorsfunded-com": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://doorsfunded.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "doors-funded",
        "title": "Doors Funded",
        "version": "1.0.0",
        "websiteUrl": "https://doorsfunded.com/lenders/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Published terms of 13 investor lenders for 1-4 unit non-owner-occupied rentals, flips and new builds, each sourced and dated, plus the Doors Funded programs (arranged by Janover Capital LLC, which is not a lender). Use match_deal for \"which lenders fit my deal\", get_lender_terms or compare_lenders for specifics, dscr_check for the ratio. Give the user the page links, and the send_this_deal link when they want a real answer on a deal. Nothing here is a quote.",
      "tools": [
        {
          "name": "compare_lenders",
          "title": "Compare two lenders",
          "description": "Two investor lenders' published terms side by side, with the link to the full head-to-head page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "Lender slug",
                "enum": ["kiavi", "lima-one", "rcn-capital", "visio-lending", "lendingone", "easy-street-capital", "corevest", "new-silver", "angel-oak", "griffin-funding", "dominion-financial", "temple-view-capital", "asset-based-lending"],
                "type": "string"
              },
              "b": {
                "description": "Lender slug",
                "enum": ["kiavi", "lima-one", "rcn-capital", "visio-lending", "lendingone", "easy-street-capital", "corevest", "new-silver", "angel-oak", "griffin-funding", "dominion-financial", "temple-view-capital", "asset-based-lending"],
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78c39fb807b1eeb10f166ae17b8673b54f9d6040bf50084186fb229f90ba8f64"
        },
        {
          "name": "dscr_check",
          "title": "Work out a DSCR",
          "description": "Debt service coverage ratio on a rental: monthly rent divided by principal, interest, taxes, insurance and HOA. Also the largest loan the rent supports at 1.05x and the rent needed. The rate is whatever you pass; it is not an offered rate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hoa": {
                "description": "Monthly HOA, default 0",
                "minimum": 0,
                "type": "number"
              },
              "insurance": {
                "description": "Annual insurance",
                "minimum": 0,
                "type": "number"
              },
              "ltv": {
                "description": "Loan-to-value %, default 80",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "price": {
                "description": "Purchase price or value",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "rate": {
                "description": "Note rate %, e.g. 7.25",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "rent": {
                "description": "Monthly rent",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "target": {
                "description": "DSCR to size against, default 1.05",
                "exclusiveMinimum": 0,
                "maximum": 5,
                "type": "number"
              },
              "taxes": {
                "description": "Annual property tax",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["insurance", "price", "rate", "rent", "taxes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ffe29c7f7febff00a8d83c03450d1330305cad6061e0ce54811c2e18b61a5d67"
        },
        {
          "name": "get_lender_terms",
          "title": "Get one lender's published terms",
          "description": "One investor lender's published DSCR, fix and flip, construction and portfolio terms, as sourced text and as numbers, with the source URLs and the date they were read. Slugs: kiavi, lima-one, rcn-capital, visio-lending, lendingone, easy-street-capital, corevest, new-silver, angel-oak, griffin-funding, dominion-financial, temple-view-capital, asset-based-lending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Lender slug",
                "enum": ["kiavi", "lima-one", "rcn-capital", "visio-lending", "lendingone", "easy-street-capital", "corevest", "new-silver", "angel-oak", "griffin-funding", "dominion-financial", "temple-view-capital", "asset-based-lending"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b3a24e9bb9e44fcdd4da9e224cbbcef340b5f587629664e5d0742ab30e77455"
        },
        {
          "name": "match_deal",
          "title": "Match a deal to investor lenders",
          "description": "Check a 1-4 unit investment property deal (business-purpose, borrower is an LLC or corporation) against the published limits of 13 investor lenders (Kiavi, Lima One, RCN Capital, Visio, LendingOne, Easy Street, CoreVest, New Silver, Angel Oak, Griffin Funding, Dominion Financial, Temple View, Asset Based Lending) and the Doors Funded programs. Returns each lender grouped by fit, with the limit that fails or the term to ask about, plus a link that sends the deal to Doors Funded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arv": {
                "description": "After-repair value (flips)",
                "minimum": 1,
                "type": "number"
              },
              "builds": {
                "description": "Ground-up builds completed",
                "minimum": 0,
                "type": "integer"
              },
              "dscr": {
                "description": "Debt service coverage ratio, e.g. 1.15 (use dscr_check to work it out)",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "fico": {
                "description": "Middle credit score",
                "maximum": 850,
                "minimum": 300,
                "type": "number"
              },
              "flips": {
                "description": "Flips completed in the last 3 years",
                "minimum": 0,
                "type": "integer"
              },
              "foreign_national": {
                "description": "Borrower has no US citizenship or green card",
                "type": "boolean"
              },
              "loan": {
                "description": "Loan amount in dollars",
                "minimum": 1,
                "type": "number"
              },
              "prod": {
                "description": "Loan type: DSCR rental, fix and flip, ground-up construction, or rental portfolio (blanket)",
                "enum": ["dscr", "flip", "construction", "portfolio"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code of the property, e.g. \"TX\" (50 states and DC)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "str": {
                "description": "Short-term (nightly) rental",
                "type": "boolean"
              },
              "units": {
                "description": "Units, 1 to 4 (5+ unit property is not covered here)",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "value": {
                "description": "Purchase price or value (DSCR loans)",
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["prod", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b75885dbfa1030cec8ebad9cb9789305bcd1f5eddb199b1782a88f41ae1909f"
        }
      ],
      "digest": "sha256:718a1063e18da3c56561e3fb427c056e641aa323171c825f3a0dd489ceb2fa14"
    }
  }
}
