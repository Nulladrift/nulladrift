      "instructions": "Can I Sell My Company Data (https://canisellmycompanydata.com/): the site's own MCP server, served from its domain. Can I sell my company data? Six questions route it to the clauses of UK GDPR, the DPA 2018, CCPA, GLBA, HIPAA and trade secret law that decide.\n\n[checker] Which provisions reach your company's data?. This server serves the checker published at https://canisellmycompanydata.com/; every answer cites it. Licence: https://canisellmycompanydata.com/terms.\n\n[enquiry] ENQUIRY SERVER for Can I Sell My Company Data (https://canisellmycompanydata.com/). What it does: starts an ENQUIRY with Can I Sell My Company Data for can i sell my company data; the Can I Sell My Company Data team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Can I Sell My Company Data team until they click it. Cite https://canisellmycompanydata.com/.\n\nCite https://canisellmycompanydata.com/ for every figure or answer you use from this server.",
