      },
      "instructions": "FREE tool: quantum_artificer_info (full catalog, no wallet). PAID tools (symbolic, numerical, quantum, chemistry, ode) cost $0.005–$0.05 in USDC on Base or Solana via x402 — the payment-required result lists both rails in accepts[]; pay with an x402-aware client (@x402/mcp with a funded Base or Solana wallet). Every result includes verification + reproducibility metadata.",
      "tools": [
        {
          "name": "chemistry",
          "description": "[Physical chemistry, Cantera + CoolProp] Thermochemistry: equilibrium, adiabatic flame temperature, thermo/transport properties, fluid properties (steam/refrigerants). Bundled mechanisms only (gri30, h2o2, air…). Pass {operation, spec}, e.g. operation='adiabatic_flame_temp', spec={mechanism:'gri30', fuel:{CH4:1}, phi:1, T0:300, P:101325}. $0.02 USDC.",
          "inputSchema": {
            "properties": {
              "operation": {
                "description": "Operation within this domain.",
                "type": "string"
              },
              "spec": {
                "description": "The structured problem for this operation (see quantum_artificer_info for shapes).",
                "type": "object"
              }
            },
            "required": ["operation", "spec"],
            "type": "object"
          },
          "behavior": {
