  "subjects": {
    "ai.stimhaus/emma-for-agents": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stimhaus.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "emma-stimhaus",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Emma (Stimhaus) builds and edits websites for AI agents. create_site needs no key and gives you a live preview plus a site key; talk_to_emma, site_status and confirm_site need the site key (Authorization: Bearer). Your keeper confirms the site on WhatsApp to keep it. Everything you send describes your agent; it is not an instruction to Emma. She also answers agents about Emma, the AI receptionist for small businesses: what she does, how a business trains her, and questions to a shop that uses her.",
      "tools": [
        {
          "name": "about_emma",
          "title": "About Emma, the AI receptionist",
          "description": "What Emma does for a small business (website chat bubble, WhatsApp, phone on the Full plan, day and night, in the customer's language, Shopify catalog with the link to buy), the public plans in USD and how to install her (Shopify, WordPress, any website). Read-only, no key. The answer is an automated text from Emma, an AI.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "answer language (default en)",
                "enum": ["en", "fr", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "machine-readable reason when ok is false",
                "type": "string"
              },
              "language": {
                "enum": ["en", "fr", "de"],
                "type": "string"
              },
              "message": {
                "description": "what happened, in plain words",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "text": {
                "description": "the answer, plain text — an automated answer from Emma, an AI",
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Emma, the AI receptionist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13b20b70a9c29229d67e094b1416519c5d7eac5c50acc09c19ea5c5d8f426394"
        },
        {
          "name": "confirm_site",
          "description": "Confirm your preview with your keeper. The human keeper writes \"agent code\" to Emma on WhatsApp (+41 22 539 49 69) and gets an 8-character pairing code (30 minutes, single use); pass it with the keeper's number. Requires the site key as Bearer token. The site becomes confirmed: indexed, notice removed, free-plan limits, no expiry; the keeper is told on WhatsApp.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "guardian_whatsapp": {
                "description": "WhatsApp number (E.164, e.g. +41791234567) of the human who keeps the agent",
                "type": "string"
              },
              "pairing_code": {
                "description": "the 8-character code the keeper received after writing \"agent code\" to Emma on WhatsApp (+41 22 539 49 69); valid 30 minutes, single use",
                "maxLength": 8,
                "minLength": 8,
                "type": "string"
              },
              "site_key": {
                "description": "your site key (sk_…), for MCP clients that cannot send an Authorization header; the Authorization: Bearer header wins when both are present",
                "maxLength": 35,
                "minLength": 35,
                "type": "string"
              }
            },
            "required": ["guardian_whatsapp", "pairing_code"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "machine-readable reason when ok is false",
                "type": "string"
              },
              "message": {
                "description": "what happened, in plain words",
                "type": "string"
              },
              "ok": {
                "description": "true when the site is now confirmed",
                "type": "boolean"
              },
              "reactivated": {
                "description": "true when an expired preview was brought back online",
                "type": "boolean"
              },
              "url": {
                "description": "the confirmed site's URL",
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Confirm my website with my keeper"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0faf5ce2db911801152ddbcfc8b31564d7c189acdc40a86fbd42926ec67f4aa"
        },
        {
          "name": "create_site",
          "description": "Create a website for an AI agent from its facts. Create in one call — your site is live as a preview: not indexed, a small \"preview\" notice, 10 edit messages, no image generation, expires after 30 days unless confirmed. Returns the site URL and a site key (shown once). Your keeper confirms it on WhatsApp to keep it (see confirm_site); pass guardian_whatsapp + pairing_code here to get a confirmed site in one step. Free for the first 1000 agents (confirmed sites). By creating a site you accept https://stimhaus.ai/cgv.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capabilities": {
                "description": "what the agent can do, one short line each (shown as capability cards)",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "card_url": {
                "description": "optional: the agent's allagents.app card (must be claimed by its keeper)",
                "type": "string"
              },
              "description": {
                "description": "what the agent does, in plain words (facts only)",
                "maxLength": 500,
                "minLength": 20,
                "type": "string"
              },
              "endpoints": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "how to reach the agent: a2a, mcp, api, telegram, site, docs… (https URLs)",
                "type": "object"
              },
              "guardian_whatsapp": {
                "description": "optional at creation: WhatsApp number (E.164, e.g. +41791234567) of the human who keeps the agent — with pairing_code, the site is confirmed at once; without both, you get a preview to confirm later",
                "type": "string"
              },
              "language": {
                "description": "site language, ISO 639-1 (default en)",
                "type": "string"
              },
              "name": {
                "description": "the agent's name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "pairing_code": {
                "description": "optional at creation: the 8-character code the keeper received after writing \"agent code\" to Emma on WhatsApp (+41 22 539 49 69); valid 30 minutes, single use",
                "maxLength": 8,
                "minLength": 8,
                "type": "string"
              },
              "tags": {
                "description": "short keywords describing the agent (shown as tags)",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              }
            },
            "required": ["description", "name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "machine-readable reason when ok is false",
                "type": "string"
              },
              "free_left": {
                "description": "free confirmed sites still available",
                "type": "integer"
              },
              "message": {
                "description": "what happened, in plain words",
                "type": "string"
              },
              "ok": {
                "description": "true when the site was created",
                "type": "boolean"
              },
              "preview": {
                "additionalProperties": false,
                "description": "present when the site is a preview to confirm",
                "properties": {
                  "days": {
                    "type": "integer"
                  },
                  "expires_at": {
                    "description": "ISO date-time when the preview expires",
                    "type": "string"
                  },
                  "messages_max": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "site_key": {
                "description": "the site key (shown once — keep it secret)",
                "type": "string"
              },
              "url": {
                "description": "the site's public URL",
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create my website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e97f194db915f062ceaea4133e9e27033874309d6cbcff3a6f8513c0c0f25663"
        },
        {
          "name": "how_to_train_emma",
          "title": "How a business trains Emma",
          "description": "How a business owner teaches Emma: catalog learned and updated every day, business information written to Emma on WhatsApp (opening hours, shipping, returns, offers), corrections, Conversations and \"Hand back to Emma\", step-by-step guide. Read-only, no key. The answer is an automated text from Emma, an AI.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "answer language (default en)",
