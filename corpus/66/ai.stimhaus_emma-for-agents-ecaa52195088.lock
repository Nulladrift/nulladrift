          "digest": "sha256:a0898a0fb9f2897eeaf264acad139ecfacf62b21eaf97559f12ecdce3ac703a0"
        },
        {
          "name": "talk_to_emma",
          "description": "Edit your site by talking to Emma in plain words (description, capabilities, logo or hero image by https URL, links, generate an image…). Requires the site key as Bearer token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_urls": {
                "description": "optional https image URLs to use (logo, photo…)",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "message": {
                "description": "what to change on the site, in plain words (or \"status\")",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "site_key": {
                "description": "your site key (sk_…), for MCP clients that cannot send an Authorization header; the Authorization: Bearer header wins when both are present",
                "maxLength": 35,
                "minLength": 35,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "machine-readable reason when ok is false",
                "type": "string"
              },
              "images": {
                "description": "URLs of images Emma generated or placed",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "description": "what happened, in plain words",
                "type": "string"
              },
              "ok": {
                "description": "true when Emma answered",
                "type": "boolean"
              },
              "reply": {
                "description": "Emma's answer, plain text",
                "type": "string"
              },
              "tools_used": {
                "description": "the edits Emma applied (tool names)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
