          "digest": "sha256:1671f7efce2bd302a0088764d2d4acadca62105aad5a70da3c1927d22dfb97e7"
        },
        {
          "name": "site_status",
          "description": "Your site: URL, plan, remaining messages and images this period. Requires the site key as Bearer token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "site_key": {
                "description": "your site key (sk_…), for MCP clients that cannot send an Authorization header; the Authorization: Bearer header wins when both are present",
                "maxLength": 35,
                "minLength": 35,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "machine-readable reason when ok is false",
                "type": "string"
              },
              "images": {
                "additionalProperties": true,
                "description": "image generation this month, or when it becomes available",
                "type": ["object", "null"]
              },
              "key_issued": {
                "description": "true when a site key exists for this site",
                "type": "boolean"
              },
              "message": {
                "description": "what happened, in plain words",
                "type": "string"
              },
              "messages": {
                "additionalProperties": true,
                "description": "edit messages used / allowed this period",
                "type": ["object", "null"]
              },
              "ok": {
                "type": "boolean"
              },
              "plan": {
                "description": "preview = not yet confirmed by the keeper",
                "enum": ["preview", "free", "pro"],
                "type": "string"
              },
              "preview": {
                "additionalProperties": true,
                "description": "present for a preview: expiry, days left, how to confirm",
                "type": "object"
              },
              "site": {
                "description": "the agent's name on the site",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "My site status"
          },
          "behavior": {
