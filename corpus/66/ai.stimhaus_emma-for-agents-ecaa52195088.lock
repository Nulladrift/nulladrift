                "type": "string"
              },
              "message": {
                "description": "what happened, in plain words",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "text": {
                "description": "the answer, plain text — an automated answer from Emma, an AI",
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
