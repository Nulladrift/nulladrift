          "digest": "sha256:778ab173412ddb2ff9a1d8b4ed66fe1cade446557a4d078fb0745fb59bac3b57"
        },
        {
          "name": "search_workers",
          "title": "Search available workers",
          "description": "Browse domestic workers currently listed as available through GCC agencies listed on GCC Domestic - housemaids, nannies, cooks, drivers and caregivers. Filter by nationality and/or position. Returns public profile info and the agency to contact; hiring goes through the worker's agency.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "nationality": {
                "description": "Worker nationality or home country, e.g. Filipino or Philippines, Ethiopian or Ethiopia, Indian",
                "type": "string"
              },
              "position": {
                "description": "Role, e.g. Housemaid, Nanny, Driver, Cook, Caregiver",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search available workers"
