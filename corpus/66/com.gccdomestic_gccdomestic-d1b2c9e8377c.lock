      },
      "instructions": "GCC Domestic (gccdomestic.com) is a bilingual directory of domestic-worker recruitment agencies in the Gulf - 1,600+ listed agencies (1,300+ of them government-verified) and 1,500+ worker profiles across the UAE, Saudi Arabia, Kuwait, Qatar, Bahrain and Oman. These read-only tools find agencies, check an agency's licence, list available workers and return published salary benchmarks. All data is public; families use the platform free of charge. Site guide: https://www.gccdomestic.com/llms.txt",
      "tools": [
        {
          "name": "get_platform_guide",
          "title": "GCC Domestic platform guide",
          "description": "How hiring a domestic worker through GCC Domestic works, with canonical links: country directories, the application page for workers, pricing, and verification guides. Use this to orient before deeper searches, or to hand a user the right link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country focus: uae | ksa | kuwait | qatar | bahrain | oman",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GCC Domestic platform guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:693c9d2cf6e032ce007e07962fdf0bd9c235bcdde1b2a9902975c940b354d2a5"
        },
        {
          "name": "get_salary_benchmarks",
          "title": "Domestic-worker salary benchmarks",
          "description": "Published monthly salary benchmarks for domestic workers in the Gulf, by country and worker nationality. These are the same bands published across gccdomestic.com (salary calculator, 2026 salary report). Currencies: UAE in AED, Saudi Arabia in SAR.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "uae or ksa (bands published for these; other GCC countries return guide links)",
                "type": "string"
              },
              "nationality": {
                "description": "Nationality or home country, e.g. filipino or Philippines, ethiopian, indian, indonesian, sri-lankan, kenyan, ugandan, nepali, bangladeshi, ghanaian",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Domestic-worker salary benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:92186ac788fd45c8f7dfd226872b2547516bc2538575ccc57526cae258779cb2"
        },
        {
          "name": "search_agencies",
          "title": "Find agencies in a city or country",
          "description": "Find, list or compare maid / domestic-worker recruitment agencies (housemaids, nannies, cooks, drivers, caregivers) in a city or country - e.g. 'maid agencies in Dubai' -> city: Dubai. Use this for any 'agencies in <place>' question. Searches agencies listed on GCC Domestic across the six GCC countries (UAE, Saudi Arabia, Kuwait, Qatar, Bahrain, Oman). Filter by country, city and/or a free-text name query. Returns contact details, whether each agency is government-verified (1,300+ are), and the official registry link where one exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. Dubai, Riyadh, Doha",
                "type": "string"
              },
              "country": {
                "description": "Country: uae | ksa | kuwait | qatar | bahrain | oman",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search over agency names (English or Arabic)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find agencies in a city or country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://gccdomestic/cards-v1.html"
            },
            "ui/resourceUri": "ui://gccdomestic/cards-v1.html"
          },
          "digest": "sha256:ae374b4bfec72ad644f050d47dca0150bb4fc604c17dccee9f43b20fe8dfc7c9"
        },
        {
          "name": "search_knowledge",
          "title": "Search GCC Domestic guides",
          "description": "Semantic search over GCC Domestic's published guides, blog posts and country pages (English + Arabic): visas, Tadbeer/Musaned/PAM/ADLSA/LMRA/MOL procedures, salaries, contracts, refunds, worker rights. Returns title, URL and a snippet. Read-only; each result carries its URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the guides to search: en or ar",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 5)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Question or keywords, English or Arabic",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search GCC Domestic guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
