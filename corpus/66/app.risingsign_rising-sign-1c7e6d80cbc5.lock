      "serverInfo": {
        "name": "app.risingsign/rising-sign",
        "title": "RisingSign — Rising, Sun & Moon Sign Calculator",
        "version": "1.0.0",
        "websiteUrl": "https://risingsign.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use calculate_rising_sign to compute an exact Rising (Ascendant) sign, degree, Midheaven, and chart ruler from birth date, local time, latitude/longitude, and IANA time zone, or calculate_big_three to compute Sun, Moon, and Rising signs (including full-day Rising windows when birth time is unknown).",
      "tools": [
        {
          "name": "calculate_big_three",
          "title": "Calculate Sun, Moon, and Rising Signs (Big Three)",
          "description": "Calculate Sun, Moon, and Rising (Ascendant) signs with exact zodiac degrees, elements, modalities, house placements, and personal planet positions for a birth date, optional local time, geographic coordinates, and IANA time zone. When time is omitted, returns same-day possible Sun/Moon signs and full-day Rising sign time windows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Birth date in YYYY-MM-DD format (1900-01-01 to 2100-12-31), e.g. '1990-04-03'.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "houseSystem": {
                "description": "House system to use ('placidus' or 'whole-sign'). Defaults to 'placidus'.",
                "enum": ["placidus", "whole-sign"],
                "type": "string"
              },
              "latitude": {
                "description": "Birthplace latitude in decimal degrees (-90 to 90, north positive), e.g. 40.7128 for New York.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Birthplace longitude in decimal degrees (-180 to 180, east positive), e.g. -74.006 for New York.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "time": {
                "description": "Optional local birth time in 24-hour HH:MM format, e.g. '14:30'. Omit if birth time is unknown.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone identifier for the birthplace, e.g. 'America/New_York', 'Europe/London', or 'UTC'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["date", "latitude", "longitude", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8078543ac444ee1a50bc66c2938f510a1772ea87acace131ed5bbd250c7db23"
        },
        {
          "name": "calculate_rising_sign",
          "title": "Calculate Rising (Ascendant) Sign",
          "description": "Calculate the exact Rising (Ascendant) sign, zodiac degree, Midheaven (MC), chart ruler, and house system for a birth date, local time, geographic coordinates (latitude/longitude), and IANA time zone using astronomical ephemeris math and historical DST.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Birth date in YYYY-MM-DD format (1900-01-01 to 2100-12-31), e.g. '1990-04-03'.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "houseSystem": {
                "description": "House system to use ('placidus' or 'whole-sign'). Defaults to 'placidus' (falls back to 'whole-sign' at extreme polar latitudes).",
                "enum": ["placidus", "whole-sign"],
                "type": "string"
              },
              "latitude": {
                "description": "Birthplace latitude in decimal degrees (-90 to 90, north positive), e.g. 40.7128 for New York.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Birthplace longitude in decimal degrees (-180 to 180, east positive), e.g. -74.006 for New York.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "time": {
                "description": "Local birth time in 24-hour HH:MM format, e.g. '14:30'.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone identifier for the birthplace, e.g. 'America/New_York', 'Europe/London', or 'UTC'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["date", "latitude", "longitude", "time", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
