          "name": "search_flours",
          "description": "Search the Pandough flour database. Returns flour names, protein %, W strength, hydration ranges, and types. Use this to help users find the right flour for their bake.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
