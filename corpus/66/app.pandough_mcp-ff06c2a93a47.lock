                "description": "Filter by tag (e.g. 'pizza', 'bread', 'pastry')",
                "maxLength": 50,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search Flours"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1faa49540b58ad1f08b4c8e801156f24fd1d2de8c0957746242682d990e317bb"
        },
