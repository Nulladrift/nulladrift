              "query": {
                "description": "Search term (oven name, brand)",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "Oven type filter (e.g. 'pizza-oven', 'home-oven', 'outdoor')",
                "maxLength": 50,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search Ovens"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f2d2fbe57679296ebdaf6d47c6987b28fda61d265759e05d0c398bdfd676c33e"
        },
        {
          "name": "troubleshoot",
          "description": "Search the Pandough baking knowledge base for troubleshooting advice, technique guides, and flour science. Returns curated expert content about common baking issues.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "issue": {
                "description": "The baking issue or question (e.g. 'sticky dough', 'no oven spring', 'cold proof technique')",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["issue"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Troubleshoot Dough"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0707cc0c3f761c20b32db8bcd12dcb3243e887fe27ae6eb85dbb6873c3a2793f"
        }
      ],
      "digest": "sha256:0bce975c2230762099815466fa432a1431824f887fdad56b85a3a84c6fffb987"
    }
  }
