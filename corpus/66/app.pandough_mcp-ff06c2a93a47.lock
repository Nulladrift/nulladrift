          "name": "search_ovens",
          "description": "Search the Pandough oven database. Returns oven specs (max temperature, type, fuel) plus recommended bake settings — top/deck heat, bake time, and deck material — computed for a Neapolitan pizza by the same heat engine the site uses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
