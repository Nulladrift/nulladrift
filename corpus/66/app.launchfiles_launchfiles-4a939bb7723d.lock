      "serverInfo": {
        "name": "launchfiles-agent",
        "version": "2.1.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Hosted Launchfiles v2 MCP: Audit & Distribution suite (launchfiles_homepage_roast, launchfiles_seo_audit, launchfiles_ux_audit, launchfiles_live_drift_check, launchfiles_mcp_registry_readiness, launchfiles_prepare_distribution_pack), Advise & Research suite (launchfiles_extract_truth_sheet, launchfiles_draft_verified_reply, launchfiles_gsc_query_opportunities, launchfiles_public_intent_radar), Writer (launchfiles_standalone_page_draft_short/paid), and Founder Approval Social Connectors.",
      "tools": [
        {
          "name": "launchfiles_domain_horizon_memory",
          "description": "Recall longitudinal multi-run audit memory across Clarity, UX, Search/GSC, Checkout Drift, and Directory Distribution (distributionHistory) for a domain, surfacing verified shipped-change deltas, cross-vertical self-challenges, and the next highest-leverage bet.",
          "inputSchema": {
            "properties": {
              "run_fresh_drift_check": {
                "description": "Optionally run and persist a fresh live checkout/trust drift check before computing horizon memory (default false).",
                "type": "boolean"
              },
              "url": {
                "description": "Domain or https:// URL to inspect longitudinal horizon memory for.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c92f6c1a8ce86e1e909d96500bd4f31d076818cfcbf73a56c65ea075659df433"
        },
        {
          "name": "launchfiles_homepage_roast",
          "description": "Run a live 5-second clarity roast + server HTML + checkout drift check on any public homepage, persisting the receipt while keeping response screenshots compact by default.",
          "inputSchema": {
            "properties": {
              "include_screenshots": {
                "description": "Include base64 desktop/mobile JPEG data URLs (default false).",
                "type": "boolean"
              },
              "url": {
                "description": "Live https:// homepage URL to roast.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5c113f2904faeb21d9dd3e5cef26440da6ff898a47e346bba0e99d2c43bf0439"
        },
        {
          "name": "launchfiles_live_drift_check",
          "description": "Run a live HTTP, legal, sitemap, and Stripe Checkout / seller-brand drift inspection on a public website.",
          "inputSchema": {
            "properties": {
              "expectedBrandTokens": {
                "description": "Optional lowercase brand tokens expected on Stripe checkout surfaces.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Live https:// homepage URL to inspect for checkout and trust drift.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:826db16f486c089e2bf6bfe2188241062d15df5fed4aac6f34a480b228980fcd"
        },
        {
          "name": "launchfiles_mcp_registry_readiness",
          "description": "Probe any live product URL for /llms.txt, /.well-known/mcp.json, /.well-known/mcp-registry-auth, /.well-known/agent-card.json, remote /api/mcp tools/list, official MCP Registry drift, and public companion repository status.",
          "inputSchema": {
            "properties": {
              "repository_url": {
                "description": "Optional public GitHub companion repository URL to check for 200 vs 404.",
                "type": "string"
              },
              "url": {
                "description": "Live https:// product URL or domain to probe.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ceb1531474cb00400209980c3aab97d05c4bd97ace89e91a73869d99f43fc26"
        },
        {
          "name": "launchfiles_seo_audit",
          "description": "Run or recall LaunchFiles' Search & SEO Radar: live Search Console CTR-leak prioritization, sitemap crawl on up to 10 routes, SERP landscape, and cross-model claim-verified upgrade package.",
          "inputSchema": {
            "properties": {
              "mode": {
                "description": "full_audit (default) runs a fresh crawl+author+verify pass; memory_only returns persisted domain history.",
                "type": "string"
              },
              "url": {
                "description": "Domain or live https:// URL to audit.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11c24111a171ccdb11811f64f7a0d60f3e11576d99e7f214ee65c0db491cbfe6"
        },
        {
          "name": "launchfiles_seo_indexing_status",
          "description": "Inspect live Google Search Console sitemap and indexing status for a domain or URL.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Domain or https:// URL to inspect in Google Search Console.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d60716bfb9ea919ae1bc3701defe62ce3b805303ee04aaec4f5bd9b25b2f987"
        },
        {
          "name": "launchfiles_ux_audit",
          "description": "Run LaunchFiles' live Chromium 12-gate Design & UX Radar across desktop (1440x900) and mobile (390x844), returning measured tap-target, landmark, CTA, and hero redesign diagnosis.",
          "inputSchema": {
            "properties": {
              "include_visual_payloads": {
                "description": "Include base64 screenshots and generated hero artwork data URLs (default false).",
                "type": "boolean"
              },
              "override_archetype_id": {
                "description": "Optional trade archetype override ID.",
                "type": "string"
              },
              "url": {
                "description": "Live https:// URL to inspect in Chromium.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fa46fe6041b07d4e9cdf1951917c81d8844da5db9e032603a6679c7117472bf"
        }
