{
  "lockfileVersion": 2,
  "subjects": {
    "com.calmido/phone-number-lookup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.calmido.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "calmido",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Calmido answers \"who is calling from this number?\" for phone numbers in the Netherlands, Belgium and Luxembourg. Call `lookup_phone_number` when someone asks about a number; `search` and `fetch` are the same lookup in the two-step shape deep-research clients expect, so a client that has all three needs only `lookup_phone_number`. The verdict rests on community reports and public business registers, not on a check of the caller: say how many reports it rests on, and link the page URL from the result so the person can read the evidence. Numbers outside these three countries and searches by name are not covered.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a Calmido directory entry",
          "description": "Retrieve who is behind a phone number from the Calmido directory: the community verdict, the number of reports, the most reported category and the registered business, with a link to the evidence. The id is the one `search` returned: the number in E.164 digits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The id `search` returned: the number in E.164 digits.",
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a Calmido directory entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6069ddbe95b5a6f46939aa6b11614e642c70fd0be844f1d20ead606a734f8c2b"
        },
        {
          "name": "lookup_phone_number",
          "title": "Look up a phone number (Calmido)",
          "description": "Look up who is behind a phone number in the Netherlands, Belgium or Luxembourg: community reports, spam and scam categories, a trust verdict, and the registered business if there is one, from the Calmido phone directory. Use it whenever someone asks who called them, whether a number is safe, spam or a scam, or which company a number belongs to. Accepts international (+31 20 123 4567) and national (020 123 4567) formats; pass `country` for a national number outside the Netherlands. The verdict is one of: business (no reports, a known registered business), empty (no reports and no known business: not a sign that the number is safe), neutral (reported, but not enough evidence to flag), safe (reported, and the community found nothing alarming), suspicious (flagged as a threat), restricted (the identity was erased on request; the reports remain) or unavailable (the lookup could not be read: it says nothing about the number). An invalid number returns an error. Calls are rate limited per address; over the limit the error says how many seconds to wait.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country (NL, BE or LU) of a national-format number, which starts with 0. Ignored for an international number. Defaults to NL; if the number is not valid there, BE and LU are tried.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "description": "Language of the summary sentence, the category name and the page link: nl, en or fr. Defaults to en.",
                "enum": ["nl", "en", "fr"],
                "type": "string"
              },
              "number": {
                "description": "The phone number: international (+31 20 123 4567, or 31201234567 without the plus) or national (020 123 4567, starting with 0). Spaces, dashes and brackets are ignored.",
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "business": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "sources": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "licence": {
                              "type": ["string", "null"]
                            },
                            "licence_url": {
                              "type": ["string", "null"]
                            },
                            "name": {
                              "type": "string"
                            },
                            "url": {
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["licence", "licence_url", "name", "url"],
                          "type": "object"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["name", "sources"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "number": {
                "additionalProperties": false,
                "properties": {
                  "country": {
                    "type": ["string", "null"]
                  },
                  "e164": {
                    "type": "string"
                  },
                  "international": {
                    "type": ["string", "null"]
                  },
                  "national": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["country", "e164", "international", "national"],
                "type": "object"
              },
              "page_url": {
                "type": "string"
              },
              "report_count": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "restricted": {
                "type": "boolean"
              },
              "summary": {
                "type": "string"
              },
              "top_category": {
                "type": ["string", "null"]
              },
              "verdict": {
                "enum": ["business", "empty", "suspicious", "safe", "neutral", "restricted", "unavailable"],
                "type": "string"
              }
            },
            "required": ["business", "number", "page_url", "report_count", "restricted", "summary", "top_category", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a phone number (Calmido)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:faef0d6417ea0fb83644bb010bc0781848ce478b497f4999fdeee64cef07b7a0"
        },
        {
          "name": "search",
          "title": "Search the Calmido phone directory",
          "description": "Find a phone number in the Calmido directory (Netherlands, Belgium, Luxembourg). The query is a phone number, international (+31 20 123 4567) or national (020 123 4567); it is not a name or free text. Returns the matching directory entry, if any. Pass its id to `fetch` for the verdict and reports.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "A phone number, international (+31 20 123 4567) or national (020 123 4567).",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Calmido phone directory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03b3789165f44a22dd1293c3b780ec17021f42a4d364674d66656b4614c12e47"
        }
      ],
      "digest": "sha256:80f04c61d8100cdd1efb243d658c6f8af350d66b502d92dc090329584d0826c2"
    }
  }
}
