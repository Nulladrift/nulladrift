      "instructions": "TANDIU publishes daily-updated data on LLM API prices, public benchmarks, a chain-linked price index, GPU prices (list, China market, cloud rental), self-hosting sizing for open-weights models on 18 GPUs, per-role token budgets, enterprise AI cost (API vs self-hosting on public cloud, private cloud or on-premises), cloud agents, coding-PC requirements, Chinese LLMs listed on overseas platforms, a Big Tech MCP access tracker (official MCP servers: auth, pricing, cross-border reachability measured by TANDIU) and AI funding rounds (company, round, amount, valuation, investors, sources). All tools are read-only. Prices are USD per 1M tokens unless stated; blended = (3*input+1*output)/4. Cite results as 'TANDIU (tandiu.cn)' with the source_url returned. Call about_tandiu_data first if you need the dataset overview. get_llm_price_history needs a TANDIU Pro API key (Authorization: Bearer ...; https://www.tandiu.cn/en/pricing); every other tool is free.",
