{
  "lockfileVersion": 2,
  "subjects": {
    "com.docketnexus/docketnexus": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.docketnexus.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "docketnexus",
        "title": "Docket Nexus",
        "version": "1.0.0",
        "websiteUrl": "https://docketnexus.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to public U.S. federal court records compiled by Docket Nexus. Tools return structured, bounded, paginated results with canonical Docket Nexus URLs and provenance. Companies are looked up by slug; cases by their Docket Nexus URL. Document tools return metadata only.",
      "tools": [
        {
          "name": "get_case",
          "title": "Case detail",
          "description": "Get a public case by its Docket Nexus URL (https://docketnexus.com/case/.../): caption, court, docket number, dates, judge, cause, nature of suit, parties as shown on the case page, and disposition when recorded.",
          "inputSchema": {
            "properties": {
              "case_url": {
                "description": "Full Docket Nexus case URL, e.g. https://docketnexus.com/case/<slug>-<id>/ . Returned as canonical_url by search_cases and get_company_cases.",
                "title": "Case Url",
                "type": "string"
              }
            },
            "required": ["case_url"],
            "title": "get_caseArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7d44ec70bc30971d1ec869ae5214a69db679073529e6b316c9786e56ac1c032"
        },
        {
          "name": "get_case_docket",
          "title": "Case docket entries",
          "description": "List a public case's docket entries newest first, with document availability. Paginate with next_cursor. At most 50 per call. Entries the site does not publish are omitted and only counted.",
          "inputSchema": {
            "properties": {
              "case_url": {
                "description": "Full Docket Nexus case URL, as accepted by get_case.",
                "title": "Case Url",
                "type": "string"
              },
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Opaque pagination token from a previous call's next_cursor. Omit for the first page.",
                "title": "Cursor"
              },
              "limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Entries to return, 1-50. Defaults to 50.",
                "title": "Limit"
              }
            },
            "required": ["case_url"],
            "title": "get_case_docketArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0971b82460e8bd07f2a23a6ba0111cbb20fbee8aa49b9344c80100e5eb3292ed"
        },
        {
          "name": "get_company",
          "title": "Company litigation profile",
          "description": "Get a public company's Docket Nexus profile by slug (e.g. 'acme-widgets-inc'): name, industry, number of linked cases, verified public-company identity when on the verified roster, and top case types and courts.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Docket Nexus company slug, lowercase and hyphenated, as it appears in a /party/<slug>/ URL (e.g. '3m-company').",
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_companyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1fc8159af3ce26fc237338330004a5adfe007355ea3a20795cfb97c075fb0f9f"
        },
        {
          "name": "get_company_cases",
          "title": "Cases involving a company",
          "description": "List public cases linked to a company, newest or oldest first, optionally filtered by nature of suit or court. Paginate with next_cursor. At most 25 per call.",
          "inputSchema": {
            "properties": {
              "court": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filter to one court as shown on the company page (e.g. 'District Court, N.D. Alabama').",
                "title": "Court"
              },
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Opaque pagination token from a previous call's next_cursor. Omit for the first page.",
                "title": "Cursor"
              },
              "limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cases to return, 1-25. Defaults to 25.",
                "title": "Limit"
              },
              "nature_of_suit": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filter to one nature-of-suit category as shown on the company page (e.g. 'Product Liability').",
                "title": "Nature Of Suit"
              },
              "slug": {
                "description": "Docket Nexus company slug, as used by get_company.",
                "title": "Slug",
                "type": "string"
              },
              "sort": {
                "default": "newest",
                "description": "Order by case filing date. 'newest' (default) or 'oldest'.",
                "enum": ["newest", "oldest"],
                "title": "Sort",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_company_casesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47c25b180fa13c5322fa4b8458b10611f838df20067d6d3ae927ebc6c512ded5"
        },
        {
          "name": "get_document",
          "title": "Docket document metadata",
          "description": "Get public metadata for a docket document by its Docket Nexus document id: entry, date, description, page count, availability and parent case. Metadata only; no document text.",
          "inputSchema": {
            "properties": {
              "document_id": {
                "description": "Docket Nexus document id, as returned in a get_case_docket entry's document_id field. Metadata only is returned; document text is never served.",
                "title": "Document Id",
                "type": "integer"
              }
            },
            "required": ["document_id"],
            "title": "get_documentArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9613b4c291892c3d79d942ff4f8451d6c8f508c54750c1b1ee9c9f6fa5eb1e2b"
        },
        {
          "name": "search_cases",
          "title": "Search federal cases",
          "description": "Search public cases by caption words, 'A v. B', or a federal docket number WITH its office prefix (e.g. 1:24-cv-01234). Results are newest first, at most 25 per call; paginate with next_cursor.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Opaque pagination token from a previous call's next_cursor. Omit for the first page.",
                "title": "Cursor"
              },
              "limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Results to return, 1-25. Defaults to 25.",
                "title": "Limit"
              },
              "query": {
                "description": "Caption words, an 'A v. B' party pairing, or a federal docket number INCLUDING its office prefix (e.g. '1:24-cv-01234'). A docket number without the office prefix is refused.",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_casesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef49917ec7dd4c9ec19d34a56e855c34e7de61d44017e27002394c0ccce26c49"
        }
      ],
      "digest": "sha256:fc51bf50c8807d570fe89c3dd9112d0988b4835a79aeebcd768eee805f900bb0"
    }
  }
}
