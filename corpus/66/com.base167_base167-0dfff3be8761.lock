      "tools": [
        {
          "name": "base167_check_claim",
          "title": "Check BASE167 claim eligibility for a wallet",
          "description": "Check whether a wallet can claim BASE167. The token cannot be bought FROM THE PROJECT\n-- no sale, no presale, no allocation -- only claimed, and only by wallets with 167 or\nmore transactions on Base mainnet. It does trade on the open market; the project\nneither sells it nor quotes a price.\n\nReturns eligibility, the transaction count, and the transaction to send if eligible.\nIt does NOT return the claim amount: the decay curve moves it with every claim, so\nread calculateReward(claimCount()) on chain rather than quoting a figure.\nA wallet that has ALREADY claimed is reported as ineligible with no transaction, so\nnever treat a refusal here as a reason to retry: the claim is one per wallet forever.\n\nThis returns an UNSIGNED transaction ({chainId, to, data, value}) plus a short-lived\nvoucher. This service never signs for the user and never holds keys. The user must approve\nand send the transaction from their own wallet. Once mined it CANNOT be undone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "An Ethereum address on Base mainnet, 0x followed by 40 hex characters.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6062bed292042a69a6160293e3710fc7e147b6c755c22881aecfe61314a4231b"
        },
        {
          "name": "base167_claim_entry_pass",
          "title": "Claim a Degen Games Entry pass NFT",
          "description": "Claim the season Entry pass NFT, which is what lets a holder enter Degen Games. Free to\neligible BASE167 holders from the snapshot until enrolment closes (phases seatMarket and\nsetup), a wider window than enrolment itself.\n\nCall base167_get_season first if unsure whether the window is open. After the pass is\nminted, the next step is base167_enroll_wallet.\n\nThis returns an UNSIGNED transaction ({chainId, to, data, value}) plus a short-lived\nvoucher. This service never signs for the user and never holds keys. The user must approve\nand send the transaction from their own wallet. Once mined it CANNOT be undone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "An Ethereum address on Base mainnet, 0x followed by 40 hex characters.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a9f0f6a5de51d9b4ae56a9301998f944a07e376bf4d10ffac6005a5d47f68056"
        },
        {
          "name": "base167_claim_winner_badge",
          "title": "Claim a Degen Games winner badge NFT",
          "description": "Claim the rank-stamped Winner badge NFT for a settled season. Available to the top ten\nfinishers once results are published.\n\nIMPORTANT: this badge is a trophy. It moves no money. Season prize money is paid out\nseparately by hand and there is NO prize-withdrawal function anywhere in these\ncontracts -- do not tell a user one exists or go looking for one.\n\nThis returns an UNSIGNED transaction ({chainId, to, data, value}) plus a short-lived\nvoucher. This service never signs for the user and never holds keys. The user must approve\nand send the transaction from their own wallet. Once mined it CANNOT be undone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "An Ethereum address on Base mainnet, 0x followed by 40 hex characters.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
