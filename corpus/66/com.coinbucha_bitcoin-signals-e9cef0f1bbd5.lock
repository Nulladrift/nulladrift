      "serverInfo": {
        "name": "coinbucha",
        "title": "CoinBucha — Bitcoin signal intelligence",
        "version": "0.1.2",
        "description": "Leading, non-price Bitcoin signals — sovereign reserve adoption, hiring velocity, corporate treasuries and network hashrate — each dated, attributed to primary sources, and scored 0-100 with a direction and a one-line why. Information, not financial advice.",
        "websiteUrl": "https://coinbucha.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CoinBucha serves leading, NON-PRICE Bitcoin indicators: sovereign reserve adoption, hiring velocity at Bitcoin and crypto-infrastructure employers, corporate treasury holdings and network hashrate. Every signal is dated, attributed to primary sources, and expressed as a 0-100 strength with a direction (tailwind | headwind | neutral) and a one-line `why`.\n\nStart with `scan_signals` for the ranked cross-signal view, then drill into a single domain with `get_sovereign_reserves`, `get_hiring_signal`, `get_treasury_holdings` or `get_network_signal`. `get_daily_brew` is the pre-written digest of the whole set. Read the `coinbucha://methodology` resource for how each strength is computed.\n\nThe same documents are also published as RESOURCES, for clients that attach context rather than call tools: `coinbucha://daily-brew`, `coinbucha://sovereign-reserves`, `coinbucha://treasury-holdings` and `coinbucha://methodology`, plus the per-country template `coinbucha://sovereign/{country}` (list it to enumerate every tracked state) and the frozen-series template `coinbucha://sovereign/snapshot/{date}` (list it to enumerate every dated snapshot; a date with no snapshot answers `status: \"no_snapshot\"`, never a zero). Resource bodies are the SAME payloads the matching tools return — attaching one and calling the tool are interchangeable, so do not do both.\n\nEvery payload carries `as_of` — cite it. When a source is missing, stale or unreadable the tool says so explicitly in `status` and `note` instead of serving a figure it cannot stand behind; pass that absence through rather than filling it in, and never read an absent feed as a zero.\n\nEvery answer carries `data_contract` { source, as_of, status, corrections_url, license }: the ledger ids of its inputs, the data date (never the request time), published | revised | frozen, where corrections are logged, and the reuse clause. Use this server for bounded questions — one question, one answer. For bulk, history, backfills and scheduled pulls use the CSVs and datapackage.json at https://coinbucha.com/data, not repeated calls.\n\nCoinBucha is information, not financial advice. Nothing this server returns is a recommendation to buy, sell or hold any asset; it publishes no price forecasts and no performance claims. Do not present its output as advice.\n\nHomepage https://coinbucha.com · docs and free-key request https://coinbucha.com/mcp · methodology https://coinbucha.com/methodology. Anonymous access is open and rate-limited to 30 requests/min per IP; a free API key raises that to 600/min.",
      "tools": [
        {
          "name": "get_bitcoin_company_calendar",
          "title": "Bitcoin company earnings calendar",
          "description": "Next results dates and SEC 10-Q/10-K filing windows of listed bitcoin holders (MSTR, COIN, MARA, HOOD and others): dates and windows from issuer and exchange sources. Takes optional { ticker, days_ahead (1-60, default 60) }. Returns { as_of, today, days_ahead, ticker, count, available, truncated, events[], full, disclaimer, cite, data_contract }; up to 5 events, soonest first, each with ticker, issuer, event_type, event_name, date_status, source_url, checked and either event_date (an issuer-announced date) or window_start/window_end with the SEC rule (a statutory window — never a date). date_status is the record's, verbatim: announced_primary_confirmed, occurred_primary_confirmed or unknown_exact_date_statutory_window. Example: {\"ticker\": \"MSTR\"} or {\"days_ahead\": 14}. Every row with history, rule locators and recorded outcomes: the per-call x402 route /api/paid/calendar (USDC), named with its price in `full`; the same rows stay free as JSON and CSV. Information, not financial advice. Every answer carries data_contract { source, as_of, status, corrections_url, license }. This server answers bounded questions, one question, one answer; for bulk, history, backfills and scheduled pulls use the CSVs and datapackage.json at https://coinbucha.com/data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
