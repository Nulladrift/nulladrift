        {
          "name": "get_unusual_activity",
          "title": "Unusual options activity",
          "description": "Contract-level unusual options activity scan across 7,000+ US stocks (the dataset behind OptionsBell alerts). Filter by symbols, side and thresholds: Vol/OI ratio, premium (USD), IV, days-to-expiration, volume, open interest. Rows include strike, expiry, volume, open interest, IV, delta, sector and an estimated premium. Use for questions like 'what unusual put buying hit TSLA today?'",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Trading day, YYYY-MM-DD. Defaults to the latest available day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_from": {
                "description": "Range start, YYYY-MM-DD inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Range end, YYYY-MM-DD inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Max rows (default 300).",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "max_dte": {
                "description": "Maximum days to expiration, e.g. 30.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "min_iv": {
                "description": "Minimum implied volatility in percent, e.g. 60.",
                "type": "number"
              },
              "min_oi": {
                "description": "Minimum open interest.",
                "type": "number"
              },
              "min_premium": {
                "description": "Minimum estimated premium in USD, e.g. 250000.",
                "type": "number"
              },
              "min_voloi": {
                "description": "Minimum volume/open-interest ratio, e.g. 5.",
                "type": "number"
              },
              "min_volume": {
                "description": "Minimum contract volume.",
                "type": "number"
              },
              "offset": {
                "description": "Rows to skip for paging; the response reports filtered_total and has_more.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "raw": {
                "description": "true = skip the always-on base floor (Vol/OI>=1.5, OI>=100, premium>=$25k).",
                "type": "boolean"
              },
              "since": {
                "description": "ISO-8601 timestamp; only contracts last seen intraday at or after this time (for polling).",
                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated tickers, e.g. 'AAPL,NVDA,TSLA'.",
                "type": "string"
              },
              "type": {
                "description": "Side: c = calls, p = puts (default all).",
                "enum": ["c", "p", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
