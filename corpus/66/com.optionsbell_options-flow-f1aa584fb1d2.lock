      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "optionsbell",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OptionsBell exposes unusual options activity and analytics derived from it (top prints, per-symbol unusual flow, history, streaks, expiry concentration, sentiment, IV rank, OI changes, sectors, market regime) for 7,000+ US stocks. Coverage is UNUSUAL activity only (contracts that passed the unusual filter), not the full options tape. Call get_dataset_stats first if unsure about available history. All data is end-of-day/intraday-scan based, not tick-level; premiums are estimates (last_price × volume × 100). This is data, not investment advice.",
      "tools": [
        {
          "name": "get_dataset_stats",
          "title": "Dataset coverage",
          "description": "Discover what data is available before querying: date ranges, contract counts, symbol counts and sector coverage for the unusual-activity dataset and its daily aggregates. Call this first when unsure about available history.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7de8b936fc91bb7414631613b77c8c3311538062d985ef0d8ef0ccee28da11ec"
        },
        {
          "name": "get_expiry_concentration",
          "title": "Expiry (DTE) concentration (Pro)",
          "description": "Where the day's unusual premium sits along the expiry axis, in DTE buckets (0-7, 8-30, 31-90, 90+) with call/put splits. Heavy short-dated premium reads as event bets; heavy long-dated as positioning.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Trading day, YYYY-MM-DD. Defaults to the latest available day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated tickers, e.g. 'AAPL,NVDA,TSLA'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:af82a5f65e1e9c8eb583a02b99d7405ac36ad268d07348bbbb5caba2449ce6ee"
        },
        {
          "name": "get_flow_history",
          "title": "Per-symbol unusual-flow history (Pro)",
          "description": "End-of-day series of one symbol's UNUSUAL options flow (aggregated from the contracts that passed the unusual filter - not the full tape): daily call/put volume, premium, C/P ratios, average IV, net delta and the consecutive-day streak. ~75 trading days - the series behind back-tests and 'how has unusual flow on NVDA developed?'",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date_from": {
                "description": "Range start, YYYY-MM-DD inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Range end, YYYY-MM-DD inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Max rows, newest first (default 90).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "symbol": {
                "description": "Single ticker, e.g. 'TSLA'.",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c744bbb779c761a1b1be90726a41455f4c39842875d86d3bf351519b4173f480"
        },
        {
          "name": "get_flow_sentiment",
          "title": "Flow sentiment (Pro)",
          "description": "Bullish/bearish classification of each symbol's unusual flow with a 0-9 strength score, based on call/put volumes, premium and net delta. Pass a symbol for that ticker's sentiment time series (date_from, date_to, limit apply); omit it for the cross-market snapshot (filterable by sector, side, minimum strength or premium).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Trading day, YYYY-MM-DD. Defaults to the latest available day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_from": {
                "description": "Range start, YYYY-MM-DD inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Range end, YYYY-MM-DD inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_premium": {
                "description": "Minimum call+put premium in USD (snapshot only).",
                "type": "number"
              },
              "min_strength": {
                "description": "Snapshot only; rows without a signal count as 0.",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "Snapshot only. Rows to skip for paging; the response reports filtered_total and has_more.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sector": {
                "description": "GICS sector name, e.g. 'Information Technology' (snapshot only).",
                "type": "string"
              },
              "side": {
                "description": "Only rows classified with this signal side (snapshot only).",
                "enum": ["bullish", "bearish"],
                "type": "string"
              },
              "signal_only": {
                "description": "Only rows with an active bullish/bearish signal (snapshot only).",
                "type": "boolean"
              },
              "symbol": {
                "description": "Single ticker for its sentiment series; omit for the market-wide snapshot.",
                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated tickers, e.g. 'AAPL,NVDA,TSLA'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:df3c34c090c3b01436f4a609825f2793d0a517fd03f84bf43601eac1d4b5520a"
        },
        {
          "name": "get_flow_streaks",
          "title": "Multi-day unusual-flow streaks (Pro)",
          "description": "Symbols with unusual options activity on N+ consecutive trading days, with the dominant side (call/put). Persistent unusual flow is a stronger signal than a single print - use for 'where does money keep showing up?'",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Trading day, YYYY-MM-DD. Defaults to the latest available day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "min_streak": {
                "description": "Minimum consecutive days (default 3).",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "min_volume": {
                "type": "number"
              },
              "offset": {
                "description": "Rows to skip for paging; the response reports filtered_total and has_more.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "side": {
                "description": "Dominant side by C/P volume ratio.",
                "enum": ["call", "put", "all"],
                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated tickers, e.g. 'AAPL,NVDA,TSLA'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6e993d0f8ef33ffb8d46dfea3bae68019806b1896d079d6e55361b9a9a2f556c"
        },
        {
          "name": "get_iv_rank",
          "title": "IV rank (Pro)",
          "description": "IV rank and IV percentile per symbol against its rolling history (needs 20+ days). Pass a symbol for its IV-rank time series (lookback_days, limit apply); omit it for a ranked snapshot (e.g. side=put&min_rank=0.8 finds elevated put IV; side=both ranks by the higher of call/put IV rank).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "lookback_days": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "max_rank": {
                "description": "Snapshot only.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "min_rank": {
                "description": "Snapshot only.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "side": {
                "description": "Snapshot only (default both).",
                "enum": ["call", "put", "both"],
                "type": "string"
              },
              "symbol": {
                "description": "Single ticker for its IV-rank series; omit for the snapshot.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
