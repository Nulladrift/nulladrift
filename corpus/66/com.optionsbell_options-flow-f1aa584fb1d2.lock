                "type": "number"
              },
              "min_prev_oi": {
                "description": "Minimum prior-day OI to filter low-base noise (default 1000; market-wide only).",
                "type": "number"
              },
              "offset": {
                "description": "Market-wide view only. Rows to skip for paging; the response reports filtered_total and has_more.",
