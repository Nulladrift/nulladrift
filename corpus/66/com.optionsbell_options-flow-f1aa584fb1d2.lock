              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_change_pct": {
                "description": "Minimum absolute day-over-day change, e.g. 0.5 = 50% (market-wide only).",
                "type": "number"
              },
              "min_prev_oi": {
                "description": "Minimum prior-day OI to filter low-base noise (default 1000; market-wide only).",
