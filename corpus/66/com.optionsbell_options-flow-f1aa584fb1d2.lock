                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated tickers, e.g. 'AAPL,NVDA,TSLA'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
