        {
          "name": "get_sector_flow",
          "title": "Sector unusual-flow rollup (Pro)",
          "description": "Which sectors the day's unusual options premium is concentrating in: total premium, volume, average net delta and bullish/bearish symbol counts per sector label (11 GICS sectors plus Diversified, Unknown and Unclassified; only labels with activity, at most 14 rows).",
