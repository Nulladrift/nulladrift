            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a42dacae8c969b607df07998d699a0ab0b115332a227efdff75343df52697a92"
        },
        {
          "name": "get_oi_changes",
          "title": "Open-interest changes (Pro)",
          "description": "Day-over-day open-interest change per symbol (total, calls, puts) - fresh positioning being built or unwound. Pass a symbol for its OI-change series (date_from, date_to, limit apply); omit it for market-wide gainers/losers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Trading day, YYYY-MM-DD. Defaults to the latest available day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_from": {
                "description": "Range start, YYYY-MM-DD inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Range end, YYYY-MM-DD inclusive.",
