        {
          "name": "create_agent",
          "description": "Create a new draft agent under the request's scoped app. Two-phase: first call previews every setting; second call after user confirmation creates it. The agent's ICP starts from the app's saved ICP; icp_filters keys you supply override only those keys, every other saved field (job_titles, mandatory_keywords, excluded_companies, company_sizes, ...) is kept as-is. Do not restate the full ICP from memory for a vague request like \"set it up\" — omit icp_filters entirely to inherit the saved ICP untouched, and only pass the specific keys the user actually asked to change. To deliberately clear a list field, pass it as an empty array. excluded_companies stores exact current employer names. If supplied a LinkedIn company URL, Operator saves its slug name there and retains the URL separately for competitor signals; ask the user to verify the name in the approval. Supply signals only when the user selects exact agent discovery signals; each signal must include its supported platform, category, key, label, enabled state, and config. An explicit empty signals array creates no signals. Without signals, defaults seed from the merged ICP filters. A requested keyword such as product launch can be a keyword_tracking_product_launch signal with config.keyword='product launch'. Ask for missing signal details; never claim a requested setting was saved if this schema cannot represent it. Over MCP: call this tool once, without confirmation_token. It runs right away and returns the result.",
          "inputSchema": {
            "properties": {
              "app_name": {
                "description": "App name (used in the confirm preview)",
                "type": "string"
              },
              "confirmation_token": {
                "description": "Phase-2 token (omit on phase-1)",
                "type": "string"
              },
              "icp_description": {
                "description": "Free-text ICP description for the new agent",
                "type": "string"
              },
              "icp_filters": {
                "description": "Optional structured ICP filters. Use job_titles, industries, regions, company_sizes, excluded_keywords, and exclude_service_providers. excluded_companies accepts exact employer names or LinkedIn company URLs. URLs become slug names and remain separately in competitor_urls. Ask the user to verify the employer name. Do not use unsupported excluded_industries.",
                "type": "object"
              },
              "linkedin_account_ids": {
                "description": "Local UUIDs of the workspace LinkedIn accounts selected for searches. Use [] for none.",
                "items": {
                  "description": "Local LinkedIn account UUID",
                  "type": "string"
                },
                "type": "array"
              },
              "max_signals": {
                "description": "Cap on enabled signals (default 15)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Display name for the new agent (1-100 chars)",
                "type": "string"
              },
              "signals": {
                "description": "Exact agent discovery signals. Omit to seed from ICP; use [] for none.",
                "items": {
                  "properties": {
                    "config": {
                      "description": "Exact signal configuration, such as keyword or job_titles",
                      "type": "object"
                    },
                    "description": {
                      "description": "Optional signal description",
                      "type": "string"
                    },
                    "enabled": {
                      "description": "Whether the signal is selected",
                      "type": "boolean"
                    },
                    "label": {
                      "description": "User-visible signal name",
                      "type": "string"
                    },
                    "platform": {
                      "description": "Discovery platform",
                      "enum": ["linkedin"],
                      "type": "string"
                    },
                    "signal_category": {
                      "description": "Agent signal category",
                      "enum": ["your_company", "engagement_interest", "linkedin_profiles", "change_trigger_events", "competitors_engagement", "job_activity"],
                      "type": "string"
                    },
                    "signal_key": {
                      "description": "Exact signal key, such as keyword_tracking_hiring",
                      "type": "string"
                    }
                  },
                  "required": ["enabled", "label", "platform", "signal_category", "signal_key"],
                  "type": "object"
                },
                "type": "array"
              },
              "type": {
                "description": "Agent type (default 'signal')",
                "enum": ["signal", "lookalike"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
