          "digest": "sha256:852588f4ad451088a6a57505157b94253afb862f1e8a63a5b120a0730eff5cee"
        },
        {
          "name": "control_operator_task",
          "description": "Pause, resume, cancel, or retry a durable Operator task after exact approval. Supply its current version. Retry also requires one failed idempotent local-read step; completed effects cannot replay. A pause may not stop an already executing provider call. Over MCP: call this tool once, without confirmation_token. It runs right away and returns the result.",
