      "instructions": "PUBLIC WEB MCP (Strict Zero-Exposure Mode, DSDX-ZERO-EXPOSURE-1): This public HTTP endpoint exposes 11 read-only reference/demo tools by default (dsdx.start, dsdx.ping, docs_search, docs_read, dsdx.examples.list, dsdx.examples.get, dsdx.library.search, dsdx.library.get, dsdx.scene.catalog, dsdx.scene.build_show_demo, dsdx.plc.formats), and 8 stateless 3D/Robot OLP authoring & export tools (dsdx.compile, dsdx.lint, dsdx.verify.run, dsdx.scene.render, dsdx.artifact.export for scene3d-build-html/zip & olp-*, dsdx.olp.catalog, dsdx.olp.solve_ik, dsdx.olp.validate) when explicitly opted in via headerless URL 'https://dualsoft.ai/mcp/zero-retention' (or '/mcp?opt_in=zero-retention') or HTTP header 'X-Dsdx-Remote-Opt-In: zero-retention' (0 bytes retained on disk). Otherwise compile, verify, simulation, PLC conversion, and 7-brand PLC/AASX artifact export stay hidden and blocked (PRIVACY-E403) so customer engineering lines never leave the user's PC. Workflow for Web AI chats: (1) Read docs via docs_search/docs_read (AI-ST-KIT, ST-EXPR-SPEC) and browse official examples via dsdx.examples.list / dsdx.examples.get / dsdx.scene.build_show_demo and 3D assets via dsdx.library.search / dsdx.library.get; (2) For custom 3D Build Show HTML and Multi-OEM Robot OLP kinematics/export over public Web MCP without custom headers, connect to https://dualsoft.ai/mcp/zero-retention (or pass X-Dsdx-Remote-Opt-In: zero-retention); (3) To compile 7-brand PLC code (LS XG5000, Siemens TIA, Mitsubishi GXW3, Rockwell Studio 5000, Omron Sysmac, CODESYS, TwinCAT) and IDTA AASX locally with zero server upload, paste the verified ds2 v2; source into /play (Browser WASM) or install Local stdio MCP (/mcp-guide#product-download, single .vsix or 1-click installer).",
