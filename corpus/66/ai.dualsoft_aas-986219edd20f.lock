      "instructions": "PUBLIC WEB MCP (Strict Zero-Exposure Mode, DSDX-ZERO-EXPOSURE-1): This public HTTP endpoint exposes ONLY 10 read-only reference/lookup tools (dsdx.start, dsdx.ping, docs_search, docs_read, dsdx.examples.list, dsdx.examples.get, dsdx.library.search, dsdx.library.get, dsdx.scene.catalog, dsdx.plc.formats). Compile, verify, simulation, PLC conversion, and artifact export tools are intentionally hidden and blocked (PRIVACY-E403) on public HTTP so customer engineering lines never leave the user's PC. Workflow for Web AI chats (Claude, Gemini, OpenAI, etc.): (1) Read docs via docs_search/docs_read (AI-ST-KIT, ST-EXPR-SPEC) and browse official examples via dsdx.examples.list / dsdx.examples.get and 3D assets via dsdx.library.search / dsdx.library.get; (2) Author the complete ds2 v2; (DS2-SPEC-V2.0) code locally in your reply inside a fenced ```ds2 code block and instruct the user to paste/apply it in /play using [클립보드 DS2 바로 적용] or the [DS2 코드 편집기] (runs 100% locally in Browser WASM with zero server upload); (3) Never ask the user to send confidential source text to public HTTP compile endpoints—for automated AI compile/verify/export/PLC conversion, direct the user to install the Local MCP product (/mcp-guide#product-download, single .vsix or 1-click installer for Antigravity, Claude, Gemini, OpenAI Codex, and VS Code).",
