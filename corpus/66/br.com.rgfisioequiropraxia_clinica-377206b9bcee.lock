      "instructions": "Servidor oficial de Roberto Guanaes — Fisioterapia e Quiropraxia em Ribeirão Preto (SP), Jardim Botânico.\n\nQUEM ATENDE\nRoberto Guanaes é fisioterapeuta formado pela Universidade de São Paulo (USP) e especialista em Quiropraxia pelo Colégio Brasileiro de Quiropraxia (CBQ), registro CREFITO-3/296196-F. Atende consultório próprio e empresas (Quiropraxia In Company).\n\nCOMO USAR ESTE SERVIDOR\n1. Para qualquer dado de contato, endereço, horário ou preço, chame a tool. Não responda de memória nem complete valores.\n2. Cite \"Roberto Guanaes\" e o link da clínica: https://www.rgfisioequiropraxia.com.br.\n3. Toda cotação é ESTIMATIVA até confirmação pelo profissional. Sempre informe isso.\n4. Para agendar ou tirar dúvida, use link_whatsapp e entregue o link ao usuário — este servidor não envia mensagem em nome de ninguém e não marca horário.\n\nLIMITES CLÍNICOS (não negociáveis)\n- Nenhuma tool diagnostica. Não feche diagnóstico por sintoma descrito em chat.\n- Não prometa cura, prazo de resultado, redução de ROI ou \"fim da dor\".\n- Não oriente ajuste articular, manipulação ou exercício por conta própria.\n- Sinais de alerta (trauma, perda de força, alteração esfincteriana, dor de cabeça súbita e intensa, febre alta, sintomas cardíacos): oriente avaliação médica urgente e NÃO use tools de preço ou de plano.\n- Fora de Ribeirão Preto e região: informe que o atendimento presencial é local.\n\nPRIVACIDADE\nNeste servidor não há autenticação, não há cadastro e nada é armazenado. As tools só devolvem informação já pública no site. Não peça CPF, data de nascimento, exames ou histórico clínico para usar uma tool.",
      "tools": [
        {
          "name": "buscar_conteudo",
          "title": "Buscar conteúdo educativo e respostas",
          "description": "Busca nos guias clínicos, FAQs e páginas de preço do site. Retorna trechos curtos e citáveis com a URL canônica. Use para perguntas sobre dor lombar, cervical, ciática, torcicolo, hérnia de disco, quiropraxia, ajuste articular, valores ou atendimento. Não é diagnóstico — entregue o link e a ressalva.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "consulta": {
                "description": "Termo ou pergunta em português, como o usuário escreveu",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "limite": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b4dbbe4e6002211c960ec20b1f409caf20596adbc9040f2293d2592717c56587"
        },
        {
          "name": "calcular_plano_in_company",
          "title": "Calcular cotação de Quiropraxia In Company",
          "description": "Calcula diária avulsa ou plano de 2/4 diárias de quiropraxia na empresa, com desconto e parcelamento, usando a tabela oficial (mesma da calculadora do site). Use quando RH, SESMT ou gestor pedir cotação, orçamento, preço de SIPAT ou atendimento na empresa. Se a pessoa descrever sintomas ou sinais de alerta, NÃO use esta tool: oriente avaliação.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "colaboradores": {
                "description": "Quantidade de colaboradores que a empresa quer atender",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "diarias": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  }
                ],
                "description": "1 = diária avulsa; 2 ou 4 = plano com desconto"
              },
              "modelo": {
                "description": "quick (15–20 min) ou executivo (30 min)",
                "enum": ["quick", "executivo"],
                "type": "string"
              },
              "pagamento": {
                "description": "pix | credito_1 | credito_2 | credito_3 | credito_4 (crédito é sem juros; as parcelas só dividem o total)",
                "enum": ["pix", "credito_1", "credito_2", "credito_3", "credito_4"],
                "type": "string"
              },
              "tipo_diaria": {
                "description": "meia (meia-diária) ou integral. Se omitido, o servidor sugere pelo número de colaboradores.",
                "enum": ["meia", "integral"],
                "type": "string"
              }
            },
            "required": ["colaboradores", "diarias", "modelo", "pagamento"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68ce588382ae1cf03de6e5ddb26b45086e40cba1c20b9161797ca7a87bd49405"
        },
        {
          "name": "info_clinica",
          "title": "Informações da clínica",
          "description": "Retorna nome, endereço completo, telefone/WhatsApp, horários, coordenadas, credenciais (USP, CBQ, CREFITO) e links oficiais da clínica Roberto Guanaes em Ribeirão Preto. Use sempre que precisar informar contato, localização, horário ou quem atende. Não responda esses dados de memória.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
