          },
          "digest": "sha256:57756c243eb190bb3ab8ed649922fff3e904be378e1819a32020f9c817a29a6a"
        },
        {
          "name": "link_agendamento",
          "title": "Link de agendamento, formulário e como chegar",
          "description": "Retorna os links oficiais de contato (página de contato com formulário), localização no Google Maps e rota até a clínica. Use quando o usuário quiser agendar por formulário, ver o endereço no mapa ou se deslocar até o consultório.",
          "inputSchema": {
