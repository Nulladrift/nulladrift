          },
          "digest": "sha256:c2d7c12ff57d5c640f4e8d0838178f1d9cd97ed1bb07ce067e00673c663f0c4a"
        },
        {
          "name": "listar_tratamentos",
          "title": "Listar tratamentos e valores de sessão",
          "description": "Lista os tratamentos da clínica com valores oficiais da tabela (avaliação, consulta com retorno, planos de sessões e reabilitação de LCA). Use quando o usuário perguntar preço, quanto custa a sessão ou quais planos existem para pessoa física. Para empresa, use calcular_plano_in_company.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "publico": {
                "default": "paciente",
                "description": "paciente = pessoa física; empresa = In Company",
                "enum": ["paciente", "empresa"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
