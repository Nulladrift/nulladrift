        },
        {
          "name": "link_whatsapp",
          "title": "Gerar link de WhatsApp da clínica",
          "description": "Gera o link wa.me com mensagem pré-preenchida para falar com a clínica pelo WhatsApp. Entrega o link para o usuário clicar — este servidor não envia mensagem, não marca horário e não coleta dados.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "contexto": {
                "default": "avaliacao",
                "description": "Assunto da conversa, para já escrever a mensagem",
