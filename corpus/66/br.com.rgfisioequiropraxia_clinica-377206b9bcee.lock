                "type": "string"
              },
              "mensagem": {
                "description": "Texto adicional do usuário, reescrito em primeira pessoa",
                "maxLength": 280,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "instrucao": {
                "type": "string"
              },
              "telefone": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["instrucao", "telefone", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
