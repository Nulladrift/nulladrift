{
  "lockfileVersion": 2,
  "subjects": {
    "com.invokera/discover": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://invokera.com/discover"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "invokera-discover",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Discover and call tools published across all projects on Invokera. Use search_tools to find tools, then describe_tool to get one tool's schema. For tools their owner opened for public invocation, call invoke_tool directly (no token, metered to the owner); otherwise connect to the project's own endpoint with a token from its owner.",
      "tools": [
        {
          "name": "describe_tool",
          "description": "Get the full input schema and calling instructions for one tool found via search_tools. Returns the JSON Schema plus the exact REST/MCP endpoint to call it on. Calling a tool requires that project's own endpoint token, obtained from its owner.",
          "inputSchema": {
            "properties": {
              "project_slug": {
                "description": "The projectSlug from a search_tools result.",
                "type": "string"
              },
              "tool_name": {
                "description": "The toolName from a search_tools result.",
                "type": "string"
              }
            },
            "required": ["project_slug", "tool_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:051c8863024535447aadcee004d311ee629ee790a65d8504cce7ecbee13aed0e"
        },
        {
          "name": "invoke_tool",
          "description": "Call a tool whose owner has enabled public invocation, without needing that project's token. Only works for tools opted in by their owner; others return not-found (use describe_tool for how to call them with a token). Usage is metered to the tool owner. Get project_slug/tool_name and the argument schema from search_tools + describe_tool first.",
          "inputSchema": {
            "properties": {
              "arguments": {
                "description": "Arguments matching the tool inputSchema from describe_tool.",
                "type": "object"
              },
              "project_slug": {
                "description": "The projectSlug from a search_tools result.",
                "type": "string"
              },
              "tool_name": {
                "description": "The toolName from a search_tools result.",
                "type": "string"
              }
            },
            "required": ["project_slug", "tool_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:56c32e52349907354747d653084df4ba664370ef8e3061efcc7ebdb762a48663"
        },
        {
          "name": "search_tools",
          "description": "Search the Invokera catalog for published tools across all projects. Returns a ranked list of tools (name, project, summary, category) WITHOUT their input schemas. Call describe_tool next to get the full schema and calling instructions for a specific tool.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter.",
                "enum": ["other", "data", "commerce", "productivity", "social", "finance"],
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-25 (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. \"housing price\" or \"stock signal\". Empty lists popular tools.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1440c915d32cae37d14fd16b59ce4bbbef2fcac999e6416f1f9ed10c222579fe"
        }
      ],
      "digest": "sha256:da324f501d4fca679cca2cc224ebf817bcf6fb4918182dd11dac3ce7e13b1c5e"
    }
  }
}
