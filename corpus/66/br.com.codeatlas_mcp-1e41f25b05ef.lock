{
  "lockfileVersion": 2,
  "subjects": {
    "br.com.codeatlas/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://codeatlas.com.br/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "br.com.codeatlas/mcp",
        "title": "CodeAtlas",
        "version": "1.0.0",
        "icons": [
          {
            "src": "https://codeatlas.com.br/icons/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CodeAtlas service catalog (read-only tools need no authentication) plus codeatlas_request_contact, which requires an OAuth Bearer token with scope api:write. See https://codeatlas.com.br/auth.md.",
      "tools": [
        {
          "name": "codeatlas_get_service",
          "description": "Return one CodeAtlas service by its stable slug: produto-digital, zelvo-ai or consultoria.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Stable service identifier.",
                "enum": ["produto-digital", "zelvo-ai", "consultoria"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one CodeAtlas service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0745a2a98c6279e4db39a2b5be01446a1834ca1c88b5738df0c2b39d04796bc"
        },
        {
          "name": "codeatlas_list_services",
          "description": "List every CodeAtlas service with slug, description, capabilities, delivery timeline and canonical URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Optional. The next_cursor value returned by the previous page. Omit for the first page.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Optional. Page size, 1 to 100. Defaults to 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List CodeAtlas services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20082fa134e52314b4b424d2f889ff13d7134474f3a2eb1ee8d4a29dea7f6588"
        },
        {
          "name": "codeatlas_request_contact",
          "description": "Submit a first-conversation request to CodeAtlas on behalf of a person. Sends an email to the CodeAtlas team. Requires an OAuth Bearer token with scope api:write (see https://codeatlas.com.br/auth.md). Only call this after the person asked you to contact CodeAtlas and gave you their name and email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Optional. The person's company.",
                "type": "string"
              },
              "email": {
                "description": "The person's email address. CodeAtlas replies here.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. 8 to 128 printable ASCII characters. Reusing it with the same arguments replays the first result instead of sending a second email.",
                "type": "string"
              },
              "locale": {
                "description": "Optional. Reply language. Defaults to pt-BR.",
                "enum": ["pt-BR", "en"],
                "type": "string"
              },
              "message": {
                "description": "What the person wants to discuss, 10 to 2000 characters.",
                "type": "string"
              },
              "name": {
                "description": "The person's full name.",
                "type": "string"
              },
              "service_slug": {
                "description": "Optional. The service the person is interested in.",
                "enum": ["produto-digital", "zelvo-ai", "consultoria"],
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a first conversation with CodeAtlas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1db4131cbc60e9fda37dfc14b16459a47bd5f10952c471b60f0f9461821a134b"
        },
        {
          "name": "codeatlas_search_services",
          "description": "Search CodeAtlas services by business challenge or capability, in Portuguese or English. An empty query returns all services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Business challenge or capability to search for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search CodeAtlas services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86793923bf99be26bebe2b623bebaebfb6e8b2849a591db3950766a77f156827"
        }
      ],
      "digest": "sha256:38a3bb1a8d68657d2bf48f26b8af6cb2fe4e24be028a6c22da50cc83e05b03b6"
    }
  }
}
