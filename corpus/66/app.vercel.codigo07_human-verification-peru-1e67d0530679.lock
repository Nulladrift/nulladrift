        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://codigo07.vercel.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "codigo07",
        "title": "Código 07 — Human verification in Peru",
        "version": "1.2.0",
        "websiteUrl": "https://codigo07.vercel.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Código 07: a marketplace of vetted human verifiers in Peru that AI agents hire and pay directly. No human approval in the loop.\nUse it when you need ground truth in Peru you cannot get online: confirm a business exists and operates, visit an address and take geotagged photos, call a supplier in Spanish, check a RUC in SUNAT.\nFlow: listar_servicios -> cotizar -> solicitar_verificacion. The first call returns an x402 PaymentRequired (USDC on Base). Retry the same call with params._meta[\"x402/payment\"]; once settled the task is confirmed and you get id + token_consulta. Then poll consultar_estado (or pass webhook_url) for the report with geotagged photos, and rate it with calificar_servicio.\nPrices: remote verification USD 25 (24 h), on-site visit in Lima USD 75 (48 h), rush +50%. Anything else: free quote via servicio \"personalizado\", then pagar_solicitud. Capacity: limited tasks per day (see cotizar). Site: https://codigo07.vercel.app",
      "tools": [
        {
          "name": "calificar_servicio",
          "title": "Rate a completed task",
          "description": "Rates the verifier who completed a task (1 to 5 stars, optional comment). Ratings rank verifiers in the network. One rating per task.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "comentario": {
                "maxLength": 1000,
                "type": "string"
              },
              "estrellas": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "id": {
                "description": "Request id",
                "type": "string"
              },
              "token": {
                "description": "token_consulta",
                "type": "string"
              }
            },
            "required": ["estrellas", "id", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3da64fca3b27b2795c5352ea5f31b61f4526c990d7b65873099c8e61ba0e29ba"
        },
        {
          "name": "consultar_estado",
          "title": "Check request status and get the result",
          "description": "Returns status (cotizacion_pendiente, cotizada, pago_en_proceso, pagada, en_proceso, completada, pago_fallido, rechazada, cancelada), price, delivery deadline, payment transaction, and when completed: the report (conclusion, details, geotagged photo URLs) plus a human-readable report URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Request id, e.g. C07-1A2B3C4D",
                "type": "string"
              },
              "token": {
                "description": "token_consulta returned when the request was created",
                "type": "string"
              }
            },
            "required": ["id", "token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:338af6deff9cf5a850a62f41e79b09e06066d16509f535e3dc62452d75ca888a"
        },
        {
          "name": "cotizar",
          "title": "Get a price quote",
          "description": "Returns the exact price, turnaround and today's remaining capacity for a service, or tells you it needs a custom quote. Does not create anything or charge anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "servicio": {
                "description": "verificacion_remota = USD 25, 24 h (phone call in Spanish + SUNAT/RUC lookup + web check, anywhere in Peru). visita_presencial_lima = USD 75, 48 h (on-site visit in Metropolitan Lima/Callao, 6+ geotagged photos). personalizado = free quote request for anything else (e.g. visits outside Lima), paid later with pagar_solicitud.",
                "enum": ["verificacion_remota", "visita_presencial_lima", "personalizado"],
                "type": "string"
              },
              "ubicacion": {
                "description": "Address or city in Peru, if the task is on-site.",
                "type": "string"
              },
              "urgente": {
                "default": false,
                "description": "Rush job: +50% price, half the turnaround.",
                "type": "boolean"
              }
            },
            "required": ["servicio"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb8c840e0c3918e126db08b83dc6504b1c2f60cd4ee0cc598ade4ccc8bfdc3bd"
        },
        {
          "name": "listar_servicios",
          "title": "List Código 07 services",
          "description": "Returns the catalog of human verification services in Peru: USD prices, turnaround, coverage, today's remaining capacity, x402 payment details (network, asset, payTo) and hard limits. Call this first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7a0a2b1954f5c7dfd0470a89b178eb24937e7d538da3498b10574e7a69df835"
        },
        {
          "name": "pagar_solicitud",
          "title": "Pay a quoted request (x402)",
          "description": "Pays a custom request once its status is \"cotizada\" and confirms it instantly. Payment: x402 v2 (v1 compatible), USDC on Base. Call once without payment to receive a PaymentRequired (isError=true, structuredContent). Retry the SAME call adding params._meta[\"x402/payment\"] with the signed PaymentPayload. When it settles, the task is confirmed instantly with no human approval, and the result includes _meta[\"x402/payment-response\"].",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Request id, e.g. C07-1A2B3C4D",
                "type": "string"
              },
              "token": {
                "description": "token_consulta returned when the request was created",
                "type": "string"
              }
            },
            "required": ["id", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66150372d57f396598fddb01b568e23b4a96b48c9b93aeab46ad535d0c18ace5"
        },
        {
          "name": "solicitar_verificacion",
          "title": "Hire a human verifier (pay with x402)",
          "description": "Books a vetted human verifier from the Código 07 network in Peru to check something in the physical world. The first available verifier accepts it and delivers a report with geotagged photos. Standard services are paid instantly and confirmed with no human approval. Payment: x402 v2 (v1 compatible), USDC on Base. Call once without payment to receive a PaymentRequired (isError=true, structuredContent). Retry the SAME call adding params._meta[\"x402/payment\"] with the signed PaymentPayload. When it settles, the task is confirmed instantly with no human approval, and the result includes _meta[\"x402/payment-response\"]. Returns id + token_consulta; store both. servicio \"personalizado\" (or an on-site visit outside Lima) creates a free quote request instead; pay it later with pagar_solicitud. Prohibited requests (surveillance of private individuals, entering private property, handling money/packages, impersonation, anything illegal) are rejected automatically before any charge.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acepta_terminos": {
                "const": true,
                "description": "Must be true: you accept the terms and limits at https://codigo07.vercel.app/#terminos.",
                "type": "boolean"
              },
              "agente": {
                "description": "Name/identifier of your agent.",
                "maxLength": 200,
                "type": "string"
              },
              "contacto_email": {
                "description": "Optional. Inbox where status updates can be sent.",
                "format": "email",
                "type": "string"
              },
              "contacto_whatsapp": {
                "description": "Optional WhatsApp number with country code.",
                "maxLength": 30,
                "type": "string"
              },
              "entregable_esperado": {
                "description": "What you expect back (e.g. \"6 photos of storefront + yes/no on whether it is open\").",
                "maxLength": 1000,
                "type": "string"
              },
              "que_verificar": {
                "description": "What exactly must be verified, in Spanish or English. Be specific: the question to answer and why.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "ruc": {
                "description": "Peruvian company tax ID (RUC, 11 digits), if relevant.",
                "pattern": "^[0-9]{11}$",
                "type": "string"
              },
              "servicio": {
                "description": "verificacion_remota = USD 25, 24 h (phone call in Spanish + SUNAT/RUC lookup + web check, anywhere in Peru). visita_presencial_lima = USD 75, 48 h (on-site visit in Metropolitan Lima/Callao, 6+ geotagged photos). personalizado = free quote request for anything else (e.g. visits outside Lima), paid later with pagar_solicitud.",
                "enum": ["verificacion_remota", "visita_presencial_lima", "personalizado"],
                "type": "string"
              },
              "ubicacion": {
                "description": "Full address and district (for on-site visits) or city.",
                "maxLength": 500,
                "type": "string"
              },
              "urgente": {
                "default": false,
                "description": "Rush job (+50%, half the turnaround).",
                "type": "boolean"
              },
              "webhook_url": {
                "description": "Optional https URL. Receives POST updates (cotizada, completada, cancelada) signed with X-Codigo07-Signature = sha256 HMAC of the raw body using your token_consulta.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["acepta_terminos", "que_verificar", "servicio"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:50e49d060e8958e45ceb472ecd39e3590539cff22d97493f826841370df96bb6"
        }
