        },
        {
          "name": "get_trust_evidence",
          "description": "Returns security and compliance evidence for vendor due diligence: certifications, data location, the documents in the Modulos trust center with their access level, subprocessors and where they hold data, and recent trust updates. Document files are requested by a person at https://www.modulos.ai/trust/.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get trust evidence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
