        },
        {
          "name": "start_job_application",
          "description": "Starts an application for a role at Modulos on behalf of the person you are assisting. Use their real details; anonymous applications are not accepted. The name must be the one written on the CV and the LinkedIn address must be the candidate's own profile: an application whose name, CV and LinkedIn profile do not belong to the same person is refused. Applicants must be 18 or older: ask the candidate to confirm it. Before calling, show the person the privacy policy (https://www.modulos.ai/privacy-policy/) and the terms of use (https://www.modulos.ai/terms-of-use/). Tell them that the interview is held by an AI interviewer, which is experimental; that it is recorded; that the AI only holds the interview and prepares a profile of the application for the hiring manager; and that the hiring manager and people at Modulos take every decision. Get their explicit agreement. Ask the candidate to paste their CV as text; it is required. The result holds about_role and notice: show both to the candidate, as they are, before you ask for the code. A 6-digit code is emailed to them; call confirm_job_application with it. Returns a session value to use for the rest of the interview.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accept_privacy_policy": {
                "const": true,
                "description": "true only if the candidate has read and accepts the Modulos privacy policy.",
                "type": "boolean"
              },
              "accept_terms": {
                "const": true,
                "description": "true only if the candidate has read and accepts the Modulos terms of use.",
                "type": "boolean"
              },
              "confirm_adult": {
                "const": true,
                "description": "true only if the candidate has told you that they are 18 or older. Ask them; do not assume it.",
                "type": "boolean"
              },
              "cv_text": {
                "description": "Required. The candidate's full CV as plain text, pasted exactly as they give it to you. Do not summarise, shorten or rewrite it. If you only have a file, ask the candidate to paste its text.",
                "maxLength": 30000,
                "minLength": 200,
                "type": "string"
              },
              "email": {
                "description": "Email address of the candidate. The code is sent here.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "linkedin_url": {
                "description": "Address of the candidate's own LinkedIn profile, in the form that carries their name, for example https://www.linkedin.com/in/first-last/.",
                "format": "uri",
                "maxLength": 300,
                "type": "string"
              },
              "location": {
                "description": "City and country where the candidate is based.",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "description": "Full name of the candidate, first name and family name, exactly as written on their CV.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "role_id": {
                "description": "Role id from list_open_roles.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["accept_privacy_policy", "accept_terms", "confirm_adult", "cv_text", "email", "linkedin_url", "name", "role_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a job application"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
