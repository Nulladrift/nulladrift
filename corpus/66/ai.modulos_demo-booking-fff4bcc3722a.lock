          "digest": "sha256:3cc0c0640408768d87acd2fe5a16f0f08abdf13fee12ccc8d820b5e934c19460"
        },
        {
          "name": "list_demo_slots",
          "description": "Lists available 30-minute demo time slots over the next two weeks. Returns ISO-8601 UTC start times. Use book_demo_slot to confirm one of them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List demo slots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3d2b8bdeabfde49ab864869edae4c792ab3da58c0dc4114c36a0faf04f07cdf1"
        },
        {
          "name": "list_knowledge",
          "description": "Lists everything else Modulos has published for AI agents: answers to common buyer questions, documents to share and further facts. Returns a title, a summary and a slug per entry. Use get_knowledge with the slug for the full entry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Limit to one type: fact, qa (question and answer), comparison or document.",
                "enum": ["fact", "qa", "comparison", "document"],
                "type": "string"
              },
              "topic": {
                "description": "Limit to one topic, for example \"security\" or \"pricing\".",
                "maxLength": 60,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List published knowledge"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7cfb18064f3a94abf27a21d741df4959cc42dd919d5081844e771d5418c261ba"
        },
        {
          "name": "request_demo",
          "description": "Submits an open demo request without picking a specific time. Use this when the user does not want to choose a slot — the Modulos team will reach out within 1 business day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "job_title": {
                "type": "string"
              },
              "message": {
                "description": "Context: use case, urgency, frameworks of interest (EU AI Act, ISO 42001, NIST AI RMF).",
                "type": "string"
              },
              "name": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["company", "email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a demo"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
