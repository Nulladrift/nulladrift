        {
          "name": "request_demo",
          "description": "Submits an open demo request without picking a specific time. Use this when the user does not want to choose a slot — the Modulos team will reach out within 1 business day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "job_title": {
                "type": "string"
              },
              "message": {
                "description": "Context: use case, urgency, frameworks of interest (EU AI Act, ISO 42001, NIST AI RMF).",
                "type": "string"
              },
              "name": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["company", "email", "name"],
            "type": "object"
