      "serverInfo": {
        "name": "Modulos",
        "title": "Modulos AI Governance Platform",
        "version": "0.2.1",
        "description": "Evaluate Modulos, the AI governance platform for the EU AI Act, ISO/IEC 42001 and NIST AI RMF. Read-only tools return its capabilities, trust and security evidence, vendor comparisons and a requirements fit check; book a demo with the team; apply for open roles at Modulos.",
        "websiteUrl": "https://www.modulos.ai/developers/mcp/",
        "icons": [
          {
            "src": "https://www.modulos.ai/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Modulos is an AI governance platform. Use the read-only tools to evaluate it (capabilities, trust evidence, vendor comparisons, requirements fit, published knowledge). Booking a demo sends the person a confirmation email; nothing is booked until they click the link in it. Modulos also takes job applications here, and only here: list_open_roles and get_job_description show the open roles, and start_job_application begins an interview with the Modulos AI interviewer for the person you assist.",
      "tools": [
        {
          "name": "book_demo_slot",
          "description": "Starts a booking for a specific demo time slot. startTime must be an ISO-8601 string returned by list_demo_slots. Nothing is booked yet when this call succeeds: the attendee is sent a confirmation email, and the demo is booked only once they click the link in it. Tell the user to check their inbox (and spam folder); do not tell them the demo is booked.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attendeeEmail": {
                "description": "Business email of the attendee.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "attendeeName": {
                "description": "Full name of the attendee.",
                "minLength": 1,
                "type": "string"
              },
              "company": {
                "description": "Company or organization name.",
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "Optional context about what the attendee wants to discuss (use case, framework, team size).",
                "type": "string"
              },
              "startTime": {
                "description": "ISO-8601 UTC start time of the slot to book, exactly as returned by list_demo_slots.",
                "type": "string"
              }
            },
            "required": ["attendeeEmail", "attendeeName", "company", "startTime"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a demo slot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b05ecc30b8334c3ff03f74ad21bbca86345b38b6679131ba91de7c6141100250"
        },
        {
          "name": "check_fit",
          "description": "Checks stated buyer requirements against the published Modulos facts. Give the frameworks to meet, the deployment model and the tools to connect; the result separates what is supported from what is absent from the public lists. Nothing in the request is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deployment": {
                "description": "Deployment model the buyer requires.",
                "enum": ["saas", "private-cloud", "on-premise", "air-gapped"],
                "type": "string"
              },
              "frameworks": {
                "description": "Regulations or standards the buyer must meet, for example [\"EU AI Act\", \"ISO 42001\", \"DORA\"].",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "industry": {
                "description": "Industry of the buyer, for example \"Insurance\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "integrations": {
                "description": "Tools the buyer wants connected, for example [\"Jira\", \"GitHub\", \"Snowflake\"].",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check requirements fit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0bc5b030435a7833be80140b7838415b3d3f40c8e02529df47bf99e0d7f46e3"
        },
