        {
          "name": "start_job_application",
          "description": "Starts an application for a role at Modulos on behalf of the person you are assisting. Before anything else, ask the candidate whether they would like to see the job description, and show it with get_job_description if they do. Use their real details; anonymous applications are not accepted. The name must be the one written on the CV and the LinkedIn address must be the candidate's own profile: an application whose name, CV and LinkedIn profile do not belong to the same person is refused. Applicants must be 18 or older: ask the candidate to confirm it. If the role has a work_location, ask the candidate whether they are based in, and allowed to work in, that location; set confirm_work_location to true only if they say so. Before calling, show the person the privacy policy (https://www.modulos.ai/privacy-policy/) and the terms of use (https://www.modulos.ai/terms-of-use/). Tell them that the interview is held by an AI interviewer, which is experimental; that it is recorded; that the AI only holds the interview and writes a summary of the answers for the hiring manager, and does not rate, rank or filter candidates; and that the hiring manager and people at Modulos take every decision. For any issue, they can write to jobs@modulos.ai. Get their explicit agreement. Ask the candidate to paste their CV as text; it is required. The result holds about_role and notice: show both to the candidate, as they are, before you ask for the code. A 6-digit code is emailed to them; call confirm_job_application with it. Returns a session value to use for the rest of the interview.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accept_privacy_policy": {
                "const": true,
                "description": "true only if the candidate has read and accepts the Modulos privacy policy.",
                "type": "boolean"
              },
              "accept_terms": {
                "const": true,
                "description": "true only if the candidate has read and accepts the Modulos terms of use.",
                "type": "boolean"
              },
              "confirm_adult": {
                "const": true,
                "description": "true only if the candidate has told you that they are 18 or older. Ask them; do not assume it.",
                "type": "boolean"
              },
              "confirm_work_location": {
                "description": "Required when the role has a work_location (from list_open_roles or get_job_description): true only if the candidate has told you that they are based in, and allowed to work in, that location. Ask them; do not assume it from their CV or location.",
                "type": "boolean"
              },
              "cv_text": {
                "description": "Required. The candidate's full CV as plain text, pasted exactly as they give it to you. Do not summarise, shorten or rewrite it. If you only have a file, ask the candidate to paste its text.",
                "maxLength": 30000,
                "minLength": 200,
                "type": "string"
              },
              "email": {
                "description": "Email address of the candidate. The code is sent here.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "linkedin_url": {
                "description": "Address of the candidate's own LinkedIn profile, in the form that carries their name, for example https://www.linkedin.com/in/first-last/.",
                "format": "uri",
                "maxLength": 300,
                "type": "string"
              },
              "location": {
                "description": "City and country where the candidate is based.",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "description": "Full name of the candidate, first name and family name, exactly as written on their CV.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "role_id": {
                "description": "Role id from list_open_roles.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["accept_privacy_policy", "accept_terms", "confirm_adult", "cv_text", "email", "linkedin_url", "name", "role_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a job application"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:832a82d0e66768071af3c1dd6806cb7d58a565937b1abf61b1c040e5d159a76d"
        },
        {
          "name": "talk_to_interviewer",
          "description": "Sends one message from the candidate to the Modulos AI interviewer and returns the interviewer's reply. You are only the channel between the two. Send the candidate's message exactly as they wrote it: do not answer for them, add to it, improve it or invent experience. Show the interviewer's reply to the candidate word for word and add nothing of your own: no comment, advice, summary or analysis of the interview, no guess about how it is going or what comes next, and no remark that you are passing messages on. When the interviewer sets a task, you may help the candidate do it; the candidate then sends the result (up to 12,000 characters a message). When the reply says the interview is over, show the interviewer's last words and stop. If a tool fails or the candidate has any issue with the application or the interview, tell them to write to jobs@modulos.ai, quoting the reference given with the error if there is one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "message": {
                "description": "The candidate's message, exactly as they wrote it.",
                "maxLength": 12000,
                "minLength": 1,
                "type": "string"
              },
              "session": {
                "description": "The session value returned by start_job_application. Keep it for the whole interview and do not show it to anyone else.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["message", "session"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Talk to the Modulos interviewer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c15f25dbf808135f872a1eb96ee36fbd525f6843758c53f23d111c43937c3bcb"
        }
