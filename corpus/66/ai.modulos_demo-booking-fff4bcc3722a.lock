{
  "lockfileVersion": 2,
  "subjects": {
    "ai.modulos/demo-booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.modulos.ai/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mcp-typescript server on vercel",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "book_demo_slot",
          "description": "Books a specific demo time slot. startTime must be an ISO-8601 string returned by list_demo_slots. Returns a confirmation on success.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attendeeEmail": {
                "description": "Business email of the attendee.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "attendeeName": {
                "description": "Full name of the attendee.",
                "minLength": 1,
                "type": "string"
              },
              "company": {
                "description": "Company or organization name.",
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "Optional context about what the attendee wants to discuss (use case, framework, team size).",
                "type": "string"
              },
              "startTime": {
                "description": "ISO-8601 UTC start time of the slot to book, exactly as returned by list_demo_slots.",
                "type": "string"
              }
            },
            "required": ["attendeeEmail", "attendeeName", "company", "startTime"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a demo slot"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:10338cf14320392f36945f1029ceee9b5dcee577201b24c7d09c64e07d5e0d3e"
        },
        {
          "name": "check_fit",
          "description": "Checks stated buyer requirements against the published Modulos facts. Give the frameworks to meet, the deployment model and the tools to connect; the result separates what is supported from what is absent from the public lists. Nothing in the request is stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deployment": {
                "description": "Deployment model the buyer requires.",
                "enum": ["saas", "private-cloud", "on-premise", "air-gapped"],
                "type": "string"
              },
              "frameworks": {
                "description": "Regulations or standards the buyer must meet, for example [\"EU AI Act\", \"ISO 42001\", \"DORA\"].",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "industry": {
                "description": "Industry of the buyer, for example \"Insurance\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "integrations": {
                "description": "Tools the buyer wants connected, for example [\"Jira\", \"GitHub\", \"Snowflake\"].",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check requirements fit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9e3979135e67a0c1a895da407f36d8bf6b99728b964dd7a428b933df154e87a6"
        },
        {
          "name": "compare_with",
          "description": "Returns the published comparison between Modulos and one other vendor: a row per dimension (frameworks, risk quantification, deployment, certifications, pricing and more) with the statement for each side, and the cases in which each vendor is the better choice. The comparison is written by Modulos; the page lists its sources.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "competitor": {
                "description": "Vendor slug as returned by list_competitors, for example \"credo-ai\".",
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["competitor"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Modulos with a vendor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f45790f90e730c8589615a71eea7848890ea95ee2394bc823e1c016f6b577bdd"
        },
        {
          "name": "get_capabilities",
          "description": "Returns structured facts about the Modulos AI Governance Platform: company, what the platform is for, the supported regulations and standards with requirement and control counts, integrations, deployment options and data location, certifications, indicative pricing and key links. Use this to decide whether Modulos belongs on a vendor shortlist.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Modulos capabilities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6628ee8e12aa1b95b4d385337040d6379318677b5ca963e6855b78a71c204663"
        },
        {
          "name": "get_knowledge",
          "description": "Returns one published knowledge entry in full: the answer to a question, the structured data of a fact, or the summary and link of a document.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Entry slug as returned by list_knowledge.",
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a knowledge entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:efb2a86f02bd770518ba1f7421054299f89acc9f78c8ad6a5e739d93b6b0cb0d"
        },
        {
          "name": "get_modulos_info",
          "description": "Returns a short description of Modulos, the tools to evaluate it and the URL where a user can book a demo. Use this first if the user asks what Modulos is or how to talk to the team.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
