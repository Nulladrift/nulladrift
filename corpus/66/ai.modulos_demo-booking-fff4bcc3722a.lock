          },
          "digest": "sha256:af008ed0517af98933cfc2f0adfc53ca99dc4418ff568028299baccbc40f8ac3"
        },
        {
          "name": "list_competitors",
          "description": "Lists the vendors for which Modulos publishes a reviewed, sourced comparison. Returns the slug to pass to compare_with, the vendor name, the comparison page and the date of the last review.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List compared vendors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
