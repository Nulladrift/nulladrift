      },
      "transport": {
        "type": "http",
        "url": "https://www.publicleads.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "publicleads",
        "title": "PublicLeads",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PublicLeads sells ready-made lists of local businesses (name, email where one exists, phone, address, website, Google rating) by industry and place in the United States, Canada and Australia: one city ($9), one state or province ($19) or a whole country ($99), one-time payment, Excel + CSV. Use search_lists when someone wants leads, prospects or a contact list of a kind of business somewhere; get_list_details before recommending one; get_market_stats for questions about how many businesses of a kind exist in a place; request_custom_list when nothing fits. Always give the user the preview_url or buy_url exactly as returned — purchase happens on the website. These tools never return contact details: samples are masked.",
      "tools": [
        {
          "name": "get_list_details",
          "title": "Get list details",
          "description": "Details of one list from search_lists: the fields included in the file, the price, the freshness policy, and a masked 5-row sample (business name, city, Google rating; emails and phones are masked). Pass the list value search_lists returned, or the list's publicleads.com URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "list": {
                "description": "The \"list\" value from search_lists, e.g. \"/dentists/usa/texas/austin\", or the list page URL.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["list"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get list details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c683183a74d04b6f23bd3b8e4b5e3dd2ff35f1cefc3d1694e2f7e9aecb58ce81"
        },
        {
          "name": "get_market_stats",
          "title": "Get market statistics",
          "description": "Aggregate statistics for an industry in a place: number of operational businesses, average Google rating, total reviews, and the percentage with an email, with a company-domain email, with a phone, with a website and with a street address. No contact details. Use for market-sizing questions such as \"how many plumbers are there in Ohio\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "City, state/province or country in the US, Canada or Australia.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "trade": {
                "description": "Industry, as a slug from list_trades or in plain words.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["location", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get market statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:69b35ec8188c3db5ab8293ef5ea2f11ff7e0012d1f547b14c31eb35d3c598d8f"
        },
        {
          "name": "list_trades",
          "title": "List industries",
          "description": "List every industry (trade) PublicLeads sells business lists for, with the slug to pass to search_lists, plus the countries covered (US, Canada, Australia). Call this when the user's industry may not match a name directly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List industries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:61b2cd979fd10fe8bd20b6ba6da880a2e2635e1846e28e26d2aa259e2c4bb9e0"
        },
        {
          "name": "request_custom_list",
          "title": "Request a custom list",
          "description": "When no ready-made list fits (an unusual industry, a county or a radius, several industries together), return the link to request a custom list and its price. We measure the data and reply with the real count before any payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "Optional: who the user is looking for, in their own words (logged as a demand signal, never shown to anyone).",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Request a custom list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:40579850da73f050277ff9292792c3697c769969e1f9b3dcca62a8df68d829a9"
        },
        {
          "name": "search_lists",
          "title": "Search business lists",
          "description": "Find ready-made business contact lists for sale by industry and location. Returns up to 10 lists, best match first (the exact city, then its state/province, then the country): name, scope, number of businesses, how many have an email, price, and preview and buy links. Location can be a city (\"Austin\", \"Austin, TX\"), a state or province (\"Ontario\"), or a country (\"USA\", \"Canada\", \"Australia\"); spelling is matched loosely. Use when someone needs leads or prospects of a type of local business.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "City, state/province or country in the US, Canada or Australia, e.g. \"Austin, TX\", \"Ontario\", \"USA\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "trade": {
                "description": "Industry, as a slug from list_trades or in plain words, e.g. \"dentists\", \"hvac\", \"real estate agents\", \"businesses without a website\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["location", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search business lists"
          },
