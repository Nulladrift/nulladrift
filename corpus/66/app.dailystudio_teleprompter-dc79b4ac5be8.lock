            "readOnly": false
          },
          "digest": "sha256:1817696319faa91e6113d434dc99bb679ba3eece3d9a61ec871a6d663b6d3036"
        },
        {
          "name": "send_script_to_teleprompter",
          "title": "Send script to teleprompter",
          "description": "Turn one or more finished video scripts into a single one-tap link that opens the user's Daily Studio app with the script(s) loaded into the teleprompter and the right platform safe-zones selected, ready to record. For one script use `text`; for a batch the user will record back-to-back (a day's 3-4 videos, or a whole content plan — up to 100), use `scripts` — they land as an in-app shoot queue in order, and ONE link carries them all. Call this only once the scripts are final. Returns a link the user taps on their iPhone; on a desktop it opens a page with a QR code to scan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "platform": {
                "description": "Where the video will be published. Selects that platform's safe-zone overlay so on-screen UI never covers the creator. Omit to leave the user's choice alone. With `scripts`, applies to items that don't set their own.",
                "enum": ["TikTok", "Instagram", "YouTube", "Facebook", "X Twitter", "Generic", "None"],
                "type": "string"
              },
              "scripts": {
                "description": "A batch of scripts (in recording order) delivered as a single link — up to 100 of them, 400000 characters of script in total. The app queues them; after each recording it offers the next. Provide either this or `text`, not both.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "platform": {
                      "enum": ["TikTok", "Instagram", "YouTube", "Facebook", "X Twitter", "Generic", "None"],
                      "type": "string"
                    },
                    "text": {
                      "description": "The finished talking-head script: one hook, one idea and a short closing, plain UTF-8.",
                      "maxLength": 8000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "description": "Short label shown in the app's shoot queue, e.g. 'Video 2: myth-busting'.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "wpm": {
                      "maximum": 300,
                      "minimum": 60,
                      "type": "integer"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "text": {
                "description": "A finished talking-head script to speak directly to camera, plain UTF-8. Newlines allowed. Provide either this or `scripts`, not both.",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "Optional short label for `text`, e.g. 'Cold plunge hook'.",
                "maxLength": 120,
                "type": "string"
              },
              "wpm": {
                "description": "Optional scroll speed in words per minute. Sets the app's teleprompter speed. Omit to leave the user's setting alone. With `scripts`, applies to items that don't set their own.",
                "maximum": 300,
                "minimum": 60,
                "type": "integer"
              }
            },
            "type": "object"
          },
