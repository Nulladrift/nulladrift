          "digest": "sha256:ffc79191c0198531e3e09ad416eee0fa43931e51f4a7614cf7cbf40b254a842e"
        },
        {
          "name": "get_planned_scripts",
          "title": "Read scripts in full",
          "description": "Read the full text of specific scripts in the user's content plan, by id — the words themselves, not just titles. Use it before rewriting or reviewing a script, or when the user asks about one ('check the hook on Tuesday's'). Up to 20 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "The scripts to read in full, at most 20 per call. Ids come from list_planned_scripts.",
