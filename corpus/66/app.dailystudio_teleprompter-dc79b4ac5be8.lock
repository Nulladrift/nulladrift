        },
        {
          "name": "retry_scheduled_post",
          "title": "Retry a failed post",
          "description": "Put one failed post back in the queue, due now — by id from list_scheduled_posts. Use it after the cause in the failure sentence is fixed (say, a reconnected account). The post goes out within about five minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The post's id, from list_scheduled_posts.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
