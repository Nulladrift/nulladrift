        {
          "name": "list_connected_accounts",
          "title": "List connected social accounts",
          "description": "List the social accounts the user has connected to Daily Studio, so you know where a video could be published and under which handle. Requires a connected Daily Studio account — the first time you call this, the user is asked to connect one, and the call is retried automatically afterwards. Nothing is published by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1256a51d998a2ecaab6ec1afce644dfab73bf4a6db5057f73cd436709153af6f"
        },
        {
          "name": "list_planned_scripts",
          "title": "Read the content plan",
          "description": "Read what is already in the user's Daily Studio content plan — each script's id, title, collection, the day it goes out, its place in the shoot order, and how far it has got (written, recorded, uploaded, scheduled, published, or failed). Call this before adding to a plan so you do not repeat what is there, before editing so you hold real ids, and whenever the user asks what they have coming up. Nothing is changed by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Only scripts in this collection. Omit to read the whole plan.",
                "maxLength": 80,
                "type": "string"
              },
              "from": {
                "description": "Only scripts dated on or after this day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "includeUndated": {
                "description": "Include scripts with no date at all (the backlog). Default true.",
                "type": "boolean"
              },
              "to": {
                "description": "Only scripts dated on or before this day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1286827b34869d17d650642d68af1d1d249c7f63a36a833c1e337d53eb8727fc"
        },
        {
          "name": "list_scheduled_posts",
          "title": "Read the publishing queue",
          "description": "Read what the user has approved for publishing and what happened to it: waiting, going up now, published (with the link), failed (with the reason in plain words), or cancelled. Call it when the user asks 'did my post go out?' or 'why not?'. Nothing is changed by this tool, and new posts cannot be scheduled from here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Only posts in this state. Omit for the whole queue, newest first.",
                "enum": ["scheduled", "publishing", "published", "drafted", "failed", "cancelled"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:128c4cfa3d0a6797641fd180def4e07eff2a4a8183c1602e497bb5e120ec38a4"
        },
        {
          "name": "reorder_planned_scripts",
          "title": "Set the shoot order",
          "description": "Set the order the user's camera walks through their scripts — pass ids first-to-record first. Scripts you leave out keep their current order after the ones you name. Use it when the user says what to shoot first, or after planning a batch that should be recorded in sequence.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "Script ids in the order they should be recorded, first first. Scripts you leave out keep their current order, after the ones you name.",
                "items": {
                  "maxLength": 64,
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
