      "tools": [
        {
          "name": "add_scripts_to_plan",
          "title": "Add scripts to the content plan",
          "description": "Put finished talking-head scripts into the user's Daily Studio content plan, each with the day it should go out. Use this when the user asks you to PLAN — a week, a month, a series — rather than to hand them something to record right now. The plan lives on their account: it shows up in the app, on dailystudio.app/plan, and stays there. Calling this twice with the same scripts is safe; duplicates are skipped. Requires a connected Daily Studio account with the plan turned on. To record something immediately, use `send_script_to_teleprompter` instead — that is a delivery, this is a plan. Default to about 45 seconds of natural speech directly to camera: a hook, one clear idea and a short closing. Preserve the creator's voice and verified facts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Optional name for this batch as a group — a topic ('Customer questions'), a series ('Framing, part 1-5'), or what the week is about. The scripts show up grouped under it in the app and on the web, which is how somebody finds them again later. Use one when the scripts belong together; leave it out for a handful of unrelated ones.",
                "maxLength": 80,
                "type": "string"
              },
              "scripts": {
                "description": "The scripts to add, in the order they should sit in the plan.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "collection": {
                      "description": "Overrides the batch's collection for this one script. Rarely needed.",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "date": {
                      "description": "The day this should go out, as YYYY-MM-DD in the user's own calendar. Omit if the plan is not dated yet — an undated script is a normal thing to have and shows up as backlog.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "id": {
                      "description": "Optional stable key of YOUR choosing for this script (an idempotency key). Re-sending a batch with the same keys updates those scripts instead of duplicating them — use it when a call may be retried, or to deliberately revise scripts you added earlier.",
                      "maxLength": 64,
                      "type": "string"
                    },
                    "platform": {
                      "description": "Where it is meant to be published. Selects that platform's safe-zone overlay when it is recorded.",
                      "enum": ["TikTok", "Instagram", "YouTube", "Facebook", "X"],
                      "type": "string"
                    },
                    "text": {
                      "description": "The finished talking-head script to speak directly to camera: one opening, one clear idea and a short closing. Default about 45 seconds of natural speech. Plain UTF-8; newlines allowed.",
                      "maxLength": 20000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "description": "Short label, e.g. 'Cold plunge hook'. Shown as the row's name in the app and on the web.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "wpm": {
                      "description": "Optional teleprompter speed for this script.",
                      "maximum": 260,
                      "minimum": 60,
                      "type": "integer"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["scripts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:822ddf2f6dc3aee074495e32fb2834f3fe8b24ecf2e19e0469a392c64b55bd85"
        },
        {
          "name": "archive_planned_scripts",
          "title": "Archive planned scripts",
          "description": "Archive scripts out of the user's working plan, by id — or restore archived ones with `restore: true`. Archiving is reversible and keeps the script and any recorded video; it is the right way to clear finished or shelved work. Permanent deletion is deliberately not available to assistants — the user does that themselves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "The scripts to archive (or restore). Ids come from list_planned_scripts.",
                "items": {
                  "maxLength": 64,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "restore": {
                "description": "true brings archived scripts back into the plan instead. Default false.",
                "type": "boolean"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0d81976a2c6bdbe76048e53dc93db8046d6257aa0d9f9d13c0f1a2d44066ef22"
        },
        {
          "name": "cancel_scheduled_post",
          "title": "Cancel a scheduled post",
          "description": "Cancel one post that is waiting to go out, by id from list_scheduled_posts. Only works while the post is still waiting; the take becomes approvable again. Confirm with the user before calling this — it withdraws something they approved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The post's id, from list_scheduled_posts.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:064b6af002f8cfe4d0b522d6de8b4bbb92e76ec01334a86007a110f14435c561"
        },
        {
          "name": "edit_planned_scripts",
          "title": "Edit planned scripts",
          "description": "Change scripts already in the user's Daily Studio content plan, by id and in bulk: move them to other days, group them into collections, retitle or rewrite them. This is the tool for 'these contents go on these days, grouped like this' when the content already exists — read the plan first with list_planned_scripts, then send one call with all the changes. Only the fields you send change; one bad entry never drops the batch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "edits": {
                "description": "The changes, one entry per script. Only the fields you send change; everything else stays. Get ids from list_planned_scripts.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "collection": {
                      "description": "Move to this pile; null takes it out of its pile.",
                      "maxLength": 80,
                      "type": ["string", "null"]
                    },
                    "date": {
                      "description": "New go-out day (YYYY-MM-DD, the user's own calendar); null makes it undated.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "The script's id, from list_planned_scripts or add_scripts_to_plan.",
                      "maxLength": 64,
                      "type": "string"
                    },
                    "platform": {
                      "enum": ["TikTok", "Instagram", "YouTube", "Facebook", "X"],
                      "type": "string"
                    },
                    "text": {
                      "description": "Replacement script text.",
                      "maxLength": 20000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "description": "New title; null clears it.",
                      "maxLength": 200,
                      "type": ["string", "null"]
                    },
                    "wpm": {
                      "maximum": 260,
                      "minimum": 60,
                      "type": "integer"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["edits"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
