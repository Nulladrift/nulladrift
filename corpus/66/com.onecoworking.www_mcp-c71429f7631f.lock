        {
          "name": "request_office_quotes",
          "title": "Request office quotes",
          "description": "Use this when the person wants prices and availability for an office or team space and the brief is clear (start_office_brief): One Coworking asks the spaces and negotiates for them, free for the person. Only after they agreed to share name, company and email. Pass every answer from the brief and up to 6 venue slugs they want asked. Nothing reaches a space yet: they get a 6-digit code by email — then call confirm_email_code. Not for day passes or meeting rooms (monthly_membership = desks on a monthly plan).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "alternatives": {
                "description": "What else they consider: a traditional lease, a sublease, staying, going remote, another broker, spaces asked directly.",
                "maxLength": 300,
                "type": "string"
              },
              "area": {
                "description": "District(s), street or station they want to be near.",
                "maxLength": 120,
                "type": "string"
              },
              "budget_monthly_max_eur": {
                "description": "Total monthly budget in EUR, not per desk.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "budget_monthly_min_eur": {
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "city": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "company": {
                "description": "The company, or \"private\" for an individual.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "true: the person agreed that One Coworking stores these details and contacts spaces for them.",
                "type": "boolean"
              },
              "context": {
                "description": "Stage, what matters most, current space, spaces already contacted.",
                "maxLength": 400,
                "type": "string"
              },
              "current_lease_end": {
                "description": "When their current lease ends, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "decision": {
                "description": "Who decides and by when: a role (themselves, founder, CFO, board, parent company), never a person's name, plus the date if they named one.",
                "maxLength": 300,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "firstname": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "private_room = a room with a door.",
                "enum": ["private_room", "fixed_desks", "flex_desks"],
                "type": "string"
              },
              "inquiry_type": {
                "default": "private_office",
                "enum": ["private_office", "monthly_membership"],
                "type": "string"
              },
              "lastname": {
                "maxLength": 100,
                "type": "string"
              },
              "locale": {
                "description": "Language for One Coworking's emails.",
                "enum": ["en", "de", "pl", "es"],
                "type": "string"
              },
              "message": {
                "description": "Anything else the broker should know.",
                "maxLength": 4000,
                "type": "string"
              },
              "move_in_date": {
                "description": "A move-in day the person named, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "move_in_timeframe": {
                "enum": ["immediate", "1m", "3m", "flexible"],
                "type": "string"
              },
              "must_haves": {
                "description": "Must-haves and deal-breakers.",
                "maxLength": 400,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "team_size": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "team_size_in_12_months": {
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
