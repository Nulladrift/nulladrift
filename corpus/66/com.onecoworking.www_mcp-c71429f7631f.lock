        {
          "name": "request_meeting_space",
          "title": "Request a meeting or event space",
          "description": "Use this when the person needs a meeting room or event space that one booking link cannot carry: several days (each with its own times and headcount), several rooms at the same time, a seating layout, catering or equipment — e.g. a 2-day workshop for 20 with a projector and lunch, or two rooms in parallel for interviews. One room on one day: get_booking_links. A regular slot (every week, every second Monday) is a monthly membership: request_office_quotes with inquiry_type monthly_membership. Before calling, read the whole request back to the person — days, times, people, rooms, layout, catering, equipment, budget, spaces — and get their yes; only after they agreed to share name, company and email. No guest list. Pass up to 3 venue slugs from search_venues (the first is asked first), or only a city. Nothing reaches a space yet: the person gets a 6-digit code by email — then call confirm_email_code. The space and One Coworking confirm availability and price by email; this call books nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "av": {
                "default": [],
                "items": {
                  "enum": ["screen", "projector", "video_conferencing", "whiteboard", "flipchart"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "budget_total_eur": {
                "description": "For the whole booking in EUR, not per hour or per day.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "catering": {
                "default": [],
                "items": {
                  "enum": ["coffee", "drinks", "lunch", "snacks"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "city": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "company": {
                "description": "The company, or \"private\" for an individual.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "true: the person agreed that One Coworking stores these details and passes the request to spaces for them.",
                "type": "boolean"
              },
              "days": {
                "description": "One row per day, all within a month: e.g. Tue 12:00–18:00 for 20, Wed 08:00–14:00 for 20.",
                "items": {
                  "properties": {
                    "date": {
                      "description": "YYYY-MM-DD, today or later.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "from": {
                      "description": "Start, HH:MM (24 h).",
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "people": {
                      "maximum": 500,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "to": {
                      "description": "End, HH:MM (24 h), after the start.",
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    }
                  },
                  "required": ["date", "from", "people", "to"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "email": {
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "firstname": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "lastname": {
                "maxLength": 100,
                "type": "string"
              },
              "layout": {
                "default": "any",
                "enum": ["boardroom", "classroom", "theatre", "u_shape", "workshop_tables", "any"],
                "type": "string"
              },
              "locale": {
                "description": "Language for One Coworking's emails.",
                "enum": ["en", "de", "pl", "es"],
                "type": "string"
              },
              "must_haves": {
                "description": "Anything else the space must offer, in the person's words — e.g. step-free access, vegetarian lunch. No names, company or contact details.",
                "maxLength": 300,
                "type": "string"
              },
              "near": {
                "description": "A street, station or district to be near, in the person's words. No names or contact details.",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "rooms": {
                "default": 1,
                "description": "Rooms needed at the same time — 2 for parallel interviews, 5 for a plenary and four breakouts.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "venue_slugs": {
                "default": [],
                "items": {
                  "pattern": "^[a-z0-9][a-z0-9-]{0,200}$",
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "required": ["city", "company", "consent", "days", "email", "firstname"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a meeting or event space"
          },
          "behavior": {
