        {
          "name": "get_booking_links",
          "title": "Get booking links",
          "description": "Use this when the person wants a day pass or a meeting room. Pass up to 3 venue slugs from search_venues (or only a city — and near, when they want to be close to a place — for the nearest spaces that book directly), the date and how many people. Returns, per space, a One Coworking booking link with date and party size filled in — confirmed when the person pays — or the venue page where they send a request (the space confirms by hand, so prefer instant spaces for a close date). A day pass for several days at one space is one link and one checkout: pass dates (up to 10). A meeting room is one day per link; a workshop or event with a room on several days, several rooms, catering or a seating layout needs a quote, not a link: use request_meeting_space. Not for private offices: use request_office_quotes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "Only needed without venue_slugs.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dates": {
                "description": "A day pass for several days at one space: every day, YYYY-MM-DD (consecutive or not). Instead of date.",
                "items": {
                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "end_time": {
                "description": "HH:MM the space is needed until (skips spaces closed by then).",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "near": {
                "description": "A station, landmark, hotel or street address to be close to, e.g. \"Hauptbahnhof\", \"Sendlinger Straße 10\". Without venue_slugs: the spaces nearest to it that book directly; with them: walking minutes to each.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "people": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "enum": ["day_pass", "meeting_room"],
                "type": "string"
              },
              "venue_slugs": {
                "default": [],
                "items": {
                  "pattern": "^[a-z0-9][a-z0-9-]{0,200}$",
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
