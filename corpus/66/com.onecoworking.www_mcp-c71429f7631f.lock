        {
          "name": "search_venues",
          "title": "Search coworking venues",
          "description": "Use this when the person wants spaces in a city listed on One Coworking. product filters (day_pass, meeting_room, private_office, office_suite, flex_desk, fix_desk, day_office, membership); max_price is EUR in that product's unit (offices: per desk per month, day passes: per day, meeting rooms: per hour). For private_office / office_suite the answer is a broker's shortlist — the well-known brands in the city, then local operators that fit team_size and area; view \"list\" gives the plain list ranked by fit and price instead. bookable \"instant\" / \"online\" keeps venues that book online. Cite the venue pages; get_venue has one venue's details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Districts the person wants, e.g. \"Kreuzberg or Mitte\" — office shortlists prefer spaces there.",
                "maxLength": 160,
                "type": "string"
              },
              "bookable": {
                "enum": ["instant", "online"],
                "type": "string"
              },
              "budget_monthly_eur": {
                "description": "Total monthly budget for the team, EUR — office shortlists say which options fit it.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "city": {
                "description": "City name in English, e.g. \"Berlin\", \"Munich\", \"London\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "near": {
                "description": "A station, landmark, hotel or street address in the city to be close to, e.g. \"Hauptbahnhof\", \"Rudi-Dutschke-Straße 5\". Ranks spaces by walking minutes from it.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "product": {
                "enum": ["day_pass", "meeting_room", "private_office", "flex_desk", "fix_desk", "day_office", "membership", "office_suite"],
                "type": "string"
              },
              "team_size": {
                "description": "People the office must seat. Ranks offices that fit first; applies with product private_office or office_suite.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "view": {
                "description": "Office searches only: shortlist (default) or the plain ranked list.",
                "enum": ["shortlist", "list"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search coworking venues"
