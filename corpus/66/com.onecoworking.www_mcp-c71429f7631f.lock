              "dates": {
                "items": {
                  "properties": {
                    "date": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "window": {
                      "default": "either",
                      "enum": ["am", "pm", "either"],
                      "type": "string"
                    }
                  },
                  "required": ["date"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "maxLength": 1000,
                "type": "string"
              },
              "venue_slug": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,200}$",
                "type": "string"
              },
              "visitors": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["access_key", "dates", "venue_slug"],
            "type": "object"
