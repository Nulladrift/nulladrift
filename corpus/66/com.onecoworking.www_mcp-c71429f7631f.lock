          "name": "confirm_email_code",
          "title": "Confirm the email code",
          "description": "Confirm an office or meeting request with the 6-digit code One Coworking emailed the person. Only then does the request reach One Coworking. Returns a reference and an access key — keep the key for get_request_status (and, for an office, request_viewing) in this conversation.",
