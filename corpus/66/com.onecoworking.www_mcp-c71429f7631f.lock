        {
          "name": "request_viewing",
          "title": "Request a viewing",
          "description": "Ask One Coworking to arrange a viewing of a space for a confirmed office request. Give up to 3 preferred dates, each before lunch (am), afternoon (pm) or either. A broker agrees the time with the space and confirms it to the person by email, usually within one working day — this call does not confirm a time.",
