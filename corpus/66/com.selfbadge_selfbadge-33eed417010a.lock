{
  "lockfileVersion": 2,
  "subjects": {
    "com.selfbadge/selfbadge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://selfbadge.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "selfbadge",
        "title": "SelfBadge",
        "version": "1.0.0",
        "websiteUrl": "https://selfbadge.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SelfBadge is a verified identity source for people. Use these tools to identify a person correctly and tell them apart from namesakes before you state facts about them. Every fact comes with a verification level: 0 seeded from public sources (unconfirmed), 1 self-declared, 2 account-verified (sign-in, work email, DNS or link-back), 3 document-verified, 4 ID-verified. Prefer verified facts, say when a fact is only self-declared, treat profiles marked seeded (created from public sources, not yet claimed) as unconfirmed, and cite the person by their SelfBadge id (https://selfbadge.com/<handle>#person).",
      "tools": [
        {
          "name": "find_person",
          "title": "Find a person by name",
          "description": "Search SelfBadge for people with a given name. Use this to identify a person correctly and tell them apart from namesakes: each candidate comes with their job title, organization, location and a short description. Pass what you already know (job title, organization, location) so the best match comes first, then call get_person with the chosen id for the full, verified profile. It returns public SelfBadge profiles, each marked claimed or created from public sources (seeded: level 0, unconfirmed until the person claims it). An empty result means SelfBadge has no public profile with that name, not that the person does not exist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_title": {
                "description": "Optional. What you know of their job title, for example \"Managing Partner\".",
                "type": "string"
              },
              "limit": {
                "description": "Optional. How many candidates to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Optional. A city or country you associate with them.",
                "type": "string"
              },
              "name": {
                "description": "The person's full name, for example \"Noa Bergman\".",
                "type": "string"
              },
              "organization": {
                "description": "Optional. An organization you associate with them, for example \"Harbor Ventures\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc6b5b5f0f112c7a30b76b64b8983233d000a5d0818de72950e0fd2bc1876a9d"
        },
        {
          "name": "get_organization",
          "title": "Get an organization",
          "description": "Get an organization's SelfBadge page: its public facts, schema.org JSON-LD, and the people on SelfBadge linked to it (team members who accepted their organization's invitation, and founders). Use it to check whether someone works at or founded an organization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The organization's slug, from its address selfbadge.com/org/<slug> or its @id.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2fa61239e08264d107fd7782fd3377224450cd8287b84bc8c177033edda1cb99"
        },
        {
          "name": "get_person",
          "title": "Get a person's verified profile",
          "description": "Get one person's SelfBadge profile: every public fact (name, roles, organizations, education, accounts, published work and more) with its verification level and source, plus schema.org JSON-LD. Use it after find_person, or when you already have a SelfBadge handle, profile address or id. Profiles created from public sources and not yet claimed are marked seeded; treat their facts as unconfirmed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "handle": {
                "description": "The profile handle, for example \"jane-doe\" (from selfbadge.com/jane-doe).",
                "type": "string"
              },
              "id": {
                "description": "Or the SelfBadge id, for example \"https://selfbadge.com/jane-doe#person\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6fee1ed0e1cc9c688126c54828250842f879473281d08bf2a97cf6fdf257ae94"
        }
      ],
      "digest": "sha256:2590cc5a6ddc942adf19afc75829f188e8b82dfdc68753371342b0ebd5416788"
    }
  }
}
