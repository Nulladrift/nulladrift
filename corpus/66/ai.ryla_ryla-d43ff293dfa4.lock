        {
          "name": "ryla_generate_image",
          "description": "Generate Studio-quality images for an existing character with full creative control (scene, outfit, pose, lighting, expression, style). This is the primary, full-featured image tool -- prefer it over ryla_generate_base_image. Character must already exist; use ryla_list_characters to find a characterId. Returns a jobId; poll with ryla_generation_status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "antiDetectPreset": {
                "description": "Anti-detection intensity (default moderate); advanced/maximum require Pro",
                "enum": ["subtle", "moderate", "aggressive", "advanced", "maximum"],
                "type": "string"
              },
              "aspectRatio": {
                "description": "Image aspect ratio. Required unless templateId is given (then the template ratio is used).",
                "enum": ["1:1", "9:16", "2:3", "4:5", "3:4", "4:3", "16:9", "3:2"],
                "type": "string"
              },
              "characterId": {
                "description": "Character UUID to generate images for",
                "format": "uuid",
                "type": "string"
              },
              "count": {
                "default": 1,
                "description": "Number of images to generate",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "enableFaceSwap": {
                "description": "Route through face-swap for the reference image",
                "type": "boolean"
              },
              "environment": {
                "description": "Environment preset or description",
                "type": "string"
              },
              "expression": {
                "description": "Facial expression preset, e.g. \"positive.smile\"",
                "type": "string"
              },
              "lighting": {
                "description": "Lighting preset, e.g. \"natural.goldenHour\"",
                "type": "string"
              },
              "loraId": {
                "description": "LoRA id to use, if not the default for this character",
                "type": "string"
              },
              "loraStrength": {
                "description": "LoRA strength, 0.1-2.0",
                "maximum": 2,
                "minimum": 0.1,
                "type": "number"
              },
              "nsfw": {
                "default": false,
                "description": "Enable unrestricted fan content generation",
                "type": "boolean"
              },
              "outfit": {
                "description": "Outfit description",
                "type": "string"
              },
              "poseId": {
                "description": "Pose preset id, e.g. \"standing-casual\"",
                "type": "string"
              },
              "promptEnhance": {
                "description": "Enable AI prompt enhancement (default true)",
                "type": "boolean"
              },
              "quality": {
                "description": "Quality tier: \"standard\" or \"2k\" (HD, default), \"ultra\" or \"4k\" (4K, costs more credits)",
                "enum": ["standard", "ultra", "2k", "4k"],
                "type": "string"
              },
              "realismStyle": {
                "description": "Apply realism post-processing style",
                "type": "boolean"
              },
              "referenceImageUrl": {
                "description": "Reference image URL for face consistency (InstantID/PuLID), as an alternative to LoRA",
                "type": "string"
              },
              "referenceMethod": {
                "description": "Reference image method (default instantid)",
                "enum": ["instantid", "pulid", "ipadapter"],
                "type": "string"
              },
              "referenceStrength": {
                "description": "Reference image strength, 0.1-1.0",
                "maximum": 1,
                "minimum": 0.1,
                "type": "number"
              },
              "requestId": {
                "description": "Optional UUID for this generation intent. Omit it and one is created for you (returned in the result). Pass the SAME id when retrying after an error or a lost response, so the retry is not charged twice.",
                "format": "uuid",
                "type": "string"
              },
              "scene": {
                "description": "Scene preset or description. Required unless templateId is given.",
                "type": "string"
              },
              "seed": {
                "description": "Base seed; each image increments it",
                "type": "integer"
              },
              "shotType": {
                "description": "Camera framing, e.g. \"close-up-portrait\", \"full-body\"",
                "type": "string"
              },
              "socialMediaReady": {
                "description": "Apply anti-AI-detection post-processing",
                "type": "boolean"
              },
              "stylePreset": {
                "description": "Visual style preset (default ultraRealistic)",
                "enum": ["ultraRealistic", "instagramReady", "editorialFashion", "casualSelfie", "professionalPortrait"],
                "type": "string"
              },
              "templateId": {
                "description": "Template id from ryla_list_templates. Fills scene, outfit, pose, style, lighting and aspect ratio from the template; anything you set yourself wins.",
                "format": "uuid",
                "type": "string"
              },
              "templateMode": {
                "description": "With templateId: \"exact\" (default) keeps the template pose, outfit and background; \"inspired\" makes a similar but different image.",
                "enum": ["exact", "inspired"],
                "type": "string"
              },
              "useLora": {
                "description": "Use the character LoRA for face consistency, if trained",
                "type": "boolean"
              }
            },
            "required": ["characterId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31a27e085af014330c233040bc81b4beb7c1afd348bc71da03fc36e62157b02c"
        },
