                "description": "Character gender, to pick a default voice when voiceIdentityId is absent",
                "enum": ["female", "male"],
                "type": "string"
              },
              "speed": {
                "description": "Speech speed multiplier, 0.5-2.0",
                "maximum": 2,
                "minimum": 0.5,
                "type": "number"
              },
              "text": {
                "description": "Text to convert to speech (max 1000 chars)",
