      "instructions": "RYLA MCP Server - Generate AI influencer content directly from your assistant.\n\nIMPORTANT: this server generates content FOR characters (AI influencers) that\nalready exist on the account. There is NO tool to create a new character --\ncharacter creation (appearance, voice, persona) is an app.ryla.ai-only flow\nwith its own guided wizard. If asked to \"create an influencer\" or similar,\ntell the user to set that up in the app first, then come back here to\ngenerate content for it. Use ryla_list_characters to see what already exists.\n\n**Discovery:**\n- ryla_list_characters: list your existing characters (no creation tool exists);\n  shows loraReady (does useLora do anything)\n- ryla_list_templates: find templates by name or tag, returns template ids\n- ryla_character_reference_images: base image and reference-sheet URLs of a\n  character, usable as referenceImageUrl\n\n**Generation (primary, full-featured):**\n- ryla_generate_image: full Studio image generation (scene/outfit/pose/\n  lighting/expression/style/LoRA/reference-face-consistency, or a templateId\n  from ryla_list_templates) - prefer this\n- ryla_upscale_image: upscale one of your images 2x or 4x\n- ryla_generate_video: image-to-video generation\n- ryla_generate_voice: text-to-speech in a character's voice\n\n**Generation (narrower, v1):**\n- ryla_generate_base_image: generate base character images from a niche/vibe\n- ryla_generate_face_swap: swap a character face onto a reference image\n- ryla_generate_character_sheet: generate a multi-angle character sheet\n\n**Video swap (Pro, 18+ confirmation):**\n- ryla_video_swap_cost: quote credits before starting (no charge)\n- ryla_generate_video_swap: start a swap of your character into your own\n  uploaded video (outfit/background/trim/resolution/audio/mode options)\n- ryla_video_swap_status: status, result URL, failure reason, engine used\n- ryla_video_swap_in_flight / ryla_video_swap_history: your running and past swaps\n- ryla_video_swap_dismiss: clear a stuck or failed swap\n\n**Status & account:**\n- ryla_generation_status: check a job's status by jobId\n- ryla_account_credits_balance: check your current RYLA credit balance\n- ryla_account_gallery_list: list your most recent generated images/jobs\n\nAuthenticate with a personal API key from app.ryla.ai (Settings > API Keys),\nset as the RYLA_MCP_API_KEY environment variable. Each key is scoped to your\nown account; credits are deducted from your own balance the same way they\nare in the RYLA web app.",
