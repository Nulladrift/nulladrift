          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aspectRatio": {
                "description": "Video aspect ratio",
                "enum": ["1:1", "9:16", "16:9"],
                "type": "string"
              },
              "characterId": {
                "description": "Character UUID to generate video for",
                "format": "uuid",
                "type": "string"
              },
              "duration": {
                "default": 5,
                "description": "Video duration in whole seconds, 2 to 30",
                "maximum": 30,
                "minimum": 2,
                "type": "integer"
              },
              "nsfw": {
                "default": false,
                "description": "Enable unrestricted fan content generation",
                "type": "boolean"
              },
              "prompt": {
                "description": "Optional prompt/description for the motion",
                "type": "string"
              },
              "requestId": {
                "description": "Idempotency key: the same id returns the same job and never charges twice. Generated when omitted.",
                "format": "uuid",
                "type": "string"
              },
              "resolution": {
                "default": "720p",
                "description": "Output resolution (drives the price)",
                "enum": ["480p", "720p", "1080p"],
                "type": "string"
              },
              "sourceImageId": {
                "description": "Image UUID to animate (default: newest completed image)",
                "format": "uuid",
                "type": "string"
              },
              "wantAudio": {
                "description": "Generate sound with the video",
                "type": "boolean"
              }
            },
            "required": ["characterId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f8af6efde7255f650b1c0ce89d068e2ef7397c41bf15fde58ab8e54211a4d84"
        },
        {
          "name": "ryla_generate_video_swap",
          "description": "Swap a character into an existing video. Pro plan and the account 18+ confirmation required. videoUrl must be a video you already uploaded to your RYLA account; use ryla_list_characters to find a characterId and ryla_video_swap_cost for the price first. Returns a jobId; poll with ryla_video_swap_status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audioSetting": {
                "description": "origin keeps the source audio, auto generates new audio",
                "enum": ["auto", "origin"],
                "type": "string"
              },
              "backgroundEnabled": {
                "description": "Change the background",
                "type": "boolean"
              },
              "backgroundPrompt": {
                "$ref": "#/properties/outfitPrompt",
                "description": "Background description, used only when backgroundEnabled is true"
              },
              "characterId": {
                "description": "Character UUID whose face is swapped into the video",
                "format": "uuid",
                "type": "string"
              },
              "mode": {
                "description": "preserve (default) keeps the clip and swaps the person; recreate regenerates the shot",
                "enum": ["preserve", "recreate"],
                "type": "string"
              },
              "outfitEnabled": {
                "description": "Change the outfit",
                "type": "boolean"
              },
              "outfitPrompt": {
                "description": "Outfit description, used only when outfitEnabled is true",
                "maxLength": 500,
                "type": "string"
              },
              "recreateDescription": {
                "$ref": "#/properties/outfitPrompt",
                "description": "Recreate mode only: the scene to restage the clip as"
              },
              "resolution": {
                "description": "Output resolution",
                "enum": ["720P", "1080P"],
                "type": "string"
              },
              "seedanceResolution": {
                "description": "Recreate mode output resolution",
                "enum": ["480P", "720P"],
                "type": "string"
              },
              "sourceType": {
                "description": "Source type (default upload)",
                "enum": ["instagram", "tiktok", "youtube", "upload"],
                "type": "string"
              },
              "trim": {
                "anyOf": [
                  {
                    "items": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "maxItems": 2,
                    "minItems": 2,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Trim range [startSeconds, endSeconds]"
              },
              "videoUrl": {
                "description": "URL of the source video (must be a RYLA-hosted storage URL you own)",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["characterId", "videoUrl"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:32f43e1653fe2a664548b5e7f46a48549210aed37456dff7e07566ee3b21a8ec"
        },
