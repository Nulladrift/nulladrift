              }
            },
            "required": ["characterId", "text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c041e7ffdecd1423c383908abde73cbf9e07497bf87f060af69f59eac7d17fa4"
        },
        {
          "name": "ryla_generation_status",
          "description": "Check the status of a generation job by its jobId.",
