              "audioUrl": {
                "description": "URL of the audio file (MP3/WAV/M4A, max 5MB, 2-60s). Required unless voiceNoteId is set.",
                "format": "uri",
                "type": "string"
              },
              "characterId": {
                "description": "Character UUID to use as the avatar face",
                "format": "uuid",
                "type": "string"
              },
              "duration": {
                "default": 5,
                "description": "Video duration in seconds",
                "enum": [5, 10],
                "type": "number"
              },
              "modelTier": {
                "description": "Model quality tier (default pro)",
                "enum": ["standard", "pro"],
                "type": "string"
              },
              "prompt": {
                "description": "Optional prompt/description for the avatar video",
                "type": "string"
              },
              "sourceImageId": {
                "description": "UUID of a specific image to use as the face source. If omitted, the character base image is used.",
                "format": "uuid",
                "type": "string"
              },
              "voiceNoteId": {
                "description": "UUID of a saved voice note to use as the audio track instead of audioUrl",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["characterId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:79a395faad8644a842d29417fa164c521998a47476fa98f7779955db56d1e29c"
