                "type": "string"
              },
              "portraitImageUrl": {
                "description": "Portrait/face image URL (RYLA-hosted storage URL you own)",
                "format": "uri",
                "type": "string"
              },
              "prompt": {
                "description": "Prompt describing the desired output (required)",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["audioUrl", "portraitImageUrl", "prompt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:671e09a02ae30c58208d09ed74915004c58f1506c5c5d5670b97c3d4c0fbc889"
        },
        {
