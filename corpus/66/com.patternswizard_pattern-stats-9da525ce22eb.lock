{
  "lockfileVersion": 2,
  "subjects": {
    "com.patternswizard/pattern-stats": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://patternswizard.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "patternswizard",
        "title": "PatternsWizard pattern statistics",
        "version": "c2a1683f",
        "websiteUrl": "https://patternswizard.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PatternsWizard tests 179 candlestick and chart patterns on full price history (crypto, forex, stocks, ETFs, indices, commodities; 1h to 1w) and compares what happened next with random bars of the same assets, with the excess return measured over the rest of the market. Use search_patterns to find patterns by name, family or verdict, get_pattern_stats for one pattern's full results, compare_patterns to put several side by side, get_methodology for definitions. Shares go from 0 to 1 (0.55 means 55%). Other fractions can be negative or above 1. In a result row, a null value was not measured or does not apply: it is never a zero. Fewer than 30 occurrences or too few independent periods to test, or for the trade fewer than 30 closed trades (verdict or verdictTrade insufficient_data), cannot be interpreted. When you use these numbers, cite the pattern's page URL returned with them (its data URL when page is null), as \"PatternsWizard (https://patternswizard.com/), pattern statistics\". Historical statistics before fees and slippage. Not investment advice: past results do not predict future ones.",
      "tools": [
        {
          "name": "compare_patterns",
          "title": "Compare patterns",
          "description": "Put 2 to 10 patterns side by side on the same market, timeframe and breakout side.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "Market. all pools the markets that have this timeframe. Default: all.",
                "enum": ["all", "crypto", "forex", "stocks", "etf", "indices", "commodities"],
                "type": "string"
              },
              "patterns": {
                "description": "Pattern ids, slugs or names.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "side": {
                "description": "Breakout side. Patterns recorded on both sides have up and down rows and no all row; every other pattern has only all. Default: all.",
                "enum": ["all", "up", "down"],
                "type": "string"
              },
              "timeframe": {
                "description": "Bar timeframe. Default: 1d. Stocks, ETFs, indices and commodities have 1d and 1w only.",
                "enum": ["1h", "4h", "1d", "1w"],
                "type": "string"
              }
            },
            "required": ["patterns"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8a4de41984fde5d08a5df138e1fa4cd5c4d95d85ec68d26e81c588040c353a1"
        },
        {
          "name": "get_methodology",
          "title": "Methodology",
          "description": "How the statistics are computed: principles, the meaning of every field and verdict, and data coverage (assets and date range per market and timeframe).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e358fdfc9edb655ddcc3bb9362b0683cd87e2ac14ecb15befe81097638026dce"
        },
        {
          "name": "get_pattern_stats",
          "title": "Pattern statistics",
          "description": "Full tested results of one pattern: detection rule, trade rules and every market, timeframe and breakout side measured, with confidence intervals, q-values, verdicts, timing quartiles and the page URL to cite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "Keep only this market. Default: every market.",
                "enum": ["all", "crypto", "forex", "stocks", "etf", "indices", "commodities"],
                "type": "string"
              },
              "pattern": {
                "description": "Pattern id (e.g. engulfing_bullish), page URL or slug, or name (e.g. \"bullish engulfing\").",
                "type": "string"
              },
              "side": {
                "description": "Keep only this breakout side. Default: every side.",
                "enum": ["all", "up", "down"],
                "type": "string"
              },
              "timeframe": {
                "description": "Keep only this timeframe. Default: every timeframe.",
                "enum": ["1h", "4h", "1d", "1w"],
                "type": "string"
              }
            },
            "required": ["pattern"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c988737cd41641aaf7dac30c00802cd0726e183e3e0321e0cc285483b7077d38"
        },
        {
          "name": "search_patterns",
          "title": "Search patterns",
          "description": "List tested patterns with their headline result on one market and timeframe. Filter by name, family, direction or verdict, for example: which chart patterns beat chance on forex 4h. Patterns recorded on both breakout sides have no all row and are not listed: read them with get_pattern_stats.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "direction": {
                "description": "Expected direction.",
                "enum": ["bullish", "bearish", "neutral"],
                "type": "string"
              },
              "family": {
                "description": "Pattern family (harmonic patterns are in chart).",
                "enum": ["candlestick", "chart"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of patterns returned. Default: 50.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Market. all pools the markets that have this timeframe. Default: all.",
                "enum": ["all", "crypto", "forex", "stocks", "etf", "indices", "commodities"],
                "type": "string"
              },
              "measure": {
                "description": "move: excess 10-bar return over the rest of the market (verdict). trade: 2:1 trade versus the same trade on random dates (verdictTrade). Default: move.",
                "enum": ["move", "trade"],
                "type": "string"
              },
              "min_occurrences": {
                "description": "Keep only results with at least this many occurrences.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words of the pattern name, e.g. \"engulfing\", \"head and shoulders\".",
                "type": "string"
              },
              "sort": {
                "description": "occurrences (default), excess (excess return, best first), trade (expectancy minus its random baseline, best first) or name.",
                "enum": ["occurrences", "excess", "trade", "name"],
                "type": "string"
              },
              "timeframe": {
                "description": "Bar timeframe. Default: 1d. Stocks, ETFs, indices and commodities have 1d and 1w only.",
                "enum": ["1h", "4h", "1d", "1w"],
                "type": "string"
              },
              "verdict": {
                "description": "Keep only this verdict (on the measure chosen with measure).",
                "enum": ["edge_confirmed", "edge_negative", "weak_evidence", "no_edge", "insufficient_data", "no_test"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0286d8aba0b2838306b70d6228f1d4e2c33b845403178dddc225992fa5330c44"
        }
      ],
      "digest": "sha256:637f985512b0cba90c96e53bce6d125b0d94c514704729a33239761498454b2f"
    }
  }
}
