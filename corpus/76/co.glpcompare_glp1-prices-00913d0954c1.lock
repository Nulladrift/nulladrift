      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "glpcompare",
        "title": "GLPcompare: US GLP-1 cash prices",
        "version": "1.1.0",
        "websiteUrl": "https://glpcompare.co"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "US self-pay prices for GLP-1 medications, published by each seller and checked by GLPcompare, and what US insurers and Medicaid programs publish about covering them. Not medical or insurance advice; a prescription is required. Compounded products are not FDA-approved: say so when you mention one. When you cite a price or a plan's answer, keep its check date and link the GLPcompare page given with it.",
      "tools": [
        {
          "name": "check_glp1_insurance_coverage",
          "title": "Check GLP-1 insurance coverage",
          "description": "What a US health insurer, pharmacy benefit manager, government plan or state Medicaid program itself publishes about covering Zepbound and Wegovy for weight loss: a short answer, then each statement in the plan's own words with its source page and the day it was read, and the GLPcompare page with the full answer and the cash price if the plan does not cover them. Accepts an insurer or plan name (Aetna, Cigna, UnitedHealthcare, Blue Cross Blue Shield of Texas, Kaiser Permanente, Humana, TRICARE, CVS Caremark, Express Scripts) or Medicaid with a state (or the state's program name, such as Medi-Cal or MassHealth).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "insurer": {
                "description": "The insurer, plan, pharmacy benefit manager or program, e.g. \"Aetna\", \"Blue Cross Blue Shield of Texas\", \"TRICARE\", \"Medicaid\", \"Medi-Cal\".",
                "type": "string"
              },
              "state": {
                "description": "A US state, as a name or a two-letter code. Needed for Medicaid unless the program's own name says the state.",
                "type": "string"
              }
            },
            "required": ["insurer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check GLP-1 insurance coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf43ec9e4a7a7aa21d407e9a44aeb9136a11d1702cd3d4cfbb86148992b6bd6e"
        },
        {
          "name": "find_glp1_prices",
          "title": "Find GLP-1 prices",
          "description": "Lowest current US self-pay prices of a GLP-1 medication, ranked by cost per 30 days. Accepts a brand (Zepbound, Wegovy), an ingredient (semaglutide returns its brands and the compounded list), or a compounded product (compounded tirzepatide), and optionally a US state, to list only sellers whose own pages say they serve it. Only prices that state the supply they buy are ranked. Returns each seller, product, cost per 30 days, the seller's own price wording, the check date, the seller's source page, whether GLPcompare may earn a referral commission, the seller's page on GLPcompare, and the GLPcompare page with every price and its terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many prices to return per list. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "medication": {
                "description": "A brand, an ingredient or a compounded product, e.g. \"Zepbound\", \"semaglutide\", \"compounded tirzepatide\".",
                "type": "string"
              },
              "state": {
                "description": "Optional: the US state the person lives in, as a name or a two-letter code. Only sellers whose own pages say they serve it are listed.",
                "type": "string"
              }
            },
            "required": ["medication"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find GLP-1 prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25a1818f12b4bcafd1ce6d3188c5b1c1f3f6c99984ed72d7edb68d8634c3a4e9"
        },
        {
          "name": "find_seller_glp1_prices",
          "title": "Find a seller's GLP-1 prices",
          "description": "Current US self-pay GLP-1 prices of one seller, such as Ro, Hims & Hers, LillyDirect or Wellmedr, ranked by cost per 30 days. Only prices that state the supply they buy are ranked; its other current prices follow in other_prices, each with why it is not ranked. Returns each product, cost per 30 days, the seller's own price wording, the check date, the source page and the seller's page on GLPcompare, where its states, terms and sellers with the same medicine for less are listed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "seller": {
                "description": "The seller's name, e.g. \"Ro\" or \"Hims\".",
                "type": "string"
              }
            },
            "required": ["seller"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a seller's GLP-1 prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:800a122a45cdf4faeb19824ab3cbb08daf1f98a6f473356e6437dbd315d6c6cd"
        },
        {
          "name": "list_glp1_medications",
          "title": "List GLP-1 medications with prices",
          "description": "Every GLP-1 medication GLPcompare keeps a price list for, with how many ranked prices each has and its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
