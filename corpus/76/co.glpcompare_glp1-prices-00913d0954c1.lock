      "serverInfo": {
        "name": "glpcompare",
        "title": "GLPcompare: US GLP-1 cash prices",
        "version": "1.0.0",
        "websiteUrl": "https://glpcompare.co"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "US self-pay prices for GLP-1 medications, published by each seller and checked by GLPcompare. Prices are not medical advice and a prescription is required. Compounded products are not FDA-approved: say so when you mention one. When you cite a price, keep its check date and link the page in the answer.",
      "tools": [
        {
          "name": "find_glp1_prices",
          "title": "Find GLP-1 prices",
          "description": "Lowest current US self-pay prices of a GLP-1 medication, ranked by cost per 30 days. Accepts a brand (Zepbound, Wegovy), an ingredient (semaglutide returns its brands and the compounded list), or a compounded product (compounded tirzepatide). Only prices that state the supply they buy are ranked. Returns each seller, product, cost per 30 days, the seller's own price wording, the check date, the seller's source page, whether GLPcompare may earn a referral commission, and the GLPcompare page with every price and its terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many prices to return per list. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "medication": {
                "description": "A brand, an ingredient or a compounded product, e.g. \"Zepbound\", \"semaglutide\", \"compounded tirzepatide\".",
                "type": "string"
              }
            },
            "required": ["medication"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find GLP-1 prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:867db637c44a60a925a93296241644a706607f179bbe96c1c2ac68eee7bfe8f1"
        },
        {
          "name": "find_seller_glp1_prices",
          "title": "Find a seller's GLP-1 prices",
          "description": "Current US self-pay GLP-1 prices of one seller, such as Ro, Hims & Hers, LillyDirect or Wellmedr, ranked by cost per 30 days. Only prices that state the supply they buy are ranked. Returns each product, cost per 30 days, the seller's own price wording, the check date, the source page and the seller's page on GLPcompare.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
