      "tools": [
        {
          "name": "check_financial_numbers",
          "description": "Check $CASHTAG-style ticker mentions (e.g. $AAPL) in a piece of financial writing against SEC EDGAR's own XBRL company-facts data for that company's most recent 10-K -- EPS, book value per share, revenue, market cap, total assets, total liabilities. Flags numeric claims that don't match the filed figures.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The draft text to check, with $TICKER cashtags for each company mentioned.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
