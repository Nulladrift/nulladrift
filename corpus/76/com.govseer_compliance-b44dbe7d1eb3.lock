      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "com.govseer/compliance",
        "title": "Govseer",
        "version": "1.0.0",
        "websiteUrl": "https://govseer.com/docs/mcp",
        "icons": [
          {
            "src": "https://govseer.com/favicon.svg",
            "mimeType": "image/svg+xml",
