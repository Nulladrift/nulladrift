          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Govseer checks product compliance against the official texts: EU CLP hazard labels (rules and the official wording of hazard and precautionary statements in the 24 EU languages), EU green claims in product text, Amazon US pesticide-type claims in a listing, the US DOT limited quantity rule, CPSC-accepted labs and CPSC eFiling HTS flags, and dated rule changes ahead. Every result cites its legal source. The tools need no account. Reading a safety data sheet or a lab test report needs a Govseer API key: https://govseer.com/docs/api. Results are a tool, not legal advice.",
      "tools": [
        {
          "name": "check_clp_label",
          "title": "Check an EU CLP hazard label",
          "description": "Checks the label elements of a hazardous chemical product (signal word, GHS pictograms, H/EUH and P statement codes, product identifier, \"Contains\" line) against the EU CLP Regulation (EC) No 1272/2008: required elements, pictograms and signal word each hazard statement calls for, precedence rules, the number of P statements, unknown codes. Each finding cites its article. Give the codes as printed on the label or in section 2 of the safety data sheet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contains": {
                "description": "For mixtures: substances named on the label (Art. 18(3)(b)).",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "hazard_statements": {
                "description": "H and EUH codes, e.g. [\"H315\", \"H318\", \"EUH208\"].",
                "items": {
                  "pattern": "^(EU)?H\\d{3}[A-Za-z]{0,2}$",
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "nominal_quantity": {
                "description": "e.g. \"500 mL\".",
                "type": "string"
              },
              "pictograms": {
                "description": "GHS pictogram codes, e.g. [\"GHS05\", \"GHS07\"].",
                "items": {
                  "pattern": "^GHS0[1-9]$",
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              },
              "precautionary_statements": {
                "description": "P codes, single or combined, e.g. [\"P280\", \"P305+P351+P338\"].",
                "items": {
                  "pattern": "^P\\d{3}(\\+P\\d{3})*$",
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "product_identifier": {
                "description": "Trade name or substance name as on the label.",
                "type": "string"
              },
              "signal_word": {
                "description": "As printed, e.g. \"Danger\" or \"Warning\". Omit if none.",
                "type": "string"
              },
              "sold_to_general_public": {
                "description": "True when sold to consumers (nominal quantity then required).",
                "type": "boolean"
              },
              "substance": {
                "description": "True for a single substance, false or omitted for a mixture.",
                "type": "boolean"
              },
              "ufi": {
                "description": "Unique formula identifier, if printed.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an EU CLP hazard label"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4939f90dae6e1971b979ceb42dff63130c8033b4840c8cd0ba42b4d7e2a9c7cf"
        },
        {
          "name": "clp_statement_wording",
          "title": "Official wording of CLP statements",
          "description": "Returns the official wording of EU CLP hazard (H, EUH) and precautionary (P) statements in any of the 24 EU languages, as published in the consolidated CLP Regulation on EUR-Lex. \"…\" marks a part the supplier fills in (e.g. the substance or the disposal route).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "codes": {
                "description": "e.g. [\"H315\", \"EUH208\", \"P305+P351+P338\"].",
                "items": {
                  "pattern": "^((EU)?H\\d{3}[A-Za-z]{0,2}|P\\d{3}(\\+P\\d{3})*)$",
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "languages": {
                "description": "Two-letter codes. Default [\"EN\"].",
                "items": {
                  "enum": ["BG", "ES", "CS", "DA", "DE", "ET", "EL", "EN", "FR", "GA", "HR", "IT", "LV", "LT", "HU", "MT", "NL", "PL", "PT", "RO", "SK", "SL", "FI", "SV"],
                  "type": "string"
                },
                "maxItems": 24,
                "type": "array"
              }
            },
            "required": ["codes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Official wording of CLP statements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4fc2ef0073d907a54d12851907dd9451d89533c66258ac34c7ba04e6bd834ae"
        },
        {
          "name": "cpsc_hts_flag",
          "title": "CPSC eFiling flag for HTS codes",
          "description": "Returns CPSC's eFiling flag for 10-digit HTS codes: CP2 (certificate data required) or CP1 (may be needed), with CPSC's product category. Not on the list does not mean no certificate is needed; the importer must eFile whenever a certificate is required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hts_codes": {
                "description": "e.g. [\"9503.00.0073\"].",
                "items": {
                  "maxLength": 16,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["hts_codes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CPSC eFiling flag for HTS codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9d05212a0b27bef4dfef292fbc1ad1ea2691eceec17a2e413b7681d367b9ace"
        },
        {
          "name": "cpsc_lab_lookup",
          "title": "Is a lab CPSC-accepted?",
          "description": "Looks up a testing laboratory on CPSC's list of accepted labs, by CPSC lab ID or by name (exact, or every word of it), and returns the rules (16 CFR parts and standards) it is accepted for. A children's product certificate needs a lab accepted for each rule it was tested to.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lab_id": {
                "description": "CPSC lab ID, e.g. \"1234\".",
                "maxLength": 10,
                "type": "string"
              },
              "name": {
                "description": "Lab name as on the report.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is a lab CPSC-accepted?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04d2a32689bb80cdd5c48bbd770c86f73a299726c957e00b6cd9052c6c309df8"
        },
        {
          "name": "scan_amazon_listing",
          "title": "Scan an Amazon US listing for pesticide claims",
          "description": "Finds pesticide-type claims in an Amazon US product title or description (\"kills germs\", \"disinfects\", \"repels insects\", \"prevents mold\", \"anti-allergen\"…). Amazon treats such products as pesticides, which need an EPA registration number or a FIFRA exemption; the scan also lists any EPA registration or establishment numbers it sees.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "Bullet points and description.",
                "maxLength": 20000,
                "type": "string"
              },
              "title": {
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Scan an Amazon US listing for pesticide claims"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9aaef86b835256f0f03634c3539aec820e3e6d1577cd2c6400616e95fb279d02"
        },
        {
          "name": "scan_green_claims",
          "title": "Scan product text for EU green claims",
          "description": "Scans product page or advert text for environmental claims the EU bans since 27 September 2026 (Directive (EU) 2024/825: generic claims such as \"eco-friendly\" without recognised excellence, climate-neutral claims based on offsetting) and, for hazardous products, statements CLP keeps off labels and online offers (\"non-toxic\", \"harmless\"…). Matches the official examples in the EU languages; each finding cites its source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hazardous": {
                "description": "True when the product is classified hazardous under CLP.",
                "type": "boolean"
              },
              "languages": {
                "description": "Languages of the text. Default: all.",
                "items": {
                  "enum": ["BG", "ES", "CS", "DA", "DE", "ET", "EL", "EN", "FR", "GA", "HR", "IT", "LV", "LT", "HU", "MT", "NL", "PL", "PT", "RO", "SK", "SL", "FI", "SV"],
                  "type": "string"
                },
                "maxItems": 24,
                "type": "array"
              },
              "text": {
                "description": "The product page, listing or advert text.",
                "maxLength": 50000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Scan product text for EU green claims"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3714a41bb39868b96138e8a4357a98e6817c34264833ff0f83391c2a8871236"
        },
        {
          "name": "upcoming_rules",
          "title": "Rule changes ahead",
          "description": "Coming and recent changes to EU CLP, OSHA HCS, WHMIS, Quebec French-language, CPSC eFiling and Amazon dangerous-goods rules, each with its date, state (pending, upcoming, since) and the official source it was checked against.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Default EN.",
                "enum": ["EN", "DE", "FR", "NL", "IT", "ES", "PL"],
                "type": "string"
              },
              "products": {
                "description": "Areas: hazard-labels (EU CLP), amazon, sds-gap (OSHA HCS, WHMIS), quebec-label, cpsc. Default: all.",
                "items": {
                  "enum": ["hazard-labels", "amazon", "sds-gap", "quebec-label", "cpsc"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rule changes ahead"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a86c55e37fef571ddaa267a92a305ae53ac15bc6298c47a077fd95ddaaf7606e"
        },
        {
          "name": "us_limited_quantity",
          "title": "US limited quantity rule for a hazard class",
          "description": "Whether US ground shipments of a hazardous material may use the limited quantity exception (49 CFR part 173: 173.150-173.155, 173.306 for aerosols), with the inner packaging limit and the 30 kg package limit, for a hazard class or division and packing group from section 14 of a safety data sheet. The exception applies only where column 8A of the Hazardous Materials Table lists it for the UN entry, and not by air.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hazard_class": {
                "description": "e.g. \"3\", \"8\", \"6.1\", \"2.1\".",
                "maxLength": 20,
                "type": "string"
              },
              "packing_group": {
                "description": "\"I\", \"II\" or \"III\".",
                "maxLength": 10,
                "type": "string"
              },
              "un_number": {
                "description": "e.g. \"UN1950\" for aerosols.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["hazard_class"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "US limited quantity rule for a hazard class"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f25163ab324c32e52cdf87b8a5192ad72cbcc53760e6e5952fa6c5db46387f48"
        }
      ],
      "digest": "sha256:baef0337f2d184cc2e82043fbb7e518a1733d57be098065e269cfd408732f057"
    }
  }
