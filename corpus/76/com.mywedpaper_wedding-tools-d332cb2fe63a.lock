{
  "lockfileVersion": 2,
  "subjects": {
    "com.mywedpaper/wedding-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mywedpaper.com/mcp/wedding-tools"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mywedpaper-wedding-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Create wedding crosswords, browse My Wed Paper templates, and read printing guidance. These tools require no account and do not publish content or create paid orders. Crossword links expire after 24 hours. Personal answers and clues are encrypted in the edit link and are not saved on the server.",
      "tools": [
        {
          "name": "find_wedding_templates",
          "title": "Find wedding newspaper templates",
          "description": "Find My Wed Paper wedding newspaper templates, real previews, and available four- or eight-page editions. Filter by a template ID or page count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "pageCount": {
                "anyOf": [
                  {
                    "const": 4,
                    "type": "number"
                  },
                  {
                    "const": 8,
                    "type": "number"
                  }
                ]
              },
              "style": {
                "enum": ["classic", "modern", "romantic", "editorial", "coastal", "heritage", "velvet", "gathering", "pearl", "fireside"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4bce4a5f9966e983c5ae1ef0d696d45ddcb31c6c44dbd6367e5749a8542bb014"
        },
        {
          "name": "generate_wedding_crossword",
          "title": "Generate a wedding crossword",
          "description": "Build a complete connected crossword with numbered clues, its answer grid, and a 24-hour link to edit and print. Supply 2–12 different answers with 2–20 letters each. Latin accents and spaces are normalized to grid letters; spell out numbers and dates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "maxLength": 100,
                      "minLength": 1,
                      "pattern": "^[^|\\r\\n]*$",
                      "type": "string"
                    },
                    "clue": {
                      "maxLength": 90,
                      "minLength": 1,
                      "pattern": "^[^\\r\\n]*$",
                      "type": "string"
                    }
                  },
                  "required": ["answer", "clue"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 2,
                "type": "array"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "title": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["entries", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:29713daa2ab7d0a5f8b438f9336c62419e55b5acaa7faf1a3f87ed98da137549"
        },
        {
          "name": "get_printing_guide",
          "title": "Get wedding newspaper printing guidance",
          "description": "Read current My Wed Paper guidance for paper dimensions, print files, and home or professional printing. Select US Letter, A4, or Newspaper Club digital tabloid.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "paperSize": {
                "enum": ["letter", "a4", "newspaper-club"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7711d64e1ab91996eab826705e8ec9b560fb4839a2f5fd7efd7ce608deb7918b"
        }
      ],
      "digest": "sha256:09cc35484a592cafc5fb1b2297841effd5ba325f8fa41ff7faaa34629970aa36"
    }
  }
}
