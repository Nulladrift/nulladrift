{
  "lockfileVersion": 2,
  "subjects": {
    "com.isitdownapi.api/status": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.isitdownapi.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "isitdownapi-status",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Vendor outage status from 60SecMonitor. Use list_vendors, validate_vendor and pricing (all free) first, then vendor_status for one vendor or multi_vendor_status for up to 25. All tools are read-only. Payment is x402 USDC on Base in _meta[\"x402/payment\"]; no API key; untracked vendors, invalid input and upstream failures are not charged.",
      "tools": [
        {
          "name": "list_vendors",
          "description": "Free. List or search the vendors 60SecMonitor tracks (slug, name, category), paged. Use it before paying to confirm a vendor is tracked and to get its exact slug. Read-only; one request to 60SecMonitor, no payment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page": {
                "description": "Page number, starting at 1 (default 1)",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Optional name or slug filter, e.g. 'stripe' or 'aws'",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List tracked vendors (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bf1339386fda0c045266e25782845300f747e40494337b7328bd6b3fe077caac"
        },
        {
          "name": "multi_vendor_status",
          "description": "Check the status of up to 25 SaaS or cloud vendors in one call, for \"is my stack down?\" questions: per-vendor status and a list of the ones not operational, read live from 60SecMonitor. Use vendor_status when you need incident detail for a single vendor. Untracked names are reported, not fatal. Not charged if none of the vendors is tracked or every lookup fails. Read-only; one flat price of $0.05 USDC via x402 (payment goes in _meta[\"x402/payment\"]).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "vendors": {
                "description": "1-25 vendor names, slugs or domains",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["vendors"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.05
          },
          "digest": "sha256:6025586a3a6a3379b3486f6b52eca299f4ddd6e49602b1d69711816c475a68ad"
        },
        {
          "name": "pricing",
          "description": "Free. Return the price of every paid tool, the payment network (Base), the receiving address and the data source. No input, no network request, no payment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prices (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07f0c7daac1379789d2b7a7a049c758bfd9d1fc0d91df9f69ff0e4fd089084db"
        },
        {
          "name": "validate_vendor",
          "description": "Free. Check that a vendor name, slug or domain is well-formed and see how it will be matched. Format only and offline (no network request, no payment); use list_vendors to confirm the vendor is actually tracked.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "vendor": {
                "description": "Vendor name, slug or domain, e.g. 'Stripe', 'stripe' or stripe.com",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate vendor (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e461fd4350d9d652037866a2be477e1198e99af7558ac5c2e15cebf0e357f84d"
        },
        {
          "name": "vendor_status",
          "description": "Check whether one SaaS or cloud vendor (e.g. Stripe) is down right now: current status, confidence, active incidents, 30-day uptime and how fresh the data is, read live from 60SecMonitor. Use it for one vendor; use multi_vendor_status for up to 25 vendors at a flat price. Call list_vendors (free) first if you are not sure the vendor is tracked: unknown vendors return an error and are not charged. Read-only. Costs $0.01 USDC per call via x402 (payment goes in _meta[\"x402/payment\"]); invalid input or an upstream failure is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "vendor": {
                "description": "Vendor name, slug or domain, e.g. 'Stripe', 'stripe' or stripe.com",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.01
          },
          "digest": "sha256:a3acfa98576ee89bd2ef6e2c9594ff9708967f2e9b5f38029d337c3a735e0dda"
        }
      ],
      "digest": "sha256:bd264259a17b00d014e84ac5358ae71d4b16cb5352fe075af77c7e3ce68ced74"
    }
  }
}
