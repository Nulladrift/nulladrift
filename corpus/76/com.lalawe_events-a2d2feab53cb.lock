{
  "lockfileVersion": 2,
  "subjects": {
    "com.lalawe/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lalawe.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lalawe-events",
        "title": "Lalawe — GTA events",
        "version": "1.1.0",
        "description": "Submit in-person events in the Greater Toronto Area to Lalawe, a bilingual (English + Chinese) weekend events listing. Human-reviewed before publishing.",
        "websiteUrl": "https://lalawe.com/submit#mcp",
        "icons": [
          {
            "src": "https://lalawe.com/svg/lalawe-icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://lalawe.com/favicon/favicon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://lalawe.com/favicon/favicon-48.png",
            "mimeType": "image/png",
            "sizes": ["48x48"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Submit events to Lalawe (lalawe.com), a bilingual (English + Chinese) listing of things to do in the Greater Toronto Area.\nAccepted: in-person events in the GTA (Toronto, Peel, York, Durham, Halton) that have not ended yet. Online/virtual events and events elsewhere are refused.\nYou must provide the title and description in BOTH English and Simplified Chinese yourself — translate before calling submit_event.\nEvery submission is reviewed by a person before it appears on the site (usually within 1–2 days). Use check_submission with the returned id to see its status.\nLimits: 20 submissions per day per IP, one every 15 seconds; extra calls are refused.",
      "tools": [
        {
          "name": "check_submission",
          "title": "Check a submission",
          "description": "Look up the review status of a submission by the id submit_event returned: pending, approved (with the event's public URL) or rejected (with the reviewer's reason).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Submission id.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:501b2eebf17cb846fb74d95e15d744cfcf8ca3fd9add70333fa4ed39bd349663"
        },
        {
          "name": "submit_event",
          "title": "Submit an event",
          "description": "Send an in-person event in the Greater Toronto Area to Lalawe's review queue. Requirements, all checked: the event happens in person in the GTA (Toronto, Peel, York, Durham or Halton region); it hasn't ended (Toronto time); the title and description are given in BOTH English (title, description) and Simplified Chinese (title_zh, description_zh) — translate them yourself, faithfully, before calling. A person reviews it before it appears on lalawe.com. Returns a submission id; problems come back as a list to fix and resend. Limits: one call every 15s, 20 per day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address, ideally with postal code.",
                "maxLength": 250,
                "type": "string"
              },
              "age": {
                "description": "Age range, e.g. \"All ages\", \"19+\", \"3–12\".",
                "maxLength": 40,
                "type": "string"
              },
              "category": {
                "description": "One category.",
                "enum": ["Pride", "Live Music", "Film & Screenings", "Comedy", "Arts & Theatre", "Nightlife", "Sports & Fitness", "Attractions & Tours", "Markets", "Food & Drink", "Workshops & Classes", "Festivals", "Community & Culture"],
                "type": "string"
              },
              "city": {
                "description": "GTA municipality, e.g. Toronto, North York, Scarborough, Markham, Richmond Hill, Vaughan, Mississauga, Brampton, Oakville.",
                "maxLength": 60,
                "type": "string"
              },
              "contact_email": {
                "description": "How the reviewer can reach the submitter (not published).",
                "maxLength": 120,
                "type": "string"
              },
              "contact_name": {
                "description": "Submitter or organizer name (not published).",
                "maxLength": 80,
                "type": "string"
              },
              "date": {
                "description": "Start date, YYYY-MM-DD (Toronto local).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "description": {
                "description": "What it is, who it's for, what to expect — in English, a few sentences, plain text.",
                "maxLength": 4000,
                "type": "string"
              },
              "description_zh": {
                "description": "The same description in Simplified Chinese.",
                "maxLength": 3000,
                "type": "string"
              },
              "end_date": {
                "description": "Last day for a multi-day event, YYYY-MM-DD. Omit for a one-day event.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "end_time": {
                "description": "End time, 24-hour HH:MM. Omit if unknown.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "event_url": {
                "description": "The organizer's own page for this event (http/https).",
                "maxLength": 500,
                "type": "string"
              },
              "image_url": {
                "description": "A poster or photo of the event (http/https, jpg/png/webp).",
                "maxLength": 500,
                "type": "string"
              },
              "in_person": {
                "const": true,
                "description": "Must be true: the event happens in person (not online).",
                "type": "boolean"
              },
              "is_free": {
                "description": "true if free to attend, false if paid. Omit if unknown.",
                "type": "boolean"
              },
              "note": {
                "description": "Anything the reviewer should know (not published).",
                "maxLength": 1000,
                "type": "string"
              },
              "price": {
                "description": "Price as shown to attendees, e.g. \"$15, kids free\".",
                "maxLength": 60,
                "type": "string"
              },
              "start_time": {
                "description": "Start time, 24-hour HH:MM, Toronto local. Omit if unknown.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "ticket_url": {
                "description": "Where to buy tickets / register (http/https).",
                "maxLength": 500,
                "type": "string"
              },
              "title": {
                "description": "Event name in English (as the organizer writes it, no date in it).",
                "maxLength": 150,
                "type": "string"
              },
              "title_zh": {
                "description": "Event name in Simplified Chinese.",
                "maxLength": 100,
                "type": "string"
              },
              "venue": {
                "description": "Venue name.",
                "maxLength": 150,
                "type": "string"
              }
            },
            "required": ["address", "city", "contact_email", "date", "description", "description_zh", "in_person", "title", "title_zh", "venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e44cd9896e6d817fcea74bafe0654692042ca3ef9724119bc19ee4cab4c15ed"
        }
      ],
      "digest": "sha256:4fa64be4b38508a92225a8785bc44642b29720cdb4bfc353808eaaa9184112a4"
    }
  }
}
