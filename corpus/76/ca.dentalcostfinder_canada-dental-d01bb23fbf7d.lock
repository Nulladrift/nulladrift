        "title": "DentalCostFinder Canada — Dental Prices & CDCP Eligibility",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use estimate_dental_procedure_cost for city-adjusted CAD pricing, check_cdcp_coverage for federal CDCP co-pay tiers, and list_canadian_dental_procedures for the full fee guide directory.",
      "tools": [
        {
          "name": "check_cdcp_coverage",
          "title": "Check Canadian Dental Care Plan (CDCP) Eligibility",
          "description": "Check Canadian Dental Care Plan (CDCP) eligibility, co-payment tier by adjusted family net income, and covered dental services.",
          "inputSchema": {
            "properties": {
              "adjustedFamilyNetIncome": {
                "description": "Adjusted family net income in CAD from the latest CRA tax return.",
                "type": "number"
              },
              "hasPrivateInsurance": {
                "description": "Whether the applicant has access to private or employer dental insurance.",
                "type": "boolean"
              },
              "isCanadianTaxResident": {
                "description": "Whether the applicant is a Canadian resident for tax purposes and filed a return.",
                "type": "boolean"
              }
            },
            "required": ["adjustedFamilyNetIncome"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Canadian Dental Care Plan (CDCP) Eligibility"
          },
          "behavior": {
            "destructive": false,
