          },
          "digest": "sha256:b05c56c5a260fb04d69e25d288700716623d24677afcf1428968c6cd716c5d78"
        },
        {
          "name": "estimate_dental_procedure_cost",
          "title": "Estimate Canadian Dental Procedure Cost (CAD)",
          "description": "Estimate out-of-pocket dental procedure costs in CAD across major Canadian cities (Vancouver, Toronto, Calgary, Burnaby, Richmond, Surrey, Markham, Mississauga, etc.) with recommended clinic types and prefilled clinic quote links.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Canadian city name (e.g., Vancouver, Toronto, Calgary, Burnaby, Richmond, Markham).",
                "type": "string"
              },
              "procedure": {
                "description": "Procedure key: dental-cleaning, filling, toothache-emergency, tooth-extraction, wisdom-teeth, root-canal, dental-crown, dental-implant, invisalign, braces, teeth-whitening, pediatric-dentist.",
                "type": "string"
              }
            },
            "required": ["procedure"],
            "type": "object"
          },
