                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "confirm": {
                "const": true,
                "description": "Set true only on the second call, after the user approved the preview.",
                "type": "boolean"
              },
              "contact_method": {
                "enum": ["phone", "email", "whatsapp"],
                "type": "string"
              },
              "description": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "details": {
                "additionalProperties": {
                  "maxLength": 500,
                  "type": "string"
                },
                "description": "Only keys listed in extra_fields of the family.",
                "propertyNames": {
                  "pattern": "^[A-Za-z][A-Za-z0-9]{0,40}$",
                  "type": "string"
                },
                "type": "object"
              },
              "family": {
                "description": "Required for kind service. See request_catalog_get.",
                "enum": ["calibration-metrology", "ndt", "inspection-qaqc", "asset-integrity", "lifting-safety", "instrumentation-control", "electrical", "mechanical-rotating", "valve-pressure-control", "pipeline-tank-corrosion", "shutdown-turnaround", "fabrication-construction", "industrial-cleaning", "engineering-digital-support"],
                "type": "string"
              },
              "kind": {
                "enum": ["service", "custom_service", "software"],
                "type": "string"
              },
              "preview_token": {
                "description": "The preview_token returned by the first call (same input).",
                "maxLength": 300,
                "type": "string"
              },
              "required_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "service": {
                "description": "Service slug from request_catalog_get, or 'other' / omitted.",
                "maxLength": 120,
                "type": "string"
              },
