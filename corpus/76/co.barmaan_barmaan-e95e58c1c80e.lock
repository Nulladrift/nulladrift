        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Send a price/quote request to Barmaan's sales team (same inbox as the website form). Ask the user for name and phone first; never invent contact details. Call once with confirm=false to get a preview, show it to the user, then call with confirm=true only after they agree.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "maxLength": 160,
                "type": "string"
              },
              "confirm": {
                "default": false,
                "description": "false = preview only, nothing is sent. Set true ONLY after the user has explicitly agreed to send these exact details to Barmaan.",
                "type": "boolean"
              },
              "email": {
                "description": "Customer email (optional).",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Content language: en, fa, ar or ckb.",
                "enum": ["en", "fa", "ar", "ckb"],
                "type": "string"
              },
              "message": {
                "description": "What the customer needs: product, quantity, specs, destination.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Customer full name, asked from the user (never guessed).",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Customer phone/WhatsApp with country code, asked from the user.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "product_code": {
                "description": "6-digit product code or product slug, if the request is about one product.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["message", "name", "phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:122de4e362198704af4cfb50f0c929de14a9fb033ea3f57bf4789fac326c8a9e"
        },
