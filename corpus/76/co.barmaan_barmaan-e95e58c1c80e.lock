        {
          "name": "company_create",
          "title": "Register a company",
          "description": "Registers a new company in your client portal and makes you its owner. An account can create up to 3 companies. The company starts unverified; documents are uploaded on the website. Call without confirm first for a preview, then again with confirm and the preview_token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 80,
                "type": "string"
              },
              "confirm": {
                "const": true,
                "description": "Set true only on the second call, after the user approved the preview.",
                "type": "boolean"
              },
              "country": {
                "description": "Country as 2 uppercase letters, e.g. IQ.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "legalName": {
                "description": "Registered legal name, if different.",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "Trade name.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "preview_token": {
                "description": "The preview_token returned by the first call (same input).",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["country", "name"],
            "type": "object"
