        {
          "name": "company_invite_create",
          "title": "Invite someone to a company",
          "description": "Sends an e-mail invitation to join one of your companies with a role (viewer, member, admin or owner). Owners can invite any role; admins only member or viewer. The invitation expires in 7 days; the link is only in the e-mail and is not shown here. A company can have at most 25 members including pending invitations. Call without confirm first for a preview, then again with confirm and the preview_token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company ref (CO-XXXXXXXX) from company_list_mine.",
                "pattern": "^CO-[0-9A-F]{8}$",
                "type": "string"
              },
              "confirm": {
                "const": true,
                "description": "Set true only on the second call, after the user approved the preview.",
                "type": "boolean"
              },
              "email": {
                "description": "E-mail address of the person to invite.",
                "format": "email",
                "maxLength": 160,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "locale": {
                "description": "Language of the invitation e-mail. Default en.",
                "enum": ["fa", "en", "ar", "ckb", "ru", "zh"],
                "type": "string"
              },
              "preview_token": {
                "description": "The preview_token returned by the first call (same input).",
                "maxLength": 300,
                "type": "string"
              },
              "role": {
                "enum": ["owner", "admin", "member", "viewer"],
                "type": "string"
              }
            },
            "required": ["company", "email", "role"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
