        {
          "name": "company_update",
          "title": "Update a company",
          "description": "Changes details of one of your companies (owners and admins): name, legal name, contact, address, registration numbers. Send only the fields to change inside patch. ifVersion must be the version from company_get; a stale version is refused. Changing the name or registration numbers of a verified company resets its verification. Logo upload is on the website. Call without confirm first for a preview, then again with confirm and the preview_token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company ref (CO-XXXXXXXX) from company_list_mine.",
                "pattern": "^CO-[0-9A-F]{8}$",
                "type": "string"
              },
              "confirm": {
                "const": true,
                "description": "Set true only on the second call, after the user approved the preview.",
                "type": "boolean"
              },
              "ifVersion": {
                "description": "The version from company_get.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "patch": {
                "additionalProperties": false,
                "description": "Only the fields to change.",
                "properties": {
                  "address": {
                    "additionalProperties": false,
                    "properties": {
                      "city": {
                        "maxLength": 80,
                        "type": "string"
                      },
                      "country": {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "line1": {
                        "maxLength": 160,
                        "type": "string"
                      },
                      "line2": {
                        "maxLength": 160,
                        "type": "string"
                      },
                      "postalCode": {
                        "maxLength": 20,
                        "type": "string"
                      },
                      "region": {
                        "maxLength": 80,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "contact": {
                    "additionalProperties": false,
                    "properties": {
                      "email": {
                        "maxLength": 120,
                        "type": "string"
                      },
                      "phone": {
                        "maxLength": 32,
                        "type": "string"
                      },
                      "website": {
                        "maxLength": 200,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "identifiers": {
                    "description": "Replaces the whole identifier list. Changing it resets verification.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "country": {
                          "pattern": "^[A-Z]{2}$",
                          "type": "string"
                        },
                        "issuedAt": {
                          "maxLength": 40,
                          "type": "string"
                        },
                        "issuer": {
                          "maxLength": 120,
                          "type": "string"
                        },
                        "kind": {
                          "enum": ["commercial-registration", "tax-id", "vat", "chamber", "other"],
                          "type": "string"
                        },
                        "number": {
                          "maxLength": 40,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["country", "kind", "number"],
                      "type": "object"
                    },
                    "maxItems": 5,
                    "type": "array"
                  },
                  "legalName": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "null clears it."
                  },
                  "name": {
                    "maxLength": 160,
                    "minLength": 2,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "preview_token": {
                "description": "The preview_token returned by the first call (same input).",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["company", "ifVersion", "patch"],
            "type": "object"
          },
