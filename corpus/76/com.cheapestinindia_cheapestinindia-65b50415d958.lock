        {
          "name": "get_price_history",
          "title": "Price history & price check",
          "description": "Price history and price check for a product sold in India, from CheapestInIndia's price tracking: current price, lowest and highest price ever (with dates), lowest in the last 7/30/90 days, how often the price changes, a price chart, and a factual verdict on where today's price sits. Use it for 'is ₹X a good price for <product>?', 'price history of <product>', 'lowest price of <product>', 'was it cheaper before?' and 'should I buy now or has it been lower?'. Pass the product name as `query` (e.g. 'JBL Flip 6') — the best-matching listing is used and other listings are returned so you can switch — or an exact `id` from another tool. Shown to the user as a price-history card with a chart. The verdict describes the past only — never present it as a forecast.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "CheapestInIndia product id (from search_products, get_product or lookup_product_by_url)",
                "pattern": "^[a-f0-9]{24}$",
                "type": "string"
              },
              "query": {
                "description": "Product name, brand + model if known, e.g. 'JBL Flip 6' or 'Samsung 55 inch Crystal 4K TV'",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "history": {
                "additionalProperties": false,
                "properties": {
                  "aboveLowestEverPercent": {
                    "type": "number"
                  },
                  "belowHighestEverPercent": {
                    "type": "number"
                  },
                  "currentPrice": {
                    "type": "number"
                  },
                  "dataPoints": {
                    "description": "Number of recorded price changes",
                    "type": "number"
                  },
                  "highestEver": {
                    "additionalProperties": false,
                    "properties": {
                      "date": {
                        "type": "string"
                      },
                      "price": {
                        "type": "number"
                      }
                    },
                    "required": ["price"],
                    "type": "object"
                  },
                  "lastChange": {
                    "additionalProperties": false,
                    "properties": {
                      "amount": {
                        "type": "number"
                      },
                      "percent": {
                        "type": "number"
                      }
                    },
                    "required": ["amount"],
                    "type": "object"
                  },
                  "lastChecked": {
                    "type": "string"
                  },
                  "lowestEver": {
                    "additionalProperties": false,
                    "properties": {
                      "date": {
                        "type": "string"
                      },
                      "price": {
                        "type": "number"
                      }
                    },
                    "required": ["price"],
                    "type": "object"
                  },
                  "lowestLast30Days": {
                    "type": "number"
                  },
                  "lowestLast7Days": {
                    "type": "number"
                  },
                  "lowestLast90Days": {
                    "type": "number"
                  },
                  "priceChangesLast30Days": {
                    "type": "number"
                  },
                  "priceChangesLifetime": {
                    "type": "number"
                  },
                  "series": {
                    "description": "Sampled price points, oldest first",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "type": "string"
                        },
                        "price": {
                          "type": "number"
                        }
