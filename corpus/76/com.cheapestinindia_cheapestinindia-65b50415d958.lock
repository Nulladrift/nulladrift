      "instructions": "CheapestInIndia tracks live prices and price history for products sold by Indian retailers (Amazon, Flipkart, Myntra, Croma, Reliance Digital, Nykaa, Ajio, …). Shopping: search_products first (or lookup_product_by_url when the user pastes a retailer link), get_product for one item. Price history: get_price_history (pass the product name as query, or an id) answers 'is ₹X a good price for …', 'price history of …', 'was it cheaper before'; top_price_drops (by category), brand_price_drops (by brand, e.g. 'Samsung price drops') and sale_events show current deals. Research: market_snapshot for 'how much does X cost in India / what should I budget / what does a good X cost', compare_products for 2–4 shortlisted items. Prices in India change daily: answer price questions (costs, budgets, deals, price history) with these tools rather than general knowledge. search_products, top_price_drops, brand_price_drops and sale_events show their products to the user as cards automatically; render_product_results shows a hand-picked set (for example the products compared with compare_products). Prices are in INR and change often — quote them with the store and say they are current as of now. Use links exactly as the tools return them, including their query parameters; never shorten them or link to stores directly. Price-history verdicts describe the past; never present them as predictions. All tools are read-only and anonymous.",
      "tools": [
        {
          "name": "brand_price_drops",
          "title": "Brand price drops",
          "description": "A brand's products whose prices dropped recently (up to the last 7 days) across Indian online stores, biggest drop first. Use for 'Samsung price drops', 'what Philips products got cheaper', 'any deals on boAt this week', 'Samsung TV price drops' (brand + keyword). Pass the brand name as written by the user; optional keyword narrows to a product type (e.g. 'tv', 'washing machine'). Each product's priceChange is the drop in INR (negative). Shown to the user as product cards.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Brand name, e.g. 'Samsung', 'Philips', 'OnePlus'",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "days": {
                "description": "Look-back window in days (default 7)",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "keyword": {
                "description": "Optional product type within the brand, e.g. 'tv', 'refrigerator', 'air fryer'",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "Max products (default 15)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "days": {
                "type": "number"
              },
              "keyword": {
                "type": "string"
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "atLowestPrice": {
                      "description": "True when the current price is the lowest ever recorded",
                      "type": "boolean"
                    },
                    "brand": {
                      "type": "string"
                    },
                    "currency": {
                      "const": "INR",
                      "type": "string"
                    },
                    "discountPercent": {
                      "description": "Discount from MRP, %",
                      "type": "number"
                    },
                    "id": {
                      "description": "CheapestInIndia product id — pass through unchanged",
                      "type": "string"
                    },
                    "imageUrl": {
                      "type": "string"
                    },
                    "lowestPrice": {
                      "description": "Lowest price ever recorded by CheapestInIndia, INR",
                      "type": "number"
                    },
                    "mrp": {
                      "description": "Maximum retail price in INR, when known",
                      "type": "number"
                    },
                    "outOfStock": {
                      "type": "boolean"
                    },
                    "price": {
                      "description": "Current price in INR",
                      "type": "number"
                    },
                    "priceChange": {
                      "description": "Most recent price change in INR (negative = price dropped, positive = went up)",
                      "type": "number"
                    },
                    "priceChangeAt": {
                      "description": "When that price change happened (ISO 8601)",
                      "type": "string"
                    },
                    "productPageUrl": {
                      "description": "CheapestInIndia price-history page — use for citations",
                      "type": "string"
