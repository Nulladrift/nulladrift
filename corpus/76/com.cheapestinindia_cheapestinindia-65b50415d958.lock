                    "productUrl": {
                      "description": "Attributed buy link (CheapestInIndia redirect to the retailer)",
                      "type": "string"
                    },
                    "store": {
                      "description": "Retailer, e.g. amazon.in, flipkart.com",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["currency", "id", "outOfStock", "price", "productPageUrl", "productUrl", "store", "title"],
                  "type": "object"
                },
