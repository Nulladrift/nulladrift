              "category_ids": {
                "description": "Category group ids from browse_categories or a previous search's facets",
                "items": {
                  "pattern": "^[a-f0-9]{24}$",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "max_price": {
                "description": "Maximum price in INR",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price in INR",
                "minimum": 0,
                "type": "number"
