        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search CheapestInIndia for products sold in India, with live prices from Amazon, Flipkart, Croma, Reliance Digital, Myntra, Nykaa and other Indian retailers. Use it for any shopping question about products in India: prices, where to buy, options under a budget. For 'is ₹X a good price' or price history of a named product, call get_price_history with `query` directly. Results are ordered category-first: real products before accessories, stores mixed. Put the brand in the query ('samsung 55 inch tv'). Returns products (price, MRP, discount, store, image, buy link, price-history page) and facets (stores, categories, price range). The results are shown to the user as product cards automatically, with a link to all results on CheapestInIndia. Next steps: get_price_history to judge a price, compare_products to compare 2–4 items; render_product_results only to show a hand-picked subset.",
          "inputSchema": {
