                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user is shopping for, e.g. 'jbl flip 6'",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "sort": {
                "description": "Default relevance. price_asc = cheapest first",
