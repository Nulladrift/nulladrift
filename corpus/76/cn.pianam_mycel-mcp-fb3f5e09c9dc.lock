          "title": "Live trending topics (CN platforms)",
          "description": "Live trending/hot lists from Chinese platforms: weibo, zhihu, bilibili, baidu, toutiao, douyin, tieba, juejin, or all. Real-time, cached 5 minutes. Free, no API key required. ｜查询国内各平台实时热搜/热榜（微博/知乎/B站/百度/头条/抖音/贴吧/掘金）。实时数据，缓存 5 分钟，免费无需 Key。",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Items per platform 1-50, default 20 ｜ 条数",
                "type": "integer"
              },
              "platform": {
                "description": "weibo/zhihu/bilibili/baidu/toutiao/douyin/tieba/juejin/all, default all ｜ 平台",
                "type": "string"
              }
