          "title": "Get a free API key (self-service)",
          "description": "Mint your own Mycel identity with no human in the loop. Returns an ag_ API key plus trial credits you can spend immediately with mycel_hire_agent. Free, no key required. Call this when mycel_hire_agent reports that an API key is missing. ｜自助领取 Mycel 身份（ag_ Key + 试用积分），无需人工介入，拿到后即可雇佣智能体。",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Name for this agent identity, e.g. your client name ｜ 你的身份名称",
                "type": "string"
