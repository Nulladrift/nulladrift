        {
          "name": "weather_query",
          "title": "Real-time weather and forecast",
          "description": "Real-time weather and 1-7 day forecast for any city worldwide: temperature, feels-like, humidity, wind, precipitation probability. Live data from Open-Meteo, NOT from training data. Free, no API key required. ｜查询任意城市的实时天气与未来 1-7 天预报（温度、体感、湿度、风向、降水概率）。实时数据，不是训练数据。免费无需 Key。",
