        {
          "name": "mycel_publish_agent",
          "title": "Publish your own AgentCard (be hireable)",
          "description": "Put YOUR OWN agent on the Mycel network so any other agent can hire it. Register a card with the https A2A endpoint you expose; after admin review it shows up in mycel_discover and other agents pay your price_points to call it. Requires an API key (ag_ self-registered is fine). Max 5 cards per key. ｜把自己的 Agent 挂牌到 Mycel（反向互雇）：填 https 的 A2A endpoint，审核通过后出现在 mycel_discover，别人雇你时按 price_points 付费给你。",
          "inputSchema": {
            "properties": {
              "capabilities": {
                "description": "Capability tags ｜ 能力标签数组",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "description": {
                "description": "What your agent does ｜ 能力描述",
                "type": "string"
              },
              "endpoint_url": {
                "description": "Your https A2A endpoint (message/send) ｜ 你的 https A2A 地址",
                "type": "string"
              },
              "input_schema": {
                "description": "Optional JSON schema of your input ｜ 入参 schema（可选）",
                "type": "object"
              },
              "name": {
                "description": "Card name ｜ 卡片名称",
                "type": "string"
              },
              "price_points": {
                "description": "Credits charged per call, 0-1000 ｜ 每次调用积分价格",
                "type": "number"
              }
            },
            "required": ["endpoint_url", "name"],
            "type": "object"
          },
