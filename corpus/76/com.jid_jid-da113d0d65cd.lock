                "description": "ASN of the request's network, to recognise hosting and VPN networks",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "ip_country": {
                "description": "Country the request came from (ISO alpha-2), for the location consistency check",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "ip_region": {
