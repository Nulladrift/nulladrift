      "instructions": "Jid is a registry of verified counterparties: it holds business files built from cited public records (registries, licences, filings, sanctions and export lists) and checks businesses, leads, senders and websites against them. verify_business takes a business (Jid id, name or registry number) and, optionally, an activity such as sell_prescription_drugs, haul_freight or general_commerce, and returns decision = proceed | review | stop | insufficient_data with the reasons and the registry facts behind each, plus a signed receipt_id that records what was checked. How the results read: proceed means every requirement for the activity is met by a current registry fact; review and insufficient_data mean a requirement is unmet, unknown or needs a person to look; stop means a registry records a hard failure. screen and qualify_counterparty return engage-or-not advice and a short read with the failed checks. A possible sanctions match is a flag for review, not a finding. Decisions are advisory and not legal advice. Facts come from the cited public records and are provided as-is. Business information only; not a consumer report and not for credit, employment, insurance or housing decisions about individuals.",
      "tools": [
        {
          "name": "check_email",
          "title": "Is this e-mail really from who it says? (SPF, DKIM, DMARC, lookalike sender)",
