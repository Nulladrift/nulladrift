        {
          "name": "search_venues",
          "title": "Search venues",
          "description": "Covers Koh Samui, Thailand. Use this when the guest wants a hotel, restaurant or attraction in a place, e.g. 'a quiet hotel near Bophut' or 'seafood in Chaweng'. Results are sorted by distance when you give `near`. Don't use this when you already have a venue_id: call get_venue. Results come in pages of 10: when more_results is true, call again with the same arguments and cursor: next_cursor. sponsored: true marks a paid placement (the venue pays for Premium); ATAbooking labels these 'Sponsored'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page of this same search",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              },
              "near": {
                "description": "A place name, e.g. 'Bophut' or 'Chaweng'. Sorts by distance from it. Leave everything out to browse all venues.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "party_size": {
                "description": "Only venues with a room, table or ticket for this many people",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match in the name, area, city or description",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "radius_km": {
                "description": "With near: only venues within this distance",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "region": {
                "description": "Region slug: koh-samui",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "tags": {
                "description": "Wishes, e.g. ['pool','beach','vegetarian']; matches rank first",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "type": {
                "description": "hotel, restaurant or attraction; leave out for all",
                "enum": ["hotel", "restaurant", "attraction"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cities_available": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "coverage": {
                "type": "string"
              },
              "demo": {
                "const": true,
                "type": "boolean"
              },
              "more_results": {
                "type": "boolean"
              },
              "next": {
                "type": "string"
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "notice": {
                "type": "string"
              },
              "places_available": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "query": {
                "additionalProperties": false,
                "properties": {
                  "near": {
                    "type": ["string", "null"]
                  },
                  "party_size": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "query": {
                    "type": ["string", "null"]
                  },
                  "radius_km": {
                    "type": ["number", "null"]
                  },
                  "region": {
                    "type": ["string", "null"]
                  },
                  "type": {
                    "anyOf": [
                      {
                        "enum": ["hotel", "restaurant", "attraction"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["near", "party_size", "query", "radius_km", "region", "type"],
                "type": "object"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "area": {
                      "type": "string"
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "country": {
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "demo": {
                      "type": "boolean"
                    },
                    "distance_km": {
                      "type": ["number", "null"]
                    },
                    "features": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "matched_tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price_from": {
                      "type": ["number", "null"]
                    },
                    "region": {
                      "type": ["string", "null"]
                    },
                    "sponsored": {
                      "type": "boolean"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "type": {
                      "$ref": "#/properties/query/properties/type/anyOf/0"
                    },
                    "venue_id": {
                      "type": "string"
                    }
                  },
                  "required": ["area", "city", "country", "currency", "demo", "distance_km", "features", "matched_tags", "name", "price_from", "region", "sponsored", "summary", "tags", "type", "venue_id"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "more_results", "next", "next_cursor", "query", "results"],
