        {
          "name": "send_lead",
          "title": "Send the guest's request to the venue",
          "description": "Use this when the guest has chosen a venue and wants it to get in touch: it forwards their request (dates, party, contact, message) to the venue at once. It is a request, not a booking: nothing is held or paid, and the venue contacts the guest directly. Check the details with the guest before calling. Give an idempotency_key and reuse it if you retry. Keep the status_token from the answer to call get_lead_status later. Don't use this to ask ATAbooking questions or to test.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age_bands": {
                "additionalProperties": {
                  "maximum": 50,
                  "minimum": 0,
                  "type": "integer"
                },
                "description": "Attractions: people per age band, e.g. {\"adult\":2,\"child\":1}",
                "propertyNames": {
                  "pattern": "^[a-z_]{1,20}$"
                },
                "type": "object"
              },
              "agent": {
                "description": "The name of your app",
                "maxLength": 120,
                "type": "string"
              },
              "check_in": {
                "description": "Hotels: arrival date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "$ref": "#/properties/check_in",
                "description": "Hotels: departure date"
              },
              "date": {
                "$ref": "#/properties/check_in",
                "description": "Restaurants and attractions: the day"
              },
              "guest_email": {
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "guest_name": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "guest_phone": {
                "maxLength": 40,
                "minLength": 6,
                "pattern": "^\\+?[\\d\\s().-]+$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "One per request (8-128 of A-Z a-z 0-9 _ -). Reuse it on retries to get the same request back.",
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "language": {
                "description": "The guest's language, e.g. en, th, de",
                "maxLength": 20,
                "pattern": "^[A-Za-z-]+$",
                "type": "string"
              },
              "message": {
                "description": "Anything the guest wants the venue to know",
                "maxLength": 1000,
                "type": "string"
              },
              "party_size": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Restaurants: the table time; attractions: the session time",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "unit_id": {
                "$ref": "#/properties/venue_id",
                "description": "The room, table or ticket from get_venue, if the guest chose one"
              },
              "venue_id": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["guest_name", "party_size", "venue_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "delivery": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "channel": {
                      "enum": ["portal", "email", "whatsapp", "webhook"],
                      "type": "string"
                    },
                    "state": {
                      "enum": ["pending", "sending", "accepted", "available", "failed", "expired", "cancelled"],
                      "type": "string"
                    }
                  },
                  "required": ["channel", "state"],
                  "type": "object"
                },
                "type": "array"
              },
              "demo": {
                "const": true,
                "type": "boolean"
              },
              "lead": {
                "additionalProperties": false,
                "properties": {
                  "created_at": {
                    "type": "string"
                  },
                  "reference": {
                    "type": "string"
                  },
                  "venue": {
                    "type": "string"
                  },
                  "venue_id": {
                    "type": "string"
                  }
                },
                "required": ["created_at", "reference", "venue", "venue_id"],
                "type": "object"
              },
              "message": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "status": {
                "enum": ["recorded", "recorded_demo", "already_recorded"],
                "type": "string"
              },
              "status_token": {
                "type": "string"
              }
            },
            "required": ["delivery", "lead", "message", "status", "status_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
