      "serverInfo": {
        "name": "atabooking",
        "title": "ATAbooking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ATAbooking lists independent hotels, restaurants and attractions that take requests straight from guests, with no booking site in between. Flow: search_venues -> get_venue -> check_availability (optional) -> send_lead, which forwards the guest's request to the venue. The venue then contacts the guest directly to confirm and take payment: nothing is booked or paid through ATAbooking. Use get_lead_status with the status_token from send_lead to see whether the venue has received the request. Venues marked demo: true are ATAbooking's fictional demo listings: a request to one is recorded and never sent to anyone.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Use this when the guest wants to know whether a room, table or ticket is free before sending a request. Answers available, unavailable or unknown. Unknown means the venue keeps no calendar with ATAbooking: the guest can still send_lead and the venue answers. Don't use this to hold anything: nothing is reserved.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Hotels: arrival date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "$ref": "#/properties/check_in",
                "description": "Hotels: departure date, YYYY-MM-DD"
              },
              "date": {
                "$ref": "#/properties/check_in",
                "description": "Restaurants and attractions: the day, YYYY-MM-DD"
              },
              "party_size": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Restaurants and attractions: HH:MM",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "unit_id": {
                "description": "unit_id from get_venue",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "venue_id": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["party_size", "unit_id", "venue_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "check_in": {
                "type": "string"
              },
              "check_out": {
                "type": "string"
              },
              "checked_at": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "demo": {
                "const": true,
                "type": "boolean"
              },
              "next": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "party_size": {
                "type": "integer"
              },
              "price": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "nightly": {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  "total": {
                    "type": "number"
                  }
                },
                "required": ["currency", "nightly", "total"],
                "type": "object"
              },
              "price_from": {
                "type": ["number", "null"]
              },
              "reason": {
                "type": "string"
              },
              "status": {
                "enum": ["available", "unavailable", "unknown"],
                "type": "string"
              },
              "time": {
                "type": ["string", "null"]
              },
              "unit_id": {
                "type": "string"
              },
              "units_left": {
                "type": "integer"
              },
              "venue_id": {
                "type": "string"
              }
            },
            "required": ["status", "unit_id", "venue_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
