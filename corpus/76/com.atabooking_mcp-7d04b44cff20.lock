        {
          "name": "get_lead_status",
          "title": "Check a request's delivery",
          "description": "Use this when the guest asks whether the venue has received their request. Shows each channel's delivery state (portal, email, WhatsApp, webhook). It doesn't show whether the venue has accepted: the venue answers the guest directly. Needs the status_token send_lead returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "status_token": {
                "description": "status_token from send_lead",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["status_token"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "created_at": {
                "type": "string"
              },
              "delivery": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "channel": {
                      "enum": ["portal", "email", "whatsapp", "webhook"],
                      "type": "string"
                    },
                    "state": {
                      "enum": ["pending", "sending", "accepted", "available", "failed", "expired", "cancelled"],
                      "type": "string"
                    }
                  },
                  "required": ["channel", "state"],
                  "type": "object"
                },
                "type": "array"
              },
              "demo": {
                "const": true,
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              }
            },
            "required": ["created_at", "delivery", "message", "reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
