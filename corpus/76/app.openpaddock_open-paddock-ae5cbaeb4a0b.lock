        },
        {
          "name": "list_circuits",
          "title": "List circuits",
          "description": "Motorcycle circuits Open Paddock knows in the US, Canada and Mexico, with city, state, region and the number of upcoming days listed. With near, only circuits within within_miles, nearest first, each with distanceMi. Use the id with find_track_days or get_circuit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "near": {
                "description": "US ZIP, Canadian postal code, \"City, ST\", or \"lat,lon\".",
                "type": ["string", "number"]
              },
              "region": {
                "enum": ["west", "central", "east", "canada", "mexico"],
                "type": "string"
              },
              "within_miles": {
                "description": "Default 150, max 1000.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List circuits"
          },
          "behavior": {
