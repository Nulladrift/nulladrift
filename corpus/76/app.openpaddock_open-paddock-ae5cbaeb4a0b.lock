          "digest": "sha256:8fc7d05386dcd962c8207b32073047236515c9ed5a222656509ec8151f381434"
        },
        {
          "name": "list_organisers",
          "title": "List organisers",
          "description": "Track-day organisers, schools and clubs Open Paddock lists. listing is \"dates listed\" when we read their calendar, or \"link only\" when they publish no calendar we can read (send the user to their website for dates). Filter by the region of the circuits they run at, or by organiser type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "region": {
                "enum": ["west", "central", "east", "canada", "mexico"],
                "type": "string"
              },
              "type": {
                "description": "commercial, school, club, track-owned (the circuit's own program), private-premium, kart-minitrack.",
                "enum": ["commercial", "school", "club", "track-owned", "private-premium", "kart-minitrack"],
                "type": "string"
              }
            },
            "type": "object"
          },
