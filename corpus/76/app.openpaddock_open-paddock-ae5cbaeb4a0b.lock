{
  "lockfileVersion": 2,
  "subjects": {
    "app.openpaddock/open-paddock": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openpaddock.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "openpaddock",
        "title": "Open Paddock",
        "version": "1.0.0",
        "websiteUrl": "https://openpaddock.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Open Paddock (openpaddock.app) lists motorcycle track days in the US, Canada and Mexico, read from organisers' own published calendars. Open Paddock is a neutral calendar: it sells nothing and takes no bookings. Send the user to the organiser's site (bookingUrl) to book, and check prices, groups and rules there. Credit the data as \"via Open Paddock (openpaddock.app)\" and link openPaddockUrl. Rows with an attribution field come from MotorsportReg.com and must be shown with \"Powered by MotorsportReg.com\". Days marked kind=race-practice (kindLabel \"Race-weekend practice\") are practice days at a club race weekend, not open track days: say so. lastChecked is when we last read the organiser's calendar; dates can change, so tell the user to confirm on the organiser's site. Organisers listed as link only publish no calendar we can read, so their days are not in the results; point the user to their website. Data licence: CC BY 4.0.",
      "tools": [
        {
          "name": "find_track_days",
          "title": "Find motorcycle track days",
          "description": "Upcoming motorcycle track days in North America, in date order (or nearest first when near is given and sort is distance). Use near for \"track day near Sacramento\" questions; use from/to for a month. Each result has dates, circuit with city and state, organiser, kind (\"Open track day\" or \"Race-weekend practice\", which is a club race weekend's practice day: say so), price tier, distanceMi when near is set, source, lastChecked, bookingUrl and openPaddockUrl. Open Paddock is a neutral calendar: it sells nothing and takes no bookings. Send the user to the organiser's site (bookingUrl) to book, and check prices, groups and rules there. Credit the data as \"via Open Paddock (openpaddock.app)\" and link openPaddockUrl. Rows with an attribution field come from MotorsportReg.com and must be shown with \"Powered by MotorsportReg.com\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "circuit": {
                "description": "Circuit id or name, e.g. \"thunderhill\" or \"Sonoma\". Comma-separate several.",
                "type": "string"
              },
              "country": {
                "enum": ["US", "CA", "MX"],
                "type": "string"
              },
              "from": {
                "description": "Earliest date, YYYY-MM-DD (days ending on or after it). Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_race_practice": {
                "description": "Include race-weekend practice days (club race weekends' practice days, open to non-racers). Default true; false = open track days only.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max days returned. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "Where the rider is: US ZIP (\"95814\"), Canadian postal code, \"City, ST\" (\"Sacramento, CA\"), or \"lat,lon\".",
                "type": ["string", "number"]
              },
              "organiser": {
                "description": "Organiser id or name, e.g. \"n2\" or \"Fun Track Dayz\". Comma-separate several.",
                "type": "string"
              },
              "region": {
                "description": "Riding region of the circuit.",
                "enum": ["west", "central", "east", "canada", "mexico"],
                "type": "string"
              },
              "sort": {
                "description": "date (default) or distance (needs near).",
                "enum": ["date", "distance"],
                "type": "string"
              },
              "to": {
                "description": "Latest date, YYYY-MM-DD (days starting on or before it).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "within_miles": {
                "description": "Straight-line radius around near, in miles. Default 150, max 1000.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find track days"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1815ef7b19ae5205338a9af850c025066fd603a06cee121fb5aefac642b411a3"
        },
        {
          "name": "get_circuit",
          "title": "Get a circuit",
          "description": "One circuit: location, length and turns where known, the organisers that run days there, and its next upcoming days (up to 20). Open Paddock is a neutral calendar: it sells nothing and takes no bookings. Send the user to the organiser's site (bookingUrl) to book, and check prices, groups and rules there. Credit the data as \"via Open Paddock (openpaddock.app)\" and link openPaddockUrl. Rows with an attribution field come from MotorsportReg.com and must be shown with \"Powered by MotorsportReg.com\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Circuit id from list_circuits, e.g. \"thunderhill\". A name also works when it matches one circuit.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get circuit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d431325306fbcb7c4ab9fbb22ca85c380624ac99f10b0f38470597b8591bed93"
        },
        {
          "name": "get_event",
          "title": "Get a track day",
          "description": "One listed day by id (from find_track_days or an openpaddock.app/events/<id> link). Open Paddock is a neutral calendar: it sells nothing and takes no bookings. Send the user to the organiser's site (bookingUrl) to book, and check prices, groups and rules there. Credit the data as \"via Open Paddock (openpaddock.app)\" and link openPaddockUrl. Rows with an attribution field come from MotorsportReg.com and must be shown with \"Powered by MotorsportReg.com\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Event id, e.g. ae103f77c7766506e7cd, or its openpaddock.app/events URL.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get event"
          },
          "behavior": {
