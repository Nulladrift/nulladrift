        {
          "name": "cooling_time",
          "title": "Cooling-time study",
          "description": "Find the shortest cooling time at which a dimension has stopped changing, and the cycle seconds that come off. Supply the drawing tolerance and the rule tightens to a tenth of it. Measure each part at a consistent interval after ejection — the part keeps moving.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "properties": {
                  "material": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "meltTempC": {
                    "type": "number"
                  },
                  "moldTempC": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "dimensionName": {
                "maxLength": 48,
                "type": "string"
              },
              "dimensionTolerance": {
                "description": "Total drawing tolerance, same units as dimension",
                "type": "number"
              },
              "points": {
                "items": {
                  "properties": {
                    "coolingTime": {
                      "description": "Cooling time, seconds",
                      "type": "number"
                    },
                    "dimension": {
                      "description": "Measured dimension, consistent units",
                      "type": "number"
                    }
                  },
                  "required": ["coolingTime", "dimension"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 2,
                "type": "array"
              },
              "study_code": {
                "description": "A study as the Lab card encodes it; use instead of the measurements (points, dimensionName, dimensionTolerance)",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
