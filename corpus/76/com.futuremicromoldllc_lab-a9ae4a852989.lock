      "instructions": "Scientific-molding study calculators. Each tool takes measurements an engineer recorded at an injection-molding press and returns the study result, an interpretation, any data-quality warnings, and a link that opens the study on the Lab website with the data loaded.\n\nCall get_study_protocol before asking anyone for numbers, so the data that comes back is the data the calculation needs. Call plan_process_development to work out which study to run next — the studies are a sequence, and each one fixes a setpoint the next holds constant.\n\nEvery number comes from the data supplied. Do not compute these results yourself, and do not present a tool result as a claim about any particular supplier.\n\nNothing sent to these tools is stored.",
      "tools": [
        {
          "name": "cavity_balance",
          "title": "Cavity balance study",
          "description": "Quantify cavity-to-cavity fill imbalance from short-shot weights. Give two or more replicate shots at a fill level and the result also says whether the variation comes from the cavities (runner and gate geometry) or from shot-to-shot process drift — the two have opposite fixes. Judge balance on a short shot at 90% fill or above.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "properties": {
                  "material": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "meltTempC": {
                    "type": "number"
                  },
                  "moldTempC": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "levels": {
                "description": "One entry per fill percentage tested — e.g. a 50%, then a 95%, short shot.",
                "items": {
                  "properties": {
                    "fillPct": {
                      "description": "Short-shot fill percentage, e.g. 95",
                      "type": "number"
                    },
                    "shots": {
                      "description": "One entry per shot, mapping cavity name to part weight in grams",
                      "items": {
                        "additionalProperties": {
                          "type": "number"
                        },
                        "propertyNames": {
                          "maxLength": 8,
                          "minLength": 1,
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "maxItems": 100,
                      "minItems": 1,
                      "type": "array"
                    }
                  },
                  "required": ["fillPct", "shots"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "study_code": {
                "description": "A study as the Lab card encodes it; use instead of the measurements (levels)",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
