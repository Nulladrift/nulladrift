        {
          "name": "process_capability",
          "title": "Process capability (Cp, Cpk, Pp, Ppk)",
          "description": "Judge whether a running process can hold a dimension inside its tolerance. Reports Cp and Cpk from within-subgroup sigma and Pp and Ppk from overall sigma — the second pair is what a customer's SPC package computes from the same measurements — each with a 95% confidence interval, an upper bound on parts per million out of spec, and an Anderson–Darling normality check. Estimators follow Minitab's defaults. No verdict is given when the data cannot support one (no limit, zero spread, badly non-normal data). One specification limit is enough. Sample at least 25 consecutive parts without adjusting the process.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lsl": {
                "description": "Lower specification limit",
                "type": "number"
              },
              "samples": {
                "description": "Measurements in production order",
                "items": {
                  "type": "number"
                },
                "maxItems": 100,
                "minItems": 2,
                "type": "array"
              },
              "study_code": {
                "description": "A study as the Lab card encodes it; use instead of the measurements (samples, usl, lsl, target, subgroupSize, withinMethod)",
                "maxLength": 8000,
                "minLength": 1,
