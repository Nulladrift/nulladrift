        {
          "name": "pressure_drop",
          "title": "Pressure-drop study",
          "description": "Find where injection pressure is consumed along the flow path. Each reading is the CUMULATIVE peak pressure needed to fill through that section — an air shot gives the nozzle figure, then sprue, runner, gate and the full part — so the values ascend. Known sections: Nozzle, Sprue, Runner, Gate, Part. Run every reading at the velocity the viscosity curve selected.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "properties": {
                  "material": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "meltTempC": {
                    "type": "number"
                  },
                  "moldTempC": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "intensificationRatio": {
                "description": "Hydraulic-to-plastic multiplier; omit if pressure is already plastic",
                "type": "number"
              },
              "machineMaxPressure": {
                "description": "Machine maximum injection pressure, same units as pressure",
                "type": "number"
              },
              "stages": {
                "items": {
                  "properties": {
                    "pressure": {
                      "description": "Cumulative peak pressure to fill through this section, psi",
                      "type": "number"
                    },
                    "stage": {
                      "description": "Section name, e.g. one of: Nozzle, Sprue, Runner, Gate, Part",
                      "maxLength": 24,
                      "type": "string"
                    }
                  },
                  "required": ["pressure", "stage"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 2,
                "type": "array"
              },
              "study_code": {
