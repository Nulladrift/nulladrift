        {
          "name": "cosmetic_window",
          "title": "Cosmetic process-window study",
          "description": "Map which combinations of two process parameters produce a cosmetically acceptable part, and how much room surrounds the centre. Sweep wider than you expect the window to be: a passing point on the edge of the range tested means the window was never closed on that side. Axes and their units: hold_pressure (psi), melt_temp (°C), mold_temp (°C), injection_velocity (in/s), hold_time (s), cooling_time (s). Defects: short, flash, sink, burn, splay, weld-line, drag, warp.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "properties": {
                  "material": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "meltTempC": {
                    "type": "number"
                  },
                  "moldTempC": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "points": {
                "items": {
                  "properties": {
                    "defect": {
                      "enum": ["short", "flash", "sink", "burn", "splay", "weld-line", "drag", "warp"],
                      "type": "string"
                    },
                    "pass": {
                      "description": "Did the part meet the cosmetic criteria?",
                      "type": "boolean"
                    },
                    "x": {
                      "description": "Value on the x axis, in the unit of whichever axis xAxis selects",
                      "type": "number"
                    },
                    "y": {
                      "description": "Value on the y axis, in the unit of whichever axis yAxis selects",
                      "type": "number"
                    }
                  },
                  "required": ["pass", "x", "y"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 2,
                "type": "array"
              },
              "study_code": {
                "description": "A study as the Lab card encodes it; use instead of the measurements (xAxis, yAxis, points)",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "xAxis": {
                "description": "Horizontal parameter. Units by axis: hold_pressure (psi), melt_temp (°C), mold_temp (°C), injection_velocity (in/s), hold_time (s), cooling_time (s).",
                "enum": ["hold_pressure", "melt_temp", "mold_temp", "injection_velocity", "hold_time", "cooling_time"],
                "type": "string"
              },
              "yAxis": {
                "description": "Vertical parameter. Units by axis: hold_pressure (psi), melt_temp (°C), mold_temp (°C), injection_velocity (in/s), hold_time (s), cooling_time (s).",
                "enum": ["hold_pressure", "melt_temp", "mold_temp", "injection_velocity", "hold_time", "cooling_time"],
                "type": "string"
              }
            },
            "type": "object"
