        {
          "name": "gage_rr",
          "title": "Gage R&R (crossed, ANOVA method)",
          "description": "Rate a measurement system from a crossed study: every operator measures every part, the same number of times. Two-way ANOVA per the AIAG Measurement Systems Analysis manual (4th ed.), matching Minitab's crossed gage R&R defaults: the operator × part interaction is pooled into repeatability when not significant (α = 0.05). Reports %GRR of study variation and, when a tolerance is given, of the tolerance, the repeatability / reproducibility split, the number of distinct categories, and the AIAG band (under 10% acceptable, 10–30% conditional, over 30% unacceptable). The standard study is 10 parts, 3 operators, 2–3 trials. Run it before trusting a Cpk.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "properties": {
                  "material": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "meltTempC": {
                    "type": "number"
                  },
                  "moldTempC": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "operators": {
                "items": {
                  "properties": {
                    "name": {
                      "description": "Operator label, e.g. \"A\". For your own bookkeeping; the calculation and the readout identify operators by position.",
                      "maxLength": 16,
                      "type": "string"
                    },
                    "trials": {
                      "description": "One array per trial, each listing this operator's readings for parts 1…N in the same part order, in the dimension's own units",
                      "items": {
                        "items": {
                          "type": "number"
                        },
                        "maxItems": 30,
                        "minItems": 2,
                        "type": "array"
                      },
                      "maxItems": 6,
                      "minItems": 2,
                      "type": "array"
                    }
                  },
                  "required": ["trials"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              },
              "study_code": {
                "description": "A study as the Lab card encodes it; use instead of the measurements (operators, tolerance)",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "tolerance": {
                "description": "Tolerance width (upper limit minus lower limit), same units as the readings. Enables %GRR of tolerance, which is what a Cpk study needs.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gage R&R (crossed, ANOVA method)"
          },
          "behavior": {
