                    },
                    "keyDimension": {
                      "description": "A key dimension measured on the same parts, mm or inches — use whichever the drawing calls out, consistently across all points",
                      "type": "number"
                    },
                    "partWeight": {
                      "description": "Average part weight, grams",
                      "type": "number"
                    }
                  },
                  "required": ["holdTime", "partWeight"],
                  "type": "object"
                },
                "maxItems": 100,
