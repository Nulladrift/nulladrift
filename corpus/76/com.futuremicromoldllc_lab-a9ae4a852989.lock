        },
        {
          "name": "gate_seal",
          "title": "Gate-seal study",
          "description": "Find the hold time at which the gate freezes and part weight stops rising. Seal is the first of three consecutive weights within 0.1% of each other; the recommended production hold time adds a margin of one increment. A weight that falls back after seal means the gate did not stay frozen. Run at the velocity the viscosity curve selected.",
          "inputSchema": {
