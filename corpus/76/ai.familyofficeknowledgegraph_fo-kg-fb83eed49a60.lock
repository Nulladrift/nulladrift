{
  "lockfileVersion": 2,
  "subjects": {
    "ai.familyofficeknowledgegraph/fo-kg": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.familyofficeknowledgegraph.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Family Office Knowledge Graph",
        "version": "0.21.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only door over the Family Office Knowledge Graph (public record, one record per family office, every field with source_url, read_by, state). This is the apex door; it holds the index and forwards to the node that serves the record. Tools: resolve_family_office, get_record, list_events_since, list_aliases, list_nodes (reads; each cleared read is evidenced by an RCO-10060 receipt on chain fo-kg); claim_seat and list_my_receipts (a family office's own agent, its own record only). Errors are typed. Nothing is answered from memory.",
      "tools": [
        {
          "name": "claim_seat",
          "description": "A family office's own agent claims the seat of its own record. Give card_url (the https URL of the office agent's card) and record_id (the record id as the graph serves it). The record must resolve to the name the card gives; the door then issues a domain challenge (DNS TXT _fo-kg-seat.<domain> or https://<domain>/.well-known/fo-kg-seat.txt). Call again with challenge_id: proven → the record moves listed → claimed and the seat key is answered once. With seat_key and rows, the seat sets its own fields on its own record only (website, aliases, sectors, structure, description, contact_url); the sourced fields are never touched and verified is set by a person, never by a tool. The seat settles on /seat (x402).",
          "inputSchema": {
            "properties": {
              "card_url": {
                "description": "https URL of the office agent's card (A2A agent card JSON)",
                "type": "string"
              },
              "challenge_id": {
                "description": "the challenge_id from the accepted claim, once the token is published",
                "type": "string"
              },
              "record_id": {
                "description": "the office's record id as the graph serves it (resolve_family_office lists it)",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "rows": {
                "description": "the seat's own fields",
                "properties": {
                  "aliases": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "contact_url": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "sectors": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "structure": {
                    "type": "string"
                  },
                  "website": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "seat_key": {
                "description": "the seat key answered when the claim was proven (for rows)",
                "type": "string"
              }
            },
            "required": ["card_url", "record_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "challenge": {
                "type": "object"
              },
              "claim_status": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "record_id": {
                "type": "string"
              },
              "result": {
                "enum": ["accepted", "proof_failed", "claimed", "rows_set", "rows_refused", "refused", "error"],
                "type": "string"
              },
              "seat_id": {
                "type": "string"
              },
              "seat_key": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Claim a seat"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90f48877eaa3bc199f24195177ee98297ba6e6f63e4a99e0a679ff742f49c74f"
        },
        {
          "name": "get_record",
          "description": "The Family Office Record for one identifier: every field with value, source_url, read_by and state; optionally a named version.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "description": "Record id, LEI, legal name, alias, or a register identifier as it appears on the record (case-insensitive)",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "version": {
                "description": "record version as listed by list_nodes (e.g. 2026-09-13.1); omit for current",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "record": {
                "type": "object"
              },
              "served_by": {
                "type": "object"
              }
            },
            "required": ["record"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Family Office Record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09df8ed12a5ba859cc952b62b5c53881857b2e0df840432f95818b8f70bcabf1"
        },
        {
          "name": "list_aliases",
          "description": "Every name the record carries for one identifier — legal name, register names, other names — each with its source.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "description": "Record id, LEI, legal name, alias, or a register identifier as it appears on the record (case-insensitive)",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aliases": {
                "type": "array"
              },
              "legal_name": {
                "type": "object"
              },
              "lei": {
                "type": "string"
              },
              "served_by": {
                "type": "object"
              }
            },
            "required": ["aliases", "lei"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List aliases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9532c7028b626b8d76b59773890bef4ee73be1dc6a0a90f9c111bd97342afe76"
        },
        {
          "name": "list_events_since",
          "description": "Dated, URL'd events on one record (registrations, renewals, orders, acquisitions), oldest first, optionally since a date, paged by cursor.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "next_cursor from a previous page",
                "type": "string"
              },
              "identifier": {
                "description": "Record id, LEI, legal name, alias, or a register identifier as it appears on the record (case-insensitive)",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO date YYYY-MM-DD; events on or after it",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "events": {
                "type": "array"
              },
              "lei": {
                "type": "string"
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "served_by": {
                "type": "object"
              }
            },
            "required": ["events", "lei"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List events on a record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:959464d8a40383e03aab3ea0b3c274434bb19b5c7a6abbff63f70cab2c0c0b0f"
        },
        {
          "name": "list_my_receipts",
          "description": "For a seat holder only: the RCO-10060 receipts whose subject is its own record — who read it (as the door saw the reader: user agent, network, country), when, and under which rule (the tool) — newest first, each with its verify URL. Needs record_id and the seat key of that record; nobody else can list them.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "type": "string"
              },
              "limit": {
                "default": 100,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "record_id": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "seat_key": {
                "type": "string"
              }
            },
            "required": ["record_id", "seat_key"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "receipts": {
                "items": {
                  "properties": {
                    "cleared_at": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "reader": {
                      "type": "object"
                    },
                    "rule": {
                      "type": "string"
                    },
                    "verify": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "record_id": {
                "type": "string"
              },
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the receipts of my record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5d55badd20d57a3c9bf90b4a7cbc40edc3661693465f09bfa9cb68d245acf11"
        },
        {
          "name": "list_nodes",
          "description": "The graph's nodes — one per jurisdiction — with record counts read from each node's index, the node door and its as-of.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apex": {
                "type": "object"
              },
              "nodes": {
                "type": "array"
              }
            },
            "required": ["nodes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List nodes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84f7b7476a83564c347bc45f24bd9af1db027124da8bc6ff0a4c1c1e48e75e0f"
        },
        {
          "name": "resolve_family_office",
          "description": "Resolve an identifier (LEI, legal name, alias or register id) to the family-office records that carry it, with the node that serves each.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "description": "Record id, LEI, legal name, alias, or a register identifier as it appears on the record (case-insensitive)",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "identifier": {
                "type": "string"
              },
              "matches": {
                "items": {
                  "properties": {
                    "legal_name": {
                      "type": "string"
                    },
                    "lei": {
                      "type": "string"
                    },
                    "matched_on": {
                      "type": "string"
                    },
                    "node": {
                      "type": "string"
                    },
                    "record": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "served_by": {
                "type": "object"
              }
            },
            "required": ["identifier", "matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Resolve a family office"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4b04c803ed4d90a0f511a52c750c8d567826c97e647177a66b2d1ac77001f77"
        }
      ],
      "digest": "sha256:3f1671fb4e9b7b61e0d6353480693b501045a13a4187120a1cfc28286c9e3c4e"
    }
  }
