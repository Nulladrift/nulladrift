      "instructions": "DataSnack's World Machine publishes seven-day forecasts of real-world numbers (fuel, food, freight, rates, trade, AI) and of prediction-market questions. Each forecast is an explicit equation fitted on data, graded daily against standing still, and reworked every night by DataSnack's agents; every record, misses included, is public. Head to head (head_to_head) sets DataSnack's monthly numbers beside big forecasters' published ones, each made the day before theirs from public data, prediction markets and the news; replay numbers there are labelled replay and never counted with the live record. Every tool result includes the datasnack.ai page it comes from.",
