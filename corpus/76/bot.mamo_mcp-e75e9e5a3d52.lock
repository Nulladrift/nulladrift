        {
          "name": "preview_withdraw",
          "title": "Check a withdrawal before building it",
          "description": "Run every safety check on a withdrawal from a Mamo Account: ownership, enough in it, dust left behind, lending-market cash, and a dry run on Base. Needs `account` and `amount` or `all: true`, never both. A stocks portfolio sells on Aerodrome for cash (`maxSlippageBps`) or exits `inKind`. Call this FIRST and pass its `previewId` to `prepare_withdraw`; nothing is signed or sent here.",
          "inputSchema": {
            "properties": {
              "account": {
                "description": "Which Account: `usdc_stablecoin` (USDC), `cbbtc_lending` (Bitcoin), `eth_lending` (Ethereum), `mamo_staking` (MAMO), `rwa-basket` (Stocks).",
                "enum": ["usdc_stablecoin", "cbbtc_lending", "eth_lending", "mamo_staking", "rwa-basket"],
                "type": "string"
              },
              "accountAddress": {
                "description": "Stocks: a stocks portfolio this wallet owns, by address. Default: the one the reads show.",
                "type": "string"
              },
              "address": {
                "description": "The wallet that owns the Account and will sign, 0x-prefixed, on Base.",
                "type": "string"
              },
              "all": {
                "description": "Withdraw everything. Prefer this over naming the full balance: it uses `withdrawAll()`, which cannot revert on a rounding remainder.",
                "type": "boolean"
              },
              "amount": {
                "description": "How much, as a plain decimal string in the Account's own token. Or set `all` to close the position.",
                "type": "string"
              },
              "inKind": {
                "description": "Stocks: take holdings out as they are, unsold.",
                "type": "boolean"
              },
              "maxSlippageBps": {
                "description": "Stocks, cash: max slippage per sale, bps (default 100).",
                "type": "integer"
              },
              "token": {
                "description": "Stocks, inKind + amount: which holding. Default USDC.",
                "type": "string"
              }
            },
            "required": ["account", "address"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "account": {},
                  "accountAddress": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "all": {
                    "type": "boolean"
                  },
                  "amount": {},
                  "apy": {},
                  "chainId": {
                    "const": 8453,
                    "type": "number"
                  },
                  "expiresAt": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "inKind": {},
                  "name": {
                    "type": "string"
                  },
                  "previewId": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "ready": {},
                  "sellPlan": {},
                  "steps": {},
                  "token": {}
                },
                "required": ["account", "accountAddress", "all", "amount", "apy", "chainId", "expiresAt", "name", "previewId", "ready", "steps", "token"],
                "type": ["object", "null"]
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["info", "warning", "error"]
                    }
                  }
                },
                "type": "array"
              }
            },
            "type": "object"
          },
