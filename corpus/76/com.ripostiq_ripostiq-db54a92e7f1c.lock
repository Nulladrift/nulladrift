      "instructions": "Ripostiq delivers courses that run right inside this chat (Claude, ChatGPT, or any MCP client): each module teaches, makes the learner build real work, then a boss-battle stakeholder grills them until they can defend it.\nGETTING STARTED: when a user wants to learn / browse / start, call list_courses FIRST (no login needed) and show them the catalog. Anyone can start ANY course's free Module 1 right now — call begin_course(course) then teach_section — without logging in.\nROAST MY WORK: if someone wants honest, pointed feedback on a real artifact (a PRD, architecture, code, pitch, resume, plan…), call roast(work, kind) — a free, no-login stakeholder grilling that doubles as a taste of the boss-battle method.\nDAILY DRILL: a returning learner can do a two-minute drill — call daily_drill(course) for today's recall question, then daily_drill(course, done=true) after they answer, to keep their streak. Offer it when they come back or finish a session.\nPRACTICE EXAM: some courses (see `has_exam` in list_courses) include a SCORED PRACTICE EXAM — a full multiple-choice mock that returns a scaled score against the real pass line, a per-domain breakdown, and rationale per question. Call start_exam(course) to draw a form, proctor it one question at a time WITHOUT revealing or answering, then submit_exam(course, answers) to score. Login + entitlement gated like the paid capstone.\nMOCK INTERVIEW: if someone is prepping for an interview, call interview_prep(jd_or_skill, role, experience) — a free, calibrated grilling against their target role that ends with a candid scorecard. A high-intent entry point into the courses.\nINTERVIEW PREP (curated topics): for a known topic the catalog covers (e.g. 'agentic AI in production', 'production AI/LLM systems'), call list_interviews() then start_interview(interview) — an adaptive mock interview from a curated question bank (concept→scenario pairs across several areas). It checks ~4-5 areas, hints when the learner is stuck, ends with a scorecard, and funnels into the matching course. LOGIN REQUIRED (free in the current beta, gated like a course): if start_interview returns needs_login, ask the learner to log in with the connector before running it — for a quick no-login taste use the free-form interview_prep instead.\nCREATE A COURSE: if the learner wants to learn something the catalog DOESN'T cover (check list_courses first), offer to build it: call create_course(topic) and follow the authoring protocol to generate a full course (lessons + labs + boss battles). Save it in CHUNKS — save_course_draft, then add_course_module once per module, then finalize_course — never one giant save_course call. It's saved privately to them and works like any course; they can submit it for review to publish it. This is how the catalog grows — never tell someone 'we don't have that', offer to make it.\nIDENTITY: login happens via this app/connector's 'Log in with Ripostiq' approval (OAuth) or at ripostiq.com — NEVER ask the user to type their email or password into the chat, and never use the login tool to collect a password. Only PAID modules and cross-device progress sync need login; if get_entitlements/whoami says not logged in, keep going with free content and point them to the connector login only when they want paid modules.",
