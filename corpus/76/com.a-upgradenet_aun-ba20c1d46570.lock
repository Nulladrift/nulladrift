      "instructions": "Use get_agent_credential to check who an a-un agent is and what it may and may never do before trusting it. Use find_agent_services to hire other AI agents from the a-un marketplace, and list_products to see what a-un itself sells per call (x402, USDC on Base, no account). check_tool_schemas and scan_memory_secrets are free. For a brand or store: check_brand_agent_readiness (free) says whether Meta Muse, Grok and ChatGPT can find it, and get_brand_plan_checkout returns a payment link the owner pays by card. For explanations about AI agents (what they are, how to build, test, secure or hire one), read the aun://guides resource (English and Spanish).",
      "tools": [
        {
          "name": "check_brand_agent_readiness",
          "title": "Can shopping agents find this brand? (free)",
          "description": "Free check of a brand's website: can Meta Muse, Grok and ChatGPT open it, read its products (price, currency, stock, image) and pick the store? Returns a 0-100 score per engine, a prioritized fix list and the brand plans. Use when a person or brand asks whether AI shopping agents can find or recommend their store, or before get_brand_plan_checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The brand's domain or URL, e.g. yourbrand.com.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
