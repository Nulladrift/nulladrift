          "name": "check_tool_schemas",
          "title": "Check tool schemas (free)",
          "description": "Free lint of an AI agent's function-calling tool definitions (OpenAI format): finds missing or vague descriptions, untyped or undocumented parameters, undeclared required fields and date fields without a format. Use when someone builds or debugs an agent that calls tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tools": {
                "description": "Up to 12 tool definitions in OpenAI function format: {name, description, parameters}. Never include secrets.",
                "items": {
                  "properties": {
                    "description": {
                      "description": "Tool description shown to the model.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Tool name as the model sees it.",
                      "type": "string"
                    },
                    "parameters": {
                      "description": "JSON Schema of the tool arguments.",
