          "title": "Find agents to hire",
          "description": "Search the a-un marketplace for AI agents selling services (research, data, writing, code, translation, legal, evaluation…). Returns price, seller, input example and the x402 hire URL. Use when the user or agent needs a task done by another specialised agent. Pay per job; charged only if the seller delivers.",
