{
  "lockfileVersion": 2,
  "subjects": {
    "app.sandooq/product": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sandooq.app/api/mcp/product"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "sandooq-product",
        "version": "5.11.21"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_country_info",
          "title": "Get Country Info",
          "description": "What Sandooq publishes about one MENA market: VAT rate, e-invoicing posture, currency, how tenders are handled, the regulator, and the market notes shown on that country's page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country to describe, as a lowercase ISO 3166-1 alpha-2 code. One of: sa, qa, ae, bh, om, sy, lb.",
                "enum": ["sa", "qa", "ae", "bh", "om", "sy", "lb"],
                "type": "string"
              },
              "locale": {
                "description": "Response language: 'en' (default) or 'ar'. Arabic returns the Arabic copy the site publishes, not a translation of the English.",
                "enum": ["en", "ar"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Country Info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63339cf162573fb72b3b57e90ee12bafa6d419763e63bff8b25e36db32fcd3c0"
        },
        {
          "name": "get_page",
          "title": "Get Page",
          "description": "One Sandooq page as Markdown — the same representation the site serves at /agent and via Accept: text/markdown, with no HTML or navigation chrome.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language: 'en' (default) or 'ar'. Arabic returns the Arabic copy the site publishes, not a translation of the English.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "path": {
                "description": "Site-relative path, no leading slash and no language prefix — e.g. 'pricing', 'about', 'pos-system/saudi-arabia', 'blog/<slug>'. Use '' for the home page. Choose the language with `locale`, not with a '/ar' prefix.",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:300c3d6f4d4ecf98a398083ff7248aad008c212e3d9b8bef03b0bad5227e1bb7"
        },
        {
          "name": "get_pricing",
          "title": "Get Pricing",
          "description": "Sandooq's subscription plans, prices and per-plan limits, read from the same source the pricing page renders.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Optional ISO 3166-1 alpha-2 country code, lowercase. One of: sa, qa, ae, bh, om, sy, lb. Pricing is identical in every country; the code is echoed back so the answer can name it.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:053e38046819d75214b5e9861b3ab80ef9b7a52616ede60233a4d3d5bb0773fa"
        },
        {
          "name": "search_docs",
          "title": "Search Docs",
          "description": "Search Sandooq's public pages and blog articles by keyword, returning ranked titles, URLs and excerpts. Follow a result with get_page to read it in full.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many results to return. Default 5, maximum 20. `matchCount` reports the total number of matching pages regardless.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language: 'en' (default) or 'ar'. Arabic returns the Arabic copy the site publishes, not a translation of the English.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "query": {
                "description": "Words to search for. Matched case-insensitively against page titles and body text in the chosen language; there is no stemming, so the words a reader would use work best.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39fa29c28303bbb97e61f966377cdc089028a301418216ff2ba9297f62354923"
        }
      ],
      "digest": "sha256:6cdc1638ef8cc1b90e0d197adbcaab7852dac864f377ee04186f7493f0867bb9"
    }
  }
}
