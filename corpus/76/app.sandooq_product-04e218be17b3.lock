{
  "lockfileVersion": 2,
  "subjects": {
    "app.sandooq/product": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sandooq.app/api/mcp/product"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "sandooq-product",
        "version": "5.11.41"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_country_info",
          "title": "Get Country Info",
          "description": "What Sandooq publishes about one MENA market: VAT rate, e-invoicing posture, currency, how tenders are handled, the regulator, and the market notes shown on that country's page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country to describe, as a lowercase ISO 3166-1 alpha-2 code. One of: sa, qa, ae, bh, om, sy, lb, kw, jo.",
                "enum": ["sa", "qa", "ae", "bh", "om", "sy", "lb", "kw", "jo"],
                "type": "string"
              },
              "locale": {
                "description": "Response language: 'en' (default) or 'ar'. Arabic returns the Arabic copy the site publishes, not a translation of the English.",
                "enum": ["en", "ar"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Country Info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c91dba10ba89a53b3d34395e9c8987ea7095e2c72957f3ad2d44d8e4c86624ba"
        },
        {
          "name": "get_page",
          "title": "Get Page",
          "description": "One Sandooq page as Markdown — the same representation the site serves at /agent and via Accept: text/markdown, with no HTML or navigation chrome.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language: 'en' (default) or 'ar'. Arabic returns the Arabic copy the site publishes, not a translation of the English.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "path": {
                "description": "Site-relative path, no leading slash and no language prefix — e.g. 'pricing', 'about', 'pos-system/saudi-arabia', 'blog/<slug>'. Use '' for the home page. Choose the language with `locale`, not with a '/ar' prefix.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4543c8b294d40fa1dd8a2788429be2dd02ef4c3ed87fc7d61c7733e4afee4ddf"
        },
        {
          "name": "get_pricing",
          "title": "Get Pricing",
          "description": "Sandooq's subscription plan, its base price and limits, and the add-on prices per extra store and staff login, read from the same source the pricing page renders.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Optional ISO 3166-1 alpha-2 country code, lowercase. One of: sa, qa, ae, bh, om, sy, lb, kw, jo. Pricing is identical in every country; the code is echoed back so the answer can name it.",
                "maxLength": 8,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:538e9f581b792ef1c8b468a80713979553944a6a6689156794e99b46100596f2"
        },
        {
          "name": "search_docs",
          "title": "Search Docs",
          "description": "Search Sandooq's public pages and blog articles by keyword, returning ranked titles, URLs and excerpts. Follow a result with get_page to read it in full.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many results to return. Default 5, maximum 20. `matchCount` reports the total number of matching pages regardless.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language: 'en' (default) or 'ar'. Arabic returns the Arabic copy the site publishes, not a translation of the English.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "query": {
                "description": "Words to search for. Matched case-insensitively against page titles and body text in the chosen language; there is no stemming, so the words a reader would use work best.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c020a5569df3ae46f70d23264d38d8b451f4b39174f887c9997087d5e9e21542"
        }
      ],
      "digest": "sha256:172bf415aba50c9a32d093aae73eadef81770c433c4388fa1268c6faad38160e"
    }
  }
}
