{
  "lockfileVersion": 2,
  "subjects": {
    "com.jabbertoon/cartoon-studio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jabbertoon.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "jabbertoon",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Jabbertoon (https://jabbertoon.com) is a free, easy 3D studio, game engine, world builder and cartoon maker in the browser, all in 3D: it builds characters and things, makes games, worlds to walk through and talking cartoons with the cast in 3D (six people and ten animals, ready-made moves, typed lines spoken with a moving mouth). Call get_guide first ({\"topic\": \"start\"} says what to call for what; {\"topic\": \"cartoon\"} explains the JSON program). Then write the cartoon, check it with validate until ok is true (each problem has where, says and fix, and did_you_mean and patch when the fix is certain; repair: true applies them; a character or background the site cannot draw is an error), and make a link with share_link, which opens it in the editor (jabbertoon.com/cartoon/), where the person plays it, changes it and saves the video. A talking cartoon is {\"v\": 1, \"kind\": \"cartoon\", \"cast\": {\"<id>\": {\"name\": \"Biscuit\", \"designed\": {\"kind\": \"animal3d\", \"preset\": \"dog\"}, \"at\": {\"x\": 0.3}}}, \"scripts\": [{\"hat\": {\"on\": \"scene\", \"name\": \"...\"}, \"body\": [{\"op\": \"say\", \"who\": \"<id>\", \"text\": \"...\"}, {\"op\": \"does\", \"who\": \"<id>\", \"behaviour\": \"c4c:beh:wave_hello\"}]}]}; list_characters returns a whole one (cartoon_example). These online tools check, list and link; making the video on a computer is the jabbertoon tool's (preview, render_video). Use made-up names, never a child's. Nothing you send is kept, except a report_problem report.",
      "tools": [
        {
          "name": "build",
          "title": "Build a thing in the 3D builder from steps, and link it",
          "description": "Builds anything (a character, an animal, a car, a house) in Jabbertoon's 3D builder from steps, as its buttons do: spine, grow, bone (a skeleton, a bone at a time), add a ready part (leg, arm, head, wing, wheel, hat ...), set, copy, remove, look. Checks every step, says what was made (its parts and size) and gives a jabbertoon.com/forge/ link that opens it in the Forge, to change and use in a cartoon, world or game. Over MCP the answer also shows a picture of it from four sides. Steps that start {\"op\": \"new\", \"kind\": \"move\"} make a move from keys, {\"op\": \"new\", \"kind\": \"world\"} a world (a level is played to check it), and a game, every one in 3D: \"walk\" a place to walk at real size (played on foot: told what cannot be reached), or \"trench\", \"space\", \"surface\" or \"sky\" a game to fly. A refused step says where, why and how to fix it. export_link opens Export, free: STL/3MF to 3D print, glTF (Blender, Unity, Godot), SVG, Minecraft .schem. The steps: get_guide {\"topic\": \"build\"}, a game's {\"topic\": \"game\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "blueprint": {
                "type": "object"
              },
              "build": {
                "description": "A build to change (the build an answer gave); without it the steps start from a new spine.",
                "type": "object"
              },
              "steps": {
                "description": "The steps, in order: {op: spine | grow | bone | add | set | copy | remove | look, on (a part, or a name an earlier step gave with as), ...}.",
                "maxItems": 400,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:961905dfadab18a8d7ff638d24d8617530032943bab9b610937a52368f627896"
        },
        {
          "name": "get_guide",
          "title": "Read Jabbertoon's guide for writing a cartoon",
          "description": "Call this first, except for make_cartoon. One topic of Jabbertoon's guide as Markdown (under 20,000 characters): start (what it makes, the order of calls, every other topic), cartoon (the JSON program), text (a cartoon as screenplay text), song (the editor's film file: lines, moves, shots, choreography, words on the picture), build (the 3D builder), export (STL, 3MF, glTF, SVG, Minecraft), minecraft (seven houses to start from, and a build taken into Minecraft), world (a 3D world built from inside, as in Minecraft), game, motion (movement written as words, jabbertoon.com/motion/). x and y are shares of the stage (0 to 1, ground 0.92); times are seconds. Example: {\"topic\": \"cartoon\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Leave it out for start, which names the others.",
                "enum": ["start", "cartoon", "text", "moves", "characters", "voices", "places", "errors", "limits", "build", "game", "song", "staging", "walk", "play", "export", "minecraft", "blueprint", "shapes", "examples", "keys", "world", "market", "controls", "fight", "motion"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46cab0ddbec217c4f5765416c65c3bea388d2fc0e981e0074a99b76f88f4a569"
        },
        {
          "name": "get_move",
          "title": "Get one move's program and readable text",
          "description": "Returns one move or word. A Do list move (by id c4c:beh:wave_hello, short name or page slug): its block program as JSON and screenplay text, the motion language's lines that play it, its length, settings, page and links. A motion language word (people.sneak, or sneak): its form, dials, bodies and whole text. Example: {\"move\": \"wave_hello\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "move": {
                "description": "Its id, short name or page slug, as list_moves gives them.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["move"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5289a072add0d827894aa6313c536199fa871a2ed9c9946339abf39425f10285"
        },
        {
          "name": "list_characters",
          "title": "List Jabbertoon's ready-made cartoon characters and voices",
          "description": "Lists the cast in 3D by category - humanoid (the people, in costume or not; bear2, fox2, rabbit2, raccoon2, cat2), mammal (dog, cat, fox, horse, dolphin, whale), bird (gull), fish (goldfish, ten reef fish), fantasy (pegasus) - each with its designed entry, voice and word library; the voices; cartoon_example, a talking cartoon to copy. A cast entry: {\"name\": \"Biscuit\", \"designed\": {\"kind\": \"animal3d\", \"preset\": \"dog\"}, \"voice\": \"am_puck\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba2dc649fb420d7c4cb0e7bb8b8cb0c32697f4059ea1ecfc796afe38568eeef5"
        },
        {
          "name": "list_moves",
          "title": "List the moves and words a character can do",
          "description": "Lists what a character can do: the Do list's moves (wave hello, hop, bow...), each with the motion language's lines that play it (a does block plays one by id), and the motion language's own words (swim_to, hover, on_guard, sneak...) with their dials. category: humanoid, mammal, bird, fish or fantasy. q: words to match, or what a word means (dance finds Groove). Example: {\"q\": \"wave\", \"category\": \"humanoid\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One kind of body.",
                "enum": ["humanoid", "mammal", "bird", "fish", "fantasy"],
                "type": "string"
              },
              "q": {
                "description": "Words to look for (\"wave\", \"dance\"); leave it out for every move.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f416160c9a7b084ada8a4eea0d91498b7f2088323459f009fd1e56c6961c0141"
        },
        {
          "name": "make_cartoon",
          "title": "Make a talking cartoon from a plain script, in one call",
          "description": "The quickest way to a cartoon: send the script as people write one, a line each, Name: what they say, and get the jabbertoon.com link that opens it in the editor ready to play and to record as a video (free, no account). Read too: (happy, waves) in a line; [Leo walks to Mia] on a line of its own; Place: Beach (another later starts the next scene); Cast: Mia (cat). Our characters come by name (Sunny, Grump, Ria, Bob, Kiki) and a new name becomes one of our 3D cast. What was not used is in notes. Example: {\"script\": \"Place: Beach\\nMia (cat): (worried) Have you seen my hat?\\nLeo: (looks around) Is it on that crab?\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cast": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Who each name is: {\"Mia\": \"cat\", \"Leo\": \"pirate\"}.",
                "type": "object"
              },
              "place": {
                "description": "Where it is, by name: Beach, City, Space, Old Keep... (else its Place: line, else the Meadow).",
                "maxLength": 60,
                "type": "string"
              },
              "script": {
                "description": "The script: a line each, Name: what they say.",
                "maxLength": 20000,
                "type": "string"
              },
              "title": {
                "description": "Its name (else the script's Title: line).",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["script"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c0d03d6dd1a2c4bb728576b3159d19b5bfb49ce038a58b0c944da7fe3aacafb"
        },
        {
          "name": "read_blueprint",
          "title": "Read a floor plan's picture: its walls measured",
          "description": "Reads a floor plan's picture (https) for build: its walls found, numbered, on a grid, and an id. Call again with the id and known (one length on the plan): every wall as a wall step's from, to and thick. Then build with blueprint {id}. get_guide {\"topic\": \"blueprint\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "id": {
                "description": "An earlier answer's id.",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              },
              "known": {
                "description": "One length the plan states: walls [n, m] either side of a room and its written size, or from and to [x, z] off the grid.",
                "properties": {
                  "from": {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  "length": {
                    "type": ["string", "number"]
                  },
                  "to": {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  "walls": {
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  }
                },
                "required": ["length"],
                "type": "object"
              },
              "url": {
                "description": "The https link of the picture itself.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb485bfae78a391051cd805102f1ebbd816eea7905451519998f9bfb598ec60a"
        },
        {
          "name": "report_problem",
          "title": "Tell Jabbertoon something is wrong",
          "description": "Tells the people who make Jabbertoon something is wrong: a wrong answer, a check that refused a good cartoon or passed a bad one, a move that looks wrong, a link that does not open, wrong docs, something missing, or a step that was hard to get right (kind hard_step, with hard_because: optional, never needed to go on). Unlike the other tools, it keeps what you send: the report (kind, tool, code, where, item, note, hard_because) is saved for a person to read. Never put the cartoon, a name, an address or anything about the person you help in it. Example: {\"kind\": \"validator_wrong\", \"tool\": \"validate\", \"code\": \"op_unknown\", \"note\": \"say was refused in a cartoon\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cli_version": {
                "description": "Set by the jabbertoon tool.",
                "maxLength": 40,
                "type": "string"
              },
              "code": {
                "description": "The error code it gave, e.g. op_unknown.",
                "maxLength": 64,
                "type": "string"
              },
              "hard_because": {
                "description": "For kind hard_step: what made the step hard (an error's words, a field that was unclear, a size that was hard to guess). Optional. No cartoon, names or personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "item": {
                "description": "What it is about: a move, character or look (c4c:beh:bow, dog, crayon), or a page.",
                "maxLength": 200,
                "type": "string"
              },
              "kind": {
                "description": "What kind of problem it is (hard_step: a step that was hard to get right).",
                "enum": ["wrong_answer", "validator_wrong", "move_looks_wrong", "link_does_not_open", "docs_wrong", "missing", "hard_step", "other"],
                "type": "string"
              },
              "note": {
                "description": "What was wrong, in a sentence or two. No cartoon, names or personal details.",
                "maxLength": 500,
                "type": "string"
              },
              "os": {
                "description": "Set by the jabbertoon tool: win32, darwin or linux.",
                "maxLength": 40,
                "type": "string"
              },
              "tool": {
                "description": "The tool whose answer was wrong, e.g. validate.",
                "maxLength": 64,
                "type": "string"
              },
              "where": {
                "description": "Where it pointed, e.g. scripts[0].body[2].",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60a37c345c66528f8e887ff5dbc6b3d1c3282cd0b6c3e3f74ed67516107d3c1d"
        },
        {
          "name": "share_link",
          "title": "Make a jabbertoon.com link that opens a cartoon, a move or a character",
          "description": "Turns a cartoon, a scene, a move or a character into a jabbertoon.com link: it opens in the editor (a move in its move maker). It all travels after the #: nothing is uploaded or kept. All but a character's end with &from=ai (the page says an AI helper wrote it). One with errors gets them instead. Give one of cartoon, program, character or file. Example: {\"program\": {\"v\": 1, \"kind\": \"behaviour\", \"scripts\": [{\"body\": [{\"op\": \"hop\"}]}]}}.",
          "inputSchema": {
            "additionalProperties": false,
            "maxProperties": 1,
            "minProperties": 1,
            "properties": {
              "cartoon": {
                "description": "Its program, a cartoon file {cast, places?, program}, or its screenplay text (read on your own computer only).",
                "type": ["object", "string"]
              },
              "character": {
                "description": "Your own character, {\"name\", \"content\"}, or a character pack.",
                "type": "object"
              },
              "file": {
                "description": "On your own computer only: a file's name in the output folder.",
                "maxLength": 255,
                "type": "string"
              },
              "program": {
                "description": "A move (kind \"behaviour\"), a scene or a cartoon program.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0715c07608ca3af7b6b67b63fa91103b3682ab0298e5a867bf14ec5f2f48847a"
        },
        {
          "name": "validate",
          "title": "Check a Jabbertoon cartoon, scene, move, pack or character",
          "description": "Checks a cartoon, with the editor's own checks, before anyone sees it. Give one of cartoon, program, pack, character or file. Returns errors (it will not play as written: also a character or background the site lacks) and warnings, each {code, where, says, fix, url}, with did_you_mean and an RFC 6902 patch when certain; issues a viewer would see (off stage, overlapping, an empty stage, a line cut off) with a summary of who is where and says what when (seconds; x as a share of the stage); and, when ok, the canonical program and a link. repair: true also returns the program with every certain patch applied. A written scene is played and read out (written_scene; playing: call again), kept until played, its answer an hour; nothing else is kept. Example: list_characters' cartoon_example.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "at_s": {
                "description": "A written scene's moments to read out, seconds.",
                "items": {
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 3,
                "type": "array"
              },
              "cartoon": {
                "description": "A cartoon: its program, a cartoon file {cast, program}, a project file, or its screenplay text (read only on your own computer).",
                "type": ["object", "string"]
              },
              "character": {
                "description": "Your own character, {\"name\", \"content\"}, or a character pack.",
                "type": "object"
              },
              "file": {
                "description": "On your own computer only: a .json or .txt file's name in the output folder.",
                "maxLength": 255,
                "type": "string"
              },
              "pack": {
                "description": "A whole pack: its manifest and its content.",
                "type": "object"
              },
              "program": {
                "description": "A move (get_move gives ready-made ones) or a scene program.",
                "type": "object"
              },
              "repair": {
                "description": "true: also return repaired: the program with every certain patch applied, and the changes.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e333cc6ab182bdd88a762921a2e3991da59760dc329cf328592186de1e524cf5"
        }
      ],
      "digest": "sha256:ea010d7851f63f8bac07dcba803d77e321c7c2a643cc43f28f9a2627b5ba928f"
    }
  }
}
