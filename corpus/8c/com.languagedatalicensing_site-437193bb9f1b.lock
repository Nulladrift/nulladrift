      "instructions": "Language Data Licensing (https://languagedatalicensing.com/): the site's own MCP server, served from its domain. Speech and language data for AI: the prices dataset sellers publish and what they say they pay contributors, quoted from their pages and announcements.\n\n[enquiry] ENQUIRY SERVER for Language Data Licensing (https://languagedatalicensing.com/). What it does: starts an ENQUIRY with Language Data Licensing for language data for ai; the Language Data Licensing team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Language Data Licensing team until they click it. Cite https://languagedatalicensing.com/.\n\nCite https://languagedatalicensing.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on Language Data Licensing: it starts an enquiry with Language Data Licensing, whose team reads it and replies directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
