{
  "lockfileVersion": 2,
  "subjects": {
    "com.fiftyasks/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fiftyasks.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fiftyasks",
        "title": "Fifty Asks booking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Agents are welcome here. Book the free Fifty Asks check for a local service business, or a 15-minute call. If we sent your human a payment request (FA-P-...), get_payment and start_payment handle it. Shops that use the Fifty Asks booking widget (links to fiftyasks.com/b/<shop>) take visit requests through get_shop and request_visit. Only spambot deterrents apply.",
      "tools": [
        {
          "name": "book_call",
          "description": "Book a free 15-minute phone call at an open slot from list_call_slots. Status is confirmed only when the calendar accepts it.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Which agent you are (e.g. product and version)",
                "type": "string"
              },
              "business": {
                "description": "Business name",
                "type": "string"
              },
              "contact_name": {
                "description": "The person the booking is for (your human)",
                "type": "string"
              },
              "email": {
                "description": "Where the report or calendar invite goes",
                "type": "string"
              },
              "notes": {
                "description": "Anything we should know",
                "type": "string"
              },
              "phone": {
                "description": "Number we call at the booked time",
                "type": "string"
              },
              "start": {
                "description": "Slot start, ISO 8601, exactly as listed",
                "type": "string"
              },
              "website": {
                "description": "Business website, if any",
                "type": "string"
              }
            },
            "required": ["business", "contact_name", "email", "phone", "start"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41ef02330daa6c131525a040814ebd10b293931f29504245e94d98c23a6c2fc2"
        },
        {
          "name": "book_free_check",
          "description": "The free Fifty Asks check: we ask ChatGPT, Perplexity and Gemini the questions a customer would ask for your trade and town, fifty times in all, and record who each one names first. You get a short written report by email: who gets named, whether you do, and the page facts the named businesses share. Free, no card, no contract. We do not promise rankings or how often an assistant names you. Booked by an agent: delivered within 2 business days instead of 5.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Which agent you are (e.g. product and version)",
                "type": "string"
              },
              "business": {
                "description": "Business name",
                "type": "string"
              },
              "city": {
                "description": "Town and state served, e.g. Round Rock, TX",
                "type": "string"
              },
              "contact_name": {
                "description": "The person the booking is for (your human)",
                "type": "string"
              },
              "email": {
                "description": "Where the report or calendar invite goes",
                "type": "string"
              },
              "notes": {
                "description": "Anything we should know",
                "type": "string"
              },
              "trade": {
                "description": "e.g. plumber, HVAC, roofer, electrician",
                "type": "string"
              },
              "website": {
                "description": "Business website, if any",
                "type": "string"
              }
            },
            "required": ["business", "city", "contact_name", "email", "trade"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c2d781dd3381c4a929960f50e007242fdc27d6ceef043ee0248c687a077e097"
        },
        {
          "name": "get_booking",
          "description": "Current status of a booking by its id (FA-XXXXXXXX).",
          "inputSchema": {
            "properties": {
              "booking_id": {
                "type": "string"
              }
            },
            "required": ["booking_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:290f7b3d658d606cf07ec6f13a5b8e49aff5a32a1942381747cc2174f9c4c3c9"
        },
        {
          "name": "get_payment",
          "description": "Status of a payment request Fifty Asks sent you or your human (ref FA-P-XXXXXXXX): what it is for, the amount, and whether it is paid. 'paid' only when the money is confirmed.",
          "inputSchema": {
            "properties": {
              "payment_ref": {
                "type": "string"
              }
            },
            "required": ["payment_ref"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:21cac19fe55e5b9ddfb5ac327fcb7b042b2bc10d239132125488a3e6ffcc88f2"
        },
        {
          "name": "get_shop",
          "description": "A local shop that takes visit requests through the Fifty Asks booking widget (its id is in the shop's booking link, fiftyasks.com/b/<id>): name, area, phone, services, and the fields a request needs.",
          "inputSchema": {
            "properties": {
              "shop_id": {
                "type": "string"
              }
            },
            "required": ["shop_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d322e249cfc3b2047d0c730aeb013b1da4bc14fb3839759715b91bb4803b935c"
        },
        {
          "name": "get_visit_request",
          "description": "Current status of a shop visit request by its id (FS-XXXXXXXX).",
          "inputSchema": {
            "properties": {
              "request_id": {
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f3b6c920bd8f839dc2db36ec19892b33ed901c7305305bc65c0992025871f18"
        },
        {
          "name": "list_call_slots",
          "description": "Open times for a free 15-minute phone call with Fifty Asks (Central Time).",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "How many days ahead, 1-14 (default 7)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04f665a51ebec66b2dbfc6c076eca41950f196b9d2eb5dc8bbd01921bf375792"
        },
        {
          "name": "request_visit",
          "description": "Send a shop on the Fifty Asks widget a visit request for your human. It is a request, not a booked appointment: status is 'requested' until the shop confirms a time ('confirmed') or declines.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Job address, or at least ZIP",
                "type": "string"
              },
              "agent_name": {
                "description": "Which agent you are",
                "type": "string"
              },
              "contact_name": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "phone": {
                "description": "The shop confirms by phone or text",
                "type": "string"
              },
              "preferred_times": {
                "description": "e.g. Thursday morning",
                "type": "string"
              },
              "problem": {
                "description": "What needs fixing",
                "type": "string"
              },
              "service": {
                "type": "string"
              },
              "shop_id": {
                "type": "string"
              }
            },
            "required": ["address", "contact_name", "phone", "preferred_times", "problem", "shop_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ddcd1d77b8599f8f9d71728c91fcd89bbd15d812d2ecabb3a84bb1ca7510b0a0"
        },
        {
          "name": "send_message",
          "description": "Send a message to the Fifty Asks team. Agents are welcome; a person reads it and replies by email.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "on_behalf_of": {
                "type": "string"
              },
              "reply_to": {
                "description": "Email for the answer",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e864c74b7994afab361e8aa2e8c5164bb476803c271d48758eed70f35a57b54b"
        },
        {
          "name": "start_payment",
          "description": "Open the checkout page for a payment request (ref FA-P-XXXXXXXX). Returns checkout_url: open it for your human, or pay there with a payment method your human gave you. Nothing is charged until the payer completes that page.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "type": "string"
              },
              "email": {
                "description": "Where the receipt goes",
                "type": "string"
              },
              "payment_ref": {
                "type": "string"
              }
            },
            "required": ["payment_ref"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:847a68f52c2eeffa67c474a9997ce13396de77af716692f46f64ca8b15f0cdaf"
        }
      ],
      "digest": "sha256:6825bbb32ace07992be531e7c51cf77910e20eed6f47fc00226d0876ebd180bb"
    }
  }
}
