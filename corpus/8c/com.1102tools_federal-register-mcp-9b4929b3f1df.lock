        {
          "name": "get_facet_counts",
          "description": "Get document counts grouped by type, agency, topic, or time period.\n\n    Accepts the same filter conditions as search_documents. Returns\n    aggregated counts without individual document results.\n\n    Facets: type, agency, topic (categorical) plus daily, weekly, monthly,\n    quarterly, yearly (publication-date buckets, useful for trend lines).\n\n    Useful for understanding the volume of rulemaking by agency, type, or\n    over time within a date range before drilling into specific documents.\n\n    presidential_document_type (executive_order, proclamation, memorandum,\n    determination, notice, presidential_order, other) narrows to one kind\n    of presidential document, e.g. executive orders per month.\n\n    At least one filter (agencies, doc_types, term, pub_date_gte/lte, or\n    cfr_title) is required. An unfiltered facet query returns the entire\n    all-time aggregate.\n\n    FAR Council counts: facets cannot express \"filed by DoD AND GSA AND\n    NASA\", and no single agency slug covers FAR documents (OFPP only from\n    about mid-2025; 'federal-acquisition-regulation-system' holds 2 documents\n    ever). Count FAR rules with search_documents(far_council=True,\n    doc_types=[...], pub_date_gte/lte=...) and read its count.\n    ",
          "inputSchema": {
            "properties": {
              "agencies": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Agencies"
              },
              "cfr_part": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cfr Part"
              },
              "cfr_title": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cfr Title"
              },
              "doc_types": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["PRORULE", "RULE", "NOTICE", "PRESDOCU"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Doc Types"
