        {
          "name": "get_public_inspection",
          "description": "Get current public inspection documents (pre-publication).\n\n    Public inspection documents are FR documents filed for publication but\n    not yet published. Updated business days only.\n\n    The current-PI endpoint does NOT support server-side filtering. This\n    tool fetches all current PI documents and filters client-side by\n    agency and/or keyword in the title.\n\n    Useful for getting early notice of upcoming regulatory actions.\n\n    Parameters:\n    - agency_filter: case-insensitive substring match against agency slugs,\n      names, and short names. Sub-agencies are included: PI documents list\n      only the FILING sub-agency, so the filter is also matched against the\n      Federal Register agency list and every agency below a matching one\n      counts ('defense-department' or 'DOD' also returns Army, Navy, Air\n      Force, Corps of Engineers and Defense Logistics Agency filings).\n      filters_applied.includes_sub_agencies says whether that worked.\n    - keyword_filter: substring match against document titles\n    - limit: max documents returned after filtering (default 50, max 500).\n      Unfiltered dumps can exceed 170KB; narrow with filters or raise the cap.\n    ",
          "inputSchema": {
            "properties": {
              "agency_filter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Agency Filter"
              },
              "keyword_filter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Keyword Filter"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              }
            },
            "title": "get_public_inspectionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_public_inspectionDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Public Inspection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:150417b92961a351975336ac1b2ea52431be56d15fba52caaf2c335643661aca"
        },
        {
          "name": "list_agencies",
          "description": "List agencies with their IDs, names, slugs, and parent agencies.\n\n    Use the 'slug' values with search_documents() and other tools.\n    Common procurement slugs:\n    - defense-department (DoD)\n    - general-services-administration (GSA)\n    - national-aeronautics-and-space-administration (NASA)\n    - defense-acquisition-regulations-system (DARS/DFARS)\n    - federal-procurement-policy-office (OFPP and the CAS Board)\n    - small-business-administration (SBA)\n    - veterans-affairs-department (VA)\n\n    The FAR has no single slug. FAR rules and notices are filed jointly\n    under DoD, GSA and NASA; OFPP was added only from about mid-2025, so\n    the OFPP slug misses earlier FAR rules. The agency named 'Federal\n    Acquisition Regulation System' (federal-acquisition-regulation-system)\n    holds 2 documents ever; it carries a note in these results. For FAR\n    documents use search_documents(far_council=True) or\n    open_comment_periods(far_council=True).\n\n    Parameters:\n    - query: optional case-insensitive substring match against name, short_name,\n      and slug. Recommended: narrow results before pulling full detail.\n    - include_detail: if False (default), returns only id/name/short_name/slug/parent_id.\n      If True, returns all fields (description, urls, etc.). The full dump is ~700KB.\n    ",
          "inputSchema": {
            "properties": {
              "include_detail": {
                "default": false,
                "title": "Include Detail",
                "type": "boolean"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query"
              }
            },
            "title": "list_agenciesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "list_agenciesDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Agencies"
          },
          "behavior": {
            "destructive": false,
