          },
          "digest": "sha256:037e6a5a45851d75bd2bdec4f2f556a42f12ca2fb6e0f8936df80f77de24973a"
        },
        {
          "name": "get_documents_batch",
          "description": "Fetch multiple documents in one call (up to ~20).\n\n    Pass a list of document numbers to fetch up to about 20 in one call.\n    Always returns {count, results, [errors]}; errors.not_found lists any\n    requested numbers the API could not locate. Results come back in the\n    order requested. Image metadata (images, images_metadata) is left out\n    to keep batches small; get_document returns it.\n    ",
          "inputSchema": {
            "properties": {
              "document_numbers": {
                "items": {
                  "type": "string"
                },
                "title": "Document Numbers",
                "type": "array"
              }
            },
            "required": ["document_numbers"],
            "title": "get_documents_batchArguments",
            "type": "object"
          },
          "outputSchema": {
