        {
          "name": "far_case_history",
          "description": "Get all Federal Register documents for a FAR/DFARS case or FAC.\n\n    Pass a docket ID like 'FAR Case 2023-008' (or a FAC number like\n    'FAC 2025-06'). Runs BOTH a docket-id search and a quoted full-text\n    search, then merges the two result sets (deduped by document number)\n    in chronological order to show the full rulemaking progression:\n    ANPRM -> proposed rule -> final rule -> corrections. The dual query\n    matters: FAC introduction and companion documents often carry only\n    internal docket numbers, so a docket-only search returns a partial set.\n\n    Docket matching is token-based, not substring: 'FAR Case 2023' matches\n    all 2023 cases (token '2023' matches '2023-008'), but a partial token\n    like 'FAR Case 20' matches nothing. Be specific to avoid false positives.\n\n    Each document carries matched_by: 'docket' or 'docket+text' when its\n    docket ids name the case, 'text' when it only mentions the case in its\n    text (regulatory agendas, related or companion cases, FAC\n    introductions, public meetings). Read 'text' matches with care.\n\n    Each underlying search returns at most 100 documents. truncated=True\n    flags that one of the searches hit that cap (docket_matches and\n    term_matches carry the API's full counts); narrow the docket_id if so.\n\n    Minimum docket_id length is 3 characters to prevent token matches that\n    return unrelated documents (e.g. 'x' matched 65 random dockets in 0.1.x).\n    ",
          "inputSchema": {
            "properties": {
              "docket_id": {
                "title": "Docket Id",
                "type": "string"
              }
            },
            "required": ["docket_id"],
            "title": "far_case_historyArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "far_case_historyDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "FAR Case History"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25907d4fa809cbed7a56f356da64e80a2fe8892180ef833a152321c8e0ff3ecb"
        },
        {
          "name": "get_document",
          "description": "Get full details for a single Federal Register document by number.\n\n    Returns all available fields including full text URLs, docket info,\n    RIN details, page views, topics, corrections, and CFR references.\n\n    Document numbers look like '2026-03065' (modern), 'E9-12940' or\n    'X94-70302' (legacy pre-2011 archive), or 'C1-2026-01234' (corrections).\n    ",
          "inputSchema": {
            "properties": {
              "document_number": {
                "title": "Document Number",
                "type": "string"
              }
