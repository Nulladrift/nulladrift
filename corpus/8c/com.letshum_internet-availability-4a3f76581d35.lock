        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Hum answers which home internet providers, plans, speeds and prices are available at a U.S. street address. Call check_availability with the full address, including any apartment or unit. Each call waits for live results; if the status is still checking, call it again with the returned lookup_id in the same turn rather than ending your turn, and if you must answer early, say the results are partial. Describe live-qualified offers as confirmed at the address. Providers reported only in FCC data for the area were not checked at the address: never call them available, unavailable or not qualified there. Never guess an address, unit, answer, price or provider, and use only returned IDs. Start an order only when the customer asks to order: validate_order prepares an exact review without ordering, and create_order needs the customer's explicit approval of that review. After a lost or uncertain create_order response, call get_order instead of resubmitting. Do not collect card data, SSNs, account passwords or payment authorization. Optional reading: https://mcp.letshum.com/skills/check-internet-availability/SKILL.md and https://mcp.letshum.com/skills/order-internet-service/SKILL.md.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check broadband availability",
          "description": "Use this when someone asks what internet service or plans are available at a U.S. street address: providers, speeds and prices. U.S. addresses only; not for outages, speed tests or router troubleshooting. Start with {address}: the full street address, and include the apartment or unit in the address. Continue only with returned IDs: {candidate_id} (plus unit if asked) to pick an address, {lookup_id} to keep checking, or {lookup_id, question_set_id, answers}. Each call waits for live results; while status is checking, call again with lookup_id. Providers reported only in FCC area data were not checked at the address. Select only returned offer_id values.",
