        "title": "Hum Broadband",
        "version": "2.0.1",
        "description": "Discover live-qualified broadband offers, validate exact terms, submit an accountless internet order, and retrieve recorded fulfillment evidence.",
        "websiteUrl": "https://letshum.com"
      },
      "capabilities": {
        "extensions": {
