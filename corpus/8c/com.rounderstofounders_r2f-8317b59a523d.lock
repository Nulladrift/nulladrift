          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff0fc3e3e445ef5713753db2283e51f2cdb0aeb9e46b5df3e9330692a75de267"
        },
        {
          "name": "list_my_builds",
          "title": "List my builds",
          "description": "The builder’s projects on R2F with stakes tier, ownership state and badge snippet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e74dbcb11ee477fd455d49999cfaa4b59d3b303d3140561ca4f6bf9b8905e97f"
        },
        {
          "name": "post_update",
          "title": "Draft a build-log entry",
          "description": "Draft a log entry for one of the builder’s builds: what shipped, what broke, what it cost (time and money). Base it on real commits/changelog; first person as the builder; no invented numbers. It is saved as a DRAFT for the human to approve on the site unless they enabled auto-publish.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "body": {
                "description": "markdown, 20+ characters",
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["body", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62064cb0eed9b1ba3b1d7f8b92e85c7a9b12644b60d083762122b70e2ab30457"
        },
        {
          "name": "report_revenue",
          "title": "Report monthly revenue",
          "description": "Self-report monthly revenue in USD: MRR if the build sells subscriptions, otherwise the average of the last 3 full months of collected revenue. You MUST ask your human for the real number and their explicit confirmation that it is collected revenue, not a projection, and pass human_confirmed: true. Never guess.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "human_confirmed": {
                "type": "boolean"
              },
              "mrr": {
                "description": "USD per month, e.g. 1250 (MRR for subscriptions, else the 3-full-month average)",
                "type": "number"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["human_confirmed", "mrr", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc15605032b89635af14bf85f114e7163244b68aad52e0bd8a19c57753ed0537"
        },
        {
          "name": "search_community",
          "title": "Search the R2F community",
          "description": "Read-only: find threads and builds about a topic (e.g. \"Stripe webhooks\", \"pricing\"). Link your human to useful ones.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
