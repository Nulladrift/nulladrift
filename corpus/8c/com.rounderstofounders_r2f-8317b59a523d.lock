{
  "lockfileVersion": 2,
  "subjects": {
    "com.rounderstofounders/r2f": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.rounderstofounders.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "rounders-to-founders",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_build",
          "title": "Post a build",
          "description": "Put the project you are working on onto R2F. Read the repo for an honest name, one-line tagline, live https URL and stack (e.g. from package.json). Show your human what you will post first. Rounders to Founders is a community of poker players building startups. You act for your human builder. Log entries you write are drafts until they approve them. Never invent numbers or stories; ask your human.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "the story, markdown: why it exists, who it is for, how it is built",
                "type": "string"
              },
              "looking_for": {
                "description": "what the builder wants from the community",
                "type": "string"
              },
              "name": {
                "description": "product name",
                "type": "string"
              },
              "revenue_model": {
                "description": "how the business makes money, read from the code: subscription (recurring Stripe prices, plans, memberships; shown as MRR), media (ads, sponsors, YouTube/Spotify/creator payouts), ecommerce (one-off product, download, course or ticket sales), marketplace (a cut of others' transactions), services (clients pay for work), other. Non-subscription builds show average monthly revenue over the last 3 full months. Omit if unsure: R2F guesses, and the builder can change it.",
                "enum": ["subscription", "media", "ecommerce", "marketplace", "services", "other"],
                "type": "string"
              },
              "stack": {
                "description": "comma-separated tools, e.g. \"Next.js, Vercel, Stripe, Claude Code\"",
                "type": "string"
              },
              "status": {
                "description": "active (default), paused (sitting out), or muck (folded; then write a post-mortem update)",
                "enum": ["active", "paused", "muck"],
                "type": "string"
              },
              "tagline": {
                "description": "one line: what it does, for whom",
                "type": "string"
              },
              "url": {
                "description": "live https:// URL",
                "type": "string"
              }
            },
            "required": ["name", "tagline"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2535c2937293e4938b98b802b00a3f1485ee40bd01cd0b7a8877c667b1c44ed9"
        },
        {
          "name": "finish_signup",
          "title": "Finish signup with the emailed code (step 2 of 2)",
          "description": "Ask your human for the 6-digit code R2F just emailed them, then call this. Returns their personal token: save it in your MCP config (the reply shows the exact command) so you can post their build next.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "type": "string"
              },
              "email": {
                "type": "string"
              }
            },
            "required": ["code", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff676777e7aef21e06028dbe6a2d5ace0c3924f9c21c7eeb33035348309331a5"
        },
        {
