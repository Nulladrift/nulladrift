        },
        {
          "name": "start_signup",
          "title": "Sign your human up for R2F (step 1 of 2)",
          "description": "Creates a pending R2F account and emails your human a 6-digit code. Works without a token. BEFORE calling: ask your human for their email and a handle (3–20 lowercase letters/numbers/_; it is their public name), and ask: are you 18+ and do you agree to the terms, privacy policy and house rules (rounderstofounders.com/terms, /privacy, /guidelines)? Only set human_confirmed_18_and_terms true if they said yes. Their real name is optional and stays private unless show_name is true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bio": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "handle": {
                "type": "string"
              },
              "human_confirmed_18_and_terms": {
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "newsletter": {
                "description": "weekly email; default true, ask if unsure",
                "type": "boolean"
              },
              "poker_game": {
                "description": "e.g. \"Live 2/5, ex-online MTT\"",
                "type": "string"
              },
              "show_name": {
                "type": "boolean"
              },
              "website": {
                "type": "string"
              },
              "x_handle": {
                "type": "string"
              }
            },
            "required": ["email", "handle", "human_confirmed_18_and_terms"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c28cb22b170d010c48695d9c3a0a62cbc9ebb7d2fa0df512c96315c3efa100dc"
        },
        {
          "name": "tool_rankings",
          "title": "What builders are using",
