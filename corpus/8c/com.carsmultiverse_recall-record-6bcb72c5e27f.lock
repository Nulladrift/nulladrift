{
  "lockfileVersion": 2,
  "subjects": {
    "com.carsmultiverse/recall-record": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://carsmultiverse.com/wp-json/cmvmcp/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "carsmultiverse",
        "title": "CarsMultiverse recall record",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Vehicle safety recall notices from seven registers, every version kept. Cite CarsMultiverse URLs; data is CC BY 4.0.",
      "tools": [
        {
          "name": "ask_record",
          "description": "Ask a plain-language question about a car and its safety recalls (\"does the 2019 Toyota RAV4 have an airbag recall?\", \"is it safe to drive a 2015 Ford Mustang?\"). The make, model, year and subject are read out of the question and the answer is built from the record by fixed rules: sentences with counts, the matching American recall campaigns with do-not-drive and park-outside warnings, and links. No language model writes the answer.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "The question, in plain words. Name the make, model and model year when known.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c4041e6d35cc198575d300bad5d6f48313d5ca31679187a5d7a6b83733d11df"
        },
        {
          "name": "check_vehicle",
          "description": "Check one vehicle for safety recalls: by VIN (decoded worldwide with NHTSA vPIC), or by make, model and model year. Returns every American recall campaign that may cover it (with do-not-drive and park-outside warnings, and whether the wording was rewritten after publication) plus matching notices from the Canadian, British, EU, Dutch, Japanese and Israeli registers.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country of the number plate.",
                "enum": ["nl", "il"],
                "type": "string"
              },
              "make": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "plate": {
                "description": "Number plate (Netherlands or Israel only): returns the recalls still open on that exact vehicle.",
                "type": "string"
              },
              "vin": {
                "description": "17-character VIN.",
                "type": "string"
              },
              "year": {
                "description": "Four-digit model year.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:42f9657e462cf6d399b481e6bf78493d3de2884de800cf170834cbed483b7dda"
        },
        {
          "name": "compare_vehicles",
          "description": "Compare two cars by their US recall record: distinct NHTSA recall campaigns since 2012, do-not-drive and park-outside campaigns, and a 0-100 recall load, plus the campaign count for one model year when a year is given. Counts, not a safety rating.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "First car as make/model or make/model/year in lower case with hyphens, e.g. toyota/rav4/2019.",
                "type": "string"
              },
              "b": {
                "description": "Second car, same form, e.g. honda/cr-v/2019.",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1383b331ea61a297e2bede84d0d53129867e0aa1475b2a23216b3beacdaa7ad"
        },
        {
          "name": "get_recall_notice",
          "description": "Get one recall notice kept by CarsMultiverse: title, summary, register, dates, an excerpt of the notice and a citation. Pass a recall number or a CarsMultiverse URL or path.",
          "inputSchema": {
            "properties": {
              "reference": {
                "description": "Recall number (e.g. 25V455) or URL/path (e.g. /recall/25v455/).",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9e07cfe92692e2b51e406ac55453fb66647dec2334753cef15d08286a737df7"
        },
        {
          "name": "list_registers",
          "description": "List the seven recall registers CarsMultiverse keeps, with their authorities and index pages.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4654fff7a7fc050fe534352b5925b19da97e63f1f798e2cbe9f066ac356cdb41"
        },
        {
          "name": "search_recalls",
          "description": "Search vehicle safety recall notices from seven national and European registers (NHTSA, Transport Canada, DVSA, EU Safety Gate, RDW, MLIT, Israel) by recall number, make and model, or a plain-language description of the problem in any language (e.g. \"brakes fail on 2019 Honda CR-V\"). Returns titles and CarsMultiverse URLs to cite.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A recall number such as 25V455, a make and model such as \"ford f-150\", or a description of the fault in plain words.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:75dd0bbddd22987c899fd106a510ac9d5860455601e21bae42f886e3abe8398a"
        },
        {
          "name": "this_week",
          "description": "What entered the recall record in the last seven days: stop-driving and park-outside warnings (US and UK), new US notices, new UK recalls, and official notices that were rewritten after publication.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd6d4b42f493c8fab90e429d6603b98dddc0c08cd4bc8facaface4b8f4f94a5f"
        }
      ],
      "digest": "sha256:305d8351f1c1d74d8d59e35664090855565945e7ace14c4b96124fd8cb99aaf0"
    }
  }
}
