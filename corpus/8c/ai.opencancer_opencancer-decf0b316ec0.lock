{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencancer/opencancer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencancer.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "opencancer",
        "title": "OpenCancer",
        "version": "2.0.0",
        "websiteUrl": "https://opencancer.ai/connectors"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OpenCancer is a cancer patient expert: plain-language, guideline-grounded education for patients and caregivers, recruiting clinical trials, and a path to a human expert review. Scope: cancer only; educational information, not a diagnosis or a treatment decision. Every answer includes its sources, any safety guidance, a disclaimer, and a link to OpenCancer's care team.",
      "tools": [
        {
          "name": "ask_opencancer",
          "title": "Ask OpenCancer",
          "description": "Answers a cancer patient or caregiver question in plain language, grounded in NCCN Guidelines for Patients and medical literature. Covers what a diagnosis, stage, biomarker or test result means; treatment options; side effects and their management; questions for the oncologist; second opinions; living with cancer. Answers in the language of the question. Returns the answer, its sources, a disclaimer, a link to OpenCancer's care team, and an answer id. Emergencies, prognosis or life-expectancy questions, and questions about children return a safety message that routes to the care team instead of an answer. Educational information, not medical advice. Accepts no personal identifiers",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cancer_type": {
                "description": "Optional cancer type, to focus the guidelines used, e.g. \"colon cancer\".",
                "maxLength": 160,
                "type": "string"
              },
              "context": {
                "description": "Optional general context such as stage or treatments tried, e.g. \"stage 3, finished FOLFOX\". No identifiers.",
                "maxLength": 500,
                "type": "string"
              },
              "question": {
                "description": "The question in plain language, in the user's language, without personal identifiers.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "type": "string"
              },
              "answer_id": {
                "type": ["string", "null"]
              },
              "care_team_url": {
                "type": "string"
              },
              "disclaimer": {
                "type": "string"
              },
              "grounding": {
                "properties": {
                  "basis": {
                    "type": "string"
                  },
                  "guidelines": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "retrieved": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "needs_human_review": {
                "type": "boolean"
              },
              "review_status": {
                "enum": ["ai_only", "expert_reviewed"],
                "type": "string"
              },
              "sources": {
                "items": {
                  "properties": {
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["answer", "answer_id", "care_team_url", "disclaimer", "needs_human_review", "review_status", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask OpenCancer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6071133ee71f2edcc90d84b7dc98085894aae0d958bc913b9e0be7aceb26d31b"
        },
        {
          "name": "find_clinical_trials",
          "title": "Find recruiting clinical trials",
          "description": "Lists clinical trials recruiting now for a cancer type, from ClinicalTrials.gov, optionally near a city, state or country and filtered by a biomarker, drug or treatment keyword and by phase. Returns up to 8 trials with NCT number, phase, sponsor, the sites closest to the requested place, a registry link, a link to the full search, and a link to an OpenCancer expert who can build a trial shortlist for a specific case. Listing a trial is not an eligibility decision; only the trial team can confirm eligibility",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "condition": {
                "description": "Cancer type or condition, e.g. \"pancreatic cancer\".",
                "maxLength": 160,
                "type": "string"
              },
              "keyword": {
                "description": "Optional biomarker, drug, or treatment, e.g. \"KRAS G12C\" or \"CAR-T\".",
                "maxLength": 120,
                "type": "string"
              },
              "location": {
                "description": "Optional city, state, or country, e.g. \"Boston\" or \"Germany\" (city level, not a street address).",
                "maxLength": 120,
                "type": "string"
              },
              "phase": {
                "description": "Optional trial phase.",
                "enum": ["1", "2", "3", "4"],
                "type": "string"
              }
            },
            "required": ["condition"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "expert_help_url": {
                "type": "string"
              },
              "search_url": {
                "type": "string"
              },
              "total": {
                "type": "number"
              },
              "trials": {
                "items": {
                  "properties": {
                    "nct_id": {
                      "type": "string"
                    },
                    "phase": {
                      "type": "string"
                    },
                    "sites": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "sponsor": {
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["nct_id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["expert_help_url", "search_url", "total", "trials"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find recruiting clinical trials"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2a8f84b693a9ce9ec8e1da82d6f2186334a65ed38d00d904a4cfe92036f63c52"
        },
        {
          "name": "get_trial_details",
          "title": "Get clinical trial details",
          "description": "Returns one clinical trial from ClinicalTrials.gov by its NCT number: what it tests, phase, status, last registry update, ages, the inclusion and exclusion criteria in their original wording, recruiting sites with their status, study contacts, and the registry link. Eligibility is confirmed only by the study team",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nct_id": {
                "description": "ClinicalTrials.gov ID, e.g. \"NCT05902169\".",
                "pattern": "^NCT[0-9]{8}$",
                "type": "string"
              }
            },
            "required": ["nct_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ages": {
                "type": "string"
              },
              "conditions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "contacts": {
                "items": {
                  "properties": {
                    "email": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "phone": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "exclusion_criteria": {
                "type": "string"
              },
              "expert_help_url": {
                "type": "string"
              },
              "inclusion_criteria": {
                "type": "string"
              },
              "interventions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "last_updated": {
                "type": "string"
              },
              "nct_id": {
                "type": "string"
              },
              "official_title": {
                "type": "string"
              },
              "phase": {
                "type": "string"
              },
              "sex": {
                "type": "string"
              },
              "site_count": {
                "type": "number"
              },
              "sites": {
                "items": {
                  "properties": {
                    "site": {
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    }
                  },
                  "required": ["site"],
                  "type": "object"
                },
                "type": "array"
              },
              "sponsor": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["expert_help_url", "nct_id", "status", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get clinical trial details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:21370ee74a1a0b9837c11b37ae30a5d373bb7ede34e071bb72f1ec8f561c3520"
        },
        {
          "name": "open_case",
          "title": "Get the expert review link",
          "description": "Returns a link where a patient can start an expert review of their case by OpenCancer and Cancer Commons scientists (records, options, trial shortlist, next step). The link only opens an intake page: no case is created and no records are sent. The patient enters their own details and personally confirms consent on that page. Accepts no names, contact details or records.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cancer_type": {
                "description": "Optional cancer type, e.g. \"prostate cancer\".",
                "maxLength": 160,
                "type": "string"
              },
              "preferred_destinations": {
                "items": {
                  "enum": ["cancer_commons", "vivantx", "palitra"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "question": {
                "description": "Optional: what the patient wants experts to look at, without personal identifiers.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available_intake_destinations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "case_created": {
                "type": "boolean"
              },
              "consent_required": {
                "type": "boolean"
              },
              "intake_url": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "preferred_destinations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["case_created", "consent_required", "intake_url", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the expert review link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b95e8c1f0b8c9190a3bdfe73212124f0e8b046dff1ced2268acb8f1343ac00d6"
        },
        {
          "name": "send_feedback",
          "title": "Flag an answer or send feedback",
          "description": "Flags an OpenCancer answer for human expert review, or sends feedback to the OpenCancer team. Used when the user says an OpenCancer answer was wrong, unsafe, or incomplete, or wants to tell OpenCancer something (answer_id identifies the answer; message holds the user's words). Also used to report that an OpenCancer tool returned no usable answer (kind \"missing_answer\" with answer_id or tool, no message). Feedback is read by the OpenCancer team; it is not an urgent-care channel and no reply is sent through it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer_id": {
                "description": "Optional. The answer id from an OpenCancer answer.",
                "maxLength": 64,
                "type": "string"
              },
              "kind": {
                "description": "wrong_or_unsafe, missing_answer, bug, idea, or praise.",
                "enum": ["wrong_or_unsafe", "missing_answer", "bug", "idea", "praise"],
                "type": "string"
              },
              "message": {
                "description": "Optional. The user's feedback in their own words. Contact details are not accepted.",
                "maxLength": 500,
                "type": "string"
              },
              "tool": {
                "description": "Optional. Which OpenCancer tool this is about.",
                "enum": ["ask_opencancer", "find_clinical_trials", "get_trial_details", "open_case"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "duplicate": {
                "type": "boolean"
              },
              "in_review_queue": {
                "type": "boolean"
              },
              "saved": {
                "type": "boolean"
              }
            },
            "required": ["in_review_queue", "saved"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Flag an answer or send feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fde0308e5392ebdca4a137d258938ccf96e1b2bb438a320d37171a0ee1dfa4f2"
        }
      ],
      "digest": "sha256:34d27ec523102041d35aff0953b5770c5c7eeefda8d5234abf838b5efc067629"
    }
  }
}
