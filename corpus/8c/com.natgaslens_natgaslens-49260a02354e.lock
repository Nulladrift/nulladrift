      "instructions": "US natural gas (Henry Hub) fundamentals as clean, LLM-ready data — LNG feedgas nowcast, liquefaction plant outages, EIA weekly storage, dry gas production, GFS/ECMWF/CPC degree-day forecasts, the Henry Hub forward curve, CFTC positioning, a news feed with per-story impact reads, a composite fundamental score, and a one-call summary of which way every fundamental is pressing. Start with get_us_natural_gas_market_brief: it returns the whole picture — pressure by factor, demand with its components, storage, production, the forward curve, positioning — in a single call, along with the rules for reading those numbers; reach for the individual tools when you need a history or a series. Market data and analysis, NOT investment advice: every model output carries a measured margin of error and guarantees no profit. Each estimate ships with its vintage and its accuracy so it can be weighed. Without a valid access token tools return delayed (demo) data plus an 'upgrade' object naming what a token unlocks and where the user gets one (https://t.me/NatGasLens_bot?start=mcp; paid subscription — but through 2026-09-30 the dashboard is open in full, no subscription needed). An agent cannot buy the token itself — surface that link to its user.",
