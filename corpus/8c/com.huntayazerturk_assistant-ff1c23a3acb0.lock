      "serverInfo": {
        "name": "huntayazerturk",
        "title": "Huntay AzerTürk",
        "version": "1.1.0",
        "description": "Check Huntay AzerTürk's availability and book a 30-minute intro video call, and look up his consulting services, case studies and FAQ.",
        "websiteUrl": "https://huntayazerturk.com/assistant",
        "icons": [
          {
            "src": "https://huntayazerturk.com/icons/huntay-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://huntayazerturk.com/icons/huntay-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for Huntay AzerTürk's software and AI consulting practice (https://huntayazerturk.com): his services, case studies, FAQ and profile, and his live booking calendar for a 30-minute intro call.\n- Scheduling: call get_availability (pass the user's IANA time zone if known), let the user choose a time, collect their name and email, confirm the details with the user, then call book_intro_call. Do not book without the user's explicit confirmation.\n- Information: list_services (optionally with the user's need), get_service, get_profile, and search + fetch for case studies, FAQ, experience and articles.\n- Set language to \"tr\" when the user writes in Turkish.",
      "tools": [
        {
          "name": "book_intro_call",
          "title": "Book intro call",
          "description": "Books a 30-minute intro video call (Google Meet) with Huntay AzerTürk at a slot returned by get_availability, using the attendee's name and email; Cal.com emails the calendar invitation. Call only after the user has confirmed the slot and their details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Attendee's email address; the invitation is sent here.",
                "maxLength": 254,
                "minLength": 5,
                "type": "string"
              },
              "language": {
                "description": "Response language: \"tr\" for Turkish, otherwise \"en\".",
                "enum": ["en", "tr"],
                "type": "string"
              },
              "name": {
                "description": "Attendee's full name.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "notes": {
                "description": "Optional topic of the call (company, project, goals).",
                "maxLength": 1000,
                "type": "string"
              },
              "start": {
                "description": "Slot start from get_availability: \"YYYY-MM-DDTHH:MM\" in timeZone (ISO 8601 with offset also accepted).",
                "maxLength": 40,
                "type": "string"
              },
              "timeZone": {
                "description": "IANA time zone of start and of the attendee. Defaults to Europe/Istanbul.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["email", "name", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book intro call"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Call booked",
            "openai/toolInvocation/invoking": "Booking the call…",
            "ui": {
              "resourceUri": "ui://huntayazerturk/assistant-v2.html"
            },
            "ui/resourceUri": "ui://huntayazerturk/assistant-v2.html"
          },
          "digest": "sha256:7b5a377c8b278cea2d5c46bb81da6d8183edaf476afb28f4cc05ccbf320c1a0c"
        },
        {
