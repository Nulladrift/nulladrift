          "digest": "sha256:832eab6ab279fada5e6468a5d2e34793dfe30e359d476cc00236d5879d2d08d9"
        },
        {
          "name": "get_availability",
          "title": "Check availability",
          "description": "Returns Huntay AzerTürk's open slots for a 30-minute intro video call (Google Meet), read live from his booking calendar (Monday–Friday, 10:00–18:00 Istanbul time). Use when the user wants to schedule a call with Huntay AzerTürk.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Number of days to search (default 7, max 30).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "First day to search, YYYY-MM-DD. Defaults to today.",
                "maxLength": 10,
                "type": "string"
              },
              "language": {
                "description": "Response language: \"tr\" for Turkish, otherwise \"en\".",
                "enum": ["en", "tr"],
                "type": "string"
              },
              "timeZone": {
                "description": "The user's IANA time zone, e.g. \"Europe/Berlin\". Defaults to Europe/Istanbul.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
