      "instructions": "LyricsMove (https://lyricsmove.com) turns an MP3, audio file, video, or Suno link into auto-timed lyric videos (free 720p in browser, no signup) and 8–32 scene AI music videos across 11 visual styles ($9.90 flat per MV, no subscription required). Use list_lyric_styles_and_tools, list_ai_mv_styles, recommend_video_setup, and get_pricing_and_limits to match styles/pricing and return the direct browser URL so the user can upload or paste a Suno link right in their browser.",
      "tools": [
        {
          "name": "get_pricing_and_limits",
          "title": "Get LyricsMove free tier, one-time pricing, plans and file limits",
          "description": "Get exact pricing (free 720p lyric videos with no signup, $3.90 per 1080p song, $9.90 per 8–32 scene AI music video, starter pack, Pro and Ultra plans), audio/video upload limits, and retention policy.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
