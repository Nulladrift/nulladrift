        {
          "name": "recommend_video_setup",
          "title": "Recommend lyric style, AI MV look and direct page URL",
          "description": "Given a song genre, mood or workflow goal (lyric video, AI music video, Suno URL, or audio/subtitle conversion), recommend the best LyricsMove visual style(s) and return the direct browser URL.",
          "inputSchema": {
            "properties": {
              "goal": {
                "description": "Primary user goal.",
                "enum": ["lyric_video", "ai_mv", "subtitles_or_audio_tool"],
                "type": "string"
              },
              "has_photo": {
                "description": "True if the user has a photo of themselves or a pet to turn into the lead character.",
                "type": "boolean"
              },
              "has_suno_link": {
                "description": "True if the user wants to paste a Suno song URL.",
                "type": "boolean"
              },
              "language": {
                "description": "Preferred landing page language (\"en\" or \"ja\").",
                "enum": ["en", "ja"],
                "type": "string"
              },
              "mood_or_genre": {
                "description": "Song vibe, genre or concept (e.g. \"rainy late-night synthwave\", \"upbeat cozy folk with my dog\", \"utattemita vocaloid cover\").",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["mood_or_genre"],
            "type": "object"
