          "name": "list_lyric_styles_and_tools",
          "title": "List lyric video styles, visualizer options and free audio tools",
          "description": "List all animated lyric text styles (free 720p vs 1080p Pro), themes, background counts (including MP3/Suno auto cover art and 21 video loops), 24-band audio visualizer modes, output formats (16:9 / 9:16), and the 4 free browser audio/subtitle tools on LyricsMove.",
