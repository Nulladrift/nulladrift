        },
        {
          "name": "list_ai_mv_styles",
          "title": "List all 11 AI music video visual styles and samples",
          "description": "List all 11 selectable AI music video visual styles on LyricsMove (Cinema V2: 8–32 beat-snapped story scenes, up to 10 animated clips, consistent recurring characters from lyrics or a user photo) with mood guidance, YouTube showcase links, and studio URL.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Optional genre, mood or keyword filter (e.g. \"anime\", \"noir\", \"clay\", \"folk\", \"rock\", \"synthwave\").",
